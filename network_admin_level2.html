0240825",43]],"x":["Hyper-V는 저장소 실시간 마이그레이션으로 실행 중인 VM의 가상 하드디스크를 다른 저장소로 옮길 수 있다.","Hyper-V 복제본으로 VM을 다른 서버에 복제할 수 있다.","실행 중에도 가상 디스크를 다른 저장소로 옮길 수 있다.","하나의 서버에서 여러 VM을 실행할 수 있다.","VM을 많이 쓸수록 물리 서버 자원 사용률은 높아진다."]},{"id":"20240825-44","s":3,"q":"Linux를 설치 가이드에 따라 별도의 설정 없이 기본설치를실시한 후, 디스크 및 파티션 정보를 확인해보니 '/' 디렉터리가 '/dev/sda5' 에 설치되었다. '/dev/sda5' 의 해석으로 옳지 않은 것은?","o":["SATA 인터페이스로 연결된 디스크를 사용한다.","디스크의 다섯 번째 파티션에 설치되었다.","Hardware 장치를 파일 형식으로 나타낸다.","다섯 번째 연결된 물리 디스크에 설치되었다."],"a":3,"im":[],"src":[["20240825",44]],"x":["/dev/sda5에서 sd는 SCSI/SATA 디스크, a는 첫 번째 디스크, 5는 다섯 번째 파티션(논리 파티션 시작 번호)이다. '다섯 번째 물리 디스크'가 아니다.","sd는 SATA/SCSI 계열 디스크를 뜻한다.","5는 그 디스크의 다섯 번째 파티션 번호다.","리눅스는 장치를 /dev 아래 파일로 표현한다.","a가 첫 번째 디스크이므로 다섯 번째 디스크라는 설명은 틀렸다."]},{"id":"20240825-45","s":3,"q":"Linux에서 명령어 'mv -i file1 file2'의 의미는?","o":["파일이 지워지기 전에 백업파일을 만든다.","'file2'가 존재 하더라도 강제로 삭제한다.","'file2'가 존재할 경우 덮어 쓸 것인가를 물어본다.","파일 옮기기 전의 과정을 보여준다."],"a":2,"im":[],"src":[["20240825",45]],"x":["mv -i(interactive)는 대상 파일이 이미 있으면 덮어쓸지 물어본다.","백업 파일을 만드는 것은 -b 옵션이다.","강제로 덮어쓰는 것은 -f 옵션이다.","-i는 덮어쓰기 전에 확인을 묻는다.","진행 과정을 보여 주는 것은 -v 옵션이다."]},{"id":"20240825-46","s":4,"q":"전송 매체의 특성 중 Fiber Optics에 해당하는 것은?","o":["여러 라인의 묶음으로 사용하면 간섭 현상을 줄일 수 있다.","신호 손실이 적고, 전자기적 간섭이 없다.","송수신에 사용되는 구리 핀은 8개 중 4개만 사용한다.","수 Km이상 전송 시 Repeater를 반드시 사용해야 한다."],"a":1,"im":[],"src":[["20240825",46]],"x":["광섬유는 빛을 쓰므로 신호 손실이 적고 전자기 간섭(EMI)을 받지 않는다.","여러 선을 꼬아 간섭을 줄이는 것은 트위스트 페어의 특징이다.","광섬유는 신호 손실이 적고 전자기 간섭이 없다.","8핀 중 4핀 사용은 UTP(100BASE-TX)의 특징이다.","광섬유는 수십 km까지 리피터 없이 전송할 수 있다."]},{"id":"20240825-47","s":4,"q":"RAID의 특징으로 옳지 않은 것은?","o":["여러 개의 Disk에 일부 중복된 데이터를 나누어 저장","read/write 속도를 증가","Memory 용량 증가","데이터를 안전하게 백업"],"a":2,"im":[],"src":[["20240825",47]],"x":["RAID는 디스크(저장 장치) 구성 기술이다. 메모리(RAM) 용량을 늘리지 않는다.","RAID 1/5 등은 데이터를 중복·분산 저장한다.","스트라이핑으로 읽기·쓰기 속도를 높인다.","RAID는 메모리 용량과 관계없으므로 틀린 설명이다.","중복 저장으로 장애 시 데이터를 보호한다."]},{"id":"20240825-49","s":4,"q":"로드밸런서(Load Balancer)가 사전에 설정한 분산 알고리즘을 통해 부하분산이 이루어지는데, 부하분산 방식 중 특별한 규칙 없이 현재 구성된 장비에 순차적으로 돌아가면서 트래픽을 분산하는 방식은?","o":["Least Connection","Round Robin","Weighted Round Robin","Weighted Least Connection"],"a":1,"im":[],"src":[["20240825",49],["20260201",47]],"x":["특별한 규칙 없이 서버에 차례대로 돌아가며 요청을 나누는 방식은 라운드 로빈이다.","Least Connection은 연결 수가 가장 적은 서버로 보낸다.","라운드 로빈은 순서대로 돌아가며 분산한다.","Weighted Round Robin은 서버 성능에 따른 가중치만큼 더 많이 배분한다.","Weighted Least Connection은 가중치와 연결 수를 함께 고려한다."]},{"id":"20240825-50","s":4,"q":"L2 스위치에서 프레임을 전송 시 목적지의 어떤 주소를 확인 후 전송하는가?","o":["IP 주소","Port 주소","MAC 주소","URL 주소"],"a":2,"im":[],"src":[["20240825",50],["20250223",46],["20260201",46]],"x":["L2 스위치는 프레임의 목적지 MAC 주소를 MAC 주소 테이블과 비교해 해당 포트로 보낸다.","IP 주소는 L3 장비가 본다.","포트 번호는 L4 장비가 본다.","L2 스위치는 목적지 MAC 주소를 확인한다.","URL은 L7 장비가 본다."]},{"id":"20241103-01","s":1,"q":"TCP/IP에서 데이터 링크층의 데이터 단위는?","o":["메시지","세그먼트","데이터그램","프레임"],"a":3,"im":[],"src":[["20241103",1],["20260517",1]],"x":["데이터 링크 계층의 데이터 단위(PDU)는 프레임이다.","메시지는 응용 계층의 데이터 단위다.","세그먼트는 전송 계층(TCP) 단위다.","데이터그램은 IP(인터넷 계층)·UDP의 단위로 쓰인다.","프레임이 데이터 링크 계층 단위다."]},{"id":"20241103-02","s":1,"q":"IP Address '11101011.10001111.11111100.11001111' 가속한 Class는?","o":["A Class","B Class","C Class","D Class"],"a":3,"im":[],"src":[["20241103",2]],"x":["첫 옥텟 11101011(2) = 235다. 224~239 범위라 D Class다(앞 4비트 1110도 D Class 표시).","A Class는 첫 비트가 0(1~126)이다.","B Class는 앞 2비트가 10(128~191)이다.","C Class는 앞 3비트가 110(192~223)이다.","앞 4비트 1110, 값 235로 D Class다."]},{"id":"20241103-03","s":1,"q":"IPv6 헤더 형식에서, 네트워크 내에서 혼잡 상황이 발생되어데이터그램을 버려야 하는 경우 참조되는 필드는?","o":["Version","Priority","Next Header","Hop Limit"],"a":1,"im":[],"src":[["20241103",3]],"x":["IPv6의 Priority(Traffic Class) 필드는 패킷 우선순위를 나타내 혼잡 시 어떤 패킷을 먼저 버릴지 판단하는 데 쓰인다.","Version은 IP 버전이다.","Priority로 혼잡 시 폐기 우선순위를 정한다.","Next Header는 다음 헤더 종류다.","Hop Limit은 생존 홉 수다."]},{"id":"20241103-04","s":1,"q":"IP 패킷은 네트워크 유형에 따라 전송량에 차이가 나기 때문에 적당한 크기로 분할하게 된다. 이때 기준이 되는 것은?","o":["TOS(Tape Operation System)","MTU(Maximum Transmission Unit)","TTL(Time-To-Live)","Port Number"],"a":1,"im":[],"src":[["20241103",4],["20260802",4]],"x":["네트워크가 한 번에 보낼 수 있는 최대 크기인 MTU를 넘으면 IP 패킷을 분할(단편화)한다.","TOS는 Type of Service(서비스 유형)이며 보기의 풀이도 틀렸다.","MTU가 단편화 기준이다.","TTL은 패킷 생존 홉 수다.","포트 번호는 전송 계층의 프로세스 식별자다."]},{"id":"20241103-05","s":1,"q":"TCP 헤더 중에서 에러 제어를 위한 필드는?","o":["Offset","Checksum","Source Port","Sequence Number"],"a":1,"im":[],"src":[["20241103",5]],"x":["TCP 헤더의 Checksum으로 헤더와 데이터의 오류를 검사한다.","Offset(Data Offset)은 TCP 헤더 길이다.","Checksum이 오류 검출 필드다.","Source Port는 송신 포트 번호다.","Sequence Number는 순서 제어에 쓰인다(재전송에도 관련되지만 오류 검출 필드는 체크섬)."]},{"id":"20241103-06","s":1,"q":"ICMP 메시지 내용으로 옳지 않은 것은?","o":["호스트의 IP Address가 중복된 경우","목적지까지 데이터를 보낼 수 없는 경우","데이터의 TTL 필드 값이 '0'이 되어 데이터를 삭제 할 경우","데이터의 헤더 값에 오류를 발견한 경우"],"a":0,"im":[],"src":[["20241103",6]],"x":["IP 주소 중복은 ARP(Gratuitous ARP)로 감지한다. ICMP 메시지 내용이 아니다.","IP 중복은 ICMP가 알려 주는 상황이 아니다.","목적지 도달 불가(타입 3)는 ICMP 메시지다.","TTL이 0이 되면 시간 초과(타입 11)를 보낸다.","헤더 오류는 파라미터 문제(타입 12)로 알린다."]},{"id":"20241103-08","s":1,"q":"TCP/IP에서 Unicast의 의미는?","o":["메시지가 한 호스트에서 다른 여러 호스트로 전송되는 패킷","메시지가 한 호스트에서 다른 한 호스트로 전송되는 패킷","메시지가 한 호스트에서 망상의 다른 모든 호스트로 전송되는 패킷","메시지가 한 호스트에서 망상의 특정 그룹 호스트들로 전송되는 패킷"],"a":1,"im":[],"src":[["20241103",8],["20250824",9],["20260517",8]],"x":["유니캐스트는 한 호스트가 다른 한 호스트로 보내는 1:1 전송이다.","여러 호스트로 보내는 것은 멀티캐스트에 가깝다.","한 호스트 → 한 호스트가 유니캐스트다.","망의 모든 호스트로 보내는 것은 브로드캐스트다.","특정 그룹 호스트로 보내는 것은 멀티캐스트다."]},{"id":"20241103-09","s":1,"q":"IP Address '127.0.0.1' 이 의미하는 것은?","o":["모든 네트워크를 의미한다.","사설 IP Address를 의미한다.","특정한 네트워크의 모든 노드를 의미한다.","루프 백 테스트용이다."],"a":3,"im":[],"src":[["20241103",9]],"x":["127.0.0.1은 자기 자신을 가리키는 루프백 주소로 TCP/IP 스택 테스트에 쓴다.","모든 네트워크는 0.0.0.0(기본 경로)으로 나타낸다.","사설 IP는 10/8, 172.16/12, 192.168/16이다.","특정 네트워크의 모든 노드는 그 네트워크의 브로드캐스트 주소다.","127.0.0.1은 루프백 테스트용이다."]},{"id":"20241103-10","s":1,"q":"TCP 3-Way Handshaking 연결 수립 절차의 1, 2, 3단계중 3단계에서 사용되는 TCP 제어 Flag는?","o":["SYN","RST","SYN, ACK","ACK"],"a":3,"im":[],"src":[["20241103",10],["20260802",11]],"x":["3-way handshake 3단계에서는 클라이언트가 ACK를 보내 연결을 확정한다.","SYN은 1단계다.","RST는 강제 종료다.","SYN+ACK는 2단계다.","3단계는 ACK다."]},{"id":"20241103-11","s":1,"q":"네트워크를 관리하는 Kim 사원은 스위치에 원격접속 시Telnet을 이용하여 작업을 주로 진행하였지만, 신규로 도입되는 스위치에는 SSH로 접속 방법을 교체하고자 한다. 다음 중 SSH의 특징으로 옳지 않은 것은?","o":["Telnet에 비하여 보안성이 뛰어나다.","SSH-1은 RSA 암호화를 사용한다.","SSH-2는 RSA 외 더 다양한 키교환방식을 지원한다.","TCP/23번을 이용한다."],"a":3,"im":[],"src":[["20241103",11]],"x":["SSH는 TCP 22번을 쓴다. 23번은 Telnet이다.","암호화로 Telnet보다 보안성이 뛰어나다.","SSH-1은 RSA 기반이다.","SSH-2는 Diffie-Hellman 등 다양한 키 교환을 지원한다.","TCP 23은 Telnet 포트라 틀린 설명이다."]},{"id":"20241103-12","s":1,"q":"네트워크 및 서버 관리자 Kim은 불법적으로 443 포트를 이용하여 52.139.250.253번 IP에서 관리자 Kim의 업무PC에 원격으로 접속시도가 이뤄진 흔적을 발견하게 되었다. 이 사항을 발견하기 위해서 (A)에 들어가야 할 명령어는?(단, Windows 계열의 명령프롬프트(cmd)에서 실행하였다.)","o":["ping","tracert","netstat –an","nslookup"],"a":2,"im":[65],"src":[["20241103",12]],"x":["그림처럼 로컬·외부 주소와 포트, ESTABLISHED/LISTENING 상태가 나오는 것은 netstat -an 결과다. 외부 52.139.250.253:443과 연결된 흔적을 찾을 수 있다.","ping은 응답 시간만 보여 준다.","tracert는 경로를 보여 준다.","netstat -an은 모든 연결과 포트를 숫자로 보여 준다.","nslookup은 DNS 조회 도구다."]},{"id":"20241103-13","s":1,"q":"TCP/IP protocol stack에서 사용되는 SNMP 프로토콜의 기능으로 가장 올바른 것은?","o":["대규모 환경의 망 관리 기능","네트워크 장비의 에러 보고 기능","네트워크 장비의 관리 및 감시 기능","호스트 간의 연결성 점검과 네트워크 혼잡 제어 기능"],"a":2,"im":[],"src":[["20241103",13]],"x":["SNMP는 네트워크 장비를 관리하고 상태를 감시하는 프로토콜이다.","대규모 망 관리는 SNMP를 정확히 정의한 표현이 아니다.","에러 보고는 ICMP의 기능이다.","SNMP는 장비 관리·감시 기능을 한다.","연결성 점검·혼잡 제어는 ICMP 관련 기능이다."]},{"id":"20241103-14","s":1,"q":"HTTP와 HTTPS의 차이점에 대한 설명으로 올바른 것은?","o":["HTTP를 사용하면 데이터가 안전하게 전송되며, 사용자의 개인 정보를 보호할 수 있다.","HTTP는 보안을 위해 '디지털 인증서'를 사용한다.","HTTP는 기본적으로 포트 번호 '80'을 사용하며, HTTPS는 포트 번호 '443'을 사용한다.","HTTP는 웹 사이트의 신원을 검증하기 위해 'SSL/TLS'를 사용한다."],"a":2,"im":[],"src":[["20241103",14]],"x":["HTTP 기본 포트는 80, HTTPS 기본 포트는 443이다.","HTTP는 평문이라 안전하지 않다.","디지털 인증서는 HTTPS가 쓴다.","HTTP 80, HTTPS 443이 맞다.","SSL/TLS로 신원을 검증하는 것은 HTTPS다."]},{"id":"20241103-15","s":1,"q":"다음 중 아래 지문에 따라 서브네팅할 경우 서브넷 마스크(subnet mask)로 옳은 것은?","o":["255.255.255.128","255.255.255.192","255.255.255.224","255.255.255.240"],"a":1,"im":[66],"src":[["20241103",15],["20260201",3]],"x":["서브넷마다 호스트 60개가 필요하면 2^6 - 2 = 62 ≥ 60이므로 호스트 비트 6개, /26 = 255.255.255.192다.","/25(.128)은 호스트 126개로 서브넷 수가 2개뿐이다.","/26(.192)은 서브넷당 62개 호스트로 60개 조건을 만족한다.","/27(.224)은 30개라 부족하다.","/28(.240)은 14개라 부족하다."]},{"id":"20241103-16","s":1,"q":"다음 (A) 안에 들어가는 용어 중 옳은 것은?","o":["FTP(file Transfer Protocol)","SFTP(SSH File Transfer Protocol)","FRPS(FTP Secure)","CMD"],"a":0,"im":[67],"src":[["20241103",16]],"x":["명령 채널 21번, 데이터 채널 20번을 쓰고 암호화를 제공하지 않는 프로토콜은 FTP다.","FTP는 21(제어)/20(데이터)을 쓰며 평문 전송이다.","SFTP는 SSH(22번) 위에서 암호화 전송한다.","FTPS는 FTP에 SSL/TLS 암호화를 더한 것이다(보기의 FRPS는 오타).","CMD는 Windows 명령 프롬프트다."]},{"id":"20241103-19","s":2,"q":"Multiplexing 방법 중에서 다중화 시 전송할 데이터가 없더라도 타임 슬롯이 할당되어 대역폭의 낭비를 가져오는 다중화 방식은?","o":["TDM(Time Division Multiplexer)","STDM(Statistical Time Division Multiplexer)","FDM(Frequency Division Multiplex)","FDMA(Frequency Division Multiple Access)"],"a":0,"im":[],"src":[["20241103",19],["20250525",19]],"x":["동기식 TDM은 보낼 데이터가 없어도 각 단말에 타임 슬롯을 고정으로 주므로 대역폭이 낭비된다.","TDM(동기식)은 빈 슬롯도 할당해 낭비가 생긴다.","STDM(통계적 TDM)은 데이터가 있는 단말에만 슬롯을 동적으로 준다.","FDM은 주파수 대역으로 나누는 방식이다.","FDMA는 주파수 분할 다중 접속 방식이다."]},{"id":"20241103-21","s":2,"q":"다음의 (A)에 들어갈 알맞은 용어는?","o":["NFV (Network Functions Virtualization)","WMN (Wireless Mesh Network)","VPN (Virtual Private Network)","CDN (Content Delivery Network)"],"a":0,"im":[68],"src":[["20241103",21]],"x":["네트워크 장비 기능을 범용 서버의 소프트웨어로 가상화하는 기술은 NFV다.","NFV는 네트워크 기능을 소프트웨어로 구현한다.","WMN은 무선 메시 네트워크다.","VPN은 가상 사설망이다.","CDN은 콘텐츠 전송 네트워크다."]},{"id":"20241103-23","s":2,"q":"FDDI(Fiber Distributed Data Interface)의 설명으로 옳지 않은 것은?","o":["광섬유를 사용하고 토큰 패싱 기술을 활용하는 한 개의 링 토폴로지를 가지는 기술이다.","물리계층의 PMD(Physical Medium Dependent)계층에서는 광섬유 종류별 각종 전송장비의 내역을 명시한다.","물리계층의 PHY(Physical Sublayer)계층은 부호화 및 고장난 노드의 처리방식을 제시한다.","SMT(Station Management) 프로토콜은 네트워크 고장을 탐지하며, 고장이 발견되면 즉시 링 토폴로지를 재구성한다."],"a":0,"im":[],"src":[["20241103",23]],"x":["FDDI는 광섬유와 토큰 패싱을 쓰는 '이중 링(Dual Ring)' 구조로, 한 링이 끊어져도 다른 링으로 우회한다.","한 개의 링이라는 설명은 틀렸다. FDDI는 이중 링이다.","PMD는 광섬유 종류별 전송 매체 사양을 정한다.","PHY는 부호화(4B/5B) 등을 정한다.","SMT는 고장을 탐지하고 링을 재구성한다."]},{"id":"20241103-24","s":2,"q":"(A) 안에 들어가는 용어 중 옳은 것은?","o":["터널링","접근 통제 기술","방화벽 설정","FTP"],"a":0,"im":[69],"src":[["20241103",24]],"x":["VPN에서 외부 영향을 받지 않는 가상 경로를 만드는 기술은 터널링이다.","터널링은 원래 패킷을 감싸 가상 경로를 만든다.","접근 통제는 허가된 사용자만 접근하게 하는 기술이다.","방화벽 설정은 트래픽 허용·차단 정책이다.","FTP는 파일 전송 프로토콜이다."]},{"id":"20241103-25","s":2,"q":"모바일 멀티미디어 데이터의 폭증과 데이터 트래픽의 동적특성 변화에 효율적으로 대처하기 위해, 구조적 유연성과 개방성을 제공하며 하드웨어가 아닌 소프트웨어로 제어되는 네트워킹 기술은?","o":["SDS (Software Defined Storage)","SDN (Software Defined Networking)","SNMP (Simple Network Management Protocol)","CLI (Command Line Interface)"],"a":1,"im":[],"src":[["20241103",25],["20250525",24]],"x":["하드웨어가 아닌 소프트웨어(컨트롤러)로 네트워크를 제어해 유연성과 개방성을 주는 기술은 SDN이다.","SDS는 소프트웨어 정의 스토리지다.","SDN은 제어부를 분리해 소프트웨어로 네트워크를 제어한다.","SNMP는 장비 관리 프로토콜이다.","CLI는 명령줄 인터페이스다."]},{"id":"20241103-26","s":2,"q":"클라우드 컴퓨팅의 특징으로 옳지 않은 것은?","o":["사용자는 필요한 만큼의 서버, 네트워크, 저장장치 등과 같은 컴퓨팅 능력을 활용할 수 있다.","사용자 요구에 따라 물리 자원과 가상 자원들이 동적으로 할당/재할당 된다","서비스 형태에 따라 적절한 미터링을 활용하여 자동으로 자원의 사용을 제어하고 최적화한다.","제공자의 컴퓨팅 자원들은 다수의 사용자들을 지원하기 위하여 단일임차인(single-tenant) 모델의 자원 풀(Pool) 형태로 운영된다."],"a":3,"im":[],"src":[["20241103",26]],"x":["클라우드는 여러 사용자가 자원 풀을 함께 쓰는 '다중 임차인(Multi-tenant)' 모델로 운영된다.","필요한 만큼 자원을 쓰는 주문형 셀프서비스가 특징이다.","요구에 따라 자원이 동적으로 할당된다(신속한 탄력성).","미터링으로 사용량을 측정·제어한다.","단일 임차인이 아니라 다중 임차인 모델이므로 틀린 설명이다."]},{"id":"20241103-27","s":2,"q":"메시 네트워크(Mesh Network)의 특징으로 옳지 않은 것은?","o":["노드의 이동이 자유롭기 때문에 네트워크 토폴로지가 동적으로 변한다.","일대일 다중 홉 라우팅(Multihop Routing) 방식으로 전달한다.","어떠한 중앙 제어나 표준 지원 서비스의 도움 없이 임시로 망을 구성할 수 없다.","하나의 연결이 끊어져도 네트워크는 자동으로 다른 연결로 메시지를 전송할 수 있다."],"a":2,"im":[],"src":[["20241103",27]],"x":["메시 네트워크(애드혹 성격)는 중앙 제어나 기반 시설 없이도 노드끼리 임시로 망을 구성할 수 있다.","노드가 이동하면서 토폴로지가 동적으로 변한다.","멀티홉 라우팅으로 데이터를 중계한다.","중앙 제어 없이도 망을 구성할 수 있으므로 '구성할 수 없다'는 틀렸다.","한 링크가 끊겨도 다른 경로로 우회한다."]},{"id":"20241103-28","s":3,"q":"DHCP의 장점으로 옳지 않은 것은?","o":["클라이언트에게 자동으로 IP Address를 할당해 줄 수 있다.","IP Address의 관리가 용이하다.","영구적인 IP Address를 필요로 하는 웹 서버에 대해서는 동적인 주소를 제공한다.","사용자들이 자주 바뀌는 학교와 같은 환경에서 특히 유용하다."],"a":2,"im":[],"src":[["20241103",28]],"x":["고정 IP가 필요한 웹 서버에 동적 주소를 주는 것은 단점이며 장점이 아니다. 서버는 고정 IP(또는 DHCP 예약)를 쓴다.","IP를 자동으로 할당해 준다.","중앙에서 주소를 관리하기 쉽다.","웹 서버처럼 고정 주소가 필요한 장비에 동적 주소를 주는 것은 장점이 아니다.","사용자가 자주 바뀌는 환경에 유용하다."]},{"id":"20241103-29","s":3,"q":"Windows Server 2016에 설치된 DNS에서 지원하는 레코드형식 중 실제 도메인 이름과 연결되는 가상 도메인 이름의 레코드 형식은?","o":["CNAME","MX","A","PTR"],"a":0,"im":[],"src":[["20241103",29]],"x":["CNAME은 실제 도메인 이름에 연결된 별칭(가상 이름) 레코드다.","CNAME은 정식 이름에 대한 별칭이다.","MX는 메일 서버를 지정한다.","A는 이름을 IPv4 주소에 연결한다.","PTR은 IP를 이름에 연결하는 역방향 레코드다."]},{"id":"20241103-30","s":3,"q":"Windows Server 2016에서 파일 및 프린터 서버를 사용할수 있도록 지원하기 위해서 반드시 설치해야 하는 통신 프로토콜은?","o":["TCP/IP","SNMP","SMTP","IGMP"],"a":0,"im":[],"src":[["20241103",30]],"x":["Windows 파일·프린터 공유(SMB)는 TCP/IP 위에서 동작하므로 TCP/IP가 반드시 있어야 한다.","TCP/IP는 SMB 파일·프린터 공유의 기반 프로토콜이다.","SNMP는 장비 관리 프로토콜이다.","SMTP는 메일 전송 프로토콜이다.","IGMP는 멀티캐스트 그룹 관리 프로토콜이다."]},{"id":"20241103-31","s":3,"q":"Windows Server 2016에서 사용하는 PowerShell에 대한 설명으로 옳지 않은 것은?","o":["기존 DOS 명령은 사용할 수 없다.","스크립트는 콘솔에서 대화형으로 사용될 수 있다.","스크립트는 텍스트로 구성된다.","대소문자를 구분하지 않는다."],"a":0,"im":[],"src":[["20241103",31]],"x":["PowerShell에서는 dir, cd, copy 같은 기존 DOS 명령을 별칭(alias)으로 그대로 쓸 수 있다.","기존 DOS 명령을 쓸 수 없다는 설명은 틀렸다.","콘솔에서 대화형으로 명령과 스크립트를 실행할 수 있다.","스크립트(.ps1)는 텍스트 파일이다.","명령어와 변수 이름은 대소문자를 구분하지 않는다."]},{"id":"20241103-32","s":3,"q":"Linux 디렉터리 구성에 대한 설명으로 옳지 않은 것은?","o":["/tmp - 임시파일이 저장되는 디렉터리","/boot - 시스템이 부팅될 때 부팅 가능한 커널 이미지 파일을 담고 있는 디렉터리","/var - 시스템의 로그 파일과 메일이 저장되는 위치","/usr - 사용자 계정이 위치하는 파티션 위치"],"a":3,"im":[],"src":[["20241103",32],["20250525",29],["20260802",31]],"x":["사용자 계정(홈 디렉터리)은 /home에 있다. /usr에는 프로그램, 라이브러리, 문서가 있다.","/tmp는 임시 파일 디렉터리다.","/boot에는 커널 이미지와 부트로더 파일이 있다.","/var에는 로그와 메일 스풀이 저장된다.","/usr를 사용자 계정 위치라고 한 것은 틀렸다(사용자 계정은 /home)."]},{"id":"20241103-33","s":3,"q":"Linux 시스템 부팅과 함께 자동으로 마운트되어야 할 항목과 옵션이 정의되어 있는 파일은?","o":["/etc/fstab","/usr/local","/mount/cdrom","/home/public_html"],"a":0,"im":[],"src":[["20241103",33]],"x":["/etc/fstab에는 부팅할 때 자동으로 마운트할 장치, 마운트 지점, 파일 시스템 종류, 옵션이 적혀 있다.","/etc/fstab이 자동 마운트 설정 파일이다.","/usr/local은 직접 설치한 프로그램 디렉터리다.","/mount/cdrom은 표준 설정 파일 경로가 아니다.","/home/public_html은 사용자 웹 문서 디렉터리 예시다."]},{"id":"20241103-34","s":3,"q":"Linux에서 프로세스와 관련된 명령어에 대한 설명 중 옳지않은 것은?","o":["kill - 프로세스를 종료시키는 명령어","nice - 프로세스의 우선순위를 변경하는 명령어","pstree - 프로세스를 트리형태로 보여주는 명령어","top - 가장 우선순위가 높은 프로세스를 보여주는 명령어"],"a":3,"im":[],"src":[["20241103",34]],"x":["top은 CPU·메모리를 많이 쓰는 프로세스를 실시간으로 보여 준다. '우선순위가 가장 높은 프로세스를 보여 주는' 명령이 아니다.","kill은 프로세스에 시그널을 보내 종료시킨다.","nice는 우선순위(nice 값)를 정해 실행한다(변경은 renice).","pstree는 프로세스를 트리 형태로 보여 준다.","top은 실시간 자원 사용 현황을 보여 주므로 틀린 설명이다."]},{"id":"20241103-36","s":3,"q":"서버 담당자 Park 사원은 Windows Server 2016에서 성능모니터를 실행하여 서버의 성능을 분석하고자 한다. 성능 모니터에 있는 리소스 모니터는 시스템 리소스가 어떻게 사용되고 있는지를 보여주는 또 하나의 강력한 도구이다. 이 유틸리티를 사용하면 소프트웨어 업데이트 및 설치에 대한 정보를 볼 수 있으며, 또한 발생한 주요 이벤트와 해당 이벤트가 발생한 날짜를 볼 수 있다. 리소스 모니터에서 점검할 수 있는 항목이 아닌 것은?","o":["CPU","Memory","Network","Firewall"],"a":3,"im":[],"src":[["20241103",36]],"x":["리소스 모니터는 개요, CPU, 메모리, 디스크, 네트워크 탭으로 구성된다. 방화벽 항목은 없다.","CPU 탭이 있다.","메모리 탭이 있다.","네트워크 탭이 있다.","방화벽은 리소스 모니터 항목이 아니다."]},{"id":"20241103-38","s":3,"q":"Linux Apache로 웹서버 운영 시 service port number를well-known port가 아닌 다른 port number로 변경하여 사용하려 할때, 'httpd.conf' 설정파일에서 변경해야 할 옵션값은?","o":["KeepAlive","DocumentRoot","StartServers","Listen"],"a":3,"im":[],"src":[["20241103",38]],"x":["Apache의 서비스 포트는 httpd.conf의 Listen 지시자로 바꾼다.","KeepAlive는 지속 연결 사용 여부다.","DocumentRoot는 웹 문서 경로다.","StartServers는 시작 프로세스 수다.","Listen에서 포트를 바꾼다."]},{"id":"20241103-40","s":3,"q":"서버 담당자 Park 사원은 IIS(인터넷 정보 서비스)를 설치한후, IIS 관리자를 실행하기 위해 사용할 명령어로 올바른 것은?","o":["wf.msc","msconfig","inetmgr.exe","dsac.exe"],"a":2,"im":[],"src":[["20241103",40]],"x":["inetmgr(.exe)를 실행하면 IIS 관리자가 열린다.","wf.msc는 고급 보안이 포함된 Windows 방화벽이다.","msconfig는 시스템 구성 도구다.","i 싱(부하 분산)이다.","IP 마스커레이딩은 내부 여러 호스트가 하나의 공인 IP로 외부에 나가게 하는 기능이다.","포트 포워딩은 특정 포트를 특정 내부 서버 하나로 전달한다.","동적 주소 할당은 DHCP처럼 주소를 자동으로 나눠 주는 것이다.","로드 밸런싱은 외부 연결을 내부 여러 서버로 분산한다."]},{"id":"20241103-47","s":4,"q":"아래 지문은 라우팅의 Distance Vector방식을 설명한 것이다. 이에 해당하지 않는 프로토콜은?","o":["IGRP","RIP","BGP","OSPF"],"a":3,"im":[71],"src":[["20241103",47],["20260802",48]],"x":["OSPF는 거리 벡터가 아니라 링크 상태(Link State) 방식이다.","IGRP는 Cisco의 거리 벡터 프로토콜이다.","RIP은 대표적인 거리 벡터 프로토콜이다.","BGP는 경로 벡터 방식(거리 벡터의 확장)으로 분류된다.","OSPF는 링크 상태 방식이므로 거리 벡터에 해당하지 않는다."]},{"id":"20241103-49","s":4,"q":"L2 스위치 네트워크상의 루프구조는 복합적인 다중 루프가발생할 수도 있다. 이러한 경우 전체 네트워크는 구조에 따른 과도한 브로드캐스트 트래픽으로 인해 사용할 수 없는 지경에 이른다. 이와 같은 다중 루프를 방지하기 위해 만들어진 기술은?","o":["VLAN(Virtual Local Area Network)","Port Mirroring","Store And Forward","STP(Spanning Tree Protocol)"],"a":3,"im":[],"src":[["20241103",49]],"x":["STP는 스위치 간 이중 경로 중 일부 포트를 차단(Blocking)해 루프를 없애고 브로드캐스트 폭풍을 막는다.","VLAN은 브로드캐스트 도메인을 나누지만 루프 방지 기술은 아니다.","포트 미러링은 한 포트의 트래픽을 다른 포트로 복사해 분석하는 기능이다.","Store and Forward는 프레임을 다 받고 오류를 검사한 뒤 전달하는 스위칭 방식이다.","STP가 L2 루프 방지 기술이다."]},{"id":"20241103-50","s":4,"q":"아래 전송 선로 중 대역폭이 가장 넓은 전송매체는?","o":["Twist Pair 케이블","Base Band 동축케이블","CATV 동축케이블","Fiber Optic 케이블"],"a":3,"im":[],"src":[["20241103",50]],"x":["광섬유는 빛을 써서 수십 Gbps 이상의 가장 넓은 대역폭을 제공한다.","트위스트 페어는 구리선이라 대역폭이 상대적으로 작다.","베이스밴드 동축 케이블은 하나의 디지털 신호만 실어 대역폭이 제한된다.","CATV 동축 케이블은 브로드밴드지만 광섬유보다 대역폭이 작다.","광섬유가 대역폭이 가장 넓다."]},{"id":"20250223-01","s":1,"q":"IP Header의 내용 중 TTL(Time To Live)의 기능을 설명한것으로 옳지 않은 것은?","o":["IP 패킷은 네트워크상에서 영원히 존재할 수 있다.","일반적으로 라우터의 한 홉(Hop)을 통과할 때마다 TTL 값이 '1'씩 감소한다.","Ping과 Tracert 유틸리티는 특정 호스트 컴퓨터에 접근을 시도하거나 그 호스트까지의 경로를 추적할 때 TTL 값을 사용한다.","IP 패킷이 네트워크상에서 얼마동안 존재할 수 있는가를 나타낸다."],"a":0,"im":[],"src":[["20250223",1]],"x":["TTL은 패킷이 네트워크에서 무한히 떠도는 것을 막는 값이다. 0이 되면 버려지므로 영원히 존재할 수 없다.","TTL 때문에 패킷은 영원히 존재할 수 없으므로 틀린 설명이다.","라우터를 하나 지날 때마다 TTL이 1씩 줄어든다.","tracert는 TTL을 1, 2, 3…으로 늘려 가며 경로를 추적하고, ping도 TTL을 사용한다.","TTL은 패킷이 존재할 수 있는 기간(홉 수)을 나타낸다."]},{"id":"20250223-03","s":1,"q":"C Class 네트워크에서 6개의 서브넷이 필요하다고 할 때 가장 적당한 서브넷 마스크는?","o":["255.255.255.0","255.255.255.192","255.255.255.224","255.255.255.240"],"a":2,"im":[],"src":[["20250223",3]],"x":["서브넷 6개가 필요하면 2^3 = 8 ≥ 6이라 3비트를 빌린다. /27 = 255.255.255.224다.","/24는 나누지 않은 기본 마스크다.","/26은 서브넷 4개로 부족하다.","/27은 서브넷 8개로 6개 조건을 만족하는 가장 알맞은 값이다.","/28은 16개로 가능은 하지만 필요 이상 잘게 나눠 호스트 수가 줄어든다."]},{"id":"20250223-05","s":1,"q":"TCP가 제공하는 기능으로 옳지 않은 것은?","o":["종단 간 흐름 제어를 위해 동적 윈도우(Dynamic Sliding Window) 방식을 사용한다.","한 번에 많은 데이터의 전송에 유리하기 때문에 화상 통신과 같은 실시간 통신에 사용된다.","송수신되는 데이터의 에러를 제어함으로써 신뢰성 있는 데이터 전송을 보장한다.","Three Way Handshaking 과정을 통해 데이터를 주고받는다."],"a":1,"im":[],"src":[["20250223",5],["20260802",5]],"x":["TCP는 재전송·확인 응답 때문에 지연이 생겨 실시간 화상 통신에는 UDP가 주로 쓰인다.","슬라이딩 윈도우로 흐름 제어를 한다.","실시간 통신에는 UDP가 적합하므로 틀린 설명이다.","오류 제어로 신뢰성 있는 전송을 보장한다.","3-way handshake로 연결한 뒤 데이터를 주고받는다."]},{"id":"20250223-07","s":1,"q":"ICMP의 Message Type필드의 유형과 질의 메시지 내용을 나타낸 것이다. 타입에 대한 설명으로 옳지 않은 것은?","o":["3 - Echo Request 질의 메시지에 응답하는데 사용된다.","4 - 흐름제어 및 폭주제어를 위해 사용된다.","5 - 대체경로(Redirect)를 알리기 위해 라우터가 호스트에 사용한다.","17 - Address Mask Request 장비의 서브넷 마스크를 요구하는데 사용된다."],"a":0,"im":[],"src":[["20250223",7],["20260802",7]],"x":["ICMP 타입 3은 Destination Unreachable(목적지 도달 불가)이다. Echo Request에 대한 응답은 타입 0(Echo Reply)이다.","타입 3은 Echo 응답이 아니므로 틀렸다.","타입 4 Source Quench는 송신 속도를 줄이라는 흐름·폭주 제어 메시지다.","타입 5 Redirect는 라우터가 호스트에 더 좋은 경로를 알린다.","타입 17 Address Mask Request는 서브넷 마스크를 요청한다."]},{"id":"20250223-08","s":1,"q":"인터넷 전송 방식 중, 특정 호스트로부터 같은 네트워크상의모든 호스트에게 데이터를 전송하는 방식은?","o":["Unicast","Broadcast","Multicast","User Datagram Protocol"],"a":1,"im":[],"src":[["20250223",8],["20260802",8]],"x":["같은 네트워크의 모든 호스트에게 보내는 방식은 브로드캐스트다.","유니캐스트는 1:1 전송이다.","브로드캐스트는 1:전체 전송이다.","멀티캐스트는 1:그룹 전송이다.","UDP는 전송 방식이 아니라 전송 계층 프로토콜이다."]},{"id":"20250223-14","s":1,"q":"FTP 프로토콜에 대한 설명으로 올바르지 않은 것은?","o":["FTP 세션이 설정되면 파일 송수신 기능을 사용해 원격 파일을 복사할 수 있다.","데이터 채널을 설정하기 위해 FTP 서버가 자신의 Well-known 포트인 20번으로 FTP 클라이언트와 데이터 채널 연결을 시도한다.","데이터 채널은 파일 송수신 요구가 발생할 때마다 새로 설정되고, 해당 파일의 송수신이 완료되면 즉시 연결이 해제된다.","프로토콜의 기본 기능인 파일 복사 작업은 복잡하지 않기 때문에 UDP프로토콜을 사용하는 것이 효율적이고 69번 포트를 통해 데이터를 전송한다."],"a":3,"im":[],"src":[["20250223",14]],"x":["FTP는 TCP 20·21번을 쓴다. UDP 69번은 TFTP다.","FTP 세션으로 원격 파일을 복사할 수 있다.","Active 모드에서 서버는 20번 포트로 클라이언트에 데이터 연결을 시도한다.","데이터 채널은 전송할 때마다 새로 열리고 끝나면 닫힌다.","UDP 69번은 TFTP의 설명이므로 FTP 설명으로 틀렸다."]},{"id":"20250223-15","s":1,"q":"DNS 역할에 대한 설명으로 옳지 않은 것은?","o":["DNS는 사용자가 도메인 이름을 입력하면 해당 도메인 이름을 해당하는 IP 주소로 변환한다.","DNS는 여러 개의 IP 주소를 가진 도메인 이름에 대해 로드 밸런싱 기능을 제공, IP 주소를 반환하여 트래픽을 분산시키는 방식으로 서버 부하를 분산시킨다.","방화벽과 같은 보안 장비 중 하나다.","DNS는 이전에 접근한 도메인 이름과 IP 주소의 대응을 캐싱하여 저장한다."],"a":2,"im":[],"src":[["20250223",15]],"x":["DNS는 이름–IP 변환 서비스다. 방화벽 같은 보안 장비가 아니다.","도메인 이름을 IP 주소로 변환한다.","여러 IP를 번갈아 응답해 부하를 분산할 수 있다(라운드 로빈).","DNS는 보안 장비가 아니므로 틀린 설명이다.","조회한 결과를 TTL 동안 캐싱한다."]},{"id":"20250223-16","s":1,"q":"다음 중 (A), (B)에 들어갈 내용으로 알맞은 용어로 옳은 것은?","o":["(A) 암호화, (B) 복호화","(A) 복호화, (B) 암호화","(A) 캡슐화, (B) 역캡슐화","(A) 역캡슐화, (B) 캡슐화"],"a":2,"im":[72],"src":[["20250223",16]],"x":["송신 측은 각 계층 헤더를 붙여 내려보내고(캡슐화), 수신 측은 계층마다 헤더를 떼어 올려 보낸다(역캡슐화).","암호화·복호화는 데이터를 숨기는 과정이지 헤더를 붙이고 떼는 과정이 아니다.","암호화·복호화를 거꾸로 놓았고 개념도 맞지 않다.","(A) 헤더 추가 = 캡슐화, (B) 헤더 제거 = 역캡슐화가 맞다.","캡슐화와 역캡슐화가 뒤바뀌었다."]},{"id":"20250223-17","s":1,"q":"ARP(Address Resolution Protocol)에 대한 설명 중 올바른것은?","o":["수신측의 논리주소 정보가 없기 때문에 브로드캐스트를 통해 전송한다.","수신측 물리주소와 송신측 물리주소를 검사하여 자신에 대해 물리주소를 요구하는 경우라면 ARP를 전송한다.","각 시스템에 Address Resolution Protocol Cache가 있고 Cache 정보를 보관한다.","H/W 주소 기반으로 IP주소로 변환한다."],"a":2,"im":[],"src":[["20250223",17]],"x":["각 시스템은 ARP 캐시에 IP–MAC 대응을 일정 시간 저장해 두고 재사용한다.","ARP는 수신 측의 '물리 주소(MAC)'를 모르기 때문에 브로드캐스트한다. 논리 주소(IP)는 알고 있다.","수신 측은 요청 패킷의 '목적지 IP'가 자기 IP인지 보고 ARP Reply를 보낸다.","ARP 캐시에 대응 정보를 보관한다.","하드웨어 주소로 IP를 얻는 것은 RARP다."]},{"id":"20250223-19","s":2,"q":"OSI 7 Layer에서 Data Link 계층의 기능으로 옳지 않은 것은?","o":["전송 오류제어 기능","Flow 제어 기능","Text의 압축, 암호화 기능","Link의 관리 기능"],"a":2,"im":[],"src":[["20250223",19],["20260517",18]],"x":["텍스트 압축과 암호화는 표현 ectory","Public Directory"],"a":1,"im":[],"src":[["20250223",43]],"x":["사용자에게 할당되어 마음대로 쓸 수 있는 개인 디렉터리는 홈 디렉터리(/home/사용자)다.","루트 디렉터리(/)는 파일 시스템 최상위다.","홈 디렉터리가 사용자 전용 영역이다.","임시 디렉터리(/tmp)는 모든 사용자가 임시로 쓰는 곳이다.","Public Directory는 리눅스 표준 디렉터리 개념이 아니다."]},{"id":"20250223-44","s":3,"q":"Windows Server 2016에서 DHCP 구성에 대한 설명으로 올바른 것은?","o":["DHCP에서 새 범위 구성 시 임대 기간은 일, 시간, 분, 초단위로 설정할 수 있다.","DHCP에서 새 범위 구성 시 더 이상 WINS 서버를 구성하지 않는다.","새 예약 구성 시 지원되는 유형은 BOOTP 없이 DHCP만 가능하다.","DHCP 서버에서 주소를 분배할 때, 적용할 지연시간은 ms 단위로 지정한다."],"a":3,"im":[],"src":[["20250223",44]],"x":["DHCP 서버 속성의 '서브넷 지연(Delay)'은 밀리초(ms) 단위로 지정한다.","임대 기간은 일·시간·분 단위로 설정한다(초 단위 없음).","범위 옵션에서 WINS 서버를 여전히 구성할 수 있다.","예약 유형은 DHCP, BOOTP, 둘 다 중에서 고를 수 있다.","주소 제공 지연 시간은 ms 단위로 지정한다."]},{"id":"20250223-45","s":3,"q":"다음 중 Linux 명령어에 대한 설명으로 옳지 않은 것은?","o":["mkfs : 파일시스템 생성","du : 디스크 사용량 확인","mount : 외부장치 등을 디렉터리에 연결","fdisk : 파일시스템 점검"],"a":3,"im":[],"src":[["20250223",45]],"x":["fdisk는 파티션을 만들고 관리하는 명령이다. 파일 시스템 점검은 fsck다.","mkfs는 파일 시스템을 만든다.","du는 디스크 사용량을 보여 준다.","mount는 장치를 디렉터리에 연결한다.","파일 시스템 점검은 fsck이므로 fdisk 설명은 틀렸다."]},{"id":"20250223-47","s":4,"q":"무선랜(LAN)은 무선신호 전달방식을 이용하여 두 대 이상의장치를 연결하는 기술이다. 이를 이용하여 사용자는 근거리 지역에서 이동하면서 지속적으로 네트워크에 접근할 수 있게 된다. 다음의 지문에서 설명하는 와이파이 IEEE 802.11규격은?","o":["IEEE 802.11n","IEEE 802.11ac","IEEE 802.11be","IEEE 802.11ax"],"a":3,"im":[75],"src":[["20250223",47]],"x":["와이파이 6, MU-MIMO, 1024-QAM, 6GHz(6E) 지원은 IEEE 802.11ax의 특징이다.","802.11n은 와이파이 4다.","802.11ac는 와이파이 5다.","802.11be는 와이파이 7이다.","802.11ax가 와이파이 6이다."]},{"id":"20250223-49","s":4,"q":"아래 지문이 설명하는 용어는?","o":["NAC(Network Access Control)","NAT(Network Access Translation)","IP제어","WAF(Web Application Firewall)"],"a":0,"im":[76],"src":[["20250223",49]],"x":["인가된 사용자·단말만 내부망에 접속하게 하고, 보안 정책을 지키지 않은 단말의 접속을 막는 기술은 NAC다.","NAC는 접속 단말을 인증·검사해 접근을 통제한다.","NAT는 주소 변환 기술이다(보기의 풀이 Network Access Translation도 틀렸고 원래는 Address).","IP 제어는 IP 관리 시스템으로, NAC는 여기서 발전한 솔루션이다.","WAF는 웹 애플리케이션 공격을 막는 방화벽이다."]},{"id":"20250223-50","s":4,"q":"RAID에 대한 특징 중 옳지 않은 것은?","o":["데이터를 다수의 하드디스크에 병렬 전송하여 가상 하드디스크의 전송속도가 향상된다.","동일한 데이터를 하드디스크의 서로 다른 위치에 중복 저장할 수 있다.","가동 중에 하드디스크에 장애가 발생하더라도 시스템의 정지 없이 새로운 하드디스크를 교체할 수 있다.","운영체제에서 여러 개의 논리적 드라이브를 하나의 물리적 드라이브로 활용한다."],"a":3,"im":[],"src":[["20250223",50]],"x":["RAID는 여러 '물리' 디스크를 묶어 하나의 '논리' 드라이브로 쓰는 기술이다. 보기 설명은 반대다.","병렬 전송으로 속도가 빨라진다.","미러링·패리티로 데이터를 중복 저장한다.","핫 스왑으로 가동 중에 디스크를 교체할 수 있다.","논리와 물리가 뒤바뀌어 틀린 설명이다."]},{"id":"20250525-01","s":1,"q":"프로토콜의 기본적인 기능 중, 송신기에서 발생된 정보의 정확한 전송을 위해 사용자 정보의 앞, 뒤 부분에 헤더와 트레일러를 부가하는 과정은?","o":["캡슐화(Encapsulation)","동기화(Synchronization)","다중화(Multiplexing)","주소지정(Addressing)"],"a":0,"im":[],"src":[["20250525",1]],"x":["데이터 앞뒤에 헤더와 트레일러를 붙이는 과정은 캡슐화다.","캡슐화가 헤더·트레일러를 붙이는 기능이다.","동기화는 송수신 타이밍을 맞추는 기능이다.","다중화는 여러 신호를 한 회선으로 보내는 기능이다.","주소 지정은 송수신자를 식별하는 기능이다."]},{"id":"20250525-02","s":1,"q":"서브넷 마스크에 대한 설명으로 옳지 않은 것은?","o":["IP Address 체계에서 Network ID와 Host ID로 구분한다.","목적지 호스트가 동일한 네트워크상에 있는지 확인한다.","Class A는 기본 서브넷 마스크로 '254.0.0.0'을 이용한다.","서브넷 마스크의 Network ID 필드는 이진수 '1'로, Host ID의 필드는 이진수 '0'으로 채운다."],"a":2,"im":[],"src":[["20250525",2]],"x":["A Class 기본 서브넷 마스크는 255.0.0.0이다. 254.0.0.0이 아니다.","서브넷 마스크로 네트워크 ID와 호스트 ID를 구분한다.","같은 네트워크인지 AND 연산으로 확인한다.","A Class 기본 마스크는 255.0.0.0이므로 틀린 설명이다.","네트워크 부분은 1, 호스트 부분은 0으로 채운다."]},{"id":"20250525-03","s":1,"q":"IGMP(Internet Group Management Protocol)의 특징으로 옳지 않은 것은?","o":["TTL(Time to Live)이 제공된다.","유니캐스트 통신을 위한 프로토콜로 적합하다.","IGMPv1에서는 첫 보고 메시지 손실 시 재전송되지 않는다.","호스트와 라우터 간의 비대칭 통신 구조를 가진다."],"a":1,"im":[],"src":[["20250525",3]],"x":["IGMP는 멀티캐스트 그룹 관리용이다. 유니캐스트용이 아니다.","IGMP 패킷도 IP 헤더의 TTL(보통 1)을 가진다.","유니캐스트에 적합하다는 설명은 틀렸다.","IGMPv1은 첫 보고 메시지를 잃어도 재전송하지 않는다(다음 질의 때 응답).","라우터가 질의하고 호스트가 보고하는 비대칭 구조다."]},{"id":"20250525-07","s":1,"q":"IPv6에 대한 설명으로 올바른 것은?","o":["IETF(Internet Engineering Task Force)에서 IP Address 부족에 대한 해결 방안으로 만들었다.","IPv6 보다는 IPv4가 더 다양한 옵션 설정이 가능하다.","주소 유형은 유니캐스트, 멀티캐스트, 브로드캐스트 3가지이다.","Broadcasting 기능을 제공한다."],"a":0,"im":[],"src":[["20250525",7]],"x":["IPv6는 IPv4 주소 고갈을 해결하려고 IETF가 만든 128비트 주소 체계다.","IETF가 주소 부족 해결책으로 만들었다.","IPv6는 확장 헤더로 IPv4보다 다양한 옵션을 지원한다.","IPv6 주소 유형은 유니캐스트, 멀티캐스트, 애니캐스트다.","IPv6에는 브로드캐스트가 없다."]},{"id":"20250525-09","s":1,"q":"다음 중 IP 프로토콜의 역할로 올바른 것은?","o":["호스트 간 패킷 전달의 신뢰성을 보장한다.","손실된 패킷의 재전송을 요청할 수 있다.","호스트 간에 패킷 교환에서 흐름 제어를 할 수 있다.","MTU(Maximum Transmission Unit) 값보다 큰 Datagram은 단편화(Fragmentation)를 수행한다."],"a":3,"im":[],"src":[["20250525",9]],"x":["IP는 신뢰성·재전송·흐름 제어를 하지 않으며, MTU보다 큰 데이터그램을 단편화하는 기능은 있다.","신뢰성 보장은 TCP의 역할이다.","재전송 요청은 TCP의 역할이다.","흐름 제어는 TCP의 역할이다.","MTU보다 크면 단편화한다."]},{"id":"20250525-10","s":1,"q":"다음 중 ARP(Address Resolution Protocol) 캐시 유지 방식에 대한 설명으로 옳지 않은 것은?","o":["새로 등록된 주소는 생존 시간(TTL: Time To Live) 값을 가진다.","등록된 주소는 일정 시간(예: 1~2분) 동안 사용되지 않으면 ARP 캐시에서 삭제될 수 있다.","일부 TCP/IP 시스템에서는 ARP 캐시에 등록된 주소가 재사용될 경우 TTL 값이 초기값으로 재설정된다.","ARP는 ARP 캐시를 사용하더라도, 서버와 통신할 때마다 매번 MAC 주소를 다시 요청해야 한다."],"a":3,"im":[],"src":[["20250525",10]],"x":["ARP 캐시에 MAC 주소가 있으면 다시 요청하지 않고 그대로 쓴다. 매번 요청한다면 캐시를 쓰는 의미가 없다.","새 항목은 생존 시간(TTL)을 가진다.","일정 시간 사용하지 않으면 캐시에서 지워진다.","재사용되면 타이머가 초기화되는 구현도 있다.","캐시를 쓰면 매번 요청하지 않으므로 틀린 설명이다."]},{"id":"20250525-11","s":1,"q":"TCP/IP protocol stack에서 사용하는 Application 중에 연결 제어와 정보 전송용 포트를 구분하여 사용하는 것은?","o":["DNS","SMTP","TFTP","FTP"],"a":3,"im":[],"src":[["20250525",11]],"x":["FTP는 제어 연결(21번)과 데이터 전송 연결(20번)을 따로 쓴다.","DNS는 53번 하나만 쓴다.","SMTP는 25번 하나만 쓴다.","TFTP는 69번으로 시작한다(제어·데이터 분리 개념 없음).","FTP는 제어(21)와 데이터(20) 포트를 구분한다."]},{"id":"20250525-13","s":1,"q":"다음 중 Ping 유틸리티와 관련이 없는 것은?","o":["ICMP 메시지를 이용한다.","Echo Request 메시지를 보내고 해당 컴퓨터로부터 ICMP Echo Reply 메시지를 기다린다.","TCP/IP 구성 파라미터를 확인할 수 있다.","TCP/IP 연결성을 테스트할 수 있다."],"a":2,"im":[],"src":[["20250525",13]],"x":["TCP/IP 구성 정보(IP, 마스크, 게이트웨이)는 ipconfig로 확인한다. ping과는 관계없다.","ping은 ICMP 메시지를 쓴다.","Echo Request를 보내고 Echo Reply를 기다린다.","구성 파라미터 확인은 ipconfig의 기능이다.","TCP/IP 연결성을 테스트한다."]},{"id":"20250525-14","s":1,"q":"SMTP(Simple Mail Transfer Protocol)와 POP3(Post OfficeProtocol version 3)의 차이점에 대한 설명으로 올바른 것은?","o":["SMTP는 전송 프로토콜로 메일을 송신하는 데 사용되며, POP3는 수신 프로토콜로 메일을 수신하는 데 사용된다.","SMTP와 POP3는 모두 메일을 실시간 동기화하여 서버에 메일을 보관한다.","SMTP는 전자 메일 시스템과 관련이 있지만 POP3는 상관없는 프로토콜이다.","전자 메일은 SMTP, POP3, IMAP 서버를 통해 메일의 송수신이 동시에 처리된다."],"a":0,"im":[],"src":[["20250525",14]],"x":["SMTP는 메일을 보내는(송신·전달) 프로토콜이고 POP3는 서버에서 메일을 가져오는(수신) 프로토콜이다.","SMTP는 송신, POP3는 수신이다.","서버와 실시간 동기화해 보관하는 것은 IMAP이다. POP3는 보통 내려받고 서버에서 지운다.","POP3도 전자메일 수신 프로토콜이다.","SMTP는 송신, POP3/IMAP은 수신으로 역할이 나뉘어 '동시에 처리'는 맞지 않다."]},{"id":"20250525-15","s":1,"q":"다음은 무엇에 관한 설명인가?","o":["OSPF","RIP","EGP","BGP"],"a":1,"im":[77],"src":[["20250525",15]],"x":["라우터끼리 라우팅 테이블을 공유하고, 30초 주기로 갱신하며, 라우팅 루프(무한 루프)가 생길 수 있는 것은 거리 벡터 프로토콜 RIP이다.","OSPF는 링크 상태 방식이며 변화가 있을 때 갱신한다.","RIP은 30초마다 테이블을 교환하며 라우팅 루프 문제가 있다.","EGP는 AS 간 초기 외부 라우팅 프로토콜이다.","BGP는 AS 간 경로 벡터 프로토콜이다."]},{"id":"20250525-16","s":1,"q":"TLS 프로토콜을 통해 Application Layer의 Data를 암호화하여 보호하는 프로토콜은?","o":["SMTP","FTP","Telnet","HTTPS"],"a":3,"im":[],"src":[["20250525",16]],"x":["HTTPS는 HTTP(응용 계층 데이터)를 TLS로 암호화해 보호한다(포트 443).","SMTP는 기본적으로 평문 메일 전송 프로토콜이다(STARTTLS는 확장).","FTP는 평문 파일 전송 프로토콜이다.","Telnet은 평문 원격 접속 프로토콜이다.","HTTPS가 TLS로 응용 데이터를 암호화한다."]},{"id":"20250525-17","s":1,"q":"DNS에 대한 설명 중 옳지 않은 것은?","o":["다른 호스트에 접근하고자 할 때 기억하기 어려운 IP Address 대신에 좀 더 이해하기 쉬운 계층적인 호스트 이름을 사용할 수 있도록 하는 기반 서비스이자 프로토콜이다.","호스트 이름에 대한 분산 데이터베이스이다.","호스트 이름은 단순한 나열이 아닌 논리적 구조를 형성하며, 하나의 도메인으로 그룹화되어 있고, 내부에 하위 도메인을 포함할 수 있다.","호스트 이름은 영문자와 숫자 그리고 '@', '#'과 같은 특수 문자로 구성된다."],"a":3,"im":[],"src":[["20250525",17]],"x":["호스트 이름에는 영문자, 숫자, 하이픈(-)만 쓸 수 있다. @, # 같은 특수 문자는 쓸 수 없다.","IP 대신 기억하기 쉬운 계층적 이름을 쓰게 해 주는 서비스·프로토콜이다.","DNS는 전 세계에 분산된 데이터베이스다.","도메인은 계층 구조이며 하위 도메인을 포함한다.","@, # 등 특수 문자는 호스트 이름에 쓸 수 없으므로 틀린 설명이다."]},{"id":"20250525-22","s":2,"q":"파장분할다중화방식(WDM)의 특징으로 옳은 것은?","o":["선로의 증설 없이 회선의 증설이 어렵다.","광증폭기를 사용해 무중계 장거리 전송이 가능하다.","광학적인 방법에 의해 신호를 시간축에서 다중화하는 방식이다.","각각의 채널은 같은 전송 형식, 전송 속도, 프로토콜 형식을 가진다."],"a":1,"im":[],"src":[["20250525",22],["20260517",20]],"x":["WDM은 여러 파장을 한 광섬유에 실어 보내며 광 ","신뢰성 있는 통신은 TCP의 역할이다.","IP는 네트워크 계층에서 패킷을 전달한다.","세그먼트 오류 감지·정정은 TCP의 역할이다.","슬라이딩 윈도우 흐름 제어는 TCP의 기능이다."]},{"id":"20250824-06","s":1,"q":"TCP(Transmission Control Protocol)에 대한 설명으로 옳지않은 것은?","o":["연결 위주의 전송방식이다.","신뢰성 있는 전송방식이다.","능동적인 흐름 제어 기능을 가지고 있다.","일부 데이터가 손실되어도 치명적이지 않은 프로그램 등에 적합하다."],"a":3,"im":[],"src":[["20250824",6]],"x":["일부 데이터가 손실돼도 괜찮은 프로그램(스트리밍, 실시간 통신)에는 UDP가 알맞다. TCP는 신뢰성이 필요한 경우에 쓴다.","TCP는 연결형이다.","TCP는 신뢰성 있는 전송을 한다.","슬라이딩 윈도우로 흐름 제어를 한다.","손실 허용 프로그램에 적합한 것은 UDP이므로 틀린 설명이다."]},{"id":"20250824-07","s":1,"q":"OSI 7 Layer에 따라 프로토콜을 분류하였을 때, 다음 보기들중 같은 계층에서 동작하지 않는 것은?","o":["SMTP","RARP","ICMP","IGMP"],"a":0,"im":[],"src":[["20250824",7]],"x":["RARP, ICMP, IGMP는 네트워크 계층에서 동작하고 SMTP만 응용 계층이다.","SMTP는 응용 계층이라 혼자 계층이 다르다.","RARP는 네트워크 계층(주소 해석)이다.","ICMP는 네트워크 계층이다.","IGMP는 네트워크 계층이다."]},{"id":"20250824-08","s":1,"q":"ARP에 대한 설명으로 올바른 것은?","o":["IP Address를 장치의 하드웨어 주소로 매핑하는 기능을 제공한다.","Dynamic으로 설정된 내용을 Static 상태로 변경하는 ARP 명령어 옵션은 '-d'이다.","ARP가 IP Address를 알기 위해 특정 호스트에게 메시지를 전송하고 이에 대한 응답을 기다린다.","ARP Cache는 IP Address를 도메인(Domain) 주소로 매핑한 모든 정보를 유지하고 있다."],"a":0,"im":[],"src":[["20250824",8]],"x":["ARP는 IP 주소를 장치의 하드웨어(MAC) 주소로 매핑한다.","IP → MAC 매핑이 ARP의 기능이다.","정적 항목 추가는 arp -s, -d는 항목 삭제다.","ARP는 브로드캐스트로 'MAC 주소'를 묻는다. IP를 알려고 보내는 것이 아니다.","ARP 캐시는 IP–MAC 대응을 저장한다. 도메인 매핑은 DNS 캐시다."]},{"id":"20250824-10","s":1,"q":"사설 IP주소를 공인 IP주소로 바꿔주는데 사용하는 통신망의 주소 변환 기술로, 공인 IP주소를 절약하고, 내부 사설망을 이용하여 인터넷에 연결하므로 보안을 강화할 수 있는 것은?","o":["DHCP","ARP","BOOTP","NAT"],"a":3,"im":[],"src":[["20250824",10]],"x":["NAT는 사설 IP를 공인 IP로 바꿔 주소를 아끼고 내부를 숨긴다.","DHCP는 IP 자동 할당이다.","ARP는 IP로 MAC을 찾는다.","BOOTP는 부팅 시 주소 할당 프로토콜이다.","NAT가 주소 변환 기술이다."]},{"id":"20250824-14","s":1,"q":"TCP 헤더를 구성하는 필드의 길이(비트수)가 적절하지 않은것은?","o":["Source port address : 16비트","Sequence Number : 32비트","Flags : 9비트","Checksum : 32비트"],"a":3,"im":[],"src":[["20250824",14],["20260517",12]],"x":["TCP 체크섬은 16비트다. 32비트는 순서 번호·확인 응답 번호의 길이다.","출발지 포트는 16비트다.","순서 번호는 32비트다.","플래그는 9비트로 볼 수 있다(NS, CWR, ECE, URG, ACK, PSH, RST, SYN, FIN).","체크섬은 16비트이므로 32비트는 틀렸다."]},{"id":"20250824-15","s":1,"q":"HTTP에 대한 설명으로 적절하지 않은 것은?","o":["애플리케이션 계층에서 동작하는 프로토콜이다.","HTTP/2는 SPDY 프로토콜을 기반으로 TCP 연결을 사용한다.","HTTP 기본 포트는 80이고, HTTPS 기본포트는 443이다.","HTTP/3은 QUIC 프로토콜을 기반으로 TCP 연결을 사용한다."],"a":3,"im":[],"src":[["20250824",15]],"x":["HTTP/3은 QUIC 위에서 동작하고 QUIC은 UDP를 쓴다. TCP 연결을 쓰지 않는다.","HTTP는 응용 계층 프로토콜이다.","HTTP/2는 구글 SPDY를 바탕으로 만들었고 TCP를 쓴다.","HTTP 80, HTTPS 443이다.","HTTP/3(QUIC)은 UDP 기반이므로 틀린 설명이다."]},{"id":"20250824-16","s":1,"q":"다음 중 SNMP(Simple Network Management Protocol)의설명으로 옳은 것은?","o":["포트번호는 181번을 사용한다.","네트워크 관리를 위해 관리 정보 및 정보 운반을 위한 프로토콜이다.","대부분의 네트워킹 공급업체에서 광범위하게 지원되나 기존 네트워크와는 통합이 어렵다.","SNMPv2c는 암호화와 인증 기능을 기본으로 제공하므로 보안성이 매우 높다."],"a":1,"im":[],"src":[["20250824",16]],"x":["SNMP는 관리 정보(MIB)를 정의하고 그 정보를 주고받는 네트워크 관리 프로토콜이다.","SNMP 포트는 UDP 161(트랩 162)이다.","관리 정보와 그 전달을 위한 프로토콜이다.","표준 프로토콜이라 기존 네트워크와 통합하기 쉽다.","SNMPv2c는 커뮤니티 문자열을 평문으로 써서 보안이 약하다. 암호화·인증은 SNMPv3에서 제공한다."]},{"id":"20250824-18","s":2,"q":"NFV(Network Function Virtualization)에 대한 설명으로 옳지 않은 것은?","o":["소프트웨어가 아닌 하드웨어로 제어되는 네트워킹 기술로서, 네트워크를 마치 컴퓨터처럼 구성하거나 조작하는 네트워킹 기술이다.","NFV(Network Functions Virtualization)는 소프트웨어로 개발된 네트워크 기능의 가상화된 형태를 의미한다.","NFVI(Network Function Virtualization Infrastructure)는 물리적 H/W 자원, 가상화 지원기능 및 VNF(Virtualized Network Functions) 실행지원기능 등을 제공한다.","가상화 기술 기반으로 통신망 운용에 필요한 다양한 네트워크 장비 내 여러 기능들을 분리시켜 S/W로 제어 및 관리 가능하도록 하는 네트워크 가상화 기술이다."],"a":0,"im":[],"src":[["20250824",18]],"x":["NFV는 하드웨어가 아니라 소프트웨어로 네트워크 기능을 구현·제어하는 가상화 기술이다.","하드웨어로 제어된다는 설명은 틀렸다.","NFV는 소프트웨어로 만든 네트워크 기능의 가상화 형태다.","NFVI는 VNF를 실행할 물리·가상화 기반을 제공한다.","장비 기능을 분리해 소프트웨어로 제어·관리한다."]},{"id":"20250824-19","s":2,"q":"메시 네트워크(Mesh Network)의 특징으로 옳지 않은 것은?","o":["노드의 이동이 자유롭기 때문에 네트워크 토폴로지가 동적으로 변한다.","일대일 다중 홉 라우팅(Multihop Routing) 방식으로 전달한다.","중앙 제어나 표준 서비스 없이 네트워크를 구성할 수 없다.","하나의 연결이 끊어져도 네트워크는 자동으로 다른 연결로 메시지를 전송할 수 있다."],"a":2,"im":[],"src":[["20250824",19]],"x":["메시 네트워크는 중앙 제어나 기반 시설 없이도 노드끼리 망을 구성할 수 있다.","노드 이동에 따라 토폴로지가 바뀐다.","멀티홉으로 중계 전달한다.","중앙 제어 없이도 구성할 수 있으므로 틀린 설명이다.","링크가 끊겨도 다른 경로로 우회한다."]},{"id":"20250824-21","s":2,"q":"송신측에서 여러 개의 터미널이 하나의 통신 회선을 통하여신호를 전송하고, 전송된 신호를 수신측에서 다시 여러 개의 신호로 분리하는 것은?","o":["Multiplexing","MODEM","DSU","CODEC"],"a":0,"im":[],"src":[["20250824",21]],"x":["여러 터미널 신호를 하나의 회선으로 보내고 수신 측에서 다시 나누는 것은 다중화(Multiplexing)다.","다중화가 여러 신호를 한 회선에 싣는 기술이다.","모뎀은 디지털 신호를 아날로그로 변·복조한다.","DSU는 디지털 회선에 단말을 연결하는 장치다.","코덱은 아날로그 음성·영상을 디지털로 부호화·복호화한다."]},{"id":"20250824-25","s":2,"q":"다음 중 여러 가지 주파수 성분을 갖는 신호의 전송에서 각주파수 성분이 다른 지연시간을 가지고 도달하는 경우 발생하는 전송손실은?","o":["감쇠 현상(Attenuation)","위상 왜곡(Phase Distortion)","누화(Crosstalk)","충격성잡음(Impulse Noise)"],"a":1,"im":[],"src":[["20250824",25]],"x":["주파수 성분마다 도착 지연 시간이 달라 생기는 왜곡은 위상(지연) 왜곡이다.","감쇠는 거리에 따라 신호가 약해지는 현상이다.","위상 왜곡은 주파수별 전파 지연 차이로 생긴다.","누화는 인접 선로 신호가 섞이는 현상이다.","충격성 잡음은 번개, 스위칭 등으로 순간적으로 생기는 큰 잡음이다."]},{"id":"20250824-26","s":2,"q":"100BASE-T라고도 불리는 이더넷의 고속 버전으로CSMA/CD 방식을 사용하며, 100Mbps의 전송 속도를 지원하는 이더넷은?","o":["Fast Ethernet","10Gigabit Ethernet","Gigabit Ethernet","Thick Ethernet"],"a":0,"im":[],"src":[["20250824",26]],"x":["100BASE-T, CSMA/CD, 100Mbps는 Fast Ethernet(802.3u)이다.","Fast Ethernet이 100Mbps 이더넷이다.","10기가비트 이더넷은 10Gbps이며 전이중 전용이라 CSMA/CD를 쓰지 않는다.","기가비트 이더넷은 1Gbps다.","Thick Ethernet은 10BASE5(10Mbps)다."]},{"id":"20250824-27","s":2,"q":"다음 중 클라우드 환경 모델(Cloud Deployment Model)로옳지 않은 것은?","o":["public","on-premises","hybrid","private"],"a":1,"im":[],"src":[["20250824",27],["20260802",22]],"x":["클라우드 배포 모델은 public, private, hybrid(그리고 community)다. on-premises는 자체 시설에 직접 구축하는 전통 방식이다.","public은 공용 클라우드다.","on-premises는 클라우드 배포 모델이 아니다.","hybrid는 하이브리드 클라우드다.","private은 사설 클라우드다."]},{"id":"20250824-28","s":3,"q":"아래 지문의 ping 명령어의 결과로 옳지 않은 것은?","o":["ICMP 패킷의 대상(host)은 'icqa.or.kr'이다.","ICMP 패킷을 3번 송신하고 수신하였다.","ICMP 패킷이 왕복한 시간 중 가장 짧은 시간은 7.085ms 이다.","ICMP 패킷이 왕복한 평균 시간은 7.450ms 이다."],"a":3,"im":[83],"src":[["20250824",28],["20260201",32]],"x":["ping 통계에서 rtt min/avg/max가 7.085/7.237/7.450이므로 평균은 7.237ms다. 7.450ms는 최대값이다.","대상 호스트는 icqa.or.kr이다.","3번 보내고 3번 받았다.","최소 시간은 7.085ms다.","7.450ms는 최대값이라 평균이라는 설명은 틀렸다."]},{"id":"20250824-29","s":3,"q":"Linux Shell에서 아래 지문의 요구사항을 만족하는 명령어로옳은 것은?","o":["ls -al ＞ output.txt","ls -al ＜ output.txt","ls -al ＜＜ output.txt","ls -al ＞＞ output.txt"],"a":0,"im":[84],"src":[["20250824",29]],"x":["결과를 파일에 저장하되 덮어쓰고 이어 쓰지 않으려면 > 리다이렉션을 쓴다.","> 는 출력을 파일에 덮어쓴다.","< 는 파일을 입력으로 넣는다.","<< 는 히어 도큐먼트 입력이다.",">> 는 파일 끝에 덧붙인다."]},{"id":"20250824-30","s":3,"q":"서버 담당자 Seo 사원은 Windows Server 2022의 이벤트뷰어를 통해 서버의 상태를 점검하려고 한다. Windows 로그에 해당하는 항목으로 올바른 것은?","o":["하드웨어 이벤트","인터넷 익스플로러","Windows PowerShell","응용 프로그램"],"a":3,"im":[],"src":[["20250824",30]],"x":["이벤트 뷰어의 Windows 로그는 응용 프로그램, 보안, Setup, 시스템, Forwarded Events다.","하드웨어 이벤트는 '응용 프로그램 및 서비스 로그' 아래에 있다.","Internet Explorer 로그도 '응용 프로그램 및 서비스 로그'에 있다.","Windows PowerShell 로그도 '응용 프로그램 및 서비스 로그'에 있다.","응용 프로그램 로그는 Windows 로그다."]},{"id":"20250824-35","s":3,"q":"다음 중 Linux 환경에서 'netstat' 명령어에 사용하는 옵션설명으로 옳지 않은 것은?","o":["-r : 라우팅 테이블을 표시한다.","-p : PID와 사용 중인 프로그램명을 출력한다.","-t : 연결된 이후 시간 정보를 표시한다.","-a : 모든 연결 및 수신 대기 포트를 표시한다."],"a":2,"im":[],"src":[["20250824",35],["20260517",28]],"x":["netstat -t는 TCP 연결만 보여 주는 옵션이다. 연결 이후 시간 정보를 표시하지 않는다.","-r은 라우팅 테이블이다.","-p는 PID와 프로그램 이름이다.","-t는 TCP만 표시하므로 '시간 정보 표시'는 틀렸다.","-a는 모든 연결과 수신 대기 포트를 표시한다."]},{"id":"20250824-37","s":3,"q":"Linux의 vi(Visual Interface) 명령어 중 문자 하나를 삭제할때 사용하는 명령어는?","o":["dd","x","D","dw"],"a":1,"im":[],"src":[["20250824",37]],"x":["vi 명령 모드에서 x는 커서 위치의 문자 하나를 지운다.","dd는 현재 줄 전체를 지운다.","x는 문자 하나를 지운다.","D는 커서부터 줄 끝까지 지운다.","dw는 커서부터 단어 끝까지 지운다."]},{"id":"20250824-38","s":3,"q":"서버 관리자 Park 사원은 Windows Server 2022의 ActiveDirectory에서 도메인 사용자 계정을 관리하기 위해 도메인 사용자 계정을 생성/수정/삭제하려고 한다. 다음 중 도메인 사용자 계정을 관리하기 위한 명령어가 아닌 것은?","o":["dsadd","dsmod","dsrm","net user"],"a":3,"im":[],"src":[["20250824",38]],"x":["dsadd, dsmod, dsrm은 AD 개체를 추가·수정·삭제한다. net user는 주로 로컬 사용자 계정 관리 명령으로 분류된다.","dsadd는 도메인 사용자를 만든다.","dsmod는 도메인 사용자
