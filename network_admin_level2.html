에서 기본 지원이 되었다.","SLAAC 자동 설정이 IPv6의 새 기능이다."]},{"id":"20251102-08","s":1,"q":"IP Address '127.0.0.1' 이 의미하는 것은?","o":["모든 네트워크를 의미한다.","사설 IP Address를 의미한다.","특정 네트워크의 모든 노드를 의미한다.","루프백(Loopback) 테스트용이다."],"a":3,"im":[],"src":[["20251102",8]],"x":["127.0.0.1은 루프백 주소로 자기 자신의 TCP/IP 스택 테스트에 쓴다.","모든 네트워크는 0.0.0.0이다.","사설 IP 대역이 아니다.","네트워크의 모든 노드는 브로드캐스트 주소다.","루프백 테스트용이다."]},{"id":"20251102-09","s":1,"q":"TCP에서 사용하는 흐름 제어 방식은?","o":["GO-Back-N","선택적 재전송(Selective Repeat)","슬라이딩 윈도우(Sliding Window)","Stop-and-Wait(Idle RQ)"],"a":2,"im":[],"src":[["20251102",9]],"x":["TCP는 슬라이딩 윈도우로 흐름 제어를 한다.","Go-Back-N은 오류 제어 ARQ다.","Selective Repeat도 오류 제어 ARQ다.","슬라이딩 윈도우가 TCP 흐름 제어 방식이다.","Stop-and-Wait는 TCP 흐름 제어 방식이 아니다."]},{"id":"20251102-10","s":1,"q":"IPv4 헤더에 포함되지 않는 필드는?","o":["ACK(확인 응답)","Version(버전)","Header Checksum(헤더 체크섬)","Header Length(IHL, 헤더 길이)"],"a":0,"im":[],"src":[["20251102",10]],"x":["ACK는 TCP 헤더 플래그다. IPv4 헤더에는 없다.","ACK는 TCP 헤더에 있다.","Version은 IPv4 헤더 필드다.","Header Checksum은 IPv4 헤더 필드다.","IHL은 IPv4 헤더 필드다."]},{"id":"20251102-11","s":1,"q":"DNS에서 TTL(Time to Live)에 대한 설명으로 올바른 것은??","o":["데이터가 DNS 서버 존(zone) 으로부터 나오기 전에 현재 남은 시간이다.","데이터가 DNS 서버 캐시에서 만료되기까지 남은 시간이다.","패킷이 DNS 서버 존으로부터 나오기 전에 현재 남은 시간이다.","패킷이 DNS 서버 네임 서버 레코드로부터 나오기 전에 현재 남은 시간이다."],"a":1,"im":[],"src":[["20251102",11]],"x":["DNS TTL은 레코드를 캐시에 보관할 수 있는 시간, 즉 캐시에서 만료되기까지 남은 시간이다.","존 원본 데이터는 TTL로 만료되지 않는다.","캐시에서 만료되기까지 남은 시간이 맞다.","패킷의 TTL(IP)과 혼동한 설명이다.","네임서버 레코드와 관계없는 설명이다."]},{"id":"20251102-12","s":1,"q":"UDP에 대한 설명으로 옳지 않은 것은?","o":["TCP에 비해 신뢰성이 떨어진다.","사용자 데이터그램(Datagram)이라고 하는 데이터 단위(Unit)를 송신지의 응용 프로세스에서 수신지의 응용 프로세스로 전송한다.","UDP가 제공하는 오류검사는 홀수 패리티와 짝수 패리티가 있다.","UDP가 제공하는 서비스는 비연결형 데이터 전달서비스(Connectionless Data Delivery Service)이다."],"a":2,"im":[],"src":[["20251102",12]],"x":["UDP의 오류 검사는 16비트 체크섬이다. 홀수·짝수 패리티를 쓰지 않는다.","재전송·확인 응답이 없어 TCP보다 신뢰성이 낮다.","사용자 데이터그램 단위로 응용 프로세스 간에 전송한다.","UDP는 체크섬을 쓰므로 패리티라는 설명은 틀렸다.","UDP는 비연결형 전달 서비스다."]},{"id":"20251102-13","s":1,"q":"신규 단말이 부팅 시 IP가 없는 상태에서 스위치 포트에 연결됐다. 네트워크는 IPv4를 사용하며 중앙에서 주소를 자동 분배한다. MAC 주소를 기반으로 IP를 자동 부여하는 데 주로 쓰이는 기술은?","o":["RARP","ARP","ICMP","DHCP"],"a":3,"im":[],"src":[["20251102",13]],"x":["중앙에서 MAC 주소를 보고 IP를 자동 할당하는 현재 표준 기술은 DHCP다(필요하면 MAC 기반 예약도 가능).","RARP도 MAC으로 IP를 얻지만 지금은 DHCP로 대체된 옛 방식이며 서브넷 마스크 등 다른 설정을 줄 수 없다.","ARP는 IP로 MAC을 찾는다.","ICMP는 오류·진단 메시지다.","DHCP가 중앙에서 IP를 자동 분배한다."]},{"id":"20251102-15","s":1,"q":"OSPF(Open Shortest Path First)에 대한 설명으로 옳지 않은 것은?","o":["AS 내부 경로 정보 교환에 사용되는 링크 스테이트 라우팅 프로토콜이다.","Hello 패킷으로 이웃 라우터의 정상 동작을 확인한다.","비용이 가장 낮은 단일 경로만 사용하며 다른 경로는 배제한다.","일반적으로 IP 버전에 따라 사용하는 OSPF 버전이 다르다."],"a":2,"im":[],"src":[["20251102",15],["20260517",13]],"x":["OSPF는 비용이 같은 경로가 여러 개면 동시에 사용하는 ECMP(동일 비용 다중 경로) 부하 분산을 지원한다.","AS 내부에서 쓰는 링크 상태 프로토콜이다.","Hello 패킷으로 이웃 상태를 확인한다.","같은 비용의 경로 여러 개를 함께 쓸 수 있으므로 '단일 경로만'은 틀렸다.","IPv4는 OSPFv2, IPv6는 OSPFv3를 쓴다."]},{"id":"20251102-16","s":1,"q":"사내 스트리밍 서비스가 IPv4 멀티캐스트로 배포된다. 클라이언트 PC가 채널을 바꿀 때마다 스위치/라우터에 그룹 가입·탈퇴 신호가 전달되어 트래픽이 즉시 조정된다. 이때 사용되는 프로토콜은?","o":["ICMP","IGMP","ARP","RARP"],"a":1,"im":[],"src":[["20251102",16],["20260201",16]],"x":["멀티캐스트 그룹 가입(Join)·탈퇴(Leave)를 라우터·스위치에 알리는 프로토콜은 IGMP다(스위치는 IGMP 스누핑 사용).","ICMP는 오류·진단 메시지다.","IGMP가 멀티캐스트 그룹 가입·탈퇴를 알린다.","ARP는 IP로 MAC을 찾는다.","RARP는 MAC으로 IP를 찾는다."]},{"id":"20251102-17","s":1,"q":"Ping에 대한 설명 중 옳지 않은 것은?","o":["ICMP(인터넷 프로토콜군) 기반의 진단용 응용 프로그램이다.","원격 호스트까지 왕복 지연 시간(RTT)을 측정할 수 있다.","원격 호스트의 네트워크 오류를 확인하고 오류를 정정해 준다.","원격 호스트와의 연결 상태를 진단할 수 있다."],"a":2,"im":[],"src":[["20251102",17]],"x":["ping은 연결 상태와 RTT를 '진단'할 뿐 오류를 정정하지 않는다.","ICMP Echo 기반 진단 도구다.","왕복 지연 시간(RTT)을 측정한다.","오류를 정정해 주지 않으므로 틀린 설명이다.","원격 호스트와의 연결 상태를 진단한다."]},{"id":"20251102-18","s":2,"q":"OSI 7계층 중 데이터 링크 계층의 기능으로 옳지 않은 것은?","o":["통신 프로토콜을 정의한 OSI 7계층 중 세 번째 계층에 해당한다.","비트열을 프레임화한다.","전송 과정의 오류를 검출한다.","흐름 제어를 통해 데이터 링크 개체 간 트래픽을 제어한다."],"a":0,"im":[],"src":[["20251102",18]],"x":["데이터 링크 계층은 OSI의 2계층이다.","데이터 링크 계층은 2계층이므로 '세 번째'는 틀렸다.","비트를 프레임으로 만든다.","전송 오류를 검출한다.","흐름 제어를 한다."]},{"id":"20251102-19","s":2,"q":"패킷 교환망의 특징으로 옳지 않은 것은?","o":["연결 설정 방식에 따라 가상 회선과 데이터그램으로 분류된다.","메시지를 더 짧은 길이의 패킷으로 분할하여 전송한다.","망에 유입되는 데이터의 양이 많아질수록 전송 속도가 빨라진다.","회선 차단(호 차단)과 같은 블로킹 현상이 없다."],"a":2,"im":[],"src":[["20251102",19]],"x":["패킷 교환망은 트래픽이 많아지면 대기 지연이 늘어 오히려 느려진다.","가상 회선과 데이터그램 방식이 있다.","메시지를 패킷으로 나눠 보낸다.","데이터가 많을수록 빨라진다는 설명은 틀렸다.","회선 교환의 호 차단(블로킹)이 없다."]},{"id":"20251102-20","s":2,"q":"다음은 화상 회의를 하기 위한 기술에 관한 내용이다. ( A )안에 들어가는 용어 중 옳은 것은?","o":["IRC (Internet Relay Chat)","HEVC/H.265 (High Efficiency Video Coding)","MIME (Multipurpose Internet Mail Extensions)","SIP (Session Initiation Protocol)"],"a":3,"im":[87],"src":[["20251102",20]],"x":["화상 회의·VoIP에서 세션을 설정·변경·종료하는 신호 프로토콜은 SIP다.","IRC는 텍스트 채팅 프로토콜이다.","HEVC는 영상 압축 코덱이다.","MIME은 메일 첨부 형식 규격이다.","SIP는 멀티미디어 세션 제어 프로토콜이다."]},{"id":"20251102-22","s":2,"q":"VPN에 대한 설명으로 (A)에 알맞은 용어는?","o":["PPTP","L2TP","IPsec","SSL/TLS"],"a":2,"im":[88],"src":[["20251102",22],["20260802",24]],"x":["OSI 3계층에서 동작하며 전송 모드와 터널 모드를 제공하는 VPN 프로토콜은 IPsec이다.","PPTP는 2계층 터널링이다.","L2TP는 2계층 터널링이다.","IPsec은 3계층 VPN 프로토콜이다.","SSL/TLS VPN은 상위 계층에서 동작한다."]},{"id":"20251102-23","s":2,"q":"에러제어 기법 중 자동 재전송 기법으로 옳지 않은 것은?","o":["Stop and Wait ARQ","Go-Back N ARQ","Forward Error Correction(FEC)","Selective Repeat ARQ"],"a":2,"im":[],"src":[["20251102",23]],"x":["FEC(전진 오류 정정)는 재전송 없이 수신 측이 스스로 오류를 고치는 방식이라 ARQ(자동 재전송)가 아니다.","Stop and Wait ARQ는 재전송 방식이다.","Go-Back-N ARQ는 재전송 방식이다.","FEC는 재전송 없이 정정하므로 ARQ가 아니다.","Selective Repeat ARQ는 재전송 방식이다."]},{"id":"20251102-24","s":2,"q":"다음 중 하나의 물리적인 스위치를 논리적인 방법을 사용하여 여러 개의 스위치로 분리하는 기술은?","o":["STM","ATM","ALOHA","VLAN"],"a":3,"im":[],"src":[["20251102",24]],"x":["VLAN은 하나의 물리 스위치를 논리적으로 여러 스위치(브로드캐스트 도메인)처럼 나눈다.","STM은 동기식 전송 모드(SDH 다중화)다.","ATM은 53바이트 셀 기반 교환 방식이다.","ALOHA는 무작위 접근 방식의 초기 무선 프로토콜이다.","VLAN이 스위치를 논리적으로 분리한다."]},{"id":"20251102-25","s":2,"q":"IEEE 802.11 표준은 꾸준히 발전하며 무선 네트워크 속도와 효율성을 높여 왔다. 다음 중 다중 안테나 기반 MIMO를 사용하면서, 혼잡 환경에서도 OFDMA·DL/UL MU-MIMO 등으로 고해상도(4K/8K) 스트리밍·AR/VR·온라인 게임 같은 고대역폭 서비스를 안정적으로 처리할 수 있는 표준은?","o":["IEEE 802.11n","IEEE 802.11ac","IEEE 802.11ad","IEEE 802.11ax"],"a":3,"im":[],"src":[["20251102",25]],"x":["OFDMA와 DL/UL MU-MIMO로 혼잡 환경에서 효율을 높인 표준은 802.11ax(와이파이 6)다.","802.11n은 MIMO를 처음 도입했지만 OFDMA·MU-MIMO가 없다.","802.11ac는 하향(DL) MU-MIMO만 지원하고 OFDMA가 없다.","802.11ad는 60GHz WiGig 규격이다.","802.11ax가 OFDMA, 상·하향 MU-MIMO를 지원한다."]},{"id":"20251102-26","s":2,"q":"1000BASE-T 규격에 대한 설명으로 틀린 것은?","o":["최대 전송 속도는 1000 Kb/s이다.","스위치 중심의 스타형 토폴로지가 일반적이다.","전송 매체는 UTP(비차폐 꼬임쌍선)이다.","주로 이더넷(IEEE 802.3ab)에서 사용된다."],"a":0,"im":[],"src":[["20251102",26]],"x":["1000BASE-T의 최대 속도는 1000Mbps(1Gbps)다. 1000Kb/s(1Mbps)가 아니다.","단위가 틀렸다. 1000Mb/s가 맞다.","스위치 중심의 스타형 구성이 일반적이다.","CAT.5e 이상 UTP를 쓴다.","IEEE 802.3ab 규격이다."]},{"id":"20251102-27","s":2,"q":"클라우드 담당자 Kim 사원은 서버리스 컴퓨팅 구성에 대해검토하고 있다. 서버리스 컴퓨팅에 대한 설명으로 옳지 않은 것은?","o":["클라우드 서비스 제공자가 인프라를 관리하므로, 직접적인 서버 관리를 하지 않아도 된다.","실제 배포된 서비스의 코드가 실행되는 시점에 사용한 자원량에 따라 요금이 계산된다.","필요에 따라 컴퓨팅 자원이 자동으로 확장·축소(오토스케일링)된다.","서버리스 컴퓨팅에서는 사용자가 서버 인스턴스 프로비저닝과 OS 패치를 직접 관리해야 한다."],"a":3,"im":[],"src":[["20251102",27]],"x":["서버리스는 클라우드 제공자가 서버 프로비저닝과 OS 패치를 맡는다. 사용자는 코드만 관리한다.","제공자가 인프라를 관리한다.","실행된 만큼 요금을 낸다.","자동으로 확장·축소된다.","사용자가 서버·OS를 직접 관리한다는 설명은 틀렸다."]},{"id":"20251102-29","s":3,"q":"Windows Server 2022의 Hyper-V에 대한 특징으로 옳은것은?","o":["가상 컴퓨터를 다른 서버로 복제할 수 없다.","가상 하드 디스크를 실행 중에도 다른 저장소로 이동할 수 있다.","하나의 물리 서버에는 하나의 가상 컴퓨터만 사용할 수 있다.","가상 컴퓨터를 사용할수록 물리 서버의 하드웨어 자원 사용률은 낮아진다."],"a":1,"im":[],"src":[["20251102",29],["20260201",33]],"x":["Hyper-V는 저장소 실시간 마이그레이션으로 실행 중인 VM의 가상 디스크를 다른 저장소로 옮길 수 있다.","Hyper-V 복제본으로 다른 서버에 복제할 수 있다.","실행 중에도 가상 디스크를 이동할 수 있다.","여러 VM을 실행할 수 있다.","VM이 늘수록 자원 사용률은 높아진다."]},{"id":"20251102-30","s":3,"q":"서버 관리자 Kim 사원이 Linux 서버의 '/root' 디렉터리를점검하던 중 '/etc/passwd' 파일이 '/root' 디렉터리에 복사된 것을 발견했다. '/root/passwd' 파일을 삭제하려 했으나 삭제되지 않았다. (A) 명령어로 파일 속성을 확인한 결과, 해당 파일에 'i' 속성이 설정되어 쓰기 및 삭제가 불가한 것을 확인했다. 해당 명령어 (A)는?","o":["file","stat","lsattr","lsblk"],"a":2,"im":[89],"src":[["20251102",30]],"x":["lsattr는 chattr로 설정한 확장 속성(i: 변경 불가, a: 추가만 가능)을 보여 준다.","file은 파일 종류를 판별한다.","stat은 inode 정보를 보여 주지만 i 속성은 보여 주지 않는다.","lsattr로 i 속성을 확인한다.","lsblk는 블록 장치 목록이다."]},{"id":"20251102-31","s":3,"q":"Linux 시스템에서 기존에 설정된 'crontab'을 삭제하려고 할때 올바른 명령어는?","o":["crontab –u","crontab -e","crontab –l","crontab -r"],"a":3,"im":[],"src":[["20251102",31],["20260517",30]],"x":["crontab -r은 현재 사용자의 crontab을 삭제한다.","-u는 사용자 지정 옵션이다.","-e는 편집이다.","-l은 목록 출력이다.","-r이 삭제다."]},{"id":"20251102-33","s":3,"q":"DNS에서 지원하는 레코드 형식 중 역방향조회에 사용되는레코드는?","o":["A","AAAA","PTR","SOA"],"a":2,"im":[],"src":[["20251102",33],["20260802",28]],"x":["PTR 레코드는 IP 주소를 도메인 이름으로 바꾸는 역방향 조회에 쓰인다.","A는 이름 → IPv4(정방향)다.","AAAA는 이름 → IPv6(정방향)다.","PTR이 IP → 이름(역방향)이다.","SOA는 영역의 시작과 관리 정보를 담는다."]},{"id":"20251102-34","s":3,"q":"Linux Apache 웹서버에 사용자가 접속한 뒤 80초 동안 추가 요청이 없으면 연결을 종료하도록 'httpd.conf'에서 설정하는 옵션은?","o":["Timeout 80","KeepAlive On","KeepAliveTimeout 80","MaxKeepAliveRequests 80"],"a":2,"im":[],"src":[["20251102",34]],"x":["KeepAliveTimeout은 지속 연결에서 다음 요청을 기다리는 시간이다. 80으로 두면 80초간 요청이 없을 때 연결을 끊는다.","Timeout은 요청 수신·응답 처리 전체의 대기 시간 한도다.","KeepAlive On은 지속 연결 사용 여부만 정한다.","KeepAliveTimeout 80이 요구 조건과 맞다.","MaxKeepAliveRequests는 연결 하나에서 처리할 최대 요청 수다."]},{"id":"20251102-38","s":3,"q":"Windows Server 2022가 설치된 컴퓨터는 항상 가동하는것이 일반적인 용도이기 때문에 서버 담당자 Park 사원은 시스템을 종료할 때마다 그 이유를 명확히 하여 시스템을 좀 더 안정적으로 운영하고자 한다. 다음 중 이전에 종료 또는 재부팅된 기록을 확인할 수 있는 항목은?","o":["성능모니터","이벤트뷰어","로컬보안정책","그룹정책편집기"],"a":1,"im":[],"src":[["20251102",38]],"x":["종료·재부팅 기록과 사유(이벤트 ID 1074, 6006, 6008)는 이벤트 뷰어의 시스템 로그에서 확인한다.","성능 모니터는 성능 카운터를 측정한다.","이벤트 뷰어에서 종료·재부팅 기록을 본다.","로컬 보안 정책은 보안 설정 도구다.","그룹 정책 편집기는 정책 설정 도구다."]},{"id":"20251102-39","s":3,"q":"Linux에서 현재 사용 디렉터리 위치에 상관없이 자신의HOME Directory로 이동하는 명령은?","o":["cd HOME","cd /","cd ../HOME","cd ~"],"a":3,"im":[],"src":[["20251102",39]],"x":["~(틸드)는 현재 사용자의 홈 디렉터리를 뜻하므로 cd ~(또는 그냥 cd)로 어디서든 홈으로 이동한다.","cd HOME은 현재 위치의 HOME이라는 하위 디렉터리로 가려는 명령이다.","cd /는 루트 디렉터리로 이동한다.","cd ../HOME은 상위 디렉터리의 HOME 폴더로 가려는 명령이다.","cd ~가 홈 디렉터리로 이동한다."]},{"id":"20251102-40","s":3,"q":"네트워크를 관리하는 Kim 사원은 네트워크 연결을 구축하거나 문제를 해결할 때 패킷이 출발지에서 목적지까지 가는 경로를 살펴볼 수 있도록 네트워크 명령어를 사용하고자 한다. 이 명령은 'tracert'에서 수행하는 동일한 정보를 보여주면서 홉과 다른 세부 정보 사이의 시간에 관한 정보를 출력이 끝날 때까지 저장한다. Kim 사원이 사용할 명령어는?","o":["ping","nslookup","pathping","nbtstat"],"a":2,"im":[],"src":[["20251102",40],["20260517",31]],"x":["pathping은 tracert처럼 경로를 보여 준 뒤 홉별 지연과 손실 통계를 모아 출력한다.","ping은 목적지 왕복 시간만 보여 준다.","nslookup은 DNS 조회 도구다.","pathping이 경로 + 홉별 통계 도구다.","nbtstat은 NetBIOS 상태 도구다."]},{"id":"20251102-41","s":3,"q":"네트워크관리사 Kim 사원은 Windows Server 2022에서 IIS웹 서버를 설치하고 다양한 기능을 활용하려고 한다. 다음 중 IIS에서 제공하는 기능으로 올바른 것은?","o":["요청 필터링(Request Filtering)을 통해 특정 요청을 차단할 수 있다.","IIS는 HTTPS 프로토콜을 지원하지 않는다.","IIS는 PHP 스크립트를 실행할 수 없다.","응용 프로그램 풀(App Pool)은 하나의 웹 사이트만 호스팅할 수 있다."],"a":0,"im":[],"src":[["20251102",41]],"x":["IIS의 요청 필터링으로 특정 확장자, URL, 동사, 크기의 요청을 차단할 수 있다.","요청 필터링으로 특정 요청을 차단할 수 있다.","IIS는 HTTPS 바인딩을 지원한다.","FastCGI로 PHP를 실행할 수 있다.","응용 프로그램 풀 하나에 여러 사이트를 올릴 수 있다."]},{"id":"20251102-42","s":3,"q":"네트워크관리사 Park 사원은 Windows Server 2022에서DNS 서버를 운영하며 고급 기능을 활용하려고 한다. 다음 중 DNSSEC(DNS 보안 확장)에 대한 설명으로 올바른 것은?","o":["DNSSEC는 DNS 서버의 성능을 향상시키는 캐싱 메커니즘이다.","DNSSEC를 사용하면 DNS 쿼리 응답의 무결성과 출처 인증을 제공할 수 있다.","DNSSEC는 Windows Server 2022에서 지원되지 않는다.","DNSSEC를 활성화하면 모든 DNS 쿼리가 자동으로 암호화된다."],"a":1,"im":[],"src":[["20251102",42]],"x":["DNSSEC는 전자 서명으로 DNS 응답이 변조되지 않았고(무결성) 정당한 출처에서 왔음(출처 인증)을 검증한다.","DNSSEC는 캐싱·성능 향상 기술이 아니다.","DNSSEC는 응답의 무결성과 출처를 인증한다.","Windows Server 2022는 DNSSEC를 지원한다.","DNSSEC는 서명만 할 뿐 질의를 암호화하지 않는다(암호화는 DoH, DoT)."]},{"id":"20251102-43","s":3,"q":"네트워크관리사 Park 사원은 Windows Server 2022에서DHCP 서버를 운영하고 있다. 다음 중 DHCP 서버 운영에 대한 설명으로 올바른 것은?","o":["DHCP 서버는 반드시 Active Directory 환경에서만 구성할 수 있다.","DHCP 서버는 IP 주소를 자동으로 할당하기 위해 반드시 정적 IP 풀을 사용해야 한다.","DHCP 클라이언트는 부팅 시 IP 할당을 위해 DHCP 서버를 찾는 브로드캐스트를 전송한다.","DHCP 서버의 기본 포트는 53번이며, DNS와 동일하다."],"a":2,"im":[],"src":[["20251102",43]],"x":["DHCP 클라이언트는 IP가 없으므로 부팅 시 DHCP Discover를 브로드캐스트해 서버를 찾는다.","AD 없이도 DHCP 서버를 구성할 수 있다(AD 환경에서는 권한 부여 필요).","DHCP는 '동적' 주소 풀(범위)에서 할당한다.","클라이언트는 Discover 브로드캐스트로 서버를 찾는다.","DHCP 포트는 UDP 67(서버)/68(클라이언트)이다. 53은 DNS다."]},{"id":"20251102-44","s":3,"q":"다음 지문에서 설명하는 명령어로 옳은 것은?","o":["pgrep python","ps -ef | grep python","ss -tulpn | grep python","top -b –n 1"],"a":1,"im":[90],"src":[["20251102",44]],"x":["ps -ef는 모든 프로세스를 PID, PPID, 시작 시간, 실행 명령과 함께 보여 주므로 grep python으로 걸러 요구 정보를 모두 확인할 수 있다.","pgrep python은 PID만 출력한다.","ps -ef | grep python은 PID, PPID, 시간, 명령어를 모두 보여 준다.","ss -tulpn은 열린 소켓(포트)만 보여 준다.","top -b -n 1은 전체 프로세스 스냅숏이며 PPID가 기본 표시되지 않고 python만 거르지도 않는다."]},{"id":"20251102-45","s":3,"q":"Windows Server 2022에서 관리자 권한으로 명령 프롬프트를 실행한 뒤 'netstat'로 열린 포트와 연관된 실행 파일(프로세스)을 확인하려고 한다. 어떤 옵션을 사용해야 하는가?","o":["netstat –b","netstat -p","netstat –a","netstat -n"],"a":0,"im":[],"src":[["20251102",45]],"x":["Windows netstat -b는 각 연결이나 수신 대기 포트를 만든 실행 파일 이름을 보여 준다(관리자 권한 필요).","-b가 연관 실행 파일을 보여 준다.","Windows에서 -p는 프로토콜을 지정하는 옵션이다(리눅스의 -p와 다르다).","-a는 모든 연결과 수신 대기 포트를 보여 준다.","-n은 주소와 포트를 숫자로 보여 준다."]},{"id":"20251102-47","s":4,"q":"게이트웨이(Gateway)에 대한 설명으로 옳지 않은 것은?","o":["게이트웨이는 L2 스위치와 같이 프레임만 중계한다.","두 개의 완전히 다른 네트워크 사이의 데이터 형식을 변환하는 장치이다.","데이터 변환의 기능을 가지고 있어 네트워크 내의 병목 현상을 일으키는 지점이 될 수 있다.","프로토콜이 다른 네트워크 환경들을 연결할 수 있는 기능을 제공한다."],"a":0,"im":[],"src":[["20251102",47]],"x":["게이트웨이는 서로 다른 프로토콜 네트워크를 연결하며 상위 계층까지 변환한다. 프레임만 중계하는 것은 L2 스위치·브리지다.","프레임만 중계한다는 설명은 틀렸다.","다른 네트워크 간 데이터 형식을 변환한다.","변환 처리 때문에 병목이 될 수 있다.","프로토콜이 다른 네트워크를 연결한다."]},{"id":"20251102-48","s":4,"q":"다음 지문은 L4 스위치(로드 밸런서)의 기능에 대한 설명이다. L4 스위치의 기본 기능이 아닌 것은?","o":["서버의 상태를 확인하는 헬스 체크(Health Check) 기능","알고리즘에 따른 분산 처리","NAT(Network Address Translation)","애플리케이션(Application) 계층의 보안 기능 제공"],"a":3,"im":[],"src":[["20251102",48]],"x":["L4 스위치의 기본 기능은 헬스 체크, 분산 알고리즘, NAT 등이다. 응용 계층 보안 기능은 L7 스위치나 WAF의 영역이다.","헬스 체크로 서버 상태를 확인한다.","라운드 로빈 등 알고리즘으로 분산한다.","가상 IP를 실제 서버 IP로 바꾸는 NAT를 한다.","응용 계층 보안은 L4 스위치의 기본 기능이 아니다."]},{"id":"20251102-49","s":4,"q":"NAT(Network Address Translation)에 대한 설명으로 옳지않은 것은?","o":["정적 NAT는 내부 사설 IP를 공인 IP와 1:1로 매핑하는 방식이다.","NAT는 프레임 단위로 처리되는 데이터 링크 계층(L2)의 주소 변환 기술이다.","PAT(포트 주소 변환)은 다수의 사설 IP가 하나의 공인 IP의 서로 다른 포트로 매핑되어 인터넷 접속을 공유할 수 있다.","NAT는 내부 주소 구조를 외부에 직접 노출하지 않아 보안상 이점을 제공한다."],"a":1,"im":[],"src":[["20251102",49]],"x":["NAT는 IP 주소(3계층, PAT는 4계층 포트까지)를 바꾸는 기술이다. L2 프레임 단위 기술이 아니다.","정적 NAT는 사설–공인 1:1 매핑이다.","NAT는 3계층 IP 주소 변환이므로 L2라는 설명은 틀렸다.","PAT는 여러 사설 IP를 하나의 공인 IP의 다른 포트로 매핑한다.","내부 주소를 숨겨 보안 이점이 있다."]},{"id":"20251102-50","s":4,"q":"다음 (A) 안에 들어가는 용어 중 옳은 것은?","o":["L2 Switch","IP 공유기","UPS","PoE Switch"],"a":3,"im":[91],"src":[["20251102",50]],"x":["UTP 케이블로 데이터와 전원(DC 48V)을 함께 공급해 AP나 CCTV에 쓰는 장비는 PoE 스위치다.","일반 L2 스위치는 전원을 주지 않는다.","IP 공유기는 NAT 장비다.","UPS는 무정전 전원 장치다.","PoE 스위치가 랜선으로 전원을 공급한다."]},{"id":"20260201-04","s":1,"q":"FTP 및 TFTP의 특징으로 옳은 것은?","o":["TFTP는 단순화된 파일의 전송을 위한 프로토콜이며 기본포트는 25번이다.","FTP의 접속에는 계정 접속만 가능하다.","TFTP의 단점은 UDP방식으로 Data 전송 시 데이터 손실가능성이 있다.","FTP는 대량의 데이터를 고속 전송하기 위해 UDP를 사용한다."],"a":2,"im":[],"src":[["20260201",4]],"x":["TFTP는 UDP 69번을 써서 신뢰성 제어가 없으므로 데이터 손실 가능성이 있다.","TFTP 포트는 69번이다.","FTP는 익명 접속도 지원한다.","UDP 기반이라 손실 가능성이 있다.","FTP는 TCP를 쓴다."]},{"id":"20260201-05","s":1,"q":"ICMP(Internet Control Message Protocol)에 대한 설명 중틀린 것은?","o":["비대칭 프로토콜이고 TTL(Time To Live)를 제공한다.","ICMPv4(Internet Control Message Protocol) 메시지의 특징은 질의메시지가 있다.","ICMP(Internet Control Message Protocol)의 주된 기능은 IP 데이터그램의 프로세싱을 동작하는 동안 오류를 보고한다.","호스트간 신뢰성을 확보하기 위해 반향과 회답메시지를 지원한다."],"a":0,"im":[],"src":[["20260201",5]],"x":["TTL은 IP 헤더가 제공한다. ICMP 설명으로 '비대칭 프로토콜, TTL 제공'은 맞지 않다.","ICMP 특징으로 TTL 제공은 틀린 설명이다.","ICMP에는 오류 보고 메시지와 질의 메시지가 있다.","IP 처리 중 생긴 오류를 보고한다.","Echo Request/Reply로 도달 가능성을 확인한다."]},{"id":"20260201-07","s":1,"q":"DNS 서비스에서 사용되는 레코드의 설명으로 올바른 것은?","o":["A 레코드","PTR 레코드","SOA 레코드","MX 레코드"],"a":2,"im":[92],"src":[["20260201",7]],"x":["존 파일의 첫 번째 레코드이고, 도메인 이름 필드와 일련번호(Serial)로 영역 파일 갱신 여부를 확인하는 것은 SOA 레코드다.","A 레코드는 이름–IPv4 매핑이다.","PTR은 역방향 조회 레코드다.","SOA는 존의 시작 레코드로 일련번호 등 관리 정보를 담는다.","MX는 메일 서버 레코드다."]},{"id":"20260201-09","s":1,"q":"아래에서 설명하는 기술의 명칭은?","o":["Bluetooth Low Energy(BLE)","Z-Wave","Zigbee","Wi-Fi HaLow(802.11ah)"],"a":2,"im":[93],"src":[["20260201",9]],"x":["IEEE 802.15.4의 PHY/MAC 위에 상위 프로토콜까지 규격화한 저전력·저비용 근거리 무선 기술은 Zigbee다.","BLE는 블루투스 저전력 규격(802.15.1 계열)이다.","Z-Wave는 802.15.4가 아닌 독자 규격의 홈 오토메이션 기술이다.","Zigbee가 802.15.4 기반이다.","Wi-Fi HaLow는 1GHz 이하 대역의 802.11ah다."]},{"id":"20260201-15","s":1,"q":"다음 중 사설IP 주소(Private address) 대역에 해당하지 않는 것은?","o":["10.168.24.2","172.17.210.21","182.0.2.1","192.168.177.7"],"a":2,"im":[],"src":[["20260201",15]],"x":["사설 대역은 10/8, 172.16/12, 192.168/16이다. 182.0.2.1은 공인 주소다.","10.x.x.x는 사설 대역이다.","172.17.x.x는 172.16~31 사설 대역이다.","182.0.2.1은 사설 대역이 아니다.","192.168.x.x는 사설 대역이다."]},{"id":"20260201-17","s":1,"q":"UDP에 대한 설명으로 옳지 않은 것은?","o":["한 컴퓨터에서 다른 컴퓨터로 데이터그램이라고 불리는 실제 데이터 단위를 받기 위해 IP를 사용한다.","메시지를 패킷으로 나누고, 반대편에서 재조립하는 서비스는 제공하지 않는다.","도착하는 데이터 패킷들의 순서를 제공하지 않는다.","FTP는 UDP를 사용하는 대표적인 프로토콜이다."],"a":3,"im":[],"src":[["20260201",17]],"x":["FTP는 TCP(20, 21)를 쓴다. UDP를 쓰는 대표 프로토콜은 DNS, DHCP, TFTP, SNMP다.","UDP는 IP를 이용해 데이터그램을 전달한다.","분할·재조립 서비스를 제공하지 않는다.","순서를 보장하지 않는다.","FTP는 TCP를 쓰므로 틀린 설명이다."]},{"id":"20260201-23","s":2,"q":"다음 중 여러 주파수 성분을 갖는 신호 전송에서 각 주파수성분이 서로 다른 지연 시간으로 도달할 때 발생하는 전송 왜곡은?","o":["감쇠 현상(Attenuation)","위상 왜곡(Phase Distortion)","누화(Crosstalk)","충격성 잡음(Impulse Noise)"],"a":1,"im":[],"src":[["20260201",23]],"x":["주파수 성분마다 지연 시간이 달라 생기는 왜곡은 위상(지연) 왜곡이다.","감쇠는 신호 세기가 약해지는 현상이다.","위상 왜곡이 주파수별 지연 차이로 생긴다.","누화는 인접 선로 신호 혼입이다.","충격성 잡음은 순간적인 큰 잡음이다."]},{"id":"20260201-24","s":2,"q":"클라우드 컴퓨팅의 특징으로 옳지 않은 것은?","o":["사용자는 필요한 만큼의 서버, 네트워크, 저장장치 등과 같은 컴퓨팅 능력을 활용할 수 있다.","사용자 요구에 따라 물리 자원과 가상 자원들이 동적으로 할당/재할당 된다.","서비스 형태에 따라 적절한 미터링을 활용하여 자동으로 자원의 사용을 제어하고 최적화한다.","제공자의 컴퓨팅 자원들은 다수의 사용자들을 지원하기 위하여 단일 임차인(single-tenant) 모델의 자원 풀(pool) 형태로 운영된다."],"a":3,"im":[],"src":[["20260201",24]],"x":["클라우드 자원은 여러 사용자가 함께 쓰는 다중 임차인(Multi-tenant) 모델로 운영된다.","필요한 만큼 자원을 쓴다.","자원이 동적으로 할당된다.","미터링으로 사용량을 측정·최적화한다.","단일 임차인이라는 설명은 틀렸다."]},{"id":"20260201-25","s":2,"q":"기가비트 이더넷(Gigabit Ethernet, 1 Gbps)에서 광케이블을 사용하는 전송 규격은?","o":["1000BASE-SX","1000BASE-T","10GBASE-T","2.5GBASE-T"],"a":0,"im":[],"src":[["20260201",25]],"x":["1000BASE-SX는 단파장 레이저와 멀티모드 광섬유를 쓰는 기가비트 이더넷 규격이다.","1000BASE-SX가 광케이블 규격이다.","1000BASE-T는 UTP 구리선이다.","10GBASE-T는 10Gbps UTP 규격이다.","2.5GBASE-T는 2.5Gbps UTP 규격이다."]},{"id":"20260201-26","s":2,"q":"VTP(VLAN Trunking Protocol)에는 3가지 모드가 있다. 이에 해당하지 않는 것은?","o":["server mode","client mode","transparent mode","interface mode"],"a":3,"im":[],"src":[["20260201",26]],"x":["VTP 모드는 서버, 클라이언트, 투명(transparent) 모드다(v3에는 off도 있다). interface 모드는 없다.","서버 모드는 VLAN을 만들고 수정·삭제하며 정보를 전파한다.","클라이언트 모드는 받은 VLAN 정보를 적용만 한다.","투명 모드는 VTP 정보를 전달만 하고 자기 설정에 반영하지 않는다.","interface mode는 VTP 모드가 아니다."]},{"id":"20260201-27","s":2,"q":"한 사무실의 802.11ax 무선 LAN에서 충돌을 줄이기 위해송신 전 채널을 탐색하고, 필요 시 랜덤 백오프를 수행하며, RTS/CTS를 옵션으로 사용하는 매체 접근 제어 방식은?","o":["CSMA/CD","CSMA/CA","TDMA","토큰 패싱"],"a":1,"im":[],"src":[["20260201",27]],"x":["무선 LAN은 송신 전 채널을 감지하고 랜덤 백오프로 충돌을 피하며 RTS/CTS를 선택적으로 쓰는 CSMA/CA를 사용한다.","CSMA/CD는 유선 이더넷의 충돌 검출 방식이다.","CSMA/CA가 무선 LAN의 충돌 회피 방식이다.","TDMA는 시간 슬롯 분할 다중 접속이다.","토큰 패싱은 토큰을 가진 노드만 전송한다."]},{"id":"20260201-29","s":3,"q":"다음 중 2 TB 이상의 신규 디스크를 GPT로 파티셔닝하기에 가장 적절한 명령어는?","o":["fdisk","mkfs","gdisk","mount"],"a":2,"im":[],"src":[["20260201",29]],"x":["gdisk는 GPT 파티션 테이블용 도구로 2TB 이상 디스크를 나누는 데 알맞다(parted도 가능).","fdisk는 전통적으로 MBR용이며 MBR은 2TB까지만 지원한다.","mkfs는 파일 시스템 생성 명령이다.","gdisk가 GPT 파티셔닝 도구다.","mount는 장치 연결 명령이다."]},{"id":"20260201-30","s":3,"q":"아래 지문의 내용은 Linux의 BIND 시스템 운영을 위한 '/etc/named.conf'의 option 지시자의 내용이다. 다음 중 옳지 않은 것은?","o":["외부에서 오는 query에 대한 IP 대역을 모두 허용한다.","유효성 검사 시 오류가 발생하지 않는다.","53번 포트에 대해서 외부 접근을 허용한다.","slave에서 zone파일이 동기화 될때 text 형태로 변환한다."],"a":1,"im":[94],"src":[["20260201",30]],"x":["options에 DNSSEC 유효성 검사 설정이 없으므로 '유효성 검사 시 오류가 발생하지 않는다'는 지문으로 판단할 수 없는 틀린 설명이다.","allow-query { any; }로 모든 대역의 질의를 허용한다.","유효성 검사 관련 설정이 없어 옳지 않은 설명이다.","listen-on port 53 { any; }로 53번 포트를 연다.","masterfile-format text로 slave 존 파일을 텍스트로 저장한다."]},{"id":"20260201-35","s":3,"q":"Linux 시스템 관리자는 John 사원의 계정인 'John'의 암호정책을 변경하기 위해 아래 지문과 같이 입력하였다. 10일 전 암호 변경 경고를 위한 명령으로 ( )안에 알맞은 옵션은?","o":["-m 10","-L 10","-i 10","-W 10"],"a":3,"im":[95],"src":[["20260201",35]],"x":["chage -W 10은 암호 만료 10일 전부터 경고한다.","-m은 최소 사용 일수다.","대문자 L은 chage 옵션이 아니다.","-I(대문자 i)는 만료 후 비활성화 일수다.","-W가 경고 일수다."]},{"id":"20260201-40","s":3,"q":"Windows Server 2022에 설치된 DNS에서 지원하는 레코드형식 중 실제 도메인 이름과 연결되는 가상 도메인 이름의 레코드 형식은?","o":["CNAME","MX","A","PTR"],"a":0,"im":[],"src":[["20260201",40]],"x":["CNAME은 실제 이름에 연결된 별칭(가상 이름) 레코드다.","CNAME이 별칭 레코드다.","MX는 메일 서버 레코드다.","A는 이름–IPv4 레코드다.","PTR은 역방향 레코드다."]},{"id":"20260201-41","s":3,"q":"DHCP로부터 새로운 IP 주소를 갱신(재할당) 받기 위해 사용하는 Windows 명령어 옵션은?","o":["ipconfig /renew","ipconfig /release","ipconfig /flushdns","ipconfig /setclassid"],"a":0,"im":[],"src":[["20260201",41]],"x":["ipconfig /renew는 DHCP 서버에 IP 갱신·재할당을 요청한다.","/renew가 갱신이다.","/release는 반납이다.","/flushdns는 DNS 캐시 삭제다.","/setclassid는 클래스 ID 설정이다."]},{"id":"20260201-42","s":3,"q":"시스템 관리자 Kim은 Windows Server 2022에서 CPU, 메모리, 네트워크, 디스크 사용량을 실시간으로 모니터링하고자 한다. 이 목적에 가장 적절한 도구는?","o":["Server Manager","System Hardware Monitor","Resource Monitor","Event Viewer"],"a":2,"im":[],"src":[["20260201",42]],"x":["리소스 모니터는 CPU, 메모리, 디스크, 네트워크 사용량을 프로세스별로 실시간 보여 준다.","서버 관리자는 역할·기능 관리 콘솔이다.","System Hardware Monitor라는 Windows 기본 도구는 없다.","리소스 모니터가 실시간 자원 모니터링 도구다.","이벤트 뷰어는 로그 확인 도구다."]},{"id":"20260201-43","s":3,"q":"다음 지문에서 설명하는 Windows Server 2022의 ActiveDirectory 그룹으로 옳은 것은?","o":["글로벌 그룹(Global Group)","유니버설 그룹(Universal Group)","도메인 로컬 그룹(Domain Local Group)","로컬 그룹(Local Group)"],"a":1,"im":[96],"src":[["20260201",43]],"x":["포리스트 전체에서 쓸 수 있고 여러 도메인의 사용자·그룹을 포함할 수 있는 그룹은 유니버설 그룹이다.","글로벌 그룹은 같은 도메인의 구성원만 포함할 수 있다.","유니버설 그룹은 포리스트 전체 범위다.","도메인 로컬 그룹은 해당 도메인 리소스 권한에만 쓰인다.","로컬 그룹은 한 컴퓨터에서만 쓰인다."]},{"id":"20260201-44","s":3,"q":"Windows Server 2022에서 DNS 서버 설정 시, TTL(TimeTo Live) 설정값에 대한 설명으로 옳지 않은 것은?","o":["TTL 값을 짧게 설정할 경우, 잦은 DNS 쿼리로 인해 서버에 부하를 줄 수 있다.","TTL 값을 설정하지 않을 경우, 정방향 조회 서비스가 불가능하다.","DNS record의 캐싱 주기를 의미한다.","TTL 값을 길게 설정할 경우, 쿼리를 요청하는 서버의 IP가 변경 시 갱신이 늦어져 서비스에 불편함을 줄 수 있다."],"a":1,"im":[],"src":[["20260201",44]],"x":["TTL은 레코드마다 기본값(영역 SOA의 최소 TTL)이 적용되므로 따로 설정하지 않아도 정방향 조회는 정상 동작한다.","TTL이 짧으면 캐시가 빨리 만료되어 질의가 늘고 부하가 커진다.","TTL을 지정하지 않아도 기본값이 쓰이므로 조회가 불가능하다는 설명은 틀렸다.","TTL은 레코드의 캐싱 유지 시간이다.","TTL이 길면 IP가 바뀌어도 캐시 때문에 반영이 늦다."]},{"id":"20260201-45","s":3,"q":"네트워크관리사 Park 사원은 Windows Server 2022에서 IIS를 이용하여 웹 사이트를 운영하고 있다. 다음 중 IIS의 로그 설정에 대한 설명으로 올바른 것은?","o":["로그 파일의 저장 위치는 변경할 수 있다.","IIS는 로그 형식을 W3C 형식만 지원한다.","로그는 기본적으로 실시간으로 업데이트된다.","로그 크기가 최대치에 도달하면 자동으로 이전 로그를 삭제한다."],"a":0,"im":[],"src":[["20260201",45]],"x":["IIS 로깅 설정에서 로그 파일 디렉터리를 바꿀 수 있다.","로그 저장 위치는 변경할 수 있다.","W3C 외에 IIS, NCSA, 사용자 지정 형식도 지원한다.","로그는 버퍼에 모았다가 주기적으로 기록되며 기본적으로 실시간 갱신이 아니다.","최대 크기에 도달하면 새 로그 파일로 넘어갈 뿐 이전 로그를 자동 삭제하지 않는다."]},{"id":"20260201-48","s":4,"q":"내부 통신에는 사설 IP를 사용하고, 외부 인터넷 접속 시 엣지 장비가 사설 IP를 공인 IP로 변환해 나가도록 하는 기술은?","o":["정책 기반 라우팅(PBR)","NAT(네트워크 주소 변환)","프록시 ARP(Proxy ARP)","스플릿 DNS(Split-Horizon DNS)"],"a":1,"im":[],"src":[["20260201",48]],"x":["내부는 사설 IP, 외부로 나갈 때 엣지 장비가 공인 IP로 바꾸는 기술은 NAT다.","PBR은 정책(출발지 등)에 따라 경로를 선택하는 라우팅이다.","NAT가 사설–공인 주소 변환이다.","Proxy ARP는 라우터가 대신 ARP에 응답하는 기능이다.","Split DNS는 내부와 외부에 다른 DNS 응답을 주는 구성이다."]},{"id":"20260201-49","s":4,"q":"다음 중 L7 스위치에 대한 설명으로 옳지 않은 것은?","o":["OSI 7계층(응용 계층)에서 동작하는 네트워크 스위치이다.","TCP/UDP 헤더만을 기반으로 로드 밸런싱을 수행한다.","IP 주소, 포트 번호와 더불어 L5~L7 패킷 정보까지 보고 데이터를 처리한다.","L7 스위치는 L2/L3/L4 기능을 포괄하여 제공할 수 있다."],"a":1,"im":[],"src":[["20260201",49]],"x":["L7 스위치는 TCP/UDP 헤더뿐 아니라 URL, 쿠키, HTTP 헤더 등 응용 계층 내용까지 보고 분산한다.","응용 계층에서 동작한다.","TCP/UDP 헤더만 본다는 것은 L4 스위치 설명이다.","L5~L7 정보까지 보고 처리한다.","L2~L4 기능도 함께 제공할 수 있다."]},{"id":"20260201-50","s":4,"q":"OSI 7계층 중 네트워크 계층, 그리고 TCP/IP 4계층 중 인터넷 계층에서 동작하는 네트워크 장비는?","o":["리피터(Repeater)","L2 스위치(Layer2 switch)","라우터(Router)","허브(Hub)"],"a":2,"im":[],"src":[["20260201",50]],"x":["OSI 네트워크 계층(TCP/IP 인터넷 계층)에서 IP 주소로 경로를 정하는 장비는 라우터다.","리피터는 물리 계층이다.","L2 스위치는 데이터 링크 계층이다.","라우터는 네트워크 계층 장비다.","허브는 물리 계층이다."]},{"id":"20260517-02","s":1,"q":"DNS에서 TTL(Time to Live)에 대한 설명으로 올바른 것은?","o":["데이터가 DNS 서버 존(zone) 으로부터 나오기 전에 현재 남은 시간이다.","데이터가 DNS 서버 캐시에서 만료되기까지 남은 시간이다.","패킷이 DNS 서버 존으로부터 나오기 전에 현재 남은 시간이다.","패킷이 DNS 서버 네임 서버 레코드로부터 나오기 전에 현재 남은 시간이다."],"a":1,"im":[],"src":[["20260517",2]],"x":["DNS TTL은 레코드가 캐시에서 만료되기까지 남은 시간이다.","존 원본 데이터는 TTL로 만료되지 않는다.","캐시 만료까지 남은 시간이 맞다.","IP 패킷 TTL과 혼동한 설명이다.","네임서버 레코드와 관계없다."]},{"id":"20260517-11","s":1,"q":"다음 응용계층 프로토콜 중에 전송계층의 프로토콜 TCP,UDP를 모두 사용하는 프로토콜은?","o":["FTP","SMTP","DNS","SNMP"],"a":2,"im":[],"src":[["20260517",11]],"x":["DNS는 일반 질의에 UDP 53, 영역 전송·큰 응답에 TCP 53을 쓴다.","FTP는 TCP만 쓴다.","SMTP는 TCP만 쓴다.","DNS는 TCP와 UDP를 모두 쓴다.","SNMP는 UDP만 쓴다."]},{"id":"20260517-14","s":1,"q":"ARP(Address Resolution Protocol)에 대한 설명으로 옳은것은?","o":["ARP는 수신 측의 IP 주소를 알 수 없을 때 브로드캐스트를 통해 IP 주소를 요청하는 프로토콜이다.","ARP 요청을 수신한 호스트는 송신 측과 수신 측의 MAC 주소를 비교하여 응답 여부를 결정한다.","각 시스템은 ARP 캐시를 사용하여 IP 주소와 MAC 주소의 매핑 정보를 일정 시간 동안 보관한다.","ARP는 MAC 주소를 기반으로 해당 장비의 IP 주소를 알아내는 프로토콜이다."],"a":2,"im":[],"src":[["20260517",14]],"x":["각 시스템은 ARP 캐시에 IP–MAC 대응을 일정 시간 보관한다.","ARP는 수신 측의 'MAC 주소'를 모를 때 브로드캐스트한다. IP는 이미 알고 있다.","요청을 받은 호스트는 '목적지 IP'가 자기 IP인지 보고 응답한다.","ARP 캐시에 매핑 정보를 보관한다.","MAC으로 IP를 찾는 것은 RARP다."]},{"id":"20260517-15","s":1,"q":"다음 중 서브넷 마스크(Subnet Mask)에 대한 설명으로 옳은 것은?","o":["라우터 간 최단 경로를 계산하기 위한 거리 지표이다.","전송 계층에서 포트 번호를 결정하기 위해 사용하는 값이다.","IP 주소에서 네트워크 부분과 호스트 부분을 구분하기 위해 사용하는 값이다.","데이터 링크 계층에서 프레임의 오류를 검출하기 위해 사용하는 비트 집합이다."],"a":2,"im":[],"src":[["20260517",15]],"x":["서브넷 마스크는 IP 주소에서 네트워크 부분(1)과 호스트 부분(0)을 구분하는 32비트 값이다.","라우터 간 거리 지표는 메트릭이다.","포트 번호는 응용 프로세스를 구분하는 전송 계층 값으로 마스크와 관계없다.","서브넷 마스크는 네트워크와 호스트 부분을 구분한다.","프레임 오류 검출은 CRC(FCS)의 역할이다."]},{"id":"20260517-16","s":1,"q":"다음 중 POP3와 IMAP에 대한 설명으로 옳지 않은 것은?","o":["POP3는 메일을 서버에 계속 보관한 상태로 여러 클라이언트에서 동기화하여 사용하는 데 최적화된 프로토콜이며, IMAP은 메일을 내려받은 후 서버에서 삭제하는 방식으로 동작한다.","POP3는 메일 클라이언트가 메일 서버로부터 전자 우편을 내려받기 위해 사용하는 프로토콜이다.","POP3는 메일 클라이언트가 메일 서버에 접속하여 서버에 저장된 메일을 내려받아 확인하는 방식으로 동작한다.","IMAP은 메일 서버에 저장된 전자 우편을 클라이언트가 서버에 그대로 둔 채, 여러 기기에서 접근하고 검색할 수 있게 해주는 프로토콜이다."],"a":0,"im":[],"src":[["20260517",16]],"x":["POP3와 IMAP의 설명이 뒤바뀌었다. 서버에 메일을 두고 여러 기기에서 동기화하는 것은 IMAP이고, 내려받은 뒤 서버에서 지우는 방식은 POP3다.","두 프로토콜의 특징을 서로 바꿔 쓴 틀린 설명이다.","POP3는 클라이언트가 서버의 메일을 내려받는 프로토콜이다.","POP3는 접속해 서버 메일을 내려받아 확인한다.","IMAP은 메일을 서버에 둔 채 여러 기기에서 접근·검색하게 한다."]},{"id":"20260517-17","s":1,"q":"TCP/IP 환경에서 전자 우편을 송신할 때 사용하는 SMTP의기본 포트 번호로 옳은 것은?","o":["SMTP – 25","SMTP - 110","SMTP – 23","SMTP – 443"],"a":0,"im":[],"src":[["20260517",17]],"x":["SMTP의 기본 포트는 TCP 25번이다.","SMTP는 25번이다.","110번은 POP3다.","23번은 Telnet이다.","443번은 HTTPS다."]},{"id":"20260517-25","s":2,"q":"NAT(Network Address Translation)의 주요 역할로 옳은 것은?","o":["사설 IP 주소와 공인 IP 주소를 변환하여 공인 IP 주소 사용을 효율화한다.","포트 포워딩을 통해 여러 웹 서버의 부하를 자동으로 분산한다.","암호화된 VPN 터널을 생성하여 원격 접속을 제공한다.","MAC 주소를 기준으로 네트워크 접속을 허용하거나 차단한다."],"a":0,"im":[],"src":[["20260517",25]],"x":["NAT는 사설 IP와 공인 IP를 변환해 적은 공인 IP로 여러 내부 호스트가 인터넷을 쓰게 한다.","주소 변환으로 공인 IP 사용을 효율화한다.","여러 서버 부하 분산은 로드 밸런서의 역할이다.","VPN 터널 생성은 VPN의 역할이다.","MAC 기반 접근 통제는 포트 보안·NAC의 역할이다."]},{"id":"20260517-26","s":2,"q":"다음 중 BGP(Border Gateway Protocol)의 핵심 기능으로가장 적합한 것은?","o":["거리 벡터 방식으로 동일 AS 내부의 최단 경로 계산에 최적화되어 있다.","경로 벡터 방식으로 동작하며, 경로 선택 시 정책 기반 필터링을 적용할 수 있다.","실시간 트래픽 전송 속도를 직접 제어한다.","내부망을 논리적으로 분할하기 위한 VLAN 설정 기능을 제공한다."],"a":1,"im":[],"src":[["20260517",26]],"x":["BGP는 AS 간 라우팅에 쓰이는 경로 벡터 프로토콜로 AS_PATH 등 속성과 정책으로 경로를 고르고 필터링한다.","AS 내부 최단 경로 계산은 RIP, OSPF 같은 IGP의 역할이다.","BGP는 경로 벡터 방식이며 정책 기반 필터링이 핵심이다.","전송 속도를 직접 제어하는 기능은 없다.","VLAN 설정은 스위치 기능이다."]},{"id":"20260517-27","s":2,"q":"무선 통신에서 채널에 대한 설명으로 옳지 않은 것은?","o":["무선 채널은 번호로 구분된다.","두 채널이 사용하는 주파수 대역이 겹칠 경우 간섭이 발생할 수 있다.","채널은 장비가 자동으로 선택할 수도 있고, 관리자가 수동으로 지정할 수도 있다.","무선 호스트는 AP와 통신할 때 채널을 이용할 수 없다."],"a":3,"im":[],"src":[["20260517",27]],"x":["무선 호스트는 AP와 같은 채널을 써야 통신할 수 있다.","무선 채널은 1, 6, 11처럼 번호로 구분한다.","주파수가 겹치는 채널끼리는 간섭이 생긴다.","채널은 자동 선택이나 수동 지정이 모두 가능하다.","AP와의 통신은 채널을 통해 이루어지므로 틀린 설명이다."]},{"id":"20260517-29","s":3,"q":"서버 담당자 Park 사원은 Windows Server 2022에서 가상화 기반의 애플리케이션 운영 환경을 구축하고자 한다. 다음 지문 내용 중 (A)에 공통으로 들어갈 내용으로 옳은 것은?","o":["Virtual Machine","Internet Information Services","Windows Containers","Nano Server"],"a":2,"im":[97],"src":[["20260517",29]],"x":["Hyper-V VM보다 훨씬 가볍게 애플리케이션을 격리 실행하는 가상화 기술은 Windows 컨테이너다.","가상 머신은 완전한 OS를 포함해 상대적으로 무겁다.","IIS는 웹 서버다.","Windows 컨테이너는 커널을 공유하는 가벼운 가상화다.","Nano Server는 최소 설치 옵션이다."]},{"id":"20260517-35","s":3,"q":"Linux 시스템에서 vi 에디터를 사용하여 텍스트를 입력한 후저장하지 않은 상태에서 종료하려고 할 때, 바로 종료되지 않는 명령어는?","o":[":wq",":wq!",":q!",":q"],"a":3,"im":[],"src":[["20260517",35]],"x":[":q는 저장하지 않은 변경이 있으면 경고만 하고 종료되지 않는다.",":wq는 저장 후 종료한다.",":wq!는 강제 저장 후 종료한다.",":q!는 저장하지 않고 강제 종료한다.",":q는 변경 사항이 있으면 종료가 거부된다."]},{"id":"20260517-37","s":3,"q":"Windows Server 2022의 DNS 서버에 DNS 레코드를 추가할 때 옳지 않은 것은?","o":["새 호스트(A or AAA)는 호스트 이름에 대한 IP 주소를 등록하는 것이다.","새 포인터(PTR)는 IP 주소에 대한 FQDN을 등록하는 것이다.","새 별칭(CNAME)은 서브 도메인을 등록하는 것이다.","새 메일 교환기(MX)는 메일서버를 등록하는 것이다."],"a":2,"im":[],"src":[["20260517",37]],"x":["CNAME은 기존 이름에 별칭을 붙이는 레코드다. 하위 도메인 등록은 '새 도메인'이나 위임 기능으로 한다.","A/AAAA는 호스트 이름에 IP를 등록한다.","PTR은 IP에 FQDN을 등록한다.","CNAME은 별칭 등록이므로 '서브 도메인 등록'은 틀렸다.","MX는 메일 서버를 등록한다."]},{"id":"20260517-38","s":3,"q":"Windows Server 2022에서 클라이언트의 Host Name, IP주소, 서브넷 마스크, DNS Server, 기본 게이트웨이 등의 설정 사항을 볼 수 있는 명령어는?","o":["arp –a","ipconfig /all","convert","netstat"],"a":1,"im":[],"src":[["20260517",38]],"x":["ipconfig /all은 호스트 이름, IP, 서브넷 마스크, 게이트웨이, DNS 서버 등 모든 구성 정보를 보여 준다.","arp -a는 ARP 캐시를 보여 준다.","ipconfig /all이 상세 구성 정보를 보여 준다.","convert는 FAT를 NTFS로 바꾼다.","netstat은 연결·포트 상태를 보여 준다."]},{"id":"20260517-42","s":3,"q":"다음 운영 상황을 고려할 때, Windows Server 2022 DHCPFailover 환경의 MCLT(Maximum Client Lead Time) 역할로 가장 알맞은 것은?","o":["두 DHCP 서버 간 인증에 사용하는 최대 시간","장애 조치 파트너 DHCP 서버가 기존 임대를 임시로 갱신할 수 있는 최대 시간","DHCP Discover 메시지의 재전송 간격","장애 조치 후 DHCP 스코프를 비활성화하는 유예 시간"],"a":1,"im":[98],"src":[["20260517",42]],"x":["MCLT(최대 클라이언트 리드 타임)는 파트너 서버와 통신이 끊겼을 때, 남은 서버가 상대 서버의 임대를 임시로 연장(갱신)해 줄 수 있는 최대 시간이다.","서버 간 인증 시간과는 관계없다(인증은 공유 암호로 한다).","파트너가 기존 임대를 임시로 갱신할 수 있는 최대 시간이 MCLT다.","Discover 재전송 간격은 클라이언트 동작으로 MCLT와 관계없다.","스코프 비활성화 유예 시간이 아니다."]},{"id":"20260517-43","s":3,"q":"Windows Server 2022에서 Active Directory의 주요 역할로올바른 것은?","o":["클라이언트에 IP 주소를 자동으로 할당한다.","사용자 인증과 디렉터리 기반의 자원 관리를 수행한다.","DNS 영역의 동적 업데이트를 기본적으로 차단한다.","서버의 방화벽 규칙을 자동으로 구성한다."],"a":1,"im":[],"src":[["20260517",43]],"x":["Active Directory는 사용자 인증(로그온)과 디렉터리 기반의 사용자·컴퓨터·자원 관리를 맡는다.","IP 자동 할당은 DHCP의 역할이다.","AD 통합 DNS는 보안 동적 업데이트를 지원하며 기본으로 막지 않는다.","AD는 인증과 디렉터리 자원 관리를 수행한다.","방화벽 규칙 자동 구성은 AD의 주 역할이 아니다(그룹 정책으로 배포는 가능)."]},{"id":"20260517-44","s":3,"q":"네트워크관리사 Kim 사원은 Windows Server 2022에서FTP 서버를 설치하려고 한다. 다음 중 FTP 서버 설치에 대한 설명으로 옳은 것은?","o":["서버 관리자에서 역할 및 기능 추가를 실행한 뒤 Web Server (IIS)의 FTP Server 역할 서비스를 선택하여 설치할 수 있다.","FTP 서버는 Windows Server의 역할 및 기능에 포함되어 있지 않으므로 서드파티 소프트웨어를 사용해야 한다.","IIS의 FTP 서버 기능만으로 SSH 기반 SFTP를 구성할 수 있다.","FTP 서버 설치는 PowerShell로 수행할 수 없다."],"a":0,"im":[],"src":[["20260517",44]],"x":["서버 관리자 '역할 및 기능 추가'에서 웹 서버(IIS) 아래 FTP 서버 역할 서비스를 골라 설치한다.","IIS의 FTP Server 역할 서비스로 설치한다.","FTP 서버는 Windows Server 역할에 포함되어 있다.","IIS FTP는 FTPS(SSL/TLS)를 지원하지만 SSH 기반 SFTP는 지원하지 않는다.","Install-WindowsFeature로 PowerShell 설치가 가능하다."]},{"id":"20260517-45","s":3,"q":"아래 지문의 괄호 (A)에 들어갈 내용으로 옳은 것은?","o":["가상 스위치","새로 고침","내보내기","검사점"],"a":3,"im":[99],"src":[["20260517",45]],"x":["Hyper-V에서 VM의 특정 시점 상태를 저장했다가 그 시점으로 되돌리는 기능은 검사점(Checkpoint)이다.","가상 스위치는 VM 네트워크 연결 기능이다.","새로 고침은 화면 갱신이다.","내보내기는 VM을 파일로 옮기는 기능이다.","검사점으로 이전 상태로 되돌릴 수 있다."]},{"id":"20260517-49","s":4,"q":"다음 지문에서 설명하는 네트워크 장비 또는 기술로 옳은것은?","o":["네트워크 가상화(Network Virtualization)","분산 네트워크(Distributed Network)","게이트웨이 이중화(Gateway Redundancy)","로드 밸런서(Load Balancer)"],"a":3,"im":[100],"src":[["20260517",49]],"x":["같은 서비스를 하는 여러 서버로 요청을 분산하고, 헬스 체크로 정상 서버에만 전달해 장애 내성을 높이는 장비는 로드 밸런서다.","네트워크 가상화는 물리망 위에 논리망을 만드는 기술이다.","분산 네트워크는 구조 개념으로 요청 분산 장비가 아니다.","게이트웨이 이중화(VRRP, HSRP)는 기본 게이트웨이 장애에 대비하는 기술이다.","로드 밸런서가 요청 분산과 헬스 체크를 한다."]},{"id":"20260517-50","s":4,"q":"다음 중 네트워크 카드를 통해 컴퓨터를 부팅할 수 있도록하는 기술로 옳은 것은?","o":["PnP(Plug and Play)","PoE(Power over Ethernet)","PXE(Pre-boot eXecution Environment)","PE(Portable Executable)"],"a":2,"im":[],"src":[["20260517",50]],"x":["PXE는 네트워크 카드가 DHCP·TFTP로 부팅 이미지를 받아 네트워크로 부팅하게 하는 기술이다.","PnP는 장치를 꽂으면 자동 인식·설정하는 기술이다.","PoE는 랜선으로 전원을 공급하는 기술이다.","PXE가 네트워크 부팅 기술이다.","PE는 Windows 실행 파일 형식이다(Windows PE는 별개)."]},{"id":"20260802-02","s":1,"q":"TCP/IP 프로토콜 계층 구조에서 볼 때, 응용 계층에서 동작하는 프로토콜로 옳지 않은 것은?","o":["ICMP","SMTP","SNMP","TFTP"],"a":0,"im":[],"src":[["20260802",2]],"x":["ICMP는 인터넷(네트워크) 계층 프로토콜이다. SMTP, SNMP, TFTP는 응용 계층이다.","ICMP는 인터넷 계층이라 응용 계층이 아니다.","SMTP는 응용 계층이다.","SNMP는 응용 계층이다.","TFTP는 응용 계층이다."]},{"id":"20260802-14","s":1,"q":"다음 중 IPv4와 IPv6 간 전환 기술에 해당하지 않는 것은?","o":["듀얼 스택(Dual Stack)","터널링(Tunneling)","프로토콜 변환(Protocol Translation)","네트워크 주소 변환(NAT44)"],"a":3,"im":[],"src":[["20260802",14]],"x":["IPv4–IPv6 전환 기술은 듀얼 스택, 터널링, 변환(NAT64 등)이다. NAT44는 IPv4끼리의 주소 변환이라 전환 기술이 아니다.","듀얼 스택은 두 프로토콜을 함께 쓰는 전환 기술이다.","터널링은 IPv6를 IPv4로 감싸 보내는 전환 기술이다.","프로토콜 변환(NAT64/DNS64)은 전환 기술이다.","NAT44는 IPv4–IPv4 변환이라 전환 기술이 아니다."]},{"id":"20260802-15","s":1,"q":"다음 중 RFC 5952에서 권고하는 IPv6 주소의 표준 텍스트표기 방법으로 옳은 것은?","o":["각 16비트 필드의 선행 0은 생략할 수 없으며, 필드의 값이 모두 0인 경우에는 0000으로 표기한다.","연속된 0 값의 16비트 필드는 '::'으로 줄여 쓸 수 있으며, 하나의 IPv6 주소에서 여러 번 사용할 수 있다.","길이가 같은 연속된 0 필드 구간이 여러 개라면 가장 오른쪽 구간을 '::'으로 줄여 쓴다.","연속된 0 값의 16비트 필드가 하나뿐인 경우에는 '::'으로 줄이지 않고 0으로 표기한다."],"a":3,"im":[],"src":[["20260802",15]],"x":["RFC 5952는 연속된 0 필드가 하나뿐일 때는 ::를 쓰지 말고 0으로 쓰도록 권고한다.","선행 0은 반드시 생략하고, 모두 0인 필드는 0 하나로 쓴다.","::는 주소 하나에 한 번만 쓸 수 있다.","길이가 같으면 가장 '왼쪽' 구간을 ::로 줄인다.","0 필드가 하나뿐이면 ::로 줄이지 않는다."]},{"id":"20260802-16","s":1,"q":"다음 중 TCP/IP 기반의 네트워크 관리 프로토콜인 SNMP에대한 설명으로 옳은 것은?","o":["관리 시스템의 SNMP Manager는 관리 대상 장비에서 실행되는 SNMP Agent와 통신하여 장비의 상태 정보를 조회하거나 설정을 변경한다.","인터넷에서 전자우편을 전송하기 위해 사용하는 응용 계층 프로토콜이다.","SNMP Agent는 관리 정보를 데이터베이스에 저장하지 않으며, 모든 관리 정보를 Manager가 직접 생성한다.","SNMP Manager와 Agent는 TCP 연결을 설정한 후 143번 포트를 이용하여 관리 정보를 교환한다."],"a":0,"im":[],"src":[["20260802",16]],"x":["SNMP Manager는 장비에서 동작하는 Agent와 통신해 MIB 정보를 조회(Get)하거나 설정(Set)한다.","Manager–Agent 구조로 상태 조회와 설정 변경을 한다.","메일 전송은 SMTP다.","Agent는 관리 정보를 MIB에 저장한다.","SNMP는 UDP 161/162를 쓴다. 143은 IMAP이다."]},{"id":"20260802-17","s":1,"q":"다음 중 DHCP(Dynamic Host Configuration Protocol)의IP 주소 할당 방식에 해당하지 않는 것은?","o":["수동 할당(Manual Allocation)","자동 할당(Automatic Allocation)","동적 할당(Dynamic Allocation)","우선순위 할당(Priority Allocation)"],"a":3,"im":[],"src":[["20260802",17]],"x":["DHCP 주소 할당 방식은 수동(Manual), 자동(Automatic), 동적(Dynamic) 세 가지다(RFC 2131).","수동 할당은 관리자가 MAC별로 정한 IP를 준다.","자동 할당은 영구적으로 IP를 준다.","동적 할당은 임대 기간 동안 IP를 빌려준다.","우선순위 할당은 DHCP 할당 방식이 아니다."]},{"id":"20260802-20","s":2,"q":"모바일 멀티미디어 데이터와 네트워크 트래픽이 급증하고동적으로 변화하는 환경에 대응하기 위해, 제어 평면과 데이터 평면을 분리하고 소프트웨어를 통해 네트워크를 중앙에서 프로그래밍하고 제어하는 기술은?","o":["SDS(Software Defined Storage)","SDN(Software Defined Networking)","SNMP(Simple Network Management Protocol)","CLI(Command Line Interface)"],"a":1,"im":[],"src":[["20260802",20]],"x":["제어 평면과 데이터 평면을 분리하고 중앙 컨트롤러에서 소프트웨어로 네트워크를 프로그래밍하는 기술은 SDN이다.","SDS는 소프트웨어 정의 스토리지다.","SDN이 제어/데이터 평면 분리 기술이다.","SNMP는 장비 관리 프로토콜이다.","CLI는 명령줄 인터페이스다."]},{"id":"20260802-21","s":2,"q":"다음 중 하나의 물리적 스위치에 연결된 장치들을 여러 개의 논리적 브로드캐스트 도메인으로 분리하는 기술은?","o":["STP(Spanning Tree Protocol)","LACP(Link Aggregation Control Protocol)","VTP(VLAN Trunking Protocol)","VLAN(Virtual Local Area Network)"],"a":3,"im":[],"src":[["20260802",21]],"x":["VLAN은 하나의 물리 스위치를 여러 논리 브로드캐스트 도메인으로 나눈다.","STP는 루프 방지 프로토콜이다.","LACP는 여러 링크를 하나로 묶는 링크 집선 프로토콜이다.","VTP는 VLAN 정보를 스위치 간에 전파하는 프로토콜이다.","VLAN이 브로드캐스트 도메인을 나눈다."]},{"id":"20260802-26","s":2,"q":"다음 중 네트워크 기능 가상화(NFV, Network FunctionsVirtualization)가 제공하는 주요 장점으로 가장 적절한 것은?","o":["방화벽, 라우터, 로드 밸런서 등의 네트워크 기능을 소프트웨어 기반의 가상 네트워크 기능(VNF)으로 구현하여 필요에 따라 유연하게 배포하고 확장할 수 있다.","네트워크의 제어 평면을 데이터 평면과 분리하고, 중앙의 컨트롤러에서 네트워크 흐름을 프로그래밍 방식으로 제어할 수 있다.","네트워크 기능별 전용 하드웨어를 반드시 사용하므로 처리 성능과 운용 방식의 일관성을 보장할 수 있다.","네트워크 기능을 가상화하면 물리적 서버와 네트워크 인프라를 사용하지 않고도 모든 서비스를 운영할 수 있다."],"a":0,"im":[],"src":[["20260802",26]],"x":["NFV는 방화벽, 라우터, 로드 밸런서 등을 소프트웨어 VNF로 구현해 필요할 때 유연하게 배포·확장할 수 있게 한다.","VNF로 유연하게 배포·확장하는 것이 NFV의 장점이다.","제어/데이터 평면 분리와 중앙 제어는 SDN의 특징이다.","NFV는 전용 하드웨어 대신 범용 서버를 쓴다.","가상화해도 물리 서버와 네트워크 인프라는 필요하다."]},{"id":"20260802-27","s":2,"q":"TCP/IP Protocol Suite에서 전송 계층의 프로토콜은?","o":["TFTP(Trivial File Transfer Protocol)","UDP(User Datagram Protocol)","IP(Internet Protocol)","PPP(Point-to-Point Protocol)"],"a":1,"im":[],"src":[["20260802",27]],"x":["TCP/IP 전송 계층 프로토콜은 TCP와 UDP다.","TFTP는 응용 계층이다.","UDP는 전송 계층이다.","IP는 인터넷 계층이다.","PPP는 데이터 링크(네트워크 인터페이스) 계층이다."]},{"id":"20260802-29","s":3,"q":"Windows Server 2022의 IIS 관리자 기능의 설명으로 옳지않은 것은?","o":["기본 웹사이트의 홈디렉터리는 반드시 'C:￦interpub￦wwwroot'로 설정해야 한다.","기본 문서는 필요하다면 추가 메뉴를 이용해 추가할 수 있다.","웹사이트의 홈디렉터리에 제공할 문서가 없는 경우에는 디렉터리 검색 기능을 이용하여 보여줄 항목을 지정할 수 있다.","가상 디렉터리 추가 기능을 이용하여 별칭을 생성하고 실제 경로를 선택할 수 있다."],"a":0,"im":[],"src":[["20260802",29]],"x":["기본 웹사이트의 홈 디렉터리(실제 경로)는 바꿀 수 있다. 반드시 C:\\inetpub\\wwwroot일 필요는 없다.","홈 디렉터리를 반드시 고정해야 한다는 설명은 틀렸다(보기의 interpub도 오타).","기본 문서를 추가할 수 있다.","디렉터리 검색으로 문서가 없을 때 목록을 보여 줄 수 있다.","가상 디렉터리로 별칭과 실제 경로를 지정한다."]},{"id":"20260802-30","s":3,"q":"Windows Server 2022에서 사용하는 PowerShell에 대한 설명으로 옳지 않은 것은?","o":["기존 DOS 명령은 사용할 수 없다.","스크립트는 콘솔에서 대화형으로 사용될 수 있다.","스크립트는 텍스트로 구성된다.","대소문자를 구분하지 않는다."],"a":0,"im":[],"src":[["20260802",30]],"x":["PowerShell에서 dir, cd, copy 같은 DOS 명령을 별칭으로 그대로 쓸 수 있다.","기존 DOS 명령을 쓸 수 없다는 설명은 틀렸다.","콘솔에서 대화형으로 사용할 수 있다.","스크립트는 텍스트(.ps1) 파일이다.","명령어는 대소문자를 구분하지 않는다."]},{"id":"20260802-32","s":3,"q":"Windows Server 2022에서 DHCP 구성에 대한 설명으로 올바른 것은?","o":["DHCP에서 새 범위 구성 시 임대 기간은 일, 시간, 분, 초단위로 설정할 수 있다.","DHCP에서 새 범위 구성 시 더 이상 WINS 서버를 구성하지 않는다.","새 예약 구성 시 지원되는 유형은 BOOTP 없이 DHCP만 가능하다.","DHCP 서버에서 주소를 분배할 때, 적용할 지연시간은 ms 단위로 지정한다."],"a":3,"im":[],"src":[["20260802",32]],"x":["DHCP 서버의 주소 제공 지연 시간(서브넷 지연)은 밀리초(ms) 단위로 지정한다.","임대 기간은 일·시간·분 단위다(초 없음).","WINS 서버 옵션을 여전히 구성할 수 있다.","예약은 DHCP, BOOTP, 둘 다 중에서 고를 수 있다.","지연 시간은 ms 단위다."]},{"id":"20260802-35","s":3,"q":"Windows Server 2022의 'netstat' 명령 중 라우팅 테이블을 확인할 수 있는 명령 옵션은?","o":["netstat –a","netstat -r","netstat –n","netstat -s"],"a":1,"im":[],"src":[["20260802",35]],"x":["netstat -r은 라우팅 테이블을 보여 준다.","-a는 모든 연결과 수신 대기 포트다.","-r이 라우팅 테이블이다.","-n은 숫자 형식 표시다.","-s는 프로토콜별 통계다."]},{"id":"20260802-37","s":3,"q":"FTP는 원격 서버에 파일을 주고받을 때 사용하는 프로토콜이다. FTP는 2가지 Mode로 구분되는데, 서버에서 따로 포트 대역을 설정해주고 서버는 임의로 지정된 데이터 포트정보를 클라이언트에 보내 클라이언트에서 해당 포트로 접속하는 방식은?","o":["Active Mode","Passive Mode","Privileges Mode","Proxy Mode"],"a":1,"im":[],"src":[["20260802",37]],"x":["Passive 모드에서는 서버가 임의 데이터 포트를 열어 알려 주고 클라이언트가 그 포트로 접속한다.","Active 모드는 서버가 클라이언트 포트로 접속한다.","Passive 모드는 클라이언트가 서버 데이터 포트로 접속한다.","Privileges Mode는 FTP 모드가 아니다.","Proxy Mode는 FTP 기본 모드가 아니다."]},{"id":"20260802-38","s":3,"q":"Linux 시스템 담당자 Park 사원은 시스템 부팅 과정에서 발생한 커널 메시지를 확인하여 하드웨어와 장치 드라이버의 이상 여부를 점검하려고 한다. 다음 중 일반적인 Linux 로그 관리 환경에서 이러한 메시지가 저장되는 로그 파일은?","o":["/var/log/cron","/var/log/lastlog","/var/log/dmesg","/var/log/btmp"],"a":2,"im":[],"src":[["20260802",38]],"x":["부팅할 때 커널이 출력한 하드웨어·드라이버 메시지는 /var/log/dmesg에 저장된다.","cron 로그는 예약 작업 기록이다.","lastlog는 마지막 로그인 기록이다.","dmesg 로그에 부팅 커널 메시지가 있다.","btmp는 로그인 실패 기록이다."]},{"id":"20260802-40","s":3,"q":"Linux에서 'sample' 파일의 소유자 및 소유그룹이 아닌 사람에 대해 파일을 볼 수는 있지만 수정 및 실행을 못하도록 하는 명령어는?","o":["chmod 776 sample","chmod 774 sample","chmod 746 sample","chmod 766 sample"],"a":1,"im":[],"src":[["20260802",40]],"x":["기타 사용자에게 읽기만 주려면 마지막 자리가 4(r--)여야 한다. 774가 맞다.","776은 기타에게 쓰기를 준다.","774는 기타에게 읽기만 준다.","746은 기타에게 쓰기를 준다.","766은 기타에게 쓰기를 준다."]},{"id":"20260802-41","s":3,"q":"아래 지문은 Linux 시스템에서 구동 중인 프로세스를 검색한 결과이다. 옳지 않은 것은?","o":["입력한 명령어는 'ps -ef | grep /bin/sh'이다.","네번째 프로세스의 PPID는 1869이다.","python 프로세스가 실행되고 있다.","목록에서 다섯번째 프로세스를 종료하는 명령어는 'kill 1902'이다."],"a":1,"im":[101],"src":[["20260802",41]],"x":["네 번째 줄은 PID 1869, PPID 1868이다. PPID를 1869라고 한 설명이 틀렸다.","ps -ef | grep /bin/sh 결과 형식이다.","네 번째 프로세스의 PPID는 1868이므로 틀렸다.","python 프로세스가 실행 중이다.","다섯 번째 PID가 1902이므로 kill 1902가 맞다."]},{"id":"20260802-42","s":3,"q":"다음 중 systemd를 사용하는 RHEL 계열 Linux에서systemctl 명령의 사용 예로 적절하지 않은 것은?","o":["systemctl start httpd","systemctl enable sshd","systemctl status nginx","systemctl passwd root"],"a":3,"im":[],"src":[["20260802",42]],"x":["systemctl은 서비스(유닛) 관리 명령이다. 암호 변경은 passwd root로 한다.","httpd 서비스를 시작한다.","sshd를 부팅 시 자동 시작하도록 등록한다.","nginx 서비스 상태를 확인한다.","systemctl에는 passwd 하위 명령이 없다."]},{"id":"20260802-43","s":3,"q":"네트워크 관리자 Park 사원은 Active Directory 도메인 서비스가 구성된 Windows Server 2022에서 새로운 도메인 사용자 계정을 생성하고 관리하려고 한다. 다음 중 사용자 계정 관리에 대한 설명으로 옳은 것은?","o":["사용자 암호 정책은 Windows Server의 보안 정책과 관계없이 각 사용자가 임의로 설정한다.","도메인 사용자 계정을 생성하면 별도의 권한 설정 없이 모든 네트워크 리소스에 접근할 수 있다.","Windows Server 2022에서는 로컬 사용자 계정만 생성할 수 있으며 도메인 사용자 계정은 생성할 수 없다.","Active Directory 사용자 및 컴퓨터에서 도메인 사용자 계정을 생성하고 보안 그룹의 구성원으로 추가할 수 있다."],"a":3,"im":[],"src":[["20260802",43]],"x":["'Active Directory 사용자 및 컴퓨터'에서 도메인 사용자를 만들고 보안 그룹 구성원으로 추가해 권한을 관리한다.","암호 정책은 도메인 보안 정책(그룹 정책)을 따른다.","새 계정은 Domain Users 권한만 가지며 모든 자원에 접근하지 못한다.","도메인 컨트롤러에서는 도메인 사용자 계정을 만든다.","ADUC에서 계정 생성과 그룹 추가를 할 수 있다."]},{"id":"20260802-44","s":3,"q":"다음 중 IIS 웹 사이트의 바인딩 및 포트 설정에 대한 설명으로 옳은 것은?","o":["하나의 IIS 서버에서는 하나의 웹 사이트만 운영할 수 있다.","IIS는 IP 주소와 포트 번호만으로 웹 사이트를 구분하며, 호스트 이름은 사용할 수 없다.","HTTP의 기본 포트는 80번이고, HTTPS의 기본 포트는 443번이다.","하나의 IIS 서버에서 여러 웹 사이트를 운영하려면 각 사이트에 반드시 서로 다른 IP 주소를 할당해야 한다."],"a":2,"im":[],"src":[["20260802",44]],"x":["HTTP 기본 포트는 80, HTTPS는 443이다.","IIS 하나에서 여러 사이트를 운영할 수 있다.","IP, 포트에 더해 호스트 이름(호스트 헤더)으로도 사이트를 구분한다.","HTTP 80, HTTPS 443이 맞다.","호스트 이름이나 포트로 구분하면 같은 IP로도 여러 사이트를 운영할 수 있다."]},{"id":"20260802-45","s":3,"q":"다음 지문에서 설명하는 Hyper-V의 기능으로 옳은 것은?","o":["가상 머신 내보내기(Export)","롤백(Rollback)","타임머신(Time Machine)","검사점(Checkpoint)"],"a":3,"im":[102],"src":[["20260802",45]],"x":["VM의 특정 시점 상태를 저장해 두었다가 되돌릴 수 있는 Hyper-V 기능은 검사점(Checkpoint)이다.","내보내기는 VM을 다른 곳으로 옮기기 위한 파일 생성 기능이다.","롤백은 Hyper-V 기능 이름이 아니다.","타임머신은 macOS 백업 기능이다.","검사점이 시점 저장·복원 기능이다."]},{"id":"20260802-49","s":4,"q":"다음 중 방화벽의 기능에 대한 설명으로 옳은 것은?","o":["방화벽은 패킷의 IP 주소와 운영체제의 프로세스 번호만을 기준으로 접근을 제어한다.","방화벽은 사전에 정의된 보안 정책과 접근 제어 규칙에 따라 네트워크 트래픽을 허용하거나 차단한다.","방화벽은 네트워크 내부에서 발생하는 모든 공격을 완전히 차단할 수 있다.","방화벽은 자신을 통과하지 않는 네트워크 트래픽도 직접 감시하고 제어할 수 있다."],"a":1,"im":[],"src":[["20260802",49]],"x":["방화벽은 미리 정한 보안 정책과 접근 규칙에 따라 트래픽을 허용하거나 차단한다.","IP 주소, 포트, 프로토콜 등을 기준으로 하며 OS 프로세스 번호만으로 제어하지 않는다.","정책·규칙에 따라 허용·차단한다.","내부에서 일어나는 공격까지 완전히 막을 수는 없다.","자신을 거치지 않는 트래픽은 감시·제어할 수 없다."]},{"id":"20260802-50","s":4,"q":"다음 중 빛을 이용해 데이터를 전송하며, 중심부의 코어(Core)와 이를 둘러싼 클래딩(Cladding)으로 구성된 전송 매체는?","o":["동축 케이블(Coaxial Cable)","광섬유 케이블(Optical Fiber Cable)","UTP 케이블(Unshielded Twisted Pair Cable)","STP 케이블(Shielded Twisted Pair Cable)"],"a":1,"im":[],"src":[["20260802",50]],"x":["빛으로 데이터를 보내고 코어와 클래딩으로 구성된 매체는 광섬유 케이블이다.","동축 케이블은 전기 신호를 쓴다.","광섬유 케이블이 코어·클래딩 구조다.","UTP는 차폐 없는 꼰 구리선이다.","STP는 차폐된 꼰 구리선이다."]}],"img":["data:image/jpeg;base64,/9j/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCABBAUwDASIAAhEBAxEB/8QAGwABAQEBAQEBAQAAAAAAAAAAAAYFBAMHAgH/xAA/EAABAwMCAwQHBQYGAwEAAAABAgMEAAURBhITFCEWMUHUIlFVVmGTlQcVIzKBN0JScXWzFyQzkZLSYoKhwf/EABYBAQEBAAAAAAAAAAAAAAAAAAACA//EAB0RAQABBAMBAAAAAAAAAAAAAAABAgMREgQTMWH/2gAMAwEAAhEDEQA/APo+rdU3iz3KcmEqMiFBhxn3lLhGQsl5x1Ax+O2ABwx6z6Xwrnlai1NDlKjPXCBxGG2nJfDsbi+VDiilG7Evrkg/l3YAJOK8tYQZ91u+o7dboapMiRa7cAA4hATiRKVklRHq8M1qqi36NqWddYFubUbnHjNgPupAiltS928A+llK8jaT1HXHfQZKtX3hp1zj3y1sxUmQlEtdid4bimAS6E4lFXo7Vd4Gdpxnpnvs111PeXpEdN1tcaSwhtxbEiyOBWxwEoV6MsjBwR35BBzU9c9KXmQh2yNw1FTKbpJZlZHCkcwFhCAf3VAu9d2PykjPhS2bSs2PfLk7Nky1R34cNDbyZAQ5vbDgUnKMdBuH86D985qftCbJ992fmhF5rd9yO7Nm/b38135+FcSr/qNF2TBXdbahC5XJplKsTo       <div><dt>시간</dt><dd class="num">${EXAM_MIN}분</dd></div>
      <div><dt>합격</dt><dd class="num">${PASS}점 이상</dd></div>
      <div><dt>문제은행</dt><dd class="num">${Q.length}</dd></div>
    </dl>
    <div class="block">
      <h2 class="sec">랜덤 모의고사</h2>
      <div class="mock">
        <div>
          <div class="alloc">${[1,2,3,4].map(s => `<div class="s${s}" style="flex:${ALLOC[s]}">${ALLOC[s]}</div>`).join("")}</div>
          <div class="allocl">${[1,2,3,4].map(s => `<span>${SUBJ[s]} <b>${ALLOC[s]}</b></span>`).join("")}</div>
        </div>
        <button class="btn primary" onclick="startMock()">모의고사 시작</button>
      </div>
      <p class="foot">매 회차 과목별 출제 수(17 · 10 · 18 · 5)대로 과목마다 무작위로 뽑습니다. 채점 후 모든 문항에 정답 이유와 보기별 풀이를 보여 줍니다.</p>
    </div>
    <div class="block">
      <h2 class="sec">과목별 풀이 · 바로 채점 · 문항당 30초</h2>
      <div class="opts-row">
        <label for="pcnt">문항 수 <select id="pcnt" onchange="PREF.cnt=this.value;savePref()">
          ${["10","20","30","all"].map(v => `<option value="${v}" ${PREF.cnt === v ? "selected" : ""}>${v === "all" ? "전체" : v + "문항"}</option>`).join("")}</select></label>
        <label for="pord">순서 <select id="pord" onchange="PREF.order=this.value;savePref()">
          <option value="rand" ${PREF.order === "rand" ? "selected" : ""}>무작위</option>
          <option value="seq" ${PREF.order === "seq" ? "selected" : ""}>기출 순</option>
          <option value="new" ${PREF.order === "new" ? "selected" : ""}>안 푼 문제 먼저</option></select></label>
        <span class="sp" style="flex:1"></span>
        <button class="btn ghost" onclick="startPractice(0,true)" ${totalWrong ? "" : "disabled"}>전 과목 오답 ${totalWrong}</button>
      </div>
      <div class="subs">${subCards}</div>
    </div>
    <div class="block">
      <h2 class="sec">회차별 기출</h2>
      <div class="exams">${exams}</div>
    </div>
    <div class="acts"><button class="btn ghost" onclick="askReset()">학습 기록 지우기</button></div>
    <p class="foot">출처: 최강 자격증 기출문제 전자문제집 CBT(comcbt.com) 학생용 PDF. 학습 기록은 이 브라우저에만 저장됩니다.</p>
  </section>`;
  scrollTo(0, 0);
}

function askReset() {
  modal(`<h2>학습 기록을 지울까요?</h2><p>과목별 풀이 기록, 오답 표시, 회차별 최근 점수가 모두 지워집니다.</p>
    <div class="row"><button class="btn" onclick="modal('')">취소</button><button class="btn primary" onclick="resetAll()">지우기</button></div>`);
}
function resetAll() {
  STATS = {}; saveStats();
  try { DATA.exams.forEach(d => localStorage.removeItem("nm2-ex-" + d)); } catch (e) {}
  modal(""); home();
}
function modal(html) { $("#modal").innerHTML = html ? `<div class="scrim" onclick="if(event.target===this)modal('')"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>` : ""; }

/* ---------- exam (mock / past) ---------- */
function startMock() {
  const items = [];
  [1,2,3,4].forEach(s => items.push(...shuffle(BYSUB[s]).slice(0, ALLOC[s])));
  beginExam({kind:"mock", title:"랜덤 모의고사", items});
}
function startExam(d) { beginExam({kind:"past", date:d, title:fmtDate(d) + " 기출", items:EXAMS[d].slice()}); }
function beginExam(o) {
  S = Object.assign(o, {mode:"exam", ans:Array(o.items.length).fill(null), flags:new Set(), cur:0, end:Date.now() + EXAM_MIN * 60000});
  clearInterval(timerId); timerId = setInterval(tick, 1000);
  renderExam(); scrollTo(0, 0);
}
function tick() {
  if (!S || S.mode !== "exam") return clearInterval(timerId);
  const left = Math.max(0, S.end - Date.now()), el = $("#timer");
  if (el) { el.textContent = `${String(left / 60000 | 0).padStart(2, "0")}:${String((left / 1000 | 0) % 60).padStart(2, "0")}`; el.classList.toggle("warn", left < 5 * 60000); }
  if (left <= 0) { clearInterval(timerId); finishExam(true); }
}
function qBody(i, extra = "") {
  const q = Q[i];
  return `<p class="qtext">${esc(q.q)}</p>${q.im.map(k => `<div class="fig"><img src="${IMG[k]}" alt="${esc(q.q.slice(0, 40))} 지문 그림"></div>`).join("")}${extra}`;
}
function renderExam() {
  const n = S.items.length, done = S.ans.filter(a => a !== null).length;
  $("#bar").innerHTML = `<button class="brand" onclick="askQuit()">네트워크관리사 2급<small>${esc(S.title)}</small></button><span class="sp"></span>
    <span class="prog num">${done}/${n} 답안</span><span class="timer" id="timer">--:--</span><button class="btn primary" onclick="askSubmit()">답안 제출</button>`;
  tick();
  const i = S.items[S.cur], q = Q[i];
  let omr = "", last = 0;
  S.items.forEach((qi, k) => {
    if (Q[qi].s !== last) { last = Q[qi].s; omr += `<div class="sh">${last}과목 · ${SUBJ[last]}</div>`; }
    omr += `<div class="orow ${k === S.cur ? "cur" : ""}"><button class="n ${S.flags.has(k) ? "fl" : ""}" onclick="go(${k})" aria-label="${k + 1}번으로 이동">${k + 1}</button>${[0,1,2,3].map(o => `<button class="ob ${S.ans[k] === o ? "on" : ""}" onclick="pick(${o},${k})" aria-label="${k + 1}번 ${o + 1}번 보기">${o + 1}</button>`).join("")}</div>`;
  });
  const srcTag = S.kind === "mock" ? `<span class="tag">${fmtDate(q.src[0][0])} ${q.src[0][1]}번</span>` : "";
  $("#app").innerHTML = `<div class="exam">
    <article class="qcard">
      <div class="qhead"><span class="qno">${S.cur + 1}</span><span class="tag">${q.s}과목 ${SUBJ[q.s]}</span>${srcTag}
        <button class="flagbtn ${S.flags.has(S.cur) ? "on" : ""}" onclick="flag()">${S.flags.has(S.cur) ? "표시됨" : "나중에 다시 보기"}</button></div>
      ${qBody(i)}
      <div class="opts">${q.o.map((t, o) => `<button class="opt ${S.ans[S.cur] === o ? "sel" : ""}" onclick="pick(${o})"><span class="bub">${o + 1}</span><span>${esc(t)}</span></button>`).join("")}</div>
      <div class="nav"><button class="btn" onclick="go(S.cur-1)" ${S.cur ? "" : "disabled"}>이전</button><span class="sp"></span>
        ${S.cur < n - 1 ? `<button class="btn primary" onclick="go(S.cur+1)">다음</button>` : `<button class="btn primary" onclick="askSubmit()">답안 제출</button>`}</div>
      <p class="kbd">키보드: 1–4 답 선택 · ←/→ 이동 · F 표시</p>
    </article>
    <aside class="omr" aria-label="답안지"><h3><span>OMR 답안지</span><span class="num">${done}/${n}</span></h3><div class="omr-grid">${omr}</div>
      <p class="legend">번호에 물결 밑줄 = 다시 볼 문항</p></aside></div>`;
}
function go(k) { if (k < 0 || k >= S.items.length) return; S.cur = k; renderExam(); if (innerWidth <= 860) $(".qcard").scrollIntoView({block:"start"}); }
function pick(o, k = S.cur) { S.ans[k] = S.ans[k] === o ? null : o; renderExam(); }
function flag() { S.flags.has(S.cur) ? S.flags.delete(S.cur) : S.flags.add(S.cur); renderExam(); }
function askQuit() {
  modal(`<h2>시험을 그만둘까요?</h2><p>표시한 답안은 저장되지 않습니다.</p><div class="row"><button class="btn" onclick="modal('')">계속 풀기</button><button class="btn primary" onclick="modal('');home()">처음으로</button></div>`);
}
function askSubmit() {
  const left = S.ans.filter(a => a === null).length;
  modal(`<h2>답안을 제출할까요?</h2><p>${left ? `아직 ${left}문항이 비어 있습니다. 빈 문항은 오답으로 채점됩니다.` : "모든 문항에 답했습니다."}${S.flags.size ? ` 다시 보기 표시 ${S.flags.size}문항.` : ""}</p>
    <div class="row"><button class="btn" onclick="modal('')">계속 풀기</button><button class="btn primary" onclick="modal('');finishExam()">제출하고 채점</button></div>`);
}
function finishExam(timeout) {
  clearInterval(timerId);
  S.mode = "result"; S.timeout = !!timeout; S.used = Math.min(EXAM_MIN * 60000, EXAM_MIN * 60000 - (S.end - Date.now()));
  S.items.forEach((i, k) => { if (S.ans[k] !== null) record(i, S.ans[k] === Q[i].a); else record(i, false); });
  const correct = S.items.filter((i, k) => S.ans[k] === Q[i].a).length;
  S.score = Math.round(correct / S.items.length * 100);
  if (S.kind === "past") try { localStorage.setItem("nm2-ex-" + S.date, JSON.stringify(S.score)); } catch (e) {}
  reviewFilter = "ng"; renderResult(); scrollTo(0, 0);
}
function optList(i, mine) {
  const q = Q[i];
  return `<ol>${q.o.map((t, o) => `<li class="${o === q.a ? "c" : o === mine ? "w" : ""}"><span class="bub">${o + 1}</span><span class="ot"><span>${esc(t)}${o === q.a ? " <b>· 정답</b>" : o === mine ? " · 내 답" : ""}</span>${optNote(q, o)}</span></li>`).join("")}</ol>`;
}
const expBox = q => `<div class="exp"><b>정답 ${C[q.a]} 이유</b>\n${esc(q.x[0])}</div>`;
const optNote = (q, o) => `<span class="oe ${o === q.a ? "c" : "n"}"><b>${o === q.a ? "정답" : "오답"}</b> · ${esc(q.x[o + 1])}</span>`;
const srcLine = q => q.src.map(([d, n]) => `${fmtDate(d)} ${n}번`).join(" · ");
function renderResult() {
  const n = S.items.length, correct = S.items.filter((i, k) => S.ans[k] === Q[i].a).length, blank = S.ans.filter(a => a === null).length;
  const pass = S.score >= PASS, mm = Math.round(S.used / 60000), pr = S.kind === "practice";
  $("#bar").innerHTML = `<button class="brand" onclick="home()">네트워크관리사 2급<small>${esc(S.title)} 결과</small></button><span class="sp"></span><button class="btn" onclick="home()">처음으로</button>`;
  const rows = [1,2,3,4].map(s => {
    const ks = S.items.map((i, k) => k).filter(k => Q[S.items[k]].s === s);
    if (!ks.length) return "";
    const c = ks.filter(k => S.ans[k] === Q[S.items[k]].a).length, p = Math.round(c / ks.length * 100);
    return `<tr><td>${s}과목 ${SUBJ[s]}</td><td class="r">${c} / ${ks.length}</td><td class="r">${p}%<span class="pbar"><i style="width:${p}%"></i></span></td></tr>`;
  }).join("");
  const list = S.items.map((i, k) => ({i, k, st: S.ans[k] === null ? "off" : S.ans[k] === Q[i].a ? "ok" : "ng"}))
    .filter(r => reviewFilter === "all" || (reviewFilter === "ng" ? r.st !== "ok" : r.st === reviewFilter || (reviewFilter === "fl" && S.flags.has(r.k))));
  const cnt = {ng: S.items.filter((i, k) => S.ans[k] !== Q[i].a).length, fl: S.flags.size};
  $("#app").innerHTML = `<section class="result">
    <div class="score">
      <div><div class="big num">${S.score}<small>/100</small></div>${pr ? `<div class="foot">정답률</div>` : `<span class="stamp ${pass ? "pass" : "fail"}">${pass ? "합격" : "불합격"}</span>`}</div>
      <div style="min-width:0">
        <div class="meter"><i style="width:${S.score}%"></i><b></b></div>
        <div class="mlabels"><span>0</span><span>합격선 ${PASS}</span><span>100</span></div>
        <div class="facts"><span>맞힘 <strong class="num">${correct}</strong></span><span>틀림 <strong class="num">${n - correct - blank}</strong></span><span>빈 문항 <strong class="num">${blank}</strong></span>${pr ? "" : `<span>걸린 시간 <strong class="num">${mm}분</strong>${S.timeout ? " (시간 종료)" : ""}</span>`}</div>
      </div>
    </div>
    <div class="tbl"><table class="parts"><thead><tr><th>과목</th><th style="text-align:right">맞힘</th><th style="text-align:right">정답률</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="acts">
      ${pr ? "" : `<button class="btn primary" onclick="${S.kind === "mock" ? "startMock()" : `startExam('${S.date}')`}">${S.kind === "mock" ? "새 모의고사" : "이 회차 다시 풀기"}</button>`}
      <button class="btn" onclick="retryWrong()" ${cnt.ng ? "" : "disabled"}>틀린 ${cnt.ng}문항 바로 다시 풀기</button>
      <button class="btn ghost" onclick="home()">처음으로</button>
    </div>
    <div class="block">
      <h2 class="sec">문항 검토</h2>
      <div class="filters">${[["ng","틀린 문항 " + cnt.ng],["all","전체 " + n],["fl","표시한 문항 " + cnt.fl]].map(([f, l]) => `<button class="chip ${reviewFilter === f ? "on" : ""}" onclick="reviewFilter='${f}';renderResult()">${l}</button>`).join("")}</div>
      <div class="review">${list.length ? list.map(({i, k, st}) => `<article class="rv ${st}">
        <div class="qhead"><span class="qno" style="font-size:20px">${k + 1}</span><span class="stt ${st}">${st === "ok" ? "정답" : S.ans[k] === -1 ? "시간 초과" : st === "ng" ? "오답" : "미응답"}</span><span class="tag">${SUBJ[Q[i].s]}</span><span class="tag">${srcLine(Q[i])}</span></div>
        ${qBody(i)}${expBox(Q[i])}${optList(i, S.ans[k])}</article>`).join("") : `<p class="foot">해당하는 문항이 없습니다.</p>`}</div>
    </div></section>`;
}
function retryWrong() {
  const items = S.items.filter((i, k) => S.ans[k] !== Q[i].a);
  beginPractice({title:"틀린 문항 다시 풀기", items});
}

/* ---------- practice (instant feedback) ---------- */
function startPractice(s, wrongOnly) {
  let pool = s ? BYSUB[s].slice() : Q.map((_, i) => i);
  if (wrongOnly) pool = pool.filter(isWrong);
  if (PREF.order === "rand") pool = shuffle(pool);
  else if (PREF.order === "new") pool = [...shuffle(pool.filter(i => !STATS[Q[i].id])), ...shuffle(pool.filter(i => STATS[Q[i].id]))];
  else pool.sort((a, b) => Q[a].id.localeCompare(Q[b].id));
  if (PREF.cnt !== "all") pool = pool.slice(0, +PREF.cnt);
  beginPractice({title:(s ? SUBJ[s] : "전 과목") + (wrongOnly ? " 오답" : " 풀이"), items:pool});
}
// 과목별 풀이: 문항마다 Q_SEC초. 시간이 지나면 오답(-1)으로 기록하고 정답을 보여 준다.
// 기한은 문항별로 처음 볼 때 정해지며, 다른 문항으로 넘어가도 계속 흐른다.
const Q_SEC = 30, TIMEOUT = -1;
function beginPractice(o) {
  clearInterval(timerId);
  S = Object.assign({timed:true}, o, {mode:"practice", ans:Array(o.items.length).fill(null), dl:Array(o.items.length).fill(0), cur:0});
  if (S.timed) timerId = setInterval(ptick, 200);
  renderPractice(); scrollTo(0, 0);
}
function ptick() {
  if (!S || S.mode !== "practice" || !S.timed) return;
  const el = $("#ptimer");
  if (S.ans[S.cur] !== null) { if (el) el.hidden = true; return; }
  const left = Math.max(0, S.dl[S.cur] - Date.now());
  if (el) { el.hidden = false; el.textContent = `${Math.ceil(left / 1000)}초`; el.classList.toggle("warn", left < 10000); }
  if (left <= 0) { S.ans[S.cur] = TIMEOUT; record(S.items[S.cur], false); renderPractice(); }
}
function renderPractice() {
  if (S.timed && S.ans[S.cur] === null && !S.dl[S.cur]) S.dl[S.cur] = Date.now() + Q_SEC * 1000;
  const n = S.items.length, i = S.items[S.cur], q = Q[i], mine = S.ans[S.cur], answered = mine !== null;
  const ok = S.ans.filter((a, k) => a !== null && a === Q[S.items[k]].a).length, done = S.ans.filter(a => a !== null).length;
  $("#bar").innerHTML = `<button class="brand" onclick="home()">네트워크관리사 2급<small>${esc(S.title)}</small></button><span class="sp"></span>
    <span class="prog num">${S.cur + 1}/${n} · 맞힘 ${ok}/${done}</span><span class="timer" id="ptimer" title="문항당 ${Q_SEC}초" hidden></span><button class="btn" onclick="practiceDone()">그만 풀고 결과 보기</button>`;
  const st = STATS[q.id];
  const head = mine === q.a ? "정답입니다" : mine === TIMEOUT ? `시간 초과 · 오답 처리 · 정답 ${C[q.a]}` : `오답입니다 · 정답 ${C[q.a]}`;
  const fb = answered ? `<div class="fb ${mine === q.a ? "ok" : "ng"}"><strong>${head}</strong>${expBox(q)}</div>` : "";
  $("#app").innerHTML = `<div class="exam solo"><article class="qcard">
    <div class="qhead"><span class="qno">${S.cur + 1}</span><span class="tag">${q.s}과목 ${SUBJ[q.s]}</span><span class="tag">${srcLine(q)}</span>
      ${st ? `<span class="tag">기록 ${st.c}/${st.t}</span>` : ""}</div>
    ${qBody(i)}
    <div class="opts">${q.o.map((t, o) => `<button class="opt ${answered ? (o === q.a ? "fb-c" : o === mine ? "fb-w" : "") : ""}" onclick="answer(${o})" ${answered ? "disabled" : ""}><span class="bub">${o + 1}</span><span class="ot"><span>${esc(t)}</span>${answered ? optNote(q, o) : ""}</span></button>`).join("")}</div>
    ${fb}
    <div class="nav"><button class="btn" onclick="pgo(S.cur-1)" ${S.cur ? "" : "disabled"}>이전</button><span class="sp"></span>
      ${S.cur < n - 1 ? `<button class="btn primary" onclick="pgo(S.cur+1)">다음 문제</button>` : `<button class="btn primary" onclick="practiceDone()">결과 보기</button>`}</div>
    <p class="kbd">${S.timed ? `문항당 ${Q_SEC}초 · 시간이 지나면 오답으로 처리됩니다 · ` : ""}키보드: 1–4 답 선택 · ←/→ 또는 Enter 이동</p>
  </article></div>`;
  ptick();
}
function answer(o) { if (S.ans[S.cur] !== null) return; S.ans[S.cur] = o; record(S.items[S.cur], o === Q[S.items[S.cur]].a); renderPractice(); }
function pgo(k) { if (k < 0 || k >= S.items.length) return; S.cur = k; renderPractice(); $(".qcard").scrollIntoView({block:"start"}); }
function practiceDone() {
  clearInterval(timerId);
  const done = S.items.map((i, k) => k).filter(k => S.ans[k] !== null);
  if (!done.length) return home();
  S.items = done.map(k => S.items[k]); S.ans = done.map(k => S.ans[k]);
  S.kind = "practice"; S.mode = "result"; S.flags = new Set(); S.used = 0;
  S.score = Math.round(S.items.filter((i, k) => S.ans[k] === Q[i].a).length / S.items.length * 100);
  reviewFilter = "ng"; renderResult(); scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!S || $("#modal").innerHTML || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.mode === "exam") {
    if ("1234".includes(e.key) && e.key) pick(+e.key - 1);
    else if (e.key === "ArrowRight") go(S.cur + 1);
    else if (e.key === "ArrowLeft") go(S.cur - 1);
    else if (e.key === "f" || e.key === "F") flag();
  } else if (S.mode === "practice") {
    if ("1234".includes(e.key) && e.key) answer(+e.key - 1);
    else if (e.key === "ArrowRight" || (e.key === "Enter" && S.ans[S.cur] !== null)) S.cur < S.items.length - 1 ? pgo(S.cur + 1) : practiceDone();
    else if (e.key === "ArrowLeft") pgo(S.cur - 1);
  }
});

home();
</script>

</body></html>
