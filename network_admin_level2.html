<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>네트워크관리사 2급 모의고사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: OMR answer-card exam — question sheet left, printed OMR column right (stacks on phones); patch-cable blue ink */
:root{
  --paper:#F5F7F8; --sheet:#FFFFFF; --ink:#16202A; --muted:#5E6B76; --line:#DCE3E8;
  --acc:#1F5FA8; --acc-soft:#E3ECF7; --mark:#16202A;
  --good:#22775A; --good-soft:#E0F1EA; --bad:#B24A2A; --bad-soft:#F7E6DF; --off:#7F8A93; --off-soft:#ECEFF2;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171C; --sheet:#1B2229; --ink:#E9EEF2; --muted:#9AA7B2; --line:#2E3842;
  --acc:#6FA8EE; --acc-soft:#1E2E42; --mark:#E9EEF2;
  --good:#5CC79C; --good-soft:#16332A; --bad:#EE916E; --bad-soft:#3A2219; --off:#8C98A2; --off-soft:#262E36; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1B2229; --ink:#E9EEF2; --muted:#9AA7B2; --line:#2E3842;
  --acc:#6FA8EE; --acc-soft:#1E2E42; --mark:#E9EEF2;
  --good:#5CC79C; --good-soft:#16332A; --bad:#EE916E; --bad-soft:#3A2219; --off:#8C98A2; --off-soft:#262E36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--acc);
  display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;color:var(--acc);background:none;border:0;padding:0}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px;font-weight:500}
.bar .sp{flex:1}
.timer{font-family:var(--mono);font-size:20px;font-weight:600;padding:2px 10px;border:1.5px solid var(--ink);border-radius:4px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.prog{font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:8px 14px;border-radius:4px;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* home */
.home{max-width:900px;margin:32px auto 0;display:grid;gap:32px}
.home h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.home h1 span{color:var(--acc)}
.lede{color:var(--muted);margin:0;max-width:62ch}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet);margin:0}
.spec div{padding:14px 16px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:0}
.spec dt{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.spec dd{margin:2px 0 0;font-weight:700;font-size:18px}
.block{display:grid;gap:12px}
h2.sec{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:700}
.mock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--sheet);border:1.5px solid var(--acc);border-radius:6px;padding:20px}
@media (max-width:620px){.mock{grid-template-columns:1fr}}
.alloc{display:flex;height:34px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.alloc div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--sheet);white-space:nowrap;overflow:hidden;min-width:0}
.alloc .s1{background:var(--acc)} .alloc .s2{background:color-mix(in srgb,var(--acc) 72%,var(--sheet))}
.alloc .s3{background:color-mix(in srgb,var(--acc) 50%,var(--ink))} .alloc .s4{background:var(--muted)}
.allocl{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.allocl b{color:var(--ink);font-family:var(--mono)}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sub{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.sub .sn{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:600}
.sub .st{font-weight:700;font-size:17px;line-height:1.3}
.sub .sm{font-size:12px;color:var(--muted);font-family:var(--mono)}
.bar2{height:6px;background:var(--off-soft);border-radius:999px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--good)}
.sub .row{display:flex;gap:6px;flex-wrap:wrap}
.sub .row .btn{padding:6px 10px;font-size:13px}
.opts-row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.opts-row label{display:flex;gap:6px;align-items:center}
.opts-row select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exb{display:grid;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.exb:hover,.sub .btn:hover{border-color:var(--acc)}
.exb .d{font-family:var(--mono);font-weight:600}
.exb .m{font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:860px){.exam{grid-template-columns:1fr}}
.exam.solo{grid-template-columns:minmax(0,820px);justify-content:center}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px;min-width:0}
@media (max-width:620px){.qcard{padding:18px 16px}}
.qhead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--display);font-size:28px;color:var(--acc);line-height:1}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.flagbtn{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 10px;font-size:13px}
.flagbtn.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.qtext{font-size:17px;font-weight:600;line-height:1.65;margin:0 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.fig{margin:12px 0;padding:8px;background:#fff;border:1px solid var(--line);border-radius:4px;display:grid;justify-items:center}
.fig img{display:block;max-width:100%;height:auto;width:min(100%,520px)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:12px 14px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;margin-top:1px}
.opt.sel{border-color:var(--ink)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt:disabled{cursor:default}
.opt.fb-c{border-color:var(--good);background:var(--good-soft)}
.opt.fb-c .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.fb-w{border-color:var(--bad);background:var(--bad-soft)}
.opt.fb-w .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.fb{margin-top:14px;border-radius:6px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.fb.ok{background:var(--good-soft)} .fb.ng{background:var(--bad-soft)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.ng strong{color:var(--bad)}
.exp{font-size:14px;background:var(--paper);border-radius:4px;padding:10px 12px;white-space:pre-line;overflow-wrap:anywhere}
.exp b{color:var(--acc)}
.ot{display:grid;gap:4px;min-width:0}
.oe{font-size:13.5px;line-height:1.55;color:var(--muted);font-weight:400}
.oe b{font-weight:700}
.oe.c b{color:var(--good)} .oe.n b{color:var(--bad)}
.nav{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.nav .sp{flex:1}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}

.omr{background:var(--sheet);border:1.5px solid var(--acc);border-radius:6px;padding:14px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.omr{position:static;max-height:none}}
.omr h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--acc);display:flex;justify-content:space-between}
.omr .sh{font-size:11px;color:var(--muted);margin:8px 4px 2px;letter-spacing:.04em}
.omr-grid{display:grid;grid-template-columns:1fr;gap:1px}
@media (max-width:860px){.omr-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:16px}}
.orow{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px}
.orow.cur{background:var(--acc-soft)}
.orow .n{width:30px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--acc);border:0;background:none;padding:0 4px 0 0}
.orow .n.fl{color:var(--bad);text-decoration:underline wavy}
.ob{width:20px;height:20px;border-radius:50%;border:1px solid var(--acc);background:transparent;color:var(--acc);font-family:var(--mono);font-size:10px;padding:0;display:grid;place-items:center}
.ob.on{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px;max-width:420px;width:100%}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* result */
.result{margin-top:28px;display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px}
@media (max-width:620px){.score{grid-template-columns:1fr}}
.big{font-family:var(--display);font-size:clamp(56px,12vw,88px);line-height:1}
.big small{font-family:var(--mono);font-size:18px;color:var(--muted);margin-left:6px}
.stamp{display:inline-block;font-family:var(--display);font-size:22px;padding:4px 14px;border:3px solid currentColor;border-radius:6px;transform:rotate(-4deg);margin-top:10px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--bad)}
.meter{position:relative;height:12px;background:var(--off-soft);border-radius:999px;margin:14px 0 6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
.meter b{position:absolute;top:-3px;bottom:-3px;left:60%;width:2px;background:var(--bad)}
.mlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.facts strong{color:var(--ink)}
.tbl{overflow-x:auto}
.parts{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line)}
.parts th,.parts td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
.parts th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.parts td.r{text-align:right;font-family:var(--mono)}
.pbar{display:inline-block;width:80px;height:6px;background:var(--off-soft);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.review{display:grid;gap:12px}
.rv{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--off);border-radius:6px;padding:16px 18px;min-width:0}
.rv.ok{border-left-color:var(--good)} .rv.ng{border-left-color:var(--bad)}
.rv .qhead{margin-bottom:6px}
.rv .qtext{font-size:15px}
.stt{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.stt.ok{background:var(--good-soft);color:var(--good)} .stt.ng{background:var(--bad-soft);color:var(--bad)} .stt.off{background:var(--off-soft);color:var(--off)}
.rv ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.rv li{display:flex;gap:8px;font-size:14px;padding:4px 8px;border-radius:4px;overflow-wrap:anywhere;min-width:0}
.rv li.c{background:var(--good-soft)} .rv li.w{background:var(--bad-soft)}
.rv li .bub{width:20px;height:20px;font-size:10px}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{from{transform:scale(1.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}}
</style>

<div class="wrap">
  <header class="bar" id="bar"></header>
  <main id="app"></main>
</div>
<div id="modal"></div>

<script>
const DATA = {"q":[{"id":"20230226-01","s":1,"q":"C Class에서 유효한 IP Address는?","o":["33.114.17.24","128.46.83.25","202.67.13.87","222.248.256.34"],"a":2,"im":[],"src":[["20230226",1],["20260802",1]],"x":["C Class는 첫 옥텟이 192~223이고 각 옥텟은 0~255 범위여야 한다. 202.67.13.87만 두 조건을 모두 만족한다.","33은 첫 옥텟 1~126 범위라 A Class다.","128은 첫 옥텟 128~191 범위라 B Class다.","202는 192~223 범위이고 나머지 옥텟도 0~255 안에 있어 유효한 C Class 주소다.","첫 옥텟 222는 C Class 범위지만 세 번째 옥텟 256이 최대값 255를 넘어 주소로 쓸 수 없다."]},{"id":"20230226-02","s":1,"q":"ICMPv6에서 IPv4의 ARP 역할 및 특정 호스트로의 전달 가능 여부 검사 기능을 하는 메시지는?","o":["재지정 메시지(Redirection)","에코 요청 메시지(Echo request)","이웃 요청과 광고 메시지(Neighbor Solicitation and Advertisement)","목적지 도달 불가 메시지(Destination unreachable)"],"a":2,"im":[],"src":[["20230226",2],["20250824",3]],"x":["IPv6에는 ARP가 없고, ICMPv6의 NDP(Neighbor Discovery) 메시지인 이웃 요청(NS)·이웃 광고(NA)가 MAC 주소 확인과 이웃 도달 가능성 확인을 맡는다.","Redirect는 라우터가 호스트에게 더 나은 다음 홉을 알려 주는 메시지로 주소 해석과는 관계없다.","Echo Request는 ping에 쓰이는 메시지로 상대가 살아 있는지만 확인할 뿐 MAC 주소를 알아내지 않는다.","Neighbor Solicitation/Advertisement는 IPv4의 ARP 요청/응답에 해당하며 이웃 도달 불가 탐지(NUD)에도 쓰인다.","Destination Unreachable은 패킷을 목적지까지 전달하지 못했을 때 보내는 오류 보고 메시지다."]},{"id":"20230226-03","s":1,"q":"TCP 헤더의 플래그 비트로 옳지 않은 것은?","o":["URG","UTC","ACK","RST"],"a":1,"im":[],"src":[["20230226",3],["20240519",4],["20260517",6]],"x":["TCP 플래그는 URG, ACK, PSH, RST, SYN, FIN(그리고 ECE, CWR)이다. UTC는 협정 세계시를 뜻하는 말로 TCP 플래그가 아니다.","URG는 긴급 데이터가 있음을 알리고 긴급 포인터 필드를 유효하게 만드는 플래그다.","UTC(Coordinated Universal Time)는 시간 표준이며 TCP 헤더에 없는 이름이다.","ACK는 확인 응답 번호 필드가 유효함을 나타내는 플래그다.","RST는 연결을 강제로 재설정(중단)할 때 쓰는 플래그다."]},{"id":"20230226-04","s":1,"q":"TCP 헤더에는 수신측 버퍼의 크기에 맞춰 송신측에서 데이터의 크기를 적절하게 조절할 수 있게 해주는 필드가 있다. 이 필드를 이용한 흐름 제어 기법은?","o":["Sliding Window","Stop and Wait","Xon/Xoff","CTS/RTS"],"a":0,"im":[],"src":[["20230226",4]],"x":["TCP 헤더의 Window Size 필드로 수신측이 받을 수 있는 버퍼 크기를 알려 주고, 송신측은 그 범위 안에서 여러 세그먼트를 연속 전송한다. 이것이 슬라이딩 윈도우 방식이다.","Sliding Window는 Window 필드 값에 맞춰 전송량을 동적으로 조절하는 TCP의 흐름 제어 방식이다.","Stop and Wait는 한 프레임을 보내고 ACK를 받을 때까지 기다리는 단순한 방식으로 윈도우 필드를 쓰지 않는다.","Xon/Xoff는 직렬 통신에서 제어 문자로 송신을 멈추고 재개시키는 소프트웨어 흐름 제어다.","CTS/RTS는 하드웨어 신호선이나 무선 LAN에서 송신 허가를 주고받는 방식으로 TCP 헤더 필드와 무관하다."]},{"id":"20230226-05","s":1,"q":"인터넷에서 멀티캐스트를 위하여 사용되는 프로토콜은?","o":["IGMP","ICMP","SMTP","DNS"],"a":0,"im":[],"src":[["20230226",5]],"x":["IGMP는 호스트가 멀티캐스트 그룹에 가입·탈퇴하는 것을 라우터에 알리는 프로토콜이다.","IGMP(Internet Group Management Protocol)는 멀티캐스트 그룹 멤버십 관리를 담당한다.","ICMP는 오류 보고와 진단(ping 등)용 프로토콜이다.","SMTP는 전자우편 전송 프로토콜이다.","DNS는 도메인 이름을 IP 주소로 바꿔 주는 서비스다."]},{"id":"20230226-06","s":1,"q":"원격 컴퓨터에 안전하게 액세스하기 위한 유닉스 기반의 명령 인터페이스 및 프로토콜로, 기본적으로 22번 포트를 사용하고, 클라이언트/서버 연결의 양단은 전자 서명을 사용하여 인증되며, 패스워드는 암호화하여 보호되는 것은?","o":["SSH","IPSec","SSL","PGP"],"a":0,"im":[],"src":[["20230226",6]],"x":["22번 포트, 원격 명령 인터페이스, 공개키 기반 인증과 암호화된 패스워드는 SSH의 특징이다.","SSH는 Telnet·rlogin을 대체하는 암호화된 원격 접속 프로토콜로 TCP 22번을 쓴다.","IPSec은 네트워크 계층에서 IP 패킷을 암호화·인증하는 프로토콜 모음으로 원격 셸 인터페이스가 아니다.","SSL은 웹 등 응용 데이터를 전송 계층 위에서 암호화하는 프로토콜이며 22번 포트와 관계없다.","PGP는 전자우편 암호화·서명 프로그램이다."]},{"id":"20230226-07","s":1,"q":"서울본사에 근무하는 Kim은 신규부서에 IP를 할당하려고 L3스위치에 접속하였는데 IP검색 도중에 허가되지 않은 불법 IP 및 mac address를 발견하여 차단조치 하였다. Kim이 L3 스위치에서 불법 IP를 검색하기 위해서 내린 명령어(A)를 선택하시오. (단, 불법적으로 사용된 IP는 아래의 그림이며 사용된 L3 스위치는 Cisco 3750G이다.)","o":["rarp","vlan","cdp","arp"],"a":3,"im":[0],"src":[["20230226",7]],"x":["L3 스위치(Cisco)에서 IP와 MAC 주소의 대응을 보려면 ARP 테이블을 조회하는 'show arp'(또는 show ip arp) 명령을 쓴다. 그림처럼 IP–MAC 목록이 나오는 것은 arp 명령의 결과다.","rarp는 MAC으로 IP를 얻는 옛 프로토콜이며 스위치에서 IP–MAC 목록을 보는 명령이 아니다.","vlan은 VLAN을 만들거나 VLAN 정보를 보는 명령으로 IP–MAC 대응표가 나오지 않는다.","cdp는 이웃한 Cisco 장비 정보를 보는 명령이다.","show arp는 ARP 캐시에 저장된 IP 주소와 MAC 주소, 인터페이스를 보여 주므로 불법 IP와 MAC을 찾을 때 쓴다."]},{"id":"20230226-08","s":1,"q":"C Class인 네트워크의 서브넷 마스크가 '255.255.255.192'이라면 둘 수 있는 서브넷의 개수는?","o":["2","4","192","1024"],"a":1,"im":[],"src":[["20230226",8],["20250525",4]],"x":["255.255.255.192는 /26이므로 C Class 기본 /24에서 2비트를 서브넷에 빌린다. 2^2 = 4개의 서브넷이 생긴다.","2개는 1비트만 빌린 255.255.255.128(/25)의 경우다.","192비트가 아니라 2비트를 빌렸으므로 2^2 = 4개다.","192는 마스크의 마지막 옥텟 값일 뿐 서브넷 개수가 아니다.","1024는 10비트를 빌려야 나오는 수로 C Class에서는 불가능하다."]},{"id":"20230226-09","s":1,"q":"다음 중에서 IPv6의 특징이 아닌 것은?","o":["128bit로 구성된다.","Broadcast를 사용한다.","모바일 IP, IPsec 프로토콜 사용이 가능하다.","IP가 1234::12FB:3:89A0:034C처럼 표시된다."],"a":1,"im":[],"src":[["20230226",9],["20240519",13]],"x":["IPv6에는 브로드캐스트가 없다. 대신 멀티캐스트와 애니캐스트를 사용한다.","IPv6 주소는 128비트다.","IPv6는 브로드캐스트를 없애고 멀티캐스트로 대체했으므로 틀린 설명이다.","IPv6는 모바일 IP와 IPsec을 기본으로 지원하도록 설계되었다.","IPv6는 16비트씩 콜론으로 나눈 16진수로 표기하고 연속된 0은 ::로 줄일 수 있다."]},{"id":"20230226-10","s":1,"q":"다음 응용계층 프로토콜 중에 전송계층의 프로토콜 TCP,UDP를 모두 사용하는 프로토콜은 무엇인가?","o":["FTP","SMTP","DNS","SNMP"],"a":2,"im":[],"src":[["20230226",10]],"x":["DNS는 일반 질의에 UDP 53번을, 응답이 크거나 영역 전송(Zone Transfer)을 할 때 TCP 53번을 사용한다.","FTP는 TCP 20·21번만 사용한다.","SMTP는 TCP 25번만 사용한다.","DNS는 UDP 53(질의)과 TCP 53(영역 전송·큰 응답)을 모두 쓴다.","SNMP는 UDP 161·162번을 사용한다."]},{"id":"20230226-11","s":1,"q":"다음 출력물에 대한 설명으로 옳지 않은 것은?","o":["ping 명령어를 이용하여 목적지(www.icqa.or.kr)와 정상적으로 통신되었을 확인하였다.","ping 명령어를 이용하여 요청하고 응답받은 데이터의 사이즈는 32바이트이다.","ping 명령어를 이용하여 요청하고 응답받은 시간은 평균 2ms 이다.","패킷의 살아 있는 시간(TTL, Time to Live)은 55초이다."],"a":3,"im":[1],"src":[["20230226",11],["20260517",10]],"x":["TTL=55는 '초'가 아니라 패킷이 지날 수 있는 남은 홉(라우터) 수다. 윈도우 ping 결과의 TTL은 시간 단위가 아니다.","4개를 보내 4개를 받았고 손실 0%이므로 정상 통신을 확인한 것이 맞다.","'바이트=32'와 '32바이트 데이터 사용'에서 크기가 32바이트임을 알 수 있다.","통계의 '평균 = 2ms'와 일치한다.","TTL은 라우터를 지날 때마다 1씩 줄어드는 홉 카운트 값으로 55초라는 해석은 틀렸다."]},{"id":"20230226-12","s":1,"q":"TLS를 통해 Application 계층 데이터를 암호화하여 보호해주고 기본포트가 443으로 지정된 프로토콜은 무엇인가?","o":["HTTPS","HTTP","FTP","SSH"],"a":0,"im":[],"src":[["20230226",12]],"x":["HTTPS는 HTTP를 TLS로 암호화한 프로토콜로 기본 포트는 443번이다.","HTTPS = HTTP over TLS, 기본 포트 443.","HTTP는 암호화하지 않으며 기본 포트는 80번이다.","FTP는 파일 전송용이며 20·21번을 쓴다.","SSH는 원격 접속용 암호화 프로토콜로 22번을 쓴다."]},{"id":"20230226-13","s":1,"q":"SMTP에 대한 설명으로 올바른 것은?","o":["WWW에서 사용하는 데이터 전송 프로토콜이다.","네트워크 장비들을 관리하기 위한 프로토콜이다.","파일 전송을 위한 프로토콜이다.","인터넷 전자 우편을 위한 프로토콜이다."],"a":3,"im":[],"src":[["20230226",13]],"x":["SMTP(Simple Mail Transfer Protocol)는 전자우편을 보내고 메일 서버 간에 전달하는 프로토콜이다(TCP 25).","WWW 데이터 전송은 HTTP의 역할이다.","네트워크 장비 관리는 SNMP의 역할이다.","파일 전송은 FTP의 역할이다.","SMTP는 인터넷 전자우편 송신·중계용 프로토콜이다."]},{"id":"20230226-14","s":1,"q":"물리적 하드웨어 주소를 IP Address로 매핑시키는 프로토콜은?","o":["DHCP","ICMP","ARP","RARP"],"a":3,"im":[],"src":[["20230226",14]],"x":["RARP는 자신의 MAC(물리) 주소로 IP 주소를 알아내는 프로토콜이다. ARP는 그 반대다.","DHCP는 IP 주소 등 네트워크 설정을 자동으로 할당하는 프로토콜이다.","ICMP는 오류 보고와 진단용 프로토콜이다.","ARP는 IP 주소로 MAC 주소를 알아낸다(IP → MAC). 문제와 방향이 반대다.","RARP는 MAC 주소로 IP 주소를 얻는다(MAC → IP)."]},{"id":"20230226-15","s":1,"q":"UDP 계열 프로토콜로, 원격 관리에 필요한 정보와 서버상태를 관리하는 것은?","o":["FTP","DHCP","BOOTP","SNMP"],"a":3,"im":[],"src":[["20230226",15],["20251102",3]],"x":["SNMP는 UDP 161/162번을 쓰며 에이전트의 MIB 정보를 조회해 장비 상태를 원격으로 관리한다.","FTP는 TCP 기반 파일 전송 프로토콜이다.","DHCP는 UDP를 쓰지만 주소 할당용이지 상태 관리용이 아니다.","BOOTP는 UDP 기반으로 디스크 없는 호스트에 IP와 부팅 정보를 주는 프로토콜이다.","SNMP는 UDP 기반 네트워크 관리 프로토콜로 장비 상태 정보를 수집·관리한다."]},{"id":"20230226-16","s":1,"q":"다음 TCP/IP 계층 중 다른 계층에서 동작하는 것은?","o":["IP","SMTP","RARP","ARP"],"a":1,"im":[],"src":[["20230226",16]],"x":["IP, ARP, RARP는 인터넷(네트워크) 계층에서 동작하고, SMTP만 응용 계층 프로토콜이다.","IP는 인터넷 계층의 핵심 프로토콜이다.","SMTP는 응용 계층의 메일 전송 프로토콜이라 나머지와 계층이 다르다.","RARP는 인터넷(네트워크) 계층에서 동작한다(교재에 따라 링크 계층 경계로도 본다).","ARP도 인터넷 계층(네트워크 계층) 프로토콜로 분류된다."]},{"id":"20230226-17","s":1,"q":"다음 보기 중 RIP에 대한 설명으로 옳지 않은 것은?","o":["디스턴스 벡터(Distance Vector) 라우팅 프로토콜이다.","메트릭은 Hop Count를 사용한다.","표준 프로토콜이기 때문에 대부분의 라우터가 지원한다.","RIPv1, RIPv2 모두 멀티캐스트를 이용하여 광고한다."],"a":3,"im":[],"src":[["20230226",17]],"x":["RIPv1은 브로드캐스트(255.255.255.255)로 광고하고, RIPv2부터 멀티캐스트(224.0.0.9)를 쓴다. 그래서 '모두 멀티캐스트'는 틀리다.","RIP은 대표적인 거리 벡터 라우팅 프로토콜이다.","RIP의 메트릭은 홉 수이며 최대 15홉까지 유효하다.","RIP은 RFC로 표준화되어 대부분의 라우터가 지원한다.","RIPv1은 브로드캐스트, RIPv2는 멀티캐스트 224.0.0.9로 광고하므로 틀린 설명이다."]},{"id":"20230226-18","s":2,"q":"IEEE 표준안 중 CSMA/CA에 해당하는 표준은?","o":["802.1","802.2","802.3","802.11"],"a":3,"im":[],"src":[["20230226",18]],"x":["CSMA/CA는 무선 LAN 표준인 IEEE 802.11의 매체 접근 방식이다.","802.1은 LAN/MAN 브리징·관리(VLAN 802.1Q 등)를 다루는 표준군이다.","802.2는 LLC(논리 링크 제어) 표준이다.","802.3은 이더넷이며 CSMA/CD를 쓴다.","802.11은 무선 LAN이며 충돌 회피 방식인 CSMA/CA를 쓴다."]},{"id":"20230226-19","s":2,"q":"프로토콜 계층 구조상의 기본 구성요소 중 실체(Entity) 간의 통신 속도 및 메시지 순서를 위한 제어정보는?","o":["타이밍(Timing)","의미(Semantics)","구문(Syntax)","처리(Process)"],"a":0,"im":[],"src":[["20230226",19],["20240825",24],["20250223",22]],"x":["프로토콜의 3요소는 구문·의미·타이밍이다. 통신 속도 조절과 메시지 순서 제어는 타이밍에 해당한다.","타이밍(Timing)은 통신 속도를 맞추고 메시지 순서를 제어하는 요소다.","의미(Semantics)는 제어 정보와 오류 처리 방법 등 각 비트 패턴의 뜻을 정한다.","구문(Syntax)은 데이터 형식, 부호화, 신호 레벨을 정한다.","처리(Process)는 프로토콜 3요소에 포함되지 않는다."]},{"id":"20230226-20","s":2,"q":"OSI 7 Layer 중 데이터 링크 계층의 기능으로 옳지 않은 것은?","o":["통신 프로토콜을 정의한 OSI 7 Layer 중 세 번째 계층에 해당한다.","비트를 프레임화 시킨다.","전송, 형식 및 운용에서의 에러를 검색한다.","흐름제어를 통하여 데이터 링크 개체간의 트래픽을 제어한다."],"a":0,"im":[],"src":[["20230226",20]],"x":["데이터 링크 계층은 OSI 7계층 중 두 번째 계층이다. 세 번째는 네트워크 계층이다.","데이터 링크 계층은 2계층이므로 '세 번째 계층'은 틀린 설명이다.","물리 계층의 비트들을 프레임 단위로 묶는 것(프레이밍)은 데이터 링크 계층의 기능이다.","CRC 등으로 전송 중 오류를 검출하는 것은 데이터 링크 계층의 기능이다.","인접 노드 간 흐름 제어도 데이터 링크 계층의 기능이다."]},{"id":"20230226-21","s":2,"q":"다음 지문에서 ( ) 안에 들어갈 기술로 옳은 것은?","o":["VPN","NAT","PPP","PPPoE"],"a":0,"im":[2],"src":[["20230226",21],["20260517",21]],"x":["공중망(인터넷)을 전용선처럼 쓰는 사설망 기술로, 본사–지사 간 전용선보다 비용이 적게 드는 것은 VPN(가상 사설망)이다.","VPN은 터널링과 암호화로 공중망 위에 사설망을 구성한다.","NAT는 사설 IP와 공인 IP를 변환하는 기술로 사설망처럼 동작시키는 기술이 아니다.","PPP는 두 노드 사이 직렬 링크용 데이터 링크 프로토콜이다.","PPPoE는 이더넷 위에서 PPP 세션을 만드는 방식으로 주로 ADSL 가입자 인증에 쓰인다."]},{"id":"20230226-22","s":2,"q":"네트워크 계층의 데이터 단위를 나타내는 용어는?","o":["세그먼트","패킷","프레임","비트"],"a":1,"im":[],"src":[["20230226",22],["20251102",21]],"x":["OSI 계층별 PDU는 4계층 세그먼트, 3계층(네트워크) 패킷, 2계층 프레임, 1계층 비트다.","세그먼트는 전송 계층(4계층)의 데이터 단위다.","패킷은 네트워크 계층(3계층)의 데이터 단위다.","프레임은 데이터 링크 계층(2계층)의 데이터 단위다.","비트는 물리 계층(1계층)의 데이터 단위다."]},{"id":"20230226-23","s":2,"q":"다음의 (A)에 들어갈 알맞은 용어는 무엇인가?","o":["Wireless sensor networks","Wireless mesh networks","Software defined networks","Content delivery networks"],"a":1,"im":[3],"src":[["20230226",23]],"x":["애드혹처럼 노드끼리 트래픽을 중계·라우팅하고, 무선 AP를 전원만 연결하면 망을 확장할 수 있는 구조는 무선 메시 네트워크(WMN)다. 군사용 기술에서 출발했다.","WSN은 센서 노드가 환경 데이터를 수집하는 네트워크로 AP 중계 확장 구조와 다르다.","무선 메시 네트워크는 각 노드가 라우터 역할을 하며 다른 노드의 트래픽을 중계한다.","SDN은 제어 평면을 소프트웨어로 분리해 중앙에서 망을 제어하는 기술이다.","CDN은 콘텐츠를 여러 지역 캐시 서버에 분산해 빠르게 전달하는 서비스망이다."]},{"id":"20230226-24","s":2,"q":"센서 네트워크에서 센서 노드들의 센싱 데이터를 수집하는노드는?","o":["Sink","Actuator","RFID","Access Point"],"a":0,"im":[],"src":[["20230226",24]],"x":["센서 네트워크에서 각 센서 노드의 데이터를 모아 외부망(게이트웨이)으로 전달하는 노드를 싱크(Sink) 노드라고 한다.","Sink 노드는 센싱 데이터를 수집해 사용자나 외부 네트워크로 넘기는 집결 노드다.","Actuator는 받은 명령에 따라 실제 동작(모터, 밸브 등)을 수행하는 장치다.","RFID는 무선 주파수로 태그를 식별하는 기술이다.","Access Point는 무선 단말을 유선망에 연결하는 무선 LAN 장비다."]},{"id":"20230226-25","s":2,"q":"전송매체를 통한 데이터 전송 시 거리가 멀어질수록 신호의세기가 약해지는 현상은?","o":["감쇠 현상","상호변조 잡음","지연 왜곡","누화 잡음"],"a":0,"im":[],"src":[["20230226",25]],"x":["신호가 매체를 따라 멀리 갈수록 세기가 약해지는 것을 감쇠(Attenuation)라고 한다. 리피터나 증폭기로 보완한다.","감쇠는 거리에 따라 신호 에너지가 줄어드는 현상이다.","상호변조 잡음은 서로 다른 주파수 신호가 섞여 합·차 주파수 성분이 생기는 잡음이다.","지연 왜곡은 주파수 성분마다 전달 속도가 달라 신호 모양이 일그러지는 현상이다.","누화(Crosstalk)는 인접한 선로의 신호가 끼어드는 현상이다."]},{"id":"20230226-26","s":2,"q":"(A)안에 들어가는 용어 중 옳은 것은?","o":["WPAN","LTE-M","NB-IoT","LAN"],"a":0,"im":[4],"src":[["20230226",26],["20241103",20],["20250525",23]],"x":["약 10m 이내 짧은 거리에서 컴퓨터·주변기기·휴대폰·가전을 무선으로 연결하는 네트워크는 WPAN이다. UWB, ZigBee, 블루투스가 대표 기술이다.","WPAN(무선 개인 영역 네트워크)은 개인 주변 10m 안팎을 연결한다.","LTE-M은 LTE 기반 사물인터넷용 광역(LPWA) 이동통신 기술이다.","NB-IoT는 좁은 대역을 쓰는 광역 저전력 사물인터넷 기술이다.","LAN은 건물·캠퍼스 단위 근거리망으로 10m 개인 영역보다 넓다."]},{"id":"20230226-27","s":2,"q":"컴퓨터 추가 설정이 용이하고, 중앙관리가 가능한 네트워크토폴로지는?","o":["Bus","Star","Ring","Mesh"],"a":1,"im":[],"src":[["20230226",27],["20250525",20],["20260201",18]],"x":["스타형은 모든 단말이 중앙 장비(허브·스위치)에 연결되므로 단말 추가가 쉽고 중앙에서 관리할 수 있다.","버스형은 하나의 공유 케이블에 연결하는 구조로 중앙 관리 지점이 없다.","스타형은 중앙 노드를 통해 연결되어 추가·관리가 쉽다. 단점은 중앙 장비 고장 시 전체가 멈춘다는 점이다.","링형은 노드를 고리 모양으로 연결해 추가 시 링을 끊어야 한다.","메시형은 노드끼리 다중 연결되어 신뢰성은 높지만 회선이 많아 추가·관리가 어렵다."]},{"id":"20230226-28","s":3,"q":"Windows Server 2016의 시스템관리를 위해서 설계된 명령라인 셀 및 스크립팅 언어로, 강력한 확장성을 바탕으로 서버 상의 수많은 기능의 손쉬운 자동화를 지원하는 것은?","o":["PowerShell","C-Shell","K-Shell","Bourne-Shell"],"a":0,"im":[],"src":[["20230226",28]],"x":["PowerShell은 Windows 시스템 관리용 명령줄 셸이자 스크립트 언어로, cmdlet과 .NET 기반 확장성으로 서버 작업을 자동화한다.","PowerShell은 Windows Server 관리 자동화를 위해 만든 셸이다.","C-Shell(csh)은 C 언어와 비슷한 문법의 유닉스 셸이다.","K-Shell(ksh)은 Korn이 만든 유닉스 셸이다.","Bourne Shell(sh)은 초기 유닉스의 기본 셸이다."]},{"id":"20230226-29","s":3,"q":"다음 그림은 Windows Server 2016의 DNS 관리자의 모습이다. 현재 www라는 동일한 이름으로 3개의 레코드가 등록되어 클라이언트가 도메인을 제공하면 IP주소를 번갈아가며 제공한다. 이처럼 IP 요청을 분산하여 서버 부하를 줄이는 방식을 무엇이라고 하는가?","o":["라운드 로빈(Round Robin) 방식","큐(Queue) 방식","스택(Stack) 방식","FIFO(First In First Out) 방식"],"a":0,"im":[5],"src":[["20230226",29]],"x":["같은 이름(www)에 여러 A 레코드를 등록하면 DNS가 질의마다 IP를 순서대로 돌려 가며 응답한다. 이것이 라운드 로빈 부하 분산이다.","라운드 로빈은 여러 IP를 차례로 돌려 응답해 요청을 서버들에 분산한다.","큐는 먼저 들어온 것을 먼저 처리하는 자료구조로 DNS 부하 분산 방식의 이름이 아니다.","스택은 나중에 들어온 것을 먼저 꺼내는 자료구조다.","FIFO는 큐의 처리 원칙을 말하며 DNS 레코드 분산 방식이 아니다."]},{"id":"20230226-30","s":3,"q":"Windows Server 2016의 Hyper-V에 관한 설명으로 옳지않은 것은?","o":["하드웨어 데이터 실행 방지(DEP)가 필요하다.","서버관리자의 역할 추가를 통하여 Hyper-V 서비스를 제공 할 수 있다.","스냅숏을 통하여 특정 시점을 기록할 수 있다.","하나의 서버에는 하나의 가상 컴퓨터만 사용할 수 있다."],"a":3,"im":[],"src":[["20230226",30]],"x":["Hyper-V는 하나의 물리 서버에서 여러 가상 머신을 동시에 실행하는 가상화 기능이다.","Hyper-V 설치 조건에는 하드웨어 DEP, 64비트 CPU, 하드웨어 가상화(Intel VT/AMD-V) 지원이 있다.","서버 관리자의 '역할 및 기능 추가'로 Hyper-V 역할을 설치한다.","스냅숏(검사점)으로 가상 머신의 특정 시점 상태를 저장하고 되돌릴 수 있다.","하나의 호스트에 여러 가상 머신을 만들 수 있으므로 틀린 설명이다."]},{"id":"20230226-31","s":3,"q":"Windows Server 2016의 DNS Server 역할에서 지원하는레코드의 형식과 기능의 설명이다. 이 중 잘못 연결된 것은?","o":["A - 정규화된 도메인 이름을 32비트 IPv4 주소와 연결","AAAA - 정규화된 도메인 이름을 128비트 IPv6 주소와 연결","CNAME - 실제 도메인 이름과 연결되는 가상 도메인 이름","NS - 주어진 사서함에 도달할 수 있는 라우팅 정보를 제공"],"a":3,"im":[],"src":[["20230226",31]],"x":["NS 레코드는 해당 영역(도메인)의 권한 있는 네임서버를 지정한다. 메일 라우팅 정보를 주는 것은 MX 레코드다.","A 레코드는 호스트 이름을 32비트 IPv4 주소와 연결한다.","AAAA 레코드는 호스트 이름을 128비트 IPv6 주소와 연결한다.","CNAME은 실제 이름(정식 이름)에 별칭을 붙이는 레코드다.","사서함(메일) 라우팅은 MX 레코드의 기능이다. NS는 네임서버를 지정하므로 잘못 연결되었다."]},{"id":"20230226-32","s":3,"q":"Windows Server 2016에서 IIS 관리자의 기능으로 옳지 않은 것은?","o":["웹 사이트의 기본 웹 문서 폴더를 변경할 수 있다.","기본 웹 문서를 추가하거나 기본 웹 문서들의 우선순위를 조정할 수 있다.","가상 디렉터리의 이름은 실제 경로의 이름과 동일하게 해야 한다.","디렉터리 검색기능을 활성화하면 기본 문서가 없을 때 파일들의 목록이 나타난다."],"a":2,"im":[],"src":[["20230226",32]],"x":["IIS 가상 디렉터리는 웹 경로의 별칭(alias)이며 실제 폴더 이름과 달라도 된다.","사이트의 실제 경로(기본 웹 문서 폴더)는 기본 설정에서 바꿀 수 있다.","'기본 문서' 기능에서 index.html 등을 추가하고 우선순위를 바꿀 수 있다.","가상 디렉터리 별칭은 실제 경로 이름과 같을 필요가 없으므로 틀린 설명이다.","디렉터리 검색을 켜면 기본 문서가 없을 때 폴더의 파일 목록이 보인다."]},{"id":"20230226-33","s":3,"q":"Linux 시스템에서 'ls' 라는 명령어 사용법을 알아보는 명령어로 올바른 것은?","o":["cat ls","man ls","ls man","ls cat"],"a":1,"im":[],"src":[["20230226",33]],"x":["man(manual) 명령으로 명령어의 매뉴얼을 본다. 형식은 'man 명령어'이므로 man ls다.","cat ls는 현재 디렉터리의 'ls'라는 파일 내용을 출력하려는 명령이다.","man ls는 ls 명령어의 매뉴얼 페이지를 보여 준다.","ls man은 'man'이라는 파일이나 디렉터리를 나열하려는 명령이다.","ls cat은 'cat'이라는 파일이나 디렉터리를 나열하려는 명령이다."]},{"id":"20230226-34","s":3,"q":"Linux 시스템에서 모든 사용자에게 'sample' 파일의 쓰기권한을 금지시키고자 할 때 명령어로 올바른 것은?","o":["chmod a-w sample","chmod u-w sample","chmod g+rw sample","chmod a-r sample"],"a":0,"im":[],"src":[["20230226",34],["20250525",31]],"x":["chmod의 a는 all(소유자·그룹·기타 모두), -w는 쓰기 권한 제거다. 모든 사용자의 쓰기를 막으려면 a-w를 쓴다.","a-w는 user·group·other 모두에서 쓰기 권한을 뺀다.","u-w는 소유자(user)의 쓰기 권한만 뺀다.","g+rw는 그룹에 읽기·쓰기 권한을 추가하는 반대 동작이다.","a-r은 모든 사용자의 읽기 권한을 빼는 명령이다."]},{"id":"20230226-35","s":3,"q":"Linux 시스템에서 특정 서비스를 제공하는 Daemon이 살아있는지 확인할 때 사용하는 명령어는?","o":["daemon","fsck","men","ps"],"a":3,"im":[],"src":[["20230226",35],["20240519",39],["20250824",40],["20260517",33]],"x":["ps는 실행 중인 프로세스 목록을 보여 주므로 데몬 프로세스가 떠 있는지 확인할 수 있다(ps -ef | grep 데몬명).","daemon은 프로세스 확인용 표준 명령어가 아니다.","fsck는 파일 시스템을 점검·복구하는 명령이다.","men은 존재하지 않는 명령이다(매뉴얼은 man).","ps는 현재 실행 중인 프로세스와 PID, 상태를 보여 준다."]},{"id":"20230226-36","s":3,"q":"다음은 Linux 시스템의 계정정보가 담긴 '/etc/passwd' 의내용이다. 다음의 설명 중 옳지 않은 것은?","o":["사용자 계정의 ID는 'user1' 이다.","패스워드는 'x' 이다.","사용자의 UID와 GID는 500번이다.","사용자의 기본 Shell은 '/bin/bash' 이다."],"a":1,"im":[6],"src":[["20230226",36],["20240825",40],["20250223",34],["20260802",33]],"x":["/etc/passwd의 두 번째 필드 'x'는 암호가 /etc/shadow에 따로 저장되어 있다는 표시일 뿐 실제 패스워드가 아니다.","첫 번째 필드가 계정 ID(user1)다.","'x'는 암호화된 패스워드가 /etc/shadow에 있다는 뜻이므로 '패스워드는 x'는 틀렸다.","세 번째 필드가 UID, 네 번째 필드가 GID이며 둘 다 500이다.","마지막(일곱 번째) 필드가 로그인 셸 /bin/bash다."]},{"id":"20230226-37","s":3,"q":"서버 담당자 Park 사원은 Windows Server 2016에서 시스템을 감시하고자 이벤트뷰어 서비스를 점검하려 한다. Windows Server 2016 이벤트 뷰어에는 시스템을 감시하는 4가지 항목의 Windows 로그가 있다. 다음 중 이벤트 뷰어 Windows 로그에 속하지 않는 항목은?","o":["보안","Setup","시스템","사용자 권한"],"a":3,"im":[],"src":[["20230226",37]],"x":["이벤트 뷰어의 Windows 로그는 응용 프로그램, 보안, Setup, 시스템(그리고 Forwarded Events)이다. '사용자 권한'이라는 로그는 없다.","보안 로그는 로그온, 개체 접근 등 감사 이벤트를 기록한다.","Setup 로그는 역할·기능 설치 등 설치 관련 이벤트를 기록한다.","시스템 로그는 드라이버, 서비스 등 Windows 시스템 구성 요소의 이벤트를 기록한다.","'사용자 권한'은 로컬 보안 정책의 항목 이름이지 이벤트 뷰어 로그가 아니다."]},{"id":"20230226-38","s":3,"q":"서버 담당자가 Windows Server 2016 서버에서 파일 서버구축에 NTFS와 ReFS 파일시스템을 고려하고 있다. NTFS와 ReFS 파일시스템에 대한 설명으로 옳지 않은 것은?","o":["NTFS는 퍼미션을 사용할 수 있어서 접근 권한을 사용자 별로 설정 할 수 있다.","NTFS는 파일 시스템의 암호화를 지원한다.","ReFS는 데이터 오류를 자동으로 확인하고 수정하는 기능이 있다.","ReFS는 FAT32의 장점과 호환성을 최대한 유지한다."],"a":3,"im":[],"src":[["20230226",38]],"x":["ReFS는 NTFS의 뒤를 잇는 복원력 중심 파일 시스템으로, FAT32와의 호환성을 목표로 하지 않는다.","NTFS는 ACL 기반 퍼미션으로 사용자·그룹별 접근 권한을 설정할 수 있다.","NTFS는 EFS로 파일·폴더 암호화를 지원한다.","ReFS는 체크섬(무결성 스트림)으로 손상을 감지하고 저장소 공간과 함께 자동 복구한다.","ReFS는 NTFS 기반으로 개선된 것이며 FAT32 장점·호환성 유지와는 관련이 없다."]},{"id":"20230226-39","s":3,"q":"서버 담당자 Park 사원은 Windows Server 2016에서 사용자 및 그룹을 관리하는 업무를 부여받았다. Windows Server 2016에는 기본적으로 3개의 로컬 사용자 계정이 생성되어 있는데, 다음 중 기본적으로 생성되는 계정이 아닌 것은?","o":["Administrator","DefaultAccount","Guest","root"],"a":3,"im":[],"src":[["20230226",39],["20241103",35]],"x":["Windows Server 2016의 기본 로컬 계정은 Administrator, Guest, DefaultAccount다. root는 유닉스/리눅스의 관리자 계정이다.","Administrator는 기본 관리자 계정이다.","DefaultAccount는 시스템이 관리하는 기본 계정으로 2016부터 생긴다.","Guest는 기본으로 만들어지며 비활성화되어 있다.","root는 리눅스 관리자 계정이며 Windows에는 기본으로 없다."]},{"id":"20230226-40","s":3,"q":"Linux 시스템에서 환경설정과 사용자 정보 등을 가진 디렉터리로 옳은 것은?","o":["/bin","/root","/etc","/proc"],"a":2,"im":[],"src":[["20230226",40],["20240825",33],["20250824",33]],"x":["/etc에는 passwd, shadow, group 같은 사용자 정보와 각종 시스템·서비스 설정 파일이 있다.","/bin은 ls, cp 같은 기본 실행 명령어가 있는 디렉터리다.","/root는 root 사용자의 홈 디렉터리다.","/etc는 시스템 환경 설정 파일과 사용자 계정 정보 파일이 모여 있다.","/proc는 커널·프로세스 정보를 보여 주는 가상 파일 시스템이다."]},{"id":"20230226-41","s":3,"q":"네트워크관리자 Kim사원은 Active Directory의 'icqa.or.kr'도메인의 그룹정책을 설정하여 회사 내 PC사용자들의 컴퓨터를 관리하고자 한다. 이 때 Kim사원이 작업할 수 있는 그룹정책 설정으로 옳지 않은 것은?","o":["보안 강화를 위해 사용자의 암호 및 계정 잠금 등을 강제로 적용할 수 있다.","사용자 계정의 암호 길이, 복잡성 조건 등을 지정할 수 있다.","사용자가 'icqa.or.kr' 도메인 내 어느 PC에서 로그온 하더라도 기존 자신의 PC와 동일한 환경을 제공해 줄 수 있다.","사용자가 사용할 소프트웨어를 배포할 수 없다."],"a":3,"im":[],"src":[["20230226",41],["20240825",34]],"x":["그룹 정책으로 소프트웨어 설치(배포) 정책을 만들어 사용자·컴퓨터에 프로그램을 배포할 수 있다. 그래서 '배포할 수 없다'는 틀렸다.","계정 정책으로 암호 정책과 계정 잠금 정책을 강제할 수 있다.","암호 정책에서 최소 길이, 복잡성 조건 등을 정할 수 있다.","로밍 프로필·폴더 리디렉션으로 어느 PC에서든 같은 사용자 환경을 제공할 수 있다.","'소프트웨어 설치' 정책으로 배포가 가능하므로 틀린 설명이다."]},{"id":"20230226-42","s":3,"q":"다음 중 (ㄱ), (ㄴ)에 들어갈 말로 알맞은 것은?","o":["ㄱ: 21, ㄴ : 1024","ㄱ: 21, ㄴ : 20","ㄱ: 20, ㄴ : 21","ㄱ: 20, ㄴ : 1024"],"a":2,"im":[7],"src":[["20230226",42],["20251102",37]],"x":["FTP는 데이터 전송에 20번, 제어(명령) 연결에 21번 포트를 쓴다. 지문의 (ㄱ)은 데이터, (ㄴ)은 제어 포트다.","21은 제어 포트이고 1024는 FTP의 지정 포트가 아니다.","데이터와 제어 포트가 뒤바뀌었다.","ㄱ(데이터)=20, ㄴ(제어)=21로 맞다.","1024는 FTP 제어 포트가 아니다."]},{"id":"20230226-43","s":3,"q":"Linux에서 열려있는 port 정보를 확인하는 명령어로 옳은 것은?","o":["ps","pstree","getenforce","netstat"],"a":3,"im":[],"src":[["20230226",43],["20240519",32],["20250223",39],["20260802",39]],"x":["netstat은 열린 포트, 연결 상태, 라우팅 테이블 등 네트워크 상태를 보여 준다(netstat -an, -tnlp).","ps는 프로세스 목록을 보여 준다.","pstree는 프로세스를 트리 형태로 보여 준다.","getenforce는 SELinux 모드(Enforcing/Permissive/Disabled)를 확인한다.","netstat은 LISTEN 중인 포트와 네트워크 연결 정보를 확인한다."]},{"id":"20230226-44","s":3,"q":"Linux Apache 웹서버 운영 시 service port number를well-known port가 아닌 다른 port number로 변경하여 사용하려 할때, 'httpd.conf' 설정파일에서 변경해야 할 옵션값은?","o":["KeepAlive","DocumentRoot","StartServers","Listen"],"a":3,"im":[],"src":[["20230226",44]],"x":["Apache가 받을 포트는 httpd.conf의 Listen 지시자로 정한다(예: Listen 8080).","KeepAlive는 하나의 연결로 여러 요청을 처리할지 정한다.","DocumentRoot는 웹 문서가 있는 기본 디렉터리를 지정한다.","StartServers는 시작할 때 띄울 자식 프로세스 수를 정한다.","Listen은 Apache가 요청을 받을 IP와 포트를 지정한다."]},{"id":"20230226-45","s":3,"q":"DHCP로부터 새로운 IP Address를 부여받기 위해 사용되는명령어 옵션은?","o":["ipconfig /renew","ipconfig /release","ipconfig /flushdns","ipconfig /setclassid"],"a":0,"im":[],"src":[["20230226",45]],"x":["ipconfig /renew는 DHCP 서버에 IP 임대를 갱신·재요청해 새 주소를 받는다.","/renew는 DHCP로 IP를 새로 받거나 갱신한다.","/release는 받은 IP를 반납(해제)한다.","/flushdns는 DNS 확인자 캐시를 비운다.","/setclassid는 DHCP 클래스 ID를 설정한다."]},{"id":"20230226-46","s":4,"q":"내부에 코어(Core)와 이를 감싸는 굴절률이 다른 유리나 플라스틱으로 된 외부 클래딩(Cladding)으로 구성된 전송 매체는?","o":["이중 나선(Twisted Pair)","동축 케이블(Coaxial Cable)","2선식 개방 선로(Two-Wire Open Lines)","광 케이블(Optical Cable)"],"a":3,"im":[],"src":[["20230226",46]],"x":["코어와 굴절률이 다른 클래딩으로 빛을 전반사시켜 전송하는 매체는 광섬유(광 케이블)다.","이중 나선은 구리선 두 가닥을 꼬아 만든 케이블이다.","동축 케이블은 중심 도체, 절연체, 외부 도체(실드)로 되어 있다.","2선식 개방 선로는 두 도선을 나란히 둔 초기 전송 선로다.","광 케이블은 코어와 클래딩의 굴절률 차이로 빛을 전반사시켜 전송한다."]},{"id":"20230226-47","s":4,"q":"IP Address의 부족과 내부 네트워크 주소의 보안을 위해 사용하는 방법 중 하나로, 내부에서는 사설 IP Address를 사용하고 외부 네트워크로 나가는 주소는 공인 IP Address를 사용하도록 하는 IP Address 변환 방식은?","o":["DHCP 방식","IPv6 방식","NAT 방식","MAC Address 방식"],"a":2,"im":[],"src":[["20230226",47],["20250525",48]],"x":["NAT는 내부 사설 IP를 외부로 나갈 때 공인 IP로 바꿔 주어 주소 부족 문제를 완화하고 내부 주소를 숨긴다.","DHCP는 IP를 자동 할당할 뿐 사설–공인 주소를 변환하지 않는다.","IPv6는 주소 공간을 늘린 새 프로토콜이지 변환 방식이 아니다.","NAT(Network Address Translation)가 사설 IP ↔ 공인 IP 변환을 한다.","MAC 주소 방식이라는 IP 변환 기술은 없다."]},{"id":"20230226-48","s":4,"q":"가상 근거리 네트워크(VLAN, Virtual Local Area Network)은 물리적인 케이블이 아닌 소프트웨어에 의해 구성된 LAN으로 정의할 수 있는데, VLAN의 특징으로 맞지 않는 것은?","o":["데이터링크 계층에서 브로드캐스트 도메인(Broadcast Domain)을 나누기 위해 사용하는 기술이다.","각 스위치는 하나의 브로드캐스트 프레임에 대하여 동일 브로드캐스트 그룹이 아닌 곳에는 전달하지 않는다는 조건을 바탕으로 하고 있다.","VLAN은 관리자가 서로 다른 논리적 그룹에 대하여 서로 다른 보안정책을 적용할 수 없다.","스위치는 VLAN 태그가 상이한 네트워크로의 접근을 근본적으로 차단하여 보안성을 유지하게 된다."],"a":2,"im":[],"src":[["20230226",48],["20240825",48]],"x":["VLAN은 논리 그룹별로 브로드캐스트 도메인을 나누므로 그룹마다 다른 보안 정책(ACL 등)을 적용할 수 있다.","VLAN은 2계층 스위치에서 브로드캐스트 도메인을 논리적으로 나눈다.","브로드캐스트 프레임은 같은 VLAN 포트에만 전달된다.","VLAN별로 다른 보안 정책을 적용할 수 있으므로 '적용할 수 없다'는 틀렸다.","VLAN 태그가 다르면 라우팅 없이 통신할 수 없어 접근이 차단된다."]},{"id":"20230226-49","s":4,"q":"Repeater가 동작하는 OSI 7 Layer의 계층은?","o":["물리 계층","응용 계층","데이터링크 계층","네트워크 계층"],"a":0,"im":[],"src":[["20230226",49]],"x":["리피터는 약해진 전기 신호를 재생·증폭만 하므로 물리 계층(1계층) 장비다.","리피터는 비트 신호를 재생하는 물리 계층 장비다.","응용 계층은 HTTP, FTP 같은 서비스가 동작하는 7계층이다.","데이터 링크 계층 장비는 브리지, L2 스위치다.","네트워크 계층 장비는 라우터, L3 스위치다."]},{"id":"20230226-50","s":4,"q":"RAID의 레벨 중에서 회전 패리티 방식으로 병목현상을 줄이는 것은?","o":["RAID-2","RAID-3","RAID-4","RAID-5"],"a":3,"im":[],"src":[["20230226",50],["20250824",46]],"x":["RAID-5는 패리티를 모든 디스크에 돌아가며 분산 저장해, 패리티 전용 디스크에 쓰기가 몰리는 병목(RAID-4의 문제)을 줄인다.","RAID-2는 해밍 코드로 오류를 정정하는 방식으로 거의 쓰이지 않는다.","RAID-3는 바이트 단위 스트라이핑과 전용 패리티 디스크를 쓴다.","RAID-4는 블록 단위 스트라이핑과 전용 패리티 디스크를 써서 패리티 디스크에 병목이 생긴다.","RAID-5는 패리티를 회전(분산) 배치해 병목을 줄인다."]},{"id":"20230521-01","s":1,"q":"IPv4 Class 중에서 멀티캐스트 용도로 사용되는 것은?","o":["B Class","C Class","D Class","E Class"],"a":2,"im":[],"src":[["20230521",1]],"x":["D Class(224.0.0.0~239.255.255.255)는 멀티캐스트용이다.","B Class(128~191)는 중규모 네트워크용 유니캐스트 주소다.","C Class(192~223)는 소규모 네트워크용 유니캐스트 주소다.","D Class(224~239)는 멀티캐스트 그룹 주소로 쓰인다.","E Class(240~255)는 실험·연구용 예약 주소다."]},{"id":"20230521-02","s":1,"q":"DNS에서 사용될 때 TTL(Time to Live)의 설명으로 올바른것은?","o":["데이터가 DNS서버 존으로부터 나오기 전에 현재 남은 시간이다.","데이터가 DNS서버 캐시로부터 나오기 전에 현재 남은 시간이다.","패킷이 DNS서버 존으로부터 나오기 전에 현재 남은 시간이다.","패킷이 DNS서버 네임서버 레코드로부터 나오기 전에 현재 남은 시간이다."],"a":1,"im":[],"src":[["20230521",2],["20240225",5]],"x":["DNS의 TTL은 다른 서버가 받은 레코드를 캐시에 얼마나 보관할 수 있는지를 정한다. 즉 데이터가 캐시에서 사라지기(만료되기) 전까지 남은 시간이다.","존 데이터는 권한 서버가 가진 원본이라 TTL로 만료되지 않는다.","TTL은 캐시된 레코드가 만료되기까지 남은 시간이다.","IP 패킷의 TTL과 혼동한 설명으로, DNS TTL은 패킷이 아니라 레코드 데이터에 붙는다.","네임서버 레코드에서 나온다는 설명은 DNS TTL의 정의가 아니다."]},{"id":"20230521-03","s":1,"q":"IP Address 중 Class가 다른 주소는?","o":["191.234.149.32","198.236.115.33","222.236.138.34","195.236.126.35"],"a":0,"im":[],"src":[["20230521",3],["20250223",2],["20260517",3]],"x":["191.x.x.x는 B Class(128~191)이고 나머지 198, 222, 195는 모두 C Class(192~223)다.","191은 B Class 범위의 마지막 값이라 혼자 Class가 다르다.","198은 C Class다.","222는 C Class다.","195는 C Class다."]},{"id":"20230521-04","s":1,"q":"C Class의 네트워크를 서브넷으로 나누어 각 서브넷에 4~5대의 PC를 접속해야 할 때, 서브넷 마스크 값으로 올바른 것은?","o":["255.255.255.240","255.255.0.192","255.255.255.248","255.255.255.0"],"a":2,"im":[],"src":[["20230521",4],["20260517",4]],"x":["한 서브넷에 4~5대를 연결하려면 네트워크·브로드캐스트 주소를 빼고 호스트가 최소 5개 필요하다. /29(255.255.255.248)는 8-2 = 6개 호스트를 준다.","/28(.240)은 호스트 14개로 가능은 하지만 4~5대에 맞춘 가장 알맞은 값은 아니다.","255.255.0.192는 1이 연속되지 않아 올바른 서브넷 마스크가 아니다.","/29는 서브넷당 사용 가능한 호스트가 6개라 4~5대에 딱 맞다.","/24(.0)은 나누지 않은 기본 마스크로 호스트 254개다."]},{"id":"20230521-05","s":1,"q":"Link State 알고리즘을 이용해 서로에게 자신의 현재 상태를알려주며 네트워크 내 통신을 위해 사용하는 프로토콜은?","o":["OSPF","IDRP","EGP","BGP"],"a":0,"im":[],"src":[["20230521",5],["20240225",4]],"x":["OSPF는 링크 상태(Link State) 알고리즘(다익스트라 SPF)을 쓰는 내부 라우팅 프로토콜이다.","OSPF는 LSA로 링크 상태를 교환하고 최단 경로를 계산한다.","IDRP는 OSI 환경의 도메인 간 라우팅 프로토콜이다.","EGP는 초기의 외부 게이트웨이(AS 간) 프로토콜이다.","BGP는 AS 간 경로 벡터(Path Vector) 프로토콜이다."]},{"id":"20230521-06","s":1,"q":"UDP 헤더에 포함이 되지 않는 항목은?","o":["확인 응답 번호(Acknowledgment Number)","소스 포트(Source Port) 주소","체크섬(Checksum) 필드","목적지 포트(Destination Port) 주소"],"a":0,"im":[],"src":[["20230521",6],["20250223",6],["20260802",6]],"x":["UDP 헤더는 출발지 포트, 목적지 포트, 길이, 체크섬 4개 필드(8바이트)뿐이다. 확인 응답 번호는 TCP 헤더에 있다.","확인 응답 번호는 신뢰성 전송을 하는 TCP에만 있다.","출발지 포트는 UDP 헤더 필드다.","체크섬은 UDP 헤더 필드다.","목적지 포트는 UDP 헤더 필드다."]},{"id":"20230521-07","s":1,"q":"RARP에 대한 설명 중 올바른 것은?","o":["TCP/IP 프로토콜에서 데이터의 전송 서비스를 규정한다.","TCP/IP 프로토콜의 IP에서 접속 없이 데이터의 전송을 수행하는 기능을 규정한다.","하드웨어 주소를 IP Address로 변환하기 위해서 사용한다.","IP에서의 오류(Error) 제어를 위하여 사용되며, 시작 지 호스트의 라우팅 실패를 보고한다."],"a":2,"im":[],"src":[["20230521",7]],"x":["RARP는 자신의 하드웨어(MAC) 주소로 IP 주소를 알아내는 프로토콜이다.","데이터 전송 서비스를 규정하는 것은 TCP/UDP 같은 전송 계층 프로토콜이다.","비연결형 데이터 전송은 UDP(또는 IP 자체)의 특징이다.","RARP는 하드웨어 주소를 IP 주소로 변환하는 데 쓴다.","오류 제어와 라우팅 실패 보고는 ICMP의 기능이다."]},{"id":"20230521-08","s":1,"q":"ICMP의 Message Type필드의 유형과 질의 메시지 내용을 나타낸 것이다. 타입에 대한 설명으로 옳지 않은 것은?","o":["3 - Echo Request 질의 메시지에 응답하는데 사용된다.","4 - 흐름제어 및 폭주제어를 위해 사용된다.","5 - 대체경로(Redirect)를 알리기 위해 라우터에 사용한다.","17 - Address Mask Request 장비의 서브넷 마스크를 요구하는데 사용된다."],"a":0,"im":[],"src":[["20230521",8]],"x":["ICMP 타입 3은 Destination Unreachable(목적지 도달 불가)이다. Echo Request에 대한 응답은 타입 0(Echo Reply)이다.","타입 3은 목적지 도달 불가 오류이므로 Echo 응답이라는 설명은 틀렸다.","타입 4 Source Quench는 송신 속도를 줄이라는 흐름·폭주 제어 메시지다.","타입 5 Redirect는 라우터가 더 좋은 경로를 알려 주는 메시지다.","타입 17 Address Mask Request는 서브넷 마스크를 요청한다."]},{"id":"20230521-09","s":1,"q":"IGMP 프로토콜의 주된 기능은?","o":["네트워크 내에 발생된 오류에 관한 보고 기능","대용량 파일을 전송하는 기능","멀티 캐스트 그룹에 가입한 네트워크 내의 호스트 관리 기능","호스트의 IP Address에 해당하는 호스트의 물리주소를 알려주는 기능"],"a":2,"im":[],"src":[["20230521",9],["20241103",7],["20260517",7]],"x":["IGMP는 호스트가 멀티캐스트 그룹에 가입·탈퇴했음을 라우터에 알리고 그룹 멤버를 관리한다.","오류 보고는 ICMP의 기능이다.","대용량 파일 전송은 FTP 등의 기능이다.","IGMP는 멀티캐스트 그룹 멤버십을 관리한다.","IP로 물리 주소를 찾는 것은 ARP의 기능이다."]},{"id":"20230521-10","s":1,"q":"원격에 있는 호스트 접속시 암호화된 패스워드를 이용하여보다 안전하게 접속할 수 있도록 rlogin과 같은 프로토콜을 보완하여 만든 프로토콜은?","o":["SSH","SNMP","SSL","Telnet"],"a":0,"im":[],"src":[["20230521",10]],"x":["SSH는 rlogin·rsh·Telnet처럼 평문을 보내던 원격 접속을 암호화해 안전하게 보완한 프로토콜이다.","SSH는 암호화된 인증과 통신으로 원격 셸을 제공한다.","SNMP는 네트워크 관리 프로토콜이다.","SSL은 응용 데이터를 암호화하는 보안 계층으로 rlogin 대체 프로토콜이 아니다.","Telnet은 패스워드와 데이터를 평문으로 보내 보안에 취약하다."]},{"id":"20230521-11","s":1,"q":"TCP/IP 프로토콜 4 Layer 구조를 하위 계층부터 상위 계층으로 올바르게 나열한 것은?","o":["Network Interface - Internet - Transport - Application","Application - Network Interface - Internet - Transport","Transport - Application - Network Interface - Internet","Internet - Transport - Application - Network Interface"],"a":0,"im":[],"src":[["20230521",11],["20260802",9]],"x":["TCP/IP 4계층은 아래부터 네트워크 인터페이스 → 인터넷 → 전송 → 응용 순서다.","네트워크 인터페이스(링크) - 인터넷 - 전송 - 응용 순으로 올바르다.","응용 계층이 가장 아래에 있어 순서가 틀렸다.","전송 계층이 가장 아래에 있어 순서가 틀렸다.","인터넷 계층이 가장 아래, 네트워크 인터페이스가 가장 위에 있어 틀렸다."]},{"id":"20230521-12","s":1,"q":"FTP 및 TFTP의 특징으로 옳은 것은 무엇인가?","o":["TFTP는 단순화된 파일을 전송을 위한 프로토콜이며 기본포트는 25번이다.","FTP의 접속에는 계정접속만 가능하다.","TFTP의 단점은 UDP방식으로 Data 전송시 데이터 손실가능성이 있다.","FTP는 대량의 데이터를 고속전송을 위해 UDP을 사용한다."],"a":2,"im":[],"src":[["20230521",12]],"x":["TFTP는 UDP 69번을 쓰는 단순 파일 전송 프로토콜이라 인증이 없고, UDP 특성상 신뢰성이 낮아 데이터 손실 가능성이 있다.","TFTP 포트는 UDP 69번이다. 25번은 SMTP다.","FTP는 계정 없이 쓰는 익명(anonymous) 접속도 지원한다.","TFTP는 UDP를 써서 신뢰성 보장이 약하다는 단점이 맞다.","FTP는 신뢰성을 위해 TCP(20, 21)를 사용한다."]},{"id":"20230521-13","s":1,"q":"TCP Header의 flag 값 중 3-way handshake의 첫 번째 단계인 세션 성립 요청 패킷에 설정되는 flag 값은?","o":["RST","ACK","URG","SYN"],"a":3,"im":[],"src":[["20230521",13],["20251102",5]],"x":["3-way handshake 1단계에서 클라이언트는 SYN을 보내고, 2단계에서 서버가 SYN+ACK, 3단계에서 클라이언트가 ACK를 보낸다.","RST는 연결을 강제로 끊을 때 쓴다.","ACK는 2, 3단계에서 쓰이며 1단계 요청 패킷에는 없다.","URG는 긴급 데이터 표시용이다.","SYN은 연결(세션) 성립을 요청하는 첫 번째 패킷의 플래그다."]},{"id":"20230521-14","s":1,"q":"아래에서 설명하는 기술의 명칭은?","o":["WLAN","HomeRF","ZigBee","IrDA"],"a":2,"im":[8],"src":[["20230521",14]],"x":["지문은 저전력·저비용으로 많은 센서 노드를 메시 네트워크로 묶는 IEEE 802.15.4 기반 근거리 무선 기술, 즉 ZigBee를 설명한다.","WLAN(802.11)은 고속 데이터용 무선 LAN으로 저전력 센서망과 성격이 다르다.","HomeRF는 가정용 무선 네트워크로 쓰이다 사라진 규격이다.","ZigBee는 802.15.4 기반 저속·저전력 센서/제어용 무선 기술이다.","IrDA는 적외선 통신 규격으로 가시거리 안에서만 통신한다."]},{"id":"20230521-15","s":1,"q":"인터넷에서 전자 메일을 주고받을 때 사용되는 프로토콜로만 짝지어진 것은?","o":["HTTP, POP3","HTTP, ICMP","ICMP, SMTP","POP3, SMTP"],"a":3,"im":[],"src":[["20230521",15]],"x":["SMTP로 메일을 보내고 POP3(또는 IMAP)로 메일을 받는다.","HTTP는 웹 프로토콜이다.","HTTP와 ICMP 모두 메일 프로토콜이 아니다.","ICMP는 오류 보고 프로토콜이라 메일과 관계없다.","POP3(수신)와 SMTP(송신)가 메일용 프로토콜 짝이다."]},{"id":"20230521-16","s":1,"q":"IPv6에서 6000Byte의 패킷이 이더넷 LAN을 통과해야 하는경우 사용할 확장 헤더는?","o":["Source Routing","Fragmentation","Authentification","Destination Option"],"a":1,"im":[],"src":[["20230521",16]],"x":["이더넷 MTU(1500바이트)보다 큰 6000바이트 패킷은 나눠 보내야 하므로 Fragmentation 확장 헤더를 쓴다. IPv6에서는 출발지 호스트만 단편화한다.","Source Routing(라우팅 헤더)은 거쳐 갈 경로를 지정한다.","Fragment 헤더는 MTU보다 큰 패킷을 나누어 전송할 때 쓴다.","Authentication 헤더(AH)는 무결성과 출처 인증을 제공한다.","Destination Options 헤더는 목적지에서만 처리할 옵션을 담는다."]},{"id":"20230521-17","s":1,"q":"IP의 체크섬(Checksum)에 대한 설명으로 올바른 것은?","o":["IP Header의 완전성을 검사한다.","IP Header와 데이터의 완전성을 검사한다.","데이터의 완전성을 검사한다.","TCP 계층에서만 체크섬 계산 및 검증 서비스가 제공된다."],"a":0,"im":[],"src":[["20230521",17],["20240519",11]],"x":["IPv4 헤더 체크섬은 헤더 부분만 검사한다. 데이터 부분은 TCP/UDP 체크섬이 검사한다.","IP 체크섬은 IP 헤더의 오류만 검사한다.","데이터까지 검사하지 않으므로 틀렸다.","데이터 무결성은 상위 계층(TCP/UDP) 체크섬의 역할이다.","IP, UDP, TCP, ICMP 모두 각자 체크섬이 있으므로 'TCP에서만'은 틀렸다."]},{"id":"20230521-18","s":2,"q":"다음에 설명하는 기술은 무엇인가?","o":["사물인터넷(IoT)","유비쿼터스(Ubiquitous)","에지 컴퓨팅(Edge Computing)","신 클라이언트(Thin client)"],"a":2,"im":[9],"src":[["20230521",18]],"x":["데이터를 중앙 클라우드로 보내지 않고 데이터가 생기는 곳(단말·현장 서버) 가까이에서 처리해 지연과 대역폭 부담을 줄이는 기술은 에지 컴퓨팅이다.","IoT는 사물에 센서와 통신 기능을 넣어 연결하는 개념으로 처리 위치를 말하는 기술이 아니다.","유비쿼터스는 언제 어디서나 네트워크에 접속할 수 있는 환경을 뜻한다.","에지 컴퓨팅은 네트워크 가장자리에서 실시간으로 데이터를 처리한다.","씬 클라이언트는 최소 기능만 가진 단말이 서버 자원을 빌려 쓰는 방식이다."]},{"id":"20230521-19","s":2,"q":"전송효율을 최대로 하기 위해 프레임의 길이를 동적으로 변경시킬 수 있는 ARQ(Automatic Repeat Request)방식은?","o":["Adaptive ARQ","Go back-N ARQ","Selective-Repeat ARQ","Stop and Wait ARQ"],"a":0,"im":[],"src":[["20230521",19],["20240825",21],["20250525",18],["20260201",21]],"x":["Adaptive ARQ는 채널 상태(오류율)에 따라 프레임 길이를 동적으로 바꿔 전송 효율을 높인다.","Adaptive ARQ는 프레임 길이를 상황에 맞게 바꾼다.","Go-Back-N은 오류가 난 프레임부터 그 뒤 프레임을 모두 다시 보낸다.","Selective-Repeat는 오류가 난 프레임만 골라 다시 보낸다.","Stop-and-Wait는 프레임 하나를 보내고 ACK를 기다린 뒤 다음 프레임을 보낸다."]},{"id":"20230521-20","s":2,"q":"OSI 7 Layer에서 Data Link 계층의 기능으로 옳지 않은 것은?","o":["전송 오류 제어기능","Flow 제어기능","Text의 압축, 암호기능","Link의 관리기능"],"a":2,"im":[],"src":[["20230521",20],["20240225",23]],"x":["텍스트 압축과 암호화는 표현 계층(6계층)의 기능이다. 데이터 링크 계층은 오류 제어, 흐름 제어, 링크 관리, 프레이밍을 맡는다.","전송 오류 제어는 데이터 링크 계층 기능이다.","흐름 제어는 데이터 링크 계층 기능이다.","압축·암호화는 표현 계층의 기능이므로 데이터 링크 계층 기능이 아니다.","링크 설정·유지·해제(링크 관리)는 데이터 링크 계층 기능이다."]},{"id":"20230521-21","s":2,"q":"패킷교환의 특징에 대한 설명 중 옳지 않은 것은?","o":["패킷과 함께 오류제어를 함으로서 고품질/고신뢰성 통신이 가능하다.","패킷을 전송 시에만 전송로를 사용하므로 설비 이용 효율이 높다.","패킷교환의 방식으로는 연결형인 가상회선방식과 비연결형인 데이터그램(Datagram) 두 가지가 있다.","복수의 상대방과는 통신이 불가능하다."],"a":3,"im":[],"src":[["20230521",21]],"x":["패킷 교환은 패킷마다 주소가 붙어 하나의 회선으로 여러 상대와 동시에 통신할 수 있다(통계적 다중화).","패킷 단위로 오류 제어를 하므로 신뢰성 높은 통신이 가능하다.","데이터가 있을 때만 회선을 점유하므로 회선 이용 효율이 높다.","가상 회선 방식(연결형)과 데이터그램 방식(비연결형)이 있다.","패킷마다 목적지 주소가 있어 여러 상대와 통신할 수 있으므로 틀린 설명이다."]},{"id":"20230521-22","s":2,"q":"VPN에 대한 설명으로 (A)에 알맞은 용어는?","o":["PPTP","L2TP","IPSec","SSL"],"a":2,"im":[10],"src":[["20230521",22]],"x":["OSI 3계층에서 동작하고 전송 모드(페이로드만 암호화)와 터널 모드(IP 패킷 전체 암호화 후 새 헤더 추가)를 가진 VPN 프로토콜은 IPSec이다.","PPTP는 2계층 터널링 프로토콜로 PPP 프레임을 캡슐화한다.","L2TP도 2계층 터널링 프로토콜이며 자체 암호화가 없어 보통 IPSec과 함께 쓴다.","IPSec은 3계층 VPN 프로토콜로 전송 모드와 터널 모드를 제공한다.","SSL VPN은 전송 계층 위(4~7계층)에서 동작하며 웹 브라우저로 접속한다."]},{"id":"20230521-23","s":2,"q":"다음은 화상 회의를 하기 위한 기술에 관한 내용이다. (A)안에 들어가는 용어 중 옳은 것은?","o":["IRC (Internet Relay Chat)","HEVC/H.265 (High Efficiency Video Coding)","MIME (Multipurpose Internet Mail Extensions)","SIP (Session Initiation Protocol)"],"a":3,"im":[11],"src":[["20230521",23]],"x":["화상 회의·인터넷 전화에서 세션을 만들고, 수정하고, 끝내는 응용 계층 신호 프로토콜은 SIP다.","IRC는 텍스트 기반 실시간 채팅 프로토콜이다.","HEVC/H.265는 영상 압축 코덱으로 세션 제어를 하지 않는다.","MIME은 전자우편에 다양한 형식의 데이터를 담기 위한 규격이다.","SIP는 멀티미디어 세션(VoIP, 화상 회의)의 설정·관리·종료를 담당한다."]},{"id":"20230521-24","s":2,"q":"LAN의 매체 접근제어 방식인 CSMA/CD 기술에 대한 설명으로 옳은 것은?","o":["CSMA/CD 방식은 링형 통신망인 이더넷에서 주로 사용한다.","CSMA/CD 방식은 반송파의 존재 여부와 상관없이 데이터를 전송한다.","CSMA/CD 방식은 반송파가 감지되지 않으면 컴퓨터가 전송매체를 사용하지 않는 것으로 판단하여 데이터를 전송한다.","CSMA/CD 방식은 통신량이 많아지면 채널이용율이 높아져서 지연시간을 예측할 수 있다."],"a":2,"im":[],"src":[["20230521",24]],"x":["CSMA/CD는 전송 전에 반송파(캐리어)를 감지해 매체가 비어 있으면 전송하고, 충돌을 감지하면 잠시 기다렸다가 재전송한다.","CSMA/CD는 버스형(이더넷)에서 쓰인다. 링형은 토큰 링 방식이다.","반송파를 먼저 감지(Carrier Sense)한 뒤 전송하므로 틀린 설명이다.","반송파가 감지되지 않으면 매체가 비어 있다고 보고 전송한다.","통신량이 많아지면 충돌이 늘어 지연 시간을 예측하기 어렵다."]},{"id":"20230521-25","s":2,"q":"기가비트 이더넷은 약 1Gbps의 전송속도를 지원하는 이더넷으로 기존의 이더넷뿐만 아니라 고속 이더넷과도 호환이 가능하다. 다음 중 기가비트 이더넷에 대한 규격으로 옳은 것은?","o":["1000Base-SX","1000Base-NX","1000Base-BX","1000Base-AX"],"a":0,"im":[],"src":[["20230521",25],["20260802",23]],"x":["기가비트 이더넷 규격에는 1000Base-SX(단파장 멀티모드 광), LX(장파장 광), CX(동축 구리), T(UTP)가 있다. 보기 중 실제 규격은 SX뿐이다.","1000Base-SX는 850nm 멀티모드 광섬유를 쓰는 기가비트 이더넷 규격이다.","1000Base-NX라는 표준 규격은 없다.","보기 중 정답으로 인정되는 것은 SX이며, BX는 단일 광섬유 양방향 규격(802.3ah)으로 시험 범위의 기본 규격(SX/LX/CX/T)에 들지 않는다.","1000Base-AX라는 규격은 없다."]},{"id":"20230521-26","s":2,"q":"네트워크의 구성(Topology)에서 링형(Ring)에 관한 설명으로 옳지 않은 것은?","o":["장애발생시 쉽게 발견할 수 있다.","노드간의 연결을 최소화하는 목적으로 설계되었다.","한 통신장치의 오류가 전체 네트워크에 영향을 준다.","확장성이 뛰어나다."],"a":3,"im":[],"src":[["20230521",26],["20240225",19]],"x":["링형은 노드를 고리로 연결해 노드를 추가하려면 링을 끊어야 하므로 확장성이 낮다.","신호가 한 방향으로 돌아 끊긴 지점을 찾기 쉬워 장애 발견이 쉽다.","각 노드는 양옆 두 노드와만 연결되어 연결 수가 적다.","한 노드나 링크가 고장 나면 링 전체 통신에 영향을 준다(이중 링으로 보완).","노드 추가 시 링을 끊어야 해 확장성이 낮으므로 틀린 설명이다."]},{"id":"20230521-27","s":2,"q":"다음 지문에서 설명하는 모바일 셀룰러시스템의 동작을 무엇이라고 하는가?","o":["채널체인징","페이징","핸드오프","핸드쉐이크"],"a":2,"im":[12],"src":[["20230521",27],["20240825",23]],"x":["단말이 셀 경계를 넘어 다른 기지국으로 이동할 때 통화 끊김 없이 새 기지국 채널로 넘겨주는 동작은 핸드오프(핸드오버)다.","채널 체인징은 이동통신 셀 간 이동 절차를 가리키는 표준 용어가 아니다.","페이징은 착신 호가 있을 때 단말 위치를 찾으려고 여러 셀에 호출 신호를 보내는 것이다.","핸드오프는 이동 중 통화를 끊지 않고 새 셀의 채널로 전환한다.","핸드쉐이크는 통신 시작 전 양쪽이 연결 조건을 맞추는 절차다."]},{"id":"20230521-28","s":3,"q":"Windows Server 2016의 DNS 서버에 DNS 레코드를 추가할 때 옳지 않은 것은?","o":["새 호스트(A or AAA)는 호스트 이름에 대한 IP 주소를 등록하는 것이다.","새 포인터(PTR)는 IP 주소에 대한 FQDN을 등록하는 것이다.","새 별칭(CNAME)은 서브 도메인을 등록하는 것이다.","새 메일 교환기(MX)는 메일서버를 등록하는 것이다."],"a":2,"im":[],"src":[["20230521",28]],"x":["CNAME은 기존 호스트 이름에 별칭을 붙이는 레코드다. 하위 도메인을 만드는 것은 '새 도메인' 또는 위임(NS) 기능이다.","A(IPv4)/AAAA(IPv6) 레코드는 호스트 이름에 IP를 등록한다.","PTR은 역방향 조회용으로 IP 주소에 FQDN을 등록한다.","CNAME은 별칭 등록이므로 '서브 도메인 등록'은 틀렸다.","MX 레코드는 도메인의 메일 서버를 등록한다."]},{"id":"20230521-29","s":3,"q":"Linux 시스템에서 사용자가 내린 명령어를 Kernel에 전달해주는 역할을 하는 것은?","o":["System Program","Loader","Shell","Directory"],"a":2,"im":[],"src":[["20230521",29],["20250525",28],["20260201",39]],"x":["셸(Shell)은 사용자가 입력한 명령을 해석해 커널에 전달하는 명령어 해석기다.","System Program은 시스템 관리용 프로그램을 통틀어 이르는 말이다.","Loader는 프로그램을 메모리에 올려 실행을 준비한다.","셸은 사용자와 커널 사이에서 명령을 해석·전달하는 인터페이스다.","디렉터리는 파일을 묶어 두는 저장 구조다."]},{"id":"20230521-30","s":3,"q":"Linux에서 'manager'라는 파일을, 파일의 소유자가 아닌 사람도 볼 수는 있지만 수정을 못하도록 하는 명령어는?","o":["chmod 777 manager","chmod 666 manager","chmod 646 manager","chmod 644 manager"],"a":3,"im":[],"src":[["20230521",30],["20250223",32]],"x":["644는 소유자 rw-(6), 그룹 r--(4), 기타 r--(4)이므로 다른 사람은 읽기만 하고 수정할 수 없다.","777은 모든 사용자에게 읽기·쓰기·실행을 모두 준다.","666은 모든 사용자에게 읽기·쓰기를 준다.","646은 기타 사용자에게 쓰기(6)를 주므로 수정이 가능하다.","644는 소유자만 쓰기, 나머지는 읽기만 가능하다."]},{"id":"20230521-31","s":3,"q":"서버 담당자 Park 사원은 데이터를 안전하게 보호하는 일을하기 위해 BitLocker 기능을 사용하고자 한다. BitLocker를 사용하기 위해서 메인보드와 BIOS에서 지원해야 하는 기능은 무엇인가?","o":["FSRM","NTLM","TPM","Heartbeat"],"a":2,"im":[],"src":[["20230521",31]],"x":["BitLocker는 암호화 키를 메인보드의 보안 칩 TPM(Trusted Platform Module)에 보관해 부팅 무결성을 확인한다.","FSRM은 파일 서버 리소스 관리자로 할당량, 파일 차단을 관리한다.","NTLM은 Windows 인증 프로토콜이다.","TPM은 BitLocker 키를 안전하게 보관하는 하드웨어 칩이다.","Heartbeat는 클러스터 노드 간 상태를 확인하는 신호다."]},{"id":"20230521-32","s":3,"q":"서버 담당자 Park 사원은 Windows Server 2016에서 성능모니터를 운영하여 서버의 성능을 분석하고자 한다. 다음 중 성능 모니터로 미리 정의한 일정한 주기로 특정 데이터를 수집하고자 성능 모니터 도구를 시작하기 위한 명령어로 올바른 것은?","o":["perfmon","msconfig","dfrg","secpol"],"a":0,"im":[],"src":[["20230521",32]],"x":["perfmon을 실행하면 성능 모니터가 열리고, 데이터 수집기 집합으로 정해진 주기마다 카운터 데이터를 모을 수 있다.","perfmon은 성능 모니터 실행 명령이다.","msconfig는 시스템 구성(시작 프로그램, 부팅 옵션) 도구다.","dfrg는 예전 디스크 조각 모음 도구다.","secpol(secpol.msc)은 로컬 보안 정책 편집기다."]},{"id":"20230521-33","s":3,"q":"서버 관리자 Kim 사원이 Linux 서버의 '/root' 디렉터리를점검 중 '/etc/passwd' 파일이 '/root' 디렉터리에 복사되어 있는 것을 발견하였다. 이에 Kim 사원은 '/root/passwd' 파일을 삭제하려 했으나 삭제가 되지 않았다. (A)명령어를 사용하여 파일 속성을 출력하였는데 해당 파일에 'i' 속성이 설정되어 쓰기 및 삭제가 되지 않는 것을 확인하였다. 해당 명령어 (A)는 무엇인가?","o":["file","stat","lsattr","lsblk"],"a":2,"im":[13],"src":[["20230521",33]],"x":["lsattr는 리눅스 확장 파일 속성을 보여 준다. 'i'(immutable) 속성이 있으면 root도 수정·삭제할 수 없고, chattr -i로 풀어야 한다.","file은 파일 종류(텍스트, 바이너리 등)를 판별한다.","stat은 inode 정보(크기, 권한, 시간)를 보여 주지만 i 속성은 보여 주지 않는다.","lsattr는 chattr로 설정한 i, a 같은 확장 속성을 출력한다.","lsblk는 블록 장치(디스크, 파티션) 목록을 보여 준다."]},{"id":"20230521-34","s":3,"q":"서버 관리자 Kim 사원이 Linux 서버의 '/var/log' 디렉터리를 백업하기 위해 압축프로그램을 이용하여 압축 중, 작업 중인 터미널을 닫아도 실행 중인 프로세스를 백그라운드 프로세스로 작업 될 수 있도록 해주는 명령어는?","o":["mkfs","nohup","sleep","last"],"a":1,"im":[],"src":[["20230521",34]],"x":["nohup은 hang-up 신호를 무시하게 해서 터미널을 닫아도 명령이 계속 실행되게 한다(보통 & 와 함께 사용).","mkfs는 파일 시스템을 만드는 명령이다.","nohup은 로그아웃·터미널 종료 후에도 프로세스를 유지시킨다.","sleep은 지정한 시간 동안 대기한다.","last는 로그인 기록을 보여 준다."]},{"id":"20230521-35","s":3,"q":"Linux 시스템 관리자는 John사원의 계정인 John의 패스워드 정책을 변경하기 위해 아래 지문과 같이 입력하였다. 10일전 암호변경 경고를 위한 명령으로 ( )안에 알맞은 옵션은?","o":["-m 10","- L 10","- i 10","- W 10"],"a":3,"im":[14],"src":[["20230521",35]],"x":["chage의 -W 옵션은 암호 만료 며칠 전부터 경고할지 정한다. 10일 전 경고는 chage -W 10 John이다.","-m은 암호 변경 후 다시 바꿀 수 있기까지의 최소 일수다.","-l(소문자)은 계정의 암호 정보 목록을 보여 준다. 대문자 L은 chage 옵션이 아니다.","-I(대문자 i)는 암호 만료 후 계정이 비활성화되기까지의 일수다.","-W는 만료 전 경고 일수를 지정한다."]},{"id":"20230521-36","s":3,"q":"네임서버 레코드 정보를 변경한지 충분한 시일이 지났지만특정 기기에서 해당(기존) 도메인으로 접속이 원할한 경우, 컴퓨터에 DNS cache가 갱신되지 않아 발생할 수 있다. DNS cache를 초기화 하는 명령어는 어느것인가?","o":["ipconfig /displydns","ipconfig /flushdns","ipconfig /release","ipconfig /renew"],"a":1,"im":[],"src":[["20230521",36]],"x":["ipconfig /flushdns는 로컬 DNS 확인자 캐시를 비워 바뀐 레코드를 다시 조회하게 한다.","/displaydns는 캐시 내용을 보여 줄 뿐 지우지 않는다(보기의 철자도 틀렸다).","/flushdns는 DNS 캐시를 초기화한다.","/release는 DHCP로 받은 IP를 반납한다.","/renew는 DHCP IP를 갱신한다."]},{"id":"20230521-37","s":3,"q":"서버 관리자 Kang 사원은 Windows Server 2016 시스템의보안을 위해 EFS(암호화 파일 시스템)을 사용하려고 한다. EFS에 대한 설명으로 올바른 것은?","o":["EFS는 윈도우즈 시스템의 파일에만 암호화 기술을 적용한다.","EFS는 인증서 파일의 확장자로 CER, P7B, PFX, SST 형식을 지원한다.","EFS는 개인키를 보호하는 방법으로 암호만을 사용할 수 있다.","EFS는 사용자만 동일하면 윈도우즈 시스템을 다시 설치해도 암호화된 파일을 열 수 있다."],"a":1,"im":[],"src":[["20230521",37],["20240225",39]],"x":["EFS는 인증서로 키를 관리하며 인증서 파일 형식으로 CER, P7B, PFX, SST를 지원한다.","EFS는 NTFS 볼륨의 파일·폴더를 암호화하며 Windows 시스템 파일만 대상으로 하지 않는다.","EFS 인증서는 CER, P7B, PFX, SST 형식으로 내보내거나 가져올 수 있다.","개인 키는 암호뿐 아니라 스마트 카드 등으로도 보호할 수 있다.","재설치하면 사용자 SID와 키가 바뀌므로 인증서(PFX)를 백업해 두지 않으면 파일을 열 수 없다."]},{"id":"20230521-38","s":3,"q":"서버 관리자 Park 사원은 Windows Server 2016의 ActiveDirectory에서 도메인 사용자 계정을 관리하기 위해 도메인 사용자 계정을 생성/수정/삭제하려고 한다. 다음 중 도메인 사용자 계정을 관리하기 위한 명령어가 아닌 것은?","o":["dsadd","dsmod","dsrm","net user"],"a":3,"im":[],"src":[["20230521",38]],"x":["dsadd, dsmod, dsrm은 AD 도메인 개체(사용자 등)를 추가·수정·삭제하는 명령이다. net user는 주로 로컬 사용자 계정을 관리한다.","dsadd user로 도메인 사용자를 만든다.","dsmod user로 도메인 사용자 속성을 바꾼다.","dsrm으로 도메인 개체를 지운다.","net user는 로컬 계정 관리 명령으로 분류되어 도메인 계정 관리 명령이 아니다(출제 기준)."]},{"id":"20230521-39","s":3,"q":"Linux 시스템에서 마운트 되었는지 확인하는 명령어로 옳지않은 것은?","o":["fdisk","mount","df","cat /etc/mtab"],"a":0,"im":[],"src":[["20230521",39]],"x":["fdisk는 디스크 파티션을 만들고 보는 도구로 마운트 상태를 보여 주지 않는다.","fdisk는 파티션 관리 명령이라 마운트 확인용이 아니다.","옵션 없이 mount를 실행하면 현재 마운트 목록이 나온다.","df는 마운트된 파일 시스템과 사용량을 보여 준다.","/etc/mtab에는 현재 마운트된 파일 시스템 목록이 들어 있다."]},{"id":"20230521-40","s":3,"q":"Linux 디렉터리에 대한 소유자와 소유그룹을 변경할 수 있는 명령어는?","o":["chmod","chown","useradd","chage"],"a":1,"im":[],"src":[["20230521",40],["20240519",30],["20250824",32]],"x":["chown 소유자:그룹 대상 형식으로 소유자와 소유 그룹을 함께 바꿀 수 있다.","chmod는 권한(rwx)을 바꾼다.","chown은 파일·디렉터리의 소유자와 그룹을 바꾼다.","useradd는 새 사용자를 만든다.","chage는 암호 만료 정책을 바꾼다."]},{"id":"20230521-41","s":3,"q":"Linux 시스템 운영 중 비인가자의 로그인 시도 이력을 확인하기 위한 명령어로 옳은 것은?","o":["lastb","xferlog","history","pkill"],"a":0,"im":[],"src":[["20230521",41],["20241103",39],["20260201",34]],"x":["lastb는 /var/log/btmp를 읽어 실패한 로그인 시도 기록을 보여 준다.","lastb는 로그인 실패(비인가 시도) 이력을 출력한다.","xferlog는 FTP 전송 로그 파일이다.","history는 현재 사용자가 입력한 명령 기록이다.","pkill은 이름으로 프로세스를 종료한다."]},{"id":"20230521-42","s":3,"q":"Linux 서버 운영 중 불필요한 service port가 열려있는지 확인하는 명령어로 옳은 것은?","o":["ps -ef | grep tcp","netstat –antp","netstat –rn","cat /etc/services"],"a":1,"im":[],"src":[["20230521",42],["20240825",32]],"x":["netstat -antp는 모든(a) TCP(t) 연결을 숫자(n)로, 해당 프로세스(p)와 함께 보여 주므로 열린 포트와 그 서비스를 확인할 수 있다.","ps -ef | grep tcp는 이름에 tcp가 들어간 프로세스만 찾을 뿐 열린 포트 목록이 아니다.","netstat -antp로 LISTEN 포트와 프로세스를 확인한다.","netstat -rn은 라우팅 테이블을 보여 준다.","/etc/services는 서비스 이름과 포트 번호의 대응표일 뿐 실제로 열린 포트가 아니다."]},{"id":"20230521-43","s":3,"q":"Linux의 가상 파일시스템으로 동작 중인 프로세스의 상태정보, 하드웨어 정보, 시스템 정보 등을 확인할 수 있는 디렉터리로 올바른 것은?","o":["/boot","/etc","/proc","/lib"],"a":2,"im":[],"src":[["20230521",43],["20240519",37],["20251102",32]],"x":["/proc는 메모리에만 존재하는 가상 파일 시스템으로 프로세스, CPU, 메모리 등 커널 정보를 파일 형태로 보여 준다.","/boot에는 커널 이미지와 부트로더 파일이 있다.","/etc에는 설정 파일이 있다.","/proc는 실행 중인 프로세스와 하드웨어·시스템 정보를 제공한다.","/lib에는 공유 라이브러리와 커널 모듈이 있다."]},{"id":"20230521-44","s":3,"q":"Linux 시스템에서 'exam.txt' 파일의 내용을 보려고 하는데,내용이 많아서 한 페이지를 넘어가 버린다. 한 페이지씩 차례대로 보기 위한 명령은?","o":["cat exam.txt | more","cat exam.txt | grep","find exam.txt | grep","tar exam.txt | grep"],"a":0,"im":[],"src":[["20230521",44],["20260201",38]],"x":["more는 출력을 한 화면씩 끊어 보여 준다. cat 출력 결과를 파이프로 more에 넘기면 페이지 단위로 볼 수 있다(more exam.txt도 가능).","cat exam.txt | more로 한 페이지씩 본다.","grep은 패턴 검색 명령이며 패턴 없이 쓰면 오류가 난다.","find는 파일을 찾는 명령이라 내용을 페이지로 보여 주지 않는다.","tar는 묶음(아카이브) 명령으로 내용 보기와 관계없다."]},{"id":"20230521-45","s":3,"q":"Windows Server 2016의 IIS 기본 웹사이트 등록 정보의 필드에 대한 설명으로 옳지 않은 것은?","o":["IP 주소: 사이트가 사용할 IP 주소를 기록하며, 한 컴퓨터에 2개 이상의 IP가 할당된 경우는 IP의 접속 순서를 지정","TCP 포트: 웹서버 시스템의 물리적인 시리얼 포트 번호를 지정","연결 수 제한: 웹서버에 연결할 수 있는 연결 수 제한을 지정","연결 시간 제한: 웹서버에 접속한 후 일정 시간 동안 움직임이 없으면 세션을 끊도록 지정"],"a":1,"im":[],"src":[["20230521",45],["20250223",28]],"x":["IIS 바인딩의 TCP 포트는 웹 서비스가 들을 논리적인 포트 번호(기본 80)이지 물리적인 시리얼 포트가 아니다.","IP 주소 필드에는 사이트가 쓸 IP를 지정한다.","TCP 포트는 HTTP 요청을 받을 논리 포트 번호이므로 틀린 설명이다.","연결 수 제한으로 동시 연결 수를 제한한다.","연결 시간 제한으로 일정 시간 동안 움직임이 없는 세션을 끊는다."]},{"id":"20230521-46","s":4,"q":"사람의 머리카락 굵기만큼의 가는 유리 섬유로 정보를 보내고 받는 속도가 가장 빠르고 넓은 대역폭을 가지는 장점도 있지만 구리선에 비해 가격이 비싸고 설치나 유지보수가 어렵다는 단점이 있는 케이블은 무엇인가?","o":["Coaxial Cable","Twisted Pair","Thin Cable","Optical Fiber"],"a":3,"im":[],"src":[["20230521",46]],"x":["머리카락 굵기의 유리 섬유로 빛을 보내며 속도와 대역폭이 가장 크지만 비싸고 시공이 어려운 매체는 광섬유다.","동축 케이블은 구리 중심 도체를 쓴다.","트위스트 페어는 꼰 구리선이라 광섬유보다 대역폭이 작다.","Thin Cable은 얇은 동축 케이블(10Base2)이다.","광섬유는 빛을 써서 고속·광대역이지만 설치·유지보수 비용이 크다."]},{"id":"20230521-47","s":4,"q":"네트워크 담당자 Kim 사원은 물리적인 하나의 LAN을 논리적으로 여러 개로 나누어 효율적으로 네트워크를 관리하고자 한다. 내부망을 분리할 때 사용되고, 방화벽에서 외부망으로부터 내부망을 보호할 때도 사용할 수 있는 것은 무엇인가?","o":["NAC","VLAN","IPS","IDS"],"a":1,"im":[],"src":[["20230521",47]],"x":["VLAN은 물리적인 하나의 LAN을 논리적으로 여러 브로드캐스트 도메인으로 나누어 내부망 분리에 쓰인다.","NAC는 접속 단말의 보안 상태를 검사해 네트워크 접근을 통제한다.","VLAN은 스위치에서 LAN을 논리적으로 분할한다.","IPS는 침입을 탐지하고 차단하는 장비다.","IDS는 침입을 탐지하고 알리는 장비다."]},{"id":"20230521-48","s":4,"q":"IP 주소와 같은 TCP/IP 통신을 수행하기 위한 네트워크 구성 파라메터들을 동적으로 설정하기 위해 사용되는 표준 네트워크 프로토콜로서 호스트가 네트워크에 접속하고자 할 때마다 IP를 동적으로 할당받을 수 있도록 하는 장치는?","o":["DHCP(Dynamic Host Configuration Protocol)","DNS(Domain Name System)","IP주소 관리 시스템","NAC(Network Access Control)"],"a":0,"im":[],"src":[["20230521",48]],"x":["DHCP는 호스트가 접속할 때마다 IP 주소, 서브넷 마스크, 게이트웨이, DNS 등 설정을 동적으로 할당한다.","DHCP가 IP와 네트워크 설정을 자동으로 나눠 준다.","DNS는 도메인 이름을 IP로 바꾼다.","IP 주소 관리 시스템(IPAM)은 IP 사용 현황을 관리하는 도구로 표준 할당 프로토콜이 아니다.","NAC는 네트워크 접근 통제 솔루션이다."]},{"id":"20230521-49","s":4,"q":"RAID 방식 중 미러링(Mirroring)이라고 하며, 최고의 성능과고장대비 능력을 발휘하는 것은?","o":["RAID 0","RAID 1","RAID 3","RAID 5"],"a":1,"im":[],"src":[["20230521",49],["20240225",46],["20260517",46]],"x":["RAID 1은 같은 데이터를 두 디스크에 똑같이 쓰는 미러링 방식으로, 한 디스크가 고장 나도 데이터가 남는다.","RAID 0은 스트라이핑만 해서 빠르지만 중복이 없어 고장에 약하다.","RAID 1은 미러링으로 높은 안정성을 제공한다.","RAID 3은 바이트 스트라이핑과 전용 패리티 디스크를 쓴다.","RAID 5는 분산 패리티 방식이다."]},{"id":"20230521-50","s":4,"q":"무선랜(LAN)은 무선신호 전달방식을 이용하여 두 대 이상의장치를 연결하는 기술이다. 이를 이용하여 사용자는 근거리 지역에서 이동하면서 지속적으로 네트워크에 접근할 수 있게 된다. 다음의 지문에서 설명하는 와이파이 IEEE 802.11규격은 무엇인가?","o":["IEEE 802.11n","IEEE 802.11ac","IEEE 802.11be","IEEE 802.11ax"],"a":3,"im":[15],"src":[["20230521",50]],"x":["'와이파이 6', MU-MIMO, 1024-QAM, 6GHz 확장(Wi-Fi 6E)은 IEEE 802.11ax의 특징이다.","802.11n은 와이파이 4로 MIMO를 처음 도입했고 최대 64-QAM이다.","802.11ac는 와이파이 5로 5GHz 전용, 256-QAM이다.","802.11be는 와이파이 7로 4096-QAM, 320MHz 채널을 쓴다.","802.11ax는 와이파이 6로 OFDMA, MU-MIMO, 1024-QAM, 6GHz(6E)를 지원한다."]},{"id":"20230820-01","s":1,"q":"다음 설명하는 내용에 가장 적합한 기술을 고르시오.","o":["SSL","NAT","VPN","IDS"],"a":1,"im":[16],"src":[["20230820",1]],"x":["방화벽과 백본 스위치 사이에 두어 IP 주소 고갈 문제를 해결하고 내부 주소를 숨기는 보안 목적의 기술은 NAT다.","SSL은 응용 데이터 암호화 프로토콜로 주소 부족 문제를 해결하지 않는다.","NAT는 사설 IP를 공인 IP로 바꿔 주소를 아끼고 내부 구조를 숨긴다.","VPN은 공중망에 암호화 터널을 만드는 기술이다.","IDS는 침입 탐지 장비로 주소 문제와 관계없다."]},{"id":"20230820-02","s":1,"q":"다음은 라우터의 경로 결정 시 routing table을 참조하여 패킷을 전달하는 과정에 대한 설명이다. 올바른 것은?","o":["Administrative distance (관리거리)","Longest match rule (롱기스트 매치 룰)","Next-hop address (넥스트홉 주소)","Metric (메트릭)"],"a":1,"im":[17],"src":[["20230820",2]],"x":["라우팅 테이블에 목적지와 일치하는 경로가 여러 개 있으면 서브넷 마스크가 가장 긴(가장 구체적인) 경로를 고른다. 이것이 Longest Match Rule이다.","관리 거리는 서로 다른 라우팅 프로토콜이 알려 준 경로 중 무엇을 믿을지 정하는 값이다.","롱기스트 매치 룰은 프리픽스가 가장 긴 경로를 우선 선택한다.","넥스트 홉은 패킷을 넘겨줄 다음 라우터 주소일 뿐 선택 규칙이 아니다.","메트릭은 같은 프로토콜 안에서 경로 비용을 비교하는 값이다."]},{"id":"20230820-03","s":1,"q":"(A) 안에 들어가는 용어 중 옳은 것은?","o":["ARP","Proxy ARP","Inverse ARP","Reverse ARP"],"a":3,"im":[18],"src":[["20230820",3]],"x":["디스크 없는(Diskless) 단말이 자신의 물리 주소로 IP 주소를 얻는 프로토콜은 RARP(Reverse ARP)다.","ARP는 IP 주소로 MAC 주소를 알아낸다.","Proxy ARP는 라우터가 다른 네트워크 호스트를 대신해 ARP에 응답하는 기능이다.","Inverse ARP는 프레임 릴레이에서 DLCI로 상대 IP를 알아낸다.","Reverse ARP는 MAC 주소로 자신의 IP 주소를 얻는다."]},{"id":"20230820-04","s":1,"q":"OSI 7 layer 참조 모델에서 사용되는 Protocols 중 TCP와UDP port를 함께 사용하는 프로토콜은?","o":["SMTP","FTP","DNS","Telnet"],"a":2,"im":[],"src":[["20230820",4],["20260201",8]],"x":["DNS는 일반 질의에 UDP 53번, 영역 전송과 큰 응답에 TCP 53번을 쓴다.","SMTP는 TCP 25번만 쓴다.","FTP는 TCP 20·21번만 쓴다.","DNS는 TCP와 UDP 53번을 모두 쓴다.","Telnet은 TCP 23번만 쓴다."]},{"id":"20230820-05","s":1,"q":"TCP/IP protocol stack에서 사용되는 SNMP 프로토콜의 기능으로 올바른 것은?","o":["대규모 환경의 망 관리 기능","네트워크 장비의 에러 보고 기능","네트워크 장비의 관리 및 감시 기능","호스트 간에 연결성 점검과 네트워크 혼잡 제어 기능"],"a":2,"im":[],"src":[["20230820",5]],"x":["SNMP는 관리자(매니저)가 에이전트의 MIB를 조회·설정하고 Trap을 받아 네트워크 장비를 관리·감시하는 프로토콜이다.","대규모 망 관리를 SNMP의 정의로 보기에는 범위가 넓고 정확하지 않다(SNMP는 장비 단위 관리·감시 프로토콜).","장비 에러 보고는 ICMP의 기능이다.","SNMP는 네트워크 장비 관리와 상태 감시 기능을 한다.","연결성 점검과 혼잡 제어는 ICMP(ping, Source Quench) 관련 기능이다."]},{"id":"20230820-06","s":1,"q":"HTTP 상태코드에 대한 설명으로 올바른 것은?","o":["100번대 : 성공, 메소드 지시대로 요청을 성공적으로 수행","200번대 : 정보 제공, 요청 계속 또는 사용 프로토콜 변경 지시","300번대 : 리다이렉션, 요청 수행완료를 위해서 추가적인 작업 필요","400번대 : 서버에러, 클라이언트 요청은 유효하나 서버 자체의 문제 발생"],"a":2,"im":[],"src":[["20230820",6]],"x":["HTTP 상태 코드: 1xx 정보, 2xx 성공, 3xx 리다이렉션, 4xx 클라이언트 오류, 5xx 서버 오류다.","100번대는 정보(요청 계속 진행)다. 성공은 200번대다.","200번대는 성공이다. 정보 제공은 100번대다.","300번대는 리다이렉션으로 요청을 끝내려면 다른 위치로 이동하는 등 추가 작업이 필요하다.","400번대는 클라이언트 오류이고, 서버 오류는 500번대다."]},{"id":"20230820-07","s":1,"q":"ICMP의 Message Type에 대한 설명으로 옳지 않은 것은?","o":["0 - Echo Reply","5 - Echo Request","13 - Timestamp Request","17 - Address Mask Request"],"a":1,"im":[],"src":[["20230820",7],["20240519",8],["20250525",6]],"x":["ICMP 타입 5는 Redirect다. Echo Request는 타입 8이다.","타입 0은 Echo Reply로 맞다.","타입 5는 Redirect이므로 Echo Request는 틀렸다(Echo Request는 8).","타입 13은 Timestamp Request로 맞다.","타입 17은 Address Mask Request로 맞다."]},{"id":"20230820-08","s":1,"q":"CSMA/CD의 특징으로 옳지 않은 것은?","o":["충돌 도메인이 작을수록 좋다.","충돌이 발생하면 임의의 시간 동안 대기하므로 지연 시간을 예측하기 어렵다.","네트워크상의 컴퓨터들이 데이터 전송을 개시하기 위해서는 반드시 '토큰'이라는 권한을 가지고 있어야 한다.","컴퓨터들은 케이블의 데이터 흐름 유무를 감시하기 위해 특정 신호를 주기적으로 보낸다."],"a":2,"im":[],"src":[["20230820",8],["20240225",12]],"x":["토큰을 가져야 전송하는 것은 토큰 링·토큰 버스 방식이다. CSMA/CD는 토큰 없이 캐리어를 감지해 경쟁적으로 전송한다.","충돌 도메인이 작을수록 충돌이 줄어 성능이 좋아진다.","충돌 후 임의 시간(백오프) 대기하므로 지연 예측이 어렵다.","토큰 사용은 토큰 패싱 방식의 특징이라 CSMA/CD와 맞지 않는다.","CSMA/CD는 전송 전에 매체를 감시(캐리어 감지)한다."]},{"id":"20230820-09","s":1,"q":"OSPF 프로토콜이 최단경로 탐색에 사용하는 기본 알고리즘은?","o":["Bellman-Ford 알고리즘","Dijkstra 알고리즘","거리 벡터 라우팅 알고리즘","Floyd-Warshall 알고리즘"],"a":1,"im":[],"src":[["20230820",9],["20240519",10]],"x":["OSPF는 링크 상태 데이터베이스를 바탕으로 다익스트라(Dijkstra) SPF 알고리즘으로 최단 경로 트리를 계산한다.","벨만-포드는 RIP 같은 거리 벡터 프로토콜이 쓰는 알고리즘이다.","OSPF의 SPF 계산은 다익스트라 알고리즘이다.","거리 벡터 방식은 RIP의 방식이다.","플로이드-워셜은 모든 쌍 최단 경로 알고리즘으로 OSPF와 관계없다."]},{"id":"20230820-10","s":1,"q":"멀티캐스트(Multicast)에 사용되는 IP Class는?","o":["A Class","B Class","C Class","D Class"],"a":3,"im":[],"src":[["20230820",10]],"x":["멀티캐스트 주소는 D Class(224.0.0.0~239.255.255.255)다.","A Class는 대규모 네트워크용 유니캐스트 주소다.","B Class는 중규모 네트워크용 유니캐스트 주소다.","C Class는 소규모 네트워크용 유니캐스트 주소다.","D Class가 멀티캐스트 전용이다."]},{"id":"20230820-11","s":1,"q":"프로토콜의 기본적인 기능 중, 송신기에서 발생된 정보의정확한 전송을 위해 사용자 정보의 앞, 뒤 부분에 헤더와 트레일러를 부가하는 과정은?","o":["캡슐화(Encapsulation)","동기화(Synchronization)","다중화(Multiplexing)","주소지정(Addressing)"],"a":0,"im":[],"src":[["20230820",11],["20260802",13]],"x":["상위 계층 데이터에 각 계층의 헤더(필요하면 트레일러)를 덧붙여 하위 계층으로 내려보내는 과정을 캡슐화라고 한다.","캡슐화는 데이터 앞뒤에 제어 정보(헤더, 트레일러)를 붙이는 기능이다.","동기화는 송수신 양쪽의 타이밍(상태)을 맞추는 기능이다.","다중화는 하나의 회선으로 여러 신호나 연결을 함께 보내는 기능이다.","주소 지정은 송수신 장치를 식별할 주소를 정하는 기능이다."]},{"id":"20230820-12","s":1,"q":"TCP 3-Way Handshaking 연결수립 절차의 1,2,3단계 중 3단계에서 사용되는 TCP 제어 Flag는 무엇인가?","o":["SYN","RST","SYN, ACK","ACK"],"a":3,"im":[],"src":[["20230820",12]],"x":["3-way handshake는 1단계 SYN → 2단계 SYN+ACK → 3단계 ACK 순서다. 3단계에서는 ACK만 보낸다.","SYN은 1단계(연결 요청)에서 쓴다.","RST는 연결을 강제로 끊을 때 쓴다.","SYN+ACK는 2단계(서버 응답)에서 쓴다.","3단계는 클라이언트가 서버의 SYN에 ACK로 응답해 연결을 확정한다."]},{"id":"20230820-13","s":1,"q":"TCP/IP 에서 Broadcast의 의미는?","o":["메시지를 한 호스트에서 다른 한 호스트로 전송하는 것","메시지를 한 호스트에서 망상의 특정 그룹 호스트들로 전송하는 것","메시지를 한 호스트에서 망상의 모든 호스트들로 전송하는 것","메시지를 한 호스트에서 가장 가까이 있는 특정 그룹 호스트들로 전송하는 것"],"a":2,"im":[],"src":[["20230820",13],["20251102",14]],"x":["브로드캐스트는 한 호스트가 같은 네트워크의 모든 호스트에게 보내는 방식이다.","한 호스트에서 한 호스트로 보내는 것은 유니캐스트다.","특정 그룹 호스트들에게 보내는 것은 멀티캐스트다.","망의 모든 호스트에게 보내는 것이 브로드캐스트다.","가장 가까운 그룹 구성원에게 보내는 것은 애니캐스트다."]},{"id":"20230820-14","s":1,"q":"서브넷 마스크에 대한 설명으로 옳지 않은 것은?","o":["A Class는 기본 서브넷 마스크로 '255.0.0.0'을 이용한다.","B Class에서 두 개의 네트워크로 나누고자 한다면, 실제 서브넷 마스크는 '255.255.128.0'이 된다.","C Class는 기본 서브넷 마스크로 '255.255.255.0'을 이용한다.","C Class에서 다섯 개의 네트워크로 나누고자 한다면, 실제 서브넷 마스크는 '255.255.224.0'이 된다."],"a":3,"im":[],"src":[["20230820",14]],"x":["C Class를 나누면 바뀌는 것은 4번째 옥텟이다. 5개 이상으로 나누려면 3비트를 빌려 255.255.255.224가 되어야 한다. 255.255.224.0은 3번째 옥텟을 바꾼 값이라 틀렸다.","A Class 기본 마스크는 255.0.0.0(/8)이다.","B Class(/16)에서 1비트를 빌리면 2개로 나뉘어 255.255.128.0(/17)이 된다.","C Class 기본 마스크는 255.255.255.0(/24)이다.","C Class 5개 분할은 255.255.255.224(/27)이므로 255.255.224.0은 틀렸다."]},{"id":"20230820-15","s":1,"q":"IGMP(Internet Group Management Protocol)에 대한 설명으로 올바른 것은?","o":["OSI 모델 중 4계층 프로토콜이다.","비대칭 프로토콜로써 TTL(Time to Live)를 제공하지 않는다.","로컬 네트워크상의 멀티캐스팅 그룹제어를 수행하기 위한 프로토콜이다.","데이터의 유니캐스팅에 적합한 프로토콜이다."],"a":2,"im":[],"src":[["20230820",15]],"x":["IGMP는 로컬 네트워크에서 호스트와 라우터 사이의 멀티캐스트 그룹 가입·탈퇴를 관리하는 3계층 프로토콜이다.","IGMP는 IP 위에서 동작하는 네트워크 계층(3계층) 프로토콜이다.","IGMP 메시지도 IP 패킷이라 TTL이 있으며(보통 1), 이 설명은 IGMP 특징이 아니다.","IGMP는 로컬 네트워크의 멀티캐스트 그룹을 관리한다.","IGMP는 멀티캐스트용이며 유니캐스트와 관계없다."]},{"id":"20230820-16","s":1,"q":"IP (Internet protocol)에 대한 특징을 설명하였다. 올바른것을 고르시오.","o":["호스트 간 패킷 전달의 신뢰성을 보장한다.","손실된 패킷을 재전송을 요청할 수 있다.","호스트 간에 패킷 교환에서 흐름제어를 할 수 있다.","MUT 값보다 큰 Datagram은 단편화(Fragmentation) 작업을 수행할 수 있다."],"a":3,"im":[],"src":[["20230820",16]],"x":["IP는 비연결형·비신뢰성 프로토콜이라 재전송·흐름 제어를 하지 않는다. 다만 MTU보다 큰 데이터그램은 단편화할 수 있다(보기의 MUT는 MTU의 오타).","신뢰성 보장은 TCP의 역할이다. IP는 최선형(best effort) 전달만 한다.","손실 패킷 재전송은 TCP가 한다.","흐름 제어는 TCP가 한다.","IP는 MTU보다 큰 데이터그램을 조각내(단편화) 전송할 수 있다."]},{"id":"20230820-17","s":1,"q":"호스트의 IP Address가 '201.100.5.68/28' 일 때, NetworkID로 올바른 것은?","o":["201.100.5.32","201.100.5.0","201.100.5.64","201.100.5.31"],"a":2,"im":[],"src":[["20230820",17]],"x":["/28은 마지막 옥텟을 16씩 나눈다(0, 16, 32, 48, 64, 80…). 68은 64~79 블록에 속하므로 네트워크 ID는 201.100.5.64다.","32는 32~47 블록의 네트워크 주소로 68과 다르다.","201.100.5.0은 /24일 때의 네트워크 주소다.","68이 속한 64~79 블록의 첫 주소인 64가 네트워크 ID다.","31은 16~31 블록의 브로드캐스트 주소다."]},{"id":"20230820-18","s":2,"q":"다음은 무선 네트워크에 관한 내용이다. (A) 안에 들어가는용어 중 옳은 것은?","o":["WMN (Wireless Mesh Network)","UWB (Ultra Wide Band)","WPAN (Wireless Personal Area Network)","CAN (Campus Area Network)"],"a":0,"im":[19],"src":[["20230820",18]],"x":["각 노드가 라우터처럼 서로 트래픽을 중계해 그물 모양으로 연결되는 무선 네트워크는 WMN(무선 메시 네트워크)이다.","WMN은 노드들이 멀티홉으로 서로 중계하는 무선망이다.","UWB는 넓은 주파수 대역을 쓰는 근거리 초고속 무선 기술이다.","WPAN은 10m 안팎 개인 영역 무선 네트워크다.","CAN은 캠퍼스 단위 근거리망으로 무선 메시 구조를 뜻하지 않는다."]},{"id":"20230820-19","s":2,"q":"다음은 네트워크 구축에 필요한 매체에 관한 내용이다. (A)안에 들어가는 용어 중 옳은 것은?","o":["U/UTP CAT.3","Thin Coaxial Cable","U/FTP CAT.5","Optical Fiber Cable"],"a":3,"im":[20],"src":[["20230820",19],["20250223",23],["20260517",23]],"x":["10GBASE-SR/LR은 광섬유용 10기가비트 이더넷 규격이다. 기존 기가비트 장비에서 이 규격으로 바꾸려면 광섬유 케이블이 필요하다.","CAT.3 UTP는 10Mbps급이라 10G를 지원하지 못한다.","Thin 동축 케이블은 10Base2(10Mbps)용이다.","CAT.5는 100Mbps(CAT.5e는 1G)급으로 10G SR/LR 규격과 맞지 않는다.","SR(단파장 멀티모드)·LR(장파장 싱글모드)은 광섬유 규격이다."]},{"id":"20230820-20","s":2,"q":"다음의 (A)에 들어갈 알맞은 용어는 무엇인가?","o":["NFV (Network Functions Virtualization)","WMN (Wireless Mesh Network)","VPN (Virtual Private Network)","CDN (Content Delivery Network)"],"a":0,"im":[21],"src":[["20230820",20]],"x":["방화벽, 라우터, 로드밸런서 같은 네트워크 장비 기능을 전용 하드웨어 대신 범용 서버의 소프트웨어(가상화)로 구현하는 기술은 NFV다.","NFV는 네트워크 기능을 가상 머신·소프트웨어로 제공한다.","WMN은 무선 메시 네트워크다.","VPN은 공중망 위의 암호화된 사설 터널이다.","CDN은 콘텐츠를 분산 캐시 서버로 전달하는 서비스망이다."]},{"id":"20230820-21","s":2,"q":"(A) 안에 맞는 용어로 옳은 것은?","o":["QoS (Quality of Service)","F/W (Fire Wall)","IPS (Intrusion Prevention System)","IDS ( Intrusion Detection System)"],"a":0,"im":[22],"src":[["20230820",21]],"x":["IP·프로토콜별로 트래픽을 분류해 대역폭을 할당하고 상황에 따라 우선순위를 조정하는 기술은 QoS다.","QoS는 트래픽별 대역폭과 우선순위를 관리해 서비스 품질을 보장한다.","방화벽은 정책에 따라 트래픽을 허용·차단할 뿐 대역폭을 배분하지 않는다.","IPS는 침입을 탐지해 차단하는 보안 장비다.","IDS는 침입을 탐지해 알리는 보안 장비다."]},{"id":"20230820-22","s":2,"q":"아래 내용에서 IPv6의 일반적인 특징만을 나열한 것은?","o":["A, B, C, D","A, C, D, E","B, C, D, E","B, D, E, F"],"a":1,"im":[23],"src":[["20230820",22],["20240225",22]],"x":["IPv6는 128비트 주소(A), 단순화된 고정 길이 기본 헤더(C), IPsec 기반 보안 강화(D), 멀티캐스트 사용(E)이 특징이다. 클래스 구분(B)과 브로드캐스트(F)는 IPv4의 특징이다.","B(4개 클래스 구분)는 IPv4 특징이 섞여 있다.","A, C, D, E가 IPv6의 특징으로 맞다.","B(클래스 구분)가 섞여 있어 틀렸다.","B와 F(브로드캐스트)가 IPv4 특징이라 틀렸다."]},{"id":"20230820-23","s":2,"q":"LAN의 구성형태 중 중앙의 제어점으로부터 모든 기기가 점대 점(Point to Point) 방식으로 연결된 구성형태는?","o":["링형 구성","스타형 구성","버스형 구성","트리형 구성"],"a":1,"im":[],"src":[["20230820",23],["20250824",22]],"x":["중앙 제어점(허브·스위치)에 모든 기기가 1:1(Point-to-Point)로 연결된 형태는 스타형이다.","링형은 이웃 노드끼리 고리 모양으로 연결된다.","스타형은 중앙 노드와 각 단말을 점대점으로 연결한다.","버스형은 하나의 공유 케이블에 여러 기기가 붙는다.","트리형은 계층적으로 가지를 친 구조다."]},{"id":"20230820-24","s":2,"q":"OSI 7 Layer에서 암호/복호, 인증, 압축 등의 기능이 수행되는 계층은?","o":["Transport Layer","Datalink Layer","Presentation Layer","Application Layer"],"a":2,"im":[],"src":[["20230820",24],["20260802",18]],"x":["암호화·복호화, 압축, 데이터 형식 변환은 표현 계층(6계층)의 기능이다.","전송 계층은 종단 간 신뢰성, 흐름·오류 제어를 맡는다.","데이터 링크 계층은 프레이밍과 인접 노드 간 오류·흐름 제어를 맡는다.","표현 계층은 암호화, 압축, 코드 변환을 수행한다.","응용 계층은 사용자에게 서비스(HTTP, FTP 등)를 제공한다."]},{"id":"20230820-25","s":2,"q":"파장분할다중화방식(WDM)의 특징으로 옳은 것은?","o":["선로의 증설 없이 회선의 증설이 어렵다.","광증폭기를 사용해 무중계 장거리 전송이 가능하다.","광학적인 방법에 의해 신호를 시간축에서 다중화하는 방식이다.","각각의 채널은 같은 전송 형식, 전송속도, 프로토콜 형식을 가진다."],"a":1,"im":[],"src":[["20230820",25]],"x":["WDM은 파장(색)이 다른 빛 여러 개를 한 광섬유에 실어 보내며, 광증폭기(EDFA)로 전기 변환 없이 장거리 전송할 수 있다.","파장을 추가하면 선로 증설 없이 회선을 늘릴 수 있어 반대 설명이다.","광증폭기로 중계기 없이 장거리 전송이 가능하다.","시간축 다중화는 TDM이다. WDM은 파장(주파수)으로 다중화한다.","파장마다 서로 다른 속도·형식·프로토콜을 실을 수 있다."]},{"id":"20230820-26","s":2,"q":"VPN(Virtual Private Network)의 구현 기술 중 인터넷 네트워크 상에서 두 호스트 지점 간에 외부의 영향을 받지 않고 가상 경로를 설정해 주는 것은?","o":["Tunneling","Authentication","Encryption","Access Control"],"a":0,"im":[],"src":[["20230820",26],["20240519",22],["20260201",19]],"x":["터널링은 공중망 위에서 원래 패킷을 다른 패킷으로 감싸 두 지점 사이에 가상의 전용 경로를 만든다.","터널링이 두 지점 간 가상 경로를 만든다.","인증은 접속하는 사용자나 장비가 맞는지 확인한다.","암호화는 데이터를 남이 읽지 못하게 한다.","접근 제어는 허가된 사용자만 자원을 쓰게 한다."]},{"id":"20230820-27","s":2,"q":"IEEE 802 표준과 전송방식이 옳지 않은 것은?","o":["IEEE 802.2 - Wireless LAN","IEEE 802.3 - CSMA/CD","IEEE 802.4 - Token Bus","IEEE 802.5 - Token Ring"],"a":0,"im":[],"src":[["20230820",27]],"x":["IEEE 802.2는 LLC(논리 링크 제어) 표준이다. 무선 LAN은 802.11이다.","802.2는 LLC 표준이므로 무선 LAN과 짝지은 것은 틀렸다.","802.3은 이더넷 CSMA/CD다.","802.4는 토큰 버스다.","802.5는 토큰 링이다."]},{"id":"20230820-28","s":3,"q":"FTP는 원격 서버에 파일을 주고받을 때 사용하는 프로토콜이다. FTP는 2가지 Mode로 구분되는데, 서버에서 따로 포트 대역을 설정해주고 서버는 임의로 지정된 데이터 포트정보를 클라이언트에 보내 클라이언트에서 해당 포트로 접속하는 방식은 무엇인가?","o":["Active Mode","Passive Mode","Privileges Mode","Proxy Mode"],"a":1,"im":[],"src":[["20230820",28]],"x":["Passive 모드에서는 서버가 데이터 포트(지정 대역 중 하나)를 열어 클라이언트에게 알려 주고, 클라이언트가 그 포트로 접속한다.","Active 모드는 서버가 20번 포트에서 클라이언트가 알려 준 포트로 접속한다.","Passive 모드는 클라이언트가 서버의 임의 데이터 포트로 접속한다.","Privileges Mode는 FTP 전송 모드가 아니다.","Proxy Mode는 FTP의 두 가지 기본 모드가 아니다."]},{"id":"20230820-29","s":3,"q":"서버 관리자 Kim 사원이 리눅스서버(하드웨어)의 HDD 증설을 위해 서버를 종료하기로 하였다. 이에 리눅스서버를 종료하기 위한 명령어가 아닌 것은?","o":["shutdown –h now","poweroff","init 6","halt"],"a":2,"im":[],"src":[["20230820",29]],"x":["init 6은 런레벨 6으로 바꾸는 명령으로 시스템을 재부팅한다. 하드웨어 증설을 위해 끄는 명령이 아니다.","shutdown -h now는 즉시 시스템을 종료(halt)한다.","poweroff는 시스템을 끄고 전원을 내린다.","init 6은 재부팅이다(종료는 init 0).","halt는 시스템을 정지시킨다."]},{"id":"20230820-30","s":3,"q":"서버 관리자 Kim 사원은 DNS 서버를 구축하고자 'yum' 을이용하여 bind를 설치하였으나 설치가 되지 않았다. 이에 ping를 이용하여 외부 네트워크 상태 여부를 확인하였으나 정상이었다. 이에 DNS 서버 주소가 잘못되어 있을 것으로 판단하여 'cat /etc/( A )' 내용을 확인하고 수정하였다. ( A )에 해당하는 파일 이름은 무엇인가?","o":["resolv.conf","networks","protocols","services"],"a":0,"im":[24],"src":[["20230820",30]],"x":["리눅스가 사용할 DNS 서버(nameserver) 주소는 /etc/resolv.conf에 적는다. 여기가 잘못되면 yum이 저장소 이름을 찾지 못한다.","/etc/resolv.conf에 nameserver 항목으로 DNS 서버를 지정한다.","/etc/networks는 네트워크 이름과 번호의 대응표다.","/etc/protocols는 프로토콜 이름과 번호의 대응표다.","/etc/services는 서비스 이름과 포트 번호의 대응표다."]},{"id":"20230820-31","s":3,"q":"Windows Server 2016의 DNS관리에서 아래 지문과 같은DNS 설정 방식은?","o":["Round Robin","Cache Plugin","Cache Server","Azure AutoScaling"],"a":0,"im":[25],"src":[["20230820",31],["20250223",36]],"x":["한 도메인에 여러 IP를 등록해 질의할 때마다 순서를 바꿔 응답하면서 부하를 나누는 방식은 라운드 로빈이다.","라운드 로빈은 여러 레코드를 번갈아 응답해 서버 부하를 분산한다.","Cache Plugin은 Windows DNS의 설정 방식이 아니다.","캐시 서버는 조회 결과를 저장해 재사용하는 서버로 분산 응답 방식이 아니다.","Azure AutoScaling은 클라우드 인스턴스 수를 자동 조절하는 기능으로 DNS 설정이 아니다."]},{"id":"20230820-32","s":3,"q":"'netstat' 명령어에 사용하는 옵션 설명에 대해 옳지 않은것은?","o":["-r : 라우팅 테이블을 표시한다.","-p : PID와 사용중인 프로그램명을 출력한다.","-t : 연결된 이후에 시간을 표시한다.","-y : 모든 연결에 대한 TCP 연결 템플릿을 표시한다."],"a":2,"im":[],"src":[["20230820",32]],"x":["netstat -t는 TCP 연결만 보여 주는 옵션이다. 연결된 이후 시간을 보여 주지 않는다.","-r은 라우팅 테이블을 보여 준다.","-p는 PID와 프로그램 이름을 보여 준다.","-t는 TCP 프로토콜만 표시하므로 '연결 이후 시간 표시'는 틀렸다.","-y는 Windows netstat에서 모든 연결의 TCP 연결 템플릿을 표시한다."]},{"id":"20230820-33","s":3,"q":"다음과 같이 파일의 원래 권한은 유지한 채로 모든 사용자들에게 쓰기 가능한 권한을 추가부여할 때, 결과가 다른 명령어는 무엇인가?","o":["chmod 666 file","chmod a+w file","chmod ugo+w file","chmod go=w file"],"a":3,"im":[26],"src":[["20230820",33]],"x":["현재 권한은 rw-r--r--(644)다. 666, a+w, ugo+w는 모두 rw-rw-rw-가 되지만, go=w는 그룹·기타 권한을 w만으로 '설정'해 rw--w--w-가 된다.","666은 rw-rw-rw-가 된다.","a+w는 기존 권한에 모두의 쓰기를 더해 rw-rw-rw-가 된다.","ugo+w도 a+w와 같아 rw-rw-rw-가 된다.","=는 덧붙이지 않고 덮어쓰므로 그룹·기타의 읽기 권한이 사라져 결과가 다르다."]},{"id":"20230820-34","s":3,"q":"Linux 시스템에서 기존에 설정된 'crontab'을 삭제하려고 할때 올바른 명령어는?","o":["crontab –u","crontab –e","crontab –l","crontab -r"],"a":3,"im":[],"src":[["20230820",34],["20241103",37]],"x":["crontab -r은 현재 사용자의 crontab을 삭제한다.","-u는 다른 사용자의 crontab을 지정하는 옵션이다.","-e는 crontab을 편집한다.","-l은 crontab 내용을 출력한다.","-r(remove)은 crontab을 지운다."]},{"id":"20230820-35","s":3,"q":"다음의 내용이 설명하고 있는 Linux 시스템 디렉터리는?","o":["/home","/usr","/var","/tmp"],"a":2,"im":[27],"src":[["20230820",35]],"x":["로그 파일, 메일·인쇄 스풀, 캐시처럼 내용이 계속 바뀌는 가변 데이터를 두는 디렉터리는 /var다.","/home은 일반 사용자의 홈 디렉터리다.","/usr은 사용자용 프로그램, 라이브러리, 문서가 있다.","/var에는 /var/log 같은 로그와 스풀 등 가변 데이터가 저장된다.","/tmp는 임시 파일용 디렉터리다."]},{"id":"20230820-36","s":3,"q":"Linux 시스템에서 사용되고 있는 메모리양과 사용 가능한메모리 양, 공유 메모리와 가상 메모리에 대한 정보를 볼 수 있는 명령어는?","o":["mem","free","du","cat"],"a":1,"im":[],"src":[["20230820",36]],"x":["free는 전체·사용 중·사용 가능 메모리, 공유·버퍼/캐시 메모리, 스왑(가상 메모리) 정보를 보여 준다.","mem이라는 표준 명령어는 없다.","free는 메모리와 스왑 사용량을 보여 준다.","du는 디렉터리·파일의 디스크 사용량을 보여 준다.","cat은 파일 내용을 출력한다."]},{"id":"20230820-37","s":3,"q":"다음 중 Linux의 명령어 해석기는?","o":["Shell","Kernel","Utility Program","Hierarchical File System"],"a":0,"im":[],"src":[["20230820",37],["20240225",34],["20260517",39]],"x":["셸은 사용자가 입력한 명령을 해석해 커널에 전달하는 명령어 해석기다.","셸이 명령어 해석기다.","커널은 하드웨어와 자원을 관리하는 운영체제의 핵심이다.","유틸리티 프로그램은 편집기, 압축 도구 같은 보조 프로그램이다.","계층형 파일 시스템은 파일을 트리 구조로 정리하는 방식이다."]},{"id":"20230820-38","s":3,"q":"Linux에서 DNS의 SOA(Start Of Authority) 레코드에 대한설명으로 옳지 않은 것은?","o":["Zone 파일은 항상 SOA로 시작한다.","해당 Zone에 대한 네임서버를 유지하기 위한 기본적인 자료가 저장된다.","Refresh는 주 서버와 보조 서버의 동기 주기를 설정한다.","TTL 값이 길면 DNS의 부하가 늘어난다."],"a":3,"im":[],"src":[["20230820",38],["20241103",43],["20250525",30]],"x":["TTL이 길면 다른 서버가 캐시를 오래 쓰므로 질의가 줄어 DNS 부하는 오히려 줄어든다. 대신 변경 내용이 늦게 반영된다.","존 파일은 SOA 레코드로 시작한다.","SOA에는 주 네임서버, 관리자 메일, 일련번호 등 존 유지 기본 정보가 있다.","Refresh는 보조 서버가 주 서버의 변경을 확인하는 주기다.","TTL이 길면 캐시 재사용이 늘어 부하가 줄어들므로 틀린 설명이다."]},{"id":"20230820-39","s":3,"q":"Windows Server 2016의 DNS Server 역할에서 지원하는 '역방향 조회'에 대한 설명으로 옳은 것은?","o":["클라이언트가 정규화된 도메인 이름을 제공하면 IP주소를 반환하는 것","클라이언트가 IP주소를 제공하면 도메인을 반환하는 것","클라이언트가 도메인을 제공하면 라운드로빈 방식으로 IP를 반환하는 것","클라이언트가 도메인을 제공하면 하위 도메인을 반환하는 것"],"a":1,"im":[],"src":[["20230820",39],["20240225",38]],"x":["역방향 조회는 IP 주소로 도메인 이름(PTR 레코드)을 찾는 것이다.","도메인 이름으로 IP를 찾는 것은 정방향 조회다.","역방향 조회는 IP 주소를 받아 도메인 이름을 돌려준다.","라운드 로빈은 여러 IP를 번갈아 주는 부하 분산 방식이다.","하위 도메인을 돌려주는 조회 방식은 없다."]},{"id":"20230820-40","s":3,"q":"Linux Apache 웹서버에 사용자가 접속 후, 80초간 사용자가 요청이 없을 경우 세션을 종료시키도록 'httpd.conf' 파일에서 설정하는 옵션값은?","o":["Exec-timeout 80","Listen 80","KeepAliveTimeout 80","NameVirtualHost 80"],"a":2,"im":[],"src":[["20230820",40]],"x":["KeepAliveTimeout은 지속 연결에서 다음 요청을 기다리는 시간(초)이다. 80초 동안 요청이 없으면 연결을 끊는다.","Exec-timeout은 Cisco 장비 콘솔의 유휴 시간 설정이다.","Listen 80은 80번 포트에서 요청을 받으라는 뜻이다.","KeepAliveTimeout 80은 요청 없이 80초가 지나면 연결을 종료한다.","NameVirtualHost는 이름 기반 가상 호스트를 지정하는 옛 지시자다."]},{"id":"20230820-41","s":3,"q":"서버 관리자 Park 사원은 Linux 서버를 관리하면서 특정 조건에 맞는 파일 및 디렉터리를 검색하기 위해 'find' 명령어를 사용하려고 한다. 'find' 명령어의 주요 옵션에 대한 설명으로 올바른 것은?","o":["'-name'은 지정한 사용자 이름에 해당하는 파일이나 디렉터리를 찾는다.","'-type'은 지정한 디렉터리 종류에 해당하는 디렉터리 유형을 찾는다.","'-perm'은 지정한 소유자의 권한만을 고려하여 파일이나
