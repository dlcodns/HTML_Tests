 "MLOps는 보통 ML Workflow 지원플랫폼, DevOps 및 모델/데이터 공유 Hub로 구성된다.", "MLOps 환경을 구축하기 위해서는 Jupyter Notebook 등 각 단위 기능별 필요한 오픈소스 SW를 조합하여 활용하여야 하며, 플랫폼 형태로는 AWS SageMaker, MS Azure ML, Google Vertex AI 등 상용플랫폼 활용이 필요하다.", "MLOps를 통해 AI 모델 개발에 집중하여 생산성을 제고하고, 운영모델 성능을 개선하여 고품질 모델을 확보할 수 있도록 한다."], "a": 3, "fix": true, "src": "기출 모의시험", "e": "MLOps 환경은 오픈소스(Kubeflow, Jupyter 등)를 조합하거나 SCP AI&MLOps Platform 같은 플랫폼을 쓰면 구축할 수 있습니다. AWS SageMaker·Azure ML·Vertex AI 같은 상용 플랫폼이 '반드시 필요하다'는 단정이 틀렸습니다. 나머지는 MLOps의 등장 배경, 목표, 구성(ML Workflow 플랫폼·DevOps·모델/데이터 Hub), 효과를 맞게 설명합니다.", "id": "G2-16"}, {"item": "4-2f", "t": "기출", "q": "M 항공사는 설계도와 같은 지적 재산 데이터를 극도로 엄격한 보안 규정 아래 보호하고자 합니다.\n거버넌스의 편의성과 신속한 통제성을 위해 중앙 집중형 암호화 키 관리(SCP KMS)를 도입하려 합니다.\n\n- 데이터키를 발급하는 마스터키는 폐쇄망에 구축된 HSM에 보관하고,\n- FIPS 140‑2(미국 연방 정보 처리 표준)를 반드시 준수해야 합니다.\n\n위와 같은 요구사항에 부합하는 SCP KMS가 제공하는 암호화·키 관리 기능 중 옳지 않은 설명을 고르시오.", "o": ["키 회전이 수행되면, 마스터 키가 초기화되어 복호화를 수행할 수 없다.", "암호화 기술 명세로 AES‑256, RSA‑2048, ECDSA를 모두 지원한다.", "KMS 서비스는 암호화·복호화, 서명·검증 모두에 사용할 수 있다.", "키 회전을 활성화하면 새 키 버전을 자동으로 생성하므로 별도로 “새 키 생성” 작업 없이도 새로운 암호화 자료를 만들 수 있다.", "키 회전 주기는 고객 정책에 따라 1 ~ 730 일 범위 내에서 자유롭게 설정 가능하다."], "a": 0, "fix": true, "src": "기출 모의시험", "e": "키 회전은 새 키 버전을 만들 뿐 마스터 키를 초기화하지 않으며, 이전 버전으로 암호화한 데이터도 계속 복호화할 수 있습니다. KMS는 AES(대칭)·RSA(비대칭)·ECDSA(서명)를 지원하고, 암·복호화와 서명·검증에 모두 쓰며, 자동 회전 주기는 1~730일입니다. 마스터 키는 FIPS 140-2 Lv3 HSM의 루트 키로 생성됩니다.", "id": "G2-17"}, {"item": "3-2a", "t": "기출", "q": "SCP(Samsung Cloud Platform) Virtual Server의 신청에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["약정 기간을 6개월로 설정할 수 없다.", "약정 기간을 2년으로 설정할 수 없다.", "Init Script 입력시, 동일한 스크립트로 윈도우즈 및 리눅스 서버를 설정할 수 있다.", "일반형 서버타입 중 가장 작은 용량의 모델은 s1v1m2이며, 1개의 vCPU, 2GB의 메모리를 제공한다.", "고용량 서버타입 중 가장 큰 용량의 모델은 h2v128m1536이며, 128개의 vCPU, 1536GB의 메모리를 제공한다."], "a": 2, "e": "Init Script는 OS별로 다릅니다. Windows는 배치 스크립트, Linux는 쉘 스크립트·Cloud-init을 쓰므로 같은 스크립트로 두 OS를 설정할 수 없습니다. Virtual Server 약정은 무약정·1년·3년이라 6개월·2년은 안 되고, 서버 타입은 Standard s1v1m2(1vCPU·2GB) ~ High Capacity h2v128m1536(128vCPU·1536GB)입니다.", "src": "기출 모의시험", "fix": true, "id": "G2-18"}, {"item": "3-5c", "t": "기출", "q": "SCP(Samsung Cloud Platform)에서 제공하는 Database 서비스의 고가용성(HA) 구성 및 클러스터 구성에 대한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["PostgreSQL(DBaaS) 서비스는 Active/Standby로 고가용성(HA)을 구성한다.", "EPAS(DBaaS) 서비스는 Active/Standby로 고가용성(HA)을 구성한다.", "Microsoft SQL Server(DBaaS)의 고가용성(HA) 구성은 WSFC(Windows Server Failover Clustering), Always On 구성을 이용해 Active/Standby로 구성되며 AD(Active Directory)를 사용하지 않는다.", "CacheStore(DBaaS)는 멀티 Master를 지원하는 클러스터 기반의 고가용성(HA) 구성도 제공한다.", "CacheStore(DBaaS)는 Sentinel을 이용해 고가용성(HA)을 구성하면 싱글 Master를 지원한다."], "a": 3, "e": "(추정, 3번 보기는 실제 시험에서 오답 확인) 교재의 CacheStore(DBaaS)는 Sentinel 기반 이중화(Replica 1~2개, 싱글 Master)만 제공하므로 '멀티 Master 클러스터 기반 HA도 제공한다'가 틀린 설명으로 봅니다. PostgreSQL·EPAS는 Active/Standby(Redundancy)이고, MS SQL Server는 WSFC·Always On으로 Active/Standby를 구성하며 AD를 쓰지 않는 방식입니다.", "src": "기출 모의시험", "fix": true, "id": "G2-19"}, {"item": "4-1a", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 Backup에 관한 설명으로 맞는 것을 고르십시오.", "o": ["Object Storage에서는 스케줄 기반 스냅샷 방식의 백업을 수행한다.", "Virtual Server의 (Agentless) VM Image 백업은 저장 위치를 선택하여 원격지 백업이 가능하다.", "원본 Backup 서비스를 해지하면 복제본의 스케줄과 저장된 백업 데이터도 삭제된다.", "Agent Backup은 보관 기간 수정 시 이미 생성된 모든 백업본의 보관 기간이 동일하게 변경됩니다.", "Agent Backup은 기본 암호화가 적용되며 수정할 수 없다."], "a": 1, "e": "(추정) Virtual Server의 Agentless(VM Image) 백업은 생성 시 DR(원격지 복제) 옵션으로 다른 위치에 백업본을 둘 수 있습니다. Object Storage는 스냅샷이 아니라 버전 관리로 보호하고, 보관 기간을 바꾸면 이후 생성되는 백업본부터 적용되며, 원본 해지·암호화 관련 단정 보기는 근거가 약해 오답으로 봅니다.", "src": "기출 모의시험", "fix": true, "id": "G2-20"}, {"item": "4-2i", "t": "기출", "q": "게임회사 A업체는 SCP(Samsung Cloud Platform)에 구성한 자원 설정의 보안 취약점을 진단하기 위해 Config Inspection을 실행했으나, 진단이 정상적으로 수행되지 않습니다. 다음 중 점검해야 할 사항에 해당하지 않는 것은 무엇입니까?", "o": ["Config Inspection를 생성할 때 자원 접근에 필요한 권한이 구성된 인증키가 선택되었는지 확인한다.", "Config Inspection에 설정에 사용된 인증키의 사용자에게 적용된 권한 정책 요건에서 인증 방식, 적용 대상, 액션 타입이 정확하게 설정되었는지 확인한다.", "Config Inspection에 설정에 사용된 인증키의 사용자에게 적용된 권한 정책 요건에서 IP 제어 항목에 Config Inspection 필수 허용 IP가 정확히 입력되어있는지 확인한다.", "SCP 자원에 연결된 Firewall과 Security Group에서 Config Inspection 필수 허용 IP를  허용하고 있는지 확인한다.", "인증키에 접근 가능 IP 주소에 Config Inspection 필수 허용 IP가 입력되어 있는지 확인한다."], "a": 3, "e": "(추정) Config Inspection은 인증키로 SCP API를 호출해 자원 '설정'을 읽어 진단합니다. 자원에 네트워크로 접속하지 않으므로 자원의 Firewall·Security Group 허용 여부는 점검 대상이 아닙니다. 확인할 것은 인증키 선택, 인증키 사용자 권한 정책(인증 방식·대상·액션·IP 제어), 인증키 접근 허용 IP입니다.", "src": "기출 모의시험", "fix": true, "id": "G2-21"}]</script>
<script type="application/json" id="lessons">{"3-8a": {"title": "MLOps", "md": "## 한눈에 보기\nMLOps는 **DevOps(개발 및 운영)와 유사하게 머신러닝 모델의 라이프사이클을 관리하고 자동화**하는 데 중점을 둔 방법론이다. MLOps 플랫폼은 ML 모델의 **개발, 배포, 운영**을 지원한다. 학습 단계만이 아니라 배포 이후 운영까지 전 과정을 다룬다.\n\n- 목표: **모델 품질 유지**, **배포 주기 단축**, 운영 중 발생하는 문제의 **신속한 해결**\n- 교재의 핵심 도구: KFP(파이프라인), KServe(서빙), Container Registry(이미지로 모델 패키징), MLflow(실험 추적·모델 레지스트리)\n- 삼성SDS 공식 페이지 표현: MLOps는 ML 개발(Dev)과 ML 시스템 운영(Ops)을 통합하는 방법론이다 (공식 페이지)\n\n## 배경: 왜 MLOps인가\nML 모델은 코드만이 아니라 **데이터, 파라미터, 실행 환경(라이브러리)** 에 따라 결과가 달라진다. 그래서 다음 문제가 생긴다.\n\n| 문제 | MLOps 해법 | 교재의 도구 |\n|---|---|---|\n| 개발 환경에서는 되는데 운영 배포 시 라이브러리 버전 차이로 오류 | 모델 파일 + 실행 코드 + 환경 설정을 **하나의 컨테이너 이미지**로 패키징(Portable Model) | Container Registry |\n| 실험 결과를 재현하기 어려움 | 파라미터, 메트릭, 아티팩트, 소스코드 버전을 자동 기록 | MLflow Tracking |\n| 모델 버전·단계 관리 | Model Registry에서 버전별 등록, Staging / Production / Archived 단계 관리 | MLflow Model Registry |\n| 수작업 반복(전처리→학습→검증→배포) | 각 단계를 컴포넌트로 분리해 하나의 파이프라인으로 자동화 | Kubeflow Pipelines(KFP) |\n| 모델 배포·API 노출 | InferenceService에 명세 → REST API 엔드포인트 자동 생성 | KServe |\n| 새 모델 배포 후 문제 → 롤백 지연 | 이미지 태그(v1, v2, prod…)로 버전 구분, image를 이전 태그로 바꿔 롤백. canaryTrafficPercent로 일부 트래픽만 신모델에 | Container Registry + KServe |\n| 학습→배포 전 주기 자동화 | GitHub Actions, Jenkins 같은 CI/CD 도구와 통합 | Container Registry, MLflow |\n\n## MLOps 라이프사이클과 도구 매핑\n1. **데이터 수집/전처리** → KFP 컴포넌트\n2. **학습(반복 실험)** → KFP 파이프라인 파라미터(예: 하이퍼파라미터)로 반복 실험 자동 수행, MLflow로 실험 기록\n3. **검증/비교** → KFP 실행 이력·조건별 성능 비교, MLflow UI에서 Runs 비교\n4. **모델 등록/버전관리** → MLflow Model Registry, Container Registry 이미지 태그\n5. **배포(서빙)** → KServe InferenceService (Predictor / Transformer / Explainer)\n6. **운영·재학습** → 새 데이터로 재학습 → 새 이미지 v2 Push → InferenceService image 교체, 문제 시 v1 롤백\n\n> [!팁]\n> (일반 개념) 운영 중 입력 데이터 분포가 바뀌어 성능이 떨어지는 것을 드리프트라고 하며, MLOps는 지속적 모니터링과 재학습·재배포를 전제로 한다. \"한 번 배포하면 재학습 없이 고정 운영\"은 MLOps 목표와 반대다.\n\n## 도구별 역할 정리 (시험에서 연결 문제로 자주 나옴)\n| 작업 | 담당 도구 | 헷갈리기 쉬운 오답 |\n|---|---|---|\n| ML 파이프라인을 Python 코드로 정의·자동 실행 | **KFP** | - |\n| Python 파이프라인을 YAML(IR)로 컴파일 | **KFP Compiler** (`Compiler().compile()`) | MLflow Model Registry(X) |\n| 모델 배포(서빙) 및 REST API 엔드포인트 자동 생성 | **KServe** (InferenceService CRD) | - |\n| 실험 파라미터·메트릭 기록·비교 | **MLflow** (Tracking) | KFP Compiler(X) |\n| 모델 버전·단계(Staging/Production/Archived) 관리 | **MLflow Model Registry** | - |\n| 모델과 실행 환경을 이미지로 패키징·저장 | **Container Registry** | - |\n| Canary(점진적) 배포·트래픽 분산, Scale to Zero | **KServe** (Knative·Istio 활용) | Explainer(X) |\n\n> [!주의]\n> Container Registry는 이미지를 **저장·관리하는 저장소**일 뿐이다. \"모델 정확도에 따라 태그가 자동으로 바뀐다\", \"학습 코드를 자동 수정한다\", \"추론 결과를 이미지 내부 로그로 저장한다\"는 모두 틀린 설명이다(CloudML 퀴즈 Q1). 태그는 사용자가 붙이거나 GitHub Actions 등 CI/CD로 자동화한다.\n\n## 관련 용어\n| 용어 | 뜻(교재) |\n|---|---|\n| 파라미터 | 학습/예측에 쓰이는 변수 (학습률, 배치 크기, 에포크 수 등) |\n| 메트릭 | 성능 평가 지표 (정확도, 정밀도, 재현율, F1 스코어 등) |\n| 아티팩트 | 학습 과정 산출물 (학습된 모델 파일, 로그 파일, 시각화 결과) |\n| 소스코드 버전 | 학습에 쓰인 코드 버전 (재현성 보장에 중요) |\n| 메타 정보 | 데이터·시스템에 대한 추가 정보. 재현성 보장, 성능의 객관적 평가, 결과물 관리에 중요 |\n| 서버리스 | 클라우드 사업자가 서버 인프라를 관리하고 사용자는 코드 실행에만 집중하는 모델 (예: AWS Lambda, Azure Functions, Google Cloud Functions) |\n| Scale to Zero | 사용량이 없으면 Pod 수를 0으로 낮추고, 요청이 오면 자동으로 다시 Pod을 띄워 자원 절감 |\n\n> [!시험]\n> - MLOps = 개발·배포·**운영** 전 과정의 라이프사이클 관리·자동화. \"학습 단계에 한정, 배포 후는 DevOps 영역\"은 오답.\n> - YAML(IR) 컴파일은 **KFP Compiler**, 실험 기록은 **MLflow**, 서빙·엔드포인트 자동 생성은 **KServe**, 이미지 저장은 **Container Registry**.\n> - 환경 불일치 → 컨테이너 이미지 패키징 / 재현성 → MLflow 기록 / 롤백 → 이미지 태그를 이전 버전으로 / 점진 배포 → canaryTrafficPercent.\n> - (공식 페이지) AI&MLOps Platform은 배포된 플랫폼 규모와 사용 시간 기준 **시간 단위 과금**, SCP 자원 비용은 별도.\n\n출처: AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드1~4·14·15, AI&ML_2_CloudML_슬라이드별.md 슬라이드1~4·10·11·14·15, 삼성SDS AI&MLOps Platform 서비스 소개 페이지(공식 페이지)\n"}, "3-8b": {"title": "AI&MLOps Platform 기능 · 구성 요소", "md": "## 한눈에 보기\nSCP **AI&MLOps Platform**은 머신러닝 모델의 개발·학습·배포 과정에서 반복되는 작업을 자동화하는 **Kubernetes 기반 머신러닝 플랫폼**이다 (공식 페이지). 교재는 그 핵심 오픈소스 구성요소인 **Kubeflow Pipelines(KFP)** 와 **KServe**를 다룬다.\n\n| 계층 | 내용 |\n|---|---|\n| SCP 서비스 | AI&MLOps Platform (Mini / Enterprise) (공식 페이지) |\n| 플랫폼 구성 요소 | Pipeline, Metadata, Model Serving, Notebook, Hyper Parameter Tuning 등 (공식 페이지) |\n| 교재 핵심 컴포넌트 | KFP(파이프라인 자동화), KServe(모델 서빙) |\n\n## 1. SCP AI&MLOps Platform 기능 (공식 페이지)\n- 쿠버네티스 기반 MLOps 환경 제공, 학습 데이터·모델·운영 데이터를 통합 관리\n- TensorFlow, PyTorch, scikit-learn, Keras 등 프레임워크에 표준화된 환경 제공 (공식 페이지, 영문)\n- 워크플로우: Jupyter Notebook → 모델 개발 → 모델 학습 → 하이퍼파라미터 튜닝 → 모델 서빙 → 추론 애플리케이션\n- 사용자: 데이터 사이언티스트, MLOps 엔지니어 (Console로 접근)\n\n### Mini vs Enterprise\n| 구분 | 기능 |\n|---|---|\n| **공통(Mini, Enterprise)** | AI 플랫폼 생성(자동 배포·구성)·조회(플랫폼 버전, 자원 현황)·삭제 / **Jupyter Notebook**(모델 개발, 학습, 추론) / **ML Pipeline 워크플로우 자동화** / 기타 오픈소스 AI&MLOps(Kubeflow) 기본 기능 |\n| **Enterprise 추가** | 고급 AI/ML 플랫폼 대시보드 / Notebook 서버 Base·사용자 정의 이미지 / **AI/ML Job**(생성, 템플릿, 아카이브, 스케줄링, 실행, 모니터링) — **GPU 자원 모니터링, GPU Fraction**, LLM 학습용 **DeepSpeed Job Operator** / 사용자 이미지 빌드·관리 / AI JumpStarter, 실험 추적 관리(ETM) / Serving(대시보드, 모델 등록·관리, 추론, 예측 결과 시각화) / **프로젝트별 자원 사용량 관리·모니터링** / **프로젝트 사용자·권한 관리**, Admin 기능, 플랫폼 설정 조정 |\n\n- 영문 공식 페이지 추가 기능: 분산 학습 Job 실행·모니터링, Job Queue 관리(FIFO, bin-packing, gang 스케줄러), Bare-metal multi-node GPU 지원, GPUDirect RDMA (공식 페이지)\n\n> [!주의]\n> 프로젝트별 자원 사용량 관리, 프로젝트 사용자·권한 관리, GPU Fraction, AI/ML Job 관리는 **Enterprise 추가 기능**이다. \"Mini와 Enterprise 모두 기본 제공\"이라고 하면 오답. 이 내용은 교재에 없고 삼성SDS 공식 페이지 기준이다.\n\n## 2. Kubeflow Pipelines (KFP)\nKubernetes 기반으로 **ML 파이프라인을 코드로 작성**하고 자동화·관리하는 대표적 MLOps 플랫폼.\n- 데이터 수집/전처리, 학습, 검증, 배포를 여러 단계(**컴포넌트**)로 분리해 하나의 파이프라인으로 자동화\n- 컴포넌트는 **재사용 가능**: 한번 정의하면 여러 파이프라인에서 재활용, 모듈화로 유지보수·확장 용이\n- 각 단계는 파라미터(예: 하이퍼파라미터)를 받아 **반복 실험을 자동 수행**, 실험 결과와 실행 이력이 체계적으로 관리되어 조건별 성능 비교·분석이 쉬움\n- 권장 정의 방법: **KFP Python SDK**\n\n### KFP 구성 요소\n| 항목 | 설명 |\n|---|---|\n| KFP SDK | KFP를 구성하기 위한 Python 기반 SDK |\n| Component | 하나의 독립 실행 가능한 처리 단위 (**컨테이너에서 실행**) |\n| Pipeline | 여러 컴포넌트를 조합한 작업 흐름(워크플로우) |\n| Compiler | Python 파이프라인을 KFP 백엔드가 인식할 수 있는 **YAML**로 변환 |\n| Runner | 파이프라인 실행자 (CLI, KFP UI, Python Client 등) |\n\n### 작성·실행 절차\n1. **개별 Component 구성**: `from kfp.dsl import component` → 함수 위에 `@component()` (예: add, multiply)\n2. **Pipeline 구성 및 컴파일**: `@pipeline()` 함수 안에서 컴포넌트 호출 (`step2 = multiply(step1.output, 2.0)` 처럼 앞 단계 출력을 연결) → `Compiler().compile(pipeline_func=..., package_path=\"my_pipeline.yaml\")`\n3. **실행** (두 가지)\n  - SDK: `Client().create_run_from_pipeline_package(pipeline_file=\"my_pipeline.yaml\", arguments={\"a\": 3, \"b\": 5})`\n  - KFP UI: YAML 생성 → KFP UI 접속 → .yaml 업로드 후 실행\n4. **Graph**: KFP UI에서 실행 과정을 **DAG 그래프**로 시각화, 단계별 실행 흐름·입출력·로그 확인\n\n| 데코레이터 / 함수 | 역할 |\n|---|---|\n| `@component()` | 일반 Python 함수를 컨테이너에서 독립 실행되는 **컴포넌트로 정의** |\n| `@pipeline()` | 컴포넌트들을 조합해 **파이프라인 정의** |\n| `Compiler().compile()` | 파이프라인을 **YAML(IR)** 로 변환. IR = Intermediate Representation |\n| `Client()` | Python 클라이언트로 실행 |\n\n## 3. KServe\nKubernetes 위에서 ML/DL 모델의 **배포(서빙)** 를 위해 **Knative 기반**으로 설계된 서빙 컴포넌트. 대규모·서버리스·신속한 확장성·관리 기능 제공.\n- 핵심은 **InferenceService CRD**: 배포 모델, 위치, 옵션을 명세하면 **REST API 엔드포인트가 자동 생성**\n- **Knative(서버리스 프레임워크) + Istio(Service Mesh)** 를 활용해 Scale to Zero 포함 오토스케일링, **Canary 배포**(점진적 배포), 트래픽 분산 지원\n- ServingRuntime 기반으로 TensorFlow, PyTorch, HuggingFace 등 다양한 프레임워크 서빙을 통합 지원\n\n### KServe 주요 컴포넌트\n| 컴포넌트 | 역할 |\n|---|---|\n| **Predictor** | 실제 추론(예측) 수행. `:predict` 요청 처리 |\n| **Transformer** | 입력 데이터 전처리 / 출력 데이터 후처리 컨테이너 연결 |\n| **Explainer** | 모델 예측 결과에 대한 **설명(Explanation)** 제공. `:explain` 요청 처리 |\n\n> [!주의]\n> Explainer는 Canary 배포 담당이 아니다. Canary·트래픽 분산은 Knative·Istio를 활용한 KServe 기능(Default Endpoint / Canary Endpoint)이다.\n\n> [!시험]\n> - `@component()` = Python 함수 → 독립 실행 컴포넌트, `@pipeline()` = 조합. 둘을 바꿔 놓은 보기가 단골 오답.\n> - Compiler → YAML(IR), Runner → CLI/KFP UI/Python Client.\n> - KServe: InferenceService에 명세 → REST 엔드포인트 자동 생성. Predictor=추론, Transformer=전·후처리, Explainer=설명.\n> - Enterprise 전용: Job 관리·GPU 모니터링·GPU Fraction·프로젝트 자원/권한 관리 (공식 페이지).\n\n출처: AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드4~6·10·11·14·15, 삼성SDS AI&MLOps Platform 서비스 소개 페이지 국문·영문(공식 페이지)\n"}, "3-8c": {"title": "AI&MLOps Platform 배포 환경", "md": "## 한눈에 보기\n- SCP AI&MLOps Platform은 **사용자의 Kubernetes Engine 위에 배포**된다. 연산 자원은 **CPU Worker Node, GPU Worker Node**, 데이터는 **Persistent Volume**에 저장한다 (공식 페이지).\n- 서빙 계층인 **KServe**는 Kubernetes(EKS/AKS/GKE/ACK/On-Prem 등) 위에서 동작하며, Knative + Istio는 **선택적(Optional)** Serverless / ServiceMesh 계층이다.\n- 과금: 배포된 플랫폼의 **규모와 사용 시간 기준 시간 단위**. 사용자 환경 구성에 필요한 **SCP 자원(Kubernetes Engine, 워커 노드 등) 비용은 별도** (공식 페이지).\n\n## 1. SCP 배포 구조 (공식 페이지)\n| 계층 | 구성 |\n|---|---|\n| 사용자 | 데이터 사이언티스트, MLOps 엔지니어 → Console |\n| AI&MLOps Platform | Pipeline, Metadata, Model Serving, Notebook, Hyper Parameter Tuning 등 |\n| Kubernetes Engine | CPU Worker Node, GPU Worker Node, Persistent Volume |\n\n- 플랫폼 생성 시 자동 배포·구성되며, 조회 화면에서 플랫폼 버전과 자원 현황을 본다 (공식 페이지).\n- 영문 공식 페이지: Bare-metal multi-node GPU 지원, GPUDirect RDMA로 LLM/NLP 워크로드 가속 (공식 페이지)\n\n> [!주의]\n> 아래는 모두 틀린 설명이다: \"Bare Metal Server에 Kubernetes 없이 직접 설치\", \"Cloud Functions 기반 서버리스라 워커 노드 구성 불필요\", \"플랫폼 요금에 Kubernetes Engine·워커 노드 비용 포함\", \"SDS 공용 클러스터에 배포되어 사용자 환경엔 자원이 생기지 않음\".\n\n## 2. KServe 배포 스택 (아래 → 위)\n| 층 | 내용 |\n|---|---|\n| 하드웨어 | NVIDIA GPU / Intel CPU / AMD APU |\n| Kubernetes | EKS / AKS / GKE / ACK / On-Prem … |\n| Knative + Istio | **Optional** Serverless / ServiceMesh Layer |\n| KServe | Predictive & Generative Model Inference — Triton Inference Server/TensorRT-LLM, vLLM, TFServing, TorchServe 런타임, Open Inference / OpenAI REST/gRPC Protocol |\n| 프레임워크 | Hugging Face, PyTorch, TensorFlow, scikit-learn, LightGBM |\n| 기능 | pre/post process, predict, generate, inference graph, explain, monitor |\n| Model Storage | S3, GCS, Azure, HTTP/HTTPS, PVC |\n\n## 3. Data plane / Control plane\n**Data plane (요청 흐름)**\n- 사용자 요청(`:predict` / `:explain`) → **Default Endpoint / Canary Endpoint** → **Transformer** → **Predictor**(`:predict`) 또는 **Explainer**(`:explain`)\n\n**Control plane (배포·스케일)**\n- AI Application → Transformer Service → Transformer Pod (Queue Proxy, Preprocess/Predict/PostProcess)\n- Predictor Service → Predictor Pod (**Queue Proxy, Model Server, Storage Initializer**) ← Model Storage\n  - Storage Initializer가 S3·GCS·PVC 등 Model Storage에서 모델을 가져온다\n- **KPA/HPA**로 min/max replicas 사이에서 스케일\n- **KServe Controller**가 **InferenceService를 reconcile** → **Raw Deployment**(Deployment) 또는 **Serverless**(Knative Revision / Knative Service)\n\n## 4. 오토스케일링과 Scale to Zero\n| 항목 | 내용 |\n|---|---|\n| Autoscaler | Knative 기반 KPA, HPA, Scale to Zero |\n| Scale to Zero | 요청이 없으면 Pod를 **0개까지** 제거해 자원 절약, 요청이 오면 자동 재생성 |\n| 효과 | 이벤트 중심(Event-Driven), 비용 최적화된 모델 서빙 |\n\n- 이벤트 중심 아키텍처: 특정 이벤트 발생 시 애플리케이션이 자동으로 트리거되어 필요한 작업을 수행하는 방식\n\n> [!주의]\n> 퀴즈 오답 패턴: \"Pod를 항상 최소 1개 유지\", \"GPU 사용량 기준으로 Pod 조정\", \"실시간 추론에 부적합해 기본 비활성화\", \"HPA만 지원하므로 최소 1개 유지\" → 모두 오답. 정답은 \"요청이 없으면 Pod를 0개까지 줄인다\".\n\n## 5. ServingRuntime\n모델 형식별 서버 컨테이너를 정의하는 리소스. `supportedModelFormats`(name, version, `autoSelect: true`)와 `containers`(image, `--model_dir=/mnt/models`, `--http_port=8080`)를 명세한다. (`apiVersion: serving.kserve.io/v1alpha1`, `kind: ServingRuntime`)\n\n| Name | Supported Model Formats |\n|---|---|\n| kserve-lgbserver | LightGBM |\n| kserve-mlserver | SKLearn, XGBoost, LightGBM, MLflow |\n| kserve-paddleserver | Paddle |\n| kserve-pmmlserver | PMML |\n| kserve-sklearnserver | SKLearn |\n| kserve-tensorflow-serving | TensorFlow |\n| kserve-torchserve | PyTorch |\n| kserve-tritonserver | **TensorFlow, ONNX, PyTorch, TensorRT** |\n| kserve-xgbserver | XGBoost |\n\n> [!팁]\n> ONNX·TensorRT는 **tritonserver만** 지원. MLflow 형식은 **mlserver만**. PyTorch는 torchserve와 tritonserver 둘 다.\n\n> [!시험]\n> - SCP AI&MLOps Platform = Kubernetes Engine(CPU/GPU 워커 노드, PV) 위 배포, 플랫폼은 시간 단위 과금 + SCP 자원 별도 (공식 페이지).\n> - Knative·Istio는 Optional. KServe Controller가 InferenceService를 reconcile → Raw Deployment 또는 Serverless.\n> - Storage Initializer가 Model Storage(S3/GCS/Azure/HTTP(S)/PVC)에서 모델 로드.\n> - KPA/HPA + Scale to Zero(0개까지).\n\n출처: AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드4·7·8·12·13·15, 삼성SDS AI&MLOps Platform 서비스 소개 페이지 국문·영문(공식 페이지)\n"}, "3-8d": {"title": "CloudML", "md": "## 한눈에 보기\n교재 'CloudML'은 MLOps Platform의 핵심 구성 서비스로 **Container Registry**와 **MLflow**를 다룬다.\n\n| 서비스 | 한 줄 정의 | MLOps에서의 역할 |\n|---|---|---|\n| Container Registry | 컨테이너 이미지를 저장·관리하는 중앙 저장소 | 모델 + 실행 환경을 이미지로 패키징해 재현·배포·롤백 |\n| MLflow | ML 실험을 기록·관리하는 오픈소스 MLOps 플랫폼 | 실험 추적, 모델 등록·버전·단계 관리, 재현성 |\n\n> [!팁]\n> 삼성SDS 서비스 목록에는 CloudML Pipeline, CloudML Experiments라는 이름도 보인다(공식 사이트 목차). 교재는 이를 다루지 않으므로 시험은 교재의 Container Registry·MLflow 내용 중심으로 대비한다.\n\n## 1. Container Registry\n### 개념과 장점\n- 학습된 **모델 파일 + 실행 코드 + 환경 설정**을 하나의 컨테이너 이미지로 패키징해 저장 → 일관된 재현·배포\n- 실행 환경을 포함한 셀프-컨테이너형 **Portable Model**로 관리 → 배포 시 **환경 불일치 오류 방지**, 개발/운영 환경 불일치 감소\n- 이미지에 **모델 버전, 학습일, 하이퍼파라미터** 등 메타 정보를 **태그 또는 레이블**로 기록 → 실험 결과 추적, 태그로 운영/테스트 버전 구분\n- **KServe, Seldon Core, SageMaker** 등 서빙 플랫폼과 쉽게 연동 → 배포 자동화·롤백\n- **GitHub Actions, Jenkins** 같은 CI/CD 도구와 통합 → 학습부터 배포까지 MLOps 전 주기 자동화\n\n> [!주의]\n> 교재 각주는 Portable Model을 \"서버리스 컴퓨팅 환경에서 사용되는 모델\"로 설명한다. 본문 정의(실행 환경을 포함한 셀프-컨테이너형 모델)와 함께 기억하되, \"KServe 전용 형식이라 다른 서빙 플랫폼과 연동 불가\"는 명백한 오답이다.\n\n### 모델 → Registry → KServe 배포 7단계\n| 단계 | 작업 | 핵심 명령/파일 |\n|---|---|---|\n| 1 | 모델 학습 및 저장 | `model.py` — SVC(kernel='rbf', gamma=0.001) 학습 → `pickle.dump` → **model.pkl** |\n| 2 | 모델 서버 코드 작성 | `app.py` — FastAPI, `@app.post(\"/predict\")`에서 model.pkl 로드 후 예측 |\n| 3 | Dockerfile로 컨테이너화 | `FROM python:3.10-slim`, `COPY model.pkl app.py requirements.txt`, `CMD [\"uvicorn\", \"app:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8080\"]` (requirements: fastapi, uvicorn, numpy, scikit-learn) |\n| 4 | 이미지 빌드 및 테스트 | `docker build -t svc-digit-model:latest .` → `docker run -p 8080:8080 …` → `curl -X POST …/predict` |\n| 5 | Registry에 Push | `docker tag … harbor.mycompany.com/ml/svc-digit-model:v1` → `docker login` → `docker push` |\n| 6 | KServe(또는 다른 플랫폼)에 배포 | InferenceService YAML(`serving.kserve.io/v1beta1`)의 `spec.predictor.containers[].image`에 이미지 경로, containerPort 8080 → `kubectl apply -f svc-digit-model.yaml` |\n| 7 | 운영 및 재학습 주기 관리 | 재학습 → model.pkl 갱신 → 새 이미지 **v2로 Push** → YAML `image: …:v2` → `kubectl apply`. 롤백은 `:v1`으로 변경 |\n\n순서 암기: **학습·저장 → 서버 코드 → Dockerfile 컨테이너화·빌드/테스트 → 태깅·로그인·Push → InferenceService 배포**\n\n### Container Registry를 Model Registry처럼 활용하는 포인트\n| 항목 | 방법 |\n|---|---|\n| 모델 버전 관리 | 이미지 태그: `:v1`, `:v2`, `:prod`, `:exp` |\n| 모델 추적 | MLflow와 연동하거나 GitHub Actions로 태그 자동화 |\n| 배포 자동화 | CI/CD 스크립트로 훈련 완료 → 이미지 생성 → 배포 |\n| 복원 및 재현 | 컨테이너 자체가 실행환경 포함 → 실행 즉시 복원 가능 |\n| Canary Test | KServe에서 `canaryTrafficPercent`로 테스트 배포 |\n\n## 2. MLflow\n### 개념\n- ML 모델 라이프사이클 관리를 위한 오픈소스 플랫폼: **실험 추적, 모델 관리, 배포 및 재현성** 지원\n- 파라미터, 메트릭, 아티팩트, 소스코드 버전 등을 **자동 기록**하고 **웹 UI**로 조회·비교\n- 학습된 모델은 형식(PyTorch, TensorFlow, Scikit-learn 등)에 따라 저장, **MLflow Model Registry**에서 **버전별** 관리, **Staging / Production / Archived** 단계별 운영\n- 저장된 모델은 **REST API, CLI, Python SDK**로 불러올 수 있음 → 다양한 애플리케이션·서빙 플랫폼과 통합 용이\n- 실험 기록과 모델 이력을 **중앙화된 메타데이터 저장소**로 관리 → 팀 협업, 반복 실험, 재현성 확보\n- **Kubeflow, Airflow, GitHub Actions** 등 파이프라인 도구와 통합\n\n### 실습 6단계\n| 단계 | 내용 |\n|---|---|\n| 1 설치·초기 설정 | `pip install mlflow` → `mlflow server --host 127.0.0.1 --port 8080` → `mlflow.set_tracking_uri(\"http://127.0.0.1:8080\")` |\n| 2 실험 지정·데이터 준비 | `mlflow.set_experiment(\"svc-digit-model-exp\")`, load_digits, train_test_split(test_size=0.2, random_state=42) |\n| 3 학습·평가 | SVC params: kernel \"rbf\"(Radial Basis Function 커널), **C 10.0**(정규화 파라미터, 허용 오차 결정), **gamma 0.001**(데이터 포인트 영향 범위) → accuracy_score |\n| 4 로그·모델 등록 | `with mlflow.start_run():` → `log_params(params)`, `log_metric(\"accuracy\", …)`, `infer_signature(...)`, `mlflow.sklearn.log_model(sk_model, artifact_path=\"svc-model\", signature, input_example, registered_model_name=\"svc-digit-classifier\")` |\n| 5 등록 모델 로딩·예측 | `model_uri = \"models:/svc-digit-classifier/1\"`(버전 명시) → `mlflow.pyfunc.load_model(model_uri)` → `predict` |\n| 6 UI 확인 | http://127.0.0.1:8080 → Experiments → Runs 목록(accuracy, params) → Models 탭(등록 모델, 버전별 상세, stage, 태그) |\n\n### MLflow를 Model Registry처럼 쓰는 SDK 함수\n| 항목 | 함수 |\n|---|---|\n| 실험 그룹 지정 | `mlflow.set_experiment()` |\n| 개별 실험 실행 단위 생성 | `start_run()` |\n| 파라미터·결과 저장 | `log_param()` / `log_metric()` |\n| 모델 등록 및 버전 관리 | `log_model()` + `registered_model_name=` |\n| 모델 불러와 예측 | `pyfunc.load_model()` |\n| 실험·모델·메트릭 확인 인터페이스 | MLflow UI |\n\n## 3. 비교\n| 구분 | Container Registry | MLflow |\n|---|---|---|\n| 관리 단위 | 컨테이너 이미지(모델+환경) | 실험 Run, 모델 버전 |\n| 버전 표현 | 이미지 태그 (v1, prod, exp) | Registry 버전 번호 + Stage |\n| 강점 | 환경 재현, 즉시 복원, 서빙 플랫폼 연동 | 실험 추적·비교, 메타데이터 중앙화 |\n| 하지 않는 일 | 정확도에 따른 태그 자동 변경, 코드 수정 | 추론 API 서버 자동 생성, YAML 컴파일(KFP 역할) |\n\n> [!시험]\n> - MLflow 실험 추적 = 하이퍼파라미터·메트릭·아티팩트 기록·비교. \"추론 API 서버 자동 생성\", \"YAML 컴파일\", \"Notebook 자동 분석\"은 오답.\n> - MLflow 모델 로드 경로: REST API, CLI, Python SDK **모두 가능**.\n> - `registered_model_name` 지정 → Model Registry 등록. URI 형식 `models:/모델명/버전`.\n> - Container Registry 배포 순서와 재학습 시 v2 Push → image 교체, 롤백은 이전 태그.\n\n출처: AI&ML_2_CloudML_슬라이드별.md 슬라이드1~15\n"}, "3-8e": {"title": "AI Service (Simple AI Inference / Training)", "md": "## 한눈에 보기\n이 항목은 교재(Explore 슬라이드)에 없다. 아래 내용은 모두 **삼성SDS 서비스 소개 페이지(공식 페이지)** 기준이다.\n\n| 서비스 | 한 줄 정의 | 과금 |\n|---|---|---|\n| **Simple AI Inference** | 다양한 AI 파운데이션 모델을 API로 호출하는 **완전관리형(서버리스) AI 추론 서비스** | 실제 사용 **토큰 수** 기준 (Input, Cached, Output 토큰) |\n| **Simple AI Training** | 데이터와 학습 코드만 준비하면 인프라 구축 없이 대규모 모델을 학습하는 **완전관리형 AI 학습 서비스** (No-Ops 트레이닝) | On-demand / 약정 / Spot 요금제 |\n\n## 1. Simple AI Inference (공식 페이지)\n### 특징\n- **서버리스**: 인프라 구축 불필요, **동일한 API로 여러 모델** 호출, 최신 오픈소스 모델을 신청 후 바로 사용\n- **OpenAI API 호환** → 기존 개발 환경·프레임워크에 쉽게 연동\n- **안정적 운영**: **TPM**(분당 토큰 처리량) / **RPM**(분당 요청 수) 제한 기반 Traffic Control로 트래픽 급증 시에도 가용성 유지\n- **보안**: **Safety Guard** 기능, 고객 데이터는 **모델 학습에 사용되지 않음**, SCP 보안 환경 안에서 보호\n- **비용**: 사용한 토큰(Input, Cached, Output) 기준 종량 과금\n\n### 주요 기능\n| 기능 | 내용 |\n|---|---|\n| 모델 확인 | 모델 카탈로그에서 특징·활용 사례 확인, 콘솔에서 지원 오픈소스 모델 확인 |\n| 모델 신청·활용 | 신청한 모델은 **같은 Account 내 모든 사용자**가 사용. API로 즉시 호출 |\n| 엔드포인트 | **Public**(외부 접속용) / **Private**(SCP 자원 내부에서만 사용) |\n| 트래픽 제어 | TPM/RPM 기반 Traffic Control |\n| 보안 | Safety Guard, 고객 데이터 외부 모델 학습 미사용 |\n\n- 모델 계열: Llama 계열, 추론(reasoning) 모델, 보안 guard 모델\n- 사용 사례: 대화형 AI, 언어 번역, 텍스트/코드 생성, 텍스트/데이터 요약\n\n> [!주의]\n> - \"GPU 인스턴스 가동 시간 기준 시간 단위 과금\"은 오답 — 토큰 종량제다.\n> - 외부 인터넷 노출 없이 SCP 내부 애플리케이션에서만 호출하려면 **Private 엔드포인트**를 선택한다. Public 엔드포인트는 외부 접속용.\n> - 공식 페이지에 토큰 단가, TPM/RPM 구체 수치, 전체 모델 목록은 나와 있지 않다. 수치를 묻는 보기가 나오면 단정하지 말 것.\n\n## 2. Simple AI Training (공식 페이지)\n### 특징\n- **인프라 자동화**: 서버 생성, 드라이버 설치, 네트워크 설정 불필요. **학습이 끝나면 자원 자동 회수**\n- **간편한 실행**: CLI 대신 웹 콘솔에서 학습 스크립트, 데이터 스토리지, GPU 인스턴스를 지정해 바로 시작\n- **보안·안정성**: **Object Storage와 직접 연동**, 인프라 오류 자동 탐지·복구\n- **비용 효율**: 우선순위 낮은 작업은 Spot, GPU 확보가 필요하면 약정\n\n### 주요 기능\n| 분류 | 기능 | 내용 |\n|---|---|---|\n| 훈련 편의성 | 서버리스 환경 | 인프라 설정부터 결과 저장까지 자동화 |\n| | 분산 학습 | 대규모 모델·데이터셋을 여러 인스턴스에 자동 분산 |\n| | 커스텀 컨테이너(BYOC) | 사용자 Docker 이미지 사용 |\n| | **Warm Pool** | 연속 작업 시 인스턴스 재사용 → 프로비저닝 시간 단축 |\n| 가용성·보안 | **GPU Failover** | GPU 오류 시 자동 복구로 학습 중단 최소화 |\n| | **Checkpointing** | 중간 결과를 **Object Storage**에 저장, 체크포인트부터 재개 |\n| | 안전한 데이터 접근 | 외부 유출 없이 데이터 처리 |\n\n> [!주의]\n> 커스텀 컨테이너(BYOC)는 공식 페이지에 **'2026년 9월 제공 예정'** 으로 표기되어 있다. 제공 여부는 단정하지 말 것.\n\n### 요금제\n| 요금제 | 특징 | 적합한 작업 |\n|---|---|---|\n| On-demand | 필요할 때 서버를 선점해 안정적으로 학습 | 중단 없이 안정적인 학습 |\n| 약정 | GPU 우선 확보, 무약정보다 저렴 | GPU 확보가 중요한 장기 학습 |\n| **Spot** | **유휴 GPU** 활용으로 비용 절감, **중단·재개는 자동 관리** | **우선순위가 낮은** 학습 |\n\n> [!주의]\n> \"Spot은 중단 없이 실행을 보장하므로 우선순위 높은 장기 학습에 적합\"은 오답. Spot은 중단·재개가 발생할 수 있다.\n\n### 학습 워크플로우 (서비스 구성도 7단계)\n1. 데이터 준비 → 2. 학습 스크립트 준비 → 3. 학습 구성 → 4. 데이터 마운트 및 복사 → 5. 학습 시작 → 6. 학습 실행 → 7. 결과 저장\n- 사용자 도메인(데이터·스크립트)과 학습 인프라(Master Cluster, GPU 클러스터) 사이에서 데이터가 오간다.\n\n## 3. SCP AI/ML 서비스 선택 가이드\n| 요구사항 | 선택 |\n|---|---|\n| 인프라 관리 없이 API로 LLM 호출(챗봇, 요약 등) | Simple AI Inference |\n| SCP 내부에서만 LLM 호출(외부 노출 금지) | Simple AI Inference **Private 엔드포인트** |\n| 학습 스크립트·데이터만으로 대규모 모델 학습, GPU 클러스터 직접 구축 X | Simple AI Training |\n| Notebook 개발 → 파이프라인 → 하이퍼파라미터 튜닝 → 서빙까지 Kubernetes 위 자체 MLOps 운영 | AI&MLOps Platform |\n| 실험별 파라미터·메트릭 기록, 모델 버전 관리 | MLflow |\n| 모델 + 환경 이미지 저장·롤백 | Container Registry |\n\n> [!시험]\n> - Inference: 서버리스, OpenAI API 호환, TPM/RPM, Safety Guard, 고객 데이터 학습 미사용, Account 내 공유, Public/Private 엔드포인트, **토큰 종량제**.\n> - Training: 자원 자동 회수, Checkpointing(Object Storage), GPU Failover, Warm Pool, 분산 학습, On-demand/약정/**Spot(저우선순위)**.\n\n출처: 삼성SDS Simple AI Inference 서비스 소개 페이지(공식 페이지), 삼성SDS Simple AI Training 서비스 소개 페이지(공식 페이지), AI&ML_2_CloudML_슬라이드별.md 슬라이드4\n"}, "4-1a": {"title": "Backup", "md": "## 한눈에 보기\n**Backup**은 사용자의 데이터를 안전한 방식으로 백업하고 유사시에 복구하는 서비스다. Virtual Server와 Bare Metal Server를 대상으로 하며, 그 외 서비스(DBaaS, File Storage, Object Storage)는 각자의 **내장 기능**으로 데이터를 보호한다.\n\n| 대상 | 방식 | 단위 |\n|---|---|---|\n| Virtual Server | **Agentless Backup** (VM 스냅샷) | **VM Image(OS+Data)** |\n| Bare Metal Server | **Agent Backup** (대상 서버에 Agent 설치) | **Filesystem** |\n\n- Virtual Server 백업 유형: **Full Backup 및 Incremental Backup**\n\n## 1. 배경: 백업 정책 설계 (WA백서 03)\n- 백업 = 서버 고장, 정전, 지진 등 재해, 외부 공격·위변조로 인한 원본 손상·유실에 대비해 **안전한 별도 저장장치에 데이터를 복사**하는 것\n- **모범 사례**: 업무 중요도에 따라 백업 정책을 수립하고 백업 수행을 **자동화**한다.\n- 백업 주기는 손실 허용 기간(RPO)을 고려. 중요 데이터는 자주 자동 백업, 중요도 낮은 데이터는 낮은 빈도\n- 백업은 정기 일정 또는 데이터 세트 변경에 따라 자동 생성되도록 구성\n- RPO를 고려해 저장소를 선택하거나, 저장소의 백업 스케줄을 고려해 RPO를 검토할 수 있음\n\n### 백업 가능 시간 결정 요소\n| 요소 | 내용 |\n|---|---|\n| 업무 영향도 최소화 | **일 단위**: 업무 종료 ~ 다음 날 업무 개시 전 / **주 단위**: 주말 시간 활용 (백업 시 서버 부하가 업무에 영향 주지 않도록) |\n| 복구 시 유효성 | 배치 작업 **전/후** 어느 시점에 백업했는지에 따라 복구 시 추가 작업 여부와 완전 복구 소요시간이 달라짐 → 업무 특성 고려 |\n\n### 설계 원칙\n1. **Backup 서비스**로 Virtual Server를 백업한다.\n2. **Database 서비스의 내장 백업 기능**으로 DB를 백업한다.\n3. **스냅샷 및 버전 관리**를 활성화해 Storage 데이터를 보호한다.\n\n## 2. SCP 서비스별 백업 방식 (WA백서 03 표 3-8)\n| 대상 서비스 | 백업 기능 | 백업 방식 | 스케줄 | 보존 기간 | 백업본 저장소 |\n|---|---|---|---|---|---|\n| Virtual Server | Backup 서비스 | VM 스냅샷, 전체 또는 증분 | 일/주/월 | 2주~1년 | **SCP 관리 저장소** |\n| Bare Metal Server | Backup 서비스 | 파일 시스템 에이전트 백업 | 일/주/월 | 2주~1년 | SCP 관리 저장소 |\n| DBaaS | 내장 기능 | DB 기반 백업 | 데이터: 1일 / 아카이브: 5분~1시간 | **7일~35일** | **사용자 관리 Object Storage** |\n| File Storage | 내장 기능 | 스냅샷 | 일/주 | 자동 128개, 수동 800개 | File Storage 내부 |\n| Object Storage | 내장 기능 | **버전 관리** | 변경 발생 즉시 | 제약 없음 | 버킷 내부 |\n\n> [!주의]\n> Object Storage는 Backup 서비스에 등록해 백업하는 방식이 **아니다**. 객체가 변경될 때마다 이전 버전을 모두 저장하는 **버전 관리** 방식으로 보호한다. File Storage는 스냅샷과 디스크 백업 두 가지 방식을 쓴다고 WA백서 본문에 설명되어 있다(표에는 스냅샷만 기재).\n\n## 3. Backup 생성 (콘솔)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | 서버 선택 | Backup 대상 서버 선택 |\n| 2 | 보관기간 | 백업본 보관 기간. **Agentless Backup: 2주, 1개월, 3개월, 6개월, 1년** 중 선택 |\n| 3 | 스케줄 | 설정한 생성 주기에 따라 자동 백업본 생성. **Full Backup 1개, Incremental Backup 최대 6개** |\n\n- DR 옵션: Backup **생성 시에만** 활성화 가능 (아래 4-1b 및 WA백서 03 참조)\n\n## 4. 스케줄 관리\n경로: Backup > 상세정보 > 스케줄 > 스케줄수정 Popup\n1. 스케줄 조회: 현재 스케줄 확인\n2. 스케줄 수정: Full Backup 1개, Incremental Backup 최대 6개 설정 가능, **최소 1개의 Full Backup 스케줄 등록 필요**\n\n> [!주의]\n> 교재 슬라이드6·7은 \"Full Backup 1개\", 학습정리(슬라이드13)는 \"최소 Full Backup 1개\"로 표기한다. 시험에서는 \"Full 1개 + Incremental 최대 6개, Full은 최소 1개 필수\"로 기억한다.\n\n## 5. 복구\n- 생성된 Backup의 **복구 대상(백업본)** 으로 복구 수행 → **백업용 Virtual Server(예: vm01-backup)가 새롭게 생성**된다. 기존 서버에 덮어쓰는 방식이 아니다.\n\n| 순서 | 경로 | 내용 |\n|---|---|---|\n| 1 | Backup > 상세정보 > **복구대상** 탭 | 원하는 백업본의 **\"복구\"** 클릭 |\n| 2 | 복구 Popup – 복구 위치 | **대상 서버 또는 백업본 위치** 선택 |\n| 3 | 복구 Popup – 복구 서버명 | 신규 서버 생성. **Block Storage 유형, Keypair는 원본과 동일하게 설정됨** |\n\n> [!주의]\n> \"복구 팝업에서 Block Storage 유형과 Keypair를 새로 선택해야 한다\"는 오답. 원본과 동일하게 설정된다.\n\n### DB 백업 복구 (WA백서 03)\n- 백업본 저장소: 사용자가 **직접 Object Storage 버킷을 생성**해 지정\n- 데이터 백업 + 아카이브 백업을 모두 수행\n- 복구 시 **기존 서버에 직접 복구하지 않음** → 백업본으로 **새 DB 생성** → Master로 전환\n\n### File Storage 스냅샷 복구 (WA백서 03)\n- 서버에 Mount된 File Storage의 `/.snapshot` 경로에서 스냅샷 시점의 디렉토리·파일을 찾아 복구\n\n## 6. 백업 보호 및 암호화 (WA백서 03)\n- **모범 사례**: 백업 사본을 안전하게 관리해 데이터 보호와 무결성 보장\n- 온프레미스는 원격지에 사본 보관(소산), 클라우드는 **접근 제어, 암호화, 백업 DR**로 대비\n- 설계 원칙: ① Archive Storage, Multi-AZ, DR 구성으로 단일 지점/사이트 장애·재해에 따른 사본 손실 방지 ② 백업 저장소 접근 제어·암호화로 무결성 보장\n\n| 번호 | 조치 |\n|---|---|\n| ❶ | 백업본이 저장된 Object Storage 버킷을 **Archive Storage로 아카이빙**해 장기 보존 |\n| ❷ | Object Storage를 **Multi-AZ**에 배포해 가용영역 장애 대비 |\n| ❸ | **DR 복제**로 Region 재해 대비 |\n| ❹ | 접근 서버, IP 주소, 엔드포인트 지정으로 **접근 제어** |\n| ❺ | **버킷 암호화**로 무결성 보장 |\n\n> [!주의]\n> WA백서 03: \"Multi-AZ 및 Object Storage Region 간 Replication은 향후 출시 예정('26년)\". 또한 v2는 Single-AZ Region(KR-WEST1)만 제공한다고 명시(2025년 7월 기준).\n\n### 필수 보존 자료 예시 (표 3-9)\n| 조직 | 자료 | 보존 연한 | 근거 |\n|---|---|---|---|\n| 기업 | 상업 장부 및 영업 주요 서류 | 10년 | 상법 33조 |\n| 기업 | 전표 | 5년 | 상법 33조 |\n| 기업 | 근로자 명부 및 근로 계약 서류 | 3년 | 근로기준법 42, 91조 |\n| 기업 | 법인의 거래 장부 및 거래 서류 | 5년 | 국세기본법 85조 3 |\n| 기업 | 대리점 계약서 | 거래 종료 후 3년 | 대리점 거래 공정화에 관한 법률 5조 |\n| 기업 | 하도급 거래 관련 서류 | 거래 종료 후 3년 | 하도급 거래 공정화에 관한 법률 3조 |\n| 기업 | 산업안전 관련 서류 | 3년 | 산업안전보건법 |\n| 기업 | 개인정보 | 불필요 시 즉시 파기 | 개인정보보호법 21조 |\n| 공공기관 | 업무 관련 생산·접수한 모든 형태의 기록정보 자료와 행정박물 | 영구/준영구/30년/10년/5년/3년/1년 | 공공기록물 관리에 관한 법률 및 시행령 |\n| 의료기관 | 진료 기록부 / 수술 기록 | 10년 | 의료법 시행규칙 15조 |\n| 의료기관 | 환자명부, 방사선 사진, 검사 기록, 간호 기록 등 | 5년 | 의료법 시행규칙 15조 |\n| 의료기관 | 처방전 | 2년 | 의료법 시행규칙 15조 |\n\n## 7. 장애 시 복구 계획과 복구 테스트 (WA백서 03)\n### 장애 복구 절차 (표 3-10)\n| 단계 | 주요 활동 |\n|---|---|\n| 1 상황 평가 | 문제 식별(원인 파악), 영향 범위 파악 |\n| 2 복구 계획 실행 준비 | 복구 수행팀 소집, 복구 데이터 확인(백업 정책·도구·최근 사본), 복구 환경 준비(기존/신규 네트워크 결정) |\n| 3 복구 수행 | 클라우드 인프라 구성(VPC, 서브넷, Security Group, 스토리지), 선택한 백업 사본으로 복구 |\n| 4 테스트 및 검증 | 데이터 무결성·애플리케이션 기능·네트워크 연결 테스트, 실사용자 업무 가능 여부 확인 |\n| 5 정상화 보고 | 시스템 정상화, 복구 절차·결과 보고서, 문제 해결 방법·개선 사항 기록 |\n\n### 데이터 백업 복구 테스트\n- **모범 사례**: 정기적으로 복구를 테스트해 목표 RPO·RTO 충족 여부 검증\n- 설계 원칙: ① 원본과 복제본을 확인해 자동 백업 정상 수행·데이터 유효성 검증 ② 복구 테스트 환경 구성·복구 훈련 ③ 복구 실패 또는 RTO/RPO 미달 시 백업 검증 작업과 개선\n\n## 8. SLA와 가용성 목표별 복구 시간 (WA백서 01)\n### Backup의 SLA (표 1-4)\n| 서비스 | 장애 정의 | 월 가용률 | 장애 정의 기준 |\n|---|---|---|---|\n| **Backup** | **고객 요청 백업 실패 (재수행 성공 시 제외)** | [1 - (장애 건수의 합)/(서비스 이용 월 총 건수의 합)] × 100 | 회사의 사유로 해당 월에 발생한 장애 **건수**의 합 |\n| Virtual Server DR | DR Recovery Plan에서 모의 훈련 또는 재해 전환 완료 후 고객 서비스 접속 불가 또는 요청에 따른 전환이 이루어지지 않는 경우 | [1 - {장애 시간(분)합 / 서비스 이용 월 총 시간(분)의 합}] × 100 | 회사(SDS)의 사유로 해당 월 장애 시간의 합 |\n\n### 가용성 목표 99% (단일 구성) 복구 예상 시간 (표 1-6)\nWeb, App, DB 모두 단일 구성. **VM은 Backup으로**, **DB는 Database 서비스 백업 기능으로** 사본 저장. SLA 기준 허용 중단 시간 약 44분(월 730시간 기준 MTTR 43.8분).\n\n| 항목 | 테스트 항목 | 예상 시간 |\n|---|---|---|\n| 장애 탐지 | Cloud Monitoring Event 알림 설정 | 관리자 분석/대응시간 |\n| 장애 대응 | Backup에서 Virtual Server 복원, NAT IP 전환 | 최대 20분 |\n| 복원력 | 신규 Database 생성, Backup에서 Database 복구, 백업 이후 장애시점까지 데이터 변경분 반영 | 최대 60분 |\n| 부하 | Virtual Server 서버 타입 변경, Database 서버 타입 변경 | 작업 당 최대 15분 |\n\n- 단계별 복구 예상 시간은 **최대 90분**. Console 대신 **CLI 스크립트**와 테스트 환경을 활용하면 단축 가능. 가장 불확실한 구간은 **장애 발생 → 탐지 → 관리자 통지 → 복구 개시**까지의 시간.\n\n### 99.9% / 99.99% 아키텍처의 복원력 테스트\n| 목표 | 구성 | 복원력 테스트(백업 관련) |\n|---|---|---|\n| 99.9% (MTTR 약 44분) | Web/App 이중화 + LB, DB HA(Active-Standby) | Backup에서 VS 복원, 신규 DB 생성, Backup에서 DB 복구, 변경분 반영 — **최대 60분** |\n| 99.99% (MTTR 약 4분) | Multi-AZ, Auto-Scaling, DB Replica | 동일 항목 — **최대 60분** |\n\n- 이중화돼도 VM이나 DB가 **손실된 경우에는 여전히 데이터 복구 시간이 소요**된다.\n\n> [!시험]\n> - VS = Agentless(VM Image OS+Data), BM = Agent(Filesystem). 보관기간 2주/1개월/3개월/6개월/1년. Full 1개 + Incremental 최대 6개, Full 최소 1개.\n> - 복구 = 신규 서버 생성, Block Storage 유형·Keypair 원본과 동일. 복구대상 탭 → 복구 → 복구 위치 선택.\n> - DBaaS 백업: 사용자 Object Storage, 7~35일. Object Storage: 버전 관리. File Storage: 스냅샷(자동 128/수동 800).\n> - Backup SLA: 실패 **건수** 기준, 재수행 성공은 제외.\n> - DR 옵션은 기존 Backup에 추가 불가 → 새 Backup 생성.\n\n출처: SCP_v2_Explore_Storage_20-24.md Backup 슬라이드1~13, WA백서 03 p.9~17, WA백서 01 p.4~5·35~39\n"}, "4-1b": {"title": "클라우드 기반 DR 설계 및 구현", "md": "## 한눈에 보기\nDR 설계 흐름: **업무 영향 분석(BIA) → 복구 목표(RTO/RPO) 수립 → DR 수준(Cold/Warm/Hot) 결정 → 서비스별 Region 간 복제 → 재해 전환 계획 → 변경 관리 → 모의훈련**.\n\n> [!주의]\n> WA백서 03: \"2025년 7월 기준 SCP **v2는 Single-AZ Region(KR-WEST1)만** 제공. 이 문서의 DR 서비스는 **Region이 2개 이상**이어야 구현 가능하며, Region이 추가되면 구현될 수 있다.\" 또한 Region 간 VPC Peering, Object Storage Replication, DBaaS Replica/Replication, Container Registry DR은 **향후 출시 예정('26년)** 으로 표기되어 있다. 시험에서는 설계 개념으로 묻되, \"현재 v2에서 바로 구현 가능\"으로 단정하지 말 것.\n\n## 1. 가용성 vs 안정성, 장애 vs 재해\n- **가용성** 설계: 단일 구성요소 장애·부하 급증에 대비한 **사전** 이중화와 자동 Fail-Over\n- **안정성** 설계: 이미 발생한 장애·재해에 대한 **사후 대응**, 계획되지 않은 중단 시 데이터 손실 최소화와 신속 복구, 복원력(Resiliency) 확보\n\n| 구분 | 재해 | 장애 |\n|---|---|---|\n| 원인 발생 위치 | 정보기술기반 **외부** | 정보기술기반 **내부** |\n| 예방 및 통제 | **불가능** | **가능** |\n| 손상 규모 | 한 사이트 전체 | 사이트 내 부분적 |\n| 대응 조직 | 전사적 수준 | 정보 시스템 관리부서 수준 |\n| 복구 예상 소요시간 | 중·장기(수일 이상) | 단기(수시간) |\n\n- 장애: 인적 장애, 시스템 장애, 기반 구조 장애(운영·설비 장애 등)처럼 **통제 가능한** 요인에 의한 기능 저하·오류·고장\n- 재해: IT 외부의 예방·통제 어려운 사건으로 인한 중단 + **장애의 예상 복구 시간이 허용 범위를 초과**해 업무에 지장을 주는 피해 (TTA, 정보 시스템 재해 복구 지침)\n- **비상 상황**: 영향 범위가 넓고 신속 복구가 필요한 시스템의 장애가 허용 시간 내 복구가 어려워 재해로 이어질 가능성이 있는 상황\n- 장애 발생 시 먼저 **장애 등급**(주요 업무 영향 + 복구 긴급성)으로 경중 파악 → 등급별 복구 가능성·예상 복구 시간을 사전 추정 → 비상 상황 선언 여부 판단\n- 허용 시간 내 복구 불가 판단 시 **'재해' 선언** → 사전 수립된 재해 복구 계획 이행\n\n### 금융기관별 복구 시간 권고 (표 3-7, 금융감독원 / TTA 장애 관리 지침)\n| 기관 | 복구 시간 | 비고 |\n|---|---|---|\n| 은행 및 증권 | 3시간 이내 | |\n| 금융공동망 운영기관, 공인인증센터 | 3시간 이내 | 금융결제원, 증권전산 |\n| 증권유관기관, 통합시스템 운영기관 | 3시간 이내 | 증권거래소, 선물거래소, 코스닥 시장증권, 증권예탁원, 금고 연합회 |\n| 보험 | 24시간 이내 | 외국보험사 포함 |\n| 외국계 금융기관 | 자율 | 복구시간 공개, 비상사태대응방안 제출 |\n| 기타 금융기관 | 자율 | 비상사태대응방안 제출 |\n\n## 2. 업무 영향 분석 (BIA)\n주요 업무 프로세스의 중요도와 중단 시 손실을 평가해 **복구 우선순위와 대상 범위**를 설정한다.\n\n1. **업무 구조화**: 단위 업무를 그룹으로 묶어 상·하위 구조 분석\n2. **주요 업무 식별**: 자주 사용되는 업무를 대상으로 선정, 고객 핵심 서비스 직결 여부·전략적 중요도 고려\n3. **업무 연관성 분석**: 선후 관계(선행업무/후속업무) 또는 참조 관계. 연관도 표로 정리\n4. **재해 영향 평가**: 재해 유형(하드웨어 오류, 소프트웨어 오류, 사람의 실수, 자연적 재난, 화재, 네트워크 중단 등)별 손실·파급 기간 측정\n\n| 구분 | 영향 항목 | 파급 영향 예 |\n|---|---|---|\n| 정량적 – 재무적 | 수익 감소, 보상 비용 지출 | 000원 매출 감소 / 비용 발생 |\n| 정량적 – 업무 | 업무처리 지연(수작업) | 00시간 또는 00일 |\n| 정성적 – 유형 | 고객·매출 기회 상실, 자료 손상·유실 | 00 고객 감소 |\n| 정성적 – 무형 | 신뢰도 하락, 소송 | 가능성 파악 |\n\n5. **업무 중요도 우선순위 및 복구 범위 설정**: 영향 추정만으로 정한 순위(1순위 A1 / 2순위 B1, C1 / 3순위 A2, B2, C2)에 **업무 연관성을 반드시 반영**해야 한다. 예: A1 복구에 B1, B2가 먼저 필요 → 1순위 A1, B1, B2 / 2순위 C1 / 3순위 A2, C2\n\n## 3. 복구 목표: RTO와 RPO\n| 지표 | 정의 | 결정 요소 |\n|---|---|---|\n| **RTO**(Recovery Time Objective, 업무 중단 허용 시간) | 서비스 중단 시 복구까지 허용 가능한 **최대 시간** | 조직이 감당할 재정 부담 한계가 높을수록 RTO 단축 가능. 최상위 목표는 무중단(Near Zero) — 큰 비용·운영 부담 |\n| **RPO**(Recovery Point Objective, 업무 손실 허용 시점) | 복구 시 허용 가능한 **데이터 손실 범위** | 데이터 사본 저장 주기, 데이터 복제 구성 여부 |\n\n### 시스템별 RTO/RPO 도출: **최소값 원칙**\n시스템과 그 시스템이 처리하는 업무들의 RTO·RPO 중 **가장 작은 값**을 해당 시스템 목표로 삼는다.\n\n| 시스템 | 처리 업무 | 시스템 RTO | 시스템 RPO |\n|---|---|---|---|\n| D | A1, B2 | 1시간 | 실시간 |\n| E | B2 | 4시간 | 30분 |\n| F | A2 | 8시간 | 1시간 |\n| G | B1, C1, C2 | 4시간 | 1시간 |\n\n업무별 RTO: A1 1시간, A2 1일, B1 3일, B2 6시간, C1 2일, C2 1일 / 업무별 RPO: A1 실시간, A2 1일, B1 1일, B2 1시간, C1 1일, C2 1일\n- 예: F 시스템 RTO 8시간, A2 업무 RTO 1일 → **8시간**. RPO도 최소값 **1시간**.\n\n> [!팁]\n> 계산 문제: 시스템 자체 목표와 업무 목표들을 모두 모아 RTO 최솟값, RPO 최솟값을 **각각 따로** 고른다. (예: 시스템 RTO 6h/RPO 1h, 업무 P 4h/1일, 업무 Q 1일/30분 → RTO 4시간, RPO 30분)\n\n## 4. DR 수준 (표 3-11)\n| DR 수준 | RTO | RPO | 가용성(Main↔DR) | 복구 | 비용 | 대상 |\n|---|---|---|---|---|---|---|\n| **Cold** | 수주 | 수일 | Active-Backup | 자원할당 및 백업 복구 | 낮음 | 비중요 시스템 |\n| **Warm** | 수일 | 수 시간 | Active-Replica | 수동 Failover, 자원 할당 및 증설 | 중간 | 일반 시스템 |\n| **Hot** | 수 시간 | 0 | Active-Standby | 수동 Failover | 높음 | 중요 시스템 |\n\n- **Cold**: 핵심 서비스의 **백업 데이터만** DR 센터에 보관, 재해 시 신규 자원 할당·구성 후 복구. 비용 최저, 백업 주기만큼 데이터 손실 가능, 복구 시간 김\n- **Warm**: 중요도 높은 시스템 중심으로 DR 센터 구축, 실시간 복제가 아니라 **주기적 동기화**. 재해 시 나머지 자원 할당·증설 후 복구. Hot보다 저렴\n- **Hot**: **실시간 복제** 기반 Active-Standby. 재해 시 복제 중단 후 DR 센터로 전환\n\n### Cold Level 아키텍처 예 (kr-west1 주 센터 / kr-east1 DR 센터)\n1. 두 Region을 **VPC Peering**으로 연동\n2. DR 센터에 DR용 Virtual Server 생성 후 평상시 **전원 Off**\n3. 주 센터 VS 데이터를 Object Storage에 주기적 백업\n4. Object Storage **DR 동기화**로 DR 센터 Object Storage(DR)에 **Bucket 단위 비동기 복제**\n5. 재해 시 Object Storage(DR) 데이터로 복구해 서비스 재개\n\n### Hot Level 아키텍처 예\n1. 두 Region VPC Peering\n2. WEB/APP VS → **Virtual Server DR**로 DR 센터에 DR VS 생성. 재해·모의훈련 시 DR VS를 주 VS로 사용\n3. DBaaS → **타 Region Replica**로 비동기 복제, 재해 시 DR Replica를 **Master로 승격**\n4. File Storage → **DR 복제**로 DR 센터에 복제 볼륨. 복제 주기·동기화 정책 설정, 재해 시 **동기화 중단 후 복제 볼륨을 R/W 모드로 변경**\n5. Object Storage → DR 동기화로 Bucket 단위 비동기 복제, 재해 시 Bucket(DR)을 **End Point로 접근**\n\n> [!주의]\n> Cold 아키텍처: Region 간 VPC Peering, Object Storage Replication은 향후 출시 예정('26년). Hot 아키텍처: Region 간 VPC Peering, Object Storage Replication, DBaaS Replica는 향후 출시 예정('26년). (WA백서 03 p.19·21)\n\n## 5. 서비스별 Region 간 DR 수단\n| 서비스 | 구성 방법 | 핵심 포인트 | 상태 |\n|---|---|---|---|\n| **Virtual Server DR** | 다른 Region에 VS 및 연결된 Block Storage 복제, 계획 수립·테스트·실제 복구 기능 | 실제 복제 대상은 **Block Storage**, DR 사이트 VS는 **정지 상태** 유지 | 단일 리전 주의 |\n| **Backup DR** | **Backup 생성 시에만** 활성화 | 주 사이트 백업 수행 시 백업본이 DR 사이트에 복제. **기존 Backup에는 활성화 불가 → 새 Backup 생성** | 단일 리전 주의 |\n| **Object Storage DR** | 주/DR 버킷 간 동기화 설정 | 주 사이트 버킷에 **버전 관리 활성화 필수**, Bucket 단위 비동기 복제 | Region 간 Replication **'26년 출시 예정** |\n| **File Storage DR** | 주 사이트 File Storage에서 **DR Region, DR Volume명, 복제 주기** 설정 | 복제 주기: **5분, 1시간, 매일, 매주, 매월**. 매일 = **23:59:00**, 매주 = **일요일 23:59:00**, 매월 = **1일 23:59:00** | 단일 리전 주의 |\n| **Database 서비스 DR** | 주 사이트 마스터 DB의 **Replica를 DR 사이트에 생성** | 주/DR VPC 간 **Peering 수립 필수**, 재해 시 Replica를 **수동으로 Master 전환** | Region 간 DBaaS Replication **'26년 출시 예정** |\n| **Container Registry DR** | DR 레지스트리와 Object Storage 버킷을 다른 Region에 복제 | 이미지 복제로 동일 Kubernetes Cluster 구성 가능. **File Storage DR과 함께 구성 시 Kubernetes Cluster DR** | Region 간 Container Registry **'26년 출시 예정** |\n\n> [!주의]\n> File Storage DR '매일' 복제 시각은 00:00:00이 아니라 **23:59:00**이다.\n\n- 서버 백업 아키텍처(그림 3-6): Backup은 VS를 스냅샷해 이미지로 저장하며 **백업본을 원격지에 소산**할 수도 있고, 복구는 특정 시점 사본으로 **새 VS 생성**. BM은 Agent 설치로 File System 백업.\n- Virtual Server DR SLA(WA백서 01 표 1-4): DR Recovery Plan에서 모의 훈련 또는 재해 전환 완료 후 고객 서비스 접속 불가, 또는 요청에 따른 전환이 이뤄지지 않는 경우를 장애로 정의, 장애 **시간(분)** 기준 월 가용률.\n\n## 6. 재해 시 전환 계획 (표 3-12)\n서비스 정지 → 장애 등급·복구 가능 시간 판단 → 정의된 시간 내 복구 불가 시 **재해 선언** 후 절차 수행.\n\n| 단계 | 활동 | 구성원 임무 |\n|---|---|---|\n| 재해 선언 | 재해 현황 파악 | 대책본부 구성, 비상통지, 상황실 운영, 재해 현황 파악, 예상 복구시간 파악(주 센터), 최고책임자 보고자료 작성 |\n| 재해복구 활동 | 재해복구 시스템 전환 결정 | 예상 복구·복귀 시간 고려해 전환 결정, 전환 절차 통제 |\n| | 재해복구 센터로 서비스 전환 | 서비스 재가동 확인, DR 센터 장기 운영 대비 |\n| | 주 센터 복구 | H/W·S/W 공급업체 복구 촉구, 복구 불능 시 조달계획(선 조치 후 조달 품의), 전환 통제·최종 서비스 확인 보고, 대내외 보고, 주 센터 복구시기 산정·복구센터 운영방안 |\n| 주 센터 복구 | 주 센터로 복귀 결정 | 복귀 방안·시기 결정, 주 센터 안정화 검증, 복귀 서비스 전환 확인, 전환 후 문제점 파악, 복귀 절차 통제 |\n\n## 7. 서비스 변경 관리\n### 주 사이트와 DR 사이트 일관성 유지\n- **모범 사례**: 주/DR 사이트에서 동일한 변경 작업 수행. 주 사이트만 패치하면 DR 구성이 달라져 재해 시 오동작\n- 설계 원칙: ① 주 사이트에서 직접 변경하지 않고 **테스트/스테이징 환경**으로 먼저 검증 ② SW 업데이트·보안 패치·인프라 변경에 배포 환경 활용 후 주/DR 모두 반영 ③ **롤백 가능하게** 배포\n### 자동화를 통한 변경 관리\n- **모범 사례**: 업데이트·배포 자동화로 일관성 확보 (수동 작업은 변수 발생 → 주/DR 구성 차이)\n- 설계 원칙: ① 자동화 도구로 **인프라 템플릿** 관리·배포 ② 코드를 안전한 **중앙 저장소**에서 관리 ③ **CI/CD**로 개발~배포 관리\n\n## 8. 장애/재해 대응 테스트 (모의훈련)\n- **모범 사례**: 주기적으로 장애·재해 시나리오를 가동해 DR 시스템 테스트\n- 점검 사항: DR 시스템 데이터 정상 복구 유무, 복구팀 지휘·조정 체계, 내/외부 의사소통, DR 시스템 성능, 주 센터 복귀 유효성, 통지 절차 및 기타\n- 설계 원칙: ① 팀이 수행할 작업을 **실제 수행**해 대응 능력 향상·개선 도출 ② 전환 계획에 따라 전환 절차 수행, 자동 전환 절차 정상 작동 점검\n- 훈련 계획에는 일정, 조직·참여 인원, 범위·시나리오를 **시스템 명령어 수준까지** 상세히, 업무별 체크리스트·담당자·비상연락망 명시\n\n### 재해복구 모의훈련 절차 (표 3-13, TTA)\n| 순서 | 훈련방법 | 수행 내용 | 주관 |\n|---|---|---|---|\n| 1 | 사전준비 | 업무영향도 파악, 일정·방법 협의, 상세 작업계획 작성·승인, DR 시스템 점검·미진 사항 조치 | 관련 실무 담당자 |\n| 2 | 재해선언 | 재해선포 및 통보(주 센터, DR 센터) | 비상대책반 |\n| 3 | DR 시스템 가동 | DB, Server, APP, N/W 포함 가동 | 시스템·네트워크·업무담당 |\n| 4 | 업무 테스트 | 자체 테스트, 정상유무 판단 | 업무담당 |\n| 5 | DR 시스템 실업무 전환 | **모의전환 훈련 시에는 실 업무 전환 안 함** | 시스템·네트워크·업무담당 |\n| 6 | 정상여부 모니터링 | DR 센터 업무 수행 여부 모니터링 | 〃 |\n| 7 | DR 시스템 중단 | DR 시스템 가동중지 | 〃 |\n| 8 | 업무 복귀 | 주 센터 복귀 작업 | 〃 |\n| 9 | 결과 정리 | 일정·절차·결과 정리, 미진 사항 조치 | 관련 실무 담당자 |\n\n> [!팁]\n> (일반 개념) 재해 시 사용자 트래픽을 DR 사이트로 돌리는 수단으로 GSLB 같은 DNS 기반 전환을 함께 설계한다. RPO가 짧으면 하루 1회 Full 백업만으로는 부족하므로 지속 복제나 짧은 주기 백업이 필요하다.\n\n> [!시험]\n> - 재해 = 외부·통제 불가·사이트 전체·전사·수일 이상 / 장애 = 내부·통제 가능·부분·부서·수시간.\n> - RTO/RPO는 시스템과 업무 값 중 **최소값**. BIA 우선순위엔 **업무 연관성 반영** 필수.\n> - Cold(수주/수일, Active-Backup) / Warm(수일/수시간, Active-Replica) / Hot(수시간/0, Active-Standby).\n> - VS DR: Block Storage 복제, DR VS 정지. Backup DR: 생성 시에만. Object Storage DR: 버전 관리 필수. File Storage DR: 5분/1시간/매일/매주/매월, 23:59:00. DB DR: VPC Peering + 수동 Master 전환.\n> - 모의전환 훈련은 실 업무를 전환하지 않는다. 금융: 은행·증권 3시간, 보험 24시간.\n> - v2는 Single-AZ 단일 Region, 다수 Region 간 기능은 '26년 출시 예정.\n\n출처: WA백서 03 p.1~29, WA백서 01 p.4~5, SCP_v2_Explore_Storage_20-24.md Backup 슬라이드5·9\n"}, "3-2a": {"title": "Virtual Server", "md": "## 한눈에 보기\n- Virtual Server = CPU·메모리 등 인프라 자원을 개별 구매 없이 **필요한 시점에 필요한 만큼** 할당받아 쓰는 가상화 컴퓨팅 서비스\n- 구조: **VPC > Subnet > Server Group > Virtual Server**\n- 구성요소 5가지: **Image, Keypair, Server Group, OS 이미지 제공 버전, 서버 타입**\n- 생성 절차: Key Pair 생성 → Server Group 생성 → Public IP 예약 → Virtual Server 생성 → Image 생성 → Firewall·Security Group 설정\n- 시험에 잘 나오는 수치: 동시 생성 **1~100대**, Security Group **최대 5개**, 포트 **총 5개**, 1 Unit=**8GB**·최대 **1,536 Unit**, 서버 타입 변경은 **상위로만**\n\n## 배경: 클라우드 컴퓨팅 개요 (SCP Compute Service 과정)\n### 컴퓨팅 설계 시 자주 하는 질문\n- 갑자기 늘어나는 서비스 부하를 어떻게 감당할까? → Auto-Scaling(3-2c, 3-2d)\n- 워크로드에 가장 적합한 서버는 어떻게 고를까? → 서버 타입·서비스 선택\n- 낮은 네트워크 지연을 요구해 클라우드 Virtual Server로 안 되면? → Bare Metal(3-2b), Edge Server(3-2h)\n\n### 클라우드 컴퓨팅의 특징\n| 특징 | 내용 |\n|---|---|\n| 확장성(Scalability) | 자동확장(자원 자동 확장/축소), 탄력성(특정 이벤트 등 상황에 맞게 리소스 조정) |\n| 가용성(Availability) | 고가용성 아키텍처(여러 지역에 분산 구성), 재해 복구(자연재해·장애 시 빠른 복구) |\n| 민첩성(Agility) | 한 호스트에서 다른 호스트로 OS 이동 가능, IaC·CI/CD와 결합해 빠르게 구성 |\n| 비용 효율성(Cost Efficiency) | 사용량 기반 과금(쓴 만큼만 지불), 미사용 자원에 대한 불필요한 지출 없음 |\n\n### IaaS와 클라우드 배포 모델\n- On-premise: Application ~ Network(Application, Data, Runtime, Middleware, OS, Virtualization, Server, Storage, Network) 전부 기업이 관리\n- IaaS: **Application, Data, Runtime, Middleware, OS**는 기업 관리, **Virtualization, Server, Storage, Network**는 클라우드 제공업체가 서비스로 제공\n- 배포 모델\n\n| 모델 | 정의 |\n|---|---|\n| Public Cloud | 클라우드 사업자가 인프라를 소유·운영하며 여러 기업이 사용 |\n| Private Cloud | 기업이 전용으로 직접 클라우드 환경을 구축해 사용 |\n| On-premise | 서버에 직접 OS 및 소프트웨어를 설치해 구성 |\n| Hybrid Cloud | 위 모델을 결합(상세는 3-2h) |\n\n### SCP v2 Compute Service 구성\n| 서비스 | 설명 | 강의 |\n|---|---|---|\n| Virtual Server | 클라우드 컴퓨팅에 최적화된 가상 서버 | 3-2a |\n| Virtual Server Auto-Scaling | 수요에 따라 자원을 자동 확장/축소 | 3-2c, 3-2d |\n| Bare Metal Server | 가상화하지 않고 사용하는 고성능 물리 서버 | 3-2b |\n| GPU Server(Accelerated Server) | 클라우드 컴퓨팅에 최적화된 GPU 가상 서버 | 3-2f |\n| Multi-Node GPU Cluster | 대규모 고성능 AI 연산을 위한 다량의 GPU 제공 | 3-2f |\n| Block Storage(VM) | 블록 단위로 데이터를 저장하는 고성능 스토리지 | 3-2a 요약, 3-4a |\n| Cloud Functions | 서버리스 환경에서 애플리케이션 코드 실행 | 3-2e |\n| Edge Server | 기업 On-Site에서 Edge Computing 환경 제공 | 3-2h |\n| Virtual Server DR | 다른 Region으로 VS·Block Storage 복제 | 3-2g |\n\n학습정리 문구: \"국내 최고의 안정성을 기반으로 사용 목적에 따라 최적의 컴퓨팅 자원을 편리하고 탄력적으로 제공\"\n\n> [!주의]\n> 교재(SCP Compute Service 슬라이드9)는 Virtual Server DR의 설명칸에도 Edge Server와 같은 \"기업 On-Site에서 Edge Computing 환경을 제공하는 서비스\"를 적어 두었다. 슬라이드 편집 오류로 보인다. Virtual Server DR의 정의는 WA백서 03 p.22를 따른다(3-2g 참고).\n\n### v2에서 달라진 Compute Service\n| 서비스 | v2 변경점 |\n|---|---|\n| Virtual Server | 동일 리전 내 **다른 Account로 Image 공유** 가능, 이미지 **빌드 버전** 제공 등 UI 개선, **Job Scheduling 미제공** → 필요하면 **CLI나 API로 자동 Start/Stop** 구성 |\n| Bare Metal Server | **Security Group 미제공** → Firewall로 구성해야 함 |\n| GPU Server | **A100, H100, B300** 제공, 컴퓨트 메모리는 조금씩 줄었음(**GPU 메모리는 동일**) |\n| Virtual Server DR | **마켓플레이스에서 제공하는 서비스**를 이용하는 방식으로 변경 |\n\nUI도 사용성이 크게 개선되고 직관적으로 바뀌었다.\n\n### 컴퓨팅 설계 시 핵심 고려사항: 비용 최적화 전략\n사용 목적, 데이터 흐름, 사용 패턴, 아키텍처 전반을 분석해 설계한다.\n1. **적절한 리소스 규모 설계**: 과다할당·비효율 구조로 불필요한 리소스가 생기지 않게 하고, 정기적으로 사용 현황을 점검해 불필요한 자원은 종료·삭제 검토\n2. **Auto-Scaling 및 로드 밸런싱 도입**: 사용량 변동에 따라 리소스가 자동 증감\n3. **효율적인 요금제 선택**: 약정 요금제·대용량 할인 활용, 리전별 가격 차이와 워크로드·네트워크 트래픽을 고려한 인스턴스 타입 선택\n4. **컨테이너 혹은 서버리스 도입**: 컨테이너는 **지속적이고 예측 가능한** 사용량일 때 서버리스보다 비용 효율적, 서버리스는 **간헐적이고 변수가 많을 때** 자원 유지 비용이 없어 효율적\n5. **트래픽을 고려한 설계**: 하이브리드·멀티 클라우드 설계 시 인터넷 트래픽 비용과 데이터 전송 비용 고려\n\n하이브리드 클라우드 구성 시 고려사항(데이터 중력, 보안·거버넌스, 버스팅 등)은 3-2h에서 다룬다.\n\n## Virtual Server 개념\n### 정의와 제공 기능\n| 영역 | 기능 |\n|---|---|\n| 생성/관리 | vCore/Memory 조합으로 **일반(Standard)과 대용량(High Capacity)** 타입 제공, 다양한 OS 유형과 표준 이미지 제공, **Key Pair** 기반의 안전한 OS 접속 |\n| 스토리지 및 네트워크 연결 | OS 디스크 외 추가 연결 스토리지(File/Object/Block Storage) 제공, Subnet/IP 설정과 NAT IP 사용/해지 설정, 하나의 자원에 **Security Group 복수 설정(최대 5개)** |\n| 편리한 서비스 관리 | **Image 생성 및 Account 간 공유**, **Server Group**으로 근접/분산 배치 |\n\n주변 연계 서비스: Cloud Monitoring, Logging & Audit, Backup, Internet Gateway, Firewall\n\n### 구조와 구성요소\n- 구조: **VPC > Subnet > Server Group > Virtual Server** (예: WEB Subnet에 WEB 서버 그룹, WAS Subnet에 WAS 서버 그룹, 서버마다 Security Group)\n\n| 구성요소 | 설명 |\n|---|---|\n| Image | Custom Image를 생성·관리할 수 있고 **Account 간 공유** 기능 제공 |\n| Keypair | ID/Password가 아니라 **Key Pair 방식**으로 안전하게 OS 접속 |\n| Server Group | 랙(Rack)·호스트에 **근접 또는 분산 배치** |\n| OS 이미지 | **RHEL, Ubuntu, Alma Linux, Rocky Linux, Windows, Oracle Linux** |\n| 서버 타입 | Standard **s1v1m2** ~ High Capacity **h2v128m1536** |\n\n### 서버 타입 표기\n`s1v2m4` 처럼 표기한다: s/h=타입(Standard/High Capacity), 숫자=세대, v=vCPU 수, m=메모리(GB). 세대 표기 `1`은 교재에 \"Intel 3세대(Ice Lake) / Intel 4세대(Sapphire Rapids)\"로 적혀 있다.\n\n| 구분 | Standard | High Capacity |\n|---|---|---|\n| 성격 | 표준 사양 vCPU·Memory | Standard 이상의 대용량 |\n| 최대 vCPU | **16** | **128** |\n| 최대 메모리 | **256GB** | **1,536GB** |\n| 최대 네트워킹 | **12.5Gbps** | **25Gbps** |\n\nWA백서 04 p.14~15 보충(사이징·jOPS 계산은 2-1e 참고)\n| 타입 | vCore | Memory | 최대 NW | CPU |\n|---|---|---|---|---|\n| Standard | 1/2/4/6/8/10 | 2~160GB | 10Gbps | Intel Ice Lake |\n| Standard | 12/14/16 | 24~256GB | 12.5Gbps | Intel Ice Lake |\n| High Capacity | 24/32/48/64/72/96/128 | 48~1,536GB | 25Gbps | Intel Sapphire Rapids |\n- Standard 최소 1vCore/2GB, 2~16vCore는 CPU:Memory **1:2, 1:4, 1:8, 1:16**\n- High Capacity 24~128vCore는 **1:2, 1:4, 1:8, 1:12**\n\n> [!주의]\n> 세대·CPU 표기가 자료마다 다르다. 교재(Virtual Server 슬라이드7)는 \"1 : Intel 3세대(Ice Lake), Intel 4세대(Sapphire Rapids)\"로, WA백서 04 p.15는 \"Standard는 Ice Lake, High Capacity는 Sapphire Rapids\"로 적었다. 최대값(16vCPU/256GB, 128vCPU/1,536GB)은 두 자료가 같다.\n\n## Virtual Server 생성\n### 생성 절차 (Bastion 서버 생성·접속 시나리오)\n- 사전 작업: **VPC 환경 구성**(VPC, Subnet, Internet Gateway), **접속 보안 구성**(Firewall, Security Group)\n1. Key Pair 생성\n2. Server Group 생성\n3. Public IP 예약\n4. Virtual Server 생성\n5. Image 생성\n6. Firewall, Security Group 설정\n\n### Keypair 생성 (Virtual Server > Keypair)\n- 입력: Keypair 명, Keypair 유형 확인(SSH, 원격 호스트 접속용 보안 프로토콜)\n- 생성하면 웹에서 **바로 자동 다운로드**(`Keypair명.pem`)\n- **최초 1회만** 다운로드되므로 파일을 반드시 보관(WA백서 02도 \"생성 시 한 번만 다운로드\" 명시)\n\n### Server Group 생성 (Virtual Server > Server Group)\n| 정책 | 배치 방식 | 목적 |\n|---|---|---|\n| **Affinity**(근접 배치) | 같은 Server Group 서버를 가급적 **같은 랙·호스트**에 근접 배치 | **통신 지연 최소화 → 고성능** |\n| **Anti-Affinity**(분산 배치) | 가급적 **다른 랙·호스트**에 분산 배치 | 물리 호스트 하나의 장애가 전체 서비스 장애로 번지는 것을 막아 **가용성 확보** |\n- Server Group은 VS 생성 화면에서 선택하므로 **미리 만들어 둔다**.\n- WA백서 01 p.29 설계 원칙: \"서버 그룹의 **Anti-Affinity**를 적용해 Virtual Server가 호스트 장애로 서비스가 중단되는 것을 방지\"\n\n### Public IP 예약 (VPC > Public IP)\n- 업링크 연결 타입으로 **Internet Gateway** 선택 시 Public IP 대역의 IP 자동 할당\n- **유료** 기능\n\n### Virtual Server 생성 화면 항목\n| 순서 | 항목 | 내용·제약 |\n|---|---|---|\n| 1 | Image 및 버전 | 표준 기본 제공 Image에서 선택, 버전은 Documentation 확인, **버전 옆에 빌드 날짜** 표시 |\n| 2 | 서버 수 | 동시에 생성할 수량 **1~100개** |\n| 3 | 서비스 유형 | 서버 타입(vCPU·Memory 수로 결정), **Planned Compute**(약정, VS는 **1년·3년**). Financial Management > Planned Compute에서 신청(링크 이동 가능), **적용 후 환불 불가, 해지 시 수수료** |\n| 4 | Block Storage 기본 OS 영역 | **SSD / SSD_KMS / SSD_Provisioned** 중 선택. 용량은 **Unit** 단위(**1 Unit=8GB, 최대 1,536 Unit**), OS 종류별 최소 용량 다름. **Delete on termination**: 서버 해지 시 볼륨도 함께 해지·삭제 |\n| 5 | Block Storage 추가 | OS 영역 외 추가. **SSD / SSD_KMS / SSD_Provisioned / SSD_MultiAttach** 중 선택 |\n| 6 | Server Group | 미리 만든 Server Group 선택 |\n| 7 | 서버명 | 2대 이상이면 **Prefix**로 바뀌고 `사용자 입력 + -#` 형태로 생성 |\n| 8 | 포트 | 신규 포트 생성 또는 기존 포트 지정 |\n| 9 | 네트워크 | VPC, 일반 Subnet, NAT 사용 여부, 로컬 Subnet 사용 여부. IP는 **자동 생성 또는 직접 입력**. 일반/로컬 Subnet 합쳐 **포트 총 5개**까지 |\n| 10 | Security Group | 설정하지 않으면 **모든 접속 차단**, 접속하려면 SG 설정 필요, **최대 5개** |\n| 11 | Keypair | 미리 만든 Keypair 선택(OS 기본 계정은 아래 표) |\n| 12 | Lock | 사용 시 **해지/시작/중지** 등 동작을 실행할 수 없어 실수 방지 |\n| 13 | Init script | **Windows: 배치 스크립트**, **Linux: 쉘 스크립트, Cloud-init** |\n\n디스크 유형 요약\n| 유형 | 특징 |\n|---|---|\n| SSD | 기본 |\n| SSD_KMS | 인스턴스↔볼륨 구간 **전송 암호화**, **최초 생성 시에만 적용, 변경 불가**, 성능 저하 가능 |\n| SSD_Provisioned | **IOPS, Throughput** 설정 가능 |\n| SSD_MultiAttach | **2개 이상의 서버**에 연결 가능(추가 볼륨에서만 선택) |\n\n## 생성 후 설정 변경과 운영\n### 설정 변경 (상세 화면)\n| 항목 | 규칙 |\n|---|---|\n| 서버 타입 변경 | **현재보다 상위 타입으로만** 변경 가능 |\n| ServiceWatch 세부 모니터링 | 기본 모니터링은 무료, **세부 모니터링 활성화 시 추가 요금** |\n| IP 변경 | 변경하면 **기존 IP로 더 이상 통신 불가**, 적용을 위해 **서버가 재부팅**됨. **LB 서버 그룹** 멤버면 LB 서버 그룹에서 기존 IP를 삭제하고 새 IP를 멤버로 **직접 추가**. **Public/Private NAT IP** 사용 중이면 **NAT IP 해제 → IP 변경 → NAT IP 재설정** |\n| Block Storage 추가 | 이미 만든 Block Storage를 연결 |\n\n### 운영 및 모니터링\n| 기능 | 내용 |\n|---|---|\n| 서버 가동 제어 | 콘솔에서 **시작, 중지, 재시작** |\n| Image 생성 | 가동 중인 VS에서 가능하나 **Active 상태면 무결성 보장 불가** |\n| 콘솔 로그 | 서버 콘솔 로그를 바로 확인 |\n| Dump 생성 | Dump 파일 생성, 파일은 **Virtual Server 안에** 생성 |\n| Rebuild | **OS 영역의 데이터와 설정을 삭제**하고 새 서버로 재구성 |\n| 모니터링 탭 | 바로 볼 수 있는 대시보드 제공 |\n\n## Image\n### Image를 만드는 세 가지 경로\n| 경로 | 결과 | 포인트 |\n|---|---|---|\n| VS 상세 > 이미지 생성 | Visibility **Private** 이미지 | Active 상태에서도 생성 가능하나 무결성 보장 불가. Private이라 그대로는 **다른 Account로 공유 불가** |\n| VS 상세 > **공유용 Image 생성** | 공유용 이미지 | **Private 이미지에서만** 버튼 활성화, **OS 디스크만 포함** |\n| Compute > Virtual Server > Image > 생성 | 업로드 이미지 | Object Storage에 올린 파일의 **URL** 입력(**.qcow2만** 가능), URL은 Object Storage 상세에서 복사, 버킷은 **생성할 서버와 동일한 존(Zone)**에 있어야 함 |\n\nImage 메뉴 생성 시 입력값\n- 이미지명, 이미지 파일 URL, **OS 타입·최소 디스크·최소 RAM**\n- **Visibility**: Private = Account 내에서만 사용 / Shared = Account 간 공유\n- **Protected**: 체크하면 **이미지 삭제 불가**\n\n### 다른 Account로 공유하는 절차\n1. 공유용 Image 생성(OS 디스크만 포함)\n2. 이미지에서 **다른 Account로 공유** 실행(**Shared** 이미지에서만 활성화)\n3. 공유받을 **Account ID** 입력: 받는 쪽 **Cost Management > Account** 메뉴에서 확인\n4. **Image 목록 > 더보기(점 3개) > Image 공유 요청 목록**에서 확인\n- 공유 범위: **동일 리전 내** 다른 Account(v2 신규)\n\n### Custom Image로 서버 생성\n- VS 생성 화면에서 Custom 이미지를 골라 생성\n- WA백서 01 p.24: Image로 만든 서버를 Load Balancer에 등록해 **수평 확장(Scale-out)**, 서버 삭제로 **수평 축소(Scale-in)**, 서버 타입을 높여 **수직 확장(Scale-up)**\n\n## Virtual Server 접속\n### Internet Gateway Firewall 규칙 (Networking > Firewall > 상세 > 규칙 탭)\n| 항목 | 값 |\n|---|---|\n| 출발지 | 접속할 **클라이언트 IP** |\n| 목적지 | Virtual Server의 **Private IP**(공인 NAT IP 아님) |\n| 유형·프로토콜·포트 | TCP, SSH(22) 선택 후 추가 |\n| 동작 | **Allow** |\n| 방향 | VPC로 들어오는 트래픽이므로 **Inbound** |\n\n### Security Group 규칙 (Networking > Security Group > 상세 > 규칙 탭)\n- 방향 **Inbound** → 유형 **SSH**(TCP 22 자동 선택) → 원격 타입 **CIDR** → 대상 주소에 클라이언트 IP\n\n### Keypair로 접속 (PuTTY)\n1. PuTTY Key Generator에서 Load → 파일 형식을 **All Files(*.*)**로 바꿔 pem 선택 → **Save Private key**로 **ppk** 저장\n2. PuTTY Configuration의 **Connection > SSH > Auth > Credentials**에 ppk 지정\n3. Host Name에 **NAT IP**(또는 hosts 파일에 등록한 호스트명) 입력\n\nOS별 기본 접속 계정\n| OS | 계정 |\n|---|---|\n| Alma Linux | `almalinux` |\n| RHEL | `cloud-user` |\n| Oracle Linux | `cloud-user` |\n| Rocky Linux | `rocky` |\n| Ubuntu | `ubuntu` |\n| Windows | `sysadmin` |\n\n## Block Storage(VM): Virtual Server 관점 요약 (상세는 3-4a)\n| 항목 | 내용 |\n|---|---|\n| 정의 | 일정 크기와 배열로 정렬된 블록 단위에 데이터를 저장하는 고성능 스토리지 |\n| 용량 | **8GB ~ 최대 12TB**, **사용 중 증설 가능**, OS 기본 볼륨은 이미지별 최소 용량 이상 |\n| Multi Attach | 2개 이상 서버 연결, **Virtual Server는 최대 26개 볼륨**. **Windows VS는 MultiAttach 사용 불가** |\n| 암호화 | 모든 디스크 유형에 **AES-256**, KMS 디스크는 인스턴스↔볼륨 구간 전송 암호화 |\n| 볼륨 이전 | 다른 Account로 이전(이전하면 기존 위치에서 제거) |\n| 스냅샷 | 특정 시점 이미지 백업본, 즉시 생성 |\n- 생성: Virtual Server > Block Storage에서 볼륨 이름 → 스냅샷 선택(없으면 빈 볼륨) → 디스크 유형 → 용량(Unit, 1 Unit=8GB)\n- 연결: Block Storage 상세에서 **연결 서버 추가** 후 OS 후속 작업\n  - Linux: 디스크 확인 → 파티션 생성·포맷 → 볼륨 Mount\n  - Windows: 디스크 확인 → online 변경·초기화 → 파티션 포맷 → 볼륨 확인\n- 복구 두 가지: **스냅샷 복구**(Available 최신 스냅샷으로 기존 볼륨 복구, 모든 연결 서버에서 unmount 후 진행) / **복구 볼륨 생성**(목록에서 선택해 **신규 볼륨**으로, remount 후 사용)\n- 볼륨 이전: 서버 연결 해제해야 버튼 활성화 → 볼륨이전ID·승인 Key 전달(확인 시 Credential이 txt로 자동 다운로드) → 상대 Account에서 목록 더보기 > **볼륨 이전 받기**, 받기가 끝나야 원 Account에서 제거\n\n## 가용성·과금 관점 (WA백서)\n- WA백서 01 p.29: VS는 **Load Balancer와 함께 중복 배치**, 가능하면 Auto-Scaling으로 자동 중복 구성, Server Group **Anti-Affinity** 적용, Multi-AZ 배포\n- WA백서 01 p.35 최대 월 가용률\n\n| 구성 | 최대 월 가용률 | 정지 시간 |\n|---|---|---|\n| Virtual Server(단일) | 99.9% | 43.8분 |\n| Virtual Server(이중화) | 99.99% | 4.3분 |\n- SLA 장애 정의(WA백서 01 p.4~5): VS·Bare Metal 등 **공통** 서비스는 \"가동 중인 인스턴스 또는 개별 서비스가 모두 외부 연결 및 접속을 확보하지 못하는 경우\"\n- 과금(WA백서 06 p.4): Virtual Server는 **Provisioning / Per Hour**\n- 요금제(WA백서 06 p.5~6): **Cost Savings**(1·3년 시간당 사용 금액 약정), **Planned Compute**(1·3년 **인스턴스 타입** 약정). 상시 가동 VS는 약정, 비정기 가동 VS는 Cost Savings 예시\n\n## 시험 포인트\n> [!시험]\n> - Affinity=근접 배치(고성능·저지연), Anti-Affinity=분산 배치(가용성). 둘을 바꿔 묻는 문제가 나온다.\n> - Keypair는 생성 즉시 .pem으로 자동 다운로드되고 최초 1회만 받을 수 있다.\n> - 서버 타입은 상위로만 변경할 수 있다. 하위 변경이 가능하다는 보기는 틀린 보기다.\n> - IP 변경 시 재부팅된다. LB 멤버 IP는 직접 교체하고, NAT IP는 해제 → 변경 → 재설정 순서다.\n> - 공유용 Image는 OS 디스크만 포함한다. VS 상세에서 만든 Image는 Private이라 그대로는 공유할 수 없다. 업로드 이미지는 qcow2만 받는다. Protected를 체크하면 삭제할 수 없다.\n> - OS 계정: Ubuntu=ubuntu, RHEL·Oracle=cloud-user, Rocky=rocky, Alma=almalinux, Windows=sysadmin\n> - Firewall 목적지는 VS의 Private IP(NAT IP 아님), PuTTY 접속 Host는 NAT IP다.\n> - SG 미설정이면 전부 차단, SG 최대 5개, 포트 총 5개, 동시 생성 1~100대, Lock은 해지·시작·중지를 막는다.\n> - v2 VS는 Job Scheduling을 제공하지 않으므로 자동 Start/Stop은 CLI·API로 구성한다.\n\n출처: SCP_v2_Explore_Compute_11-19.md SCP Compute Service 슬라이드1~16, Virtual Server 슬라이드1~29, BlockStorage VM 슬라이드1~14, WA백서 01 p.4~5·24·29·35, WA백서 02 p.36, WA백서 04 p.14~15, WA백서 06 p.4~6\n"}, "3-2b": {"title": "Bare Metal Server", "md": "## 한눈에 보기\n- Bare Metal Server = **가상화 기술을 사용하지 않고** 물리적으로 분리된 CPU·메모리 등 컴퓨팅 자원을 **단독으로** 할당받아 쓰는 고성능 클라우드 컴퓨팅 서비스\n- 웹 Console로 자동 프로비저닝부터 자원관리, 비용관리까지 가능\n- 가장 큰 차이: **Security Group 미제공** → 트래픽 제어는 **전용 VPC + Firewall**\n- 핵심 수치: 동시 생성 **1~5대**, 파티션 **최대 10개**, Placement Group **1개당 2대**, Hyper Threading **생성 후 변경 불가**\n\n## 개념\n### 제공 기능\n| 영역 | 기능 |\n|---|---|\n| 생성/관리 | 웹 Console로 자동 프로비저닝·자원관리·비용관리, 다양한 서버 타입/OS 이미지 |\n| Storage·네트워크 | Block Storage, File Storage, Object Storage를 **추가 스토리지**로 연결, 일반 서브넷/IP 설정과 NAT IP 사용/해지, **로컬 서브넷 연결**도 제공 |\n| 편리한 관리 | **Agent 방식 Cloud Monitoring**(사용자 직접 설치), **Filesystem 백업/복구를 Backup 서비스로** 제공, **Placement Group**으로 랙 단위 분산 배치(존별 제공 여부 상이, **최초 생성 시에만** 적용) |\n\nWA백서 03 p.11: Bare Metal Server는 대상 서버에 **Agent를 설치**하는 방식으로 File System 백업을 구성·수행한다.\n\n### 전용 VPC Firewall 구성 (VPC 분리 권고)\nBare Metal Server는 Security Group이 없으므로, Bare Metal Server와 Virtual Server 간 트래픽 제어를 위해 **Bare Metal용 VPC를 분리**하고 그 VPC에 Firewall을 둔다.\n1. **전용 VPC 생성**(VPC1: Bare Metal Server)\n2. **Transit Gateway 생성**\n3. **Transit Gateway ↔ Virtual Server VPC 연결 추가**(VPC2: Virtual Server)\n4. **전용 VPC Firewall 생성 및 Transit Gateway 연결 (SR 기반)**\n5. **규칙 추가** 후 전용 VPC Firewall로 트래픽 제어\n- 생성 화면 안내문도 같다: \"Security Group이 없으므로 Bare Metal Server의 VPC에서 Transit Gateway 연동 생성 시 Firewall을 같이 생성\"\n\n### 서버 타입\n| 구분 | Standard | High Capacity |\n|---|---|---|\n| vCPU | **16개(물리 8코어)** | **최대 128개(물리 64코어)** |\n| 메모리 | **최대 256GB** | **최대 2,048GB** |\n| Internal Disk(RAID1, OS 구성용) | **480GB** | **최대 1.92TB** |\n\nWA백서 04 p.15 보충\n- 서버 타입: 16/32/64/96/128 vCore, 64~2,048GB, Physical CPU 8~64\n- CPU:Memory 조합 **1:4, 1:8, 1:16**\n- OS용 Internal Disk: 16vCore=480GB×2, 32vCore=960GB×2, 96/128vCore=1.92TB×2\n- 적합 워크로드: **실시간(Real-Time) 시스템, HPC, 과도한 I/O** 서버 등 고용량·고성능. Multi-Attach로 **Active-Active 고가용성 DB** 구성에도 활용\n\n> [!주의]\n> CPU 세대 표기가 자료마다 다르다. 교재 생성 화면(Baremetal 슬라이드9)은 \"2세대 Intel Ice Lake / 3세대 Intel Sapphire Rapids / 4세대 Intel\"을, WA백서 04 p.15는 \"현재 Intel Sapphire Rapids 3세대 제공\"을 적었다.\n\n> [!주의]\n> 메모리 최대값을 섞지 말 것: Bare Metal High Capacity **2,048GB**, Virtual Server High Capacity **1,536GB**. vCPU 최대는 둘 다 128이다.\n\n## 생성 절차\n학습정리 순서: 이미지 및 버전 선택 → 서버 수·인스턴스 타입 선택 → 계정 정보·서버명 입력 → 네트워크 설정 → Placement Group / Lock / Hyper Threading 설정 → Init Script 설정\n\n| 순서 | 항목 | 내용·제약 |\n|---|---|---|\n| 1 | 이미지 및 버전 | 표준 기본 제공 이미지, 종류는 Docs 확인 |\n| 2 | 서버 수 | 동시 생성 **1~5개** |\n| 3 | 서비스 유형 | 서버 타입(세대 표기는 위 주의 참고), **Planned Compute 1년·3년** 약정 |\n| 4 | 자동화 계정 | 서비스용 계정 **sdscmpif** 자동 생성 |\n| 5 | 관리자 계정 암호 | **Linux는 root로 고정**, Windows는 관리자 계정 입력(**administrator, sdscmpif 사용 불가**) |\n| 6 | 서버명 | 1대면 서버명, **2대 이상이면 prefix** |\n| 7 | 네트워크 | VPC, 일반 Subnet, IP(자동/입력), NAT 사용 여부, 로컬 Subnet 사용 여부 |\n| 8 | Local Disk Partition | 루트 포함 **최대 10개**, 파티션 유형 **Flat / LVM**, Filesystem은 아래 표 |\n| 9 | Placement Group | **서로 다른 랙에 분산** 배치. 1개 Placement Group에 **2대까지** → 3대 이상이면 Placement Group 추가 |\n| 10 | Lock | 해지/시작/중지 등 실행 불가로 실수 방지 |\n| 11 | Hyper Threading | 물리 코어 수의 **2배**로 논리 코어 동작. 끄려면 체크 해제. **생성 후 변경 불가** |\n| 12 | Init Script | Windows: 배치 스크립트 / Linux: 쉘 스크립트, Cloud-init |\n\nOS별 Filesystem 유형\n| OS | 선택 가능 |\n|---|---|\n| RHEL, Rocky Linux | xfs, ext4 |\n| Ubuntu | ext4, xfs, btrfs |\n| SLES | btrfs, xfs, ext4 |\n\n## 생성 후 주의사항\n1. 콘솔 **중지 버튼은 서버 전원 Off**다. 애플리케이션 중지 → OS에서 shutdown → 중지 버튼 순서를 권장\n2. Block Storage 추가는 **Block Storage(BM)** 메뉴에서 생성하며, **생성 후 용량 증설 불가**\n3. 생성 후 **로컬 Subnet 추가** 시 사용자가 직접 서버에 들어가 네트워크 구성\n4. IP 변경 방법은 변경할 IP의 **Subnet에 따라 다르므로** Documentation 확인\n5. **IP를 변경해도 NAT IP는 변경되지 않음**\n\n## Virtual Server와 비교\n| 항목 | Virtual Server | Bare Metal Server |\n|---|---|---|\n| 가상화 | 가상 서버 | 가상화 없음, 물리 자원 단독 |\n| Security Group | 제공(최대 5개) | **미제공** → 전용 VPC Firewall |\n| 동시 생성 | 1~100대 | **1~5대** |\n| 최대 메모리 | 1,536GB | **2,048GB** |\n| 접속 계정 | Keypair + OS별 기본 계정 | **root 고정**(Linux), 암호 설정, sdscmpif 자동 생성 |\n| 분산 배치 | Server Group(Affinity/Anti-Affinity) | **Placement Group**(랙 분산, 그룹당 2대, 최초 생성 시만) |\n| 추가 Block Storage | Block Storage(VM), **사용 중 증설 가능** | Block Storage(BM), **증설 불가** |\n| 모니터링 | 모니터링 탭 대시보드 | Cloud Monitoring **Agent 사용자 직접 설치** |\n| 백업 | Backup 서비스(이미지 스냅샷) | Backup 서비스(**Agent 기반 Filesystem** 백업) |\n| Hyper Threading | 해당 없음 | 생성 시 설정, 이후 변경 불가 |\n| 과금 | Provisioning / Per Hour | Provisioning / Per Hour |\n\n과금·요금제(WA백서 06 p.4~5): Bare Metal Server는 **Provisioning / Per Hour**, Cost Savings·Planned Compute(1·3년) 적용 대상. SLA 장애 정의는 VS와 같은 '공통' 기준(WA백서 01 p.5).\n\n## 시험 포인트\n> [!시험]\n> - SG가 없으니 Firewall이 필요하다. 구성 순서는 전용 VPC → TGW 생성 → TGW↔VS VPC 연결 → 전용 VPC Firewall 생성·TGW 연결(SR) → 규칙 추가.\n> - High Capacity: 128 vCPU(물리 64코어), 2,048GB, 1.92TB RAID1. Standard: 16 vCPU(물리 8코어), 256GB, 480GB RAID1.\n> - 동시 생성 1~5대. Linux 관리자는 root 고정이고, Windows에서는 administrator와 sdscmpif를 쓸 수 없다.\n> - 파티션은 최대 10개(Flat/LVM). Placement Group은 그룹당 2대이며 최초 생성 시에만 적용된다. Hyper Threading은 생성 후 변경할 수 없다.\n> - Block Storage(BM)는 증설할 수 없다. IP를 바꿔도 NAT IP는 그대로다. 중지 버튼은 전원 Off다.\n> - Cloud Monitoring은 Agent 방식이며 사용자가 직접 설치한다.\n\n출처: SCP_v2_Explore_Compute_11-19.md Baremetal 슬라이드1~15, SCP Compute Service 슬라이드11, WA백서 01 p.5, WA백서 03 p.11, WA백서 04 p.14~15, WA백서 06 p.4~5\n"}, "3-2c": {"title": "Virtual Server Auto-Scaling 기능", "md": "## 한눈에 보기\n- Virtual Server Auto-Scaling = **수요에 따라 자원을 자동으로 확장·축소**하는 서비스\n- 구성요소 2가지: **Launch Configuration**(무엇을 만들지: 템플릿) + **Auto-Scaling Group**(어디에 몇 대: 논리 그룹)\n- 생성 절차: **Launch Configuration 생성 → Auto-Scaling Group 생성**(정책 또는 스케줄 설정, 알림 설정)\n- 서버 수 조정 방법: **정책, 스케줄, 수동**(정책·스케줄 상세는 3-2d)\n\n## 구성과 동작\n| 구성 | 역할 |\n|---|---|\n| Launch Configuration | ASG에서 Virtual Server를 생성할 때 쓰는 **Configuration 템플릿**. 서버 유형, Key Pair, Block Storage 등 설정 |\n| Auto-Scaling Group | Auto Scaling 조정·관리를 위한 **논리적 그룹**. **네트워크, Security Group, Min/Desired/Max 수량** 설정, 서버 수 조정(정책·스케줄·수동) |\n| Load Balancer 연계 | **LB 서버 그룹**과 연계해 생성된 서버를 멤버로 등록 |\n| Cloud Monitoring | 지표 수집(정책 실행 근거) |\n\n동작 흐름(WA백서 01 p.25~26): Load Balancer의 서버 그룹에 VM을 등록해 요청 부하를 분산하고, 미리 정한 정책에 따라 VM을 새로 만들어 추가하거나 기존 VM을 삭제한다. SCP에서 Auto-Scaling은 **Virtual Server와 Container**(Kubernetes Engine 노드 풀 자동 확장)에서 동작한다.\n\n### Quota\n| 항목 | 최대 |\n|---|---|\n| ASG당 Virtual Server 수 | **50개** |\n| ASG당 정책 수 | **12개** |\n| ASG당 스케줄 수 | **20개** |\n| ASG당 LB 서버 그룹 및 포트 개수 | **3개** |\n\n## Launch Configuration 생성 (Virtual Server > Launch Configuration)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | 이미지 및 버전 | 표준 기본 제공 이미지, 종류는 Docs 확인 |\n| 2 | Launch Configuration 이름 | |\n| 3 | 서버 타입 | Virtual Server 타입 참조 |\n| 4 | Block Storage | 기본 OS 및 추가 스토리지. **SSD / SSD_KMS / SSD_Provisioned**. SSD_Provisioned 선택 시 **Max IOPS, Max Throughput** 설정 |\n| 5 | Keypair | 미리 만든 Keypair 선택 |\n| 6 | File Storage | 필요 시 사용 체크 후 기존 File Storage 볼륨 선택, **최대 5개** |\n| 7 | Init Script | Windows: 배치 스크립트 / Linux: 쉘 스크립트, Cloud-init |\n\n## Auto-Scaling Group 생성 (Virtual Server > Auto-Scaling Group)\n| 순서 | 항목 | 내용·제약 |\n|---|---|---|\n| 1 | Launch Configuration 선택 | 기존 LC 선택 |\n| 2 | ASG명 | |\n| 3 | 서버명 | Prefix처럼 `서버명 + 숫자` 형태로 자동 생성 |\n| 4 | 서버 수 | **Min**: 최소 유지 수 / **Desired**: **최초 생성되는 서버 수, 목표 서버 수** / **Max**: 최대 유지 수 |\n| 5 | Desired 수동 설정 여부 | Desired 서버 수를 수동으로 바꿀지 선택 |\n| 6 | 네트워크 | **VPC, 일반 Subnet**, 로컬 Subnet 사용 여부 |\n| 7 | Security Group | 기존 SG 선택 |\n| 8 | Load Balancer 연동 | ASG 서버를 **LB 서버 그룹 Member로 등록**. **선택한 VPC에 있는** LB 서버 그룹 선택. **Weighted 부하 분산 LB 서버 그룹은 선택 불가**(부하 분산값은 LB 서버 그룹에서 수정) |\n| 9 | Draining timeout | 서버를 LB에서 **분리하기 전 대기 시간**, 안전한 세션 정리. **기본 300초, 1~3,600초** |\n| 10 | Scaling 정책 | 3-2d |\n| 11 | 알림 | 아래 표 |\n| 12 | 상태 체크 | 아래 절 |\n\n### 설정 위치 비교 (헷갈리기 쉬움)\n| 항목 | Launch Configuration | Auto-Scaling Group |\n|---|---|---|\n| 이미지, 서버 타입 | O | |\n| Block Storage, Keypair, File Storage, Init Script | O | |\n| VPC, Subnet, Security Group | | O |\n| Min/Desired/Max | | O |\n| LB 연동, Draining timeout | | O |\n| 정책, 스케줄, 알림, 상태 체크 | | O |\n\n### 상태 체크\n- **Virtual Server 및 Load Balancer 상태**를 체크해 **Unhealthy 서버를 자동 교체**\n- **유예기간**: 새로 추가된 서버가 정상 동작할 때까지 상태 체크를 **미루는 시간**. **0을 입력하면 유예기간 미사용**\n- 사용자가 **Stop으로 바꾼 서버는 Unhealthy로 판단하지 않음**\n\n### 알림 설정 (상세정보 > 알림 탭)\n| 항목 | 내용 |\n|---|---|\n| 통보 시점(다중 선택) | **서버 생성, 서버 해지, 서버 생성 실패, 서버 해지 실패, 정책 실행조건 만족 시** |\n| 수신자 | IAM에서 **Account 내 사용자 및 사용자 그룹**에 등록돼 있어야 함 |\n| 방식 | 기본은 **이메일**. 콘솔 오른쪽 위 알림(종 모양) > 설정(톱니바퀴)에서 변경 |\n| 수신 조건 | **로그인 이력이 있고** 이메일·휴대전화번호가 등록된 사용자만 수신 |\n\n## 설계 원칙 (WA백서)\n- 가용성(WA백서 01 p.10~11): 웹·앱 계층 사이에 **Load Balancer**를 두어 결합을 해제해야 Auto-Scaling으로 동적으로 생성·삭제되는 서버에도 요청을 자동 분산할 수 있다.\n- Stateless(WA백서 01 p.13): 상태 저장 앱은 요청이 누적되면 Auto-Scaling으로 서버를 추가해도 기대만큼 성능이 오르지 않는다 → **상태 비저장(Stateless)** 으로 구현하고 상태는 외부 DB에 둔다.\n- 장애 자동 복구(WA백서 01 p.32~33): **최소 인스턴스 수를 2**로 두면 한 VM이 장애로 빠질 때 LB가 감지하고 ASG가 최소 수량을 유지하려고 새 VM을 자동 생성한다.\n- 보안(WA백서 01 p.33): DDoS 같은 **서비스 불능화 공격**에 Auto-Scaling으로 서비스 지속, 관리자 알림으로 비정상 트래픽을 방화벽에서 차단\n- 중복 배치(WA백서 01 p.29): VS는 LB와 함께 중복 배치하고, 가능하면 Auto-Scaling으로 자동화된 중복 구성\n- 비용(WA백서 06 p.6·8): Auto-Scaling으로 **수요 기반 비용 모델** 구성. 예시: 정기 가동 Min(2)은 **Cost Savings**, 정기 부하로 늘어나는 Max(8) 쪽은 **무약정**\n\n## 시험 포인트\n> [!시험]\n> - LC는 \"무엇을\"(이미지·타입·스토리지·Keypair·File Storage 최대 5·Init Script), ASG는 \"어디에·몇 대\"(VPC·Subnet·SG·Min/Desired/Max·LB)를 정한다.\n> - Quota: VS 50, 정책 12, 스케줄 20, LB 서버 그룹·포트 3.\n> - Desired는 최초 생성 수이자 목표 수다. Weighted LB 서버 그룹은 선택할 수 없다.\n> - Draining timeout은 기본 300초(1~3,600초)이며 LB에서 분리하기 전 세션을 정리하는 시간이다. 유예기간은 새 서버의 상태 체크를 미루는 시간이며 0이면 쓰지 않는다. 두 개념을 바꿔 낸 보기가 나온다.\n> - 상태 체크는 VS와 LB를 함께 보고 Unhealthy 서버를 자동 교체한다. 사용자가 Stop한 서버는 Unhealthy가 아니다.\n> - 알림 수신자는 IAM 사용자·그룹이어야 하고 로그인 이력과 연락처가 있어야 한다.\n\n출처: SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드1~13·16·18, WA백서 01 p.10~13·25~26·29·32~33, WA백서 06 p.6·8\n"}, "3-2d": {"title": "Auto-Scaling Scale-out/in · Schedule 정책", "md": "## 한눈에 보기\n- ASG의 서버 수 조정 방법: **정책(임계치 기반)**, **스케줄(시간 기반)**, **수동(Desired 변경)**\n- 정책: 상세정보 > **정책 탭**, Scale Out(서버 증가)/Scale In(서버 반납)\n- 스케줄: 상세정보 > **스케줄 탭**, 정해진 시점에 Min/Desired/Max를 바꿈\n- 한도: ASG당 정책 **12개**, 스케줄 **20개**, 서버 **50대**(3-2c)\n\n## 정책(Scale Out / Scale In)\n### 설정 항목 (Virtual Server > Auto-Scaling Group > 상세정보 정책 탭)\n| 순서 | 항목 | 의미 |\n|---|---|---|\n| 1 | 정책 구분 | **Scale Out**: 서버 수 증가 / **Scale In**: 서버 수 반납 |\n| 2 | 정책명 | |\n| 2 | **Statistic** | Metric Type을 계산하는 방법: ASG 내 서버들의 **Average / Min / Max** |\n| 2 | **Metric Type** | **CPU 사용량, NW 트래픽**에 따라 정책 수행 |\n| 2 | **Operator** | `>=`, `>`, `<=`, `<` |\n| 2 | **Threshold** | Metric Type에 해당하는 임계치 |\n| 2 | **Period** | **N분 동안 실행 조건을 계속 만족해야** 정책 실행 |\n| 3 | 실행 단위 | 조건에 부합할 때 서버 수를 어떤 방식으로 증감할지 선택 |\n| 4 | **쿨다운** | 정책으로 서버가 **시작 또는 해지될 때 대기하는 시간** |\n\n### 판정 계산 연습\n서버 3대의 최근 5분 CPU가 A 85%, B 60%, C 55%로 일정하고 Period가 5분이면\n| Statistic | 값 | `>= 70` | `> 60` | `>= 85` |\n|---|---|---|---|---|\n| Average | (85+60+55)/3 ≈ 66.7% | 불충족 | 충족 | 불충족 |\n| Min | 55% | 불충족 | 불충족 | 불충족 |\n| Max | 85% | 충족 | 충족 | **충족** |\n- 요령: 먼저 Statistic으로 하나의 값을 만든 뒤 Operator·Threshold와 비교한다. `>`와 `>=`의 경계값(예: Min 60 vs `> 60`)에 주의한다.\n\n### 시간 개념 비교 (가장 많이 섞이는 부분)\n| 개념 | 위치 | 의미 | 값 |\n|---|---|---|---|\n| Period | 정책 | 조건을 **N분간 지속** 만족해야 실행 | N분 |\n| 쿨다운 | 정책 | 정책으로 서버가 **시작·해지될 때 대기** | |\n| 유예기간 | 상태 체크 | **새 서버**의 상태 체크를 미루는 시간 | 0이면 미사용 |\n| Draining timeout | LB 연동 | 서버를 **LB에서 분리하기 전** 세션 정리 대기 | 기본 300초, 1~3,600초 |\n\n## 스케줄\n### 설정 항목 (상세정보 > 스케줄 탭)\n| 항목 | 내용·제약 |\n|---|---|\n| 스케줄 이름 | |\n| 서버 수 | **Min / Desired / Max** 지정, 범위 **0~50** |\n| 주기 | **매일, 매주, 매달, 한번** |\n| 시작일·종료일 | 종료일은 **영구 설정 가능**, **오늘보다 이전 날짜로 설정 불가** |\n| Date (매달) | **0보다 큰 수 = 그 달의 날짜**, **0보다 작은 수 = 말일부터 역산**(예: **-1 = 말일**) |\n| 시간 | 수행 시간 **30분 단위** |\n| 요일 (매주) | 특정 요일 선택 |\n\n예시\n- 매달 말일 정산 배치 → 주기 **매달**, Date **-1**\n- 매달 10일 → 주기 매달, Date **10**\n- 평일 업무 시간 증설 → 주기 **매주**, 요일 선택, 시간은 30분 단위\n\n## 정책 설계 원칙 (WA백서)\n- WA백서 06 p.8: Auto-Scaling은 **임계치 기반**과 **스케줄 기반**의 수평 확장·축소 정책을 제공한다. 임계치 정책은 CPU usage, Memory usage, Network in/out 등의 지표를 **최소값·최대값·평균값** 기준으로 설정한다. 일반적으로 **확장은 빠르게 시작**해 선제 대응하고, **축소는 지연**시켜 부하 재상승에 대비한다.\n- WA백서 06 p.9: Auto-Scaling은 **부하 증가 속도가 VM 생성 속도보다 느릴 때** 적합하다. 더 빠르면 **Serverless Computing**(Cloud Functions 등) 같은 관리형 서비스를 검토한다. 평상시 부하는 Auto-Scaling으로, 급증 부하는 임시 서비스(API Gateway + Object Storage + Cloud Functions + CacheStore)로 처리하는 구조가 예시로 나온다.\n- WA백서 01 p.39~40: 부하 테스트에서 부하 증가 속도가 서버 생성 속도보다 빠르면 **Scale-out 정책의 임계치를 낮춰** 더 일찍 확장하고 **생성 서버 수를 늘린다**.\n- WA백서 01 p.26: Auto-Scaling 적용 전 **용량 제한으로 병목이 될 자원**을 미리 식별하고, 확장이 불가능한 지점과 대안을 검토한다.\n\n> [!주의]\n> 정책 Metric Type 범위가 자료마다 다르다. 교재(Auto-Scaling 슬라이드14)는 \"CPU 사용량, NW 트래픽\", WA백서 01 p.26은 \"CPU, 메모리, 디스크 사용률, 네트워크 트래픽\", WA백서 06 p.8은 \"CPU usage, Memory usage, Network in/out 등\"으로 적었다. 콘솔 설정 문제는 교재 표기를 따르는 것이 안전하다.\n\n## 시험 포인트\n> [!시험]\n> - Period는 조건을 N분간 계속 만족해야 실행한다는 뜻이고, 서버 시작·해지 시 대기하는 시간은 쿨다운이다. 이 둘을 바꾼 보기가 단골 오답이다.\n> - Statistic은 그룹 내 서버들의 Average/Min/Max다. 계산 문제에서는 Statistic 값부터 구한다.\n> - Operator는 `>=`, `>`, `<=`, `<` 네 가지다.\n> - 스케줄: 서버 수 0~50, 시간 30분 단위, 주기는 매일·매주·매달·한번, 종료일은 영구 설정 가능, 과거 날짜는 설정할 수 없다. 매달 Date -1은 말일이다.\n> - 정책은 최대 12개, 스케줄은 최대 20개다.\n> - 확장은 빠르게, 축소는 늦게 한다. 부하 증가가 VM 생성보다 빠르면 서버리스를 검토한다.\n\n출처: SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드5·14~15, WA백서 01 p.26·39~40, WA백서 06 p.8~9\n"}, "3-2e": {"title": "Cloud Functions", "md": "## 한눈에 보기\n- **FaaS**(Function as a Service): 서버 관리나 프로비저닝 부담 없이 비즈니스 로직을 간단히 작성해 클라우드에서 구현하는 **서버리스형** 서비스\n- Cloud Functions = 서버리스 컴퓨팅 기반 FaaS. 개발자가 작성한 함수가 **특정 이벤트에 의해 자동 트리거**되어 실행되며, 인프라 관리·확장·로깅은 모두 클라우드가 제공\n- 시나리오 흐름: **함수 생성 → 코드 수정 → 구성 설정 → 트리거 설정 → 테스트 → 모니터링**\n- 트리거 2종: **API Gateway**, **Cronjob**\n\n## 개념\n### 주요 기능\n| 기능 | 내용 |\n|---|---|\n| 코드 작성 환경 | Runtime별 **인라인 편집기**(GO, Java, Node.js, PHP, Python), 코드 작성·배포에 필요한 모든 요소를 SCP가 관리, **배포 크기·횟수에 따라 자동 스케일 조정** |\n| 자동화된 관리 | 인프라 관리, **패치 적용, 모니터링 및 로깅**을 기본 서비스로 제공해 관리 복잡성 최소화. 엔드포인트 정의, Token 관리, 접근제어, 트리거, 구동 환경/변수 정의, 모니터링/로깅 등 |\n| 샘플 코드 | **Blueprint**로 다양한 샘플 코드 제공 |\n\n구성 흐름: SCP User(Developer)가 UI Editor로 Function Create/Code build → Functions Manager가 Config·Functions Pool·Monitoring 관리 → 요청은 HTTP/HTTPS, API Gateway, Object Storage 경로로 들어온다.\n\n### 누가, 어떻게 쓰나\n- 개발자: **백엔드 API, 이벤트 처리, 자동화 스크립트** 등을 빠르게 구현·배포. 서버 관리 없이 코드에 집중\n- 운영자: **CI/CD 파이프라인, 로그 수집, 모니터링, 배치 작업 자동화** 등 인프라 운영 자동화. 반복 작업을 효율적으로 처리\n- 활용 유형: 이벤트 발생 시점에 실행되는 작업, 자동화 및 배치 처리, 비용 효율적인 백엔드, 빠른 프로토타이핑 및 반복 개발\n\n## 생성과 설정\n### 1. 함수 생성 (Compute > Cloud Functions > Function > 서비스 생성)\n| 항목 | 내용 |\n|---|---|\n| Function명 | |\n| Runtime 생성 방법 | **\"새로 작성\"** 또는 **\"Blueprint로 시작하기\"** |\n| Runtime·버전 | 새로 작성: **GO, Java, Node.js, PHP, Python**. **Java는 UI 코드 편집 미지원**, Object Storage의 **Jar 파일**을 가져와 실행. Blueprint: 콘솔 제공 소스코드(**\"Hello World\" 등 7개**) 선택 |\n\nBlueprint 7종\n| Blueprint | 설명 | 비고 |\n|---|---|---|\n| Hello World | 호출 시 `Hello Serverless World!` 응답 | |\n| Execution after timeout | 호출 시간 초과 후 실행되어야 하나 실행되지 않는 코드 출력 | PHP, Python 미지원 |\n| HTTP request body | Request Body 파싱 | PHP 미지원 |\n| Send HTTP requests | 함수에서 HTTP 요청 전송 | PHP 미지원 |\n| Print logs | 사용자의 SCP Console Request를 로그로 출력 | PHP 미지원 |\n| Throw a custom error | 에러 로직을 직접 입력해 처리 | |\n| Using Environment Variable | 환경변수를 구성해 실행 | |\n- **Java는 기본적으로 Blueprint 미제공**\n\n### 2. 코드 수정 (Function 상세)\n- UI 코드 편집: **Node.js, Python, PHP, Go** Runtime에서 직접 수정, **Diff** 버튼으로 변경 비교\n- Java: Object Storage 버킷에서 압축파일(**.jar/.zip**)을 선택해 수정, **실행 Class, 실행 Method, 압축파일** 변경 가능\n\n### 3. 구성 설정\n| 구분 | 항목 | 내용 |\n|---|---|---|\n| 일반 구성 | 메모리 | Function당 **최대 사용 메모리 제한값** |\n| 일반 구성 | 제한시간 | Function당 **호출을 대기하는 최대 시간** |\n| 일반 구성 | 함수 실행 | **최소·최대 작업 수**. 최소 작업 수 **1 이상이면 Cold Start 방지**, 대신 **비용이 계속 부과** |\n| 환경 변수 | | **코드를 업데이트하지 않고** 함수 동작 조정 |\n| 함수 URL | | 사용 시 함수에 접근할 수 있는 **HTTPS URL** 발급. 수정 버튼으로 **활성화 여부, 인증 유형(IAM/None), 퍼블릭 접근 허용 IP** 설정. **IAM** 선택 시 요청 헤더에 `x-scf-access-key`, `x-scf-secret-key` 필수 |\n\n> [!주의]\n> 교재 슬라이드16 원문은 헤더명을 \"x-scfaccess-key\"(하이픈 누락)와 \"x-scf-secret-key\"로 적었다. 짝을 이루는 이름으로 보아 `x-scf-access-key`의 오타로 보인다.\n\n### 4. 트리거 설정\n| 트리거 | 동작 | 추가 방법 |\n|---|---|---|\n| **API Gateway** | API Gateway의 **API endpoint**로 함수 호출 | API 선택(새 API가 필요하면 **API Gateway 콘솔로 이동해 생성 후 선택**), 스테이지 선택(기존 선택 또는 신규 생성 후 반영) |\n| **Cronjob** | 사용 시간·일정 주기에 따라 **자동 호출** | 실행 일정·주기 입력, 문법은 **리눅스 크론탭과 동일** |\n\n크론 기호\n| 기호 | 의미 |\n|---|---|\n| `*` | 모든 값 |\n| `,` | 여러 값 지정 |\n| `-` | **범위** 지정 |\n| `/` | **간격** 지정 |\n\n등록된 트리거 확인: Cronjob과 API Gateway 트리거 모두 표시. API Gateway는 **API명, API Endpoint, 리소스 경로, 메서드, 스테이지** 표시.\n\nAPI Gateway 구성 요소(Functions 연계)\n| 요소 | 의미 |\n|---|---|\n| API | Cloud Functions, 백엔드 HTTP 엔드포인트, 기타 SCP 서비스와 통합된 **리소스와 메서드의 집합** |\n| 리소스 | API 안의 특정 엔드포인트(URI 경로) 논리 단위(예: `/res01`) |\n| 메서드 | 리소스에 대한 HTTP 동작(GET, POST, PUT, DELETE 등) 정의, 연결된 Function 실행 |\n| 스테이지 | API 배포의 특정 시점(스냅샷)에 대한 이름 붙은 참조(dev, test, prod 등) |\n| 엔드포인트 | 클라이언트가 API에 접근하는 **고유 URL** |\n\n### 5. 테스트\n1. API endpoint 입력, 메서드 유형 **GET**\n2. API Gateway 인증용 **JSON Web Token** 입력 후 Send\n3. 실행 결과 `Hello Serverless World!` 확인\n\n### 6. 모니터링\n- 조회 기간: **1시간, 3시간, 12시간, 사용자 지정**. 기간마다 단위 시간이 다르고 단위 기간 **평균값**으로 표시\n\n| 지표 | 의미 |\n|---|---|\n| 호출 수 | 단위 시간 동안 호출된 평균 횟수 |\n| 실행시간 | 단위 시간 동안 평균 실행 시간(초) |\n| 메모리 사용량 | 실행 중 평균 메모리 사용량 |\n| 현재 작업 수 | 동시 호출을 처리하려고 단위 시간 동안 생성된 작업의 평균 횟수 |\n| 성공 호출 수 | 런타임 코드가 정상 동작한 평균 횟수 |\n| 실패 호출 수 | 오류가 발생한 평균 호출 횟수 |\n\n## 아키텍처·비용 관점 (WA백서)\n- 단순성(WA백서 01 p.8): API Gateway + Cloud Functions로 모바일 사진 관리 서비스를 구현한 예. Authentication, Search, Register, Thumbnail, Delete를 **각각 독립 함수**로 분리해, 하나를 고쳐도 다른 기능에 영향이 없다. 가시성 확보를 위해 호출 수·실행 시간·현재 작업 수·성공/실패 호출 수·메모리 사용량 모니터링과 함수 실행 로그를 쓴다.\n- 관리형 서비스(WA백서 01 p.17·23): **단순 반복 작업은 Virtual Server 대신 Cloud Functions**로 처리하면 고가용성을 효과적으로 구현한다. 이벤트 기반 처리 아키텍처에 활용.\n- 확장성(WA백서 01 p.24): 서버리스는 하부 인프라 제한 없이 이벤트 기반 컴퓨팅을 구성한다.\n- SLA(WA백서 01 p.5): 장애 정의는 **요청에 대해 500 또는 503 오류 코드 반환**(사용자 지정 오류 제외). 가용률은 **매 5분** 동안 장애가 발생한 시간 및 건수 기준\n- 과금(WA백서 06 p.4): **Pay-as-you-go / Per Call**, 컴퓨팅 시간(**초-GB**)을 함께 계산\n- 비용 전략(SCP Compute Service 슬라이드14): **간헐적이고 변수가 많은** 사용량은 서버리스(자원 유지 비용 없음), **지속적이고 예측 가능한** 사용량은 컨테이너가 더 효율적\n- 임시 부하(WA백서 06 p.9): 부하 증가가 VM 생성보다 빠르면 서버리스를 검토한다. 단 Cloud Functions에는 **Cold Start**(사전 가동 시간)가 있으므로 요청 개시 전에 준비를 끝낸다.\n\n## 시험 포인트\n> [!시험]\n> - Runtime은 GO, Java, Node.js, PHP, Python 5종이다. Java는 UI 편집과 Blueprint를 지원하지 않고 Object Storage의 jar/zip로 실행한다.\n> - Blueprint는 7종이며 Hello World 응답은 \"Hello Serverless World!\"다.\n> - 최소 작업 수를 1 이상으로 두면 Cold Start가 방지되지만 비용이 계속 나간다.\n> - 함수 URL은 HTTPS URL을 발급한다. 인증은 IAM/None이고 IAM이면 x-scf-access-key와 x-scf-secret-key 헤더가 필요하다.\n> - 트리거는 API Gateway와 Cronjob이다. 크론 문법은 리눅스 크론탭과 같고, '-'는 범위, '/'는 간격이다.\n> - 새 API가 필요하면 API Gateway 콘솔에서 만든 뒤 선택한다.\n> - 패치·모니터링·로깅은 기본 제공이다. 사용자가 로깅 서버를 따로 구축해야 한다는 보기는 틀린 보기다.\n> - 과금은 Per Call과 초-GB이고, SLA 장애 기준은 500·503 응답이다.\n\n출처: SCP_v2_Explore_Compute_11-19.md Cloud Functions 슬라이드1~22, SCP Compute Service 슬라이드14, WA백서 01 p.5·8·17·23~24, WA백서 06 p.4·9\n"}, "3-2f": {"title": "Accelerated Server · Multi-node GPU Cluster", "md": "## 한눈에 보기\n| 구분 | Accelerated Server(GPU/NPU Server) | Multi-node GPU Cluster |\n|---|---|---|\n| 정의 | GPU·NPU 등 AI Accelerator 기반 **고성능 가상 서버** | 대규모 고성능 AI 연산용으로 **물리 GPU 서버를 가상화 없이** 제공, GPU 장착 **Bare Metal Server 2대 이상**으로 클러스터링 |\n| 가속기 | GPU **A100 / H100 / B300**, NPU **FuriosaAI RNGD** | GPU **B300, H100** |\n| 수량 | 서버당 **1, 2, 4, 8개** | 서버당 **8장** |\n| OS | **Ubuntu, RHEL**(OS별 GPU/NPU 타입 다름) | **Ubuntu** |\n| 노드 간 통신 | 없음(단일 서버) | **InfiniBand Switch (RDMA)** |\n\n## Accelerated Server 개념\n### 제공 내용\n- 프로젝트 용도·규모에 따라 B300/H100/A100 GPU와 RNGD NPU 수량을 골라 서버 구성(**1, 2, 4, 8 단위**)\n- OS 이미지 **Ubuntu, RHEL**(※ **OS별 제공 GPU/NPU 타입이 다름**)\n- 최대 **128vCore, 3,840GB** 메모리(서버 타입별 사양 다름)\n- 연계: VPC/Subnet, Security Group, Internet Gateway, Firewall, Cloud Monitoring, Logging & Audit, Backup, File/Object/Block Storage\n\n### 인스턴스 타입\n| 타입 | vCPU | Memory | 가속기 수 | 가속기 Memory |\n|---|---|---|---|---|\n| g1v16a1 | 16 | 234GB | 1 | 80GB |\n| g1v32a2 | 32 | 468GB | 2 | 160GB |\n| g1v64a4 | 64 | 936GB | 4 | 320GB |\n| g1v128a8 | 128 | 1,872GB | 8 | 640GB |\n| g2v12h1 | 12 | 234GB | 1 | 80GB |\n| g2v24h2 | 24 | 468GB | 2 | 160GB |\n| g2v48h4 | 48 | 936GB | 4 | 320GB |\n| g2v96h8 | 96 | 1,872GB | 8 | 640GB |\n| g3v16b1 | 16 | 480GB | 1 | 268GB |\n| g3v32h2 | 32 | 960GB | 2 | 536GB |\n| g3v64h4 | 64 | 1,920GB | 4 | 1,072GB |\n| g3v128h8 | 128 | 3,840GB | 8 | 2,144GB |\n| n1v8r1 | 8 | 106GB | 1 | 48GB |\n| n1v16r2 | 16 | 212GB | 2 | 96GB |\n| n1v32r4 | 32 | 424GB | 4 | 192GB |\n| n1v64r8 | 64 | 848GB | 8 | 384GB |\n- 읽는 법: g=GPU, n=NPU / 숫자=세대(g1=A100, g2=H100, g3=B300, n1=RNGD) / v=vCPU / 끝의 문자+숫자=가속기 종류(a=A100, h=H100, b=B300, r=RNGD)와 수량. 예: **g2v48h4 = H100 4장, 48 vCore**\n\n> [!주의]\n> 교재 표에서 B300(g3) 2·4·8장 타입이 g3v32**h**2, g3v64**h**4, g3v128**h**8로 적혀 있다. 1장 타입(g3v16**b**1)과 규칙이 달라 오타로 보이지만 교재 표기를 그대로 둔다.\n\n### GPU 사양\n| 구분 | A100 | H100 | B300 |\n|---|---|---|---|\n| 제공 방식 | Pass-through | Pass-through | Pass-through |\n| Architecture | NVIDIA **Ampere** | NVIDIA **Hopper** | NVIDIA **Blackwell** |\n| GPU Memory | 80GB | 80GB | 268GB |\n| Memory 대역폭 | 2,039 GB/s HBM2e | 3,352 GB/s HBM3 | 8,192 GB/s HBM3e |\n| CUDA Cores | 6,912 | 16,896 | 18,944 |\n| Tensor Cores | 432(3세대) | 528(4세대) | 640(5세대) |\n| Tensor 성능(FP16, *Sparsity) | 312 / 624* TFLOPs | 989 / 1,979* TFLOPs | 4.5 / 13.5* PFLOPs |\n| NVLink | NVLink 3, 600 GB/s | NVLink 4, 900 GB/s | NVLink 5, 1.8 TB/s |\n| NVSwitch | NVSwitch 2, GPU간 600 GB/s, 총 4.8 TB/s | NVSwitch 3, 900 GB/s, 총 7.2 TB/s | NVSwitch 4, 1.8 TB/s, 총 14.4 TB/s |\n\n용어\n| 용어 | 의미 |\n|---|---|\n| Pass-through | 가상화 환경에서 GPU 하나를 특정 가상머신에 **직접 할당** |\n| CUDA Core | 병렬 연산 담당 기본 처리 유닛, 주로 **FP32** |\n| Tensor Core | **행렬 곱셈** 특화, FP16·INT8·TF32 등 정밀도별 처리량 |\n| NVLink | NVIDIA 고속 GPU간 통신 프로토콜, PCIe보다 최대 수십 배 대역폭 |\n| NVSwitch | 여러 NVLink를 **스위치 방식**으로 연결해 GPU간 대역폭 향상 |\n\n> [!주의]\n> WA백서 04 p.31의 GPU 표는 교재와 값이 다르다(V100 포함, A100 Tensor Cores 1,024(3세대), H100 Tensor 성능 1,979 TFLOPs(FP16 기준으로 표기), A100 NVSwitch 총 집계 9.6 TB/s, A100 메모리 대역폭 2,000 GB/s). 교재는 A100 432 Tensor Cores, H100 989(Sparsity 1,979) TFLOPs, A100 총 4.8 TB/s다. 또 WA백서 04 p.14는 GPU Server 메모리를 240~1,920GB로 적었지만, 교재 v2 표는 최대 1,872GB(A100·H100)다. v2 변경점(\"컴퓨트 메모리가 조금씩 줄었음, GPU 메모리는 동일\")과 맞는 것은 교재 값이다.\n\n### NPU 사양 (FuriosaAI RNGD)\n| 항목 | 값 |\n|---|---|\n| Architecture | **Tensor Contraction Processor** |\n| NPU Memory | **48GB** |\n| Memory 대역폭 | HBM3 **1.5 TB/s** |\n| Tensor 성능 | BF16 **256 TFLOPS**, FP8 **512 TFLOPS** |\n| Interconnect | **PCIe Gen5 x16** |\n\n### 서버 타입 표기\n| 타입 | 내용 |\n|---|---|\n| g1 (GPU-A100-1) | GPU당 CUDA 6,912·Tensor 432, 최대 **128 vCPU / 1,872GB**, 600GB/s NVSwitch P2P |\n| g2 (GPU-H100-2) | GPU당 CUDA 16,896·Tensor 528, 최대 **96 vCPU / 1,872GB**, 900GB/s NVSwitch P2P |\n| g3 (GPU-B300-3) | GPU당 CUDA 18,944·Tensor 640, 최대 **128 vCPU / 3,840GB**, 1.8TB/s NVSwitch P2P |\n| n1 (NPU-RNGD-1) | RNGD **최대 8개**, 최대 **64 vCPU / 848GB**, HBM3 메모리, PCIe Gen5 |\n\n### GPU 서버 특징과 용도\n- **GPU 1, 2, 4개**: 중소규모 워크로드(**LLM 서빙, 분석 및 진단** 등)\n- **GPU 8개**: **NVLink, NVSwitch** 적용, 고성능 워크로드\n- Pass-through로 **물리 서버 수준** 성능, CUDA Core·Tensor Core·NVLink·NVSwitch로 안정적이고 빠른 성능\n- **MIG(Multi Instance GPU)**: GPU 하나를 **최대 7개**의 독립 GPU Instance로 안전하게 분할(GPU Instance 0~6이 각각 SM·L2·DRAM 경로를 나눠 USER별 할당)\n\n## Accelerated Server 생성 (Accelerated Server > 목록 > 생성)\n학습정리 순서: 이미지·버전 → 서버 수량·서버 타입 → Block Storage → 서버명 → VPC·Subnet → Security Group → Key Pair·Lock → Init Script\n- 사전 작업: VPC 환경(VPC, Subnet, IGW), 접속 보안(Firewall, Security Group)\n\n| 순서 | 항목 | 내용·제약 |\n|---|---|---|\n| 1 | 이미지·버전 | **표준 / Custom / Kubernetes** 이미지, **RHEL, Ubuntu**. 버전을 고르면 사용 가능한 서버 타입과 빌드 날짜 표시 |\n| 2 | 서버 수 | 동시 생성 **1~100개** |\n| 3 | 서비스 유형 | 서버 타입 **GPU-A100-1 / GPU-H100-2 / GPU-B300-3 / NPU-RNGD-1**, **Planned Compute 1·3년** |\n| 4 | Block Storage(OS) | SSD / SSD_KMS / SSD_Provisioned. SSD_KMS는 전송 암호화 추가, 최초 생성 시에만, 변경 불가, 성능 저하 가능. **1 Unit=8GB, 3~1,536 입력**. Delete on termination. 추가 볼륨은 **MultiAttach** 선택 가능 |\n| 5 | 서버명 | 1대면 서버명, 2대 이상이면 prefix |\n| 6 | 포트 | 신규 생성 또는 기존 지정 |\n| 7 | 네트워크 | VPC, 일반 Subnet, IP(자동/입력), NAT, 로컬 Subnet |\n| 8 | Security Group | 미설정 시 **모든 접속 차단** |\n| 9 | Keypair | |\n| 10 | Lock | 해지/시작/중지 방지 |\n| 11 | Init Script | **Linux: 쉘 스크립트, Cloud-init**(Windows 없음) |\n\n> [!시험]\n> NVSwitch는 자동으로 켜지지 않는다. **GPU 8개를 모두 쓰는 서버 타입**을 신청한 뒤 **NVIDIA Fabric Manager를 설치**해 활성화해야 한다(학습정리: \"NVSwitch 활성화 수동작업 필요\").\n\n### MIG 사용 절차\n1. **GPU Server 생성**(콘솔)\n2. **MIG 활성화**: 서버 접속 → nvidia 명령어로 MIG Enable → **리부팅**\n3. **GPU Instance 생성**: nvidia 명령어로 생성\n4. (필요 시) **Compute Instance 생성**: GPU Instance 안에 생성\n5. **MIG 사용**: MIG Instance로 Job 수행\n\n
