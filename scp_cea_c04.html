: "Firewall 크기", "q": "SCP(Samsung Cloud Platform) Firewall의 생성과 크기에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Firewall은 별도로 생성하지 않고, Internet Gateway, Direct Connect, Load Balancer 등 적용 대상 서비스를 생성할 때 함께 생성된다.", "적용 대상 서비스 생성 시 Firewall 사용을 체크하지 않아도 Firewall은 미사용 상태로 생성된다.", "Firewall은 기본적으로 Extra Small 크기로 생성되며, 크기를 수정하면 최대 규칙 수와 요금이 함께 변경된다.", "Large 크기 Firewall의 최대 규칙 수는 1,000개이다.", "Medium 크기 Firewall의 최대 규칙 수는 200개이다."], "a": 3, "e": "크기별 최대 규칙 수는 Extra Small 5개, Small 100개, Medium 200개, Large 500개, Extra Large 1,000개입니다. 1,000개는 Extra Large에 해당합니다.", "src": "SCP_v2_Explore_Network_01-10 Firewall 슬라이드5·7·8", "id": "3-1d-03"}, {"item": "3-1d", "t": "Security Group 특성", "q": "SCP(Samsung Cloud Platform) v2의 Security Group에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Security Group은 VPC 단위로 생성되어 해당 VPC에 속한 모든 Subnet의 자원에 일괄 적용된다.", "Security Group 하나에는 규칙을 최대 100개까지 생성할 수 있다.", "Security Group 로그를 저장하려면 로그 저장소로 사용할 Object Storage 버킷을 먼저 설정해야 한다.", "Port 생성 시 적용할 Security Group을 최대 5개까지 선택할 수 있다.", "각 자원의 포트에 적용되며, 자원 특성에 따라 여러 개의 Security Group을 적용할 수 있다."], "a": 0, "e": "SCP v2에서 Security Group은 서버의 포트에 연결되는 구조로 바뀌었고 VPC와는 무관하므로, VPC나 Subnet 단위로 일괄 적용되지 않습니다. 규칙 수는 Security Group당 100개, Account당 1,000개가 한도입니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드15, Security Group 슬라이드5·7·8, VPC 슬라이드31", "id": "3-1d-04"}, {"item": "3-1e", "t": "SG 규칙 실습", "q": "A 고객사 Web 서버(10.0.1.20)의 포트에는 아래 Security Group 하나만 적용되어 있습니다. 이 Security Group에 의해 허용되는 통신은 다음 중 무엇입니까? (Firewall 등 다른 구간은 모두 허용되어 있다고 가정)", "o": ["같은 Subnet의 서버 10.0.1.21에서 Web 서버로 보내는 Ping(ICMP) 요청", "Bastion Server(10.0.9.10)에서 Web 서버로의 SSH 접속", "관리자 PC(203.0.113.7)에서 Web 서버로의 직접 SSH 접속", "Web 서버에서 외부 패키지 저장소로 보내는 HTTP(80) 업데이트 요청", "LB Service IP(10.0.1.100)에서 Web 서버 TCP 80으로의 직접 접속"], "a": 1, "e": "Security Group은 기본적으로 같은 Subnet 내 Ping·SSH를 포함한 모든 트래픽을 차단하고, 명시적으로 허용한 규칙만 통과시킵니다. Inbound는 Bastion IP의 TCP 22와 LB Source NAT IP의 TCP 80만 허용되고, Outbound는 443만 허용되어 HTTP(80) 업데이트는 차단됩니다.", "src": "SCP_v2_Explore_Network_01-10 Security Group 슬라이드5·12·13, Load Balancer 슬라이드9", "s": "[Web-SG 규칙]\n1) Inbound | TCP 22 | CIDR 10.0.9.10/32 (Bastion Server)\n2) Inbound | TCP 80 | CIDR 10.0.1.5/32 (LB Source NAT IP)\n3) Outbound | TCP 443 | CIDR 0.0.0.0/0\n그 밖의 규칙 없음", "id": "3-1e-01"}, {"item": "3-1e", "t": "LB 멤버 SG 규칙", "q": "SCP(Samsung Cloud Platform) Load Balancer의 LB 서버 그룹에 멤버로 추가한 Virtual Server가 정상적으로 트래픽을 받으려면, 멤버 서버의 Security Group에 어떤 규칙을 추가해야 합니까? (대상 주소 / 프로토콜 / 허용 포트 / 방향)", "o": ["LB Service IP / Listener 프로토콜 / Listener 서비스 포트 / Inbound", "클라이언트 IP / LB 서버 그룹 프로토콜 / 멤버 포트 / Inbound", "LB의 Source NAT IP / LB 서버 그룹 프로토콜 / 멤버 포트 / Outbound", "LB Health Check IP / Listener 프로토콜 / Listener 서비스 포트 / Outbound", "LB의 Source NAT IP / LB 서버 그룹 프로토콜 / 멤버 포트 / Inbound"], "a": 4, "e": "LB는 Source NAT IP로 멤버와 통신합니다. 그래서 멤버의 Security Group에는 'LB Source NAT IP, LB 서버 그룹 프로토콜, 멤버 포트, Inbound' 규칙 1개를 추가합니다. 클라이언트 IP와 Service IP는 LB Firewall 규칙에 쓰는 값입니다.", "src": "SCP_v2_Explore_Network_01-10 Load Balancer 슬라이드9·18·20, Security Group 슬라이드12", "id": "3-1e-02"}, {"item": "3-1e", "t": "SG 규칙 추가", "q": "SCP(Samsung Cloud Platform) Security Group의 규칙 추가에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["규칙 원격 타입은 IP를 직접 입력하는 CIDR 방식과 기존에 생성된 Security Group을 선택하는 방식 중에서 고른다.", "규칙마다 트래픽 방향을 Inbound(외부 → 서버) 또는 Outbound(서버 → 외부)로 지정한다.", "규칙의 대상 주소에는 IP뿐 아니라 Domain도 입력할 수 있으며, 쉼표(,)와 대시(-)로 여러 주소를 한 번에 입력한다.", "엑셀 양식을 이용해 규칙을 최대 100개까지 일괄 입력할 수 있다.", "시스템 업데이트를 위해 서버에서 인터넷으로 나가는 HTTP/HTTPS는 대상 주소를 0.0.0.0/0으로 하는 Outbound 규칙으로 허용한다."], "a": 2, "e": "Domain 입력과 쉼표·대시를 이용한 다중 주소 입력은 Firewall 규칙의 기능입니다. Security Group은 원격 타입으로 CIDR 또는 Security Group을 지정합니다.", "src": "SCP_v2_Explore_Network_01-10 Security Group 슬라이드10·11·13, Firewall 슬라이드11", "id": "3-1e-03"}, {"item": "3-1f", "t": "Firewall 규칙 평가 실습", "q": "다음은 SCP(Samsung Cloud Platform) Internet Gateway Firewall의 Inbound 규칙 목록으로, 위에서부터 순서대로 나열되어 있습니다. 이 Firewall의 트래픽 처리에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["198.51.100.7에서 10.0.1.10으로의 SSH는 허용된다.", "203.0.113.50에서 10.0.1.10으로의 SSH는 2번 규칙에 의해 허용된다.", "198.51.100.7에서 10.0.1.10으로의 HTTPS(443)는 3번 규칙에 의해 허용된다.", "일치하는 규칙이 없는 트래픽은 기본적으로 허용된다.", "203.0.113.50의 SSH를 허용하려면 2번 규칙을 '마지막 규칙 뒤'로 옮기면 된다."], "a": 0, "e": "Firewall 규칙은 위에서 아래로 평가하고 처음 일치한 규칙의 동작을 적용합니다. 그래서 203.0.113.50은 1번 Deny에 먼저 걸립니다. 일치하는 규칙이 없으면 기본 규칙(Any Deny)으로 차단되고, 3번은 목적지가 10.0.1.100인 트래픽에만 적용됩니다.", "src": "SCP_v2_Explore_Network_01-10 Firewall 슬라이드5·14", "s": "순번 | 출발지 | 목적지 | 프로토콜/포트 | 동작\n1 | 203.0.113.0/24 | 10.0.1.10 | TCP 22 | Deny\n2 | 203.0.113.50 | 10.0.1.10 | TCP 22 | Allow\n3 | Any | 10.0.1.100 | TCP 443 | Allow\n4 | 198.51.100.7 | 10.0.1.10 | TCP 22 | Allow\n(위 규칙에 해당하지 않는 트래픽은 기본 규칙 적용)", "id": "3-1f-02"}, {"item": "3-1f", "t": "Firewall 규칙 입력", "q": "SCP(Samsung Cloud Platform) Firewall의 규칙 추가에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["규칙을 추가할 때 마지막 규칙 뒤, 또는 지정한 규칙의 앞이나 뒤로 위치를 정할 수 있다.", "출발지·목적지 주소는 CIDR 형식으로 입력하며, 목적지 주소는 IP뿐 아니라 Domain으로도 입력할 수 있다.", "유형으로 ALL을 선택하면 프로토콜과 포트를 모두 허용한다.", "일괄 입력 파일의 규칙 수가 Firewall 크기별 최대 규칙 수를 넘으면, 초과한 규칙만 빼고 나머지 규칙이 등록된다.", "규칙마다 트래픽의 Allow 또는 Deny를 선택한다."], "a": 3, "e": "Firewall 크기별 최대 규칙 수를 넘으면 파일 자체를 업로드할 수 없으며, 규칙이 더 필요하면 Firewall 크기를 변경해야 합니다. 목적지 주소의 Domain 입력은 Security Group에는 없는 Firewall 규칙의 특징입니다.", "src": "SCP_v2_Explore_Network_01-10 Firewall 슬라이드8·11·12", "id": "3-1f-03"}, {"item": "3-1f", "t": "Firewall 규칙 순서 설계", "q": "D 고객사는 Internet Gateway Firewall에서 협력사 대역 192.0.2.0/24의 SSH(TCP 22) Inbound 접속은 허용하되, 보안 사고가 발생한 192.0.2.99는 차단하려 합니다. 요구사항을 만족하는 규칙 구성(위에서부터 순서대로)은 무엇입니까?", "o": ["1) 192.0.2.0/24 → TCP 22 Allow, 2) 192.0.2.99 → TCP 22 Deny", "1) 192.0.2.99 → TCP 22 Deny, 2) 192.0.2.0/24 → TCP 22 Allow", "1) 192.0.2.99 → TCP 22 Deny 규칙만 추가하고 나머지 대역은 기본 규칙에 맡긴다.", "1) Any → TCP 22 Deny, 2) 192.0.2.0/24 → TCP 22 Allow, 3) 192.0.2.99 → TCP 22 Deny", "1) 192.0.2.0/24 → TCP 22 Allow 규칙만 추가하고 192.0.2.99는 기본 규칙으로 차단되게 한다."], "a": 1, "e": "처음 일치한 규칙이 적용되므로 예외인 Deny 규칙을 넓은 범위의 Allow 규칙보다 위에 두어야 합니다. 기본 규칙이 Any Deny라서 Deny만 추가하면 대역 전체가 차단되고, Allow만 두면 192.0.2.99도 허용됩니다.", "src": "SCP_v2_Explore_Network_01-10 Firewall 슬라이드5·11·14", "id": "3-1f-04"}, {"item": "3-1g", "t": "VPN 생성", "q": "온프레미스와 SCP(Samsung Cloud Platform)의 Virtual Server를 VPN으로 연결하려 합니다. VPN 생성 및 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["VPN Gateway의 연결 VPC로는 Internet Gateway가 연결된 VPC를 선택한다.", "VPN Gateway가 원격지와 통신하는 데 쓸 Public IP는 VPC > Public IP에서 미리 예약해 두어야 한다.", "VPN Tunnel에는 연결할 외부 VPN 게이트웨이의 IP(Peer VPN GW IP)와 원격지 서브넷(Remote Subnet)을 CIDR로 입력한다.", "Pre-shared Key는 VPN 게이트웨이 간 IKE 상호 인증에 쓰이므로 미리 정해서 상대측과 공유해야 한다.", "VPN Gateway는 Account당 5개, VPN Tunnel은 VPN Gateway당 3개까지 생성할 수 있다."], "a": 4, "e": "Quota는 VPN Gateway가 Account당 3개, VPN Tunnel이 VPN Gateway당 5개로, 보기의 수치는 서로 뒤바뀌었습니다.", "src": "SCP_v2_Explore_Network_01-10 VPN 슬라이드5·8·9", "id": "3-1g-01"}, {"item": "3-1g", "t": "VPN 용어", "q": "SCP(Samsung Cloud Platform) VPN Tunnel 설정에 쓰이는 용어에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["IKE v2는 IKE v1보다 메시지 교환이 간소화되어 빠르고, 최신 알고리즘을 지원해 보안이 강화되었다.", "Diffie-Hellman 그룹은 번호가 클수록 보안은 강해지지만 계산 속도는 느려진다.", "IPsec은 VPN 터널을 만들기 위한 인증, 암호화 키 교환, 보안 정책 협상을 자동화하는 프로토콜이다.", "PFS(Perfect Forward Secrecy)는 세션마다 새 암호화 키를 생성해, 키 하나가 유출되어도 전체 데이터가 노출되지 않게 한다.", "DPD Probe Interval은 원격 VPN 장비의 활성 상태를 확인하기 위해 메시지를 보내는 간격이다."], "a": 2, "e": "이 설명은 IKE(Internet Key Exchange)에 해당합니다. IPsec은 실제 트래픽 전송 단계에서 데이터 패킷을 암호화·인증하여 무결성과 기밀성을 보장합니다.", "src": "SCP_v2_Explore_Network_01-10 VPN 슬라이드6·11", "id": "3-1g-02"}, {"item": "3-1g", "t": "VPN 시나리오", "q": "B 공공기관은 기관 내부망의 업무 서버와 SCP(Samsung Cloud Platform)의 Virtual Server를 프라이빗하게 연결하려 합니다. 연결 지점이 정해져 있고 데이터가 지속적으로 오가며, 규정상 전송 데이터는 반드시 암호화해야 합니다. 또한 초기 비용을 낮추고 빠르게 구축하길 원합니다. B 공공기관을 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["SCP v2의 VPN은 특정 서버 단위로 연결되므로, 연결할 Virtual Server마다 VPN Gateway를 하나씩 생성한다.", "기관 망과 SCP를 IPsec 방식의 VPN으로 연결하여 전송 데이터를 암호화한다.", "VPN 터널을 이중화하여 단일 장애 지점을 제거한다.", "관리자는 VPN으로 Bastion Server에 프라이빗하게 접속한 뒤, Bastion Server를 경유해 각 서버를 관리한다.", "대용량·고대역폭이 필요하지 않은 중소 규모 연결이므로 Direct Connect보다 VPN을 우선 검토한다."], "a": 0, "e": "SCP v2에서 VPN은 특정 서버 단위 연결에서 VPC 단위 연결로 바뀌었고, VPN Gateway를 만들 때 연결할 VPC를 선택합니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드15·18·19, VPN 슬라이드8·24; WA백서 02 p.23, p.26-27", "id": "3-1g-03"}, {"item": "3-1h", "t": "Direct Connect", "q": "SCP(Samsung Cloud Platform)의 Direct Connect에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["고객사 Uplink 회선 연결을 SR로 신청하며, 자원 확보와 구성이 끝난 뒤 서비스가 제공된다.", "고객사 라우터에는 BGP 라우팅 프로토콜이 필요하다.", "Uplink 포트 용량은 1G, 10G, 20G, 40G 중에서 선택한다.", "인터넷을 경유하는 IPsec 암호화 터널로 고객 네트워크와 VPC를 연결한다.", "Direct Connect Firewall이 제공되며, Firewall 로그를 저장하려면 Object Storage를 먼저 생성해야 한다."], "a": 3, "e": "Direct Connect는 물리적 전용 회선으로 연결하며, 물리적으로 분리되어 보안성이 우수합니다. 인터넷 기반 IPsec 암호화 터널은 VPN의 연결 방식입니다.", "src": "SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드13·15·24", "id": "3-1h-01"}, {"item": "3-1h", "t": "Direct Connect 규칙 실습", "q": "F 고객사는 VPC(10.1.0.0/16)와 온프레미스(192.168.0.0/16)를 Direct Connect로 연결했습니다. 이 VPC에는 Internet Gateway도 연결되어 있습니다. 다음 중 Direct Connect 규칙으로 추가할 수 있는 것은 무엇입니까?", "o": ["목적지: VPC / 목적지 IP: 0.0.0.0/0", "목적지: VPC / 목적지 IP: 10.1.10.0/24", "목적지: 원격지 / 목적지 IP: 10.1.0.0/24", "목적지: 원격지 / 목적지 IP: 0.0.0.0/0", "목적지: VPC / 목적지 IP: 192.168.1.0/24"], "a": 1, "e": "목적지가 VPC이면 VPC IP 대역 범위 안에서만 입력할 수 있고 0.0.0.0/0은 쓸 수 없습니다. 목적지가 원격지이면 VPC IP 대역을 입력할 수 없으며, 원격지 0.0.0.0/0은 VPC에 IGW가 연결되지 않은 경우에만 가능합니다.", "src": "SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드16", "id": "3-1h-02"}, {"item": "3-1h", "t": "Private NAT", "q": "제조사 G는 Direct Connect로 온프레미스와 SCP(Samsung Cloud Platform) VPC를 연결했습니다. VPC 자원이 고객사망으로 나갈 때 고객사망에서 지정한 IP로 매핑되어 통신하도록 Private NAT를 구성하려 합니다. Private NAT에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Direct Connect가 선행 작업으로 생성되어 있어야 한다.", "Private NAT 생성 시 Direct Connect를 선택하면 연결 VPC가 자동으로 선택된다.", "NAT IP 대역은 CIDR /22 ~ /27 범위 안에서 입력할 수 있다.", "NAT IP 대역은 연결된 VPC 대역이나, Direct Connect와 연결된 온프레미스 IP 대역과 겹치면 안 된다.", "Private NAT IP는 Internet Gateway를 통해 인터넷으로 나가는 트래픽에도 사용할 수 있다."], "a": 4, "e": "Private NAT는 외부 인터넷이 아닌 사설 네트워크로만 트래픽을 전달합니다. Direct Connect를 거쳐 고객사망으로 나갈 때 Private NAT IP로 통신합니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드42·44", "id": "3-1h-03"}, {"item": "3-1i", "t": "Transit Gateway", "q": "SCP(Samsung Cloud Platform)의 Transit Gateway에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["고객 네트워크와 SCP 네트워크를 연결하고, 클라우드 안의 여러 VPC를 잇는 연결 허브 역할을 한다.", "Uplink 회선 연결을 위해 SR을 요청해야 하며, 고객사 라우터에는 BGP 라우팅 프로토콜이 필요하다.", "TGW 규칙에서 목적지가 VPC인 경우 0.0.0.0/0을 입력하여 모든 트래픽을 VPC로 보낼 수 있다.", "Bare Metal VPC와 연결할 때는 BM VPC Firewall이 제공되며, 이를 위해 SR 요청이 필요하다.", "TGW 규칙에서 목적지가 TGW인 경우에는 VPC IP 대역 범위를 입력할 수 없다."], "a": 2, "e": "목적지가 VPC이면 VPC IP 대역 범위 안에서만 입력할 수 있고 0.0.0.0/0은 쓸 수 없습니다.", "src": "SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드18·20·22", "id": "3-1i-01"}, {"item": "3-1i", "t": "TGW 구성 순서", "q": "온프레미스와 여러 VPC를 SCP(Samsung Cloud Platform)의 Transit Gateway로 연결하려 합니다. 작업 순서를 올바르게 나열한 것은 무엇입니까?", "o": ["ㄱ → ㄴ → ㄷ", "ㄱ → ㄷ → ㄴ", "ㄴ → ㄱ → ㄷ", "ㄷ → ㄱ → ㄴ", "ㄷ → ㄴ → ㄱ"], "a": 3, "e": "작업 순서는 TGW 생성(Uplink SR 요청 포함) → TGW-VPC 연결 생성 → TGW 규칙 추가입니다. 규칙은 연결된 VPC 중에서 골라 추가하므로 VPC가 먼저 연결되어 있어야 합니다.", "src": "SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드20·21·22·27", "s": "ㄱ. 상세정보의 연결 VPC 관리 탭에서 연결할 VPC를 추가한다.\nㄴ. 연결 VPC를 선택하고 방향(TGW→VPC 또는 VPC→TGW)과 목적지 IP 대역을 지정해 규칙을 추가한다.\nㄷ. Transit Gateway 이름을 입력해 생성하고, Uplink 회선 연결을 위한 SR을 요청한다.", "fix": true, "id": "3-1i-02"}, {"item": "3-1i", "t": "TGW 시나리오", "q": "H 고객사는 온프레미스 데이터센터와 SCP(Samsung Cloud Platform)의 VPC 4개(운영·개발·공통·DMZ)를 모두 프라이빗하게 연결하고, VPC 간 통신도 중앙에서 관리하려 합니다. H 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Direct Connect 1개를 생성해 4개 VPC에 모두 연결하면 Transit Gateway 없이도 온프레미스와 4개 VPC를 연결할 수 있다.", "Transit Gateway를 중앙 허브로 두고 4개 VPC를 연결하여, 온프레미스-VPC 연결과 VPC 간 연결을 통합 관리한다.", "Transit Gateway는 생성 요금, 트래픽 요금, 포트 이용료가 발생하므로 연결 구성의 복잡도를 고려해 도입한다.", "각 VPC의 CIDR 블록은 온프레미스 및 다른 VPC와 IP가 충돌하지 않도록 설계한다.", "나중에 글로벌 리전과 해외 거점 연결이 필요해지면 Transit Gateway와 Cloud WAN을 함께 활용한다."], "a": 0, "e": "Direct Connect는 고객 네트워크와 단일 VPC를 1:1로 연결합니다. 여러 VPC를 1:N으로 잇는 허브 역할은 Transit Gateway가 맡습니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드17·19·20, VPN/Direct Connect/Transit Gateway 슬라이드13·24", "id": "3-1i-03"}, {"item": "3-1j", "t": "VPC Peering 구성", "q": "SCP(Samsung Cloud Platform)의 VPC Peering 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["서로 다른 VPC 사이를 프라이빗 IP 주소로 연동하는 사설 네트워크 연결이다.", "요청 VPC에 규칙을 추가하면 승인 VPC 방향의 규칙은 자동으로 생성되므로 한쪽만 설정하면 된다.", "VPC Peering을 생성할 때 요청 VPC와 승인 VPC를 선택한다.", "규칙을 추가할 때 출발지 VPC를 선택하면 목적지 VPC가 자동으로 설정된다.", "규칙의 목적지 IP 대역은 목적지 VPC의 IP 대역 안에서 입력한다."], "a": 1, "e": "VPC Peering은 요청 VPC와 승인 VPC 양쪽에 각각 라우팅 규칙을 설정해야 통신할 수 있습니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드37·39·40", "id": "3-1j-01"}, {"item": "3-1j", "t": "Peering과 LB 멤버", "q": "I 고객사는 VPC-A에 만든 Load Balancer의 LB 서버 그룹에 VPC-B에 있는 Virtual Server를 멤버로 추가하려 합니다. 올바른 방법은 무엇입니까?", "o": ["LB 서버 그룹의 대상 서버에서 Virtual Server를 선택하면 다른 VPC의 서버도 바로 조회되어 추가할 수 있다.", "VPC-B 서버에 Private NAT IP를 예약한 뒤 그 IP를 멤버로 등록한다.", "VPC-A와 VPC-B를 VPC Peering으로 연결한 뒤, 멤버를 'IP로 직접 입력' 방식으로 등록한다.", "LB 서버 그룹을 VPC-B의 Subnet에 새로 만들어 VPC-A의 Load Balancer Listener에 연결한다.", "VPC-B 서버에 Public IP를 연결하고, Internet Gateway를 경유하도록 멤버를 등록한다."], "a": 2, "e": "다른 VPC의 서버를 멤버로 등록하려면 VPC Peering으로 연결한 뒤 IP 직접 입력으로 등록합니다. LB, Listener, LB 서버 그룹, 헬스 체크는 모두 같은 Subnet에 구성해야 하고, 멤버만 Subnet 제약이 없습니다.", "src": "SCP_v2_Explore_Network_01-10 Load Balancer 슬라이드5·13", "id": "3-1j-02"}, {"item": "3-1j", "t": "VPC Peering 시나리오", "q": "J 고객사는 같은 리전에 있는 VPC-A(웹 서비스)와 VPC-B(사내 공통 서비스) 두 개만 사설 IP로 연결하려 하며, 비용을 최소화하고 싶어 합니다. J 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["단순한 1:1 VPC 연결이므로 Transit Gateway 대신 트래픽 비용만 발생하는 VPC Peering을 구성한다.", "두 VPC의 IP 대역(CIDR)이 겹치지 않도록 설계한다.", "VPC Peering 구간의 트래픽은 각 Virtual Server의 Security Group 규칙으로 필요한 포트만 허용한다.", "고가용성이 꼭 필요하지 않은 구간은 같은 AZ에 배치해 AZ 간 트래픽 비용을 줄인다.", "VPC Peering 구간에 Peering 전용 Firewall을 만들어 VPC 간 트래픽을 Allow/Deny 규칙으로 제어한다."], "a": 4, "e": "VPC Peering 구간에는 별도의 Firewall이 제공되지 않으며, Virtual Server의 Security Group으로 트래픽을 제어합니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드15·17·19, VPC 슬라이드37", "id": "3-1j-03"}, {"item": "3-1k", "t": "VPC Endpoint", "q": "SCP(Samsung Cloud Platform)의 VPC Endpoint에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["VPC와 연결된 외부 네트워크에서 인터넷에 노출하지 않는 Private 연결을 통해 SCP에 액세스할 수 있는 VPC 진입점을 제공한다.", "Direct Connect, Transit Gateway와 연결된 고객사 내부망에서 VPC 외부의 서비스에 프라이빗하게 연결할 수 있다.", "VPC Endpoint를 생성하려면 선행 작업으로 VPC Endpoint 유형의 Subnet을 먼저 생성해야 한다.", "VPC Endpoint Subnet은 Primary Subnet을 먼저 생성한 후, 하위에 동일 유형의 Secondary Subnet을 추가해 확장할 수 있다.", "VPC Endpoint IP는 Endpoint Subnet 대역 내에서 직접 입력하며, 관리용 IP나 이미 사용 중인 IP는 사용할 수 없다."], "a": 3, "e": "Subnet 생성 시 VPC Endpoint 유형은 Primary Subnet만 제공되므로 Secondary Subnet을 추가할 수 없습니다. Public/Private/Local 유형만 Primary 하위에 Secondary Subnet을 만들 수 있다는 점과 구분해야 합니다.", "src": "SCP_v2_Explore_Network_01-10.md VPC 슬라이드14, 33, 35", "id": "3-1k-01"}, {"item": "3-1k", "t": "VPC Endpoint 시나리오", "q": "A 고객사는 온프레미스 데이터센터와 SCP(Samsung Cloud Platform) VPC를 Direct Connect로 연결해 사용하고 있습니다. 보안 정책상 온프레미스에서 Object Storage로 백업 데이터를 보낼 때 인터넷을 경유해서는 안 됩니다. A 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["VPC Endpoint 생성에 앞서 해당 VPC에 VPC Endpoint 유형의 Subnet을 생성한다.", "Object Storage 접근 경로 확보를 위해 VPC에 Internet Gateway와 NAT Gateway를 생성하고 백업 트래픽을 NAT Gateway로 내보낸다.", "VPC Endpoint 생성 시 사용 용도에서 대상 서비스로 Object Storage를 선택한다.", "VPC Endpoint IP는 Endpoint Subnet 대역 안에서 사용 중이지 않은 IP로 지정한다.", "온프레미스 내부망과 VPC 간 연결은 Direct Connect 또는 Transit Gateway를 활용한다."], "a": 1, "e": "VPC Endpoint를 쓰면 인터넷 연결이 없는 VPC에서도 Private 경로로 Object Storage에 접속할 수 있습니다. Internet Gateway·NAT Gateway를 거치게 하는 것은 인터넷 경유 금지 요구사항에 어긋납니다.", "src": "SCP_v2_Explore_Network_01-10.md VPC 슬라이드6, 33, 35", "id": "3-1k-02"}, {"item": "3-1k", "t": "VPC 구성요소 선택", "q": "Direct Connect로 SCP(Samsung Cloud Platform)에 연결된 고객사 내부망에서, VPC 외부에 있는 SCP 서비스(Object Storage, File Storage 등)로 인터넷 노출 없이 프라이빗하게 접속해야 합니다. 이 요구사항에 가장 적합한 VPC 구성요소는 무엇입니까?", "o": ["VPC Endpoint", "Private NAT", "NAT Gateway", "VPC Peering", "Internet Gateway"], "a": 0, "e": "VPC Endpoint는 VPC와 연결된 외부 네트워크가 Private 연결로 SCP 서비스에 액세스하는 진입점입니다. Private NAT는 VPC 내 compute 자원을 Direct Connect로 고객사망 IP에 매핑하는 용도이고, NAT Gateway는 Outbound 인터넷용입니다.", "src": "SCP_v2_Explore_Network_01-10.md VPC 슬라이드33, 48, 49", "id": "3-1k-03"}, {"item": "3-1l", "t": "LB 구성요소", "q": "SCP(Samsung Cloud Platform) Load Balancer의 구성요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["하나의 Load Balancer에 여러 Listener를 추가할 수 있다.", "하나의 서버는 여러 LB 서버 그룹에 멤버로 추가될 수 있다.", "LB 서버 그룹은 여러 Load Balancer에 동시에 연결하여 재사용할 수 있다.", "LB, Listener, LB 서버 그룹, LB 헬스 체크는 모두 같은 Subnet에 구성하지만, 멤버는 Subnet 제약이 없다.", "다른 VPC의 서버를 멤버로 등록하려면 VPC Peering 후 'IP로 직접 입력' 방식으로 등록한다."], "a": 2, "e": "LB 서버 그룹은 하나의 Load Balancer에 연결됩니다. 반면 Listener는 하나의 LB에 여러 개 추가할 수 있고, 서버는 여러 LB 서버 그룹의 멤버가 될 수 있습니다.", "src": "SCP_v2_Explore_Network_01-10.md Load Balancer 슬라이드5, 13", "id": "3-1l-02"}, {"item": "3-1l", "t": "Auto-Scaling LB 연동", "q": "SCP(Samsung Cloud Platform)에서 Virtual Server Auto-Scaling Group과 Load Balancer를 연동하여 고가용성을 구현하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Auto-Scaling Group의 서버는 선택한 LB 서버 그룹의 멤버로 자동 등록된다.", "Draining timeout은 서버를 Load Balancer에서 분리하기 전에 대기하는 시간으로, 기본 300초이다.", "Auto-Scaling Group당 연동 가능한 LB 서버 그룹 및 포트 개수는 최대 3개이다.", "상태 체크를 사용하면 Virtual Server 및 Load Balancer 상태를 확인해 Unhealthy 상태의 서버를 자동으로 교체한다.", "Weighted 부하 분산 방식을 사용하는 LB 서버 그룹도 그대로 선택하여 연동할 수 있다."], "a": 4, "e": "Auto-Scaling Group의 Load Balancer 연동 설정에서는 Weighted 부하 분산을 사용하는 LB 서버 그룹을 선택할 수 없습니다(LB 서버 그룹에서 부하 분산값을 수정해야 합니다). Draining timeout은 1~3,600초 범위로 입력할 수 있습니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드5, Auto-Scaling Group 생성하기(3/4)(4/4)", "id": "3-1l-03"}, {"item": "3-1l", "t": "Kubernetes LB 시나리오", "q": "B 고객사는 Kubernetes Engine에 웹 서비스를 배포하면서 prod.example.com과 dev.example.com 요청을 서로 다른 Service로 보내고, 노드 장애에도 서비스가 유지되도록 구성하려 합니다. B 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Worker Node를 멀티 AZ로 분산 배치하는 노드 배포 전략을 검토한다.", "도메인별 분기를 위해 L4 Load Balancer Listener의 라우팅 규칙에서 호스트 헤더별로 LB 서버 그룹을 지정한다.", "Ingress Controller를 설치하고 Ingress 오브젝트로 host/path 기반 라우팅을 구성한 뒤 Load Balancer와 연동한다.", "L7 Load Balancer를 사용하면 Listener 라우팅 규칙에서 URL 경로나 호스트 헤더를 기준으로 LB 서버 그룹을 지정할 수 있다.", "HTTP 요청을 HTTPS로 전환해야 한다면 L7 Listener의 URL 리디렉션 라우팅 액션을 활용한다."], "a": 1, "e": "L4 Load Balancer의 라우팅 규칙은 'LB 서버 그룹 전달'로 고정되어 호스트 헤더 기반 분기가 불가능합니다. URL 경로·호스트 헤더 라우팅과 URL 리디렉션은 L7 Listener 기능입니다.", "src": "CloudNative1_Container_Services_슬라이드별.md 슬라이드18, 24; SCP_v2_Explore_Network_01-10.md Load Balancer 슬라이드14, 15", "id": "3-1l-04"}, {"item": "3-1m", "t": "GSLB", "q": "SCP(Samsung Cloud Platform)의 GSLB(Global Server Load Balancing)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["헬스 체크 프로토콜로 ICMP, TCP, HTTP, HTTPS 외에 UDP도 선택할 수 있다.", "DNS 기반 트래픽 분산과 장애 감지를 통해 글로벌 서비스의 안정성과 고가용성을 제공한다.", "헬스 체크 설정 항목에는 체크 주기(Interval), 서비스 다운 인지 시간(Timeout), 응답 대기 시간(Probe Timeout), 서비스 포트가 있다.", "GSLB 도메인은 Account당 최대 20개까지 생성할 수 있다.", "GSLB 생성 시 연결 대상 IP 주소와 함께 모니터링을 수행할 위치를 선택한다."], "a": 0, "e": "GSLB 헬스 체크 프로토콜은 ICMP, TCP, HTTP, HTTPS 중에서 선택하며 UDP는 제공되지 않습니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드17, 19, 20", "id": "3-1m-02"}, {"item": "3-1m", "t": "LB vs GSLB", "q": "SCP(Samsung Cloud Platform)의 Load Balancer와 GSLB를 비교한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Load Balancer는 L4(TCP/UDP/TLS)와 L7(HTTP/HTTPS) 유형을 제공한다.", "Load Balancer를 사용하면 여러 VM에 부하를 분산하고, GSLB를 적용하면 요청 부하를 여러 Region(IP 주소)으로 라우팅할 수 있다.", "GSLB는 DNS 응답을 이용해 트래픽을 분산하므로 Primary(Active)/Secondary(Inactive) 형태의 데이터센터 간 구성에 활용할 수 있다.", "GSLB는 클라이언트 Source IP를 해싱하는 IP Hash 알고리즘으로 동일 사용자를 같은 Region에 고정할 수 있다.", "Load Balancer의 부하 분산 방식에는 (Weighted) Round Robin, (Weighted) Least Connection, IP Hash가 있다."], "a": 3, "e": "IP Hash는 Load Balancer의 서버 부하 분산 방식이며, GSLB의 분산 알고리즘은 Ratio와 Round Robin 두 가지입니다.", "src": "SCP_v2_Explore_Network_01-10.md Load Balancer 슬라이드5, 6; DNS/GSLB 슬라이드17; WA백서 04 p.38", "id": "3-1m-03"}, {"item": "3-1m", "t": "GSLB 시나리오", "q": "C 고객사는 한국과 해외 Region에 동일한 웹 서비스를 운영하고 있습니다. 특정 지역에 트래픽이 몰리거나 한 Region의 서버에 장애가 발생해도 사용자가 계속 서비스를 이용할 수 있어야 합니다. C 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["DNS와 GSLB를 함께 활용해 트래픽이 급증한 지역의 요청을 가용한 인접 지역으로 자동 분산한다.", "각 Region 내부에서는 Load Balancer로 여러 VM에 부하를 분산하고, Region 간에는 GSLB로 요청을 라우팅한다.", "GSLB 생성 시 연결 대상은 IP 주소 대신 Virtual Server 이름으로 등록하므로 별도의 IP 확인이 필요 없다.", "GSLB 헬스 체크로 장애가 감지된 연결 대상은 응답에서 제외해 정상 리소스로 우회시킨다.", "이미지·동영상 같은 정적 콘텐츠는 Global CDN을 함께 사용해 사용자와 가까운 엣지에서 전송한다."], "a": 2, "e": "GSLB 생성 시에는 연결 대상의 IP 주소를 입력하고 모니터링 위치를 지정합니다. DNS+GSLB는 특정 서버 장애 시 리소스를 우회시키는 글로벌 확장 전략입니다.", "src": "SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드20; DNS/GSLB 슬라이드17, 19; WA백서 04 p.38", "id": "3-1m-04"}, {"item": "3-1n", "t": "Global CDN", "q": "SCP(Samsung Cloud Platform)의 Global CDN에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["글로벌 네트워크에 분산된 엣지 서버를 통해 웹 서버 또는 Object Storage에 저장된 정적 콘텐츠를 전송한다.", "원본 서버 위치는 원본 서버의 공인 IP로만 입력할 수 있으며, 도메인 이름은 지원하지 않는다.", "원본 콘텐츠 압축 기능을 제공하여 트래픽을 줄이고 응답속도를 개선한다.", "콘텐츠 유효기간(TTL)이 경과하면 엣지 서버에 캐싱된 만료 콘텐츠를 삭제(Purge)한다.", "HTTPS로 원본 서버와 통신해 경로 보안을 강화하고, DDoS 및 웹 기반 공격으로부터 콘텐츠와 사용자를 보호한다."], "a": 1, "e": "원본 서버 위치는 도메인 이름(권장) 또는 원본 서버 공인 IP로 입력합니다. 도메인 이름 입력이 오히려 권장 방식입니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드22, 24", "id": "3-1n-01"}, {"item": "3-1n", "t": "Global CDN 캐싱 정책", "q": "SCP(Samsung Cloud Platform) Global CDN의 캐싱 관련 옵션에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["캐싱 정책 'Honor origin cache-control and expires'는 오리진의 정책을 따른다.", "콘텐츠 전송 정책 '유효한 콘텐츠만 제공'은 TTL이 만료되면 해당 콘텐츠 제공을 종료한다.", "콘텐츠 전송 정책 '캐싱된 모든 콘텐츠 제공'은 TTL과 상관없이 캐싱된 콘텐츠를 모두 제공한다.", "캐시 키를 'Incoming host header'로 설정하면 사용자가 접속한 도메인을 cache key로 사용한다.", "캐싱 정책 'Cache'는 오리진 서버의 Cache-Control 헤더 값을 그대로 따른다."], "a": 4, "e": "캐싱 정책 'Cache'는 Global CDN 제공자의 정책을 따릅니다. 오리진 정책을 따르는 옵션은 'Honor origin ~' 계열입니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드25, 26", "id": "3-1n-02"}, {"item": "3-1n", "t": "계층별 캐싱", "q": "Well-Architected 성능 효율성 관점에서 정보시스템 계층별 캐싱 구현 방법을 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["웹 계층(웹 콘텐츠) – Global CDN을 이용한 콘텐츠 전송", "애플리케이션 계층(사용자 세션 데이터) – CacheStore를 이용한 상태 관리", "데이터베이스 계층(데이터) – CacheStore를 이용한 데이터 캐싱", "애플리케이션 계층(사용자 세션 데이터) – Global CDN 엣지 서버에 세션을 캐싱하여 상태 관리", "데이터베이스 계층(데이터) – Replica 구성을 통한 읽기 부하 오프로드"], "a": 3, "e": "Global CDN은 이미지·동영상·html 같은 정적 웹 콘텐츠 전송을 위한 웹 계층 캐싱이며, 사용자 세션 같은 상태 데이터는 CacheStore로 관리합니다.", "src": "WA백서 04 p.36", "id": "3-1n-03"}, {"item": "3-1o", "t": "DNS 레코드", "q": "SCP(Samsung Cloud Platform) DNS의 레코드에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["A 레코드는 도메인 이름에 해당하는 IPv4 주소를 지정한다.", "MX 레코드는 우선 순위와 메일 서버 주소를 입력해 도메인의 메일 서버를 지정한다.", "NS 레코드와 SOA 레코드는 Hosted Zone에서 레코드를 추가할 때 사용자가 유형을 직접 선택해 생성한다.", "CNAME 레코드는 도메인 이름에 대한 별명(Alias)을 지정한다.", "SPF 레코드는 스팸메일 방지를 위해 메일 송신 서버의 IP 주소나 도메인 이름 등을 검증한다."], "a": 2, "e": "NS와 SOA 레코드는 자동 생성됩니다. 레코드 추가 시 직접 선택할 수 있는 유형은 A, AAAA, SPF, CNAME, MX, TXT입니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드6, 12", "id": "3-1o-01"}, {"item": "3-1o", "t": "Private DNS 절차", "q": "A 리전과 B 리전의 VPC에서 동일한 내부 도메인을 사용하기 위한 SCP(Samsung Cloud Platform) Private DNS 설정 절차를 올바른 순서로 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄷ → ㄹ → ㄱ → ㅁ", "ㄴ → ㄹ → ㄱ → ㅁ → ㄷ", "ㄷ → ㄴ → ㄹ → ㄱ → ㅁ", "ㄴ → ㄱ → ㄹ → ㅁ → ㄷ", "ㄷ → ㄴ → ㄱ → ㄹ → ㅁ"], "a": 1, "e": "Private DNS를 생성한 리전에서 VPC를 연결하고, 다른 리전에서는 '활성화' 후 그 리전 VPC를 연결합니다. Hosted Zone(용도 Private) 생성과 레코드 등록은 그 다음 단계입니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드8~12", "s": "ㄱ. B 리전에서 Private DNS '활성화'\nㄴ. A 리전에서 Private DNS 생성\nㄷ. Private Hosted Zone 생성 및 레코드 등록\nㄹ. A 리전 내 VPC 연결\nㅁ. B 리전 내 VPC 연결", "fix": true, "id": "3-1o-02"}, {"item": "3-1o", "t": "Public Domain Name", "q": "SCP(Samsung Cloud Platform) DNS의 Public Domain Name과 Hosted Zone에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Public Domain Name은 1개월 단위로 구매하며, 자동 연장을 설정하면 1개월씩 자동 연장된다.", "Public Domain Name은 Public Domain Name 업체인 Whois사와 연계하여 신청한다.", "Public Domain Name 신청 시 최상위 도메인(TLD)을 선택한 후 2차 도메인(SLD)을 입력하고 사용 가능 여부를 조회한다.", "Public용 Hosted Zone 생성 시 용도구분을 'Public'으로 선택하고 SCP를 통해 신청한 Public Domain Name을 선택한다.", "전용망용 Hosted Zone은 Private DNS에 연결된 VPC를 대상으로 내부 도메인을 생성·관리한다."], "a": 0, "e": "Public Domain Name은 1년 단위로 구매하며, 자동 연장도 1년 단위로 이루어집니다.", "src": "SCP_v2_Explore_Network_01-10.md DNS/GSLB/Global CDN 슬라이드5, 13, 14", "id": "3-1o-03"}, {"item": "3-1p", "t": "VPN·DC·TGW 비교", "q": "SCP(Samsung Cloud Platform)의 VPN, Direct Connect, Transit Gateway를 비교한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["VPN은 인터넷을 경유하는 IPsec 암호화 터널로 연결하며, 구축이 비교적 쉽고 비용이 상대적으로 낮다.", "Direct Connect는 물리적 전용 회선으로 연결하므로, 물리적 분리에 따른 보안성이 우수하다.", "Direct Connect와 Transit Gateway는 모두 Uplink 회선 연결을 위한 SR 신청이 필요하고, 고객사 라우터에 BGP 라우팅 프로토콜이 필요하다.", "Transit Gateway는 중앙 허브 방식의 1:N 구성으로 여러 네트워크를 연결하므로 구성 복잡도가 높다.", "VPN은 Direct Connect와 마찬가지로 물리적 회선 작업이 필요하지만, 대역폭이 높아 대용량 전송에 유리하다."], "a": 4, "e": "VPN은 인터넷 기반 암호화 터널이므로 물리적 작업 없이 비교적 쉽게 구축하며, 대역폭은 상대적으로 낮습니다. 물리적 작업이 필요한 것은 Direct Connect와 Transit Gateway입니다.", "src": "SCP_v2_Explore_Network_01-10.md VPN/DC/TGW 슬라이드5, 13, 18, 24", "id": "3-1p-02"}, {"item": "3-1p", "t": "TGW 선택", "q": "D 고객사는 본사 IDC와 SCP(Samsung Cloud Platform)의 VPC 4개를 연결해야 합니다. 대용량 트래픽을 안정적으로 전송해야 하고, 향후 VPC 간 연결도 중앙에서 한 번에 관리하고자 합니다. D 고객사의 요구사항에 가장 적합한 서비스는 무엇입니까?", "o": ["VPN", "Direct Connect", "Transit Gateway", "VPC Peering", "Private NAT"], "a": 2, "e": "Transit Gateway는 고객 네트워크 연결과 여러 VPC 간 연결 허브 역할을 하는 1:N 구성이며, Transit Gateway당 최대 5개 VPC를 연결할 수 있습니다. Direct Connect는 단일 VPC와 1:1로 연결됩니다.", "src": "SCP_v2_Explore_Network_01-10.md VPN/DC/TGW 슬라이드13, 18, 24", "id": "3-1p-03"}, {"item": "3-1p", "t": "연결 서비스 선택", "q": "다음 중 요구사항과 SCP(Samsung Cloud Platform) 네트워크 연결 서비스를 짝지은 것으로 옳지 않은 것은 무엇입니까?", "o": ["중소 규모 사업장, 저비용으로 빠르게 구축 – VPN", "대용량 트래픽을 안정적이고 보안성 높게 전송 – Direct Connect", "온프레미스와 다수 VPC를 중앙 허브 방식으로 연결 – Transit Gateway", "40Gbps 대역폭의 물리적 전용 연결 – VPN", "VPC 2개를 단순히 1:1로 연결하며 트래픽 비용만 발생 – VPC Peering"], "a": 3, "e": "1G/10G/20G/40G 대역폭의 물리적 전용 회선은 Direct Connect입니다. VPN은 인터넷 기반 IPSec 터널로 대역폭이 상대적으로 낮습니다.", "src": "SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드19; VPN/DC/TGW 슬라이드15, 24", "id": "3-1p-04"}, {"item": "3-1q", "t": "Cloud LAN-Data Center", "q": "SCP(Samsung Cloud Platform) Cloud LAN-Data Center의 구성 요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["vRouter는 외부 회선(L2, L3) 연결을 위한 가상 자원이다.", "vCable의 Static 타입은 vDevice 간 Multi Peering 연결을 제공한다.", "vCore는 Full Mesh 라우팅 연결을 위한 가상 자원이다.", "vSwitch는 고객 전용 H/W 연결 및 VLAN 제공을 위한 가상 자원이다.", "vEdge는 uCPE 기반의 가상화된 엣지 자원으로 라우터, 가속기, 방화벽 등 다양한 VNF를 수용한다."], "a": 1, "e": "vCable의 Static 타입은 vDevice 간 1:1 연결이고, Multi Peering 연결은 vCore 타입입니다.", "src": "SCP_v2_Explore_Network_01-10.md SD-LAN/Last Mile/SASE/LAN-DC 슬라이드26, 32, 35", "id": "3-1q-02"}, {"item": "3-1q", "t": "Cloud Virtual Circuit", "q": "SCP(Samsung Cloud Platform)의 Cloud Virtual Circuit에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["이중화를 위해 Virtual Circuit 당 최대 5개의 Virtual Link를 구성할 수 있다.", "SCP 글로벌 리전과 고객 거점들 간 1:1 통신을 목적으로 하는 회선 대역폭 기반 가상회선(L2VPN) 서비스이다.", "회선 대역폭은 10Mbps ~ 10Gbps 범위에서 선택할 수 있으며, 약정 시에는 증속만 가능하다.", "Multi VLAN 기능으로 가상회선 하나를 용도별 논리 회선으로 분리할 수 있다.", "콘솔에서 직접 생성하지 않고, Support Center의 서비스 요청으로 신규 신청한다."], "a": 0, "e": "Virtual Circuit 당 Virtual Link는 최대 2개(이중화)이고, Multi VLAN 분리는 최대 5개입니다. 두 수치를 바꿔 묻는 경우가 많습니다.", "src": "SCP_v2_Explore_Network_01-10.md Cloud WAN/CVC 슬라이드12, 13, 17", "id": "3-1q-03"}, {"item": "3-1q", "t": "엔터프라이즈 네트워크 시나리오", "q": "E 고객사는 국내외 사업장과 SCP(Samsung Cloud Platform) 리전을 하나의 가상 백본으로 묶는 엔터프라이즈 네트워크를 구성하려 합니다. E 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Cloud WAN에서 SCP Compute 자원은 Transit Gateway 연결 타입으로 연결한다.", "고객 사업장 전용선을 받는 CE 장비는 Cloud WAN의 Site Connect 타입 Attachment로 연결한다.", "특정 두 거점 간 1:1 전용 가상회선이 추가로 필요하면 Cloud Virtual Circuit을 활용한다.", "사업장에서 SCP 리전까지의 Last Mile 회선과 uCPE 등 Customer Edge 자원은 Cloud Last Mile 패키지로 제공받는다.", "Cloud WAN Segment 생성 시 필요한 Access Location을 여러 개 한꺼번에 선택해 한 번에 구성한다."], "a": 4, "e": "Segment 생성 시 Access Location은 하나씩만 선택할 수 있고, 추가가 필요하면 상세정보의 연결된 자원 탭에서 하나씩 추가합니다.", "src": "SCP_v2_Explore_Network_01-10.md Cloud WAN/CVC 슬라이드5, 6, 8, 12; SD-LAN/Last Mile 슬라이드13", "id": "3-1q-04"}, {"item": "3-1r", "t": "5G 구성요소", "q": "다음 중 5G 네트워크 구성요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["5G RAN은 기지국과 단말기 간 5G 무선 통신을 처리하며, 내부 시설에 설치한다.", "UPF는 실제 사용자 데이터 전송을 담당하며, 지연시간 단축을 위해 MEC와 함께 위치한다.", "AMF는 실제 사용자 데이터 전송을 담당하는 User Plane 기능이다.", "SMF는 Control Plane에 속하며 세션 관리를 담당한다.", "5G Core는 패킷 전송·라우팅·외부망 연결 등 데이터 처리와 단말 인증·이동성 관리 등 제어 기능을 수행한다."], "a": 2, "e": "AMF(Access & Mobility Management Function)는 단말기 이동성을 관리하는 Control Plane 기능입니다. 사용자 데이터 전송을 담당하는 User Plane 기능은 UPF입니다.", "src": "SCP_v2_Explore_Network_01-10.md Private 5G Cloud 슬라이드5", "id": "3-1r-01"}, {"item": "3-1r", "t": "Private 5G Cloud 기능", "q": "SCP(Samsung Cloud Platform)의 Private 5G Cloud에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Private 5G Core CP는 단말의 등록, 인증, 구독 정책 등을 저장하고 관제한다.", "UPF를 고객사(Edge)에 배치하여 대용량 고객 데이터를 실시간으로 처리하고 보호한다.", "MEC 환경을 구성해 초저지연 서비스를 제공하며, MEC 표준 규격(3GPP Rel.17)을 지원한다.", "SCP와 고객 사업장 간 회선은 SCP가 Private 5G Cloud 서비스에 포함하여 일괄 구축·제공한다.", "K8S 환경을 제공하여 애플리케이션을 관리할 수 있다."], "a": 3, "e": "SCP와 고객 사업장 간은 VPN 또는 전용회선으로 구성하며, 회선 연결은 고객 영역입니다.", "src": "SCP_v2_Explore_Network_01-10.md Private 5G Cloud 슬라이드6", "id": "3-1r-02"}, {"item": "3-1r", "t": "Private 5G Cloud 시나리오", "q": "제조사 F는 공장 내 로봇과 CCTV 영상분석을 위한 5G 특화망을 SCP(Samsung Cloud Platform)의 Private 5G Cloud로 구축하려 합니다. 제조사 F를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Support Center의 서비스 요청으로 Private 5G Cloud를 신청하고, 사용 목적(제조 / 로봇, CCTV, 영상분석)과 사용 기간을 입력한다.", "콘솔의 Private 5G Cloud 메뉴에서 Core와 Edge 자원을 직접 생성하면 신청 절차 없이 즉시 사용할 수 있다.", "Private 5G Core CP를 통해 로봇과 CCTV 단말의 등록, 인증, 구독 정책을 관리한다.", "호처리 과정의 QoS 제어 기능을 활용해 영상 트래픽의 품질을 관리한다.", "SCP와 공장 간 회선은 VPN 또는 전용회선으로 구성하며, 회선 연결은 고객 영역으로 준비한다."], "a": 1, "e": "Private 5G Cloud는 콘솔에서 바로 생성하지 않고 Support Center 서비스 요청으로 신청합니다. 신청 시 기본정보, 서비스 게시 희망 일자, 사용 목적, 사용 기간(기본 3년)을 입력합니다.", "src": "SCP_v2_Explore_Network_01-10.md Private 5G Cloud 슬라이드6, 10, 11", "id": "3-1r-03"}, {"item": "3-1s", "t": "SASE SSE 기능", "q": "다음 중 SASE(Secure Access Service Edge)가 제공하는 기능에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["ZTNA는 사내 애플리케이션에 최소 권한을 부여하고 보안 및 Private 연결을 제공한다.", "SWG는 인터넷으로부터 내부 사용자를 보호하는 Gateway 보안을 제공한다.", "CASB는 사용자와 클라우드 애플리케이션 간에 기업 보안 정책을 적용한다.", "FWaaS는 클라우드 방식의 방화벽으로 모든 서비스 트래픽을 검사하고 제어한다.", "DEM은 데이터 유출 방지를 위해 전송 콘텐츠를 검사하고 차단하는 SSE 보안 기능이다."], "a": 4, "e": "DEM(Digital Experience Monitoring)은 네트워크 성능 저하나 앱 중단 같은 사용자 경험 문제를 인지하고 원인을 파악하는 모니터링 기능입니다. 데이터 유출 방지는 DLP(Advanced 보안 기능)입니다.", "src": "SCP_v2_Explore_Network_01-10.md SD-LAN/Last Mile/SASE/LAN-DC 슬라이드21", "id": "3-1s-01"}, {"item": "3-1s", "t": "SASE 생성", "q": "SCP(Samsung Cloud Platform)의 SASE 서비스 생성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["약정 기간은 신청 후에도 서비스 레벨 변경과 함께 언제든 수정할 수 있다.", "서비스 레벨은 Essential, Advanced, Premium 중에서 선택하며, 레벨별 제공 기능이 다르다.", "Agent Type은 사용할 에이전트 개수를 1~10,000개 범위에서 10개 단위로 입력한다.", "Edge Type은 사이트를 최대 10개까지 추가할 수 있다.", "Edge Type은 사이트의 상위국과 연결 대역폭을 25Mbps ~ 200Mbps 범위에서 선택한다."], "a": 0, "e": "SASE 약정 기간은 무약정, 3년, 5년, 7년 중 선택하며 신청 후에는 수정할 수 없습니다.", "src": "SCP_v2_Explore_Network_01-10.md SD-LAN/Last Mile/SASE/LAN-DC 슬라이드23, 24", "id": "3-1s-02"}, {"item": "3-1s", "t": "SASE 시나리오", "q": "G 고객사는 국내외 지사와 재택·해외 출장 근무자가 어디서든 사내 애플리케이션에 안전하게 접근하도록 네트워크와 보안을 단일 플랫폼으로 통합하려 합니다. G 고객사를 위한 SASE 구성 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["사외 원격 근무자는 PC/모바일 단말에 Agent를 설치하거나 Agentless 방식으로 SASE에 접속한다.", "지사 간 연결은 SD-WAN으로 구성해 애플리케이션별 최적 경로와 QoS, TCP 가속 기능을 활용한다.", "SASE Gateway는 각 지사 사이트에 직접 설치한 물리 방화벽만으로 구성하며, 별도의 POP은 사용하지 않는다.", "고객 사이트와 SASE 거점 간 회선은 인터넷/MPLS/전용선 기반 SD-WAN 또는 VPN으로 구성한다.", "Unified Orchestrator로 클라우드, 온프레미스, Edge 장비의 네트워크와 보안을 통합 관리한다."], "a": 2, "e": "SASE 거점은 삼성SDS Global POP과 CSP vPOP을 활용해 Gateway와 제어부를 구성하며, 고객 사이트에는 SD-WAN/VPN/라우터 등 SASE Edge 장비가 위치합니다.", "src": "SCP_v2_Explore_Network_01-10.md SD-LAN/Last Mile/SASE/LAN-DC 슬라이드20, 21", "id": "3-1s-03"}, {"item": "3-4a", "t": "Block Storage(VM)", "q": "SCP(Samsung Cloud Platform)에서 Virtual Server용 Block Storage를 생성하고 구성하는 방법에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["볼륨 용량은 Unit 단위로 입력하며, 1 Unit은 8GB이다.", "SSD_Provisioned 디스크 유형을 선택하면 IOPS와 Throughput을 설정할 수 있다.", "Windows 기반 Virtual Server에도 SSD_MultiAttach 디스크를 연결하여 여러 서버가 같은 볼륨을 공유할 수 있다.", "볼륨 생성 시 기존 스냅샷을 선택하지 않으면 빈 볼륨으로 생성된다.", "Delete on termination을 설정하면 서버를 해지할 때 해당 볼륨도 함께 해지된다."], "a": 2, "e": "Windows 기반 Virtual Server는 MultiAttach 디스크를 사용할 수 없습니다. MultiAttach는 2개 이상의 서버에 연결할 수 있는 볼륨이지만 OS 제약이 있다는 점이 함정입니다.", "src": "SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드8, Virtual Server 슬라이드14", "id": "3-4a-02"}, {"item": "3-4a", "t": "Block Storage(BM)", "q": "SCP(Samsung Cloud Platform) Bare Metal Server의 스토리지 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Bare Metal Server에 추가할 Block Storage는 Block Storage(BM) 메뉴에서 생성한다.", "Block Storage(BM)는 Block Storage(VM)와 마찬가지로 사용 중에 용량을 증설할 수 있다.", "Block Storage 외에 File Storage와 Object Storage를 추가 스토리지로 연결할 수 있다.", "Bare Metal Server의 Filesystem 백업/복구는 Backup 서비스로 제공된다.", "고가용성·고성능 OLTP DB가 필요하면 Bare Metal Server 2대를 이중화하고 Block Storage(BM)를 Multi-Attach 방식으로 연결할 수 있다."], "a": 1, "e": "Block Storage(BM)는 Block Storage(BM) 메뉴에서 생성하며, 생성 후에는 용량을 증설할 수 없습니다. 사용 중 증설이 가능한 것은 Block Storage(VM)입니다.", "src": "SCP_v2_Explore_Storage_20-24 Baremetal 슬라이드5·13, WA백서 04 p.3", "id": "3-4a-03"}, {"item": "3-4a", "t": "Block Storage 연결", "q": "Linux 기반 Virtual Server에 새로 생성한 Block Storage(VM)를 연결하여 사용하려고 합니다. 작업 순서를 올바르게 나열한 것은 무엇입니까?", "o": ["ㄱ → ㄷ → ㄹ → ㄴ", "ㄷ → ㄹ → ㄱ → ㄴ", "ㄷ → ㄱ → ㄴ → ㄹ", "ㄷ → ㄱ → ㄹ → ㄴ", "ㄹ → ㄷ → ㄱ → ㄴ"], "a": 3, "e": "콘솔의 Block Storage 상세 정보에서 연결 서버를 추가한 뒤, Linux에서는 디스크 확인 → 파티션 생성·포맷 설정 → 볼륨 Mount의 후속 작업이 필요합니다. Windows는 디스크를 online으로 변경하고 초기화한 뒤 포맷하는 절차가 다릅니다.", "src": "SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드9", "s": "ㄱ. 서버에 접속하여 추가된 디스크 확인\nㄴ. 볼륨 Mount\nㄷ. Block Storage 상세 정보에서 연결 서버 추가\nㄹ. 파티션 생성 및 포맷 설정", "fix": true, "id": "3-4a-04"}, {"item": "3-4b", "t": "File Storage 생성·연결", "q": "SCP(Samsung Cloud Platform)의 File Storage를 생성하고 여러 서버에서 데이터를 공유하는 방법에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["볼륨은 File Storage 서비스의 기본 생성 단위이며 데이터 저장 공간으로 사용된다.", "Virtual Server 운영체제에 맞춰 Linux는 NFS, Windows는 CIFS 프로토콜을 선택한다.", "서버에서 사용하려면 File Storage의 Mount명을 확인한 뒤, 서버에 접속해 Mount 작업을 수행해야 한다.", "File Storage를 생성하면 같은 VPC의 모든 Virtual Server에 자동으로 연결되므로 연결할 서버를 따로 선택할 필요가 없다.", "하나의 File Storage 볼륨을 두 대 이상의 Virtual Server에 연결하여 데이터를 공유할 수 있다."], "a": 3, "e": "File Storage 상세정보의 연결자원 팝업에서 연결할 서버를 직접 선택해야 합니다. VPC 내 서버에 자동으로 연결되지 않습니다.", "src": "SCP_v2_Explore_Storage_20-24 File storage 슬라이드6~9", "id": "3-4b-02"}, {"item": "3-4b", "t": "File Storage 데이터 보호", "q": "A 고객사는 여러 Virtual Server가 공유하는 File Storage 데이터를 사용자 실수나 데이터 손상에 대비해 보호하려고 합니다. File Storage의 데이터 보호 및 복구 기능에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["File Storage는 Object Storage와 같은 버전 관리 방식을 사용하므로, 파일이 변경될 때마다 이전 버전을 모두 자동으로 보관한다.", "File Storage는 내장 기능인 스냅샷으로 백업하며, 스냅샷 사본은 별도 저장소가 아닌 File Storage 내부에 저장된다.", "스냅샷과 디스크 백업 두 방식 모두 File Storage의 저장소를 백업 사본의 원본으로 사용한다.", "File Storage는 스냅샷과 디스크 백업 두 가지 방식으로 데이터를 보호하며, 스케줄링을 통해 백업 사본을 생성할 수 있다.", "서버에 Mount된 File Storage의 스냅샷 경로(/.snapshot)에서 필요한 디렉토리나 파일을 찾아 복구할 수 있다."], "a": 0, "e": "객체가 변경될 때마다 이전 버전을 보관하는 버전 관리는 Object Storage의 보호 방식입니다. File Storage는 File Storage 저장소를 원본으로 하는 스냅샷과 디스크 백업으로 데이터를 보호하고, Mount된 경로의 /.snapshot에서 필요한 파일을 찾아 복구합니다.", "src": "WA백서 03 p.10 백업 서비스 비교표, p.13 1.3 스토리지 백업", "id": "3-4b-03"}, {"item": "3-4b", "t": "File Storage 활용", "q": "File Storage의 활용과 특성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Kubernetes Engine을 구성할 때 Persistent Volume 용도로 File Storage를 생성해 사용할 수 있다.", "Virtual Server Auto-Scaling의 Launch Configuration에서 기존에 생성한 File Storage 볼륨을 최대 5개까지 연결할 수 있다.", "Multi-node GPU Cluster는 고성능 SSD File Storage를 스토리지로 사용할 수 있다.", "File Storage는 디스크 유형으로 SSD와 HDD를 제공한다.", "File Storage는 Block Storage와 같이 할당한 용량 기준(Provisioning)으로 과금되므로, 필요한 용량을 처음부터 정확히 산정해야 한다."], "a": 4, "e": "Block Storage는 할당량 기준(Provisioning)으로 과금되지만, File Storage는 Object Storage·Archive Storage·Backup처럼 실제 사용량 기준(Pay-as-you-go)으로 과금됩니다.", "src": "WA백서 06 p.1 표6-1, WA백서 04 p.32 표4-28, CloudNative1 슬라이드23~24, SCP_v2_Explore_Storage_20-24 Auto-Scaling 슬라이드9", "id": "3-4b-04"}, {"item": "3-4c", "t": "Object Storage 생성", "q": "SCP(Samsung Cloud Platform) Object Storage의 생성과 접근 주소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["버킷은 Object Storage에서 데이터를 저장하는 최상위 논리적 단위이다.", "Private 주소는 인터넷을 통해 외부 망에서 버킷에 접근할 때 사용하는 주소이다.", "Object Storage를 사용하려면 인증키를 사전에 생성해야 한다.", "Public 주소는 외부 망에서 접근할 수 있는 주소이다.", "버킷 안에 폴더를 생성하고 로컬 PC의 파일을 업로드할 수 있다."], "a": 1, "e": "Private 주소(URL)는 SCP Console의 같은 Account 안에서 생성한 자원이 접근하는 주소입니다. 외부 망에서 접근하는 주소는 Public 주소이므로 두 설명이 뒤바뀌었습니다.", "src": "SCP_v2_Explore_Storage_20-24 Object storage 슬라이드6~8·19", "id": "3-4c-02"}, {"item": "3-4c", "t": "Object Storage 버전관리", "q": "Object Storage의 버전 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["같은 이름의 파일을 같은 위치에 다시 업로드하면 버전 ID가 서로 다른 2개의 버전이 버전 목록에 조회된다.", "버전 목록에서 특정 버전의 파일을 다운로드하거나 삭제할 수 있다.", "버전 관리를 활성화하면 활성화 이전에 덮어쓴 파일의 과거 이력까지 소급하여 버전 목록에 나타난다.", "객체를 덮어쓰거나 삭제해도 변경 이전의 객체를 복원할 수 있다.", "POST, PUT, DELETE 요청으로 객체가 변경될 때마다 새 버전을 저장하면서 기존 버전도 보존한다."], "a": 2, "e": "버전 관리는 설정한 시점부터 파일 업로드와 수정 이력을 관리합니다. 활성화하기 전의 변경 이력은 소급해서 생기지 않습니다.", "src": "SCP_v2_Explore_Storage_20-24 Object storage 슬라이드15~17, WA백서 05 p.20", "id": "3-4c-03"}, {"item": "3-4c", "t": "Object Storage 특징", "q": "Object Storage의 기능과 활용에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["S3 호환 REST API로 접근할 수 있는 객체 스토리지이다.", "인터넷 연결이 되지 않은 VPC에서도 Object Storage에 접속할 수 있다.", "파일 단위로 권한을 수정하여 Public Access 허용 여부를 설정할 수 있다.", "Block Storage처럼 Virtual Server에 디스크로 직접 연결한 뒤 파티션을 만들고 포맷해서 사용한다.", "Logging&Audit Trail 로그나 Firewall 로그의 저장 위치로 Object Storage 버킷을 지정할 수 있다."], "a": 3, "e": "Object Storage는 URL(REST API) 형태로 접근하는 객체 스토리지입니다. 서버에 디스크로 연결해 파티션·포맷 작업을 하는 것은 Block Storage의 사용 방식입니다.", "src": "SCP_v2_Explore_Storage_20-24 Object storage 슬라이드5·9, VPC 슬라이드6·21, WA백서 04 p.32", "id": "3-4c-04"}, {"item": "3-4d", "t": "Archive Storage 기본", "q": "SCP(Samsung Cloud Platform)의 Archive Storage에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Object Storage의 데이터를 장기간 보관하기 위한 Storage 서비스이다.", "Archive Storage를 사용하려면 인증키를 사전에 생성해야 한다.", "아카이빙된 파일을 복구할 때는 Object Storage의 버킷과 폴더를 선택해 해당 위치에 복구한다.", "정책 작업에서 Archiving 대상 버킷을 선택한 후, 해당 버킷 안의 대상 파일을 선택한다.", "아카이빙된 파일은 Archive Storage를 Virtual Server에 Mount하여 바로 읽고 쓸 수 있다."], "a": 4, "e": "Archive Storage는 서버에 Mount해서 쓰는 스토리지가 아닙니다. 아카이빙된 데이터는 Object Storage로 복구한 뒤 사용합니다.", "src": "SCP_v2_Explore_Storage_20-24 Archive storage 슬라이드5·6·9·11", "id": "3-4d-01"}, {"item": "3-4d", "t": "Archive 정책 대상", "q": "A 고객사는 Archive Storage 'archive01'의 정책 작업에서 Object Storage 버킷 'obj01'을 Archiving 대상으로 지정해 사용하고 있습니다. 새로 생성한 Archive Storage 'archive02'의 정책 작업에서도 'obj01'을 대상으로 지정하려고 할 때, 그 결과로 옳은 것은 무엇입니까?", "o": ["다른 Archive Storage의 정책에서 사용 중인 버킷이므로 선택할 수 없다.", "선택할 수 있으며, 두 정책 중 수행 시점이 짧은 정책이 우선 적용된다.", "선택할 수 있으며, archive01의 기존 정책은 자동으로 해제된다.", "obj01에 버전 관리가 활성화되어 있으면 선택할 수 있다.", "archive01 정책의 대상 버킷을 다른 버킷으로 먼저 수정하면 선택할 수 있다."], "a": 0, "e": "다른 Archive Storage의 정책에서 사용 중인 버킷은 선택할 수 없습니다. 또한 Archiving 대상 버킷은 최초 설정 후 수정할 수 없으므로, 기존 정책의 대상을 바꾸는 우회 방법도 쓸 수 없습니다.", "src": "SCP_v2_Explore_Storage_20-24 Archive storage 슬라이드8", "id": "3-4d-02"}, {"item": "3-4d", "t": "Archive 복구·과금", "q": "Archive Storage의 운영과 복구에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Archive Storage에 복구를 요청한 데이터는 3시간 이내에 검색되는 것으로 안내된다.", "Archive Storage는 Block Storage처럼 할당한 용량 기준(Provisioning)으로 과금된다.", "아카이빙된 파일은 원래 있던 Object Storage 버킷의 같은 경로로만 복구할 수 있다.", "Archive Storage는 버킷 단위로만 복구할 수 있고 폴더나 개별 파일은 선택할 수 없다.", "Archive Storage의 폴더 리스트에서는 복구만 할 수 있으며, 파일 삭제는 정책 작업으로만 수행된다."], "a": 0, "e": "서비스 구성도에서 Archive Storage → Object Storage 복구는 '3시간 이내 검색'으로 안내됩니다. 폴더 리스트에서 폴더나 파일을 선택하면 삭제·복구 버튼이 나타나고, 복구 위치는 원하는 Object Storage 버킷과 폴더로 지정합니다. 과금은 사용량 기준입니다.", "src": "SCP_v2_Explore_Storage_20-24 Archive storage 슬라이드5·11, WA백서 06 p.1 표6-1", "id": "3-4d-03"}, {"item": "3-4e", "t": "Parallel File Storage 특징", "q": "SCP(Samsung Cloud Platform)의 Parallel File Storage에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["All NVMe 기반의 고성능 병렬 파일 스토리지이다.", "AI/ML, 빅데이터 분석처럼 대용량 데이터를 빠르게 처리해야 하는 분야에 활용할 수 있다.", "Multi-node GPU Cluster의 Cluster Fabric을 확인한 뒤 연결할 서버를 선택한다.", "볼륨은 Parallel File Storage 서비스의 기본 생성 단위이며 데이터 저장 공간으로 사용된다.", "서비스를 생성한 뒤에도 사용량에 맞추어 볼륨 용량을 줄이거나 늘릴 수 있다."], "a": 4, "e": "Parallel File Storage는 서비스를 생성한 뒤에는 용량을 늘리는 증설만 할 수 있고 줄일 수는 없습니다.", "src": "SCP_v2_Explore_Storage_20-24 Parallel File storage 슬라이드5~8", "id": "3-4e-02"}, {"item": "3-4e", "t": "PFS Mount 옵션", "q": "다음은 Parallel File Storage를 서버에 마운트하는 명령어 예시입니다. 각 옵션에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["num_cores=8 : 마운트에 사용할 CPU 코어 수를 8개로 지정한다.", "-t wekafs : NFS v3 프로토콜로 마운트하도록 지정한다.", "net:ha=mlnx0,net:ha=mlnx1 : 여러 네트워크 인터페이스를 사용하는 고가용성(HA) 모드로 연결 안정성을 높인다.", "mgmt_ip='10.0.0.1+10.0.0.2' : 네트워크 인터페이스에 할당된 IP 주소 2개를 지정한다.", "10.10.10.5/mypfs : Parallel File Storage 상세정보에서 확인한 Mount명이다."], "a": 1, "e": "'-t wekafs'는 파일시스템 타입을 WekaFS로 지정하는 옵션이며 NFS와는 관계가 없습니다. NFS(vers=3)는 File Storage 마운트에서 쓰는 방식입니다.", "src": "SCP_v2_Explore_Storage_20-24 Parallel File storage 슬라이드9", "s": "# mount -t wekafs -o num_cores=8 -o net:ha=mlnx0,net:ha=mlnx1 mgmt_ip='10.0.0.1+10.0.0.2' 10.10.10.5/mypfs /data", "id": "3-4e-03"}, {"item": "3-4e", "t": "PFS 사전작업·스냅샷", "q": "Parallel File Storage의 연결 사전 작업과 스냅샷에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["마운트하기 전에 대상 서버에 Agent를 설치하고, 서버의 네트워크 인터페이스 2개가 정상인지 확인한다.", "스냅샷은 최대 128개까지 생성할 수 있다.", "스냅샷은 매일 또는 매주 스케줄을 설정한 경우에만 생성할 수 있다.", "Virtual Server 기반 GPU Server에 연결하면 GPUDirect Storage를 활용할 수 있다.", "서버 운영체제에 따라 Linux는 NFS, Windows는 CIFS 프로토콜을 선택한다."], "a": 0, "e": "마운트 사전 작업은 대상 서버에 Agent를 설치하고 네트워크 인터페이스 2개를 점검하는 것입니다. 스냅샷은 즉시 생성되며 최대 50개까지 만들 수 있습니다. NFS/CIFS 선택은 File Storage에 해당하고, GPU Server는 GPUDirect Storage를 지원하지 않습니다.", "src": "SCP_v2_Explore_Storage_20-24 Parallel File storage 슬라이드9·11·13, Multi-node GPU Cluster 슬라이드8", "id": "3-4e-04"}, {"item": "3-4f", "t": "File Storage 접근제어", "q": "SCP(Samsung Cloud Platform) File Storage의 접근 제어에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["접근하려는 서버나 IP 주소를 관리하는 접근 제어 리스트(ACL) 방식을 사용한다.", "Virtual Server에서 File Storage에 접근하려면 반드시 해당 서버를 접근 서버 목록에 등록해야 한다.", "접근 제어 리스트로는 서버 자원뿐 아니라 Public IP와 VPC Endpoint도 관리할 수 있다.", "Security Group에서 NFS 포트만 허용하면, 접근 대상을 별도로 등록하지 않아도 같은 VPC의 모든 서버가 접근할 수 있다.", "접근할 수 있는 대상을 White List로 관리한다."], "a": 3, "e": "File Storage는 접근 대상을 White List(ACL)로 관리하므로, 접근 서버 목록에 등록된 서버만 접근할 수 있습니다. Security Group 설정만으로는 접근이 허용되지 않습니다.", "src": "WA백서 02 p.21 2.3 접근 제어 적용, WA백서 02 p.27, WA백서 04 p.32 표4-28", "id": "3-4f-01"}, {"item": "3-4f", "t": "Object Storage 접근제어", "q": "SCP(Samsung Cloud Platform) Object Storage 접근 제어의 '서비스 자원 허용'에 등록할 수 있는 대상이 아닌 것은 무엇입니까?", "o": ["Bare Metal Server", "Multi-node GPU Cluster", "VPC Endpoint", "Microsoft SQL Server", "Load Balancer"], "a": 4, "e": "서비스 자원 허용에는 Virtual Server·GPU Server·Bare Metal Server·Multi-node GPU Cluster, VPC Endpoint, PostgreSQL·MariaDB·MySQL·EPAS·Microsoft SQL Server를 등록할 수 있습니다. Load Balancer는 목록에 없습니다.", "src": "SCP_v2_Explore_Storage_20-24 Object storage 슬라이드13", "id": "3-4f-02"}, {"item": "3-4f", "t": "접근제어 시나리오", "q": "B 고객사는 사내망을 Direct Connect로 SCP(Samsung Cloud Platform)에 연결했습니다. 백업 파일은 Object Storage에, 서버 간 공유 데이터는 File Storage에 저장하며, 인터넷 노출을 최소화하고 허용된 대상만 저장소에 접근하도록 하려고 합니다. B 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["사내망에서 File Storage와 Object Storage에 Private 연결로 접근하도록 VPC Endpoint를 구성하고, 저장소 접근 제어 목록에 해당 VPC Endpoint를 등록한다.", "Object Storage의 접근 허용 Public IP에는 사내 공인 IP 대역을 CIDR 형식으로 등록한다.", "Archive Storage를 VPC Endpoint의 대상 서비스로 지정하여 사내망에서 아카이브 데이터에 프라이빗하게 접근한다.", "File Storage에는 데이터를 공유해야 하는 Virtual Server만 접근 서버 목록에 등록한다.", "VPC Endpoint를 생성하기 전에 VPC에 Endpoint Subnet을 먼저 생성한다."], "a": 2, "e": "VPC Endpoint를 생성할 때 고를 수 있는 대상 서비스는 Object Storage, File Storage, Container Registry입니다. Archive Storage는 대상이 아니며, 아카이브 데이터는 Object Storage로 복구한 뒤 접근합니다.", "src": "SCP_v2_Explore_Storage_20-24 VPC 슬라이드33·35, Object storage 슬라이드13, WA백서 02 p.21", "id": "3-4f-03"}, {"item": "3-4g", "t": "스토리지별 암호화", "q": "SCP(Samsung Cloud Platform) 스토리지 서비스별 암호화에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Object Storage는 사용자가 암호화 사용 여부를 선택할 수 있다.", "Archive Storage도 AES256 암호화를 선택하여 적용할 수 있다.", "백업 사본 보호를 위해 백업본이 저장된 Object Storage 버킷에 버킷 암호화를 설정할 수 있다.", "File Storage는 생성할 때 사용자가 암호화 사용을 체크해야만 암호화가 적용된다.", "SSD_KMS 디스크는 인스턴스와 인스턴스에 연결된 Block Storage 구간의 전송 암호화를 제공한다."], "a": 3, "e": "File Storage는 기본적으로 암호화(AES256)가 적용됩니다. 사용자가 암호화 여부를 선택하는 것은 Object Storage와 Archive Storage입니다.", "src": "WA백서 02 p.21 2.2, WA백서 04 p.32 표4-28, WA백서 03 p.15, SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드5", "id": "3-4g-01"}, {"item": "3-4g", "t": "SSD_KMS 설계", "q": "C 고객사는 Virtual Server와 Block Storage 사이의 전송 구간을 암호화해야 하는 보안 요건이 있으며, 서비스 성능도 중요하게 관리하고 있습니다. C 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Virtual Server를 생성할 때 Block Storage 기본 OS 영역의 디스크 유형으로 SSD_KMS를 선택한다.", "SSD_Provisioned 유형은 IOPS·Throughput 설정과 함께 전송 암호화도 제공하므로, SSD_KMS 대신 SSD_Provisioned를 선택한다.", "KMS 디스크 유형은 성능이 떨어질 수 있으므로, 적용 전에 워크로드 성능을 검증한다.", "Auto-Scaling으로 생성되는 서버도 요건을 지키도록 Launch Configuration의 Block Storage에서 SSD_KMS를 선택한다.", "GPU 워크로드용 Accelerated Server를 생성할 때도 기본 OS 영역에 SSD_KMS를 선택한다."], "a": 1, "e": "인스턴스와 볼륨 사이의 전송 암호화를 제공하는 유형은 SSD_KMS입니다. SSD_Provisioned는 IOPS와 Throughput을 설정할 수 있는 유형이며 전송 암호화와는 관계가 없습니다.", "src": "SCP_v2_Explore_Storage_20-24 Virtual Server 슬라이드14, Accelerated Server 슬라이드14, Auto-Scaling 슬라이드8", "id": "3-4g-02"}, {"item": "3-4g", "t": "저장 데이터 보호", "q": "저장 중 데이터(Data-at-rest)를 보호하는 방법에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["KMS로 애플리케이션 데이터를 암호화하려면 사용자가 애플리케이션에 암호화 코드를 작성해야 한다.", "Object Storage는 모든 버킷에 암호화가 강제로 적용되어 사용자가 해제할 수 없다.", "File Storage는 암호화를 지원하지 않으므로 민감 데이터는 Object Storage에만 저장해야 한다.", "Block Storage에서 KMS 디스크 유형을 선택하면 일반 SSD보다 성능이 좋아진다.", "백업본이 저장된 Object Storage 버킷에 암호화를 설정하면 접근 제어는 따로 구성할 필요가 없다."], "a": 0, "e": "KMS는 키를 생성·저장·관리하는 서비스이며, KMS로 암호화하려면 사용자가 애플리케이션에 암호화 코드를 작성해야 합니다. WA 백서는 백업 저장소에 접근 제어와 암호화를 함께 적용하도록 권고하고, KMS 디스크는 성능이 떨어질 수 있습니다.", "src": "WA백서 02 p.20 2.1, WA백서 02 p.21 2.2, WA백서 03 p.15", "id": "3-4g-03"}, {"item": "3-4h", "t": "Block Storage 스냅샷 복구", "q": "SCP(Samsung Cloud Platform) Block Storage(VM)의 스냅샷과 복구에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["스냅샷은 즉시 생성되며 스냅샷 목록에서 확인할 수 있다.", "'스냅샷 복구'를 실행하면 Available 상태인 최신 스냅샷으로 기존 볼륨이 복구된다.", "'스냅샷 복구'는 모든 연결 서버에서 볼륨을 unmount한 상태에서 진행해야 한다.", "'복구 볼륨 생성'은 스냅샷 목록에서 선택한 스냅샷으로 신규 볼륨을 생성한다.", "'복구 볼륨 생성'은 최신 스냅샷만 선택할 수 있고, 복구 결과는 기존 볼륨을 덮어쓴다."], "a": 4, "e": "복구 방법은 두 가지입니다. '스냅샷 복구'는 최신 스냅샷으로 기존 볼륨을 복구하고, '복구 볼륨 생성'은 목록에서 원하는 스냅샷을 골라 신규 볼륨으로 복구합니다. 설명이 두 방법을 섞어 놓았습니다.", "src": "SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드10·11·14", "id": "3-4h-01"}, {"item": "3-4h", "t": "Backup 서비스", "q": "SCP(Samsung Cloud Platform)의 Backup 서비스를 이용한 서버 백업과 복구에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Agentless Backup의 백업본 보관 기간은 2주, 1개월, 3개월, 6개월, 1년 중에서 선택한다.", "스케줄은 Full Backup 1개와 Incremental Backup 최대 6개까지 설정할 수 있으며, Full Backup 스케줄은 최소 1개를 등록해야 한다.", "Virtual Server는 대상 서버에 Backup Agent를 설치하여 File System 단위로 백업한다.", "백업본으로 복구하면 신규 서버가 생성되며, Block Storage 유형과 Keypair는 원본과 동일하게 설정된다.", "백업본 목록에서 원하는 백업 시점을 선택하여 복구를 수행한다."], "a": 2, "e": "Virtual Server는 Agent 설치 없이 VM Image(OS+Data) 단위로 백업하는 Agentless Backup 방식입니다. Agent를 설치해 File System을 백업하는 방식은 Bare Metal Server에 해당합니다.", "src": "SCP_v2_Explore_Storage_20-24 Backup 슬라이드5·6·7·10·11", "id": "3-4h-02"}, {"item": "3-4h", "t": "File Storage 스냅샷", "q": "File Storage의 스냅샷과 데이터 복구에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["스냅샷은 특정 시점 볼륨의 이미지 백업본으로, 변경하거나 삭제한 데이터를 복구할 수 있다.", "스냅샷은 스케줄로 자동 생성되는 것을 포함해 최대 128개까지 보관할 수 있다.", "스냅샷은 File Storage에 스냅샷 스케줄을 설정하는 방식으로 수행한다.", "스냅샷 스케줄 주기는 매일(시간) 또는 매주(요일/시간)로 설정한다.", "'스냅샷 복구'를 실행하면 File Storage 볼륨이 가장 최신의 스냅샷으로 복구된다."], "a": 1, "e": "File Storage 스냅샷은 최대 800개까지 생성할 수 있으며, 이 수에는 스케줄로 생성되는 스냅샷이 포함되지 않습니다. 스케줄을 통한 자동 생성은 별도로 최대 128개입니다.", "src": "SCP_v2_Explore_Storage_20-24 File storage 슬라이드11~14", "id": "3-4h-03"}, {"item": "3-8a", "t": "MLOps 개념", "q": "다음 중 MLOps에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["MLOps는 DevOps와 유사하게 머신러닝 모델의 라이프사이클을 관리하고 자동화하는 데 중점을 둔다.", "모델의 품질을 유지하고 배포 주기를 단축하며, 운영 중 발생하는 문제를 신속하게 해결하는 것을 목표로 한다.", "MLOps는 모델 학습 단계의 자동화에 한정된 개념으로, 배포 이후의 운영 단계는 DevOps 영역으로 분리하여 관리한다.", "데이터 수집/전처리, 학습, 검증, 배포 등의 과정을 컴포넌트로 분리해 하나의 파이프라인으로 자동화할 수 있다.", "실험의 파라미터, 메트릭, 아티팩트, 소스코드 버전을 기록해 재현 가능성을 확보하는 것도 MLOps의 중요한 요소이다."], "a": 2, "e": "MLOps 플랫폼은 ML 모델의 개발, 배포, 운영 전 과정을 지원하며 라이프사이클 전체를 관리·자동화한다. 학습 단계에만 한정되지 않는다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드4, AI&ML_2_CloudML_슬라이드별.md 슬라이드4", "id": "3-8a-02"}, {"item": "3-8a", "t": "MLOps 도구 역할", "q": "다음 중 MLOps 단계별 작업과 이를 수행하는 도구를 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["ML 파이프라인을 Python 코드로 정의하고 자동 실행 - Kubeflow Pipelines(KFP)", "모델 배포(서빙) 및 REST API 엔드포인트 자동 생성 - KServe", "실험의 파라미터와 메트릭 기록 및 비교 - MLflow", "모델과 실행 환경을 이미지로 패키징하여 저장 - Container Registry", "Python으로 작성한 파이프라인을 YAML(IR) 파일로 컴파일 - MLflow Model Registry"], "a": 4, "e": "파이프라인을 YAML(IR)로 변환하는 것은 KFP의 Compiler 역할이다. MLflow Model Registry는 학습된 모델을 버전·단계별로 등록·관리한다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드6·14, AI&ML_2_CloudML_슬라이드별.md 슬라이드4", "id": "3-8a-03"}, {"item": "3-8a", "t": "MLOps 시나리오", "q": "A 고객사의 ML팀은 개발 환경에서 잘 동작하던 모델이 운영 배포 시 라이브러리 버전 차이로 오류가 나고, 실험 결과를 재현하기 어려우며, 새 모델 배포 후 문제가 생기면 이전 버전으로 되돌리는 데 시간이 오래 걸리는 문제를 겪고 있습니다. A 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["모델 파일, 실행 코드, 라이브러리 설정을 하나의 컨테이너 이미지로 패키징하여 환경 불일치를 줄인다.", "Container Registry가 모델 정확도에 따라 이미지 태그를 자동으로 변경하도록 설정하여 운영 버전 전환을 자동화한다.", "이미지 태그(v1, v2, prod 등)로 버전을 구분하고, 문제 발생 시 InferenceService의 image를 이전 태그로 변경해 롤백한다.", "MLflow로 파라미터, 메트릭, 아티팩트를 기록하고 Model Registry에서 모델 버전과 단계(Staging, Production)를 관리한다.", "KServe의 canaryTrafficPercent를 사용해 새 모델에 일부 트래픽만 보내 검증한 뒤 전환한다."], "a": 1, "e": "Container Registry는 이미지를 저장·관리하는 저장소이며, 정확도에 따라 태그를 자동 변경하는 기능은 없다. 태그는 사용자가 붙이거나 CI/CD(GitHub Actions 등)로 자동화한다.", "src": "AI&ML_2_CloudML_슬라이드별.md 슬라이드4·6·11", "id": "3-8a-04"}, {"item": "3-8b", "t": "KFP 구성요소", "q": "SCP(Samsung Cloud Platform) AI&MLOps Platform에서 사용하는 Kubeflow Pipelines(KFP)의 구성 요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["@pipeline() 데코레이터는 일반 Python 함수를 컨테이너에서 독립 실행되는 컴포넌트로 변환한다.", "Component는 하나의 독립 실행 가능한 처리 단위로, 컨테이너에서 실행된다.", "Pipeline은 여러 컴포넌트를 조합한 작업 흐름(워크플로우)이다.", "Compiler는 Python으로 작성된 파이프라인을 KFP 백엔드가 인식할 수 있는 YAML로 변환한다.", "Runner는 파이프라인 실행자로, CLI, KFP UI, Python Client 등이 해당된다."], "a": 0, "e": "Python 함수를 독립 실행 가능한 컴포넌트로 정의하는 것은 @component() 데코레이터다. @pipeline()은 컴포넌트들을 조합해 파이프라인을 정의할 때 사용한다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드6·11", "id": "3-8b-01"}, {"item": "3-8b", "t": "KServe 구성요소", "q": "AI&MLOps Platform의 모델 서빙 컴포넌트인 KServe의 구성 요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["InferenceService CRD에 배포할 모델, 위치, 옵션을 명세하면 REST API 엔드포인트가 자동으로 생성된다.", "Predictor는 실제 추론(예측)을 수행한다.", "Transformer는 입력 데이터 전처리와 출력 데이터 후처리를 담당하는 컨테이너를 연결한다.", "Explainer는 모델 버전 간 트래픽을 점진적으로 분산하는 Canary 배포를 담당한다.", "사용자의 :explain 요청은 Explainer로, :predict 요청은 Predictor로 전달된다."], "a": 3, "e": "Explainer는 모델의 예측 결과에 대한 설명(Explanation)을 제공한다. Canary 배포와 트래픽 분산은 Knative·Istio를 활용해 지원하는 기능이다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드4·8", "id": "3-8b-02"}, {"item": "3-8b", "t": "AI&MLOps Platform 기능", "q": "SCP(Samsung Cloud Platform)의 AI&MLOps Platform에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Kubernetes 기반 머신러닝 플랫폼으로, 모델의 개발·학습·배포 과정에서 반복되는 작업을 자동화한다.", "Jupyter Notebook을 제공하여 모델 개발, 학습, 추론을 수행할 수 있다.", "Enterprise 버전은 AI/ML Job 관리와 함께 GPU 자원 모니터링 및 GPU Fraction 기능을 제공한다.", "플랫폼 구성 요소로 Pipeline, Metadata, Model Serving, Notebook, Hyper Parameter Tuning 등이 포함된다.", "프로젝트별 자원 사용량 관리와 프로젝트 사용자·권한 관리 기능은 Mini 버전과 Enterprise 버전 모두에 기본 제공된다."], "a": 4, "e": "Mini와 Enterprise 공통 기능은 플랫폼 생성·조회·삭제, Jupyter Notebook, ML 파이프라인 자동화 등이다. 프로젝트별 자원 사용량 관리와 사용자·권한 관리는 Enterprise 추가 기능이다.", "src": "일반지식(삼성SDS AI&MLOps Platform 서비스 소개 페이지, 교재 미수록)", "id": "3-8b-03"}, {"item": "3-8c", "t": "KServe 배포 구조", "q": "다음 중 KServe의 배포 환경과 구조에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Kubernetes 위에서 동작하며, EKS/AKS/GKE 등 관리형 Kubernetes와 On-Prem 클러스터에 배포할 수 있다.", "오토스케일링은 HPA만 지원하므로, 요청이 없을 때에도 Predictor Pod가 최소 1개 이상 유지된다.", "Knative와 Istio는 선택적(Optional)으로 사용하는 Serverless/Service Mesh 계층이다.", "KServe Controller는 InferenceService를 reconcile하여 Raw Deployment 또는 Serverless(Knative Service) 형태로 배포한다.", "Predictor Pod의 Storage Initializer는 S3, GCS, PVC 등 Model Storage에서 모델을 가져온다."], "a": 1, "e": "KServe는 KPA/HPA로 min/max replicas 사이에서 스케일하며, Knative 기반 Scale to Zero로 요청이 없으면 Pod를 0개까지 줄일 수 있다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드4·8·13", "id": "3-8c-01"}, {"item": "3-8c", "t": "AI&MLOps Platform 배포 환경", "q": "SCP(Samsung Cloud Platform)의 AI&MLOps Platform 배포 환경에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Kubernetes Engine 위에 배포되며, CPU 워커 노드, GPU 워커 노드, Persistent Volume으로 구성된다.", "Bare Metal Server에 직접 설치되는 패키지로, Kubernetes 클러스터 없이 동작한다.", "Cloud Functions 기반 서버리스 환경에 배포되어 사용자가 워커 노드를 구성할 필요가 없다.", "플랫폼 이용 요금에 Kubernetes Engine과 워커 노드 등 SCP 인프라 사용 비용이 포함되어 있다.", "플랫폼은 SDS가 운영하는 공용 클러스터에 배포되어 사용자 환경에는 자원이 생성되지 않는다."], "a": 0, "e": "AI&MLOps Platform은 사용자의 Kubernetes Engine(CPU/GPU 워커 노드, PV) 위에 배포된다. 플랫폼은 시간 단위로 과금되며, 사용자 환경을 구성하는 SCP 자원 비용은 별도로 청구된다.", "src": "일반지식(삼성SDS AI&MLOps Platform 서비스 소개 페이지, 교재 미수록)", "id": "3-8c-02"}, {"item": "3-8c", "t": "KServe ServingRuntime", "q": "B 고객사는 ONNX 형식으로 변환한 모델을 AI&MLOps Platform의 KServe로 서빙하려고 합니다. 다음 중 ONNX 모델 형식을 지원하는 KServe 기본 ServingRuntime은 무엇입니까?", "o": ["kserve-mlserver", "kserve-torchserve", "kserve-tritonserver", "kserve-sklearnserver", "kserve-lgbserver"], "a": 2, "e": "kserve-tritonserver는 TensorFlow, ONNX, PyTorch, TensorRT 형식을 지원한다. kserve-mlserver는 SKLearn, XGBoost, LightGBM, MLflow를, kserve-torchserve는 PyTorch를 지원한다.", "src": "AI&ML_1_AI_n_MLOps_Platform_슬라이드별.md 슬라이드8", "id": "3-8c-03"}, {"item": "3-8d", "t": "Container Registry(CloudML)", "q": "SCP(Samsung Cloud Platform) CloudML에서 Container Registry를 머신러닝 모델 관리에 활용하는 방식에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["학습된 모델 파일, 실행 코드, 환경 설정을 하나의 이미지로 패키징하여 환경 불일치로 인한 배포 오류를 줄인다.", "이미지에 모델 버전, 학습일, 하이퍼파라미터 등의 메타 정보를 태그 또는 레이블로 기록해 실험 결과를 추적한다.", "GitHub Actions, Jenkins 같은 CI/CD 도구와 통합해 학습 완료부터 이미지 생성, 배포까지 자동화할 수 있다.", "Registry에 저장된 모델 이미지는 KServe 전용 형식이므로 Seldon Core, SageMaker 등 다른 서빙 플랫폼과는 연동되지 않는다.", "컨테이너가 실행 환경을 포함하므로, 이미지를 실행하는 즉시 모델 실행 환경을 복원·재현할 수 있다."], "a": 3, "e": "컨테이너 기반 모델은 KServe뿐 아니라 Seldon Core, SageMaker 등 다양한 서빙 플랫폼과 쉽게 연동되어 배포 자동화와 롤백을 유연하게 수행할 수 있다.", "src": "AI&ML_2_CloudML_슬라이드별.md 슬라이드4·6", "id": "3-8d-01"}, {"item": "3-8d", "t": "MLflow(CloudML)", "q": "SCP(Samsung Cloud Platform) CloudML의 구성 요소인 MLflow에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["MLflow에 등록된 모델은 Python SDK로만 불러올 수 있으며, REST API나 CLI로는 접근할 수 없다.", "mlflow.set_experiment()로 실험 그룹을 지정하고, start_run()으로 개별 실험 실행 단위를 생성한다.", "log_model()에 registered_model_name을 지정하면 모델이 Model Registry에 등록되어 버전별로 관리된다.", "등록된 모델은 'models:/모델명/버전' 형식의 URI와 pyfunc.load_model()로 불러와 예측에 사용할 수 있다.", "Model Registry에서 모델을 Staging, Production, Archived 등 단계별로 구분해 운영할 수 있다."], "a": 0, "e": "MLflow에 저장된 모델은 REST API, CLI, Python SDK를 통해 불러올 수 있어 다양한 애플리케이션 및 서빙 플랫폼과 통합하기 쉽다.", "src": "AI&ML_2_CloudML_슬라이드별.md 슬라이드4·8·15", "id": "3-8d-02"}, {"item": "3-8d", "t": "Container Registry 배포 절차", "q": "C 고객사는 CloudML에서 학습한 모델을 Container Registry를 활용해 KServe로 배포하려고 합니다. 작업 순서로 옳은 것은 무엇입니까?", "o": ["ㄴ → ㄱ → ㅁ → ㄹ → ㄷ", "ㅁ → ㄴ → ㄱ → ㄷ → ㄹ", "ㄴ → ㅁ → ㄹ → ㄱ → ㄷ", "ㄴ → ㅁ → ㄱ → ㄹ → ㄷ", "ㄱ → ㄴ → ㅁ → ㄹ → ㄷ"], "a": 3, "e": "모델 학습·저장 → 모델 서버 코드 작성 → Dockerfile로 컨테이너화 및 빌드·테스트 → 태깅 후 Registry에 Push → InferenceService로 배포 순이다. 재학습 시에는 새 이미지를 v2로 Push하고 YAML의 image를 변경한다.", "src": "AI&ML_2_CloudML_슬라이드별.md 슬라이드6", "s": "ㄱ. Dockerfile로 모델 파일과 서버 코드를 컨테이너화하고 이미지를 빌드·테스트한다.\nㄴ. 모델을 학습시키고 model.pkl 파일로 저장한다.\nㄷ. InferenceService YAML에 이미지 경로를 지정하고 kubectl apply로 배포한다.\nㄹ. 이미지를 태깅(:v1)하고 Container Registry에 로그인한 뒤 Push한다.\nㅁ. FastAPI 등으로 모델을 불러와 예측하는 모델 서버 코드를 작성한다.", "fix": true, "id": "3-8d-03"}, {"item": "3-8e", "t": "Simple AI Inference", "q": "SCP(Samsung Cloud Platform)의 Simple AI Inference에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["OpenAI API와 호환되어 기존 개발 환경과 프레임워크에 쉽게 연동할 수 있다.", "추론에 사용된 GPU 인스턴스의 가동 시간을 기준으로 시간 단위 과금된다.", "분당 토큰 처리량(TPM)과 분당 요청 횟수(RPM) 제한으로 트래픽을 제어할 수 있다.", "신청한 모델은 같은 계정(Account) 내의 모든 사용자가 사용할 수 있다.", "Safety Guard 기능을 제공하며, 고객 데이터는 제공되는 모델의 학습에 사용되지 않는다."], "a": 1, "e": "Simple AI Inference는 인프라 관리 없이 API로 호출하는 서버리스 방식이며, 입력·캐시·출력 토큰 사용량에 따라 과금되는 종량제다.", "src": "일반지식(삼성SDS Simple AI Inference 서비스 소개 페이지, 교재 미수록)", "id": "3-8e-01"}, {"item": "3-8e", "t": "Simple AI Training", "q": "SCP(Samsung Cloud Platform)의 Simple AI Training에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["서버 생성, 드라이버 설치, 네트워크 설정 없이 학습 스크립트와 데이터만 준비하면 학습할 수 있고, 학습이 끝나면 자원이 자동으로 회수된다.", "Checkpointing으로 중간 결과를 Object Storage에 저장해 체크포인트에서 학습을 재개할 수 있다.", "Spot Training은 유휴 GPU를 사용하면서도 학습 중단 없이 실행을 보장하므로 우선순위가 높은 장기 학습에 적합하다.", "GPU 오류가 발생하면 GPU Failover 기능으로 자동 복구하여 학습을 이어간다.", "Warm Pool은 연속 작업 시 인스턴스를 재사용하여 프로비저닝 시간을 줄인다."], "a": 2, "e": "Spot Training은 유휴 GPU를 활용해 비용을 줄이는 대신 중단·재개가 발생할 수 있어 우선순위가 낮은 학습에 적합하다. 중단 없이 안정적으로 학습하려면 On-demand나 약정 요금제를 쓴다.", "src": "일반지식(삼성SDS Simple AI Training 서비스 소개 페이지, 교재 미수록)", "id": "3-8e-02"}, {"item": "3-8e", "t": "AI/ML 서비스 선택", "q": "다음 중 요구사항과 이를 충족하는 SCP(Samsung Cloud Platform) AI/ML 서비스를 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["인프라 관리 없이 API로 LLM을 호출해 사내 문서 요약 챗봇을 빠르게 구축 - Simple AI Inference", "학습 스크립트와 데이터만 준비해 GPU 클러스터를 직접 구축하지 않고 대규모 모델을 학습 - Simple AI Training", "Notebook 기반 개발부터 파이프라인, 하이퍼파라미터 튜닝, 모델 서빙까지 Kubernetes 위에서 자체 MLOps 환경 운영 - AI&MLOps Platform", "실험별 파라미터·메트릭 기록과 모델 버전 관리 - MLflow", "외부 인터넷 노출 없이 SCP 내부 애플리케이션에서만 LLM을 호출 - Simple AI Inference의 Public 엔드포인트"], "a": 4, "e": "Simple AI Inference는 외부 접속용 Public 엔드포인트와 SCP 내부 전용 Private 엔드포인트를 제공하므로, 내부 전용 호출에는 Private 엔드포인트를 선택해야 한다.", "src": "일반지식(삼성SDS Simple AI Inference/Training·AI&MLOps Platform 소개 페이지), AI&ML_2_CloudML_슬라이드별.md 슬라이드4", "id": "3-8e-03"}, {"item": "4-1a", "t": "Backup 스케줄·복구", "q": "SCP(Samsung Cloud Platform) Backup 서비스의 백업 방식 및 복구에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["복구 시 생성되는 서버의 Block Storage 유형과 Keypair는 원본과 무관하게 복구 팝업에서 새로 선택해야 한다.", "스케줄을 수정할 때 최소 1개의 Full Backup 스케줄은 반드시 등록되어 있어야 한다.", "Virtual Server는 VM 이미지(OS+Data) 단위의 Agentless 방식으로, Bare Metal Server는 Filesystem 단위의 Agent 방식으로 백업한다.", "백업본으로 복구하면 원본 서버를 덮어쓰지 않고 복구된 Virtual Server가 새로 생성된다.", "Backup 서비스의 SLA 가용률은 고객 요청 백업의 실패 건수를 기준으로 산정하며, 재수행에 성공한 경우는 장애에서 제외된다."], "a": 0, "e": "복구 시 신규 서버가 생성되며, Block Storage 유형과 Keypair는 원본과 동일하게 설정된다. 복구는 원본 서버를 덮어쓰지 않고 새 서버를 만드는 방식이다.", "src": "SCP_v2_Explore_Storage_20-24.md Backup 슬라이드5·7·9·11, WA백서 01 p.5", "id": "4-1a-02"}, {"item": "4-1a", "t": "서비스별 백업 방식", "q": "SCP(Samsung Cloud Platform)의 서비스별 백업 방식에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server는 Backup 서비스로 VM 스냅샷 기반의 전체 또는 증분 백업을 수행하며, 백업본은 SCP가 관리하는 저장소에 보관된다.", "DBaaS는 내장 백업 기능을 사용하며, 백업본은 사용자가 관리하는 Object Storage에 저장된다.", "DBaaS 백업본의 보존 기간은 7일~35일 범위에서 설정한다.", "Object Storage는 Backup 서비스에 등록하여 일 단위 전체 백업을 수행하는 방식으로 데이터를 보호한다.", "File Storage는 내장 스냅샷 기능으로 데이터를 보호하며, 스냅샷은 File Storage 내부에 저장된다."], "a": 3, "e": "Object Storage는 백업 방식을 사용하지 않고, 변경이 발생할 때마다 이전 버전을 저장하는 버전 관리 방식으로 데이터를 보호한다.", "src": "WA백서 03 p.10~13", "id": "4-1a-03"}, {"item": "4-1a", "t": "백업 정책 설계", "q": "D 고객사는 Virtual Server와 DBaaS로 구성된 업무 시스템의 백업 정책을 새로 수립하고 있습니다. 야간에 배치 작업이 수행되며, 일부 백업본은 법적 보존 기간 동안 안전하게 보관해야 합니다. D 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["일 단위 백업은 업무 종료 시점부터 다음 날 업무 개시 전 사이에 수행되도록 스케줄을 설정한다.", "백업 시점이 배치 작업 전인지 후인지에 따라 복구 시 추가 작업이 달라지므로, 이를 고려해 백업 시간을 정한다.", "이미 운영 중인 Virtual Server의 기존 Backup 서비스에 DR 옵션을 추가로 활성화하여 DR 사이트로 백업본을 복제한다.", "장기 보존이 필요한 백업본은 저장된 Object Storage 버킷을 Archive Storage로 아카이빙한다.", "백업본이 저장된 버킷에 접근 허용 서버, IP 주소, 엔드포인트를 지정하고 버킷 암호화를 설정한다."], "a": 2, "e": "Backup의 DR 옵션은 서비스 생성 시에만 활성화할 수 있으며, 이미 생성된 Backup 서비스에는 활성화할 수 없다. DR을 구성하려면 새로운 Backup 서비스를 생성해야 한다.", "src": "WA백서 03 p.10·11·15", "id": "4-1a-04"}, {"item": "4-1b", "t": "RTO/RPO 도출", "q": "다음은 시스템 S가 처리하는 업무와 각 복구 목표입니다. WA 백서의 도출 방식에 따라 시스템 S에 적용할 RTO와 RPO로 옳은 것은 무엇입니까?", "o": ["RTO 6시간, RPO 1시간", "RTO 4시간, RPO 30분", "RTO 1일, RPO 1일", "RTO 4시간, RPO 1시간", "RTO 6시간, RPO 30분"], "a": 1, "e": "시스템과 그 시스템이 처리하는 업무의 RTO·RPO 중 최소값을 해당 시스템의 목표로 도출한다. 따라서 RTO는 4시간, RPO는 30분이다.", "src": "WA백서 03 p.6", "s": "- 시스템 S 자체 목표: RTO 6시간, RPO 1시간\n- 업무 P(시스템 S 사용): RTO 4시간, RPO 1일\n- 업무 Q(시스템 S 사용): RTO 1일, RPO 30분", "id": "4-1b-02"}, {"item": "4-1b", "t": "SCP 서비스별 DR 수단", "q": "SCP(Samsung Cloud Platform)의 서비스별 DR 구현 수단에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server DR에서 실제로 복제되는 대상은 Block Storage이며, DR 사이트의 Virtual Server는 정지된 상태로 유지된다.", "File Storage DR의 복제 주기는 5분, 1시간, 매일, 매주, 매월 중에서 선택할 수 있다.", "File Storage DR은 주 사이트 File Storage에서 DR Region, DR Volume명, 복제 주기를 설정하여 구성한다.", "File Storage DR은 재해 상황 시 동기화를 중단하고 복제 볼륨을 R/W 모드로 변경하여 사용한다.", "File Storage DR의 복제 주기를 '매일'로 설정하면 매일 00:00:00에 복제가 수행된다."], "a": 4, "e": "File Storage DR 복제 주기는 5분, 1시간, 매일, 매주, 매월 중 선택하며, 매일 복제는 23:59:00, 매주는 일요일 23:59:00, 매월은 1일 23:59:00에 수행된다.", "src": "WA백서 03 p.21·22·24", "id": "4-1b-03"}, {"item": "4-1b", "t": "재해 선언·DR 훈련", "q": "다음 중 재해 복구 계획 및 재해복구 모의훈련에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["재해복구 모의훈련의 모의전환 단계에서도 실 업무를 재해복구 시스템으로 전환하여 실제 서비스 처리 여부를 검증해야 한다.", "장애가 허용된 시간 내에 복구가 불가능하다고 판단되면 '재해'를 선언하고 사전에 수립된 재해 복구 계획에 따라 절차를 이행한다.", "재해는 정보기술기반 외부에서 발생해 예방과 통제가 어렵고, 장애는 정보기술기반 내부에서 발생해 통제가 가능하다.", "주 사이트와 DR 사이트의 구성 차이를 막기 위해 변경은 테스트/스테이징 환경에서 먼저 검증한 뒤 두 사이트에 함께 반영한다.", "금융감독원 권고에 따르면 은행 및 증권은 재해 발생 후 3시간 이내, 보험은 24시간 이내에 완전 복구가 가능해야 한다."], "a": 0, "e": "재해복구 모의훈련 절차 예시에서 모의전환 훈련 시에는 실 업무를 전환하지 않는다. 재해 선언, 재해·장애 구분, 주/DR 사이트 일관성 유지, 금융권 복구 시간 권고는 모두 백서 내용과 일치한다.", "src": "WA백서 03 p.7·8·9·27·29", "id": "4-1b-04"}, {"item": "4-2a", "t": "WAF", "q": "SCP(Samsung Cloud Platform) WAF 서비스를 신청하기 전에 확인해야 할 사항에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["WAF는 Virtual Server에 WAF 라이선스를 설치하는 방식으로 제공되므로, 원하는 사양의 Virtual Server를 먼저 생성해야 한다.", "SCP Load Balancer와 WAF 간 bypass를 지원하지 않으므로, WAF 단일 구성 시 WAF 서버 장애가 나면 서비스 연속성을 보장할 수 없다.", "SCP 보안관제는 펜타시큐리티 상품(운영+관제)에 한정하여 제공된다.", "마켓플레이스에서 다른 벤더의 WAF 상품을 설치하더라도 삼성SDS 보안관제가 동일하게 제공된다.", "엔지니어가 직접 설치를 지원하므로 신청부터 구축까지 시간이 소요된다."], "a": 3, "e": "마켓플레이스에 다른 벤더 WAF 상품이 있더라도 삼성SDS 보안관제는 제공되지 않으며, 관제는 펜타시큐리티 상품에 한정됩니다. 가용성이 중요하면 WAF 이중화를 별도로 요청해야 합니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 3. WAF 사전 체크 사항", "id": "4-2a-02"}, {"item": "4-2a", "t": "WAF 구축", "q": "MSP가 WAF 구축을 위해 SCP Console에서 수행하는 작업을 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄱ → ㅁ → ㄹ → ㄷ", "ㄴ → ㅁ → ㄱ → ㄹ → ㄷ", "ㅁ → ㄴ → ㄹ → ㄱ → ㄷ", "ㅁ → ㄱ → ㄴ → ㄹ → ㄷ", "ㄴ → ㅁ → ㄹ → ㄱ → ㄷ"], "a": 1, "e": "Console 작업은 SSL 인증서 등록 → WAF용 Virtual Server 생성 → Load Balancer 생성 → SSL Offloading용 L7 서비스 생성 → (필요 시 L4, LB/Firewall/SG 설정) → WAF 엔지니어 접근 권한 부여 순입니다. L7 서비스는 Load Balancer가 먼저 있어야 생성할 수 있습니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 3. WAF 구축 프로세스", "s": "ㄱ. Load Balancer 생성\nㄴ. Certificate Manager에 SSL 인증서 등록\nㄷ. WAF용 VM에 WAF 엔지니어 접근 권한 부여\nㄹ. SSL Offloading용 L7 서비스 생성\nㅁ. WAF용 Virtual Server 생성", "fix": true, "id": "4-2a-03"}, {"item": "4-2a", "t": "IPS/DDoS 선행", "q": "A 고객사는 일반 Internet Gateway로 인터넷 서비스를 운영 중인 VPC에 IPS와 DDoS Protection을 적용하려고 합니다. 이에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["사용자가 Console의 Security 메뉴에서 IPS를 직접 생성하여 즉시 사용할 수 있다.", "IPS는 인터넷에서 접근할 수 없는 Private IP 기반 내부 서버를 대상으로 제공된다.", "IPS는 공격 시도 IP를 탐지하면 해당 IP를 고객 Firewall에 자동으로 등록하여 차단한다.", "DDoS Protection은 L7 애플리케이션 계층의 HTTP Flood 공격만을 학습 기반으로 탐지한다.", "IPS와 DDoS Protection을 이용하려면 Internet Gateway 구분을 SIGW로 선택해야 하며, SIGW로 변경하면 공인 IP가 바뀐다."], "a": 4, "e": "IPS와 DDoS Protection은 모두 IGW의 구분에서 SIGW를 선택해야 이용할 수 있고, SIGW로 바꾸면 공인 IP가 변경됩니다. 신청은 Support Center 서비스 요청으로 하며, 공격 IP는 정보 제공 후 SCP N/W 방화벽 차단을 권고하는 방식이고, DDoS는 L3/L4 레벨을 다룹니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 2. IPS, 4. DDoS Protection", "id": "4-2a-04"}, {"item": "4-2b", "t": "Secured VPN", "q": "SCP(Samsung Cloud Platform) Secured VPN에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["고객사가 보유한 지점 VPN 장비는 벤더와 모델에 관계없이 별도 확인 없이 센터 VPN과 연동할 수 있다.", "IPSec VPN에 국가 검증필 암호모듈이 적용된다.", "센터 VPN 장비는 다수 고객의 공용 장비이므로, 타 고객 VPC 대역이나 SCP 사용 대역과 중복되는 IP 대역은 사용할 수 없다.", "Virtual Private Gateway 생성 시 네트워크 규모를 고려하여 양방향 트래픽 대역폭을 선택한다.", "모바일 근무자는 SSL VPN Client를 설치하여 접속할 수 있다."], "a": 0, "e": "지점 VPN은 SECUI 장비를 임대(별도 비용)하며, 타 벤더 장비를 쓰려면 센터 VPN(SECUI)과 호환되는 모델인지 확인해야 합니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 6. Secured VPN", "id": "4-2b-01"}, {"item": "4-2b", "t": "Secured Firewall", "q": "SCP(Samsung Cloud Platform) Secured Firewall에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Direct Connect 생성과 Uplink 회선 신청이 완료되어야 이용할 수 있다.", "사용자가 Console의 Firewall 규칙 화면에서 직접 정책을 입력하여 적용하는 서비스이다.", "서비스 신청 시 등록한 메일로 방화벽 정책 신청 양식이 발송되며, 이 양식을 참고하여 방화벽 정책을 신청한다.", "웹사이트 취약점을 노리는 Injection, XSS 등 HTTP/HTTPS 기반 위협을 차단하는 것이 주 목적이다.", "인터넷에서 접근할 수 없는 Private IP 기반 서버만을 보호 대상으로 한다."], "a": 2, "e": "Secured Firewall은 VPC를 선행 서비스로 하는 관제형 차세대 방화벽으로, 신청 시 등록한 메일로 정책 신청 양식이 발송됩니다. Direct Connect·Uplink 선행은 Secured VPN, 웹 공격 차단은 WAF의 특징이며, Secured Firewall은 VPC 내 공인 IP 기반으로 인터넷 접근 가능한 서버가 대상입니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 5. Secured Firewall", "id": "4-2b-02"}, {"item": "4-2b", "t": "Secured VPN", "q": "공공기관 B는 본사 네트워크와 SCP VPC를 연결하면서 국가 검증필 암호모듈 적용과 보안 전문가의 VPN 운영을 요구하고 있습니다. B기관을 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Direct Connect를 생성하고 Support Center 서비스 요청으로 Uplink 회선 신청을 먼저 완료한다.", "Console의 Networking VPN 메뉴에서 VPN Gateway와 VPN Tunnel을 직접 생성하여 요구사항을 충족한다.", "신청 전에 본사 VPN과 SCP에서 사용할 IP 대역이 중복되지 않는지 확인한다.", "Support Center의 서비스 요청을 통해 Secured VPN 생성을 신청한다.", "서비스 개시를 위해 고객사 대역에 지점 VPN을 설치한 후 연동 점검을 받는다."], "a": 1, "e": "Console에서 직접 만드는 Networking VPN은 인터넷 기반 IPSec 서비스이고, 국가 검증필 암호모듈과 전문가 운영은 Security의 Secured VPN 특징입니다. Secured VPN은 서비스 요청으로 신청하며 Direct Connect와 Uplink 회선이 선행되어야 합니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 6. 일반 VPN vs Secured VPN", "id": "4-2b-03"}, {"item": "4-2c", "t": "FPMS", "q": "SCP(Samsung Cloud Platform) FPMS의 특장점에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["신청 정보의 IP, Port 등이 문법과 구조에 맞는 값인지 검사하여 휴먼 에러로 인한 장애를 예방한다.", "DR 백업 방화벽을 위해 신청된 정책을 다른 방화벽으로 복제할 수 있다.", "Optimizer 알고리즘을 활용하여 방화벽 정책을 최적화한다.", "과다한 오픈 정책, 만료되거나 관리하지 않는 정책을 분석하고 진단 부문별 점수를 수치화한다.", "방화벽·IPS·DDoS 장비의 보안 이벤트 로그를 실시간으로 수집하여 고객의 보안관제 장비로 전송한다."], "a": 4, "e": "보안 장비 로그를 실시간 수집·전송하는 것은 Log Transmission입니다. FPMS는 방화벽 정책 관리와 운영 업무를 자동화하여 휴먼 에러를 없애고 리드타임을 줄이는 서비스입니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드47", "id": "4-2c-01"}, {"item": "4-2c", "t": "FPMS 등록", "q": "SCP(Samsung Cloud Platform) FPMS에 방화벽을 등록하는 절차를 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄹ → ㄷ → ㄴ → ㄱ", "ㄷ → ㄴ → ㄹ → ㄱ", "ㄷ → ㄹ → ㄴ → ㄱ", "ㄷ → ㄹ → ㄱ → ㄴ", "ㄹ → ㄷ → ㄱ → ㄴ"], "a": 2, "e": "먼저 방화벽이 연동 가능한지(제조사·모델·OS 버전) 확인하고 연동 계정·API를 설정한 뒤, FPMS에 방화벽을 등록하고, 기존 정책이 있으면 자원 동기화로 정보를 일치시킨 후 신청 시스템과 연동합니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드24~25", "s": "ㄱ. 신청 시스템 연동하기\nㄴ. 방화벽 자원 동기화하기(방화벽 정책·NAT 정책·객체 정보 일치)\nㄷ. 방화벽 설정하기(연동 가능 방화벽 확인 및 API 연동 계정 설정)\nㄹ. FPMS 내 방화벽 등록/설정하기(API 연동정보, Zone 정보 등)", "fix": true, "id": "4-2c-02"}, {"item": "4-2c", "t": "ESS", "q": "SCP(Samsung Cloud Platform) Endpoint Security Suite(ESS)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["사내망에 연결된 PC에만 보안 정책을 전송할 수 있으므로, 출장자·외근 PC는 정책 예외용 임시코드를 발급해 전달해야 한다.", "On-Premise로 제공되던 ESCORT, NASCA, SecuPrint를 SaaS로 제공하여 도입·운영 비용을 절감할 수 있다.", "솔루션별로 제공되던 관리 콘솔을 One-View 통합 관리 콘솔로 통합한다.", "SecuPrint는 중요 정보와 개인정보가 출력을 통해 외부로 유출되는 것을 차단하고 모니터링한다.", "다양한 공통 기능을 Rest API로 제공하여 포인트 솔루션과의 연계 및 확장이 용이하다."], "a": 0, "e": "ESS는 인터넷망을 사용하므로 사업장 내·외 구분 없이 동일 수준의 PC 보안 관리가 가능하며, 출장자·외근 PC에 대해 임시코드 발급 없이 정책 적용과 예외처리를 즉시 할 수 있습니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드33, 39, 48", "id": "4-2c-03"}, {"item": "4-2d", "t": "Certificate Manager", "q": "SCP(Samsung Cloud Platform) Certificate Manager에 CA에서 발급받은 사용자 인증서를 등록할 때의 입력 항목에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Private Key는 유출에 대비하여 패스프레이즈로 암호화된 상태의 PEM 값을 입력해야 한다.", "Private Key는 PEM 형식이며 RSA를 지원한다.", "Certificate Body에는 Server(Leaf) 인증서 1개만 PEM 형식으로 입력한다.", "Certificate Chain에는 Intermediate(Sub) CA → Root CA 순서로 상위 인증서를 입력한다.", "공인 인증서는 Certificate Chain을 반드시 입력하며, 중간 인증서가 없거나 자체 서명일 때만 생략할 수 있다."], "a": 0, "e": "Private Key는 암호화되지 않은(복호화된) 값을 입력해야 합니다. 입력 후에는 인증서 유효성 검증을 거쳐 사용 가능한 인증서만 배포됩니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 1. 생성 ① 사용자 인증서", "id": "4-2d-02"}, {"item": "4-2d", "t": "Certificate Manager", "q": "SCP(Samsung Cloud Platform) Certificate Manager에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Certificate Manager를 생성하려면 Load Balancer가 선행 서비스로 먼저 생성되어 있어야 한다.", "자체 발급(Self-signed) 인증서는 공인 인증서보다 신뢰도가 높아 운영 환경 사용이 권장된다.", "Region당 사용자 인증서의 기본 Quota는 50개이다.", "연결된 자원(Load Balancer Listener)이 있으면 해지할 수 없으므로, LB Listener 연결을 먼저 해지한 후 서비스를 해지한다.", "인증서 만료 알림은 별도 설정 없이 Account의 모든 사용자에게 자동 발송된다."], "a": 3, "e": "Certificate Manager는 선행 서비스가 없고 Load Balancer가 후행 서비스이며, LB Listener와 연결되어 있으면 해지할 수 없습니다. Quota는 Region당 사용자·자체 발급 인증서 각 100개이고, 만료 알림은 Notification Manager에서 알림 정책을 생성해야 사용할 수 있습니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 1. 선/후행, Quota, 만료 알림, 해지", "id": "4-2d-03"}, {"item": "4-2d", "t": "Certificate Manager", "q": "SCP(Samsung Cloud Platform) Certificate Manager의 자체 발급 인증서(Self-signed)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["상대적으로 보안에 취약하므로 개발/테스트 용도로 사용하는 것을 권장한다.", "Common Name 항목에는 인증서를 사용하는 조직이나 부서명을 입력한다.", "Organization Unit은 필수 입력 항목이다.", "인증서 시작일(생성일)과 만료일 정보를 가진다.", "만료 45일, 30일, 15일, 7일, 1일 전에 만료 알림 메일을 받을 수 있다."], "a": 1, "e": "Common Name에는 인증서를 사용할 도메인 이름을 입력하고, 조직·부서는 Organization Unit에 입력합니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 1. 생성 ② 자체 발급 인증서", "id": "4-2d-04"}, {"item": "4-2e", "t": "Secrets Manager", "q": "SCP(Samsung Cloud Platform) Secrets Manager에서 Secret을 생성할 때 암호화 키로 선택할 수 없는 것은 무엇입니까?", "o": ["암/복호화(AES-256) 용도의 고객 관리형 KMS 키", "암/복호화 및 서명/검증(RSA-2048) 용도의 고객 관리형 KMS 키", "암/복호화(ARIA) 용도의 고객 관리형 KMS 키", "Secrets Manager가 제공하는 KMS 키", "생성/검증(HMAC) 용도의 고객 관리형 KMS 키"], "a": 4, "e": "Secret 암호화에는 암/복호화 용도의 KMS 키(AES-256, RSA-2048, ARIA)만 선택할 수 있습니다. HMAC은 생성/검증 용도이므로 선택할 수 없습니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드36~37, 49", "id": "4-2e-02"}, {"item": "4-2e", "t": "Secrets Manager", "q": "SCP(Samsung Cloud Platform) Secrets Manager의 접근 제어에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["퍼블릭 접근 제어는 필수 항목이며 퍼블릭 접근 허용 IP를 최대 10개까지 등록할 수 있다.", "/24 ~ /32 대역도 등록할 수 있지만 보안 강화를 위해 단일 IP 등록이 권장된다.", "프라이빗 접근 제어를 사용 설정하지 않으면 모든 프라이빗 리소스의 접근이 차단된다.", "프라이빗 접근 제어를 사용하면 Virtual Server 등 접근을 허용할 리소스를 선택하여 추가한다.", "등록한 퍼블릭 접근 허용 IP와 프라이빗 접근 허용 리소스는 Secret 생성 이후에도 수정할 수 있다."], "a": 2, "e": "프라이빗 접근 제어는 선택 항목이며, 사용 설정을 하지 않으면 동일 리전의 모든 서브넷 리소스가 접근 허용 상태가 됩니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드38~39, 44", "id": "4-2e-03"}, {"item": "4-2e", "t": "Secrets Manager", "q": "D 고객사 개발팀은 애플리케이션 소스코드에 하드코딩된 DB 비밀번호를 제거하려고 합니다. D 고객사를 위한 Secrets Manager 활용 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["DB 접속 정보를 Key/Value 형태의 Secret으로 저장하고 애플리케이션이 호출하여 조회하게 한다.", "Key Management Service에서 암/복호화 용도의 고객 관리형 키를 미리 생성하여 Secret 암호화 키로 선택한다.", "Secret이 수정될 때마다 생성되는 버전에 레이블을 설정하여 효율적으로 관리한다.", "여러 리전의 애플리케이션이 하나의 Secret을 함께 참조할 수 있도록 한 리전에만 Secret을 생성한다.", "DB 접속 정보는 Secret당 최대 10개의 Key/Value Pair, 최대 64KB 범위에서 저장한다."], "a": 3, "e": "Secrets Manager는 리전 서비스로, 생성된 Secret은 해당 리전 내에서만 사용할 수 있습니다. 다른 리전의 애플리케이션은 그 리전에 별도로 Secret을 생성해야 합니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드34, 36, 45, 49", "id": "4-2e-04"}, {"item": "4-2f", "t": "KMS", "q": "SCP(Samsung Cloud Platform) Key Management Service의 서비스 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["암호화 키는 계층적으로 암호화된 중앙 집중 암호화 키 방식으로 관리된다.", "데이터 키는 HSM에 저장되며, 마스터 키를 생성하는 루트 역할을 한다.", "마스터 키는 FIPS 140-2 Lv3 표준을 준수하는 HSM에 저장된 루트 키를 통해 생성된다.", "데이터 키는 실제 데이터를 암호화하는 데 사용되며, 암호화를 수행하는 대상 서비스별로 생성된다.", "용도에 따라 대칭 키(AES), HMAC, 비대칭 키(RSA), ECDSA 키를 생성할 수 있다."], "a": 1, "e": "HSM에는 KMS 시스템 영역의 루트 키가 저장되고, 이 루트 키로 마스터 키를 만들며, 마스터 키로 데이터 키를 생성합니다. 데이터 키는 실제 데이터 암호화에 쓰이는 최하위 키입니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드8", "id": "4-2f-02"}, {"item": "4-2f", "t": "KMS", "q": "SCP(Samsung Cloud Platform) Key Management Service에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["공공 인증 알고리즘 옵션을 선택하여 생성한 키는 SCP Sovereign에서만 사용할 수 있다.", "Region당 생성할 수 있는 KMS Key의 기본 할당량은 1,000개이다.", "키를 비활성화하더라도 해당 키를 이미 사용 중인 사용자는 계속 키를 사용할 수 있다.", "KMS 키에는 자원당 최대 100개의 태그를 추가할 수 있다.", "KMS를 사용하면 애플리케이션 코드 작성 없이 모든 데이터가 자동으로 암호화된다."], "a": 0, "e": "공공 인증 알고리즘 옵션은 SCP Sovereign 전용입니다. KMS Key는 Region당 10,000개, 태그는 자원당 최대 50개이며, 키를 비활성화하면 사용자들이 더 이상 키를 사용할 수 없고, KMS로 암호화하려면 사용자가 직접 애플리케이션에 암호화 코드를 작성해야 합니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드5, 10, 19 / WA백서 02 p.20", "id": "4-2f-03"}, {"item": "4-2f", "t": "KMS 봉투 암호화", "q": "SCP(Samsung Cloud Platform) KMS 키를 활용한 봉투 암호화(Envelope Encryption) 예제 시나리오를 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㅁ → ㄹ → ㄱ → ㄷ", "ㄹ → ㄴ → ㅁ → ㄷ → ㄱ", "ㄴ → ㄹ → ㅁ → ㄷ → ㄱ", "ㄴ → ㄹ → ㅁ → ㄱ → ㄷ", "ㄴ → ㄹ → ㄱ → ㅁ → ㄷ"], "a": 3, "e": "Datakey 발급 → Datakey로 데이터 암호화 → 암호화된 데이터와 암호화된 Datakey를 봉투화 저장 → 복호화 시에는 먼저 Datakey를 복호화한 뒤 그 Datakey로 데이터를 복호화합니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드21", "s": "ㄱ. 암호화된 봉투 파일의 Datakey를 복호화\nㄴ. 비밀번호를 봉투 암호화하기 위해 KMS에서 Datakey를 발급받음\nㄷ. 복호화된 Datakey로 봉투 파일의 암호화 데이터를 복호화\nㄹ. 발급받은 Datakey로 비밀번호를 암호화\nㅁ. 암호화된 비밀번호와 암호화된 Datakey를 봉투화하여 JSON 파일로 저장", "fix": true, "id": "4-2f-04"}, {"item": "4-2g", "t": "Secret Vault", "q": "SCP(Samsung Cloud Platform) Secret Vault를 이용하여 SCP 자원에 접근하는 과정을 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄹ → ㄱ → ㅁ → ㄷ", "ㄴ → ㄹ → ㅁ → ㄱ → ㄷ", "ㄹ → ㄴ → ㄱ → ㅁ → ㄷ", "ㄴ → ㅁ → ㄹ → ㄱ → ㄷ", "ㄴ → ㄱ → ㄹ → ㅁ → ㄷ"], "a": 0, "e": "사전에 Console에서 발급받은 인증키로 Token을 요청·발급받고, Token을 Application에 설정한 다음, Token으로 OpenAPI 임시키를 발급받아 자원에 접근합니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드25, 27 / WA백서 02 p.13", "s": "ㄱ. 발급받은 Token을 Application에 설정\nㄴ. Console에서 보안 인증방식이 '임시키 인증'인 인증키를 발급\nㄷ. 발급받은 임시키로 SCP의 서비스 및 자원에 접근\nㄹ. 인증키 정보로 Secret Vault에 Token을 요청하여 발급받음\nㅁ. Token 정보로 API를 호출하여 OpenAPI 임시키를 발급받음", "fix": true, "id": "4-2g-01"}, {"item": "4-2g", "t": "Secret Vault", "q": "SCP(Samsung Cloud Platform) Secret Vault 생성 시 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["사용할 인증키의 보안 인증방식은 반드시 임시키 인증으로 설정되어 있어야 한다.", "인증키 1개당 1개의 Secret Vault 상품만 신청할 수 있다.", "Secret Vault에 지정한 접근 허용 IP는 인증키의 접근 허용 IP에도 동일하게 설정해야 접근이 허용된다.", "인증키 유효 기간을 영구로 설정한 경우 Token 사용 기간은 최대 7,300일(20년)까지 설정할 수 있다.", "Token 사용 기간은 서비스 신청 완료 후에도 상세 정보에서 필요에 따라 연장할 수 있다."], "a": 4, "e": "Token 사용 기간은 서비스 신청 완료 후 변경할 수 없습니다. Token이 만료되면 서비스를 새로 신청해 Token을 다시 발급받아야 합니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드27", "id": "4-2g-02"}, {"item": "4-2g", "t": "Secret Vault", "q": "SCP(Samsung Cloud Platform) Secret Vault의 임시키·Token 수명 주기 관리에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Expired 상태는 서비스 해지를 신청한 후 해지 대기 기간 중인 상태를 의미한다.", "인증키 정보는 SHA-256 해시 값으로 변환하여 저장된다.", "Token 사용 기간이 만료되면 임시키를 발급할 수 없으며, 서비스를 신규 신청하여 Token을 새로 발급받아야 한다.", "접근 제어는 IAM 사용자 그룹 단위로만 설정할 수 있다.", "Token은 Token ID 단일 값으로 구성되어 별도의 Secret이 필요하지 않다."], "a": 2, "e": "Token이 만료되면 임시키 발급이 불가능하므로 신규 신청이 필요합니다. 해지 대기는 To be terminated, Expired는 Token 만료 상태이며, 인증키는 AES-256으로 암호화 저장되고, 접근 제어는 IP 기반이며, Token은 Token ID와 Token Secret으로 구성됩니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드24, 29, 48", "id": "4-2g-03"}, {"item": "4-2h", "t": "SingleID", "q": "SCP(Samsung Cloud Platform) SingleID 생성 시 서비스 구성 선택 규칙에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["IM을 선택하면 AM이 자동으로 함께 선택된다.", "ADM을 선택하면 AM, IM, MFA가 자동으로 함께 선택된다.", "MFA만 단독으로 선택하면 간편 인증 기능은 제공되지 않는다.", "MFA를 선택하면 IM이 자동으로 함께 선택된다.", "CAM을 선택하면 등록할 리소스 Unit 수를 입력해야 한다."], "a": 3, "e": "IM 또는 MFA를 선택하면 AM이 자동 선택되고, ADM·CAM을 선택하면 AM·IM·MFA가 자동 선택됩니다. MFA 선택 시 IM이 자동으로 붙지는 않습니다.", "src": "SEC2_SingleID_정리 3. SingleID 생성 ①②", "id": "4-2h-02"}, {"item": "4-2h", "t": "SingleID", "q": "E 고객사는 AWS, Azure, SCP를 함께 사용하는 멀티 클라우드 환경에서 운영자 등 특권 사용자의 콘솔·자원 접근 경로를 단일화하고, 장기 자격증명 대신 역할 기반 임시 토큰을 사용하며, 권한 요청·승인 및 접속 이력을 모니터링하려고 합니다. SingleID에서 선택해야 할 기능은 무엇입니까?", "o": ["AM (Access Management)", "IM (Identity Management)", "MFA (Multi-Factor Authentication)", "ADM (Anomaly Detection Management)", "CAM (Cloud Access Management)"], "a": 4, "e": "CAM은 멀티 클라우드 특권 계정 접근관리 기능으로 접근 경로 단일화, 최소 권한, 역할 기반 임시 토큰, 접속 이력 가시성을 제공합니다. CAM을 선택하면 AM·IM·MFA가 자동 선택되고 CAM Portal 버튼이 표시됩니다.", "src": "SEC2_SingleID_정리 2. ⑤ CAM", "id": "4-2h-03"}, {"item": "4-2h", "t": "SingleID MFA", "q": "SCP(Samsung Cloud Platform) SingleID의 MFA(복합인증)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["MFA 단독 서비스의 연동 방식으로 API, ADFS Plug-In, RADIUS를 제공한다.", "MFA 연동 방식으로 SCIM과 LDAP을 이용하여 2차 인증을 처리한다.", "모바일 Passkey를 사용하려면 카메라(QR 인식)와 블루투스(근접 인증)가 필요하다.", "mOTP, TOTP, PIN, 생체 인증은 SingleID Authenticator 모바일 앱을 활용한다.", "로그인 정책으로 관리자 MFA를 강제화하거나 사외 접속을 차단 또는 MFA 후 허용할 수 있다."], "a": 1, "e": "SCIM, LDAP, AD는 IM(계정관리)의 계정·권한 프로비저닝 표준 연계 방식입니다. MFA 연동 방식은 API, ADFS Plug-In, RADIUS입니다.", "src": "SEC2_SingleID_정리 2. ②③, 5. MFA 상세", "id": "4-2h-04"}, {"item": "4-2i", "t": "Config Inspection", "q": "SCP(Samsung Cloud Platform) Config Inspection이 SCP Console 진단 시 제공하는 Best Practice 체크리스트 항목에 해당하지 않는 것은 무엇입니까?", "o": ["인터넷 접속이 불필요한 Private 서브넷은 NAT Gateway를 사용하지 않아야 한다.", "Security Group은 IP와 Port 단위로 필요한 규칙만 등록해야 한다.", "Object Storage 버킷은 버전 관리를 활성화해야 한다.", "Database는 SQL 레벨 감사 로그를 저장해야 한다.", "Logging & Audit Trail의 로그 파일 검증을 사용해야 한다."], "a": 2, "e": "Best Practice는 Networking 4개(NAT Gateway 미사용, Firewall 사용, SG 최소 규칙, 원격 접속 Port IP 지정), Database 1개(SQL 감사 로그), Logging 2개(Trail 전체 범위 활성화, 로그 파일 검증)로 구성되며 Object Storage 항목은 없습니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 2. Best Practice 체크리스트", "id": "4-2i-01"}, {"item": "4-2i", "t": "Config Inspection", "q": "SCP(Samsung Cloud Platform) Config Inspection 사용에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["요금제(일반/월정액)는 진단 횟수 추이에 따라 생성 후에도 언제든지 변경할 수 있다.", "생성 전에 인증키를 미리 만들어야 하며, 인증키 만료 기한은 최대 365일 또는 영구로 설정할 수 있다.", "사용자가 AdministratorGroup 사용자 그룹에 소속되어 있어야 정상적으로 사용할 수 있다.", "SCP를 진단 대상으로 선택하면 진단 항목은 Best Practice로 고정된다.", "AWS, Azure 등 외부 클라우드 콘솔 진단은 SCP for Samsung에서 제공된다."], "a": 0, "e": "요금제는 일반(진단 횟수 과금)과 월정액(횟수 무관) 중 선택하며 생성 후에는 변경할 수 없습니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 2. How-to", "id": "4-2i-02"}, {"item": "4-2i", "t": "Config Inspection", "q": "SCP(Samsung Cloud Platform) Config Inspection의 SCP Best Practice 체크리스트 구성으로 옳은 것은 무엇입니까?", "o": ["총 6개 - Networking 3개, Database 1개, Logging 2개", "총 7개 - Networking 4개, Database 1개, Logging 2개", "총 7개 - Networking 3개, Database 2개, Logging 2개", "총 8개 - Networking 4개, Database 2개, Logging 2개", "총 8개 - Networking 4개, Database 1개, Logging 3개"], "a": 1, "e": "Best Practice는 총 7개로 Networking 4개, Database 1개, Logging 2개입니다. 진단 결과는 Report(진단 결과 목록·상세·항목 상세)와 대시보드로 확인합니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 2. Best Practice 체크리스트", "fix": true, "id": "4-2i-03"}, {"item": "4-3a", "t": "Cloud Monitoring(ServiceWatch) 이벤트", "q": "SCP(Samsung Cloud Platform) Cloud Monitoring의 이벤트 지표 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["이벤트 위험도는 가장 높은 Fatal, 중간 Warning, 가장 낮은 Information으로 지정한다.", "모니터링 요건이 유사한 성능 항목을 이벤트 정책 템플릿으로 만들어 이벤트 설정에서 불러올 수 있다.", "이벤트 필터링이 적용되는 동안에는 이벤트가 발생해도 알림이 전달되지 않는다.", "이벤트 모니터링 대상을 추가할 때는 성능 지표가 비슷한 서버끼리 묶기보다 전체 서버를 일괄 선택하는 것이 권장된다.", "사용자 정의 대시보드는 여러 Account의 모니터링 정보를 한 번에 표시하고 다른 사용자에게 공유할 수 있다."], "a": 3, "e": "모니터링 대상을 추가할 때는 전체 서버를 일괄 선택하기보다 성능 지표가 비슷한 서버 그룹끼리 묶어서 모니터링하는 것이 좋습니다.", "src": "ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드22, 48, 49, 51, 54", "id": "4-3a-02"}, {"item": "4-3a", "t": "Cloud Monitoring(ServiceWatch) 로그", "q": "SCP(Samsung Cloud Platform) Cloud Monitoring의 리소스 로그 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["로그 수집용으로 기본 1GB의 저장 공간이 제공되며, 초과하면 오래된 로그부터 자동으로 삭제된다.", "로그를 수집하려면 수집 대상에 로그 에이전트가 설치되어 있어야 하며, 사용자가 복사한 설치 명령어를 대상 자원에서 직접 실행한다.", "검색한 로그 키워드를 지표로 생성하면 성능 데이터와 동일하게 이벤트를 설정하고 알림을 받을 수 있다.", "로그 검색 시 like, !like, =, != 등의 조건과 키워드를 조합할 수 있다.", "로그 수집 현황은 최근 30일간 수집된 로그의 양을 서비스 유형별 그래프로 제공한다."], "a": 4, "e": "로그 수집 현황은 최근 7일간의 주요 로그 수집 정보를 차트로 보여줍니다. 로그 저장 공간은 기본 1GB이며 초과 시 오래된 로그부터 삭제됩니다.", "src": "ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드25, 42, 44~45, 57 / WA백서 05 p.25", "id": "4-3a-03"}, {"item": "4-3a", "t": "Cloud Monitoring(ServiceWatch) 대상", "q": "WA 백서 기준 SCP(Samsung Cloud Platform) Cloud Monitoring에서 로그 모니터링 대상으로 제공되지 않는 상품은 무엇입니까?", "o": ["Virtual Server", "PostgreSQL", "Load Balancer", "Kubernetes Engine", "Search Engine"], "a": 2, "e": "로그 모니터링 대상은 Compute(Virtual Server 등), Database(PostgreSQL 등), Container(Kubernetes Engine), Data Analytics(Search Engine 등)입니다. Load Balancer 등 Networking 상품은 성능 모니터링 대상에만 포함됩니다.", "src": "WA백서 05 p.24 표 5-7", "id": "4-3a-04"}, {"item": "4-3b", "t": "Logging&Audit Trail", "q": "SCP(Samsung Cloud Platform) Logging&Audit에서 Trail을 생성할 때의 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Trail 생성 시 로그 저장용 Object Storage 버킷이 자동으로 만들어지므로 별도로 준비할 필요가 없다.", "로그를 수집할 리전과 자원 유
