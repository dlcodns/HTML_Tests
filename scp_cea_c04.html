MIG 해지 순서: **Compute Instance 삭제 → GPU Instance 삭제 → MIG 기능 해제(비활성화)** (생성의 역순)\n\n## Multi-node GPU Cluster\n### 구성\n| 영역 | 내용 |\n|---|---|\n| GPU 유형 | NVIDIA **B300, H100** |\n| GPU Node | **8개 GPU 장착 물리 서버 2대 이상** |\n| Cluster Fabric | GPU 관리용 클러스터, **InfiniBand Switch** 제공 |\n| GPU 간 통신(노드 내) | **NVLink, NVSwitch** |\n| GPU Node 간 통신 | **InfiniBand Switch (RDMA 기반)** → GPU Direct RDMA 구간 |\n| 스토리지 | **NVMe Local Disk**, 고성능 **SSD File Storage**, **NVMe 기반 Parallel File Storage** |\n\n- **Magnum IO**: 멀티 GPU·멀티 노드 환경에서 스토리지, 네트워크, GPU 간 성능을 극대화하는 NVIDIA 아키텍처 스택(NVLink, NVSwitch 포함)\n\n### 서버 타입 (GPU Node는 단일 서버 타입)\n| 항목 | g3 (GPU-B300) | g2 (GPU-H100) |\n|---|---|---|\n| GPU | B300 8개(Blackwell Ultra) | H100 8개(Hopper) |\n| GPU당 성능 | FP4 13.5 PFLOPS, FP8 4.5 PFLOPS | FP8 1,979 TFLOPS, FP16 989 TFLOPS |\n| 최대 vCPU / 메모리 | **128 / 4,096GB** | **96 / 2,048GB** |\n| InfiniBand RDMA | 최대 **6,400 Gb/s** | 최대 **1,600 Gb/s** |\n| 노드 내 NVSwitch P2P | 1.8TB/s | 900GB/s |\n\n> [!주의]\n> B300 Tensor 성능의 정밀도 표기가 슬라이드마다 다르다. Accelerated Server 슬라이드7은 \"FP16 기준 4.5 PFLOPs, Sparsity 13.5 PFLOPs\", Multi-node GPU Cluster 슬라이드7은 \"FP4 13.5 PFLOPS, FP8 4.5 PFLOPS\"다.\n\n### GPU Server와 비교\n| 항목 | GPU Server (g1 A100 / g2 H100 / g3 B300) | Multi-node GPU Cluster (g2 H100 / g3 B300) |\n|---|---|---|\n| 제공 방식 | **Virtual Server** | **Bare Metal Server(2대 이상)** |\n| GPU 수량 | 서버당 1/2/4/8장 | 서버당 8장 |\n| MIG | 지원 | 지원 |\n| GPUDirect P2P | 지원(600GB/s / 900GB/s / 1.8TB/s) | 지원(900GB/s / 1.8TB/s) |\n| GPUDirect RDMA | **미지원** | **지원**(1,600 Gb/s / 6,400 Gb/s, InfiniBand Switch) |\n| GPUDirect Storage | 미지원 | 교재 표가 깨져 판독 불확실(아래 주의) |\n| 기타 | | NVMe SSD 기반 Internal Disk, NVMe 기반 Parallel File Storage |\n\n> [!주의]\n> 교재 슬라이드8 비교표는 텍스트가 깨져 있어 GPUDirect Storage 지원 여부를 정확히 읽을 수 없다. 확실한 것은 GPU Server는 GPUDirect RDMA를 지원하지 않고 Multi-node GPU Cluster는 InfiniBand로 지원한다는 점, 그리고 Cluster에 NVMe 기반 Parallel File Storage가 제공된다는 점이다.\n\n### GPU Node 생성\n학습정리 순서: 이미지·버전 → 서버 수량·타입 → 관리자 계정 → 서버명 → 네트워크 → Cluster Fabric → Lock → Init Script (사전 작업: VPC, Subnet, IGW)\n\n| 순서 | 항목 | 내용·제약 |\n|---|---|---|\n| 1 | 이미지·버전 | 표준 이미지, **Ubuntu** |\n| 2 | 서버 수 | 동시 생성 **2~5개**. **최초(신규 Cluster Fabric)는 2대 이상**, **기존 Cluster Fabric 증설은 1대씩** 가능 |\n| 3 | 서비스 유형 | 예: **96 CPU, Memory 2,048G, H100 8장**, Planned Compute 1·3년 |\n| 4 | 관리자 계정 | 접속용 **root** 암호 설정 |\n| 5 | 서버명 | 2대 이상은 prefix, 증설로 1대 추가 시 서버명 |\n| 6 | 네트워크 | VPC, 일반 Subnet, IP. **NAT는 서버 수가 1대이고 VPC에 Internet Gateway가 연결돼 있어야** 생성 가능 |\n| 7 | Cluster Fabric | **GPU Direct RDMA를 함께 적용할 수 있는 서버 모임**. 신규 입력=새 Fabric 생성, 기존 입력=기존 Fabric에 Node 추가 |\n| 8 | Lock | |\n| 9 | Init Script | Linux: 쉘 스크립트, Cloud-init |\n\n## 비용 (WA백서 06)\n- GPU Server, Multi-node GPU Cluster 모두 **Provisioning / Per Hour**(p.4)\n- Cost Savings·Planned Compute 적용 대상(p.5)\n- 예시(p.6): **GPU Server g2v48h4**를 최소 1대~최대 4대, 월 1,460시간 **정기적 변동** 사용 → 해당 서버 타입에 **Planned Compute** 약정 적용\n\n## 시험 포인트\n> [!시험]\n> - 아키텍처: A100=Ampere, H100=Hopper, B300=Blackwell. GPU는 모두 Pass-through다.\n> - OS는 Ubuntu·RHEL이고 Windows는 없다. OS별로 쓸 수 있는 GPU/NPU 타입이 다르다. Multi-node GPU Cluster는 Ubuntu만 제공한다.\n> - GPU/NPU 수량은 1, 2, 4, 8 단위다. 1·2·4장은 중소규모(LLM 서빙 등), 8장은 NVLink·NVSwitch 고성능이다.\n> - NVSwitch는 8장 타입을 고른 뒤 Fabric Manager를 설치해 직접 활성화한다.\n> - MIG는 최대 7개로 나눈다. 해지 순서는 Compute Instance → GPU Instance → MIG 비활성화다.\n> - RNGD는 48GB, HBM3 1.5TB/s, PCIe Gen5 x16, BF16 256·FP8 512 TFLOPS다.\n> - Cluster: 8장 Bare Metal 2대 이상, 노드 간 InfiniBand(RDMA), 동시 생성 2~5대, 신규는 2대 이상이고 증설은 1대씩이다. NAT는 서버 1대이고 IGW가 연결된 경우에만 만든다.\n> - 인스턴스 이름 읽기: g2v48h4 = H100 4장, 48 vCore.\n\n출처: SCP_v2_Explore_Compute_11-19.md Accelerated Server 슬라이드1~19, Multi-node GPU Cluster 슬라이드1~14, SCP Compute Service 슬라이드9·11, WA백서 04 p.14·31, WA백서 06 p.4~6\n"}, "3-2g": {"title": "Virtual Server DR", "md": "## 한눈에 보기\n- Virtual Server DR = 현재 Region과 **다른 Region**에 Virtual Server와 연결된 **Block Storage를 복제**하고, 재해 대비 **계획 수립·테스트**와 실제 재해 시 **복구** 기능을 제공하는 서비스\n- **실제로 복제되는 것은 Block Storage**이며, DR 사이트의 Virtual Server는 **정지된 상태**로 유지\n- v2 변경점: **마켓플레이스에서 제공하는 서비스를 이용**하는 방식으로 변경\n- DR 수준은 RTO·RPO에 따라 **Cold / Warm / Hot**으로 나누며, Virtual Server DR은 Hot Level 아키텍처의 WEB/APP 서버 복제에 쓰인다.\n\n## Virtual Server DR 서비스\n### 동작\n| 항목 | 내용 |\n|---|---|\n| 복제 대상 | Virtual Server와 연결된 **Block Storage** |\n| DR 사이트 VS 상태 | **정지 상태 유지**(평상시 트래픽을 처리하지 않음) |\n| 전환 | 재해 상황 또는 **모의 훈련** 시 DR Virtual Server를 **주 Virtual Server로 사용** |\n| 제공 기능 | 재해 대비 계획(Recovery Plan) 수립, 테스트(모의 훈련), 실제 재해 시 복구 |\n\n### SLA와 과금\n- SLA 장애 정의(WA백서 01 p.4): \"**DR Recovery Plan에서 모의 훈련 또는 재해 전환 수행이 완료된 후** 고객 서비스 접속이 불가하거나, **요청에 따른 전환이 이루어지지 않는 경우**\". 월 가용률 = [1 - {장애 시간(분) 합 / 서비스 이용 월 총 시간(분) 합}] × 100\n- 과금(WA백서 06 p.4): **Provisioning / Per Hour**\n\n> [!주의]\n> Region 조건에 유의한다. Virtual Server DR은 Region이 2개 이상이어야 구현할 수 있다. WA백서 03 p.25 주의문은 \"2025년 7월 기준 v2는 Single-AZ Region(KR-WEST1)만 제공, Region이 추가되면 구현 가능\"이라고 적었고, WA백서 01 p.29는 \"v2는 Single-AZ Region(KR-WEST1, KR-EAST1)\"이라고 적었다. Region 간 VPC Peering, Object Storage Replication, DBaaS Replica, Container Registry 복제는 \"향후 출시 예정('26년)\"으로 표시되어 있다.\n\n> [!주의]\n> 교재 SCP Compute Service 슬라이드9의 서비스 소개는 Virtual Server DR 설명칸에 Edge Server와 같은 문구(\"기업 On-Site에서 Edge Computing 환경을 제공\")를 적어 두었다. 편집 오류로 보이며, 정의는 WA백서 03 p.22를 따른다.\n\n## 복구 목표: RTO와 RPO\n### 정의 (WA백서 03 p.4)\n| 지표 | 정의 |\n|---|---|\n| **RTO**(Recovery Time Objective, 복구 목표 시간) | 업무 **중단 허용 시간**. 서비스 중단 후 복구까지 허용 가능한 최대 시간 |\n| **RPO**(Recovery Point Objective, 복구 목표 시점) | 업무 **손실 허용 시점**. 복구했을 때 허용 가능한 데이터 손실 범위 |\n- 먼저 **업무 영향 분석(BIA)**으로 복구 대상 업무 그룹을 정하고 목표를 설정한다.\n- RTO 최상위 목표는 무중단 복구(Near Zero)지만 비용·운영 부담이 크다. 감당할 수 있는 재정 부담이 클수록 RTO는 짧아질 수 있다.\n- RPO는 데이터 사본 저장 주기와 복제 구성 여부로 결정된다.\n\n### 도출 규칙 (WA백서 03 p.6)\n시스템과 그 시스템이 처리하는 업무의 RTO·RPO 중 **각각 최소값**을 해당 시스템과 업무의 목표로 정한다.\n\n| 시스템 | 처리 업무 | 시스템 RTO/RPO | 업무 RTO/RPO | 도출 결과 |\n|---|---|---|---|---|\n| F 시스템 | A2 | 8시간 / 1시간 | 1일 / 1일 | **RTO 8시간, RPO 1시간** |\n- 업무가 여러 개면 모든 업무와 시스템 값 중 최소값을 취한다(예: 시스템 RPO 30분, 업무 P RTO 4시간이면 RTO 4시간·RPO 30분).\n\n## DR 구성 수준 (WA백서 03 p.18~21)\n| 수준 | RTO | RPO | 가용성(Main↔DR) | 복구 | 비용 | 대상 |\n|---|---|---|---|---|---|---|\n| **Cold** | 수주 | 수일 | **Active-Backup** | 자원 할당 및 백업 복구 | 낮음 | 비중요 시스템 |\n| **Warm** | 수일 | 수 시간 | **Active-Replica** | 수동 Failover, 자원 할당 및 증설 | 중간 | 일반 시스템 |\n| **Hot** | 수 시간 | **0** | **Active-Standby** | **수동 Failover** | 높음 | 중요 시스템 |\n\n### Cold Level\n- 핵심 서비스의 **백업 데이터만** DR 센터에 보관, 재해 시 백업으로 복구\n- 초기 투자·유지 비용이 **가장 낮음**, 백업 주기에 따라 데이터 손실 가능성이 큼\n- 재해 시 DR 센터에 **신규로 자원을 할당·구성**해야 하므로 복구에 상당한 시간 소요\n- 예시 아키텍처\n  - (1) kr-west1(주)과 kr-east1(DR)을 **VPC Peering**으로 연동\n  - (2) DR 센터에 DR용 VS를 만든 뒤 **평상시 전원 Off**\n  - (3) 주 센터 VS 데이터를 **Object Storage에 주기적 백업**\n  - (4) Object Storage **DR 동기화**로 DR 센터 Object Storage(DR)에 **Bucket 단위 비동기 복제**\n  - (5) 재해 시 Object Storage(DR) 데이터를 복구해 서비스 재개\n\n### Warm Level\n- 중요도가 높은 시스템 중심으로 DR 센터 구축\n- **실시간 복제가 아니므로 주기적 동기화** 필요\n- 재해 시 나머지 시스템 자원을 할당·증설한 뒤 복구 → 데이터 손실·복구 시간 발생 가능, Hot보다 비용 낮음\n\n### Hot Level\n- **실시간 복제** 기반 **Active-Standby**\n- 재해 시 **복제를 중단하고 DR 센터로 운영 전환** → 중요 시스템에 적합\n- 예시 아키텍처\n  - (1) 주·DR Region을 VPC Peering으로 연동\n  - (2) **WEB/APP Virtual Server는 Virtual Server DR 서비스**로 DR 센터에 DR VS 생성, 재해·모의 훈련 시 DR VS를 주 VS로 사용\n  - (3) **DBaaS**는 타 Region **Replica**로 비동기 복제, 재해 시 Replica를 **Master로 승격**\n  - (4) **File Storage**는 **DR 복제** 기능으로 복제 볼륨 구성, 재해 시 동기화 중단 후 복제 볼륨을 **R/W 모드**로 전환\n  - (5) **Object Storage**는 DR 동기화로 Bucket 단위 비동기 복제, 재해 시 Bucket(DR)을 End Point로 사용\n\n> [!주의]\n> \"Hot = Active-Active, 자동 Failover, RTO 0\"은 틀린 표현이다. 백서 표에서 Hot은 **Active-Standby, 수동 Failover, RTO 수 시간, RPO 0**이다.\n\n## Region 간 데이터 복제 서비스 (WA백서 03 p.22~25)\n| 서비스 | 방식 |\n|---|---|\n| **Virtual Server DR** | 다른 Region으로 VS·Block Storage 복제, **Block Storage만 실제 복제**, DR VS는 정지 |\n| Backup DR | **서비스 생성 시** 활성화. 주 사이트 백업본이 DR 사이트로 복제. **이미 생성된 Backup에는 활성화 불가** → 새 Backup 생성 필요(p.11) |\n| Object Storage DR | 주·DR 버킷 간 동기화 설정, **주 버킷 버전 관리 활성화 필요** |\n| File Storage DR | DR Region, DR Volume명, 복제 주기 설정. 주기 **5분, 1시간, 매일(23:59:00), 매주(일요일 23:59:00), 매월(1일 23:59:00)** |\n| Database DR | DR 사이트에 Replica 생성, **VPC Peering 필요**, 재해 시 Replica를 **수동으로 Master 전환** |\n| Container Registry DR | DR 레지스트리와 버킷을 다른 Region으로 복제, File Storage DR과 함께 쓰면 Kubernetes Cluster DR 가능 |\n\n## 재해 전환 계획 (WA백서 03 p.26)\n- 서비스 정지 후 장애 등급·복구 가능 시간을 판단해 정해진 시간 내 복구가 불가하면 **재해를 선언**하고 복구 절차를 수행\n- 단계: **재해 선언**(대책본부·비상통지·현황 파악) → **재해복구 시스템 전환 결정** → **재해복구 센터로 서비스 전환** → **주 센터 복구** → **주 센터로 복귀 결정**\n- 변경 관리(p.26): 주 사이트에서 직접 변경하지 않고 테스트/스테이징 환경에서 검증한 뒤 **주 사이트와 DR 사이트에 동일하게 반영**(구성 불일치로 전환 실패 방지)\n- 정기적으로 **복구 테스트**를 수행해 목표 RTO·RPO 충족 여부를 검증(p.17)\n\n## 시험 포인트\n> [!시험]\n> - VS DR은 다른 Region에 Block Storage를 복제한다. DR VS는 평상시 정지 상태이며 트래픽을 분산 처리하지 않는다.\n> - v2에서는 마켓플레이스 서비스를 이용한다.\n> - SLA 장애는 모의 훈련이나 재해 전환이 끝난 뒤 접속이 안 되거나 요청한 전환이 이루어지지 않는 경우다.\n> - RTO·RPO 도출은 시스템과 업무 값 중 각각 최소값을 쓴다.\n> - Cold(수주/수일, Active-Backup, 낮음), Warm(수일/수시간, Active-Replica, 중간), Hot(수시간/0, Active-Standby, 수동 Failover, 높음).\n> - Backup DR은 생성 시에만 켤 수 있다. Object Storage DR은 버전 관리가 필요하다. File Storage DR 매일 복제는 23:59:00에 수행된다.\n\n출처: WA백서 03 p.4~6·11·17~26, WA백서 01 p.4·29, WA백서 06 p.4, SCP_v2_Explore_Compute_11-19.md SCP Compute Service 슬라이드9·11\n"}, "3-2h": {"title": "Edge Server 기반 Hybrid Cloud", "md": "## 한눈에 보기\n- Edge Server = **데이터 보안, 규제, 성능, 지연 시간** 등의 이유로 클라우드 전환이 어려운 기업의 **On-Site 환경에 Edge Cloud를 제공**하는 서비스\n- 구성요소: **Edge Manager**(SCP에 위치) + **Edge Client**(고객 사이트 Edge Server에 위치)\n- SCP와의 네트워크: **VPN 또는 전용회선**\n- 생성: 콘솔 즉시 생성이 아니라 **Hybrid Cloud > Edge Server 서비스 요청**으로 신청\n\n## 배경: Hybrid Cloud\n- Hybrid Cloud는 Public Cloud(사업자가 소유·운영, 여러 기업 사용), Private Cloud(기업 전용 구축), On-premise를 결합한 모델이다(3-2a 배경 참고).\n\n### 하이브리드 클라우드 구성 시 고려사항 (SCP Compute Service 슬라이드13)\nPublic Cloud와 On-Premise의 장점을 함께 살리는 설계가 필요하다.\n| 고려사항 | 내용 |\n|---|---|\n| **애플리케이션 및 데이터 중력** | 데이터가 많은 곳에 애플리케이션을 최대한 가깝게 배치. 데이터 이동 시 **대역폭/전송 비용**도 고려해야 성능·효율 증대 |\n| **보안과 거버넌스** | 온프레미스와 클라우드 전반에 **일관된 보안 정책**, 데이터 암호화·접근제어·규정 준수 모두 충족 |\n| **유연한 워크로드 관리** | 필요에 따라 클라우드로 확장하는 **버스팅(Bursting)** 구조 |\n| **성능 및 비용 최적화** | 워크로드와 데이터 위치에 따라 성능·비용이 크게 달라지므로 지속 모니터링·최적화 |\n| **운영 자동화 도구** | 관리 복잡도를 줄이는 **통합 운영 자동화 도구** 도입 검토 |\n| VPC 설계 전략 | 그림 항목으로만 제시(교재에 세부 설명 없음) |\n- 비용 전략(슬라이드14): 하이브리드·멀티 클라우드 설계 시 **인터넷 트래픽 비용과 데이터 전송 비용** 고려\n- WA백서 04 p.8: 하이브리드 연결이 필요하면 **Direct Connect**의 대역폭을 검토한다.\n\n## Edge Server 개념\n### 아키텍처\n- On-Site: Edge Server #1 … #N (CPU/GPU **가상화**, VM·Container·Storage·DB 등), 각 서버에 **Edge Client**\n- SCP: VPC 안의 **Edge Manager**와 SCP Service(Analytics, AI, Storage 등)\n- 연결: **IPsec Tunnel(VPN)** 또는 **Dedicated Line(Direct Connect)**, Firewall 경유\n\n### 제공 기능\n| 기능 | 내용 |\n|---|---|\n| Hybrid Cloud 확장 | **중요 데이터는 On-Site**에서 처리하고, Public Cloud는 **Analytics, IoT, Private 5G, AI** 등에 활용 |\n| 편리한 통합 관리 | **SCP Console**로 Edge Server를 통합 관리 |\n| 높은 보안성·규정 준수 | **보안이 요구되는 데이터, 규제가 엄격한 워크로드는 엣지**에서 처리 |\n| 고객 맞춤형 서비스 | 사용자 환경에 따라 가상화 플랫폼(**KVM, Container** 등) 제공 |\n\n### 구성 요소\n| 요소 | 위치 | 역할 |\n|---|---|---|\n| **Edge Manager** | **SCP** | **Edge Client를 통해** 고객 사이트에 설치된 Edge Server 관리 |\n| **Edge Client** | **고객 사이트 Edge Server** | **Edge Manager를 통해 KVM 관리** |\n- Edge Server와 SCP 간 네트워크: **VPN 또는 전용회선**\n\n## Edge Server 신청 (Hybrid Cloud > Edge Server 서비스 요청)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | 제목 | |\n| 2 | 리전 | |\n| 3 | 서비스(자동 선택) | 서비스 카테고리 **Hybrid Cloud**, 서비스 **Edge Server** |\n| 4 | 작업 구분 | **\"Edge Server 서비스 생성\"** |\n| 5 | 기본정보 | 어카운트 ID, 고객 성명/소속회사/부서/E-mail/핸드폰번호, **서비스 개시 희망 일자**, **호스트 서버 OS**(예: RHEL, Ubuntu, Rocky), **배송지 주소** |\n| 6 | 신청정보 | **사용 목적**(예: 제조, 의료, 물류 / 드론, 로봇, CCTV, 영상분석), **서버 Type 및 수량**, **사용 기간(기본 3년)** |\n| 7 | 첨부파일 | 필요 시 |\n\n신청서 예시의 서버 Type\n| Type | 사양 |\n|---|---|\n| 일반형 | 128vCore / 512GB / 7.6TB |\n| 대용량 | 128vCore / 512GB / SSD 7.6TB + HDD 160TB |\n| GPU_L40s | 128vCore / 512GB / 7.6TB / L40s × 2매 |\n\n## SLA·과금 (WA백서)\n- SLA 장애 정의(WA백서 01 p.5): **Edge Manager 접속 불가** 또는 **Edge Server 장애로 고객 서비스 실패**. 월 가용률 = [1 - {장애 시간(분) 합 / 서비스 이용 월 총 시간(분) 합}] × 100\n- 과금(WA백서 06 p.4): **Provisioning / Per 3/5years**\n- 요금제(WA백서 06 p.5): **Edge Server는 무약정이 없고 약정 기간은 3년/5년**\n\n> [!주의]\n> 기간 표기를 구분한다. 교재 신청서는 \"사용 기간(기본 3년)\"이고, WA백서 06은 \"무약정 없음, 약정 3년/5년\"이다. 모순이라기보다 기본 3년에 5년도 선택할 수 있다는 의미로 읽힌다.\n\n## 비교: 어디서 처리할까\n| 상황 | 선택 |\n|---|---|\n| 규제·보안으로 데이터 반출 곤란, 초저지연 필요 | **Edge Server**(On-Site 처리) |\n| 분석·AI·IoT 등 클라우드 서비스 활용 | SCP Public Cloud 서비스 |\n| 대용량 원천 데이터 | 데이터가 있는 곳 가까이에서 처리(데이터 중력), 전송 비용 고려 |\n| 피크 부하 | 클라우드로 버스팅 |\n\n## 시험 포인트\n> [!시험]\n> - Edge Manager는 SCP에 있고, Edge Client는 고객 사이트 Edge Server에 있다. 위치와 역할을 뒤바꾼 보기가 단골 오답이다.\n> - 네트워크는 VPN 또는 전용회선이고, 가상화 플랫폼은 KVM과 Container 등이다.\n> - 생성은 서비스 요청서(작업 구분 \"Edge Server 서비스 생성\")로 하며 콘솔 즉시 프로비저닝이 아니다. 기본정보에는 배송지와 호스트 OS가, 신청정보에는 목적·서버 Type·수량·기간(기본 3년)이 들어간다.\n> - SLA 장애는 Edge Manager에 접속할 수 없거나 Edge Server 장애로 서비스가 실패하는 경우다. 무약정이 없고 3년/5년 약정이다.\n> - 하이브리드 설계: 데이터 중력(데이터 가까이에 앱 배치, 전송 비용 고려), 일관된 보안 정책, 버스팅, 지속적 성능·비용 최적화, 운영 자동화 도구.\n\n출처: SCP_v2_Explore_Compute_11-19.md Hybrid Cloud Edge Server 슬라이드1~11, SCP Compute Service 슬라이드7·13~14, WA백서 01 p.5, WA백서 04 p.8, WA백서 06 p.4~5\n"}, "3-3a": {"title": "마이크로서비스 아키텍처와 컨테이너", "md": "## 한눈에 보기\n- **컨테이너**는 OS 레벨 가상화로, 애플리케이션 + 런타임 환경 + 앱 의존성만 패키징한다. Guest OS가 없으므로 가볍고 빠르며 어디서나 같은 방식으로 동작한다.\n- **마이크로서비스 아키텍처(MSA)**는 작은 단위 애플리케이션이 각자 비즈니스 로직과 DB를 가지며 API로 통신하는 구조이다. 컨테이너와 Kubernetes Engine이 MSA를 구현하는 대표 실행 환경이다.\n- 학습목표(교재): Container·Kubernetes 기술 개념 이해, Kubernetes 핵심 오브젝트와 기능 이해, Container 관련 SCP 서비스 설명.\n\n## 1. 배경: 하이퍼바이저 가상화와 OS 레벨 가상화\n| 구분 | 가상 서버(Virtual Server) | 컨테이너(Container) |\n|---|---|---|\n| 가상화 방식 | 하이퍼바이저(Hypervisor) 기반 | OS 레벨 가상화 |\n| 스택 | Physical Machine → (Host OS) → Hypervisor → VM마다 **Guest OS** → 앱 | Physical Machine → Host OS → **Docker Engine** → 컨테이너(앱 + 런타임 + 의존성) |\n| 패키징 단위 | 운영체제(Guest OS) 포함 | 애플리케이션, 런타임 환경, 앱 의존성 |\n- 교재 그림의 하이퍼바이저는 **Type A**(Physical Machine 바로 위 Hypervisor)와 **Type B**(Host OS 위 Hypervisor) 두 형태로 표시된다.\n  - (일반 개념) Type A는 흔히 Type 1(베어메탈), Type B는 Type 2(호스티드) 하이퍼바이저라 부른다.\n\n## 2. 컨테이너의 장점 3가지\n| 장점 | 영문 | 교재 설명 |\n|---|---|---|\n| 경량화 | Lightweight | 크기가 작고 가벼워 **복제와 배포가 간편** |\n| 신속성 | Agility | **운영체제 부팅 시간이 없어** 빠르게 시작 및 종료 가능 |\n| 이식성 | Portability | 운영체제나 플랫폼에 관계 없이 **일관된 실행 환경** 제공 |\n- WA백서 04: 애플리케이션과 런타임을 컨테이너로 패키징하면 모든 운영체제 플랫폼에 배포할 수 있고, 개발·테스트·배포 프로세스를 단순화하며 자동화가 쉬워진다.\n- WA백서 04: 컨테이너는 **멀티 티어(Multi-tier)** 애플리케이션 구축에 효과적이다. 애플리케이션 서버, DB, 메시지 큐를 각각 별도 컨테이너 이미지로 병렬 실행하고 서로 통신을 설정할 수 있다. **계층마다 라이브러리 버전이 달라도 충돌 없이 동일한 컴퓨팅 서버에서 실행**할 수 있다.\n\n## 3. 컨테이너 활용 사례: 자원 이용률 기반 서버 통합 최적화\n1. 자원 이용률이 낮은 가상 서버가 여러 대 있다(각 VM에 Docker Engine과 컨테이너가 일부만 동작).\n2. 이 컨테이너들을 소수의 가상 서버 위 Docker Engine으로 모은다.\n3. **사용되지 않는 리소스(빈 가상 서버)를 삭제하여 비용을 절감**한다.\n- WA백서 06: 자원 효율성과 민첩성이 높은 컨테이너 같은 기술을 선택하는 것이 비용 측면에서 유리하다. 다만 Serverless나 컨테이너 기술을 도입하려면 **조직 내부의 기술 역량**이 뒷받침되어야 한다.\n\n## 4. Kubernetes가 필요한 이유\n- 컨테이너 수가 늘어나면 배포·확장·장애 대응을 수작업으로 하기 어렵다.\n- **Kubernetes**: 컨테이너 환경에서 애플리케이션의 **배포, 확장, 워크로드 관리를 자동화**하여 복잡한 운영 이슈를 해결하는 **오픈소스 오케스트레이션 플랫폼**.\n- WA백서 04: Kubernetes는 **수평적 확장**, 중단 시간을 최소화하는 **블루-그린 배포** 기능을 제공하고, 사용자 트래픽 부하를 컨테이너 간에 분산하며, 여러 컨테이너가 공유하는 저장소를 관리한다.\n- 세부 구조(Control Plane, Worker Node, 오브젝트)는 3-3b에서 다룬다.\n\n## 5. 모놀리식 vs 마이크로서비스 아키텍처 (WA백서 01)\n| 구분 | 모놀리식(Monolithic) | 마이크로서비스(MSA) |\n|---|---|---|\n| 구조 | 여러 모듈(고객·상품·주문)이 단일 프로그램으로 결합된 단일 계층 | 자체 아키텍처와 비즈니스 로직을 갖춘 작은 단위 애플리케이션 |\n| DB | 회원DB·상품DB·주문DB가 **단일 DB 서버**에 | 비즈니스 로직별로 **독립된 DB** |\n| 연결 | 웹·앱·DB가 소켓 통신 | 프론트엔드와 **API**로 연결 |\n| 배포 | 패키징된 앱을 서버에 복사만 하면 됨(쉬움) | 서비스별 별도 빌드 체계, 서비스별로 빠르게 배포 |\n| 장점 | 자원(CPU·메모리·디스크) 공유 → 로깅·캐싱·보안을 단일 솔루션으로 통합 관리, **같은 서버 내 모듈 호출 → 성능 유리** | 기능별 개발 속도↑, **기능마다 다른 언어** 가능, 다른 기능 프레임워크 변경에 영향 없음, **장애·과부하 격리** |\n| 단점 | 커질수록 변경 관리·배포 복잡, 한 모듈 오류가 **전체 장애**로 확산, 관리·테스트 비용↑ | 서비스 간 **통신 메커니즘을 별도 구현**, 호출 실패·지연 시 **상태 추적 어려움**, 구성요소가 많아질수록 **운영 부담 증가** |\n\n> [!시험]\n> \"모듈 간 호출이 같은 서버 내에서 이루어져 성능이 유리하다\"는 **모놀리식**의 장점이다. MSA의 장점으로 나오면 오답이다.\n\n## 6. MSA 적합성 검토 6가지 (WA백서 01)\n1. 비즈니스 도메인이 여러 개의 독립된 **하위 도메인(Sub Domain)**으로 나뉠 수 있는가? (DDD 핵심 원칙)\n2. 개발/운영 조직이 여러 팀으로 나뉘고 각 팀이 **\"서비스 단위\"를 책임**지도록 할 수 있는가? (DevOps·MSA 전략 원칙)\n3. **부분적인 트래픽 핫스팟**을 예측하고 **고가용성(HA)** 전략이 요구되는 안정적인 도메인이 분명히 존재하는가?\n4. 각 서비스가 **고유한 변화 속도, 릴리즈 사이클, 요구사항**을 가지는가?\n5. **운영 자동화 체계(CI/CD, 모니터링, 로깅, 트레이싱)**를 적용할 수 있는가?\n6. 조직과 제품이 장기적으로 성장하고 **도메인별 독립적인 발전**을 추구하는가?\n\n> [!시험]\n> \"모든 서비스가 하나의 공통된 릴리즈 사이클을 따르도록 통합 관리할 수 있는가\"는 적합성 기준이 **아니다**(반대 개념). 기준은 서비스마다 **고유한** 릴리즈 사이클이다.\n\n## 7. SCP에서의 MSA 구현 예시 (WA백서 01)\n1. 클라이언트 요청은 **Load Balancer**를 거쳐 VM/Container 워크로드 및 **API Gateway**로 전달된다.\n2. API 요청을 제외한 요청은 Kubernetes Engine의 **Ingress**로 전달되고, Ingress가 매핑된 서비스 **Pod**로 라우팅한다.\n3. API 요청은 최전방의 **API Gateway**가 인증 및 서비스 라우팅을 수행한다(과도한 요청 시 **Throttling** 제공, 서비스 규약을 중앙에서 관리).\n4. 서비스 단위로 **분리된 DB**를 구성한다. 서비스 특성에 맞는 DB를 고를 수 있다(예: 확장성 필요 → NoSQL, 주문 처리 → RDBMS로 무결성·트랜잭션 일관성).\n5. 구성 요소 간 네트워크 제어에 **Service Mesh**를 사용해 네트워크 구성과 데이터 흐름을 관리·추적할 수 있다.\n- Kubernetes Engine 컨테이너 환경의 이점: 빠른 배포, 유연한 확장, 컨테이너별 **CPU·메모리 사용량 제한** 설정(특정 서비스의 과도한 자원 사용 방지), **Probe**로 정상 작동 여부를 계속 확인하고 문제 시 **자동 재시작**.\n- 단순·반복 작업은 Cloud Functions(이벤트 기반), 웹 콘텐츠는 Object Storage에 두어 서버 부하를 분산한다.\n\n## 시험 포인트 정리\n> [!시험]\n> - 컨테이너 장점 3가지는 **경량화·신속성·이식성**. 교재 기준으로 \"고성능 컴퓨팅(HPC)에 적합\"은 컨테이너 장점이 아니다(SEA 예시문제 오답 보기).\n> - 컨테이너는 Guest OS가 없고 Docker Engine 같은 런타임 위에서 실행된다.\n> - 라이브러리 버전이 다른 계층도 같은 서버에서 컨테이너로 **충돌 없이** 실행할 수 있다. \"반드시 다른 서버에 배치해야 한다\"는 오답.\n> - 저활용 VM을 컨테이너로 통합 → 남는 리소스 삭제 → 비용 절감.\n> - MSA 단점: 통신 메커니즘 구현, 상태 추적 어려움, 운영 부담 증가.\n\n출처: CloudNative1_Container_Services 슬라이드 1-9, 26; WA백서 01 p.22-24(2.3 Microservice); WA백서 04 p.33(Container 적용 검토); WA백서 06 2장(기술 선택); SEA_문제_예시 1번\n"}, "3-3b": {"title": "Kubernetes Engine 기능 및 구성 요소", "md": "## 한눈에 보기\n- Kubernetes Cluster = **Master Node(Control Plane)** + **Worker Node(Pod 실행)**.\n- SCP **Kubernetes Engine**은 **Control Plane을 SCP가 설치·운영**하고, 사용자는 **Worker Node만 추가·관리**하는 관리형 Kubernetes 서비스이다.\n- SCP Container 서비스는 **Container Registry**(이미지 저장·관리·공유)와 **Kubernetes Engine**(오케스트레이션) 두 가지이다.\n\n## 1. Kubernetes Cluster의 Node\n| Node | 역할 |\n|---|---|\n| Master Node | 시스템 구성요소(**Control Plane**)가 위치. Cluster 전체 상태를 관리·제어하는 중앙 관리 시스템 |\n| Worker Node | 애플리케이션 컨테이너(**Pod**)가 배포되는 노드 |\n- Node 정의: Kubernetes Cluster에 속한 베어메탈 또는 가상 호스트 머신.\n- 둘은 **개념적으로** 구분된다.\n\n## 2. Control Plane 구성 요소 (Master Node)\nControl Plane의 역할: Cluster 제어 기능 제공, Kubernetes **오브젝트 레코드**로 리소스 상태와 메타데이터 관리, Cluster 전체를 중앙에서 관리하고 문제 발생 시 **자동 감지·대응**.\n\n| 구성 요소 | 역할 |\n|---|---|\n| **API Server** | Kubernetes 구성요소 생성/삭제 기능, **인터페이스** 담당 (사용자·관리자가 접근하는 창구) |\n| **etcd** | Kubernetes 오브젝트 정보를 저장하는 **Key/Value Store** |\n| **Scheduler** | Pod를 **최적의 Node에 배포**하기 위한 Scheduling |\n| **Controller Manager** | Pod의 **원하는 상태 유지**, **확장(Scaling)** 및 **장애 복구(Fail-Over)** |\n\n## 3. Worker Node 구성 요소\n| 구성 요소 | 역할 |\n|---|---|\n| **kubelet** | Node에서 파드의 **생성, 실행, 모니터링**을 담당하는 Agent |\n| **kube-proxy** | **Service에 정의된 네트워킹 규칙의 실제 구현** |\n- kubelet과 kube-proxy는 **각 Worker Node**에 설치된다.\n\n> [!시험]\n> 역할 바꿔치기가 단골이다. etcd = 저장(K/V), Scheduler = 배치, Controller Manager = 상태 유지·Scaling·Fail-Over, kube-proxy = Worker Node의 Service 네트워킹(Pod 배치 결정은 Scheduler).\n\n## 4. Kubernetes Object\n정의: Cluster 내 애플리케이션 및 인프라 리소스와 상태를 정의하고 관리하는 **선언적 데이터 구조체**.\n\n| 오브젝트 | 설명 |\n|---|---|\n| **Namespace** | Cluster 내 리소스를 분리하는 **논리적 그룹** |\n| **Service** | 파드에 대한 **네트워크 접근을 제공하는 추상화 계층** |\n| **Pod** | 긴밀하게 결합된 Container 그룹, Kubernetes의 **최소 배포 단위** |\n| **ReplicaSet** | 지정된 수의 파드 **복제본 유지**, 장애 시 파드 재생성 |\n| **Deployment** | ReplicaSet을 관리하며 애플리케이션의 **무중단 업데이트** 담당 |\n| NetworkPolicy | Pod 간 또는 외부 엔드포인트와의 통신 제어 (3-3g) |\n| Ingress | domain 기반 URL로 Service에 접근하게 하는 외부 트래픽 라우팅 (3-3g) |\n| Persistent Volume | 컨테이너 데이터를 영구 보관 (3-3d) |\n\n### Namespace 활용\n- 하나의 Cluster에 개발/운영 환경이 필요할 때 Namespace로 분리하지 않으면 **새 Cluster를 구성**해야 하므로 리소스 활용도가 떨어진다.\n- Namespace로 환경을 **논리적으로 분리**한다. 교재 그림: `kube-system` namespace(kube-dns, kube-proxy, kubedashboard), `운영` namespace(Production Service), `개발` namespace(Dev Service).\n\n## 5. SCP Container 관련 서비스\n| 서비스 | 설명 | 과금(WA백서 06) |\n|---|---|---|\n| Container Registry | Container 이미지를 손쉽게 저장, 관리, 공유하는 서비스 | Pay-as-you-go, **Per Usage(GB)** |\n| Kubernetes Engine | Kubernetes Container 오케스트레이션 서비스 | Provisioning, **Per Hour** |\n\n## 6. Kubernetes Engine 서비스\n### 도입 고민 (교재)\n- Cloud Native로 바꾸고 싶지만 내부에 Kubernetes 전문가가 없다.\n- 복잡한 Cluster 구축부터 운영까지 안전하고 비용 효율적으로 관리할 수 있을까?\n\n### 시스템 구조와 주요 기능\nControl Plane은 SCP가 설치·운영 → 사용자는 Worker Node만 추가·관리 → 애플리케이션에 더 많은 시간과 노력을 집중.\n\n| 구분 | 기능 |\n|---|---|\n| 플랫폼 제공 | Kubernetes **Control Plane 설치 및 운영** |\n| 플랫폼 제공 | Cluster 생성을 위한 필수 설정(**VM, VPC, Subnet, Security Group, Load Balancer, DNS**) |\n| 사용자 설정 | **Worker Node 설정**, 연결할 **File Storage의 볼륨** 설정 |\n| Cluster 관리 | Cluster 정보조회, **권한 관리**, **신규 사용자 추가** |\n| Node 관리 | Worker Node 조회 및 관리 |\n| 리소스 관리 | **Persistent Volume** 관리, **Namespace** 관리 |\n| 보안 | **Network Policy** 생성/관리 |\n\n- WA백서 02: Kubernetes Engine은 Database 서비스, Cloud Functions와 함께 **관리형 서비스**의 대표 예이다. 관리형을 쓰면 OS 패치·보안 설정 등 **보안 관리 부담**이 줄어든다.\n- 교재 학습정리: Kubernetes Engine은 경량화된 가상 컴퓨팅인 Container를 관리하기 위한 Kubernetes Cluster를 제공한다. Cluster 생성 전 **IaaS 자원(VPC, Subnet, File Storage)** 생성·연계가 필요하다.\n\n## 시험 포인트 정리\n> [!시험]\n> - \"사용자가 Control Plane 노드를 직접 만들고 API Server·etcd를 설치·운영한다\"는 오답. Control Plane은 SCP 담당.\n> - 하나의 Cluster에서 운영/개발 분리 → **Namespace**.\n> - Kubernetes Engine 과금은 **Per Hour**(Provisioning), Container Registry는 **Per Usage(GB)**(Pay-as-you-go). Per Call은 API Gateway·Cloud Functions 등의 방식이다.\n> - Deployment가 ReplicaSet을 관리하고, ReplicaSet이 Pod 개수를 유지한다.\n\n출처: CloudNative1_Container_Services 슬라이드 9-16, 20, 22-23, 26-27; WA백서 02 p.10(관리형 서비스); WA백서 04 p.33; WA백서 06 p.4(표 6-1)\n"}, "3-3c": {"title": "Cluster 생성 · Nodepool (Multi-AZ)", "md": "## 한눈에 보기\n- Cluster 생성 전에 **IaaS 자원(VPC, Subnet, File Storage)**을 먼저 만든다.\n- 순서: 인프라 준비(가용성 계획 → 네트워크 → Storage) → **Control Plane 생성** → **Worker Node(노드풀) 추가** → 기본 설정(Namespace, Ingress Controller) → 애플리케이션 배포.\n- **Multi-AZ**: 각 AZ에 **별도 노드풀**을 만들고 File Storage를 Multi-AZ로 복제한다.\n- 노드풀 옵션: **자동 확장/축소(Auto-Scaling)**, **노드 자동 복구**.\n\n## 1. End-to-End 구성 과정 (교재 슬라이드 24)\n| 단계 | 세부 작업 | 내용 |\n|---|---|---|\n| 1. 인프라 자원 준비 및 계획 | 가용성 수준 계획 | Cluster **노드 배포 전략 결정(단일 AZ vs 멀티 AZ)** |\n| | 네트워크 구성 | 위치 선택, **VPC 구성**, **Subnet 생성** |\n| | Storage 구성 | **File Storage 생성(Persistent Volume 용도)** |\n| 2. Kubernetes Cluster 구성 | Kubernetes Cluster 생성 | **VPC, Subnet, File Storage 선택** → **Control Plane 생성**(Kubernetes Engine 서비스 사용) |\n| | Worker Node 추가 | 노드 배포 전략을 따름(**단일 AZ 또는 멀티 AZ 분산**), **CPU/GPU, OS 선택**(비용과 성능 요구사항 고려) |\n| 3. Kubernetes Cluster 기본 설정 | Cluster 환경 격리 | **Namespace 생성**(환경별 분리, 예: 운영, 개발) |\n| | 네트워크 컴포넌트 구성 | **Ingress Controller 설치**(외부 트래픽 처리) |\n| 4. 네트워크 및 보안 설정 | Cluster 외부 트래픽 라우팅 | Ingress 오브젝트 구성(URL 기반 라우팅), Load Balancer와 연동 |\n| | Cluster 보안 정책 | Network Policy 오브젝트 구성(파드 간 통신 제어) |\n| 5. Application 배포 | 소스코드 관리 | Git 저장소 구성(GitHub, GitLab 등) |\n| | Build 및 Image 관리 | 소스코드 Build → Container Image 생성 → Container Registry에 저장 |\n| | Workload 배포 | Deployment 오브젝트로 Pod 배포, DevOps 파이프라인 연동(지속적 개발) |\n- 4·5단계는 3-3d(App 배포), 3-3g(네트워킹·접근제어)에서 자세히 다룬다.\n\n> [!시험]\n> 순서 문제: **VPC/Subnet/File Storage** → **Control Plane 생성** → **Worker Node 추가** → Namespace·Ingress Controller → Deployment로 Pod 배포. Worker Node는 Control Plane 생성 **뒤**에 추가하고, IaaS 자원은 Cluster 생성 **전**에 준비한다.\n\n## 2. 노드풀과 Multi-AZ Kubernetes Cluster (WA백서 01)\n- Multi-AZ의 각 AZ는 독립된 물리 인프라라서 한 AZ 장애가 다른 AZ에 영향을 주지 않는다.\n- Multi-AZ Kubernetes Cluster 구성:\n  1. **File Storage를 Multi-AZ로 구성** → 원본과 복제본이 각 AZ에 생성되고 **실시간 동기화**.\n  2. Kubernetes Engine을 구성하고 **각각의 AZ에 별도의 노드풀**을 생성.\n  3. 평상시에는 **전체 노드와 Pod가 AZa의 Active Storage**를 사용.\n  4. AZa 재해 시 AZa의 Pod가 **AZb 노드로 이동(Eviction)**하고, 스토리지 액세스 경로도 **AZb Standby Storage**로 전환.\n\n| 상황 | 노드/Pod | 스토리지 |\n|---|---|---|\n| 평상시 | AZa·AZb 노드풀 모두 동작 | 전체가 **AZa Active Storage** 사용 |\n| AZa 재해 | AZa Pod → **AZb 노드로 Eviction** | 경로가 **AZb Standby Storage**로 전환 |\n\n> [!주의]\n> 평상시 스토리지는 Active-Active로 나눠 쓰지 않는다. 전부 AZa Active Storage를 쓰고 AZb는 Standby이다(WA백서 01 그림 1-13).\n\n## 3. 노드풀 자동 확장/축소 (WA백서 01, 05, 06)\n- 설계 원칙: **Kubernetes Engine Node Pool의 자동 확장을 활성화**하여 자원 자동 확장을 구현한다.\n- 컨테이너 자동 확장에는 두 가지 결정이 필요하다.\n  1. 추가 컨테이너가 현재 작업 부하에 필요한가?\n  2. 신규 컨테이너를 기존 노드풀의 노드에 둘 수 있는가, 새 노드가 필요한가?\n- **신규 노드가 자동 할당되게 하려면 노드풀 생성 시 \"노드 풀 자동 확장/축소(Auto-Scaling)\" 옵션을 사용**해야 한다.\n- WA백서 05 자동화 표: \"크기 조정 – Auto-Scaling 또는 Kubernetes Engine Node Pool 자동 확장 등으로 부하 증감에 따라 인프라 크기를 자동 조정\".\n- WA백서 06 비용 최적화: 수동 조정 예로 Kubernetes Cluster의 **Node pool** 또는 **pod의 replica set 수 조정**. 평균 CPU 사용률 같은 지표로 자동화할 수 있고, **최소·최대 작업 노드 수**를 지정해 용량 범위를 정한 뒤 지표에 따라 동적으로 조정한다.\n\n## 4. 노드 자동 복구 (WA백서 01)\n- 설계 원칙: Kubernetes Engine **노드 자동 복구 기능을 활성화**해 장애에 대응한다(Node Pool 단위 기능).\n\n| 항목 | 내용 |\n|---|---|\n| 복구 개시 조건 1 | 노드가 일정 시간(**임계값 약 10분**) 동안 지속적으로 **NotReady** 상태를 보고 |\n| 복구 개시 조건 2 | 노드가 **아예 상태를 보고하지 못하는** 경우 |\n| 제한 1 | 최초 노드 생성 시 **Running**이 되지 못하고 **Creating** 상태에 머무는 경우 |\n| 제한 2 | **같은 노드 풀에서 비정상 노드가 4대 이상** 발생한 경우 |\n- 비교: Virtual Server는 Auto-Scaling 최소 인스턴스 수(예: 2)를 유지하는 방식으로 장애 VM을 자동 대체한다.\n\n> [!시험]\n> - 자동 복구 임계값은 **약 10분**이다. \"1분\"은 오답.\n> - 제한 조건 숫자 **4대 이상**, 상태 **Creating**을 기억한다.\n\n## 5. 클러스터 단위 DR 관련\n- WA백서 03: **Container Registry DR + File Storage DR**을 함께 구성하면 Kubernetes Cluster DR을 구현할 수 있다(상세는 3-3f).\n\n> [!주의]\n> WA백서 03은 \"Region 간 Container Registry 기능은 향후 출시 예정('26년)\"이라고 적고 있다. 출시 여부는 단정하지 않는다.\n\n## 시험 포인트 정리\n> [!시험]\n> - Cluster 생성 전 필수: **VPC, Subnet, File Storage**(학습정리 문구).\n> - Worker Node 추가 시 고르는 것: 배포 전략(단일/멀티 AZ), **CPU/GPU, OS**.\n> - Multi-AZ 핵심 = **AZ별 별도 노드풀** + Multi-AZ File Storage(실시간 동기화, Active/Standby).\n> - 노드 자동 할당 = 노드풀 생성 시 **자동 확장/축소 옵션**.\n\n출처: CloudNative1_Container_Services 슬라이드 24, 27; WA백서 01 p.29(수요에 따라 조정), p.33(Multi-AZ Kubernetes Cluster), p.36(노드 자동 복구); WA백서 03 2.6절; WA백서 05 p.15(표 5-5); WA백서 06(데이터 기반 비용 최적화 전략)\n"}, "3-3d": {"title": "Kubernetes Apps · App 배포", "md": "## 한눈에 보기\n- **App 배포 흐름**: Git 저장소 → Build → Container Image 생성 → **Container Registry 저장** → **Deployment 오브젝트로 Pod 배포** → (DevOps 파이프라인으로 지속 배포).\n- 영구 데이터(로그, 공유 파일)는 **Persistent Volume(PV)** + **PVC**로 File Storage에 둔다.\n- **Kubernetes Apps**: 검증된 컨테이너 기반 소프트웨어(Web/WAS 등)를 웹 콘솔에서 골라 Kubernetes Engine Cluster에 손쉽게 배포하는 서비스(교재 미수록).\n\n## 1. Kubernetes Apps (교재 미수록)\n> [!주의]\n> Kubernetes Apps는 담당 교재(Container Services, DevOps Tools)와 WA백서에 나오지 않는다. 아래 내용은 문제 풀 해설의 근거(삼성SDS 기술블로그 'DevOps, Container 상품의 이해'의 Kubernetes Apps 소개) 범위에서만 정리했다. (공식 페이지)\n\n| 항목 | 내용 (공식 페이지) |\n|---|---|\n| 정의 | **Web/WAS**를 비롯한 앱 인프라, 큐, 모니터링 등 다양한 **검증된 컨테이너 이미지(소프트웨어)**를 배포하는 서비스 |\n| 배포 대상 | **Kubernetes Engine으로 생성한 Cluster** |\n| 방식 | **웹 콘솔에서 선택**하여 **셀프 서비스**로 손쉽게 배포 |\n\n- 다른 기능과 구분하기:\n\n| 보기에 나오는 설명 | 실제 해당 기능 |\n|---|---|\n| Cluster 없이 Virtual Server에 앱을 직접 설치 | Kubernetes Apps 아님(Apps는 Kubernetes Engine Cluster가 전제) |\n| 이미지 취약점 점검·분석 결과 제공 | **Container Registry** |\n| Pod 간·외부 엔드포인트 통신 제어 | **NetworkPolicy** |\n| 사용자가 Control Plane을 직접 설치·운영 | 해당 없음(Kubernetes Engine은 Control Plane을 SCP가 운영) |\n\n## 2. 애플리케이션 배포 단계 (교재 슬라이드 24)\n| 단계 | 작업 |\n|---|---|\n| 소스코드 관리 | **Git 저장소** 구성(GitHub, GitLab 등) |\n| Build 및 Image 관리 | 소스코드 Build → **Container Image 생성** → **Container Registry에 이미지 저장** |\n| Workload 배포 | **Deployment 오브젝트**를 통한 Pod 배포, **DevOps 파이프라인 연동**(지속적 개발) |\n| (사전) 네트워크·보안 | Ingress 오브젝트(URL 기반 라우팅) + Load Balancer 연동, Network Policy(파드 간 통신 제어) |\n\n- 관련 오브젝트 역할 복습:\n  - **Pod**: 최소 배포 단위.\n  - **ReplicaSet**: 지정된 수의 파드 복제본 유지, 장애 시 재생성.\n  - **Deployment**: ReplicaSet을 관리하며 **무중단 업데이트**를 담당.\n- WA백서 05: Kubernetes Engine에서 쓸 Container 이미지는 **Container Registry에 저장**되며, 그 이미지로 **pod를 배포**한다. 업데이트가 생기면 새 버전으로 등록해 배포하고, 이전 버전도 Registry에 보관해 복원할 수 있다.\n\n> [!시험]\n> \"빌드한 이미지를 File Storage에 저장하고 Worker Node에 마운트해 Pod를 기동한다\"는 오답. 이미지는 **Container Registry**, File Storage는 **Persistent Volume 용도**이다.\n\n## 3. Persistent Volume (PV)\n- 컨테이너 내부 파일은 Pod가 다시 만들어지면 사라진다. 로그나 여러 Pod가 함께 쓰는 공유 파일은 **PV**에 저장해 **영구 보관**한다.\n- 교재 그림 흐름: Container → **PVC** → **PV**(예: PV #1, `/nfs/temp1`) → **NAS(File System)**.\n- SCP에서는 Cluster 구성 단계에서 **PV 용도의 File Storage**를 생성하고 Cluster 생성 시 선택한다. Kubernetes Engine은 **Persistent Volume 관리** 기능을 제공한다.\n- WA백서 04: Kubernetes는 여러 컨테이너가 **공유하는 저장소를 관리**할 수 있다.\n\n| 요구사항 | 올바른 방법 | 틀린 방법 예 |\n|---|---|---|\n| Pod 재생성 후에도 로그·공유 파일 유지 | File Storage → PV 구성 → PVC로 Pod에 연결 | 컨테이너 내부에 기록 후 ReplicaSet만 늘림, 로그마다 이미지 재생성, Ingress로 경로 노출, NetworkPolicy로 복제 |\n\n## 4. DevOps Service를 이용한 자동 배포 (WA백서 05)\n- 소스 코드를 Git에 **Push**하면 **Jenkins 파이프라인**이 트리거되어, 빌드된 애플리케이션 또는 **컨테이너 오브젝트 구성 선언 파일**이 Kubernetes Engine에 **자동 배포**된다.\n- DevOps 프로젝트에서 배포 대상 환경을 **헬름차트**로 구성하고(헬름 릴리스 이름, 헬름차트, K8S Engine Values / PVC / StorageClass를 Key/Value로 지정), 파이프라인 **Checkout → Build → Docker Build → Deploy to K8S**로 배포한다(상세는 3-9b).\n\n## 5. 컨테이너 운영 설정 (WA백서 01)\n- 컨테이너별 **CPU·메모리 사용량 제한**을 설정해 특정 서비스의 과도한 자원 사용을 막는다.\n- **Probe**로 컨테이너 정상 여부를 계속 확인하고 문제 시 **자동 재시작**한다.\n\n## 시험 포인트 정리\n> [!시험]\n> - Kubernetes Apps = 검증된 컨테이너 SW(Web/WAS 등)를 **웹 콘솔에서 골라 Kubernetes Engine Cluster에 배포**. (공식 페이지)\n> - 이미지 저장 위치 = **Container Registry**, Pod 배포 = **Deployment**.\n> - 영구 데이터 = **PV/PVC + File Storage**.\n\n출처: CloudNative1_Container_Services 슬라이드 15, 18, 23-24, 26; WA백서 01 p.24; WA백서 04 p.33; WA백서 05 p.16(그림 5-3), p.24(서버 이미지 버전 관리); CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 20-21; Kubernetes Apps는 문제 풀 해설 근거(삼성SDS 기술블로그, 교재 미수록)\n"}, "3-3e": {"title": "API Server 연결을 통한 운영 관리", "md": "## 한눈에 보기\n- Kubernetes의 모든 관리 작업은 Control Plane의 **API Server**를 통해 이루어진다. 사용자·관리자·외부 도구(DevOps Console, kubectl)는 API Server에 연결해 Cluster를 운영한다.\n- 연결 정보: **클러스터명, 클러스터 ID, CA Certificate, 접속 정보(kubeconfig 파일, API 서버 URL 등)**.\n- SLA: Kubernetes Engine 장애 = **컨트롤 플레인에 외부연결 및 접속을 5분 이상 확보하지 못하는 경우**.\n\n## 1. API Server의 역할\n| 항목 | 내용 |\n|---|---|\n| 위치 | Master Node의 Control Plane |\n| 기능 | Kubernetes 구성요소 **생성/삭제** 기능, **인터페이스** 담당 |\n| 접근 주체 | User, Administrator(교재 아키텍처 그림에서 API Server로 접근) |\n| 관련 요소 | 상태 저장은 etcd, 배치는 Scheduler, 상태 유지는 Controller Manager |\n- SCP Kubernetes Engine은 Control Plane(API Server 포함)을 SCP가 운영하므로 사용자는 API Server **엔드포인트에 연결**해서 관리한다.\n\n## 2. Kubernetes Engine에서 제공하는 운영 관리 기능 (교재 슬라이드 23)\n| 관리 영역 | 기능 |\n|---|---|\n| Kubernetes Cluster 관리 | Cluster **정보조회**, **권한 관리**, **신규 사용자 추가** |\n| Node 관리 | Worker Node **조회 및 관리** |\n| 리소스 관리 | **Persistent Volume** 관리, **Namespace** 관리 |\n| 보안 | **Network Policy** 생성/관리 |\n\n## 3. 외부 도구에서 API Server로 연결: DevOps Console 클러스터 등록\n메뉴: **DevOps Console > 관리 > 배포 타겟 > K8S 클러스터**\n1. K8S 클러스터 추가: **클러스터명, 클러스터 ID, CA Certificate, 접속 정보(kubeconfig 파일, API 서버 URL 등)** 입력\n2. **네임스페이스 가져오기**: 등록한 클러스터의 네임스페이스 선택(예: devops) → 저장\n- 이후 프로젝트 생성 시 이 K8S 클러스터와 네임스페이스를 배포 타겟으로 고른다.\n\n> [!시험]\n> 등록에 필요 없는 것: **Worker Node OS의 root 계정 비밀번호** 등 노드 접속 정보. API Server로 연결하므로 노드 계정은 쓰지 않는다.\n\n## 4. kubectl을 이용한 운영 (일반 개념 + 교재 예시)\n- (일반 개념) `kubectl`은 kubeconfig에 적힌 API Server 주소와 인증 정보로 Cluster에 명령을 보내는 CLI이다. 노드에 SSH로 접속해 컨테이너를 직접 바꾸는 도구가 아니다.\n- 이미지 버전 업데이트와 롤백 예(AI&ML_2_CloudML 교재):\n```\ndocker tag svc-digit-model:latest harbor.mycompany.com/ml/svc-digit-model:v1\ndocker login harbor.mycompany.com\ndocker push harbor.mycompany.com/ml/svc-digit-model:v1\nkubectl apply -f svc-digit-model.yaml\n```\n- 업데이트: YAML의 `image:` 값을 `...:v2`로 바꾼 뒤 `kubectl apply`.\n- 롤백: `:v1`로 되돌려 다시 적용.\n- WA백서 05: 이전 버전 이미지도 Registry에 보관되므로 과거 버전을 확인해 **복원**할 수 있다.\n\n> [!시험]\n> \"kubectl은 각 Worker Node에 SSH로 접속해 컨테이너를 교체하므로 노드마다 반복 실행해야 한다\"는 오답. 매니페스트를 API Server에 한 번 반영하면 된다.\n\n## 5. 장애 감지와 자동 대응\n| 기능 | 동작 |\n|---|---|\n| Control Plane | 문제 발생 시 **자동 감지·대응** |\n| Controller Manager | Pod 원하는 상태 유지, Scaling, Fail-Over |\n| ReplicaSet | 장애 시 파드 재생성 |\n| Probe (WA백서 01) | 컨테이너 정상 여부 확인, 문제 시 자동 재시작 |\n| 노드 자동 복구 (WA백서 01) | NotReady 약 10분 지속 또는 상태 미보고 시 복구 개시 |\n\n## 6. SLA 장애 정의 비교 (WA백서 01)\n| 서비스 | 장애 정의 |\n|---|---|\n| **Kubernetes Engine** | **컨트롤 플레인**에 외부연결 및 접속을 **5분 이상** 확보하지 못하는 경우 |\n| **Container Registry** | **Container Registry Endpoint**에 대한 **모든 연결 요청이 5분 동안 실패**하는 경우 |\n| DBaaS, Event Streams, Search Engine | 가동 중인 멀티 인스턴스 또는 개별 서비스가 모두 외부 연결 및 접속을 5분 이상 확보하지 못하는 경우 |\n| File Storage, Block Storage | Compute에서 Storage로 **15초 이상 Timeout** |\n| 공통 | 가동 중인 인스턴스 또는 개별 서비스가 모두 외부 연결 및 접속을 확보하지 못하는 경우 |\n- 월 가용률(%) = [1 − {장애 시간(분) 합 / 서비스 이용 월 총 시간(분) 합}] × 100. 장애 시간은 회사(SDS) 사유로 해당 월에 발생한 장애 시간의 합.\n\n> [!시험]\n> Kubernetes Engine 장애 기준의 대상은 **컨트롤 플레인**(Worker Node가 아님), 시간은 **5분 이상**. \"약 10분 NotReady\"는 노드 자동 복구 임계값이고 SLA 기준이 아니다.\n\n출처: CloudNative1_Container_Services 슬라이드 12-13, 23; CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 13, 16; AI&ML_2_CloudML 슬라이드 6; WA백서 01 p.7-8(SLA), p.24, p.36; WA백서 05 p.24\n"}, "3-3f": {"title": "Container Registry · 이미지 관리", "md": "## 한눈에 보기\n- **Container Registry**: SCP에서 Container 이미지를 손쉽게 **저장, 관리, 공유, 배포**하는 서비스.\n- 저장 대상: **Container Image, Helm Chart, OCI Artifact**. 실제 저장소는 **Object Storage**(저렴한 비용, 대용량).\n- 보안: 암호화 저장 + HTTPS, **IAM 리소스 기반 권한**, **Private/Public 접근제어**, **이미지 취약점 스캔**, ACL(White List).\n- 과금: Pay-as-you-go, **Per Usage(GB)**. SLA: **Endpoint 연결 요청이 5분 동안 모두 실패**하면 장애.\n\n## 1. 시스템 구조 (교재 슬라이드 21)\n| 구성 | 내용 |\n|---|---|\n| 사용자 | 개발자, 관리자, **CI/CD** 도구 |\n| 접근 방식 | **UI, API, CLI** |\n| 주요 동작 | **Image Push**(개발자·CI/CD → Registry), **Image Pull**(K8S Cluster ← Registry) |\n| 인증·권한 | **IAM**, **IDP** 연계 사용자 인증, Registry/Repository 권한 관리 |\n| 저장 | Image/Chart/Artifact를 **Object Storage**에 저장 |\n| 연계 | 이벤트 로깅(**Logging/Audit**), 이벤트 모니터링(**Cloud Monitoring**) |\n- Registry 내부 기능 블록: Registry 생성/삭제/관리, Repository 관리, 취약점 점검, 이미지 정책 관리, 인증, 권한, Image Tag 관리.\n\n## 2. 주요 특징 4가지\n| 특징 | 세부 내용 |\n|---|---|\n| **Registry 관리** | Registry **생성, 삭제, 접근제어** / Repository **조회, 삭제, 보안 정책 설정** |\n| **Image 관리** | **Object Storage**를 통해 저렴한 비용으로 대용량 이미지를 효율적으로 관리 / Image **Push, Pull, 조회, 삭제** / **Tag 버전 관리** / Image **보안 스캔 및 취약점 분석 결과** 제공 |\n| **보안이 강화된 Registry 관리** | **암호화된 저장 및 HTTPS** 사용 / **IAM 리소스 기반 접근 권한 관리** / **Private/Public 접근제어** |\n| **모니터링** | **사용량 모니터링** (이벤트 로깅, 이벤트 모니터링 연계) |\n\n> [!시험]\n> 이미지 저장 백엔드는 **Object Storage**이다. \"Block Storage에 저장해 고성능 I/O로 관리\"는 오답. 저장 대상에 Helm Chart와 OCI Artifact가 포함된다는 점도 자주 나온다.\n\n## 3. 접근 제어 (WA백서 02, Network 교재)\n- WA백서 02: Storage는 접근 대상을 **White List**로 관리하는 **접근 제어 목록(ACL)**을 구성한다. ACL을 관리하는 저장소는 **File Storage, Object Storage, Container Registry**이다.\n- ACL 대상: **Public IP 주소, Account 내의 서버, VPC Endpoint** 등.\n- **VPC Endpoint**: Direct Connect, Transit Gateway로 연결된 고객사 내부망에서 VPC 외부 서비스로 **프라이빗 연결**. 연결 가능 서비스는 **Object Storage, File Storage, Container Registry, DNS**. 생성 시 대상 서비스는 Object Storage, File Storage, Container Registry 중 선택하고, 선행 작업으로 **Endpoint Subnet**을 만든다.\n\n| 수단 | Container Registry에 쓰는가 |\n|---|---|\n| ACL(White List: Public IP, Account 내 서버, VPC Endpoint) | 예 |\n| VPC Endpoint로 인터넷 거치지 않고 접근 | 예 |\n| IAM 리소스 기반 권한, Private/Public 설정 | 예 |\n| **Security Group** | 아니오(서버 등의 트래픽 제어 수단) |\n\n## 4. 이미지 보안 (WA백서 02)\n- Container Registry는 저장된 **Container Image의 취약점을 점검**하는 도구를 제공한다.\n- 모범 사례: 최신 보안 업데이트가 적용된 **강화된 서버/컨테이너 이미지**로 프로비저닝한다.\n- **신뢰할 수 있는 레지스트리**에서만 컨테이너 이미지와 라이브러리를 가져오고 **서명을 확인**한다(변조·악성 코드 확인).\n- **자체 프라이빗 레지스트리**에 신뢰된 이미지를 저장하고, 빌드·배포 과정에서는 이 레지스트리의 이미지를 참조한다. 정기 스캔과 업데이트로 새 취약점에 대응한다.\n- 설계 원칙: **컨테이너를 배포할 때 CI/CD 파이프라인에서 취약점 점검을 자동화**한다.\n- 신뢰 레지스트리에서 가져와도 서명 확인·취약성 스캔을 하지 않으면 위험이 남는다. 정기적인 이미지 강화, 서명 검증, 취약성 스캔, 업데이트가 필수이다.\n\n## 5. 이미지 버전·태그 관리\n- WA백서 05: Kubernetes Engine용 Container 이미지는 Container Registry에 저장되어 pod 배포에 쓰인다. 업데이트 시 **새 버전으로 등록**해 배포하고, **기존 버전도 Registry에 저장**해 두었다가 필요하면 **과거 버전을 확인해 복원**한다.\n- AI&ML_2_CloudML 교재(Container Registry를 Model Registry처럼 활용):\n  - 태그로 버전·환경 구분: `svc-digit-model:v1`, `:v2`, `:prod`, `:exp`\n  - 이미지에 **모델 버전, 학습일, 하이퍼파라미터** 등 메타 정보를 태그나 레이블로 기록해 추적\n  - 업로드 절차: `docker tag`(Registry 주소 포함 이름) → `docker login` → `docker push`\n- 태그는 **사용자가 붙인다**. Registry가 품질을 판단해 태그를 바꾸거나 이전 이미지를 자동 삭제하지 않는다.\n\n## 6. DevOps Service와의 연계\n- DevOps Console > 관리 > 툴 & 템플릿 > 툴 관리 > 툴 추가에서 툴로 **SCP Container Registry**를 등록한다.\n  - 입력: 툴명, 이미지 저장소 URL, **SCP 프로젝트 ID**, 사설 SSL 인증서 사용, 시스템 공통 이미지 포함 여부, 인증 타입 **Access Key / Secret Key**.\n  - 툴 분류: **Image Registry**.\n- 프로젝트 생성 시 이미지 저장소로 **Docker hub / Image Registry** 중 선택.\n- WA백서 05: CI/CD 파이프라인에서 빌드된 컨테이너 이미지는 **Container Registry에 저장**된 뒤 대상 클러스터에 배포된다.\n\n## 7. 가용성·DR·과금\n| 항목 | 내용 | 출처 |\n|---|---|---|\n| SLA 장애 정의 | Container Registry **Endpoint에 대한 모든 연결 요청이 5분 동안 실패** | WA백서 01 |\n| DR | Container Registry DR 사용 시 **DR 레지스트리와 Object Storage 버킷이 다른 Region으로 복제**. 한 Region Cluster의 이미지를 다른 Region으로 복제해 동일 Cluster 구성 가능. **File Storage DR과 함께** 구성하면 **Kubernetes Cluster DR** 구현 | WA백서 03 |\n| 과금 | Pay-as-you-go, **Per Usage(GB)** | WA백서 06 |\n\n> [!주의]\n> WA백서 03은 Container Registry DR을 설명하면서 \"Region 간 Container Registry 기능은 향후 출시 예정('26년)\"이라고 적고 있다. 출시 여부는 단정하지 않는다.\n\n## 시험 포인트 정리\n> [!시험]\n> - 저장소 = **Object Storage**, 저장 대상 = Image + Helm Chart + OCI Artifact.\n> - 접근제어 = **ACL(White List) / IAM / Private·Public / VPC Endpoint**. Security Group은 오답.\n> - 취약점 스캔은 Registry 기능, 배포 시 **CI/CD 파이프라인에서 취약점 점검 자동화**.\n> - 이전 버전 이미지는 보관되어 롤백 가능. 자동 삭제되지 않는다.\n\n출처: CloudNative1_Container_Services 슬라이드 20-21; CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 14, 19; SCP_v2_Explore_Network_01-10 슬라이드 33-35(VPC Endpoint); AI&ML_2_CloudML 슬라이드 4, 6, 11; WA백서 01 p.7-8; WA백서 02 p.30, p.38-39; WA백서 03 2.6절; WA백서 05 p.16, p.24; WA백서 06 p.4\n"}, "3-3g": {"title": "서비스 네트워킹 · 클러스터 접근제어", "md": "## 한눈에 보기\n- **Service**: Pod 집합에 고정된 네트워크 접근점을 주는 추상화 계층. 실제 규칙은 각 Worker Node의 **kube-proxy**가 구현한다.\n- **Ingress**: **domain(host)·path 기반 URL**로 외부 트래픽을 Service로 보낸다. **Ingress Controller**(예: Nginx)가 필요하고 Load Balancer와 연동한다.\n- **NetworkPolicy**: Pod 간 또는 외부 엔드포인트와의 통신을 제어한다. **기본값은 모든 소스 허용**.\n- **Namespace**: Cluster 내 리소스의 논리적 격리.\n- Cluster 접근제어: Kubernetes Engine의 **권한 관리, 신규 사용자 추가**, Security Group, Network Policy 관리.\n\n## 1. Service와 kube-proxy\n| 요소 | 역할 |\n|---|---|\n| Service | 파드에 대한 **네트워크 접근을 제공하는 추상화 계층** |\n| kube-proxy | **Service에 정의된 네트워킹 규칙의 실제 구현** (각 Worker Node) |\n- Pod는 재생성되면 IP가 바뀌지만 클라이언트는 Service 주소로 접근하므로 영향이 없다. (일반 개념) Service의 IP와 이름은 Pod 재생성과 무관하게 유지된다.\n\n### Service 유형 (일반 개념, 교재 미수록)\n| 유형 | 설명 |\n|---|---|\n| ClusterIP | 기본 유형. **클러스터 내부**에서만 접근 가능한 가상 IP |\n| NodePort | 모든 Node의 특정 포트를 열어 `Node IP:포트`로 외부 접근 |\n| LoadBalancer | 외부 Load Balancer를 연동해 Service를 클러스터 외부에 노출 |\n| ExternalName | Service를 외부 DNS 이름(CNAME)에 매핑 |\n\n## 2. Ingress (교재 슬라이드 18)\n- Ingress를 통해 **domain 기반 URL로 Kubernetes Service에 접근**한다. 교재 표현으로는 Service에 대한 Load Balancer 생성 메커니즘이다.\n- 구성: 사용자 → (L4) → **Ingress Controller(Nginx Ingress Controller)** → Ingress 규칙 → Service → Pod(Container).\n\n교재 예시 설정:\n| 구분 | 운영 | 개발 |\n|---|---|---|\n| 접속 URL | `prod.example.com` | `dev.example.com/httpdev` |\n| Ingress 규칙 | host `prod.example.com`, path `/`, serviceName `httpprod`, servicePort `80` | host `dev.example.com`, path `/dev`, serviceName `httpdev`, servicePort `80` |\n| Service | `httpprod`: port `80`, target `8080` | `httpdev`: port `80`, target `7000` |\n| Pod | containerPort `8080` | containerPort `7000` |\n\n- 트래픽 흐름(운영): Ingress Controller가 **host 기준**으로 `httpprod` Service의 **80** 포트로 전달 → Service가 **targetPort 8080** = 컨테이너의 **containerPort 8080**으로 전달.\n\n> [!시험]\n> 포트 3종을 구분한다. **servicePort/port(80)** = Service가 받는 포트, **target(8080)** = Pod로 넘기는 포트, **containerPort(8080)** = 컨테이너가 듣는 포트. target과 containerPort가 같아야 한다. Ingress는 host·path로 라우팅하며 Service 없이 Pod에 직접 붙지 않는다.\n\n- SCP 구성 과정에서의 위치: Cluster 기본 설정 단계에서 **Ingress Controller 설치**(외부 트래픽 처리) → 네트워크·보안 설정 단계에서 **Ingress 오브젝트 구성(URL 기반 라우팅)** + **Load Balancer와 연동**.\n- WA백서 01 MSA 예시: Load Balancer → (API 요청이 아닌 요청) → Kubernetes Engine의 **ingress** → 매핑된 서비스 Pod. API 요청은 API Gateway가 인증·라우팅한다. 서비스 간 네트워크 제어·추적에는 **Service Mesh**를 쓸 수 있다.\n\n## 3. Namespace를 통한 격리\n- Namespace는 Cluster 내 리소스를 **논리적으로 격리**한다(예: kube-system, 운영, 개발).\n- 환경마다 Cluster를 새로 만들면 리소스 활용도가 떨어지므로 Namespace로 나눈다.\n- DevOps Console에서 클러스터를 등록할 때도 **네임스페이스 단위**로 가져와 배포 타겟으로 쓴다.\n\n## 4. NetworkPolicy (교재 슬라이드 17)\n| 항목 | 내용 |\n|---|---|\n| 목적 | **서로 다른 Namespace Pod들 간의 트래픽 흐름** 제어 |\n| 범위 | Pod 간 통신 + **외부 네트워크 엔드포인트와의 통신** 제어 |\n| 기본 동작 | **기본적으로 Pod는 모든 소스에서 오는 트래픽을 허용** |\n| SCP 지원 | Kubernetes Engine이 **Network Policy 생성/관리** 기능 제공 |\n| 구성 시점 | 네트워크 및 보안 설정 단계의 **Cluster 보안 정책**(파드 간 통신 제어) |\n\n> [!시험]\n> \"NetworkPolicy가 없으면 Pod는 기본적으로 모든 트래픽을 차단한다\"는 오답. 기본은 **전부 허용**이므로 제한하려면 NetworkPolicy를 명시적으로 만들어야 한다.\n\n## 5. 클러스터 접근제어 요약\n| 계층 | 수단 | 근거 |\n|---|---|---|\n| Cluster 사용자 | Kubernetes Engine의 **권한 관리, 신규 사용자 추가** | 교재 슬라이드 23 |\n| Cluster 인프라 | Cluster 생성 시 **Security Group**, Load Balancer, DNS 설정 제공 | 교재 슬라이드 23 |\n| API Server 연결 | **CA Certificate, kubeconfig, API 서버 URL**로 인증된 연결 | DevOps Tools 슬라이드 13 |\n| Pod 트래픽 | **NetworkPolicy** | 교재 슬라이드 17 |\n| 리소스 격리 | **Namespace** | 교재 슬라이드 16 |\n| 이미지 저장소 | Container Registry **ACL / IAM / Private·Public** | 3-3f |\n| 관리 부담 | 관리형 서비스로 플랫폼 영역 보안을 제공자가 관리 | WA백서 02 |\n\n## 시험 포인트 정리\n> [!시험]\n> - 외부 URL 라우팅 = **Ingress**(+Ingress Controller, LB 연동), Pod 간 통신 제어 = **NetworkPolicy**, 환경 분리 = **Namespace**, 네트워크 규칙 구현 = **kube-proxy**.\n> - NetworkPolicy 기본값 = 모두 허용.\n> - Service는 Pod가 바뀌어도 접근 주소를 유지한다.\n\n출처: CloudNative1_Container_Services 슬라이드 14-18, 23-24, 26; CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 13; WA백서 01 p.24(MSA 구현 예시); WA백서 02 p.10; Service 유형은 일반 개념(문제 풀 해설 근거)\n"}, "3-9a": {"title": "CI/CD · DevOps 개념과 Tool", "md": "## 한눈에 보기\n- **DevOps**: 애플리케이션과 서비스를 신속하게 제공하기 위해 조직의 역량을 향상시키는 **문화, 철학, 방식 및 도구의 조합**. Dev(지속적 변화/개선) + Ops(안정적인 운영).\n- **CI/CD**: DevOps를 위한 구체적인 기술적 실천 방법론. **Code → Build → Integrate → Release → Deploy** 전 과정을 자동화한다.\n- **배포 전략**: 교재는 **블루-그린**과 **카나리** 두 가지를 다룬다. WA백서 05는 인플레이스, 롤링, 블루-그린, 레드-블랙, 불변 배포까지 다룬다.\n- 대표 도구: Git(GitHub/GitLab), Jenkins, Docker Hub/Container Registry, SonarQube, Helm, ArgoCD, Terraform.\n\n## 1. DevOps란\n| 구분 | 내용 |\n|---|---|\n| Dev (Development Team) | **지속적 변화/개선** |\n| Ops (Operation Team) | **안정적인 운영** |\n| 정의(교재) | 애플리케이션과 서비스를 신속하게 제공하기 위해 조직의 역량을 향상시키는 문화, 철학, 방식 및 도구의 조합 |\n| 구현 수단 | 개발 프로세스 전반의 **자동화를 추구하는 CI/CD** |\n- WA백서 05: DevOps 조직은 Dev와 Ops를 별개 팀으로 나누는 것이 아니라 **서비스 전체 생명주기(기획, 개발, 배포, 운영)**에 걸쳐 목표를 일치시키고 **책임을 공유**하는 협업 체계이다. 운영 조직은 변경을 통제하는 역할에서 벗어나 자동화된 CI/CD 파이프라인, IaC 템플릿, 모니터링·보안이 내재된 플랫폼을 제공한다.\n- WA백서 05: CI/CD 애플리케이션으로 재구축하면 운영팀과 개발팀이 **DevOps팀(클라우드 원팀)**으로 통합된다. 보안까지 합치면 **DevSecOps**.\n- WA백서 05: DevOps 환경에서도 모든 개발자에게 배포 권한을 주기보다 특정 인원에게 위임하고, 자동 배포 과정에 **승인 절차**를 두는 것이 효과적이다.\n\n> [!시험]\n> SEA 예시문제: DevOps는 개발·운영 통합, 시장 요구에 빠른 대응, 운영 장애 최소화, 실패 시 즉각 복구를 목표로 한다. \"DevOps Service는 Kubernetes Engine만 지원하고 Virtual Server는 지원하지 않는다\"는 **오답**이다(배포 타겟으로 컨테이너뿐 아니라 **버추얼 머신도** 연계 가능).\n\n## 2. CI/CD 단계와 정의 (교재 슬라이드 6)\n흐름: **Code → Build → Integrate → Release → Deploy**\n\n| 개념 | 교재 정의 | 범위 |\n|---|---|---|\n| **지속적인 통합 (Continuous Integration)** | 변경된 소스 코드의 **병합(Merge)/빌드(Build)/테스트(Test)**를 자동화 | Code·Build·Integrate |\n| **지속적인 제공 (Continuous Delivery)** | 소프트웨어 **릴리즈(Release)**와 이를 위한 **인프라 자원 확보** 프로세스 자동화. **운영환경 배포 전 승인 과정이 필요한 경우** | ~Release |\n| **지속적인 배포 (Continuous Deployment)** | 릴리즈된 소프트웨어를 **운영 환경에 배포**하는 프로세스까지 자동화 | ~Deploy |\n\nCI/CD 효과(교재): **Delivery 속도의 향상**, **신속한 Feedback Loop**, **신속한 Time-to-market(TTM)**, **서비스의 안정성 및 품질 향상**. 개발 프로세스 자동화로 신속하게 시스템을 바꿀 수 있어 비즈니스 환경 변화에 효과적으로 대응한다.\n\n### WA백서 05의 보충 설명\n- CI: 개발자가 코드 저장소에 자주 Commit → 자동 빌드·테스트(단위·통합 테스트). CI는 SDLC에서 **빌드 및 단위 테스트 단계를 자동화**하는 프로세스이며, **Commit된 모든 업데이트가 자동화된 빌드와 테스트를 생성**한다. 운영 환경 최종 배포는 개발자가 직접 트리거하는 것이 일반적이다.\n- CD(지속적 배포): CI를 **확장**하여 테스트를 통과한 빌드를 **운영 환경에 자동 배포**하는 절차까지 포함한다.\n- 모든 테스트를 통과한 경우에만 Staging 및 운영 환경 배포를 허용한다.\n\n> [!시험]\n> CI와 CD의 범위를 뒤바꾼 보기가 단골 오답이다. CI = 병합·빌드·테스트, Continuous Delivery = 릴리즈 + 배포 전 **승인**, Continuous Deployment = 운영 배포까지 자동.\n\n## 3. 운영 자동화 영역과 도구 (WA백서 05 표 5-5)\n| 영역 | 구현 방법 |\n|---|---|\n| 파이프라인 정의, 실행 및 관리 | **DevOps Service**로 CI/CD 파이프라인 및 실행 자동화 |\n| 배포 | **Terraform** 같은 **IaC** 도구로 인프라 배포·업데이트 자동화 |\n| 테스트 | DevOps Service 파이프라인에서 **SonarQube**로 테스트 자동화 |\n| 크기 조정 | **Auto-Scaling** 또는 **Kubernetes Engine Node Pool 자동 확장** |\n| 모니터링 및 경고 | **Cloud Monitoring**에서 임계치 기반 이벤트 등록 → 임계치 초과 시 알림 |\n- DevOps 환경의 도구·자동화 요소: **코드 기반 인프라 관리(IaC)**, **중앙 집중형 코드 저장소**, **CI/CD 파이프라인**.\n- IaC는 **선언형 도구**가 지시형보다 운영 환경에 적합하다(선언 상태를 유지·복구). SCP는 CLI와 Open API를 제공해 Terraform으로 자원 배치를 자동화할 수 있다.\n- WA백서 03 설계 원칙: 자동화 도구로 인프라 템플릿 관리·배포, 코드를 **안전한 중앙 저장소**에서 관리, **CI/CD**로 개발부터 배포까지 관리.\n\n> [!시험]\n> \"모니터링 및 경고 – Terraform 정의 파일에 임계치 선언\"은 오답. 모니터링 경고는 **Cloud Monitoring**, Terraform은 **배포(IaC)**.\n\n## 4. 배포 전략 (교재 슬라이드 27-30, 33)\n### 블루-그린 배포 (Blue-Green Deployment)\n- 기존 버전(Blue, v1.0)과 새 버전(Green, v1.1)을 **동시에 배포**하고 **하나의 버전에서만 트래픽 처리**.\n- 예: `www.example.com`은 v1.0, `new.example.com`으로 v1.1 테스트 → **테스트 완료 후 트래픽을 새 버전으로 전환**.\n- 장점: 문제 발생 시 **구 버전으로 빠른 롤백**. 단점: **시스템 자원이 두 배**로 필요.\n\n### 카나리 배포 (Canary Deployment)\n- 트래픽을 새 버전으로 **일부** 전달한 뒤 문제가 없으면 **점차 전체 트래픽**을 새 버전으로 옮긴다.\n- 교재 그림 단계: **90%/10% → 50%/50% → 100%**(v1.1).\n- 활용 예: 온라인 쇼핑몰 신규 상품 **A/B 테스트**.\n- 교재 학습정리: **블루-그린 배포의 문제점을 보완**하기 위한 전략.\n\n| 비교 | 블루-그린 | 카나리 |\n|---|---|---|\n| 트래픽 | 한 번에 한 버전만 처리 후 전환 | 일부 → 점진적으로 전체 |\n| 롤백 | 구 버전으로 빠른 롤백 | 소수 사용자에서 문제 조기 발견 |\n| 자원 | **두 배** 필요 | 블루-그린 문제점 보완 |\n| 활용 | 테스트 완료 후 일괄 전환 | A/B 테스트 |\n\n### WA백서 05의 배포 전략 5종 (표 5-6)\n| 전략 | 설명 |\n|---|---|\n| 인플레이스 (In-place) | 현재 서버에서 업데이트. 가동 중지 발생 가능, DNS 수정 불필요, 실패 시 **재배포가 유일한 복원** |\n| 롤링 (Rolling) | 서버 군을 그룹으로 나눠 **점진적** 배포. 구·신 버전 공존, 제로 다운타임에 유리, 배포 시간은 더 김 |\n| 블루-그린 (Blue-green) | 기존 서버를 새 서버로 점진적으로 교체. DNS 컷오버, Auto-Scaling 그룹 정책, **GSLB Ratio 알고리즘** 가중치로 전환 |\n| 레드-블랙 (Red-black) | 기존 서버에서 새 서버로 **즉시 전환**(일시에 DNS 변경, 하나의 버전만 활성) |\n| 불변 (Immutable) | 완전히 새로운 서버 세트 구축(기존 VM 종료 후 새 VM 배포). 알 수 없는 종속성·복잡한 인프라에 적합 |\n- WA백서 05 카나리 예: GSLB Ratio로 v1에 **90%**, v2·v3에 각 **5%**를 보내 A/B 테스트. 블루-그린에서 일부 요청을 그린으로 보내 영향을 보는 것을 **카나리 분석**이라 한다. 지표가 정상이면 블루(v1)를 종료하고 자원을 해제한다.\n- 블루-그린은 가동 중지 시간 0, 손쉬운 롤백, 배포 시간 지정 가능. 배포 전략 선택 시 가동 중지 시간과 함께 **비용**(교체할 VM 수, 배포 빈도)을 고려한다.\n- WA백서 04: Kubernetes는 중단 시간을 최소화하는 **블루-그린 배포 기능**을 제공한다.\n\n> [!주의]\n> 블루-그린 설명이 자료마다 다르다. DevOps Tools 교재는 \"두 버전을 동시에 배포하고 하나의 버전에서만 트래픽 처리, 테스트 후 트래픽 전환\"이라고 하고, WA백서 05 표 5-6은 \"기존 서버를 새 서버로 점진적으로 교체\"라고 하며 GSLB 가중치로 점진 전환하는 방식을 소개한다. 교재 문항이면 교재 정의(동시 배포, 일괄 전환, 자원 2배)를 기준으로 고른다. \"즉시 일괄 DNS 전환\"은 WA백서에서 레드-블랙으로 구분한다.\n\n## 시험 포인트 정리\n> [!시험]\n> - 블루-그린은 자원이 **두 배**. \"카나리보다 자원이 적다\"는 오답.\n> - 카나리 = 일부 트래픽 → 점진 확대, A/B 테스트에 활용, 블루-그린의 문제점 보완.\n> - 자동화 표: 파이프라인 = DevOps Service, 배포 = Terraform(IaC), 테스트 = SonarQube, 크기 조정 = Auto-Scaling/Node Pool, 경고 = Cloud Monitoring.\n\n출처: CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 1-6, 26-33; WA백서 05 p.11(배포 권한), p.12-13(DevOps 조직), p.15(표 5-5), p.16-18(IaC, CI/CD), p.21-24(배포 전략, 카나리); WA백서 03 4장 설계 원칙; WA백서 04 p.33; SEA_문제_예시 7번\n"}, "3-9b": {"title": "DevOps Service 구성 요소 · Pipeline", "md": "## 한눈에 보기\n- **DevOps Service**: SCP의 **CI/CD 도구 통합 관리 서비스**. **DevOps Console**이라는 단일 환경에서 CI/CD 도구 연계 설정, 접근 권한 설정을 한다.\n- 계층: **테넌트 → 프로젝트 그룹 → 프로젝트** (테넌트에 Tenant 툴, Tenant App. Template이 붙는다).\n- 구성 7단계: ① 배포 타겟 인프라 생성 → ② DevOps 서비스 신청 → ③ 클러스터 등록 → ④ CI/CD 도구 준비 → ⑤ 프로젝트 그룹 생성 → ⑥ 프로젝트 생성 → ⑦ 배포 완료.\n- 기본 파이프라인: **Checkout → Build → Docker Build → Deploy to K8S**.\n- 과금: Pay-as-you-go, **Per User**(Workflow는 횟수당 추가 계산).\n\n## 1. 주요 특징 (교재 슬라이드 8)\n| 특징 | 내용 |\n|---|---|\n| **CI/CD 도구 통합 연계** | DevOps Console GUI로 소스 코드 저장소, Artifact 저장소, 소스 코드 품질 분석 도구, 컨테이너 이미지 저장소 등 CI/CD 파이프라인 도구를 **등록·관리** |\n| **간편한 Workflow 통합 관리** | 소스 코드 빌드부터 배포까지의 Workflow를 **파이프라인**으로 구현해 통합 관리. 배포 타겟으로 **컨테이너뿐 아니라 버추얼 머신도** 연계 가능 |\n| **효율적인 개발환경 구성** | 개발 언어(Java, Python, Ruby 등)와 프레임워크(SpringBoot, Vue.js, .Net 등)를 포함한 **애플리케이션 템플릿**으로 **Wizard 방식** 프로젝트 구성. **테넌트별/Account별**로 사용자가 **자체 템플릿을 직접 등록·관리** |\n- WA백서 05: DevOps Service에는 소스 코드 저장·형상 관리 도구가 내장되어 있다. 프로젝트별 **Private Git Repository**를 구성하고 사용자별 접근 권한을 설정할 수 있다.\n\n## 2. 핵심 개념 (교재 슬라이드 9)\n```\nDevOps Service\n └ 테넌트 ── Tenant 툴, Tenant App. Template (Dev. Starter)\n     └ 프로젝트 그룹\n         └ 프로젝트 …\n```\n| 개념 | 설명 |\n|---|---|\n| 테넌트 | DevOps Service 신청 시 만들어지는 최상위 단위. 툴과 앱 템플릿을 테넌트 단위로 둔다 |\n| 프로젝트 그룹 | 테넌트 아래에서 프로젝트를 묶는 단위 |\n| 프로젝트 | 실제 CI/CD 환경(코드 저장소, 이미지 저장소, 파이프라인, 배포 대상) 단위 |\n\n## 3. 구성 절차 상세\n### ① 배포 타겟 인프라 생성\n- **Kubernetes** 또는 **VM**을 먼저 만든다(예: Kubernetes Cluster).\n\n### ② DevOps Service 신청 (DevOps Service 생성)\n| 입력 | 의미 |\n|---|---|\n| **Tenant 명** | DevOps Console 사용을 위한 Tenant명. **사용자가 Console 접속 시 논리적으로 표시되는 이름**(예: devops-demo) |\n| **Tenant 코드** | DevOps Console과 **연계를 위한 코드**, 엔지니어들이 **시스템 내부적으로 사용** |\n| Tenant 멤버 추가 | 신청자 + 사용자 목록에서 멤버 선택 |\n- DevOps Service는 개발환경에 최적화된 DevOps Console에서 각종 개발도구 사용 및 서비스가 가능하다.\n\n> [!시험]\n> Tenant **명** = 화면에 보이는 이름, Tenant **코드** = 내부 연계용. 바꿔치기 보기에 주의.\n\n### ③ 클러스터 등록\n- 메뉴: DevOps Console > 관리 > **배포 타겟** > K8S 클러스터\n- 입력: 클러스터명, 클러스터 ID, **CA Certificate**, 접속 정보(**kubeconfig 파일, API 서버 URL** 등)\n- **네임스페이스 가져오기**: 등록한 클러스터의 네임스페이스 선택(예: devops) → 저장\n\n### ④ CI/CD 도구 준비\n- 준비 대상 예: GitHub 계정, GitLab 계정, Docker 허브 계정, Jenkins 등\n- 메뉴: DevOps Console > 관리 > **툴 & 템플릿 > 툴 관리 > 툴 추가**\n- 입력 예(SCP Container Registry 등록): 툴명, 툴, 이미지 저장소 URL, **SCP 프로젝트 ID**, 사설 SSL 인증서 사용, 시스템 공통 이미지 포함 여부, 인증 타입 **Access Key / Secret Key**\n\n| 툴 분류 (8종) |\n|---|\n| SCM Repository |\n| CICD Pipeline |\n| Image Registry |\n| Code Quality |\n| Artifact Repository |\n| DevOps Dashboard |\n| Helm Chart Repository |\n| Test Management |\n\n### ⑤ 프로젝트 그룹 생성\n- DevOps Console 첫 화면 → **\"프로젝트그룹 생성하여 시작하기\"**\n- 입력: **프로젝트그룹명, 프로젝트그룹 ID, 테넌트**\n\n### ⑥ 프로젝트 생성 (7개 화면)\n| 순서 | 화면 | 주요 항목 |\n|---|---|---|\n| 1/7 | 프로젝트명 및 배포대상 선택 | 프로젝트그룹, 프로젝트명, 프로젝트 ID / 구성 방법 **App. 템플릿 활용 / 직접 구성** / 배포 타겟 **Kubernetes / Kubernetes(ArgoCD) / VM** / K8S 클러스터·네임스페이스 선택 |\n| 2/7 | 애플리케이션 템플릿(런타임 환경) | 템플릿 유형 필터 **System / Tenant / ProjectGroup Template** / 분류 **Application, Batch, Environment Only, Mobile App., Static Web** / 예: AngularJS, .NET(Dotnet-core), Golang, NodeJS, Python, ReactJS, Ruby, SpringBoot, StaticWeb, VueJS |\n| 3/7 | 코드 저장소 선택 | 예: GitHub.com / **신규 저장소 생성 / 기존 저장소 사용**, URL, Branch / 인증정보: 신규 인증정보(ID/Token) → **Connection Test** |\n| 4/7 | 이미지 저장소 | **Docker hub / Image Registry** 중 선택 / 신규 생성 / 기존 사용, URL → **URL Check** |\n| 5/7 | 배포 대상 환경 | **헬름차트를 통해 직접 구성** / 배포 대상 워크로드 선택 / **헬름 릴리스** 이름, **헬름차트** 선택 / 헬름차트 설정 **K8S Engine Values / PVC / StorageClass**(Key/Value로 values.yaml 값 지정) |\n| 6/7 | 빌드 파이프라인 구성 | 파이프라인 **Checkout → Build → Docker Build → Deploy to K8S** / **Jenkins Job** 설정: 구분(개별/폴더), Jenkins URL, Job 경로, **빌드 에이전트**, 인증정보(ID/Password) |\n| 7/7 | 요약 정보 | 프로젝트(프로젝트그룹, 프로젝트, K8s Engine / Namespace), 애플리케이션 템플릿, 코드 저장소(GitLab 등) URL, 이미지 저장소(DockerHub 등) |\n\n- 생성 진행 팝업: \"CI/CD 환경에 필요한 요소들을 구성합니다. 구성에는 **최대 5분**까지 소요될 수 있습니다.\"\n  - 진행 순서: 프로젝트 생성 준비 → 코드 저장소 구성 → 이미지 저장소 구성 → 파이프라인 구성 → **헬름 릴리즈 구성** → 인증 정보 구성 → 완료(\"DevOps 환경 구성을 완료했습니다.\")\n\n### ⑦ 배포 완료\n- 프로젝트 정보: 프로젝트 ID, 프로젝트명, 생성자, 생성일시\n- 파이프라인 실행 결과: **Checkout → Build → Docker Build → Deploy to K8S → Declarative: Post Actions** 모두 SUCCESS\n- **헬름릴리스 상태**: SUCCESS\n\n> [!시험]\n> - 순서: **인프라 생성 → 서비스 신청 → 클러스터 등록 → 도구 준비 → 프로젝트 그룹 → 프로젝트 → 배포**. 클러스터 등록은 DevOps Console에서 하므로 서비스 신청 **뒤**이다.\n> - 템플릿은 System만 있는 것이 아니다. **Tenant·ProjectGroup 템플릿**을 직접 등록할 수 있다.\n> - 배포 타겟 3종: Kubernetes, **Kubernetes(ArgoCD)**, **VM**.\n\n## 4. 개발 및 배포 프로세스 (교재 슬라이드 25)\n애플리케이션 개발자가 DevOps Console을 쓰는 흐름(그림 번호 기준):\n1. 애플리케이션 개발 → **3 code push**(SourceCode Repository)\n2. **4 CI/CD 수행**(DevOps Console에서 빌드/배포 파이프라인 실행)\n3. **6 library reference**: 방화벽 너머 인터넷망의 오픈소스 library import → **Artifact Repository**\n4. **7 code pull** → Code Build → **Code Inspection**(Code Quality 도구로 code inspection)\n5. Image Build → **9 Image push**(Container Repository)\n6. Image Deploy → **10 deploy**: **VM Pool**(VM들) 또는 **SDS PaaS Cluster**\n\n## 5. 개발·테스트·운영 CI/CD 아키텍처 (WA백서 05 그림 5-5)\n1. DevOps Service 상품 신청 후, 사용자 영역에 소스코드 저장소 및 CI/CD 툴을 구성해 **DevOps Console과 연계**.\n2. 개발자가 소스를 **개발자 branch**에 Push.\n3. 개발자 branch를 **Dev branch**에 Pull 요청.\n4. 리뷰 후 Dev branch에 **병합(merge)**.\n5. 병합 후 CI/CD 빌드 파이프라인 실행: 소스 **체크아웃 → 빌드 → 컨테이너 이미지 빌드**.\n6. 빌드된 이미지를 **Container Registry**에 저장.\n7. 대상 클러스터(dev)의 컨테이너에 신규 버전 이미지 배포.\n8. 개발자가 frontend 컨테이너에 접근해 배포 결과 확인.\n9. Dev → Stage 확인 후 **Production branch**에 병합, Production 클러스터 대상으로 4~8 반복.\n10. **블루-그린 배포**로 릴리스해 End User에게 제공.\n- WA백서 05 그림 5-3: Git Push → **Jenkins 파이프라인** 트리거 → 빌드된 애플리케이션 또는 컨테이너 오브젝트 구성 선언 파일이 Kubernetes Engine에 자동 배포. 중앙 저장소에 소스와 **인프라 구성 선언 파일**을 함께 두면 변경을 통합 관리하고 이전 상태로 복구할 수 있다.\n\n## 6. 과금과 요약\n| 항목 | 내용 |\n|---|---|\n| 과금(WA백서 06) | DevOps Service: Pay-as-you-go, **Per User** (Workflow는 횟수당 추가 계산) |\n| 가치(교재) | 다양한 CI/CD 도구의 관리 업무를 줄여 비즈니스에 집중하고 서비스 경쟁력을 높임 |\n| 사용 절차(학습정리) | 배포 타겟 인프라 생성(Kubernetes Cluster 등) → DevOps Service 신청 → Kubernetes Cluster 등록 → CI/CD 도구 준비(설치 등) → 프로젝트 그룹 생성 → 프로젝트 생성(CI/CD 도구 등록·설정 포함) → 배포 |\n\n출처: CloudNative2_DEVOPS1_DevOps_Tools 슬라이드 7-25, 32-33; WA백서 05 p.16(그림 5-3, Private Git), p.17-18(그림 5-5); WA백서 06 p.4(표 6-1)\n"}, "3-5a": {"title": "DBaaS vs 자체 구축 DB 관리 특성", "md": "## 한눈에 보기\n- **DBaaS(관리형 Database 서비스)**: 클라우드 사업자가 기반 서버 운영체제·보안·스토리지·네트워크를 관리하고, 사용자는 콘솔 옵션 선택만으로 DB·HA·백업을 구성한다.\n- **자체 구축 DB**: Virtual Server에 DB를 직접 설치하고 HA·Replica·네트워크·보안·백업을 모두 사용자가 구현하고 계속 운영한다.\n- SCP DBaaS의 생성·운영은 **Resource Provisioning → Service Configuration → Resource Management** 3단계로 이해한다.\n- DBaaS는 **서버 수를 늘리는 Scale-Out이 없고**, **Scale-Up(서버 타입 변경) + Replica(읽기 분산)** 로 성능을 확보한다.\n\n## 배경: DB 종류와 SCP가 제공하는 DBaaS\n| 구분 | 특징 | SCP 서비스 |\n|---|---|---|\n| RDB (OLTP) | 고정 스키마, 금융·전자상거래 등 복잡한 비즈니스 트랜잭션, 데이터 집계·복잡한 쿼리에 유리 | EPAS, MySQL, MariaDB, PostgreSQL, Microsoft SQL Server (관리형 Database 서비스) |\n| NoSQL | 동적 스키마, 대용량·낮은 지연, 노드 추가로 수평 확장. 단 테이블·엔티티 **조인 같은 복잡한 쿼리는 미지원** → 이 경우 RDB가 적합 | **CacheStore**(Redis 기반 in-memory) — DB 캐싱, 애플리케이션 상태 저장 |\n| OLAP (DW) | 컬럼 기반 + MPP 분석 | Vertica(DBaaS) → 3-7e |\n| 검색 | 짧은 지연·높은 처리량의 대량 검색 | Search Engine → 3-7c |\n\n- 교재(DB1)의 DB 종류 선택: **RDB = PostgreSQL 같은 관계형 DB**, **NoSQL = Redis 기반 CacheStore** → **실시간 응답**이 필요한 **캐시층**이나 **큐(Queue) 기반 서비스**에 적합.\n- 관계형 DB 최적화 고려 사항(WA04): 서버 타입 선정(컴퓨팅·메모리·스토리지·네트워킹), 스토리지 볼륨 구성, 엔진 선택, 스키마·인덱스·뷰 등 DB 옵션.\n\n## 관리형(DBaaS) vs 자체 구축 비교\nWA 가용성 백서의 MySQL 예시가 기준이다.\n\n| 관점 | 자체 구축 (Virtual Server + MySQL) | MySQL(DBaaS) |\n|---|---|---|\n| 서버 준비 | HA를 위해 **두 대 이상** 서버 생성, 운영체제 기본 패치 직접 수행 | 서비스가 서버 생성 |\n| HA/Replica | 각 서버에 MySQL 설치 후 **InnoDB Cluster**로 HA 또는 Replica 직접 구성 | **옵션 설정만으로** HA 구성 작업 자동화 |\n| 부가 작업 | 서버 간 네트워크 구성, 데이터 보호 보안 설정, 백업 구성을 **별도로** 수행 (모두 구현 단계) | 백업·HA·패치 기능이 내장 |\n| 운영 | 이후에도 **지속적인 관리 작업** 필요 | 운영 유연성 확보 |\n| 보안 관리 | OS 패치·보안 설정 모두 사용자 몫 | **플랫폼 영역 보안 관리(OS 패치, 보안 설정)를 서비스 제공자가 수행** → 사용자 부담 경감 |\n\n- 관리형 서비스 정의(WA01): 클라우드 사업자가 운영을 관리하는 인프라 위에서 제공되는 서비스. 사업자 관리 영역 = **기반 서버 운영체제 및 보안, 스토리지, 네트워크**. 사용자는 **Application 기능에만 집중**.\n- 설계 원칙(WA01): \"**Database 서비스를 사용하여 고가용성을 구현합니다.**\" / 보안성(WA02): 관리형 서버(대표 예: **Database 서비스**, Kubernetes Engine, Cloud Functions)를 선택하면 운영체제 패치·보안 설정 관리 부담 최소화.\n- 단, DBaaS라도 사용자가 정하는 것: 서버 타입, 네트워크(VPC·Subnet·Security Group), IP 접근 제어, 계정·비밀번호, 파라미터, 백업 주기, 유지관리 기간 등.\n\n## DBaaS 생성·운영 3단계\n| 단계 | 하는 일 |\n|---|---|\n| **A. Resource Provisioning** (자원 준비) | VPC·Subnet 구성, Security Group 생성, Virtual Server(Compute) 확보, Block / Object Storage 용량 설정, Planned Compute 계약, 네트워크 접근 정책 수립 |\n| **B. Service Configuration** (서비스 설정) | DB 유형·버전 선택, 네트워크 설정, 사용자 계정·인증 정보, 스토리지 설정, 고가용성 여부, 파라미터·시간대 설정 |\n| **C. Resource Management** (운영 관리) | 시작/중지/재시작/해지, 보안 설정(명령어 제한, IP 접근 제어), 백업/복구 및 주기 관리, 성능 튜닝(파라미터 조정, 리플리카 구성), 버전 업그레이드/마이그레이션, 고가용성 상태 점검 |\n\n> [!시험]\n> \"DB 유형·버전 선택, 계정·인증 정보 입력\"은 **Service Configuration**이다. Resource Management(C)가 아니다.\n> PostgreSQL(DBaaS) 생성 필수 자원 조합 = **네트워크(VPC, Subnet) + 컴퓨팅(Virtual Server) + 스토리지(Block Storage) + 보안(Security Group)**. KMS·Cloud WAN·LB·WAF, API Gateway·File Storage·Kubernetes Engine, GPU Server·Edge Server 조합은 오답.\n\n## 핵심 용어\n| 용어 | 뜻 |\n|---|---|\n| VPC | 데이터·리소스를 격리된 네트워크에서 운영하는 가상 네트워크. DB 서비스는 이 안에 배치 |\n| Subnet | VPC를 쪼갠 네트워크 영역. DB 인스턴스가 위치하는 구간 |\n| Security Group | 인바운드/아웃바운드 트래픽을 제어하는 방화벽 |\n| Virtual Server | DB가 설치·실행되는 컴퓨팅 자원(OS 포함 VM) |\n| Planned Compute | 사전에 예약(계약)한 컴퓨팅 자원 풀. SLA에 따라 고정 성능 보장 |\n| Block Storage | OS, 데이터 파일, 로그 파일 등이 저장되는 영구 디스크 |\n| Object Storage | 백업·아카이브 데이터를 저장하는 비정형 대용량 저장소 |\n| DB 버전(Image) | 엔진·버전 선택 (예: PostgreSQL Community 16.8, Redis OSS Sentinel 7.2.6, Valkey Sentinel 8.1.1) |\n| Redundancy / Sentinel | 이중화. **PostgreSQL = Redundancy**, **Redis = Sentinel** |\n| Read Replication | 읽기 요청을 복제 서버로 분산해 성능 향상 |\n| Parameter | DB 세부 동작 구성값(커넥션 수, 캐시 크기 등) |\n| Audit Log | DB 접속·쿼리 실행 이력 기록 (**PostgreSQL**) |\n| Rename-Command | **Redis** 명령어 이름을 바꿔 보안 강화 |\n| Backup / Recovery | 정기·수동 백업 데이터를 필요 시 복구 |\n| Lifecycle 관리 | 시작, 정지, 재시작, 삭제(해지) 등 운영 상태 제어 |\n| Tag | 리소스 구분, 비용 분석용 Key-Value 메타 정보 |\n\n## 확장(Scale) 특성\n| 방식 | DBaaS 지원 | 근거 |\n|---|---|---|\n| Scale-Up (서버 타입 변경) | O (PostgreSQL, CacheStore 모두) | DB1, WA01 |\n| Read Replica로 읽기 분산 | PostgreSQL O / CacheStore X | DB1 |\n| Scale-Out (노드 수평 추가) | **X** — Data Analytics, AI/ML 서비스에서 지원 | DB1 |\n| Parameter 변경 | 운영 중 변경 가능, **재시작해야 반영** | DB1 |\n\n- WA01: \"Database 서비스는 수요에 따라 **서버 수를 확장할 수는 없지만**, 서버 사양을 손쉽게 **수직 확장**할 수 있으며, **Replica를 통해 읽기 성능**도 향상시킬 수 있습니다.\"\n- WA01: 관계형 DB는 수평 확장이 불가능. DB 서비스는 이중화를 해도 **Active–Standby**이므로 수평 확장 불가 → 최대 용량을 고려한 **수직 확장**, **Replica나 캐싱**으로 읽기 부하 오프로드.\n- WA04: 관계형 DB는 수직 확장으로 처리량을 높이고, Replica로 **읽기 작업 수평 확장**도 가능. RDB 서비스는 서버 수평 확장이 불가하고 수직 확장에 한계가 있으므로 **CacheStore를 DB 전방에 배치**하거나 **Replica로 읽기 분산**하는 것이 효과적.\n\n## 운영 관점의 수치·조건\n| 항목 | 내용 | 출처 |\n|---|---|---|\n| 과금 | DBaaS = **Provisioning / Per Hour** (사용량·쿼리량 기반 아님) | WA06 표 |\n| 할인 요금제 | **Cost Savings**(1년/3년 시간당 사용 금액 약정), **Planned Compute**(1년/3년 인스턴스 타입 약정) 모두 **Database** 적용 대상 | WA06 표 6-2 |\n| 요금제 예시 | MySQL(DBaaS) `db2v4m32` HA(2) 상시 가동·수직 확장 가능성 → Cost Savings / Replica(1) 상시 가동·필요시 Replica 확장 → Cost Savings | WA06 표 6-3 |\n| BYOL | Database, Analytics 등에서 BYOL 지원 → 라이선싱 조건 확인 후 배포 검토 | WA06 |\n| 모니터링 | Cloud Monitoring 성능·로그 모니터링 대상: EPAS, PostgreSQL, MariaDB, MySQL, MS SQL, CacheStore | WA05 표 5-7 |\n| 기본 포트 | **2866** = SCP Database 서비스가 기본으로 사용하는 포트 (Security Group 예시) | WA02 |\n| SLA 장애 정의 | DBaaS: 가동 중인 **멀티 인스턴스 또는 개별 서비스가 모두** 외부 연결·접속을 **5분 이상** 확보하지 못하는 경우 | WA01 |\n| 월 가용률 | [1 - {장애 시간(분)합 / 서비스 이용 월 총 시간(분)의 합}] × 100 (시간 기반) | WA01 |\n| 최대 월 가용률 | Database(HA) **99.95%** (정지 시간 21.9분) | WA01 표 1-5 |\n\n> [!팁]\n> CacheStore처럼 Provisioning이 필요한 서비스는 임시 부하 대비 시 **사전에 배포 후 정지 상태로 준비**해 둔다(요청 기반 과금 서비스와 다름). (WA06)\n\n> [!시험]\n> - \"DBaaS도 OS 패치·보안 설정을 사용자가 직접 해야 하므로 보안 부담이 자체 구축과 같다\" → **틀림**. 플랫폼 영역 보안은 제공자가 수행.\n> - \"PostgreSQL(DBaaS)은 Scale-Out으로 쓰기 처리량을 늘린다\" → 틀림. Scale-Out은 Data Analytics·AI/ML.\n> - \"CacheStore는 Read Replication으로 읽기 분산\" → 틀림.\n> - \"Parameter 변경은 재시작 없이 즉시 반영\" → 틀림.\n> - \"DBaaS는 쿼리 용량(GB)당 과금\" → 틀림. **Provisioning·시간당**.\n> - 정답 문장 형태: \"서버 수는 늘릴 수 없지만 서버 타입 변경으로 수직 확장하고 Replica로 읽기 성능을 높인다.\"\n\n출처: DB1_Database_정리 1·2·3.C·7, WA백서 01 p.8·20-21·27·30·38, WA백서 02 p.10·33, WA백서 04 p.36-37·40, WA백서 05 p.27, WA백서 06 p.4·8-10·13"}, "3-5b": {"title": "DBaaS 기능 및 구성", "md": "## 한눈에 보기\n- SCP DBaaS 대표 엔진: **PostgreSQL(RDB)** 과 **CacheStore(NoSQL, Redis/Valkey)**. 생성은 A(자원 준비) → B(서비스 설정 4그룹: 이미지·버전 / 서비스 정보 / DB 구성 / 추가 정보) → C(운영)로 진행.\n- 시험 단골: **서버 타입(Standard/High Capacity)**, **스토리지 종류(SSD/SSD_KMS)**, **추가 스토리지(Temp/Archive/Backup)는 PostgreSQL만**, **Audit Log = PostgreSQL / Rename-Command = Redis**, **Sentinel Replica 1~2개 + Sentinel Port**.\n- 같은 강의 범위에 **Oracle Services**(OCI Database Migration, CDB/PDB, Data Guard)가 포함된다(마지막 절).\n\n## PostgreSQL(DBaaS) — RDB\n### A. Resource Provisioning (미리 준비할 자원)\n| 분류 | 자원 |\n|---|---|\n| 네트워크 | **VPC, Subnet, Security Group** |\n| 컴퓨트 | **Virtual Server** |\n| 스토리지 | **Block Storage**(데이터), **Object Storage**(백업) — **필수** |\n| 운영·관리 | Planned Compute, Cost Savings, Logging |\n\n### B. Service Configuration (콘솔 입력 항목)\n**① 이미지·버전**: 생성할 PostgreSQL 이미지와 버전 선택 (예: PostgreSQL Community 16.8)\n\n**② 서비스 정보**\n| 항목 | 내용 |\n|---|---|\n| 이름 | **서버명 접두어(prefix)**, **클러스터 이름** |\n| 서버 타입 | **Standard**(일반 용도) / **High Capacity**(고사양) |\n| Planned Compute | 계약된 컴퓨팅 자원 사용 |\n| Block Storage | **OS + Data** 기본, 필요 시 **Temp / Archive / Backup** 스토리지 추가 |\n| 스토리지 종류 | **SSD / SSD_KMS** (SSD_KMS = SCP **KMS 암호화키**로 추가 암호화한 볼륨) |\n| 네트워크 | 미리 만든 **VPC, Subnet, IP** 선택. **공통 설정 / 서버별 설정** 중 선택 |\n| Redundancy(HA) | 활성화 시 **Active / Standby** 인스턴스 자동 구성 |\n| IP 접근 제어 | 특정 IP나 IP 대역만 접근 허용 |\n| 유지관리 기간 | 이 시간 동안 **패치·점검** 수행 |\n\n**③ 데이터베이스 구성**\n| 항목 | 내용 |\n|---|---|\n| 접속 정보 | **DB 이름, 사용자 이름, 비밀번호, 포트** |\n| 지역화 | **문자 인코딩, 로케일, 시간대** |\n| Audit Log | SQL 실행 이력, 접속 기록 저장. **성능에 영향** → 필요할 때만 활성화 |\n| Parameter | PostgreSQL 동작 세부 조정 |\n| Backup | 백업 설정 (→ 3-5d) |\n\n**④ 추가 정보**: **Tag**(Key-Value) → 리소스 식별·분류\n\n입력한 항목들이 A단계에서 준비한 자원과 연결되어 PostgreSQL 인스턴스가 완성된다.\n\n### C. Resource Management (생성 후 운영)\n| 분류 | 기능 |\n|---|---|\n| Lifecycle | 시작 / 중지 / 재시작 / 해지 |\n| | **버전 업그레이드(Patch Upgrade)**: 보안 패치, 기능 개선 |\n| | **Migration**: 기존 DB에서 데이터를 복제해 **운영 중단 최소화**하며 이관 |\n| Backup & Restore | 정기 **Full Backup, Archive Backup**, **특정 시점 복구**, 백업은 **Object Storage** 저장, 이력은 콘솔에서 확인·삭제 (→ 3-5d) |\n| High Availability | Redundancy 활성화 시 HA **자동 적용**, Multi-AZ, VPC Peering 사전 구성 시 **Cross Region 복제(DR Replication)** (→ 3-5c) |\n| Performance | **Scale-Up**(서버 타입 변경), **Read Replication**(읽기 분산), **Parameter 조정**(운영 중 변경 가능, **재시작해야 반영**) |\n\n> [!팁]\n> **Scale-Out**(노드 수평 확장)은 PostgreSQL이 아니라 **Data Analytics, AI/ML 서비스**에서 지원한다.\n\n## CacheStore(DBaaS) — NoSQL (Redis / Valkey)\n**초고속 응답**이 필요한 환경용 인메모리 DB. 캐시층, 큐 기반 서비스에 적합. WA 백서는 빠른 DB 캐싱, 애플리케이션 상태 저장(상태 관리 DB) 용도로 권장한다.\n\n### A. Resource Provisioning\n| 분류 | 자원 |\n|---|---|\n| 네트워크 | VPC, Subnet, Security Group |\n| 컴퓨트 | Virtual Server |\n| 스토리지 | Block Storage(데이터), Object Storage(로그 보관·백업) |\n| 운영·관리 | Planned Compute(계약 요금 기반), Cost Savings |\n\n### B. Service Configuration\n**① 이미지·버전**: **Redis 또는 Valkey** 중 버전 선택 (예: Redis OSS Sentinel 7.2.6, Valkey Sentinel 8.1.1)\n\n**② 서비스 정보**\n| 항목 | 내용 |\n|---|---|\n| 이름 | 서버명 접두어, 클러스터 이름 |\n| 서버 타입 | CacheStore용 서버 타입 |\n| Planned Compute | 계약된 컴퓨팅 자원 사용 |\n| Block Storage | **OS 디스크 + 데이터 디스크**만 (**Temp/Archive/Backup 추가 스토리지 미제공**) |\n| 스토리지 종류 | SSD / SSD_KMS |\n| 네트워크 | VPC, Subnet, IP. 공통 설정 / 서버별 설정 (**공통 설정이면 IP 자동 할당**) |\n| Sentinel 이중화 | 고가용성 필요 시 선택, **Replica 개수 1개 또는 2개** |\n| Sentinel Port | 여기서 함께 지정 |\n| 유지관리 시간 | 정기 점검·패치 시간 예약 |\n\n**③ 데이터베이스 구성**: **비밀번호, 포트, 타임존**, Parameter(Redis/Valkey 동작 설정). **DB 이름, 사용자 이름, 인코딩, 로케일, Audit Log는 사용 안 함**(RDB 개념).\n\n**④ 추가 정보**: Tag — 리소스 식별, **비용 분석 필터링**\n\n### C. Resource Management\n| 분류 | 기능 |\n|---|---|\n| Lifecycle | 시작/중지/재시작/해지, **Rename-Command**(보안을 위해 명령어 이름 변경), Patch Upgrade |\n| Backup & Restore | **AOF 또는 RDB 파일** 기반 백업 → Object Storage, 백업 주기·보관 기간·이력 확인, 특정 시점 복구 |\n| High Availability | **Sentinel 기반 이중화**: 마스터 장애 시 **Replica 자동 승격**. Replica 1개 = Master + Replica + Sentinel, Replica 2개 = 각 서버에 Sentinel **자동 분산 배포**. Multi-AZ |\n| Performance | **Scale-Up**, Parameter 변경(운영 중 가능, **재시작해야 반영**) |\n\n> [!주의]\n> CacheStore **미제공**: **Migration, DR Replication, Read Replication**.\n\n## PostgreSQL vs CacheStore 비교\n| 항목 | PostgreSQL (RDB) | CacheStore (NoSQL) |\n|---|---|---|\n| 용도 | 일반 관계형 데이터 | 실시간 응답, 캐시층, 큐 |\n| 엔진 | PostgreSQL | **Redis / Valkey** |\n| 서버 타입 | Standard / High Capacity | CacheStore용 타입 |\n| 추가 스토리지(Temp/Archive/Backup) | O | X |\n| 스토리지 종류 | SSD / SSD_KMS | SSD / SSD_KMS |\n| 이중화 | **Redundancy**(Active/Standby) | **Sentinel**(Replica 1~2개) |\n| 추가 설정 | – | **Sentinel Port, Replica count** |\n| DB 이름·사용자명 | O | X |\n| 인코딩·로케일 | O | X |\n| 비밀번호·포트·타임존 | O | O |\n| Audit Log | O | X |\n| Rename-Command | – | O |\n| 백업 | Full / Archive Backup | AOF / RDB 파일 |\n| Migration | O | X |\n| DR Replication | O (VPC Peering 사전 구성 시 Cross Region) | X |\n| Read Replication | O | X |\n| Scale-Up | O | O |\n| 파라미터 변경 | 운영 중 가능, 재시작 시 반영 | 운영 중 가능, 재시작 시 반영 |\n\n## 보안 관련 설정 정리\n| 요구사항 | 설정 |\n|---|---|\n| SQL 실행 이력·접속 기록 보관 (PostgreSQL) | **Audit Log** 활성화 (성능 영향 주의) |\n| 위험 명령어 실행 방지 (Redis) | **Rename-Command** |\n| 특정 IP 대역만 접근 | **IP 접근 제어** |\n| DB 볼륨 추가 암호화 | 스토리지 종류 **SSD_KMS** (HDD·HDD_KMS 옵션은 없음) |\n| 네트워크 접근 통제 | Security Group. SCP Database 서비스 기본 포트 **2866** (WA02 예시) |\n\n> [!시험]\n> - \"CacheStore 생성 시 Audit Log 활성화\" → 틀림(Audit Log는 PostgreSQL).\n> - CacheStore 생성 시 **필요 없는** 항목 = **DB 이름·문자 인코딩**. 비밀번호·포트, OS·데이터 디스크, 유지관리 시간은 필요.\n> - CacheStore 엔진은 Redis **또는 Valkey**. \"Redis만\" → 틀림.\n> - CacheStore 네트워크 공통 설정 → **IP 자동 할당**.\n\n## Oracle Services (OCI)\n### OCI Database Migration\n- 온프레미스나 다른 클라우드의 DB를 OCI의 고성능 셀프서비스 환경으로 옮기는 **완전관리형(Fully-managed)** 서비스. **GUI 콘솔 또는 API**로 사용자가 직접 수행.\n- 운영 중 시스템에 **부담을 주지 않도록** 설계. **동종(Homogeneous) 마이그레이션**: Oracle → Oracle, MySQL → MySQL.\n- **멀티테넌트**: 사용자 테넌시와 **분리된 마이그레이션 전용 클라우드 자원** 사용(사용자 리소스와 직접 결합 X).\n\n| 중앙 컴포넌트 | 역할 |\n|---|---|\n| **OCI Database Migration 엔진** | 전체 흐름을 자동화·관리하는 **컨트롤 타워**. 작업 정의·실행, 콘솔/API로 **실시간 상태 모니터링** |\n| **Cloud Premigration Advisor Tool** | 시작 전 **사전 점검**. 소스 DB 구조 분석, **호환성 문제·예상 오류 탐지** |\n\n| 구분 | Online | Offline |\n|---|---|---|\n| 기술 | **Oracle GoldenGate**(실시간 이중화) | **Data Pump** |\n| 동작 | 변경 사항 실시간 캡처 → 타깃 즉시 반영 (**CDC**) | Data Pump 추출 → **중간 저장소 또는 DB Link**로 전송 → Data Pump 임포트 |\n| 서비스 중단 | **없음** | **일시 중단 필요** |\n| 적합 환경 | **24시간 서비스** | DB를 잠시 멈출 수 있을 때 |\n| 장점 | 무중단 | **구성이 간단** |\n\n- Source: 온프레미스 Oracle, 타 클라우드 Oracle, OCI 내부(Oracle Base / Exadata).\n- Target: **Autonomous Database, Exadata Database Service, Oracle Base Database Service, Exadata Cloud@Customer**, 멀티 클라우드 환경.\n- CDC(Change Data Capture): 소스에서 **바뀐 데이터만** 계속 잡아 타깃에 반영.\n\n### CDB & PDB (멀티테넌트 아키텍처)\n- **CDB ⊃ PDB**: 논리적으로 독립, 물리적으로 자원·인프라 공유 (비유: CDB = 아파트 건물, PDB = 각 세대).\n| 구분 | CDB (Container Database) | PDB (Pluggable Database) |\n|---|---|---|\n| 정의 | 하나 이상의 PDB를 포함. 공통 시스템 DB + 사용자 DB, 여러 PDB 호스팅 | CDB 안의 독립 DB. 자체 **스키마, DB 객체, 사용자** |\n| 물리 구조 | 모든 PDB 데이터 파일 + CDB 자체 메타데이터 시스템 파일 | 각 PDB가 **자체 데이터 파일** 소유 |\n| 장점 | 통합 관리·자원 절약, PDB 간 데이터 이동 용이, 업그레이드·패치 간소화 | 통합 관리·자원 절약, 관리 효율 향상. 애플리케이션은 독립 DB로 인식(이동 가능한 단위) |\n| 사용 사례 | 여러 PDB를 하나의 인스턴스에서 관리 | 여러 애플리케이션을 하나의 인스턴스에서 분리 관리 |\n\n- **버전 종속**: PDB는 항상 **CDB의 Oracle 버전에 종속**(19c CDB에는 19c 호환 PDB만). CDB 업그레이드 시 연결된 **모든 PDB가 영향**.\n- 안전한 패치·업그레이드 전략:\n1. 새 버전 CDB 생성\n2. 기존 PDB를 **Clone**해 새 CDB에 연결 → 테스트\n3. 문제 없으면 기존 CDB에서 PDB **Detach**\n4. 새 CDB에 **Attach** → 무중단 또는 최소 중단 업그레이드\n- 활용: 서비스 이중화, 개발·운영 분리, 장애 대응, 클라우드 전환. 예: 회계 PDB만 테스트용 CDB로 옮겨 보안 패치 검증.\n\n### Data Guard (PDB 단위 이중화)\n- 소스 PDB 변경 사항을 **실시간 또는 지연 방식**으로 타깃 PDB에 지속 복제. 장애 시 Standby PDB로 **자동 또는 수동 전환**.\n| 기능 | 내용 |\n|---|---|\n| 데이터 보호 | 보조 DB에 실시간 복제 → 데이터 손실 방지 |\n| 고가용성 | 주 DB 장애 시 보조 DB가 자동으로 주 DB 역할 |\n| 재해 복구 | 빠른 복구로 비즈니스 연속성 |\n- 추가 활용: 대기 PDB를 **테스트·리포트**, 운영 영향 없는 **백업**에 사용. Data Guard로 묶이지 않은 PDB는 **Unprotected**.\n- 사용 사례: 금융·공공기관(몇 초 중단도 치명적), 온라인 쇼핑몰.\n\n> [!시험]\n> - Online = **GoldenGate**(CDC). Data Pump·DB Link = Offline. **RMAN** = Oracle 백업·복구 도구(마이그레이션 방식 아님).\n> - \"PDB는 Oracle 버전에 상관없이 어떤 CDB에도 연결 가능\" → 틀림.\n> - 업그레이드 전략 키워드: 새 CDB → PDB Clone 테스트 → Detach / Attach.\n\n출처: DB1_Database_정리 1-7, DB2_Oracle_Services_정리 1-5, WA백서 01 p.15, WA백서 02 p.33, WA백서 04 p.37"}, "3-5c": {"title": "DBaaS HA · Read Replica · DR", "md": "## 한눈에 보기\n| 목적 | PostgreSQL(DBaaS) | CacheStore(DBaaS) |\n|---|---|---|\n| 고가용성(HA) | **Redundancy** → Active/Standby 자동 구성, 장애 시 자동 전환 | **Sentinel** → Replica 1~2개, 마스터 장애 시 Replica **자동 승격** |\n| 읽기 확장 | **Read Replication** | 미제공 |\n| DR | VPC Peering 사전 구성 시 **Cross Region 복제(DR Replication)** | 미제공 |\n| Multi-AZ | 교재상 지원 | 교재상 지원 |\n\n- HA(장애 대비)와 Read Replica(읽기 분산)는 **목적이 다르다**. Read Replica는 자동 Failover 대상이 아니다.\n\n## HA 구성\n### PostgreSQL — Redundancy\n- 생성 시 서비스 정보의 **Redundancy(HA)** 를 활성화하면 **Active / Standby** 인스턴스가 자동 구성되고, HA 기능이 **자동 적용**되어 장애가 나도 서비스를 유지한다.\n- WA01: DB 서비스는 이중화해도 **Active–Standby**이므로 수평 확장(쓰기 처리량 증대)은 안 된다.\n\n### CacheStore — Sentinel\n| Replica 개수 | 구조 |\n|---|---|\n| 1개 | **Master + Replica + Sentinel** |\n| 2개 | 각 서버에 Sentinel **자동 분산 배포** |\n- 생성 시 **Sentinel 이중화** 선택 + **Replica 개수(1 또는 2)** + **Sentinel Port** 지정.\n- 마스터 장애 → **Replica 자동 승격** → 서비스 무중단.\n\n### WA 백서의 HA 테스트·가용률\n| 항목 | 값 |\n|---|---|\n| Database(HA) 최대 월 가용률 | **99.95%** (정지 시간 21.9분) |\n| Active DB 정지 후 Standby DB로 전환 (장애 탐지 및 조치 테스트) | **수초 ~ 수분** |\n| 99% 목표 아키텍처 | Web·App·DB 모두 단일. DB는 Database 서비스 백업 기능으로 사본 저장 |\n| 99.9% 목표 아키텍처 | DB를 Database 서비스 고가용성으로 배포 → **Active-Standby** |\n| 99.99% 목표 아키텍처 | Multi-AZ + Auto-Scaling, **DB 읽기 부하 오프로드를 위해 Replica 추가** |\n| 부하 테스트 (Database) | 99%·99.9%: Database 서버 타입 변경 **작업 당 최대 15분** / 99.99%: Database 서버 타입 변경, **읽기 부하에 따라 Replica 추가 생성** — **최소 5분** |\n\n- 설계 원칙(WA01): \"Database 서비스의 **고가용성(HA) 및 복제(Replica)** 를 통해 데이터베이스를 중복 구성합니다.\"\n\n> [!주의]\n> 교재(DB1)는 PostgreSQL·CacheStore 모두 **Multi-AZ** 구성을 운영 기능으로 소개한다. 반면 WA 가용성 백서는 \"2025년 7월 기준 SCP v1은 Multi-AZ를 제공, **v2는 Single-AZ Region(KR-WEST1, KR-EAST1)만 제공**, v2에서도 Multi-AZ 기능이 **제공될 예정**\"이라고 적고 있다(WA01 p.32). WA03도 \"Multi-AZ ... 향후 출시 예정('26년)\"으로 표기. 시점에 따라 다르므로 단정하지 말 것.\n\n## Read Replica\n- 읽기 전용 요청을 복제 서버로 분산해 성능을 높인다(PostgreSQL **Read Replication**).\n- WA04: RDB는 Replica를 통해 **읽기 작업 수평 확장** 가능. DB 계층 캐싱 구현 = **CacheStore 데이터 캐싱 + Replica 구성을 통한 읽기 부하 오프로드**.\n- WA01(99.99% 시나리오): \"데이터베이스의 읽기 부하는 **사전에 Replica에서 수행하도록 구성**합니다. 부하 테스트 시 단계별로 DB **지연 속도를 측정**하고, 테스트 사후에 적절한 용량으로 **서버 타입을 조정**합니다.\"\n- WA06 요금제 예시: MySQL(DBaaS) Replica(1), 상시 가동·필요시 Replica 확장 → **Cost Savings**.\n\n| 상황 | 적절한 대응 |\n|---|---|\n| 조회 트래픽 급증, 쓰기는 그대로 | **Read Replica 추가** + 부하 테스트로 지연 측정 후 서버 타입 조정 |\n| 쓰기·전체 처리량 부족 | **Scale-Up**(서버 타입 변경) — Scale-Out은 불가 |\n| 반복 조회 결과 캐시 | CacheStore를 DB 전방에 배치 (CacheStore 자체의 Read Replication은 없음) |\n| 장애 시 자동 전환 | **HA(Redundancy / Sentinel)** — Read Replica가 아님 |\n\n> [!시험]\n> - \"Read Replica는 원본 DB 장애 시 자동으로 Active로 승격되어 HA를 대신한다\" → 틀림.\n> - \"Audit Log를 활성화해 조회 성능 개선\" → 틀림(Audit Log는 오히려 성능에 영향).\n> - \"CacheStore의 Read Replication으로 읽기 분산\" → 틀림.\n\n## DR (재해 복구)\n### 교재: PostgreSQL DR Replication\n- **VPC Peering** 등 네트워크 자원을 미리 구성하면 **Cross Region 복제(DR Replication)** 지원. CacheStore는 DR Replication 미제공.\n\n### WA 안정성 백서: Database 서비스 DR\n- 주 사이트 **마스터 DB의 Replica를 DR 사이트에 생성**해 구성. 주 사이트 변경 사항이 Replica와 동기화되어 반영.\n- 전제: 주 사이트 VPC와 DR 사이트 VPC 간 **Peering 수립**.\n- 재해 발생 시 DR 사이트의 Replica를 **수동으로 Master로 전환**해 가동.\n- Hot Level 아키텍처에서 DBaaS: **타 Region Replica로 비동기 복제**, 재해 시 DR Replica를 **Master로 승격**해 주 DB로 사용.\n\n> [!주의]\n> WA03은 \"**Region 간 DBaaS Replication 기능은 향후 출시 예정('26년)**\", \"Region 간 VPC Peering, Object Storage Replication, DBaaS Replica 기능은 향후 출시 예정('26년)\"으로 표기한다(WA03 p.24·28). 교재(DB1)는 Cross Region DR Replication을 현재 기능처럼 설명한다. 출제 시 \"VPC Peering 사전 구성 필요\", \"수동 Master 전환\"이 핵심이고, 제공 시점은 단정하지 말 것.\n\n### RTO/RPO에 따른 DR 수준 (WA03 표 3-11)\n| DR 수준 | RTO | RPO | 가용성(Main↔DR) | 복구 | 비용 | 대상 |\n|---|---|---|---|---|---|---|\n| Cold Level | 수주 | 수일 | Active-Backup | 자원할당 및 백업 복구 | 낮음 | 비 중요 시스템 |\n| Warm Level | 수일 | 수 시간 | Active-Replica | 수동 Failover, 자원 할당 및 증설 | 중간 | 일반시스템 |\n| Hot Level | 수 시간 | 0 | Active-Standby | **수동 Failover** | 높음 | 중요시스템 |\n\n- Cold: 핵심 서비스 백업 데이터만 DR 센터에 보관, 재해 시 **DR 센터에 신규로 자원 할당·구성** → 오래 걸림. 초기·유지 비용 최저, 백업 주기에 따른 데이터 손실 가능성 큼.\n- Warm: 중요도 높은 시스템 중심으로 DR 구축, 실시간 복제가 아니라 **주기적 동기화**. 재해 시 나머지 자원 할당·증설 후 복구 → 데이터 손실 가능.\n- Hot: **실시간 복제 기반 Active-Standby**. 재해 시 복제 중단 후 DR 센터로 운영 전환.\n\n> [!시험]\n> \"Hot Level은 자동 Failover로 RTO 수 분 이내\" → 틀림. 표상 Hot Level 복구는 **수동 Failover**, RTO **수 시간**.\n\n## 참고: Oracle Data Guard\n- Oracle PDB 단위 이중화: 소스 PDB → 타깃 PDB로 **실시간 또는 지연** 복제, 장애 시 Standby PDB로 **자동 또는 수동 전환**. 데이터 보호·고가용성·재해 복구 제공, 대기 PDB는 테스트·리포트·백업에 활용 (상세는 3-5b).\n\n출처: DB1_Database_정리 3.B·3.C·4.B·4.C·5·7, DB2_Oracle_Services_정리 3, WA백서 01 p.30·32·38-43, WA백서 03 p.18·21-24·27-28, WA백서 04 p.37·40, WA백서 06 p.9"}, "3-5d": {"title": "DBaaS 백업 및 복구", "md": "## 한눈에 보기\n- DBaaS 백업은 별도 Backup 서비스가 아니라 **Database 서비스의 내장 기능**이다.\n- 백업본 저장소는 **사용자가 직접 만든 Object Storage 버킷**(PostgreSQL 생성 시 Object Storage는 필수 자원).\n- 복구는 기존 서버에 덮어쓰지 않고 **백업본으로 새 DB를 생성 → Master로 전환**한다.\n\n## 엔진별 백업 방식 (교재)\n| 항목 | PostgreSQL(DBaaS) | CacheStore(DBaaS) |\n|---|---|---|\n| 백업 종류 | 정기적인 **Full Backup, Archive Backup** | **AOF 또는 RDB 파일** 기반 |\n| 저장 위치 | 미리 구성한 **Object Storage** | **Object Storage** |\n| 콘솔 관리 | 백업 이력 **확인·삭제** | 백업 주기, 보관 기간, 백업 이력 확인 |\n| 복구 | **특정 시점 복구**(Recovery) | 필요 시 **특정 시점 복구** |\n| 추가 스토리지 | Temp / Archive / **Backup** 스토리지 추가 가능 | 추가 스토리지 미제공 |\n\n### Redis 백업 파일: AOF vs RDB\n| 방식 | 동작 |\n|---|---|\n| **RDB** | 특정 시점 메모리 전체를 **스냅샷** 파일로 저장 |\n| **AOF**(Append Only File) | 들어온 **쓰기 명령을 로그로 계속 기록** |\n\n> [!시험]\n> AOF와 RDB의 설명을 **서로 바꿔** 놓는 오답이 자주 나온다. 스냅샷 = RDB, 쓰기 명령 로그 = AOF.\n\n## SCP 서비스별 백업 방식 비교 (WA03 표 3-8)\n| 대상 서비스 | 백업 기능 | 백업 방식 | 백업 스케줄 | 보존 기간 | 저장소 |\n|---|---|---|---|---|---|\n| Virtual Server | Backup 서비스 | VM 스냅샷 전체 또는 증분 백업 | 일/주/월 | 2주~1년 | SCP 관리 저장소 |\n| Bare Metal Server | Backup 서비스 | 파일 시스템 에이전트 백업 | 일/주/월 | 2주~1년 | SCP 관리 저장소 |\n| **DBaaS** | **내장 기능** | **DB 기반 백업** | **데이터: 1일 / 아카이브: 5분~1시간** | **7일~35일** | **사용자 관리 Object Storage** |\n| File Storage | 내장 기능 | 스냅샷 | 일/주 | 자동 128개 / 수동 800개 | File Storage 내부 |\n| Object Storage | 내장 기능 | 버전 관리 | 변경 발생 즉시 | 제약 없음 | 버킷 내부 |\n\n- 설계 원칙(WA03): \"Database 서비스의 **내장 백업 기능**을 통해 데이터베이스를 백업합니다.\"\n- 데이터베이스 백업은 **데이터 백업과 아카이브 백업을 모두** 수행한다.\n- RPO 설계 시 RPO를 고려해 저장소를 고르거나, 저장소의 백업 스케줄을 고려해 RPO를 검토한다. DBaaS는 아카이브 백업 주기(5분~1시간)가 RPO에 영향을 준다(일반 개념).\n\n> [!시험]\n> \"DBaaS 백업본 보존 기간 2주~1년, SCP 관리 저장소\" → 틀림. 그것은 **Virtual Server·Bare Metal Server용 Backup 서비스** 기준. DBaaS = **7일~35일, 사용자 관리 Object Storage**.\n\n## 복구 절차 (WA03 데이터베이스 백업 아키텍처)\n1. 백업본 저장소로 사용할 **Object Storage 버킷을 사용자가 직접 생성**해 지정한다.\n2. 복구 시 **기존 서버에 직접 백업본을 복구하지 않는다**.\n3. **백업본으로 새로운 데이터베이스를 생성**한다.\n4. 생성한 데이터베이스를 **Master 데이터베이스로 전환**한다.\n\n- 교재: 특정 시점 복구 가능, 백업 이력은 콘솔에서 확인·삭제 가능.\n\n### 가용성 테스트에서의 복원력 테스트 (WA01)\n| 테스트 | 항목 | 예상 시간 |\n|---|---|---|\n| 복원력 테스트 | Backup에서 Virtual Server 복원 / **신규 Database 생성 / Backup에서 Database 복구 / 백업 이후 장애시점까지 데이터 변경분 반영** | **최대 60분** |\n| 장애 대응 테스트(99% 목표) | Backup에서 Virtual Server 복원, NAT IP 전환 | 최대 20분 |\n| 부하 테스트 | Database 서버 타입 변경 | 작업 당 최대 15분 (99.99%는 최소 5분) |\n- 99% 목표 아키텍처의 단계별 복구 예상 시간은 **최대 90분**. CLI 스크립트와 테스트 환경을 쓰면 단축 가능. 가장 불확실한 구간은 장애 발생 → 탐지 → 관리자 통지 → 복구 개시까지의 시간.\n- 99% 목표 아키텍처에서 DB는 단일 구성이며 **Database 서비스의 백업 기능**으로 사본을 저장한다.\n\n## 백업 운영 고려 사항 (WA03)\n- **업무 영향 최소화**: 일 단위 백업은 업무 종료 후 ~ 다음 날 업무 개시 전, 주 단위는 주말에 수행.\n- **복구 시 유효성**: 배치 작업 전/후 등 백업 시점에 따라 복구 시 추가 작업 여부와 완전 복구 소요 시간이 달라진다.\n- **백업 검증**: 백업 원본·복제본을 확인해 자동 백업 정상 수행 및 유효성 검증 → 복구 테스트 환경 구성·복구 훈련 → RTO/RPO 미충족 시 개선.\n- **백업 사본 보호**: Object Storage 버킷을 Archive Storage로 아카이빙(장기 보존), Multi-AZ·DR 복제, 접근 제어(접근 서버·IP·엔드포인트 지정)와 암호화로 무결성 확보.\n\n> [!주의]\n> 백업 사본 보호용 \"Multi-AZ 및 Object Storage Region 간 Replication은 **향후 출시 예정('26년)**\"으로 WA03에 표기되어 있다.\n\n## Oracle 쪽 용어 (오답 보기용)\n- **RMAN** = Oracle 백업·복구 도구. OCI Database Migration의 Online 방식(GoldenGate)·Offline 방식(Data Pump, DB Link)과 구분.\n- Data Guard의 대기 PDB는 운영 데이터에 영향 없이 **백업** 수행에 활용 가능.\n\n> [!시험]\n> - \"백업본을 기존 운영 DB 서버에 직접 덮어써서 복구\" → 틀림.\n> - \"가장 최근 Full Backup 시점으로만 복구 가능\" → 틀림(특정 시점 복구 지원).\n> - \"백업 이력은 조회만 가능하고 삭제 불가\" → 틀림(PostgreSQL은 확인·삭제).\n> - \"복원력 테스트 최소 5분 목표\" → 틀림(최대 60분).\n\n출처: DB1_Database_정리 3.A·3.C·4.C·7, DB2_Oracle_Services_정리 3·4, WA백서 01 p.38-43, WA백서 03 p.13·15·18·20"}, "3-6a": {"title": "API Gateway", "md": "## 한눈에 보기\n- **API**: 클라이언트와 백엔드 시스템 간 데이터를 주고받기 위한 인터페이스.\n- **API Gateway**: 다양한 API 요청을 한 곳에서 받아 **인증/제어/라우팅/로깅**을 수행한 뒤 적절한 백엔드로 전달하는 **중앙 통제 지점**.\n- SCP API Gateway = API를 손쉽게 **생성, 관리, 모니터링**하는 **완전 관리형** 서비스. 과금은 **Pay-as-you-go / Per Call**.\n- 구현 순서: **API 생성 → 리소스 생성 → 메서드 생성 → API 배포(스테이지) → 스테이지 상세에서 CORS·JWT·IP Restriction 설정**.\n\n## 배경: 왜 API Gateway인가\n애플리케이션 통합 설계 시 흔한 질문:\n- 점점 복잡해지는 애플리케이션 간 통신을 쉽게 관리할 수 없을까?\n- 백엔드 서버 업그레이드나 아키텍처 변경과 상관없이 앱을 개발할 수 없을까?\n\nAPI Gateway가 없을 때의 문제:\n| 문제 | 설명 |\n|---|---|\n| Too many APIs | Order, Payment 등 API가 너무 많음 |\n| Authentication / Security? | 인증·보안을 어디서 할지 |\n| Routing / Traffic control? | 라우팅·트래픽 제어를 어디서 할지 |\n| No centralized monitoring | 중앙 모니터링 없음 |\n→ Client(User) – API Request/Response – **API Gateway** – Backend 구조로 해결.\n\n## SCP API Gateway 특징\n| 특징 | 내용 |\n|---|---|\n| 완전 관리형 서비스 | 서버 설정·관리 없이 API 생성과 관리를 간단히 수행 |\n| 확장성 및 비용 효율성 | **수십만 건의 동시 요청** 처리, **사용량 기반 요금** |\n| 강력한 보안 | **JWT 토큰, IP 접근제어, API Key** 등 다양한 보안 액세스 적용 |\n\n> [!주의]\n> **API Key는 '25년 12월 제공 예정**으로 교재에 표기되어 있다. 현재 기능으로 단정하지 말 것.\n\n## 구성요소 8가지\n| 구성요소 | 설명 |\n|---|---|\n| **API** | 리소스와 메서드의 집합, 실제 서비스의 논리적 인터페이스 |\n| **리소스** | API 내 특정 엔드포인트(**URI 경로**) 단위 (예: /users, /orders) |\n| **메서드** | 리소스에서 수행할 HTTP 동작 (GET, POST, PUT, DELETE 등) |\n| **스테이지** | API 배포의 특정 환경 (**dev / test / prod**) |\n| **JWT**(JSON Web Token) | 인증 및 권한 부여용 **토큰 기반 웹 표준** |\n| **엔드포인트** | 클라이언트가 API에 접근할 때 사용하는 **고유 URL** |\n| **통합** | API 메서드와 백엔드 서비스(Function, DB, SCP 서비스 등) 간 **연결 방식** 정의 |\n| **CORS** | 서로 다른 출처의 서버 간 리소스 접근을 허용하는 **웹 표준 보안 정책** |\n\n## 동작 방식\n- 요청이 들어오면 각 요청을 처리할 서버를 **URL 패턴**(리소스)에 따라 백엔드로 전달. 중요한 서비스는 **인증**을 거쳐 안전하게 처리.\n| 요청 URL | 백엔드 |\n|---|---|\n| example.com/signup | **Virtual Server** |\n| example.com/login | **Kubernetes Engine** |\n| example.com/logout | **Cloud Functions** |\n- Mobile client → (HTTP/HTTPS) → API Gateway(인증 모듈 연동, GET/POST/PUT/DELETE) → URL Pattern별 백엔드.\n\n## 콘솔 구현 절차 (번호는 교재 화면 번호)\n1. **API 생성** (API Gateway > API 목록 > API 생성): ① API명 입력, ② 생성 방법 선택 — **새로 생성**(API를 새로 생성해 추가) / **기존 API 복제**(이미 생성된 API 중 선택)\n2. **리소스 생성** (API Gateway > 리소스 생성): ③ 리소스명 입력, ④ 리소스 메뉴 트리에서 경로 선택\n3. **메서드 생성** (API Gateway > 리소스 > 메서드 생성): ⑤ 메서드 유형, ⑥ 통합 유형, ⑦ URL 쿼리 문자열 파라미터 이름, ⑧ HTTP 요청 헤더 이름\n4. **API 배포(스테이지 생성)** (API Gateway > 리소스 > API 배포): ⑨ 스테이지명 선택 — **New Stage**면 신규 스테이지명 입력\n5. **보안 설정** (API Gateway > 스테이지 > 스테이지 목록 > 스테이지 상세 > 수정): ⑩ CORS, ⑪ JWT 활성화 여부, ⑫ IP Restriction 활성화 여부\n\n> [!시험]\n> CORS·JWT·IP Restriction은 **스테이지 단위** 설정이므로 **배포로 스테이지가 생긴 뒤** 스테이지 상세 수정에서 한다. 순서: API → 리소스 → 메서드 → 배포 → 보안 설정.\n\n### 리소스명 규칙\n- **영문 소문자로 시작**, 소문자·숫자·특수문자 **(-{})** 사용, **3~50자**.\n- 중괄호는 **{문자}** 형식만 허용, 비워둘 수 없음. 예: `{users}`\n\n### 메서드 유형\n| 유형 | 의미 |\n|---|---|\n| Any | 모든 종류의 메서드 생성 |\n| GET | 리소스 조회(읽기) |\n| POST | 리소스 생성(등록) |\n| PUT | 리소스 **전체** 수정(갱신) |\n| PATCH | 리소스 **일부만** 부분 수정 |\n| DELETE | 리소스 삭제 |\n| OPTIONS | 해당 엔드포인트가 **지원하는 HTTP 메서드 목록** 조회 |\n| HEAD | **본문 없이 헤더만** 조회(응답 바디 없이 메타데이터만 반환) |\n\n### 통합 유형\n| 통합 유형 | 입력 |\n|---|---|\n| **HTTP** | 엔드포인트 **URL 입력** (https://~) |\n| **Cloud Function** | 엔드포인트 **선택** |\n\n### CORS 응답 헤더\n| 헤더 | 의미 |\n|---|---|\n| Access-Control-Allow-Methods | 서버가 해당 리소스에 대해 허용하는 **HTTP 메서드** 명시 |\n| Access-Control-Allow-Headers | 실제 요청 시 사용할 수 있도록 서버가 허용하는 **HTTP 요청 헤더 목록** 명시 |\n| Access-Control-Allow-Origin | 특정 **출처(origin)** 에서의 리소스 접근 허용 여부 명시 |\n\n### API 호출 데모\n'dev' 스테이지로 배포된 API를 호출하면 통합된 Cloud Function이 실행되어 응답한다.\n```\nexports.handleRequest = async function (params) {\n  const response = {\n    statusCode: 200,\n    body: JSON.stringify('Hello from Samsung SDS!'),\n  };\n  return response;\n};\n```\n\n## 아키텍처 속 API Gateway (WA 백서)\n- **Serverless 아키텍처**(WA01 그림 1-2): 모바일 사진 관리 서비스의 Authentication, Search, Register, Thumbnail, Delete를 Cloud Functions 독립 함수로 분리, 요청은 **API Gateway를 통해 함수로 전달**. 하나를 수정해도 다른 기능에 영향 없음.\n- **Microservice 아키텍처**(WA01): Load Balancer를 통해 VM/Container 워크로드 및 API Gateway로 요청 전달. API 요청 외 요청은 Kubernetes Engine ingress로. **API Gateway는 최전방에서 모든 API 호출의 인증 및 서비스 라우팅** 수행. 도입 시 **서비스 규약을 중앙에서 관리·배포**, 과도한 요청을 일정 수준에서 **제한(Throttling)**.\n- **임시 부하 처리**(WA06 그림 6-4): 이벤트성 급증 부하를 **API Gateway로 요청 분배** → Object Storage(Web 자산), Cloud Functions(재고 확인·주문 처리), CacheStore(임시 저장) 구성. 요청 기반 과금 서비스라 사전 배포 가능.\n\n## 수치·운영 표\n| 항목 | 값 |\n|---|---|\n| 과금 | **Pay-as-you-go / Per C
