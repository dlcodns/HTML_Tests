이 별도로 있습니다. 장애 정의는 \"가동 중인 고객의 인스턴스 또는 개별 서비스가 **모두 CMP 접속을 확보하지 못하는 경우**\"이며, 월 가용률은 [1 - {장애 시간(분) 합 / 서비스 이용 월 총 시간(분) 합}] × 100, 장애 시간은 회사(SDS) 사유로 해당 월에 발생한 장애 시간의 합입니다.\n- 일반 서비스(공통)의 장애 정의가 \"외부 연결 및 접속\"인 것과 달리 **CMP(관리 플랫폼) 접속**이 기준이라는 점이 특징입니다.\n\n## Edge Server: 고객 On-Site 전용 Edge Cloud\n\n### 정의와 제공 기능\n\n데이터 보안, 규제, 성능, 지연 시간 등의 이슈로 **클라우드 전환이 어려운 기업의 On-Site 환경에 Edge Cloud를 제공**하는 서비스입니다(서비스 카테고리 **Hybrid Cloud**).\n\n| 제공 기능 | 내용 |\n|---|---|\n| Hybrid Cloud 확장 | 중요 데이터는 On-Site에서, Public Cloud는 Analytics, IoT, Private 5G, AI 등 활용 |\n| 편리한 통합 관리 | **SCP Console**로 Edge Server 통합 관리 |\n| 높은 보안성·규정 준수 | 보안이 요구되는 데이터, 규제가 엄격한 워크로드는 엣지 사용 |\n| 고객 맞춤형 서비스 | 환경에 따라 가상화 플랫폼(**KVM, Container** 등) 제공, 가상화(CPU/GPU) |\n\n### 구성 요소\n\n| 구성 요소 | 위치·역할 |\n|---|---|\n| Edge Manager | **SCP에 위치**, Edge Client를 통해 고객 사이트에 설치된 Edge Server 관리 |\n| Edge Client | **고객 사이트 Edge Server에 위치**, Edge Manager를 통해 KVM 관리 |\n| 네트워크 | Edge Server와 SCP 간은 **VPN 또는 전용회선**(IPsec Tunnel, Dedicated Line, Direct Connect) |\n\n### 신청 절차(Hybrid Cloud > Edge Server 서비스 요청)\n\n1. 제목 입력\n2. 리전 선택\n3. 서비스 선택(자동): 카테고리 Hybrid Cloud, 서비스 Edge Server\n4. 작업 구분: \"Edge Server 서비스 생성\"\n5. 기본정보: 어카운트 ID, 고객 성명·소속·연락처, 서비스 개시 희망 일자, **호스트 서버 OS**(예: RHEL, Ubuntu, Rocky), **배송지 주소**, 고객 담당자\n6. 신청정보: 사용 목적(제조·의료·물류, 드론·로봇·CCTV·영상분석 등), 서버 Type·수량(예: 일반형 128vCore/512GB/7.6TB, 대용량 128vCore/512GB/SSD 7.6TB + HDD 160TB, GPU_L40s 128vCore/512GB/7.6TB/L40s×2), **사용 기간(기본 3년)**\n7. 필요 시 첨부파일\n\n### 과금·SLA\n\n- 과금 모델 **Per 3/5years**, **무약정이 없고 약정 기간은 3년/5년**(백서 06 표 6-1, 6-2). 단기 PoC로 짧게 쓰고 해지하는 용도에는 맞지 않습니다.\n- SLA 장애 정의: **Edge Manager 접속 불가 또는 Edge Server 장애로 고객 서비스 실패**.\n\n## Bare Metal Server: 물리 자원 단독 할당\n\n- **가상화 기술을 사용하지 않고 물리적으로 분리된 CPU·메모리를 단독으로 할당**받는 고성능 서비스입니다.\n- 적합: 실시간(Real-Time) 시스템, HPC, 과도한 I/O 서버, **Multi-Attach로 Active-Active 고가용성 DB**.\n- v2 변경 사항: **Security Group을 제공하지 않으므로 Firewall을 사용한 구성**이 필요합니다.\n- 고성능 OLTP 예: VM·DBaaS 대신 Bare Metal 2대 이중화 + Block Storage(BM) Multi-Attach.\n- SLA는 \"공통\"에 포함되고, Backup은 Agent 설치 방식 File System 백업입니다.\n\n## 전용 자원·격리 설계 원칙\n\n| 근거 | 내용 |\n|---|---|\n| 중요한 흐름 전용 자원(백서 04) | 다른 프로세스 간섭 없이 동작하도록 **별도 VPC 또는 서브넷**, VM·컨테이너 단위 흐름 격리, **자원 공유를 최소화한 전용 자원·용량** |\n| Account 단위 격리(백서 02) | 독립 예산·운영 체계를 갖는 정보시스템은 Account 단위로 구성(비용 분리의 최소 단위), 민감도 다른 워크로드 분리 |\n| 시험·운영 분리(백서 05) | 개발·테스트는 VPC·Account 단위로 운영과 분리 |\n\n## 관련 전용 네트워크·현장 서비스\n\n| 서비스 | 내용 |\n|---|---|\n| Private 5G Cloud | 기업 고객을 대상으로 **Private 5G Core, Edge 솔루션** 제공 |\n| Cloud LAN-Data Center | 데이터센터 내 가상 네트워크로 다양한 네트워크 간 연결, 데이터센터 또는 고객 온프레미스 데이터센터 내 SDDC 기반 Shared 네트워크 |\n| Direct Connect | 고객 네트워크와 SCP를 **물리적 전용 회선**으로 연결, 1G/10G/20G/40G |\n\n## 하이브리드 클라우드 설계 고려사항\n\n| 항목 | 내용 |\n|---|---|\n| 애플리케이션·데이터 중력 | 데이터가 많은 곳에 앱을 최대한 가깝게, 데이터 이동 대역폭·전송 비용 고려 |\n| 보안과 거버넌스 | 온프레미스와 클라우드 전반에 **일관된 보안 정책**, 암호화·접근제어·규정 준수 모두 충족 |\n| 유연한 워크로드 관리 | 필요에 따라 클라우드로 확장하는 **버스팅(Bursting)** 구조 |\n| 성능 및 비용 최적화 | 워크로드·데이터 위치에 따라 성능·비용이 크게 달라지므로 지속 모니터링 |\n| 운영 자동화 도구 | 관리 복잡도를 줄이는 통합 운영 자동화 도구 |\n\n> [!시험]\n> - Public Cloud는 사업자가 소유·운영하고 여러 기업이 공유, Private Cloud는 기업 전용으로 직접 구축합니다.\n> - Edge Server는 **무약정이 없고 3년/5년 약정**만 있습니다. Edge Manager는 SCP, Edge Client는 고객 사이트에 있습니다.\n> - 하이브리드에서는 온프레미스와 클라우드에 **일관된 보안 정책**을 적용합니다(\"서로 독립적인 정책\"은 오답).\n> - 가상화 오버헤드 없이 물리 자원 단독 할당 + 고I/O + Multi-Attach Active-Active DB → **Bare Metal Server**(Security Group 대신 Firewall).\n\n출처: SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드7·11·13, Hybrid Cloud Edge Server 슬라이드5~9, WA백서 01 p.4~5, WA백서 02 p.2, p.7, WA백서 04 p.3~4, p.15, WA백서 06 p.1~2, p.5, SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드13, VPN/Direct Connect/Transit Gateway 슬라이드24\n"}, "2-2d": {"title": "공공 / 금융 클라우드", "md": "## 개념\n\n- 클라우드에 정보시스템을 구축할 때는 다루는 데이터의 종류·속성에 따라 정보보호 법규와 지침을 준수해야 하며, **공공기관 및 금융권은 별도의 클라우드 도입 가이드라인**을 따라야 합니다(WA백서 02).\n- 공공 영역에는 공공기관 전용 보안 인증(CSAP)을 받은 공공 클라우드 환경이 쓰이며, SCP 교재에서는 공공 전용 환경을 **SCP Sovereign**으로 지칭하는 곳이 있습니다(KMS 공공 인증 알고리즘 옵션).\n- 금융 영역은 금융보안원 안전성평가, 금융감독원의 복구 시간 권고 등 금융 규제를 충족해야 합니다.\n\n## 정보보호 관리체계 인증(표 2-1)\n\n| 구분 | 인증 | 내용 | 인증 대상 |\n|---|---|---|---|\n| 국제 | ISO 27001 | 정보보호 관리체계 정책·물리 보안·접근 통제 등 요구사항 국제 표준 | CSP 사업자 |\n| 국제 | ISO 27017 | **CSP의 클라우드 보안**에 필요한 보안 통제·구현 지침을 따르는 국제 인증 | CSP 사업자 |\n| 국제 | ISO 27018 | 클라우드에서 처리되는 **개인정보** 안전 처리 통제·가이드라인 | CSP 사업자, 클라우드 사용자 |\n| 국제 | CSA STAR | Cloud Controls Matrix(CCM) 기반 성숙도 평가로 STAR 인증 | CSP 사업자 |\n| 국제 | ISO 27799 | 진료·처방 등 **의료 데이터** 정보보호 관리체계 | CSP 사업자 |\n| 한국 | **CSAP** | 「클라우드 컴퓨팅 발전 및 이용자 보호에 관한 법률」에 따라 보안 인증 기준 적합 여부를 점검해 **국가·공공기관에 안전성·신뢰성이 검증된 클라우드를 공급**하기 위한 제도 | **CSP 사업자** |\n| 한국 | ISMS-P | 정보보호·개인정보보호 조치가 인증기준에 적합함을 인터넷진흥원 또는 인증기관이 증명 | CSP 사업자, 클라우드 사용자 |\n| 한국 | K-PaaS 적합성 인증 | K-PaaS 플랫폼을 지원하며 기능을 확장한 제품·서비스 인증 | CSP 사업자 |\n| 한국 | **금융보안원 안전성평가** | IT자산·데이터센터 대상 기본보호조치 및 안전성 평가 인증 | CSP 사업자, 클라우드 사용자 |\n\n> [!시험]\n> CSAP의 인증 대상은 **CSP 사업자**입니다. 공공기관이 직접 취득하는 인증이 아니라, 공공기관은 CSAP 인증을 받은 클라우드를 이용합니다. 금융보안원 안전성평가와 ISMS-P, ISO 27018은 CSP와 사용자 모두가 대상입니다.\n\n## 공공 클라우드 설계 포인트\n\n### 1. Region·환경 선택\n\n- Region을 정할 때 개인정보·중요 정보 저장 위치에 대한 법적 규제를 반드시 고려하며, **공공기관은 CSAP 인증을 받은 공공 클라우드를 사용해야 할 수 있습니다**(WA백서 04).\n- 데이터 국외 반출이 제한되는 경우 지연 시간보다 데이터 주권·규제 요건이 우선합니다(일반 개념).\n\n### 2. 전송 구간 암호화(보안업무규정)\n\n- 정부·공공기관 규정: \"**비밀은 암호화되지 아니한 상태로 정보통신 수단을 이용하여 접수하거나 발송해서는 아니된다.**\"(보안업무규정, 대통령령)\n- 따라서 SCP 공공 클라우드, 정부·공공기관으로 데이터를 전송할 때는 반드시 **암호화된 전송**을 구현합니다. 기관 망과 클라우드를 **VPN으로 연결해 IPSec 방식**으로 암호화합니다.\n- 최종 사용자와 서버 간에는 SSL/TLS를 쓰고, 규정상 인증서를 서버에 두어야 하면 LB에서 Termination하지 않습니다.\n\n### 3. 보안 서비스와 키 관리\n\n| 항목 | 내용 |\n|---|---|\n| 관리형 보안 서비스 5종 | IPS, WAF, DDoS Protection, Secured Firewall, Secured VPN은 **일반과 공공 모두 제공** |\n| KMS 공공 인증 알고리즘 | KMS 생성 시 **공공 인증 알고리즘 옵션을 선택하면 SCP Sovereign에서만 사용 가능** |\n| KMS Validation Password Key | Account당 공공 인증 알고리즘 Key 생성 가능 개수가 별도 할당 |\n\n### 4. 공공기록물 보존\n\n공공기관이 업무와 관련해 생산·접수한 문서·도서·대장·카드·도면·시청각물·전자문서 등 모든 기록정보와 행정박물은 **영구/준영구/30년/10년/5년/3년/1년** 보존(공공기록물 관리에 관한 법률 및 시행령). 백업 보존 정책 설계에 반영합니다.\n\n## 금융 클라우드 설계 포인트\n\n### 1. 금융기관별 복구 목표 시간(금융감독원 권고, 표 3-7)\n\n주요 금융기관은 **재해 발생 후 3시간 이내 완전 복구**가 가능하도록 권고됩니다.\n\n| 기관 | 복구 시간 | 비고 |\n|---|---|---|\n| 은행 및 증권 | 3시간 이내 | |\n| 금융공동망 운영기관, 공인인증센터 | 3시간 이내 | 금융결제원, 증권전산 |\n| 증권유관기관, 통합시스템 운영기관 | 3시간 이내 | 증권거래소, 선물거래소, 코스닥 시장증권, 증권예탁원, 금고 연합회 |\n| **보험** | **24시간 이내** | 외국보험사 포함 |\n| 외국계 금융기관 | 자율 | 복구시간 공개, 비상사태대응방안 제출 |\n| 기타 금융기관 | 자율 | 비상사태대응방안 제출 |\n\n- 허용 복구 시간은 조직 특성에 따라 다르며 특정 산업에서는 **상위 감독 기관이 기준을 제시**합니다. 허용 시간 내 복구가 불가능하면 재해를 선언하고 DR 계획을 이행합니다.\n- 3시간 이내 RTO는 DR 수준표에서 **Hot Level(RTO 수 시간, RPO 0, Active-Standby)** 에 가까운 수준이 요구됩니다.\n\n### 2. 금융·공공의 DB 이중화\n\nOracle **Data Guard**(PDB 단위 이중화)의 사용 사례로 **금융기관·공공기관**이 제시됩니다. 트랜잭션 무결성과 실시간 응답성이 중요해 몇 초 중단도 치명적이므로, 주 DB 장애 시 대기 PDB가 즉시 역할을 인계합니다(실시간 또는 지연 복제, 자동·수동 전환).\n\n### 3. 규정 준수 운영 통제\n\n- ISMS-P 운영관리 통제(시험·운영 분리, 소스 관리, 운영 이관, 변경 관리, 성능·장애 관리)를 반영합니다.\n- ISMS 규정은 **DB 접근 제어 관리**를 요구하므로, Application Server가 DB에 직접 접근하지 않고 **접근 제어 서버를 경유**하도록 구성해야 할 수 있습니다.\n- 성능·운영 이유로 DBaaS를 쓰고 싶어도 **DBaaS가 지원하지 않는 특정 암호화 모듈**을 적용해야 하는 규정이 있으면 DBaaS 사용이 어려울 수 있습니다.\n\n## 정리\n\n| 요구 | 대응 |\n|---|---|\n| 공공기관 클라우드 이용 | CSAP 인증 공공 클라우드(SCP Sovereign 환경) |\n| 공공 전송 데이터 | VPN(IPSec) 암호화 필수 |\n| 공공 암호 알고리즘 | KMS 공공 인증 알고리즘 옵션(Sovereign 전용) |\n| 금융 안전성 | 금융보안원 안전성평가, 복구 시간 3시간(보험 24시간) |\n| 민감 DB | Data Guard/Hot DR, 접근 제어 서버 경유 |\n\n> [!시험]\n> - 보험은 **24시간**, 은행·증권·금융공동망·증권유관기관은 **3시간**, 외국계는 **자율**입니다.\n> - KMS 공공 인증 알고리즘은 **SCP Sovereign에서만** 사용 가능합니다. 일반 환경에서 동일하게 쓸 수 있다는 보기는 오답입니다.\n> - 보안 서비스 5종은 일반·공공 **모두** 제공됩니다.\n\n출처: WA백서 02 p.1~3, p.24, p.27, WA백서 03 p.8~9, p.14, p.18, WA백서 04 p.3, p.37, SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리, SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드5·10, DB2_Oracle_Services_정리 3장, WA백서 05 p.1~2\n"}, "2-3a": {"title": "온프레미스 · 퍼블릭 클라우드 → SCP 마이그레이션 계획", "md": "## 개념\n\n마이그레이션 계획은 **무엇을(대상 선정), 어떤 방식으로(전환 전략), 어디로(네트워크·리전·서비스), 얼마에(사이징·TCO), 누가(운영 조직)** 옮길지를 정하는 과정입니다. 교재에는 마이그레이션 전용 장이 없으므로 WA 백서 6권과 Explore 교재에 흩어진 근거를 모아 정리합니다.\n\n### 전환 전략(일반 개념)\n\n| 전략 | 의미(일반 개념) | 교재 연결 |\n|---|---|---|\n| Rehost(Lift & Shift) | 구조 변경 없이 VM으로 그대로 이전 | 백서 05·02가 \"Lift & Shift\" 용어 사용, Custom Image(qcow2) 이전 |\n| Replatform | 앱 구조는 유지하고 일부를 관리형 서비스로 교체(예: MySQL → MySQL DBaaS) | DBaaS, Kubernetes Engine 등 관리형 서비스 권장 |\n| Refactor(Re-architect) | 클라우드 네이티브로 재설계(MSA, 컨테이너, 서버리스) | 백서 01 MSA, 백서 05 CI/CD 원팀 |\n| Repurchase | SaaS 등으로 교체 | |\n| Retire | 폐기 | 유휴 자원 폐기(백서 06) |\n| Retain | 온프레미스 유지 | 일부만 이전하는 하이브리드(백서 05) |\n\n> [!주의]\n> 6R(Rehost/Replatform/Refactor/Repurchase/Retire/Retain)은 담당 교재에 나오지 않는 일반 개념입니다. 교재에는 \"Lift & Shift\", \"일부 워크로드만 이전하고 나머지는 온프레미스 유지\", \"클라우드 기반 CI/CD 애플리케이션으로 재구축\" 같은 표현만 있습니다.\n\n## 1. 대상 선정과 우선순위\n\n- BIA(업무 구조화, 주요 업무 식별, 연관성 분석, 영향 평가)로 업무 중요도와 연관성을 파악합니다. 연관된 업무는 함께 이전·복구해야 정상 동작합니다.\n- 클라우드 장점(확장성, 탄력성, Pay-as-you-go)을 살릴 수 있는 워크로드를 우선 선정하고 나머지는 온프레미스에 유지할 수 있습니다(SEA 예시 9번 J회사 시나리오).\n- 고가용성 대상은 업무 영향도·고객 서비스 영향·규정 준수로 평가합니다.\n\n## 2. 보안 전략: Lift & Shift의 함정\n\n- CSA Top Threats 2024의 4위 **\"부적절한 클라우드 보안 전략\"** 은 **Lift & Shift 마이그레이션에서 기존 보안 기능을 그대로 이식**하고 **공동책임모델을 잘 이해하지 못해** 생기는 보안 이슈입니다.\n- 클라우드로 옮기면 신뢰 구간이 인터넷 너머로 확장되므로 경계 기반 모델만으로는 부족합니다. 책임 분담 모델에 맞춰 Firewall·Security Group·IAM·암호화를 다시 설계합니다.\n- 하이브리드에서는 온프레미스와 클라우드 전반에 **일관된 보안 정책**을 둡니다.\n\n## 3. 네트워크 계획\n\n| 항목 | 교재 내용 |\n|---|---|\n| IP 대역 | 프라이빗 연결 시 **양쪽 사설 IP 범위가 중첩되지 않게** 설계. 새 시스템 주소는 기존 네트워크 범위를 확인한 뒤 정함 |\n| Subnet | CIDR은 **생성 후 수정 불가**, 입력 범위 **/16 ~ /28**, 용도별(WEB·WAS·DB) 분리, On-Premise·타 클라우드와 중복 금지, 확장을 고려해 넉넉하게 |\n| 토폴로지 | 연결 지점이 늘수록 비용·정책·라우팅 복잡도 증가 → **허브앤스포크**, 다수 VPC는 Transit Gateway |\n| 한도 | Account당 VPC 최대 5개, VPC당 서브넷 최대 3개(백서 01), Account당 VPC Peering 최대 5개, Transit Gateway Account당 3개·TGW당 VPC 5개(Network 교재) |\n\n연결 방식 비교(On-premise 연결 시)\n\n| 항목 | VPN | Direct Connect | Transit Gateway |\n|---|---|---|---|\n| 연결 방식 | 인터넷 기반 암호화 터널(IPSec), VPC 연결 | **물리적 전용 회선** 1:1 | 중앙 허브(라우터) 1:N |\n| 주요 용도 | 저비용·빠른 구축 | 대용량, 안정적·보안성 높은 연결 | 여러 네트워크 연결 |\n| 보안 | 암호화 터널, 인터넷 경유 | 물리적 분리로 우수, Firewall로 제어 | 각 네트워크 보안 정책 활용 |\n| 대역폭 | 상대적으로 낮음 | 1G, 10G, 20G, 40G | |\n| 구축 | 비교적 쉬움 | 물리적 작업 필요 | 물리적 작업, 1:N 구성으로 복잡 |\n| 비용 | 상대적으로 낮음(IPSec VPN Gateway + Internet Outbound) | 전용회선 비용(포트 + 트래픽) | 생성 + 트래픽 + 포트 |\n\n- **Direct Connect**: 고객 네트워크와 SCP를 안전하고 빠르게 연결, **기존 시스템의 내부 사설 네트워크 대역을 SCP 자원에 할당**해 사용 가능. 고객사 **Uplink 회선 연결은 SR 신청**, 고객사 라우터에 **BGP 라우팅 프로토콜** 필요.\n- 중소 규모는 VPN 구성이 비용상 권장됩니다. 대용량 데이터 이전은 전용 경로를 확보하면 안정적입니다.\n\n## 4. 사이징과 TCO\n\n- 클라우드에서는 사양을 나중에 바꿀 수 있지만, 사이징이 중요한 이유는 **월 사용료를 산정하고 온프레미스 대비 TCO를 도출**해야 하기 때문입니다.\n- 방법: 수식계산법(사용자 수 기반, 근거 명확), **참조법**(기존 시스템 코어 수 기준, 마이그레이션에 적합), 시뮬레이션법(정확하지만 비용·시간 큼). 일반적으로 클라우드 용량은 시뮬레이션이나 운영 조정으로 균형점을 찾지만 예산·제안 때문에 사전 사이징이 필요합니다.\n- 참조법 보정: Tier 변경(1→3 분리 0.5 등), 이중화(A-A 0.7), **물리 → 클라우드 1.2**(가상화 오버헤드), 기존 CPU 평균 사용률, 여유 1.3. 상세는 2-3b·2-1e.\n- 작게 시작해 점진 확장하고, 상시 가동분은 약정·Cost Savings·Planned Compute를 검토합니다.\n\n## 5. 서비스 한도(Quota) 사전 점검\n\n- Console > Management > **Quota Service**에서 서비스 제한을 확인하고, **조정 가능하면 배포 전에 미리 증가를 요청**합니다.\n- 프로젝트 용량 요구사항을 사전에 파악하고, 부하 급증에 대비한 자동 확장 계획, 제한 용량 정기 검토.\n\n## 6. 서비스 선택(관리형 우선, 규정 확인)\n\n- 관리형 서비스(DBaaS, Kubernetes Engine, Cloud Functions)는 HA와 보안 관리 부담을 줄입니다.\n- 단, **DBaaS가 지원하지 않는 특정 암호화 모듈**을 적용해야 하는 규정이 있으면 DBaaS가 어렵습니다.\n- MSA 전환은 조직 역량(기술·프로세스·문화)이 없으면 실패 가능성이 높습니다(적합성 검토 6항목은 2-1c).\n- 하이브리드 설계 원칙: 애플리케이션·데이터 중력(**데이터가 많은 곳에 앱을 가깝게**, 대역폭·전송 비용 고려), 일관된 보안, 버스팅, 지속 최적화, 통합 운영 자동화.\n\n## 7. 비용 계획\n\n- 운영 후 숨은 비용 1순위는 **Internet Outbound Traffic**입니다. 하이브리드·멀티 클라우드는 인터넷 트래픽·데이터 전송 비용을 고려합니다.\n- 여러 지사 시스템을 통합 이전할 때는 **공통 서비스 VPC + Hub-and-Spoke VPC Peering**으로 자원·라이선스 중복 투자를 막습니다(백서 06 공통 서비스 영역 사례). 단일 관리 접점은 보안상 단일 취약점이 될 수 있습니다.\n- BYOL 조건을 확인한 뒤 배포 방안을 정합니다.\n- FinOps 실행 관리 도메인의 **워크로드 전환(Onboarding Workloads)**: 비용·사용량·영향에 대한 투명성을 제공하는 방식으로 클라우드 환경 또는 환경 간 시스템 마이그레이션을 조정합니다.\n\n## 8. 운영 모델\n\n| 이전 형태 | 운영 모델 | 특징 |\n|---|---|---|\n| Lift & Shift, 일부만 이전 | 클라우드 운영 조직 **별도 추가** | 전문성 강화, 역할 중복·커뮤니케이션 비용 |\n| 동일 | 기존 조직에 **통합** | 일관된 정책·프로세스 유지에 유리, 전문성 부족 시 효율 저하 |\n| 주요 워크로드 전환 완료 | 클라우드 인프라 운영 조직 + 개발팀 | 플랫폼은 클라우드 중심 재편 |\n| CI/CD 앱으로 재구축 | DevOps 원팀, 보안 강화 시 DevSecOps | |\n\nManaged Service 관리 항목에는 **데이터 마이그레이션**이 자원 관리 항목으로 포함됩니다.\n\n## 9. 계획 체크리스트\n\n1. BIA로 대상·우선순위·연관 업무 묶음 결정\n2. 전환 전략 결정(Lift & Shift, 관리형 전환, 재구축, 유지)\n3. 리전 선정(법적 규제, 지연 시간, 가격)\n4. 네트워크: CIDR 비중첩, Subnet 설계, VPN/Direct Connect/TGW 선택\n5. 보안 재설계(책임 분담, IAM·MFA, 암호화, Firewall·SG)\n6. 사이징(참조법 등) → 월 사용료 → TCO\n7. Quota 확인·증가 요청\n8. 데이터·서버·DB·스토리지 이전 방법 선택(2-3b~d)\n9. 전환·롤백 계획(배포 전략, 운영 이관 담당자 분리)\n10. 운영 조직 모델과 FinOps\n\n> [!시험]\n> - Lift & Shift에서 **기존 보안을 그대로 이식하면 충분하다**는 보기는 오답입니다(CSA 위협 4위).\n> - 프라이빗 연결 시 **사설 IP 대역 비중첩**, Subnet CIDR은 생성 후 수정 불가.\n> - 기존 사설 대역 사용 + 전용 연결 + SR 회선 신청 + BGP → **Direct Connect**.\n> - Quota는 **배포 전에** 확인하고 증가를 요청합니다.\n> - 사이징의 목적은 월 사용료 산정과 **TCO** 도출입니다.\n> - 기존 조직 통합 방식은 일관된 정책 유지에 **유리**합니다.\n\n출처: WA백서 02 p.1~5, WA백서 01 p.1, p.15~16, WA백서 04 p.3, p.16, p.26~28, WA백서 05 p.4~10, WA백서 06 p.7, p.10~12, p.25~26, WA백서 03 p.1~3, SCP_v2_Explore_Network_01-10 VPC 슬라이드(Subnet 설계시 고려사항), VPN/Direct Connect/Transit Gateway 슬라이드5·13·24, SCP Networking Service 슬라이드17·19, SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드13·14, SEA_문제_예시 9번\n"}, "2-3b": {"title": "Server / Application Migration", "md": "## 개념\n\n서버·애플리케이션 마이그레이션은 ① 서버 이미지를 SCP로 가져와 VM을 만드는 방식(이미지 기반 Rehost), ② 백업·DR 복제로 옮기는 방식, ③ 컨테이너·관리형 서비스로 재배포하는 방식으로 나눌 수 있습니다. 이전 후에는 사이징 검증과 트래픽 전환(Cut-over) 전략이 필요합니다.\n\n## 1. 이미지 기반 서버 이전(Custom Image)\n\n### 1.1 외부 이미지 파일로 Image 생성(Compute > Virtual Server > Image)\n\n1. 이미지명 입력\n2. 이미지 파일 URL 입력: **Object Storage에 이미지 파일을 업로드한 뒤 URL 입력**, **xxx.qcow2 확장자만 가능**. URL은 Object Storage 상세 페이지에서 복사. 이미지 파일을 업로드한 **Object Storage Bucket은 생성할 서버와 동일한 존(Zone)** 에 있어야 함\n3. OS 타입, 최소 디스크, 최소 RAM 결정\n4. **Visibility**: Private = Account 내에서만, Shared = Account 간 공유\n5. **Protected**: 사용 체크 시 이미지 삭제 불가\n\n그 다음 Virtual Server 생성 시 **Custom 이미지**를 선택해 서버를 만듭니다.\n\n> [!팁]\n> VMware vmdk, Hyper-V vhd 등 다른 형식의 디스크 이미지는 qcow2로 변환한 뒤 업로드해야 합니다(변환 도구 예: qemu-img, 일반 개념). 교재 근거는 \"qcow2 확장자만 가능\"입니다.\n\n### 1.2 기존 Virtual Server에서 Image 생성·공유\n\n| 단계 | 내용 |\n|---|---|\n| 이미지 생성 | VM이 **Active 상태에서도 생성 가능하나 무결성을 보장할 수 없음**. 생성된 이미지는 Visibility **private**이라 다른 Account로 공유 불가 |\n| 공유용 Image 생성 | Private 이미지에서만 활성화, 다른 Account 공유 목적, **OS 디스크만 포함** |\n| 다른 Account로 공유 | Shared 이미지에서만 활성화, **공유받을 Account ID** 입력(Cost Management > Account 메뉴에서 확인), Image 목록 더보기에서 요청 확인 |\n| 범위 | v2는 **동일 리전 내 다른 Account로** Image 공유 가능 |\n\n- 이미지는 서버 버전 관리 수단이기도 해서 특정 시점 VM 배포, **Launch Configuration에 등록해 Auto-Scaling 서버**로 사용합니다.\n- 보안상 최신 패치가 적용된 **강화 이미지**를 관리하고 서버 시작 시 자동 업데이트를 수행합니다(백서 02).\n\n## 2. 백업·DR을 이용한 서버 이전·복제\n\n| 수단 | 동작 |\n|---|---|\n| Backup 서비스 | VM 이미지(OS+Data) Agentless 백업(Full 1개 + Incremental 최대 6개 스케줄), Bare Metal은 Filesystem Agent 백업. **복구 시 신규 서버가 생성**되며 Block Storage 유형·Keypair는 원본과 동일. 보관 기간 2주/1개월/3개월/6개월/1년 |\n| Backup DR | Backup **생성 시** DR 옵션 활성화, DR 사이트에 백업본 복제(기존 Backup에는 활성화 불가) |\n| Virtual Server DR | 다른 Region에 VM·Block Storage 복제, **실제 복제 대상은 Block Storage, DR VM은 정지 상태**. v2에서는 **마켓플레이스 제공 서비스**를 이용하는 방식으로 변경 |\n| Block Storage 볼륨 이전 | 다른 Account로 볼륨 소유를 이전(2-3d) |\n\n## 3. 이전 서버 사이징(참조법)\n\n산정식: **기존 CPU Core 수 × Tier 구성 보정 × 이중화 구성 보정 × 서버 형태 보정 × CPU 평균 사용률 × 여유 사용률**\n\n| Tier 변경 | 보정 | 예 |\n|---|---|---|\n| 1→2, 2→3 | 0.7 | (Web/WAS/DB) → (Web),(WAS/DB) |\n| **1→3** | **0.5** | (Web/WAS/DB) → (Web),(WAS),(DB) |\n| 2→1, 3→2 | 2.0 | 합칠 때 |\n| 3→1 | 3.0 | (Web),(WAS),(DB) → (Web/WAS/DB) |\n\n| 기타 보정 | 값 |\n|---|---|\n| 이중화 1→2 Active-Active | 0.7 |\n| 이중화 1→2 Active-Standby | 1.0 |\n| 이중화 2→1 | 2.0 |\n| 기존 **물리 서버 → 클라우드** | **1.2**(가상화 오버헤드) |\n| 기존 가상 서버 → 클라우드 | 1.0 |\n| 여유 사용률(목표 70%) | 1.3 |\n\n> [!시험]\n> 물리 서버 1대의 Web/WAS/DB를 VM 3대로 분리 → Tier 보정 **0.5**, 서버 형태 보정 **1.2**. 예: 4코어 × 1 × 0.7 × 1.2 × 0.3 × 1.3 ≈ 1.3 → 2코어.\n\n## 4. 운영 환경 이관 절차(규정)\n\n- ISMS-P 통제 \"운영환경 이관\": 통제된 절차, 실행 코드는 시험·사용자 인수 절차에 따라 실행.\n- 이관은 **개발자가 아닌 별도 담당자**가 수행하고 **테스트 완료 여부, 이관 전략, 롤백 방안**을 사전 검토합니다.\n- DevOps 자동 배포에서도 특정 인원에게만 배포 권한을 위임하고 승인 절차를 둡니다.\n- 개발·테스트 환경은 VPC·Account 단위로 운영과 분리합니다.\n\n## 5. 트래픽 전환(Cut-over) 전략\n\n| 전략 | 전환 방식 | 롤백 |\n|---|---|---|\n| 인플레이스 | 기존 서버에 직접 배포, **가동 중지 발생** | **재배포가 유일** |\n| 롤링 | 그룹별 순차, 신·구 공존 | 일부만 영향 |\n| 블루-그린 | 신규 환경(그린)을 **병렬 구성**, **GSLB Ratio 가중치**로 점진 전환, DNS 컷오버·Auto-Scaling 정책도 사용 | 문제 시 **블루로 되돌림** |\n| 레드-블랙 | DNS를 일시에 변경, 한 버전만 활성 | |\n| 불변 | 새 서버 세트 구축, 기존 VM 종료 | |\n| 카나리 | GSLB Ratio로 일부(예: v1 90%, v2·v3 각 5%)만 노출하며 확대 | 즉시 v1으로 전환, 폭발 반경 제한 |\n\n## 6. 애플리케이션 현대화 경로\n\n- **컨테이너**: 앱과 런타임을 패키징하면 **플랫폼 독립적으로 배포**, 개발·테스트·배포 단순화와 자동화. 이미지는 **Container Registry**(취약점 점검 제공), 배포는 Kubernetes Engine, CI/CD는 DevOps Service(Git Push → Jenkins → Registry → Kubernetes Engine).\n- **Serverless**: 단순 반복 작업은 Cloud Functions(관리형, HA 부담 감소). 요청 기반 과금이라 간헐적 워크로드에 유리합니다.\n- **관리형 서비스**로 전환하면 OS 패치·보안 설정 부담이 줄어듭니다.\n- **Stateless화**: 세션·상태는 CacheStore 같은 외부 상태 관리 DB로 옮겨 Auto-Scaling에 대비합니다.\n- **단일 서버 Legacy App**: 소스 변경·라이선스 제약으로 이중화가 불가하면 주요 흐름에서 분리해 App이 참조하도록 배치합니다.\n- **결합 해제**: Web·App 사이에 LB(동기) 또는 Message Queue(비동기).\n\n## 7. 이전 후 점검\n\n- 단위·통합 테스트, SLO·SLA 지표 측정, 부하 테스트, 병목 개선(가용성 시나리오 테스트).\n- 리사이징: 지난 14일 P95 CPU 30% 미만 등 지표로 축소 검토, 유휴 자원(미연결 볼륨, 오래된 스냅샷·이미지) 정리.\n\n> [!시험]\n> - Custom Image 원본은 **Object Storage에 올린 .qcow2 파일 URL**, 버킷은 서버와 **같은 존**. vmdk를 그대로 쓸 수 있다는 보기는 오답입니다.\n> - Image 공유는 **동일 리전 내 다른 Account**로만 가능합니다. 다른 리전 Account로 바로 공유는 오답입니다.\n> - Protected 체크 시 삭제 불가, Visibility Private(Account 내)·Shared(Account 간).\n> - 인플레이스는 가동 중지가 생기고 실패 시 재배포만 가능합니다. 무중단 전환은 블루-그린(GSLB Ratio).\n\n출처: SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드11, Virtual Server 슬라이드19~22, SCP_v2_Explore_Storage_20-24 Backup 슬라이드5~13, WA백서 04 p.26~28, p.30, WA백서 05 p.1~3, p.17~22, WA백서 03 p.11, p.22, WA백서 01 p.7~14, p.31~32, WA백서 02 p.35~36\n"}, "2-3c": {"title": "Database Migration", "md": "## 개념\n\nDB 마이그레이션은 **다운타임 허용 여부, 데이터 크기, 동종/이종 여부, 대상 서비스(DBaaS·Oracle·직접 설치)** 에 따라 방법이 달라집니다. 교재의 근거는 SCP DBaaS의 Migration 기능, OCI Database Migration, Oracle PDB 이동, DB 백업·복구와 Replica입니다.\n\n| 구분 | 의미 |\n|---|---|\n| 동종(Homogeneous) | 같은 엔진 간 이전(Oracle → Oracle, MySQL → MySQL) |\n| 이종(Heterogeneous) | 다른 엔진으로 전환(예: Oracle → PostgreSQL). 동종 대비 충분한 테스트 계획과 결과 검증 필요 |\n| Online | 서비스 운영 중 변경분을 지속 반영(CDC 등), 무중단·최소 중단 |\n| Offline | 내보내기 → 전송 → 가져오기, 일시 중단 필요, 구성 간단 |\n\n## 1. SCP DBaaS로의 이전\n\n### 1.1 대상 서비스와 사전 자원\n\n- 관리형 Database: **EPAS, MySQL, MariaDB, PostgreSQL, Microsoft SQL Server**(OLTP), CacheStore(Redis/Valkey, NoSQL), Vertica(DBaaS, OLAP).\n- 생성·운영 3단계: **Resource Provisioning → Service Configuration → Resource Management**.\n- PostgreSQL(DBaaS) 필수 자원: **VPC, Subnet, Security Group, Virtual Server, Block Storage(데이터), Object Storage(백업)**. 운영·관리로 Planned Compute, Cost Savings, Logging.\n- Service Configuration: 이미지·버전, 서버명 접두어·클러스터 이름, 서버 타입(Standard/High Capacity), Block Storage(OS + Data, 필요 시 Temp/Archive/Backup 추가), 스토리지 종류(SSD/SSD_KMS), 네트워크, **Redundancy(Active/Standby)**, IP 접근 제어, 유지관리 기간, DB 이름·사용자·비밀번호·포트, 인코딩·로케일·시간대, Audit Log(성능 영향), Parameter, Backup, Tag.\n\n### 1.2 Migration 기능\n\n| 항목 | PostgreSQL(DBaaS) | CacheStore(DBaaS) |\n|---|---|---|\n| Migration | 제공: 기존 DB에서 **데이터를 복제해 운영 중단 최소화**하며 이관 | 미제공 |\n| DR Replication | 제공(VPC Peering 사전 구성 시 **Cross Region**) | 미제공 |\n| Read Replication | 제공 | 미제공 |\n| 백업 | Full / Archive Backup, 사전 구성한 **Object Storage**에 저장, 특정 시점 복구 | AOF 또는 RDB 파일 기반, Object Storage |\n| 이중화 | Redundancy(Active/Standby), Multi-AZ | Sentinel(Replica 1~2개, 자동 승격), Multi-AZ |\n| 파라미터 변경 | 운영 중 가능, **재시작해야 반영** | 동일 |\n| 확장 | Scale-Up(Scale-Out은 Data Analytics·AI/ML 서비스) | Scale-Up |\n\n- Redis 캐시처럼 Migration 기능이 없는 서비스는 애플리케이션 재적재나 백업 파일 기반 등 별도 방법으로 데이터를 옮겨야 합니다(일반 개념). AOF는 쓰기 명령 로그, RDB는 특정 시점 스냅샷 파일입니다.\n- 규정상 DBaaS가 지원하지 않는 **특정 암호화 모듈**이 필요하면 DBaaS 대신 다른 구성을 검토합니다.\n- 관리형으로 바꾸면 직접 설치(MySQL을 VM 두 대에 설치하고 InnoDB Cluster로 HA·Replica 구성, 네트워크·보안·백업 구현)를 **옵션 설정만으로** 대체할 수 있습니다.\n- SCP Database 서비스 기본 포트는 **2866**이며, App Security Group에서 DB SG로 2866 Outbound, DB SG에서 2866 Inbound를 허용합니다.\n\n### 1.3 DBaaS 백업으로 복구·복제\n\n- DB 백업은 데이터 백업(1일)과 아카이브 백업(5분~1시간), 보존 7일~35일, 저장소는 사용자가 만든 Object Storage 버킷입니다.\n- **복구는 기존 서버에 직접 하지 않고, 백업본으로 새 DB를 생성한 뒤 Master로 전환**합니다.\n- DR: DR 사이트에 주 DB의 **Replica**를 만들면 변경 사항이 동기화됩니다. **주·DR VPC 간 Peering**이 필요하고, 재해 시 Replica를 **수동으로 Master 전환**합니다.\n\n> [!주의]\n> 백서 03은 Region 간 DBaaS Replication 기능을 \"향후 출시 예정('26년)\"으로 표기합니다. DB1 교재는 \"VPC Peering 등 사전 구성 시 Cross Region 복제(DR Replication) 지원\"으로 적습니다.\n\n## 2. Oracle: OCI Database Migration\n\n| 항목 | 내용 |\n|---|---|\n| 개념 | 온프레미스·타 클라우드 DB를 OCI 고성능 셀프서비스 환경으로 옮기는 **완전관리형(Fully-managed)** 서비스, **GUI 콘솔 또는 API**로 수행, 운영 중 시스템에 부담을 주지 않도록 설계 |\n| 지원 유형 | **동종 마이그레이션**(Oracle → Oracle, MySQL → MySQL) |\n| 구조 | **멀티테넌트**, 사용자 테넌시와 분리된 마이그레이션 전용 클라우드 자원 사용 |\n| Migration 엔진 | 전체 흐름을 자동화·관리하는 **컨트롤 타워**, 작업 정의·실행, 실시간 상태 모니터링 |\n| Cloud Premigration Advisor Tool | **시작 전 사전 점검**, 소스 구조 분석, 호환성 문제·예상 오류 탐지 |\n| Source | On-premises Oracle, 타 클라우드 Oracle, OCI 내부(Oracle Base/Exadata) |\n| Target | Autonomous Database, Exadata Database Service, Oracle Base Database Service, Exadata Cloud@Customer, 멀티클라우드 |\n\n| 방식 | Online | Offline |\n|---|---|---|\n| 기술 | **Oracle GoldenGate**(실시간 이중화) | **Data Pump** |\n| 동작 | 소스 변경을 실시간 캡처해 즉시 반영(**CDC**) | Data Pump 추출 → **중간 저장소 또는 DB Link** 전송 → Data Pump 임포트 |\n| 중단 | 없음(무중단) | 일시 중단 필요 |\n| 적합 | 24시간 서비스 | DB를 잠시 멈출 수 있을 때, 구성 간단 |\n\nRMAN은 Oracle 백업·복구 도구로 Online/Offline 방식 기술이 아닙니다.\n\n## 3. Oracle: CDB/PDB 이동과 업그레이드\n\n- CDB(Container Database)는 하나 이상의 PDB를 포함, PDB(Pluggable Database)는 CDB 안의 독립 DB(자체 스키마·객체·사용자·데이터 파일). **논리적으로 독립, 물리적으로 자원 공유**. PDB는 이동 가능한 단위라 클라우드 전환에 활용됩니다.\n- **PDB는 항상 CDB의 Oracle 버전에 종속**(예: 19c CDB에는 19c 호환 PDB만). CDB 업그레이드는 연결된 모든 PDB에 영향.\n- 무중단·최소 중단 업그레이드·이동 순서\n\n1. **새 버전의 CDB 생성**\n2. 기존 PDB를 **Clone**해 새 CDB에 연결하고 테스트\n3. 문제가 없으면 기존 CDB에서 PDB **Detach**(분리)\n4. 새 CDB에 PDB **Attach**(연결)\n\n- 예: 회계 PDB만 테스트용 CDB로 옮겨 보안 패치를 적용·검증.\n- **Data Guard**: 소스 PDB → 타깃 PDB를 실시간 또는 지연 방식으로 지속 복제, 장애 시 Standby PDB로 자동·수동 전환. 대기 PDB는 테스트·리포트·백업에도 활용. 금융·공공기관, 온라인 쇼핑몰 사례.\n\n## 4. 마이그레이션 계획 시 고려사항(SEA 예시 8번 근거)\n\nSEA 문제 예시는 DB Migration 계획 단계 고려사항으로 다음 진술들을 제시합니다(정답은 교재에 제시되지 않음).\n\n- 최적의 Migration 방법은 DB 환경, 비즈니스 요구, Data Size에 따라 달라진다.\n- 다운타임이 허용되면 오프라인, 최소화해야 하면 온라인 Migration을 고려한다.\n- 데이터 크기에 비례해 소요 시간이 늘므로 대량 데이터는 병렬 처리, 인덱스 삭제 등 시간 단축 방법을 고려한다.\n- 이종 DB 전환은 동종 대비 충분한 테스트 계획과 결과 검증 방법을 고려한다.\n- PostgreSQL(DBaaS) 기반 Migration에서 Datafile을 백업/복구하는 물리적 방식을 고려한다는 진술도 보기에 있습니다.\n\n> [!주의]\n> 위 마지막 진술은 DB1 교재의 \"PostgreSQL(DBaaS) Migration은 기존 DB에서 데이터를 복제해 운영 중단을 최소화하며 이관\"과 방식이 다릅니다. 교재에 근거가 있는 것은 \"복제 기반 Migration\"이며, Datafile 물리 백업·복구 방식에 대한 교재 설명은 없습니다.\n\n## 5. 이전 대상 DB 설계\n\n- **사이징(tpmC 수식계산법)**: 분당 트랜잭션 수(기존 시스템 조사·동시 사용자·클라이언트 수) × 기본 tpmC 보정 5 × 피크타임 × DB 크기(일반 1.7) × 앱 구조 × 앱 부하(일반 1.7) × 연계 × 클러스터 × 여유율 1.3 / 0.7.\n- **엔진 선택**: 조인·트랜잭션은 관계형, 대규모 분석은 Vertica(컬럼 기반 MPP), 캐시·세션은 CacheStore, 검색은 Search Engine.\n- **확장 한계**: 관계형 DB는 수평 확장 불가, Database 서비스는 Active-Standby → 수직 확장 + Replica·캐싱으로 읽기 오프로드.\n- **고성능 OLTP + Active-Active**: Bare Metal 2대 + Block Storage(BM) Multi-Attach.\n\n## 6. 절차 요약(교재 근거 + 일반 개념)\n\n1. 평가: 엔진·버전, 크기, 다운타임 허용, 동종/이종, 규정(암호화 모듈)\n2. 대상 선택: DBaaS(Migration 지원 엔진) / OCI(Oracle) / VM·Bare Metal 직접 설치\n3. 사전 점검: Premigration Advisor(Oracle), 네트워크(VPC Peering·VPN·Direct Connect), Security Group 2866\n4. 이전: 복제 기반 Online(DBaaS Migration, GoldenGate) 또는 Offline(Data Pump)\n5. 검증·전환(Cut-over): 데이터 정합성 검증 후 애플리케이션 연결 전환(일반 개념)\n6. 운영: 백업(Object Storage), Redundancy, Read Replica, DR Replica, 파라미터 조정(재시작 반영)\n\n> [!시험]\n> - OCI Database Migration은 **동종** 마이그레이션입니다. Oracle → PostgreSQL 이종 전환을 기본 지원한다는 보기는 오답입니다.\n> - Online = **GoldenGate(CDC, 무중단)**, Offline = **Data Pump**(+ 중간 저장소/DB Link, 일시 중단).\n> - CacheStore는 **Migration, DR Replication, Read Replication 미제공**입니다.\n> - PDB 이동 순서: **새 CDB 생성 → Clone 테스트 → Detach → Attach**.\n> - DBaaS 복구: 새 DB 생성 후 Master 전환. 백업 저장소는 사용자가 만든 Object Storage.\n\n출처: DB1_Database_정리 1~7장, DB2_Oracle_Services_정리 1~5장, WA백서 03 p.10, p.12, p.24~25, WA백서 01 p.18, p.27, WA백서 04 p.3, p.21~26, p.33~35, WA백서 02 p.30~32, SEA_문제_예시 8번\n"}, "2-3d": {"title": "Storage Migration", "md": "## 개념\n\n스토리지 마이그레이션은 데이터의 **접근 방식(블록·파일·객체), 공유 여부, 접근 빈도, 보존 기간**에 맞는 대상 스토리지를 고르고, 이전 수단(볼륨 이전, 마운트 복사, 업로드, 아카이빙 정책, 복제)을 정하는 일입니다.\n\n### 대상 스토리지 선택 기준\n\n| 고려 요소 | 선택지 |\n|---|---|\n| 액세스 패턴 | 순차적 / 랜덤 |\n| 액세스 빈도 | 온라인(Hot), 오프라인(Warm), 아카이브(Cold) |\n| 업데이트 빈도 | 높음(OS, DB 볼륨) / 낮음(파일 저장) |\n| 액세스 가용성 | 단일 인스턴스 연결 / 공유 연결 |\n\n| 온프레미스 원본(일반 개념) | SCP 대상 |\n|---|---|\n| 서버 로컬 디스크, SAN 볼륨(OS·DB) | **Block Storage** |\n| NAS 공유 디렉터리(NFS/CIFS) | **File Storage** |\n| 웹 콘텐츠, 로그, 백업 파일, 대용량 객체 | **Object Storage** |\n| 장기 보관 데이터 | **Archive Storage**(Object Storage 경유) |\n\n## 1. SCP 스토리지 옵션 비교\n\n| 구분 | Block Storage | File Storage | Object Storage | Archive Storage |\n|---|---|---|---|---|\n| 정의 | 고정 크기 블록, 서버에 직접 할당 | 네트워크로 여러 서버가 데이터 저장·공유 | URL 형태로 접속하는 객체 스토리지 | **Object Storage의 데이터를 장기 보관** |\n| 액세스 | VM 직접 연결 / Multi-Attach | **NFS(Linux) / CIFS(Windows)** | **REST API(S3 호환)** | Object Storage와 연결 |\n| 접근제어 | - | Public IP / 서버 / VPC Endpoint | Public IP / 서버 / VPC Endpoint(+ DB 서비스) | Project 공용 / 개인 |\n| 암호화 | KMS 볼륨 선택, 모든 디스크 AES-256 | AES256 기본 | AES256 선택 | AES256 선택 |\n| 보호 | 스냅샷 | 스냅샷 | 버전 관리 | - |\n| 용량 | 8GB~최대 12TB, 사용 중 증설 | 제한 없음 | 제한 없음 | 제한 없음 |\n| 과금 | Provisioning, 할당량(GB) | Pay-as-you-go, 사용량(GB) | 사용량(GB) | 사용량(GB) |\n\n## 2. Block Storage(VM) 이전\n\n### 2.1 볼륨 생성·특성\n\n- 서비스 기본 단위는 **볼륨**, 용량 **8GB에서 최대 12TB 이내로 사용 중 증설**, Units 단위 입력(**1 Unit = 8GB**). OS 기본 볼륨은 이미지별 최소 용량 이상.\n- 생성 시 **스냅샷을 선택하면 그 스냅샷으로 생성**, 선택하지 않으면 **빈 볼륨**.\n- 디스크 유형: **SSD / SSD_KMS / SSD_Provisioned / SSD_MultiAttach**\n  - SSD_KMS: 인스턴스~블록스토리지 구간 전송 암호화, **최초 생성 시 적용 후 변경 불가**, 성능 저하 가능\n  - SSD_Provisioned: IOPS, Throughput 설정\n  - MultiAttach: 2개 이상 서버 연결(VM은 최대 26개 볼륨), **Windows 기반 Virtual Server는 사용 불가**\n- 연결 후 Linux는 디스크 확인 → 파티션·포맷 → Mount, Windows는 디스크 online·초기화 → 포맷.\n\n### 2.2 볼륨 이전(Account 간)\n\n다른 Account로 볼륨을 이전할 수 있으며, **이전하면 기존 위치에서 볼륨이 제거**됩니다(복사가 아니라 소유 이전).\n\n1. **볼륨 이전 버튼 활성화**: 볼륨과 **서버의 연결을 해제**해야 버튼이 활성화됨\n2. **볼륨 이전 실행**: **볼륨이전 ID와 승인 Key**를 복사·저장해 전달, 확인 시 Credential이 txt로 자동 다운로드\n3. **(다른 Account) 볼륨 이전 받기**: 목록 더보기에서 실행. **이전 받기가 완료되어야** 기존 Account에서 볼륨이 제거됨\n\n### 2.3 스냅샷으로 복제·복구\n\n- 스냅샷은 특정 시점 볼륨의 이미지 백업본이며 즉시 생성됩니다.\n- 복구 방법 두 가지: **스냅샷 복구**(Available 상태의 최신 스냅샷으로 기존 볼륨 복구, 모든 연결 서버에서 unmount 후 진행) / **복구 볼륨 생성**(목록에서 선택해 신규 볼륨으로 생성, remount 후 사용).\n\n## 3. File Storage 이전(NAS 대체)\n\n- 네트워크로 연결된 서버들이 데이터를 저장·공유하는 스토리지로 다수 서버 환경에 적합합니다. Linux와 Windows 서버가 함께 공유하던 NAS 디렉터리의 이전 대상으로 적합합니다.\n- 생성: 볼륨명 지정, OS에 맞는 **프로토콜 선택(Linux NFS, Windows CIFS)**.\n- 연결: 상세정보에서 **Mount명** 확인 → 연결 자원 팝업에서 서버 선택 → 서버에서 Mount.\n\n```\nmkdir /data\nmount -t nfs -o vers=3,noresvport 10.10.10.10:/fsxx /data\n```\n\n- 스냅샷: 수동 최대 **800개**(스케줄 생성분 제외), 스케줄 자동 최대 **128개**. 주기는 매일(시간), 매주(요일/시간). 복구는 \"복구볼륨생성\" 또는 \"스냅샷 복구\"(최신 스냅샷). 서버에서는 `/.snapshot` 경로로 시점별 파일 복구.\n- **File Storage DR(Region 간 복제)**: DR Region, DR Volume명, 복제 주기(**5분, 1시간, 매일, 매주, 매월**; 매일 23:59:00, 매주 일요일 23:59:00, 매월 1일 23:59:00). 재해 시 동기화를 중단하고 복제 볼륨을 **R/W 모드**로 변경.\n- **Multi-AZ File Storage**: 원본·복제본이 각 AZ에 생성되어 실시간 동기화.\n\n## 4. Object Storage 이전\n\n- 버킷은 데이터를 저장하는 최상위 논리 단위이며, 사용을 위해 **인증키를 사전에 생성**해야 합니다.\n- 접근 주소: **Public**(외부 망에서 접근) / **Private**(같은 Account 내에서 생성된 자원에서 접근).\n- 폴더 생성, 파일 업로드, 파일별 권한 수정(Public Access 허용 여부).\n- 접근 제어: Public IP 허용(단일 IP 또는 CIDR), 서비스 자원 허용(Virtual Server/GPU Server/Bare Metal Server/Multi-node GPU Cluster, VPC Endpoint, PostgreSQL·MariaDB·MySQL·EPAS·Microsoft SQL Server).\n- **버전 관리**: 설정 시점부터 같은 이름 파일 업로드 시 버전 ID가 다르게 부여되어 이력 관리, 설정 전 파일은 버전 ID null(-). 실수로 덮어써도 이전 버전 복원.\n- **Object Storage DR**: 주·DR 버킷 동기화, **주 사이트 버킷에 버전 관리 활성화 필요**, Bucket 단위 비동기 복제, 재해 시 DR 버킷을 End Point로 접근.\n- 서버 이미지 이전의 경유지: Custom Image용 qcow2 파일을 Object Storage에 업로드해 URL을 사용(버킷은 서버와 같은 존).\n- REST API(S3 호환) 방식이므로 S3 호환 도구로 업로드할 수 있습니다(도구 선택은 일반 개념).\n\n> [!주의]\n> 백서는 Object Storage Multi-AZ와 Region 간 Replication을 \"향후 출시 예정('26년)\"으로 표기합니다.\n\n## 5. Archive Storage 이전(장기 보관)\n\n- **Object Storage의 데이터를 장기간 보관**하기 위한 스토리지입니다. 서버에서 직접 마운트하는 방식이 아니라, **정책으로 지정한 Object Storage 버킷의 데이터가 아카이빙**됩니다.\n- 생성: 버킷명 입력, **인증키 사전 생성** 필요.\n- 정책 관리: Archiving 대상 Object Storage **버킷 선택(최초 설정 후 수정 불가, 다른 Archive Storage 정책에서 쓰는 버킷 선택 불가)**, 대상 파일 선택, **수행 시점**(일 수) 입력. 예: 7일 → 버킷 내 7일 이상 변경 없는 파일 자동 아카이빙.\n- 복구: Archive Storage 폴더 리스트에서 폴더·파일 선택 → 복구 → **Object Storage의 버킷과 폴더를 선택해 복구**(구성도: 3시간 이내 검색).\n- 백업 보호: 백업본이 저장된 Object Storage 버킷을 Archive Storage로 아카이빙해 장기 보존.\n\n> [!주의]\n> Archive Storage 정책 수행 시점 범위가 교재 안에서 다릅니다. 정책관리 슬라이드8은 \"1에서 3,650 사이\", 슬라이드9와 학습정리는 \"1~3,640일\"로 적습니다.\n\n## 6. 백업 데이터 이전·보존\n\n| 대상 | 방법 | 보존 |\n|---|---|---|\n| Virtual Server | Backup 서비스(Agentless, Full 1 + Incremental 최대 6), 복구 시 신규 서버 | 2주/1개월/3개월/6개월/1년 |\n| Bare Metal | Filesystem Agent 백업 | 2주~1년 |\n| DBaaS | 내장 백업 → 사용자 Object Storage | 7~35일 |\n| File Storage | 스냅샷 | 자동 128, 수동 800 |\n| Object Storage | 버전 관리 | 제약 없음 |\n\n## 7. 이전 경로와 보안\n\n- 대용량 데이터 이전은 **Direct Connect**(물리 전용 회선, 1G/10G/20G/40G)나 **VPN**(IPSec)으로 전용 경로를 확보하면 안정적이고 안전합니다. 공공기관 데이터는 VPN 암호화 전송이 필수입니다.\n- 데이터 중력: 데이터가 많은 곳에 애플리케이션을 가깝게 두고, 이동 시 대역폭·전송 비용을 고려합니다. VPC 외부로 나가는 Internet Outbound Traffic은 과금됩니다.\n- 저장 후 보호: File Storage 기본 암호화, Object Storage 암호화 선택, Block Storage KMS 유형, ACL로 접근 서버·Public IP·VPC Endpoint 제한, 로그 버킷은 암호화·버전 관리.\n\n> [!시험]\n> - Linux NFS + Windows CIFS 동시 공유 NAS → **File Storage**. MultiAttach 볼륨은 **Windows VM에서 사용 불가**합니다.\n> - 볼륨 이전은 **소유 이전**입니다. 대상 Account에서 이전 받기가 끝나야 원본 Account에서 제거되며, 서버 연결 해제가 선행 조건입니다.\n> - Archive Storage는 **NFS 마운트로 업로드하지 않습니다.** Object Storage 버킷을 정책으로 아카이빙하고, 복구도 Object Storage 버킷·폴더로 합니다.\n> - Object Storage Private URL은 **같은 Account 내 자원**에서 접근하는 주소입니다.\n> - Object Storage DR에는 **주 버킷 버전 관리 활성화**가 필요합니다.\n> - Block Storage(VM) 용량은 8GB~12TB, 사용 중 증설, 1 Unit = 8GB.\n\n출처: WA백서 04 p.32~33, WA백서 03 p.10~15, p.21~24, WA백서 02 p.21, p.23, WA백서 06 p.1, p.10, SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드5~12, File storage 슬라이드5~16, Object storage 슬라이드5~19, Archive storage 슬라이드5~13, Backup 슬라이드5~13, SCP_v2_Explore_Compute_11-19 Virtual Server 슬라이드21, SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드24\n"}, "4-2a": {"title": "WAF · DDoS Protection · IPS", "md": "## 한눈에 보기\nSCP v2는 외부 위협에서 기업을 보호하는 **침입공격 탐지/분석/대응 서비스 5종**(IPS, WAF, DDoS Protection, Secured Firewall, Secured VPN)을 **일반·공공 모두** 제공한다. 이 강의는 그중 **IPS·WAF·DDoS Protection**을 다룬다(Secured Firewall·VPN은 4-2b).\n\n- 공통 구조: 공격자/정상 사용자 → **Security Zone**(DDoS Protection → Secured Firewall → IPS → WAF) → **Service Pool**(VPC, 고객 서버). **Security Center**가 **24x365 보안관제**.\n- 공통 신청 방식: 콘솔에서 바로 생성하지 않고 **Support Center > 서비스 요청**으로 신청 → **관제 담당자**가 처리.\n- 공통 대응 방식: 공격 시도 **IP 정보 제공** → **SCP N/W 방화벽에서 차단 권고**, **월간 보고서** 제공.\n\n## 배경: 고객 Pain-Point와 SCP Security 서비스 전체\n| 대상 | 고민 |\n|---|---|\n| 경영진(C-Level) | 보안 SW는 필수인데 **자동 보안 진단으로 위협에 사전 대응**하는 방법은? |\n| 관리자 | 데이터 유출·악성코드·계정 탈취 대응방안을 빨리 찾고 싶은데 클라우드 보안 전문가가 적음 |\n| 실무자 | 보안 경험이 풍부하고 기술적으로 검증된 클라우드 사업자와 일하고 싶음 |\n\nSCP v2 Security 서비스 전체 현황(요구사항 → 서비스 매핑에 그대로 쓰인다):\n\n| 서비스 | 한 줄 설명 |\n|---|---|\n| SingleID | 하나의 ID로 시스템 로그인 및 접속 제어 |\n| Secured Firewall | 클라우드 N/W 보안용 차세대 방화벽 |\n| Secured VPN | 암호화된 가상 전용망 연결 |\n| IPS | IPS 침입탐지 정책 관리 및 실시간 대응 |\n| Certificate Manager | 인증서 배포 및 통합 관리 |\n| Webshell Detection | 웹 서비스 Webshell 공격 실시간 탐지/대응 |\n| Config Inspection | 클라우드 Console 보안 설정 취약점 진단 |\n| Secret Vault | Token 기반 임시키 발급 및 수명주기 관리 |\n| Key Management Service | 암호화 키 관리 |\n| WAF | 웹 애플리케이션 보호 |\n| DDoS Protection | 대용량 트래픽 공격 탐지·대응 |\n| IDS | 웹사이트·애플리케이션 서버 웹해킹 탐지/대응 |\n| FPMS | 방화벽 정책 관리 및 운영 자동화 |\n| Endpoint Security Suite | 클라우드 기반 Endpoint 보안 통합 관리 |\n| Log Transmission | 보안 이벤트 로그 수집·전송 |\n| Secrets Manager | 보안 정보 암호화 저장·관리 |\n| SSL Visibility | 암호화 트래픽 복호화 → N/W 가시성 확보 |\n| CNAPP | 애플리케이션 개발~배포~런타임 통합 보호 |\n\n> [!주의]\n> CNAPP는 교재에 **('26.9)** 로 표기된 출시 예정 서비스다(SEC2 Security 서비스 현황). 시험에서 '현재 제공' 여부를 단정하지 말 것.\n\nWA 백서의 설계 원칙: **Secure Internet Gateway를 배포하고 관리형 보안 서비스를 신청**한다. 관리형 보안 서비스는 **SR(서비스 요청)으로 신청만 하면** 장비 관리·점검을 일임할 수 있다. 3rd Party 보안 SW를 VM에 직접 설치하는 대신 WAF·DDoS Protection 같은 Security 서비스를 쓰면 관리 부담이 줄어든다(WA백서 02).\n\n## IPS (Intrusion Prevention System)\n**홈페이지 및 애플리케이션 서버에 대한 침입을 실시간으로 탐지/대응**한다.\n\n| 기능 | 내용 |\n|---|---|\n| 침입 탐지 및 분석 | 24x365 이벤트 모니터링, Raw 데이터 심층 분석, 대외 동향 반영한 **신규 탐지 패턴 업데이트**, 탐지 패턴 최적화 |\n| 모니터링 정보 제공 | 이벤트 탐지 시 **경보**, **월간 보고서**(경보 목록·내용) |\n| 침입 대응 | 공격 시도 **IP 정보 제공** → **SCP N/W 방화벽에서 차단 권고** |\n\n- 최신 위협을 반영해 침입탐지 정책을 지속 업데이트, **패킷 모니터링으로 애플리케이션 계층까지** 탐지\n- 구성: **VPC 내 공인 IP 기반**, **인터넷으로 접근 가능한 서버**가 대상, 신청 양식의 서버(Virtual Server) 사양 참고\n\n### 선행 서비스와 사전 체크\n| 항목 | 내용 |\n|---|---|\n| 선행 서비스 | VPC의 **Internet Gateway 생성 시 '구분'에서 SIGW(Secure Internet Gateway)** 를 선택해야 IPS 이용 가능 |\n| | 일반 Internet Gateway를 선택하면 **IPS 이용 불가** |\n| | SIGW로 변경하면 **사용 중인 공인 IP가 변경**됨 |\n| 탐지 범위 | **암호화되지 않은 HTTP** 트래픽 기준 탐지, **HTTPS(SSL 암호화) 트래픽은 관제 미제공** |\n\n### 신청 절차\n1. Security > IPS > Service Home\n2. Support Center > 서비스 요청 목록 > 서비스 요청\n3. 필수 정보 입력(**작업구분: IPS 생성**)\n4. 제출 → 관제 담당자 확인 후 진행\n\n> [!주의]\n> 원본 IPS 사전 체크 슬라이드에 \"→ DDoS Protection 이용 가능\"이라고 적혀 있는데 DDoS 슬라이드를 복사한 오기로 보인다(SEC1 정리 노트). IPS·DDoS 모두 **SIGW가 선행**이라는 점은 동일하다.\n\n## WAF (Web Application Firewall)\n**사이트 트래픽 모니터링 및 위협 이벤트 차단으로 웹 애플리케이션을 보호**한다.\n\n| 기능 | 내용 |\n|---|---|\n| 침입 탐지/분석, 모니터링 | 24x365 모니터링(경보, 월간 보고서) |\n| | 웹 방화벽 이벤트 분석으로 공격 분류: **Injection, XSS, File Include, File Up/Download, Web Scan** 등 |\n| | 최신 공격 패턴 탐지(예: Apache Struts 취약점) |\n| 침입 대응 | **등록된 URL** 대상 공격 시도 IP 정보 제공 → SCP N/W 방화벽에서 차단 권고 |\n\n- 고객이 등록한 웹 페이지의 **HTTP, HTTPS** 트래픽을 모니터링(IPS는 HTTPS 미제공과 대비)\n- 선행: WAF는 **Virtual Server에 WAF 라이선스를 설치**해서 제공 → 원하는 사양의 **Virtual Server를 먼저 설치**\n\n### 사전 체크 사항\n1. WAF **단일 구성** 시 WAF 서버나 애플리케이션 장애가 나면 **서비스 연속성 보장 불가** — **SCP Load Balancer와 WAF는 bypass 미지원**\n2. SCP 보안관제는 **펜타시큐리티 상품에 한정**(운영 + 관제 상품)\n3. **엔지니어가 직접 설치** 지원 → 신청부터 구축까지 **시간 소요**\n4. 가용성이 중요하면 **WAF 이중화** 필요 → 별도 요청\n5. 마켓플레이스에 다른 벤더 상품이 있어도 **삼성SDS 보안관제는 미제공**\n\n### 신청\n- Support Center > 서비스 요청(**작업구분: WAF 연계**) → 서비스 담당자 처리\n- WAF 신청 양식 다운로드 → 신청서 작성\n- 개시하려면 **WAF 라이선스 설치 + 관제 연동 점검** 필요\n\n### WAF 구축 프로세스\n트래픽 경로:\n```\nInternet → [Security Zone: DDoS → IPS → Secured FW] → IGW FW → VPC\n  → LB FW → L7 Service(SSL Offloading/LB) → WAF(VM)\n  → L4 Service(LB) → WEB Server → L4 → WAS Server\n```\n\n| 단계 | 상세 Activity |\n|---|---|\n| 사전 준비 | WAF 설치를 서비스 요청으로 신청(MSP → SDS) → SW 설치 요청(SDS → 엔지니어) → 엔지니어 정보 전달(SDS → MSP) |\n| Console 작업(MSP 수행) | 아래 1~9 순서 |\n| WAF SW 설치·테스트 | 사양 확정 후 엔지니어가 설치·테스트(엔지니어 & MSP) |\n| 보안관제 정책 요청·반영 | 필요한 정책 요청·전달·적용(SDS ↔ MSP), Direct Connect Firewall / Security Group / 라우팅 정책 확인 |\n\nConsole 작업 순서(MSP):\n1. **Certificate Manager에 SSL 인증서 등록**\n2. **WAF용 Virtual Server 생성**\n3. **Load Balancer 생성**\n4. **SSL Offloading용 L7** 서비스 생성\n5. WAF 이중화 부하 분산 필요 시 L4 생성\n6. WEB 서버 이중화 부하 분산 필요 시 L4 생성\n7. LB / Firewall / Security Group 설정\n8. LB HTTP 리디렉션 설정(옵션)\n9. WAF용 VM에 **WAF 엔지니어 접근 권한** 부여\n\n(일반 개념) MSP = 고객 대신 클라우드를 운영하는 사업자. 콘솔 작업은 MSP가 수행한다.\n\n## DDoS Protection\n**대량 트래픽을 집중 발생시켜 서비스 장애를 일으키는 DDoS 공격을 탐지·방어**한다.\n\n| 기능 | 내용 |\n|---|---|\n| 침입 탐지 및 분석 | 24x365 이벤트 모니터링, **DDoS 공격 자동 탐지** |\n| 침입 대응 | **L3/L4 레벨** 다양한 DDoS 공격에 대해 **학습 기반 탐지 및 차단** |\n| 모니터링 정보 | 월간 보고서(경보 목록·내용) |\n\n- 공격 트래픽 차단으로 SCP 내부 서버 보호, 내부로 유입되는 트래픽 부하 최소화 → **웹 서비스 연속성 보장**\n- 선행: IGW 생성 시 **SIGW** 선택(IPS와 동일), SIGW로 바꾸면 **공인 IP 변경**\n- 보호 임계치 설정을 위해 **최소 한 달의 학습 기간** 필요 → 학습된 임계치를 분석해 최적 정책 설정\n- 신청: Security > DDoS Protection > Service Home → Support Center > 서비스 요청(**작업구분: DDoS Protection 생성**) → 신청서 다운로드 → **신청 정보 / 관제 정보** 탭 필수 항목 작성 → 관제 담당자 확인\n\nWA 백서의 DDoS 대응 자동화 예: 가장 바람직한 방법은 **DDoS Protection 구성**. 아키텍처적으로는 Virtual Server에 **Auto-Scaling**을 구성해 서비스 생존을 확보하고, Cloud Monitoring에서 **Network In 또는 CPU 사용량** 임계치·알림을 설정하며, 관리자가 공격자 IP를 파악해 **Firewall에 거부 정책**을 넣는다(WA백서 05 p.27~28, 02 p.41).\n\n## 비교 정리\n| 구분 | IPS | WAF | DDoS Protection |\n|---|---|---|---|\n| 보호 대상 | 홈페이지·애플리케이션 서버 침입 | 웹 애플리케이션(등록 URL) | 대용량 트래픽 공격 |\n| 탐지 계층 | 패킷 모니터링, 애플리케이션 계층까지 | 웹(HTTP/HTTPS) | **L3/L4**, 학습 기반 |\n| HTTPS | **관제 미제공** | 모니터링 | - |\n| 선행 | IGW 구분 **SIGW** | **Virtual Server 먼저** (라이선스 설치) | IGW 구분 **SIGW** |\n| 특이 | 공인 IP 기반 | 펜타시큐리티 한정, LB bypass 미지원, 이중화 별도 요청 | **최소 1달 학습** |\n| 작업구분 | IPS 생성 | WAF 연계 | DDoS Protection 생성 |\n\nWA 백서 표 2-10(관리형 보안 서비스와 침해 유형):\n\n| 서비스 | 기능 | 관련 침해 유형 |\n|---|---|---|\n| Secured Firewall | 4계층 트래픽 제어 | 무단 접근, IP 스캐닝 등 |\n| WAF | 웹사이트 취약점을 노리는 HTTP, HTTPS 기반 보안 위협, 자동화 Bot 공격 방어 | Injection, XSS, Web Scan 등 |\n| DDoS Protection | 대량 트래픽 DDoS 공격 탐지/방어 | DDoS 공격 |\n| IPS | 악의적으로 추정되는 트래픽과 Application 조작 패턴 감시 | 해킹 공격 탐지 |\n\n과금 방식(WA백서 06 p.2): **DDoS Protection, IPS, Secured Firewall = Provisioning, Per Hour** / **WAF = Provisioning, Per Month**.\n\n## 시험 포인트\n> [!시험]\n> - IPS·DDoS 선행 = **IGW '구분'에서 SIGW** 선택. 일반 IGW면 불가, SIGW로 바꾸면 **공인 IP 변경**.\n> - IPS는 **HTTPS 관제 미제공**(암호화 트래픽 내부를 복호화해 검사하지 않음). HTTP·HTTPS 웹 공격은 WAF.\n> - WAF: **VM 먼저 생성** 후 라이선스 설치, **펜타시큐리티 한정**, **LB-WAF bypass 미지원** → 이중화 별도 요청, 타 벤더 마켓플레이스 상품은 SDS 관제 없음.\n> - WAF 구축 Console 순서: 인증서 등록 → WAF VM → LB → L7(SSL Offloading) → (L4) → LB/FW/SG → (HTTP 리디렉션) → 엔지니어 접근 권한.\n> - DDoS: **L3/L4 학습 기반**, **최소 1달 학습**.\n> - 대응은 **IP 정보 제공 + N/W 방화벽 차단 권고**(직접 차단이 아님), **월간 보고서**, 신청은 **Support Center 서비스 요청**.\n\n출처: SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 0~4·7절, SEC2_SingleID_정리 0절(Security 서비스 현황), WA백서 02 p.7·p.32~33(표 2-10)·p.41, WA백서 05 p.27~28, WA백서 06 p.2\n"}, "4-2b": {"title": "Secured Firewall · Secured VPN", "md": "## 한눈에 보기\n| 서비스 | 개요 | 특징 |\n|---|---|---|\n| **Secured Firewall** | 클라우드 네트워크 보안을 위한 **차세대 방화벽** | **IP 주소/포트 기반** 정책으로 서버 N/W 접근 관리 |\n| **Secured VPN** | 암호화된 가상 전용망을 이용한 네트워크 연결 | 공인인증 장비 및 **국가 검증필 암호모듈** 적용 가상 N/W 터널 |\n\n두 서비스 모두 침입공격 탐지/분석/대응 5종에 속하며 **일반·공공 모두 제공**, **Support Center > 서비스 요청**으로 신청하고 담당자가 처리한다(Security Zone 구조와 24x365 관제는 4-2a 참고).\n\n## Secured Firewall\n### 개념과 기능\n- **클라우드 최적 방화벽**: 클라우드 환경을 고려한 **도메인 정책**, 방화벽 규칙 및 로깅\n- **모니터링 정보**: 월간 보고서\n- 구성: **VPC 내 공인 IP 기반**, **인터넷으로 접근 가능한 서버** 대상, 신청 양식의 서버(Virtual Server) 사양 참고\n- WA 백서 표 2-10: 기능 **4계층 트래픽 제어**, 관련 침해 유형 **무단 접근, IP 스캐닝 등**\n\n### 선행과 신청\n| 항목 | 내용 |\n|---|---|\n| 선행 서비스 | **Networking > VPC** |\n| 신청 경로 | Security > Secured Firewall > Service Home → Support Center > 서비스 요청(**작업구분: Secured Firewall 생성**) |\n| 방화벽 정책 신청 | 서비스 신청 시 **등록한 메일로 신청 양식 발송** → 양식을 참고해 방화벽 정책 신청 |\n| 과금 | Provisioning, Per Hour (WA백서 06) |\n\n### 기본 Firewall과의 차이\n| 구분 | Firewall (Networking) | Secured Firewall (Security) |\n|---|---|---|\n| 적용 대상 | Internet Gateway, Direct Connect, Load Balancer에 붙는 논리 방화벽 | VPC 내 공인 IP 기반, 인터넷 접근 서버 |\n| 생성 | 대상 서비스 생성 시 함께 생성(Firewall 메뉴에 생성 버튼 없음) | 서비스 요청 → 담당자 처리 |\n| 성격 | 사용자가 규칙 직접 관리 | **관제형 차세대 방화벽**, 도메인 정책, 월간 보고서 |\n\n> [!팁]\n> 선택지에 'Direct Connect·Uplink 선행'이 보이면 Secured VPN, '웹 공격(Injection·XSS) 차단'이면 WAF, '도메인 정책·차세대 방화벽·VPC 선행'이면 Secured Firewall이다.\n\n## Secured VPN\n외부 고객 네트워크와 SCP 네트워크를 **암호화된 가상 전용망**으로 안전하게 연결하며, **보안 전문가가 VPN 운영**까지 제공한다.\n\n### 구성\n```\n고객 본사/지점 ── IPSec VPN Tunnel ──▶ SDS Datacenter(VPN) ── Direct Connect ── VPC\n모바일 근무자 ── SSL VPN Client 설치 ──▶\n```\n\n### 주요 기능\n| 기능 | 내용 |\n|---|---|\n| IPSec VPN | **국가 검증필 암호모듈** 적용 |\n| Virtual Private Gateway 생성 | 클라우드 내부 N/W와 고객사 N/W 연결, 네트워크 규모를 고려해 **양방향 트래픽 대역폭** 선택 |\n| VPN Tunnel 생성 | IPsec VPN Gateway **이중화** → 장애 시 서비스 연속성 보장 |\n\n### 선행 서비스\n- **Direct Connect 생성 + Uplink 회선 신청 완료** 후 이용 가능\n  - 경로: Console > Support Center > 서비스 요청\n  - 서비스: Networking > Direct Connect / 작업 구분: **Uplink 회선 신청**\n\n### 사전 체크 사항\n1. **사용 가능한 IP 대역을 미리 확인**\n  - 센터 VPN 장비는 **다수 고객 공용 장비** → 타 고객 VPC 대역이나 SCP 사용 대역과 **중복되면 사용 불가**\n  - 지점 VPN과 SCP IP 대역 중복 확인(목적지 대역이 출발지 대역에 포함되면 라우터가 트래픽을 내부로 보내 **통신 불가**)\n2. 외부 연동 SW, VPN 설정, Direct Connect 방화벽 오픈 등 확인\n3. **지점 VPN은 SECUI 장비 임대**(별도 비용). 타 벤더 장비는 센터 VPN(SECUI)과 **호환 모델인지 확인**\n\n### 신청과 개시\n1. Support Center > 서비스 요청(**작업구분: Secured VPN 생성**) → 서비스 담당자 처리\n2. 고객사 대역에 **지점 VPN 설치 후 연동 점검**(직접 운영하는 VPN이 있으면 점검 생략 가능)\n3. Uplink 회선 미신청, 고객사 라우팅·방화벽 설정 오류가 있으면 **End-to-End 테스트 실패** 가능\n\n### 일반 VPN vs Secured VPN\n| 구분 | VPN (Networking) | Secured VPN (Security) |\n|---|---|---|\n| 생성 | 콘솔에서 직접(VPN Gateway, Tunnel) | **서비스 요청**, 담당자 처리 |\n| 연결 | 인터넷 기반 IPSec | **Direct Connect + Uplink** 선행 |\n| 특징 | 다양한 호환 장비 | **국가 검증필 암호모듈**, 지점 VPN **SECUI** 임대, 전문가 운영 |\n\n### WA 백서 관점: 전송 중 암호화\n- 저장 데이터를 **특정 지점과 지속적으로** 송수신하면 VPN으로 전송 암호화를 구성한다. SCP VPN은 **IPSec** 암호화 방식을 지원(그림 2-8 Secured VPN의 IPSec VPN 연결).\n- 지점이 특정되지 않은 웹 트래픽은 **SSL/TLS**로 암호화한다.\n- 정부·공공기관은 \"비밀은 암호화되지 아니한 상태로 정보통신 수단을 이용하여 접수하거나 발송해서는 아니된다\"는 규정이 있으므로, 기관 망과 클라우드를 VPN으로 연결해 IPSec 암호화 전송을 구현한다.\n\n## 시험 포인트\n> [!시험]\n> - Secured Firewall: **차세대 방화벽**, **도메인 정책**, 선행 = **VPC**, 정책 신청 양식은 **등록 메일로 발송**, 월간 보고서.\n> - Secured VPN: **국가 검증필 암호모듈 IPSec**, 선행 = **Direct Connect + Uplink 회선 신청**, 센터 VPN 공용이라 **IP 대역 중복 불가**, 지점 VPN은 **SECUI 임대**(타 벤더는 호환 확인), VPN Gateway **이중화**.\n> - '국가 검증필 암호모듈 + 전문가 운영' 요구 → Networking VPN(콘솔 직접 생성)이 아니라 **Secured VPN**.\n> - 모바일 근무자는 **SSL VPN Client**로 접속.\n\n출처: SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 1·5·6·7절, SCP_v2_Explore_Network_01-10 Firewall 슬라이드 5·7, WA백서 02 p.22~23·p.33(표 2-10), WA백서 06 p.2\n"}, "4-2c": {"title": "FPMS · Endpoint Security Suite", "md": "## 한눈에 보기\n| 서비스 | 정의 | 핵심 |\n|---|---|---|\n| **FPMS** | 방화벽 정책을 관리하고 **방화벽 운영 업무를 자동화**하는 서비스 | 휴먼 에러·장애 방지, 서비스 리드타임 감소 |\n| **Endpoint Security Suite(ESS)** | **클라우드 기반 Endpoint 보안 통합 관리** 서비스 | ESCORT·NASCA·SecuPrint를 **SaaS**로, **One-View** 통합 콘솔 |\n\n두 서비스 모두 **Support Center 서비스 요청**으로 신청한다.\n\n## 배경: 보안 담당자의 고민 (Intro)\n- \"방화벽 정책과 운영 작업을 자동화해 휴먼에러와 장애를 없애고 서비스 리드타임을 줄이며, 취약점 조치 가이드를 통해 지속적으로 보안을 강화할 수 있나요?\" → **FPMS**\n- \"ESCORT, NASCA, SecuPrint 등 다양한 툴을 별도로 설치·패치하면 대시보드가 여러 개가 되고 보안 정책을 일관적으로 적용하기 어렵지 않나요?\" → **Endpoint Security Suite**\n\n> [!주의]\n> SEC5 슬라이드 5에서는 첫 번째 고민(방화벽 정책 자동화)이 'Log Transmission' 라벨 옆에 배치되어 있지만 내용상 FPMS의 고민이다. 또 슬라이드 31(ESS 개념)의 부제가 \"방화벽 운영 업무 자동화 서비스\"로 되어 있는데 이는 FPMS 슬라이드의 문구가 남은 것으로 보인다. ESS의 정의는 학습정리(슬라이드 48)의 \"클라우드 기반의 Endpoint 보안 통합 관리 서비스\"를 따른다.\n\n## FPMS (방화벽 운영 업무 자동화)\n### 개념과 특장점\n다양한 클라우드 환경에서 방화벽을 효율적·안전하게 운영하기 위한 서비스로, 운영자가 **수작업으로 하던 모든 과정을 자동화**해 **휴먼 에러와 장애를 없애고 사용자의 서비스 리드타임을 감소**시킨다.\n\n| 특장점 | 내용 |\n|---|---|\n| 장애 예방 | 휴먼 에러 방지, 신청 정보의 **IP, Port 정보 등이 문법과 구조에 맞는 값**으로 들어왔는지 검사 |\n| 운영 편의성 향상 | 방화벽 정책 적용 **자동화**, **DR 백업 방화벽**을 위해 신청된 정책을 **다른 방화벽으로 복제** |\n| 방화벽 정책 최적화 | **Optimizer 알고리즘**으로 방화벽 정책 최적화 |\n| 지속적인 보안 강화 | **과다한 오픈 정책, 만료되거나 관리하지 않는 정책**을 분석하고 진단 부문별 **점수를 수치화** |\n\n### 구성 요소\n1. **방화벽**\n  - 등록 전 **연동 가능한 방화벽인지 확인**(제조사, 모델명, OS 버전)\n  - FPMS는 **API를 이용해 방화벽 장비에 접속**하여 정책을 넣거나 정보를 가져옴 → 방화벽 운영자는 장비에 **연동 계정을 생성**하고 접속 가능하도록 **API 설정** 필요\n2. **방화벽 신청 시스템**\n  - 방화벽 신청 데이터를 가져오려면 **FPMS와 신청 시스템이 연동**되어야 함\n\nFPMS 내 관리 항목: 방화벽 정보, 네트워크(ZONE) 대역, 옵션 설정, 정책/객체 관리(출발지·목적지·포트, 객체 이름·내용 예: IP_70.60.18.33 → 70.60.18.33/32).\n\n### 방화벽 등록 절차 (순서 중요)\n| 단계 | 작업 내용 |\n|---|---|\n| 1. 방화벽 설정하기 | FPMS 등록 전, **연동 가능한 방화벽인지 확인**(OS 버전)하고 연동을 위한 설정(**API 연동 계정, 계정 권한 설정**) |\n| 2. FPMS 내 방화벽 등록/설정하기 | 방화벽 기본정보뿐 아니라 **API 연동정보, Zone 정보, 상세 기능, 기본 옵션, 정책 규칙**도 함께 설정 |\n| 3. 방화벽 자원 동기화하기 | 등록한 방화벽에 정책이 이미 있으면 동기화로 방화벽과 FPMS의 정보(**방화벽 정책정보, NAT 정책정보, 방화벽 객체정보**)를 일치 |\n| 4. 신청 시스템 연동하기 | 신청 시스템에서 FPMS로 신청 데이터를 가져오기 위해 연동 |\n\n### Hands-on\n1. 생성: 모든 서비스 > Security > FPMS 메뉴 > **작업구분** 선택 → 신청 정보 작성 및 서비스 요청\n2. 신청 내역 확인: 모든 서비스 > **Support Center > Service Home > 서비스 요청 > 서비스 요청 목록** (서비스데스크 문의/별도 대응)\n\n## Endpoint Security Suite (ESS)\n### 개념\n- **PC 보안의 통합 운영과 관리 효율성**을 위해 SCP에 온보딩되어 **SaaS로 제공**되는 Endpoint Security 서비스\n- 기존 **On-Premise**로 제공되던 **ESCORT, NASCA, SecuPrint**의 Suite → SaaS로 제공해 도입·운영 비용 절감\n- 개념도 키워드: MSA, **One-View 통합 관리콘솔**, 멀티 테넌트, AWS·Azure·Google 등 3rd party API 연계, 고객지원 체계 구축, 사외 PC 보안 강화, 멀티 OS 지원, v5.x 전환, **통합 에이전트**, **Rule 기반·ML 기반 이상징후 탐지**, 워크플로우 고도화, 비가시성 워터마크, EDR, DLP, IAM, Hybrid\n\n### 특장점\n| 특장점 | 내용 |\n|---|---|\n| 관리의 용이성 | SaaS로 포인트 솔루션들의 **One-View 통합 관리 콘솔**과 **싱글 로그인**, **One-Click 통합 설치 파일** |\n| 보안관리 영역 확대 | 보안정책 전송·예외처리 등 PC 관리 영역이 사내망 PC에서 **사내/사외 제약 없이** 확대(인터넷 망 사용) |\n| 내부자 위협 탐지 | 차단 위주(Pre-Execution 사전차단, On-Execution 행위차단)에서 **이벤트 모니터링 기반 탐지/대응(Post-Execution, IRM: Insider Risk Management)** 으로 적극적 보안관리 |\n| Rest API 확장성 | 다양한 공통 기능을 **Rest API**로 제공 → 포인트 솔루션 연계·확장 용이 |\n\n보안관리 영역 확대 Use Case:\n- **Use Case 1. 출장자, 외근 PC, 소규모 지점 PC**: 정책 예외 및 솔루션 삭제를 위한 **임시코드 발급·전달 불필요**, 동일 수준 보안 정책 적용 또는 예외처리 **즉시** 가능\n- **Use Case 2. 임시 출입 엔지니어/내방객**: 출문 후에도 **온라인 삭제** 가능 → 주요 포트 봉인 스티커 부착 등 강화된 보안 적용 및 모니터링\n\n### 주요 기능(구성 솔루션)\n| 솔루션 | 기능 |\n|---|---|\n| **NASCA** | 문서를 열거나 저장할 때 **사용자 인증 → 권한 설정/통제 → 암/복호화** 순으로 동작(문서 DRM) |\n| | 업무 특성상 **자동 복호화 대상 시스템** 지정 → 업무 연속성 확보 |\n| | 재택근무 보안 이슈 대응 **추적 관리**, NASCA DRM(PC 문서 DRM, 서버 문서 DRM), **화면통제 DRM(SecuScreen)** |\n| **SecuPrint** | 기업 내부 중요 정보·개인정보가 **출력**에 의해 외부로 유출되는 것을 차단하고 모니터링 |\n| **관리자(One View)** | 개별 로그인으로 관리하던 ES 솔루션을 **One View 콘솔에서 통합 관리** |\n| ESCORT | Suite 구성 솔루션(교재에 별도 상세 슬라이드 없음) |\n\nNASCA 자동 복호화 시스템 등록 대상 예시:\n- ES-Document 미설치자와 함께 문서를 공유하는 시스템\n- 첨부·업로드한 문서가 서버 내부에서 데이터로 활용되는 시스템(예: 생산 연계 시스템)\n- 업로드한 문서가 안전한 외부 시스템 또는 외부 기관에 제공·전달되는 시스템\n\n### Hands-on\n1. 생성: 모든 서비스 > **Support Center > 서비스 요청** → ESS 서비스 생성 요청(신청 정보 작성 및 서비스 요청)\n2. 신청 내역 확인: Support Center > 서비스 요청 > 상세 페이지(ESS 서비스 요청 목록)\n\n## 비교: FPMS vs Log Transmission vs ESS\n| 구분 | FPMS | Log Transmission | ESS |\n|---|---|---|---|\n| 대상 | 방화벽 정책·운영 | 방화벽·IPS·DDoS 보안 장비 로그 | 사용자 PC(Endpoint) |\n| 핵심 | 정책 적용 자동화, 최적화, 진단 점수화 | 실시간 로그 수집·전송 | 문서 DRM, 출력 보안, One-View |\n| 신청 | 서비스 요청 | 서비스 요청 | 서비스 요청 |\n\n## 시험 포인트\n> [!시험]\n> - FPMS = **방화벽 운영 업무 자동화**. 장애 예방(IP·Port 문법 검사), 정책 **복제**(DR 백업 방화벽), **Optimizer** 최적화, 과다 오픈·만료 정책 **점수화**. 로그 수집·전송은 FPMS가 아니라 Log Transmission.\n> - FPMS 등록 순서: **방화벽 설정(연동 가능 확인·API 계정) → FPMS에 방화벽 등록/설정 → 자원 동기화 → 신청 시스템 연동**.\n> - FPMS는 **API**로 방화벽 장비에 접속한다.\n> - ESS = ESCORT·NASCA·SecuPrint의 **SaaS Suite**, **One-View** 통합 콘솔, 인터넷 망 사용으로 **사내외 구분 없이** 동일 수준 관리, 출장자 PC에 **임시코드 불필요**.\n> - NASCA 동작 순서: **사용자 인증 → 권한 설정/통제 → 암/복호화**. SecuPrint = **출력** 유출 차단.\n\n출처: SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드 1~5, 22~44, 47~48\n"}, "4-2d": {"title": "Certificate Manager", "md": "## 한눈에 보기\n**Certificate Manager**는 **SSL/TLS 인증서를 등록하고 통합 관리**하는 서비스다. CA에서 발급받은 인증서를 등록하거나 개발/테스트용 **Self-signed** 인증서를 생성하고, **Load Balancer**와 연결해 통신을 암호화하며, **인증서 수명 주기(만료 알림)** 를 관리한다.\n\n| 항목 | 값 |\n|---|---|\n| 선행 서비스 | **없음(N/A)** |\n| 후행 서비스 | **Load Balancer** |\n| Quota(Region당) | 사용자 인증서 **100**, 자체 발급 인증서 **100** |\n| 만료 알림 | 만료 **45 / 30 / 15 / 7 / 1일 전** 메일 |\n| 태그 | 자원당 최대 **50개** |\n\n## 배경: 설정 관리·모니터링 도구 Overview\nSEC3 교재는 Certificate Manager와 Config Inspection을 'SCP 보안 강화를 위한 설정 관리·모니터링 도구, 규정 준수, 민감 데이터 보호' 서비스로 묶는다.\n\n| 서비스 | 개요 | 특이 사항 |\n|---|---|---|\n| Certificate Manager | 인증서 배포 및 통합 관리, SSL/TLS 인증서 등록/삭제·정보 관리 | CA 발급 인증서 등록 또는 개발/테스트용 Self-signed 생성, SCP 자원과 연결해 통신 암호화, 인증서 수명 주기 관리 |\n| Config Inspection | 클라우드 Console 보안 설정 취약점 진단, Report 제공 | 4-2i 참고 |\n\n> [!주의]\n> 원본 학습정리 슬라이드의 Overview 문구(Certificate Manager = \"API 제공\", Config Inspection = \"CLI 제공\")는 다른 자료에서 복사된 것으로 보인다(SEC3 정리 노트). 서비스 정의는 본문 기준으로 이해한다.\n\nWA 백서 관점(전송 중 데이터 보호): HTTP 같은 비암호화 프로토콜은 도청·중간자 공격에 노출되므로 SSL 기반 **HTTPS**를 쓴다. Certificate Manager는 인증서 조회, 유효기간 만료 알림 설정 등 **웹 기반 통합 관리**를 제공하고, 외부 인증기관 인증서를 등록할 때 **유효성 체크로 공인 인증서의 정상 유무를 확인**하며, 등록된 인증서로 **Load Balancer 자원을 프로비저닝**할 수 있다. 생성일·만료일·대상 도메인을 Console에서 조회한다.\n\n## 주요 기능\n| 기능 | 내용 |\n|---|---|\n| 인증서 생성 | **사용자 인증서**: CA(인증기관)에서 발급받은 SSL/TLS 인증서 **등록** |\n| | **자체 발급 인증서**: 개발/테스트용 **Self-signed** 생성 |\n| 연결된 자원 조회 | **Load Balancer(HTTPS)** 와 연계해 클라이언트/서버 TLS 연결 구성 |\n| 인증서 만료 알림 | 만료 **45일 전**부터 메일(45/30/15/7/1일 전) |\n\n특장점:\n1. **간편한 생성**: 콘솔에서 간단히 생성(외부 발급 인증서는 **유효성 검증** 후 사용 가능한 것만 배포)\n2. **서비스 통합**: 등록 인증서를 **Load Balancer에 연결** → 네트워크 암호화\n3. **만료 알림**: 만료 **1일 전까지** 주기적 알림 → 만료 예정 인증서 확인/교체\n\n## 생성 ① 사용자 인증서 (CA 발급 공인 인증서)\n경로: Certificate Manager > 목록 > 생성\n\n| 항목 | 필수 | 내용 |\n|---|---|---|\n| 이름 | 필수 | Certificate Manager 이름 |\n| **Private Key** | 필수 | 개인키, **PEM 형식**, **RSA** 지원, **암호화되지 않은(복호화된) 값** |\n| **Certificate Body** | 필수 | **Server(Leaf) 인증서**, PEM 형식, **1개만** 입력 |\n| **Certificate Chain** | 선택 | 상위 인증서 PEM, **Intermediate(Sub) CA → Root CA** 순서. 공인 인증서는 **반드시 입력**, 중간 인증서가 없거나 자체 서명일 때만 생략 |\n| **인증서 유효성 검증** | 필수 | 입력한 인증서 검증 |\n\n(일반 개념) 인증서 체인 = 내 인증서(Leaf) ← 중간 CA ← 루트 CA 순으로 신뢰가 이어지는 구조.\n\n## 생성 ② 자체 발급 인증서 (Self-signed)\n- **상대적으로 보안 취약** → **개발/테스트용** 권장\n- **Common Name**(필수): 인증서를 쓸 **도메인 이름**\n- **Organization Unit**(필수): **조직·부서**\n- 인증서 시작일(생성일), 만료일\n- 만료 알림: 45/30/15/7/1일 전 메일\n\n## 만료 알림 설정과 태그\n- 만료 알림을 쓰려면 **Notification Manager에서 알림 정책 생성**\n- 알림 시작일부터 알림 그룹 대상으로 **일 1회** 발송\n- 알림 시작일: **1 ~ 60** 입력\n- 수신자 최대 **100명**\n- 태그: 자원당 최대 **50개**\n\n> [!주의]\n> 교재에는 '만료 45일 전부터 45/30/15/7/1일 전 메일'과 '알림 시작일 1~60 입력, 시작일부터 일 1회 발송'이 함께 적혀 있다(SEC3 1절 주요 기능 / 만료 알림 & 태그). 기본 알림 시점(45·30·15·7·1일 전)과 사용자 지정 알림 정책(시작일 1~60일)을 구분해 기억하고, 둘 중 하나로 단정하는 선택지는 문맥을 보고 판단한다.\n\n## 상세 정보와 해지\n- 탭: **상세 정보 / 연결된 자원 / 태그 / 작업 이력**\n- 상태: **Active / Valid**(인증서 유효)\n- 연결된 자원: 연결된 **Load Balancer ID, Listener** 및 상태 표시\n- 해지: **연결된 자원(LB Listener)이 있으면 해지 불가** → **LB Listener 연결 먼저 해지** 후 서비스 해지\n\n## WAF 구축과의 연결\nWAF 구축 시 MSP의 Console 작업 1번이 **Certificate Manager에 SSL 인증서 등록**이고, 이어서 Load Balancer의 **L7 SSL Offloading** 서비스에 이 인증서를 사용한다(4-2a).\n\n## 비교: 사용자 인증서 vs 자체 발급\n| 구분 | 사용자 인증서 | 자체 발급 인증서 |\n|---|---|---|\n| 발급 주체 | 외부 CA | Certificate Manager(Self-signed) |\n| 용도 | 운영(공인) | **개발/테스트** |\n| 입력 | Private Key, Certificate Body, Chain, 유효성 검증 | Common Name, Organization Unit, 시작·만료일 |\n| Quota | Region당 100 | Region당 100 |\n\n## 시험 포인트\n> [!시험]\n> - Private Key = **PEM, RSA, 암호화되지 않은 값**(패스프레이즈로 암호화된 키 X).\n> - Certificate Body = **Leaf 1개**, Chain = **Intermediate → Root** 순서, 공인 인증서는 Chain 필수.\n> - Self-signed: **Common Name = 도메인**, **Organization Unit = 조직·부서**, 개발/테스트용.\n> - 선행 없음, 후행 **Load Balancer**. **LB Listener 연결이 있으면 해지 불가**.\n> - 만료 알림 **45/30/15/7/1일 전**, **Notification Manager 알림 정책** 필요, 시작일 **1~60**, 일 1회, 수신자 최대 100명.\n> - Region당 사용자·자체 인증서 **각 100개**. 보안 설정 점검은 Config Inspection이지 Certificate Manager가 아니다.\n\n출처: SEC3_Certificate_Manager_Config_Inspection_정리 0·1·3절, SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 3절(WAF 구축), WA백서 02 p.22\n"}, "4-2e": {"title": "Secrets Manager", "md": "## 한눈에 보기\n**Secrets Manager**는 고객의 **민감 정보를 Secret(보안 정보) 형태로 암호화하여 안전하게 저장·관리**하는 서비스다. 애플리케이션 소스코드 내 중요 정보의 **하드 코딩을 제거**하고, Key-Value 형태로 저장된 Secret을 호출해 조회한다.\n\n- 특장점: **KMS 연동 암호화**, **IAM·IP 기반 세분화 접근 제어**, **이력·버전 추적**을 통합한 솔루션\n- Secret은 **KMS와 연계해 사용자 관리 키로 암호화**되어 저장\n- **리전 서비스**: 생성된 Secret은 **리전 내에서만** 사용 가능\n\n## 배경: 안전한 키 관리 서비스 Overview\nSEC4 교재는 KMS·Secret Vault·Secrets Manager를 '안전한 키 관리를 위한 Security 서비스'로 묶는다.\n\n| 서비스 | 요지 |\n|---|---|\n| Key Management Service | 정보를 안전하게 관리하기 위한 **암호화 키 관리**, 사용자는 암호화 키로 데이터를 암/복호화 |\n| Secret Vault | **Token 기반 임시키 발급 및 수명주기 관리**, Token으로 SCP 내 자원·외부 자원(타 CSP, On-Premises 등) 접근 |\n| Secrets Manager | 보안 정보를 암호화해 저장/관리, 세분화된 액세스 관리 정책, Secret의 **과거 버전 이력 추적**, KMS와 연계해 사용자 관리 키로 암호화 |\n\nOverview 슬라이드의 Secrets Manager 문구: \"리전(Region) 기반의 서비스를 제공하므로 Secret 생성 시 **다른 리전의 Secret에서 사용 중인 인증키를 선택할 수 없음**.\"\n\n## 구성과 주요 기능\n| 기능 | 내용 |\n|---|---|\n| Secret 생성/삭제 | Secrets Manager가 Secret을 생성/삭제·관리, 사용자는 Secret에 **Key/Value 형태**의 민감 정보를 저장 |\n| Secret 조회 | **사용자 정의 정책 및 권한 기반**으로 Secret 값 조회 |\n| 암/복호화 | **Key Management Service** 연동 |\n| **레이블 기반 버전 관리** | Secret이 **수정될 때마다 새로 생성되는 고유한 데이터 스냅샷인 버전**에 레이블을 설정해 효율적으로 관리 |\n| IP 기반 접근 제어 | 퍼블릭/프라이빗 접근 제어 |\n| 작업 이력 관리 | 작업 이력 |\n\n## 생성 절차\n1. Security > Secrets Manager > Service Home > **Secrets Manager 생성**\n2. 서비스 정보 입력\n  - **Secret명**\n  - **유형**: 암호화해 관리할 유형 선택(예: 일반 유형의 Secret)\n  - **Key/Value 입력**: Key/Value Pair, **최대 10개 Pair**, Secret 크기 **최대 64KB**\n  - **암호화 키**: Secrets Manager가 제공하는 KMS 키 또는 **사용자가 생성한 고객 관리형 KMS 키** 선택(목록에서 선택 또는 **+ 신규 생성**)\n3. 접근 제어\n  - **퍼블릭 접근 제어(필수)**: 허용 IP 입력 → 추가, **최대 10개**. 전체 삭제 버튼 있음. 0.0.0.0/24 ~ 0.0.0.0/32 대역도 등록 가능하지만 **보안에 취약** → **단일 IP 등록 권장**, /24 ~ /32 입력 가능(예: 192.168.11.1/32)\n  - **프라이빗 접근 제어(선택)**: 사용 선택 후 **프라이빗 접근 허용 리소스** 추가(팝업에서 서비스 예: Virtual Server → 리소스 체크). **사용 설정을 안 하면 동일 리전의 모든 서브넷 리소스가 접근 허용** 상태\n4. 우측 **요약** 패널에서 Secret명·유형·암호화 키와 **총 예상 청구 금액** 확인 → **생성**\n\n### 선택 가능한 KMS 키\n**암/복호화 용도의 KMS 키만** 선택 가능:\n\n| 선택 가능 | 선택 불가(예) |\n|---|---|\n| 암/복호화(**AES-256**) | 생성/검증(**HMAC**) |\n| 암/복호화 및 서명/검증(**RSA-2048**) | 서명/검증(**ECDSA**) |\n| 암/복호화(**ARIA**) | |\n\n안전한 Secret 저장을 위해 암호화 키를 **반드시 선택**해야 하므로 **KMS로 암호화 키를 사전에 생성**해 두는 것이 권장된다.\n\n## 상세 정보\n- 목록 컬럼: Secret명, 생성 일시, **최근 검색 일시**, **삭제 예정 일시**, 상태(Active)\n- 상세 탭: **상세 정보 / 버전 / 태그 / 작업 이력**\n- **Secret값**: <보기> 클릭 → **비밀번호 입력** 후 Secret값 보기 창에서 확인·수정\n- **암호화 키**: 선택한 KMS 키 이름 표시, 클릭하면 KMS 키 상세로 이동\n- 접근 정보: **URL(퍼블릭/프라이빗)** 복사, 퍼블릭 접근 허용 IP 수정, 프라이빗 접근 허용 리소스 수정\n\n## 제약 사항과 Quota\n| 항목 | 설명 | 할당량 |\n|---|---|---|\n| Secret Value Size | 암호화된 Secret값의 크기 | **65,536** |\n| Secrets | Account 내 리전당 Secret 수 | **500,000** |\n| Attached Labels for Secrets | Secret의 모든 버전에 연결된 Label 수 | (교재 표에 값 누락) |\n| Versions per Secrets | Secret의 버전 수 | (교재 표에 값 누락) |\n\n- 사용자 지정 레이블 설정 여부와 관계없이 **버전이 100개를 초과하면 가장 오래된 버전부터 삭제**\n- 한도 초과로 버전이 삭제되기 전에 **신규 Secret을 생성**하고 애플리케이션이 신규 Secret을 참조하도록 설정\n\n> [!주의]\n> SEC4 슬라이드 45의 Quota 표에서 Attached Labels / Versions per Secrets 행의 숫자가 추출 원문에 없다. 본문 문장으로 확인되는 값은 '버전 100개 초과 시 가장 오래된 버전부터 삭제'뿐이므로 레이블 수 한도는 단정하지 않는다.\n\n## 비교: Secrets Manager vs Secret Vault vs KMS\n| 구분 | Secrets Manager | Secret Vault | KMS |\n|---|---|---|---|\n| 저장 대상 | 민감 정보(Key/Value Secret) | 인증키(AES-256 암호화 저장) → Token·임시키 발급 | 암호화 키 자체 |\n| 핵심 수치 | Pair 10개, 64KB, 퍼블릭 IP 10개, 버전 100 | 임시키 최대 36시간, Token 최대 7,300일 | 회전 1~730일(기본 90), 삭제 72시간 |\n| 접근 제어 | 퍼블릭 IP(필수) + 프라이빗 리소스(선택) | IP 기반 | 사용자 정의 정책 |\n\n## 시험 포인트\n> [!시험]\n> - 암호화 키는 **암/복호화 용도 KMS 키(AES-256, RSA-2048, ARIA)만**. HMAC·ECDSA 불가.\n> - Key/Value **최대 10 Pair**, Secret **최대 64KB**(65,536), 리전당 Secret **500,000**.\n> - 퍼블릭 접근 제어 **필수**, 최대 **10개 IP**, 단일 IP 권장. 프라이빗 접근 제어는 **선택** — 미설정 시 **동일 리전 모든 서브넷 리소스 허용**.\n> - **리전 서비스**: 다른 리전 앱이 쓰려면 그 리전에 Secret을 따로 만든다.\n> - 버전 **100개 초과 시 오래된 것부터 삭제**, 수정 시마다 새 버전(스냅샷), **레이블 기반 버전 관리**.\n> - Secret 값 보기에는 **비밀번호 입력** 필요. 하드코딩 제거가 대표 활용 사례.\n\n출처: SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드 3·5·33~45·49\n"}, "4-2f": {"title": "Key Management Service", "md": "## 한눈에 보기\n**KMS(Key Management Service)** 는 중요한 데이터를 안전하게 보호하기 위해 **암호화 키를 편리하게 생성하고 안전하게 저장·관리**하는 서비스다. 사용자는 암호화 키로 데이터를 암/복호화하고, 암호화 키는 **계층적으로 암호화된 중앙 집중 암호화 키 방식**으로 관리된다.\n\n| 항목 | 값 |\n|---|---|\n| KMS Key Quota | **Region당 10,000개** |\n| 자동 회전 주기 | **1~730일**, 미입력 시 **90일** |\n| 키 삭제 | 삭제 요청 → **즉시 사용 중지**, **72시간 후 영구 삭제** |\n| 태그 | 자원당 최대 **50개** |\n| 공공 인증 알고리즘 옵션 | **SCP Sovereign에서만** 사용 가능 |\n\n## 배경: 학습목표와 키 관리 서비스 묶음\n- 클라우드 보안 Pain-point를 이해하고, **안전한 키 관리**와 **인증키 암호화 저장**으로 강화된 보안 환경에서 SCP에 접근\n- KMS와 Secret Vault의 구성·특징·세부 기능, 구축 프로세스와 Console 신청/생성·설정을 학습\n- Secrets Manager로 인증 정보와 비밀 데이터를 생성·저장·관리하고 접근 권한을 제어·감사\n\nKMS·Secret Vault·Secrets Manager의 관계는 4-2e 비교표 참고. Secrets Manager는 Secret 암호화에 KMS 키를 사용한다.\n\n## 주요 기능\n| 기능 | 내용 |\n|---|---|\n| 키 관리 | KMS로 생성된 **마스터 키**를 활용해 데이터를 암호화하는 **데이터 키를 직접 생성** |\n| 키 권한 관리 | 마스터 키 사용 권한 제어·관리(**사용자 정의 정책 기반**) |\n| 키 라이프 사이클 관리 | **키 회전**: 새 키 버전 생성, 자동 회전 주기 1~730일(미입력 시 90일) |\n| | **키 삭제**: 삭제 요청 → 즉시 사용 중지, 72시간 후 영구 삭제 |\n| | **키 작업 이력**: 작업 일시, 작업 내역 및 결과, 작업 계정 |\n\n## 서비스 구성 (키 계층)\n```\nHSM(루트 키, FIPS 140-2 Lv3) → 마스터 키 → 데이터 키 → 실제 데이터 암호화\n```\n| 키 | 역할 |\n|---|---|\n| **HSM**(Hardware Security Module) | KMS 시스템 영역의 **루트 키 저장**. 마스터 키는 **FIPS 140-2 Lv3** 표준 준수 HSM의 루트 키로 생성 |\n| **마스터 키** | 데이터를 암호화하기 위한 **데이터 키 생성에 사용** |\n| **데이터 키** | **실제 데이터 암호화**에 사용, 암호화를 수행하는 **대상 서비스별 생성** |\n\n구성 요소: 사용자 인터페이스(UI, API), 인증/권한, Key 관리(생성·삭제·회전), 데이터 암호화/복호화, 서명/검증, 작업 이력 관리. 사용자와 키 관리자가 이용한다.\n\n### 용도에 따른 키 생성\n| 번호 | 용도 | 알고리즘 |\n|---|---|---|\n| ① | 대칭 키 암호화/복호화 | **AES** |\n| ② | 생성/검증 | **HMAC** |\n| ③ | 비대칭 키 암/복호화 및 서명/검증 | **RSA** |\n| ④ | 서명/검증 | **ECDSA** |\n\n생성 화면 예시 용도: 암/복호화(AES-256), 암/복호화(ARIA). Secrets Manager 연동 시 선택 가능한 키는 AES-256, RSA-2048, ARIA(암/복호화 용도)뿐이다.\n\n## How-to\n1. **서비스 신청**: Security > Key Management Service > Service Home > **Key Management Service 생성**\n2. **생성 화면 입력**\n  - **공공 인증 알고리즘** 옵션: 선택하면 **SCP Sovereign에서만** 사용 가능\n  - **자동회전 사용**: 설정한 회전 주기마다 생성한 키의 **내부 알고리즘을 다른 값으로 변환**해 적용. 회전 주기 **1~730일**, 미입력 시 **90일**\n  - **태그**: 자원당 최대 50개, 태그 추가 → Key, Value 입력/선택\n  - 우측 **요약** 패널에서 서비스 정보와 **총 예상 청구 금액** 확인 → **완료**\n  - 목록에 생성한 키가 **Creating** 상태로 표시\n3. **상세 정보 확인**: 목록에서 자원 클릭 → 상단에 상태와 **키회전**(수동 회전) 버튼, 탭 = **상세 정보(수정 가능) / 태그 / 작업 이력**\n4. **관리**\n  - 키 **회전** 설정(자동) 및 **수동 회전** 버튼\n  - 키 **비활성화**: 해당 키를 사용하는 사용자들이 **더 이상 키를 사용할 수 없음**\n5. **해지**: 키를 해지하면 KMS의 **모든 요청 및 기능 사용 불가**. **즉시 해지** 또는 **예약 해지를 통해 72시간 후 영구 삭제**\n\n> [!주의]\n> - SEC4 슬라이드 9의 제목은 \"IPS 서비스 신청하기 / IPS의 Service Home\"으로 되어 있으나 본문 메뉴는 Security > Key Management Service다. IPS 슬라이드 문구가 남은 오기로 보인다.\n> - 슬라이드 20(해지)의 소제목이 \"KMS 키 '활성화' 설정하기\"로 되어 있는데 내용은 해지다.\n> - 키 삭제는 슬라이드 7에서 '삭제 요청 → 즉시 사용 중지, 72시간 후 영구 삭제', 슬라이드 20에서 '즉시 해지하거나 예약 해지를 통해 72시간 후 영구 삭제'로 표현된다. 72시간이라는 값은 같다.\n> - 슬라이드 5 Quota 표의 'KMS Validation Password Key(Account당 공공 인증 알고리즘 Key 생성 가능 개수)'는 숫자가 원문에 없다.\n\n## 암호화 예제 (SCP v2 Documentation > Security > Key Management Service > How-to guides)\nJava, Go, Python 예제 코드와 결과값 제공. 실제 적용 시 시나리오에 맞게 수정해야 하는 **단순 참고용**.\n\n**봉투 암호화(Envelope Encryption) 시나리오 순서**\n1. 비밀번호 정보를 봉투 암호화하기 위해 **Datakey 발급**\n2. 발급받은 Datakey로 **비밀번호 암호화**\n3. **암호화된 비밀번호 + 암호화된 Datakey**를 봉투화하여 **JSON 파일로 저장**\n4. 봉투 파일의 **Datakey를 복호화**\n5. 복호화된 Datakey로 봉투 파일의 **암호화 데이터 복호화**\n\n**데이터 서명/검증 시나리오 순서**(데이터 무결성 보증)\n1. 서명할 데이터를 **OpenAPI로 호출하여 서명**\n2. 서명된 데이터를 봉투화하여 JSON 파일로 저장\n3. 서명된 봉투 파일의 서명값을 가져옴\n4. 서명된 데이터를 **검증(Data Verification)** 하여 결과 출력\n\n## WA 백서 관점\n- **KMS로 암호화를 수행하려면 사용자가 직접 Application에 암호화 코드를 작성**해야 한다.\n- KMS를 쓰면 암호화 키를 별도로 제어·유지 관리할 필요 없이 키 라이프 사이클을 관리할 수 있다.\n- 저장 시 암호화: Block Storage는 VM 생성 시 유형을 **SSD_KMS 또는 HDD_KMS**로 선택해 볼륨 암호화, File Storage는 기본 암호화, Object Storage는 사용자가 선택. File·Object Storage 모두 **AES-256**.\n\n## 시험 포인트\n> [!시험]\n> - 키 계층: **HSM 루트 키 → 마스터 키 → 데이터 키**. HSM에 있는 것은 **루트 키**(데이터 키 X), FIPS 140-2 **Lv3**.\n> - 회전 주기 **1~730일, 기본 90일**(1~365일·30일 등은 오답). 삭제 **72시간** 후 영구 삭제.\n> - **공공 인증 알고리즘 = SCP Sovereign 전용**. Region당 KMS Key **10,000개**.\n> - 비활성화하면 그 키를 쓰는 사용자 모두 사용 불가. 수동 회전은 상세 페이지 **키회전** 버튼.\n> - 봉투 암호화 순서: Datakey 발급 → 데이터 암호화 → (암호문 + 암호화 Datakey) 봉투 저장 → Datakey 복호화 → 데이터 복호화.\n> - 용도: AES(대칭 암복호화), HMAC(생성/검증), RSA(비대칭 암복호화+서명검증), ECDSA(서명/검증).\n\n출처: SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드 1~21·47, WA백서 02 p.20~21\n"}, "4-2g": {"title": "Secret Vault 임시키 · 수명 주기", "md": "## 한눈에 보기\n**Secret Vault**는 보안이 강화된 **Token 기반의 임시키**를 발급받아 SCP 서비스 및 자원에 접근하게 하는 서비스다. **임시키의 수명주기를 관리**해 API 활용 시 보안이 강화된 환경을 유지한다.\n\n| 항목 | 값 |\n|---|---|\n| 인증키 저장 | **AES-256**으로 암호화 저장 |\n| 임시키 교체 주기/사용 기간 | 시간 단위, **최대 36시간(1.5일)** |\n| Token 사용 기간 | 인증키 유효 기간이 영구이면 **최대 7,300일(20년)**, **신청 후 변경 불가** |\n| 인증키당 상품 수 | **인증키 1개당 Secret Vault 1개** |\n| 접근 제어 | 애플리케이션이 구동되는 자원의 **IP 기반** |\n| 태그 | 자원당 최대 50개(생성 완료 후 적용) |\n\n(일반 개념) 장기 인증키를 애플리케이션에 직접 두면 유출 시 피해가 크므로, 수명이 짧은 임시키를 자동 교체하며 쓰는 방식이 더 안전하다.\n\n## 주요 기능\n| 기능 | 내용 |\n|---|---|\n| Token 인증 추가 및 인증키 암호화 저장 | **인증키를 통한 Token 발급**, **Token을 활용한 임시키 발급**, 인증키 정보를 **AES-256**으로 암호화 저장 |\n| 임시키 Life-cycle 관리 | 수명주기에 따른 **임시키 발급 및 자동교체**, **시간 단위(최대 36시간)** 교체 주기 설정 |\n| 접근제어 기능 | 사용자 애플리케이션이 구동되는 자원의 **IP 기반 접근제어** |\n\n## 동작 흐름 (순서 중요)\n1. 사용자는 **사전에 SCP Console에서 발급받은 인증키** 정보로 Secret Vault에 **Token을 요청**\n2. Secret Vault가 **Token을 생성해 발급**\n3. 발급받은 Token을 **Application에 설정**\n4. Token 정보로 API를 이용해 **OpenAPI 임시키를 발급**\n5. 발급받은 OpenAPI 임시키로 SCP 서비스·자원에 **접근·이용**\n\n- **Token** = OpenAPI 임시키를 받기 위한 인증 수단, **Token ID + Token Secret**으로 구성\n- SCP IaaS/PaaS 상품을 프로그램적으로 이용하도록 **RESTful API** 방식, **JSON** 응답\n- Overview: Token을 통해 **SCP 내 자원뿐 아니라 외부 자원(타 CSP, On-Premises 등)** 접근\n\nWA 백서(자격 증명 관리) 설계 원칙: ① **인증키 만료 기간과 접속 IP 주소를 지정**해 접근 보안 강화 ② **임시키를 사용**해 보안 강화. 영구 인증키 사용은 지양하고, 인증키 대신 Secret Vault로 Token을 발행해 임시키로 인증하면 보안을 더 강화할 수 있다.\n\n## 생성 절차 (How-to)\n1. Security > Secret Vault > Service Home > **Secret Vault 생성**\n2. 서비스 정보 입력\n  - **인증키 선택**: 사용할 인증키 선택. **인증키 관리 메뉴에서 보안 인증방식을 반드시 '임시키 인증'으로 선택**해야 함. **인증키 1개당 1개의 Secret Vault**만 신청 가능\n  - **접근 허용 IP**: **인증키 관리 > 보안설정 > 접근 허용 IP**에서도 **동일하게 설정**해야 접근 허용\n  - **암호화 대상 유형**: **\"SCP Open API Key\"**\n  - **Token 사용 기간**: 인증키 유효 기간이 **영구**이면 최대 **7,300일(20년)**. 신청 완료 후 **변경 불가**\n  - **임시키 사용 기간**: 보안 강화를 위해 **최대 1.5일(36시간)**\n  - **태그**: 자원당 최대 50개, 신규 태그는 서비스 생성 완료 후 적용\n3. 생성 완료 알림 \"Secret Vault 생성에 성공하였습니다\" → 상세 페이지(상태 **Active**)\n\n## 상세 정보\n- 상단 버튼: **임시키 교체**, **서비스 해지**\n- 탭: 상세 정보 / 태그 / 작업 이력\n- 상세 정보 항목: 서비스, 자원 유형, SRN, 자원명·자원 ID, 생성자·생성 일시, 수정자·수정 일시, **인증키(Access Key), Token ID, Token Secret(보기), Token 만료 일시, 임시키 교체 주기, 임시키 만료 일시, 접근 허용 IP**\n- 작업 이력: 작업 내역, 작업 일시, 작업 결과 등\n\n### 상태\n| 상태 | 의미 |\n|---|---|\n| **Active** | 작동 중 |\n| **To be terminated** | 서비스 해지 신청 후 **해지 대기** 상태 |\n| **Expired** | **Token 만료** 상태 |\n\n### 해지\n- 상세 페이지 우측 상단 **서비스 해지** → 알림 팝업에서 **해지 대기 기간(일)** 입력(예: 30일) → 확인\n- 해지 대기 기간 동안 상태는 **To be terminated**\n\n## 수명 주기 정리\n| 대상 | 수명 | 만료 후 |\n|---|---|---|\n| 인증키 | 인증키 관리에서 지정(영구 가능) | - |\n| Token | 최대 7,300일(인증키 영구 시), 변경 불가 | **임시키 발급 불가 → 서비스 신규 신청으로 Token 재발급** |\n| 임시키 | 최대 36시간, 자동 교체 | 교체 주기에 따라 새 임시키 |\n\n## 시험 포인트\n> [!시험]\n> - 흐름: **인증키 → Token 요청·발급 → Application에 Token 설정 → OpenAPI 임시키 발급 → 자원 접근**.\n> - 임시키 최대 **36시간(1.5일)**(7일 등은 오답). Token 최대 **7,300일**, **신청 후 변경 불가**.\n> - Token 만료 시 임시키 발급 불가 → **신규 신청**으로 Token 재발급(상세에서 연장 불가).\n> - 인증키 보안 인증방식 = **임시키 인증**, 접근 허용 IP는 인증키 관리 쪽에도 **동일 설정**, **인증키 1개당 1개** Secret Vault.\n> - 인증키는 **AES-256** 암호화 저장, 접근 제어는 **IP 기반**, Token = **Token ID + Token Secret**.\n> - 상태: Active / **To be terminated(해지 대기)** / **Expired(Token 만료)**.\n\n출처: SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드 5·22~31·48, WA백서 02 p.12~13\n"}, "4-2h": {"title": "SingleID 통합 인증 · 계정 관리", "md": "## 한눈에 보기\n**SingleID**는 **업무 시스템에 대한 사용자 통합인증 및 계정 접근통제**와 **클라우드 콘솔/자원에 대한 운영자 등 특권 계정 접근통제**를 제공한다. 다양한 접속 환경을 통합해 사용자는 **하나의 ID로** 업무 시스템에 로그인하고, 관리자는 접속을 쉽게 통제한다.\n\n```\n[사용자] 임직원·관계사·자회사·협력사\n   → [SingleID] AM(통합인증) IM(계정관리) MFA(복합인증) ADM(인증이상행위탐지) CAM(클라우드접근관리)\n   → [연동 대상] SaaS(M365, Google, Salesforce…) / On-Premises(SAP, Oracle…) / Mobile / CSP(AWS, Azure, GCP, SCP)\n```\n\n## 5대 기능\n| 기능 | 이름 | 세부 |\n|---|---|---|\n| **AM**(Access Management) | **통합인증** | SSO, 카탈로그 서비스, 멀티 브라우저 SSO |\n| **IM**(Identity Management) | **계정관리** | 디렉토리 서비스, 계정 동기화, 계정 라이프사이클 관리 |\n| **MFA**(Multi-Factor Authentication) | **복합인증** | 패스워드리스 인증, MFA, 단말 인증(인증서 기반, 별도 계약) |\n| **ADM**(Anomaly Detection Management) | **인증 이상행위 탐지** | 상황기반 통제, 위험 분석/탐지, 탐지 정책관리 |\n| **CAM**(Cloud Access Management) | **클라우드 접근관리** | 콘솔 접근통제, 자원 접근통제, 모니터링 |\n\n> [!주의]\n> 인증 이상행위 탐지는 **ADM**이지 IM이 아니다. IM은 계정·디렉토리·동기화·라이프사이클 쪽이다.\n\n## 기능 상세\n### AM (통합인증)\n- SSO 포함 다양한 애플리케이션 통합인증·접근제어, **한 번 로그인으로 추가 로그인 없이** 사용\n- **글로벌 표준 프로토콜 SAML, OIDC** 기반 사내외 업무시스템 SSO\n- **개인화된 User Portal**: 최근 사용 앱, 북마크, 「앱 폴더」 커스터마이징\n- **앱 카탈로그 & 사용 신청/승인**: 사용자가 셀프로 앱 사용 신청 → **부서장 승인**으로 권한 부여\n\n### IM (계정관리)\n- **계정·권한 프로비저닝**: 업무시스템 계정·권한(그룹) 중앙 동기화, **SCIM, LDAP, AD** 등 표준 연계\n- **통합 계정원장**: 회원가입 포탈·회원초대, **IdP 연합 기반 JIT(Just-In-Time) Provisioning**, 여러 계정 원장에서 사용자/그룹 동기화\n- **중앙화된 관리**: 사용자 정보 조회/수정, **만료주기 설정**, 그룹 정보·앱 접근 권한 정책\n\n| 구분 | 내용 |\n|---|---|\n| 애플리케이션 연동 | 표준 프로토콜 기반 연계, 연계 범위별 설정 템플릿(SAML·OIDC에서 **Provisioning Off면 계정 배포 안 함**), 프로파일 설정, **권한(Entitlement) 연동**(SaaS 앱 권한 자동 동기화) |\n| IDP 연동 | IDP 이름, 연동방식, 활성/비활성(비활성화 시 연계 정책 확인), 등록 시 이름·설명·로고·**SSO 설정**·Sign-In Key 등 |\n| Identity Store | 사용자 관리(조회/수정/삭제, 그룹 멤버십, 앱 권한, **IDP로부터 JIT Provisioning** + 수동 등록), 그룹 관리(멤버십 규칙, 앱 권한, **Inbound Provisioning** + 수동 등록) |\n| 제약 | **IM만 단독 구매** 시 IDP 연동 같은 **제약** 발생 가능 |\n\n### MFA (복합인증)\n- 취약한 ID/PW에 의존하지 않고 **2차 인증(SMS, 이메일, 생체 등) 강제화**, 정책에 따라 2차 인증 제공\n- 상황별 강제화: 사내외 접근, 주요 시스템, 관리자/운영자 접근\n- 지원 방식: SMS, 이메일, mOTP, TOTP, PIN, 생체, Knox Messenger, Knox Identity, **Passkey**, Active Directory (mOTP·TOTP·PIN·생체는 **SingleID Authenticator 모바일 앱** 활용)\n- **MFA 단독 서비스** 가능 → **연동 방식(고객사 1차 인증 + 3가지): ① ADFS Plug-In ② API ③ RADIUS**\n- **간편터치방식**: Cloud Service / On-Premises와 API 연동\n- 시나리오: 관리자·사용자가 MFA 방식 직접 등록/삭제/수정, **Windows Hello**, **패스워드리스** 로그인\n- **Passkey**: 한 번 설정으로 **ID/PW 없이** 로그인. 사전 필수: PC **Windows Hello**, 모바일 **생체 인증** 등록. 모바일 사용 시 **카메라(QR 인식) + 블루투스(근접 인증)** 필수\n- 정책·관리: MFA Service Provider 등록(연동 방식별 화면 가이드), 허용 MFA 방식 지정, 로그인 정책(그룹·프로파일·환경별, **관리자 MFA 강제화**, **사외 접속 차단 또는 MFA 후 허용**), **MFA 이력**은 테넌트 관리자가 확인\n- 효과: 편의성(패스워드리스), 다양한 본인 확인, 주요 시스템 접근통제 강화, 외부접속 보안강화\n\n### ADM (인증 이상행위 탐지) — 위험기반인증(RBA)\n| 단계 | 내용 |\n|---|---|\n| **Pre-Authentication** | 인증 허가 **전** 디바이스 정보, 중복/동시 로그인, 위치, 시간 등 **Health Check** → 안전할 때만 인증 허용 |\n| **Post-Authorization** | 근무시간, 휴일근무, 주요 접근 시스템 등 **Context 분석** 기반 이상징후 탐지/예방 |\n\n- 탐지 예: 불가능한 시간 내 국가간 이동, 일정 패턴 로그인 실패, 퇴직자/장기휴직자 로그인 시도\n- 대응 예: 이메일 알림 후 허용, **추가 MFA 후 허용**, 접속 차단\n\n### CAM (클라우드 접근관리)\n멀티 클라우드 환경에서 **특권 사용자**의 콘솔/자원 접근 통제(특권 계정 접근관리)\n- 계정 관리·통합인증: 클라우드 기준 정보(과제/계정/사용자) 표준화, 사외 접속 등 **원천 차단**\n- 콘솔·자원 접근 제어: 접근 경로 **단일화**, **최소 권한**, **역할 기반 임시 토큰** → 장기 자격증명 탈피\n- 가시성: 권한 요청/승인 이력, 콘솔/자원 접속 이력, 비인가 접속시도 모니터링\n\n### 단말 인증 (인증서 기반, 별도 계약)\n| 구성 | 기능 |\n|---|---|\n| **CA 서버** | 사설 CA 운영, 사설 인증서 발급·유효성 관리, CA 개인키 보호, **CRL(인증서 폐기 목록)** 관리 |\n| **RA 서버** | **Cloud LAN Campus 연동** 사용자 인증, CA에 요청해 인증서 자동 발급, 망 분리용 토큰 삽입 |\n| **RA 클라이언트** | 인증서 발급·자동 설치, PC 내 인증서로 **네트워크 프로파일 자동 설정** |\n\n## SingleID 생성 (모든 서비스 > Security > SingleID)\n### ① 서비스 구성 선택 — 자동 선택 규칙\n| 선택 | 결과 |\n|---|---|\n| 여러 서비스 동시 선택 | 가능 |\n| **MFA 단독** | **간편 인증 기능 미제공**, TAP/MFA 포털에 테넌트 생성 |\n| **IM 또는 MFA** | **AM 자동 선택** |\n| **ADM** | **AM, IM, MFA 자동 선택** |\n| **CAM** | **AM, IM, MFA 자동 선택** |\n| AM+IM+MFA(± ADM) | TAP/UP/MFA 포털에 테넌트 자동 생성 |\n\n> [!주의]\n> 'MFA 단독' 행과 'IM 또는 MFA 선택 시 AM 자동 선택' 행이 함께 있다(SEC2 3절). 즉 MFA를 고르면 AM이 따라붙는 것이 기본 규칙이고, MFA 단독 구성일 때는 간편 인증이 제공되지 않는다는 제약이 붙는다. 어느 경우에도 MFA 선택 시 **IM이 자동으로 붙지는 않는다**.\n\n### ② 상세 옵션\n- 선택 서비스에 따라 **최소 Tenant 사용자 수**, **연동 지원 유닛 수량** 입력\n- **CAM** 선택 시 등록할 **리소스 Unit 수** 입력\n\n### ③ 서비스 정보\n- **Tenant명, Tenant 코드** 입력\n- 사용자 목록에서 **1명 이상** 멤버 선택해야 생성 가능\n\n### 상세 정보\n- 서비스 상태: **Active**(생성 완료) / **Creating**(생성 중) / **Terminating**(해지 중) / **Failed**(실패)\n- **CAM Portal 버튼**: **CAM 신청 시에만** 표시 / **Admin Portal 버튼**: 관리자 포털 로그인\n- 태그 자원당 **최대 50개**, 작업 이력 탭\n\n## 기대효과와 특장점\n- 비용 절감(인증·권한·세션 관리 자동화, 사고 복구 비용 절감), 실수/고의 사고 방지, **계정 도용·정보 유출 방지**, 사용자 정보·권한을 **한 곳에서** 관리\n- 하나의 ID로 **On-Premises부터 SaaS까지** 로그인, 임직원/협력사/법인/자회사 계정 **생성~폐기 라이프사이클** 관리\n- **Pre-Built Connector**로 SaaS 연계 자동화\n- 관리자에게 CSP 콘솔/자원 권한을 받아야만 접근 → **비인가자 원천 차단**\n- 설치·업그레이드·유지보수는 CSP 담당 → 운영 부담·비용 절감\n\n## 시험 포인트\n> [!시험]\n> - AM = 통합인증(**SSO, SAML/OIDC**), IM = 계정관리(**SCIM·LDAP·AD**, JIT), MFA = 복합인증(**API, ADFS Plug-In, RADIUS** 연동), ADM = **인증 이상행위 탐지**, CAM = **클라우드 특권 접근관리**.\n> - 자동 선택: **IM·MFA → AM**, **ADM·CAM → AM+IM+MFA**. MFA 단독은 간편 인증 미제공.\n> - 멀티 클라우드 특권 사용자, 경로 단일화, **역할 기반 임시 토큰**, 접속 이력 → **CAM**(CAM Portal 버튼은 CAM 신청 시에만).\n> - ADM 2단계: **Pre-Authentication**(인증 전 Health Check) / **Post-Authorization**(Context 분석).\n> - Passkey: Windows Hello / 모바일 생체 + **QR·블루투스**.\n> - 생성 시 **멤버 1명 이상**, Tenant명·코드, 태그 최대 50개.\n\n출처: SEC2_SingleID_정리 1~7절\n"}, "4-2i": {"title": "Config Inspection 취약점 진단", "md": "## 한눈에 보기\n**Config Inspection**은 **SCP 서비스별 Console 설정의 보안 수준을 진단**하는 서비스다. IAM, Networking, Database, Logging 등 영역별 **보안 체크리스트(Best Practice)** 를 제공하고, 진단 결과를 **Report**와 대시보드로 보여준다.\n\n- Best Practice = SCP가 제공하는 **필수 보안 설정 가이드**\n- **멀티 클라우드 콘솔** 보안 취약점 통합 진단: 진단 대상 Account(타 클라우드 계정 포함) 등록 → 상시 진단\n- 역할은 **진단과 결과 제공**이다. 취약 설정을 자동으로 고치지 않으며, 조치는 결과를 보고 담당자가 수행한다.\n\n## 배경: WA 백서의 자동화된 보안 진단\n- 모범 사례: **정기적으로 보안 상태를 모니터링**하고 취약점을 사전에 식별·개선해 사고를 예방한다.\n- Config Inspection은 모범 사례 기반의 **자동화된 클라우드 보안 진단 도구**로, 진단 결과를 **Account 단위**로 관리하며, **미리 설정된 스케줄에 따라 주기적으로** 또는 **사용자 요청에 따라 즉시** 수행된다.\n- 빠르게 변하는 클라우드 환경에서는 **최소 분기별, 이상적으로는 월간 단위** 정기 보안 진단을 권장한다.\n\n> [!주의]\n> 진단 범위 표현이 자료마다 다르다. SEC3 교재는 SCP 콘솔 Best Practice를 **Networking 4, Database 1, Logging 2 = 총 7개**로 제시하고 'IAM, Networking, Database, Logging 등 영역'이라고 설명한다. WA백서 02 p.10은 'IAM, Networking, Compute, Storage, Database 등 클라우드 자원 전반'이라고 적는다. 체크리스트 개수·항목을 묻는 문제는 교재의 7개 표를 기준으로 답한다.\n\n## 서비스 구성\n- 진단 대상: **SCP, AWS, Azure** 콘솔 등록 → 원하는 시점에 진단 요청 → 결과 **Report**\n  - **외부 클라우드 진단은 SCP for Samsung**에서 제공\n- Report\n  - 1) **진단 결과 목록**: Account 내 전체 진단 요청 이력\n  - 2) **진단 결과 상세**: 정상 완료된 진단 결과(진단 항목 목록)\n  - 3) **진단 항목 상세**: 항목별 상세 결과(자원 수, 자원명, 설정값 등)\n- **대시보드**: 진단 현황, 요약 결과 통합 조회\n\n## Best Practice 체크리스트 (총 7개)\n| 영역 | 개수 | 진단 항목 |\n|---|---|---|\n| **Networking** | 4 | 인터넷 접속이 불필요한 Private 서브넷은 **NAT Gateway를 사용하지 않아야** 함 |\n| | | 네트워크 연동 서비스는 **Firewall 사용** |\n| | | Security Group은 **IP와 Port 단위로 필요한 규칙만** 등록 |\n| | | 프로토콜별 원격 접속 Port는 **접근이 필요한 IP를 지정**해서 허용 |\n| **Database** | 1 | **SQL 레벨 감사 로그 저장** |\n| **Logging** | 2 | **Logging & Audit Trail 활성화**, 적용 범위를 **전체 리전/자원 유형/사용자**로 설정 |\n| | | Logging & Audit Trail **로그 파일 검증** 사용 |\n\n> [!팁]\n> Logging 2개 항목은 4-3b(Logging&Audit)의 Trail 설정(수집 리전·자원 유형·사용자, Digest 파일)과 그대로 연결된다. Object Storage 버전 관리, 인증키 만료 같은 항목은 이 7개에 없다.\n\n## 사용 절차 (How-to)\n1. **인증키 사전 생성(필수)**\n  - 인증키 만료 기한 **최대 365일**(만료 없는 키는 **영구**로 생성)\n2. **생성**: 모든 서비스 > Security > Config Inspection > 생성\n  - 사용자가 **AdministratorGroup** 사용자 그룹에 소속되어야 정상 사용\n3. **상세 정보 확인**\n4. **진단 요청**: **SCP 선택 시 Best Practice로 고정**(팝업 항목은 콘솔에 따라 다름)\n5. **진단 결과 관리 / 대시보드 / 사용자 그룹 정책 확인**\n\n### 상세 정보 항목\n| 항목 | 내용 |\n|---|---|\n| 상태 | **Ready**: 생성 후 진단 요청이 없는 상태(진단 요청 가능) |\n| SRN | SCP 고유 자원 ID |\n| **요금제** | **일반**: 진단 횟수에 따라 과금 / **월정액**: 횟수 무관 정액. **생성 후 변경 불가** |\n| 인증키 | Access Key, 사용자, 상태(Access Key와 수정 아이콘은 **생성한 사용자에게만** 표시) |\n| 진단 스케줄 | 선택한 스케줄 |\n\n- 인증키를 삭제하면 `-` 표시, 다른 사용자가 만든 자원의 인증키 정보도 `-`\n- 과금(WA백서 06 p.2): Config Inspection = **Provisioning, Per Month**\n\n> [!주의]\n> 원본 학습정리의 Overview 문구 \"Config Inspection = CLI 제공\"은 다른 자료에서 복사된 것으로 보인다(SEC3 정리 노트).\n\n## 요구사항 → 서비스 구분\n| 요구사항 | 서비스 |\n|---|---|\n| 클라우드 자원·콘솔 **보안 설정 규정 준수 점검** | **Config Inspection** |\n| SSL/TLS 인증서 등록·만료 알림 | Certificate Manager |\n| 사용자 활동(API 호출) 감사 추적 | Logging&Audit Trail |\n| 방화벽 정책 과다 오픈·만료 정책 점수화 | FPMS |\n\n## 시험 포인트\n> [!시험]\n> - Best Practice **7개 = Networking 4 + Database 1 + Logging 2**. Networking 4개: NAT GW 미사용(불필요한 Private 서브넷), 연동 서비스 Firewall 사용, SG는 IP·Port 단위 필요 규칙만, 원격 접속 Port는 IP 지정.\n> - **인증키 사전 생성** 필수(최대 365일 또는 영구), **AdministratorGroup** 소속 필요.\n> - 요금제 **일반(횟수 과금) / 월정액**, **생성 후 변경 불가**.\n> - SCP 진단은 **Best Practice 고정**, AWS·Azure 진단은 **SCP for Samsung**에서 제공.\n> - 상태 **Ready** = 생성 후 진단 요청 없음. Report 3단계: 결과 목록 → 결과 상세 → 항목 상세.\n> - 진단만 하고 **자동 조치하지 않는다**.\n\n출처: SEC3_Certificate_Manager_Config_Inspection_정리 0·2·3절, WA백서 02 p.8~10, WA백서 06 p.2\n"}, "4-3a": {"title": "ServiceWatch 이벤트 지표 · 리소스 로그", "md": "## 한눈에 보기\n> [!주의]\n> 시험 가이드(CEA-C04 4-3)는 이 항목을 **'ServiceWatch 이벤트 지표 관리 및 리소스 로그 관리'** 로 부르지만, 교재(Explore Management 2 Logging & Monitoring)와 WA 백서는 같은 기능을 **'Cloud Monitoring'** 이라는 이름으로 설명한다. 교재에는 ServiceWatch라는 명칭이 등장하지 않는다. 이 강의는 교재 기준 Cloud Monitoring으로 설명하며, 시험 문항에서 ServiceWatch 또는 Cloud Monitoring 어느 이름이 나와도 같은 기능(이벤트 지표·리소스 로그·대시보드)으로 읽으면 된다. 서비스명 변경 시점이나 기능 차이는 교재에 근거가 없으므로 단정하지 않는다.\n\n**Cloud Monitoring**은 클라우드 인프라의 안정적인 운영을 지원하는 서비스로, 운영 중인 인프라 리소스 사용 현황을 제공하고 **설정된 임계치에 따른 알림**을 제공한다.\n\n| 특징 | 내용 |\n|---|---|\n| 안정적인 컴퓨팅 자원 관리 | CPU·디스크·메모리 사용률 등 지표 확인, 이벤트 알림으로 신속한 장애 분석·대응 |\n| 편리한 모니터링 | 대시보드로 간편 설정, **Account별 기본 대시보드 + 사용자 정의 대시보드** |\n| **이벤트 지표 관리** | 이벤트 지표 설정용 웹 콘솔, 모니터링 대상의 이벤트 지표 설정(**임계치 설정과 알림 설정**) |\n| **리소스 로그 관리** | 리소스 로그 데이터 **수집/저장/검색**, 주요 키워드를 **지표화**해 조건 충족 시 자동 통보 |\n\n## 배경: 로깅·모니터링 고민과 서비스 구분\n교재가 제시하는 고민: ① 모든 활동 내역을 효율적으로 기록·관리하려면? ② 보안 감사를 위한 로그를 안전하게 보관하려면? ③ **여러 Account의 핵심 자원을 한눈에 모니터링**하려면? → ①②는 Logging & Audit(4-3b), ③은 Cloud Monitoring.\n\nWA백서 05의 구분: **Cloud Monitoring과 Network Logging은 시스템 관련 활동 기록**, **Logging & Audit은 클라우드 및 사용자의 활동 기록**이다. Cloud Monitoring의 계측 기능은 **성능 데이터 수집 및 이벤트 처리**와 **로그 데이터 수집 및 이벤트 처리** 두 가지다.\n\n## 모니터링 대상 서비스 (WA백서 05 표 5-7)\n| 구분 | 상품군 | 상품 |\n|---|---|---|\n| 성능 모니터링 | Compute | Virtual Server, GPU Server, Bare Metal Server, Multi-node GPU Cluster |\n| | Storage | Block Storage(VM), Block Storage(BM), File Storage, Object Storage |\n| | Database | EPAS, PostgreSQL, MariaDB, MySQL, MS SQL, CacheStore |\n| | Container | Kubernetes Engine, Container Registry |\n| | Networking | VPC, Load Balancer, VPN, Global CDN, Direct Connect, Cloud WAN |\n| | Data Analytics | Search Engine, Event Streams, Vertica |\n| 로그 모니터링 | Compute | Virtual Server, GPU Server, Bare Metal Server, Multi-node GPU Cluster |\n| | Database | EPAS, PostgreSQL, MariaDB, MySQL, MS SQL, CacheStore |\n| | Container | **Kubernetes Engine**(Container Registry 제외) |\n| | Data Analytics | Search Engine, Event Streams, Vertica |\n\n로그 모니터링에는 **Storage(Object Storage 등)와 Networking(Load Balancer 등)이 없다**.\n\n## 주요 기능\n### 1. 통합 대시보드\n| 구분 | 내용 |\n|---|---|\n| Account 대시보드 | 모니터링 대상과 상태 정보, **Virtual Server 주요 성능 Top5(CPU/Memory/Disk Read/Disk Write)**, 일별 이벤트 발생 현황, 대상별 이벤트 상태(**Fatal/Warning/Information**) |\n| 사용자 정의 대시보드 | 위젯 조합·배치로 특성화된 View, **여러 Account 정보를 한번에** 표시, **다른 사용자에게 공유** 가능 |\n\n표준 대시보드 화면 구성: ① 모니터링 현황(서비스별 대상 개수·상태) ② 이벤트 히스토리(**최근 7일** 이벤트 개수를 위험도별 그래프) ③ 성능별 사용률 Top5 ④ 이벤트 맵(상품별 이벤트 개수를 위험도별) ⑤ 이벤트 현황(**처리되지 않은** 이벤트 목록)\n\n사용자 정의 대시보드 생성: 상단 메뉴 '사용자 정의 대시보드 관리' → 대시보드명 입력(Account 대시보드와 **별개로 생성**) → **위젯 추가** → 위젯 선택 후 위젯명 입력\n\n| 구분 | 위젯 | 설명 |\n|---|---|---|\n| 기본 제공(6종) | 타이틀 박스 | 대시보드에 타이틀 박스 표시 |\n| | 이벤트 현황 | 발생한 이벤트 |\n| | 모니터링 현황 | 대상 개수와 상태 |\n| | 주요성능 Top5 | 특정 성능 사용률 상위 5개 대상 |\n| | 이벤트 맵 | 서비스별 이벤트 개수를 위험도별 |\n| | 이벤트 히스토리 | 날짜별 이벤트 개수를 위험도별 |\n| 커스텀(3종) | 시계열 그래프 | 선택 대상의 성능항목을 시계열로 |\n| | 현황 지표 | 선택 대상들의 성능 값 통계치와 위험도 |\n| | 인스턴스 맵 | 선택 대상들의 성능 값을 다른 농도의 색상으로 |\n\n### 2. 모니터링 대상 상세 조회\n- 대상 정보: 서비스 유형·명칭·태그, 상세 정보와 현 상태 요약 성능\n- 탭: **성능**(상품 유형별 사전 정의된 **10가지 주요 성능**의 최근 이력) / **로그**(로그별 수집량) / **이벤트**(조건을 만족해 발생한 활성 이벤트) / **에이전트**(설치·시작·중지·삭제·업데이트 명령어)\n\n### 3. 성능 모니터링(성능 분석)\n- 검색 조건: 서비스 유형(**기본값 Virtual Server**), 대상 이름, 상품 상태, 이벤트 등급, **IP**, **태그 값**\n- '상세 보기' → 모니터링 대상 상세 팝업, '상세' 버튼으로 **선택 구간 확대** 조회(성능/로그/이벤트 분석 메뉴 모두 지원)\n- **성능 비교**: 상품 유형 선택 → 대상 선택 → 성능비교 버튼. **동일 서비스 유형의 성능 항목만 비교 가능**. 서비스를 변경하면 **생성한 차트가 모두 사라짐**. 조회기간 선택/직접입력, **새로고침 주기 1·3·5·10·15분**\n\n### 4. 로그 모니터링(리소스 로그 관리)\n- **할당된 저장 공간(1GB 기본 제공)** 내 총 누적량, 일별/상품유형별/대상별 발생량\n- 로그 수집 현황: **최근 7일간** 주요 로그 수집 정보를 차트로 — 전체 가상 용량 중 누적 사용량 %, 서비스 유형별 수집량(꺾은선 = 수량(kb), 막대 = 누적 사용률), 서비스별 로그 발생 비율, 선택 서비스에서 최근 7일 로그가 가장 많은 대상 **10개**\n- 로그 검색: 로그 모니터링 대상 추가/삭제, 조건 **like, !like, =, !=, <=, >=, >, <** (예: `message like 'fail'`), 발생량 그래프, 시간별 로그 메시지. 예: 검색값 'down' → 해당 로그가 **빨간색** 표시\n- 검색한 로그로 **지표를 생성**하면 비정형 로그를 **시계열**로 표시하고 성능 화면에서 조회·**이벤트 설정** 가능\n- WA백서 05: 로그 수집용 **1GB**, **초과하면 오래된 로그부터 자동 삭제**. 로그 수집을 설정하려면 수집 대상에 **로그 에이전트**가 설치되어 있어야 함\n\n### 5. 이벤트 모니터링(이벤트 지표 관리)\n- 개별 이벤트 설정: 적용 대상 / 성능 항목 / 이벤트 템플릿 / 알림 대상자 지정\n- **템플릿 적용**: 사전 정의된 이벤트 정책 템플릿을 대상에 바로 적용\n- **이벤트 알림 필터링**: 특정 시간대 이벤트 발생을 무시\n- 알림 주소록 관리, 알림 수단 **Mail, SMS** 등\n\n## 이벤트 설정 절차\n1. **이벤트 현황 확인**: 메시지 클릭 → 이벤트 상세와 **실시간 성능 추이**\n2. **이벤트 추가**: 모니터링 대상 선택 → 이벤트 조건 설정(예: CPU 사용량 80~90%이면 알람)\n  - 대상 추가 시 **전체 서버 일괄 선택보다 성능 지표가 비슷한 서버 그룹끼리** 묶는 것이 좋음\n3. 성능 항목 클릭 → 발생 조건(위험도·임계치) 설정\n4. **알림 대상자** 검색 후 확인\n5. (선택) **이벤트 정책 템플릿**: 요건이 유사한 성능 항목을 템플릿으로 생성 → 이벤트 설정에서 '템플릿 불러오기'(예: CPU와 Memory를 하나의 템플릿으로)\n6. (선택) **이벤트 필터링**: 이름·사용 여부, **반복유형(반복안함/매일/요일)**, 적용기간, 대상 지정. **필터링 적용 중에는 이벤트가 발생해도 알림이 전달되지 않음**. 타임라인을 날짜별로, 목록에 동작 상태 표시\n\nWA백서 05: 이벤트 설정 시 **모니터링 대상, 성능 항목, 측정 유형/단위, 위험도, 임계치**를 지정하고 알림 수신 대상을 지정한다.\n\n| 위험도 | 의미 |\n|---|---|\n| **Fatal** | 가장 높은 수준, 매우 위험한 상황 |\n| **Warning** | 중간, 문제를 일으킬 수 있어 해결이 필요한 상황 |\n| **Information** | 가장 낮음, 단순 알림 수준, 참고·확인 필요 |\n\n## 에이전트 관리\n- 에이전트 = 사용 중인 상품에서 **성능값, 로그, 윈도우 이벤트**를 수집하는 모듈\n- 모니터링 대상에 사용자가 **각각 수동으로 설치**해야 함\n- 절차: 성능 분석에서 서버 선택 → 대상 상세 팝업 **에이전트 탭** → 설치할 에이전트 클릭 → **명령어 복사** 후 대상 자원에서 실행(성능·로그·윈도우 이벤트 에이전트 모두 동일)\n\n## WA 백서 활용 예\n- Cloud Monitoring으로 평균·최대 사용률, 사용 패턴 급변, 특정 기간 급증 등 **부하 패턴 분석**\n- 임계치 기반 이벤트로 지표가 범위를 넘으면 알림을 트리거\n- DDoS 대응 시 **Network In 또는 CPU 사용량** 임계치·알림 구성\n\n## 시험 포인트\n> [!시험]\n> - 시험 가이드의 **ServiceWatch = 교재의 Cloud Monitoring**(이벤트 지표·리소스 로그).\n> - 로그 저장 공간 **기본 1GB**, 초과 시 **오래된 로그부터 삭제**, 로그 수집 현황은 **최근 7일**, 이벤트 히스토리도 **최근 7일**.\n> - 로그 모니터링 대상에 **Load Balancer·Object Storage 등 Networking/Storage 없음**.\n> - 위험도 **Fatal > Warning > Information**. 대상은 **성능 지표가 비슷한 서버끼리** 묶는다.\n> - 위젯 **기본 6 + 커스텀 3**, 사용자 정의 대시보드는 **여러 Account**·**공유** 가능.\n> - 성능 비교는 **동일 서비스 유형만**, 새로고침 **1/3/5/10/15분**. 에이전트는 **수동 설치**(명령어 복사).\n> - 로그 키워드 → **지표화** → 이벤트·알림 가능. 필터링 중에는 **알림 미전달**.\n\n출처: ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드 3~4·20~57·60, WA백서 05 p.10~12·p.23~27, 시험 가이드(CEA-C04) 4-3\n"}, "4-3b": {"title": "Logging&Audit 활동 내역", "md": "## 한눈에 보기\n**Logging & Audit**은 **사용자의 활동 내역을 수집하고 분석**하는 서비스다. 모든 활동 내역을 조회해 클라우드 자원에 대한 **변경 추적, 문제 해결, 보안 검사** 등에 활용하므로 해커의 침입이나 장애 분석에 효과적으로 대응할 수 있다.\n\n| 특징 | 내용 |\n|---|---|\n| 간편한 로그 관리 | 수많은 로그를 **Trail**로 사용자의 **Object Storage**에 보관, 서버·서비스별로 따로 확인할 필요 없음 |\n| 로그 무결성 검증 | Trail로 Object Storage에 저장된 로그 파일의 **변경·수정·삭제 여부를 로그 파일 검증**으로 확인 |\n| 활동 기록 감사 | 모든 활동 내역은 **90일간 보관**되어 콘솔에서 언제든 확인 |\n\n## 배경: 로깅의 고민과 서비스 구분\n- 고민: 모든 활동 내역을 효율적으로 기록·관리하려면? 보안 감사를 위한 로그를 안전하게 보관하려면? → Logging & Audit\n- WA백서 05: **Cloud Monitoring·Network Logging = 시스템 관련 활동 기록**, **Logging & Audit = 클라우드 및 사용자의 활동 기록**. 예: 사용자가 Console에 로그인해 Virtual Server를 생성한 활동은 Logging & Audit에 기록되며, **Trail을 구성하면 기간 제약 없이 장기 보존**할 수 있다.\n- WA백서 02: Trail은 **자원에 대한 모든 API 호출을 기록**해 사용자 접근 내역을 파악하게 하며, 클라우드 보안 가시성의 핵심인 **감사 추적** 기능을 제공한다. 보안 사고 감지를 위해 **Trail + Cloud Monitoring 이벤트 설정**을 함께 쓴다.\n\n## 구성과 주요 기능\n```\n사용자 → User Console / Open API / System & Batch\n  → 활동(Virtual Server, Storage, Load Balancer, 회원가입, 로그인/로그아웃, 과제 생성/삭제, System Job …)\n  → Logs ─ View: 90일간 조회\n        └ Filtering → Trail 1·2·3 → 사용자 Object Storage(별도 저장기간 없음)\n```\n\n| 기능 | 내용 |\n|---|---|\n| **활동내역 조회** | **별도 설정 없이 90일간** 활동 로그 저장(발생시간, 자원유형, 자원명, 작업자명 등), 필터링 조회(자원 유형, 자원명, 기간, 작업결과, 작업자명, 경로) |\n| **Trail 생성** | 로깅할 대상 서비스와 계정 선택, 로그를 저장할 Object Storage 위치 선택 |\n| **Trail 관리** | Trail 리스트·상세 조회/관리, **로그 파일 검증**, **로깅 비활성화** |\n\n## 활동 내역 조회 (Hands-on)\n1. 필터: **서비스, 자원 유형, 자원명, 작업 결과, 작업자 정보**\n2. 검색 기간: **전체, 최근 30분, 최근 1시간, 최근 12시간, 직접 입력**\n3. **최대 90일**까지 확인, 항목별 **정렬(Sorting)** 가능\n4. 전체 목록을 **JSON/CSV** 파일로 다운로드\n\n조회 컬럼/조건: 작업 일시, 서비스, 대상 자원 유형, 자원명(검색어), 작업자 정보(검색어), 작업 결과(**성공/실패**)\n\n- **활동 내역 비교**: 비교할 작업 이력 체크 → 최대 **5개**까지 선택해 정보 비교\n- **파일 다운로드**: JSON 또는 CSV로 상세 내역 확인\n\n## Trail 신청 (Hands-on)\nTrail은 SCP 자원별(혹은 전체) 활동 내역을 **Object Storage를 통해 영구 보존**해 감사·보안 사고의 근거 자료로 쓴다.\n\n1. **Trail 생성** 버튼 클릭\n2. 입력 항목(Trail에 로그를 저장할 대상, 저장소, 무결성 검증 대상 선택)\n  - 1) **Trail명**\n  - 2) **수집할 리전** 지정\n  - 3) **수집할 자원의 유형** 지정\n  - 4) **활동 사용자** 선택\n  - 5) **미리 생성해 둔 Object Storage 버킷** 선택(자동 생성되지 않음)\n  - 6) 로그의 **파일형식** 지정\n  - 7) 로그 파일 위변조 검증을 위한 **Digest 파일 생성**\n\n## Trail 관리\n- Object Storage에서 Trail 로그 확인: **Bucket 선택 → Trail 선택 → 로그 파일 다운로드**\n- 로그 파일은 **JSON 또는 CSV**로 저장, 다운로드 파일은 파일 편집기로 상세 확인\n- 대상 유형·사용자 수정: Trail 상세에서 **편집** 버튼\n- **Trail 생성 및 수정 내용은 수정한 시점부터 적용되며, 1시간 단위로 저장**\n- WA백서 02: 로그 파일 검증을 활성화하면 **동일한 버킷에 digest 파일**이 저장되고, 로그 파일 검증은 **Open API나 CLI**로 수행한다.\n\n## 수치·제한\n| 항목 | 값 |\n|---|---|\n| 콘솔 활동 내역 보관/조회 | **90일**(별도 설정 없음) |\n| Trail 저장 기간 | 사용자 Object Storage, **별도 저장기간 없음(영구 보존)** |\n| 활동 내역 비교 | 최대 **5개** |\n| 저장 주기 | **1시간 단위** |\n| 파일 형식 | JSON / CSV |\n| Trail 과금 | **Pay-as-you-g
