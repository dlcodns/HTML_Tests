all** (WA06) |\n| SLA 장애 정의 | 요청에 대해 **500 또는 503 오류 코드** 반환 |\n| 월 가용률 | [1 - (장애 건수의 합)/(서비스 이용 월 총 건수의 합)] × 100 (**건수 기반**) |\n| 장애 시간 정의 | **매 5분 동안 오류 발생한 요청 건수의 합** |\n\n> [!시험]\n> - 엔드포인트 = 고유 URL / CORS = 서로 다른 출처 간 접근 정책. 둘을 바꾼 보기는 오답.\n> - OPTIONS(지원 메서드 목록) vs HEAD(헤더만). 바꾼 보기는 오답.\n> - HTTP 통합 = URL **입력**, Cloud Function 통합 = 엔드포인트 **선택**.\n> - 기본 보안: JWT, IP 접근제어(IP Restriction). API Key는 예정.\n\n출처: ApplicationService_1_API_Gateway 슬라이드1-22, WA백서 01 p.8·11·25-26, WA백서 06 p.5·13"}, "3-6b": {"title": "Queue Service", "md": "## 한눈에 보기\n- **Message Queue Service**: 서로 다른 기능을 수행하는 여러 서버 간의 **비동기(Asynchronous) 통신**을 가능하게 해 **느슨한 결합(Loose coupling)** 을 만든다.\n- 생산자(Producer)와 소비자(Consumer)의 **처리 속도나 용량이 일치할 필요 없음**. 메시지는 **큐에 안전하게 저장**되어 소비자가 준비되었을 때 처리 → 복원력 있는 구조.\n- Load Balancer(동기, 동일 기능 서버 간 분산)와 구분하는 문제가 핵심.\n\n> [!주의]\n> 담당 교재(Explore 슬라이드)에는 Queue Service 단원이 없다. 이 강의는 **WA 가용성 백서(01)의 Message Queue Service 내용**과 보안성 백서(02), DB 교재의 CacheStore(큐 기반 서비스 적합) 언급을 근거로 정리했다. 콘솔 설정 항목·수치는 교재에 없으므로 지어내지 않았다.\n\n## 배경: 종속성 관리와 결합 해제\n- 모범 사례(WA01): 종속성을 관리해 **한 구성 요소의 장애가 전체 서비스 정지로 이어지지 않거나**, 점진적 성능 저하가 일어나도록 설계.\n- 서비스 가용성은 종속된 구성 요소 중 **가장 가용성이 낮은 요소의 수준을 초과할 수 없다**.\n- 설계 원칙:\n1. 전체 종속성의 목록을 유지 관리\n2. 중요한 종속성 항목을 최소화\n3. 중요한 종속성은 중복 구성\n4. **Load Balancer나 비동기 메시징**을 사용해 요청과 응답을 결합 해제(decoupling)\n\n## 강한 결합의 문제\n- 웹 계층이 애플리케이션 계층의 **서버 IP를 직접 지정(하드코딩)** 해 요청 → 서버 간 강한 결합.\n- 애플리케이션 서버 하나가 중단되면 그 서버로 향하는 요청은 처리되지 못하고 **유실** → 일부 사용자에게 장애로 인식, 전체 안정성 저하. Auto-Scaling 같은 확장도 어려워짐.\n\n## Load Balancer vs Message Queue Service\n| 구분 | Load Balancer | Message Queue Service |\n|---|---|---|\n| 통신 방식 | **동기(Synchronous)**, 실시간 요청 처리 | **비동기(Asynchronous)** |\n| 적합한 대상 | **동일한 기능**을 수행하는 여러 서버 간 트래픽 분산 | **서로 다른 기능**을 수행하는 여러 서버 간 결합 해제 |\n| 효과 | 단일 진입점, IP 하드코딩 불필요, Auto-Scaling 서버에 자동 분산 → 확장성·탄력성 | 더 **강력한 결합 해제**. 일시적 장애·지연이 전체에 영향 없음 |\n| 메시지/요청 보존 | 대상 서버 장애 시 Health Check로 다른 서버로 분산 | 메시지가 **큐에 저장** → 소비자가 준비되면 처리 |\n| 예 | Web 서버 그룹, App 서버 그룹 앞에 배치 | 주문 접수(웹) ↔ 주문 처리(애플리케이션) 사이 |\n\n- WA01: \"서비스 간의 결합 해제를 **보다 강력하게** 구현하고자 할 경우 Message Queue Service를 사용하는 방식이 더욱 적합합니다.\"\n\n## 배치 위치와 보안 (WA02)\n| 영역 | 트래픽 | 배치되는 것 |\n|---|---|---|\n| North-South | VPC 외부 ↔ 내부 (서비스 사용자 ↔ 워크로드) | Firewall, WAF, IPS 등 보안 서비스 → 외부 공격·침입 차단 |\n| East-West | VPC 내부 구성 요소 간 (Web ↔ App ↔ DB) | **성능 향상 장치(Load Balancer, Message Queue Service 등)**, 서버 그룹 간 통신 보안은 **분산 방화벽(Security Group)** |\n- Firewall = 네트워크 경계(North-South) 트래픽 제어, Security Group = 서버 트래픽(East-West) 제어.\n- 트래픽 방향: 수신(Inbound) — 수신자 IP는 트래픽을 제어하는 서버(집합)의 IP / 송신(Outbound) — 송신자 IP는 트래픽을 제어하려는 서버(집합)의 IP.\n\n## 함께 쓰는 설계 패턴\n- **상태 비저장(Stateless) 애플리케이션**: 상태를 로컬이 아닌 외부 **상태 관리 데이터베이스**에 저장 → 새 서버가 바로 요청을 읽어 처리, 빠른 확장. 상태 관리 DB로는 빠른 읽기/쓰기 NoSQL, 고성능이 필요하면 **CacheStore(DBaaS)** 권장(WA01).\n- 교재(DB1): Redis 기반 CacheStore는 **실시간 응답이 필요한 캐시층이나 큐(Queue) 기반 서비스**에 적합.\n- 이벤트 스트림을 대량·실시간으로 수집·전달해야 하면 Event Streams(Kafka) 검토 (→ 3-7b).\n\n## 시나리오 적용\n| 문제 | 적절한 제안 | 부적절한 제안 |\n|---|---|---|\n| 주문 처리 서버 지연 시 주문 접수까지 실패 | 두 계층 사이에 **Message Queue Service**, 주문 메시지를 큐에 저장 후 처리 서버가 준비되면 처리 | 처리 서버 IP를 웹 서버에 **하드코딩**해 직접 호출 |\n| 동일 기능 웹 서버 여러 대 | 앞단에 Load Balancer | – |\n| 종속성 관리 | 전체 목록 유지, 중요 종속성 최소화·중복 구성 | – |\n| 수평 확장 쉬운 App 서버 | Stateless + CacheStore 상태 관리 | 로컬 세션 저장 |\n\n> [!시험]\n> - \"소비자가 준비되지 않으면 메시지가 유실되므로 소비자를 항상 가동\" → 틀림(큐에 저장).\n> - \"생산자와 소비자의 처리 속도가 반드시 같아야 한다\" → 틀림.\n> - \"Message Queue를 두면 Security Group이 필요 없다\" → 틀림.\n> - Message Queue Service는 **East-West** 영역. North-South 보안 장비(Firewall, WAF, IPS)와 혼동 금지.\n\n출처: WA백서 01 p.12-17, WA백서 02 p.31, DB1_Database_정리 1"}, "3-7a": {"title": "Data Analytics 기반 분석 설계", "md": "## 한눈에 보기\n- 데이터 특성(트랜잭션 / 대규모 집계 / 비정형·캐시 / 검색 / 실시간 이벤트)에 맞는 저장·분석 서비스를 고르고, **수집 → 처리 → 저장 → 분석 → 시각화** 파이프라인으로 엮는 것이 분석 설계의 핵심이다.\n- SCP Data Analytics 서비스와 기반 오픈소스 대응 (공식 페이지):\n| SCP 서비스 | 기반 오픈소스 | 교재 단원 | 강의 |\n|---|---|---|---|\n| Event Streams | Apache Kafka (AKHQ로 관리) | Data Processing | 3-7b |\n| Search Engine | Elasticsearch (ELK Stack) | Data Processing | 3-7c |\n| Data Ops | Apache Airflow (DAG) | Data Lake | 3-7d |\n| Data Flow | Apache NiFi (NAR) | Data Lake | 3-7d |\n| Vertica(DBaaS) | Vertica (Columnar, MPP) | Data Warehouse | 3-7e |\n| Quick Query | Trino (Federated Query, Iceberg) | Data Processing·Data Lake | 3-7f |\n\n## 배경: 교재 구성\n| 교재 | 학습목차 |\n|---|---|\n| Data Processing | 개요 및 용어 / Apache Kafka-AKHQ / Elasticsearch-ELK Stack / Trino-Federated Query / 퀴즈 및 학습정리 |\n| Data Warehouse | 개요 및 용어 / Columnar Storage / Massively Parallel Processing / 퀴즈 및 학습정리 |\n| Data Lake | 개요 및 용어 / Apache NiFi-NAR file / Apache Airflow-DAG / Trino-Apache Iceberg / 퀴즈 및 학습정리 |\n\n## 데이터 특성별 저장소 선택 (WA04)\n| 요구 | 선택 | 근거 |\n|---|---|---|\n| 금융·전자상거래 등 복잡한 비즈니스 트랜잭션 | 관계형 DBaaS(EPAS, MySQL, MariaDB, PostgreSQL, Microsoft SQL Server) — **OLTP** | 데이터 집계·복잡한 쿼리에 유리 |\n| 대규모 구조화 데이터 분석 | **Vertica(DBaaS)** — 컬럼 기반 고성능 **MPP** 분석(**OLAP**) | 필요한 열만 스캔 → 쿼리 성능 향상 |\n| 비정형·반정형(소셜, IoT, 클릭스트림, 로그), 동적 스키마 | NoSQL — 대용량, 낮은 지연, 수평 확장 | 단 **조인 같은 복잡한 쿼리 미지원** → 그 경우 RDB |\n| 빠른 DB 캐싱, 애플리케이션 상태 저장 | **CacheStore**(Redis 기반 in-memory) | – |\n| 짧은 지연·높은 처리량의 대량 데이터 검색 | **Search Engine**(Elasticsearch 생성·설정 자동화) | – |\n| 노드 수평 확장(Scale-Out)이 필요한 분석 | **Data Analytics 서비스**(PostgreSQL DBaaS는 Scale-Out 미지원) | DB1 |\n\n- 데이터베이스 선택은 가용성, 확장성, 데이터 구조, 처리량, 내구성 등 요구 사항에 따라 달라지며, 특히 **액세스 패턴**이 기술 선택에 큰 영향을 준다(WA04).\n- Microservice에서는 서비스별 저장소를 분리해 특성에 맞는 DB 선택: 확장성이 필요한 트래픽 관리 = NoSQL, 주문 처리 = RDBMS(무결성·트랜잭션 일관성) (WA01).\n\n## 통합 분석 파이프라인 예시 (Data Processing 교재)\n웹사이트 사용자 행동 + 웹서버 로그를 결합 분석하는 시나리오.\n\n1. **Step 1 사용자 행동·웹서버 접속 발생**: 웹서버 Access 로그 기록 + 클릭·검색·장바구니 등 행동 이벤트는 **Kafka**로 수집.\n2. **Step 2 이기종 데이터 수집·저장**\n  - 웹서버 로그 → ELK: NGINX 로그를 **Filebeat**가 수집 → **Logstash**에서 필터링·파싱 → **Elasticsearch** 저장 → Kibana로 실시간 모니터링·분석\n  - 사용자 행동 로그: Kafka로 실시간 스트리밍 → **Kafka Connector 또는 Stream Processor** → **MySQL** 적재 (예: user_behavior 테이블에 접속 시간, 사용자 ID, 클릭 정보)\n3. **Step 3 Trino In-Memory Join (Federated Query)**: MySQL과 Elasticsearch의 데이터를 **이동 없이** Trino 메모리에서 실시간 조인.\n4. **Step 4 시각화·인사이트**: Looker Studio, Tableau, Kibana 등으로 시간대별 클릭과 웹서버 응답 관계, 에러 응답이 많은 행동 유형, 특정 페이지 접근 후 이탈 그룹 분석.\n\n```\n사용자 행동 → Kafka → (Connector/Stream Processor) → MySQL ─┐\n웹서버 로그 → Filebeat → Logstash → Elasticsearch ──────────┼→ Trino(Federated Query) → BI(Looker Studio, Tableau, Kibana)\n```\n\n> [!시험]\n> 웹서버 로그 흐름 순서: **Filebeat(수집) → Logstash(파싱) → Elasticsearch(인덱싱) → Trino(조인) → BI(시각화)**. Logstash가 Elasticsearch보다 **앞**이다.\n\n## Data Lake 구성 요소와 역할 (Data Lake 교재)\n| 요구 | 기술 | 핵심 |\n|---|---|---|\n| 새 포맷 데이터 소스·커스텀 처리 로직 통합 | NiFi **NAR file** | 사용자 정의 Processor/Controller Service 패키징 → 유연한 파이프라인 |\n| 수집 → 전처리 → 적재(ETL) 배치 자동화, 스케줄링·재시도 | Airflow **DAG** | Task 순서·의존성 정의 |\n| 대규모 테이블 스냅샷·ACID·변경 이력, 특정 시점 조회 | **Apache Iceberg** (Trino와 함께) | 메타데이터 중심 테이블 관리, time-travel |\n| 이기종 저장소를 이동 없이 SQL 조인 | **Trino** Federated Query | In-Memory, 데이터 통합 분석 허브 |\n| 로그 수집·전처리 | **Logstash** | Beats/Kafka 등에서 받아 Elasticsearch로 |\n| 로그 인덱싱·검색 | **Elasticsearch** | – |\n| 대시보드 | **Kibana** | 404 비율, IP별 요청 수 등 |\n| Kafka 클러스터 운영 가시화 | **AKHQ** | 토픽·파티션·컨슈머 그룹 |\n| 대규모 집계 분석(DW) | **Vertica** | Columnar + MPP |\n\n> [!시험]\n> \"Kafka 주문 메시지와 MySQL 고객 정보를 이동 없이 SQL로 조인 → Logstash\" → 틀림. **Trino**다.\n\n## 운영·비용 고려 (WA 백서)\n| 서비스 | 배포 방식 | 과금 모델 |\n|---|---|---|\n| Event Streams, Search Engine, Vertica(DBaaS), Data Ops, Data Flow | **Provisioning** | **Per Hour** |\n| Data Query | **Pay-as-you-go** | **Per Usage(GB)** |\n| DBaaS | Provisioning | Per Hour |\n- **Cost Savings / Planned Compute** 할인 대상: Database, **Event Streams, Search Engine, Vertica(DBaaS)** (WA06 표 6-2).\n- **Cloud Monitoring** 성능·로그 모니터링 대상 Data Analytics 상품: **Search Engine, Event Streams, Vertica** (WA05 표 5-7).\n- SLA: DBaaS·Event Streams·Search Engine은 **장애 시간(분) 기반**, Quick Query는 **장애 건수 기반** 월 가용률 (WA01).\n\n> [!주의]\n> 과금표(WA06)는 **'Data Query'**, SLA표(WA01)와 시험 가이드는 **'Quick Query'** 라는 이름을 쓴다. 두 문서 사이에서 이름이 다르므로 문제에 나온 명칭 그대로 판단할 것(3-7f 참고).\n\n출처: DataAnalytics_1_Data_Processing 슬라이드2·4·11, DataAnalytics_2_Data_Warehouse 슬라이드2·4, DataAnalytics_3_Data_Lake 슬라이드2·4, DB1_Database_정리 3.C, WA백서 01 p.8·25-26, WA백서 04 p.36-38, WA백서 05 p.27, WA백서 06 p.4-5·8"}, "3-7b": {"title": "Event Streams", "md": "## 한눈에 보기\n- **Event Streams** = Apache Kafka 기반 SCP 관리형 서비스 (공식 페이지). 대용량 **실시간 이벤트 스트림**을 수집·전달한다.\n- 교재는 Kafka 운영 도구 **AKHQ**를 중심으로 다룬다: 웹 UI로 토픽·파티션·메시지·컨슈머 그룹을 조회·관리하고, **별도 Zookeeper 접근 없이** Kafka 클러스터만으로 연동.\n- 대표 사용 사례: 사용자 클릭·검색·장바구니 이벤트를 **Kafka로 실시간 스트리밍 → Kafka Connector 또는 Stream Processor → MySQL** 적재.\n\n## AKHQ (Apache Kafka 관리 콘솔)\n| 특징 | 내용 |\n|---|---|\n| 정체 | Apache Kafka 운영을 위한 **웹 기반 시각화 도구**(오픈소스) |\n| 관리 대상 | **토픽, 파티션, 메시지, 컨슈머 그룹** 조회·관리, **메시지 스키마**, 실시간 메시지 흐름 모니터링, **Kafka Connect** 관리 |\n| 연동 | **별도의 Zookeeper 접근 없이** Kafka 클러스터만으로 연동 |\n| 활용 | 운영자·개발자가 브라우저에서 Kafka 상태를 **실시간 확인·디버깅**, 클러스터 전체 구조와 동작 상태 파악, 성능 병목 원인 분석 |\n| 클라우드 의미 | Cloud 환경 Kafka 스트리밍 파이프라인을 관찰하고 이슈를 사전에 파악하는 모니터링·운영 도구 |\n| 배포 | Docker, Kubernetes 등 다양한 환경에 간단히 배포, 가볍고 빠름 → Kafka 실습 환경에도 적합 |\n\n- **Zookeeper**: 분산 시스템을 위한 중앙 집중형 서비스. 구성 정보 유지, 네이밍, 분산 동기화, 그룹 서비스 제공 → 분산 애플리케이션 관리 복잡성 감소.\n\n### AKHQ 주요 화면 12개\n| 번호 | 화면 |\n|---|---|\n| 1 | Login |\n| 2 | Nodes |\n| 3 | Node: 0 (상세) |\n| 4 | Topics |\n| 5 | Topic 생성 |\n| 6 | Topic: stream-map (메시지 데이터) |\n| 7 | Topic: stream-map (파티션 정보) |\n| 8 | Consumer Groups |\n| 9 | Schema Registry |\n| 10 | Definition 생성 (Connect) |\n| 11 | Connect |\n| 12 | Connect: file-sink-ok |\n\n> [!시험]\n> 교재 퀴즈 정답: AKHQ는 **Kafka 브로커의 노드 상태 및 컨슈머 그룹의 Lag 정보를 시각화**할 수 있다.\n> 오답 패턴: 메시지를 JSON으로 자동 변환 저장 / 메시지를 PostgreSQL에 자동 전송 / Kafka 없이 독립 수집 / Zookeeper에 반드시 직접 접근.\n\n## 사용 사례: 실시간 사용자 행동 수집\n1. 사용자가 웹사이트에서 클릭·검색·장바구니 담기 등 행동 이벤트 발생\n2. 이벤트를 **Kafka로 실시간 스트리밍**\n3. **Kafka Connector 또는 Stream Processor**를 통해 MySQL `user_behavior` 테이블에 적재(접속 시간, 사용자 ID, 클릭 정보)\n4. 이후 Trino가 MySQL(실시간 스트림 쿼리)과 Elasticsearch(인덱스 기반 트렌드 분석)를 Federated Query로 결합 (→ 3-7f)\n\n- Kafka는 **Logstash의 입력 소스**도 될 수 있다: Logstash는 Kafka나 다양한 로그 소스에서 데이터를 수집·전처리해 Elasticsearch로 전송.\n- Trino가 조회할 수 있는 소스에도 **Kafka**가 포함된다(예: Kafka의 주문 메시지 + MySQL 고객 정보 In-Memory 조인).\n\n| 요구 | 맞는 도구 | 틀린 도구 |\n|---|---|---|\n| 실시간 이벤트 수집·전달 | Kafka(Event Streams) | Airflow DAG(배치 스케줄), Trino(조회 엔진), Iceberg Time Travel |\n| Kafka 클러스터 상태 가시화 | AKHQ | Kibana(로그 시각화) |\n\n## 운영 특성 (WA 백서)\n| 항목 | 값 |\n|---|---|\n| SLA 장애 정의 | 가동 중인 **멀티 인스턴스 또는 개별 서비스가 모두** 외부 연결 및 접속을 **5분 이상** 확보하지 못하는 경우 (DBaaS, Search Engine과 동일) |\n| 월 가용률 | [1 - {장애 시간(분)합 / 서비스 이용 월 총 시간(분)의 합}] × 100 |\n| 장애 시간 | 회사(SDS)의 사유로 해당 월에 발생한 장애 시간의 합 |\n| 과금 | **Provisioning / Per Hour** |\n| 할인 | **Cost Savings, Planned Compute** 적용 대상 |\n| 모니터링 | Cloud Monitoring **성능 모니터링·로그 모니터링** 모두 대상 |\n\n> [!시험]\n> \"멀티 인스턴스 중 **하나라도** 외부 연결이 **1분 이상** 끊기면 장애\" → 틀림. **모두**, **5분 이상**.\n\n출처: DataAnalytics_1_Data_Processing 슬라이드4·6·11·13-14·19, WA백서 01 p.7, WA백서 05 p.27, WA백서 06 p.5·8"}, "3-7c": {"title": "Search Engine", "md": "## 한눈에 보기\n- **Search Engine** = SCP가 데이터 분석을 위한 **ElasticSearch 생성과 설정을 자동화**하여 제공하는 서비스. **VM에 배포**하며 **클러스터 및 Replica 구성**으로 가용성과 성능 향상 (WA04).\n- 짧은 지연 시간·높은 처리량으로 대량 데이터를 검색해야 할 때 **검색 엔진 기술**을 쓴다.\n- 교재는 ELK Stack(**Beats → Logstash → Elasticsearch → Kibana**)으로 로그 수집·처리·시각화를 설명한다. Elasticsearch 대응은 (공식 페이지).\n\n## ELK Stack 개념\n- 로그 및 비정형 데이터 분석을 위한 **통합 플랫폼**. Cloud Data Lake 환경에서 **실시간 로그 수집 및 시각화**에 적합.\n- 활용: 대규모 로그 분석, 알람 구성, 사용자 행동 추적, 실시간 운영 모니터링, 장애 분석·운영 이상 탐지·보안 분석 대시보드. **Trino와 연계**해 분석에도 사용.\n- 시스템 로그, 웹서버 Access 로그, 애플리케이션 로그를 통합 수집.\n\n| 구성 요소 | 역할 |\n|---|---|\n| **Beats** | 다양한 데이터 소스를 Elasticsearch 또는 Logstash로 보내는 **경량 데이터 수집기** |\n| **Logstash** | Kafka나 다양한 로그 소스에서 데이터를 **수집·전처리(필터링·파싱)** 해 Elasticsearch로 전송하는 **파이프라인** 구성 요소 |\n| **Elasticsearch** | 수집된 데이터를 **인덱싱**해 검색 가능한 형태로 저장 |\n| **Kibana** | Elasticsearch 위에서 **대시보드·시각화** 제공 |\n\n### Beats 종류\n| Beat | 하는 일 |\n|---|---|\n| **Metricbeat** | 시스템 및 서비스의 **메트릭** 수집·전송 |\n| **Packetbeat** | **네트워크 트래픽**을 실시간 분석·전송 |\n| **Filebeat** | **로그 파일** 수집·전송 |\n\n## 설정 예시 (Nginx 접근 로그)\n### ① Beats (filebeat.yml)\n```\nfilebeat.inputs:\n  - type: log\n    enabled: true\n    paths:\n      - /var/log/nginx/access.log\noutput.logstash:\n  hosts: [\"localhost:5044\"]\n```\n- Nginx 접근 로그 파일을 수집해 Logstash(**5044**)로 전송.\n\n### ② Logstash (logstash.conf)\n```\ninput {\n  beats {\n    port => 5044\n  }\n}\nfilter {\n  grok {\n    match => { \"message\" => \"%{COMBINEDAPACHELOG}\" }\n  }\n  date {\n    match => [ \"timestamp\", \"dd/MMM/yyyy:HH:mm:ss Z\" ]\n  }\n}\noutput {\n  elasticsearch {\n    hosts => [\"http://localhost:9200\"]\n    index => \"nginx-logs-%{+YYYY.MM.dd}\"\n  }\n}\n```\n| 부분 | 의미 |\n|---|---|\n| input beats port 5044 | Beats로부터 데이터 **수신** 포트 |\n| filter grok | **Grok 필터**: 정규 표현식으로 로그 메시지의 특정 패턴을 추출해 구조화(예: Apache 로그의 IP 주소, 타임스탬프, 요청 메서드) |\n| filter date | **타임스탬프 변환** |\n| output elasticsearch hosts 9200 | Elasticsearch 주소 |\n| index nginx-logs-%{+YYYY.MM.dd} | **날짜별 인덱스** 생성(예: nginx-logs-2025.08.03) |\n\n### ③ Elasticsearch 검색\n```\nGET /nginx-logs-2025.08.03/_search\n{\n  \"query\": {\n    \"match\": {\n      \"response\": \"404\"\n    }\n  }\n}\n```\n- nginx-logs-2025.08.03 인덱스에서 응답 코드 **404**인 로그 검색.\n\n### ④ Kibana 대시보드\n| 기능 | 용도 |\n|---|---|\n| **Discover** 탭 | 실시간 로그 탐색 |\n| **Visualization** | 404 비율, IP별 요청 수 등 그래프 |\n| **Dashboard** | 여러 시각화 결과를 통합한 운영 대시보드 |\n\n- 교재 슬라이드 9는 ELK Stack과 **OpenSearch Cluster Components** 구성도를 함께 제시한다(그림만 있음).\n\n> [!시험]\n> - Logstash 역할 = **로그를 수집하고 필터링해 Elasticsearch로 전달**(교재 퀴즈 정답). 시각화(Kibana), RDB 직접 적재, 스케줄 정의(Airflow)는 오답.\n> - \"Elasticsearch가 Grok으로 파싱 후 Logstash로 전달\" → 틀림(방향·역할 반대).\n> - Packetbeat(네트워크) ↔ Filebeat(로그 파일) 바꾼 보기 → 틀림.\n> - 수신 포트 5044(Beats→Logstash) vs 9200(Elasticsearch). date 필터는 IP 추출이 아니라 타임스탬프 변환.\n\n## 운영 특성 (WA 백서)\n| 항목 | 값 |\n|---|---|\n| SLA 장애 정의 | 가동 중인 멀티 인스턴스 또는 개별 서비스가 **모두** 외부 연결·접속을 **5분 이상** 확보하지 못하는 경우 |\n| 월 가용률 | 장애 시간(분) 기반 |\n| 과금 | **Provisioning / Per Hour** |\n| 할인 | Cost Savings, Planned Compute 대상 |\n| 모니터링 | Cloud Monitoring 성능·로그 모니터링 대상 |\n\n출처: DataAnalytics_1_Data_Processing 슬라이드4·7-9·15-16·19, WA백서 04 p.38, WA백서 01 p.7, WA백서 05 p.27, WA백서 06 p.5·8"}, "3-7d": {"title": "Data Ops · Data Flow", "md": "## 한눈에 보기\n| SCP 서비스 | 기반 오픈소스 (공식 페이지) | 핵심 개념 | 한 줄 요약 |\n|---|---|---|---|\n| **Data Flow** | Apache NiFi | **NAR file**(NiFi Archive) | 데이터 수집·변환 흐름을 Processor로 구성, 사용자 정의 Processor를 NAR로 패키징해 확장 |\n| **Data Ops** | Apache Airflow | **DAG**(Directed Acyclic Graph) | 파이프라인을 Task 단위로 정의하고 순서·스케줄·재시도로 워크플로 자동화 |\n\n- 둘 다 **Provisioning / Per Hour** 과금(WA06).\n\n## Data Flow — Apache NiFi와 NAR file\n### 개념\n- **NAR(NiFi Archive) 파일**: 사용자 정의 **Processor**나 **Controller Service**를 패키징한 **플러그인 단위** → 데이터 플로우를 손쉽게 확장·배포.\n- 정형·비정형 데이터를 다양한 소스에서 안정적으로 수집·전처리, **데이터 수집·변환의 반복 자동화**(반복적인 ETL 자동화).\n- Cloud Data Lake에서는 NAR 기반 확장성 덕분에 **새로운 포맷의 데이터 소스나 커스텀 처리 로직**을 손쉽게 통합 → 유연한 파이프라인.\n- NiFi **기본 Processor로 대부분의 ETL 시나리오 구현 가능**. 복잡한 비즈니스 로직, 외부 연동, 조직 특화 요구가 있으면 **사용자 정의 Processor(Extension)** 를 개발하고 NAR로 배포해 확장.\n\n### NiFi 아키텍처 (Illustrative)\n- 데이터 흐름 예: GetTwitter → UpdateAttribute → ReplaceText → PutElasticsearch\n- OS/Host > JVM > Web Server, **Flow Controller**(Processor 1 … **Extension N**), 로컬 저장소: **FlowFile Repository / Content Repository / Provenance Repository**\n\n### 사용자 정의 Processor 배포 절차\n1. 기본 Processor 사용\n2. 커스텀 로직이 필요한 지점 식별\n3. 사용자 정의 Processor 코드 작성(**onTrigger**)\n4. Maven 프로젝트(nifi-my-custom-filter: api / impl / nar, pom.xml)로 **NAR 빌드**\n5. **Extension으로 Flow Controller에 배포**\n\n예시 코드 — amount 값이 1,000,000 이상인 줄만 통과:\n```\n@Override\npublic void onTrigger(final ProcessContext context, final ProcessSession session) {\n    FlowFile flowFile = session.get();\n    if (flowFile == null) return;\n    flowFile = session.write(flowFile, (in, out) -> {\n        ... 각 줄을 split(\",\") 후 cols[3](amount) >= 1000000 이면 출력 ...\n    });\n    session.transfer(flowFile, REL_SUCCESS);\n}\n```\n\n### NiFi 용어\n| 용어 | 뜻 |\n|---|---|\n| **DataFlow Manager** | NiFi 데이터 흐름 구성 요소를 추가·제거·수정할 **권한을 가진 사용자** |\n| **FlowFile** | NiFi에서 **단일 데이터**. **속성과 콘텐츠**로 구성 |\n| **Processor** | 데이터를 수신, 외부 소스에서 가져오고·게시하며, FlowFile에서 정보를 라우팅·변환·추출하는 구성 요소 |\n| **Connection** | 툴바에서 구성 요소를 캔버스로 끌어와 **연결**해 자동화된 데이터 흐름 생성 |\n| **Controller Service** | 다른 구성 요소가 사용할 수 있도록 **정보를 제공하는 확장 포인트** |\n| **Reporting Task** | NiFi 인스턴스의 **통계 보고서**를 제공하는 **백그라운드 작업** |\n| **Process Group** | 복잡한 흐름을 높은 추상 수준에서 관리하려고 여러 구성 요소를 **그룹화** |\n| **Template** | 흐름의 일부·전체를 템플릿으로 만들어 **재사용** |\n\n> [!시험]\n> - NAR의 주요 기능 = **사용자 정의 Processor를 패키징해 배포·확장 용이**(교재 퀴즈 정답). 데이터 정제 알고리즘 생성, DAG 자동 생성, Hive Metastore 메타데이터 관리는 오답.\n> - DataFlow Manager(사용자) ↔ Reporting Task(통계 백그라운드 작업) 바꾼 보기 주의.\n\n## Data Ops — Apache Airflow와 DAG\n### 개념\n- **DAG(Directed Acyclic Graph)**: Airflow에서 워크플로 실행을 위한 **전체 실행 계획**. 복잡한 파이프라인을 **작업(Task) 단위**로 구성하고 **순서**를 정의해 실행을 자동화.\n- **수집 → 전처리 → 적재(ETL)** 단계별 논리를 시각화하고, **스케줄링 및 재시도/오류 감지**로 안정적 처리 보장.\n- Cloud Data Lake와 결합 시 다양한 소스/타겟 간 데이터 흐름을 통제, **배치 기반** 분석 작업을 **재현 가능하고 관리 가능한** 방식으로 실행.\n- 이름 그대로 **방향성이 있고 순환하지 않는(Acyclic)** 그래프.\n\n### DAG 코드 예시\n```\nwith DAG(\n    dag_id=\"my_workflow\",\n    start_date=datetime(2024, 1, 1),\n    schedule_interval=\"0 0 * * *\",\n    default_args={\"retries\": 1, \"retry_delay\": timedelta(minutes=5)},\n    catchup=False\n) as dag:\n    a = PythonOperator(task_id=\"a\", python_callable=fetch_data)\n    b = PythonOperator(task_id=\"b\", python_callable=preprocess)\n    c = PythonOperator(task_id=\"c\", python_callable=aggregate)\n    d = PythonOperator(task_id=\"d\", python_callable=generate_report)\n\n    a >> [b, c] >> d\n```\n- 작성 순서: ① 함수(Task 로직) 정의(fetch_data, preprocess, aggregate, generate_report) → ② DAG 설정 → ③ **Operator로 Task 생성** → ④ **의존성 정의** → ⑤ 설정 항목.\n- `a >> [b, c] >> d`: **a(fetch data) 완료 → b(preprocess)·c(aggregate) 병렬 → 둘 다 끝나면 d(generate report)**.\n- 예시 함수 동작: fetch_data는 /tmp/raw_data.txt 작성, preprocess는 대문자 변환 후 /tmp/preprocessed.txt, aggregate는 줄 수 출력, generate_report는 /tmp/report.txt 작성.\n\n### 설정 항목\n| 설정 항목 | 설명 | 예시 기능 |\n|---|---|---|\n| `schedule_interval` | DAG 실행 주기. **크론 표현식** 또는 `@daily`, `@hourly` 문자열 | `0 0 * * *` = **매일 자정** 실행 |\n| `start_date` | DAG 실행을 **시작할 기준 날짜** | 2024년 1월 1일부터 스케줄 시작 |\n| `default_args` | 각 Task에 공통 적용할 기본값 딕셔너리(retries, retry_delay, email 등) | 실패 시 최대 2회 재시도 |\n| `on_success_callback` | DAG 전체 **성공 완료 시** 실행할 콜백(알림·후속 처리) | Slack·이메일 알림 |\n\n> [!주의]\n> 교재 표의 default_args 예시는 \"실패 시 최대 **2회** 재시도\"지만, 같은 슬라이드 코드는 `retries: 1`, `retry_delay: 5분`이다. 코드 문제가 나오면 코드 값을 기준으로 읽을 것.\n\n> [!시험]\n> - DAG = **ETL 파이프라인의 각 단계(Task)를 순서와 함께 정의**(교재 퀴즈 정답). \"순환 가능한 그래프\", \"SQL 질의 최적화\", \"단일 노드에서만 실행\"은 오답.\n> - `0 0 * * *`은 매시 정각이 아니라 **매일 자정**. start_date는 종료일이 아니라 **시작 기준일**. 성공 알림은 **on_success_callback**.\n> - \"NAR 배포 시 DAG 자동 생성\" → 틀림(NAR=NiFi 확장, DAG=Airflow에서 직접 코드로 정의).\n\n## NiFi vs Airflow 비교\n| 구분 | Data Flow (NiFi) | Data Ops (Airflow) |\n|---|---|---|\n| 초점 | 데이터 **수집·라우팅·변환 흐름** | 작업(Task) **오케스트레이션·스케줄링** |\n| 단위 | FlowFile, Processor | Task, Operator, DAG |\n| 확장 | NAR(사용자 정의 Processor/Controller Service) | Python 코드로 Task 정의 |\n| 신뢰성 기능 | Repository(FlowFile/Content/Provenance) | 스케줄링, 재시도, 오류 감지, 콜백 |\n| 적합 | 새 포맷 소스·커스텀 변환 로직 통합 | 배치 ETL 자동화·재현 |\n\n출처: DataAnalytics_3_Data_Lake 슬라이드2·4-8·13-16·19, WA백서 06 p.5"}, "3-7e": {"title": "Vertica (DBaaS)", "md": "## 한눈에 보기\n- **Vertica** = 컬럼 단위(Column-based) 저장 방식을 채택한 **분석 전용 데이터베이스**이자 **MPP 아키텍처 기반 수평 확장형 분산 분석 플랫폼**. SCP는 Vertica(DBaaS)로 **컬럼 기반 고성능 MPP 분석 환경**(OLAP, 데이터 웨어하우스)을 제공한다.\n- 3대 키워드: **Columnar Storage**, **MPP(Shared-Nothing, Masterless)**, **K-Safe**.\n\n## 배경: OLAP와 Shared-Nothing\n- **OLAP**(Online Analytical Processing): 다차원 데이터 분석 지원 기술. 데이터 큐브로 다차원 데이터를 시각화·분석. 두 유형: **MOLAP**(다차원 DB 사용), **ROLAP**(관계형 DB 사용).\n- **Shared-Nothing**: 각 노드가 독립적으로 데이터를 저장·처리하고 다른 노드와 자원을 공유하지 않는 고확장 구조. 반대는 **Shared-Everything**(모든 노드가 데이터·자원 공유).\n- OLTP(트랜잭션)는 관계형 DBaaS, OLAP(대규모 구조화 데이터 분석)는 Vertica (WA04).\n\n## Columnar Storage (열 기반 저장)\n- 데이터를 행(Row)이 아닌 **열(Column) 단위**로 저장 → 특정 열만 읽는 쿼리의 **디스크 I/O를 획기적으로 감소**, 분석 쿼리 성능 대폭 향상.\n- 같은 열에 유사한 데이터가 반복 → **고효율 압축** 적용 → 저장 공간 최소화, **캐시 효율 극대화**.\n- 대량 데이터를 빠르게 **집계·필터링**하는 **OLAP 환경에 최적화**.\n- WA04: 하나의 열에서만 집계할 때 전체 테이블을 스캔할 필요가 없어 로우 형식보다 스캔 데이터가 적다.\n\n### 예시: 주식 호가 데이터\n| 저장 방식 | 모습 |\n|---|---|\n| Row Layout | 1행: A001, EXCH1, 204, 205, 2000, 2:38:52 … 한 행에 모든 열 |\n| Column Layout (Vertica) | Sym 열: A001, A001, …, B002 / Exch 열: EXCH1, …, EXCH2 / A001 Bid: 204, 202, 204, … / B002 Bid: 28, 29, 29, … |\n- Bid 열만 필요하면 행 전체가 아니라 **Bid 값들만** 읽으면 된다.\n- 열 의미: Sym(종목 코드), Exch(거래소), Bid(매수 호가), Ask(매도 호가), Vol(거래량), Time(거래 시간).\n\n```\nSELECT sym,\n       DATE_TRUNC('hour', time) AS hour,\n       AVG(bid) AS avg_bid,\n       AVG(ask) AS avg_ask\nFROM market_data\nGROUP BY sym, DATE_TRUNC('hour', time)\nORDER BY sym, hour;\n```\n- 종목별·시간대별 평균 매수/매도 호가 추이 분석 → 필요한 열(sym, time, bid, ask)만 읽는다.\n\n## MPP (Massively Parallel Processing)\n### 특징\n- 모든 노드가 **독립적으로** 작동, 데이터 분할과 질의 처리를 **병렬 분산** 수행 → 응답 시간 단축.\n- **노드 수를 자유롭게 조정**, 클러스터 확장으로 성능을 **선형적으로** 향상.\n- 노드 간 **공유 디스크 없는 Shared-Nothing** → 장애 시 다른 노드 영향 최소화, **고가용성(HA)**.\n- 각 노드는 독립적으로 **CPU, Memory, Disk** 보유.\n- 실시간 대시보드, 빅데이터 분석, 머신러닝 예측 등 복잡한 분석을 안정적·빠르게 처리.\n\n### 쿼리 처리 순서 (Client – Initiator – Executor)\n1. 클라이언트가 **하나의 노드에 연결**해 쿼리 전송 → 연결된 노드 = **Initiator**, 나머지 = **Executor**\n2. Initiator가 쿼리를 **파싱**하고 **실행 계획 수립**\n3. Initiator가 실행 계획을 Executor들에게 **분배**\n4. 모든 노드로부터 결과 **취합**\n5. 최종 결과를 사용자에게 **반환**\n\n### Masterless (Peer)\n- 노드는 동등한 역할(Peer). **모든 노드가 Initiator가 될 수 있음**.\n- **Name Node나 단일 장애 지점(SPOF) 없음**.\n- 모든 노드에서 쿼리 및 로드 가능, **실시간/연속 로드 및 쿼리** 지원.\n\n> [!주의]\n> WA 성능효율성 백서(04)는 MPP 일반 설명으로 \"하위 NODE들에 데이터를 분산 저장하고 **리더 노드**에서 쿼리를 수행, 리더 노드가 **파티션 키** 기반으로 쿼리를 하위 노드에 배포하고 결과를 수집·집계\"한다고 적는다. Vertica 교재는 고정 리더 없이 **접속한 노드가 Initiator**가 되는 Masterless 구조다. Vertica 문제에서는 교재(Initiator/Executor, Name Node 없음)를 기준으로 판단.\n\n## K-Safe 구조 (노드 K+1개)\n| 요소 | 내용 |\n|---|---|\n| 병렬 설계 | 분산 저장·워크로드 처리, 활성 중복 구조, 자동 복제·장애 복구·페일오버 포함 |\n| **자동 복제** | 데이터를 여러 노드에 자동 복제 → 한 노드 장애 시 다른 노드에서 복구 |\n| **장애 복구** | 장애 시 자동 **페일오버** → 가용성 유지 |\n| **활성 중복 구조**(Active Redundancy) | 모든 노드가 동등, 특정 노드에 의존하지 않고 쿼리·로드 처리 |\n- 교재 정리: 데이터는 **최소 K+1개 노드에 복제**되어 **K개 노드가 장애**를 일으켜도 고가용성과 복구 보장.\n\n| K 값 | 최소 복제 노드 | 견디는 장애 노드 |\n|---|---|---|\n| 1 | 2 | 1 |\n| 2 | 3 | 2 |\n\n## 운영 특성 (WA 백서)\n| 항목 | 값 |\n|---|---|\n| 과금 | **Provisioning / Per Hour** — 배포된 동안 비용 발생(요청·스캔량 기반 아님) |\n| 할인 | **Cost Savings, Planned Compute** 대상 |\n| 모니터링 | Cloud Monitoring 성능·로그 모니터링 대상 |\n\n> [!시험]\n> - Columnar 장점 = **필요한 열만 읽어 디스크 I/O 감소**(교재 퀴즈 정답). \"모든 쿼리에 전체 행 스캔\"(row 기반 RDBMS), \"실시간 트랜잭션 최적화\"(OLTP), \"노드 간 데이터 공유 강화\"는 오답.\n> - MPP 처리 = **Initiator가 분석, Executor가 분산 실행**(교재 퀴즈 정답). \"항상 하나의 노드에서\", \"클러스터 외부에서 계획 수립\", \"중앙 저장소에서 읽음\"은 오답.\n> - \"Name Node가 Initiator 전담\" → 틀림.\n> - \"Vertica는 행 기반 OLTP DB\" → 틀림.\n> - \"Pay-as-you-go라 미사용 시간 비용 없음\" → 틀림(용량 GB 과금은 Data Query).\n\n출처: DataAnalytics_2_Data_Warehouse 슬라이드1-14, WA백서 04 p.37, WA백서 05 p.27, WA백서 06 p.5·8"}, "3-7f": {"title": "Quick Query", "md": "## 한눈에 보기\n- **Quick Query** = Trino 기반 SCP 서비스 (공식 페이지). 서로 다른 저장소에 흩어진 데이터를 **SQL 하나로 통합 조회**하는 **Federated Query**가 핵심.\n- Trino: 다양한 이기종 데이터 소스를 SQL로 조회하는 **분산 SQL 쿼리 엔진**. 데이터를 **이동·복제하지 않고** 위치한 저장소 그대로 **In-Memory**로 실시간 분석.\n- Trino와 연계되는 고성능 테이블 포맷 **Apache Iceberg**(스냅샷, ACID, Time Travel)도 함께 출제된다.\n\n## Federated Query (Trino)\n| 특징 | 내용 |\n|---|---|\n| 정의 | **이기종 데이터 소스에 걸쳐 단일 쿼리**를 실행. 다양한 저장소의 데이터를 결합·분석, **데이터 이동 없이 통합된 뷰** |\n| 지원 소스 예 | **Kafka, MySQL, PostgreSQL, Elasticsearch, Hive, Iceberg** |\n| 동작 | **커넥터 기반**으로 각 소스의 **메타데이터 조회** → 실행 전 분석(**Planning**) 단계에서 **쿼리 최적화** |\n| 실행 | 조인을 Trino **메모리에서(In-Memory)** 수행 → 빠르고 효율적 |\n| 위상 | Cloud Data Lake에서 **데이터 통합 분석 플랫폼의 허브** |\n| 예 | Kafka의 주문 메시지 + MySQL의 고객 정보를 In-Memory 조인해 분석 보고서 생성 |\n\n### 예시 쿼리: MySQL × Elasticsearch 조인\n```\nSELECT\n  u.user_id, u.behavior,\n  l.request_uri, l.response_code, l.timestamp\nFROM\n  mysql.user_behavior u\nJOIN\n  elasticsearch.nginx_logs l\n  ON u.user_ip = l.clientip\nWHERE\n  l.timestamp >= current_date - interval '1' day;\n```\n- `카탈로그.스키마/테이블` 형태(mysql.user_behavior, elasticsearch.nginx_logs)로 서로 다른 저장소를 한 쿼리에서 참조.\n- MySQL(실시간 스트림 쿼리) + Elasticsearch(인덱스 기반 트렌드 분석)를 최근 1일 기준으로 조인 → Looker Studio, Tableau, Kibana로 시각화 (전체 시나리오는 3-7a).\n\n> [!시험]\n> - Trino Federated Query의 장점 = **데이터가 위치한 저장소 그대로 In-Memory로 실시간 분석**(교재 퀴즈 정답).\n> - 오답 패턴: \"모든 데이터를 중앙 DB로 이동·복제 후 분석\", \"시각화 전용 플랫폼\", \"JSON 형식만 지원\".\n\n## Apache Iceberg (Trino와 연계되는 테이블 포맷)\n### 개념\n- 대규모 데이터 레이크를 관리하기 위한 **오픈 소스 테이블 형식**. 일관성과 성능을 유지하면서 복잡한 데이터 관리를 간소화.\n- 대규모 테이블의 **스냅샷 관리와 ACID 트랜잭션** 지원, Trino와 함께 쓰면 대용량 분석에 적합.\n- S3, HDFS 등 **오브젝트 스토리지 기반**에서도 파일 단위가 아닌 **메타데이터 중심** 테이블 관리, **분할(partition) 전략**과 **시간여행(time-travel)** 으로 고속 쿼리·변경 이력 추적.\n- Cloud Data Lake에서 **OLAP 쿼리 성능과 데이터 일관성**을 동시에 확보, SQL 기반 대화형 분석에 최적.\n\n### 계층 구조\n| 계층 | 구성 | 내용 |\n|---|---|---|\n| **Iceberg Catalog** | 테이블별 **현재 메타데이터 포인터** | Hive Metastore, HDFS, Nessie 등 다양한 백엔드, **원자적 갱신**. 쿼리·트랜잭션은 이 포인터에서 시작 |\n| **Metadata Layer** | 메타데이터 파일 | 스냅샷 ID(s0, s1), 스키마, 파티션 스펙, 스냅샷 기록. **변경마다 새 파일 생성** → Time Travel, 스냅샷 복원, ACID |\n| | 스냅샷 기반 설계 | s0, s1 = 테이블 상태의 시점. 특정 시점 조회(**AS OF SELECT**) |\n| | 매니페스트 리스트 | 스냅샷이 참조하는 매니페스트 파일 추적. 파티션 범위, 컬럼 경계값, row 수, snapshot ID → 쿼리 최적화 |\n| **Data Layer** | 매니페스트 파일 | 데이터 파일 경로·통계. Hive와 달리 **디렉토리가 아닌 파일 단위 추적** → 병렬 처리·정합성. 파티션 정보, 컬럼별 경계값, 널 카운트, 파일 크기 |\n| | 데이터 파일 | 실제 데이터. **Parquet, ORC, Avro** 등 다양한 포맷. 필요한 파일만 읽도록 최적화(Partition Pruning, Column Projection) |\n\n### 기능 요약\n| 기능 | 설명 |\n|---|---|\n| ACID 트랜잭션 | 메타데이터 포인터의 원자적 갱신으로 정합성 보장 |\n| Time Travel | 스냅샷을 활용한 시점별 데이터 조회 |\n| Partition Pruning | 매니페스트 정보로 쿼리 범위 축소 |\n| 파일 단위 추적 | 동시성 제어·병렬 처리 용이 |\n| 데이터 통계 내장 | 쿼리 최적화(CBO, Pruning) |\n| 다양한 엔진 호환 | Trino, Spark, Flink 등과 연동 |\n\n### Trino에서 Iceberg 테이블 조회 흐름\n```\nSELECT *\nFROM iceberg.db1.table1\nWHERE order_ts >= DATE '2021-01-26'\n```\n| 단계 | 설명 |\n|---|---|\n| ① Catalog 조회 | Iceberg Catalog에서 테이블의 **최신 메타데이터 파일 위치** 조회 |\n| ② 메타데이터 열람 | 스냅샷 ID, 스키마, 파티션 정보, **manifest list** 추출 |\n| ③ 매니페스트 탐색 | 읽어야 할 **데이터 파일 목록** 추출(필터링 포함) |\n| ④ 데이터 읽기 | **필요한 파일만** 읽어 결과 생성(병렬 처리 가능) |\n\n> [!시험]\n> - 조회 순서: **Catalog → 메타데이터 → 매니페스트 → 데이터 파일**.\n> - \"Iceberg 데이터는 항상 Hive 포맷으로 저장\" → 틀림(Parquet, ORC, Avro 등). 교재 퀴즈 정답.\n> - Iceberg 정답 특징: 변경 이력 추적·시간여행, 메타데이터 중심 관리, 대규모 분산 분석에 적합.\n\n## 운영 특성 (WA 백서)\n| 항목 | Quick Query | 비교: DBaaS·Event Streams·Search Engine |\n|---|---|---|\n| SLA 장애 정의 | **SQL 쿼리 요청**이 외부 연결·접속을 **5분 이상** 확보하지 못하는 경우 | 멀티 인스턴스/개별 서비스가 모두 5분 이상 연결 불가 |\n| 월 가용률 | [1 - (장애 **건수**의 합)/(서비스 이용 월 총 **건수**의 합)] × 100 — **건수 기반** | 장애 **시간(분)** 기반 |\n| 장애 시간 정의 | 회사의 사유로 해당 월에 발생한 **장애 건수의 합** | 장애 시간의 합 |\n\n- 같은 건수 기반 SLA: API Gateway(500/503 오류, 매 5분 동안 오류 발생한 요청 건수), Backup(고객 요청 백업 실패, 재수행 성공 시 제외).\n\n> [!주의]\n> WA 비용최적화 백서(06) 과금표에는 'Quick Query'가 없고 **'Data Query — Pay-as-you-go / Per Usage(GB)'** 가 있다. WA 가용성 백서(01)·시험 가이드는 'Quick Query'로 표기한다. 같은 서비스인지 교재에서 명시하지 않으므로, 과금 문제는 보기의 명칭대로 'Data Query = 용량(GB) 기반 Pay-as-you-go'로 판단하고, Vertica·Event Streams·Search Engine(시간당 Provisioning)과 구분하라.\n\n출처: DataAnalytics_1_Data_Processing 슬라이드4·10-11·17-18·20, DataAnalytics_3_Data_Lake 슬라이드4·9-11·17-19, WA백서 01 p.7-8, WA백서 06 p.5"}, "3-1a": {"title": "VPC, 서브넷 설계", "md": "## 한눈에 보기\n- **VPC**: 퍼블릭 클라우드에서 제공되는 논리적으로 격리된 고객 전용 가상 네트워크. IP 대역은 **/16 ~ /24**.\n- **Subnet**: VPC 안에서 용도·규모에 맞게 네트워크를 세분화. IP 대역은 **/16 ~ /28**, **생성 후 CIDR 수정 불가**.\n- Quota: **Account당 VPC 5개**, **VPC당 Subnet 3개(Primary Subnet 개수만 제한)**.\n- Gateway IP는 대역의 **두 번째 값**으로 자동 설정되고, 하위 자원에는 Gateway 다음 값부터 마지막 전 IP까지 할당된다(3개 사용 불가).\n\n## 배경: 클라우드 네트워크 기초\n### 클라우드 네트워크의 특징\n| 특징 | 내용 |\n|---|---|\n| 확장성(Scalability) | 자동확장(네트워크 자원 자동 확장/축소), 탄력성(미래 서비스 확장에 따른 트래픽 증가 대응) |\n| 가용성(Availability) | 고가용성 아키텍처(여러 지역에 분산 구성), 재해 복구(자연 재해·장애 시 빠른 복구) |\n| 보안(Security) | 접근 제어(인증된 사용자만 접근), 데이터 보호(전송 중·저장 데이터 암호화) |\n| 유연성(Flexibility) | 하이브리드 클라우드 지원(온프레미스 연동), 멀티 클라우드 지원(여러 클라우드 네트워크 연결) |\n| 비용 효율성(Cost Efficiency) | 사용량 기반 과금, 네트워크 최적화(트래픽 모니터링으로 효율 관리) |\n\n### 전송 계층 프로토콜(TCP/UDP)\nOSI 7 Layer의 **4계층(Transport)** 으로, 두 종단 간 데이터의 신뢰성 있고 효율적인 전송을 담당한다(응용 프로세스 간 통신: TCP, UDP, SCTP 등). 3계층(Network)은 호스트 간 통신(IP)이다.\n\n| 구분 | TCP | UDP |\n|---|---|---|\n| 연결방식 | 연결형 | 비연결형 |\n| 신뢰성 | 신뢰성 보장 | 보장 안 함 |\n| 속도 | 상대적으로 느림(패킷 확인 과정으로 오버헤드 많음) | 빠름(오버헤드 적고 즉시 전송) |\n| 오류/순서 제어 | 패킷 도착 확인 및 재전송, 순서 맞춤 | 없음 |\n| 주요 사용처 | 웹(HTTP/HTTPS), FTP, 이메일, SSH 등 | 스트리밍, 온라인게임, 음성통화 등 |\n\n### IP 주소 체계\n| 구분 | IPv4 | IPv6 |\n|---|---|---|\n| 길이 | 32bit 논리 주소 | 128bit 차세대 주소 |\n| 표기 | 점(.)으로 구분된 10진수 4블록(8bit x 4), 예 192.168.0.1 | 16bit씩 8자리, 16진수로 변환 후 콜론(:) 구분 |\n| 전체 수 | 약 43억 개 | 약 43억 x 43억 x 43억 x 43억 개 |\n\nIPv4 주소 부족에 대한 대안: **서브넷 마스크**, **사설(Private) IP와 공인(Public) IP 체계**, **IPv6**.\n\n### CIDR(Classless Inter-Domain Routing, 사이더)\nIP 주소를 효율적으로 할당·최적화하기 위한 주소 지정 방법. `/n` 일 때 IP 개수 = 2^(32-n). **`/` 뒤 숫자가 작을수록 범위가 크다.** `0.0.0.0/0`은 모든 IP를 의미한다.\n\n| CIDR | IP 개수 | 범위(192.168.0.0 기준) |\n|---|---|---|\n| /32 | 1 | 192.168.0.0 |\n| /31 | 2 | 192.168.0.0 ~ 0.1 |\n| /30 | 4 | 192.168.0.0 ~ 0.3 |\n| /28 | 16 | (일반 개념) 192.168.0.0 ~ 0.15 |\n| /27 | 32 | 192.168.0.0 ~ 0.31 |\n| /26 | 64 | (일반 개념) 192.168.0.0 ~ 0.63 |\n| /24 | 256 | 192.168.0.0 ~ 0.255 |\n| /22 | 1,024 | 192.168.0.0 ~ 192.168.3.255 |\n| /16 | 65,536 | 192.168.0.0 ~ 192.168.255.255 |\n\n사설(Private) IP 대역:\n- `10.0.0.0/8` (10.0.0.0 ~ 10.255.255.255)\n- `172.16.0.0/12` (172.16.0.0 ~ 172.31.255.255)\n- `192.168.0.0/16` (192.168.0.0 ~ 192.168.255.255)\n\n## 배경: SCP v2 Networking Service와 v2 변화\n### Networking Service 구성\n| 서비스 | 한 줄 정의 |\n|---|---|\n| VPC | 클라우드 환경에서 독립된 가상 네트워크 제공 |\n| Security Group | VM의 트래픽을 제어하는 가상 방화벽 |\n| Firewall | VPC와 인터넷, 고객 네트워크 연결 트래픽에 방화벽 제공 |\n| VPN | 외부 네트워크와 클라우드 네트워크를 암호화된 가상 전용망으로 연결 |\n| Direct Connect | 고객 네트워크와 SCP를 안전하고 빠르게 연결 |\n| Transit Gateway | 고객 네트워크 연결 또는 여러 VPC 간 연결 허브 기능의 멀티 게이트웨이 |\n| Load Balancer | 서버 트래픽 부하 자동 분산 |\n| DNS | 간편한 도메인 설정·관리 |\n| GSLB | 특정 지역에 집중되는 트래픽을 분산하는 DNS 기반 로드 밸런싱 |\n| Global CDN | Global CDN 인프라로 콘텐츠를 빠르고 안정적으로 전송 |\n| SASE | 네트워크와 보안을 결합해 단일 클라우드 플랫폼으로 제공 |\n| Private 5G Cloud | 기업 고객 대상 Private 5G Core, Edge 솔루션 |\n| Cloud Secured SD-LAN | 고객 사업장 내 사용자 인증 기반 유무선 통합 네트워크 |\n| Cloud Last Mile | 고객 사업장과 SCP 리전 간 네트워크 연결 |\n| Cloud LAN-Data Center | 데이터센터 내 가상 네트워크 구성으로 다양한 네트워크 간 연결 |\n| Cloud WAN | SCP 리전과 글로벌 권역 간 네트워크 연결 |\n\n### v1 → v2에서 달라진 점\n| 대상 | v2 변화 |\n|---|---|\n| VPC | 구성요소에 **Transit Gateway 포함, Port·Private NAT 추가** |\n| 라우팅 | **Routing Table 제공 안 함**. 대신 Transit Gateway, Direct Connect 등에 **규칙**을 넣는 구조이며, **Subnet에 Next Hop 설정** |\n| VPC Peering | Firewall 대신 **Virtual Server의 Security Group**으로 제어 |\n| Load Balancer | 구조 변경(Load Balancer, Listener, LB 서버그룹, 멤버, 헬스체크), 크기 구분 없이 **단일 스펙** |\n| DNS | 구조 변경(Private DNS, Hosted Zone, Public Domain Name) |\n| Security Group | **서버의 포트와 연결**되는 구조, **VPC와 무관**한 구조로 변경 |\n| VPN | 특정 서버와의 연결에서 **VPC 연결**로 변경 |\n\n## VPC 개념\n### 정의와 특징\n퍼블릭 클라우드 환경에서 제공되는 **논리적으로 격리된 고객 전용 가상 네트워크**.\n- 안전한 가상 네트워크: 완벽하게 독립된 가상 네트워크, VPC와 연결된 **모든 구간에 방화벽 및 로그 관리 기능** 제공\n- 다양한 Subnet 옵션: 일반 Subnet, 외부와 차단된 서버 간 통신용 **Local Subnet**, Endpoint 연계용 **Endpoint Subnet**\n- 효율적 네트워크: 인터넷 연결·고객사 내부망 연결을 간편하게 구성, **인터넷 연결이 안 된 VPC에서도 Object Storage 접속 가능**\n\n### 구성요소\n**Subnet, Internet Gateway, NAT Gateway, Public IP, Port, VPC Endpoint, VPC Peering, Private NAT, Transit Gateway**\n\n### 생성 시 주의사항과 Quota\n| 항목 | 값 |\n|---|---|\n| VPC IP 대역(CIDR) | **/16 ~ /24** |\n| BM과 VM | **Bare Metal Server와 Virtual Server의 VPC는 분리** |\n| VPC 개수 | **Account당 5개** |\n| Subnet 개수 | **VPC당 3개**(Public/Private/Local, Primary Subnet 개수만 제한) |\n\n### VPC 생성 절차 (Networking > VPC)\n1. **VPC 이름**: 중복되지 않게, 영문·숫자 **3~20자** 이내\n2. **VPC IP 대역**: CIDR 형식, **/16 ~ /24** 범위\n  - 이후 Subnet은 이 VPC IP 대역 안에서만 생성 가능\n  - VPC 생성 후 **아이피 대역 관리 탭에서 IP 대역 추가 가능**\n\n## Subnet 개념과 설계\n### 정의와 유형\nVPC 내에서 사용자가 용도/규모에 맞게 네트워크를 세분화해 주는 서비스. 유형은 **Public, Private, Local, VPC Endpoint** 네 가지(유형별 비교는 3-1c 참고).\n\n### 설계 시 고려사항\n1. Subnet의 CIDR는 **한번 생성 후 수정 불가**\n2. Subnet IP 대역은 **/16 ~ /28** 범위\n3. 동일 VPC 내에서 워크로드에 맞게 개별 생성(예: WEB용, WAS용, Database용 Subnet)\n4. On-Premise나 타 클라우드 연동 시 **중복되지 않게** 설정\n5. 서비스 확장을 고려해 **충분히 넉넉하게** 설정\n\n### Subnet 생성 절차 (Networking > VPC > Subnet)\n1. **VPC 선택**: 선택 시 VPC IP 대역 표시\n2. **Subnet 유형**: Public, Private, Local, VPC Endpoint 중 선택\n3. **Subnet 구분**: Primary Subnet을 먼저 생성 후 그 하위에 **동일한 유형**의 Secondary Subnet 생성 가능\n  - Primary Subnet은 **최대 3개**\n  - **VPC Endpoint는 Primary Subnet만** 제공\n4. **Subnet명** 입력\n5. **IP 대역**: /16 ~ /28 범위, **Gateway 자동 설정**\n6. **IP 할당 범위**: Subnet 하위 자원에 대한 IP 할당 범위, **IP 대역 전체 / 개별 지정** 중 선택\n7. **DNS Name Server 사용**: 체크 시 SCP Default DNS인 **198.19.0.53** 외에 추가 DNS Name Server 설정, 해제 시 SCP Default DNS 사용\n8. **호스트 경로 사용**: Subnet의 **정적 라우팅 경로** 입력 용도(Subnet 하위 자원에 적용)\n\n### Subnet 설정 확인 화면\n| 항목 | 내용 |\n|---|---|\n| IP 대역 | 생성 시 입력한 CIDR |\n| Gateway IP | 자동으로 **IP 대역 내 두 번째 값** 사용 |\n| IP 할당 범위 | **Gateway IP 다음 값부터 마지막 전 IP까지** 사용 가능 → 3개 IP는 사용 불가, 여유 있게 할당 |\n| Virtual IP 관리 | 해당 Subnet의 가상 IP 예약·확인·삭제(3-1b) |\n\n계산 예:\n- `172.16.10.0/27` → 32개(0~31), Gateway `.1`, 할당 범위 `.2 ~ .30`(29개)\n- `10.0.1.0/26` → 64개, Gateway `10.0.1.1`, 할당 가능 **61개**\n- VPC `10.20.0.0/22` → 10.20.0.0 ~ 10.20.3.255이므로 `10.20.4.0/24` Subnet은 생성 불가\n\n## 네트워크 설계 전략\n### VPC 설계 전략\n| 전략 | 내용 |\n|---|---|\n| IP 주소(CIDR 블록) 설계 | 확장성·가용성 고려, **VPC Peering, VPN, Direct Connect 등 외부 연결 시 IP 충돌 방지** |\n| Subnet 역할 구분 및 분리 | 퍼블릭, 프라이빗, 데이터베이스, 관리 등 목적별 분리 |\n| 트래픽 접근 제어 설정 | Security Group, Firewall로 **최소 권한 접근** |\n| 로깅 및 모니터링 설정 | 트래픽 분석, 보안 로깅 |\n| 네이밍 규칙 지정 및 준수 | 직관적으로 알 수 있는 네이밍 |\n\n### 고가용성 전략 (SPOF 제거)\n1. **Multi-AZ 구성**: 네트워크 리소스와 컴퓨팅 자원 분산 배치\n2. **Load Balancer 활용**: 트래픽 분산, 과부하·장애 시 자동 우회\n3. **VPN 및 Direct Connect 이중화**: VPN 터널 이중화, Direct Connect 회선/경로 이중화, VPN + Direct Connect 혼합 이중화\n\n### 비용 최적화 전략(리전/AZ)\n- **동일 리전, 동일 AZ 트래픽은 무료**, 서로 다른 AZ 간 트래픽은 비용 발생, 리전 간은 더 비쌈\n- 고가용성이 꼭 필요하지 않으면 **단일 AZ 구성**으로 절감\n- 인터넷 트래픽·데이터 전송 비용은 항상 발생하는 숨은 비용이므로 모니터링으로 절감 방안 모색\n- 연결 서비스별 비용 비교는 3-1g, 3-1i, 3-1j 참고\n\n### 글로벌 확장 전략(개요)\nGlobal CDN(엣지 캐싱), DNS + GSLB(인접 지역 자동 분산), Transit Gateway + Cloud WAN(글로벌 리전과 고객 거점 연결, 사용량 만큼 과금). 상세는 해당 항목 담당.\n\n### WA 백서 관점\n- 네트워크 계층화(보안성): 모든 서버를 **기능별로 그룹화해 별도 서브넷**에 배치하고, 필요한 경우를 제외하고 **모두 프라이빗 서브넷**에 배치. 인터넷에서 VPC로의 접근 지점 최소화. 일반적으로 웹·Application·DB 3계층으로 그룹화하고 외부 진입점은 별도 경계로 구성.\n- 3계층 예시: Web/App/DB 서버에 Private IP만 연결, 외부 접근은 Bastion Server(관리자는 VPN으로 프라이빗 연결 후 경유), 인터넷에는 **Load Balancer만 개방**.\n- 가용성: 다른 정보시스템과 연결 시 **IP 주소 범위가 중첩되지 않도록** 설계하고 가급적 허브앤스포크 토폴로지 구성, 다중 VPC 조직은 VPC 수준 IP 주소 계획 수립.\n\n> [!시험]\n> VPC는 /16~/24, Subnet은 /16~/28. 둘을 바꿔 놓은 보기가 단골 오답이다.\n> Subnet CIDR는 수정 불가, VPC는 생성 후 IP 대역 '추가' 가능.\n> Gateway IP = 대역의 두 번째 값, 사용 불가 IP 3개 → /26이면 61개, /27이면 29개.\n> BM VPC와 VM VPC는 분리. Account당 VPC 5개, VPC당 Subnet 3개(Primary 기준).\n\n> [!주의]\n> '사용 불가 3개'의 구성(대역 첫 IP, Gateway IP, 마지막 IP)은 교재 문구 'Gateway IP(두 번째 값) 다음부터 마지막 전 IP까지'에서 도출한 것이다.\n\n출처: SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드 1~22, VPC 슬라이드 1~16·47~48, WA백서 02 p.25~27, WA백서 01 p.15~16\n"}, "3-1b": {"title": "NAT, Internet Gateway, NAT Gateway, Virtual IP, Public IP", "md": "## 한눈에 보기\n| 구성요소 | 한 줄 정의 | 핵심 제약 |\n|---|---|---|\n| NAT | 사설 IP를 공인 IP로 바꾸는 주소 변환 기술 | - |\n| Internet Gateway | VPC와 인터넷을 연결하는 통로 | VPC당 1개, Firewall 자동 생성 |\n| NAT Gateway | Public IP 없는 서버에 **Outbound 단방향** 인터넷용 대표 공인 IP 1개 매핑 | 생성 전 VPC-IGW 연결 필수 |\n| Public IP | IGW 업링크로 할당되는 공인 IP | 유료, 사전 예약 |\n| Virtual IP | Subnet의 가상 IP | Subnet 상세 'Virtual IP 관리'에서 예약·확인·삭제 |\n| Port | Virtual Server의 NIC 연결 지점 | VM당 5개, SG 최대 5개 |\n| Private NAT | Direct Connect로 고객사망 IP를 매핑 | VPC당 3개, DC 선행 |\n\n## NAT 개념과 목적\n**NAT(Network Address Translation)**: 사설 IP 주소를 공인 IP 주소로 변경하는 통신망의 주소 변환 기술. 외부 공개 공인(Public) IP와 내부 사설(Private) IP가 다를 때 둘을 매핑한다.\n\n주요 목적:\n1. **공인 IP 부족 해결**: 내부는 사설 IP, 외부 통신 시에만 공인 IP로 변환. 여러 내부 호스트가 **하나의 공인 IP를 공유**해 인터넷 접속 가능\n2. **보안성 강화**: 외부에서 내부 사설 IP를 직접 알 수 없어 내부 구조 파악이 어려움, 방화벽과 연계 시 외부 공격 방어에 기여\n3. **내부 네트워크 구조 변경 용이**\n\n## Internet Gateway(IGW)\n### 개념\nVPC와 인터넷을 연결하는 통로. **Subnet 내 Virtual Server가 인터넷 통신을 하려면 IGW 생성 필요.**\n- VPC의 인터넷 통신이 가능한 **업링크 연결** 제공\n- **Default 라우팅이 지정되지 않은 VPC만** 생성 가능\n- **NAT IP 주소가 할당된 인스턴스에 대해 NAT 수행**\n- IGW 생성 시 **Firewall 자동 생성**(사용을 해제해도 미사용 상태로 생성)\n- Quota: **VPC당 IGW 최대 1개**, 하나의 VPC에 **Group Gateway와 동시 생성 불가**\n\n### 생성 절차 (VPC > Internet Gateway)\n1. **VPC 선택**\n2. **구분**: Internet Gateway 선택, 이름은 **IGW_\"VPC명\"** 으로 자동 생성\n3. **Firewall을 함께 생성**\n4. **Firewall 로그 저장 여부**: Object Storage 생성 선행 필요(Object Storage 생성에는 **인증키 생성 선행** 필요)\n- NAT logging 정보는 **Management > Networking Logging** 에서 확인\n\n### 설정 확인 화면\n| 항목 | 내용 |\n|---|---|\n| Firewall 사용 | 미사용해도 자동 생성, 사용 시 Firewall 목록에서 설정 |\n| Firewall 로그 저장 여부 | Firewall 상세 화면에서 설정 |\n| NAT Gateway | NAT Gateway 생성 시 매핑됨 |\n| NAT 로그 저장 여부 | IGW를 통해 NAT되는 **VM, BM, LB, DB의 로그 및 NAT Gateway 로그**를 Object Storage 버킷에 저장, Object Storage 생성 후 '사용'으로 변경 가능 |\n\n## NAT Gateway\n### 개념\n**Public IP가 연결되지 않은 Virtual Server**에 **단방향 인터넷** 사용을 위해 **Outbound 향으로 1개의 대표 공인 IP**를 매핑해 주는 서비스.\n- VPC와 **Public/Private Subnet**을 지정해 구성\n- **생성 전 VPC와 Internet Gateway 연결 필수**\n- NAT Gateway가 연결된 **Subnet의 모든 자원**이 Outbound 인터넷 통신 가능\n- NAT Gateway용 IP: 생성 시 **사전에 예약한 Public IP를 지정하거나 새로 생성**(사설 IP 자동 할당이 아님)\n- Public IP가 없는 리소스는 이 IP로 **Outbound만** 가능 → Private IP 노출 없음, **외부에서 접근 불가**\n\n### 생성 절차 (VPC > NAT Gateway)\n1. **VPC 선택**: **Internet Gateway가 연결된 VPC만** 선택 가능\n2. **Subnet 선택**: 이름은 **NAT_GW_\"Subnet명\"** 으로 자동 생성\n3. **NAT Gateway용 IP**: 예약한 Public IP에서 선택, 없으면 새로 생성\n\n## Public IP\n### 생성 절차 (VPC > Public IP)\n1. **업링크 연결 타입 구분**: Internet Gateway를 선택하면 **Public IP 대역의 IP 자동 할당**\n- **유료** 기능\n- NAT Gateway용 IP, VPN Gateway의 원격지 통신용 IP 등으로 **사전 예약**해 사용\n\n## Virtual IP\n- Subnet 상세 정보의 **Virtual IP 관리**에서 해당 Subnet의 **가상 IP를 예약, 확인, 삭제**\n- 활용 예: 같은 Subnet의 Active-Standby 서버가 장애 시 넘겨받을 공유 IP를 미리 확보\n- Public IP(인터넷용 공인 IP), Private NAT IP(Direct Connect 고객사망 매핑용)와 구분할 것\n\n## Port\n### 개념\nVirtual Server의 **NIC(Network Card Interface)** 로 네트워크를 연결하기 위한 연결 지점.\n- VPC와 Subnet을 지정해 생성\n- VM 생성 시 함께 생성되는 **기본 Port 외에 추가 Port** 생성 시 사용\n- 기존 연결 해제 후 **다른 Virtual Server에 연결해 재사용** 가능\n- Quota: **Virtual Server당 Port 최대 5개**\n\n### 생성 절차 (VPC > Port)\n1. VPC 선택 → 2. Subnet 선택 → 3. Port명 입력\n4. **IP 할당 방식**: 자동 할당 / 직접 입력(Subnet 대역 내 할당되지 않은 고정 IP)\n5. **Security Group 사용 여부**: 적용할 SG **최대 5개** 선택\n\n## Private NAT\n### 개념\nVPC 내 compute 자원에서 **Direct Connect를 활용해 고객사망 IP를 매핑**하여 연결하는 서비스.\n- 외부 인터넷이 아닌 **사설 네트워크로만** 트래픽 전달\n- Direct Connect를 통해 고객사망으로 나갈 때 **Private NAT IP**로 통신\n- **Direct Connect가 선행** 작업으로 있어야 함\n- Quota: **VPC당 기본 Private NAT 최대 3개**\n\n### 생성 절차 (VPC > Private NAT)\n1. Private NAT명 입력\n2. **Direct Connect명 선택**: 선택 시 연결 VPC 자동 선택\n3. **NAT IP 대역**: CIDR **/22 ~ /27**, 연결된 VPC와 중복 불가, Direct Connect와 연결된 On-Prem 네트워크 IP 대역과도 중복 불가\n4. **Private NAT IP 예약** 클릭 → 생성 시 설정한 NAT IP 대역 내에서 IP 입력\n\n## 비교: 인터넷/고객망으로 나가는 방식\n| 구분 | Public IP(NAT IP) | NAT Gateway | Private NAT |\n|---|---|---|---|\n| 경로 | Internet Gateway | Internet Gateway | Direct Connect |\n| 방향 | Inbound/Outbound | **Outbound만** | 고객사망(사설망) |\n| 사용 Subnet | Public Subnet | Public/Private Subnet | - |\n| 선행 조건 | IGW | VPC-IGW 연결 | Direct Connect |\n| IP | 공인 IP | 예약 Public IP 1개(대표) | NAT IP 대역 /22~/27 내 IP |\n\n## 과금 유형(WA 백서)\n- Public IP, NAT Gateway: **Provisioning / Per Hour**\n- Internet Outbound Traffic: **Pay-as-you-go / Per Usage(GB)**\n\n> [!시험]\n> NAT Gateway는 Outbound 단방향. 외부에서 들어오는 Inbound는 불가.\n> NAT Gateway용 IP는 예약 Public IP(또는 신규 생성) — 사설 IP 자동 할당 아님.\n> NAT Gateway 생성 전 VPC-IGW 연결 필수, VPC 선택 목록에도 IGW 연결 VPC만 표시.\n> IGW: VPC당 1개, Default 라우팅 없는 VPC만, Firewall 자동 생성. 이름 IGW_VPC명 / NAT_GW_Subnet명.\n> Private Subnet의 OS 패치 다운로드(외부 접속 차단 유지) → IGW + NAT Gateway. Private NAT는 Direct Connect 고객망용.\n\n> [!주의]\n> 교재 VPC 슬라이드 43의 간지 제목은 'VPC Peering 생성하기'로 표기되어 있으나 목차(16)와 본문은 Private NAT 생성하기이다.\n\n출처: SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드 11, VPC 슬라이드 16~31·41~45·48~49, WA백서 06 p.2\n"}, "3-1c": {"title": "Public / Private / 로컬 서브넷 비교", "md": "## 한눈에 보기\nSCP v2 Subnet 유형은 **Public, Private, Local, VPC Endpoint** 4가지. Public/Private는 **Internet Gateway가 연결된 VPC에서 NAT Gateway와 NAT IP(Public IP NAT) 사용에 따라 구분**된다.\n\n## 유형별 정의\n| 유형 | 정의 | NAT 사용 | 활용 예 |\n|---|---|---|---|\n| Public Subnet | 인터넷을 통해 외부와 통신하기 위한 Subnet | **Public IP NAT 사용 가능, NAT Gateway 사용 가능** | 웹 서버, 로드 밸런서 |\n| Private Subnet | 외부 접근 없이 내부 통신하기 위한 Subnet | **Public IP NAT 사용 불가, NAT Gateway 사용 가능** | DB, 애플리케이션 서버 |\n| Local Subnet | VPC 내 다른 Subnet의 서버와 **직접 통신**을 위한 Subnet, 외부 네트워크로부터 차단된 서버 간 통신 전용 | - | **Heart Beat IP, Backup IP** |\n| VPC Endpoint Subnet | VPC와 연결된 외부 네트워크에서 **Private 연결로 SCP에 액세스**하는 Subnet | - | VPC Endpoint 구성(Primary만) |\n\n## Public vs Private 상세 비교\n| 구분 | Public Subnet | Private Subnet |\n|---|---|---|\n| 공인 IP | **할당 가능** | **할당 불가** |\n| 외부 인터넷 통신 | 직접 가능(**Inbound, Outbound**) | **NAT Gateway를 통해** 내부→외부만(**Outbound**) |\n| 외부 접근 | 가능 | **불가능** |\n| 용도 | 웹 서버, 로드 밸런서 등 외부와 직접 통신하는 리소스 | 데이터베이스, 애플리케이션 서버 등 보안상 외부 접근을 제한할 리소스 |\n\n핵심: Private Subnet도 NAT Gateway를 붙이면 **패치·업데이트 같은 Outbound 인터넷은 가능**하다. 막히는 것은 외부에서 들어오는 접근이다.\n\n## Local Subnet\n- 외부 네트워크와 차단된 상태로 **서버 간 통신만** 수행\n- VPC 내 다른 Subnet에 있는 서버와 직접 통신\n- 이중화 서버 간 **Heart Beat**, **Backup** 트래픽용 별도 IP에 적합\n- VPC 구성도에서 VM이 Private/Public Subnet과 Local Subnet에 동시에 연결된 형태(추가 Port 활용, 3-1b)로 표현됨\n\n## VPC Endpoint Subnet\n- Direct Connect, Transit Gateway와 연결된 고객사 내부망에서 VPC 외부의 SCP 서비스(Object Storage, File Storage, Container Registry, DNS 등)에 **프라이빗 연결**\n- **Primary Subnet만** 제공\n- VPC Endpoint 생성의 **선행 작업**(상세는 3-1k)\n\n## Primary / Secondary Subnet 규칙\n| 항목 | 내용 |\n|---|---|\n| 생성 순서 | Primary Subnet 먼저 → 하위에 Secondary |\n| 유형 | Secondary는 Primary와 **동일한 유형**만 |\n| 개수 제한 | **Primary Subnet 최대 3개**(VPC당 Subnet 3개 Quota는 Primary 개수만 제한) |\n| VPC Endpoint | Primary만 |\n| IP 대역 | /16 ~ /28, 생성 후 수정 불가 |\n\n## WA 백서 관점의 분류\n- 보안성 백서는 퍼블릭/프라이빗 서브넷을 **임의적 분류**로 설명한다.\n  - 퍼블릭 서브넷: **Public IP가 연결된** Virtual Server가 배포된 서브넷(인터넷과의 트래픽 관리)\n  - 프라이빗 서브넷: **Public IP를 연결하지 않은** Virtual Server가 배포된 서브넷(인터넷과 격리)\n- 설계 원칙: 서버를 기능별로 별도 서브넷에 두고, 필요한 경우를 제외하고 **모두 프라이빗 서브넷**에 배치. 외부에는 Load Balancer만 노출하고 관리는 Bastion Server 경유.\n\n## 유형 선택 가이드\n| 요구사항 | 선택 |\n|---|---|\n| 외부 사용자가 직접 접속하는 웹 서버/LB | Public |\n| 외부 접근은 막고 OS 패치는 받아야 하는 WAS/DB | Private + NAT Gateway |\n| 클러스터 Heart Beat, 백업 전용망 | Local |\n| 고객사 내부망에서 Object Storage 등에 사설 경로로 접근 | VPC Endpoint |\n\n> [!시험]\n> 'Private Subnet은 NAT Gateway도 못 쓴다'는 오답. Public IP NAT만 불가, NAT Gateway는 가능(Outbound).\n> Heart Beat·Backup IP → Local Subnet.\n> Secondary는 Primary와 같은 유형, 개수 제한은 Primary에만, VPC Endpoint Subnet은 Primary만.\n\n> [!주의]\n> VPC 정의 슬라이드는 Subnet 옵션을 '일반 Subnet / Local Subnet / Endpoint Subnet' 3분류로, Subnet 개념·생성 슬라이드는 'Public / Private / Local / VPC Endpoint' 4유형으로 표기한다. 시험에서는 생성 화면 기준 4유형으로 기억한다.\n\n출처: SCP_v2_Explore_Network_01-10 VPC 슬라이드 6·7·11·14·19, WA백서 02 p.25~28\n"}, "3-1d": {"title": "Firewall과 Security Group 비교", "md": "## 한눈에 보기\n| 구분 | Security Group | Firewall |\n|---|---|---|\n| 정의 | 가상 서버의 Inbound/Outbound 트래픽을 제어하는 **가상의 논리적 방화벽** | **VPC 및 Load Balancer**에서 발생하는 트래픽을 제어하는 가상의 논리적 방화벽 서비스 |\n| 적용 대상 | **Virtual Server, Database, K8S Engine, GPU Server** 등, **각 자원의 포트** | **Internet Gateway, Direct Connect, Load Balancer** (TGW 연결 시 BM VPC Firewall 등) |\n| 위치(WA) | 서버 트래픽 제어(**East-West**), 분산 방화벽 | 네트워크 경계(**North-South**) |\n| 기본 규칙 | Any/Deny(모든 트래픽 차단, **같은 Subnet 내 Ping·SSH도 차단**) | Any Deny(Inbound/Outbound 모두 차단) |\n| 규칙 동작 | **허용 규칙만** 등록 | **Allow / Deny** 선택, 위에서 아래로 평가·첫 일치 적용 |\n| 대상 지정 | 원격 타입: **CIDR 또는 Security Group** | 출발지/목적지 주소: CIDR/IP, 쉼표·대시 다중 입력, **목적지는 Domain도 가능** |\n| Inbound 의미 | 외부 → 서버 | VPC로 향하는 트래픽 |\n| Outbound 의미 | 서버 → 외부 | VPC에서 출발하는 트래픽 |\n| 다중 적용 | 자원 특성에 따라 **여러 SG 적용 가능**(Port당 최대 5개) | 적용 대상 서비스(IGW·DC·LB) 단위로 생성 |\n| Quota | Account당 1,000 / SG당 규칙 100 | 크기별 최대 규칙 5/100/200/500/1,000 |\n| 생성 위치 | Networking > Security Group에서 생성 | **대상 서비스(IGW, DC, LB) 생성 시 자동 생성**, Firewall 메뉴에 생성 버튼 없음 |\n| 로그 | Management > Network Logging > Security Group Logging | Management > Network Logging > Firewall Logging |\n| 일괄 입력 | 엑셀 최대 100개 | 엑셀 최대 100개(크기별 최대 규칙 초과 시 업로드 불가) |\n\n## Security Group 개념\n- 가상 서버에서 발생하는 Inbound/Outbound 트래픽을 제어하는 가상의 논리적 방화벽\n- **각 자원의 포트에 적용**, 자원 특성에 따라 여러 개 적용 가능\n- 처음 생성하면 **기본 규칙(Any/Deny)** 에 따라 모든 트래픽 차단 → **같은 Subnet 내 Ping, SSH도 차단**되므로 필요한 규칙을 설정 후 사용\n- v2 변화: SG는 **서버의 포트와 연결되는 구조로, VPC와 무관**(VPC·Subnet 단위 일괄 적용이 아님)\n- VPC Peering 구간에는 별도 Firewall이 없고 **Virtual Server의 Security Group**으로 제어\n\n## Firewall 개념\n- VPC와 인터넷, VPC와 고객 네트워크 간 통신에 규칙을 설정해 안전한 네트워크 관리\n- 처음 생성하면 **기본 규칙(Any Deny)** 으로 Inbound/Outbound 모든 트래픽 차단\n- IP 주소·포트·프로토콜을 지정하고 Inbound/Outbound 규칙을 만들어 **허용된 트래픽만** 통신\n- 규칙은 **위에서 아래로 평가**하며 **처음 일치하는 규칙**으로 허용/차단 결정\n\n### Firewall 크기와 최대 규칙 수\n| 크기 | Extra Small | Small | Medium | Large | Extra Large |\n|---|---|---|---|---|---|\n| 최대 규칙 | 5 | 100 | 200 | 500 | 1,000 |\n- 기본 **Extra Small**로 생성, 크기 수정 시 최대 규칙 수와 **요금이 변경**\n\n### Firewall이 붙는 지점\n| 지점 | 비고 |\n|---|---|\n| Internet Gateway Firewall | IGW 생성 시 자동 생성(미사용 체크해도 미사용 상태로 생성) |\n| Direct Connect Firewall | DC 생성 시 사용 여부 선택 |\n| Load Balancer Firewall | LB 트래픽 제어 |\n| Transit Gateway Firewall / BM VPC Firewall | TGW Uplink SR 및 BM VPC 연결 시 SR 신청, 외부 회선 연결 완료 후 사용 |\n| VPC Peering | **Firewall 없음** → Security Group으로 제어 |\n\n## 함께 쓰는 방법(심층 방어, WA 백서)\n- SCP에서 VPC 내부 트래픽 제어 서비스는 **Firewall과 Security Group**. Firewall은 네트워크 경계(North-South), Security Group은 서버 트래픽(East-West).\n- North-South: VPC 외부와 내부 사이 트래픽(Firewall, WAF, IPS 배치). East-West: VPC 내부 구성 요소 간 트래픽(LB, MQ 등 배치, 서버 그룹 간 **분산 방화벽(SG)**).\n- 3계층 웹서비스: IGW Firewall → Web LB Firewall → Web SG → App LB Firewall → App SG → DB SG 순으로 겹겹이 제어하고 계층마다 포트를 바꿔(443 → 80 → 8080 → 2866) DB 도달을 어렵게 한다.\n- 설계 원칙: VPC 내부 모든 리소스에 통신 제어 정책 수립, Fine Grained 정책, 구성 요소 간 필요한 포트로 제한하는 심층 방어.\n\n## 네트워크 로그 저장 개요\n| 로그 | 설정 위치 | 저장소 |\n|---|---|---|\n| Security Group 로그 | Management > Network Logging > Security Group Logging (SG 생성 시 '로그 저장 여부'는 여기서 저장소를 설정해야 사용 가능) | Object Storage 버킷 |\n| Firewall 로그 | Management > Network Logging > Firewall Logging, 또는 IGW/DC 생성 시 '로그 저장 여부' | Object Storage(생성 선행 필요) |\n| NAT 로그 | IGW 상세의 NAT 로그 저장 여부, Management > Networking Logging에서 확인 | Object Storage 버킷 |\n- 공통 절차: 로그 저장소 '미사용' 옆 설정 클릭 → 팝업에서 미사용 설정 변경 → 미리 만든 Object Storage 버킷 선택(상세는 4-3c)\n\n> [!시험]\n> 적용 대상을 서로 바꿔 놓은 보기(Firewall=VM 포트, SG=IGW)가 대표 오답.\n> Firewall은 Allow/Deny와 순서가 있고, SG는 허용 규칙 + 원격 타입(CIDR/SG).\n> Large=500, Extra Large=1,000. 기본 크기는 Extra Small(5개).\n> SG는 VPC와 무관, 포트 단위. VPC Peering 구간은 Firewall 없이 SG로 제어.\n\n> [!주의]\n> SG Quota 슬라이드는 두 줄 모두 'Security Group 규칙 수'로 표기되어 있다(Account당 1,000개 / Security Group당 100개). 첫 줄은 문맥상 Account당 Security Group 수일 가능성이 있으나 교재 표기를 그대로 둔다.\n> SG 기본 규칙은 'Any/Deny', Firewall은 'Any Deny'로 표기만 다르고 의미(전체 차단)는 같다.\n\n출처: SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드 13·15·17, Security Group 슬라이드 1~8·15, Firewall 슬라이드 1~9·14, VPC 슬라이드 21~22·37, WA백서 02 p.27~31\n"}, "3-1e": {"title": "Security Group 허용 규칙 구성", "md": "## 한눈에 보기\n- 새 Security Group = **기본 규칙 Any/Deny** → 같은 Subnet 내 Ping·SSH까지 모두 차단. **필요한 허용 규칙만 추가**하는 화이트리스트 방식.\n- 규칙 요소: **방향(Inbound/Outbound) + 프로토콜 유형 + 원격 타입(CIDR / Security Group) + 대상 주소**(+ 포트).\n- 한 개씩 입력 또는 **엑셀 일괄 입력(최대 100개)**.\n\n## Security Group 생성\n1. **Security Group명**: **255자 이내** 식별 가능한 이름\n2. **로그 저장 여부**: **Security Group Logging에서 로그 저장소를 먼저 설정**해야 사용 가능\n\n### Security Group Logging 설정 (Management > Network Logging > Security Group Logging)\n1. 로그 저장소 **미사용** 옆 **설정** 클릭 → 팝업에서 미사용 설정 변경\n2. 로그 저장소 **버킷 선택**: 미리 만들어 둔 Object Storage 선택\n\n순서: **Security Group 생성 → Security Group Logging 설정**\n\n## 적용 대상과 한도\n| 항목 | 값 |\n|---|---|\n| 적용 대상 | Virtual Server, Database, K8S Engine, GPU Server 등(각 자원의 **포트**) |\n| Port당 SG | 최대 5개(Port 생성 화면) |\n| Quota | Account당 1,000개, Security Group당 규칙 100개 |\n\n## 규칙 추가 (Networking > Security Group > 상세 정보 > 규칙 탭)\n1. **Security Group 규칙 추가** 클릭\n2. **트래픽 접근 방향**\n  - Inbound: 외부 → 서버\n  - Outbound: 서버 → 외부\n3. **프로토콜별 유형**: 사용자 지정 / 모든(All) / 자주 사용하는 프로토콜 중 선택\n  - **사용자 지정 ICMP** 선택 시 **메시지 타입** 선택\n4. **규칙 원격 타입**\n  - **CIDR**: IP를 직접 입력해 대상 주소 설정\n  - **Security Group**: 기 생성된 Security Group 선택\n5. **대상 주소** 입력\n\n### 일괄 입력\n| 단계 | 내용 |\n|---|---|\n| 규칙 일괄 입력 | 작성한 엑셀 파일 첨부로 일괄 등록 |\n| 업로드 양식 다운로드 | 양식 설명 참고해 엑셀에 입력(**최대 100개**) |\n| 작성한 파일 업로드 | **암호화된 파일은 업로드 안 됨** → 암호화 해지 후 업로드 |\n| 엑셀 다운로드 | 현재 등록된 규칙을 엑셀로 다운로드 |\n\n## 대표 규칙 예제\n| 목적 | 방향 | 대상 주소 | 프로토콜/포트 | 설명 |\n|---|---|---|---|---|\n| Linux 관리 SSH | Inbound | **SSH 접속을 원하는 IP**(특정 IP·네트워크만) | TCP 22 | 접속지 주소를 지정 |\n| 웹서비스 | Inbound | **LB Source NAT IP** | **LB 서버 그룹 프로토콜 / 멤버 포트** | LB를 만들고 그 Source NAT IP를 허용 |\n| Bastion 관리 접근 | Outbound | **Bastion Server IP** | SSH | Bastion에서 관리용으로 VM에 접근하기 위한 SSH 아웃바운드 허용 |\n| 시스템 업데이트 | Outbound | **0.0.0.0/0** | HTTP/HTTPS | VM에서 인터넷으로 나가는 패치·업그레이드 허용 |\n\n### Load Balancer 멤버 서버의 Security Group\nLB 서버 그룹 멤버로 추가된 서버의 SG에는 다음 규칙 1개를 추가한다(없으면 LB가 정상 동작하지 않음).\n\n| 용도 | 대상 주소 | 프로토콜 | 허용포트 | 방향 |\n|---|---|---|---|---|\n| LB와 LB 서버 그룹 멤버 간 통신 | **LB의 Source NAT IP** | **LB 서버 그룹 프로토콜** | **멤버 포트** | **Inbound** |\n- Source NAT IP는 LB가 멤버(서버)와 통신할 때 쓰는 IP. 클라이언트 IP나 LB Service IP는 **LB Firewall** 규칙에 쓰는 값이다(3-1l).\n\n## Security Group을 원격(대상)으로 지정하는 이점 (WA 백서)\n- SCP의 SG는 CIDR뿐 아니라 **다른 Security Group을 허용 대상**에 포함할 수 있다.\n- SG를 대상으로 지정하면 그 SG에 연결된 **모든 Virtual Server가 허용 대상**이 되므로, **Auto-Scaling** 등으로 서버가 늘어나도 주소 범위를 지정할 필요가 없다.\n\n### 3계층 웹서비스 SG 규칙 예시 (WA 백서 표 2-9 중 SG 부분)\n| 번호 | Security Group | 방향 | 원격 | 포트 |\n|---|---|---|---|---|\n| 2-1 | Bastion | Inbound | Administrator's Public IP | RDP/SSH(3389/22) |\n| 2-2 | Bastion | Outbound | All Security Groups | RDP/SSH(3389/22) |\n| 4-1 | Web Server | Inbound | Web LB Source NAT IP | HTTP(80) |\n| 4-2 | Web Server | Outbound | App LB Service IP | HTTP(8080) |\n| 4-3 | Web Server | Inbound | Bastion Server Security Group | RDP/SSH(3389/22) |\n| 6-1 | Application Server | Inbound | App LB Source NAT IP | HTTP(8080) |\n| 6-2 | Application Server | Outbound | DB Security Group | 2866 |\n| 6-3 | Application Server | Inbound | Bastion Server Security Group | RDP/SSH(3389/22) |\n| 7-1 | DB Server | Inbound | Application Server SG, DB SG | 2866 |\n| 7-2 | DB Server | Outbound | Application Server SG, DB SG | 2866 |\n- 2866은 SCP Database 서비스의 기본 포트. SG 규칙에는 Allow/Deny 동작 칸이 없다('-').\n- 이 예시는 LB 서버 그룹 멤버 헬스 체크용 규칙은 포함하지 않았다.\n\n## 규칙 해석 연습\nWeb 서버 SG에 Inbound(Bastion IP TCP 22, LB Source NAT IP TCP 80), Outbound(0.0.0.0/0 TCP 443)만 있다면:\n- Bastion → Web SSH: **허용**\n- 같은 Subnet 다른 서버의 Ping: **차단**(허용 규칙 없음, 기본 Any/Deny)\n- Web → 인터넷 HTTP(80) 패치 다운로드: **차단**(Outbound 443만 허용)\n\n> [!시험]\n> SG는 Allow/Deny 선택이 아니라 '허용할 것만 추가'. 기본은 같은 Subnet끼리도 전부 차단.\n> 원격 타입은 CIDR 또는 Security Group 두 가지. Domain 입력, 쉼표·대시 다중 주소 입력은 Firewall 기능이다.\n> LB 멤버 SG 규칙 = LB Source NAT IP / LB 서버 그룹 프로토콜 / 멤버 포트 / Inbound.\n> 일괄 입력 최대 100개, 암호화 파일은 해지 후 업로드. SG명 255자.\n\n출처: SCP_v2_Explore_Network_01-10 Security Group 슬라이드 5~15, VPC 슬라이드 31, Load Balancer 슬라이드 12·18, WA백서 02 p.28~31\n"}, "3-1f": {"title": "Firewall 허용 / 거부 규칙 구성", "md": "## 한눈에 보기\n- Firewall은 **Internet Gateway, Direct Connect, Load Balancer** 생성 시 함께(자동) 만들어지며, **Firewall 메뉴에는 생성 버튼이 없다**.\n- 기본 규칙 **Any Deny** → 허용(Allow) 규칙을 추가해야 통신. 필요하면 Deny 규칙도 추가.\n- 규칙은 **위에서 아래로 평가**, **처음 일치한 규칙**의 동작(Allow/Deny)으로 결정. 그래서 **규칙 위치**가 중요하다.\n\n## Firewall 생성과 크기\n### 대상 서비스에서 생성\n- VPC > Internet Gateway, Direct Connect, Load Balancer에서 Firewall 사용 선택\n- 사용을 체크하지 않아도 Firewall은 **미사용 상태로 생성**됨\n\n### 크기 변경\n1. **크기 수정**: 기본 **Extra Small**로 생성, 수정 시 **최대 규칙 수와 요금 변경**\n2. **현재 규칙 수와 최대 개수 확인**: 크기가 바뀌면 할당량 변경\n\n| 크기 | Extra Small | Small | Medium | Large | Extra Large |\n|---|---|---|---|---|---|\n| 최대 규칙 수 | 5 | 100 | 200 | 500 | 1,000 |\n\n### Firewall Logging (Management > Network Logging > Firewall Logging)\n1. 로그 저장소 '미사용' 옆 설정 클릭 → 팝업에서 미사용 설정 변경\n2. 로그 저장소 버킷 선택(미리 만든 Object Storage)\n- IGW·Direct Connect 생성 화면의 'Firewall 로그 저장 여부'도 **Object Storage 생성 선행** 필요\n\n## 규칙 추가 - 직접 입력 (Firewall 상세 정보 > 규칙 탭)\n1. **규칙 위치 설정**: 마지막 규칙 뒤 / 지정된 규칙 앞 / 지정된 규칙 뒤\n2. **출발지 주소 / 목적지 주소**\n  - CIDR 형식/IP 주소, **쉼표(,)와 대시(-)** 로 다수 주소 입력\n  - **목적지 주소는 IP뿐 아니라 Domain**으로도 입력 가능\n3. **유형 선택**\n  - 목적지 포트/Type: **TCP / UDP / ICMP** 선택 후 포트 선택 → 추가\n  - **Internet Protocol**: 프로토콜 번호 입력(**최대 128개**)\n  - **ALL**: 프로토콜과 포트 모두 허용\n4. **트래픽 Allow / Deny** 선택\n5. **트래픽 방향**\n  - Inbound: **VPC로 향하는** 트래픽\n  - Outbound: **VPC에서 출발하는** 트래픽\n\n## 규칙 추가 - 일괄 입력\n| 단계 | 내용 |\n|---|---|\n| 1 규칙 일괄 입력 | 엑셀 파일 첨부로 일괄 등록 |\n| 2 업로드 양식 다운로드 | 양식 설명 참고해 입력(**최대 100개**) |\n| 3 작성한 파일 업로드 | **Firewall 크기별 최대 규칙 수를 초과하면 파일 업로드 불가**(일부만 등록되지 않음), 암호화 파일은 해지 후 업로드 |\n| 4 규칙 위치 설정 | 마지막 규칙 뒤 / 지정된 규칙 앞 / 지정된 규칙 뒤 |\n| 5 규칙 확인 및 수정 | 추가된 규칙 확인, **위치 조정 및 삭제** |\n\n## 허용/거부 규칙 설계 원리\n### 평가 순서(First Match)\n```\n1. 규칙 1 일치? → 그 동작(Allow/Deny) 적용, 종료\n2. 규칙 2 일치? → ...\n...\nN. 아무것도 일치하지 않음 → 기본 규칙 Any Deny(차단)\n```\n- **예외(좁은 범위) Deny는 넓은 범위 Allow보다 위**에 둔다.\n- **최상단 Any/Any Allow** 를 두면 그 아래 차단 규칙은 절대 적용되지 않는다(안티패턴).\n- 기본이 Any Deny이므로, **Deny만 추가**하면 나머지도 결국 차단된다. 허용하려면 Allow가 반드시 있어야 한다.\n\n### 예제: 협력사 대역 허용 + 특정 IP 차단\n요구: 192.0.2.0/24의 SSH(TCP 22) Inbound 허용, 단 192.0.2.99는 차단\n\n| 순서 | 출발지 | 목적지 | 유형 | 동작 | 방향 |\n|---|---|---|---|---|---|\n| 1 | 192.0.2.99 | 서버 IP | TCP 22 | **Deny** | Inbound |\n| 2 | 192.0.2.0/24 | 서버 IP | TCP 22 | **Allow** | Inbound |\n- 순서를 바꾸면 192.0.2.99도 2번(넓은 Allow)에 먼저 걸려 허용된다.\n\n### 해석 시 체크 포인트\n- 출발지·목적지·프로토콜/포트·방향이 **모두** 일치해야 해당 규칙에 걸린다(목적지가 특정 IP인 규칙은 다른 목적지 트래픽에 적용 안 됨).\n- 일치 규칙이 없으면 Any Deny.\n\n## Firewall별 규칙 예 (WA 백서 3계층 웹서비스)\n| 번호 | Firewall | 방향 | 출발지 | 목적지 | 프로토콜/포트 | 동작 |\n|---|---|---|---|---|---|---|\n| 1-1 | Internet Gateway | Inbound | 0.0.0.0/0(Internet) | Web LB Service IP | HTTPS(443) | Allow |\n| 1-2 | Internet Gateway | Inbound | Administrator's Public IP | Bastion Server IP | RDP/SSH(3389/22) | Allow |\n| 3-1 | Web Load Balancer | Inbound | 0.0.0.0/0(Internet) | Web LB Service IP | HTTPS(443) | Allow |\n| 3-2 | Web Load Balancer | Outbound | Web LB Service IP | Web VM IP(band) | HTTP(80) | Allow |\n| 5-1 | App Load Balancer | Inbound | Web VM IP(band) | App LB Service IP | HTTP(80) | Allow |\n| 5-2 | App Load Balancer | Outbound | App LB Service IP | Application VM IP(band) | HTTP(8080) | Allow |\n- LB에서 **수신 포트와 전송 포트를 다르게**(443 수신 → SSL Termination → 80 전송) 구성하면 보호가 강화되고 후방 서버의 SSL 암복호화 부하도 줄어든다. SSL 인증서는 Certificate Manager에 등록.\n- North-South 맨 앞 경계는 **Internet Gateway Firewall**.\n\n## Direct Connect / Transit Gateway의 '규칙'과 구분\nDirect Connect·Transit Gateway의 '규칙 추가'는 **라우팅(목적지 IP 대역)** 설정이다(3-1h, 3-1i). Firewall의 Allow/Deny 규칙과 다르다. Direct Connect·TGW에는 별도의 Firewall이 붙을 수 있다.\n\n> [!시험]\n> 위에서 아래로, 첫 일치 적용. 예외 Deny를 위에, 넓은 Allow를 아래에.\n> 일괄 입력 시 크기별 최대 규칙 수를 넘으면 '파일 업로드 자체가 불가'.\n> Firewall 메뉴에는 생성 버튼이 없다(대상 서비스에서 생성, 미사용 상태로도 생성).\n> 목적지 Domain 입력, 쉼표·대시 다중 주소, Internet Protocol 번호 최대 128개.\n> Firewall Inbound = VPC로 향하는 트래픽(SG의 '외부→서버'와 표현이 다름).\n\n출처: SCP_v2_Explore_Network_01-10 Firewall 슬라이드 5~14, VPC 슬라이드 21~22, VPN/Direct Connect/Transit Gateway 슬라이드 15, WA백서 02 p.28~31\n"}, "3-1g": {"title": "VPN 프라이빗 연결", "md": "## 한눈에 보기\n- **VPN**: 고객 네트워크와 SCP를 **암호화된 가상 전용망(IPsec)** 으로 연결하는 서비스. 인터넷을 경유한다.\n- 구성: **VPN Gateway**(VPC 1개 + Public IP) → **VPN Tunnel**(Peer IP, Remote Subnet, PSK, IKE/IPsec 설정).\n- Quota: **VPN Gateway Account당 3개**, **VPN Tunnel VPN Gateway당 5개**.\n- v2 변화: 특정 서버와의 연결 → **VPC 연결**.\n\n## 개념과 제공 기능\n| 기능 | 내용 |\n|---|---|\n| IPSec VPN Tunnel | IPsec으로 암호화된 가상 터널링 |\n| Virtual Private Gateway 생성 | 외부에서 접근할 수 없는 사설망에 고객사 네트워크를 연결하는 Gateway |\n| VPN Tunnel 생성 | IPsec VPN Gateway 연동(**Active-Standby 이중화**), 다양한 IKE Version 및 보안 알고리즘 |\n\n- 호환 VPN: Secui – Bluemax(TG360), Paloalto, Axgate, Cisco-router/ASA/Meraki, Checkpoint, AWS, Azure, Vmware NSX-T\n- 구성도: On-Premises VPN Gateway ↔ (Internet) ↔ Internet Gateway(Firewall) ↔ SCP VPN Gateway ↔ VPC\n\n## 주요 용어\n| 용어 | 설명 |\n|---|---|\n| VPN Gateway | VPN 터널의 SCP 종단점. 암호/복호화, 인증, 트래픽 라우팅, 터널 관리 |\n| VPN Tunnel | 인터넷망에서 암호화된 데이터를 전달하는 논리적 전용경로 |\n| IKE(Internet Key Exchange) | VPN 터널을 만들기 위한 **인증, 암호화 키 교환, 보안 정책 협상을 자동화**하는 프로토콜 |\n| IKE v1 | 메시지 교환이 더 많고 구조가 복잡, 구형 암호화로 상대적 보안 취약점 |\n| IKE v2 | 간소화된 메시지 교환으로 빠르고 효율적, 최신 알고리즘으로 보안 강화 |\n| IPsec | **실제 트래픽 전송 단계**에서 데이터 패킷을 암호화·인증·보호, 전송 중 **무결성과 기밀성** 보장 |\n| Encryption Algorithm | 인증 정보·키 교환 정보 등 데이터를 암호화, 터널 내 데이터를 외부에서 볼 수 없게 보호 |\n| Digest Algorithm(해시) | 인증 과정에서 메시지 변조 여부 검증 → **무결성** 보장 |\n| Diffie-Hellman(DH) | 비대칭 키 교환 알고리즘, **그룹 번호가 클수록 보안은 강하지만 계산 속도는 느림**, 장비별 지원 그룹 확인 필요 |\n| PFS(Perfect Forward Secrecy) | 세션마다 새 암호화 키를 생성해 한 번의 키 유출로 전체 데이터가 노출되는 것을 방지 |\n| DPD Probe Interval | 원격 VPN 장비의 활성 상태 확인 메시지 전송 간격 |\n\n## 생성 절차\n### 1단계: VPN Gateway (Networking > VPN)\n1. VPN Gateway 이름 입력\n2. **연결 VPC 선택**: **Internet Gateway가 연결된 VPC** 선택\n3. **Public IP 선택**: 원격지와 통신하기 위한 Public IP, **VPC > Public IP에서 사전 예약 필요**\n\n### 2단계: VPN Tunnel (Networking > VPN > VPN Tunnel)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | VPN Tunnel 이름 | - |\n| 2 | VPN Gateway명 선택 | Gateway 생성 시 선택한 VPC, Public IP 자동 입력 |\n| 3 | Peer VPN GW IP | 연결할 외부 네트워크의 VPN 게이트웨이 IP |\n| 4 | Remote Subnet(CIDR) | 원격지 서브넷 주소를 CIDR로 |\n| 5 | Pre-shared Key | IKE 상호 인증용 공유키(PSK), 미리 정해 공유, 충분히 길고 복잡하게, 외부 노출 금지 |\n| 6 | IKE 버전 | IKE v1 / IKE v2 |\n| 7 | (IKE) 알고리즘 | 암호화 + 다이제스트 알고리즘 선택 후 추가(**최대 10개**) |\n| 8 | (IKE) DH 그룹 | **3개까지** |\n| 9 | (IKE) SA LifeTime | 기본 **86,400초(24시간)** |\n| 10 | IPSEC 알고리즘 | 암호화 + 다이제스트 알고리즘 선택 후 추가 |\n| 11 | PFS 사용 여부 | 체크 |\n| 12 | (IPSEC) DH 그룹 | **3개까지** |\n| 13 | (IPSEC) SA LifeTime | 기본 **43,200초(12시간)** |\n| 14 | DPD Probe Interval | 원격 장비 활성 상태 확인 간격 |\n\n요약 흐름: **VPN 생성 → VPN 터널 생성(원격지 IP, Subnet, Pre-Shared Key 입력, IKE/IPSec 설정)**\n\n## 설계 포인트\n- **고가용성**: VPN 터널 이중화, VPN + Direct Connect 혼합 이중화\n- **비용**: IPSec VPN Gateway 요금 + Internet Outbound Traffic → **중소 규모는 VPN 구성**이 유리. WA 백서 과금: VPN은 Provisioning / **Per Month**(Internet Outbound 요금과 같이 계산)\n- **IP 설계**: VPN 등 외부 연결 시 IP 충돌 나지 않도록 CIDR 설계\n- **WA 보안성 예시**: 관리자는 **VPN으로 Bastion Server에 프라이빗 연결**한 뒤 이를 경유해 각 서버 관리\n- 언제 VPN인가: 저비용·빠른 구축, 암호화 필수, 대역폭 요구가 크지 않을 때\n\n## VPN vs Direct Connect vs Transit Gateway (요약)\n| 항목 | VPN | Direct Connect | Transit Gateway |\n|---|---|---|---|\n| 연결방식 | 인터넷 기반 암호화 터널(IPSec) | 물리적 전용 회선 | 중앙 허브(라우터) |\n| 주요 용도 | 저비용, 빠른 구축 | 대용량, 안정적·보안성 높은 연결 | 여러 네트워크 연결 |\n| 보안 | 암호화 터널, 인터넷 경유 | 물리적 분리, Firewall로 제어 | 각 네트워크 보안 정책 활용 |\n| 대역폭 | 상대적으로 낮음 | 1G/10G/20G/40G | - |\n| 구축 난이도 | 비교적 쉬움 | 물리적 작업 필요 | 물리적 작업 필요, 1:N 복잡도 높음 |\n| 비용 | 상대적으로 낮음 | 전용회선 비용 | - |\n\n> [!시험]\n> Quota: VPN Gateway Account당 3 / Tunnel Gateway당 5 (뒤바꾼 보기 주의).\n> IKE = 터널을 '만드는' 협상·키 교환, IPsec = 실제 트래픽 암호화·무결성·기밀성.\n> SA LifeTime 기본값: IKE 86,400초(24h), IPSEC 43,200초(12h). 알고리즘 최대 10개, DH 그룹 최대 3개.\n> VPN Gateway는 IGW 연결 VPC + 사전 예약 Public IP 필요. v2 VPN은 서버 단위가 아니라 VPC 단위.\n\n> [!주의]\n> SA LifeTime은 IKE 단계(86,400초)와 IPSEC 단계(43,200초)의 기본값이 다르다. 교재 슬라이드 10과 11이 각각의 값이다.\n\n출처: SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드 1~11·24·26, SCP Networking Service 슬라이드 15·17~19, WA백서 02 p.26~27, WA백서 06 p.2\n"}, "3-1h": {"title": "Direct Connect 프라이빗 연결", "md": "## 한눈에 보기\n- **Direct Connect**: 고객 네트워크와 SCP 환경을 **안전하고 빠르게** 연결하는 서비스(**물리적 전용 회선**). 기존 시스템의 내부 사설 네트워크 대역을 SCP 자원에 할당해 사용할 수 있다.\n- **고객 네트워크 ↔ 단일 VPC(1:1)**. 여러 VPC는 Transit Gateway(1:N).\n- 고객사 라우터에 **BGP** 필요, Uplink 회선은 **SR 신청**.\n- 포트 용량 **1G / 10G / 20G / 40G**, 한 번 선택하면 **변경 불가**.\n\n## 구성 요소\n| 단계 | 내용 |\n|---|---|\n| Direct Connect 생성 | 고객사 **Uplink 회선 연결 신청(SR)**, 자원 확보·구성 후 서비스 제공, 고객사 라우터에 **BGP 라우팅 프로토콜** 필요 |\n| Direct Connect와 VPC 연결 | 고객 네트워크와 연결할 **단일 VPC** 선택, **Direct Connect Firewall** 제공, Route 설정 기능을 **규칙 추가**로 제공 |\n| Quota | Account 기준 **서비스존 내 VPC당(1:1)** 생성 가능 |\n\n## 생성 절차\n1. **Direct Connect 이름** 입력\n2. **Uplink 포트용량**: **1G / 10G / 20G / 40G** 중 선택\n  - 한번 선택한 포트 용량은 **변경 불가**\n  - 서비스 생성 **이후** Uplink 회선 신청 **SR 요청** 필요(상세정보의 SR 바로가기 링크)\n3. **VPC 선택**\n4. **Firewall 사용 여부** 선택\n5. **Firewall 로그 저장 여부**: **Object Storage 생성 선행** 필요\n\n요약 흐름: **Direct Connect 서비스 생성 → 규칙 추가**\n\n## 규칙 추가 (Networking > Direct Connect 상세 정보 > 규칙추가 탭)\nv2에는 Routing Table이 없고 Direct Connect 등에 **규칙**을 넣어 경로를 정한다.\n\n| 목적지 | 목적지 IP 입력 규칙 |\n|---|---|\n| **VPC** | **VPC IP 대역 범위 내**에서만 입력, **0.0.0.0/0 사용 불가** |\n| **원격지** | **VPC IP 대역 범위는 입력 불가**, **0.0.0.0/0은 VPC에 IGW가 연결되지 않은 경우에만 가능** |\n\n예) VPC 10.1.0.0/16 + IGW 연결, 온프레미스 192.168.0.0/16\n- 목적지 VPC / 10.1.10.0/24 → 가능\n- 목적지 VPC / 0.0.0.0/0 → 불가\n- 목적지 원격지 / 10.1.0.0/16 → 불가(VPC 대역)\n- 목적지 원격지 / 0.0.0.0/0 → 불가(IGW 연결됨)\n- 목적지 원격지 / 192.168.0.0/16 → 가능\n\n## Direct Connect와 함께 쓰는 기능\n### Private NAT\n- VPC 내 compute 자원이 **Direct Connect를 통해 고객사망으로 나갈 때 Private NAT IP**로 통신(고객사망에서 지정한 IP로 매핑)\n- 외부 인터넷이 아닌 **사설 네트워크로만** 전달(IGW 경유 인터넷 트래픽에는 쓰지 않음)\n- **Direct Connect 선행** 필요, VPC당 기본 최대 3개\n- 생성: Direct Connect 선택 시 연결 VPC 자동 선택, NAT IP 대역 **/22 ~ /27**, 연결 VPC·On-Prem 대역과 **중복 불가** → Private NAT IP 예약(대역 내 입력)\n\n### VPC Endpoint\nDirect Connect, Transit Gateway와 연결된 고객사 내부망에서 Object Storage 등 VPC 외부 SCP 서비스에 프라이빗 접근(3-1k).\n\n### Direct Connect Firewall\nVPC와 고객 네트워크 간 통신에 Allow/Deny 규칙 적용(3-1f). Firewall 크기·순서 규칙 동일.\n\n## 설계 포인트\n- **고가용성**: Direct Connect **회선/경로 이중화**, VPN + Direct Connect 혼합 이중화\n- **비용**: **포트 요금 + 트래픽 요금**(전용회선 비용 발생). 중소 규모는 VPN이 유리. WA 과금: Direct Connect는 Provisioning / Per Hour\n- **성능(WA 성능효율성)**: 하이브리드 연결이 필요하면 Direct Connect로 필요한 대역폭 선택 검토\n- **IP 설계**: 기존 사내 대역을 그대로 쓰는 경우가 많으므로 VPC CIDR와 충돌하지 않도록\n\n## VPN과 비교\n| 항목 | VPN | Direct Connect |\n|---|---|---|\n| 연결방식 | 인터넷 기반 IPSec 암호화 터널 | **물리적 전용 회선** |\n| 보안 | 암호화 터널, 인터넷 경유 | **물리적 분리로 보안성 우수**, Firewall로 제어 |\n| 대역폭 | 상대적으로 낮음 | 1G, 10G, 20G, 40G |\n| 구축 | 비교적 쉬움 | **물리적 작업 필요**(SR, BGP) |\n| 비용 | 상대적으로 낮음 | 전용회선 비용 |\n| 주요 용도 | 저비용·빠른 구축 | **대용량, 안정적, 보안성 높은 연결** |\n\n> [!시험]\n> 'Direct Connect는 인터넷 경유 IPsec 터널' → 오답(그건 VPN).\n> DC 1개는 VPC 1개(1:1). 여러 VPC를 묶으려면 Transit Gateway.\n> 규칙: 목적지 VPC는 VPC 대역 내만(0.0.0.0/0 불가), 원격지는 VPC 대역 불가, 원격지 0.0.0.0/0은 IGW 없는 VPC만.\n> 포트 용량 1G/10G/20G/40G, 변경 불가, 생성 후 Uplink SR. 고객 라우터 BGP.\n\n출처: SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드 12~16·24·26, VPC 슬라이드 33·42~45, SCP Networking Service 슬라이드 15·18~19, WA백서 04 p.8, WA백서 06 p.2\n"}, "3-1i": {"title": "Transit Gateway 다중 프라이빗 연결", "md": "## 한눈에 보기\n- **Transit Gateway(TGW)**: 고객 네트워크와 SCP 네트워크를 손쉽게 연결하고, **클라우드 내 여러 VPC의 연결 허브** 역할을 하는 게이트웨이(**1:N**).\n- Quota: **Account당 TGW 최대 3개**, **TGW당 최대 5개 VPC 연결**.\n- 작업 순서: **TGW 생성(Uplink SR) → TGW-VPC 연결 생성 → TGW 규칙 추가**.\n- v2에서 Transit Gateway는 **VPC 구성요소에 포함**된다.\n\n## 구성 요소\n| 구성 | 내용 |\n|---|---|\n| Transit Gateway 생성 | 고객사 **Uplink 회선 연결 신청(SR)**, 고객사 라우터 **BGP** 필요 |\n| Transit Gateway와 VPC 연결 | TGW와 연결할 VPC 선택, **BM VPC와 연결 시 BM VPC Firewall 제공(SR 신청)**, Route 설정 기능을 **규칙 추가**로 제공 |\n| Transit Gateway Firewall | TGW 구간 Firewall |\n| Transit Gateway Peering | 두 TGW 간 Peering 연결, TGW Peering Firewall 제공 — **'26년 제공 예정** |\n\n## 생성 절차\n### 1. Transit Gateway 생성 (Networking > VPC > Transit Gateway)\n1. Transit Gateway 이름 입력\n2. **Uplink 사용을 위해 SR 요청**\n  - Uplink 회선 연결을 위한 요청\n  - **Baremetal VPC용 Firewall 연결 시에도 TGW의 SR 요청 필요**\n  - 외부 회선 연결 작업 완료 후 **Transit Gateway Firewall 사용 가능**\n\n### 2. TGW-VPC 연결 생성 (Transit Gateway > 연결 VPC 관리 탭)\n- 상세정보의 연결 VPC 관리 탭에서 VPC 연결 추가\n- **TGW당 최대 5개 VPC**\n\n### 3. TGW 규칙 추가 (연결 VPC 관리 탭)\n1. **연결 VPC 선택**: 연결한 VPC 중 규칙을 추가할 VPC(그래서 VPC 연결이 먼저)\n2. **출발지, 목적지 선택**: **TGW → VPC** 또는 **VPC → TGW** 방향 설정, 목적지를 선택하면 출발지 자동 선택\n3. **목적지 IP 대역**\n\n| 목적지 | 입력 규칙 |\n|---|---|\n| **VPC** | **VPC IP 대역 범위 내**만, **0.0.0.0/0 사용 불가** |\n| **TGW** | **VPC IP 대역 범위는 입력 불가** |\n\n## 왜 TGW인가 (허브앤스포크)\n- WA 가용성 백서: VPC Peering은 **1:1 연결**이라 VPC 3개를 모두 연결하려면 **3개 연결**이 필요하다. TGW는 3개 VPC를 하나의 TGW에 연결하고 VPC 간 라우팅을 설정해 **연결을 중앙화·단순화**한다.\n- 설계 원칙: 다른 정보시스템과 연결 시 IP 범위가 겹치지 않게, 가급적 **허브앤스포크 토폴로지**.\n- (일반 개념) Peering 풀메시 연결 수 = n(n-1)/2 → VPC 4개면 6개, 5개면 10개.\n- 온프레미스 + 여러 VPC를 프라이빗하게 연결하고 VPC 간 통신을 중앙에서 관리하려면 TGW. **Direct Connect 1개로 여러 VPC 연결은 불가**(DC는 1:1).\n\n## 비용·글로벌\n- 비용: **생성 요금 + 트래픽 요금 + 포트이용료**. 다수 VPC를 연결하는 **복잡한 구성일 때 도입**, 단순 VPC 연결은 VPC Peering.\n- WA 과금: TGW는 Provisioning / Per Hour(**GB당 전송요금과 같이 계산**).\n- 여러 VPC 서버 간 연결은 인터넷 경유를 지양하고 VPC Peering 또는 TGW로 프라이빗 통신 → 비용 최적화 + 보안 향상(WA 비용최적화).\n- 글로벌 확장: **Transit Gateway + Cloud WAN**으로 글로벌 리전과 고객 거점 간 연결, 원하는 구간에서 실제 사용량만큼 과금.\n\n## VPN vs Direct Connect vs Transit Gateway\n| 항목 | VPN | Direct Connect | Transit Gateway |\n|---|---|---|---|\n| 연결방식 | 인터넷 기반 암호화 터널(IPSec) | 물리적 전용 회선 | 중앙 허브(라우터) |\n| VPC 연결 | 1:1 | 1:1 | **1:N** |\n| 주요 용도 | 저비용, 빠른 구축 | 대용량, 안정적·보안성 높은 연결 | 여러 네트워크 연결 |\n| 보안 | 암호화 터널, 인터넷 경유 | 물리적 분리, Firewall로 제어 | 연결되는 **각 네트워크의 보안 정책** 활용 |\n| 대역폭 | 상대적으로 낮음 | 1G, 10G, 20G, 40G | - |\n| 구축 난이도 | 비교적 쉬움 | 물리적 작업 필요 | 물리적 작업 필요, **1:N 구성으로 복잡도 높음** |\n| 비용 | 상대적으로 낮음 | 전용회선 비용 발생 | 생성+트래픽+포트이용료 |\n| Quota | GW Account당 3, Tunnel GW당 5 | 서비스존 내 VPC당 1:1 | Account당 3, TGW당 VPC 5 |\n\n> [!시험]\n> 순서: TGW 생성(SR) → VPC 연결 → 규칙. 규칙은 '연결된 VPC' 중에서 고른다.\n> 목적지 VPC면 VPC 대역 내만, 0.0.0.0/0 불가. 목적지 TGW면 VPC 대역 입력 불가.\n> Account당 TGW 3개, TGW당 VPC 5개. BM VPC 연결 시 BM VPC Firewall(SR).\n> 다수 VPC + 온프레미스 + 중앙 관리 → TGW. 2개 VPC만 저비용 → VPC Peering.\n\n> [!주의]\n> Transit Gateway Peering(두 TGW 간 Peering, TGW Peering Firewall)은 교재에 ''26년 제공 예정'으로 표기되어 있다.\n> 비교표 슬라이드의 'VPC 연결' 행은 값이 1:1과 1:N 두 개만 추출되어 있어 VPN·Direct Connect가 병합 셀(1:1)로 표시된 것으로 해석했다. Direct Connect는 다른 슬라이드에서 VPC당 1:1로 명시되고, VPN Gateway도 연결 VPC 1개를 선택한다. TGW의 대역폭·비용 칸은 교재에 별도 값이 없다.\n\n출처: SCP_v2_Explore_Network_01-10 VPN/Direct Connect/Transit Gateway 슬라이드 17~24·27, VPC 슬라이드 7, SCP Networking Service 슬라이드 13·15·19·20, WA백서 01 p.15~16, WA백서 06 p.2·11~12\n"}, "3-1j": {"title": "VPC Peering", "md": "## 한눈에 보기\n- **VPC Peering**: VPC 간 **프라이빗 IP 주소로 안전한 통신**을 위해 설정하는 연결(**1:1**).\n- **요청 VPC**와 **승인 VPC**를 선택해 구성, **양쪽 모두 라우팅 규칙** 설정 필요.\n- Peering 구간에는 **별도 Firewall이 없음** → **Virtual Server의 Security Group**으로 제어.\n- Quota: **Account당 최대 5개**(**다른 Account 간 연결은 1개** 허용).\n- 비용: **트래픽 비용만** 발생(Pay-as-you-go / Per Usage(GB)).\n\n## 개념과 특징\n| 구분 | 내용 |\n|---|---|\n| 구성 | 요청 VPC와 승인 VPC를 선택해 구성, 요청·승인 VPC의 **라우팅 규칙 설정 필요** |\n| 특징 | 서로 다른 VPC 간 **사설 네트워크 연동** |\n| 보안 | Peering 사이에 별도의 Firewall 제공 안 됨, **Virtual Server의 Security Group으로 트래픽 제어** |\n| Quota | Account당 VPC Peering 최대 5개(다른 Account 간 연결은 1개 허용) |\n\nv2 변화: VPC Peering에 **Firewall 대신 Virtual Server의 Security Group으로 제어**.\n\n## 생성 절차\n### 1. VPC Peering 생성 (VPC > VPC Peering)\n1. VPC Peering명 입력\n2. **요청 VPC** 선택\n3. **승인 VPC** 선택\n\n### 2. 규칙 추가 (VPC > VPC Peering > 규칙 탭)\n1. **출발지 VPC 선택**: 출발지를 선택하면 **목적지 VPC 자동 설정**\n2. **목적지 IP 대역**: **목적지 VPC의 IP 대역 내**에서 입력\n- 양방향 통신을 위해 **요청 VPC 쪽, 승인 VPC 쪽 규칙을 각각** 추가한다(한쪽 규칙이 반대쪽을 자동 생성하지 않음).\n\n## 활용 시나리오\n### 다른 VPC 서버를 LB 멤버로 등록\n- LB, Listener, LB 서버그룹, LB 헬스체크는 **모두 같은 Subnet**에 구성, **멤버는 Subnet 제약 없음**\n- **다른 VPC의 서버**를 멤버로 등록하려면 **VPC Peering 후 'IP로 직접 입력'** 으로 등록\n\n### 공통 서비스 VPC (WA 비용최적화)\n- 본사·지사 A·지사 B VPC와 **공통 서비스 VPC**를 **허브 앤 스포크 방식의 VPC Peering**으로 연결\n- 공통 소프트웨어(영상·지도 서비스 등)를 공통 VPC에 두고 공유해 비용 절감, Bastion·Logging 서버 등 관리 서버를 별도로 두어 외부 접점 단일화\n- 여러 VPC 서버 간 연결은 **인터넷 경유를 지양**하고 VPC Peering(두 VPC 간 연결) 또는 TGW로 프라이빗 통신 → 데이터 전송요금 최적화 + 보안 향상\n\n### 리전 간 DR (WA 안정성)\n- 주 센터(kr-west1)와 DR 센터(kr-east1)를 VPC Peering으로 연동하는 Cold Level DR 구성 예시가 있으나, **Region 간 VPC Peering은 향후 출시 예정('26년)**\n\n## VPC Peering vs Transit Gateway\n| 구분 | VPC Peering | Transit Gateway |\n|---|---|---|\n| 연결 형태 | VPC **1:1** | 중앙 집중형 **허브**, 1:N |\n| 대상 | VPC ↔ VPC | 고객 네트워크 + 여러 VPC |\n| 비용 | **트래픽 비용만** | 생성 요금 + 트래픽 요금 + 포트이용료 |\n| 트래픽 제어 | Security Group(Firewall 없음) | TGW Firewall, BM VPC Firewall, 각 네트워크 보안 정책 |\n| 적합한 경우 | **단순 VPC 연결** | **복잡한 구성**, 다수 VPC |\n| 확장 | VPC 3개 풀메시 = 연결 3개 필요 | VPC 3개를 TGW 하나로 |\n| Quota | Account당 5(타 Account 간 1) | Account당 3, TGW당 VPC 5 |\n\n## 설계 체크리스트\n- 두 VPC의 **CIDR가 겹치지 않게**(VPC Peering 등 외부 연결 시 IP 충돌 방지)\n- Peering 생성 후 **양쪽 규칙** 추가\n- 상대 VPC 대역을 허용하는 **Security Group 규칙**을 각 서버에 추가(Peering 전용 Firewall은 없음)\n- 동일 리전·동일 AZ 트래픽은 무료, AZ 간·리전 간은 비용 발생\n\n> [!시험]\n> '요청 VPC에 규칙을 넣으면 반대 방향이 자동 생성' → 오답. 양쪽 각각 설정.\n> 'Peering 전용 Firewall로 Allow/Deny 제어' → 오답. Security Group으로 제어.\n> 두 VPC만, 비용 최소 → VPC Peering(트래픽 비용만). 다수 VPC·온프레미스 중앙관리 → TGW.\n> 다른 VPC 서버를 LB 멤버로 → VPC Peering 후 IP 직접 입력.\n> Account당 5개, 다른 Account 간 1개.\n\n> [!주의]\n> Region 간 VPC Peering은 WA백서 03(안정성)에 '향후 출시 예정('26년)'으로 표기되어 있다. 교재 슬라이드에는 리전 간 지원 여부가 적혀 있지 않다.\n\n출처: SCP_v2_Explore_Network_01-10 VPC 슬라이드 36~40·49, SCP Networking Service 슬라이드 15·17·19, Load Balancer 슬라이드 5·13, WA백서 01 p.15~16, WA백서 03 p.19, WA백서 06 p.2·11~12\n"}, "3-1k": {"title": "VPC Endpoint", "md": "## 한눈에 보기\n- **VPC Endpoint** = VPC와 연결된 외부 네트워크(고객사 내부망)에서 **인터넷에 노출하지 않는 Private 연결**로 SCP 서비스에 접근하게 해 주는 **VPC 진입점**.\n- 시험 키워드: 온프레미스(Direct Connect / Transit Gateway로 연결된 내부망) → VPC 외부의 SCP 서비스(Object Storage, File Storage, Container Registry 등)에 **프라이빗 연결**.\n- 선행 작업은 **VPC Endpoint 유형 Subnet(Endpoint Subnet) 생성**. 이 Subnet 유형은 **Primary Subnet만** 제공된다.\n\n## 개념\n### 정의와 특징\n| 구분 | 내용 |\n|---|---|\n| 정의 | VPC와 연결된 외부 네트워크에서 인터넷에 노출하지 않는 Private 연결을 통해 SCP에 액세스할 수 있는 VPC 진입점 제공 |\n| 특징 | Direct Connect, Transit Gateway와 연결된 고객사 내부망에서 VPC 외부의 서비스에 프라이빗 연결 |\n| 연결 가능 서비스(개념 슬라이드) | Object Storage, File Storage, Container Registry, DNS |\n| 선행 작업 | Endpoint Subnet 생성 |\n\n- VPC 개념 슬라이드의 장점 중 하나: **인터넷 연결이 안 된 VPC에서도 Object Storage 접속 가능** → 이것을 가능하게 하는 구성요소가 VPC Endpoint다.\n- VPC의 구성요소 9가지: Subnet, Internet Gateway, NAT Gateway, Public IP, Port, **VPC Endpoint**, VPC Peering, Private NAT, Transit Gateway.\n\n### VPC 안에서 Endpoint Subnet의 위치\nVPC는 용도별 Subnet 옵션을 제공하며, 그중 하나가 **Endpoint 연계를 위한 Endpoint Subnet**이다.\n\n| Subnet 유형 | 용도 | Secondary Subnet |\n|---|---|---|\n| Public | 인터넷을 통해 외부와 통신. Public IP NAT, NAT Gateway 사용 가능 | Primary 하위에 동일 유형 생성 가능 |\n| Private | 외부 접근 없이 내부 통신. Public IP NAT 불가, NAT Gateway 가능 | 생성 가능 |\n| Local | VPC 내 다른 Subnet 서버와 직접 통신(Heart Beat IP, Backup IP 등) | 생성 가능 |\n| **VPC Endpoint** | VPC와 연결된 외부 네트워크에서 Private 연결로 SCP에 액세스. VPC Endpoint로 활용 가능한 구성 | **불가 – Primary Subnet만 제공** |\n\n- Subnet Quota: VPC당 3개(**Primary Subnet 개수만 제한**). Primary Subnet은 최대 3개까지 신청 가능.\n- Subnet IP 대역은 /16 ~ /28 범위, 생성 후 CIDR 수정 불가.\n\n## 동작 구조\n```\n고객사 On-Prem 내부망\n   │ (Direct Connect 또는 Transit Gateway - 사설 경로)\n   ▼\nVPC ── VPC Endpoint Subnet ── [Endpoint IP] ──(Private 경로)──▶ Object Storage / File Storage / Container Registry / DNS\n```\n- 인터넷 경로(Internet Gateway, NAT Gateway)를 타지 않는다. 온프레미스와 VPC 사이 구간은 Direct Connect 또는 Transit Gateway가 담당하고, VPC에서 SCP 서비스까지 구간을 VPC Endpoint가 담당한다.\n\n## 생성 절차\n선행: **Networking > VPC > Subnet**에서 Subnet 유형 **VPC Endpoint**로 Primary Subnet 생성.\n\n**VPC > VPC Endpoint**에서 생성\n\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | VPC 선택 | Endpoint를 둘 VPC |\n| 2 | 사용 용도 선택 | 대상 서비스: **Object Storage, File Storage, Container Registry** 중 선택 / 연결 자원 선택 |\n| 3 | VPC Endpoint 명 입력 | |\n| 4 | VPC Endpoint IP 설정 | 선행 작업으로 만든 **Endpoint Subnet 선택** → Subnet 대역 안에서 **IP 직접 입력**. 관리용 IP로 사용할 수 없거나 이미 사용 중인 IP는 '사용 불가' 메시지 |\n\n> [!주의]\n> 연결 가능 서비스 목록이 슬라이드마다 다르다. VPC Endpoint 개념 슬라이드(VPC 슬라이드33)는 Object Storage, File Storage, Container Registry, **DNS** 4개를 들지만, 생성 화면(슬라이드35)의 '대상 서비스'는 Object Storage, File Storage, Container Registry 3개다. VPC 구성요소 그림(슬라이드7)에는 DNS·Container Registry Endpoint 옆에 '(*)' 표시가 있다. 문제에서 '생성 시 선택하는 대상 서비스'를 물으면 3개, '연결 가능 서비스'를 물으면 4개 기준으로 판단한다.\n\n## 다른 VPC 구성요소와 비교\n| 구성요소 | 목적 | 경로 | 혼동 포인트 |\n|---|---|---|---|\n| **VPC Endpoint** | 외부 내부망·VPC → SCP 서비스(Storage, Registry 등) 프라이빗 접근 | Private | 인터넷 미경유 |\n| Private NAT | VPC 내 compute 자원이 Direct Connect로 고객사망에 나갈 때 고객사망 IP로 매핑 | Private (Direct Connect 선행) | 서비스 접근용이 아니라 IP 매핑용 |\n| NAT Gateway | Public IP 없는 VM의 단방향(Outbound) 인터넷 사용, 대표 공인 IP 1개 | 인터넷 | 인터넷 경유 → 인터넷 금지 요구에 부적합 |\n| Internet Gateway | VPC와 인터넷 연결 통로 | 인터넷 | |\n| VPC Peering | VPC 간 사설 IP 통신 | Private | 서비스 접근이 아니라 VPC↔VPC |\n\n## WA 백서 관점\n- **접근 제어(보안성)**: File Storage, Object Storage, Container Registry는 접근 제어 목록(ACL, White List) 방식이며, ACL 대상에는 서버 자원뿐 아니라 **Public IP, VPC Endpoint**도 포함된다. 즉 Endpoint 경유 접근도 Storage ACL에 등록해 관리한다.\n- **과금(비용 최적화)**: VPC Endpoint는 Public IP, NAT Gateway, Direct Connect 등과 함께 **Provisioning / Per Hour** 과금 모델로 분류된다.\n\n## 시나리오로 정리\n- \"온프레미스(Direct Connect 연결)에서 Object Storage로 백업, 인터넷 경유 금지\" → Endpoint Subnet 생성 → VPC Endpoint(대상: Object Storage) → Endpoint IP는 Endpoint Subnet 안의 미사용 IP. **IGW/NAT Gateway로 내보내는 안은 오답**.\n- 온프레미스↔VPC 구간은 Direct Connect 또는 Transit Gateway 활용.\n\n> [!시험]\n> - VPC Endpoint = 'VPC와 연결된 외부 네트워크에서 인터넷 비노출 Private 연결로 SCP에 액세스하는 VPC 진입점'.\n> - 선행 작업 = Endpoint Subnet(VPC Endpoint 유형) 생성. 이 유형은 **Primary Subnet만**(Secondary 추가 불가).\n> - Endpoint IP는 Endpoint Subnet 대역 내 **직접 입력**, 관리용·사용 중 IP 불가.\n> - 생성 시 대상 서비스: Object Storage, File Storage, Container Registry.\n> - 인터넷 경유 금지 요구에 IGW·NAT Gateway를 제시하면 오답. Private NAT는 Direct Connect 쪽 IP 매핑용이므로 구분.\n\n출처: SCP_v2_Explore_Network_01-10.md VPC 슬라이드6, 7, 11, 14, 33, 35, 47~49, WA백서 02 p.21·p.27, WA백서 06 p.1\n"}, "3-1l": {"title": "Load Balancer 고가용성", "md": "## 한눈에 보기\n- Load Balancer(LB) = 트래픽 증가 또는 서버 장애에 대비해 **부하 분산 + 헬스 체크**로 가용한 서버에 트래픽을 자동 분산, 서비스의 안정성과 연속성을 보장.\n- 구성요소 5개: **Load Balancer, Listener, LB 서버 그룹, 멤버, LB 헬스 체크**.\n- 생성 순서: **LB 생성 → LB 서버 그룹 생성 → 멤버 추가 → Listener 생성(서버 그룹 연결) → Firewall / Security Group 규칙 추가**.\n- LB는 Service Subnet에서 **Source NAT IP 1개 + Health Check IP 2개**를 할당받는다. 이 IP들이 방화벽·SG 규칙의 핵심.\n\n## 배경: 고가용성 설계와 LB\n- 네트워크 고가용성 전략(SPOF 제거): ① **Multi-AZ 구성**(네트워크·컴퓨팅 자원 분산) ② **Load Balancer 활용**(트래픽 분산, 과부하·장애 시 자동 우회) ③ **VPN 및 Direct Connect 이중화**.\n- WA 가용성: 웹 계층과 애플리케이션 계층 사이에 LB가 없으면 웹 계층이 서버 IP를 직접 지정해 강한 결합이 생기고, 서버 하나가 중단되면 요청이 유실된다. LB는 **단일 진입점**을 제공해 서버 IP 하드코딩 없이 요청을 전달하고, Auto-Scaling으로 생성·삭제되는 서버에도 자동 분산한다. LB는 **동기(Synchronous) 통신 기반 실시간 요청 처리**에 적합하며, 더 강한 결합 해제에는 Message Queue(비동기)가 적합하다.\n- WA 가용성 설계 원칙: **Virtual Server는 Load Balancer와 함께 중복 배치**하고, 요구 사항이 허용하면 Auto-Scaling으로 자동화된 중복 구성을 구현한다.\n- 서비스 가용률(WA 01): Virtual Server 단일 99.9%(43.8분), Virtual Server 이중화 99.99%(4.3분), Database(HA) 99.95%(21.9분), **Load Balancer 99.95%(21.9분)**.\n- 헬스 체크 기반 Fail-over 시간(WA 01): 기본값 **주기 5초, 대기시간 5초, 탐지 횟수 3회** → (5+5)×3 = **30초**. 값은 1~2,147,483,647초 범위에서 수정 가능하며 최소값으로 설정하면 장애 탐지 시간을 **6초**까지 줄일 수 있다.\n- WA 성능 효율성: 동일 작업을 하는 컴퓨팅 노드를 LB에 병렬 배치하면 전체 처리량이 늘어난다(전송 서버 확장).\n- SCP v2에서 바뀐 점: LB 구조가 **Load Balancer, Listener, LB 서버그룹, 멤버, 헬스체크**로 변경되었고 **크기 구분 없이 단일 스펙**으로 제공.\n\n## 구성요소\n| 구성요소 | 역할 | 관계 규칙 |\n|---|---|---|\n| Load Balancer | L4(TCP/UDP/TLS) 또는 L7(HTTP/HTTPS) 제공 | 하나의 LB에 **여러 Listener** 추가 가능 |\n| Listener | 클라이언트 요청 수신, 규칙에 따라 트래픽 목적지 결정, LB 유형에 맞는 프로토콜로 라우팅 | |\n| LB 서버 그룹 | 프로토콜, 부하 분산 방식, 멤버 헬스 체크 방식 설정 | LB 서버 그룹은 **하나의 Load Balancer에 연결** |\n| 멤버 | 서버 그룹에 추가해 가용성 관리 | 하나의 서버는 **여러 LB 서버 그룹의 멤버** 가능 |\n| LB 헬스 체크 | 멤버 상태 확인 | 서버 그룹과 동일 Subnet의 헬스 체크 선택 |\n\n- **LB, Listener, LB 서버 그룹, LB 헬스 체크는 모두 같은 Subnet(Service Subnet)에 구성, 멤버는 Subnet 제약 없음.**\n\n## L4 vs L7, 부하 분산 방식\n| 구분 | L4 | L7 |\n|---|---|---|\n| 계층 | 전송 계층(TCP/UDP/TLS) | 애플리케이션 계층(HTTP/HTTPS) |\n| 분산 기준 | IP 주소, 포트 | URL 패턴별 라우팅, URL 리디렉션, SSL Offloading |\n| 주요 특징 | 빠르고 단순한 분배 | 세분화된 분배, 보안 인증, 동적 라우팅 |\n| 단점 | 세밀한 제어 불가 | 리소스 소모 많고 처리 부하 큼 |\n\n서버 부하 분산 방식(5가지):\n- **(Weighted) Round Robin**: (가중치에 비례해) 순차 분산\n- **(Weighted) Least Connection**: (가중치에 비례해) 연결이 가장 적은 서버로\n- **IP Hash**: 클라이언트 Source IP를 해싱해 Hash값이 일치하는 서버로\n\n### Quota\n| 항목 | 값 |\n|---|---|\n| VPC당 LB 생성 가능한 Service Subnet 개수 | 3 |\n| Account당 LB 생성 개수 | 50 |\n| Account당 Listener 생성 개수 | 1,000 |\n| Account당 LB 서버 그룹 생성 개수 | 1,000 |\n| Account당 전체 LB 서버 그룹에 등록 가능한 멤버 | 1,000 |\n| Account당 LB 헬스 체크 생성 개수 | 500 |\n\n## 생성 순서와 선행 작업\n| 단계 | 선행 작업 |\n|---|---|\n| 1. LB 생성(L4/L7 선택) | VPC / Service Subnet 생성, L4/L7 결정 |\n| 2. LB 서버 그룹 생성 | 부하분산 방식/프로토콜/포트 결정, LB 헬스체크 선택(필요 시 생성) |\n| 3. 서버 그룹에 멤버 추가 | 추가할 서버 생성(Virtual Server 또는 Bare Metal Server) |\n| 4. Listener 생성(서버 그룹 연결) | HTTPS 사용 시 **Certificate Manager**에 생성한 인증서 등록 |\n| 5. 트래픽 제어 설정(FW, SG) | LB Firewall 사용 시 규칙 추가, Public NAT IP 예약·지정(필요 시), 멤버의 Security Group에 규칙 추가 |\n\n## 단계별 설정 항목\n### 1) Load Balancer 생성\n1. LB명 입력\n2. 서비스 구분: L4(TCP/UDP/TLS) / L7(HTTP/HTTPS) — 서비스에 맞는 Listener 프로토콜 생성 가능\n3. VPC 선택\n4. Service Subnet 선택 — Subnet 대역에서 **Source NAT IP 1개, Health Check IP 2개 자동 할당** (Source NAT IP: 멤버 통신용, Health Check IP: 멤버 헬스 체크용)\n5. Service IP 입력 — 클라이언트와 LB 간 통신용 LB IP, 미입력 시 Subnet 내 자동 할당\n6. Public NAT IP 체크 — 인터넷 서비스(IGW) 구성 시, 예약된 Public IP 선택\n7. Source NAT IP 입력 — Service Subnet 대역 내, 미입력 시 자동, **할당 후 수정 불가**\n8. 헬스 체크 IP 입력 — 2개, Service Subnet 대역 내, 미입력 시 자동, **할당 후 수정 불가**\n9. Firewall 사용 및 로그 저장 여부 — 선택하지 않아도 미사용 상태로 생성, 사용 시 LB 통신 규칙 추가 필요\n\n> [!팁]\n> 동일 Service Subnet에 여러 LB를 생성하면 **같은 Firewall, Source NAT IP, 헬스 체크 IP를 공유**한다.\n\n### 2) LB 서버 그룹 생성 (Networking > Load Balancer > LB 서버 그룹)\n1. 서버 그룹명 2. VPC 3. Service Subnet(**LB가 생성된 Service Subnet**) 4. 부하 분산 방식 5. 프로토콜 **TCP / UDP** — UDP 선택 시 UDP Listener만 연결 가능 6. LB 헬스 체크(동일 Subnet의 헬스 체크 선택, 신규 생성 가능)\n\n### 3) LB 헬스 체크\n- 기본 제공 목록: 프로토콜 HTTP/TCP, Port 80/443, URL 모니터 health/status, 대기시간·주기·탐지 횟수로 구분\n- 신규 생성 시 헬스 체크 포트, URL 경로, 대기시간, 주기, 탐지횟수 정의\n\n### 4) 멤버 추가 (서버 그룹 상세 > 연결된 자원 탭)\n- 대상: **Virtual Server, Bare Metal Server, IP로 직접입력** 중 선택\n- 멤버는 Subnet과 무관하게 등록 가능. **다른 VPC 서버는 VPC Peering 후 'IP로 직접 입력'**\n- 멤버별 포트와 가중치 입력\n- 헬스 체크 상태: **Healthy**(정상) / **Unhealthy**(비정상) / **Unknown**(확인 불가)\n- Virtual Server의 IP를 변경하면 LB 서버 그룹에서 기존 IP를 삭제하고 변경된 IP를 멤버로 직접 추가해야 한다(Compute 교재).\n\n### 5) Listener 생성 (LB 상세 > 연결된 자원 탭)\n| 항목 | L4 Listener | L7 Listener |\n|---|---|---|\n| 프로토콜 | TCP / UDP / TLS / TCP_Proxy | HTTP / HTTPS (HTTPS는 SSL 인증서 필요) |\n| 라우팅 규칙 | **'LB 서버 그룹 전달'로 고정**, 같은 Subnet의 서버 그룹 선택 | 라우팅 액션: **LB 서버그룹 전달**(URL 경로별 / 호스트 헤더별 서버 그룹 지정) 또는 **URL 리디렉션**(예: HTTP → HTTPS) |\n| 세션 유지 시간 | TCP/TLS 60~3,600초, UDP 60~180초 (60초 단위) | 60~3,600초 (60초 단위) |\n| 추가 옵션 | 프록시 프로토콜(TCP): 헤더에 클라이언트 IP 추가 여부 | HTTP 연결 제한 시간(클라이언트 연결 유지 시간, 서버 응답 대기 시간) |\n| 지속성 | TCP/TLS: 사용안함 / 소스IP (TLS는 SSL 인증서 추가) | 소스 IP / 쿠키 |\n| 헤더 | — | X-Forwarded-For(클라이언트 IP), Proto(요청 프로토콜), Port(요청 포트), HTTP 2.0 사용 |\n\n## 트래픽 제어 설정 (규칙이 없으면 LB가 정상 동작하지 않음)\nLB Firewall 규칙 **3개**:\n| 용도 | 출발지 IP | 목적지 IP | 프로토콜 | 목적지 포트 | 방향 |\n|---|---|---|---|---|---|\n| 클라이언트 → LB | 클라이언트 IP | LB Service IP | Listener 프로토콜 | Listener 서비스 포트 | Outbound |\n| LB → 멤버 연결 | LB Source NAT IP | 서버 그룹 멤버 IP | 서버 그룹 프로토콜 | 서버 그룹 포트(멤버 포트가 다르면 추가) | Inbound |\n| LB → 멤버 헬스 체크 | LB Health Check IP | 서버 그룹 멤버 IP | 헬스 체크 프로토콜 | 헬스 체크 포트(멤버 포트가 다르면 추가) | Inbound |\n\n멤버 서버의 Security Group 규칙 **1개**:\n| 용도 | 대상 주소 | 프로토콜 | 허용 포트 | 방향 |\n|---|---|---|---|---|\n| LB와 멤버 간 통신 | **LB의 Source NAT IP** | 서버 그룹 프로토콜 | 멤버 포트 | Inbound |\n\n> [!주의]\n> 교재(LB 슬라이드18·20)는 멤버 Security Group 규칙을 'Source NAT IP 대상 1개'로 정리한다. 모의고사 v1 해설은 '헬스 체크가 계속 실패하면 멤버 SG Inbound에 Source NAT IP와 Health Check IP를 허용'을 정답으로 든다. 헬스 체크 트래픽은 Health Check IP에서 오므로(LB 슬라이드9) 헬스 체크 포트가 막혀 있으면 SG에도 Health Check IP를 허용해야 한다고 이해하면 된다. 헬스 체크 실패 문제에서 L4→L7 변경, Public IP 할당, Subnet 이동, LB 분리 같은 선택지는 오답.\n\n## Auto-Scaling 연동 (Compute 교재)\n- Auto-Scaling Group 생성 시 **Load Balancer 연동 설정**: Group의 서버를 LB 서버그룹의 Member로 자동 등록, 선택한 VPC에 있는 서버 그룹 선택\n- **Weighted 부하 분산 서버 그룹은 선택 불가**(서버 그룹에서 부하 분산값 수정 가능)\n- Auto-Scaling Group당 LB 서버 그룹 및 포트 개수: **최대 3개**\n- **Draining timeout**: LB에서 서버를 분리하기 전 대기 시간(세션 정리), **기본 300초, 1~3,600초**\n- **상태 체크**: Virtual Server 및 LB 상태를 체크해 Unhealthy 서버 자동 교체. 유예기간(0 입력 시 미사용). 사용자가 Stop한 서버는 Unhealthy로 판단하지 않음\n\n## 컨테이너(Kubernetes Engine)와 LB\n- Ingress: Kubernetes Service에 대한 LB 생성 메커니즘. **Ingress Controller(Nginx 등)** + **Ingress 오브젝트**(host: prod.example.com, path: / → Service httpprod 등)로 **도메인·URL 기반 라우팅**.\n- 구성 흐름: 노드 배포 전략 결정(
