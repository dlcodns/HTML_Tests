ay-as-you-go | Per Usage(GB) |\n| DDoS Protection, IPS, Secured Firewall | Provisioning | Per Hour |\n| WAF, Config Inspection | Provisioning | Per Month |\n| Secured VPN | Provisioning | Per Year |\n| SingleID | Provisioning | Per User |\n| Secret Vault, Key Management Service(키 수 + 호출당) | Pay-as-you-go | Per Call |\n| Event Streams, Search Engine, Vertica(DBaaS), Data Ops, Data Flow | Provisioning | Per Hour |\n| Data Query | Pay-as-you-go | Per Usage(GB) |\n| API Gateway | Pay-as-you-go | Per Call |\n| AI/MLOps Platform, Cloud ML | Provisioning | Per Hour |\n| DevOps Service(Workflow는 횟수당 추가) | Pay-as-you-go | Per User |\n| Trail | Pay-as-you-go | Per Event |\n| Edge Server | Provisioning | Per 3/5years |\n\n> [!팁]\n> 헷갈리는 짝을 외워 두세요. Block Storage는 \"할당량\" 기준(Provisioning), File/Object/Archive Storage와 Backup은 \"사용량\" 기준(Pay-as-you-go)입니다. DNS는 Per Day, VPN·WAF·Config Inspection은 Per Month, Secured VPN은 Per Year, SingleID와 DevOps Service는 Per User, Trail은 Per Event, Edge Server는 Per 3/5years입니다.\n\n### 1.3 같은 앱, 두 가지 아키텍처(그림 6-1)\n\n이미지 서비스를 제공하는 모바일 애플리케이션을 두 방식으로 구현한 사례입니다.\n\n| 비교 | Provisioning 기반 3계층 웹 | Pay-as-you-go 기반 Serverless |\n|---|---|---|\n| 구성 | Virtual Server 중심 Web/App/DB | API Gateway(API 라우팅) + Cloud Functions(함수 처리) + Object Storage(REST API) |\n| 비용 특성 | 사용량과 관계없이 월 단위 일정 비용 | 호출당·용량당 과금, 실제 사용 시에만 청구 |\n| 적합 | 부하 변동이 적은 워크로드, 기존 앱 전환·신규 개발 시 익숙한 방식 | 부하가 주기적으로 증가하거나 예측이 어려운 환경 |\n| 과제 | 낮음(개발자·운영자에게 익숙) | API Gateway·Cloud Functions·Object Storage REST API 동작 이해 필요 |\n\n자원을 고를 때는 **사용 사례와 조직의 기술 역량을 함께** 고려해야 합니다.\n\n## 2. 자원 유형·크기·수량 선택\n\n- 온프레미스는 구축 초기에 미래 수요를 예측해 하드웨어를 사야 하고 구매 후 변경이 어렵습니다. 클라우드는 언제든 확장·축소할 수 있어 초기 자산 투자를 최소화할 수 있습니다.\n- 비용 효율을 높이려면 요청당 과금 자원이나 컨테이너처럼 자원 효율성·민첩성이 높은 기술이 유리합니다. 다만 Serverless·컨테이너는 조직 역량이 뒷받침되어야 하므로 그 비용과 리스크도 고려합니다.\n- 서버 타입은 **작게 시작해서 점진적으로** 사양을 높이거나 수량을 늘립니다. 순서는 ① 작은 용량 배포 → ② 소프트웨어·코드가 안정적으로 동작하도록 사양 조정 → ③ 단위 서버 용량 최적화 후 부하 테스트로 서버 수 확장입니다.\n- 큰 서버 몇 대에 여러 소프트웨어를 몰아넣기보다 **작은 서버 여러 대**가 비용·확장성에서 유리합니다. 예: 큰 서버 2대보다 작은 서버 3대가 가용성과 자원 활용률이 높고 신속한 확장이 가능합니다.\n\n## 3. 요금 모델 선택\n\n### 3.1 요금제(표 6-2)\n\n| 요금제 | 설명 | 적용 상품 |\n|---|---|---|\n| Cost Savings | 1년 또는 3년 동안 **시간당 사용 금액**을 약정하는 조건으로 할인 | Virtual Server, GPU Server, Bare Metal Server, Multi-node GPU Cluster, Database, Event Streams, Search Engine, Vertica(DBaaS) |\n| Planned Compute | 1년 또는 3년 동안 **사용 인스턴스 타입**을 약정하는 조건으로 할인 | 위와 동일 |\n\n- Edge Server는 무약정이 없고 약정 기간은 3년/5년입니다.\n- Planned Compute는 인스턴스 타입 기준 약정이며, 해당하는 무약정 인스턴스에 할인이 적용됩니다.\n- 서비스별 무약정 요금과 1년/3년 할인 요금은 **요금계산기**로 확인합니다.\n\n### 3.2 요금제 설계 예시(표 6-3)\n\n지난 1년 월평균 사용 시간이 향후 1년도 같다고 가정한 설계입니다.\n\n| 상품 | 서버 타입 | 수량 | 가동 패턴 | 요금제 |\n|---|---|---|---|---|\n| Virtual Server | S1v2m16 | 2 | 상시 가동(730시간) | 1년 약정 |\n| Virtual Server | s1v2m4 | 2 | 비정기(54시간) | Cost Savings |\n| Virtual Server | s1v4m32 | 3 | 비정기(365시간) | Cost Savings |\n| GPU Server | g2v48h4 | 1~4 | 정기적 변동(1,460시간) | Planned Compute |\n| Virtual Server Auto-Scaling | s2v2m4 | Min(2) | 정기적 가동(586시간) | Cost Savings |\n| Virtual Server Auto-Scaling | s2v2m4 | Max(8) | 정기적 부하(144시간) | 무약정 |\n| MySQL(DBaaS) | db2v4m32 | HA(2) | 상시 가동(730시간), 수직 확장 가능성 있음 | Cost Savings |\n| MySQL(DBaaS) | db2v4m32 | Replica(1) | 상시 가동(730시간), 필요시 Replica 확장 | Cost Savings |\n\n판단 근거는 다음과 같습니다.\n\n- 상시 가동 Virtual Server → 약정 요금제 할인.\n- GPU Server가 최소 1대~최대 4대로 쓰이며 월 1,460시간 → **같은 서버 타입**이므로 Planned Compute.\n- 비정기 VM, 정기적 부하를 처리하는 Auto-Scaling, 수직 확장 가능성이 있는 DB → 타입이 바뀔 수 있으므로 금액 기준인 Cost Savings.\n- Cost Savings 약정 금액은 **보수적으로** 정합니다. 과도하게 약정하면 쓰지 않은 금액까지 내야 하므로, 보수적으로 시작해 점진적으로 최적화합니다.\n\n### 3.3 소프트웨어 라이선스\n\n- 작은 서버에 소프트웨어를 분리 설치하면 서버 사양이 낮아도 문제없고, 소프트웨어 라이선스 구매 비용도 줄어듭니다(온프레미스식 대용량 서버 통합은 클라우드에서 오히려 비효율적일 수 있음).\n- **BYOL(Bring Your Own License)**: SCP의 Database, Analytics 등에서 지원합니다. 라이선싱 조건을 확인한 뒤 서버 배포 방안을 검토해야 예산 초과를 피할 수 있습니다.\n- 마켓플레이스의 3rd Party 소프트웨어 라이선스와 기술 지원팩 검토도 비용 효율을 높입니다.\n\n## 4. 아키텍처 선택\n\n### 4.1 수요 기반 탄력적 자원 구성(Auto-Scaling)\n\n- Virtual Server Auto-Scaling으로 수요 기반 비용 모델을 구성합니다.\n- 정책은 **임계치 기반**과 **스케줄 기반**의 수평 확장·축소 정책을 제공합니다.\n- 임계치 기반 정책은 CPU usage, Memory usage, Network in/out 등의 지표에 대해 최소값·최대값·평균값을 기준으로 임계치를 설정합니다.\n- 일반적으로 **확장은 빠르게 시작**해 부하에 선제 대응하고, **축소는 지연**시켜 부하 재상승에 대비합니다.\n\n### 4.2 Serverless로 임시 부하 처리(그림 6-4)\n\nAuto-Scaling은 **부하 증가 속도가 VM 생성 속도보다 느릴 때** 적합합니다. 부하 증가가 더 빠르거나 속도·규모를 예측하기 어려우면 관리형 Serverless Computing을 우선 검토합니다. 클라우드 자원이 무제한 부하를 처리하는 것은 아니지만, 예측 불가능한 부하에 안정적인 가용성을 확보하는 대안이 될 수 있습니다.\n\n평상시 부하는 상단 Auto-Scaling이, 급증 부하는 하단 임시 서비스가 처리합니다(한정 제품 프로모션, 인기 공연 예매 등).\n\n1. Terraform 등 IaC 도구나 CLI로 서비스를 배포·가동합니다. 요청 기반 과금 서비스는 사전 배포가 가능하지만, **CacheStore처럼 Provisioning이 필요한 서비스는 사전에 새로 배포한 뒤 정지 상태로 준비**합니다. 부하 개시 전 여유 시간이 필요하며, **Cloud Functions는 Cold Start라는 사전 가동 시간**이 있으므로 요청 개시 이전에 준비를 마칩니다.\n2. API Gateway로 요청을 분배합니다.\n3. Web 요청은 Object Storage 버킷의 Web 자산으로 응답합니다.\n4. 재고 확인과 주문 처리는 Cloud Functions가 수행합니다.\n5. CacheStore를 임시 데이터 저장소로 쓰고, 처리 완료 후 주 Database로 **배치 저장**합니다.\n\n모든 처리가 끝나면 자원을 삭제하거나 중지해 비용을 최소화합니다.\n\n### 4.3 데이터 전송 비용 최소화 네트워크 설계\n\n- 구축 초기에는 비용 비중이 가장 큰 **Compute 자원**에 주의를 기울입니다.\n- 운영 시작 후 예상하지 못한 비용의 대표 예는 **Internet Outbound Traffic** 비용입니다. VPC 외부로 전송되는 데이터에 과금됩니다.\n- 멀티 VPC 아키텍처에서는 인터넷 경유 트래픽을 최소화합니다. 여러 VPC 서버 간 연결은 인터넷 경유를 지양하고 **VPC Peering(두 VPC 간 연결) 또는 Transit Gateway**로 프라이빗 통신을 구성하면 비용이 최적화되고 보안도 향상됩니다.\n\nNetworking 교재의 비용 최적화 전략도 함께 정리합니다.\n\n| 항목 | 교재 내용 |\n|---|---|\n| 리전/AZ | 동일 리전·동일 AZ 트래픽 무료, 다른 AZ 간 트래픽은 비용 발생, 리전 간 통신은 더 비쌈 → 고가용성이 꼭 필요하지 않다면 단일 AZ로 비용 절감 |\n| VPC Peering vs Transit Gateway | Peering은 1:1 연결(트래픽 비용만), TGW는 중앙 허브형으로 다수 VPC 연결에 유리(생성 요금 + 트래픽 요금 + 포트이용료) → 단순 연결은 Peering, 복잡한 구성일 때 TGW |\n| VPN vs Direct Connect | VPN은 IPSec VPN Gateway 요금 + Internet Outbound Traffic, Direct Connect는 포트 요금 + 트래픽 요금 → 중소 규모는 VPN |\n| 트래픽 비용 | 인터넷 트래픽·데이터 전송 비용은 항상 발생하지만 숨어 있는 비용 → 모니터링으로 절감 방안 모색 |\n\nCompute 교재의 비용 전략: 적절한 리소스 규모, Auto-Scaling과 로드 밸런싱, 약정·대용량 할인과 **리전별 가격 차이**를 고려한 인스턴스 타입 선택, 컨테이너(지속적·예측 가능한 사용량일 때 서버리스 대비 유리)와 서버리스(간헐적·변수가 많을 때 유리), 하이브리드·멀티 클라우드의 인터넷 트래픽·데이터 전송 비용 고려.\n\n### 4.4 공통 서비스 영역 구성(그림 6-5)\n\n다중 VPC·다중 프로젝트로 여러 정보시스템을 운영할 때 공통 서비스를 별도 영역으로 묶어 공유합니다. 특히 **상용 소프트웨어가 설치된 서버**를 공통 영역으로 두면 경제적 효율이 극대화됩니다. 예시는 본사·지사 홈페이지를 클라우드로 통합 마이그레이션하는 조직입니다.\n\n1. 본사, 지사A, 지사B 시스템을 각각의 VPC에 두고 공통 서비스용 VPC를 별도로 구성합니다. 본사·지사 VPC는 공통 서비스 VPC와 **허브 앤 스포크(Hub-and-Spoke) 방식의 VPC Peering**을 맺습니다.\n2. 공통 소프트웨어를 VM에 탑재해 모든 시스템이 공유합니다(예: 영상 서비스, 지도 서비스).\n3. Bastion Server, Logging 서버 등 외부 접근·정보보호 목적 관리 서버를 별도로 두어 외부 접점을 단일화합니다. 단, 이 **단일 접점은 외부 침해 대비가 필요하며 보안상 단일 취약점이 될 수 있습니다.**\n\n효과: 자원·라이선스 비용의 중복 투자 방지, 관리 용이성, 아키텍처 확장성.\n\n## 5. 사용량 관리 및 최적화\n\n### 5.1 주기별 사용량 예측\n\n- **검토 주기 정의**: 약정(1년·3년 약정, Cost Savings, Planned Compute) 만료일 기준으로 3개월 또는 반기 단위 조정 주기를 두면 운영 계획 수립에 유리합니다. 회사 회계 기간과 일치시키면 조직 성과 평가에도 활용됩니다. 소프트웨어 라이선스·운영 관리 계약 기간도 고려합니다(예: 전체 자원 12개월, 데이터 저장소 6개월).\n- **사용량 증가 예측 6단계**\n  1. 모든 지출 항목이 부서·프로세스에 적절히 분류되었는지 평가·수정\n  2. 그룹별 지난 3개월 지출 평균 산출\n  3. 1년 전 동기 대비 평균 지출 산출\n  4. 두 평균을 비교해 추세 파악, 그룹별 성장률 반영\n  5. 향후 계획을 반영해 자원 수량·요금제 조정\n  6. FinOps 담당자와 공유·조율\n- **새 서비스·기능·구성 검토**: CSP는 지속적으로 신규 서비스를 추가하므로 정기적으로 도입 가능성을 검토합니다.\n\n### 5.2 외부 영향에 따른 예측\n\n- 응답 시간을 주요 성능 지표로 정의해 수요 변동을 판단하고, 외부 영향의 예측 가능성·반복성·변경 속도·규모를 분석합니다.\n- 분석 기간은 **계절성(Seasonality)** 을 고려해 **1년 이상**으로 잡습니다.\n- 분석 관점: 워크로드 유형(전자상거래, 내부 업무, 기계 학습 등), 사용률과 성능 지표(응답 시간·지연 시간 포함, 최대/최소 사용 시 조정 방안), 요청 부하 유형(DB 트랜잭션 중심인지 콘텐츠 전송 중심인지).\n- Cloud Monitoring 등에서 추출한 로그·모니터링 데이터로 변동폭과 추이를 파악하고, 수요에 영향을 주는 부서와 협업해 이벤트를 확인합니다.\n\n### 5.3 자원 유형·크기·수량 조정(리사이징)\n\n- 목표는 **비용 절감과 서비스 안정성 사이의 균형**입니다. 데이터 기반 전략적 의사결정이 필요합니다.\n- 워크로드의 모든 자원·속성과 **조정 작업 인건비**까지 고려합니다. 인건비가 절감액보다 크면 정기 반복 대신 서비스 변경·중단 시점에 일회성으로 수행합니다.\n- 가시성 확보: CPU 사용률, 메모리 사용률, 네트워크 처리량, 디스크 사용률로 서버 타입·디스크 용량을 정의합니다.\n- 운영팀의 주요 목표는 필요한 운영 용량을 안정적으로 유지하는 것이며, 상용 애플리케이션 자원 조정은 라이선스 문제로 복잡하므로 신중히 접근합니다.\n- **비용이 높은 자원에 집중**합니다. 낮은 사양 Virtual Server보다 높은 사양 Database에 집중하면 절감 효과가 큽니다.\n- 데이터 기반 리사이징은 Scale-up과 Scale-out 모두에 적용합니다. 수동 예: LB의 Virtual Server 수 증가, Kubernetes Node pool 또는 Pod replica set 수 조정. 평균 CPU 사용률 등 지표로 자동화할 수 있으며, 최소·최대 작업 노드 수로 용량 범위를 정합니다.\n- 운영 우수성 백서의 컴퓨팅 최적화 기준: 평균 CPU가 아니라 통계적으로 유의미한 지표를 씁니다. 예: **지난 14일간 P95 CPU 사용률 30% 미만**이면 축소 후보입니다.\n\n### 5.4 유휴 자원 폐기\n\n- 유휴 자원 관리는 자원 최적화 작업 중 **가장 중요하고 효과적인** 작업입니다.\n- 관리자가 직접 만들지 않은 자원은 삭제가 어렵고, 중요 데이터나 보존 목적이 있을 수 있으므로 **사용 이력 확인 방법과 폐기 절차**가 필요합니다.\n- 수명주기 **태그 정책**: 테스트용 여부, 테스트 완료 시점, 라이선스 만료 기간 등을 태그로 식별합니다.\n- 모든 자원은 관련 부서·담당자 정보를 포함하고, 폐기 전 이해관계자에게 사전 공지·확인 절차로 데이터 유실을 방지합니다.\n- 중요도가 낮은 자원은 자동 폐기·삭제 자동화가 가능합니다.\n- 운영 우수성 백서 예시: Unattached Disks/Volumes, Old Snapshots/Images를 정기 점검으로 삭제하는 정책.\n\n## 6. FinOps 전략 수립 및 실행\n\n### 6.1 정의\n\nFinOps는 엔지니어링·재무·사업 팀의 협업으로 시기적절한 데이터 기반 의사결정을 수행해 재무적 투명성과 책임을 확립하고 클라우드의 비즈니스 가치를 극대화하는 **운영 프레임워크이자 문화적 관행**입니다(FinOps Foundation). FinOps Framework는 원칙·도메인·역량·주체·단계를 제시합니다.\n\n### 6.2 원칙(Principles)\n\n| 원칙 | 요점 |\n|---|---|\n| 팀 협업 | 리소스당·시간당 비용이 나므로 재무·엔지니어·상품/서비스·사업팀이 수시 협업 |\n| 비즈니스 가치 기반 의사결정 | 총 지출보다 단위당 경제성 지표가 중요, 비용·품질·속도 절충, 클라우드를 혁신의 원동력으로 |\n| 모든 주체에 사용량 책임 부여 | 엔지니어는 설계부터 운영까지 비용 책임, 부서 예산 범위 내 관리, 의사결정 분산, SDLC 초기부터 비용을 효율성 지표로 |\n| 실시간 확인 가능한 FinOps Data | 비용 데이터 즉시 처리·공유, 실시간 예측·계획, 트렌드·변동 분석, 내부·업계 벤치마킹 |\n| 전담팀이 FinOps 주도 | 전담팀은 모범 사례 전파·지원, 경영진 지지, 요금·약정·할인은 통합 관리, **엔지니어·운영팀은 할인율 협상에 관여하지 않음** |\n| 클라우드 가변 비용 모델 이용 | 가변 비용을 위험이 아닌 기회로, just-in-time 구매, 정적 장기 계획보다 민첩한 반복 계획, 선제적 설계와 지속 조정 |\n\n### 6.3 주체(Persona)\n\n| 주체 | 분류 | 역할 요약 |\n|---|---|---|\n| FinOps 실무 | 핵심 | 사업·엔지니어링·재무 연결고리, 문화 정착, 중앙 전담 기능 |\n| 경영진(CTO/CIO 등) | 핵심 | 책임 강화, 투명성, 팀 효율, 예산 초과 방지 |\n| 상품/서비스(PM 등) | 핵심 | 사업·제품 관리, 엔지니어링과 협력해 디지털 가치 창출 |\n| 엔지니어 | 핵심 | 자원 위치 선정, 크기 조정, 워크로드 관리, 미사용 자원 제거, 지출 이상 모니터링 |\n| 재무 | 핵심 | 과거 청구 데이터 분석, 예측 모델 기반 계획·예산, 약정 할인 구매, 송장 관리 |\n| 구매 | 핵심 | 벤더 제품 소싱·구매, 계약 조건 이행 관리 |\n| ITSM/ITIL | 연관 조직 | IT 서비스 운영 표준화, 서비스 수준·성능 목표와 비용 우선순위 균형 |\n| ITAM | 연관 조직 | 클라우드 사용에 영향을 주는 IT 자산 관리, 규정 준수 |\n| 지속경영(ESG) | 연관 조직 | 환경 영향 최소화, 지속 가능성 목표와 비용의 균형 |\n| 보안 | 연관 조직 | 보안 지출 최적화, IT 보안 재무 거버넌스 |\n| ITFM | 연관 조직 | IT 지출 투명성, 투자의 비즈니스 우선순위 부합 |\n\n### 6.4 단계(Phase): Inform → Optimize → Operate 반복\n\n| 단계 | 이름 | 활동 |\n|---|---|---|\n| Inform | 가시성 및 할당 | 비용·사용량·효율 데이터 수집·분석, 데이터 소스 식별, 할당(태그·사용자·비즈니스 규칙), 보고서, 예산·추세 예측·KPI, 팀 간 벤치마킹 |\n| Optimize | 요금 및 사용량 | 활용도 낮은 자원 적정 크기 조정, 최신 아키텍처 적용, 낭비 제거, 약정 할인·Cost Savings 구매·관리 강화 |\n| Operate | 지속적인 향상과 사용량 | 거버넌스 정책, 규정 준수 모니터링, 교육, 가이드라인·자동화 정책, 권한 부여, 책임 문화, 필요 시 Inform·Optimize로 되돌아가 성숙 |\n\n### 6.5 도메인과 활동\n\n| 도메인 | 활동 |\n|---|---|\n| 클라우드 사용량과 비용 이해 | 데이터 수집(Data Ingestion), 할당(Allocation), 보고서 및 분석(Reporting & Analytics), 이상 징후 관리(Anomaly Management) |\n| 비즈니스 가치 계량화 | 계획 및 추정(Planning & Estimating), 예측(Forecasting), 예산(Budgeting), 벤치마킹(Benchmarking), 단위당 경제성(Unit Economics) |\n| 클라우드 사용량과 비용 최적화 | 클라우드 아키텍처 설계(Architecting for Cloud), 요금 최적화(Rate Optimization), 워크로드 최적화(Workload Optimization), 클라우드 지속성(Cloud Sustainability), 라이선싱 & SaaS |\n| FinOps 실행 관리 | FinOps 실행 운영(Practice Operations), 클라우드 정책&거버넌스, FinOps 평가(Assessment), FinOps 도구&서비스, FinOps 교육(Education & Enablement), 정산 관리(Invoicing & Chargeback), 워크로드 전환(Onboarding Workloads), 관련 부서 협업(Intersecting Disciplines) |\n\n### 6.6 성숙도\n\n소규모로 시작해 규모·범위·복잡성을 확대합니다.\n\n| 성숙도 | 특성 | KPI 예시 |\n|---|---|---|\n| Crawl | 보고서·도구 거의 없음, 기본 KPI, 기본 절차·정책, 주요 부서가 이해는 하나 적극 참여는 아님, 쉽게 달성할 계획 중심 | 최소 50% 할당, 약정 적용률 60%, 예측과 실제 차이 20% 이내 |\n| Walk | 일부 부서 수행, 어려운 케이스는 예외로 의사결정, 활동 자동화·프로세스화, 중상급 KPI | 최소 80% 할당, 약정 적용률 70%, 차이 15% 이내 |\n| Run | 모든 팀 수행, 난이도 높은 케이스 해결, 최상급 KPI, 자동화 선호 | 최소 90% 할당, 약정 적용률 80%, 차이 12% 이내 |\n\n### 6.7 단계별 비용 요구사항(표 6-10)\n\n- Inform: 지출 데이터를 비즈니스에 매핑, Showback·Chargeback 관리, 예산·예측 비용 확정, 태그 규칙과 준수 방안, 공유 비용 공평 할당, 맞춤형 요율·상각비 동적 계산, 추세·편차 분석, 심사표·벤치마킹\n- Optimize: 이상 징후 확인, 낮은 사용률 서비스 보고, 약정 VM 중앙 관리, 요금과 워크로드 배치 비교\n- Operate: 이해관계자에게 지출 데이터 제공(보고서 자동화), 목표에 맞는 문화적 변화, 적합한 크기의 서버 타입(Optimize 권장 적용), 사용 거버넌스·통제, 효율성·혁신 지속 개선, 리소스 최적화 자동화, 권장 사항을 워크플로우에 통합, 정책 기반 태그 정리·스토리지 수명주기 정책\n\n| 용어 | 의미 |\n|---|---|\n| Showback | 비용을 추적해 부서에 **전달**만 함. 실제 청구 없이 인식 제고 |\n| Chargeback | 실제 비용을 부서에 **할당·청구**. 미리 정한 요율·비용 모델로 청구서 발행 |\n\n### 6.8 비용 모델링\n\n- 온프레미스는 초기 고정비, 클라우드는 실제 수요에 따라 월·일·시간 단위로 변동합니다. 효율·민첩성은 높아지지만 변동 폭도 커지므로 기존 예산 프로세스에 변동성을 반영해야 합니다.\n- 변동성 파악 접근\n  - Business Practice 접근: 성수기·명절 등 주기적 증가 시기, 프로젝트·마케팅 이벤트 계획, Forecasting 자료 수집 주기\n  - Data Analytics 접근: 주기적 증가의 과거 데이터 반영, 비즈니스 이벤트 과거 데이터 반영, 예측과 실제의 갭 분석, 장기 추세\n- 모델링 절차: 지출 그룹화 → 그룹별 지난 3개월 평균 → 1년 전 동기 평균 → 추세·성장률 반영 → 향후 계획 반영 → FinOps 주체와 공유·조정\n\n### 6.9 CiO(Cloud in One) 기반 비용 관리\n\nCiO는 FinOps 프로세스를 지원하는 Samsung SDS의 협업 플랫폼이자 Managed Service 오퍼링입니다. 전사 FinOps 정착, 실시간 정보 공유·협업, 요금 할인·자원 최적화 추천/실행(Short-term), 통합 자원 관리를 통한 Enterprise Discount Program 이익 공유(Long-term), FinOps 표준 프로세스를 제공합니다.\n\n| FinOps 관리 지표 질문 | 확인 내용 |\n|---|---|\n| 자원을 얼마나 효과적으로 사용하는가 | 적정 규모(Rightsizing), 장기 미사용 자원 식별, 특정 시간대에만 쓰는 자원 관리(Scheduling) |\n| 자원 최적화를 얼마나 잘 실행하는가 | 기준에 따른 최적화 실행, 적시 검토·실행 |\n| 비용 효율화를 얼마나 적극 설정했는가 | 약정할인 서비스 적용 정도 |\n| 비용 효율화를 얼마나 잘 실행하는가 | 약정할인 이행률 관리 |\n\n## 7. 복합 서비스 설계 정리\n\n| 요구 상황 | 권장 조합 |\n|---|---|\n| 평상시 일정 부하 + 이벤트성 폭증 | Auto-Scaling(평상시) + API Gateway·Cloud Functions·Object Storage·CacheStore 임시 서비스(폭증), 종료 후 삭제·중지 |\n| 상시 가동 서버 | 약정 요금제 |\n| 같은 타입 GPU를 정기적으로 변동 사용 | Planned Compute |\n| 타입 변경·수직 확장 가능성, 비정기 가동 | Cost Savings(보수적 약정) |\n| 여러 VPC 간 통신 | VPC Peering 또는 Transit Gateway(인터넷 경유 지양) |\n| 여러 시스템의 공통 상용 SW | 공통 서비스 VPC + Hub-and-Spoke Peering |\n| 개발·테스트 서버 | 업무 시간 외 중지(Scheduling) |\n\n> [!시험]\n> - CacheStore는 Provisioning 서비스입니다. 이벤트 전에 **새로 배포 후 정지 상태로 준비**합니다. \"요청이 오면 자동 생성\"은 오답입니다.\n> - Cloud Functions의 Cold Start 때문에 요청 개시 **이전에** 준비를 마칩니다.\n> - Cost Savings는 **금액 약정**, Planned Compute는 **인스턴스 타입 약정**, 둘 다 1년/3년입니다. Cost Savings 금액은 넉넉하게가 아니라 **보수적으로** 시작합니다.\n> - FinOps 단계 순서는 **Inform → Optimize → Operate**이고, 성숙도는 **Crawl → Walk → Run**입니다.\n> - 공통 영역의 단일 관리 접점은 편리하지만 **보안상 단일 취약점이 될 수 있습니다.**\n> - 운영 시작 후 예상 밖 비용의 대표 예는 **Internet Outbound Traffic**입니다.\n\n> [!주의]\n> 리사이징 판단 기준에 대해 WA백서 05는 \"지난 14일간 P95 CPU 사용률 30% 미만\" 같은 백분위 지표를 예로 듭니다. 일반적인 평균값 기준보다 상위 백분위 기준이 권장된다는 취지이며, 백서 06에는 별도의 수치 기준이 없습니다.\n\n출처: WA백서 06 p.1~32, WA백서 05 p.9~11, SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드19, SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드14\n"}, "2-1b": {"title": "운영우수성 원칙 기반 복합 서비스 설계", "md": "## 한눈에 보기\n\n운영 우수성은 **비즈니스 가치를 극대화하기 위해 애플리케이션을 최소한의 중단으로 안정적으로 실행하고, 시스템 효율을 높이기 위해 지속적으로 개선하는 활동**입니다(WA백서 05). 엔터프라이즈 애플리케이션은 SLA로 가용성을 정의하므로, 운영팀은 비즈니스 요구를 이해하고 이벤트에 신속히 대응해야 합니다.\n\n| 장 | 주요 내용 |\n|---|---|\n| I. 운영 계획 | 규정(ISMS-P 운영관리 통제), ITSM 프로세스, 시험·운영 분리, 소스 관리, 운영 이관, 변경 관리, 성능·장애 관리, Managed Service 관리 항목, 클라우드 운영 조직 |\n| II. 운영 설계 | Quota, 사용량 추이·용량 조정, 자원 최적화(P95), 자동화(IaC·중앙 저장소·CI/CD), 배포 전략, 버전 관리, 테스트·롤백, 모니터링·로그, 이벤트 대응 |\n| III. 평가 및 개선 | 지속적 개선 프로세스(DevOps 파이프라인), RCA 5단계, 지식 관리(문서화 자동화) |\n\n## 1. 운영 요구사항과 규정\n\n### 1.1 ISMS-P 운영 관련 통제 항목(표 5-1)\n\nISMS는 일정 규모 이상 사업자가 최종 사용자에게 서비스할 때 반드시 취득해야 하는 가장 일반적·필수적 규정 준수 요건입니다. 운영 우수성 원칙 수립 시 특히 **변경 관리, 성능 관리, 장애 관리**를 면밀히 검토합니다.\n\n| 구분 | 통제 항목 | 요점 |\n|---|---|---|\n| 정보시스템 도입 및 개발 보안 | 시험과 운영환경 분리 | 비인가 접근·변경 위험을 줄이기 위해 원칙적으로 분리 |\n| | 소스 프로그램 관리 | 인가된 사용자만 접근, 운영환경에 보관하지 않음 |\n| | 운영환경 이관 | 통제된 절차, 실행코드는 시험·사용자 인수 절차에 따라 실행 |\n| 시스템 및 서비스 운영관리 | 변경 관리 | 모든 변경 내역 관리 절차, 변경 전 성능·보안 영향 분석 |\n| | 성능 및 장애관리 | 성능·용량 요구사항 정의와 지속 모니터링, 장애 시 탐지·기록·분석·복구·보고 절차 |\n\n### 1.2 ITSM 핵심 프로세스(표 5-2)\n\nITSM은 IT 서비스를 비즈니스 요구에 맞춰 설계·구축·제공·운영·관리하는 프로세스 기반 접근이며 ITIL이 대표 프레임워크입니다. 기술 중심이 아니라 서비스 전체 라이프사이클 관점입니다.\n\n| 구분 | 프로세스 | 설명 |\n|---|---|---|\n| 서비스 전환 | 변경 관리 | 모든 변경을 통제된 절차로 관리해 서비스 중단·비즈니스 위험 최소화 |\n| | 릴리스 및 배포 관리 | 승인된 변경을 운영 환경에 안전하게 배포·이관하는 라이프사이클 계획·통제 |\n| 서비스 운영 | 장애(인시던트) 관리 | 예기치 않은 중단·품질 저하를 신속히 탐지·기록·분석·복구 |\n| | 문제 관리 | 근본 원인(Root Cause) 규명, 재발 방지 대책 |\n| | 서비스 수준 관리 | SLA 목표(가용성·성능) 달성 여부 모니터링·측정·보고·개선 |\n| | 용량 관리 | 현재·미래 요구에 필요한 자원과 성능을 비용 효율적으로 확보 |\n\n### 1.3 규정에서 나오는 설계 원칙\n\n- **시험·운영 환경 분리**: 개발·테스트 환경은 **VPC, 계정(Account) 단위**의 논리적·물리적 분리로 반드시 운영과 분리합니다. 개발자가 운영 시스템에 직접 접근하지 못하도록 **IAM 정책**으로 엄격히 제한합니다. 조직이 작아 업무 분리가 어려우면 상호 검토, 상급자 모니터링, 변경 검토·승인 절차로 보완합니다.\n- **소스 프로그램 관리**: 인가된 개발자에게만 접근 권한, 정기 백업, 변경 이력 기록과 검토·승인. Git, SVN 같은 형상관리 도구 사용.\n- **운영 환경 이관**: 개발자가 아닌 **별도 담당자**가 이관합니다. 테스트 완료 여부, 이관 전략, 롤백 방안을 사전에 검토합니다. DevOps 환경에서 개발자가 배포하더라도 모든 개발자가 아니라 **특정 인원에게만 권한을 위임**하고, 자동 배포 과정에 **승인 절차**를 둡니다.\n- **변경 관리**: OS 업그레이드, 상용 SW 설치, 앱 개선, 네트워크·서버 사양 변경 등은 절차를 수립·이행합니다. SCP에서는 아키텍처, 가상 서버 변경, 이미지 업그레이드를 체계적으로 관리합니다. **IaC로 변경을 템플릿화**하고 변경별 문서화, **적용 전·후 상태 비교**, 대규모 변경은 중요도별 영향 분석과 **이전 버전 IaC 코드로의 롤백** 방안을 마련합니다. 자동화 도구와 모니터링·알림으로 적용 상태를 실시간 확인하고, 정기 검토·감사로 IaC 품질을 개선합니다.\n- **성능 및 장애 관리**: 관리 대상 식별 기준, 성능·용량 임계치, 모니터링 방법, 결과 기록·분석, 임계치 초과 대응 절차를 마련합니다. CPU·메모리·디스크 사용률 등 구성 요소와 응답 시간·처리량 등 지표를 정의해 실시간 모니터링합니다. 장애 유형·심각도, 보고 절차, 탐지 방법, 대응·복구 책임과 역할, 고객 안내 절차와 비상 연락 체계를 갖춥니다. 장애 대응 이력(발생 일시, 심각도, 담당자·책임자, 내용·원인, 조치·복구, 재발 방지 대책)은 **장애조치 보고서**로 관리합니다.\n\n### 1.4 Managed Service 관리 항목(표 5-3)\n\n| 항목 | 내용 |\n|---|---|\n| 청구/보고서 | 월 사용료 청구, CSP 기술 지원 등급, 크레딧 등 빌링 공제 요소 |\n| 서비스 지원 | 요청 접수, 작업 수행 시간(24h X 365d, 9h X 5d 등), 처리 결과 공유 |\n| 자원 관리 | 자원 생성/변경/삭제, 데이터 마이그레이션, 백업 & 복구 |\n| OS 운영 | 업데이트·패치, 성능 최적화, 시스템 설정 |\n| 장애 대응 | 장애 알림(목록·전송·방법·시간), SLA 기반 대응 조치 시간, 분석 결과 보고, 재현 테스트 |\n| 기술지원 | 이슈 대응·트러블슈팅, 아키텍처 수립/개선, 비용 최적화, 사용량 검토 |\n| 보안 | 보안 진단·조치, 사용자·권한 정기 점검, 보안 정책 관리, 보안 공지 |\n| 모니터링 | 모니터링 설정, 임계치 적용·관리, 에이전트 관리 |\n| 보고 | 정기(월간 운영보고서, 연간 계획서), 비정기(감사 대응, 사용량 위험, 서비스 중단 공지) |\n\n## 2. 클라우드 운영 조직\n\n핵심 목표는 과거에 상충한다고 여긴 **비즈니스 속도(Agility)와 서비스 안정성(Reliability)을 동시에** 달성하는 것입니다. 전통 조직에서는 개발(빠른 출시)과 운영(무중단 안정성)의 목표 충돌이 병목을 만들었고, 이를 해결하려 등장한 것이 **DevOps 문화**(전체 생명주기에 걸쳐 목표를 일치시키고 책임을 공유)입니다. 클라우드 운영 조직은 변경을 통제하는 역할을 넘어 CI/CD 파이프라인, IaC 템플릿, 모니터링·보안이 내재된 플랫폼을 제공합니다.\n\n| 구분 | 전통적 IT 운영 조직 | 클라우드 운영 조직 |\n|---|---|---|\n| 운영 우선순위 | 부서별 목표 최적화(개발은 기능, 운영은 안정성) | 공동의 비즈니스 목표(빠른 배포와 안정적 서비스) |\n| 역할 구분 | 명확한 기술 영역(서버, 네트워크, DB, 보안) | 자동화·효율 강조, 여러 기술 분야 복합 수행 |\n| 주요 역할 | 시스템·네트워크·DB·보안 관리자 | SRE, DevOps 엔지니어, 클라우드 아키텍트, 보안 관리자 |\n| 운영 방식 | 업데이트·유지보수 중심, 개발과 운영 분리 | 자동화된 업데이트·관리, 개발과 운영 연결·통합 |\n\n운영 모델은 워크로드 구성 방식에 따라 달라집니다.\n\n| 상황 | 운영 모델 | 장점 | 단점 |\n|---|---|---|---|\n| Lift & Shift 전환, 일부만 이전하고 나머지는 온프레미스 유지 | ① 클라우드 운영 조직을 **별도 추가** | 클라우드 전문성 강화, 환경별 집중 관리 | 역할 중복, 커뮤니케이션 비용 |\n| 동일 | ② 기존 조직 역할에 클라우드 운영 **통합** | 통합 운영 모델, 협업 강화, **클라우드·온프레미스 간 일관된 정책·프로세스 유지에 유리**, 리소스 효율 | 클라우드 전문성 부족 시 운영 효율 저하 |\n| 주요 워크로드가 클라우드로 전환·신규 구축 | 클라우드 인프라 운영 조직 + 개발팀 | 운영 조직은 리소스 관리·모니터링·보안·최적화, 자동화, 개발팀은 클라우드 네이티브·MSA·CI/CD | |\n| 주요 시스템을 클라우드 기반 CI/CD 앱으로 재구축 | **클라우드 원팀(One Team)**: 운영팀+개발팀 = DevOps팀 | 빠른 배포와 안정 운영 동시 달성 | |\n| 보안 강화 필요 | **DevSecOps**: 보안·개발·운영 한 팀 | 처음부터 안전한 앱 구축 | |\n\n## 3. 자원 관리 및 최적화\n\n- 클라우드 자원 관리 최적화는 기술 용량 관리를 넘어 **비즈니스 성과 대비 비용 효율**을 극대화하는 지속 활동이며, 기술 역량과 FinOps를 결합합니다. 초기 설계부터 탄력적 설계를 고려합니다.\n- **용량 제한(Quota)**: 특정 고객·프로젝트의 자원 독점을 막기 위한 제한입니다. 사전에 용량 요구사항 파악, 부하 급증에 대비한 자동 확장 계획, 제한 용량 정기 검토. Console > Management > **Quota Service**에서 확인하고, 일부 서비스는 증가 요청이 가능하므로 **배포 전에 미리 요청**합니다.\n- **평균 사용량 추이 분석과 용량 조정**: 주요 워크로드 식별, 평균·최대 사용률, 현재·미래 요구 평가(업무 흐름·계획 이해 필요). 지난 3개월 최고 사용량, 시간대별·분당 최고 사용량으로 패턴 도출. Cloud Monitoring으로 평균·최대 사용률, 급격한 변화, 특정 기간 급증을 분석합니다. 계획된 부하 급증 이벤트는 **초과 프로비저닝을 미리 검토**하고, 제한 용량 근접 시 자동 알림이 가는지 확인합니다.\n- **자원 최적화**\n  - 컴퓨팅: 평균 CPU가 아니라 통계적으로 유의미한 지표. 예: 지난 14일간 **P95 CPU 사용률 30% 미만**. P95는 95번째 백분위수로 최대 부하 시 안정성을 봅니다. 80~90%대 P95는 일반적일 수 있지만 100%에 가까우면 병목·과부하 의미.\n  - 유휴 자원: Unattached Disks/Volumes, Old Snapshots/Images를 정기 점검 후 삭제.\n  - 비용 모델: 기술 최적화 이후 FinOps로 청구서 자체를 할인(즉시 사용, 약정 플랜, 대용량 할인 조합).\n\n## 4. 자동화 프로세스 설계\n\n### 4.1 자동화 적용 영역(표 5-5)\n\n| 영역 | SCP 구현 |\n|---|---|\n| 파이프라인 정의·실행·관리 | DevOps Service로 CI/CD 파이프라인 자동화 |\n| 배포 | Terraform 같은 IaC로 인프라 배포·업데이트 자동화 |\n| 테스트 | DevOps Service 파이프라인에서 SonarQube로 테스트 자동화 |\n| 크기 조정 | Auto-Scaling, Kubernetes Engine Node Pool 자동 확장 |\n| 모니터링 및 경고 | Cloud Monitoring 임계치 기반 이벤트로 알림 트리거 |\n\n인프라 수준에서는 컨테이너 기반 자동화, 애플리케이션 수준에서는 코딩·빌드·통합·릴리즈·배포 파이프라인을 구성합니다. DevOps 환경의 자동화 요소는 코드 기반 인프라 관리, 중앙 집중형 코드 저장소, CI/CD 파이프라인입니다.\n\n### 4.2 IaC: 선언형 vs 지시형\n\n| 구분 | 선언형 | 지시형 |\n|---|---|---|\n| 방식 | 배포 완료 **상태**를 정의 파일에 명시하고 그 상태를 유지 | 배포 작업을 **단계별로 지시** |\n| 실패·변경 시 | 선언 상태를 만들기 위해 반복 작업, 장애로 변경돼도 원래 상태로 자동 복구 | 운영자가 직접 개입해야 하는 경우 많음 |\n| 운영 환경 적합성 | **더 적합** | 상대적으로 낮음 |\n\nSCP는 **CLI와 Open API**를 제공하므로 Terraform으로 자원 배치를 자동화할 수 있습니다. 절차: Terraform 작업용 **인증키 생성** → 환경 설정 → 자원·환경을 코드로 작성 → Terraform 명령으로 **kr-west1, kr-east1 Region**에 VM 배포.\n\n### 4.3 중앙 코드 저장소\n\nDevOps Service는 소스 저장·형상 관리 도구를 내장합니다. 프로젝트별 **Private Git Repository**와 사용자별 접근 권한을 설정합니다. 사용자가 Git에 Push하면 **Jenkins 파이프라인**이 트리거되어 빌드된 애플리케이션 또는 컨테이너 오브젝트 선언 파일이 **Kubernetes Engine**에 자동 배포됩니다. 소스 코드와 **인프라 구성 선언 파일을 함께** 저장하면 변경을 통합 관리하고 버전 관리로 이전 상태로 복구할 수 있습니다.\n\n### 4.4 CI/CD\n\n| 구분 | 의미 |\n|---|---|\n| CI(지속적 통합) | 자주 Commit, 자동 빌드·테스트(단위·통합 테스트). 모든 Commit이 자동 빌드·테스트를 생성. 운영 최종 배포는 보통 개발자가 직접 트리거 |\n| CD(지속적 배포) | CI를 확장해 테스트를 통과한 빌드를 테스트·운영 환경에 자동 배포 |\n\nDevOps Service 기반 개발·테스트·운영 CI/CD 흐름(그림 5-5)은 다음 순서입니다.\n\n1. DevOps Service 신청 후 사용자 영역에 소스 저장소와 CI/CD 툴을 구성해 DevOps Console과 연계\n2. 개발자가 개발자 branch에 Push\n3. 개발자 branch를 Dev branch로 Pull 요청\n4. 리뷰 후 Dev branch에 병합(merge)\n5. CI/CD 빌드 파이프라인 실행: 체크아웃 → 빌드 → 컨테이너 이미지 빌드\n6. 이미지를 Container Registry에 저장\n7. 대상 클러스터(dev) 컨테이너에 신규 이미지 배포\n8. 개발자가 frontend 컨테이너에 접근해 결과 확인\n9. Dev → Stage 확인 후 Production branch에 병합하고 Production 클러스터 대상으로 4~8 반복\n10. **블루-그린 배포**로 릴리스해 End User에게 제공\n\n## 5. 클라우드 배포 전략\n\n배포는 장애의 주요 원인 중 하나이므로 자동화, 모니터링, 롤백이 필수입니다.\n\n| 배포 전략 | 정의 | 가동 중지 | 롤백·특징 |\n|---|---|---|---|\n| 인플레이스(In-place) | 현재 서버에서 업데이트 | 한 번의 배포로 업데이트 → **일정 수준 가동 중지 발생** | 인프라·DNS 변경 거의 없어 배포는 빠름, 실패 시 **재배포가 유일한 복원** |\n| 롤링(Rolling) | 서버 군을 그룹으로 나눠 점진 배포 | 최소화, 제로 다운타임에 유리 | 신·구 버전 공존, 실패해도 일부만 영향, 배포 시간은 인플레이스보다 김 |\n| 블루-그린(Blue-green) | 기존 서버를 새 서버로 **점진적으로** 교체 | 0 | 블루=현재 운영, 그린=새 버전 병렬 환경. 문제 시 블루로 되돌려 롤백. DNS 컷오버, Auto-Scaling 그룹 정책, **GSLB Ratio 가중치**로 전환 |\n| 레드-블랙(Red-black) | 기존 서버에서 새 서버로 **즉시** 전환 | 빠른 전환 | 블루-그린과 유사하지만 DNS를 **일시에** 변경, **하나의 버전만 활성화** |\n| 불변(Immutable) | 완전히 새로운 서버 세트 구축 | | 알려지지 않은 종속성·복잡한 인프라에 적합, 기존 VM 종료하고 새 VM 배포 |\n\n- Auto-Scaling 정책으로 기존 인스턴스를 새 버전 VM으로 점진 교체하는 방식은 **마이너 릴리스·소규모 변경**에 적합합니다.\n- 배포 전략 선택 시 가동 중지 시간뿐 아니라 **비용(교체 VM 수, 배포 빈도)** 도 고려합니다.\n- 카나리 배포는 소규모 사용자 그룹에 새 버전을 점진 적용해 문제를 조기에 발견합니다. 블루-그린은 신·구 버전을 동시에 운영해 빠르게 이전 버전으로 전환할 수 있습니다.\n\n### 5.1 테스트와 롤백 자동화\n\n- 운영 우수성은 단기 목표가 아니라 **지속적인 여정**입니다. 보안 패치, SW 업그레이드, 규정 반영 등 변경은 불가피합니다.\n- 큰 영향을 피하려면 **작은 변경**을 적용하도록 절차를 자동화하고, **모든 변경은 되돌릴 수 있어야** 합니다.\n- A/B 테스트·카나리 예(그림 5-8): GSLB Ratio로 v1에 90%, 새 v2와 v3에 각각 5%를 보냅니다.\n- 블루-그린에서 요청 일부를 그린으로 보내 영향을 보는 것이 **카나리(Canary) 분석**입니다. 문제가 있으면 공지하고 v1으로 전환, 트래픽을 점진적으로 늘려 그린의 부하 처리 능력을 검증하고 **폭발 반경을 제한**합니다. 모든 지표가 정상이면 블루(v1)를 종료하고 자원을 해제합니다.\n- 블루-그린은 가동 중지 0, 손쉬운 롤백, 사용자 지정 배포 시간이 장점입니다.\n\n### 5.2 버전 관리 3계층\n\n| 수준 | 방식 |\n|---|---|\n| 데이터 | Object Storage 버전 관리. POST·PUT·DELETE로 객체가 바뀔 때마다 새 버전을 저장하고 기존 버전 보존. 백업(특정 시점 보존), 동기화(변경 반영, 기존 데이터 미보존)와 구별 |\n| 소스 코드 | Git(Commit 내역, 변경 사항, 히스토리, 변경 알림) |\n| 서버 이미지 | Virtual Server 이미지로 특정 시점 서버 배포, Launch Configuration에 등록해 Auto-Scaling 서버로 사용. 컨테이너 이미지는 Container Registry에 버전별 저장·복원 |\n\n## 6. 모니터링과 로그\n\n- 전통적 모니터링은 무엇이 고장 났는지 알려주고, 클라우드의 **관측 가능성(Observability)** 은 원인 디버깅까지 가능한 심층 데이터를 제공합니다.\n- **Cloud Monitoring**: 인프라 자원의 사용 현황, 변경 정보, 로그를 수집하고 임계치 초과 시 이벤트·알림. 계측 기능은 ① 성능 데이터 수집·이벤트 처리, ② 로그 데이터 수집·이벤트 처리.\n- 모니터링은 인프라만이 아니라 애플리케이션, 네트워크, DB 등 **모든 계층**에 적용합니다.\n\n| 구분 | 상품군 | 대상 상품 |\n|---|---|---|\n| 성능 모니터링 | Compute | Virtual Server, GPU Server, Bare Metal Server, Multi-node GPU Cluster |\n| | Storage | Block Storage(VM), Block Storage(BM), File Storage, Object Storage |\n| | Database | EPAS, PostgreSQL, MariaDB, MySQL, MS SQL, CacheStore |\n| | Container | Kubernetes Engine, Container Registry |\n| | Networking | VPC, Load Balancer, VPN, Global CDN, Direct Connect, Cloud WAN |\n| | Data Analytics | Search Engine, Event Streams, Vertica |\n| 로그 모니터링 | Compute, Database, Data Analytics | 위 Compute·Database·Data Analytics 상품 |\n| | Container | Kubernetes Engine |\n\n- **이벤트 설정 항목**: 모니터링 대상, 성능 항목, 측정 유형/단위, 위험도, 임계치, 알림 수신 대상.\n- **로그**: 로그 수집용 **1GB** 저장 공간 제공, 초과하면 **오래된 로그부터 자동 삭제**. 로그 수집을 하려면 대상에 **로그 에이전트** 설치가 필요합니다.\n- **Network Logging**: Firewall, Security Group, NAT 로그를 Object Storage에 저장해 VPC 내외부 트래픽 분석.\n- **Logging & Audit**: 시스템이 아닌 클라우드·사용자 활동 기록(예: 콘솔 로그인 후 VM 생성). **Trail**을 구성하면 기간 제약 없이 장기 보존.\n- 로그 분석 용도: 비용 최적화(미사용 자원, 트래픽 급증 → Auto-Scaling 정책 재설정·약정), 성능 개선(응답 시간, 쿼리 속도, 대역폭 병목), 보안(Trail의 사용자 액세스·작업 기록, VPC 로그의 비정상 활동). 전문 로그 분석 도구와 AI로 자동화하면 더 빠르고 정확합니다.\n\n## 7. 이벤트 대응\n\n- 이벤트 등급: 업무 영향도(업무 구조화, 주요 업무 식별, 연관성 분석 → 안정성 원칙의 BIA)로 식별한 주요 시스템 대상. Cloud Monitoring 위험도는 **Fatal(가장 높음), Warning(중간), Information(가장 낮음)**.\n- 장애 또는 그에 준하는 긴급(Fatal) 이벤트에 대비해 **이벤트 관리 프로세스를 사전에 정의**합니다.\n- 이벤트 대응 자동화 예(DDoS): 가장 바람직한 것은 **DDoS Protection** 구성. 아키텍처 접근으로 Virtual Server에 **Auto-Scaling**을 구성해 서버 수를 늘려 정상 사용자 서비스가 완전히 차단되지 않게 하고, Cloud Monitoring에 Network In·CPU 임계치 알림을 설정합니다. 관리자는 공격자 IP를 파악해 **Firewall에 거부 정책**을 넣습니다.\n\n## 8. 평가 및 개선\n\n### 8.1 지속적 개선 프로세스(DevOps 파이프라인)\n\n먼저 **역할**(누가 권한을 갖고 작업할지)을 정의하고 개선 흐름의 가시성을 확보합니다.\n\n| 단계 | 설명 |\n|---|---|\n| 프로젝트 생성/사용자 추가 | DevOps 프로젝트 생성, 사용자 추가 |\n| 역할 정의 | 담당자 지정·권한 부여 |\n| 변경 사항 Commit | 인프라 템플릿·앱 코드 Commit |\n| 빌드 및 테스트 | 테스트 환경에서 빌드·배포·테스트(필요 환경 재현) |\n| 운영 환경 배포 | Staging을 거쳐 운영 배포 |\n| 모니터링 | 개선 사항을 지표에 반영, 성능 모니터링 |\n| 오류, 개선 사항 | 모니터링에서 도출된 오류·개선 사항 정리 |\n\n고려할 작업 요소: 단계 수(개발·통합·시스템·사용자 수용·프로덕션, 일부는 알파·베타·릴리스), 단계별 테스트 유형(단위·통합·시스템·UAT·스모크·부하·A/B), 테스트 순서(병렬/순차), 모니터링·레포팅, 단계별 인프라 프로비저닝, 롤백 전략.\n\n### 8.2 RCA(Root Cause Analysis) 5단계\n\n| 단계 | 질문 |\n|---|---|\n| 1. 문제 정의 | 무슨 일이 발생했는가, 구체적 증상은 |\n| 2. 데이터 수집 | 증거는, 얼마나 오래, 영향은 |\n| 3. 원인 요소 탐색 | 어떤 사건이 문제로 발전했나, 어떤 조건, 주변 문제 |\n| 4. 근본 원인 탐색 | 왜 원인 요소가 존재하나, 진짜 원인은 |\n| 5. 해결책 제안 및 실행 | 재발 방지 방법, 실행 방법, 책임자, 실행 위험 |\n\nRCA의 목적은 근본 원인을 분석해 **재발을 방지**하는 것입니다. 담당자 책임 추궁이 목적이 아닙니다(이를 비난 없는 Blameless 포스트모템이라 부름, 일반 개념).\n\n### 8.3 지식 관리\n\n- 문서가 부족하면 사람에 의존해 실수 위험이 커지므로 **운영을 사람과 분리하고 모든 것을 문서화**합니다.\n- 시스템 변경 시 설명서가 자동 업데이트되도록 스크립트로 **문서 자동화**를 합니다.\n- 설명서에는 RTO/RPO, 지연 시간, 확장성 성능 등 SLA를 포함합니다. 관리자는 시작·중지·패치·업데이트 단계를, 운영팀은 이벤트 대응 절차와 테스트·검증 결과를 포함합니다.\n\n## 9. 복합 서비스 설계 정리\n\n| 요구 | SCP 조합 |\n|---|---|\n| 소스·인프라 변경 이력 통합 관리 | DevOps Service Private Git Repository(소스 + 인프라 선언 파일) |\n| 빌드·배포 자동화 | Git Push → Jenkins 파이프라인 → Container Registry → Kubernetes Engine |\n| 인프라 반복 배포 | Terraform(IaC, 선언형) + CLI/Open API, 인증키 |\n| 무중단 릴리스·점진 전환 | GSLB Ratio 기반 블루-그린·카나리 |\n| 임계치 알림 | Cloud Monitoring 이벤트(Fatal/Warning/Information) |\n| 사용자 활동 감사 | Logging & Audit Trail |\n| 자원 한도 사전 점검 | Quota Service |\n| ISMS-P 대응 | 개발·운영 VPC·Account 분리, IAM으로 개발자 운영 접근 제한, 별도 담당자 이관 |\n\n> [!시험]\n> - 운영 환경에는 **선언형** IaC가 더 적합합니다. 지시형은 실패 시 운영자 개입이 필요합니다.\n> - **레드-블랙**은 DNS를 일시에 바꿔 하나의 버전만 활성화, **블루-그린**은 일정 기간 공존하며 점진 전환 가능합니다.\n> - **인플레이스**는 가동 중지가 생기고 실패 시 재배포만 가능합니다.\n> - 일부(예: 5%)에만 먼저 노출하고 늘려 가는 것은 **카나리**입니다.\n> - ISMS-P: 개발·테스트는 **VPC·Account 단위로 운영과 분리**, 개발자의 운영 직접 접근은 **IAM으로 제한**. \"인력 절감을 위해 운영 VPC에 함께 배치\"는 오답입니다.\n> - Lift & Shift 후 일부만 클라우드일 때, **기존 조직에 통합**하는 방식은 일관된 정책 유지에 **유리**하고, **별도 조직 추가**는 전문성은 높지만 역할 중복·커뮤니케이션 비용이 생깁니다.\n> - Cloud Monitoring 로그 저장 공간은 1GB, 초과 시 오래된 로그부터 삭제, 수집 대상에 에이전트 필요. 장기 보존은 Trail.\n\n출처: WA백서 05 p.1~32\n"}, "2-1c": {"title": "가용성 / 안정성 원칙 기반 복합 서비스 설계", "md": "## 한눈에 보기\n\nSCP WA는 장애와 복원력 측면을 두 원칙으로 나눕니다.\n\n| 구분 | 가용성(Availability, 백서 01) | 안정성(Reliability, 백서 03) |\n|---|---|---|\n| 초점 | 특정 구성 요소 장애나 예기치 못한 부하 급증에도 서비스가 **중단되지 않도록** 자동화된 대응 중심 설계 | 계획되지 않은 장애·재해 발생 시 **데이터 손실 최소화와 신속한 복구** |\n| 시점 | 사전 준비(이중화, 자동 Fail-Over) | 사후 대응 전략(백업, DR) |\n| 핵심 기술 | 고가용성(HA, 중복 배치), 확장성(Scalability) | BIA, RTO/RPO, 백업, DR(Cold/Warm/Hot) |\n\n가용성이란 사용자가 기대를 가지고 IT 자원·서비스를 이용하려 할 때 그 기대에 부합하는 기능과 성능을 안정적으로 제공하는 능력입니다.\n\n\n## 1. 가용성 목표 수립\n\n### 1.1 고가용성 구현 대상 식별\n\n| 평가 항목 | 내용 |\n|---|---|\n| 업무 영향도 | 중단 시 예상 매출 손실, 고객 이탈·계약 위반 비용 |\n| 고객 서비스 영향 | 고객 경험 영향, 불만·클레임 가능성, 대체 서비스 방안 |\n| 규정 준수 | 규정 준수 의무, 위반 시 법적 문제 |\n\n장애 유형별 요구사항과 구현 방안(표 1-2)\n\n| 구분 | 요구사항 예시 | 구현 방안 |\n|---|---|---|\n| 클라우드 데이터센터 장애·재해 | 물리 데이터센터 장애에도 중단 없는 아키텍처 | **Multi-AZ 기반 중복 구성** |\n| 클라우드 서비스 장애 | 단일 VM 장애에도 Fault Tolerance, 고가용성 DB | **Active-Active 또는 Active-Standby** |\n| 수요량 급증 | 동적 자원 조정, 요청 기반 처리 | **Auto-Scaling 또는 관리형 서비스** |\n| 공격/침해 | DDoS에도 정지 최소화 | **DDoS Protection, Auto-Scaling** |\n\n### 1.2 서비스 수준 지표\n\n| 지표 | 정의 |\n|---|---|\n| SLA(서비스 수준 계약) | 제공자와 고객 간 **공식 계약**. 가용성·성능·지원 응답 시간 등 목표와 **미달 시 보상 조건** 명시 |\n| SLO(서비스 수준 목표) | SLA 내 특정 목표. 측정 가능(예: 가용성 99.9% 이상 유지). SLA를 충족하기 위한 세부 목표 |\n| SLI(서비스 수준 지표) | SLO를 측정하는 구체적 지표(예: 지난 30일 평균 응답 시간) |\n| MTTD(평균 탐지 시간) | 고장 발생 시점과 수리 작업 시작 시점 사이의 평균 시간 |\n| MTTR(평균 복구 시간) | 장애 발생부터 수리가 끝나 가동 가능해질 때까지 평균. MTTR = (F1+F2…Fn)/n |\n| MTTF(평균 고장 간격) | 수리 완료부터 다음 고장까지 무고장 가동 시간 평균. MTTF = (T1+T2…Tn)/n |\n\n- 가용률 = 1 - {장애 시간(분) 합}/{서비스 이용 총 시간(분) 합} = **MTTF/(MTTF + MTTR)**\n- 예: MTTF 990시간, MTTR 10시간 → 990/1,000 = 99.0%\n- 가용성을 높이는 핵심은 **MTTR 최소화**이며, MTTR은 MTTD와 복구 시간으로 구성됩니다. 고가용성은 **MTTD와 복구 조치가 사람 개입 없이 자동화**된 것을 뜻합니다. 모니터링·알림·응답 자동화로 MTTD를, 자원 중복과 확장 자동화로 MTTR을 줄입니다.\n- 고객이 말하는 \"고가용성/이중화\"의 진짜 의미는 단순 이중화가 아니라 **단일 구성 요소가 장애 나도 전체 서비스가 중단되지 않는 것**입니다.\n\n> [!팁]\n> SLO를 SLA보다 엄격하게 잡아 계약 위반 전에 대응 여유를 두는 것은 일반적인 운영 관행입니다(일반 개념). 백서는 SLO를 \"SLA를 충족하기 위한 세부 목표\"로 정의합니다.\n\n### 1.3 SCP SLA(서비스별 월 가용률, 표 1-4)\n\n| 서비스 | 장애 정의 | 산정 기준 |\n|---|---|---|\n| 공통(Virtual Server, Bare Metal Server, Load Balancer, GSLB, VPN, SingleID, DevOps Service, AIOS 등) | 가동 중인 인스턴스·서비스가 모두 외부 연결·접속을 확보하지 못함 | 장애 시간 |\n| Virtual Server DR | 모의 훈련·재해 전환 완료 후 접속 불가 또는 요청 전환 불가 | 장애 시간 |\n| DBaaS, Event Streams, Search Engine | 멀티 인스턴스·서비스가 모두 외부 연결을 **5분 이상** 확보 못함 | 장애 시간 |\n| Kubernetes Engine | 컨트롤 플레인에 외부 연결 **5분 이상** 불가 | 장애 시간 |\n| Container Registry | Endpoint 연결 요청이 **5분 동안** 모두 실패 | 장애 시간 |\n| DDoS Protection, Secured VPN, Secured Firewall, WAF, IPS, SASE | 보안 장비 미작동·오작동으로 모니터링·탐지 실패 | 장애 시간 |\n| File Storage, Block Storage | Compute에서 Storage로 **15초 이상 Timeout** | 장애 시간 |\n| Edge Server | Edge Manager 접속 불가 또는 Edge Server 장애로 서비스 실패 | 장애 시간 |\n| Private Cloud | 인스턴스·서비스가 모두 **CMP 접속**을 확보 못함 | 장애 시간 |\n| Cloud Functions | 500 또는 503 반환(사용자 지정 오류 제외) | 매 5분 장애 시간 및 건수 |\n| Object Storage, Archive Storage | 500 오류 반환 | 100% - 월 평균 장애율 |\n| API Gateway | 500 또는 503 반환 | 매 5분 오류 요청 건수 |\n| Quick Query | SQL 요청이 외부 연결 5분 이상 불가 | 장애 건수 |\n| Backup | 고객 요청 백업 실패(재수행 성공 시 제외) | 장애 건수 |\n\n## 2. 고가용성을 위한 아키텍처 고려 사항\n\n인프라뿐 아니라 **애플리케이션도** 장애 감지·대응과 확장을 지원해야 합니다.\n\n### 2.1 단순한 애플리케이션\n\n- 모범 사례: 불필요한 복잡성과 오버헤드를 최소화해 단순하게 구현합니다. 복잡도가 높으면 구성 오류·예측 못한 상호작용이 늘고 가용성에 부정적입니다.\n- 설계 원칙: ① 비즈니스 필수 최소 구성 요소만 추가 ② **PaaS** 활용(IaaS 코드보다 인프라 관리·HA 구성 부담이 적음) ③ **Serverless Computing**으로 단순 반복 연산 처리.\n- 예(그림 1-2): 모바일 사진 관리 서비스를 API Gateway + Cloud Functions로 구현. Authentication, Search, Register, Thumbnail, Delete를 독립 함수로 분리해 한 기능 수정이 다른 기능에 영향 없음. 분리 후 서비스 가시성(Observability) 확보가 중요하며 Cloud Functions는 호출 수, 실행 시간, 현재 작업 수, 성공/실패 호출 수, 메모리 사용량 모니터링과 실행 로그를 제공합니다.\n\n### 2.2 결합 해제와 종속성 관리\n\n- 모범 사례: 한 구성 요소 장애가 전체 정지로 이어지지 않거나 **점진적 성능 저하**가 되도록 설계합니다.\n- 서비스 가용성은 **종속 구성 요소 중 가장 낮은 가용성을 초과할 수 없습니다.** 가장 낮은 요소의 관리 방안을 최우선 고려합니다.\n- 설계 원칙: ① 전체 종속성 목록 유지 ② 중요한 종속성 최소화 ③ 중요한 종속성은 중복 구성 ④ **Load Balancer나 비동기 메시징**으로 요청·응답 결합 해제.\n\n| 수단 | 통신 | 효과 |\n|---|---|---|\n| Load Balancer | 동기(Synchronous), 실시간 요청 | 서버 IP 하드코딩 제거, 단일 진입점, Auto-Scaling 서버에 자동 분산, 같은 기능 서버 그룹 간 분산 |\n| Message Queue Service | 비동기(Asynchronous) | **더 강한 결합 해제**. 생산자·소비자 처리 속도 불일치 허용, 메시지가 큐에 저장되어 일시 장애에도 영향 없음 |\n\n### 2.3 상태 비저장(Stateless) 애플리케이션\n\n- 상태 저장(Stateful) 앱은 로컬 캐시 등 종속 항목이 메모리에 적재되어, 요청 누적 시 Auto-Scaling으로 서버를 늘려도 기대만큼 성능이 오르지 않을 수 있습니다.\n- 설계 원칙: ① 앱을 Stateless로 구현 ② 서비스 외부에 **상태 관리 데이터베이스(State Management Database)** 구현.\n- 요청을 상태 관리 DB에 저장하고 처리 시 읽어 오므로 새 서버가 풀에 들어오면 바로 처리할 수 있습니다. 상태 관리 DB로는 빠른 읽기/쓰기의 **NoSQL**, 고성능이 필요하면 **CacheStore(DBaaS)** 를 권장합니다.\n- 세션을 웹 서버 로컬 디스크에 두면 Auto-Scaling 축소 시 사라지므로 외부 저장소에 둡니다.\n\n## 3. 고가용성 클라우드 아키텍처 설계\n\n### 3.1 확장·가용성을 위한 네트워크\n\n- 장애 대비: 내재적으로 이중화를 지원하는 서비스를 고르거나 네트워크 연결을 직접 이중화합니다.\n- 수요 대비: 자원 제한을 검토합니다. 예: **Account당 VPC 최대 5개, VPC당 서브넷 최대 3개**. 초기에 Account·VPC·서브넷 배치 범위를 신중히 정합니다. 지리적으로 넓으면 **Global CDN**.\n- 타 시스템 연결: 퍼블릭/프라이빗 경유 결정, **양쪽 프라이빗 IP 범위 중첩 금지**, 연결 지점이 늘수록 비용·정책·라우팅 복잡도 증가 → **허브앤스포크** 중앙 집중형 구조.\n- VPC 3개 연결 시 VPC Peering(1:1)은 연결 3개 필요, Transit Gateway는 하나로 중앙화해 라우팅을 설정합니다.\n\n### 3.2 관리형 서비스\n\n- CSP가 OS·보안·스토리지·네트워크를 관리하고 HA 설계·운영이 구현되어 있어 사용자의 HA 부담이 줄어듭니다.\n- 설계 원칙: ① 단순 반복 작업은 Cloud Functions ② **Database 서비스**로 HA 구현.\n- 예: MySQL을 VM 두 대 이상에 직접 설치해 InnoDB Cluster로 HA·Replica를 구성하면 네트워크·보안·백업 등 구현과 지속 운영이 필요하지만, MySQL(DBaaS)는 **옵션 설정만으로** HA 구성이 자동화됩니다.\n\n### 3.3 Microservice 아키텍처\n\n| 구분 | 모놀리식 | Microservice |\n|---|---|---|\n| 구조 | 여러 모듈이 단일 프로그램, 단일 DB 서버 | 기능별 작은 앱, 서비스별 독립 DB, 프론트엔드와 API 연결 |\n| 장점 | 배포 단순, 로깅·캐싱·보안 통합 관리, 같은 서버 내 호출로 성능 유리 | 기능별 독립 개발·배포, 다른 언어·프레임워크 허용, 장애·과부하 격리 |\n| 단점 | 커질수록 변경·배포 복잡, 한 모듈 오류가 전체 장애로 | 서비스 간 통신 메커니즘 필요, 상태 추적 어려움, 구성 요소 증가로 운영 부담 |\n\n적합성 검토 6가지: ① 비즈니스 도메인이 독립 하위 도메인으로 나뉘는가(DDD) ② 팀이 서비스 단위 책임을 질 수 있는가 ③ 부분 트래픽 핫스팟과 HA가 필요한 안정적 도메인이 있는가 ④ 서비스마다 변화 속도·릴리즈 주기가 다른가 ⑤ CI/CD·모니터링·로깅·트레이싱 자동화가 가능한가 ⑥ 도메인별 독립 발전을 추구하는가.\n\n구현 예(그림 1-10): ① Load Balancer → VM/Container 워크로드와 API Gateway ② API 외 요청은 Kubernetes Engine ingress → Pod ③ API Gateway가 최전방에서 인증·라우팅 ④ 서비스 단위 분리 DB ⑤ Service Mesh로 서비스 간 네트워크 제어·추적. 서비스별 DB로 최적 DB 선택(트래픽 관리는 NoSQL, 주문은 RDBMS), API Gateway는 규약 중앙 관리와 **Throttling**, Kubernetes는 컨테이너 CPU·메모리 제한과 **Probe**로 비정상 컨테이너 자동 재시작, Cloud Functions로 이벤트 처리, Object Storage에 웹 콘텐츠를 두어 서버 부하 분산.\n\n## 4. 수요에 따라 조정\n\n- 가용성 문제는 고장뿐 아니라 **부하 증가로 용량 한계**에 달해도 발생합니다.\n- 설계 원칙: ① Virtual Server **Image 관리**로 확장·축소 ② 관리형 서비스 사용.\n- Virtual Server: 서버 타입 사양을 높여 **수직 확장(Scale-up)**, Image로 만든 서버를 LB에 등록해 **수평 확장(Scale-out)**, 삭제로 **수평 축소(Scale-in)**. Auto-Scaling은 정책에 따라 자동.\n- Cloud Functions는 하부 인프라 제한 없는 이벤트 기반, Object Storage는 용량 제한 없는 저장소.\n- **Database 서비스는 서버 수를 늘릴 수 없고**, 사양을 수직 확장하고 **Replica로 읽기 성능**을 높입니다.\n\n### 4.1 자원 조정 자동화\n\n- 설계 원칙: ① 지표 기반 Auto-Scaling으로 VM 수평 확장·축소 ② Kubernetes Engine **Node Pool 자동 확장** 활성화.\n- 탄력성(Elasticity)은 특정 지표 기반 자동화로 가동되며, SCP에서는 Virtual Server와 Container에서 Auto-Scaling이 작동합니다.\n- Auto-Scaling: LB 서버 그룹에 VM을 등록하고 정책에 따라 VM을 추가·삭제. 지표는 CPU, 메모리, 디스크 사용률, 네트워크 트래픽 등.\n- Container 자동 확장은 두 결정이 필요합니다: ① 추가 컨테이너가 필요한가 ② 기존 노드에 할당 가능한가, 새 노드가 필요한가. 새 노드 자동 할당은 노드 풀 생성 시 **자동 확장/축소 옵션**을 사용해야 합니다.\n\n### 4.2 병목 관리\n\n- 설계 원칙: ① 서비스 흐름 중 확장이 불가능한 지점 확인 ② 늘어난 수요를 처리할 대안.\n- **관계형 데이터베이스는 수평 확장이 불가능**합니다. Database 서비스는 이중화하더라도 **Active–Standby**를 지원하므로 수평 확장을 구현할 수 없습니다. 최대 용량을 고려한 **수직 확장**, **Replica나 캐싱으로 읽기 부하 오프로드**를 고려합니다.\n\n### 4.3 부하 급증 시 단계적 수준 저하\n\n- 과부하 시 낮은 품질의 응답을 주더라도 서비스가 완전히 정지하지 않게 하고, 트래픽을 부분적으로 대기시키거나 삭제합니다.\n- 설계 원칙: ① **대량 접속 제어 솔루션(Virtual Waiting Room 등 3rd Party)** 으로 접속 대기열 ② **정적 웹 페이지**로 임시 응답(Object Storage에 정적 웹 자산을 두어 웹 서버 부하 경감).\n\n## 5. 장애 대응 구성 요소 설계\n\n### 5.1 자원 이중화와 Multi-AZ\n\n- 단일 지점 장애(SPOF)가 없어야 합니다. 서비스 내재 장애 회피 옵션과 자원 중복 배치를 활용합니다.\n- 설계 원칙\n  1. Virtual Server는 **Load Balancer와 함께 중복 배치**, 가능하면 Auto-Scaling으로 자동 중복 구성\n  2. 서버 그룹 **Anti-Affinity**로 호스트 장애에 의한 중단 방지\n  3. **Multi-AZ**에 자원 배포로 Single-AZ 장애 대응\n  4. Database 서비스의 **HA와 Replica**로 DB 중복\n- AZ는 독립 물리 인프라로, 장애가 해당 AZ에만 영향을 줍니다. Multi-AZ Kubernetes Cluster 예와 서비스별 구성은 2-2b 강의에서 자세히 다룹니다.\n- 단일 서버로 둘 수밖에 없는 앱(소스 변경 불가, 라이선스 제약 등)은 **주요 서비스 흐름에서 분리하고 App에서 참조**하게 배치합니다. 그러면 Legacy App 장애 시 일부 기능만 제한됩니다(그림 1-14, 1-15: Web-Legacy App-App-DB 흐름 → Legacy App 분리).\n\n> [!주의]\n> 백서 01 p.29는 \"2025년 7월 기준 v1은 Multi-AZ 제공, v2는 Single-AZ Region(KR-WEST1, KR-EAST1)만 제공, v2에도 Multi-AZ 제공 예정\"이라고 하고, 백서 03 p.25는 \"v2는 Single-AZ Region(KR-WEST1)만 제공\"이라고 적습니다. v2 Region 수 표기가 서로 다릅니다.\n\n### 5.2 자동 복구\n\n- 설계 원칙: ① Auto-Scaling으로 비정상 자원 복구 ② Kubernetes Engine **노드 자동 복구** 활성화.\n- Auto-Scaling **최소 인스턴스 수를 2**로 두면, 한 VM이 장애로 제외될 때 LB가 감지하고 Auto-Scaling 그룹이 최소 수량 유지를 위해 새 VM을 자동 생성합니다.\n- 노드 자동 복구: 노드가 일정 시간(**임계값 약 10분**) 지속적으로 **NotReady**를 보고하거나 상태를 보고하지 못하면 복구가 개시됩니다. 단, 최초 생성 시 Running이 되지 못하고 **Creating에 머물거나**, 같은 노드 풀에서 **비정상 노드가 4대 이상**이면 자동 복구가 제한될 수 있습니다.\n\n### 5.3 악의적 공격으로부터 보호\n\n- 설계 원칙: ① 관리형 보안 서비스로 자동 대응 ② Auto-Scaling으로 불능화 공격 대응 ③ 보안 이벤트 알림.\n- DDoS Protection, WAF 등은 SCP가 관리하는 보안 서비스입니다. DDoS에는 Auto-Scaling으로 서비스를 지속하고 관리자 알림으로 비정상 트래픽을 방화벽에서 차단합니다.\n\n## 6. 가용성 관리(테스트)\n\n- 온프레미스는 작은 테스트 환경, 클라우드는 **프로덕션 규모 테스트 환경**을 만들어 사용자 영향 없이 테스트할 수 있습니다.\n- 설계 원칙: ① 단위·통합 테스트 시나리오 ② SLO·SLA에 따른 지표 측정 ③ 부하 테스트로 요구 부하 처리 확인 ④ 병목 확인·개선.\n\n| 서비스 | 최대 월 가용률 | 정지 시간 |\n|---|---|---|\n| Virtual Server(단일) | 99.9% | 43.8분 |\n| Virtual Server(이중화) | 99.99% | 4.3분 |\n| Database(HA) | 99.95% | 21.9분 |\n| Load Balancer | 99.95% | 21.9분 |\n\n| 목표 | 아키텍처 | 테스트·예상 시간 |\n|---|---|---|\n| 99% | Web·App·DB 모두 단일, VM은 Backup, DB는 내장 백업. SLA 기준 허용 중단 44분 | 장애 탐지(Cloud Monitoring 알림, 관리자 분석시간), 장애 대응(Backup에서 VM 복원, NAT IP 전환, 최대 20분), 복원력(신규 DB 생성·Backup 복구·변경분 반영, 최대 60분), 부하(서버 타입 변경, 작업당 최대 15분) → **최대 90분**. 가장 불확실한 구간은 탐지·통지·작업 개시까지 |\n| 99.9% (MTTR 약 44분) | Web·App·DB 이중화, Web·App 앞 LB, DB HA(Active-Standby) | LB Health Check 탐지·전환 **30초(기본)**, DB Active 정지 후 Standby 전환 수초~수분, 복원력 최대 60분, 부하는 Custom Image로 VM 생성 후 LB 등록(작업당 최대 15분), DB 서버 타입 변경 |\n| 99.99% (MTTR 약 4분) | VPC와 서비스를 **Multi-AZ**, Web·App은 지표 기반 Auto-Scaling, DB Replica로 읽기 오프로드 | Health Check 30초, DB 전환 수초~수분, 복원력 최대 60분, 부하 테스트(Auto-Scaling 신규 서버, DB 타입 변경, Replica 추가) **최소 5분**. 부하 증가가 서버 생성보다 빠르면 Scale-out 임계치를 낮추고 생성 수를 늘림 |\n\n- LB Health Check 기본값: **주기 5초, 대기시간 5초, 탐지 횟수 3회** → (5 + 5) × 3 = **30초**. 각 값은 1~2,147,483,647초로 바꿀 수 있고 최소값이면 탐지 시간을 **6초**까지 줄일 수 있습니다.\n- 복구를 Console 대신 **CLI 스크립트**로 준비하면 더 단축됩니다.\n- 정기 검토: **Planned Maintenance**(정기 점검 기간에 구성 요소·흐름 테스트, 새 병목 점검), **Unplanned Failure**(복구 가능 시간 판단 → 우선순위 복구 → 근본 원인 해결 → 원인·해결·재발 방지 문서화, 장시간 정지가 필요하면 정기 점검 기간에 조치, 이후 단위·통합 테스트).\n\n> [!주의]\n> 백서 01 p.36은 \"가용성 목표가 월 99%일 경우 월 730시간 기준 MTTR은 43.8분\"이라고 적지만, 같은 문서 p.37은 99.9% 목표의 MTTR을 \"약 44분\"으로 적습니다. 730시간의 1%는 7.3시간이므로 99% 문장의 수치는 99.9% 값과 같게 표기된 것으로 보입니다. 시험에서는 표 1-5(VS 단일 99.9% = 43.8분, 이중화 99.99% = 4.3분)를 기준으로 판단하세요.\n\n## 7. 모니터링과 알림\n\n- 모범 사례: 가능한 모든 구성 요소의 메트릭과 로그를 수집하고 분석 결과를 알림과 연계합니다.\n- 설계 원칙: ① 가용성 지표·목표 설정 ② 모든 서비스에 모니터링·대시보드 ③ 모든 서비스에 로깅, 중앙 저장소 관리.\n- 예: 특정 VM 평균 CPU가 **90%를 초과**하면 장애 확률이 높아집니다. 단일 서버면 증설 서버로 대체, LB 서버 군이면 서버를 추가합니다. (ServiceWatch 개념도 수록)\n- 알림·응답 자동화 원칙: ① 임계값 도달 시 Event로 자동 알림 ② Event별 조치를 사전 준비하고 즉시 수행 ③ 자동 대응 조치 구성.\n- Event 위험도: **Fatal**(가장 높음), **Warning**(문제가 있어 해결 필요), **Information**(가장 낮음, 참고).\n\n\n## 8. 안정성: 업무 영향 분석(BIA)\n\n재해 복구 전략의 출발점은 **BIA(Business Impact Analysis)** 이며, 업무 중요도와 중단 손실을 평가해 복구 우선순위와 범위를 정합니다.\n\n1. **업무 구조화**: 단위 업무를 그룹으로 묶어 상·하위 구조 분석\n2. **주요 업무 식별**: 자주 쓰는 업무, 고객 핵심 서비스 직결 여부, 전략적 중요성\n3. **업무 연관성 분석**: 선후 관계(선행·후속) 또는 참조 관계로 연관도 산출\n4. **재해 영향 평가**: 재해 유형(하드웨어·소프트웨어 오류, 사람의 실수, 자연 재난, 화재, 네트워크 중단), 정량(재무: 매출 감소·보상 비용, 업무: 처리 지연 시간)·정성(유형: 고객·매출 기회 상실, 자료 손상, 무형: 신뢰도 하락, 소송) 영향\n5. **우선순위와 범위 설정**: 영향 분석 우선순위에 **업무 연관성을 반드시 반영**합니다. 예: A1(1순위)을 복구하려면 선행 업무 B1, B2가 먼저 복구되어야 하므로 1순위가 A1, B1, B2로 조정되고 2순위 C1, 3순위 A2, C2가 됩니다.\n\n## 9. 복구 목표(RTO/RPO)\n\n| 지표 | 정의 |\n|---|---|\n| RTO(복구 목표 시간, 업무 중단 허용 시간) | 서비스 중단부터 복구까지 허용 가능한 최대 시간 |\n| RPO(복구 목표 시점, 업무 손실 허용 시점) | 복구했을 때 허용 가능한 데이터 손실 범위 |\n\n- RTO 최상위 목표는 무중단(Near Zero)이지만 비용·운영 부담이 큽니다. 조직이 감당할 재정 부담 한계가 높을수록 RTO는 짧아질 수 있습니다.\n- RPO는 업무 중요도에 따른 사본 저장 주기와 복제 구성 여부로 정해집니다.\n- **업무와 시스템의 RTO/RPO 도출 규칙**: 업무별 값과 그 업무를 처리하는 시스템별 값 중 **최소값**을 채택합니다. 예: F 시스템 RTO 8시간, A2 업무 RTO 1일 → 8시간. RPO도 F 시스템 1시간, A2 1일 → 1시간.\n\n> [!시험]\n> 업무 X(RTO 6시간, RPO 1일)를 처리하는 시스템 Y(RTO 4시간, RPO 30분)라면 답은 **RTO 4시간, RPO 30분**입니다. 평균이나 업무 기준값이 아니라 항상 **최소값**입니다.\n\n## 10. 장애 복구 계획\n\n### 10.1 장애와 재해\n\n| 구분 | 재해 | 장애 |\n|---|---|---|\n| 원인 위치 | 정보기술기반 외부 | 정보기술기반 내부 |\n| 예방·통제 | 불가능 | 가능 |\n| 손상 규모 | 한 사이트 전체 | 사이트 내 부분적 |\n| 대응 조직 | 전사적 수준 | 정보 시스템 관리부서 수준 |\n| 복구 예상 시간 | 중·장기(수일 이상) | 단기(수시간) |\n\n- 장애가 허용 시간 내 복구 불가로 판단되면 **비상 상황**이며, 장애 등급(주요 업무 영향, 복구 긴급성)과 등급별 복구 가능성·예상 시간을 사전에 추정해 두고 판단합니다. 허용 시간 내 복구가 불가능하면 **재해를 선언**하고 DR 계획을 이행합니다.\n- 금융감독원 권고 복구 시간(주요 금융기관 3시간 이내, 보험 24시간 이내 등)은 2-2d 강의를 참고하세요.\n\n### 10.2 백업 정책과 자동화\n\n- 모범 사례: 업무 중요도에 따라 백업 정책을 수립하고 자동화합니다. 중요한 데이터는 자주, 중요도 낮은 데이터는 낮은 빈도로 백업합니다.\n- **백업 가능 시간** 고려: 일 단위는 업무 종료~다음 날 업무 개시 전, 주 단위는 주말. 배치 작업 전후 등 복구 시 유효성도 고려합니다.\n- 설계 원칙: ① **Backup 서비스로 Virtual Server 백업** ② **Database 내장 백업** ③ **스냅샷·버전 관리**로 Storage 보호.\n\n| 대상 | 백업 기능 | 방식 | 스케줄 | 보존 기간 | 저장소 |\n|---|---|---|---|---|---|\n| Virtual Server | Backup 서비스 | VM 스냅샷, 전체 또는 증분 | 일/주/월 | 2주~1년 | SCP 관리 저장소 |\n| Bare Metal Server | Backup 서비스 | 파일 시스템 에이전트 백업 | 일/주/월 | 2주~1년 | SCP 관리 저장소 |\n| DBaaS | 내장 기능 | DB 기반 백업 | 데이터 1일, 아카이브 5분~1시간 | 7일~35일 | 사용자 관리 Object Storage |\n| File Storage | 내장 기능 | 스냅샷 | 일/주 | 자동 128개, 수동 800개 | File Storage 내부 |\n| Object Storage | 내장 기능 | 버전 관리 | 변경 발생 즉시 | 제약 없음 | 버킷 내부 |\n\n- 서버 백업: Backup 서비스가 VM을 스냅샷해 이미지로 저장하고 원격지 소산도 가능합니다. **복구는 백업 사본으로 새 Virtual Server를 생성**하는 방식입니다. Backup 생성 시 **DR 옵션**을 켜면 DR 사이트에 백업본이 복제되며, **이미 생성된 Backup에는 DR 옵션을 활성화할 수 없어 새로 생성**해야 합니다. Bare Metal은 Agent 설치로 File System 백업합니다.\n- DB 백업: 데이터 백업과 아카이브 백업 모두 수행합니다. 저장소는 사용자가 **Object Storage 버킷을 직접 생성**해 지정합니다. 복구 시 **기존 서버에 직접 복구하지 않고**, 백업본으로 **새 DB를 생성한 뒤 Master로 전환**합니다.\n- 스토리지: File Storage는 스냅샷과 디스크 백업, 서버에서 `/.snapshot` 경로로 시점별 파일 복구. Object Storage는 백업 방식 대신 **버전 관리**로 이전 버전 객체를 모두 저장합니다.\n\n### 10.3 백업 보호·암호화\n\n- 법정 보존 자료 예: 상업 장부 10년(상법 33조), 전표 5년, 근로자 명부 3년, 법인 거래 장부 5년(국세기본법), 개인정보는 불필요 시 즉시 파기(개인정보보호법 21조), 공공기록물(영구/준영구/30/10/5/3/1년), 진료 기록부 10년, 처방전 2년 등.\n- 설계 원칙: ① **Archive Storage, Multi-AZ, DR 구성**으로 단일 지점·사이트 장애에 의한 백업 손실 방지 ② 백업 저장소 **접근 제어와 암호화**로 무결성 보장.\n- 그림 3-9 절차: ① 백업 버킷을 Archive Storage로 아카이빙 ② Object Storage를 Multi-AZ에 배포 ③ DR 복제로 Region 재해 대비 ④ 접근 서버·IP·엔드포인트 지정 접근 제어 ⑤ 버킷 암호화.\n\n> [!주의]\n> 백서는 Multi-AZ 및 Object Storage Region 간 Replication을 \"향후 출시 예정('26년)\"으로 표기합니다.\n\n### 10.4 장애 복구 절차와 테스트\n\n| 단계 | 주요 활동 |\n|---|---|\n| 1. 상황 평가 | 문제 식별, 영향 범위, 복구 수행팀 소집 |\n| 2. 복구 계획 실행 준비 | 백업 정책·도구·최근 사본 확인, 복구 네트워크 환경 결정(기존/신규) |\n| 3. 복구 수행 | VPC·서브넷·Security Group·스토리지 구성, 백업 사본으로 복구 |\n| 4. 테스트 및 검증 | 데이터 무결성, 앱 기능, 네트워크 연결, 실제 사용자 업무 가능 여부 |\n| 5. 정상화 보고 | 정상화, 절차·결과 보고서, 문제 해결 방법·개선 사항 기록 |\n\n- 모범 사례: 정기 복구 테스트로 RPO·RTO 충족을 검증합니다. 설계 원칙: ① 원본·복제본 확인으로 자동 백업과 유효성 검증 ② 복구 테스트 환경 구성·훈련 ③ 실패하거나 목표 미달이면 백업 검증과 개선.\n\n## 11. 재해 복구(DR) 계획\n\n### 11.1 DR 수준\n\n| DR 수준 | RTO | RPO | 가용성(Main↔DR) | 복구 | 비용 | 대상 |\n|---|---|---|---|---|---|---|\n| Cold | 수주 | 수일 | Active-Backup | 자원 할당 및 백업 복구 | 낮음 | 비중요 시스템 |\n| Warm | 수일 | 수 시간 | Active-Replica | 수동 Failover, 자원 할당 및 증설 | 중간 | 일반 시스템 |\n| Hot | 수 시간 | 0 | Active-Standby | 수동 Failover | 높음 | 중요 시스템 |\n\n- **Cold**: 핵심 서비스 백업 데이터만 DR 센터에 보관, 재해 시 신규 자원 할당·구성. 초기·유지 비용 최저, 백업 주기에 따른 손실 가능성 큼, 복구 오래 걸림.\n  - 아키텍처(그림 3-10): ① kr-west1(주)과 kr-east1(DR)을 VPC Peering ② DR용 VM을 만들어 **평상시 전원 Off** ③ 주 센터 VM 데이터를 Object Storage에 주기 백업 ④ Object Storage DR 동기화로 **Bucket 단위 비동기 복제** ⑤ 재해 시 DR 버킷 데이터로 복구.\n- **Warm**: 중요도 높은 시스템 중심으로 DR 센터 구축, 실시간 복제가 아니라 **주기적 동기화**, 재해 시 나머지 자원 할당·증설. 손실·복구 시간 발생, Hot보다 저렴.\n- **Hot**: 실시간 복제 기반 **Active-Standby**. 재해 시 복제를 중단하고 DR 센터로 전환.\n  - 아키텍처(그림 3-11): ① 리전 간 VPC Peering ② WEB/APP은 **Virtual Server DR**로 DR VM 생성(재해·모의 훈련 시 주 VM으로 사용) ③ DBaaS는 **타 Region Replica**로 비동기 복제, 재해 시 Replica를 Master로 승격 ④ File Storage **DR 복제**로 복제 볼륨 구성, 재해 시 동기화 중단 후 **R/W 모드**로 변경 ⑤ Object Storage DR 동기화(Bucket 단위 비동기), 재해 시 DR 버킷을 End Point로 접근.\n\n> [!주의]\n> Cold/Hot 아키텍처의 Region 간 VPC Peering, Object Storage Replication, DBaaS Replica 기능은 백서에 \"향후 출시 예정('26년)\"으로 표기되어 있습니다.\n\n### 11.2 Region 간 데이터 복제 수단\n\n| 수단 | 요점 |\n|---|---|\n| Virtual Server DR | 다른 Region에 VM과 연결 Block Storage를 복제, 계획·테스트·복구 기능. **실제 복제 대상은 Block Storage**, DR 사이트 VM은 **정지 상태** 유지 |\n| Backup DR | **서비스 생성 시** 활성화, 주 사이트 백업 시 DR 사이트에 백업본 복제 |\n| Object Storage DR | 주·DR 버킷 동기화 설정, **주 사이트 버킷에 버전 관리 활성화 필요** |\n| File Storage DR | DR Region, DR Volume명, 복제 주기 설정. 주기 5분/1시간/매일/매주/매월(매일 23:59:00, 매주 일요일 23:59:00, 매월 1일 23:59:00) |\n| Database 서비스 DR | DR 사이트에 Replica 생성, **주·DR VPC 간 Peering 필요**, 재해 시 Replica를 **수동으로 Master 전환** |\n| Container Registry DR | DR 레지스트리와 Object Storage 버킷을 다른 Region으로 복제, File Storage DR과 함께 쓰면 Kubernetes Cluster DR |\n\n### 11.3 재해 전환·변경 관리·훈련\n\n- 재해 복구 단계: **재해 선언**(대책본부·비상통지·상황실, 현황·예상 복구시간 파악, 최고책임자 보고) → **재해복구 활동**(전환 결정, DR 센터로 서비스 전환·장기 운영 대비, 주 센터 복구 촉구·조달 계획) → **주 센터 복구**(복귀 방안·시기 결정, 안정화 검증, 복귀 전환 확인).\n- 주·DR 사이트 일관성: 주 사이트에서 직접 변경하지 말고 **테스트/스테이징 환경**으로 검증한 뒤 주·DR에 반영, 롤백 가능하게 배포. 자동화 도구로 인프라 템플릿 관리, 안전한 중앙 저장소, CI/CD.\n- 모의훈련 점검: 데이터 정상 복구, 지휘·조정 체계, 내외부 의사소통, DR 시스템 성능, 주 센터 복귀 유효성, 통지 절차. 계획에는 일정·조직·범위·시나리오를 **시스템 명령어 수준까지**, 업무별 체크리스트와 비상연락망을 명시합니다.\n- 훈련 절차 9단계: 사전준비 → 재해선언 → DR 시스템 가동 → 업무 테스트 → 실업무 전환(**모의 훈련 시에는 실 업무 전환 안 함**) → 정상여부 모니터링 → DR 시스템 중단 → 업무 복귀 → 결과 정리.\n\n## 12. 복합 서비스 설계 정리\n\n| 요구 | 설계 |\n|---|---|\n| 3계층 단일 장애 무중단 | Web·App 앞 LB + Auto-Scaling(최소 2), DB는 Database HA(Active-Standby) |\n| 강한 결합 해제 | Message Queue Service(비동기) |\n| DB 쓰기 부하 증가 | **수직 확장**, 읽기는 Replica·CacheStore 캐싱(수평 확장·Active-Active 불가) |\n| 세션 유지 | Stateless 앱 + CacheStore 상태 관리 DB |\n| 호스트 장애 | Server Group **Anti-Affinity** |\n| AZ 장애 | Multi-AZ 배포 |\n| 컨테이너 노드 장애 | 노드 자동 복구(약 10분 NotReady) |\n| 폭주 접속 | Virtual Waiting Room 대기열, 정적 페이지 |\n| Region 재해 | Virtual Server DR, DB Replica, File Storage DR, Object Storage DR, Backup DR |\n\n> [!시험]\n> - Virtual Server DR: **Block Storage가 복제**되고 DR VM은 **정지** 상태입니다. \"VM은 항상 기동, Block Storage 미복제\"는 오답입니다.\n> - Backup DR 옵션은 **생성 시에만**. 기존 Backup에는 못 켭니다.\n> - DBaaS 복구는 **새 DB 생성 후 Master 전환**입니다.\n> - Hot Standby는 비용이 가장 **높고** RTO가 가장 **짧습니다**. 비용 최저·RTO 최장은 Cold입니다.\n> - 가용성 = MTTF/(MTTF+MTTR), 보상 조건이 있는 것은 **SLA**, 측정 지표는 **SLI**, 내부 목표는 **SLO**.\n> - Affinity는 근접 배치(성능), **Anti-Affinity**가 분산 배치(가용성)입니다.\n\n출처: WA백서 01 p.1~43, WA백서 03 p.1~29, SCP_v2_Explore_Compute_11-19 Virtual Server 슬라이드11\n"}, "2-1d": {"title": "보안 원칙 기반 복합 서비스 설계", "md": "## 한눈에 보기\n\n보안 요구사항은 대상 시스템이 쓰거나 생성하는 데이터의 **기밀성(Confidentiality), 무결성(Integrity), 가용성(Availability)** 측면의 요구·제약입니다. WA백서 02 보안성은 일곱 영역으로 구성됩니다.\n\n| 장 | 핵심 |\n|---|---|\n| I. 보안 요구사항 분석 | 관리적·기술적·물리적 보안, 정보보호 인증, CSA Top Threats |\n| II. 거버넌스 | 최소 허용, 책임 분담 모델과 관리형 서비스, Account 격리, 정기 진단, 가시성, Config Inspection |\n| III. 자격 증명·접근 권한(IAM) | MFA, 인증키 관리, Secret Vault 임시키, IdP 연동, 긴급 접속, 그룹(RBAC) |\n| IV. 데이터 보안 | 데이터 분류, 저장 중 보호(KMS·스토리지 암호화·ACL), 전송 중 보호(Certificate Manager, VPN, SSL/TLS) |\n| V. 인프라 보안 | 네트워크 계층화, Firewall·Security Group 심층 방어, 관리형 보안 서비스, 서버 취약점·이미지·Key Pair |\n| VI. 탐지 | Network Logging, Log Transmission, Trail |\n| VII. 사고 대응 | 백업·DR, 사고 대응 시나리오, 자동화 |\n\n## 1. 보안 요구사항과 규정\n\n- 공공기관 및 금융권은 **별도의 클라우드 도입 가이드라인**을 따라야 합니다.\n- 정보보호 관리체계는 관리적·기술적·물리적 영역의 정책·조직·운영방안·시스템 보안 체계를 설계·구축합니다.\n\n| 영역 | 내용 |\n|---|---|\n| 관리적 보안 | 보안 정책·조직, 인적 보안, 교육·훈련, 위험 관리, 자산 관리, 감사·모니터링, 업무 연속성·재해 복구. 기술적·물리적 보안의 기준 |\n| 기술적 보안 | 시스템, 네트워크, DB, 애플리케이션, 디지털 콘텐츠 보안. **클라우드 아키텍처의 주요 영역** |\n| 물리적 보안 | 시설·장비 보호, 데이터 센터 보안, 접근 통제. 온프레미스·프라이빗 클라우드는 사용자가, **퍼블릭 클라우드는 CSP가 관리** |\n\n인증 제도와 대상은 2-2d 강의에서 표로 정리합니다(ISO 27001/27017/27018/27799, CSA STAR, CSAP, ISMS-P, K-PaaS, 금융보안원 안전성평가).\n\n### 1.1 CSA Top Threats 2024\n\n신뢰 구간이 인터넷 너머 클라우드로 확장되어 경계 기반 보안 모델만으로는 한계가 있습니다.\n\n| 순위 | 위협 | 요점 |\n|---|---|---|\n| 1 | Misconfiguration and inadequate change control | 잘못 구성된 저장소·컨테이너, 과도한 권한, 기본 자격증명 유지, 무제한 포트 |\n| 2 | Identity and Access Management | 불충분한 ID·자격증명·키 관리 |\n| 3 | Insecure interfaces and APIs | 인증 안 된 엔드포인트, 약한 인증, 로깅 비활성화 |\n| 4 | Inadequate selection/implementation of cloud security strategy | **Lift&Shift 마이그레이션에서 기존 보안 기능을 그대로 이식하고 공동책임모델을 잘 이해하지 못해** 보안 이슈 발생 |\n| 5 | Insecure third-party resources | 오픈 소스·API 문제, SAST/DAST 적용 |\n| 6 | Insecure software development | 안전한 키 관리, CI/CD 앱 보안 점검 |\n| 7 | Accidental cloud disclosure | 거버넌스 부재로 의도치 않은 데이터 유출 |\n| 8 | System vulnerabilities | 제로데이, 패치 누락, 약한 자격증명 |\n| 9 | Limited cloud visibility/observability | 내부 오용·외부 침해에 대한 가시성 부재 |\n| 10 | Unauthenticated resource sharing | 인가받지 않은 공유로 민감 데이터 유출 |\n| 11 | Advanced Persistent Threat | 지속적인 지능형 공격 |\n\n## 2. 거버넌스\n\n- **최소 허용의 원칙**: 기본은 **모든 접근 거부**, 필요한 만큼 권한을 요청·승인 후 허용. 초기 사용자에게 AdministratorAccess를 주고 방치하면 실수·유출 시 광범위한 피해가 납니다.\n- **책임 분담 모델**: CSP와 사용자는 각자 영역에 접근할 수 없고 접근해서도 안 됩니다. CSP는 공용 물리 영역·하드웨어·소프트웨어 보안과 보안 서비스·기능·가이드를 제공하고, 사용자는 임차한 자신의 자원 보안을 책임지며 제공 서비스나 3rd Party 솔루션을 활용합니다. IaaS에서 게스트 OS 패치, Security Group·Firewall 규칙 구성은 사용자 책임입니다(일반 개념으로 정리한 IaaS 책임 구분).\n- **보안 관리 영역 축소**: 관리형 서비스(Database 서비스, Kubernetes Engine, Cloud Functions 등)는 플랫폼 영역 보안을 CSP가 수행합니다. VM에 3rd Party 보안 SW를 직접 설치하는 대신 WAF, DDoS Protection 등 Security 서비스를 씁니다.\n- **워크로드 격리**: 독립적인 예산·운영 체계를 갖는 정보시스템은 **Account 단위**로 구성합니다. Account는 사용자·그룹·권한 정책을 관리하는 가장 높은 단위이자 **비용을 분리하는 최소 단위**입니다. 민감도가 다른 워크로드를 한 Account에 두면 정책 관리가 어렵고, Account당 VPC가 **최대 5개**라 분리에 제약이 생길 수 있습니다.\n- **정기 보안 진단**: 인프라 구성 검토(Firewall·Security Group 규칙), IAM 최소 권한, 인증서 유효 기간·접근 IP, 침투 테스트와 취약점 스캔, 규정 준수·정책 검토(ISMS-P), 로그(Trail, Cloud Monitoring 이벤트), 백업·복구 계획. 주기는 **최소 분기별, 이상적으로 월간**.\n- **보안 가시성**: 자원 현황 파악과 활동 추적. 가시성 부족 시 탐지되지 않는 위협, 공격자 장기 잠복, Over-Provisioning, 불필요한 열린 포트·과도한 권한. **Trail은 자원에 대한 모든 API 호출 기록**(감사 추적), SIEM으로 통합 관리.\n- **자동화 진단 도구 Config Inspection**: 모범 사례 기반으로 IAM, Networking, Compute, Storage, Database 전반을 점검하고 결과를 **Account 단위**로 관리합니다. 스케줄에 따라 주기적으로 또는 요청 즉시 실행합니다.\n\n## 3. 자격 증명 및 접근 권한 관리\n\n### 3.1 인증 수단\n\n- Console 접근 시 **MFA를 반드시 수행**합니다. 인증키는 접근 가능한 **IP 대역**을 지정합니다.\n- IAM 정책으로 제어 항목, 액션, 자원 유형, 인증 방식, IP 등 세밀한 정책을 사용자·그룹에 적용합니다.\n- **ID Center**: Account별 자원 접근 권한을 중앙에서 관리. 서비스별 권한 정책을 만들고 **Organization 서비스와 연계된 Account와 정책**을 사용자에게 할당합니다.\n\n### 3.2 임시 인증(Secret Vault)\n\n- 모든 클라우드 서비스는 REST API 기반입니다. Console은 MFA로 보호되지만 CLI·Open API용 **인증키**는 같은 방식으로 보호할 수 없어 별도 관리가 필요합니다.\n- 설계 원칙: ① 인증키 **만료 기간과 접속 IP** 지정 ② **임시키** 사용. 영구 인증키는 지양합니다.\n- Secret Vault 절차: ① Console에서 받은 인증키로 Secret Vault에 **Token 요청**, 발급 ② Token을 애플리케이션에 설정 ③ Token으로 API를 호출해 **OpenAPI 임시키** 발급, 임시키로 SCP 자원 접근.\n\n### 3.3 IdP 연동과 긴급 접속\n\n- 자격 증명 공급자(IdP)로 타사 IdP와 SCP IAM을 연동합니다. 사전 등록한 타사 IdP 인증 정보(**SAML, OIDC** 등)로 Console 접근, **SSO**로 한 번 인증해 여러 서비스 접근. 기존 인증 서비스가 있으면 사용자 정보를 따로 관리하지 않아 효율적입니다.\n- 최상위 관리 권한은 Account, Account 내 최상위 권한은 **AdministratorAccess** 정책입니다. 유일한 관리자가 유고·휴대전화 분실로 인증 불가한 상황에 대비해 **긴급 접속 프로세스**를 마련합니다. 방안: 계정 관리자에게 요청해 AdministratorAccess 그룹에 새 사용자 추가, 또는 **주 관리자와 보조 관리자를 함께 지정**.\n\n### 3.4 그룹 기반 권한 관리\n\n- 사용자에게 직접 정책을 붙이는 것은 최소화하고 **권한 그룹에 정책을 연결한 뒤 사용자를 등록·해제**합니다. 입·퇴사, 부서 이동에 따른 누락 오류가 줄어듭니다.\n- 그룹은 부서·프로젝트 팀 단위로 구성해 **RBAC** 기반 그룹을 구현합니다. SCP에서는 기본적으로 사용자에게 권한을 주지 않고 그룹에 부여합니다.\n- 설계 원칙: 사용자·그룹 정기 검토, 사용자 접근 IP 지정. 구축 기간에 모두에게 준 관리자 권한은 프로젝트 완료 후 축소합니다. 사용하지 않는 자격 증명·권한은 제거합니다.\n\n## 4. 데이터 보안\n\n### 4.1 데이터 분류\n\n| 기준 | 분류 |\n|---|---|\n| 중요도 | 핵심 데이터 / 비핵심 데이터 / 지원 데이터 |\n| 민감도 | 매우 민감한 데이터 / 민감한 데이터 / 비민감 데이터 |\n| 평가 예 | 기밀성·가용성·무결성 각 10~1점, **개인정보 포함 시 30점 추가** |\n| ISO/IEC 27001 | Highly Restricted / Restricted / Internal use / Public |\n| 구조 | 정형(RDBMS 테이블, 스프레드시트, CSV) / 비정형(동영상, 오디오, 사진, 문서, 메일 본문, 전처리 필요) |\n| 포함 정보 | 개인정보(살아 있는 개인, 가명정보 포함) / 비개인정보(기밀정보, 공용정보) |\n\n개인정보 포함 여부를 고려하는 이유는 법률상 보호 요건 대부분이 개인정보 포함 여부로 정해지기 때문입니다.\n\n### 4.2 저장 중 데이터(Data-at-rest) 보호\n\n- **KMS**: 암호화 키를 생성·저장·관리하며 계층적으로 암호화된 중앙 집중 키 방식으로 관리합니다. 키 라이프사이클을 관리해 주지만, **KMS로 애플리케이션 데이터를 암호화하려면 사용자가 직접 앱에 암호화 코드를 작성**해야 합니다. 마스터 키는 FIPS 140-2 Lv3 표준을 준수하는 HSM의 루트 키로 생성됩니다(SEC4 교재).\n- 스토리지별 암호화\n\n| 저장소 | 암호화 |\n|---|---|\n| Block Storage | 사용자 선택. VM 생성 시 디스크 유형을 **SSD_KMS 또는 HDD_KMS**로 선택 |\n| File Storage | **기본 암호화**, AES-256 |\n| Object Storage | **사용자 선택**, AES-256 |\n\n- 접근 제어: File Storage, Object Storage는 **ACL** 방식으로, 접근 서버 목록에 등록해야 접근할 수 있고 **Public IP, VPC Endpoint**도 관리합니다. 인프라 보안 절에서는 ACL 관리 저장소로 File Storage, Object Storage, **Container Registry**를 듭니다.\n\n### 4.3 전송 중 데이터(Data-in-flight) 보호\n\n- 암호화되지 않은 HTTP는 도청·중간자 공격에 노출됩니다. HTTPS(SSL)를 사용합니다.\n- **Certificate Manager**: SSL/TLS 인증서 등록·조회·만료 알림, 외부 인증기관 인증서 등록 시 유효성 체크, 등록 인증서로 Load Balancer 프로비저닝, 만료 임박 시 알람 메일.\n- 전송 암호화 선택: 지점이 특정되고 지속 전송이 필요하면 **VPN(IPSec)**, 지점이 특정되지 않는 웹 트래픽은 **SSL/TLS**.\n- 공공 전송 규정: \"비밀은 암호화되지 아니한 상태로 정보통신 수단을 이용하여 접수하거나 발송해서는 아니된다\"(보안업무규정). 공공 클라우드·공공기관 전송은 기관 망과 클라우드를 VPN으로 연결해 IPSec 암호화합니다.\n- **SSL/TLS Termination**: LB에서 종료하면 LB~VM 구간은 평문이 되지만 서버 암복호화 부하가 줄어듭니다. **규정상 인증서를 서버에 두어야 하면 LB에서 Termination하지 않고 서버에 인증서**를 구성합니다.\n\n## 5. 인프라 보안\n\n### 5.1 네트워크 계층화\n\n- 모범 사례: 작은 범위로 격리해 **폭발 반경**을 줄이고 중요 데이터에는 필요한 접근만 허용.\n- 설계 원칙: ① 서버를 기능별 그룹으로 나눠 별도 서브넷, 필요한 경우 외에는 **프라이빗 서브넷** ② 인터넷→VPC 접근 지점 최소화 ③ 중요 저장소는 필요한 대상만 접근.\n- 3계층 예(그림 2-11)\n  1. **워크로드 격리·계층화**: Web/App/DB 서브넷, 모든 서버에 **Private IP만**(Public IP 미연결). 관리자는 **VPN으로 Bastion Server**에 프라이빗 연결 후 경유 관리.\n  2. **외부 공격 표면 최소화**: 인터넷에는 **Load Balancer만** 개방, 사용자는 LB Public IP로만 접근.\n  3. **저장소 접근 제어**: DB는 필요한 앱만 접근, ISMS 등 규정이 요구하면 **접근 제어 서버 경유**. Storage는 White List(ACL).\n\n### 5.2 트래픽 제어와 심층 방어\n\n- 설계 원칙: ① VPC 내 모든 자원에 통신 제어 정책 ② Fine Grained 정책 ③ 필요한 포트로만 제한하는 **심층 방어**.\n- 흐름 분류: 퍼블릭 서브넷(Public IP 연결 VM)·프라이빗 서브넷(임의적 분류), Inbound/Outbound, **North-South**(VPC 외부↔내부, Firewall·WAF·IPS 배치)와 **East-West**(VPC 내부 구성 요소 간, LB·MQ 배치, 분산 방화벽 Security Group).\n- **Firewall은 North-South(네트워크 경계), Security Group은 East-West(서버 트래픽)** 제어에 씁니다.\n\n3계층 트래픽 제어(그림 2-12, 표 2-9)\n\n| 번호 | 대상 | 규칙 |\n|---|---|---|\n| 1-1 | Internet Gateway Firewall | 0.0.0.0/0 → Web LB Service IP, HTTPS(443) Allow |\n| 1-2 | Internet Gateway Firewall | 관리자 Public IP → Bastion, RDP/SSH(3389/22) Allow |\n| 2-1, 2-2 | Bastion SG | 관리자 IP Inbound 원격 접속, 모든 SG 대상 Outbound |\n| 3-1, 3-2 | Web LB Firewall | 인터넷 443 수신, Web VM으로 HTTP(80) 전송(SSL Termination, 포트 변경) |\n| 4-1~4-3 | Web SG | LB Source NAT IP에서 80 Inbound, App LB로 8080 Outbound, Bastion SG에서 관리 접속 |\n| 5-1, 5-2 | App LB Firewall | Web VM에서 80 수신, App VM으로 8080 전송 |\n| 6-1~6-3 | App SG | 8080 Inbound, DB SG로 **2866** Outbound, Bastion 관리 접속 |\n| 7-1, 7-2 | DB SG | App SG·DB SG와 2866 Inbound/Outbound(DB 간 통신 포함) |\n\n- **2866 포트는 SCP Database 서비스 기본 포트**입니다.\n- 계층마다 수신·송신 포트를 달리해 침입자가 DB에 도달하지 못하게 하는 것이 심층 방어 목적입니다. 방어 실패 가능성을 인정하는 데서 출발합니다.\n- **Security Group은 CIDR뿐 아니라 다른 Security Group을 허용 대상으로 지정**할 수 있어, 그 SG에 연결된 모든 VM이 허용되므로 Auto-Scaling 계층에도 주소 범위를 지정할 필요가 없습니다.\n- 표의 구성에는 LB 서버 그룹 헬스 체크 규칙은 포함되지 않았습니다.\n\n### 5.3 관리형 보안 서비스\n\n- 모범 사례: 관리형 보안 서비스로 보안 강화. **SR로 신청**하며 장비 관리·점검을 일임합니다.\n- 설계 원칙: ① **Secure Internet Gateway**를 배포하고 관리형 보안 서비스 신청 ② 규정 요구에 맞는 서비스 사용.\n\n| 서비스 | 기능 | 침해 유형 |\n|---|---|---|\n| Secured Firewall | 4계층 트래픽 제어 | 무단 접근, IP 스캐닝 |\n| WAF | HTTP/HTTPS 웹 취약점 공격, 자동화 Bot 방어 | Injection, XSS, Web Scan |\n| DDoS Protection | 대량 트래픽 DDoS 탐지·방어 | DDoS |\n| IPS | 악의적 트래픽·애플리케이션 조작 패턴 감시 | 해킹 공격 탐지 |\n\n### 5.4 서버 보안\n\n- SCP는 **Linux 5종, Windows Server**를 제공합니다. 파일·폴더 권한, 별도 디렉토리, 공통 접근 지양, 앱 재시작 자동화, 최신 패치, **OWASP 안전한 코딩**.\n- 정기 관리 항목: OS 이름·버전(End Of Support), 플랫폼·미들웨어 SW, 사용자 앱 코드, IP·서브넷 등 네트워크 정보, 사용자·인증 Key Pair.\n- **Container Registry는 저장된 이미지의 취약점 점검 도구**를 제공합니다.\n- 프로비저닝: 최신 패치가 적용된 **강화 이미지**를 관리하고 서버 시작 시 자동 업데이트, 컨테이너는 **CI/CD 파이프라인에서 취약점 점검 자동화**. 신뢰할 수 있는 레지스트리에서 가져와도 **서명 확인·취약성 스캔** 없이는 위험하며, 패치에만 의존하면 기준 이탈이나 맬웨어 잔존이 생길 수 있습니다. 자체 **프라이빗 레지스트리**를 둡니다.\n- 접근 제어: Virtual Server는 **Key Pair**로 접근하며 Key Pair는 **생성 시 한 번만 다운로드**할 수 있습니다. 관리자를 최소화합니다.\n\n## 6. 탐지\n\n| 기능 | 내용 |\n|---|---|\n| Network Logging | Firewall, Security Group, NAT 로그 저장소(Object Storage) 지정. 로그 버킷은 접근 목록·암호화·버전 관리로 변경 방지 |\n| Log Transmission | 방화벽, IPS, DDoS 등 보안 장비 로그를 실시간 수집·필터링해 사용자 관제 장비로 전송, 이중화 저장소 보관, **VPN으로 안전하게 전송** |\n| Logging&Audit Trail | 사용자 작업 기록, 개인정보보호법 등 규정상 중요 자료, 권한과 실제 작업 비교로 과도 권한 조정. **로그 파일 검증** 활성화 시 같은 버킷에 **digest 파일** 저장, 검증은 Open API·CLI |\n\n## 7. 사고 대응\n\n- 랜섬웨어·데이터 손상 시 백업 복구. 복구 수준: 파일, 앱 데이터, 앱, 서버 볼륨, 서버, 관리형 서비스. 복구 중 중단이 허용되지 않으면 DR 시나리오(안정성 원칙).\n- 사고 대응 단계: 사고 인지·보고 → 초기 대응(네트워크 차단 등, 가장 중요) → 조사·복구(로그 분석, 디지털 포렌식) → 사후 분석·개선.\n- 시나리오 포함 항목: 침해사고 정의·범위, 비상연락체계, 선포 절차, 신고·통지·기록·보고, 원인 분석·대응·복구, 복구 조직 역할, 장비·자원 조달, 보고서, 훈련 시나리오 등.\n- 자동화: DDoS Protection, Auto-Scaling으로 서버 증가, **Scaling 개시 알림**으로 관리자가 비정상 확장을 인지. 설계 원칙: 관리형 보안 서비스 활용, 침해 유형별 대응과 자동화 조치.\n\n## 8. 복합 서비스 설계 정리\n\n| 요구 | 설계 |\n|---|---|\n| 외부 노출 최소화 | 서버는 Private IP만, LB만 인터넷 개방 |\n| 관리 접속 | VPN → Bastion Server → 각 서버 |\n| 경계·내부 통제 | Firewall(North-South), Security Group(East-West, SG 참조) |\n| 웹 공격 | WAF, IPS, DDoS Protection, Secured Firewall(Secure Internet Gateway, SR 신청) |\n| 서버 부하 경감 vs 규정 | LB SSL Termination vs 서버 인증서 |\n| 저장 데이터 | Block SSD_KMS/HDD_KMS, File 기본 암호화, Object 선택 암호화, ACL |\n| 전송 데이터 | VPN(IPSec), SSL/TLS, Certificate Manager |\n| 계정 보안 | MFA, 인증키 만료·IP, Secret Vault 임시키, 그룹 RBAC, 주·보조 관리자 |\n| 감사·관제 | Trail(digest), Network Logging, Log Transmission, Config Inspection |\n\n> [!시험]\n> - Security Group은 **다른 Security Group도 허용 대상**으로 지정할 수 있습니다. \"CIDR만 가능하므로 서브넷 전체 대역 허용\"은 오답입니다.\n> - KMS는 키 관리만 대신합니다. 앱 데이터 암호화는 **사용자가 코드를 작성**해야 합니다.\n> - File Storage는 기본 암호화, Object Storage는 선택, 둘 다 AES-256입니다.\n> - AdministratorAccess 그룹에는 **주·보조 관리자**를 함께 두는 것이 긴급 접속 대비책입니다.\n> - CSA 위협 4위: Lift&Shift에서 **기존 보안을 그대로 이식**하는 것이 위험 요인입니다.\n> - 정기 보안 진단 주기는 최소 분기, 이상적으로 월간입니다.\n\n출처: WA백서 02 p.1~42, SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드8\n"}, "2-1e": {"title": "성능효율성 원칙 기반 복합 서비스 설계", "md": "## 한눈에 보기\n\n성능을 파이프 속 물 흐름에 비유하면 **물의 속도 = 응답 시간, 파이프 굵기 = 동시에 처리할 수 있는 작업 수**입니다. 업무 특성(물이냐 기름이냐)에 따라 같은 자원이라도 처리량이 달라지므로 모든 시스템에 통하는 일률적 기준은 없습니다. 백서는 성능을 **특정 업무를 대상으로 사용자의 요청을 기대한 시간 내에 처리할 수 있는 작업량**으로 정의합니다. 과거에는 제한된 물리 자원에서 부분 최적화를 했다면, 이제는 클라우드 자원으로 증가하는 수요를 효율적으로 충족하는 데 중점을 둡니다.\n\n| 장 | 주요 내용 |\n|---|---|\n| I. 성능효율성을 위한 설계 | 비용·성능 트레이드오프, 요구에 맞는 서비스 선택, 흐름(flow) 설계, 지연 시간·처리량·용량 계획, 성능 요구사항, USE/RED, 지속 최적화 |\n| II. 컴퓨팅 설계 | 서버 타입, 사이징(수식계산법·참조법·시뮬레이션법), 메모리, Container, GPU |\n| III. 데이터 저장소 설계 | 스토리지 선택, 데이터베이스 선택(OLTP·OLAP·NoSQL·검색), DB 최적화, 캐싱 |\n| IV. 네트워킹 설계 | 트래픽 요구사항(Region 선정, 대역폭), 지연 시간 단축(Global CDN) |\n\n## 1. 성능효율성을 위한 고려사항\n\n### 1.1 비용과 성능 트레이드오프\n\n- 미리 배포하거나 오버 프로비저닝하면 예상 못한 비용이 들고, 수요가 그 한계를 넘으면 결국 사후 조정이 필요합니다. 수요에 따른 자원 조정(탄력성)을 설계에 반영합니다.\n- 모범 사례: 기능 요구에 필요 없는 투자를 줄이고 수요에 따라 성능을 높일 수 있는 아키텍처.\n- 설계 원칙: ① 사용자 수요에 맞는 **Auto-Scaling 정책**(잘못 구성하면 불필요한 확장 또는 필요한 시점에 성능 부족) ② 적절한 **캐싱**(콘텐츠가 자주 쓰이지 않거나 **TTL**이 맞지 않으면 비용만 들고 효과 없음).\n\n### 1.2 요구사항에 맞는 서비스 선택\n\n- 성능 목표 충족: 예) 고가용성 고성능 OLTP DB는 VM이나 DBaaS 대신 **Bare Metal Server 2대 이중화 + Multi-Attach 방식 Block Storage(BM)** 연결을 선택할 수 있습니다.\n- 규정·제한 충족: 예) DBaaS가 지원하지 않는 **특정 암호화 모듈**을 적용해야 하는 규정이 있으면 DBaaS 사용이 어려울 수 있습니다.\n- 조직 역량: MSA는 효율적이지만 기술 역량·프로세스·문화가 없으면 실패 가능성이 높습니다.\n\n### 1.3 성능을 고려한 서비스 흐름 설계\n\n- 흐름은 사용자 요청 이벤트 생성 → 메시지 전달 → 응답 처리·회신의 일련 과정입니다. 구성 요소에 분석·추적 도구와 메트릭을 적용해 데이터를 모으고, BIA처럼 비즈니스 영향도로 **중요한 흐름**을 식별해 개선 우선 대상으로 삼습니다.\n- 중요한 흐름에는 ① 별도 **VPC 또는 서브넷**의 전용 자원 ② VM·컨테이너 단위 **소프트웨어 흐름 격리** ③ 전용 자원·충분한 용량을 줍니다.\n- 예(그림 4-2, 온라인 채용 사이트): 주요 흐름인 Web Server와 Application Server는 Auto-Scaling, DB는 DBaaS 고가용성, 주요 흐름이 아닌 Bastion Server와 Standalone Application 서버는 단독 서버로 구성합니다(Multi-AZ는 '26년 출시 예정 표기).\n\n## 2. 클라우드 성능 개선 영역\n\n| 영역 | 정의와 개선 방안 |\n|---|---|\n| 지연 시간(Latency) | 네트워크로 데이터를 전송하는 데 걸리는 시간. 원인: 회선·라우터 등 중계 장비, **홉(hop) 수가 많을수록 증가**, 경계 보호 장비, 서버 팜 내부, 타 서버 연계. 개선: 클라이언트와 가까운 **Region** 배치, **CDN** 엣지 응답 |\n| 처리량(Throughput) | 단위 시간당 처리 작업량(네트워크 Bytes/s·bits/s, OS는 CPU-메모리 전송량, DB는 operations/s·Transactions/s). 요구는 동시 접속자 수·동시 처리량으로 표현. 개선: **전송 서버 확장**(LB에 노드 병렬), **전송 방식 변경**(세션 대신 API 기반 연결), **하이브리드 연결**(Direct Connect 대역폭 선택) |\n| 용량 계획 | 미래 수요·사용 패턴을 반영한 자원 의사결정. **1년 이상** 축적 데이터 분석(계절·주기 수요), 별도 테스트 환경에서 병목 식별, **자동 확장**(스케줄 기반 Auto-Scaling, 관리형 서비스 내재 확장) |\n\n## 3. 성능 목표 정의, 측정, 개선\n\n### 3.1 성능 요구사항(표 4-1)\n\n| 구분 | 항목 | 예시 |\n|---|---|---|\n| 처리 속도·시간 | 온라인성 업무 응답시간 | 요청부터 3초 이내 최초 결과 |\n| | 온라인 배치성 업무 | 3분 이내 결과 |\n| | 배치성 업무 | 일일 배치 10분 이내 |\n| | 웹 페이지 표시 | 수 초 이내 |\n| | 오류 응답 | 입력 후 3초 이내 메시지 |\n| 처리량 | 동시 사용자 접속 수 | 평균 200명 이상 지원, 성능 저하 없음 |\n| | 동시처리능력 | 최대 부하 시 초당 50건 처리 |\n| 자원 사용량 | CPU·메모리 사용률 | 서비스 시간 평균 60% 미만 |\n\n성능 요구사항은 제안요청서에 명시하고 구축 시 성능 테스트와 연계합니다.\n\n### 3.2 USE vs RED\n\n| 구분 | USE 방법론 | RED 방법론 |\n|---|---|---|\n| 제안자 | Brendan Gregg | Tom Wilkie |\n| 관점 | **모든 resource(자원)** 에 대해 Utilization(사용률), Saturation(포화도), Errors(오류) | **모든 서비스**에 대해 Rate(초당 요청 수), Errors(요청 중 실패 횟수), Duration(요청 처리시간) |\n| 중심 | 하드웨어 지표(CPU, Disk, Memory, Network) | 요청(request) 기반 서비스 지표 |\n| 적합 | 기존 시스템, 성능 검토 초기 병목 분석, 소프트웨어 무관하게 기계적 적용 | Microservice 환경의 응답 지연·오류 분석 |\n| 한계·도구 | 물리 자원을 분할하는 MSA에는 한계 | **Cloud Monitoring은 RED 지표를 수집할 수 없어 Prometheus 등** 활용 |\n\n- USE 예: 디스크 사용률 90%, CPU 평균 실행 대기열 길이 4, 네트워크 인터페이스 late collision 50번.\n- USE 절차는 **오류를 먼저 점검**하고 사용률, 포화도 순으로 확인합니다(오류가 직관적이라 시간 절약).\n- CPU 100%면 병목 가능성이 높으며, **Cloud Monitoring 최소 지표 갱신 주기는 1분**이므로 지속적인지 일시적인지 확인합니다.\n\n> [!주의]\n> 백서 표 4-3(RED 방법론)의 \"예제\" 열은 USE 표(4-2)의 예제(디스크 사용률 90% 등)가 그대로 들어가 있어 편집 오류로 보입니다. RED의 정의는 Rate=초당 요청 수, Errors=요청 중 실패 횟수, Duration=요청 처리시간으로 기억하세요.\n\n### 3.3 지속적 최적화\n\n- 설계 원칙: ① 새로운 클라우드 기술 검토·적용(이전 버전 지원 중단은 성능·보안·가용성에 악영향) ② 개선 우선순위 지정(트렌드 변화로 중요 쿼리가 바뀌면 자원·쿼리 계획 변경) ③ 성능 최적화 자동화(테스트·배포·모니터링 자동화, 임계치 알림, 긴급 이벤트 자동 스크립트).\n\n## 4. 컴퓨팅 설계\n\n### 4.1 서버 타입(표 4-4)\n\n| 상품 | 타입 | CPU | Memory | 옵션 |\n|---|---|---|---|---|\n| Virtual Server | Standard | 1/2/4/6/8/10 vCore | 2~160GB | Max Network 10Gbps |\n| Virtual Server | Standard | 12/14/16 vCore | 24~256GB | 12.5Gbps |\n| Virtual Server | High Capacity | 24/32/48/64/72/96/128 vCore | 48~1,536GB | 25Gbps |\n| GPU Server | A100(80G) | 16/32/64/128 vCore | 240~1,920GB | GPU 1~8 |\n| GPU Server | H100(80G) | 12/24/48/96 vCore | 240~1,920GB | GPU 1~8 |\n| Bare Metal Server(3thGen) | | 16/32/64/96/128 vCore | 64~2,048GB | Physical CPU 8~64 |\n\n- **Virtual Server**: 16vCore 이하 **Standard(s1, Intel Ice Lake)**, 최소 1vCore/2GB, 2~16vCore는 CPU:Memory 1:2/1:4/1:8/1:16. 24vCore 이상 **High Capacity(h2, Intel Sapphire Rapids)**, 1:2/1:4/1:8/1:12. OS: RHEL, Ubuntu, Alma, Rocky, Oracle Linux, Windows Server, Kubernetes 이미지·Data Service Console 이미지 구성 가능.\n- **Bare Metal Server**: 가상화 없이 물리적으로 분리된 CPU·메모리를 **단독 할당**하는 고성능 서비스. 3세대(Intel Sapphire Rapids), 1:4/1:8/1:16. OS용 Internal Disk: 16vCore 480GB×2, 32vCore 960GB×2, 96/128vCore 1.92TB×2. **실시간(Real-Time) 시스템, HPC, 과도한 I/O** 워크로드, **Multi-Attach로 Active-Active 고가용성 DB**.\n\n### 4.2 서버 규모 산정 방법\n\n클라우드에서도 사이징이 중요한 이유는 **월 사용료를 산정하고 온프레미스 대비 TCO를 도출**하기 위해서입니다.\n\n| 방법 | 개념 | 장점 | 단점 |\n|---|---|---|---|\n| 수식계산법 | 사용자 수 등 요소로 계산 후 보정치 적용 | 근거 명확, 간단 | 보정치가 틀리면 차이 큼, 보정치 근거 제시 어려움 |\n| 참조법 | 기존 시스템 규모와 비교 | 기존 시스템과 비교 가능, 비교적 안전 | 비교에 의존해 근거 미약 |\n| 시뮬레이션법 | 워크로드 모델링·시뮬레이션 | 상대적으로 정확 | 시간·비용 많이 소요 |\n\n### 4.3 수식계산법: Web/WAS CPU(max-jOPS)\n\n산정식: **CPU(max-jOPS) = (동시 사용자 수 × 사용자당 오퍼레이션 수 × 기본 OPS 보정 × 업무용도 보정 × 인터페이스 부하 보정 × 피크타임 부하 보정 × 연계 부하 보정 × 클러스터 보정 × 시스템 여유율) / (시스템 목표 활용률 × 단위 보정)**\n\n| 항목 | 범위 | 일반값·규칙 |\n|---|---|---|\n| 사용자당 오퍼레이션 수 | 3~6 | 5. 3=웹 조회 위주, 4=웹 위주 혼합, 5=웹+응용 로직, 6=응용 로직 위주 |\n| 기본 OPS 보정 | 고정 | **3**(SPEC 실험 환경 → 실제 환경) |\n| 업무용도 보정 | | **Web 0.7, WAS 2** |\n| 인터페이스 부하 보정 | 1.1~1.2 | 1.1 |\n| 피크타임 부하 보정 | 1.2~1.5 | 1.3. 상 1.5(특정 시간·일 과도), 중 1.4(마감일), 하 1.3(매일·매주 피크), 기타 1.2 |\n| 연계 부하 보정 | 1~1.3 | Web은 1. WAS: 연계 없음 1, 단순 조회 1.1(10%), 대내 갱신 1.2(20%), 대내외 갱신 1.3(30%) |\n| 클러스터 보정 | | Active-Active 2-NODE 1.4~1.5, 3-NODE 1.3, **Active-Standby 1(미적용)** |\n| 시스템 여유율 | | 1.3 |\n| 시스템 목표 활용률 | | 0.7 |\n| 단위 보정 | 24~31 | Composite: X86 29, 일반 30, Unix 31. MultiJVM: X86 24, 일반 25, Unix 26 |\n\n- 코어 산정 = 산정 jOPS / 기준 코어당 성능 jOPS(하드웨어마다 1,000~3,000). 예: 5,000 / 1,500 ≈ 3.3코어 → **4코어** 선택.\n\n동시 사용자 수 추정(표 4-7)\n\n| 구분 | 접속 사용자 수 | 동시 사용자 수 |\n|---|---|---|\n| Web 대외용 | 전체의 1%~10% | 접속의 5%~30% |\n| Web 대내용 | 전체의 30%~50% | 접속의 40%~70% |\n| WAS | | Web 동시 사용자의 50%~100%, **일반값 75%** |\n| DB | | WAS 동시 사용자의 50%~100%, **일반값 75%** |\n\n> [!시험]\n> 예제: 전체 100,000명, 접속 5%, Web 동시 20%, WAS 일반값 → Web 동시 = 100,000 × 0.05 × 0.2 = 1,000명, WAS 동시 = 1,000 × 0.75 = **750명**입니다.\n\n> [!주의]\n> 클러스터 보정 2-NODE 값이 백서 안에서 다르게 적혀 있습니다. 표 4-6, 본문, 표 4-20은 **1.4~1.5**, 표 4-11은 **1.3~1.5**입니다(본문은 \"Active-Active는 1.3~1.5를 적용하되 2-NODE는 1.4~1.5, 3-NODE는 1.3\").\n\n### 4.4 수식계산법: DB CPU(tpmC)\n\n산정식: **CPU(tpmC) = (분당 트랜잭션 수 × 기본 tpmC 보정 × 피크타임 × DB 크기 × 애플리케이션 구조 × 애플리케이션 부하 × 연계 부하 × 클러스터 × 시스템 여유율) / 시스템 목표 활용률**\n\n| 항목 | 범위 | 일반값·규칙 |\n|---|---|---|\n| 분당 트랜잭션 수 | | 기존 시스템 조사 / 동시 사용자 수 이용(동시 사용자 × 업무 수 × 업무당 트랜잭션 수, 예 업무 2개·업무당 4~6개) / 클라이언트 수 이용 |\n| 기본 tpmC 보정 | 고정 | **5** |\n| 피크타임 | 1.2~1.5 | 1.3 |\n| DB 크기 보정 | 1.5~2.0 | **1.7**(가장 큰 테이블 레코드 건수와 전체 볼륨으로 표 4-16에서 선택, 50GB 미만·8 이하 1.50 ~ 2TB 이상·256 이상 2.00) |\n| 애플리케이션 구조 | 1.1~1.5 | 1.2. 응답 1초 1.50, 2초 1.35, 3초 1.20, 4초 1.10, **5초 이상 미적용** |\n| 애플리케이션 부하 | 1.3~2.2 | 1.7. 상 1.9~2.2(배치 많음), 중 1.6~1.8, 하 1.3~1.5(배치 없음) |\n| 연계 부하 | 1~1.2 | 1. 단순 조회·갱신 1.1(10%), 대용량 1.2(20%) |\n| 클러스터 | | 2-NODE 1.4~1.5, 3-NODE 1.3 |\n| 여유율·목표 활용률 | | 1.3, 0.7 |\n\n- 코어 = 산정 tpmC / 기준 코어당 tpmC(70,000~400,000). 서버 타입은 올림해 선택합니다.\n\n> [!주의]\n> 표 4-14 예시 문장은 \"tpmC가 800,000이고 기준 코어당 190,000이라면 700,000/190,000 = 약 3.7코어 → 4코어\"라고 적혀 있어 분자 값이 서로 다릅니다(800,000/190,000이면 약 4.2코어). 계산 문제가 나오면 문제에 주어진 값으로 직접 계산하세요.\n\n### 4.5 참조법(기존 시스템 기준)\n\n산정식: **기존 CPU Core 수 × Tier 구성 보정 × 이중화 구성 보정 × 서버 형태 보정 × CPU 평균 사용률 × 여유 사용률(1.3)**\n\n| 항목 | 값 |\n|---|---|\n| Tier 1→2, 2→3 | 0.7 |\n| Tier 1→3 ((Web/WAS/DB) → (Web),(WAS),(DB)) | **0.5** |\n| Tier 2→1, 3→2 | 2.0 |\n| Tier 3→1 | 3.0 |\n| 이중화 1→2 Active-Active | 0.7 |\n| 이중화 1→2 Active-Standby | 1.0(보정 없음) |\n| 이중화 2→1 | 2.0 |\n| 서버 형태: 물리 → 클라우드 | **1.2**(가상화 오버헤드) |\n| 서버 형태: 가상 → 클라우드 | 1.0 |\n| CPU 평균 사용률 | 50%면 0.5 |\n| 여유 사용률 | 목표 70%면 1.3 |\n\n예: 4코어 × 1(티어 변경 없음) × 0.7(A-A) × 1.2(물리→가상) × 0.3 × 1.3 ≈ 1.3코어 → **2코어**. 참조법은 CPU 자체 성능은 고려하지 않고 개수만 봅니다.\n\n### 4.6 수식계산법: 메모리\n\n산정식: **메모리(MB) = {시스템 영역 + (사용자당 필요 메모리 × 동시 사용자 수) + 애플리케이션 필요 메모리} × OS 버퍼 캐시 보정 × 시스템 여유율**\n\n| 항목 | 값 |\n|---|---|\n| 시스템 영역 | OS·DBMS·미들웨어·유틸리티 소요, 제조사 권고 반영 |\n| 사용자당 필요 메모리 | 1MB~3MB, 일반값 2MB |\n| 동시 사용자 수 | CPU 산정 시의 값을 그대로 사용 |\n| OS 버퍼 캐시 보정 | 1.1~1.3, **일반값 1.15** |\n| 애플리케이션 필요 메모리 | DBMS 공유 메모리, WAS Heap 등 |\n| 시스템 여유율 | 1.3 |\n\n> [!시험]\n> 예제: (512 + 2 × 1,000 + 488) × 1.15 × 1.3 = 3,000 × 1.495 = **4,485MB**.\n\n> [!주의]\n> 백서 표 4-25의 예시(256MB + 64KB × 3,000 + 300MB에 1.15·1.3 적용)는 결과를 991.54MB로 적고 있으나, 64KB × 3,000 = 약 187.5MB로 계산하면 약 1,111MB가 나옵니다. 예시 결과값보다 산정식 자체를 기억하세요.\n\n### 4.7 Container와 GPU\n\n- 컨테이너는 앱과 런타임을 패키징해 **모든 OS 플랫폼에 배포**, 개발·테스트·배포 단순화와 자동화에 유리합니다. 멀티 티어(앱 서버, DB, MQ)를 별도 이미지로 병렬 실행하고 라이브러리 버전 충돌 없이 같은 서버에서 실행할 수 있습니다. Kubernetes는 수평 확장, 중단을 최소화하는 블루-그린 배포, 부하 분산, 공유 저장소 관리를 제공합니다.\n- GPU Server는 **Pass-through**로 물리 서버 수준 성능, OS는 RHEL·Ubuntu, 1/2/4/8개 GPU와 NVSwitch·NVLink. CPU:Memory는 V100 1:8, A100 1:15, H100 1:20. AI 모델 실험·예측·추론용.\n\n| 구분 | V100 | A100 | H100 SXM |\n|---|---|---|---|\n| 아키텍처 | Volta | Ampere | Hopper |\n| GPU Memory | 32GB | 80GB | 80GB |\n| Tensor(FP16) | 125 TFLOPs | 312 TFLOPs | 1,979 TFLOPs |\n| Memory BW | 900 GB/s | 2,000 GB/s | 3.35 TB/s HBM3 |\n| NVLink | 2(300 GB/s) | 3(600 GB/s) | 4(900 GB/s) |\n| 연계 스토리지 | Block Storage SSD | 동일 | 동일 |\n\n> [!주의]\n> 백서 04는 V100/A100/H100 GPU 타입을 제시하지만 Compute 교재(SCP Compute Service 슬라이드11)는 v2 GPU Server가 \"A100, H100, B300 제공\"이라고 적습니다. 백서 표 4-4의 GPU Server 타입도 A100, H100만 있습니다.\n\n## 5. 데이터 저장소 설계\n\n### 5.1 스토리지 선택\n\n고려 요소: 액세스 패턴(순차/랜덤), 액세스 빈도(Hot/Warm/Cold), 업데이트 빈도(높음: OS·DB 볼륨, 낮음: 파일), 액세스 가용성(단일 인스턴스/공유).\n\n| 구분 | Block Storage | File Storage | Object Storage | Archive Storage |\n|---|---|---|---|---|\n| 기능 | 고정 크기 블록, 서버 직접 할당 | 네트워크로 이기종 클라이언트에 파일 제공 | 인터넷상 객체 저장 | 대용량 장기 보관 |\n| 액세스 | VM 직접 연결/Multi-Attach | NFS/CIFS | REST API(S3 호환) | Object Storage와 연결 |\n| 접근제어 | - | Public IP/서버/VPC Endpoint | Public IP/서버/VPC Endpoint | Project 공용/개인 접근 설정 |\n| 암호화 | KMS 암호화 볼륨 선택 | AES256 기본 | AES256 선택 | AES256 선택 |\n| 데이터 보호 | VM 스냅샷 | 스냅샷 | 버전 관리 | - |\n| 디스크 | SSD | SSD/HDD | - | - |\n| 용량 | 기본 OS 16GB~12,288GB, 추가 볼륨 8GB~12,288GB, 23개 추가 | 제한 없음 | 제한 없음 | 제한 없음 |\n| 용도 | OS, DB 등 높은 처리량 | 웹 콘텐츠, 엔터테인먼트, 컨테이너 스토리지, 빅데이터 | 웹 콘텐츠, 로그 | 장기 보존 |\n\n### 5.2 데이터베이스 선택\n\n| 유형 | SCP 서비스 | 특징 |\n|---|---|---|\n| OLTP(관계형) | EPAS, MySQL, MariaDB, PostgreSQL, Microsoft SQL Server(관리형 Database) | 금융·전자상거래의 복잡한 트랜잭션, 집계·복잡 쿼리. **수직 확장**으로 처리량, **Replica로 읽기 수평 확장**. 최적화: 서버 타입, 스토리지 볼륨, 엔진, 스키마·인덱스·뷰 |\n| OLAP | **Vertica(DBaaS)** | 컬럼 기반 고성능 **MPP**. 한 열만 집계하면 전체 스캔 불필요. 리더 노드가 파티션 키로 하위 노드에 쿼리 배포·병렬 처리·집계 |\n| NoSQL | **CacheStore(Redis 기반 in-memory)** | 동적 스키마, 대용량, 낮은 지연, 기본 **수평 확장**. 단 **테이블·엔티티 조인 같은 복잡한 쿼리 미지원** → 이 경우 관계형. CacheStore는 DB 캐싱·앱 상태 저장 용도 |\n| 데이터 검색 | **Search Engine** | ElasticSearch 생성·설정 자동화, VM 배포, **클러스터·Replica**로 가용성·성능 향상 |\n\n### 5.3 DB 성능 개선과 캐싱\n\n- 성능은 일반적으로 사용자 요청에 대한 **응답 시간**으로 정의되며, 최소 자원으로 최대 성능을 내는 것이 최적입니다. 비즈니스 변화, 동시 사용자 증가, 데이터 증가로 성능은 저하됩니다.\n- 단계별 최적화: 분석(비즈니스 프로세스, 아키텍처) → 설계(물리적 설계, 애플리케이션 설계: 접근 경로·인덱스) → 개발(SQL, 개발표준) → 운영(OS·네트워크·DB·애플리케이션 튜닝).\n\n| 계층 | 대상 | 캐싱 구현 |\n|---|---|---|\n| 웹 | 웹 콘텐츠 | **Global CDN**으로 정적 콘텐츠(이미지·동영상·html)를 사용자 근처에서 전송 |\n| 애플리케이션 | 사용자 세션 | **CacheStore로 상태 관리**, 수평 확장 시 세션 손실·집중 방지 |\n| 데이터베이스 | 데이터 | **CacheStore를 DB 전방에** 배치, **Replica로 읽기 오프로드** |\n\n관계형 DB는 서버를 수평 확장해 자원을 늘릴 수 없고 수직 확장에 한계가 있어, 캐싱이 처리량 증대와 대기 시간 감소에 효과적입니다.\n\n## 6. 네트워킹 설계\n\n- 성능 설계는 **최종 사용자 위치 식별과 Region 선정**에서 시작합니다. 고려 사항은 법적 규제(공공기관은 CSAP 인증 공공 클라우드 등)와 지연 시간(가까운 데이터센터, 글로벌이면 국가별 분산 또는 Global CDN). 자세한 내용은 2-2a 강의.\n- 네트워크 요구 평가: 전송 요구·요청 빈도 파악, 단위 시간당 요청 수와 데이터 크기로 트래픽을 계산해 대역폭 확보(bps), 지연 최소화 전략(퍼블릭은 Global CDN, 프라이빗은 VPN·Direct Connect·Transit Gateway와 대역폭 선택), 처리량에 따라 단일/다중 VM, LB 분산, **GSLB로 여러 Region(IP)에 라우팅**.\n- 지연 단축: 사용자~웹앱 구간은 **네트워크 홉 수**에 따라 지연이 달라집니다. **Global CDN**은 분산 엣지 서버로 웹 서버·Object Storage의 정적 콘텐츠를 빠르고 안전하게 전송하고, 급증 시 원본 서버 부하를 분산합니다.\n\n## 7. 복합 서비스 설계 정리\n\n| 요구 | 설계 |\n|---|---|\n| 전국·글로벌 사용자 정적 콘텐츠 | Object Storage + Global CDN |\n| 반복 조회 상품 데이터 | DB 전방 CacheStore, Read Replica |\n| 조인이 많은 주문 처리 | 관계형 DBaaS(NoSQL 부적합) |\n| 대규모 분석 | Vertica(컬럼 기반 MPP) |\n| 상품 검색 | Search Engine(ElasticSearch) |\n| 고성능 OLTP + Active-Active | Bare Metal 2대 + Block Storage(BM) Multi-Attach |\n| 실시간·HPC·고I/O | Bare Metal Server |\n| AI 학습·추론 | GPU Server(Pass-through) |\n| 이벤트 급증 | Auto-Scaling(스케줄·지표), 세션 외부화(CacheStore), 사전 Quota 확인 |\n| MSA 성능 분석 | RED 지표 + Prometheus |\n\n> [!시험]\n> - USE는 **자원**(Utilization·Saturation·Errors), RED는 **서비스 요청**(Rate·Errors·Duration)입니다. 바꿔 놓은 보기는 오답입니다.\n> - 서버 사이징 지표로 Web/WAS는 **jOPS**, DB는 **tpmC**를 씁니다.\n> - 업무용도 보정 Web 0.7·WAS 2, 기본 OPS 보정 3, 기본 tpmC 보정 5, 목표 활용률 0.7, 여유율 1.3, 버퍼 캐시 1.15.\n> - 참조법 1-tier → 3-tier 분리는 **0.5**, 물리 → 클라우드 가상은 **1.2**. 3.0은 반대로 합칠 때 값입니다.\n> - NoSQL은 조인 같은 복잡한 쿼리를 지원하지 않습니다.\n\n출처: WA백서 04 p.1~39, SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드11\n"}, "2-2a": {"title": "SCP 데이터센터 인프라 (리전, 위치)", "md": "## 개념\n\n- **리전(Region)**: SCP 자원이 배포되는 지리적 데이터센터 위치입니다. 교재와 백서에 등장하는 SCP v2 리전 명칭은 **kr-west1**과 **kr-east1**입니다(Terraform 배포 예, DR 아키텍처의 주 센터·DR 센터, Resource Explorer 화면).\n- **가용영역(AZ)**: 리전 안의 독립된 물리 인프라입니다. 한 AZ의 장애가 다른 AZ에 영향을 주지 않도록 설계됩니다(자세한 내용은 2-2b).\n- 리전 간 거리와 네트워크 홉 수가 지연 시간을 좌우하고, 리전 위치가 데이터 저장 위치를 결정하므로 법적 규제와도 연결됩니다.\n\n> [!주의]\n> v2 리전·AZ 현황은 백서마다 표기가 다릅니다.\n> - WA백서 01 p.29: 2025년 7월 기준 v1은 Multi-AZ 제공, v2는 Single-AZ Region(**KR-WEST1, KR-EAST1**)만 제공, v2에도 Multi-AZ 제공 예정\n> - WA백서 03 p.25: 2025년 7월 기준 v1은 Multi-AZ와 복수 Region 제공, v2는 Single-AZ Region(**KR-WEST1**)만 제공, Region이 2개 이상이어야 구현 가능한 DR 서비스는 Region 추가 시 구현 가능\n> - Region 간 VPC Peering, Object Storage Replication, DBaaS Replica, Container Registry DR은 \"향후 출시 예정('26년)\"으로 표기\n\n## 리전 선정 기준\n\n성능 효율성 설계는 **최종 사용자 위치를 식별하고 정보시스템을 구축할 Region을 선정**하는 것에서 시작합니다. 사용자와 데이터센터 간 지리적 거리가 요청 지연에 밀접한 영향을 주기 때문입니다.\n\n| 고려 사항 | 내용 |\n|---|---|\n| 법적 규제 | 최종 사용자의 개인정보·중요 정보가 저장되는 **지리적 위치에 대한 법적 규제**를 반드시 고려. 예: 공공기관은 **CSAP 인증을 받은 공공 클라우드**를 사용해야 할 수 있음 |\n| 지연 시간 | 사용자가 자주 쓰는 서비스를 파악하고 **지리적으로 가까운 데이터센터**에 구축. 글로벌 서비스는 국가별 분산 배포 또는 **Global CDN**으로 지연 최소화를 검토 |\n| 대역폭·트래픽 | 단위 시간당 요청 횟수와 요청 데이터 크기로 트래픽을 계산하고 수용 대역폭 확보(bps 단위) |\n| 처리량 | 단일 VM/다중 VM, Load Balancer 분산, **GSLB로 여러 Region(IP 주소)에 라우팅** |\n| 가격 | 리전별 가격 차이를 고려해 인스턴스 타입 선택(Compute 비용 최적화 전략) |\n\n### 지연 시간과 홉\n\n- 출발지부터 목적지까지 패킷이 경유하는 라우터를 **홉(hop)** 이라 하며 **홉 수가 많을수록 지연이 증가**합니다. 지리적 거리가 멀수록 지연이 커지는 이유입니다.\n- 지연은 회선 대역폭만으로 정해지지 않습니다. 중계 장비, 경계 보호 장비, 서버 팜 내부, 타 서버 연계에서도 발생합니다.\n- 가장 기본적인 단축 방법은 클라이언트와 가까운 Region 배치와 CDN 엣지 응답입니다.\n\n## 리전 단위로 동작하는 서비스·한도\n\n| 서비스 | 리전 관련 동작 |\n|---|---|\n| Virtual Server Image | **동일 리전 내 다른 Account로** Image 공유(v2 변경 사항) |\n| Custom Image 원본 | Object Storage 버킷은 생성할 서버와 **동일한 존(Zone)** 에 있어야 함 |\n| KMS | **Region당 KMS Key 생성 개수 10,000**, 공공 인증 알고리즘 키는 Account당 할당 |\n| Secret Vault | 리전 기반 서비스, Secret 생성 시 다른 리전의 인증키 선택 불가 |\n| Secrets Manager | 리전 서비스, 생성된 Secret은 **해당 리전 안에서만** 사용 |\n| Certificate Manager | Region당 사용자·자체 인증서 각 100개 |\n| Private DNS | **Account당 1개** 생성, Account 내 모든 위치에서 공통 사용. A 리전에서 생성·VPC 연결 후, **다른 리전에서 \"활성화\"** 하고 그 리전의 VPC를 연결. VPC는 최대 5개 등록 |\n| Quota Service | **리전 수준 Quota와 Account 수준 Quota**를 구분 제공 |\n| Resource Explorer | 자원명·서비스명·유형으로 **단일 쿼리로 여러 리전과 계정**에 걸쳐 검색, 자원명·리전·태그로 필터 |\n| Logging & Audit Trail | Trail 신청 시 **수집할 리전 지정** |\n| Cloud Control | 랜딩 존 자동 구축, 중앙 거버넌스, **멀티 리전** 및 확장성 |\n\n## 리전 간·리전-거점 연결\n\n| 서비스 | 리전 관련 역할 |\n|---|---|\n| Cloud WAN | SCP **글로벌 리전과 고객 거점** 간 가상 백본. SCP Compute 자원은 Transit Gateway로, 고객 회선은 Site Connect로 연결. 서비스 유형 **글로벌은 국내와 해외 리전 간 연결** 용도(LiteG, PremiumPlusG), 약정 무약정/3년/5년/7년, 다중 경로(Gold/Silver) |\n| Transit Gateway + Cloud WAN | 고객이 선택한 거점에서 SCP 리전 간 빠르고 안전한 네트워크, 사용량만큼 과금 |\n| Cloud Last Mile | 고객 사업장과 SCP 리전 간 네트워크 연결 |\n| Cloud Virtual Circuit | SCP 글로벌 리전과 고객 거점 간 1:1 통신 |\n| DNS + GSLB | 특정 지역 트래픽 증가 시 DNS 기반으로 인접 지역에 자동 분산 |\n| Global CDN | 글로벌 엣지 서버로 정적 콘텐츠 캐싱·전달, 압축으로 트래픽 감소 |\n| VPC Peering(리전 간) | DR 아키텍처에서 주 센터 kr-west1과 DR 센터 kr-east1 연동(향후 출시 예정 표기) |\n\n## 리전·AZ와 비용\n\n- 동일 리전·동일 AZ 트래픽은 **무료**, 서로 다른 AZ 간 트래픽은 **비용 발생**, **리전 간 통신은 더 비쌉니다**.\n- 고가용성이 꼭 필요하지 않으면 **단일 AZ**로 비용을 줄입니다.\n\n## 리전과 DR\n\n- WA백서 03의 DR 아키텍처는 **kr-west1 = 주 센터, kr-east1 = DR 센터**로 구성합니다.\n- Region 재해 대비 수단: Virtual Server DR, Backup DR, Object Storage DR(버킷 단위 비동기 복제), File Storage DR(DR Region·Volume명·복제 주기), Database DR(타 Region Replica, VPC Peering 필요), Container Registry DR. 세부는 2-1c 강의.\n- Multi-AZ는 AZ 장애 대비이고, **Region 재해는 별도 DR 복제**로 대비합니다.\n\n> [!시험]\n> - 리전 선정의 첫 고려는 **법적 규제(데이터 저장 위치)** 와 **지연 시간**입니다. 지연은 대역폭만이 아니라 **홉 수**에 비례해 늘어납니다.\n> - Resource Explorer는 **여러 리전·계정을 단일 쿼리**로 검색합니다. \"리전별로만 검색\"은 오답입니다.\n> - Private DNS는 Account당 1개, 다른 리전에서 활성화 후 VPC 연결.\n> - 트래픽 비용: 같은 AZ 무료 < AZ 간 < 리전 간.\n> - Image 공유는 **동일 리전** 내 Account 간입니다.\n\n출처: WA백서 04 p.6, p.37~38, WA백서 01 p.29, WA백서 03 p.18~25, WA백서 05 p.13, SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드13·19·20, DNS 슬라이드8~10, Cloud WAN 슬라이드5~8, SCP_v2_Explore_Compute_11-19 SCP Compute Service 슬라이드11·14, Virtual Server 슬라이드21, SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드5, ExploreManagement_6_Quota_Service, ExploreManagement_8_Resource_Management 슬라이드7, ExploreManagement_2_Logging_Monitoring 슬라이드14, ExploreManagement_3_Cloud_Control, SEC3_Certificate_Manager_Config_Inspection_정리\n"}, "2-2b": {"title": "Multi-AZ 개념 및 서비스별 구성", "md": "## 개념\n\n- **AZ(가용영역)** 는 독립된 물리적 인프라로 구성되어 **다른 AZ의 장애에 영향을 받지 않도록** 설계됩니다. 장애가 나도 해당 AZ에만 영향이 있습니다.\n- **Multi-AZ 배포**의 목적은 특정 AZ 장애에도 서비스가 중단되지 않게 하고, **물리적 인프라 수준의 단일 장애 지점(SPOF)** 을 피하는 것입니다.\n- 장애 유형별 구현 방안에서 \"클라우드 데이터센터 장애 또는 재해\"의 구현 방안은 **Multi-AZ 기반 중복 구성**입니다.\n\n| 장애 범위 | 대응 수단 |\n|---|---|\n| 물리 호스트·랙 | Server Group **Anti-Affinity**(다른 랙·호스트에 분산) |\n| 단일 VM | LB + 중복 배치, Auto-Scaling(최소 2) |\n| AZ | **Multi-AZ** |\n| Region | **Region 간 DR 복제**(Virtual Server DR, DB Replica, File/Object Storage DR 등) |\n\n> [!주의]\n> Multi-AZ는 AZ 장애 대비입니다. Region 전체 재해까지 대비하려면 DR 복제를 별도로 구현해야 합니다(백서 03 그림 3-9도 \"Multi-AZ로 AZ 장애 대비\"와 \"DR 복제로 Region 재해 대비\"를 구분). 또한 백서는 v2를 Single-AZ Region으로 소개하며 v2 Multi-AZ, Object Storage Multi-AZ를 '향후 제공·출시 예정'으로 표기합니다(백서 01 p.29, 03 p.15).\n\n## 설계 원칙(WA백서 01 4.1)\n\n1. Virtual Server는 **Load Balancer와 함께 중복 배치**하고, 가능하면 Auto-Scaling으로 자동 중복 구성\n2. 서버 그룹 **Anti-Affinity**로 호스트 장애에 의한 중단 방지\n3. **Multi-AZ에 자원을 배포**해 Single-AZ 장애에 대응\n4. Database 서비스의 **고가용성(HA)과 복제(Replica)** 로 DB 중복\n\nNetworking 교재의 고가용성 전략(SPOF 제거)도 같은 방향입니다.\n\n| 전략 | 내용 |\n|---|---|\n| Multi-AZ 구성 | 네트워크 리소스와 컴퓨팅 자원을 Multi-AZ로 분산 배치 |\n| Load Balancer 활용 | 트래픽 분산, 과부하·장애 시 자동 우회 |\n| VPN·Direct Connect 이중화 | VPN 터널 이중화, Direct Connect 회선/경로 이중화, VPN + Direct Connect 혼합 이중화 |\n\n## Multi-AZ Kubernetes Cluster(그림 1-13)\n\nFile Storage와 Kubernetes Engine으로 AZa, AZb에 걸친 클러스터를 구성합니다.\n\n1. **File Storage를 Multi-AZ로 구성**하면 원본과 복제본이 **각각의 AZ**에 생성되고 원본·복제본 간 데이터가 **실시간 동기화**됩니다.\n2. Kubernetes Engine을 구성하고 **각 AZ에 별도의 노드풀**을 생성합니다.\n3. 평상시에는 **전체 노드와 Pod가 AZa의 Active Storage**를 사용합니다(Active-Standby 형태).\n4. AZa에 재해가 발생하면 AZa의 Pod가 **AZb 노드로 이동(Eviction)** 되고, 스토리지 액세스 경로도 **AZb Standby Storage로 전환**됩니다.\n\nKubernetes Engine 구성 순서(Container 교재): 인프라 준비 → **가용성 수준 계획(클러스터 노드 배포 전략: 단일 AZ vs 멀티 AZ 결정)** → 네트워크(위치 선택, VPC, Subnet) → Storage(File Storage, Persistent Volume용) → **Control Plane 생성**(VPC·Subnet·File Storage 선택) → **Worker Node 추가(노드 배포 전략을 따라 단일 AZ 또는 멀티 AZ 분산)**, CPU/GPU·OS 선택 → Namespace, Ingress 등.\n\n## 서비스별 고가용성·분산 구성\n\n| 서비스 | 구성 방법 |\n|---|---|\n| Virtual Server | LB와 중복 배치, Auto-Scaling, **Server Group**: Affinity(같은 랙·호스트 근접, 통신 지연 최소화) / **Anti-Affinity**(다른 랙·호스트 분산, 물리 호스트 장애 대비) |\n| Virtual Server Auto-Scaling | 최소 인스턴스 2 → 장애 VM 제외 시 자동 생성. 99.99% 아키텍처에서는 Multi-AZ에 Web·App Auto-Scaling |\n| PostgreSQL(DBaaS) 등 Database | **Redundancy** 활성화 시 **Active/Standby** 자동 구성, **Multi-AZ** 구성, Read Replication, VPC Peering 사전 구성 시 Cross Region DR Replication |\n| CacheStore(DBaaS) | **Sentinel 이중화**, Replica **1개 또는 2개**, Master 장애 시 Replica **자동 승격**, Replica 2개면 각 서버에 Sentinel 자동 분산, Multi-AZ |\n| Search Engine | **클러스터 및 Replica** 구성으로 가용성·성능 향상 |\n| Kubernetes Engine | AZ별 노드풀, 노드풀 자동 확장, 노드 자동 복구(약 10분 NotReady) |\n| File Storage | Multi-AZ 시 AZ별 원본·복제본 실시간 동기화 |\n| Object Storage | Multi-AZ 배포로 한 AZ 장애 대비(백업 사본 보호, '26년 출시 예정 표기) |\n| Load Balancer | Health Check(기본 5초 주기, 5초 대기, 3회 → 30초)로 장애 서버 제외 |\n\n## 가용성 목표와 Multi-AZ\n\n| 목표 | 구성 |\n|---|---|\n| 99% | 모든 계층 단일 + 백업 |\n| 99.9% | 계층별 이중화, LB, DB HA(Active-Standby) |\n| 99.99% | **VPC와 각 서비스를 Multi-AZ**, 지표 기반 Auto-Scaling, DB Replica |\n\n## 백업 사본의 Multi-AZ\n\n백서 03 설계 원칙: **Archive Storage, Multi-AZ, DR 구성**으로 단일 지점·사이트의 장애나 재해에 의한 백업 사본 손실을 방지합니다. 백업 버킷 → Archive Storage 아카이빙, Object Storage Multi-AZ 배포(AZ 장애 대비), DR 복제(Region 재해 대비), 접근 제어, 버킷 암호화.\n\n## 비용 관점\n\n- 서로 다른 AZ 간 트래픽은 비용이 발생하므로, **고가용성이 꼭 필요하지 않은 워크로드는 단일 AZ**로 비용을 줄입니다.\n\n> [!시험]\n> - Multi-AZ File Storage: 원본·복제본이 **각각 다른 AZ**, **실시간 동기화**. \"같은 AZ 다른 랙\", \"매일 1회 비동기\"는 오답입니다.\n> - 노드풀은 **AZ별로 따로** 만듭니다. 평상시 Active Storage는 AZa 하나(Active-Active 아님).\n> - Kubernetes Engine은 **노드 배포 전략(단일/멀티 AZ)을 먼저 계획**하고 Control Plane → Worker Node 순입니다.\n> - Anti-Affinity가 분산 배치(가용성), Affinity는 근접 배치(성능)입니다.\n> - Multi-AZ만으로 Region 재해는 대비되지 않습니다.\n\n출처: WA백서 01 p.2, p.29~33, p.35~40, WA백서 03 p.15, SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드18·19, CloudNative1_Container_Services 슬라이드24, DB1_Database_정리 3·4장, WA백서 04 p.35, SCP_v2_Explore_Compute_11-19 Virtual Server 슬라이드11\n"}, "2-2c": {"title": "Private Cloud / Dedicated Cloud", "md": "## 배경: 클라우드 배포 모델\n\nCompute 교재(IaaS와 Hybrid Cloud)는 다음과 같이 구분합니다.\n\n| 모델 | 정의 | 관리 주체 |\n|---|---|---|\n| On-premise | 서버에 직접 OS와 소프트웨어를 설치해 구성 | Application부터 Network까지 모두 기업 |\n| Public Cloud | **클라우드 사업자가 인프라를 소유·운영하며 여러 기업이 사용** | IaaS는 OS 이상 기업, 가상화·서버·스토리지·네트워크는 사업자 |\n| Private Cloud | **기업이 전용으로 직접 클라우드 환경을 구축해 사용** | 기업 |\n| Hybrid Cloud | Public Cloud와 On-premise(Private)의 결합 | 공동 |\n\n- 물리적 보안은 온프레미스·**프라이빗 클라우드에서는 사용자가 직접 관리**하고, 퍼블릭 클라우드에서는 CSP가 관리합니다(WA백서 02).\n- Dedicated Cloud는 일반적으로 특정 고객 전용으로 물리 자원(서버·랙 등)을 할당해 다른 고객과 공유하지 않는 모델을 뜻합니다(일반 개념).\n\n> [!주의]\n> 담당 교재(WA 백서, Explore 교재)에는 \"Private Cloud 오퍼링\"이나 \"Dedicated Cloud 오퍼링\"의 상품 사양·신청 절차가 별도 장으로 나오지 않습니다. 교재에 있는 근거는 ① Private Cloud의 SLA 정의(백서 01), ② On-Site 전용 Edge Cloud인 Edge Server, ③ 물리 자원을 단독 할당하는 Bare Metal Server, ④ 전용 자원·격리 설계 원칙입니다. 아래는 이 근거로 정리했습니다.\n\n## Private Cloud(교재 근거)\n\n- SCP SLA에 **Private Cloud** 항목
