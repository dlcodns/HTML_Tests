는 특정 가용영역 장애에 대비하는 구성입니다. Region 재해에 대비하려면 별도로 DR 복제를 구현해야 하며, 백서도 Multi-AZ와 Region 간 DR을 구분해 설명합니다.", "src": "WA백서 01 p.29~30; WA백서 03 p.15; SCP_v2_Explore_Network 슬라이드18", "id": "2-2b-02"}, {"item": "2-2b", "t": "Multi-AZ Kubernetes Cluster", "q": "SCP(Samsung Cloud Platform)의 File Storage와 Kubernetes Engine을 이용해 AZa, AZb에 걸친 Multi-AZ Kubernetes Cluster를 구성하려 합니다. 이 아키텍처에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["File Storage를 Multi-AZ로 구성하면 원본과 복제본이 같은 AZ 안의 서로 다른 랙에 생성된다.", "AZa에 재해가 발생하면 AZa에서 구동 중이던 Pod가 AZb 노드로 이동(Eviction)하고, 스토리지 접근 경로도 AZb의 Standby Storage로 전환된다.", "Kubernetes Engine은 하나의 노드풀을 두 AZ에 걸쳐 생성해야 하며, AZ별로 노드풀을 나눌 수 없다.", "평상시에는 각 AZ의 노드가 자기 AZ의 스토리지를 Active로 사용하는 Active-Active 구조로 동작한다.", "원본과 복제본은 매일 1회 비동기로 동기화되므로, AZ 장애 시 최대 1일의 데이터 손실을 감수해야 한다."], "a": 1, "e": "File Storage를 Multi-AZ로 구성하면 원본과 복제본이 각각의 AZ에 생성되어 실시간 동기화되고, 노드풀은 AZ별로 따로 생성합니다. 평상시에는 전체 노드와 Pod가 AZa의 Active Storage를 사용합니다.", "src": "WA백서 01 p.30", "id": "2-2b-03"}, {"item": "2-2b", "t": "서비스별 이중화 구성", "q": "SCP(Samsung Cloud Platform) 서비스별 고가용성 및 분산 배치 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["PostgreSQL(DBaaS)은 Redundancy를 활성화하면 Active/Standby 인스턴스가 자동으로 구성된다.", "CacheStore(DBaaS)는 Sentinel 이중화에서 Replica를 1개 또는 2개 선택하며, Master 장애 시 Replica가 자동 승격된다.", "Search Engine은 클러스터와 Replica를 구성해 가용성과 성능을 높일 수 있다.", "Kubernetes Engine은 Worker Node를 먼저 추가한 뒤 Control Plane을 생성하며, 노드 배포 전략(단일 AZ 또는 멀티 AZ)은 클러스터 생성이 끝난 후에 결정한다.", "Virtual Server는 Load Balancer와 함께 중복 배치하고, Server Group으로 랙과 호스트에 분산 배치할 수 있다."], "a": 3, "e": "Kubernetes Engine 구성에서는 가용성 수준 계획 단계에서 노드 배포 전략(단일 AZ 또는 멀티 AZ)을 먼저 정하고, Control Plane을 생성한 뒤 그 전략에 따라 Worker Node를 추가합니다. PostgreSQL은 Redundancy(Active/Standby), CacheStore는 Sentinel(Replica 1~2개) 방식으로 이중화합니다.", "src": "CloudNative1_Container_Services 슬라이드24; DB1_Database_정리 3·4장; WA백서 04 p.35; SCP_v2_Explore_Compute Virtual Server 슬라이드5", "id": "2-2b-04"}, {"item": "2-2c", "t": "Public/Private/Hybrid", "q": "클라우드 배포 모델과 하이브리드 클라우드 설계에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Public Cloud는 클라우드 사업자가 인프라를 소유하고 운영하며 여러 기업이 함께 사용하는 모델이다.", "Private Cloud는 기업이 전용으로 직접 클라우드 환경을 구축해 사용하는 모델이다.", "퍼블릭 클라우드에서는 물리적 보안을 클라우드 서비스 제공자가 관리하지만, 온프레미스나 프라이빗 클라우드에서는 사용자가 직접 관리한다.", "하이브리드 클라우드에서는 필요에 따라 클라우드로 확장하는 버스팅(Bursting) 구조를 설계할 수 있다.", "하이브리드 클라우드에서는 온프레미스와 클라우드가 서로 다른 보안 정책을 독립적으로 운영하는 것이 바람직하다."], "a": 4, "e": "하이브리드 클라우드를 구성할 때는 온프레미스와 클라우드 전반에 걸쳐 일관된 보안 정책을 수립하고, 암호화·접근제어·규정 준수를 모두 충족하도록 설계해야 합니다.", "src": "SCP_v2_Explore_Compute SCP Compute Service 슬라이드7, 13; WA백서 02 p.2", "id": "2-2c-01"}, {"item": "2-2c", "t": "Edge Server(전용 On-Site 클라우드)", "q": "SCP(Samsung Cloud Platform)의 Hybrid Cloud Edge Server에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Edge Server는 무약정 시간 단위 과금도 제공하므로, 단기 PoC 용도로 짧게 쓰고 해지하기에 적합하다.", "데이터 보안, 규제, 성능, 지연 시간 등의 이슈로 클라우드 전환이 어려운 기업의 On-Site 환경에 Edge Cloud를 제공한다.", "Edge Manager는 SCP에 위치하고, Edge Client는 고객 사이트의 Edge Server에 위치해 KVM을 관리한다.", "Edge Server와 SCP 간 네트워크는 VPN 또는 전용회선으로 구성한다.", "SCP Console에서 Edge Server를 통합 관리하며, 사용자 환경에 따라 KVM, Container 등의 가상화 플랫폼을 제공한다."], "a": 0, "e": "Edge Server는 무약정 요금이 없고 3년 또는 5년 약정으로만 제공됩니다(과금 모델 Per 3/5years).", "src": "SCP_v2_Explore_Compute Hybrid Cloud Edge Server 슬라이드5~6; WA백서 06 p.2, p.5", "id": "2-2c-02"}, {"item": "2-2c", "t": "전용 물리 자원 요구", "q": "R사는 실시간 처리 시스템을 SCP(Samsung Cloud Platform)로 이전하면서 다음 요구사항을 충족하는 컴퓨팅 서비스를 찾고 있습니다. 가장 적합한 서비스는 무엇입니까?", "o": ["Virtual Server(Standard 타입)", "Bare Metal Server", "Cloud Functions", "Virtual Server Auto-Scaling", "Kubernetes Engine"], "a": 1, "e": "Bare Metal Server는 가상화 없이 물리적으로 분리된 컴퓨팅 자원을 단독으로 할당받는 고성능 서비스입니다. 실시간 시스템, HPC, 고I/O 워크로드에 적합하고 Multi-Attach로 Active-Active DB를 구성할 수 있습니다. Security Group을 제공하지 않으므로 Firewall로 구성해야 한다는 점도 함께 알아 두세요.", "src": "WA백서 04 p.3, p.15; SCP_v2_Explore_Compute SCP Compute Service 슬라이드11", "s": "- 가상화 오버헤드 없이 물리적으로 분리된 CPU와 메모리를 단독으로 할당받아야 한다.\n- 과도한 I/O를 사용하는 고성능 워크로드다.\n- Multi-Attach 볼륨을 이용해 Active-Active 고가용성 데이터베이스를 구성하려 한다.", "id": "2-2c-03"}, {"item": "2-2d", "t": "클라우드 보안 인증(CSAP 등)", "q": "클라우드 관련 정보보호 관리체계 인증에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["ISO 27017은 클라우드 서비스 제공자(CSP)의 클라우드 보안에 필요한 보안 통제와 구현 지침을 따르는 국제 인증 제도다.", "CSAP는 '클라우드 컴퓨팅 발전 및 이용자 보호에 관한 법률'에 따라 국가·공공기관에 안전성과 신뢰성이 검증된 클라우드 서비스를 공급하기 위한 제도다.", "CSAP는 클라우드를 이용하는 공공기관이 직접 취득해야 하는 인증이며, CSP 사업자는 인증 대상이 아니다.", "금융보안원 안전성평가는 IT자산과 데이터센터를 대상으로 하는 기본보호조치 및 안전성 평가 인증으로, CSP 사업자와 클라우드 사용자 모두가 대상이다.", "ISMS-P는 정보보호와 개인정보보호 조치가 인증기준에 적합함을 증명하는 제도로, CSP 사업자와 클라우드 사용자 모두가 대상이다."], "a": 2, "e": "CSAP의 인증 대상은 CSP 사업자입니다. 공공기관이 CSAP 인증을 받은 클라우드 서비스를 이용하는 구조입니다.", "src": "WA백서 02 p.2~3", "id": "2-2d-02"}, {"item": "2-2d", "t": "공공 클라우드 전송 보안", "q": "공공기관 G는 기관 내부망과 SCP(Samsung Cloud Platform) 공공 클라우드를 연동하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["보안업무규정상 비밀은 암호화되지 않은 상태로 정보통신 수단을 이용해 송수신할 수 없으므로, 공공 클라우드로의 데이터 전송은 반드시 암호화한다.", "기관 망과 클라우드를 VPN으로 연결해 전송 데이터가 IPSec 방식으로 암호화되도록 구현한다.", "IPS, WAF, DDoS Protection, Secured Firewall, Secured VPN 보안 서비스는 일반과 공공 환경 모두에서 제공된다.", "KMS의 공공 인증 알고리즘 옵션은 일반 SCP 환경에서도 동일하게 선택해 사용할 수 있다.", "공공기관과 금융권은 클라우드에 정보시스템을 구축할 때 별도의 클라우드 도입 가이드라인을 따라야 한다."], "a": 3, "e": "KMS 생성 시 공공 인증 알고리즘 옵션을 선택하면 SCP Sovereign에서만 사용할 수 있습니다.", "src": "WA백서 02 p.1, p.24; SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리; SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드10", "id": "2-2d-03"}, {"item": "2-2d", "t": "금융기관 복구 시간", "q": "금융감독원이 권고하는 금융기관별 완전 복구 가능 시간(복구 목표 시간)으로 옳지 않은 것은 무엇입니까?", "o": ["은행 및 증권: 3시간 이내", "보험(외국보험사 포함): 3시간 이내", "금융공동망 운영기관, 공인인증센터: 3시간 이내", "증권유관기관, 통합시스템 운영기관: 3시간 이내", "외국계 금융기관: 자율(복구시간 공개, 비상사태대응방안 제출)"], "a": 1, "e": "보험은 24시간 이내가 권고 기준입니다. 주요 금융기관(은행·증권, 금융공동망·공인인증센터, 증권유관기관 등)은 재해 발생 후 3시간 이내 완전 복구가 권고됩니다.", "src": "WA백서 03 p.8~9", "id": "2-2d-04"}, {"item": "2-3a", "t": "마이그레이션 계획 수립", "q": "온프레미스 정보시스템을 SCP(Samsung Cloud Platform)로 마이그레이션하는 계획을 수립할 때의 고려사항으로 옳지 않은 것은 무엇입니까?", "o": ["온프레미스와 SCP를 프라이빗으로 연결할 경우, 양쪽 사설 IP 대역이 중첩되지 않도록 VPC CIDR을 설계한다.", "자원을 배포하기 전에 Quota Service에서 서비스 제한을 확인하고, 조정이 가능하면 미리 증가를 요청한다.", "서버 사이징으로 클라우드 월 사용료를 산정하고, 이를 기반으로 온프레미스 대비 TCO를 도출한다.", "Lift & Shift 방식으로 전환할 때는 기존 온프레미스 보안 기능을 그대로 이식하면 클라우드 보안 요구사항이 충족된다.", "데이터 이동 시 대역폭과 전송 비용을 고려해, 데이터가 많은 곳에 애플리케이션을 최대한 가깝게 배치한다."], "a": 3, "e": "CSA는 Lift & Shift 마이그레이션에서 기존 보안 기능을 그대로 이식하고 공동책임모델을 제대로 이해하지 못해 생기는 보안 이슈를 주요 위협('부적절한 클라우드 보안 전략')으로 꼽습니다.", "src": "WA백서 02 p.4; WA백서 05 p.9~10; WA백서 04 p.16; WA백서 01 p.15; SCP_v2_Explore_Compute SCP Compute Service 슬라이드13", "id": "2-3a-02"}, {"item": "2-3a", "t": "마이그레이션 후 운영 모델", "q": "H사는 Lift & Shift 방식으로 일부 워크로드만 SCP(Samsung Cloud Platform)로 이전하고 나머지는 온프레미스에 유지할 계획입니다. H사의 클라우드 운영 모델에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["기존 IT 운영 조직에 클라우드 운영 업무를 통합하면 온프레미스와 클라우드의 정책·프로세스를 따로 운영해야 하므로 일관성 유지에 불리하다.", "클라우드 운영 조직을 별도로 추가하면 클라우드 전문성을 강화할 수 있지만, 역할 중복이나 커뮤니케이션 비용이 발생할 수 있다.", "기존 조직에 통합하는 방식은 조직 내 리소스를 효율적으로 활용할 수 있지만, 클라우드 전문성이 부족하면 운영 효율이 저하될 수 있다.", "향후 주요 시스템을 클라우드 기반 CI/CD 애플리케이션으로 재구축하면 클라우드 운영팀과 개발팀을 DevOps 원팀으로 통합하는 구조를 검토한다.", "보안 강화가 필요하면 보안·개발·운영을 하나의 팀으로 통합한 DevSecOps 형태를 고려할 수 있다."], "a": 0, "e": "기존 조직에 클라우드 운영 업무를 통합하는 방식은 두 환경을 하나의 통합 운영 모델로 관리합니다. 그래서 클라우드와 온프레미스 간 일관된 정책과 프로세스를 유지하는 데 유리합니다.", "src": "WA백서 05 p.6~8", "id": "2-3a-03"}, {"item": "2-3a", "t": "이관용 네트워크 연결 선택", "q": "I사는 온프레미스 데이터센터의 대규모 시스템을 SCP(Samsung Cloud Platform)로 이관하려 합니다. 다음 요구사항을 충족하는 서비스로 가장 적합한 것은 무엇입니까?", "o": ["VPN", "VPC Peering", "Direct Connect", "Global CDN", "GSLB"], "a": 2, "e": "Direct Connect는 고객 네트워크와 SCP를 안전하고 빠르게 연결합니다. 기존 내부 사설 대역을 SCP 자원에 할당해 쓸 수 있으며, SR로 회선을 신청하고 고객 라우터에 BGP가 필요합니다. VPN은 인터넷 위에 IPsec 암호화 터널을 구성합니다.", "src": "SCP_v2_Explore_Network VPN/Direct Connect/Transit Gateway 슬라이드5, 13", "s": "- 기존 시스템이 사용하던 내부 사설 네트워크 대역을 SCP 자원에 할당해 사용하고 싶다.\n- 인터넷을 경유하지 않는 안전하고 빠른 전용 연결이 필요하다.\n- 고객사 Uplink 회선 연결은 SR로 신청하며, 고객사 라우터에서 BGP 라우팅 프로토콜을 사용할 수 있다.", "id": "2-3a-04"}, {"item": "2-3b", "t": "이미지 기반 서버 이전", "q": "온프레미스 서버 이미지를 SCP(Samsung Cloud Platform) Virtual Server로 이전하기 위해 Custom Image를 생성하고 활용하는 방법에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Custom Image는 Object Storage에 이미지 파일을 업로드한 뒤, 해당 파일의 URL을 입력해 생성한다.", "이미지 파일을 업로드하는 Object Storage 버킷은 생성할 서버와 동일한 존(Zone)에 있어야 한다.", "Visibility를 Private으로 하면 Account 안에서만, Shared로 하면 Account 간에 공유해 사용할 수 있다.", "Protected를 사용으로 체크하면 해당 이미지를 삭제할 수 없다.", "Shared 이미지는 리전과 관계없이 다른 리전의 Account에도 바로 공유해 서버를 생성할 수 있다."], "a": 4, "e": "SCP v2의 Virtual Server Image는 동일 리전 내에서 다른 Account로 공유할 수 있습니다.", "src": "SCP_v2_Explore_Compute SCP Compute Service 슬라이드11; Virtual Server 슬라이드21", "id": "2-3b-02"}, {"item": "2-3b", "t": "애플리케이션 이관·전환", "q": "J사는 온프레미스 웹 애플리케이션을 SCP(Samsung Cloud Platform)로 이전한 뒤, 사용자 트래픽을 신규 환경으로 전환하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["운영 환경 이관은 개발자가 아닌 별도 담당자가 수행하고, 테스트 완료 여부·이관 전략·롤백 방안을 사전에 검토한다.", "인플레이스 방식으로 전환하면 기존 서버 집합에서 바로 업데이트하므로 가동 중지 시간이 없고, 실패 시 이전 버전으로 트래픽을 즉시 되돌릴 수 있다.", "신규 환경을 병렬로 구성한 뒤 GSLB 정책을 Ratio 알고리즘으로 설정하고 가중치를 조절해 점진적으로 트래픽을 전환한다.", "신규 환경에 문제가 생기면 트래픽을 다시 기존 환경으로 되돌려 롤백한다.", "애플리케이션과 런타임을 컨테이너로 패키징하면 플랫폼에 독립적으로 배포할 수 있어 배포 자동화가 쉬워진다."], "a": 1, "e": "인플레이스 배포는 한 번의 배포 작업으로 업데이트하므로 일정 수준의 가동 중지 시간이 생깁니다. 배포에 실패하면 재배포가 유일한 복원 방법입니다.", "src": "WA백서 05 p.3, p.18~19; WA백서 04 p.30", "id": "2-3b-03"}, {"item": "2-3b", "t": "이전 서버 사이징(참조법)", "q": "물리 서버 1대에서 Web/WAS/DB를 함께 운영하던 시스템을 SCP(Samsung Cloud Platform)로 이전하면서 Web, WAS, DB를 각각 별도의 Virtual Server로 분리하려 합니다. 참조법으로 CPU를 산정할 때 적용할 Tier 구성 보정치와 서버 형태 보정치의 조합으로 옳은 것은 무엇입니까?", "o": ["Tier 구성 보정 0.5, 서버 형태 보정 1.2", "Tier 구성 보정 0.7, 서버 형태 보정 1.2", "Tier 구성 보정 3.0, 서버 형태 보정 1.2", "Tier 구성 보정 0.5, 서버 형태 보정 1.0", "Tier 구성 보정 2.0, 서버 형태 보정 1.0"], "a": 0, "e": "(Web/WAS/DB) 1-tier를 (Web), (WAS), (DB) 3-tier로 분리하면 1→3 변경이므로 Tier 보정 0.5를 적용합니다. 물리 서버를 클라우드 가상 서버로 전환할 때는 가상화 오버헤드를 고려해 1.2를 적용합니다. 3.0은 반대로 3-tier를 1-tier로 합칠 때의 값입니다.", "src": "WA백서 04 p.26~28", "id": "2-3b-04"}, {"item": "2-3c", "t": "OCI Database Migration", "q": "SCP(Samsung Cloud Platform)에서 제공하는 Oracle 서비스 중 OCI Database Migration에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["온프레미스나 다른 클라우드의 DB를 OCI 환경으로 옮겨 주는 완전관리형(Fully-managed) 서비스로, GUI 콘솔 또는 API로 수행한다.", "Online 방식은 GoldenGate로 소스 DB의 변경 사항을 실시간 캡처(CDC)해 반영하므로 서비스 중단 없이 이관할 수 있다.", "Offline 방식은 Data Pump로 추출한 뒤 중간 저장소나 DB Link로 전송하고 Data Pump로 임포트하며, 일시 중단이 필요하다.", "Cloud Premigration Advisor Tool로 이관을 시작하기 전에 소스 DB 구조를 분석해 호환성 문제와 예상 오류를 탐지한다.", "주로 이종 DB 간 전환을 위한 서비스로, Oracle에서 PostgreSQL로 바꾸는 이종(Heterogeneous) 마이그레이션을 기본으로 지원한다."], "a": 4, "e": "OCI Database Migration은 Oracle → Oracle, MySQL → MySQL 같은 동종(Homogeneous) 마이그레이션을 지원하는 서비스입니다.", "src": "DB2_Oracle_Services_정리 1장", "id": "2-3c-01"}, {"item": "2-3c", "t": "DBaaS 이관", "q": "K사는 온프레미스의 PostgreSQL 데이터베이스와 Redis 캐시를 SCP(Samsung Cloud Platform)의 PostgreSQL(DBaaS)과 CacheStore(DBaaS)로 이관하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["PostgreSQL(DBaaS)의 Migration 기능으로 기존 DB의 데이터를 복제해 운영 중단을 최소화하며 이관한다.", "PostgreSQL(DBaaS)의 백업은 사전에 구성한 Object Storage에 저장되므로, 이관 전에 백업용 Object Storage를 준비한다.", "CacheStore(DBaaS)도 PostgreSQL과 같은 Migration 기능을 제공하므로, 기존 Redis 데이터를 동일한 방식으로 복제해 이관한다.", "데이터 저장 시 DBaaS가 지원하지 않는 특정 암호화 모듈을 적용해야 하는 규정이 있다면, DBaaS 대신 다른 구성을 검토해야 한다.", "이관 후 파라미터를 조정할 경우 운영 중에도 변경할 수 있지만, 재시작해야 반영된다."], "a": 2, "e": "CacheStore(DBaaS)는 Migration, DR Replication, Read Replication을 제공하지 않습니다. Migration 기능은 PostgreSQL(DBaaS) 쪽에서 제공됩니다.", "src": "DB1_Database_정리 3~5장; WA백서 04 p.3", "id": "2-3c-02"}, {"item": "2-3c", "t": "PDB 기반 이전·업그레이드 순서", "q": "Oracle의 CDB/PDB 멀티테넌트 구조를 활용해 무중단 또는 최소 중단으로 새 버전 환경으로 전환하려 합니다. 작업 순서로 옳은 것은 무엇입니까?", "o": ["ㄱ → ㄴ → ㄷ → ㄹ", "ㄴ → ㄷ → ㄱ → ㄹ", "ㄴ → ㄱ → ㄹ → ㄷ", "ㄴ → ㄱ → ㄷ → ㄹ", "ㄷ → ㄴ → ㄱ → ㄹ"], "a": 3, "e": "새 CDB를 생성하고 PDB Clone으로 먼저 검증한 뒤, 기존 CDB에서 Detach하고 새 CDB에 Attach합니다. PDB는 CDB의 Oracle 버전에 종속되므로 새 버전 CDB를 먼저 만들어야 합니다.", "src": "DB2_Oracle_Services_정리 2장", "s": "ㄱ. 기존 PDB를 Clone하여 새 CDB에 연결하고 테스트한다.\nㄴ. 새 버전의 CDB를 생성한다.\nㄷ. 문제가 없으면 기존 CDB에서 PDB를 Detach(분리)한다.\nㄹ. 새 CDB에 PDB를 Attach(연결)한다.", "fix": true, "id": "2-3c-03"}, {"item": "2-3d", "t": "Block Storage 볼륨 이전", "q": "SCP(Samsung Cloud Platform) Block Storage(VM)의 볼륨 이전 기능을 이용해 다른 Account로 데이터를 옮기려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["볼륨을 이전하려면 먼저 해당 볼륨과 서버의 연결을 해제해야 한다.", "볼륨 이전을 실행하면 볼륨이전 ID와 승인 Key가 발급되며, 이를 저장해 대상 Account에 전달해야 한다.", "대상 Account에서 '볼륨 이전 받기'가 완료되어야 기존 Account에서 볼륨이 제거된다.", "기존에 만든 스냅샷을 선택해 새 볼륨을 생성할 수 있으며, 스냅샷을 선택하지 않으면 빈 볼륨이 생성된다.", "볼륨 이전은 원본 볼륨을 기존 Account에 그대로 둔 채 대상 Account에 복사본을 생성하는 방식이다."], "a": 4, "e": "볼륨 이전은 복사가 아니라 소유를 옮기는 방식입니다. 이전이 완료되면 기존 위치에서 볼륨이 제거됩니다.", "src": "SCP_v2_Explore_Storage_20-24 BlockStorage VM 슬라이드5, 8, 12", "id": "2-3d-01"}, {"item": "2-3d", "t": "이관 대상 스토리지 선택", "q": "S사는 온프레미스 NAS의 공유 디렉터리를 SCP(Samsung Cloud Platform)로 이관하려 합니다. 이 디렉터리는 Linux 서버(NFS)와 Windows 서버(CIFS) 여러 대가 동시에 마운트해 데이터를 공유합니다. 이관 대상으로 가장 적합한 스토리지는 무엇입니까?", "o": ["Block Storage(SSD_MultiAttach)", "File Storage", "Object Storage", "Archive Storage", "Block Storage(SSD_Provisioned)"], "a": 1, "e": "File Storage는 네트워크로 연결된 여러 서버가 데이터를 공유하는 스토리지로, Linux는 NFS, Windows는 CIFS로 마운트합니다. MultiAttach 볼륨은 Windows 기반 Virtual Server에서 사용할 수 없습니다.", "src": "SCP_v2_Explore_Storage_20-24 File storage 슬라이드5~6; BlockStorage VM 슬라이드8", "id": "2-3d-02"}, {"item": "2-3d", "t": "스토리지 이관 특성", "q": "온프레미스 데이터를 SCP(Samsung Cloud Platform) 스토리지로 이관할 때 각 스토리지의 특성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Archive Storage는 온프레미스 서버에서 NFS로 직접 마운트해 대용량 데이터를 바로 업로드하는 방식으로 이관한다.", "Object Storage는 REST API(S3 호환) 방식으로 접근한다.", "Object Storage의 Private URL은 같은 Account 안에서 생성된 자원에서 접근할 수 있는 주소다.", "Archive Storage에 보관된 데이터를 사용하려면 Object Storage의 버킷과 폴더를 지정해 복구한다.", "Block Storage(VM)는 8GB부터 최대 12TB 이내에서 사용 중에 증설할 수 있다."], "a": 0, "e": "Archive Storage는 Object Storage의 데이터를 장기 보관하는 스토리지입니다. 정책으로 지정한 Object Storage 버킷의 데이터가 아카이빙되며, NFS로 마운트하는 방식이 아닙니다.", "src": "WA백서 04 p.32; SCP_v2_Explore_Storage_20-24 Object storage 슬라이드7, Archive storage 슬라이드5, 8, 11; BlockStorage VM 슬라이드5", "id": "2-3d-03"}, {"item": "3-2a", "t": "Virtual Server Server Group", "q": "SCP(Samsung Cloud Platform) Virtual Server의 Server Group 정책에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server는 VPC > Subnet > Server Group > Virtual Server 구조로 구성된다.", "Affinity 정책은 하나의 Server Group에 속한 서버들을 가급적 같은 랙 및 호스트 내에 근접하게 배치한다.", "Affinity 정책은 하나의 물리 호스트 장애가 전체 서비스 장애로 이어지는 것을 방지하여 가용성을 확보하는 데 목적이 있다.", "Anti-Affinity 정책은 하나의 Server Group에 속한 서버들을 가급적 다른 랙 및 호스트에 분산 배치한다.", "Server Group은 Virtual Server 생성 시 선택하므로, 서버를 생성하기 전에 미리 만들어 두어야 한다."], "a": 2, "e": "물리 호스트 장애에 대비한 가용성 확보는 Anti-Affinity(분산 배치)의 목적입니다. Affinity(근접 배치)는 통신 지연을 최소화해 고성능을 확보하는 정책입니다.", "src": "SCP_v2_Explore_Compute_11-19.md Virtual Server 슬라이드6, 11, 14", "id": "3-2a-03"}, {"item": "3-2a", "t": "Virtual Server Image", "q": "Virtual Server Image의 생성과 공유에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server가 Active 상태에서도 Image를 생성할 수 있으나, 이 경우 무결성은 보장되지 않는다.", "Virtual Server에서 생성한 Image는 Visibility가 Private이므로 그대로는 다른 Account와 공유할 수 없다.", "Object Storage에 업로드한 이미지 파일의 URL로 Image를 생성하는 경우 qcow2 형식만 사용할 수 있다.", "Image 생성 시 Protected를 설정하면 해당 Image는 삭제할 수 없다.", "다른 Account와 공유하기 위해 생성한 공유용 Image에는 OS 디스크와 추가 연결된 Block Storage가 모두 포함된다."], "a": 4, "e": "공유용 Image는 OS 디스크만 포함합니다. 공유 시 받을 쪽 Account ID는 Cost Management > Account 메뉴에서 확인해 입력합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Virtual Server 슬라이드19~21", "id": "3-2a-04"}, {"item": "3-2a", "t": "Virtual Server IP 변경", "q": "A 고객사는 Load Balancer 서버 그룹의 멤버로 등록되어 있고 Public NAT IP를 사용 중인 Virtual Server의 Private IP를 변경하려고 합니다. IP 변경에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["IP를 변경하면 기존 IP로는 더 이상 통신할 수 없다.", "IP 변경은 온라인으로 즉시 적용되므로 서버 재부팅 없이 서비스를 유지할 수 있다.", "LB 서버 그룹에서 기존 IP를 삭제하고, 변경된 IP를 멤버로 직접 다시 추가해야 한다.", "Public NAT IP 사용을 먼저 해제한 후 IP를 변경하고, 이후 NAT IP를 다시 설정해야 한다.", "Virtual Server의 IP는 생성 시 자동으로 할당받거나 Subnet 대역 내에서 직접 지정할 수 있다."], "a": 1, "e": "변경된 IP를 적용하기 위해 서버가 재부팅됩니다. LB 멤버 IP는 자동 갱신되지 않으므로 직접 교체해야 하고, NAT IP는 해제-변경-재설정 순서로 진행합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Virtual Server 슬라이드17", "id": "3-2a-05"}, {"item": "3-2b", "t": "Bare Metal 전용 VPC Firewall", "q": "SCP(Samsung Cloud Platform)의 Bare Metal Server는 Security Group을 제공하지 않으므로, Bare Metal Server와 Virtual Server 간 트래픽 제어를 위해 전용 VPC Firewall 구성을 권고합니다. 다음 구성 작업을 올바른 순서로 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄱ → ㄹ → ㅁ → ㄷ", "ㄹ → ㄴ → ㅁ → ㄱ → ㄷ", "ㄴ → ㄹ → ㄱ → ㄷ → ㅁ", "ㄴ → ㄹ → ㅁ → ㄱ → ㄷ", "ㄹ → ㅁ → ㄴ → ㄱ → ㄷ"], "a": 3, "e": "전용 VPC 생성 → Transit Gateway 생성 → TGW와 Virtual Server VPC 연결 → 전용 VPC Firewall 생성 및 TGW 연결(SR) → 규칙 추가 순서입니다. Firewall은 TGW와 VPC 연결이 갖춰진 뒤에 SR로 생성·연결합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Baremetal 슬라이드6", "s": "ㄱ. 전용 VPC Firewall 생성 및 Transit Gateway 연결(SR 기반)\nㄴ. Bare Metal Server 전용 VPC 생성\nㄷ. 규칙 추가 후 전용 VPC Firewall을 통한 트래픽 제어\nㄹ. Transit Gateway 생성\nㅁ. Transit Gateway ↔ Virtual Server VPC 연결 추가", "fix": true, "id": "3-2b-02"}, {"item": "3-2b", "t": "Bare Metal 서버 타입", "q": "SCP(Samsung Cloud Platform) Bare Metal Server의 서버 타입과 생성 사양에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["High Capacity 타입은 최대 128개의 vCPU(물리 64코어)와 최대 1,536GB의 메모리를 지원한다.", "Standard 타입은 16개의 vCPU(물리 8코어)와 최대 256GB의 메모리를 지원한다.", "Standard 타입은 OS 구성용으로 RAID1 구성의 480GB Internal Disk를 제공한다.", "High Capacity 타입은 OS 구성용으로 RAID1 구성의 최대 1.92TB Internal Disk를 제공한다.", "Bare Metal Server는 한 번에 1~5대까지 동시에 생성할 수 있다."], "a": 0, "e": "Bare Metal Server High Capacity는 최대 2,048GB 메모리를 지원합니다. 1,536GB는 Virtual Server High Capacity의 최대 메모리이므로 혼동하지 않도록 합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Baremetal 슬라이드7, 9", "id": "3-2b-03"}, {"item": "3-2b", "t": "Bare Metal 운영 주의사항", "q": "Bare Metal Server의 생성과 운영 시 주의사항으로 옳지 않은 것은 무엇입니까?", "o": ["콘솔의 중지는 서버 전원을 Off 하는 동작이므로, 애플리케이션 중지와 OS shutdown을 먼저 수행한 후 중지하는 것이 권장된다.", "서버 생성 후 로컬 Subnet을 추가하는 경우, 사용자가 서버에 접속해 네트워크 구성 작업을 직접 수행해야 한다.", "Local Disk Partition은 루트 파티션을 포함해 최대 10개까지 만들 수 있고, 파티션 유형은 Flat 또는 LVM 중 선택한다.", "Cloud Monitoring은 Agent 방식으로 제공되며, Agent는 사용자가 직접 설치해야 한다.", "서버의 IP를 변경하면 연결된 NAT IP도 새 IP에 맞추어 자동으로 변경된다."], "a": 4, "e": "Bare Metal Server는 IP를 변경해도 NAT IP는 변경되지 않습니다. IP 변경 방법은 변경할 IP의 Subnet에 따라 다르므로 Documentation을 확인해야 합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Baremetal 슬라이드5, 11, 13", "id": "3-2b-04"}, {"item": "3-2c", "t": "Launch Configuration", "q": "SCP(Samsung Cloud Platform) Virtual Server Auto-Scaling의 Launch Configuration에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Auto-Scaling Group에서 Virtual Server를 생성할 때 사용하는 Configuration 템플릿이다.", "VPC, Subnet, Security Group은 Launch Configuration에서 지정하므로 Auto-Scaling Group에서는 네트워크를 설정하지 않는다.", "Block Storage는 SSD / SSD_KMS / SSD_Provisioned 중 선택하며, SSD_Provisioned 선택 시 Max IOPS와 Max Throughput을 설정할 수 있다.", "필요 시 기존에 생성한 File Storage 볼륨을 최대 5개까지 연결할 수 있다.", "Init Script로 Windows는 배치 스크립트, Linux는 쉘 스크립트 또는 Cloud-init을 입력할 수 있다."], "a": 1, "e": "Launch Configuration은 이미지, 서버 타입, Block Storage, Keypair, File Storage, Init Script 등을 정의합니다. VPC·Subnet·Security Group과 Min/Desired/Max 수량은 Auto-Scaling Group에서 설정합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드5, 7~9, 11", "id": "3-2c-02"}, {"item": "3-2c", "t": "ASG Load Balancer 연동", "q": "Auto-Scaling Group 생성과 Load Balancer 연동에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Load Balancer 연동을 설정하면 Auto-Scaling Group의 서버가 LB 서버 그룹의 Member로 등록된다.", "연동할 LB 서버 그룹은 Auto-Scaling Group에 설정한 VPC에 생성되어 있는 것 중에서 선택한다.", "Auto-Scaling Group당 연동할 수 있는 LB 서버 그룹 및 포트 개수는 최대 3개이다.", "Weighted 부하 분산을 사용하는 LB 서버 그룹도 연동할 수 있으며, 서버별 가중치는 Auto-Scaling Group의 정책에서 지정한다.", "Desired 서버 수는 Auto-Scaling Group 생성 시 최초로 생성되는 목표 서버 수이다."], "a": 3, "e": "Weighted 부하 분산을 사용하는 LB 서버 그룹은 Auto-Scaling Group에서 선택할 수 없습니다. 부하 분산값은 LB 서버 그룹 쪽에서 수정합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드5, 10, 12", "id": "3-2c-03"}, {"item": "3-2c", "t": "ASG 상태 체크", "q": "Auto-Scaling Group의 상태 체크 기능에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["상태 체크는 Load Balancer의 헬스 상태만 확인하며, Virtual Server 자체 상태는 확인하지 않는다.", "Unhealthy로 판정된 서버는 알림만 발송되며, 서버 교체는 운영자가 수동으로 수행해야 한다.", "사용자가 Stop으로 변경한 서버는 Unhealthy 상태로 판단하지 않는다.", "유예기간은 Unhealthy 서버를 해지하기 전에 세션 정리를 위해 대기하는 시간이다.", "유예기간에 0을 입력하면 기본값인 300초가 자동으로 적용된다."], "a": 2, "e": "상태 체크는 Virtual Server와 Load Balancer 상태를 함께 확인해 Unhealthy 서버를 자동 교체하며, 사용자가 Stop한 서버는 Unhealthy로 보지 않습니다. 유예기간은 새로 추가된 서버가 정상 동작할 때까지 상태 체크를 미루는 시간이며, 0을 입력하면 유예기간을 쓰지 않습니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드13", "id": "3-2c-04"}, {"item": "3-2d", "t": "ASG 정책 조건", "q": "Auto-Scaling Group 정책의 실행 조건 설정 항목에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Period는 정책에 의해 서버가 시작 또는 해지된 후, 다음 정책을 실행하기 전까지 대기하는 시간이다.", "Statistic은 Metric Type을 계산하는 방법으로, Auto-Scaling Group 내 서버들의 Average / Min / Max 값 중 선택한다.", "Operator는 >=, >, <=, < 중에서 선택한다.", "Threshold는 Metric Type에 대한 임계치이다.", "실행 단위는 실행 조건에 부합할 때 서버 수를 어떤 방식으로 증감할지 정하는 항목이다."], "a": 0, "e": "Period는 N분 동안 실행 조건을 계속 만족해야 정책을 실행하도록 하는 값입니다. 서버 시작·해지 시 대기하는 시간은 쿨다운입니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드14", "id": "3-2d-01"}, {"item": "3-2d", "t": "ASG 스케줄 설정", "q": "B 고객사는 매월 말일에 정산 배치 작업이 집중되어, 매달 마지막 날에만 Auto-Scaling Group의 서버 수를 늘리는 스케줄을 등록하려고 합니다. 스케줄 설정에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["스케줄 수행 시간은 10분 단위로 설정할 수 있다.", "스케줄에서 지정하는 Min / Desired / Max 값은 0~100 범위에서 입력한다.", "시작일은 과거 날짜로도 지정할 수 있어 지난달부터 소급 적용할 수 있다.", "종료일은 반드시 지정해야 하며, 영구적으로 설정할 수는 없다.", "주기를 '매달'로 선택하고 Date에 -1을 입력하면 매달 말일에 스케줄이 수행된다."], "a": 4, "e": "매달 주기에서 Date가 0보다 크면 해당 날짜, 0보다 작으면 말일부터 역산하므로 -1은 말일입니다. 수행 시간은 30분 단위, 서버 수는 0~50, 종료일은 영구 설정이 가능하고 오늘 이전 날짜는 설정할 수 없습니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드15", "id": "3-2d-02"}, {"item": "3-2d", "t": "ASG 정책 계산", "q": "서버 3대로 구성된 Auto-Scaling Group에서 최근 5분 동안 각 서버의 CPU 사용률이 서버A 85%, 서버B 60%, 서버C 55%로 일정하게 유지되었습니다. Metric Type은 CPU 사용량, Period는 5분으로 동일할 때, Scale Out 정책이 실행되는 설정은 다음 중 무엇입니까?", "o": ["Statistic: Average, Operator: >=, Threshold: 70", "Statistic: Min, Operator: >, Threshold: 60", "Statistic: Max, Operator: >=, Threshold: 85", "Statistic: Average, Operator: >, Threshold: 70", "Statistic: Min, Operator: >=, Threshold: 60"], "a": 2, "e": "Statistic은 그룹 내 서버들의 Average/Min/Max로 계산합니다. Average는 약 66.7%, Min은 55%, Max는 85%이므로 Max >= 85만 조건을 만족합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Auto-Scaling 슬라이드14", "fix": true, "id": "3-2d-03"}, {"item": "3-2e", "t": "Cloud Functions 트리거", "q": "SCP(Samsung Cloud Platform) Cloud Functions의 코드 작성과 트리거 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["트리거 종류로 API Gateway와 Cronjob을 선택할 수 있다.", "API Gateway 트리거는 API Gateway의 API endpoint를 통해 함수를 호출한다.", "Java 런타임은 인라인 편집기를 지원하지 않으며, Object Storage 버킷의 압축 파일(.jar/.zip)을 선택하여 실행한다.", "Cronjob 트리거는 Cloud Functions 전용 문법을 사용하며, '/'는 범위 지정, '-'는 간격 지정에 사용한다.", "API Gateway 트리거를 추가할 때 API의 스테이지를 선택하여 개발·테스트·운영 등 배포 환경을 구분할 수 있다."], "a": 3, "e": "Cronjob 등록 문법은 리눅스 크론탭과 동일하며 '-'는 범위 지정, '/'는 간격 지정입니다('*'는 모든 값, ','는 여러 값). Java 런타임은 UI 코드 편집을 지원하지 않아 Object Storage의 Jar 파일을 가져와 실행합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Cloud Functions 슬라이드13, 15, 17~18", "id": "3-2e-02"}, {"item": "3-2e", "t": "Cloud Functions 구성 설정", "q": "Cloud Functions의 구성 설정(일반 구성, 환경 변수, 함수 URL)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["메모리는 Function당 최대 사용할 수 있는 메모리 제한 값이다.", "함수 URL을 활성화하면 HTTP URL만 발급되며, HTTPS 접근은 API Gateway 트리거를 연동해야 가능하다.", "제한시간은 Function당 호출을 대기하는 최대 시간이다.", "환경 변수를 사용하면 코드를 업데이트하지 않고 함수의 동작을 조정할 수 있다.", "함수 URL은 활성화 여부, 인증 유형(IAM/None), 퍼블릭 접근 허용 IP를 설정할 수 있다."], "a": 1, "e": "함수 URL을 사용하면 함수에 접근 가능한 HTTPS URL 주소가 발급됩니다. 인증 유형은 IAM 또는 None 중 선택합니다.", "src": "SCP_v2_Explore_Compute_11-19.md Cloud Functions 슬라이드16", "id": "3-2e-03"}, {"item": "3-2e", "t": "Cloud Functions 활용 시나리오", "q": "C 고객사는 하루에 몇 차례 불규칙하게 발생하는 이벤트 처리와 야간 배치 작업을 서버 관리 부담 없이 자동화하려고 합니다. C 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Cloud Functions는 인프라 패치·모니터링·로깅을 사용자가 직접 구성해야 하므로, 함수 로그 수집용 로깅 서버를 별도로 구축한다.", "간헐적이고 변동이 큰 워크로드는 자원 유지 비용이 없는 서버리스 방식이 비용 효율적이므로 Cloud Functions를 사용한다.", "야간 배치 작업은 Cronjob 트리거를 이용해 정해진 주기에 함수를 자동으로 호출한다.", "외부에서 호출하는 백엔드 API는 API Gateway 트리거로 함수와 연결한다.", "향후 사용량이 지속적이고 예측 가능해지면, 서버리스보다 비용 효율적인 컨테이너로의 전환을 검토한다."], "a": 0, "e": "Cloud Functions는 인프라 관리, 패치, 모니터링 및 로깅을 기본 서비스로 제공해 관리 복잡성을 최소화합니다. 지속적·예측 가능한 사용량은 컨테이너, 간헐적·변동이 큰 사용량은 서버리스가 비용 효율적입니다.", "src": "SCP_v2_Explore_Compute_11-19.md Cloud Functions 슬라이드6, 9, 17 / SCP Compute Service 슬라이드14", "id": "3-2e-04"}, {"item": "3-2f", "t": "Accelerated Server 제공 사양", "q": "SCP(Samsung Cloud Platform)의 Accelerated Server(GPU/NPU)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["NVIDIA A100은 Ampere, H100은 Hopper, B300은 Blackwell 아키텍처 기반이다.", "GPU는 Pass-through 방식으로 제공되어 물리 서버 수준의 성능을 제공한다.", "FuriosaAI RNGD NPU는 48GB의 NPU 메모리와 PCIe Gen5 x16 인터페이스를 제공한다.", "GPU와 NPU 모두 1, 2, 4, 8개 단위로 수량을 선택하여 서버를 구성한다.", "OS 이미지로 Ubuntu, RHEL, Windows를 제공하며, 모든 OS에서 동일한 GPU/NPU 타입을 사용할 수 있다."], "a": 4, "e": "Accelerated Server의 OS 이미지는 Ubuntu와 RHEL이며, OS별로 제공되는 GPU/NPU 타입이 다릅니다.", "src": "SCP_v2_Explore_Compute_11-19.md Accelerated Server 슬라이드5, 7, 8, 19", "id": "3-2f-02"}, {"item": "3-2f", "t": "GPU 서버 구성 제안", "q": "D 고객사는 SCP(Samsung Cloud Platform)에서 사내 LLM 서빙과 대규모 모델 학습 환경을 구성하려고 합니다. D 고객사를 위한 GPU 자원 구성 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["LLM 서빙, 분석 등 중소규모 워크로드는 GPU 1, 2, 4개 서버 타입으로 구성한다.", "고성능이 필요한 단일 서버 워크로드는 NVLink와 NVSwitch가 적용되는 GPU 8개 서버 타입을 사용한다.", "NVSwitch는 GPU 2개 이상 서버 타입이면 서버 생성 시 자동으로 활성화되므로 별도 작업이 필요 없다.", "여러 서버에 걸친 대규모 학습은 InfiniBand Switch 기반 GPU Direct RDMA를 지원하는 Multi-node GPU Cluster를 사용한다.", "하나의 GPU를 여러 사용자가 나눠 써야 하면 MIG를 활성화하여 독립된 GPU Instance로 분할한다."], "a": 2, "e": "NVSwitch를 사용하려면 GPU 8개를 모두 사용하는 서버 타입을 신청한 후 NVIDIA Fabric Manager를 설치해 활성화해야 합니다. 자동 활성화되지 않습니다.", "src": "SCP_v2_Explore_Compute_11-19.md Accelerated Server 슬라이드9, 13, 19 / Multi-node GPU Cluster 슬라이드5", "id": "3-2f-03"}, {"item": "3-2f", "t": "Multi-node GPU Cluster 생성", "q": "Multi-node GPU Cluster의 GPU Node 생성 및 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["GPU Node의 OS 이미지는 Ubuntu를 제공한다.", "GPU Node 생성 시 NAT는 서버 수가 1대이고 VPC에 Internet Gateway가 연결된 경우에만 설정할 수 있다.", "Cluster Fabric은 GPU Direct RDMA를 함께 적용할 수 있는 서버의 모임으로, 신규 생성하거나 기존 Cluster Fabric을 선택할 수 있다.", "기존 Cluster Fabric에 GPU Node를 추가할 때도 최초 구성과 마찬가지로 2대 이상을 함께 생성해야 한다.", "GPU Node는 8개 GPU가 장착된 물리 서버 2대 이상으로 구성하며, GPU Node 간 통신에는 RDMA 기반 InfiniBand Switch를 사용한다."], "a": 3, "e": "최초 구성(신규 Cluster Fabric)은 2대 이상이지만, 기존 Cluster Fabric에 증설할 때는 1대씩 추가할 수 있습니다. 동시 생성 수량은 2~5개입니다.", "src": "SCP_v2_Explore_Compute_11-19.md Multi-node GPU Cluster 슬라이드5, 10~12", "id": "3-2f-04"}, {"item": "3-2g", "t": "Virtual Server DR 개념", "q": "SCP(Samsung Cloud Platform)의 Virtual Server DR에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["현재 사용 중인 Region과 다른 Region에 Virtual Server와 연결된 Block Storage를 복제하고, 재해 대비 계획 수립·테스트와 실제 재해 시 복구 기능을 제공한다.", "DR 사이트의 Virtual Server는 평상시 Running 상태로 유지되어 주 사이트와 함께 실시간 트래픽을 분산 처리한다.", "실제로 복제되는 대상은 Block Storage이다.", "SCP v2에서 Virtual Server DR은 Marketplace에서 제공하는 서비스를 이용하는 방식으로 변경되었다.", "SLA상 DR Recovery Plan의 모의 훈련 또는 재해 전환이 완료된 후 고객 서비스 접속이 불가하거나 요청한 전환이 이루어지지 않으면 장애로 정의한다."], "a": 1, "e": "Virtual Server DR에서 DR 사이트의 Virtual Server는 정지된 상태로 유지되고 Block Storage만 복제됩니다. 재해 상황이나 모의 훈련 시 DR Virtual Server를 주 서버로 사용합니다.", "src": "WA백서 03 p.21~22 / WA백서 01 p.4 / SCP_v2_Explore_Compute_11-19.md SCP Compute Service 슬라이드11", "id": "3-2g-01"}, {"item": "3-2g", "t": "DR 구성 수준", "q": "RTO/RPO 목표에 따른 DR 구성 수준(Cold/Warm/Hot)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Hot Level은 Active-Active 구성으로 자동 Failover되어 RTO가 0에 가깝고, 비용이 가장 높다.", "Cold Level은 RTO 수주, RPO 수일 수준으로, 핵심 서비스의 백업 데이터만 DR 센터에 보관하며 비중요 시스템에 적합하다.", "Warm Level은 RTO 수일, RPO 수 시간 수준의 Active-Replica 구성으로, 실시간 복제가 아니어서 주기적인 동기화가 필요하다.", "Hot Level은 실시간 복제 기반으로 재해 시 복제를 중단하고 DR 센터로 운영을 전환하며, 중요 시스템에 적합하다.", "Cold Level은 재해 복구 시 DR 센터에 신규로 시스템 자원을 할당하고 구성해야 하므로 복구에 상당한 시간이 소요될 수 있다."], "a": 0, "e": "Hot Level은 Active-Standby 구성에 수동 Failover이며 RTO 수 시간, RPO 0 수준입니다. 비용은 Cold(낮음) < Warm(중간) < Hot(높음) 순입니다.", "src": "WA백서 03 p.18~20", "id": "3-2g-02"}, {"item": "3-2g", "t": "RTO/RPO 도출", "q": "E 금융사는 정산 시스템 H의 재해 복구 계획을 수립하고 있습니다. 업무 영향 분석 결과가 다음과 같을 때, 시스템 H에 적용할 RTO와 RPO로 옳은 것은 무엇입니까?", "o": ["RTO 6시간, RPO 30분", "RTO 4시간, RPO 1시간", "RTO 4시간, RPO 30분", "RTO 1일, RPO 1일", "RTO 6시간, RPO 1일"], "a": 2, "e": "시스템과 그 시스템이 처리하는 업무의 RTO·RPO 중 각각 최소값을 해당 시스템과 업무의 목표로 도출합니다. RTO는 4시간(업무 P), RPO는 30분(시스템 H)입니다.", "src": "WA백서 03 p.4~6", "s": "- 시스템 H 자체 요구: RTO 6시간, RPO 30분\n- 시스템 H가 처리하는 업무 P: RTO 4시간, RPO 1시간\n- 시스템 H가 처리하는 업무 Q: RTO 1일, RPO 1일\n※ 업무와 시스템의 관계를 기준으로 RTO/RPO를 도출한다.", "fix": true, "id": "3-2g-03"}, {"item": "3-2h", "t": "Edge Server 구성요소", "q": "SCP(Samsung Cloud Platform)의 Edge Server에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["데이터 보안, 규제, 성능, 지연 시간 등의 이슈로 클라우드 전환이 어려운 기업의 On-Site 환경에 Edge Cloud를 제공하는 서비스이다.", "Edge Server와 SCP 간 네트워크는 VPN 또는 전용회선으로 구성한다.", "사용자 환경에 따라 KVM, Container 등의 가상화 플랫폼을 제공한다.", "SLA상 Edge Manager 접속 불가 또는 Edge Server 장애로 고객 서비스가 실패하는 경우를 장애로 정의한다.", "Edge Manager는 고객 사이트의 Edge Server에 설치되어 KVM을 관리하고, Edge Client는 SCP에 위치하여 여러 Edge Server를 통합 관리한다."], "a": 4, "e": "Edge Manager는 SCP에 위치해 Edge Client를 통해 고객 사이트의 Edge Server를 관리하고, Edge Client는 고객 사이트 Edge Server에 위치해 Edge Manager를 통해 KVM을 관리합니다. 두 구성요소의 위치와 역할이 뒤바뀌었습니다.", "src": "SCP_v2_Explore_Compute_11-19.md Edge Server 슬라이드5~6 / WA백서 01 p.5", "id": "3-2h-01"}, {"item": "3-2h", "t": "Edge Server 신청", "q": "Edge Server의 신청과 이용에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Edge Server는 고객 On-Site에 설치되는 서비스로, SCP 콘솔의 서비스 요청을 통해 신청한다.", "신청 시 사용 목적, 호스트 서버 OS, 서버 타입과 수량, 설치할 배송지 주소 등을 기재한다.", "Edge Server는 무약정 요금이 없으며, 3년 또는 5년 약정으로 이용한다.", "Virtual Server처럼 콘솔에서 이미지와 서버 타입을 선택하면 고객 사이트에 즉시 프로비저닝된다.", "중요 데이터는 On-Site에서 처리하고 분석·AI 등은 Public Cloud를 활용하는 하이브리드 클라우드 형태로 확장한다."], "a": 3, "e": "Edge Server는 고객 On-Site에 설치되는 서비스이므로 콘솔에서 즉시 생성되지 않고, 서비스 요청서(사용 목적·서버 타입과 수량·배송지 등)를 작성해 신청합니다. 무약정 없이 3년/5년 약정으로 이용하며 사용 기간은 기본 3년입니다.", "src": "SCP_v2_Explore_Compute_11-19.md Edge Server 슬라이드5, 8~9 / WA백서 06 p.6", "id": "3-2h-02"}, {"item": "3-2h", "t": "Hybrid Cloud 설계", "q": "제조사 A는 공장 내 CCTV 영상 분석 데이터를 규제상 외부로 반출하기 어렵고 낮은 지연 시간이 요구되어, Edge Server 기반 하이브리드 클라우드를 구성하려고 합니다. 제조사 A를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["공장 On-Site에 Edge Server를 도입해 보안이 요구되는 데이터와 규제가 엄격한 워크로드를 처리한다.", "데이터 이동 대역폭과 전송 비용은 성능과 무관하므로, 원천 영상 데이터를 모두 SCP 리전으로 전송하여 분석한다.", "온프레미스와 클라우드 전반에 걸쳐 일관된 보안 정책을 수립하고, 데이터 암호화·접근 제어·규정 준수를 충족하도록 설계한다.", "필요에 따라 클라우드로 확장하는 버스팅(Bursting) 구조를 설계해 워크로드를 유연하게 관리한다.", "Edge Server는 SCP Console을 통해 통합 관리하고, 분석·AI 등은 필요 시 Public Cloud 서비스를 활용한다."], "a": 1, "e": "데이터 중력 원칙에 따라 데이터가 많은 곳에 애플리케이션을 가깝게 배치하고, 데이터 이동 시 대역폭과 전송 비용을 고려해야 성능과 효율성이 높아집니다.", "src": "SCP_v2_Explore_Compute_11-19.md SCP Compute Service 슬라이드13 / Edge Server 슬라이드5", "id": "3-2h-03"}, {"item": "3-3a", "t": "MSA vs 모놀리식", "q": "모놀리식(Monolithic) 아키텍처와 비교한 마이크로서비스 아키텍처(MSA)의 특징으로 옳지 않은 것은 무엇입니까?", "o": ["비즈니스 로직과 데이터베이스를 기능별로 독립적으로 구성하고, 프론트엔드와는 API를 통해 연결한다.", "기능이 독립적으로 구성되므로 모든 기능을 동일한 언어로 개발할 필요가 없다.", "기능들을 서로 격리하여 운영하므로 다른 기능에서 발생한 장애나 과부하의 영향을 배제하거나 최소화할 수 있다.", "모듈 간 호출이 같은 서버 안에서 이루어지므로 모놀리식보다 서비스 간 통신 성능이 유리하다.", "독립적인 구성요소가 많아질수록 각 요소를 개별적으로 관리해야 하므로 운영 부담이 증가할 수 있다."], "a": 3, "e": "같은 서버 내 모듈 간 호출로 성능이 유리한 것은 모놀리식의 장점입니다. MSA는 기능 간 API 통신 메커니즘을 별도로 구현해야 하고, 호출 실패·지연 시 상태 추적이 어려울 수 있습니다.", "src": "WA백서 01 p.22-24", "id": "3-3a-01"}, {"item": "3-3a", "t": "MSA 적합성 검토", "q": "A 고객사는 신규 Application에 마이크로서비스 아키텍처(MSA)를 적용할지 검토하고 있습니다. MSA 적용 적합성을 판단할 때 고려할 사항으로 옳지 않은 것은 무엇입니까?", "o": ["모든 서비스가 하나의 공통된 릴리즈 사이클과 요구사항을 따르도록 통합 관리할 수 있는지 확인한다.", "비즈니스 도메인이 여러 개의 독립된 하위 도메인(Sub Domain)으로 나뉠 수 있는지 확인한다.", "개발·운영 조직을 여러 팀으로 나누고 각 팀이 '서비스 단위'를 책임지도록 할 수 있는지 확인한다.", "CI/CD, 모니터링, 로깅, 트레이싱 등 운영 자동화 체계를 적용할 수 있는지 확인한다.", "트래픽 핫스팟이 예상되고 고가용성(HA) 전략이 요구되는 도메인이 분명히 존재하는지 확인한다."], "a": 0, "e": "MSA 적합성 검토에서는 각 서비스가 '고유한' 변화 속도, 릴리즈 사이클, 요구사항을 가지는지를 봅니다. 모든 서비스가 같은 릴리즈 주기를 따르는 구조라면 오히려 MSA로 분리할 이유가 약합니다.", "src": "WA백서 01 p.24", "id": "3-3a-02"}, {"item": "3-3a", "t": "Container 가상화", "q": "하이퍼바이저 기반 가상화(Virtual Server)와 OS 레벨 가상화(Container)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server는 하이퍼바이저 위에서 각각 Guest OS를 포함하여 실행된다.", "Container는 Docker Engine 같은 런타임 위에서 실행되며, 애플리케이션과 런타임 환경, 앱 의존성을 패키징한다.", "애플리케이션 서버, 데이터베이스, 메시지 큐 컨테이너는 라이브러리 버전 충돌을 피하기 위해 반드시 서로 다른 서버에 배치해야 한다.", "자원 이용률이 낮은 여러 Virtual Server의 워크로드를 컨테이너로 통합하면 사용되지 않는 리소스를 줄여 비용을 절감할 수 있다.", "애플리케이션과 런타임을 컨테이너로 패키징하면 운영체제 플랫폼과 관계없이 일관된 실행 환경을 제공할 수 있다."], "a": 2, "e": "컨테이너를 사용하면 각 계층의 라이브러리 버전이 달라도 충돌 없이 동일한 컴퓨팅 서버에서 병렬로 실행할 수 있어 멀티 티어 애플리케이션 구축에 효과적입니다.", "src": "CloudNative1_Container_Services 슬라이드5-8, WA백서 04 p.33", "id": "3-3a-03"}, {"item": "3-3b", "t": "Kubernetes Engine 역할 분담", "q": "SCP(Samsung Cloud Platform) Kubernetes Engine에서 플랫폼(SCP)과 사용자의 역할 분담에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["사용자는 Control Plane 노드를 직접 생성하고 API Server와 etcd를 설치·운영해야 한다.", "Kubernetes Control Plane은 SCP에서 설치하여 운영한다.", "사용자는 Worker Node를 추가·관리하며, 그만큼 애플리케이션에 더 많은 시간과 노력을 집중할 수 있다.", "Cluster 생성을 위한 필수 설정(VM, VPC, Subnet, Security Group, Load Balancer, DNS)이 함께 제공된다.", "Persistent Volume 관리, Namespace 관리, Network Policy 생성/관리 기능을 제공한다."], "a": 0, "e": "Kubernetes Engine은 Control Plane을 SCP가 설치·운영하는 관리형 서비스이며, 사용자는 Worker Node만 추가·관리합니다.", "src": "CloudNative1_Container_Services 슬라이드23", "id": "3-3b-03"}, {"item": "3-3b", "t": "Kubernetes Object 선택", "q": "A 고객사는 하나의 Kubernetes Cluster에서 운영 환경과 개발 환경을 함께 사용하려 합니다. 환경마다 Cluster를 새로 구성하면 리소스 활용도가 떨어지므로, 하나의 Cluster 안에서 리소스를 논리적으로 분리하고자 합니다. 이 요구사항에 가장 적합한 Kubernetes 오브젝트는 무엇입니까?", "o": ["ReplicaSet", "Namespace", "Service", "Ingress", "Persistent Volume"], "a": 1, "e": "Namespace는 Cluster 내 리소스를 분리하는 논리적 그룹으로, 개발/운영 환경을 하나의 Cluster에서 구분할 때 사용합니다. ReplicaSet은 파드 복제본 수 유지, Service는 파드 네트워크 접근 추상화를 담당합니다.", "src": "CloudNative1_Container_Services 슬라이드15-16", "id": "3-3b-04"}, {"item": "3-3b", "t": "Container 서비스 특성/과금", "q": "SCP(Samsung Cloud Platform)의 Kubernetes Engine 및 Container 관련 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Kubernetes Engine은 관리형 서비스로, 플랫폼 영역의 보안 관리를 서비스 제공자가 수행하여 사용자의 보안 관리 부담을 줄인다.", "Kubernetes Engine은 Pay-as-you-go 방식으로 API 호출 건수(Per Call) 기준으로 과금된다.", "Container Registry는 Pay-as-you-go 방식으로 사용량(GB) 기준으로 과금된다.", "Kubernetes는 수평적 확장 기능과 중단 시간을 최소화하는 블루-그린 배포 기능을 제공하고, 사용자 트래픽 부하를 컨테이너 간에 분산시킨다.", "SCP는 Container 서비스로 이미지를 저장·관리·공유하는 Container Registry와 컨테이너 오케스트레이션 서비스인 Kubernetes Engine을 제공한다."], "a": 1, "e": "Kubernetes Engine은 Provisioning 방식의 시간 단위(Per Hour) 과금입니다. 사용량(GB) 기준 Pay-as-you-go는 Container Registry이고, Per Call은 API Gateway 같은 서비스의 과금 방식입니다.", "src": "WA백서 02 p.10, WA백서 04 p.33, WA백서 06 p.4, CloudNative1_Container_Services 슬라이드20", "id": "3-3b-05"}, {"item": "3-3c", "t": "Multi-AZ Kubernetes Cluster", "q": "A 고객사는 가용 영역(AZ) 장애에 대비하여 SCP(Samsung Cloud Platform)에 Multi-AZ Kubernetes Cluster를 구성하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["File Storage를 Multi-AZ로 구성하면 원본과 복제본이 각 AZ에 생성되고, 두 스토리지 간 데이터가 실시간 동기화된다.", "Kubernetes Engine을 구성하고 각각의 AZ에 별도의 노드풀을 생성한다.", "AZa에 재해가 발생하면 AZa에서 구동 중인 Pod가 AZb 노드로 이동(Eviction)된다.", "평상시 각 AZ의 Pod는 자신이 위치한 AZ의 File Storage를 Active-Active 방식으로 나누어 사용한다.", "재해 발생 시 스토리지 액세스 경로도 AZb의 Standby Storage로 전환된다."], "a": 3, "e": "평상시에는 전체 노드와 Pod가 AZa의 Active Storage를 사용하고, AZa 재해 시 Pod가 AZb 노드로 이동하면서 스토리지 경로도 AZb Standby Storage로 전환됩니다. AZ별 노드풀 분리가 Multi-AZ 구현의 핵심입니다.", "src": "WA백서 01 p.33", "id": "3-3c-01"}, {"item": "3-3c", "t": "Node Pool 자동 확장/복구", "q": "SCP(Samsung Cloud Platform) Kubernetes Engine의 노드 풀 자동 확장 및 노드 자동 복구 기능에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["신규 노드가 자동으로 할당되게 하려면 노드 풀 생성 시 자동 확장/축소(Auto-Scaling) 옵션을 사용해야 한다.", "노드가 NotReady 상태를 약 1분간 보고하면 즉시 노드 자동 복구가 개시된다.", "노드가 상태를 아예 보고하지 못하는 경우에도 노드 자동 복구가 개시될 수 있다.", "최초 노드 생성 시 Running 상태가 되지 못하고 Creating 상태에 머무르면 자동 복구가 제한될 수 있다.", "같은 노드 풀에서 비정상 노드가 4대 이상 발생하면 자동 복구가 제한될 수 있다."], "a": 1, "e": "노드 자동 복구는 노드가 일정 시간(임계값 약 10분) 동안 지속적으로 NotReady 상태를 보고하거나 상태를 보고하지 못할 때 개시됩니다. 제한 조건(Creating 상태, 같은 노드 풀 비정상 노드 4대 이상)도 함께 기억해 두세요.", "src": "WA백서 01 p.29, p.36", "id": "3-3c-02"}, {"item": "3-3c", "t": "Cluster 구성 절차", "q": "SCP(Samsung Cloud Platform)에서 Kubernetes Cluster를 구성하고 애플리케이션을 배포하기까지의 작업을 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄱ → ㄴ → ㄷ → ㄹ → ㅁ", "ㄱ → ㄷ → ㄹ → ㄴ → ㅁ", "ㄱ → ㄷ → ㄴ → ㄹ → ㅁ", "ㄷ → ㄱ → ㄴ → ㄹ → ㅁ", "ㄷ → ㄴ → ㄱ → ㄹ → ㅁ"], "a": 2, "e": "Cluster 생성 전에 IaaS 자원(VPC, Subnet, File Storage)을 먼저 준비해야 하며, Control Plane 생성 후 노드 배포 전략에 따라 Worker Node를 추가합니다. 이후 Namespace·Ingress Controller 등 기본 설정을 하고 워크로드를 배포합니다.", "src": "CloudNative1_Container_Services 슬라이드24, 27", "s": "ㄱ. VPC 구성 및 Subnet 생성, File Storage 생성(Persistent Volume 용도)\nㄴ. Worker Node 추가(노드 배포 전략에 따라 단일 AZ 또는 멀티 AZ 분산, CPU/GPU·OS 선택)\nㄷ. Kubernetes Engine 서비스로 Control Plane 생성(VPC, Subnet, File Storage 선택)\nㄹ. Namespace 생성 및 Ingress Controller 설치\nㅁ. Deployment 오브젝트를 통한 Pod 배포", "fix": true, "id": "3-3c-03"}, {"item": "3-3d", "t": "App 배포 Workflow", "q": "SCP(Samsung Cloud Platform) Kubernetes Engine 환경에서 애플리케이션을 배포하는 과정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["소스코드는 GitHub, GitLab 등의 Git 저장소를 구성하여 관리한다.", "소스코드를 Build하여 Container Image를 생성하고 Container Registry에 저장한다.", "Workload는 Deployment 오브젝트를 통해 Pod로 배포하며, DevOps 파이프라인과 연동하여 지속적으로 배포할 수 있다.", "Ingress 오브젝트로 URL 기반 라우팅을 구성하고 Load Balancer와 연동하여 Cluster 외부 트래픽을 처리한다.", "빌드한 Container Image는 File Storage에 저장한 뒤 각 Worker Node에 마운트하여 Pod를 기동한다."], "a": 4, "e": "Container Image는 Container Registry에 저장하고, Pod 배포 시 Registry의 이미지를 사용합니다. File Storage는 Persistent Volume 용도로 사용합니다.", "src": "CloudNative1_Container_Services 슬라이드24, WA백서 05 p.24", "id": "3-3d-01"}, {"item": "3-3d", "t": "Kubernetes Apps", "q": "SCP(Samsung Cloud Platform)의 Kubernetes Apps에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Kubernetes Engine Cluster 없이 Virtual Server에 애플리케이션을 직접 설치해 주는 서비스이다.", "Container Registry에 저장된 이미지의 취약점을 점검하고 분석 결과를 제공하는 서비스이다.", "Web/WAS 등 검증된 컨테이너 기반 소프트웨어를 Kubernetes Engine Cluster에 손쉽게 배포할 수 있도록 지원한다.", "Pod 간 또는 외부 네트워크 엔드포인트와의 통신을 제어하는 정책 기능이다.", "사용자가 Kubernetes Control Plane을 직접 설치하고 운영할 수 있도록 지원하는 기능이다."], "a": 2, "e": "Kubernetes Apps는 Web/WAS를 비롯한 앱 인프라, 큐, 모니터링 등 다양한 컨테이너 이미지를 Kubernetes Engine으로 생성한 Cluster에 셀프 서비스로 배포하는 서비스입니다. 이미지 취약점 점검은 Container Registry, Pod 통신 제어는 NetworkPolicy의 기능입니다.", "src": "일반지식(삼성SDS 기술블로그 'DevOps, Container 상품의 이해' Kubernetes Apps 소개, 교재 미수록)", "id": "3-3d-02"}, {"item": "3-3d", "t": "Persistent Volume", "q": "A 고객사는 Kubernetes Engine에 웹 애플리케이션을 배포하려 합니다. Pod가 재생성되더라도 애플리케이션 로그와 여러 Pod가 함께 사용하는 공유 파일은 유지되어야 합니다. 이 요구사항을 충족하는 방법으로 가장 적합한 것은 무엇입니까?", "o": ["컨테이너 내부 파일시스템에 로그를 기록하고, ReplicaSet으로 Pod 복제본 수를 늘린다.", "로그가 쌓일 때마다 컨테이너를 새 이미지로 만들어 Container Registry에 Push한다.", "Ingress에 host와 path를 지정하여 로그 파일 경로를 외부로 노출한다.", "File Storage를 생성하여 Persistent Volume(PV)으로 구성하고, PVC를 통해 Pod에 연결한다.", "NetworkPolicy로 Pod 간 트래픽을 허용하여 다른 Pod로 파일을 복제한다."], "a": 3, "e": "로그나 공유 파일은 Persistent Volume에 저장해 컨테이너 데이터를 영구 보관합니다. SCP에서는 Cluster 구성 단계에서 PV 용도의 File Storage를 생성해 연계합니다.", "src": "CloudNative1_Container_Services 슬라이드18, 24, 26", "id": "3-3d-03"}, {"item": "3-3e", "t": "API Server 연결 정보", "q": "A 고객사는 DevOps Console에서 Kubernetes Engine Cluster의 API Server에 연결하여 배포 타겟(K8S 클러스터)으로 등록하려 합니다. 클러스터 등록 시 입력하는 정보가 아닌 것은 무엇입니까?", "o": ["클러스터명과 클러스터 ID", "CA Certificate", "kubeconfig 파일", "API 서버 URL", "Worker Node 접속용 SSH Key Pair"], "a": 4, "e": "클러스터 등록 시 클러스터명, 클러스터 ID, CA Certificate, 접속 정보(kubeconfig 파일, API 서버 URL 등)를 입력하고, 이후 사용할 네임스페이스를 가져옵니다. 등록은 API Server를 통해 이루어지므로 Worker Node에 SSH로 접속하기 위한 Key Pair는 필요하지 않습니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드13", "id": "3-3e-01"}, {"item": "3-3e", "t": "kubectl 업데이트/롤백", "q": "A 고객사는 Container Registry의 v1 이미지로 배포한 서비스를 v2로 업데이트하고, 문제가 생기면 롤백하려 합니다. 운영 방법으로 옳지 않은 것은 무엇입니까?", "o": ["kubectl은 각 Worker Node에 SSH로 접속해 컨테이너를 교체하는 도구이므로, 노드마다 명령을 반복 실행해야 한다.", "새 이미지를 빌드하여 v2 태그로 Container Registry에 Push한다.", "매니페스트(YAML)의 image 값을 '…:v2'로 변경한 뒤 kubectl apply로 클러스터에 반영한다.", "문제가 발생하면 image 태그를 ':v1'로 되돌려 다시 적용하는 방식으로 롤백할 수 있다.", "기존 버전 이미지도 Registry에 저장해 두고, 필요 시 과거 버전의 이미지를 확인하여 복원할 수 있다."], "a": 0, "e": "kubectl apply는 매니페스트를 클러스터의 API Server에 반영하는 방식이며, 노드에 개별 접속할 필요가 없습니다. 이미지 태그를 바꿔 다시 apply하는 것만으로 업데이트와 롤백이 가능합니다.", "src": "AI&ML_2_CloudML 슬라이드6, WA백서 05 p.24", "id": "3-3e-02"}, {"item": "3-3e", "t": "Kubernetes Engine SLA", "q": "SCP(Samsung Cloud Platform)의 SLA에서 Kubernetes Engine의 장애로 판단하는 기준으로 옳은 것은 무엇입니까?", "o": ["컨트롤 플레인에 외부연결 및 접속을 1분 이상 확보하지 못하는 경우", "컨트롤 플레인에 외부연결 및 접속을 5분 이상 확보하지 못하는 경우", "Worker Node가 약 10분 이상 NotReady 상태를 보고하는 경우", "Container Registry Endpoint에 대한 모든 연결 요청이 5분 동안 실패하는 경우", "하나의 Pod가 3회 이상 연속으로 재시작되는 경우"], "a": 1, "e": "Kubernetes Engine은 컨트롤 플레인(API Server 엔드포인트)에 외부연결 및 접속을 5분 이상 확보하지 못하면 장애로 봅니다. Endpoint 연결 요청 5분 실패는 Container Registry의 기준이고, 약 10분 NotReady는 노드 자동 복구 임계값입니다.", "src": "WA백서 01 p.7-8", "id": "3-3e-03"}, {"item": "3-3f", "t": "Container Registry 기능", "q": "SCP(Samsung Cloud Platform) Container Registry에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Container Image뿐 아니라 Helm Chart, OCI Artifact도 저장할 수 있다.", "Image Push, Pull, 조회, 삭제와 Tag 버전 관리를 지원한다.", "Image 보안 스캔 및 취약점 분석 결과를 제공한다.", "이미지는 Block Storage에 저장되어 고성능 I/O로 대용량 이미지를 관리한다.", "암호화 저장과 HTTPS를 사용하며, IAM 기반 접근 권한 관리와 Private/Public 접근 제어를 지원한다."], "a": 3, "e": "Container Registry는 Object Storage를 통해 저렴한 비용으로 대용량 이미지를 효율적으로 관리합니다. Image/Chart/Artifact의 저장소가 Object Storage라는 점이 자주 출제됩니다.", "src": "CloudNative1_Container_Services 슬라이드21", "id": "3-3f-01"}, {"item": "3-3f", "t": "Registry 보안/접근제어", "q": "A 고객사는 Kubernetes Engine에서 사용할 이미지를 SCP(Samsung Cloud Platform) Container Registry로 관리하려 합니다. 보안 감사에서 '신뢰할 수 있는 이미지만 사용하고, 허가된 대상만 Registry에 접근하도록 하라'는 권고를 받았습니다. A 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["접근 제어 목록(ACL)을 White List로 구성하고, Public IP·Account 내 서버·VPC Endpoint 등을 접근 대상으로 지정한다.", "Container Registry에 Security Group을 적용하여 접근 IP 주소를 제한한다.", "VPC Endpoint를 생성하여 Direct Connect 등으로 연결된 내부망에서 인터넷을 거치지 않고 Registry에 접근하게 한다.", "컨테이너를 배포할 때 CI/CD 파이프라인에서 취약점 점검을 자동화한다.", "외부 이미지는 서명을 확인한 뒤 자체 프라이빗 레지스트리에 저장하고, 빌드·배포 시 이 이미지를 참조한다."], "a": 1, "e": "Container Registry는 File Storage, Object Storage와 함께 접근 제어 목록(ACL)으로 접근 대상을 관리하는 저장소입니다. Security Group은 서버 등의 네트워크 트래픽을 제어하는 수단이지 Registry의 접근 제어 방식이 아닙니다.", "src": "WA백서 02 p.30, p.38-39, SCP_v2_Explore_Network_01-10(VPC) 슬라이드33", "id": "3-3f-02"}, {"item": "3-3f", "t": "이미지 태그 관리", "q": "Container Registry에서 태그를 활용해 이미지를 관리하는 방법으로 옳지 않은 것은 무엇입니까?", "o": ["'svc-model:v1', ':v2', ':prod', ':exp'처럼 태그로 버전과 배포 환경을 구분한다.", "이미지에 모델 버전, 학습일, 하이퍼파라미터 등 메타 정보를 태그나 레이블로 기록하여 추적한다.", "애플리케이션이 업데이트되면 새 버전 이미지로 등록해 배포에 활용하고, 기존 버전도 Registry에 보관한다.", "docker tag로 Registry 주소를 포함한 이름을 붙이고, docker login 후 docker push로 업로드한다.", "같은 Repository에 새 태그를 Push하면 Registry가 이전 태그의 이미지를 자동으로 삭제한다."], "a": 4, "e": "Registry는 이전 버전 이미지도 그대로 보관하므로 필요 시 과거 버전을 확인해 복원·롤백할 수 있습니다. 태그는 사용자가 붙이는 것이며, Registry가 새 태그 Push를 이유로 기존 이미지를 자동 삭제하지 않습니다.", "src": "AI&ML_2_CloudML 슬라이드4, 6, 11, WA백서 05 p.24", "id": "3-3f-03"}, {"item": "3-3g", "t": "Ingress/Service 포트", "q": "다음과 같이 Ingress와 Service가 설정되어 있습니다. 사용자가 prod.example.com으로 접속할 때의 트래픽 흐름에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Ingress Controller가 host 기준으로 httpprod Service의 80 포트로 전달하고, Service는 Pod 컨테이너의 8080 포트(containerPort)로 전달한다.", "Service가 Pod 컨테이너의 80 포트로 전달하므로 컨테이너는 80 포트로 수신하도록 구성해야 한다.", "Ingress는 IP와 포트만 보고 라우팅하므로 host 값은 라우팅에 사용되지 않는다.", "Ingress가 Pod의 8080 포트에 직접 연결되므로 Service 오브젝트는 필요하지 않다.", "Ingress Controller가 Pod 컨테이너의 80 포트로 전달하고, Service가 다시 8080 포트로 변환한다."], "a": 0, "e": "Ingress는 도메인(host)·path 기반 URL로 Kubernetes Service에 접근하게 하며, Service는 자신의 port(80)로 받은 트래픽을 targetPort(8080), 즉 컨테이너의 containerPort로 전달합니다.", "src": "CloudNative1_Container_Services 슬라이드18", "s": "Ingress 규칙: host prod.example.com, path /, serviceName httpprod, servicePort 80\nService(httpprod): port 80, targetPort 8080", "id": "3-3g-01"}, {"item": "3-3g", "t": "NetworkPolicy", "q": "Kubernetes NetworkPolicy에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["서로 다른 Namespace의 Pod 간 트래픽 흐름을 제어할 수 있다.", "Pod 간 통신뿐 아니라 외부 네트워크 엔드포인트와의 통신도 제어할 수 있다.", "NetworkPolicy가 적용되지 않은 Pod는 기본적으로 모든 소스에서 오는 트래픽을 차단한다.", "SCP Kubernetes Engine은 Network Policy 생성/관리 기능을 제공한다.", "Cluster 보안 정책을 수립할 때 NetworkPolicy 오브젝트를 구성하여 Pod 간 통신을 제어한다."], "a": 2, "e": "기본적으로 Pod는 모든 소스에서 오는 트래픽을 허용합니다. 따라서 Namespace 간 또는 외부와의 통신을 제한하려면 NetworkPolicy를 명시적으로 구성해야 합니다.", "src": "CloudNative1_Container_Services 슬라이드17, 23, 24", "id": "3-3g-02"}, {"item": "3-3g", "t": "Service 유형", "q": "Kubernetes Service 유형에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["ClusterIP는 기본 유형으로, 클러스터 내부에서만 접근할 수 있는 가상 IP를 할당한다.", "NodePort는 모든 Node의 특정 포트를 열어 'Node IP:포트'로 외부에서 접근할 수 있게 한다.", "LoadBalancer는 외부 Load Balancer를 연동하여 Service를 클러스터 외부에 노출한다.", "ExternalName은 Service를 외부 DNS 이름(CNAME)에 매핑한다.", "ClusterIP는 Pod가 재생성되어 Pod IP가 바뀌면 Service IP도 함께 바뀌므로 클라이언트가 새 IP를 조회해야 한다."], "a": 4, "e": "Service는 Pod에 대한 네트워크 접근을 제공하는 추상화 계층으로, Pod가 재생성되어 IP가 바뀌어도 Service의 IP와 이름은 유지됩니다. 클라이언트는 고정된 Service 주소로 접근하면 됩니다.", "src": "일반지식 (참고: CloudNative1_Container_Services 슬라이드15)", "id": "3-3g-03"}, {"item": "3-9a", "t": "CI/CD 개념", "q": "지속적 통합(CI), 지속적 제공(Continuous Delivery), 지속적 배포(Continuous Deployment)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["지속적 통합(CI)은 변경된 소스 코드의 병합(Merge), 빌드(Build), 테스트(Test)를 자동화한다.", "지속적 통합(CI)은 테스트를 통과한 빌드를 운영 환경까지 자동 배포하며, 지속적 배포는 빌드와 단위 테스트 자동화에 한정된다.", "지속적 제공(Continuous Delivery)은 소프트웨어 릴리즈 프로세스를 자동화하며, 운영 환경 배포 전 승인 과정이 필요한 경우에 해당한다.", "지속적 배포(Continuous Deployment)는 릴리즈된 소프트웨어를 운영 환경에 배포하는 프로세스까지 자동화한다.", "CI 환경에서는 코드 저장소에 Commit된 모든 업데이트가 자동화된 빌드와 테스트를 생성한다."], "a": 1, "e": "CI는 빌드와 단위 테스트 단계를 자동화하는 프로세스이고, 지속적 배포(CD)는 CI를 확장해 테스트를 통과한 빌드를 운영 환경에 자동 배포하는 절차까지 포함합니다. 두 개념의 범위가 뒤바뀐 설명입니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드6, WA백서 05 p.17-18", "id": "3-9a-01"}, {"item": "3-9a", "t": "배포 전략", "q": "블루-그린(Blue-Green) 배포와 카나리(Canary) 배포에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["블루-그린 배포는 기존 버전과 새 버전을 동시에 배포하고, 하나의 버전에서만 트래픽을 처리한다.", "블루-그린 배포는 새 버전 테스트 완료 후 트래픽을 전환하며, 문제가 발생하면 구 버전으로 빠르게 롤백할 수 있다.", "블루-그린 배포는 두 버전을 순차적으로 교체하므로 카나리 배포보다 필요한 시스템 자원이 적다.", "카나리 배포는 트래픽 일부를 새 버전으로 전달한 뒤 문제가 없으면 점차 전체 트래픽을 새 버전으로 옮긴다.", "카나리 배포는 온라인 쇼핑몰의 신규 상품 A/B 테스트와 같은 용도로 활용할 수 있다."], "a": 2, "e": "블루-그린 배포는 두 버전을 동시에 운영하므로 시스템 자원이 두 배로 필요합니다. 카나리 배포는 이러한 블루-그린 배포의 문제점을 보완하기 위해 트래픽을 단계적으로 옮기는 전략입니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드27-30, 33", "id": "3-9a-02"}, {"item": "3-9a", "t": "운영 자동화 도구", "q": "SCP(Samsung Cloud Platform)에서 운영 자동화 영역과 이를 구현하는 방법을 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["모니터링 및 경고 – Terraform 정의 파일에 임계치를 선언하여 지표가 범위를 넘으면 알림을 트리거", "파이프라인 정의, 실행 및 관리 – DevOps Service를 사용하여 CI/CD 파이프라인 및 실행을 자동화", "배포 – Terraform 같은 IaC 도구를 사용하여 인프라 배포 및 업데이트를 자동화", "테스트 – DevOps Service의 파이프라인에서 SonarQube를 이용하여 테스트를 자동화", "크기 조정 – Auto-Scaling 또는 Kubernetes Engine Node Pool 자동 확장으로 인프라 크기를 자동 조정"], "a": 0, "e": "모니터링 및 경고는 Cloud Monitoring에서 임계치 기반 이벤트를 등록해 지표가 임계치를 넘을 때 알림을 트리거하도록 구성합니다. Terraform은 인프라 배포 자동화(IaC) 도구입니다.", "src": "WA백서 05 p.15", "id": "3-9a-03"}, {"item": "3-9b", "t": "DevOps Service 구성 절차", "q": "SCP(Samsung Cloud Platform) DevOps Service로 CI/CD 환경을 구성하는 순서로 옳은 것은 무엇입니까? (CI/CD 도구 준비 단계는 생략)", "o": ["ㄱ → ㄴ → ㄹ → ㄷ → ㅁ", "ㄱ → ㄷ → ㄴ → ㄹ → ㅁ", "ㄴ → ㄱ → ㄷ → ㄹ → ㅁ", "ㄴ → ㄱ → ㄹ → ㄷ → ㅁ", "ㄴ → ㄹ → ㄱ → ㄷ → ㅁ"], "a": 3, "e": "배포 타겟 인프라를 먼저 만든 뒤 DevOps Service를 신청하고, 클러스터 등록 → CI/CD 도구 준비 → 프로젝트 그룹 생성 → 프로젝트 생성 → 배포 완료 순으로 진행합니다. 클러스터 등록은 DevOps Console에서 하므로 서비스 신청 이후입니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드11, 33", "s": "ㄱ. DevOps Service 신청(Tenant 명, Tenant 코드, Tenant 멤버 지정)\nㄴ. 배포 타겟 인프라(Kubernetes Cluster 또는 VM) 생성\nㄷ. 프로젝트 그룹 생성\nㄹ. DevOps Console에 클러스터 등록 및 네임스페이스 가져오기\nㅁ. 프로젝트 생성(애플리케이션 템플릿, 코드 저장소, 이미지 저장소, 빌드 파이프라인 설정)", "fix": true, "id": "3-9b-01"}, {"item": "3-9b", "t": "DevOps 프로젝트 생성", "q": "SCP(Samsung Cloud Platform) DevOps Console에서 프로젝트를 생성하는 과정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["배포 타겟으로 Kubernetes, Kubernetes(ArgoCD), VM 중에서 선택할 수 있다.", "이미지 저장소는 Docker hub 또는 Image Registry 중에서 선택하며, 신규 저장소 생성과 기존 저장소 사용이 모두 가능하다.", "배포 대상 환경에서 헬름 릴리스 이름과 헬름 차트를 선택하고, 필요한 Values를 Key/Value로 지정할 수 있다.", "빌드 파이프라인은 Checkout → Build → Docker Build → Deploy to K8S 단계로 구성된다.", "애플리케이션 템플릿은 System 템플릿만 제공되므로, 테넌트나 프로젝트그룹 단위의 자체 템플릿은 등록할 수 없다."], "a": 4, "e": "템플릿 유형은 System / Tenant / ProjectGroup Template으로 구분되며, 테넌트별·Account별로 사용자가 자체 템플릿을 직접 등록하고 관리할 수 있습니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드8, 16-21", "id": "3-9b-02"}, {"item": "3-9b", "t": "Tenant/툴 연계", "q": "SCP(Samsung Cloud Platform) DevOps Service의 구성 요소와 DevOps Tool 연계에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["DevOps Console에 SCM Repository, CICD Pipeline, Image Registry, Code Quality, Helm Chart Repository 등의 분류로 도구를 등록한다.", "Tenant 코드는 사용자가 DevOps Console에 접속할 때 화면에 논리적으로 표시되는 이름이다.", "SCP Container Registry를 툴로 등록할 때 인증 타입으로 Access Key / Secret Key를 사용한다.", "프로젝트 그룹은 프로젝트그룹명, 프로젝트그룹 ID, 테넌트를 입력하여 생성한다.", "프로젝트를 생성하면 코드 저장소, 이미지 저장소, 파이프라인, 헬름 릴리즈, 인증 정보가 자동으로 구성된다."], "a": 1, "e": "Console 접속 시 논리적으로 표시되는 이름은 Tenant 명이고, Tenant 코드는 DevOps Console과의 연계를 위해 엔지니어가 시스템 내부적으로 사용하는 코드입니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드12, 14, 15, 23", "id": "3-9b-03"}, {"item": "3-5a", "t": "DBaaS vs 자체 구축", "q": "A 고객사는 Virtual Server에 MySQL을 직접 설치해 운영하는 방식과 SCP(Samsung Cloud Platform)의 MySQL(DBaaS)을 사용하는 방식을 비교하고 있습니다. 두 방식의 관리 측면 차이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["자체 구축 시에는 두 대 이상의 서버에 MySQL을 설치한 뒤 InnoDB Cluster 등으로 HA 또는 Replica를 직접 구성해야 한다.", "자체 구축 시에는 서버 간 네트워크 구성, 데이터 보호를 위한 보안 설정, 백업 구성을 별도로 수행해야 하며 운영 단계에서도 지속적인 관리가 필요하다.", "DBaaS를 사용하더라도 기반 서버의 OS 패치와 보안 설정은 사용자가 직접 수행하므로 보안 관리 부담은 자체 구축과 같다.", "DBaaS는 데이터베이스 구성 시 옵션 설정만으로 고가용성 구성에 필요한 작업이 자동화된다.", "관리형 서비스에서는 클라우드 사업자가 기반 서버의 OS·보안, 스토리지, 네트워크 영역을 관리하므로 사용자는 Application 기능에 집중할 수 있다."], "a": 2, "e": "Database 서비스 같은 관리형 서비스는 플랫폼 영역의 보안 관리(운영체제 패치, 보안 설정 등)를 서비스 제공자가 수행하므로 사용자의 보안 관리 부담이 줄어듭니다. 자체 구축은 설치부터 HA·백업·보안 구성까지 모두 사용자 몫입니다.", "src": "WA백서 01 p.20-21, WA백서 02 p.10", "id": "3-5a-01"}, {"item": "3-5a", "t": "DBaaS 확장 특성", "q": "SCP(Samsung Cloud Platform) Database(DBaaS) 서비스의 확장 및 운영 특성에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["PostgreSQL(DBaaS)은 노드를 수평으로 추가하는 Scale-Out을 지원하여 쓰기 처리량을 늘릴 수 있다.", "CacheStore(DBaaS)는 Read Replication을 구성해 읽기 요청을 복제 서버로 분산할 수 있다.", "운영 중 변경한 Parameter는 재시작 없이 즉시 반영된다.", "DBaaS는 Pay-as-you-go 방식으로, 실제 처리한 쿼리 용량(GB)에 따라 과금된다.", "서버 수를 늘리는 방식의 확장은 지원하지 않으며, 서버 타입 변경으로 수직 확장하고 Replica로 읽기 성능을 높인다."], "a": 4, "e": "DBaaS는 서버 수 확장 대신 Scale-Up과 Replica로 성능을 확보합니다. Scale-Out은 Data Analytics·AI/ML 서비스에서 지원하고, CacheStore는 Read Replication을 제공하지 않으며, Parameter는 재시작해야 반영되고, DBaaS는 Provisioning 방식 시간당 과금입니다.", "src": "WA백서 01 p.27, DB1_Database_정리 3.C·4.C, WA백서 06 p.5", "id": "3-5a-02"}, {"item": "3-5a", "t": "DBaaS 운영 단계", "q": "SCP(Samsung Cloud Platform) DBaaS의 생성과 운영은 Resource Provisioning → Service Configuration → Resource Management 3단계로 구분됩니다. 다음 중 Resource Management(운영 관리) 단계의 작업이 아닌 것은 무엇입니까?", "o": ["인스턴스 시작/중지/재시작/해지", "DB 유형·버전 선택과 사용자 계정·인증 정보 입력", "백업/복구 및 백업 주기 관리", "파라미터 조정, 리플리카 구성 등 성능 튜닝", "버전 업그레이드 및 마이그레이션"], "a": 1, "e": "DB 유형·버전 선택, 계정·인증 정보, 네트워크·스토리지·고가용성 여부 설정은 Service Configuration 단계입니다. Resource Management는 생성 이후의 수명주기, 보안, 백업, 성능 튜닝, 업그레이드, HA 상태 점검을 다룹니다.", "src": "DB1_Database_정리 1", "id": "3-5a-03"}, {"item": "3-5b", "t": "PostgreSQL 생성 설정", "q": "SCP(Samsung Cloud Platform)의 PostgreSQL(DBaaS)을 생성할 때 설정하는 항목에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["서버 타입은 일반 용도의 Standard와 고사양의 High Capacity 중에서 선택한다.", "Block Storage는 OS와 Data로 기본 구성되며, 필요 시 Temp, Archive, Backup 스토리지를 추가할 수 있다.", "Audit Log를 활성화하면 SQL 실행 이력과 접속 기록이 저장되지만, 성능에 영향을 줄 수 있어 필요할 때만 활성화한다.", "스토리지 종류는 SSD와 HDD 중 선택하며, 암호화가 필요하면 HDD_KMS를 선택해 KMS 암호화키로 추가 암호화한다.", "데이터베이스 구성에서 DB 이름, 사용자 이름, 비밀번호, 포트와 함께 문자 인코딩, 로케일, 시간대를 설정한다."], "a": 3, "e": "DBaaS의 스토리지 종류는 SSD와 SSD_KMS(SCP KMS 암호화키로 추가 암호화한 볼륨)입니다. HDD나 HDD_KMS 옵션은 없습니다.", "src": "DB1_Database_정리 3.B", "id": "3-5b-01"}, {"item": "3-5b", "t": "CacheStore 생성 설정", "q": "SCP(Samsung Cloud Platform)의 CacheStore(DBaaS) 생성 설정에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["고가용성이 필요하면 Sentinel 이중화를 선택하고 Replica 개수(1개 또는 2개)와 Sentinel Port를 지정한다.", "엔진은 Redis만 제공되며, 이미지·버전 선택 단계에서 Redis 버전을 선택한다.", "PostgreSQL과 동일하게 Temp, Archive, Backup 추가 스토리지를 구성할 수 있다.", "데이터베이스 구성 단계에서 DB 이름, 사용자 이름, 문자 인코딩을 입력한다.", "네트워크를 공통 설정으로 선택하더라도 서버별 IP는 사용자가 반드시 직접 입력해야 한다."], "a": 0, "e": "CacheStore는 Sentinel 이중화 시 Replica 1~2개와 Sentinel Port를 지정합니다. 엔진은 Redis 또는 Valkey이고, 추가 스토리지와 DB 이름·사용자명·인코딩은 제공하지 않으며, 공통 설정이면 IP가 자동 할당됩니다.", "src": "DB1_Database_정리 4.B", "id": "3-5b-02"}, {"item": "3-5b", "t": "DBaaS 보안 설정", "q": "A 고객사는 SCP(Samsung Cloud Platform)의 DBaaS를 도입하면서 다음과 같은 보안 요구사항을 정의했습니다. 요구사항과 DBaaS 설정의 연결로 옳지 않은 것은 무엇입니까?", "o": ["PostgreSQL에서 SQL 실행 이력과 접속 기록을 남겨야 한다 → Audit Log 활성화", "Redis에서 위험한 명령어를 함부로 실행하지 못하게 해야 한다 → Rename-Command로 명령어 이름 변경", "특정 IP 대역에서만 DB에 접근하도록 제한해야 한다 → IP 접근 제어 설정", "DB 볼륨을 SCP KMS 암호화키로 추가 암호화해야 한다 → 스토리지 종류로 SSD_KMS 선택", "CacheStore의 접속·명령 실행 이력을 남겨야 한다 → CacheStore 생성 시 Audit Log 활성화"], "a": 4, "e": "Audit Log는 PostgreSQL(RDB)에서 사용하는 기능이며 CacheStore에서는 제공하지 않습니다. CacheStore의 보안 기능은 Rename-Command입니다.", "src": "DB1_Database_정리 2·4.B·5", "id": "3-5b-03"}, {"item": "3-5c", "t": "DBaaS HA 구성", "q": "SCP(Samsung Cloud Platform) DBaaS의 고가용성(HA) 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["PostgreSQL(DBaaS)에서 Redundancy를 활성화하면 Active/Standby 인스턴스가 자동으로 구성된다.", "CacheStore는 Sentinel 기반 이중화로 마스터 장애 시 Replica가 자동 승격되어 서비스가 유지된다.", "CacheStore도 VPC Peering을 사전 구성하면 Cross Region DR Replication을 구성할 수 있다.", "CacheStore에서 Replica를 2개로 구성하면 각 서버에 Sentinel이 자동 분산 배포된다.", "CacheStore에서 Replica를 1개로 구성하면 Master + Replica + Sentinel 구조가 된다."], "a": 2, "e": "CacheStore는 Migration, DR Replication, Read Replication을 제공하지 않습니다. VPC Peering 기반 Cross Region 복제는 PostgreSQL(DBaaS)의 기능입니다.", "src": "DB1_Database_정리 3.C·4.C·5", "id": "3-5c-02"}, {"item": "3-5c", "t": "Read Replica 활용", "q": "A 고객사가 운영 중인 PostgreSQL(DBaaS)은 조회 트래픽이 급증하면서 응답이 지연되고 있으며, 쓰기 요청은 크게 늘지 않았습니다. A 고객사를 위한 제안으로 가장 적합한 것은 무엇입니까?", "o": ["PostgreSQL 노드를 수평 추가(Scale-Out)하여 쓰기·읽기 처리량을 모두 늘린다.", "Read Replica를 추가해 읽기 요청을 분산하고, 부하 테스트로 단계별 지연을 측정해 서버 타입을 조정한다.", "조회 결과 캐시용 CacheStore를 생성하고, CacheStore의 Read Replication으로 읽기 요청을 분산한다.", "Audit Log를 활성화하여 조회 쿼리의 실행 성능을 개선한다.", "Parameter 변경은 재시작 없이 즉시 반영되므로 운영 중 캐시 크기만 늘린다."], "a": 1, "e": "데이터베이스 읽기 부하는 Replica에서 수행하도록 구성하고, 부하 테스트로 지연을 측정해 서버 타입을 조정하는 것이 백서의 권장 방식입니다. PostgreSQL은 Scale-Out이 없고, CacheStore는 Read Replication이 없으며, Audit Log는 오히려 성능에 영향을 줍니다.", "src": "WA백서 01 p.42-43, DB1_Database_정리 3.C", "id": "3-5c-03"}, {"item": "3-5c", "t": "DR 수준(RTO/RPO)", "q": "SCP(Samsung Cloud Platform) WA 안정성 백서에서 RTO/RPO 목표에 따라 구분한 DR 수준에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Cold Level은 Active-Backup 구성으로 비용이 가장 낮지만 RTO가 수주, RPO가 수일 수준이다.", "Warm Level은 Active-Replica 구성으로 일반 시스템에 적용하며 RPO는 수 시간 수준이다.", "Hot Level은 Active-Standby 구성으로 RPO 0을 목표로 하는 중요 시스템에 적용한다.", "Hot Level은 Main과 DR 간 자동 Failover가 이루어지므로 RTO가 수 분 이내로 보장된다.", "Cold Level은 재해 복구 시 DR 센터에 신규로 시스템 자원을 할당하고 구성해야 한다."], "a": 3, "e": "표 3-11에서 Hot Level의 복구 방식은 수동 Failover이고 RTO는 수 시간입니다. Warm Level도 수동 Failover와 자원 할당·증설로 복구합니다.", "src": "WA백서 03 p.21", "id": "3-5c-04"}, {"item": "3-5d", "t": "DBaaS 백업 방식", "q": "SCP(Samsung Cloud Platform) DBaaS의 백업 방식에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["백업본 보존 기간은 2주~1년 범위에서 설정하며, 백업본은 SCP가 관리하는 저장소에 저장된다.", "DBaaS 백업은 별도의 Backup 서비스가 아닌 Database 서비스의 내장 기능으로 제공된다.", "데이터 백업은 1일 주기, 아카이브 백업은 5분~1시간 주기로 수행된다.", "데이터 백업과 아카이브 백업을 모두 수행한다.", "백업본 저장소로 사용할 Object Storage 버킷은 사용자가 직접 생성해 지정해야 한다."], "a": 0, "e": "DBaaS 백업본 보존 기간은 7일~35일이고 저장소는 사용자 관리 Object Storage입니다. 2주~1년, SCP 관리 저장소는 Virtual Server·Bare Metal Server용 Backup 서비스의 기준입니다.", "src": "WA백서 03 p.13·15", "id": "3-5d-01"}, {"item": "3-5d", "t": "DBaaS 복구", "q": "SCP(Samsung Cloud Platform) DBaaS의 데이터베이스를 백업본으로 복구하는 방식에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["백업본을 기존 운영 중인 DB 서버에 직접 덮어써서 복구한다.", "복구는 가장 최근 Full Backup 시점으로만 가능하며 특정 시점 복구는 지원하지 않는다.", "백업본으로 새로운 데이터베이스를 생성한 뒤, 생성한 데이터베이스를 Master 데이터베이스로 전환한다.", "백업 이력은 콘솔에서 조회만 가능하고 삭제할 수 없다.", "Backup으로부터 Database를 복구하는 복원력 테스트는 최소 5분 이내 완료를 목표로 한다."], "a": 2, "e": "DBaaS는 기존 서버에 백업본을 직접 복구하지 않고, 백업본으로 새 데이터베이스를 만든 뒤 Master로 전환합니다. 특정 시점 복구와 콘솔에서의 백업 이력 확인·삭제가 가능하며, 복원력 테스트 예상 시간은 최대 60분입니다.", "src": "WA백서 03 p.15, DB1_Database_정리 3.C, WA백서 01 p.42-43", "id": "3-5d-02"}, {"item": "3-5d", "t": "CacheStore 백업", "q": "SCP(Samsung Cloud Platform) DBaaS의 엔진별 백업 및 복구에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["CacheStore는 AOF 또는 RDB 파일 기반으로 백업하며 백업 파일은 Object Storage에 저장된다.", "CacheStore는 콘솔에서 백업 주기, 보관 기간, 백업 이력을 확인할 수 있다.", "PostgreSQL(DBaaS)은 정기적인 Full Backup과 Archive Backup을 수행한다.", "AOF는 특정 시점의 메모리 전체를 스냅샷 파일로 저장하고, RDB는 들어온 쓰기 명령을 로그로 계속 기록한다.", "CacheStore도 필요 시 특정 시점 복구를 수행할 수 있다."], "a": 3, "e": "설명이 서로 뒤바뀌었습니다. RDB가 특정 시점 메모리 전체의 스냅샷이고, AOF(Append Only File)가 쓰기 명령을 로그로 계속 기록하는 방식입니다.", "src": "DB1_Database_정리 3.C·4.C", "id": "3-5d-03"}, {"item": "3-6a", "t": "API Gateway 구성요소", "q": "SCP(Samsung Cloud Platform) API Gateway의 구성요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["리소스는 /users, /orders처럼 API 내의 특정 엔드포인트(URI 경로) 단위이다.", "스테이지는 dev, test, prod처럼 API가 배포되는 특정 환경이다.", "통합은 API 메서드와 백엔드 서비스(Function, DB, SCP 서비스 등) 간의 연결 방식을 정의한다.", "JWT는 인증 및 권한 부여를 위해 사용하는 토큰 기반 웹 표준이다.", "엔드포인트는 서로 다른 출처의 서버 간 리소스 접근을 허용하는 웹 표준 보안 정책이다."], "a": 4, "e": "서로 다른 출처 간 리소스 접근을 허용하는 웹 표준 보안 정책은 CORS입니다. 엔드포인트는 클라이언트가 API에 접근할 때 사용하는 고유 URL입니다.", "src": "ApplicationService_1_API_Gateway 슬라이드8-9", "id": "3-6a-01"}, {"item": "3-6a", "t": "API Gateway 구현 절차", "q": "SCP(Samsung Cloud Platform) API Gateway로 API를 생성하고 서비스하는 절차를 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄹ → ㄱ → ㅁ → ㄷ", "ㄱ → ㄴ → ㄹ → ㄷ → ㅁ", "ㄴ → ㄱ → ㄹ → ㅁ → ㄷ", "ㄴ → ㄱ → ㄷ → ㄹ → ㅁ", "ㄴ → ㅁ → ㄱ → ㄹ → ㄷ"], "a": 2, "e": "API 생성 → 리소스 생성 → 메서드 생성 → API 배포(스테이지 생성) → 스테이지 상세 수정에서 CORS·JWT·IP Restriction 설정 순입니다. 보안 설정은 스테이지 단위이므로 배포로 스테이지가 생긴 뒤에 합니다.", "src": "ApplicationService_1_API_Gateway 슬라이드12-19", "s": "ㄱ. API 안에 리소스(URI 경로)를 생성한다\nㄴ. API명을 입력하고 '새로 생성' 또는 '기존 API 복제' 방식으로 API를 생성한다\nㄷ. 스테이지에 CORS, JWT, IP Restriction을 설정한다\nㄹ. 메서드 유형과 통합 유형(HTTP 또는 Cloud Function)을 지정해 메서드를 생성한다\nㅁ. 스테이지를 지정(또는 신규 생성)하여 API를 배포한다", "fix": true, "id": "3-6a-02"}, {"item": "3-6a", "t": "API Gateway 기능", "q": "SCP(Samsung Cloud Platform) API Gateway의 기능 및 구현에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["메서드의 통합 유형으로 HTTP 엔드포인트 URL 또는 Cloud Function을 선택해 백엔드와 연결할 수 있다.", "OPTIONS 메서드는 응답 바디 없이 헤더(메타데이터)만 조회할 때 사용한다.", "서버를 설정하거나 관리할 필요가 없는 완전 관리형 서비스로, 사용량 기반 요금 체계로 비용 효율적으로 운영할 수 있다.", "URL 패턴에 따라 요청을 Virtual Server, Kubernetes Engine, Cloud Functions 등 서로 다른 백엔드로 라우팅할 수 있다.", "API Gateway를 도입하면 서비스 규약을 중앙에서 관리하고, 과도한 요청을 일정 수준에서 제한(Throttling)할 수 있다."], "a": 1, "e": "본문 없이 헤더만 조회하는 메서드는 HEAD입니다. OPTIONS는 해당 엔드포인트가 지원하는 HTTP 메서드 목록을 조회합니다.", "src": "ApplicationService_1_API_Gateway 슬라이드7·11·14-15, WA백서 01 p.26", "id": "3-6a-03"}, {"item": "3-6b", "t": "Load Balancer vs Message Queue", "q": "A 고객사는 웹 계층과 애플리케이션 계층 간의 결합을 해제하려 합니다. 결합 해제 방식에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Load Balancer는 동기(Synchronous) 통신 기반의 실시간 요청 처리에 적합하다.", "Load Balancer는 동일한 기능을 수행하는 여러 서버 간 트래픽을 분산해 고가용성 확보에 기여한다.", "Message Queue Service는 서로 다른 기능을 수행하는 여러 서버 간의 결합을 느슨하게 만드는 데 적합하다.", "Message Queue Service는 소비자(Consumer)가 준비되지 않았을 때 도착한 메시지가 유실되므로 소비자를 항상 가동해야 한다.", "웹 계층이 애플리케이션 서버 IP를 직접 지정해 호출하면, 해당 서버 중단 시 그 서버로 향하는 요청이 유실될 수 있다."], "a": 3, "e": "Message Queue Service에서 메시지는 큐에 안전하게 저장되므로 소비자가 준비되었을 때 처리할 수 있고, 이 덕분에 복원력 있는 구조가 됩니다. 교재에 Queue Service 단원이 없어 WA 가용성 백서의 Message Queue Service 내용을 근거로 했습니다.", "src": "WA백서 01 p.14-15 (Message Queue Service; 교재에 Queue Service 단원 없음)", "id": "3-6b-02"}, {"item": "3-6b", "t": "Message Queue 배치 위치", "q": "3계층 웹 서비스에서 Message Queue Service의 배치 위치와 보안 구성에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["VPC 외부 사용자와 워크로드 사이의 North-South 영역에 Firewall, WAF, IPS와 함께 배치되어 외부 공격을 차단한다.", "VPC 내부 East-West 영역에 Load Balancer 등과 함께 배치되며, 서버 그룹 간 통신은 Security Group으로 보호한다.", "Message Queue Service를 배치하면 서버 그룹 간 통신이 모두 큐를 거치므로 Security Group 구성이 필요 없다.", "Web Server, Application Server, DB Server 간 트래픽은 North-South 트래픽에 해당한다.", "송신(Outbound) 트래픽의 송신자 IP 주소는 VPC 외부 서비스 사용자의 IP 주소가 된다."], "a": 1, "e": "Load Balancer, Message Queue Service 같은 성능 향상 장치는 VPC 내부 East-West 영역에 배치하고, 서버 그룹 간 통신은 분산 방화벽(Security Group)으로 보호합니다. North-South 영역에는 Firewall, WAF, IPS가 배치됩니다.", "src": "WA백서 02 p.31 (Message Queue Service; 교재에 Queue Service 단원 없음)", "id": "3-6b-03"}, {"item": "3-6b", "t": "Message Queue 결합 해제 시나리오", "q": "온라인 쇼핑몰을 운영하는 A 고객사는 주문 접수 웹 계층과 주문 처리 애플리케이션 계층이 강하게 결합되어 있어, 주문 처리 서버 일부가 지연되면 주문 접수까지 실패하는 문제를 겪고 있습니다. A 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["웹 서버에 주문 처리 서버의 IP 주소를 직접 지정해 호출하게 하여 중간 구성 요소를 없애고 종속성을 줄인다.", "두 계층 사이에 Message Queue Service를 두어 주문 메시지를 큐에 저장하고, 주문 처리 서버가 준비되면 처리하게 한다.", "전체 종속성 목록을 유지 관리하고, 중요한 종속성 항목은 최소화하며 중복 구성한다.", "동일 기능을 수행하는 웹 서버 그룹 앞에는 Load Balancer를 두어 트래픽을 분산한다.", "주문 처리 서버를 상태 비저장(Stateless)으로 구현하고, 상태 관리 데이터는 CacheStore(DBaaS)에 저장한다."], "a": 0, "e": "서버 IP를 직접 지정하면 오히려 강한 결합이 생기고, 서버 중단 시 요청이 유실됩니다. 백서는 Load Balancer나 비동기 메시징으로 요청과 응답을 결합 해제하라고 권장합니다.", "src": "WA백서 01 p.13-16", "id": "3-6b-04"}, {"item": "3-7a", "t": "분석 파이프라인 순서", "q": "A 고객사는 웹서버 로그와 사용자 행동 데이터를 결합해 분석하는 파이프라인을 설계하고 있습니다. 웹서버 로그의 처리 흐름을 수집부터 시각화까지 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄱ → ㄷ → ㅁ → ㄴ → ㄹ", "ㄷ → ㅁ → ㄱ → ㄴ → ㄹ", "ㄷ → ㄱ → ㄴ → ㅁ → ㄹ", "ㄷ → ㄱ → ㅁ → ㄹ → ㄴ", "ㄷ → ㄱ → ㅁ → ㄴ → ㄹ"], "a": 4, "e": "수집(Filebeat) → 처리(Logstash 파싱) → 저장(Elasticsearch 인덱싱) → 분석(Trino Federated Query 조인) → 시각화(BI) 순입니다. Logstash가 Elasticsearch보다 앞에서 필터링한다는 점을 헷갈리지 않아야 합니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드8·11", "s": "ㄱ. Logstash가 Grok 필터로 로그를 파싱하고 날짜 필터로 타임스탬프를 변환한다\nㄴ. Trino가 MySQL과 Elasticsearch의 데이터를 이동 없이 In-Memory로 조인한다\nㄷ. Filebeat가 NGINX Access 로그를 수집해 전송한다\nㄹ. 조인 결과를 Looker Studio, Tableau 등 BI 도구로 시각화한다\nㅁ. 파싱된 로그가 Elasticsearch에 인덱싱되어 저장된다", "fix": true, "id": "3-7a-01"}, {"item": "3-7a", "t": "단계별 기술 선택", "q": "SCP(Samsung Cloud Platform)에서 Cloud Data Lake 기반 분석 파이프라인을 구성할 때, 단계별 요구사항과 기술 선택의 연결로 옳지 않은 것은 무엇입니까?", "o": ["조직 특화 포맷의 데이터 소스를 수집·전처리해야 한다 → 사용자 정의 Processor를 NAR 파일로 패키징해 NiFi에 배포", "수집 → 전처리 → 적재(ETL) 배치 작업을 스케줄링하고 실패 시 재시도해야 한다 → Airflow DAG", "대규모 테이블의 스냅샷과 변경 이력을 관리하고 특정 시점 데이터를 조회해야 한다 → Apache Iceberg", "Kafka의 주문 메시지와 MySQL의 고객 정보를 데이터 이동 없이 SQL로 조인해야 한다 → Logstash", "인덱싱된 로그의 404 비율, IP별 요청 수를 대시보드로 시각화해야 한다 → Kibana"], "a": 3, "e": "이기종 저장소의 데이터를 이동 없이 SQL로 조인하는 것은 Trino(Federated Query)의 역할입니다. Logstash는 로그를 수집·필터링해 Elasticsearch로 보내는 파이프라인 구성 요소입니다.", "src": "DataAnalytics_1 슬라이드4·8, DataAnalytics_3_Data_Lake 슬라이드4", "id": "3-7a-02"}, {"item": "3-7a", "t": "데이터 특성별 서비스 선택", "q": "제조사 A는 온프레미스 분석 시스템을 SCP(Samsung Cloud Platform)로 이전하면서 데이터 특성에 맞는 저장·분석 서비스를 선택하려 합니다. 제조사 A를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["주문·결제 등 복잡한 비즈니스 트랜잭션은 관계형 DBaaS(PostgreSQL, MySQL 등) 기반 OLTP로 처리한다.", "고객·주문·상품 테이블 간 복잡한 조인이 필요한 분석은 수평 확장이 쉬운 NoSQL(CacheStore)로 처리한다.", "대규모 구조화 데이터의 집계 분석은 Vertica(DBaaS)의 MPP 분석 환경을 활용한다.", "대량 데이터를 짧은 지연 시간과 높은 처리량으로 검색해야 하는 요구는 Search Engine을 활용한다.", "노드 수평 확장(Scale-Out)이 필요한 분석 워크로드는 PostgreSQL(DBaaS)보다 Data Analytics 서비스를 검토한다."], "a": 1, "e": "NoSQL은 테이블·엔티티 조인 같은 복잡한 쿼리를 지원하지 않아 이 경우 관계형 데이터베이스가 더 적합합니다. CacheStore는 캐싱이나 애플리케이션 상태 저장 용도입니다.", "src": "WA백서 04 p.37-38, DB1_Database_정리 3.C", "id": "3-7a-03"}, {"item": "3-7b", "t": "Event Streams - AKHQ", "q": "SCP(Samsung Cloud Platform) Event Streams(Apache Kafka) 운영에 활용하는 AKHQ에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["AKHQ로 Kafka 클러스터를 관리하려면 반드시 Zookeeper에 직접 접근하도록 연동해야 한다.", "토픽, 파티션, 메시지, 컨슈머 그룹 등을 웹 브라우저에서 조회하고 관리할 수 있다.", "Kafka 브로커의 노드 상태와 컨슈머 그룹의 Lag 정보를 시각화할 수 있다.", "Schema Registry와 Kafka Connect를 관리할 수 있다.", "Docker, Kubernetes 등 다양한 환경에 간단히 배포할 수 있어 Kafka 실습 환경에도 적합하다."], "a": 0, "e": "AKHQ는 별도의 Zookeeper 접근 없이 Kafka 클러스터만으로 연동됩니다. 운영자·개발자가 브라우저에서 Kafka 상태를 실시간으로 확인하고 디버깅하는 도구입니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드4·6·14 (Event Streams↔Kafka 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "id": "3-7b-01"}, {"item": "3-7b", "t": "Event Streams 운영·SLA", "q": "SCP(Samsung Cloud Platform) Event Streams의 운영 특성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Event Streams의 SLA 장애 시간은 회사(SDS)의 사유로 해당 월에 발생한 장애 시간의 합으로 정의한다.", "Logstash는 Kafka를 포함한 다양한 로그 소스에서 데이터를 수집·전처리해 Elasticsearch로 전송할 수 있다.", "가동 중인 멀티 인스턴스 중 하나라도 외부 연결이 1분 이상 끊기면 Event Streams의 SLA 장애로 인정된다.", "Event Streams는 Cloud Monitoring의 성능 모니터링과 로그 모니터링 대상에 모두 포함된다.", "Event Streams는 Cost Savings와 Planned Compute 요금제의 할인 적용 대상이다."], "a": 2, "e": "Event Streams는 DBaaS, Search Engine과 같이 '가동 중인 멀티 인스턴스 또는 개별 서비스가 모두 외부 연결 및 접속을 5분 이상 확보하지 못하는 경우'를 장애로 정의합니다. 하나만 끊기거나 1분 단위가 아닙니다.", "src": "WA백서 01 p.7, WA백서 05 p.27, WA백서 06 p.8, DataAnalytics_1 슬라이드4", "id": "3-7b-02"}, {"item": "3-7b", "t": "Event Streams 사용 사례", "q": "온라인 쇼핑몰을 운영하는 B사는 사용자의 클릭, 검색, 장바구니 담기 같은 행동 이벤트를 실시간으로 수집해 MySQL의 user_behavior 테이블에 적재하려 합니다. B사에 가장 적합한 구성은 무엇입니까?", "o": ["Filebeat → Kibana → MySQL 순으로 이벤트를 전달한다.", "Airflow DAG의 schedule_interval을 매일 자정으로 설정해 이벤트를 MySQL에 적재한다.", "Iceberg 테이블에 이벤트를 기록한 뒤 Time Travel 기능으로 MySQL에 동기화한다.", "Kafka로 이벤트를 실시간 스트리밍하고, Kafka Connector 또는 Stream Processor를 통해 MySQL에 적재한다.", "Trino Federated Query로 이벤트를 수집해 MySQL에 영구 저장한다."], "a": 3, "e": "교재의 시나리오에서 사용자 행동 이벤트는 Kafka로 실시간 스트리밍된 뒤 Kafka Connector 또는 Stream Processor를 통해 MySQL에 적재됩니다. Airflow DAG는 배치 기반이고, Trino는 조회·조인 엔진입니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드11 (Event Streams↔Kafka 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "id": "3-7b-03"}, {"item": "3-7c", "t": "Search Engine", "q": "SCP(Samsung Cloud Platform) Search Engine과 그 기반인 Elasticsearch에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Search Engine은 데이터 분석을 위한 ElasticSearch 생성과 설정을 자동화하여 제공한다.", "Search Engine은 VM에 배포되며, 클러스터 및 Replica 구성을 통해 가용성과 성능을 향상시킬 수 있다.", "짧은 지연 시간과 높은 처리량으로 대량 데이터를 검색해야 하는 경우 검색 엔진 기술을 사용한다.", "Elasticsearch는 수집된 데이터를 인덱싱해 검색 가능한 형태로 저장하고, Kibana가 그 위에 대시보드와 시각화를 제공한다.", "Elasticsearch가 Grok 필터로 정규 표현식 기반의 로그 파싱을 수행한 뒤 Logstash로 데이터를 전달한다."], "a": 4, "e": "Grok 필터로 로그를 파싱하는 것은 Logstash이며, 데이터는 Logstash에서 Elasticsearch로 전달됩니다. 방향과 역할이 뒤바뀌었습니다.", "src": "WA백서 04 p.38, DataAnalytics_1_Data_Processing 슬라이드4·8", "id": "3-7c-01"}, {"item": "3-7c", "t": "ELK 구성 요소", "q": "Search Engine(Elasticsearch)과 함께 구성하는 ELK Stack 기반 로그 분석 구성 요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Beats는 다양한 데이터 소스를 Elasticsearch 또는 Logstash로 전송하는 경량 데이터 수집기이다.", "Metricbeat는 시스템 및 서비스의 메트릭을 수집해 전송한다.", "Packetbeat는 서버의 로그 파일을 수집해 전송하고, Filebeat는 네트워크 트래픽을 실시간 분석해 전송한다.", "Kibana의 Discover 탭에서는 실시간 로그를 탐색할 수 있다.", "Kibana의 Dashboard는 여러 시각화 결과를 통합해 운영 대시보드를 구성한다."], "a": 2, "e": "역할이 뒤바뀌었습니다. Packetbeat가 네트워크 트래픽을 실시간 분석해 전송하고, Filebeat가 로그 파일을 수집해 전송합니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드8", "id": "3-7c-02"}, {"item": "3-7c", "t": "Logstash → Elasticsearch 설정", "q": "다음은 웹서버 로그를 Search Engine(Elasticsearch)에 적재하기 위한 Logstash 설정(logstash.conf)입니다. 이에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["로그가 날짜별 인덱스(예: nginx-logs-2025.08.03)로 나뉘어 저장된다.", "Logstash는 9200 포트로 Beats의 데이터를 수신한다.", "date 필터가 Apache 로그에서 IP 주소와 요청 메서드를 추출한다.", "처리 결과는 Kibana로 직접 전송되어 저장된다.", "grok 필터는 로그 파일을 수집하는 경량 수집기 역할을 한다."], "a": 0, "e": "index 설정에 날짜 패턴이 들어 있어 nginx-logs-YYYY.MM.dd 형태의 일자별 인덱스가 생성됩니다. Beats 수신 포트는 5044, 9200은 Elasticsearch 주소이며, IP·메서드 추출은 grok, 타임스탬프 변환은 date 필터가 담당합니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드8", "s": "input { beats { port => 5044 } }\nfilter {\n  grok { match => { 'message' => '%{COMBINEDAPACHELOG}' } }\n  date { match => [ 'timestamp', 'dd/MMM/yyyy:HH:mm:ss Z' ] }\n}\noutput { elasticsearch { hosts => ['http://localhost:9200']  index => 'nginx-logs-%{+YYYY.MM.dd}' } }", "id": "3-7c-03"}, {"item": "3-7d", "t": "Data Flow - NiFi 용어", "q": "SCP(Samsung Cloud Platform) Data Flow의 기반인 Apache NiFi의 용어에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["FlowFile은 NiFi에서 단일 데이터를 나타내며, 속성과 콘텐츠로 구성된다.", "DataFlow Manager는 NiFi 인스턴스에서 발생하는 통계 보고서를 제공하는 백그라운드 작업이다.", "Controller Service는 다른 구성 요소가 사용할 수 있도록 정보를 제공하는 확장 포인트이다.", "Process Group은 복잡한 데이터 흐름을 높은 추상 수준에서 관리하기 위해 여러 구성 요소를 묶은 것이다.", "Template은 데이터 흐름의 일부 또는 전체를 템플릿으로 만들어 재사용하는 기능이다."], "a": 1, "e": "통계 보고서를 제공하는 백그라운드 작업은 Reporting Task입니다. DataFlow Manager는 데이터 흐름의 구성 요소를 추가·제거·수정할 권한을 가진 사용자입니다.", "src": "DataAnalytics_3_Data_Lake 슬라이드6 (Data Flow↔NiFi 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "id": "3-7d-01"}, {"item": "3-7d", "t": "Data Ops - Airflow DAG", "q": "A 고객사는 Data Ops 환경에서 다음과 같은 Airflow DAG를 작성했습니다. 이에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["b가 끝난 뒤 c가 실행되고, c가 끝난 뒤 d가 실행된다.", "schedule_interval '0 0 * * *'에 따라 매시 정각마다 DAG가 실행된다.", "start_date는 DAG 실행을 종료할 기준 날짜이다.", "a가 완료되면 b와 c가 병렬로 실행되고, b와 c가 모두 끝난 뒤 d가 실행된다.", "DAG 전체가 성공했을 때 알림을 보내려면 schedule_interval에 알림 함수를 지정한다."], "a": 3, "e": "a >> [b, c] >> d는 a 이후 b·c가 병렬로 실행되고 둘 다 끝나면 d가 실행된다는 의존성 정의입니다. '0 0 * * *'은 매일 자정이고, start_date는 스케줄 시작 기준일이며, 성공 알림은 on_success_callback으로 지정합니다.", "src": "DataAnalytics_3_Data_Lake 슬라이드8 (Data Ops↔Airflow 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "s": "with DAG(dag_id='my_workflow', start_date=datetime(2024, 1, 1),\n         schedule_interval='0 0 * * *', catchup=False) as dag:\n    a = PythonOperator(task_id='a', python_callable=fetch_data)\n    b = PythonOperator(task_id='b', python_callable=preprocess)\n    c = PythonOperator(task_id='c', python_callable=aggregate)\n    d = PythonOperator(task_id='d', python_callable=generate_report)\n    a >> [b, c] >> d", "id": "3-7d-02"}, {"item": "3-7d", "t": "Data Ops / Data Flow 사용 사례", "q": "SCP(Samsung Cloud Platform)의 Data Ops(Airflow)와 Data Flow(NiFi)의 기능 및 사용 사례에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["NiFi 기본 Processor로 대부분의 ETL 시나리오를 구현할 수 있으며, 복잡한 비즈니스 로직이나 외부 연동은 사용자 정의 Processor로 구현한다.", "NAR 파일은 사용자 정의 Processor나 Controller Service를 패키징한 플러그인 단위로, Flow Controller에 Extension으로 배포된다.", "Airflow DAG는 데이터 수집 → 전처리 → 적재(ETL) 단계별 논리를 시각화하고 스케줄링·재시도·오류 감지 기능을 제공한다.", "Airflow DAG는 배치 기반 데이터 분석 작업을 재현 가능하고 관리 가능한 방식으로 실행한다.", "NAR 파일을 배포하면 Airflow의 DAG(Task 흐름)가 자동으로 생성되어 워크플로가 스케줄링된다."], "a": 4, "e": "NAR는 NiFi의 기능을 확장하는 플러그인 패키지일 뿐 DAG를 생성하지 않습니다. DAG는 Airflow에서 Task와 의존성을 코드로 직접 정의합니다.", "src": "DataAnalytics_3_Data_Lake 슬라이드4·6·14·19 (Data Ops/Data Flow↔Airflow/NiFi 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "id": "3-7d-03"}, {"item": "3-7e", "t": "Vertica MPP", "q": "SCP(Samsung Cloud Platform) Vertica(DBaaS)의 MPP 아키텍처에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["클라이언트가 연결한 노드가 Initiator가 되어 쿼리를 파싱하고 실행 계획을 수립한다.", "Initiator 노드는 실행 계획을 Executor 노드들에 분배하고, 모든 노드의 결과를 취합해 사용자에게 반환한다.", "Name Node가 Initiator 역할을 전담하므로, Name Node 장애에 대비한 별도 이중화가 필요하다.", "노드 간 공유 디스크가 없는 Shared-Nothing 구조로, 장애 시 다른 노드에 미치는 영향을 최소화한다.", "노드 수를 조정할 수 있으며, 클러스터 확장을 통해 성능을 선형적으로 향상시킬 수 있다."], "a": 2, "e": "Vertica는 모든 노드가 동등한(Peer) Masterless 구조로, 어느 노드든 Initiator가 될 수 있고 Name Node나 단일 장애 지점이 없습니다.", "src": "DataAnalytics_2_Data_Warehouse 슬라이드4·8", "id": "3-7e-02"}, {"item": "3-7e", "t": "Vertica K-Safe", "q": "A 고객사는 Vertica(DBaaS) 클러스터를 K-Safe 설계에서 K=2로 구성했습니다. 이에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["데이터는 최소 2개 노드에 복제되며, 1개 노드 장애까지 고가용성이 보장된다.", "데이터는 최소 3개 노드에 복제되며, 2개 노드가 장애를 일으켜도 고가용성과 복구가 보장된다.", "데이터는 최소 2개 노드에 복제되며, 2개 노드가 장애를 일으켜도 고가용성이 보장된다.", "데이터는 최소 4개 노드에 복제되며, 3개 노드 장애까지 고가용성이 보장된다.", "K-Safe는 데이터를 복제하지 않고 장애 노드의 작업만 다른 노드로 재분배하는 방식이다."], "a": 1, "e": "교재는 '데이터는 최소 K+1개의 노드에 복제되어, K개의 노드가 장애를 일으켜도 고가용성과 복구가 보장'된다고 설명합니다. K=2이면 최소 3개 노드에 복제되고 2개 노드 장애를 견딥니다.", "src": "DataAnalytics_2_Data_Warehouse 슬라이드8·14", "id": "3-7e-03"}, {"item": "3-7e", "t": "Vertica 기능·과금", "q": "SCP(Samsung Cloud Platform) Vertica(DBaaS)의 기능 및 과금에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["동일한 열에 유사한 데이터가 반복되므로 고효율 압축 알고리즘을 적용해 저장 공간을 최소화하고 캐시 효율을 높인다.", "MPP 기반으로 실시간 대시보드, 빅데이터 분석, 머신러닝 예측 등 복잡한 분석 작업을 지원한다.", "데이터를 여러 노드에 자동 복제하고, 장애 발생 시 자동 페일오버로 시스템 가용성을 유지한다.", "요청 건수나 스캔 용량에 따라 과금되는 서비스이므로, 사용하지 않는 시간에는 비용이 발생하지 않는다.", "실시간 및 연속 데이터 로드와 쿼리를 지원한다."], "a": 3, "e": "Vertica(DBaaS)는 Event Streams, Search Engine과 함께 Provisioning 방식의 시간당(Per Hour) 과금 서비스이므로 사용하지 않아도 배포된 동안 비용이 발생합니다. 용량(GB) 기반 Pay-as-you-go는 Data Query입니다.", "src": "WA백서 06 p.5, DataAnalytics_2_Data_Warehouse 슬라이드4·8", "id": "3-7e-04"}, {"item": "3-7f", "t": "Quick Query SLA", "q": "SCP(Samsung Cloud Platform)의 서비스별 SLA 장애 정의 및 가용률 산정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Quick Query의 월 가용률은 장애 시간(분)의 합을 서비스 이용 월 총 시간(분)으로 나누어 산정한다.", "Quick Query는 SQL 쿼리 요청이 외부 연결 및 접속을 5분 이상 확보하지 못하는 경우를 장애로 정의한다.", "API Gateway는 요청에 대해 500 또는 503 오류 코드를 반환하는 경우를 장애로 정의한다.", "Backup은 고객 요청 백업이 실패한 경우를 장애로 보되, 재수행에 성공한 경우는 제외한다.", "DBaaS, Event Streams, Search Engine은 장애 시간(분) 기반으로 월 가용률을 산정한다."], "a": 0, "e": "Quick Query의 월 가용률은 [1 - (장애 건수의 합 / 서비스 이용 월 총 건수의 합)] × 100으로 건수 기반입니다. 시간(분) 기반 산정은 DBaaS, Event Streams, Search Engine 등입니다.", "src": "WA백서 01 p.7-8", "id": "3-7f-01"}, {"item": "3-7f", "t": "Quick Query - Federated Query", "q": "SCP(Samsung Cloud Platform) Quick Query의 기반인 Trino Federated Query에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Kafka, MySQL, PostgreSQL, Elasticsearch, Hive, Iceberg 등 서로 다른 저장소의 데이터를 하나의 SQL로 조회할 수 있다.", "커넥터 기반으로 각 소스의 메타데이터를 조회한 후, 실행 전 분석(Planning) 단계에서 쿼리 최적화를 수행한다.", "정확한 조인을 위해 쿼리 실행 전 모든 소스의 데이터를 중앙 데이터베이스로 복제·적재한 뒤 분석한다.", "조인이 Trino의 메모리에서(In-Memory) 수행되므로 데이터 이동 없이 빠르게 분석할 수 있다.", "Cloud Data Lake에서 여러 저장소를 연결하는 데이터 통합 분석 플랫폼의 허브 역할을 수행한다."], "a": 2, "e": "Federated Query는 데이터가 위치한 저장소 그대로, 복제·이동 없이 In-Memory로 통합 쿼리를 실행하는 것이 핵심입니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드4·11·20 (Quick Query↔Trino 대응은 일반지식, samsungsds.com 상품 페이지로 확인)", "id": "3-7f-02"}, {"item": "3-7f", "t": "Trino-Iceberg 조회 흐름", "q": "Quick Query(Trino)에서 Iceberg 테이블을 SQL로 조회할 때의 내부 처리 단계를 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄹ → ㄱ → ㄷ", "ㄴ → ㄱ → ㄹ → ㄷ", "ㄹ → ㄴ → ㄱ → ㄷ", "ㄴ → ㄹ → ㄷ → ㄱ", "ㄱ → ㄴ → ㄹ → ㄷ"], "a": 0, "e": "Catalog 조회 → 메타데이터 열람 → 매니페스트 탐색 → 데이터 읽기 순입니다. 매니페스트 정보로 읽을 파일을 먼저 걸러내기 때문에 필요한 파일만 읽는 Partition Pruning이 가능합니다.", "src": "DataAnalytics_3_Data_Lake 슬라이드10-11", "s": "ㄱ. 매니페스트를 탐색해 읽어야 할 데이터 파일 목록을 추출(필터링 포함)한다\nㄴ. Iceberg Catalog에서 테이블의 최신 메타데이터 파일 위치를 조회한다\nㄷ. 필요한 데이터 파일만 병렬로 읽어 결과를 생성한다\nㄹ. 메타데이터 파일에서 스냅샷 ID, 스키마, 파티션 정보, manifest list를 추출한다", "fix": true, "id": "3-7f-03"}, {"item": "3-1a", "t": "Subnet CIDR 계산", "q": "A사는 SCP(Samsung Cloud Platform)의 VPC(172.16.0.0/16) 안에 172.16.10.0/27 대역으로 Subnet을 생성했습니다. 이 Subnet의 Gateway IP와 하위 자원에 할당 가능한 IP 범위로 옳은 것은 무엇입니까?", "o": ["Gateway IP 172.16.10.0 / 할당 범위 172.16.10.1 ~ 172.16.10.30", "Gateway IP 172.16.10.1 / 할당 범위 172.16.10.2 ~ 172.16.10.30", "Gateway IP 172.16.10.1 / 할당 범위 172.16.10.2 ~ 172.16.10.31", "Gateway IP 172.16.10.30 / 할당 범위 172.16.10.1 ~ 172.16.10.29", "Gateway IP 172.16.10.1 / 할당 범위 172.16.10.2 ~ 172.16.10.62"], "a": 1, "e": "/27은 2^(32-27)=32개 주소(172.16.10.0~31)이고, Gateway IP는 대역 내 두 번째 값(.1)으로 자동 지정됩니다. 할당 범위는 Gateway 다음 값(.2)부터 마지막 전 IP(.30)까지라서 3개 IP는 쓸 수 없습니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드16, Networking 개요 슬라이드10", "id": "3-1a-03"}, {"item": "3-1a", "t": "VPC CIDR 범위", "q": "B사는 SCP(Samsung Cloud Platform)에서 VPC를 10.20.0.0/22 대역으로 생성했습니다. 다음 중 이 VPC 안에 생성할 수 없는 Subnet IP 대역은 무엇입니까?", "o": ["10.20.0.0/24", "10.20.2.0/23", "10.20.3.240/28", "10.20.4.0/24", "10.20.1.128/25"], "a": 3, "e": "/22는 1,024개 IP로 10.20.0.0 ~ 10.20.3.255 범위입니다. Subnet은 VPC IP 대역 안에서만 생성할 수 있으므로 10.20.4.0/24는 만들 수 없고, 나머지는 범위 안에 있으면서 Subnet 허용 범위(/16~/28)도 만족합니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드10, VPC 슬라이드9·12", "id": "3-1a-04"}, {"item": "3-1a", "t": "VPC/Subnet 설계", "q": "SCP(Samsung Cloud Platform)의 VPC와 Subnet 설계에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Bare Metal Server와 Virtual Server는 VPC를 분리하여 구성한다.", "WEB, WAS, Database 등 워크로드 용도에 맞게 Subnet을 개별적으로 생성한다.", "VPC IP 대역이 부족하면 VPC 생성 후에도 IP 대역을 추가할 수 있다.", "On-Premise나 타 클라우드와 연동할 때 IP 대역이 중복되지 않도록 Subnet을 설정한다.", "VPC IP 대역은 Subnet과 마찬가지로 /16 ~ /28 범위에서 설정할 수 있다."], "a": 4, "e": "VPC IP 대역은 /16 ~ /24 범위에서 설정하며, /16 ~ /28은 Subnet IP 대역의 입력 범위입니다. VPC 대역이 부족하면 생성 후 아이피 대역 관리 탭에서 IP 대역을 추가할 수 있습니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드7·9·12·14", "id": "3-1a-05"}, {"item": "3-1b", "t": "NAT 개념", "q": "다음 중 NAT(Network Address Translation)의 개념과 목적에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["SCP의 NAT Gateway는 외부에서 들어오는 Inbound 접속을 대표 공인 IP로 받아, 연결된 Subnet의 내부 서버로 전달한다.", "내부에서는 사설 IP를 사용하고 외부와 통신할 때만 공인 IP로 변환하여 공인 IP 자원을 절약한다.", "여러 대의 내부 호스트가 하나의 공인 IP 주소를 공유하여 인터넷에 접속할 수 있다.", "외부에서 내부의 사설 IP 주소를 직접 알 수 없으므로 내부 네트워크 구조를 파악하기 어렵다.", "방화벽과 연계하여 활용하면 외부 공격으로부터 내부 네트워크를 보호하는 데 기여한다."], "a": 0, "e": "NAT Gateway는 Public IP가 없는 서버에 Outbound 방향의 단방향 인터넷 통신을 위해 대표 공인 IP를 매핑합니다. 외부에서 내부로는 접근할 수 없고 Private IP도 노출되지 않습니다.", "src": "SCP_v2_Explore_Network_01-10 Networking 개요 슬라이드11, VPC 슬라이드24", "id": "3-1b-02"}, {"item": "3-1b", "t": "Virtual IP", "q": "A 고객사는 같은 Subnet에 Active-Standby로 구성한 Virtual Server 2대가 장애 시 넘겨받을 공유 가상 IP(Virtual IP)를 확보하려 합니다. SCP(Samsung Cloud Platform)의 Virtual IP에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Public IP 생성 시 업링크 연결 타입을 Internet Gateway로 선택하여 Virtual IP를 예약한다.", "Private NAT 생성 시 지정한 NAT IP 대역 안에서 Private NAT IP를 예약하여 Virtual IP로 사용한다.", "Virtual IP는 Subnet 단위로 예약하며, 해당 Subnet의 상세 정보에서 예약·확인·삭제할 수 있다.", "Virtual IP는 VPC 단위 자원이므로 VPC 내 어느 Subnet에서나 같은 IP로 공유할 수 있다.", "Load Balancer 생성 시 자동 할당되는 Health Check IP 중 하나를 Virtual IP로 지정한다."], "a": 2, "e": "Virtual IP는 Subnet 상세 화면의 'Virtual IP 관리'에서 해당 Subnet의 가상 IP를 예약·확인·삭제합니다. Public IP 예약은 인터넷용 공인 IP이고, Private NAT IP는 Direct Connect로 고객사망 IP를 매핑할 때 씁니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드16·27·45", "id": "3-1b-03"}, {"item": "3-1b", "t": "IGW/NAT GW/Public IP", "q": "SCP(Samsung Cloud Platform)의 Internet Gateway, NAT Gateway, Public IP에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Public IP 생성 시 업링크 연결 타입으로 Internet Gateway를 선택하면 Public IP 대역의 IP가 자동으로 할당되며, 유료로 제공된다.", "NAT Gateway용 IP는 NAT Gateway 생성 시 선택한 Subnet의 사설 IP 대역에서 자동으로 할당된다.", "Internet Gateway는 VPC당 최대 1개까지 생성할 수 있다.", "Internet Gateway의 NAT 로그 저장을 사용하면 Internet Gateway를 통해 NAT되는 VM, BM, LB, DB의 로그와 NAT Gateway 로그를 Object Storage 버킷에 저장한다.", "NAT Gateway를 생성하려면 먼저 해당 VPC에 Internet Gateway가 연결되어 있어야 한다."], "a": 1, "e": "NAT Gateway용 IP는 사전에 예약한 Public IP를 선택하거나 새로 생성하는 공인 IP이며, 사설 IP가 자동 할당되는 방식이 아닙니다. NAT Gateway는 Internet Gateway가 연결된 VPC에서만 생성할 수 있습니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드18·22·24·26·27", "id": "3-1b-04"}, {"item": "3-1c", "t": "Public vs Private Subnet", "q": "Internet Gateway가 연결된 SCP(Samsung Cloud Platform) VPC에서 Public Subnet과 Private Subnet을 비교한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Public Subnet의 자원에는 공인 IP를 할당할 수 있고, 외부 인터넷과 Inbound/Outbound 통신이 직접 가능하다.", "Private Subnet의 자원에는 공인 IP를 할당할 수 없다.", "웹 서버, 로드 밸런서 등 외부와 직접 통신하는 리소스는 Public Subnet에 배치한다.", "Private Subnet은 Public IP NAT뿐 아니라 NAT Gateway도 사용할 수 없으므로 인터넷으로 나가는 통신이 불가능하다.", "데이터베이스, 애플리케이션 서버 등 보안상 외부 접근을 제한할 리소스는 Private Subnet에 배치한다."], "a": 3, "e": "Private Subnet은 Public IP NAT는 사용할 수 없지만 NAT Gateway는 사용할 수 있습니다. 따라서 내부에서 외부로 나가는 Outbound 통신은 가능하고, 외부에서 들어오는 접근만 불가능합니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드11·19", "id": "3-1c-01"}, {"item": "3-1c", "t": "Local Subnet", "q": "C 고객사는 이중화된 DB 서버 간 Heart Beat 및 백업 트래픽을 위한 별도 IP를 구성하려 합니다. 이 네트워크는 외부 네트워크와 차단되어야 하며, VPC 내 서버 간 통신만 가능하면 됩니다. 이 요구사항에 가장 적합한 Subnet 유형은 무엇입니까?", "o": ["Public Subnet", "Private Subnet", "Local Subnet", "VPC Endpoint Subnet", "Public Subnet 하위의 Secondary Subnet"], "a": 2, "e": "Local Subnet은 외부 네트워크와 차단된 채 서버 간 통신만 하는 Subnet으로, Heart Beat IP나 Backup IP 등에 씁니다. VPC Endpoint Subnet은 외부 네트워크에서 SCP 서비스에 프라이빗하게 접근하기 위한 용도입니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드6·11", "id": "3-1c-02"}, {"item": "3-1c", "t": "Subnet 유형", "q": "SCP(Samsung Cloud Platform)의 Subnet 유형과 구성에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["VPC Endpoint Subnet은 Direct Connect나 Transit Gateway로 연결된 고객사 내부망에서 Object Storage, File Storage 등 SCP 서비스에 Private 연결로 접근하기 위해 사용한다.", "Public Subnet과 Private Subnet은 Internet Gateway를 각 Subnet에 직접 연결했는지 여부로 구분된다.", "Secondary Subnet은 상위 Primary Subnet과 다른 유형으로도 생성할 수 있다.", "VPC당 최대 3개의 Subnet 생성 제한은 Primary Subnet과 Secondary Subnet을 합한 개수 기준이다.", "Local Subnet의 서버는 NAT Gateway를 연결하면 Outbound 인터넷 통신에 사용할 수 있다."], "a": 0, "e": "Public/Private는 Internet Gateway가 연결된 VPC에서 NAT Gateway와 NAT IP 사용 여부로 구분합니다. Secondary Subnet은 Primary와 같은 유형으로만 만들 수 있고, 개수 제한은 Primary Subnet에만 적용됩니다.", "src": "SCP_v2_Explore_Network_01-10 VPC 슬라이드6·11·14·19·33", "id": "3-1c-03"}, {"item": "3-1d", "t": "Firewall vs SG", "q": "SCP의 Firewall과 Security Group을 비교한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Firewall은 VPC 경계(North-South) 트래픽 제어에, Security Group은 VPC 내부 서버 간(East-West) 트래픽 제어에 주로 사용한다.", "Security Group은 CIDR뿐 아니라 다른 Security Group을 허용 대상으로 지정할 수 있어, Auto-Scaling 계층에서도 주소 범위를 일일이 지정할 필요가 없다.", "Firewall은 VPC와 인터넷, VPC와 고객 네트워크 사이의 통신에 규칙을 설정하여 네트워크를 관리한다.", "Firewall의 Inbound는 VPC로 향하는 트래픽을, Security Group의 Inbound는 외부에서 서버로 들어오는 트래픽을 의미한다.", "Firewall은 Virtual Server, Database, K8S Engine 등 각 자원의 포트에 적용하고, Security Group은 Internet Gateway, Direct Connect, Load Balancer에 적용한다."], "a": 4, "e": "적용 대상이 뒤바뀌었습니다. Firewall은 Internet Gateway·Direct Connect·Load Balancer에, Security Group은 Virtual Server·Database·K8S Engine·GPU Server 등 자원의 포트에 적용합니다.", "src": "SCP_v2_Explore_Network_01-10 Security Group 슬라이드5·10, Firewall 슬라이드5·11; WA백서 02 p.28, p.30", "id": "3-1d-02"}, {"item": "3-1d", "t"
