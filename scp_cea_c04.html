<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CEA-C04 실전 모의고사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>

/* Layout: OMR answer-card exam — question sheet on the left, printed OMR column on the right; stacks on phones */
:root{
  --paper:#FAF7F7; --sheet:#FFFFFF; --ink:#1E1A1C; --muted:#6B6064; --line:#E8D9DC;
  --omr:#C2334E; --omr-soft:#F8E4E8; --mark:#1E1A1C;
  --good:#2E7A57; --good-soft:#E2F1E9; --bad:#B0561C; --bad-soft:#F8E9DE; --off:#8A8186; --off-soft:#EFEBEC;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171315; --sheet:#211C1E; --ink:#F1EAEC; --muted:#A99DA2; --line:#3A3034;
  --omr:#EE6D85; --omr-soft:#3C2129; --mark:#F1EAEC;
  --good:#5FC495; --good-soft:#18342A; --bad:#E89557; --bad-soft:#3A2617; --off:#958A8F; --off-soft:#2B2427; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171315; --sheet:#211C1E; --ink:#F1EAEC; --muted:#A99DA2; --line:#3A3034;
  --omr:#EE6D85; --omr-soft:#3C2129; --mark:#F1EAEC;
  --good:#5FC495; --good-soft:#18342A; --bad:#E89557; --bad-soft:#3A2617; --off:#958A8F; --off-soft:#2B2427; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--omr);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--omr)}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px;font-weight:500}
.bar .sp{flex:1}
.timer{font-family:var(--mono);font-size:20px;font-weight:600;padding:2px 10px;border:1.5px solid var(--ink);border-radius:4px}
.timer.warn{color:var(--omr);border-color:var(--omr)}
.prog{font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:8px 14px;border-radius:4px;font-weight:600}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* intro */
.intro{max-width:760px;margin:40px auto 0;display:grid;gap:24px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.intro h1 span{color:var(--omr)}
.lede{color:var(--muted);margin:0;max-width:62ch}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet)}
.spec div{padding:14px 16px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:0}
.spec dt{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.spec dd{margin:2px 0 0;font-weight:700;font-size:18px}
.parts{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line)}
.parts th,.parts td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.parts th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.parts td.r{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.rules{margin:0;padding-left:20px;color:var(--ink)}
.rules li{margin:4px 0}

/* exam layout */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:860px){.exam{grid-template-columns:1fr}}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--display);font-size:28px;color:var(--omr);line-height:1}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.flagbtn{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 10px;font-size:13px}
.flagbtn.on{border-color:var(--omr);color:var(--omr);background:var(--omr-soft)}
.qtext{font-size:17px;font-weight:600;line-height:1.65;margin:0 0 6px;white-space:pre-line}
.qsub{font-size:14px;color:var(--muted);white-space:pre-line;margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--line);background:var(--paper)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:12px 14px;line-height:1.55}
.opt:hover{border-color:var(--omr)}
.bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;margin-top:1px}
.opt.sel{border-color:var(--ink)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.nav{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.nav .sp{flex:1}

/* OMR column */
.omr{background:var(--sheet);border:1.5px solid var(--omr);border-radius:6px;padding:14px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.omr{position:static;max-height:none}}
.omr h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--omr);display:flex;justify-content:space-between}
.omr-grid{display:grid;grid-template-columns:1fr;gap:1px}
@media (max-width:860px){.omr-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:16px}}
.orow{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px}
.orow.cur{background:var(--omr-soft)}
.orow .n{width:30px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--omr);border:0;background:none;padding:0 4px 0 0}
.orow .n.fl{text-decoration:underline wavy}
.ob{width:20px;height:20px;border-radius:50%;border:1px solid var(--omr);background:transparent;color:var(--omr);font-family:var(--mono);font-size:10px;padding:0;display:grid;place-items:center}
.ob.on{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,10,14,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px;max-width:420px;width:100%}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* result */
.result{margin-top:28px;display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px}
@media (max-width:620px){.score{grid-template-columns:1fr}}
.big{font-family:var(--display);font-size:clamp(56px,12vw,88px);line-height:1}
.big small{font-family:var(--mono);font-size:18px;color:var(--muted);margin-left:6px}
.stamp{display:inline-block;font-family:var(--display);font-size:22px;padding:4px 14px;border:3px solid currentColor;border-radius:6px;transform:rotate(-4deg);margin-top:10px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--omr)}
.meter{position:relative;height:12px;background:var(--off-soft);border-radius:999px;margin:14px 0 6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
.meter b{position:absolute;top:-3px;bottom:-3px;left:70%;width:2px;background:var(--omr)}
.mlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.score .facts{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.score .facts strong{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pbar{display:inline-block;width:80px;height:6px;background:var(--off-soft);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.review{display:grid;gap:12px}
.rv{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--off);border-radius:6px;padding:16px 18px;min-width:0}
.rv.ok{border-left-color:var(--good)} .rv.ng{border-left-color:var(--bad)}
.rv .qhead{margin-bottom:6px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.st.ok{background:var(--good-soft);color:var(--good)} .st.ng{background:var(--bad-soft);color:var(--bad)} .st.off{background:var(--off-soft);color:var(--off)}
.rv ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.rv li{display:flex;gap:8px;font-size:14px;padding:4px 8px;border-radius:4px}
.rv li.c{background:var(--good-soft)} .rv li.w{background:var(--bad-soft)}
.rv li .bub{width:20px;height:20px;font-size:10px}
.exp{font-size:14px;color:var(--ink);background:var(--paper);border-radius:4px;padding:10px 12px;margin-top:6px}
.exp b{color:var(--omr)}
.practice{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:24px}
.practice .sec{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pbtn{display:grid;gap:4px;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px}
.pbtn:hover{border-color:var(--omr)}
.pbtn .pp{font-size:13px;font-weight:600;color:var(--omr)}
.pbtn .pt{font-weight:700;font-size:15px;line-height:1.35}
.pbtn .pm{font-size:12px;color:var(--muted)}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--omr)}
h2.sec{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{from{transform:scale(1.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}}

/* home */
.home{max-width:880px;margin:32px auto 0;display:grid;gap:28px}
.home h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.home h1 span{color:var(--omr)}
.block{display:grid;gap:12px}
.block>.sec{margin:0}
.cov-top{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.cov-top .big2{font-family:var(--display);font-size:40px;line-height:1}
.cov-top .big2 small{font-family:var(--mono);font-size:14px;color:var(--muted);margin-left:4px}
.cov-top .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar2{height:8px;background:var(--off-soft);border-radius:999px;overflow:hidden;min-width:120px}
.bar2 i{display:block;height:100%;background:var(--good)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
details.part{background:var(--sheet);border:1px solid var(--line);border-radius:6px}
details.part>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px}
details.part>summary::-webkit-details-marker{display:none}
details.part>summary .pp{font-family:var(--mono);font-weight:600;color:var(--omr)}
details.part>summary .pn{font-weight:700}
details.part>summary .pc{font-size:13px;color:var(--muted);font-family:var(--mono)}
details.part[open]>summary{border-bottom:1px solid var(--line)}
.task{padding:10px 16px 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.irow{display:grid;grid-template-columns:44px minmax(0,1fr) 92px 64px auto auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px dashed var(--line);font-size:14px}
.irow:first-of-type{border-top:0}
.irow .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.irow .lb{min-width:0}
.irow .st2{font-family:var(--mono);font-size:12px;color:var(--muted);display:grid;gap:3px}
.irow .acc{font-family:var(--mono);font-size:12px;text-align:right}
.irow .go{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 10px;font-size:12px}
.irow .go:hover{border-color:var(--omr);color:var(--omr)}
.irow.none .lb{color:var(--ink)} .irow.none .lb::after{content:" · 미학습";color:var(--omr);font-size:12px}
.irow .go.lec{border-color:var(--ink)}
.irow .go.lec.read{background:var(--good-soft);border-color:var(--good);color:var(--good)}
@media (max-width:620px){.irow{grid-template-columns:40px minmax(0,1fr) auto auto}.irow .st2,.irow .acc{display:none}}
/* instant feedback */
.opt:disabled{cursor:default}
.opt.fb-c{border-color:var(--good);background:var(--good-soft)} .opt.fb-c .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.fb-w{border-color:var(--bad);background:var(--bad-soft)} .opt.fb-w .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.fb-n{opacity:.7}
.tagc{color:var(--good);font-size:12px} .tagw{color:var(--bad);font-size:12px}
.fb{margin-top:16px;border:1px solid var(--line);border-top:4px solid var(--good);border-radius:6px;padding:14px 16px;display:grid;gap:12px;background:var(--paper);min-width:0}
.fb.ng{border-top-color:var(--bad)}
.fbh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbans{font-size:14px;color:var(--muted)}
.fbsec{min-width:0}
.fbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--omr);margin-bottom:4px}
.fbl span{font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.fbsec>p{margin:0;line-height:1.7}
.md.fbmd{padding:2px 14px 10px;font-size:14.5px;max-height:340px;overflow:hidden;position:relative}
.md.fbmd.open{max-height:none}
.md.fbmd h2{font-size:16px;margin:12px 0 6px}
.alt{margin-top:8px;font-size:14px}.alt>summary{cursor:pointer;color:var(--muted)}.alt .md{margin-top:6px}
.more{margin-top:6px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:4px 12px;font-size:13px}
/* lesson */
.lesson{max-width:820px;margin:24px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.md,.toc,.co{overflow-wrap:anywhere}
.md :not(pre)>code{word-break:break-all}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--omr);font-family:var(--mono)}
.lesson h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.ltools{display:flex;gap:8px;flex-wrap:wrap}
.toc{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:14px}
.toc b{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.toc ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:2px}
.toc a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--line)}
.toc a:hover{color:var(--omr)}
.md{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 24px 24px;line-height:1.75;font-size:15.5px;min-width:0}
@media (max-width:620px){.md{padding:4px 16px 18px}}
.md h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--omr-soft);text-wrap:balance;scroll-margin-top:80px}
.md h3{font-size:16.5px;margin:20px 0 6px;color:var(--ink)}
.md p{margin:8px 0;max-width:72ch}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md li>ul{margin:2px 0}
.md strong{color:var(--ink);background:linear-gradient(transparent 62%,var(--omr-soft) 62%)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.md pre{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.5}
.md pre code{border:0;background:none;padding:0}
.md .tw{overflow-x:auto;margin:10px 0}
.md table{border-collapse:collapse;font-size:14px;width:100%;table-layout:auto}
.md th,.md td{word-break:keep-all;overflow-wrap:anywhere}
.md th:first-child,.md td:first-child{min-width:6.5em}
@media (max-width:620px){.md table{font-size:13px}.md th,.md td{padding:5px 7px}.md th:first-child,.md td:first-child{min-width:5em}}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--paper);font-weight:700}
.co{border-radius:6px;padding:10px 14px;margin:12px 0;border:1px solid var(--line);border-left-width:4px}
.co .ct{font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.co.k-exam{border-left-color:var(--omr);background:var(--omr-soft)} .co.k-exam .ct{color:var(--omr)}
.co.k-warn{border-left-color:var(--bad);background:var(--bad-soft)} .co.k-warn .ct{color:var(--bad)}
.co.k-tip{border-left-color:var(--good);background:var(--good-soft)} .co.k-tip .ct{color:var(--good)}
.co p,.co ul{margin:4px 0}
.md .srcline{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:10px}
.lnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnav button{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--muted)}
.lnav button span{display:block;color:var(--ink);font-weight:600;font-size:14px}
.lnav button.nx{text-align:right}
.lnav button:disabled{visibility:hidden}
.rvlec{border:1px solid var(--line);background:transparent;border-radius:4px;padding:2px 8px;font-size:12px;margin-left:auto}
.src{font-size:12px;color:var(--muted);margin-top:6px}
.danger{color:var(--omr);border-color:var(--omr)}
.modechip{font-size:12px;font-weight:700;color:var(--omr);letter-spacing:.04em}
</style>

<header class="bar">
  <div class="brand">SEA 모의고사<small>CEA-C04 · SCP v2</small></div>
  <div class="sp"></div>
  <div class="prog" id="prog" hidden></div>
  <div class="timer num" id="timer" hidden>100:00</div>
  <button class="btn primary" id="submitTop" hidden>답안 제출</button>

<script type="application/json" id="pool">[{"item": "1-1c", "t": "IAM", "q": "SCP(Samsung Cloud Platform)의 IAM에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["사용자 그룹에 정책을 연결하면 그룹에 속한 사용자 전체에 같은 권한이 적용된다.", "역할(Role)은 임시 자격 증명으로 권한을 위임하며, 최대 세션 시간을 1~12시간 범위에서 지정한다.", "동일 대상에 허용 정책과 거부 정책이 함께 적용되면 거부 정책이 우선 적용된다.", "인증키는 CLI·Open API 호출에 쓰는 장기 자격 증명이므로 주기적으로 교체하는 것이 좋다.", "정책은 사용자 그룹에만 연결할 수 있으며, 사용자에게 직접 연결할 수는 없다."], "a": 4, "e": "IAM 정책은 사용자, 사용자 그룹, 역할에 각각 연결할 수 있습니다. 그룹은 권한을 일괄 관리하는 편의 수단일 뿐 필수 경로가 아닙니다.", "src": "모의고사 v1", "id": "1-1c-01"}, {"item": "1-1a", "t": "Landing Zone", "q": "SCP(Samsung Cloud Platform)에서 Landing Zone을 구성하는 절차를 순서대로 바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄹ → ㅁ → ㄷ → ㄱ", "ㄴ → ㅁ → ㄹ → ㄱ → ㄷ", "ㅁ → ㄴ → ㄹ → ㄷ → ㄱ", "ㄹ → ㄴ → ㄷ → ㅁ → ㄱ", "ㄴ → ㄹ → ㄷ → ㄱ → ㅁ"], "a": 0, "e": "조직 단위 생성 → Account 추가 → ID Center 설정 → 권한 세트 관리 → Account 할당 순서입니다. 할당은 Account·사용자·권한 세트가 모두 준비된 뒤 마지막에 합니다.", "src": "모의고사 v1", "s": "ㄱ. 사용자나 사용자 그룹에 Account 할당\nㄴ. 조직 및 조직 단위(OU) 생성\nㄷ. 권한 세트(Permission Set) 생성\nㄹ. 신규 Account 생성 또는 기존 Account 초대\nㅁ. ID Center 생성 및 사용자·사용자 그룹 추가", "fix": true, "id": "1-1a-01"}, {"item": "1-1a", "t": "Organization · ID Center", "q": "SCP(Samsung Cloud Platform)의 Organization과 ID Center에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["OU에 통제 정책(ACP)을 연결하면 하위의 모든 Account에 정책이 일괄 적용된다.", "권한 세트에 입력한 사용자 정의 정책이 Account에 없으면, 같은 이름의 IAM 정책이 자동 생성되어 적용된다.", "기존 Account를 초대할 때는 Root 사용자 이메일을 입력하며, 최대 10개까지 동시에 초대할 수 있다.", "ID Center 사용자는 Access Portal을 통해 할당된 Account와 권한 세트 범위에서만 자원에 접근한다.", "Organization은 멤버 Account의 비용을 통합 청구하여 비용 최적화에 활용할 수 있다."], "a": 1, "e": "입력한 사용자 정의 정책명과 일치하는 IAM 정책이 없는 Account에는 권한 세트를 적용할 수 없습니다. 자동 생성되지 않으므로 각 Account에 같은 이름의 정책을 미리 만들어 두어야 합니다.", "src": "모의고사 v1", "id": "1-1a-02"}, {"item": "1-1e", "t": "Cloud Control", "q": "SCP(Samsung Cloud Platform)의 Cloud Control에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Cloud Control을 사용하려면 사전에 Landing Zone을 생성해야 한다.", "자동 구축되는 랜딩 존은 관리 계정, 로그 계정, 감사 계정으로 역할을 나눈다.", "탐지 가드레일은 정책 위반 리소스의 생성 자체를 차단하고, 예방 가드레일은 이미 생성된 리소스를 진단해 알림을 보낸다.", "가드레일은 Organization의 ACP(Access Control Policy), Config Inspection 등과 연동된다.", "대시보드에서 Account, OU, 가드레일 적용 현황과 규정 준수 상태를 시각적으로 모니터링할 수 있다."], "a": 2, "e": "설명이 뒤바뀌었습니다. 예방 가드레일이 위반 리소스 생성을 차단하고, 탐지 가드레일이 진단을 수행해 위반 리소스를 탐지하고 알립니다.", "src": "모의고사 v1", "id": "1-1e-01"}, {"item": "1-1e", "t": "Quota Service", "q": "SCP(Samsung Cloud Platform)의 Quota Service에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Quota Service 자체는 무료로 제공된다.", "서비스별 기본 Quota, 적용 Quota, 조정 가능 여부를 리전 수준과 Account 수준으로 구분해 조회할 수 있다.", "Quota 증가 요청의 상태(보류 중, 승인, 거부)를 콘솔에서 추적할 수 있다.", "SCP가 설정한 모든 Quota는 사용자가 증가를 요청할 수 있으며, 고정된 Quota는 없다.", "과거 Quota 증가 요청 내역과 사용 추이를 확인해 리소스 계획 수립에 활용할 수 있다."], "a": 3, "e": "Quota는 사용자가 증가를 요청할 수 있는 항목과 조정할 수 없는 고정 항목으로 나뉩니다. 조회 화면의 조정 가능 여부로 구분할 수 있습니다.", "src": "모의고사 v1", "id": "1-1e-02"}, {"item": "1-1f", "t": "Copilot", "q": "SCP(Samsung Cloud Platform)의 Copilot과 Architecture Diagram에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["'Virtual Server 생성해 줘'처럼 자연어로 요청하면 해당 생성 메뉴로 안내하고 작업을 지원한다.", "생성한 인스턴스의 상태, 자원 설정, 예상 비용을 대화 중에 확인할 수 있다.", "'내가 생성한 자원을 구성도로 보여 줘'라고 요청하면 자원 간 연관 관계를 구성도로 보여준다.", "Copilot은 일반 질의응답만 제공하며, 사용자가 생성한 자원 정보는 조회할 수 없다.", "자원 상세 화면으로 이동하지 않고도 자원의 주요 정보를 확인할 수 있다."], "a": 3, "e": "Copilot은 SCP 자원 데이터와 연계되어 인스턴스 상태, 설정, 예상 비용을 실시간으로 확인하고 Architecture Diagram으로 자원 관계를 도식화합니다.", "src": "모의고사 v1", "id": "1-1f-01"}, {"item": "1-2b", "t": "Planned Compute", "q": "A 고객사는 Virtual Server 1대에 Planned Compute 3년 약정(월 요금 200만 원)을 적용하여 사용하고 있습니다. 16개월 사용 후 약정을 해지할 경우 부과되는 해지 수수료는 얼마입니까?", "o": ["1,000만 원", "1,600만 원", "2,000만 원", "3,200만 원", "4,000만 원"], "a": 2, "e": "해지 수수료 = 월 요금 × 50% × 약정기간 잔여 개월 수 = 200만 × 0.5 × (36 − 16 = 20) = 2,000만 원입니다. 수수료는 해지 후 2개월 뒤 청구 금액에 포함됩니다.", "src": "모의고사 v1", "fix": true, "id": "1-2b-01"}, {"item": "1-2b", "t": "요금제", "q": "SCP(Samsung Cloud Platform)의 Cost Savings와 Planned Compute 요금제에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Cost Savings는 1년 또는 3년 동안 시간당 사용 금액을 약정하는 조건으로 할인된다.", "Planned Compute는 1년 또는 3년 동안 사용할 인스턴스 타입을 약정하는 조건으로 할인된다.", "두 요금제 모두 Event Streams, Search Engine, Vertica(DBaaS)에도 적용할 수 있다.", "Planned Compute 약정 기간 중 서버 타입을 하위 타입으로 변경(Scale-Down)하여 약정 금액을 줄일 수 있다.", "Edge Server는 무약정 요금이 없고 3년 또는 5년 약정으로 제공된다."], "a": 3, "e": "Planned Compute의 서버 타입 변경은 Scale-Up만 가능합니다. 사용량이 줄 가능성이 있다면 시간당 금액을 약정하는 Cost Savings가 더 유연합니다.", "src": "모의고사 v1", "id": "1-2b-02"}, {"item": "1-1a", "t": "Landing Zone 설계", "q": "A 고객사는 SCP(Samsung Cloud Platform)에서 멀티 Account 환경을 처음 구축하려고 합니다. A 고객사를 위한 Landing Zone 설계 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Security, Common, Workload, Sandbox OU로 계층을 나누고 목적에 맞게 Account를 배치한다.", "개발과 운영 환경을 분리하기 위해 Workload OU 아래에 Dev Account와 Production Account를 따로 둔다.", "모든 Account의 감사 로그는 운영 편의를 위해 Production Account의 Object Storage에 함께 저장한다.", "직원 계정은 ID Center에서 사용자 그룹으로 관리하고, 권한 세트로 Account별 접근 권한을 부여한다.", "규정 준수 항목은 통제 정책(ACP)으로 만들어 OU 단위로 연결한다."], "a": 2, "e": "로그는 Security OU 아래 별도 Log Account에 중앙 수집해 무결성을 보장해야 합니다. 워크로드 Account에 감사 로그를 섞어 두면 권한 분리와 무결성이 깨집니다.", "src": "모의고사 v1", "id": "1-1a-03"}, {"item": "1-2a", "t": "접근 방식", "q": "SCP(Samsung Cloud Platform)의 접근 방식과 인증에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Console 접속 시 다중 인증(MFA)으로 본인 인증을 수행한다.", "CLI와 Open API는 인증키(Access Key, Secret Key) 또는 임시키로 인증한다.", "정책의 인증 유형으로 '인증키 인증'과 '임시키 인증, Console 로그인'을 구분해 적용할 수 있다.", "Open API는 Console 로그인 세션을 그대로 사용하므로 별도의 자격 증명 없이 호출할 수 있다.", "정책에 적용 IP를 지정하면 등록한 IP에서 온 요청에만 정책을 적용할 수 있다."], "a": 3, "e": "Open API와 CLI는 Console 세션과 별개이며, 인증키나 임시키 같은 자격 증명이 필요합니다. IaC(Terraform)도 같은 방식으로 인증합니다.", "src": "모의고사 v1", "id": "1-2a-01"}, {"item": "1-2b", "t": "Cost Management", "q": "SCP(Samsung Cloud Platform)의 Cost Management에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["이용 및 청구내역 조회에서 이번 달 예상 금액과 청구 금액을 확인할 수 있다.", "비용 분석에서는 최대 12개월간의 비용 추이와 사용량 데이터를 확인할 수 있다.", "예산은 월별 예산(월 단위 초기화) 또는 전체 예산(설정한 월부터 누적)으로 설정할 수 있다.", "예산 소진율이 임계치에 도달하면 지정한 수신자에게 알림 메일을 보낼 수 있다.", "탄소 배출량 메뉴에서 월별 추이, 서비스군별, Account별 탄소 배출량을 확인할 수 있다."], "a": 1, "e": "비용 분석은 최대 6개월까지의 비용 추이와 사용량 데이터를 제공하며, 상세 내역은 엑셀로 내려받을 수 있습니다.", "src": "모의고사 v1", "id": "1-2b-03"}, {"item": "1-2b", "t": "Resource Management", "q": "SCP(Samsung Cloud Platform)의 Resource Explorer와 Resource Groups에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Resource Explorer는 현재 접속한 리전의 리소스만 검색할 수 있어, 다른 리전 자원은 리전을 바꿔 조회해야 한다.", "Resource Explorer에서 여러 리소스를 선택해 태그를 일괄 추가할 수 있다.", "태그는 Key와 Value로 구성되며, 자원당 최대 50개까지 등록할 수 있다.", "Resource Group은 자원 유형과 기준 태그를 지정해 조건에 맞는 자원을 묶어 보여준다.", "Resource Explorer 목록에서 자원명을 클릭하면 해당 자원의 상세 화면으로 이동한다."], "a": 0, "e": "Resource Explorer는 자원명, 서비스명, 자원 유형 등으로 단일 쿼리를 실행해 여러 리전과 계정에 걸친 리소스를 한 번에 검색합니다.", "src": "모의고사 v1", "id": "1-2b-04"}, {"item": "2-1c", "t": "가용성", "q": "A 고객사가 운영하는 시스템의 평균 고장 간격(MTTF)이 990시간, 평균 복구 시간(MTTR)이 10시간일 때, 이 시스템의 가용성은 얼마입니까?", "o": ["98.99%", "99.0%", "99.9%", "99.99%", "90.0%"], "a": 1, "e": "가용성 = MTTF ÷ (MTTF + MTTR) = 990 ÷ 1,000 = 99.0%입니다. 가용성을 높이려면 고장 빈도를 줄이거나(MTTF↑) 복구를 빠르게(MTTR↓) 해야 합니다.", "src": "모의고사 v1", "fix": true, "id": "2-1c-01"}, {"item": "2-1c", "t": "SLA · SLO · SLI", "q": "서비스 수준을 관리하는 지표인 SLA, SLO, SLI에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["SLI는 응답 시간, 오류율처럼 서비스 수준을 실제로 측정한 지표이다.", "SLO는 SLI가 도달해야 하는 내부 목표 값이다.", "SLI는 고객과 맺은 계약상 목표 수준으로, 미달 시 서비스 크레딧 같은 보상 조건이 포함된다.", "SLO는 보통 SLA보다 엄격하게 잡아 계약 위반 전에 대응할 여유를 둔다.", "가용성 목표를 정할 때는 비즈니스 영향과 비용을 함께 고려해야 한다."], "a": 2, "e": "보상 조건이 포함된 계약상 목표는 SLA입니다. SLI는 측정 지표, SLO는 내부 목표입니다.", "src": "모의고사 v1", "id": "2-1c-02"}, {"item": "2-2b", "t": "고가용성 설계", "q": "B 고객사는 SCP(Samsung Cloud Platform)에서 운영하는 웹 서비스의 가용성을 높이려고 합니다. 다음 설계 방안 중 적합하지 않은 것은 무엇입니까?", "o": ["웹 서버를 여러 AZ에 나누어 배치하고 Load Balancer로 트래픽을 분산한다.", "Server Group의 Affinity 정책으로 웹 서버를 같은 호스트에 모아 물리 호스트 장애에 대비한다.", "DB는 Active-Standby HA로 구성해 장애 시 자동 전환되게 한다.", "웹 계층과 애플리케이션 계층 사이에 Message Queue를 두어 결합을 느슨하게 만든다.", "Auto-Scaling 상태 체크로 Unhealthy 서버를 자동 교체한다."], "a": 1, "e": "Affinity는 같은 랙·호스트에 근접 배치해 통신 지연을 줄이는 정책입니다. 물리 호스트 장애에 대비하려면 서버를 분산 배치하는 Anti-Affinity를 써야 합니다.", "src": "모의고사 v1", "id": "2-2b-01"}, {"item": "2-1c", "t": "안정성 · DR", "q": "재해 복구(DR) 계획 수립에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["RTO는 장애 발생 후 서비스를 복구해야 하는 목표 시간이다.", "RPO는 데이터 손실을 허용할 수 있는 최대 시점(시간 범위)이다.", "업무 영향 분석(BIA)으로 업무 중요도를 평가해 시스템별 RTO와 RPO를 정한다.", "Hot Standby 방식은 비용이 가장 낮은 대신 RTO가 가장 길다.", "Warm Standby는 DR 사이트에 축소된 규모의 환경을 상시 운영하다가 재해 시 확장한다."], "a": 3, "e": "Hot Standby는 운영 환경과 같은 규모를 상시 가동하므로 비용이 가장 높고 RTO가 가장 짧습니다. 비용이 가장 낮고 RTO가 긴 방식은 Cold Standby입니다.", "src": "모의고사 v1", "id": "2-1c-03"}, {"item": "2-1d", "t": "보안성 설계", "q": "Well-Architected 보안성 원칙에 따른 SCP(Samsung Cloud Platform) 설계 방안으로 옳지 않은 것은 무엇입니까?", "o": ["업무에 필요한 최소 권한만 허용하는 최소 허용 원칙을 적용한다.", "VPC 경계를 오가는 North-South 트래픽은 Firewall로, VPC 내부 서버 간 East-West 트래픽은 Security Group으로 제어한다.", "IaaS의 책임 분담 모델에서 게스트 OS 패치와 Security Group 규칙 설정은 CSP의 책임이다.", "장기 인증키 대신 Secret Vault의 임시키를 사용해 키 노출 위험을 줄인다.", "중요 데이터는 저장 시와 전송 시 모두 암호화한다."], "a": 2, "e": "IaaS에서 CSP는 물리 인프라와 가상화 계층을 책임지고, 게스트 OS 패치와 Security Group·Firewall 규칙 같은 구성은 고객 책임입니다.", "src": "모의고사 v1", "id": "2-1d-01"}, {"item": "2-1e", "t": "성능 효율성", "q": "SCP(Samsung Cloud Platform) 환경의 성능 효율성 설계에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["RED 방법론은 자원의 Utilization, Saturation, Errors를, USE 방법론은 서비스의 Rate, Errors, Duration을 관찰한다.", "서버 사이징에는 jOPS, tpmC 같은 벤치마크 지표를 참고할 수 있다.", "대용량 분석(OLAP) 워크로드에는 컬럼 기반 DB인 Vertica를 검토한다.", "자주 읽는 데이터는 CacheStore 같은 인메모리 캐시로 DB 부하를 줄인다.", "정적 콘텐츠는 Global CDN으로, 지역별 트래픽 분산은 GSLB로 처리해 지연 시간을 줄인다."], "a": 0, "e": "설명이 뒤바뀌었습니다. USE(Utilization, Saturation, Errors)는 자원 관점, RED(Rate, Errors, Duration)는 서비스(요청) 관점의 방법론입니다.", "src": "모의고사 v1", "id": "2-1e-01"}, {"item": "2-1a", "t": "비용 최적화", "q": "클라우드 비용 최적화와 FinOps에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["리사이징은 평균값보다 P95 같은 상위 백분위 사용률을 기준으로 판단한다.", "FinOps 프로세스는 Optimize → Inform → Operate 순서로 반복된다.", "개발·테스트 서버처럼 특정 시간대에만 쓰는 자원은 스케줄링으로 업무 외 시간에 중지한다.", "FinOps 성숙도는 Crawl, Walk, Run 단계로 구분한다.", "장기 미사용 자원을 정기적으로 식별해 정리한다."], "a": 1, "e": "FinOps는 가시화(Inform) → 최적화(Optimize) → 운영(Operate) 순서로 반복합니다. 비용을 먼저 보여 주어야 최적화 대상을 고를 수 있습니다.", "src": "모의고사 v1", "id": "2-1a-01"}, {"item": "2-1b", "t": "배포 전략", "q": "A 고객사는 신규 버전의 애플리케이션을 전체 트래픽의 5%에만 먼저 노출하고, 모니터링 지표를 확인하면서 노출 비율을 점진적으로 늘리려고 합니다. 이 요구사항에 해당하는 배포 전략은 무엇입니까?", "o": ["인플레이스(In-place) 배포", "롤링(Rolling) 배포", "블루-그린(Blue-Green) 배포", "카나리(Canary) 배포", "불변(Immutable) 배포"], "a": 3, "e": "일부 사용자에게만 먼저 노출해 검증한 뒤 비율을 늘리는 방식은 카나리 배포입니다. 블루-그린은 두 환경을 준비해 GSLB Ratio 등으로 트래픽을 한 번에(또는 단계적으로) 전환합니다.", "src": "모의고사 v1", "fix": true, "id": "2-1b-01"}, {"item": "2-2d", "t": "규제 대응", "q": "SCP(Samsung Cloud Platform) 도입을 검토하는 규제 산업 고객에 대한 제안으로 적합하지 않은 것은 무엇입니까?", "o": ["공공기관 고객에게는 공공 클라우드 보안 인증을 받은 전용 환경을 제안한다.", "금융 고객에게는 금융 규제 요건을 충족하는 금융 전용 클라우드를 제안한다.", "다른 고객과 물리 자원을 공유할 수 없는 고객에게는 Private 또는 Dedicated Cloud를 제안한다.", "데이터 국외 반출이 금지된 고객이라도 응답 지연을 줄이기 위해 해외 리전을 우선 제안한다.", "보안·지연 문제로 데이터를 외부로 보낼 수 없는 현장에는 On-Site Edge Server를 제안한다."], "a": 3, "e": "데이터 주권과 규제 요건은 지연 시간보다 우선합니다. 국외 반출이 금지된 데이터는 국내 리전 안에 두어야 합니다.", "src": "모의고사 v1", "id": "2-2d-01"}, {"item": "2-3a", "t": "마이그레이션", "q": "B 공공기관은 온프레미스에서 운영 중인 MySQL을 SCP(Samsung Cloud Platform)의 MySQL(DBaaS)로 이전하려고 합니다. DB 엔진은 그대로 유지하고 운영 관리만 관리형 서비스로 전환하는 이 마이그레이션 전략은 무엇입니까?", "o": ["Rehost (Lift & Shift)", "Replatform", "Refactor (Re-architect)", "Retire", "Retain"], "a": 1, "e": "애플리케이션 구조는 유지하면서 플랫폼 일부를 관리형 서비스로 바꾸는 것은 Replatform입니다. VM을 그대로 옮기면 Rehost, 클라우드 네이티브로 재설계하면 Refactor입니다.", "src": "모의고사 v1", "fix": true, "id": "2-3a-01"}, {"item": "2-3b", "t": "마이그레이션", "q": "C 고객사는 온프레미스 서버와 데이터를 SCP(Samsung Cloud Platform)로 이전하려고 합니다. 이전 계획에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["서버 이미지는 qcow2 파일로 변환해 Object Storage에 올린 뒤 Custom Image를 만들 수 있다.", "VMware의 vmdk 파일은 변환 없이 Object Storage에 올려 그대로 Image를 만들 수 있다.", "대용량 데이터 이전 시 Direct Connect나 VPN으로 전용 경로를 확보하면 전송 안정성이 높아진다.", "DB는 복제를 먼저 구성해 데이터를 동기화한 뒤 짧은 다운타임으로 전환(Cut-over)할 수 있다.", "이전 전에 대상 워크로드의 사용률을 측정해 클라우드 서버 타입을 적정 규모로 선정한다."], "a": 1, "e": "Object Storage 파일로 Image를 만들 때는 .qcow2 확장자만 지원합니다. 다른 형식은 qcow2로 변환해야 합니다.", "src": "모의고사 v1", "id": "2-3b-01"}, {"item": "2-1e", "t": "시나리오", "q": "B 고객사는 이벤트 기간마다 접속자가 급증하는 쇼핑몰을 SCP(Samsung Cloud Platform)에 구축하려고 합니다. B 고객사를 위한 아키텍처 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["웹 서버를 Auto-Scaling Group으로 구성하고 Multi-AZ에 분산한다.", "상품 이미지 같은 정적 콘텐츠는 Object Storage와 Global CDN으로 제공한다.", "조회가 많은 상품 DB는 Read Replica로 읽기 부하를 분산한다.", "로그인 세션은 각 웹 서버의 로컬 디스크에 저장해 서버가 줄어들어도 세션이 유지되게 한다.", "이벤트 전에 Quota를 확인하고 필요한 항목은 미리 증설을 요청한다."], "a": 3, "e": "Auto-Scaling으로 서버가 축소되면 로컬에 저장된 세션은 사라집니다. 세션은 CacheStore 같은 외부 저장소에 두어 웹 서버를 Stateless로 만들어야 합니다.", "src": "모의고사 v1", "id": "2-1e-02"}, {"item": "3-1a", "t": "Subnet", "q": "SCP(Samsung Cloud Platform)의 VPC에 Subnet을 10.0.1.0/26 대역으로 생성했습니다. 이 Subnet의 Gateway IP와 서버에 할당할 수 있는 IP 개수를 바르게 짝지은 것은 무엇입니까?", "o": ["Gateway 10.0.1.0 / 62개", "Gateway 10.0.1.1 / 61개", "Gateway 10.0.1.1 / 62개", "Gateway 10.0.1.62 / 61개", "Gateway 10.0.1.1 / 64개"], "a": 1, "e": "/26은 64개 IP입니다. Gateway는 대역의 두 번째 값(10.0.1.1)이며, 사용할 수 없는 IP 3개를 제외한 61개를 할당할 수 있습니다.", "src": "모의고사 v1", "fix": true, "id": "3-1a-01"}, {"item": "3-1a", "t": "VPC", "q": "SCP(Samsung Cloud Platform)의 VPC와 Subnet에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["VPC IP 대역은 /16 ~ /24 범위에서 설정한다.", "Subnet CIDR은 생성 후 수정할 수 없다.", "DNS Name Server를 지정하지 않으면 SCP Default DNS(198.19.0.53)를 사용한다.", "Internet Gateway는 VPC당 여러 개를 생성하여 인터넷 트래픽을 분산할 수 있다.", "Local Subnet은 Heart Beat나 Backup처럼 VPC 내부 서버 간 직접 통신 용도로 쓴다."], "a": 3, "e": "Internet Gateway는 VPC당 최대 1개입니다. 또한 Default 라우팅이 지정되지 않은 VPC에만 생성할 수 있습니다.", "src": "모의고사 v1", "id": "3-1a-02"}, {"item": "3-1b", "t": "NAT Gateway", "q": "A 고객사는 Private Subnet에 있는 서버가 외부 저장소에서 OS 패치를 내려받도록 하려고 합니다. 단, 외부에서 서버로 들어오는 접속은 허용하지 않아야 합니다. 가장 적합한 구성은 무엇입니까?", "o": ["서버에 Public IP를 직접 할당한다.", "VPC에 Internet Gateway를 연결하고 NAT Gateway를 생성해 Subnet에 연결한다.", "외부 저장소와 VPC Peering을 맺는다.", "Private NAT를 생성해 외부 인터넷과 연결한다.", "VPC Endpoint를 생성해 인터넷 저장소에 접근한다."], "a": 1, "e": "NAT Gateway는 Public IP가 없는 서버에 Outbound 단방향 인터넷 통신을 제공합니다. 생성 전에 VPC와 Internet Gateway 연결이 필요합니다. Private NAT는 Direct Connect 기반 고객망 연결용입니다.", "src": "모의고사 v1", "id": "3-1b-01"}, {"item": "3-1d", "t": "Firewall · SG", "q": "SCP(Samsung Cloud Platform)의 Firewall과 Security Group에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Firewall 규칙은 위에서 아래로 평가되며, 처음 일치하는 규칙으로 허용·차단이 결정된다.", "Security Group은 처음 생성하면 기본 규칙에 따라 모든 트래픽이 차단된다.", "Security Group은 Internet Gateway에 적용되어 VPC 경계를 지나는 트래픽을 제어한다.", "Bare Metal Server는 Security Group을 제공하지 않으므로 Firewall로 트래픽을 제어한다.", "Security Group 규칙은 그룹당 100개, Account당 1,000개까지 만들 수 있다."], "a": 2, "e": "Security Group은 서버의 Port에 연결되어 서버 단위로 트래픽을 제어합니다. Internet Gateway, Direct Connect, Load Balancer에 적용되는 것은 Firewall입니다.", "src": "모의고사 v1", "id": "3-1d-01"}, {"item": "3-1p", "t": "네트워크 연결", "q": "SCP(Samsung Cloud Platform)의 VPC 간 연결 및 하이브리드 연결 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["VPC Peering은 Account당 최대 5개이며, 다른 Account 간 연결은 1개만 허용된다.", "Transit Gateway는 Account당 최대 3개이며, Transit Gateway당 최대 5개 VPC를 연결한다.", "Direct Connect의 Uplink 포트 용량은 사용 중에도 언제든 상향 변경할 수 있다.", "Direct Connect와 Transit Gateway 고객사 회선 연결에는 고객사 라우터의 BGP가 필요하다.", "VPN의 IKE SA LifeTime 기본값은 86,400초, IPSec SA LifeTime 기본값은 43,200초이다."], "a": 2, "e": "Direct Connect Uplink 포트 용량(1G/10G/20G/40G)은 선택한 뒤 변경할 수 없습니다. 처음 설계할 때 증가 여유를 고려해 정해야 합니다.", "src": "모의고사 v1", "id": "3-1p-01"}, {"item": "3-1l", "t": "Load Balancer", "q": "A 고객사는 Load Balancer에 웹 서버 2대를 멤버로 등록했지만 헬스 체크가 계속 실패하고 있습니다. 서버의 서비스 포트는 정상적으로 동작합니다. 이 문제를 해결하기 위한 조치로 가장 적절한 것은 무엇입니까?", "o": ["Load Balancer를 L4에서 L7으로 바꾼다.", "멤버 서버의 Security Group Inbound에 LB의 Source NAT IP와 Health Check IP를 허용한다.", "멤버 서버를 Load Balancer와 다른 Subnet으로 옮긴다.", "멤버 서버에 Public IP를 할당한다.", "LB 서버 그룹을 삭제하고 서버마다 별도 Load Balancer를 만든다."], "a": 1, "e": "LB는 Service Subnet에서 Source NAT IP 1개와 Health Check IP 2개를 할당받습니다. 멤버 서버 Security Group이 이 IP를 허용해야 헬스 체크와 서비스 트래픽이 들어옵니다.", "src": "모의고사 v1", "id": "3-1l-01"}, {"item": "3-1m", "t": "DNS · GSLB", "q": "SCP(Samsung Cloud Platform)의 DNS, GSLB, Global CDN에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Private DNS는 Account당 1개이며, 최대 5개 VPC를 연결할 수 있다.", "Hosted Zone 레코드 TTL은 최소 300초, 최대 86,400초이다.", "GSLB 부하 분산 알고리즘은 Least Connection과 Weighted Response Time 두 가지이다.", "GSLB는 도메인당 최대 8개 리소스를 등록할 수 있다.", "Global CDN은 정적 콘텐츠를 사용자와 가까운 곳에서 제공해 응답 시간을 줄인다."], "a": 2, "e": "SCP GSLB의 부하 분산 알고리즘은 Ratio 방식과 Round Robin 방식입니다. Ratio 방식은 블루-그린 배포의 트래픽 전환에도 쓰입니다.", "src": "모의고사 v1", "id": "3-1m-01"}, {"item": "3-1q", "t": "Enterprise Network", "q": "SCP(Samsung Cloud Platform)의 Enterprise Network 서비스와 그 설명을 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["Cloud Secured SD-LAN: 고객 사업장 내 사용자 인증 기반 유무선 통합 네트워크", "Cloud Last Mile: 사업장에서 SCP 리전까지의 회선과 Customer Edge 자원을 패키지로 제공", "SASE: ZTNA, SWG, CASB, FWaaS 등 네트워크·보안 기능을 클라우드 기반으로 통합 제공", "Cloud WAN: 트래픽 특성에 따라 Gold/Silver 전송 경로를 선택해 비용을 효율화", "Private 5G: 인터넷 구간의 웹 공격을 L7에서 탐지·차단하는 보안 서비스"], "a": 4, "e": "웹 공격을 L7에서 탐지·차단하는 것은 WAF입니다. Private 5G는 기업 전용 5G 무선망 서비스입니다.", "src": "모의고사 v1", "id": "3-1q-01"}, {"item": "3-2a", "t": "Virtual Server", "q": "SCP(Samsung Cloud Platform)의 Virtual Server에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["하나의 자원에 Security Group을 최대 5개까지 설정할 수 있다.", "Keypair를 생성하면 Private Key가 .pem 파일로 바로 다운로드된다.", "서버 타입은 운영 중에도 상위 타입과 하위 타입 모두로 자유롭게 변경할 수 있다.", "Lock을 설정하면 해지, 시작, 중지 동작을 실행할 수 없다.", "한 번에 생성할 수 있는 수량은 1~100개이다."], "a": 2, "e": "Virtual Server의 서버 타입은 현재보다 상위 타입으로만 변경할 수 있습니다.", "src": "모의고사 v1", "id": "3-2a-01"}, {"item": "3-2a", "t": "OS 계정", "q": "SCP(Samsung Cloud Platform) Virtual Server의 OS 이미지별 기본 접속 계정을 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["Alma Linux - almalinux", "Rocky Linux - rocky", "RHEL - cloud-user", "Ubuntu - cloud-user", "Windows - sysadmin"], "a": 3, "e": "Ubuntu의 기본 접속 계정은 ubuntu입니다. cloud-user는 RHEL과 Oracle Linux의 기본 계정입니다.", "src": "모의고사 v1", "id": "3-2a-02"}, {"item": "3-2c", "t": "Auto-Scaling", "q": "SCP(Samsung Cloud Platform)의 Virtual Server Auto-Scaling에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Launch Configuration은 서버 유형, Keypair, Block Storage 등을 정의한 생성 템플릿이다.", "Auto-Scaling Group당 Virtual Server는 최대 100개까지 운영할 수 있다.", "Group당 정책은 최대 12개, 스케줄은 최대 20개까지 만들 수 있다.", "Draining timeout은 서버를 LB에서 분리하기 전 대기 시간이며 기본값은 300초이다.", "Desired는 최초 생성되는 목표 서버 수이며, Min과 Max 사이에서 유지된다."], "a": 1, "e": "Auto-Scaling Group당 Virtual Server는 최대 50개입니다. 스케줄의 Min/Desired/Max 값도 0~50 범위입니다.", "src": "모의고사 v1", "id": "3-2c-01"}, {"item": "3-2e", "t": "Cloud Functions", "q": "SCP(Samsung Cloud Platform)의 Cloud Functions에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Runtime으로 GO, Java, Node.js, PHP, Python을 제공한다.", "Java Runtime은 콘솔 UI에서 코드를 직접 편집하고 바로 실행할 수 있다.", "최소 작업 수를 1 이상으로 두면 Cold Start를 막을 수 있지만 비용이 계속 발생한다.", "트리거로 API Gateway와 Cronjob을 제공한다.", "함수 URL 인증을 IAM으로 하면 요청 헤더에 x-scf-access-key와 x-scf-secret-key를 넣는다."], "a": 1, "e": "Java Runtime은 UI 코드 편집을 지원하지 않습니다. Object Storage에 올린 Jar 파일을 가져와 실행합니다.", "src": "모의고사 v1", "id": "3-2e-01"}, {"item": "3-2f", "t": "GPU", "q": "SCP(Samsung Cloud Platform)의 GPU Server와 Multi-node GPU Cluster에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["GPU는 Pass-through 방식으로 제공되어 물리 서버 수준의 성능을 낸다.", "인스턴스 타입 g2v48h4는 H100 GPU 4장, 48 vCore를 뜻한다.", "MIG를 사용하면 GPU 하나를 최대 8개 인스턴스로 분할할 수 있다.", "MIG를 해지할 때는 Compute Instance 삭제 → GPU Instance 삭제 → MIG 비활성화 순서로 진행한다.", "Multi-node GPU Cluster는 GPU 8장이 장착된 Bare Metal Server 2대 이상으로 구성하고, 노드 간에는 InfiniBand(RDMA)로 통신한다."], "a": 2, "e": "MIG로 GPU 하나를 최대 7개 인스턴스로 분할할 수 있습니다.", "src": "모의고사 v1", "id": "3-2f-01"}, {"item": "3-2b", "t": "Bare Metal", "q": "SCP(Samsung Cloud Platform)의 Bare Metal Server에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["가상화 없이 물리적으로 분리된 CPU와 메모리를 단독으로 할당받는다.", "Linux 관리자 계정은 root로 고정된다.", "Hyper Threading 설정은 생성 후 변경할 수 없다.", "Block Storage(BM) 메뉴에서 만든 볼륨은 사용 중에도 용량을 증설할 수 있다.", "Placement Group으로 랙 단위 분산 배치가 가능하며, 최초 생성 시에만 적용된다."], "a": 3, "e": "Block Storage(BM)는 생성 후 용량을 증설할 수 없습니다. 사용 중 증설은 Virtual Server용 Block Storage(VM)의 특징입니다.", "src": "모의고사 v1", "id": "3-2b-01"}, {"item": "3-3b", "t": "Kubernetes", "q": "K8s(Kubernetes) 아키텍처에서 Control Plane을 구성하는 요소에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["API Server는 Kubernetes 구성 요소의 생성·삭제 인터페이스를 담당한다.", "etcd는 Pod를 최적의 Node에 배포하기 위한 스케줄링을 담당한다.", "Controller Manager는 Pod의 원하는 상태를 유지하고 확장과 장애 복구를 수행한다.", "Control Plane은 Cluster 전체 상태를 관리하고 문제 발생 시 자동으로 감지해 대응한다.", "Kubernetes 오브젝트 레코드로 리소스 상태와 메타데이터 정보를 관리한다."], "a": 1, "e": "etcd는 Kubernetes 오브젝트 정보를 저장하는 Key/Value Store입니다. Pod 배치 스케줄링은 Scheduler가 담당합니다.", "src": "모의고사 v1", "id": "3-3b-01"}, {"item": "3-3b", "t": "Kubernetes", "q": "K8s(Kubernetes)의 Worker Node 구성 요소와 오브젝트에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["kubelet은 Node에서 Pod의 생성, 실행, 모니터링을 담당하는 Agent이다.", "kube-proxy는 Service에 정의된 네트워킹 규칙을 실제로 구현한다.", "Pod는 하나 이상의 컨테이너를 묶은 Kubernetes의 최소 배포 단위이다.", "Deployment는 ReplicaSet을 관리하며 롤링 업데이트를 지원한다.", "kube-proxy는 Master Node에만 설치되어 Cluster 전체의 Pod 배치를 결정한다."], "a": 4, "e": "kube-proxy는 각 Worker Node에 설치되어 Service 네트워킹을 구현합니다. Pod 배치는 Master Node의 Scheduler가 결정합니다.", "src": "모의고사 v1", "id": "3-3b-02"}, {"item": "3-4b", "t": "스토리지 선택", "q": "다음 중 워크로드 특성과 SCP(Samsung Cloud Platform) 스토리지 서비스를 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["여러 Linux 서버가 공유하는 디렉터리 - File Storage(NFS)", "여러 Windows 서버 간 파일 공유 - File Storage(CIFS)", "URL로 접근하는 웹 정적 파일 - Object Storage", "Multi-node GPU Cluster의 대용량 AI 학습 데이터 - Archive Storage", "오래 보관하지만 거의 조회하지 않는 데이터 - Archive Storage"], "a": 3, "e": "Multi-node GPU Cluster의 대용량 학습 데이터에는 All NVMe 기반 Parallel File Storage가 적합합니다. Archive Storage는 장기 보관용입니다.", "src": "모의고사 v1", "id": "3-4b-01"}, {"item": "3-4a", "t": "Block Storage", "q": "SCP(Samsung Cloud Platform)의 Block Storage(VM)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["용량은 8GB부터 최대 12TB이며 사용 중에도 증설할 수 있다.", "모든 디스크 유형에 AES-256 암호화가 적용된다.", "Virtual Server 하나에 볼륨을 최대 26개까지 연결할 수 있다.", "SSD_KMS 암호화는 볼륨 생성 후에도 필요할 때 켜고 끌 수 있다.", "볼륨 이전으로 다른 Account에 볼륨을 넘길 수 있으며, 이전 전에 서버 연결을 해제해야 한다."], "a": 3, "e": "SSD_KMS는 최초 생성 시에만 적용되며 이후 변경할 수 없습니다. 전송 구간 암호화로 성능 저하가 있을 수 있습니다.", "src": "모의고사 v1", "id": "3-4a-01"}, {"item": "3-4c", "t": "Object · Archive", "q": "SCP(Samsung Cloud Platform)의 Object Storage와 Archive Storage에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["접근 허용 Public IP를 단일 IP 또는 CIDR 형식으로 등록할 수 있다.", "버전 관리를 켜면 설정 이전에 올린 파일에도 즉시 고유한 버전 ID가 부여된다.", "Private 주소는 같은 Account 내 자원에서 접근할 때 사용한다.", "Archive 정책의 대상 Object Storage 버킷은 최초 설정 후 수정할 수 없다.", "Archive 정책 수행 시점을 7일로 두면 7일 이상 변경이 없는 파일이 자동 아카이빙된다."], "a": 1, "e": "버전 관리는 설정한 시점부터 이력을 관리합니다. 설정 전에 올린 파일의 버전 ID는 null(-)로 표시됩니다.", "src": "모의고사 v1", "id": "3-4c-01"}, {"item": "3-4e", "t": "File · PFS", "q": "SCP(Samsung Cloud Platform)의 File Storage와 Parallel File Storage에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["File Storage 스냅샷은 최대 800개이며, 스케줄 자동 생성분은 별도로 최대 128개이다.", "File Storage는 스냅샷 목록에서 원하는 스냅샷을 골라 복구 볼륨을 만들 수 있다.", "Parallel File Storage 용량은 1~1,000TB 범위에서 입력한다.", "Parallel File Storage는 원하는 이전 시점의 스냅샷으로 바로 복구할 수 있다.", "Parallel File Storage는 wekafs 타입으로 마운트하며, 네트워크 인터페이스 2개로 HA 연결한다."], "a": 3, "e": "Parallel File Storage는 가장 최신 스냅샷으로만 복구할 수 있습니다. 이전 시점으로 돌아가려면 그보다 최신인 스냅샷을 먼저 삭제해야 합니다.", "src": "모의고사 v1", "id": "3-4e-01"}, {"item": "3-5c", "t": "Database", "q": "SCP(Samsung Cloud Platform)의 DBaaS(PostgreSQL, MySQL, MariaDB 등) 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["HA 구성은 Active와 Standby 노드를 두어 장애 시 Standby로 자동 전환한다.", "Read Replica는 읽기 전용 복제본으로 조회 부하를 분산한다.", "Read Replica는 원본 DB 장애 시 자동으로 Active로 승격되어 HA를 대신한다.", "자동 백업을 설정해 보관 기간 안의 백업본으로 복구할 수 있다.", "Database 서비스에도 Planned Compute와 Cost Savings 할인을 적용할 수 있다."], "a": 2, "e": "Read Replica는 읽기 분산용이며 자동 Failover 대상이 아닙니다. 장애 시 자동 전환이 필요하면 HA(Active-Standby)로 구성해야 합니다.", "src": "모의고사 v1", "id": "3-5c-01"}, {"item": "3-6b", "t": "API Gateway · Queue", "q": "SCP(Samsung Cloud Platform)의 API Gateway와 Message Queue 활용에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["API Gateway는 호출 건수 기준(Pay-as-you-go)으로 과금된다.", "API Gateway를 Cloud Functions 트리거로 쓰면 외부에서 함수를 호출할 수 있다.", "Message Queue는 서로 다른 서버 간 비동기 통신을 가능하게 한다.", "Message Queue를 쓰려면 생산자와 소비자의 처리 속도가 반드시 같아야 메시지가 유실되지 않는다.", "메시지는 큐에 저장되므로 소비자가 준비되었을 때 처리할 수 있다."], "a": 3, "e": "Message Queue에서는 생산자와 소비자의 처리 속도나 용량이 일치할 필요가 없습니다. 메시지가 큐에 저장되어 각 서비스가 독립적으로 동작합니다.", "src": "모의고사 v1", "id": "3-6b-01"}, {"item": "3-7e", "t": "Data Analytics", "q": "SCP(Samsung Cloud Platform)의 Data Analytics 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Event Streams는 대용량 실시간 이벤트 스트림을 수집·전달하는 메시징 플랫폼이다.", "Search Engine은 로그와 문서를 색인해 빠른 검색과 분석을 제공한다.", "Vertica는 행(Row) 기반 저장 구조로 OLTP 트랜잭션 처리에 최적화된 DB이다.", "Quick Query는 표준 SQL로 여러 저장소의 대용량 데이터를 조회하는 대화형 쿼리 서비스이다.", "Event Streams, Search Engine, Vertica는 시간 단위(Provisioning)로 과금된다."], "a": 2, "e": "Vertica는 컬럼 기반 MPP 분석 DB로 대용량 OLAP 분석에 적합합니다.", "src": "모의고사 v1", "id": "3-7e-01"}, {"item": "3-8a", "t": "AI · MLOps", "q": "SCP(Samsung Cloud Platform)의 AI/ML 서비스와 MLOps 운영에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["MLOps는 데이터 준비, 학습, 배포, 모니터링을 자동화해 반복 가능한 ML 수명주기를 만든다.", "운영 중 데이터 분포가 바뀌어 성능이 떨어지면(드리프트) 재학습 파이프라인을 실행한다.", "AI&MLOps Platform과 CloudML은 시간 단위(Provisioning)로 과금된다.", "MLOps는 모델을 한 번 배포한 뒤 재학습 없이 고정하여 운영하는 것을 목표로 한다.", "대규모 학습에는 GPU Server나 Multi-node GPU Cluster를, 학습 데이터에는 Parallel File Storage를 함께 검토한다."], "a": 3, "e": "MLOps의 핵심은 지속적인 모니터링과 재학습·재배포입니다. 모델 성능은 시간이 지나며 떨어지므로 고정 운영은 MLOps 목표와 반대입니다.", "src": "모의고사 v1", "id": "3-8a-01"}, {"item": "4-1a", "t": "Backup", "q": "SCP(Samsung Cloud Platform)의 Backup 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server는 VM Image(OS+Data)를 Agentless 방식으로 백업한다.", "Bare Metal Server도 Agentless 방식으로 VM Image 단위 백업을 한다.", "Full Backup 스케줄은 1개, Incremental Backup 스케줄은 최대 6개까지 설정한다.", "Agentless 백업 보관 기간은 2주, 1개월, 3개월, 6개월, 1년 중에서 선택한다.", "복구하면 신규 서버가 생성되며, 복구된 서버의 Block Storage 유형은 원본과 같다."], "a": 1, "e": "Bare Metal Server는 Filesystem을 Agent 방식으로 백업합니다. Agentless VM Image 백업은 Virtual Server용입니다.", "src": "모의고사 v1", "id": "4-1a-01"}, {"item": "4-2a", "t": "네트워크 보안", "q": "SCP(Samsung Cloud Platform)의 네트워크 보안 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["WAF는 SQL Injection, XSS 같은 웹 애플리케이션 공격을 L7에서 탐지·차단한다.", "DDoS Protection은 일정 기간 평시 트래픽을 학습해 이상 트래픽 판단 기준을 정한다.", "IPS는 HTTPS 암호화 트래픽을 기본으로 복호화하여 내부 페이로드까지 탐지·차단한다.", "Secured VPN은 원격 사용자가 암호화된 터널로 사내 자원에 접속하게 한다.", "여러 보안 서비스를 계층으로 조합해 다층 방어를 구성한다."], "a": 2, "e": "IPS는 HTTPS 암호화 트래픽 내부를 검사하지 못합니다. 암호화된 웹 트래픽 공격은 WAF 등 L7 단에서 대응해야 합니다.", "src": "모의고사 v1", "id": "4-2a-01"}, {"item": "4-2f", "t": "KMS", "q": "KMS(Key Management Service)는 암호화 키를 생성하고, 주기적인 키 회전과 키 사용 권한을 관리하는 서비스입니다. KMS에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["KMS는 키 수와 호출 건수를 함께 계산해 과금한다.", "자동 키 회전 주기는 1~365일 범위에서 설정하며 기본값은 30일이다.", "키 삭제를 요청하면 키 사용이 즉시 중지되고, 72시간 뒤 영구 삭제된다.", "데이터는 데이터 키로 암호화하고 데이터 키는 마스터 키로 암호화하는 봉투 암호화를 쓸 수 있다.", "키 사용 권한은 IAM 정책으로 필요한 사용자와 서비스에만 부여한다."], "a": 1, "e": "KMS 자동 회전 주기는 1~730일 범위이며 기본값은 90일입니다.", "src": "모의고사 v1", "id": "4-2f-01"}, {"item": "4-2e", "t": "Secrets", "q": "SCP(Samsung Cloud Platform)의 Secrets Manager와 Secret Vault에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Secrets Manager는 DB 비밀번호 같은 민감 정보를 코드에서 분리해 저장한다.", "Secrets Manager 시크릿 하나에는 Key-Value를 최대 10개, 크기 64KB까지 저장한다.", "Secrets Manager는 시크릿당 최대 100개 버전을 관리한다.", "Secret Vault의 임시키는 유효 기간을 최대 7일까지 설정할 수 있다.", "Secret Vault 임시키를 쓰면 장기 인증키 노출 위험을 줄일 수 있다."], "a": 3, "e": "Secret Vault 임시키의 유효 기간은 최대 36시간입니다. 짧은 수명이 임시키의 보안상 장점입니다.", "src": "모의고사 v1", "id": "4-2e-01"}, {"item": "4-2h", "t": "보안 서비스 매핑", "q": "다음 중 보안 요구사항과 이를 충족하는 SCP(Samsung Cloud Platform) 서비스를 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["웹 페이지의 SQL Injection 공격 차단 - WAF", "대규모 트래픽 폭주형 공격 대응 - DDoS Protection", "소스 코드에 하드코딩된 DB 비밀번호 제거 - Secrets Manager", "임직원 통합 로그인(SSO)과 다중 인증 - SingleID", "클라우드 자원의 보안 설정 규정 준수 점검 - Certificate Manager"], "a": 4, "e": "자원의 보안 설정을 점검하는 서비스는 Config Inspection입니다. Certificate Manager는 SSL/TLS 인증서를 등록·관리하고 만료 전에 알림을 보냅니다.", "src": "모의고사 v1", "id": "4-2h-01"}, {"item": "4-2d", "t": "Certificate · Config", "q": "SCP(Samsung Cloud Platform)의 Certificate Manager와 Config Inspection에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Certificate Manager에 인증서를 등록하면 만료 일정을 한곳에서 관리할 수 있다.", "인증서 만료 알림 시점은 만료 1~60일 전 범위에서 지정한다.", "Config Inspection은 자원 설정을 진단 항목과 비교해 취약 설정을 찾아낸다.", "Cloud Control의 감사 계정은 Config Inspection으로 조직 전체 보안 상태를 점검한다.", "Config Inspection은 취약한 설정을 발견하면 사용자 확인 없이 자원 설정을 자동으로 수정한다."], "a": 4, "e": "Config Inspection은 진단과 결과 제공이 역할입니다. 조치는 진단 결과를 보고 담당자가 수행합니다.", "src": "모의고사 v1", "id": "4-2d-01"}, {"item": "4-3a", "t": "모니터링", "q": "SCP(Samsung Cloud Platform)의 모니터링 서비스에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server의 ServiceWatch 기본 모니터링은 무료이고, 세부 모니터링을 켜면 추가 요금이 붙는다.", "Bare Metal Server의 Cloud Monitoring은 Agent 방식이며 사용자가 직접 설치한다.", "Object Storage는 Cloud Monitoring의 로그 모니터링 대상이다.", "Search Engine, Event Streams, Vertica는 성능 모니터링과 로그 모니터링을 모두 지원한다.", "모니터링은 인프라뿐 아니라 애플리케이션, 네트워크, DB 등 모든 계층에 적용해야 한다."], "a": 2, "e": "Object Storage는 Cloud Monitoring의 성능 모니터링 대상이지만 로그 모니터링 대상은 아닙니다. 로그 모니터링 대상은 Compute, Database, Kubernetes Engine, Data Analytics 일부입니다.", "src": "모의고사 v1", "id": "4-3a-01"}, {"item": "4-3b", "t": "Logging & Audit", "q": "SCP(Samsung Cloud Platform)의 Logging & Audit에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Console, Open API로 수행한 작업 이력을 기록해 누가 언제 무엇을 했는지 추적한다.", "Trail로 저장한 로그 파일은 로그 파일 검증 기능으로 변경·삭제 여부를 확인할 수 있다.", "활동 내역은 자원 유형, 자원명, 기간, 작업 결과, 작업자명 등으로 필터링하여 조회할 수 있다.", "별도 설정 없이 콘솔에서 최대 3년간의 활동 내역을 조회할 수 있다.", "장기 보관이 필요하면 Trail로 Object Storage에 로그를 저장한다."], "a": 3, "e": "별도 설정 없이 콘솔에서 조회할 수 있는 활동 내역은 최근 90일간입니다. 그보다 오래 보관하려면 Trail을 생성해 Object Storage에 저장해야 합니다.", "src": "모의고사 v1; ExploreManagement_2_Logging_Monitoring 슬라이드6~7", "id": "4-3b-01"}, {"item": "4-3c", "t": "네트워크 로그", "q": "A 고객사는 SCP(Samsung Cloud Platform)의 Firewall과 Security Group 로그를 보관하여 사후 분석에 활용하려고 합니다. 네트워크 로그 저장에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Firewall 로그를 저장하려면 로그를 담을 Object Storage 버킷이 먼저 있어야 한다.", "Object Storage 버킷을 만들기 전에 인증키를 생성해야 한다.", "저장된 네트워크 로그로 허용·차단된 트래픽을 사후 분석할 수 있다.", "Firewall 로그는 별도 저장소 없이 콘솔에서 기간 제한 없이 조회할 수 있다.", "로그 보관 버킷은 접근 허용 IP와 서비스 자원을 제한해 무단 접근을 막는다."], "a": 3, "e": "네트워크 로그는 Object Storage 버킷에 저장해야 보관됩니다. 순서는 인증키 생성 → Object Storage 버킷 생성 → 로그 저장 설정입니다.", "src": "모의고사 v1", "id": "4-3c-01"}, {"item": "2-1b", "t": "운영 우수성", "q": "운영 우수성 관점의 장애 대응과 변경 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["IaC(Terraform, CLI, Open API)로 인프라를 코드화하면 같은 환경을 반복해서 정확히 배포할 수 있다.", "근본 원인 분석(RCA)은 장애 담당자의 책임을 확정하는 것이 주목적이다.", "장애 대응 절차를 런북으로 문서화하고 정기적으로 훈련한다.", "RCA 결과로 나온 개선 조치를 추적해 같은 장애가 다시 나지 않게 한다.", "변경은 작고 되돌릴 수 있는 단위로 자주 배포한다."], "a": 1, "e": "RCA는 비난 없는(Blameless) 방식으로 근본 원인을 찾아 재발을 막는 것이 목적입니다.", "src": "모의고사 v1", "id": "2-1b-02"}, {"item": "3-1f", "t": "시나리오", "q": "C 고객사는 SCP(Samsung Cloud Platform)에서 인터넷에 공개된 웹 서비스를 운영하고 있습니다. C 고객사의 보안 운영을 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["VPC 경계 트래픽은 Firewall로, 웹·WAS·DB 서버 간 트래픽은 Security Group으로 제어한다.", "운영 편의를 위해 Firewall 최상단에 Any/Any 허용 규칙을 두고, 그 아래에 세부 차단 규칙을 추가한다.", "애플리케이션의 DB 접속 정보는 Secrets Manager에 저장해 코드에서 분리한다.", "운영자의 API 호출에는 장기 인증키 대신 Secret Vault 임시키를 사용한다.", "Logging & Audit 이력을 Trail로 Object Storage에 장기 보관해 감사에 대비한다."], "a": 1, "e": "Firewall은 위에서 아래로 평가하고 처음 일치한 규칙을 적용합니다. 최상단에 Any/Any 허용이 있으면 아래의 차단 규칙은 절대 적용되지 않습니다.", "src": "모의고사 v1", "id": "3-1f-01"}, {"item": "4-1b", "t": "시나리오", "q": "D 고객사는 주문 시스템의 재해 복구 목표를 RTO 4시간, RPO 1시간으로 정의하였습니다. D 고객사를 위한 재해 복구 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["주문 DB 데이터를 DR 사이트로 지속적으로 복제해 데이터 손실 구간을 줄인다.", "Backup은 하루 1회 Full Backup만 수행해 비용을 최소화한다.", "DR 사이트에는 축소 규모 환경(Warm Standby)을 상시 운영하고 재해 시 확장한다.", "재해 시 GSLB로 사용자 트래픽을 DR 사이트로 전환한다.", "DR 전환 절차를 정기적으로 훈련해 실제 복구 시간이 RTO 안에 드는지 확인한다."], "a": 1, "e": "하루 1회 Full Backup만 하면 최악의 경우 24시간치 데이터를 잃어 RPO 1시간을 지킬 수 없습니다. 지속 복제나 짧은 주기의 Incremental Backup이 필요합니다.", "src": "모의고사 v1", "id": "4-1b-01"}, {"item": "1-1a", "t": "ID Center", "q": "SCP(Samsung Cloud Platform)의 ID Center에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["ID Center를 생성하면 자동으로 Organization과 연결된다.", "권한 세트의 최대 세션 지속시간은 Access Portal을 통해 Console에 진입할 때 허용되는 시간으로, 1~12시간 범위에서 설정한다.", "Access Portal URL은 ID Center 생성 시 자동으로 발급되므로 별도 신청 없이 바로 사용할 수 있다.", "ID Center 사용자 추가 시 사업부, 부서, 관리자, 사번 등의 소속 정보를 입력할 수 있다.", "사용자는 Access Portal을 통해 자신에게 할당된 Account와 권한 세트로만 자원에 접근할 수 있다."], "a": 2, "e": "Access Portal을 사용하려면 SR을 통해 Access Portal URL 사용 신청을 해야 한다. ID Center 생성 시 Organization과의 연결은 자동이지만, Access Portal URL은 자동 발급되지 않는다는 점을 구분해야 한다.", "src": "ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드10, 20, 23~24, 27", "id": "1-1a-04"}, {"item": "1-1a", "t": "Organization OU", "q": "SCP(Samsung Cloud Platform) Organization에서 랜딩 존 권장 구성 예시에 따라 Account를 조직 단위(OU)로 배치하려 합니다. OU와 Account의 연결이 적절하지 않은 것은 무엇입니까?", "o": ["Security OU – Audit Account", "Common OU – Network Account", "Workload OU – Production Account", "Sandbox OU – Sandbox Account", "Workload OU – Log Account"], "a": 4, "e": "구성 예시에서 Audit, Log Account는 Security OU에, Shared, Network Account는 Common OU에, Dev, Production Account는 Workload OU에 배치된다. Log Account는 보안·감사 목적의 Account이므로 Workload OU가 아니라 Security OU에 속한다.", "src": "ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드8", "id": "1-1a-05"}, {"item": "1-1a", "t": "Organization Account 추가", "q": "SCP(Samsung Cloud Platform) Organization의 Account 추가 및 관리에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["기존 Account를 초대할 때는 해당 Account의 Root 사용자 이메일을 입력하며, 초대받은 소유자가 초대를 수락해야 한다.", "신규 Account를 생성할 때는 Account명과 이메일만 입력하며, IAM 역할명은 생성 후 각 Account에서 따로 지정한다.", "기존 Account를 초대할 때는 초대할 Account의 Account ID와 IAM 사용자명을 입력해야 한다.", "Organization에 속한 Account의 비용은 Account별로만 청구되며, 통합 청구는 지원하지 않는다.", "통제 정책(ACP)은 개별 Account에만 연결할 수 있고, 조직 단위(OU)에는 연결할 수 없다."], "a": 0, "e": "기존 Account 초대는 Root 사용자 이메일만으로 진행되고, 초대 수락은 메일 또는 콘솔 '받은 초대' 메뉴에서 한다. 신규 Account 생성 시에는 Account명, 이메일과 함께 IAM 역할명도 입력하며, Organization은 통합 청구와 OU 단위 통제 정책 연결을 지원한다.", "src": "ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드7~8, 15~18", "id": "1-1a-06"}, {"item": "1-1b", "t": "인증키 관리", "q": "SCP(Samsung Cloud Platform)에서 인증키(Access Key)를 안전하게 관리하는 방법에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["CLI와 Open API를 이용해 작업하려면 인증키가 반드시 필요하다.", "Console 접근에 다중 인증(MFA)을 적용하면 같은 사용자가 발급한 인증키에도 MFA가 자동 적용되므로, 인증키는 별도로 관리할 필요가 없다.", "유출 위험에 대비해 영구 인증키 사용은 지양하고, 키의 유효 기간을 지정하는 것이 바람직하다.", "인증키를 사용할 경우 접근 가능한 IP 대역을 지정하여 외부의 무단 접근을 차단할 수 있다.", "인증키 대신 Secret Vault를 통해 Token을 발행하고 임시키를 사용하면 보안을 더욱 강화할 수 있다."], "a": 1, "e": "WA 보안성 백서는 Console 접근에는 다중 인증을 수행하지만 인증키는 동일하게 관리할 수 없으므로 별도의 관리와 주의가 필요하다고 설명한다. 만료 기간 지정, 접속 IP 제한, 임시키 사용이 설계 원칙이다.", "src": "WA백서 02 p.11~13", "id": "1-1b-01"}, {"item": "1-1b", "t": "Secret Vault 임시키", "q": "다음은 Secret Vault를 이용해 OpenAPI 임시키로 SCP(Samsung Cloud Platform) 자원에 접근하는 과정입니다. 순서를 올바르게 나열한 것은 무엇입니까?", "o": ["ㄴ → ㄱ → ㄹ → ㅁ → ㄷ", "ㄴ → ㄹ → ㅁ → ㄱ → ㄷ", "ㄹ → ㄴ → ㄱ → ㅁ → ㄷ", "ㄴ → ㄹ → ㄱ → ㅁ → ㄷ", "ㄴ → ㅁ → ㄹ → ㄱ → ㄷ"], "a": 3, "e": "사전에 Console에서 발급한 인증키로 Secret Vault에 Token을 요청해 받고, 그 Token을 Application에 설정한 뒤, Token으로 OpenAPI 임시키를 발급받아 자원에 접근한다. 인증키는 Token 발급에, Token은 임시키 발급에 쓰인다는 점이 핵심이다.", "src": "SEC4_KMS_SecretVault_SecretsManager 슬라이드25, WA백서 02 p.13", "s": "ㄱ. 발급받은 Token을 Application에 설정한다.\nㄴ. SCP Console에서 인증키를 발급받는다.\nㄷ. 발급받은 OpenAPI 임시키를 사용하여 SCP의 서비스 및 자원에 접근한다.\nㄹ. 인증키 정보를 이용해 Secret Vault에 Token을 요청하고, Secret Vault가 Token을 생성하여 발급한다.\nㅁ. Token 정보로 API를 호출해 OpenAPI 임시키를 발급받는다.", "fix": true, "id": "1-1b-02"}, {"item": "1-1b", "t": "IAM 인증 유형", "q": "A 고객사 보안팀은 유출 위험이 있는 인증키 기반의 CLI·Open API 호출에 대해서만 특정 자원의 삭제를 거부하고, Console에 로그인한 사용자에게는 이 거부 정책이 적용되지 않도록 IAM 정책을 작성하려고 합니다. 정책의 권한 설정에서 선택해야 할 항목으로 가장 적합한 것은 무엇입니까?", "o": ["인증 유형: 전체", "인증 유형: 임시키 인증, Console 로그인", "인증 유형: 인증키 인증", "적용 IP: 모든 IP", "적용 IP: 사용자 지정 IP"], "a": 2, "e": "IAM 정책의 인증 유형은 '전체', '인증키 인증', '임시키 인증, Console 로그인'으로 나뉘며, 인증키 인증은 인증키로 인증한 사용자에게만 적용된다. '임시키 인증, Console 로그인'은 임시키 사용자나 Console 로그인 사용자에게 적용되므로 요구사항과 반대이다.", "src": "ExploreManagement_1_IAM 슬라이드18", "id": "1-1b-03"}, {"item": "1-1c", "t": "IAM 역할", "q": "SCP(Samsung Cloud Platform) IAM의 역할(Role)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["역할의 수행 주체 유형을 '서비스'로 선택하면 Virtual Server, Kubernetes Engine 등 모든 SCP 서비스를 수행 주체로 지정할 수 있다.", "역할은 별도 권한을 지닌 가상의 사용자 정보로, 본래 사용자 계정이 가진 권한에 영향을 받지 않는다.", "역할의 최대 세션 지속시간은 최소 1시간에서 최대 12시간까지 설정할 수 있다.", "수행 주체로 현재 Account, 다른 Account의 Account ID, 사용자 SRN, 자격 증명 공급자 등을 연결할 수 있다.", "특정 Account ID 또는 SRN 정보를 연계해 역할을 부여하면, 해당 사용자는 역할에 부여된 권한으로 특정 자원에 제한적으로 접근할 수 있다."], "a": 0, "e": "역할 수행 주체 유형 중 '서비스'에서 선택할 수 있는 것은 API Gateway와 Config Inspection이다. 역할은 다른 사용자의 접근을 임시로 허용하는 기능이며 세션 지속시간은 1~12시간이다.", "src": "ExploreManagement_1_IAM 슬라이드6, 25~26", "id": "1-1c-02"}, {"item": "1-1c", "t": "IAM 사용자·그룹", "q": "SCP(Samsung Cloud Platform) IAM 사용자와 사용자 그룹에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["관리자(Root 사용자) 또는 Root 사용자로부터 IAM 사용자 생성 권한을 부여받은 IAM 사용자는 IAM 사용자를 생성할 수 있다.", "비밀번호를 자동 생성으로 선택하면 사용자 생성 시점에 생성된 비밀번호를 확인할 수 있다.", "사용자 그룹을 생성할 때 추가할 사용자가 없으면 신규 사용자를 먼저 등록할 수 있다.", "IAM 사용자에게는 정책을 직접 연결할 수 없으며, 반드시 사용자 그룹을 통해서만 권한을 받을 수 있다.", "사용자 그룹은 동일한 권한을 부여받은 사용자들의 집합으로, 정책과 사용자를 연결하는 역할을 한다."], "a": 3, "e": "IAM 사용자는 사용자 그룹에 추가해 그룹 정책을 상속받을 수도 있고, 사용자 상세의 권한 탭에서 정책을 직접 연결할 수도 있다. 다만 운영 측면에서는 그룹 단위 권한 관리가 권장된다.", "src": "ExploreManagement_1_IAM 슬라이드7, 19~24", "id": "1-1c-03"}, {"item": "1-1c", "t": "IAM 사용자 관리 모범사례", "q": "B 기업은 SCP(Samsung Cloud Platform) 도입 후 입사·퇴사·부서 이동이 잦아 IAM 사용자 권한 관리 부담이 커지고 있습니다. 또한 유일한 관리자가 휴대전화를 분실해 관리자 접속이 불가능했던 사고도 있었습니다. B 기업을 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["부서·프로젝트팀 단위로 사용자 그룹을 만들어 최소 권한 정책을 연결하고, 사용자는 그룹 등록·해제 방식으로 관리한다.", "AdministratorAccess가 연결된 사용자 그룹에 주 관리자와 보조 관리자를 함께 지정한다.", "사용자와 그룹 구성원을 정기적으로 검토하여 과업에 필요한 사용자만 포함되어 있는지 점검한다.", "Console 및 API에 접근하는 단말의 IP 주소를 지정하여 인증 정보 유출 시 외부의 무단 접근을 차단한다.", "인사 변동이 잦으므로 그룹 대신 사용자마다 정책을 직접 연결하여 개인 단위로 권한을 세밀하게 관리한다."], "a": 4, "e": "WA 보안성 백서는 사용자에게 직접 정책을 연결하는 것을 최소화하고 권한 그룹에 사용자를 등록·해제하는 RBAC 방식을 권장한다. 직접 연결은 변경 누락 가능성을 높여 관리 부담을 오히려 키운다.", "src": "WA백서 02 p.14~16", "id": "1-1c-04"}, {"item": "1-1d", "t": "IAM 기본 정책", "q": "SCP(Samsung Cloud Platform) IAM의 기본 정책에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["SCP는 '26년 7월 기준 27개의 IAM 기본 정책을 제공한다.", "기본 정책은 SCP에서 사전 정의한 정책이지만, 조직의 요건에 맞게 내용을 직접 수정하여 사용할 수 있다.", "OperatorAccess는 Account, IAM, Organization, ID Center 서비스의 생성, 수정, 삭제를 제외한 전체 서비스의 전체 기능을 사용할 수 있는 권한이다.", "ViewerAccess는 전체 서비스에 대해 조회를 할 수 있는 권한이다.", "기본 정책과 사용자 정의 정책 모두 여러 주체에 재사용할 수 있다."], "a": 1, "e": "기본 정책은 수정 불가(읽기 전용)이며, 조직에 맞춘 제한·확장이 필요하면 사용자 정의 정책을 만들어 사용한다. 재사용은 두 유형 모두 가능하다.", "src": "ExploreManagement_1_IAM 슬라이드8~10", "id": "1-1d-01"}, {"item": "1-1d", "t": "IAM 정책 권한 설정", "q": "SCP(Samsung Cloud Platform) IAM 정책의 작성과 권한 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["하나의 정책에는 하나의 서비스만 설정할 수 있으므로, 여러 서비스의 권한이 필요하면 서비스마다 정책을 따로 생성해야 한다.", "자원 접근 권한 설정은 정책 설정, 권한 주체 생성 및 관리, 정책 연결 순서로 진행한다.", "적용 자원을 '개별 자원'으로 지정하면 선택한 액션이 지정된 자원에 대해서만 적용된다.", "적용 IP를 '모든 IP'로 선택하면 IP 기반의 접근 제한을 하지 않는다.", "정책은 기본 모드와 JSON 모드로 작성할 수 있으며, Wildcard를 사용해 여러 액션을 한 번에 지정할 수 있다."], "a": 0, "e": "정책 생성 시 권한을 설정할 서비스를 추가해 하나의 정책에 여러 서비스의 권한을 함께 설정할 수 있다. 권한 관리는 정책 설정 → 권한 주체 생성·관리 → 정책 연결 순서로 진행하며, 적용 자원은 모든 자원 또는 개별 자원으로 지정한다.", "src": "ExploreManagement_1_IAM 슬라이드12, 14, 16~18", "id": "1-1d-02"}, {"item": "1-1d", "t": "IAM 허용·거부 정책", "q": "SCP(Samsung Cloud Platform) IAM에서 A 기업 개발팀 사용자 그룹에는 Object Storage의 모든 액션을 허용하는 정책 A가 연결되어 있습니다. 관리자가 운영 버킷의 삭제 액션을 '접근 거부'로 지정한 사용자 정의 정책 B를 같은 그룹에 추가로 연결했을 때, 개발팀 사용자가 운영 버킷 삭제를 시도한 결과로 옳은 것은 무엇입니까?", "o": ["정책 A가 더 넓은 범위를 허용하므로 삭제가 허용된다.", "동일 대상에는 거부 정책이 우선 적용되므로 삭제가 거부된다.", "나중에 연결된 정책 B만 적용되고 정책 A는 자동으로 연결 해제된다.", "허용과 거부가 충돌하므로 두 정책이 모두 무효가 되어 Object Storage 전체에 접근할 수 없다.", "그룹에 연결된 정책 간에는 우선순위가 없으므로 정책을 연결한 순서에 따라 결과가 달라진다."], "a": 1, "e": "IAM 정책의 제어 유형은 허용 정책과 거부 정책으로 나뉘며, 동일 대상에는 거부 정책이 우선 적용된다. 따라서 정책 A의 허용 범위와 관계없이 삭제 액션은 거부된다.", "src": "ExploreManagement_1_IAM 슬라이드16", "id": "1-1d-03"}, {"item": "1-1e", "t": "Cloud Control 랜딩 존", "q": "SCP(Samsung Cloud Platform) Cloud Control에서 랜딩 존을 생성할 때의 공유 Account 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Cloud Control 서비스를 사용하려면 사전에 랜딩 존을 생성해야 한다.", "Management Account에는 Cloud Control, Organization, ID Center가 위치하며 조직·계정 구조 관리와 정책 적용을 담당한다.", "Log Account는 모든 Account의 로그를 중앙에서 수집·저장하고, Audit Account는 Config Inspection을 통해 조직 전체의 보안·컴플라이언스를 감사한다.", "관리 편의를 위해 Log Account와 Audit Account는 동일한 이메일 주소로 생성할 수 있다.", "Account 액세스 구성은 'ID Center를 통한 Account 액세스'와 '자체 관리형 Account 액세스' 중에서 선택한다."], "a": 3, "e": "랜딩 존의 공유 Account 구성에서 Audit Account에는 Log Account와 동일한 이메일을 사용할 수 없다. 관리·로그·감사 Account가 역할별로 분리되는 것이 랜딩 존 구조의 핵심이다.", "src": "ExploreManagement_3_Cloud_Control 슬라이드8~9, 15~20", "id": "1-1e-03"}, {"item": "1-1e", "t": "Cloud Control 가드레일·주요 기능", "q": "SCP(Samsung Cloud Platform) Cloud Control의 주요 기능에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["대시보드를 통해 전체 조직의 Account, OU, 가드레일 적용 현황과 규정 준수 상태를 시각적으로 모니터링할 수 있다.", "Organization의 ACP(Access Control Policy), Config Inspection 등과 연동하여 가드레일을 적용한다.", "예방 가드레일은 진단을 수행하여 이미 생성된 정책 위반 리소스를 탐지하고 알림을 보내는 방식으로 동작한다.", "ID Center와 연동하여 Account별 접근 제어와 권한 그룹을 통합 관리할 수 있다.", "정책 위반, Cloud Control 설정 변경 등에 대해 실시간 알림을 제공한다."], "a": 2, "e": "예방(Preventive) 가드레일은 정책 위반 리소스의 생성 자체를 차단하고, 진단을 통해 정책 위반 리소스를 탐지·알림하는 것은 탐지(Detective) 가드레일이다. 두 가드레일의 동작을 바꿔 묻는 경우에 주의해야 한다.", "src": "ExploreManagement_3_Cloud_Control 슬라이드9~10, 44", "id": "1-1e-04"}, {"item": "1-1e", "t": "Quota Service", "q": "SCP(Samsung Cloud Platform)의 Quota Service에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Quota Service는 별도의 이용 요금 없이 무료로 제공된다.", "100개 이상의 서비스 Quota 아이템을 단일 콘솔에서 중앙 집중 관리할 수 있다.", "서비스별 기본 Quota, 적용 Quota, 조정 가능 여부를 조회할 수 있다.", "Quota 증가 요청의 상태(보류 중, 승인, 거부)를 추적할 수 있고, 과거 요청 내역과 사용 추이를 리소스 계획에 활용할 수 있다.", "Quota 정보는 Account 수준으로만 제공되며, 리전 단위로는 구분하여 관리할 수 없다."], "a": 4, "e": "Quota Service는 리전 수준 Quota와 Account 수준 Quota를 구분하여 제공하며, 계정 수준에서 리전 수준까지 세밀하게 관리할 수 있다는 점이 특장점이다.", "src": "ExploreManagement_6_Quota_Service 슬라이드10~11, 28", "id": "1-1e-05"}, {"item": "1-1f", "t": "SCP Copilot", "q": "SCP(Samsung Cloud Platform)의 생성형 AI 기반 업무 보조 서비스인 Copilot에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Copilot은 자원 조회와 질의응답만 지원하므로, 자원 생성은 각 서비스의 Console 메뉴에서 직접 수행해야 한다.", "자연어 기반으로 업무를 요청하고 자동화 처리할 수 있다.", "SCP에서 생성한 인스턴스의 상태, 자원의 설정, 예상 비용을 실시간으로 확인할 수 있다.", "구성된 자원 간 연관 관계를 도식화하여 직관적으로 파악할 수 있다.", "자원 상세 화면으로 이동하지 않고도 자원의 주요 정보를 확인할 수 있다."], "a": 0, "e": "Copilot은 'Virtual Server 생성해 줘'와 같은 프롬프트로 자원 생성을 즉시 진행할 수 있도록 지원한다. 자연어 요청, 실시간 자원·비용 확인, 관계 도식화가 주요 기능이다.", "src": "ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드6, 12", "id": "1-1f-02"}, {"item": "1-1f", "t": "Architecture Diagram", "q": "A 고객사 엔지니어는 SCP(Samsung Cloud Platform) Copilot을 이용해 web 서버, was 서버, Load Balancer, Security Group 등으로 웹 사이트를 구성했습니다. 생성한 인프라와 자원 간 연결 관계를 구성도 형태로 한눈에 확인하려고 할 때 가장 적합한 서비스는 무엇입니까?", "o": ["Resource Explorer", "Architecture Diagram", "Resource Groups", "Cloud Monitoring", "Config Inspection"], "a": 1, "e": "Architecture Diagram은 생성한 인프라를 구성도로 시각화해 클라우드 환경을 한눈에 이해하도록 해주며, Copilot에 '내가 생성한 자원을 구성도로 보여 줘'라고 요청해 확인할 수 있다. Resource Explorer와 Resource Groups는 자원 검색·그룹화 서비스로 구성도를 그리지 않는다.", "src": "ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드23, 49", "id": "1-1f-03"}, {"item": "1-1f", "t": "탄소 배출량", "q": "C 기업은 ESG 경영 보고를 위해 SCP(Samsung Cloud Platform) 사용에 따른 탄소 배출량을 확인하려고 합니다. 탄소 배출량을 확인할 수 있는 서비스와 제공 정보를 올바르게 연결한 것은 무엇입니까?", "o": ["Cloud Monitoring – 자원별 CPU 사용률 기반 실시간 탄소 배출량 알림", "Resource Explorer – 리전별·태그별 탄소 배출량 검색", "Quota Service – 서비스별 탄소 배출 한도와 증가 요청 이력", "Cost Management – 월별 탄소 배출량 추이, 서비스군별·Account별 탄소 배출량", "Logging&Audit – 사용자 활동 기반 탄소 배출량 감사 로그"], "a": 3, "e": "탄소 배출량 확인은 Cost Management의 기능으로, 탄소 배출량과 월별 추이, 서비스군별·Account별 탄소 배출량 정보를 제공한다. 비용 관리 서비스에 포함되어 있다는 점을 기억해야 한다.", "src": "ExploreManagement_7_Financial_Management 슬라이드7~8", "id": "1-1f-04"}, {"item": "1-2a", "t": "Console·CLI·Open API", "q": "SCP(Samsung Cloud Platform) 서비스에 접근하는 방식(Console, CLI, Open API)에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["클라우드 서비스는 REST API 기반으로 동작하므로, Console이든 CLI든 서비스를 실행하려면 API 호출이 이뤄진다.", "Console은 가장 기본적인 작업 도구이며, Console 접근 시에는 다중 인증(MFA)을 수행한다.", "Console에서 수행한 작업은 API를 거치지 않고 자원을 직접 제어하므로, CLI·Open API와 달리 API 호출이 발생하지 않는다.", "CLI와 Open API를 이용한 작업도 가능하지만, 이 경우 인증키가 반드시 필요하다.", "Open API는 RESTful API 방식으로 제공되며 JSON 형식으로 응답한다."], "a": 2, "e": "WA 보안성 백서는 Console이든 CLI든 관계없이 서비스 실행을 위해 API 호출이 이뤄진다고 설명한다. Console 작업도 API 호출로 처리되며, 차이는 인증 방식(MFA 대 인증키)에 있다.", "src": "WA백서 02 p.12, SEC4_KMS_SecretVault_SecretsManager 슬라이드48", "id": "1-2a-02"}, {"item": "1-2a", "t": "Terraform·IaC", "q": "D 기업은 SCP(Samsung Cloud Platform)의 kr-west1과 kr-east1 Region에 동일한 VM 환경을 반복 배포하기 위해 코드형 인프라(IaC)를 도입하려고 합니다. D 기업을 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["SCP가 제공하는 CLI와 Open API를 기반으로 Terraform을 활용해 자원 배치를 자동화한다.", "Terraform 작업용 인증키를 생성하고 환경 설정을 완료한 뒤, 배포할 자원과 환경 구성을 코드로 작성한다.", "배포 완료 상태를 정의 파일에 명시하고 그 상태를 유지하도록 동작하는 선언형 도구를 운영 환경에 적용한다.", "IaC 도구에 사용하는 인증키는 만료 기간과 접속 IP 주소를 지정하여 접근 보안을 강화한다.", "지시형 도구는 배포 실패나 장애로 변경이 생겨도 정의된 상태로 자동 복구하므로, 운영자 개입을 줄이기 위해 지시형 도구를 사용한다."], "a": 4, "e": "실패나 변경 시 선언된 상태로 자동 복구하려는 것은 선언형 도구의 특성이며, 지시형 도구는 단계별 지시 방식이라 운영자가 직접 개입해야 하는 경우가 많다. 그래서 운영 환경에는 선언형 도구가 더 적합하다고 평가된다.", "src": "WA백서 05 p.13, WA백서 02 p.12", "id": "1-2a-03"}, {"item": "1-2a", "t": "접근 방식별 보안", "q": "SCP(Samsung Cloud Platform) 접근 방식과 그에 맞는 인증·보안 조치를 연결한 것으로 옳지 않은 것은 무엇입니까?", "o": ["CLI – Console 로그인 세션을 그대로 이어받으므로 인증키 없이 사용할 수 있다.", "Console – 접속 시 다중 인증(MFA)을 위한 본인 인증을 수행한다.", "CLI – 인증키를 사용하며, 인증키에 접근 가능한 IP 대역을 지정해 무단 접근을 차단한다.", "Open API를 호출하는 Application – Secret Vault에서 발급받은 Token으로 OpenAPI 임시키를 발급받아 사용한다.", "Console – IAM 정책의 인증 유형을 '임시키 인증, Console 로그인'으로 지정하면 Console 로그인 사용자에게 해당 정책이 적용된다."], "a": 0, "e": "CLI와 Open API를 이용한 작업에는 인증키가 반드시 필요하며, Console의 MFA와는 별개로 관리해야 한다. Console 로그인 사용자는 정책 인증 유형 중 '임시키 인증, Console 로그인'의 적용 대상이다.", "src": "WA백서 02 p.11~13, ExploreManagement_1_IAM 슬라이드18, ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드9", "id": "1-2a-04"}, {"item": "1-2b", "t": "Cost Management 예산", "q": "SCP(Samsung Cloud Platform) Cost Management의 이용 및 청구 내역과 예산 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["이용 및 청구 내역에서는 1일부터 전일까지 사용한 비용과 이번 달 월말 예상 비용(청구 금액)을 확인할 수 있다.", "이용 및 청구 내역에서 Planned Compute, Cost Savings 등으로 할인된 요금과 어카운트별 상세 요금을 확인할 수 있다.", "'전체 예산 설정'은 설정한 월부터 사용한 금액을 누적하여 계산한다.", "'월별 예산 설정'은 설정한 월부터 사용 금액을 누적 계산하므로 연간 총액 관리에 적합하다.", "예산 소진율이 임계치에 도달하면 알림을 발송하도록 설정할 수 있으며, 알림 반복 발송 여부와 수신자를 지정할 수 있다."], "a": 3, "e": "월별 예산 설정은 월 단위로 사용 금액이 초기화되고, 설정한 월부터 누적 계산하는 것은 전체 예산 설정이다. 두 유형의 동작을 바꿔 묻는 경우에 주의해야 한다.", "src": "ExploreManagement_7_Financial_Management 슬라이드12~13, 21~22", "id": "1-2b-05"}, {"item": "1-2b", "t": "Cost Savings·Planned Compute", "q": "E 고객사는 지난 1년간의 SCP(Samsung Cloud Platform) 사용 패턴이 향후에도 유지된다고 보고 요금제를 설계하려고 합니다. E 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["같은 서버 타입의 GPU Server를 정기적으로 1~4대 변동 운영하므로, 해당 인스턴스 타입을 약정하는 Planned Compute를 적용한다.", "향후 수직 확장(사양 변경) 가능성이 있는 MySQL(DBaaS)은 인스턴스 타입을 기준으로 약정하는 Planned Compute를 적용해 할인 효과를 고정한다.", "비정기적으로 가동하는 Virtual Server와 정기적 부하를 처리하는 Auto-Scaling의 최소 수량은 Cost Savings를 적용한다.", "Cost Savings의 시간당 약정 금액은 과도하게 설정하면 사용하지 않은 비용도 지불할 수 있으므로 보수적으로 시작해 점진적으로 최적화한다.", "1년·3년 약정의 만료일을 기준으로 3개월 또는 반기 단위의 자원 조정 검토 주기를 설정한다."], "a": 1, "e": "WA 비용최적화 백서의 설계 예시에서 수직 확장 가능성이 있는 Database는 시간당 사용 금액을 약정하는 Cost Savings를 적용한다. Planned Compute는 인스턴스 타입 기준 약정이므로 타입이 고정적으로 유지되는 워크로드에 적합하다.", "src": "WA백서 06 p.5~7, p.13", "id": "1-2b-06"}, {"item": "1-2b", "t": "Resource Groups·태그", "q": "SCP(Samsung Cloud Platform)의 Resource Explorer와 Resource Groups를 활용한 태그 기반 자원 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Resource Explorer의 리소스 목록에서 여러 자원을 지정해 태그를 일괄 추가할 수 있다.", "Resource Explorer에서는 자원명, 서비스명, 자원 유형, 리전, 태그 필터로 검색 결과를 세분화할 수 있다.", "Resource Group 생성 시 Resource Group명을 입력하고 자원 유형과 그룹핑 기준 태그를 지정하면, 선택한 자원 유형에 따라 대상 자원을 확인할 수 있다.", "자원의 용도, 테스트 완료 시점, 만료 기간 등을 수명주기 태그로 관리하면 유휴 자원 식별과 폐기 절차 수립에 활용할 수 있다.", "Resource Group은 생성 후 그룹 자원 유형이나 그룹 정의 태그를 수정할 수 없으므로, 기준을 바꾸려면 그룹을 새로 생성해야 한다."], "a": 4, "e": "Resource Group은 생성 후에도 그룹 자원 유형과 그룹 정의 태그를 수정할 수 있다. 태그는 Resource Groups의 그룹화 기준이자 비용 할당·수명주기 관리의 기반이 된다.", "src": "ExploreManagement_8_Resource_Management 슬라이드11, 13~15, WA백서 06 p.17", "id": "1-2b-07"}, {"item": "2-1a", "t": "비용최적화 복합 설계(임시 부하)", "q": "온라인 티켓 예매 서비스를 운영하는 A사는 인기 공연 예매 개시 직후 순간적으로 요청이 폭증했다가 좌석이 소진되면 급감하는 패턴을 겪고 있습니다. A사는 평상시 부하는 기존 Virtual Server Auto-Scaling으로 처리하고, 예매 이벤트 기간의 급증 부하만 SCP(Samsung Cloud Platform) 서비스를 조합한 임시 아키텍처로 처리해 비용을 최소화하려 합니다. A사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["부하 증가 속도가 VM 생성 속도보다 빠른 구간은 Auto-Scaling만으로 대응하기 어려우므로 Serverless Computing 기반 임시 서비스를 추가해 처리한다.", "Cloud Functions는 Cold Start라는 사전 가동 시간이 필요하므로, 예매 개시 시점 이전에 준비가 완료되도록 배포한다.", "임시 주문 저장소로 쓰는 CacheStore는 요청 기반 과금 서비스이므로 사전에 배포하지 않고, 이벤트 중 요청이 들어올 때 자동으로 생성되도록 구성한다.", "API Gateway로 요청을 분배하고, 정적 Web 요청은 Object Storage 버킷의 Web 자산으로 응답한다.", "처리가 끝나면 CacheStore의 임시 주문 데이터를 주 Database로 배치 저장하고, 임시 자원은 삭제하거나 중지한다."], "a": 2, "e": "CacheStore처럼 Provisioning이 필요한 서비스는 이벤트 전에 새로 배포한 뒤 정지 상태로 준비해 두어야 합니다. 요청 기반 과금이라 사전 배포가 가능한 것은 Cloud Functions, API Gateway 같은 서비스입니다.", "src": "WA백서 06 p.9~10", "id": "2-1a-02"}, {"item": "2-1a", "t": "요금제(Cost Savings/Planned Compute)", "q": "SCP(Samsung Cloud Platform)의 할인 요금제 설계에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Cost Savings는 1년 또는 3년 동안 시간당 사용 금액을 약정하는 조건으로 요금을 할인받는다.", "Planned Compute는 1년 또는 3년 동안 사용할 인스턴스 타입을 약정하는 조건으로 요금을 할인받는다.", "최소 1대에서 최대 4대까지 정기적으로 변동하며 월 1,460시간 사용하는 GPU Server는 Planned Compute로 해당 서버 타입의 할인을 적용할 수 있다.", "Cost Savings는 향후 사용량 증가에 대비해 약정 금액을 넉넉하게 설정한 뒤 점진적으로 줄여 나가는 것이 바람직하다.", "서비스별 무약정 요금과 1년/3년 할인이 적용된 요금은 요금계산기로 확인할 수 있다."], "a": 3, "e": "Cost Savings는 금액을 과도하게 약정하면 사용하지 않은 금액까지 지불하게 되므로 보수적으로 시작해 점진적으로 최적화해야 합니다. 약정 금액은 '넉넉하게'가 아니라 '보수적으로' 정하는 것이 원칙입니다.", "src": "WA백서 06 p.5~7", "id": "2-1a-03"}, {"item": "2-1a", "t": "네트워크 전송비용·공통 서비스 영역", "q": "B 기업은 여러 지사 홈페이지를 다중 VPC 구조로 SCP(Samsung Cloud Platform)에 통합 이전하면서 비용을 최적화하려 합니다. 이에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["여러 VPC의 서버 간 연결은 인터넷 경유를 지양하고 VPC Peering 또는 Transit Gateway로 프라이빗 통신을 구성한다.", "운영 시작 후 예상하지 못한 비용의 대표적인 예는 VPC 외부로 전송되는 데이터에 부과되는 Internet Outbound Traffic 비용이다.", "본사·지사 VPC와 별도의 공통 서비스 VPC를 허브 앤 스포크(Hub-and-Spoke) 방식의 VPC Peering으로 연결한다.", "상용 소프트웨어가 설치된 서버를 공통 서비스 영역으로 구성하면 자원과 라이선스 비용의 중복 투자를 줄일 수 있다.", "Bastion Server, Logging 서버 등 관리 서버를 공통 영역에 단일 접점으로 구성하면 보안상 단일 취약점이 될 위험도 함께 사라진다."], "a": 4, "e": "관리 서버를 별도로 구성해 외부 접점을 단일화할 수 있지만, 그 단일 접점은 외부 침해에 대비가 필요하며 보안상 단일 취약점이 될 수 있어 주의해야 합니다.", "src": "WA백서 06 p.10~12", "id": "2-1a-04"}, {"item": "2-1b", "t": "배포 전략", "q": "다음 설명에 해당하는 배포 전략은 무엇입니까?", "o": ["레드-블랙 배포(Red-black deployment)", "블루-그린 배포(Blue-green deployment)", "롤링 배포(Rolling deployment)", "인플레이스 배포(In-place deployment)", "불변 배포(Immutable deployment)"], "a": 0, "e": "레드-블랙 배포는 DNS를 한 번에 바꿔 하나의 버전만 활성화합니다. 블루-그린 배포는 일정 기간 두 버전이 공존하며 점진적으로 전환할 수 있다는 점이 다릅니다.", "src": "WA백서 05 p.18~19", "s": "- 블루-그린 배포와 유사하지만 DNS 전환 방식에서 차이가 있다.\n- 점진적인 전환 없이 일시에 DNS를 변경하여 새로운 버전으로 전환한다.\n- 이전 버전과 새 버전이 공존하지 않고 하나의 버전만 활성화되며, 빠른 전환이 필요한 경우에 적합하다.", "id": "2-1b-03"}, {"item": "2-1b", "t": "IaC·변경관리", "q": "운영 우수성 관점에서 IaC(Infrastructure as Code)를 활용한 변경 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["선언형 도구는 배포 완료 상태를 정의 파일에 명시하고 그 상태를 유지하도록 동작하므로, 지시형 도구보다 운영 환경에 더 적합하다.", "변경에 따른 테스트와 승인 부담을 줄이려면 여러 변경 사항을 모아 한 번에 대규모로 적용하는 것이 바람직하다.", "대규모 변경은 중요도에 따라 영향 분석을 수행하고, 실패에 대비해 이전 버전의 IaC 코드로 롤백하는 방안을 미리 마련한다.", "SCP는 CLI와 Open API를 제공하므로 Terraform으로 kr-west1, kr-east1 Region에 VM을 배포하는 작업을 자동화할 수 있다.", "IaC 도구로 변경 사항을 템플릿화하고, 변경별 문서화와 적용 전·후 상태 비교를 통해 예상치 못한 영향을 최소화한다."], "a": 1, "e": "큰 영향을 피하려면 작은 단위의 변경을 적용하도록 절차를 자동화하고, 모든 변경은 되돌릴 수 있어야 합니다. 작은 단위로 변경해야 테스트가 쉬워지고 시스템 안정성도 높아집니다.", "src": "WA백서 05 p.3, p.12~13, p.21", "id": "2-1b-04"}, {"item": "2-1b", "t": "운영우수성 복합 설계(DevOps)", "q": "쇼핑몰을 운영하는 M사는 Kubernetes Engine 기반으로 서비스를 재구축하면서 SCP(Samsung Cloud Platform) 서비스를 조합해 운영 우수성을 높이려 합니다. M사는 ISMS-P 인증 대상 기업입니다. M사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["DevOps Service의 Private Git Repository에 소스 코드와 인프라 구성 선언 파일을 함께 저장해 변경 이력을 통합 관리하고, 필요 시 이전 상태로 복구한다.", "개발자가 Git에 Push하면 Jenkins 파이프라인이 트리거되어 빌드된 컨테이너 이미지를 Container Registry에 저장하고 Kubernetes Engine에 자동 배포한다.", "인력과 비용을 줄이기 위해 개발·테스트 서버를 운영 VPC에 함께 배치하고, 장애 대응 속도를 높이도록 모든 개발자에게 운영 시스템 직접 접근 권한을 부여한다.", "Cloud Monitoring에 임계치 기반 이벤트를 등록해 지표가 임계치 범위를 넘으면 알림이 발송되도록 구성한다.", "장애가 발생하면 RCA(근본 원인 분석)를 수행하고, 근본 원인과 재발 방지 대책을 문서화해 지식으로 관리한다."], "a": 2, "e": "ISMS-P 운영 관리 통제 항목에 따라 개발·테스트 환경은 VPC, 계정 단위로 운영 시스템과 분리해야 합니다. 또 IAM 정책으로 개발자가 운영 시스템에 직접 접근하지 못하도록 제한해야 합니다.", "src": "WA백서 05 p.1~2, p.12~14, p.31", "id": "2-1b-05"}, {"item": "2-1c", "t": "가용성 복합 설계(3계층)", "q": "L사는 3계층 쇼핑몰을 SCP(Samsung Cloud Platform)에 구축하면서, 단일 구성 요소 장애나 부하 급증에도 서비스가 중단되지 않도록 설계하려 합니다. L사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["Web·App 계층 앞에 Load Balancer를 두고 Auto-Scaling 최소 인스턴스 수를 2로 설정해, 장애 VM이 제외되면 새 VM이 자동 생성되도록 한다.", "소스 코드 변경이 불가해 단일 서버로 둘 수밖에 없는 Legacy App은 주요 서비스 흐름에서 분리하고 App에서 참조하는 방식으로 배치한다.", "웹 계층과 애플리케이션 계층 사이의 결합을 더 강하게 해제하려면 Message Queue Service로 비동기 통신을 구성한다.", "주문 DB의 쓰기 부하 증가에 대비해 Database 서비스를 Active-Active로 이중화하고 노드를 추가하는 수평 확장으로 처리량을 늘린다.", "Kubernetes Engine 노드 풀의 노드 자동 복구를 활성화해 일정 시간 NotReady 상태인 노드가 자동으로 복구되도록 한다."], "a": 3, "e": "관계형 데이터베이스는 수평 확장이 불가능하며, Database 서비스는 이중화하더라도 Active-Standby를 지원합니다. 최대 용량을 고려해 수직 확장하거나 Replica·캐싱으로 읽기 부하를 오프로드해야 합니다.", "src": "WA백서 01 p.11~12, p.27, p.31~33", "id": "2-1c-04"}, {"item": "2-1c", "t": "RTO/RPO 도출", "q": "업무 영향 분석(BIA) 결과가 다음과 같을 때, Y 시스템과 X 업무에 적용할 복구 목표 시간(RTO)과 복구 목표 시점(RPO)으로 옳은 것은 무엇입니까?", "o": ["RTO 6시간 / RPO 1일", "RTO 4시간 / RPO 1일", "RTO 6시간 / RPO 30분", "RTO 5시간 / RPO 약 12시간", "RTO 4시간 / RPO 30분"], "a": 4, "e": "업무별 값과 시스템별 값 중 최소값을 해당 시스템과 업무의 RTO·RPO로 도출합니다. 따라서 RTO는 4시간, RPO는 30분입니다. 평균이나 업무 기준값을 쓰는 것이 아닙니다.", "src": "WA백서 03 p.4~6", "s": "- X 업무: RTO 6시간, RPO 1일\n- X 업무를 처리하는 Y 시스템: RTO 4시간, RPO 30분\n- WA 백서의 업무·시스템 복구 목표 도출 방식을 따른다.", "id": "2-1c-05"}, {"item": "2-1c", "t": "백업·DR 서비스", "q": "SCP(Samsung Cloud Platform)의 백업 및 재해 복구 기능에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server DR은 DR 사이트의 Virtual Server를 항상 기동 상태로 유지하며, Block Storage는 복제하지 않고 서버 설정만 동기화한다.", "Backup 서비스의 DR 옵션은 이미 생성된 Backup 서비스에 나중에 활성화할 수 없으므로, DR이 필요하면 새 Backup 서비스를 생성해야 한다.", "DBaaS 백업본으로 복구할 때는 기존 서버에 직접 복구하지 않고, 백업본으로 새 데이터베이스를 생성한 뒤 Master로 전환한다.", "Object Storage는 별도의 백업 방식 대신 버전 관리로 객체 변경 사본을 보존해 데이터를 보호한다.", "File Storage DR은 DR Region, DR Volume명, 복제 주기(5분, 1시간, 매일, 매주, 매월)를 설정해 구성한다."], "a": 0, "e": "Virtual Server DR에서 실제로 복제되는 것은 Block Storage이며, DR 사이트의 Virtual Server는 정지된 상태로 유지됩니다.", "src": "WA백서 03 p.11~13, p.22~24", "id": "2-1c-06"}, {"item": "2-1d", "t": "보안 복합 설계(3계층 심층 방어)", "q": "N사는 3계층 웹서비스를 SCP(Samsung Cloud Platform)에 구축하면서 Firewall, Security Group, Load Balancer 등을 조합해 심층 방어를 구현하려 합니다. N사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["모든 웹서비스 서버에는 Private IP만 연결하고, 인터넷에는 Load Balancer만 개방해 외부 공격 표면을 최소화한다.", "VPC 경계를 오가는 North-South 트래픽은 Firewall로, VPC 내부 서버 그룹 간 East-West 트래픽은 Security Group으로 제어한다.", "관리자는 VPN으로 Bastion Server에 프라이빗 연결한 뒤, 이를 경유해 각 서버의 관리 작업을 수행한다.", "Load Balancer에서 SSL Termination을 하면 서버의 암복호화 부하가 줄지만, 규정상 인증서를 서버에 두어야 한다면 서버에 인증서를 구성한다.", "Security Group은 CIDR 형식의 주소 범위만 허용 대상으로 지정할 수 있으므로, Auto-Scaling을 적용한 계층은 서브넷 전체 대역을 허용 규칙에 넣어야 한다."], "a": 4, "e": "SCP의 Security Group은 CIDR뿐 아니라 다른 Security Group도 허용 대상으로 지정할 수 있습니다. 그러면 해당 Security Group에 연결된 모든 서버가 허용되므로, Auto-Scaling 계층에도 주소 범위를 지정할 필요가 없습니다.", "src": "WA백서 02 p.24~30", "id": "2-1d-02"}, {"item": "2-1d", "t": "저장 데이터 보호", "q": "SCP(Samsung Cloud Platform)에서 저장 중 데이터(Data-at-rest)를 보호하는 방법에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Block Storage는 디스크 유형을 SSD_KMS 등 KMS 유형으로 선택해 볼륨 암호화를 적용할 수 있다.", "KMS를 연동하면 애플리케이션 코드를 수정하지 않아도 애플리케이션 데이터가 자동으로 암호화·복호화된다.", "File Storage는 기본적으로 암호화되고 Object Storage는 사용자가 암호화 여부를 선택하며, 두 스토리지 모두 AES-256 방식을 사용한다.", "File Storage와 Object Storage는 접근 서버, Public IP, VPC Endpoint를 등록하는 접근 제어 리스트(ACL) 방식으로 접근을 관리한다.", "KMS의 마스터 키는 FIPS 140-2 Lv3 표준을 준수하는 HSM에 저장된 루트 키를 통해 생성된다."], "a": 1, "e": "KMS로 애플리케이션 데이터를 암호화하려면 사용자가 애플리케이션에 암호화를 수행하는 코드를 직접 작성해야 합니다. KMS는 키 생성·저장·수명주기 관리를 대신해 줄 뿐입니다.", "src": "WA백서 02 p.20~21; SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드8", "id": "2-1d-03"}, {"item": "2-1d", "t": "자격 증명·접근 권한", "q": "SCP(Samsung Cloud Platform)의 자격 증명 및 접근 권한 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Console에 접근할 때는 다중 인증(MFA)을 반드시 수행한다.", "인증키는 영구 사용을 지양하고, 유효 기간과 접속 가능한 IP 주소를 지정한다.", "AdministratorAccess가 연결된 그룹에는 사용자를 1명만 두는 것이 최소 허용 원칙에 부합하므로, 보조 관리자는 지정하지 않는다.", "Secret Vault에서 Token을 발급받아 OpenAPI 임시키를 사용하는 방식으로 인증하면 보안을 더 강화할 수 있다.", "사용자에게 권한 정책을 직접 연결하는 것은 최소화하고, 역할별 그룹에 권한을 연결한 뒤 사용자를 등록하거나 해제한다."], "a": 2, "e": "유일한 관리자가 유고나 휴대전화 분실로 인증할 수 없는 상황에 대비해 긴급 접속 프로세스가 필요합니다. AdministratorAccess가 연결된 그룹에 주 관리자와 보조 관리자를 함께 지정하는 방안이 제시되어 있습니다.", "src": "WA백서 02 p.11~15", "id": "2-1d-04"}, {"item": "2-1e", "t": "동시 사용자 수 산정", "q": "F 공공기관은 대외용 웹 서비스를 신규 구축하면서 수식 계산법으로 서버 규모를 산정하려 합니다. 다음 조건에서 WAS 서버의 동시 사용자 수(일반값 적용)는 몇 명입니까?", "o": ["375명", "750명", "1,000명", "1,500명", "5,000명"], "a": 1, "e": "Web 동시 사용자는 100,000 × 5% × 20% = 1,000명입니다. WAS 동시 사용자는 Web 동시 사용자의 50~100% 범위에서 산정하며 일반값은 75%이므로 750명입니다.", "src": "WA백서 04 p.17~18", "s": "- 전체 등록 사용자 수: 100,000명\n- 접속 사용자 수: 전체 사용자 수의 5%\n- Web 서버 동시 사용자 수: 접속 사용자 수의 20%\n- WAS 서버 동시 사용자 수: Web 서버 동시 사용자 수에 일반값 적용", "fix": true, "id": "2-1e-03"}, {"item": "2-1e", "t": "메모리 사이징", "q": "수식 계산법으로 서버 메모리를 산정하려 합니다. 다음 조건에서 산정되는 메모리 용량은 얼마입니까?", "o": ["3,450MB", "3,900MB", "4,485MB", "4,680MB", "5,175MB"], "a": 2, "e": "메모리 = {시스템 영역 + (사용자당 메모리 × 사용자 수) + 애플리케이션 필요 메모리} × 버퍼 캐시 보정 × 시스템 여유율입니다. 따라서 (512 + 2,000 + 488) × 1.15 × 1.3 = 4,485MB이며, 버퍼 캐시 보정 일반값은 1.15입니다.", "src": "WA백서 04 p.28~30", "s": "- 시스템 영역: 512MB\n- 사용자당 필요 메모리: 2MB, 동시 사용자 수: 1,000명\n- 애플리케이션 필요 메모리: 488MB\n- OS 버퍼 캐시 보정: 일반값 적용\n- 시스템 여유율: 30%", "fix": true, "id": "2-1e-04"}, {"item": "2-1e", "t": "성능효율성 복합 설계", "q": "전국 고객을 대상으로 하는 온라인 쇼핑몰 P사는 SCP(Samsung Cloud Platform) 서비스를 조합해 응답 지연을 줄이고 처리량을 높이려 합니다. P사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["주문 처리 서비스는 여러 테이블의 조인이 많으므로, 수평 확장이 쉬운 NoSQL 기반 CacheStore를 주 데이터베이스로 사용한다.", "이미지, 동영상 등 정적 콘텐츠는 Global CDN을 이용해 사용자와 가까운 엣지 서버에서 전송한다.", "반복 조회가 많은 상품 데이터는 Redis 기반 CacheStore를 데이터베이스 전방에 두어 캐싱한다.", "대규모 판매 데이터 분석에는 컬럼 기반 MPP 구조의 Vertica(DBaaS)를 사용한다.", "상품 검색은 ElasticSearch 생성과 설정을 자동화해 주는 Search Engine으로 구성해 짧은 지연 시간과 높은 처리량을 확보한다."], "a": 0, "e": "NoSQL은 테이블·엔티티 조인 같은 복잡한 쿼리를 지원하지 않으므로, 이런 경우에는 관계형 데이터베이스가 적합합니다. CacheStore는 데이터베이스 캐싱이나 애플리케이션 상태 저장 용도로 쓰입니다.", "src": "WA백서 04 p.33~37", "id": "2-1e-05"}, {"item": "2-2a", "t": "Region 선정", "q": "클라우드 정보시스템을 구축할 데이터센터 Region을 선정할 때의 고려사항으로 옳지 않은 것은 무엇입니까?", "o": ["최종 사용자의 개인정보와 중요 정보가 저장되는 지리적 위치에 대한 법적 규제를 반드시 고려한다.", "사용자가 자주 이용하는 서비스를 파악하고, 해당 사용자와 지리적으로 가까운 데이터센터에 시스템을 구축한다.", "글로벌 서비스를 제공하는 경우, 국가별로 시스템을 분산 배포할지 Global CDN으로 지연 시간을 줄일지 검토한다.", "네트워크 지연 시간은 회선 대역폭으로만 결정되며, 데이터 패킷이 경유하는 라우터(홉) 수와는 무관하다.", "단위 시간당 서비스 요청 횟수와 요청 데이터 크기로 네트워크 트래픽을 계산하고, 이를 수용할 대역폭을 확보한다."], "a": 3, "e": "출발지에서 목적지까지 패킷이 경유하는 라우터를 홉(hop)이라 하며, 홉 수가 많을수록 지연 시간이 증가합니다. 지리적 거리가 멀수록 지연이 커지는 이유도 이 때문입니다.", "src": "WA백서 04 p.6, p.37~38", "id": "2-2a-01"}, {"item": "2-2a", "t": "리전/AZ 트래픽 비용", "q": "리전과 가용영역(AZ) 구성에 따른 네트워크 비용 최적화 전략으로 옳은 것은 무엇입니까?", "o": ["서로 다른 AZ 간 트래픽은 같은 리전 안에서 발생하므로 비용이 발생하지 않는다.", "리전 간 통신 요금은 AZ 간 통신 요금보다 저렴하므로, 데이터 이동은 리전 간 구성으로 우선 설계한다.", "Transit Gateway는 트래픽 요금만 발생하므로, VPC 2개를 1:1로 연결할 때도 VPC Peering보다 유리하다.", "중소 규모의 하이브리드 연결은 포트 요금이 없는 Direct Connect가 VPN보다 비용 효율적이다.", "고가용성이 꼭 필요하지 않은 워크로드는 단일 AZ로 구성해 AZ 간 트래픽 비용을 줄인다."], "a": 4, "e": "동일 리전·동일 AZ 트래픽은 무료이고, AZ 간 트래픽은 비용이 발생하며, 리전 간 통신은 더 비쌉니다. Transit Gateway는 생성·트래픽·포트 요금이 들고, 중소 규모라면 VPN 구성이 권장됩니다.", "src": "SCP_v2_Explore_Network_01-10 SCP Networking Service 슬라이드19", "id": "2-2a-02"}, {"item": "2-2a", "t": "리전 단위 서비스 특성", "q": "SCP(Samsung Cloud Platform) 서비스의 리전(Region) 단위 동작 방식에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Resource Management의 리소스 검색은 리전별로만 수행되므로, 여러 리전과 계정의 자원을 단일 쿼리로 검색할 수 없다.", "Secrets Manager는 리전 서비스이므로, 생성된 Secret은 해당 리전 안에서만 사용할 수 있다.", "Quota Service는 리전 수준 Quota와 Account 수준 Quota를 구분하여 제공한다.", "Private DNS는 Account당 1개 생성되며, 생성한 리전이 아닌 다른 리전에서 활성화한 뒤 그 리전의 VPC를 연결할 수 있다.", "KMS Key는 Region 단위로 생성 가능 개수가 할당된다."], "a": 0, "e": "Resource Management는 계정과 리전에 흩어진 모든 리소스를 자원명, 리전, 태그 등으로 단일 쿼리 검색할 수 있습니다.", "src": "ExploreManagement_8_Resource_Management 슬라이드; SEC4 슬라이드5; ExploreManagement_6_Quota_Service; SCP_v2_Explore_Network DNS 슬라이드8~10", "id": "2-2a-03"}, {"item": "2-2b", "t": "Multi-AZ 개념", "q": "Multi-AZ 구성에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["AZ는 독립된 물리적 인프라로 구성되어, 한 AZ에 장애가 발생해도 다른 AZ에는 영향을 주지 않도록 설계된다.", "물리적 인프라 수준의 단일 장애 지점(SPOF)을 피하기 위해 자원을 Multi-AZ에 중복 배포한다.", "Multi-AZ로 구성하면 Region 전체 재해까지 대비되므로, Region 간 DR 복제 계획은 별도로 수립하지 않아도 된다.", "네트워크 고가용성을 위해 Multi-AZ 분산 배치와 함께 Load Balancer 활용, VPN·Direct Connect 이중화를 병행한다.", "백업 사본도 Archive Storage, Multi-AZ, DR 구성을 활용해 단일 지점이나 사이트의 장애·재해로 손실되지 않게 한다."], "a": 2, "e": "Multi-AZ
