형을 지정한다.", "활동 내역을 수집할 사용자를 선택한다.", "저장할 로그의 파일 형식을 지정한다.", "로그 파일의 위변조 검증을 위한 Digest 파일 생성을 선택할 수 있다."], "a": 0, "e": "Trail은 미리 생성해 둔 Object Storage 버킷을 선택하여 로그를 저장합니다. 저장된 로그 파일은 Digest 파일로 변경·수정·삭제 여부를 검증할 수 있습니다.", "src": "ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드14", "id": "4-3b-02"}, {"item": "4-3b", "t": "Logging&Audit Trail", "q": "SCP(Samsung Cloud Platform) Logging&Audit의 Trail 관리에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["Trail의 대상 유형이나 사용자를 수정하면 수정 내용이 과거에 수집된 로그에도 소급 적용된다.", "Trail 로그는 10분 단위로 Object Storage에 저장된다.", "Trail로 Object Storage에 저장된 로그는 90일이 지나면 자동으로 삭제된다.", "Trail 로그 파일은 XML 형식으로만 저장된다.", "Trail 생성 및 수정한 내용은 수정한 시점부터 적용되며, 1시간 단위로 저장된다."], "a": 4, "e": "Trail 생성·수정 내용은 수정 시점부터 적용되고 1시간 단위로 저장됩니다. Trail 로그는 JSON 또는 CSV 형식이며 사용자 Object Storage에 별도 저장기간 없이 보관됩니다.", "src": "ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드7, 15, 19", "id": "4-3b-03"}, {"item": "4-3b", "t": "Logging&Audit", "q": "F 고객사 보안팀은 '누가 언제 Console에 로그인하여 Virtual Server를 생성했는지'와 같은 사용자 활동 기록을 감사 자료로 기간 제약 없이 장기 보존하려고 합니다. 가장 적합한 방법은 무엇입니까?", "o": ["Cloud Monitoring에 로그 에이전트를 설치하고 로그 모니터링을 설정한다.", "Network Logging에서 Firewall Logging 저장소를 지정한다.", "Logging&Audit에서 Trail을 생성하여 Object Storage에 저장한다.", "Log Transmission을 신청하여 보안 장비 로그를 전송받는다.", "Config Inspection에서 Logging 영역 Best Practice 진단을 요청한다."], "a": 2, "e": "Cloud Monitoring과 Network Logging은 시스템 관련 활동 기록이고, Logging&Audit은 클라우드 및 사용자의 활동 기록입니다. Trail을 구성하면 이 로그를 기간 제약 없이 장기 보존할 수 있습니다.", "src": "WA백서 05 p.25 / ExploreManagement_2_Logging_Monitoring_슬라이드별 슬라이드13", "id": "4-3b-04"}, {"item": "4-3c", "t": "Network Logging", "q": "SCP(Samsung Cloud Platform)의 네트워크 로그 저장 및 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Network Logging은 Firewall, Security Group, NAT의 로그를 수집해 Object Storage에 저장하여 VPC 내외부 트래픽을 분석할 수 있게 한다.", "Firewall 로그는 Cloud Monitoring의 로그 모니터링 저장 공간(기본 1GB)에 저장되며, 초과 시 오래된 로그부터 삭제된다.", "Security Group 생성 시 '로그 저장 여부'는 Security Group Logging에서 로그 저장소를 설정해야 사용할 수 있다.", "Internet Gateway의 NAT 로그 저장을 사용하면 IGW를 통해 NAT되는 VM, BM, LB, DB의 로그와 NAT Gateway 로그가 Object Storage 버킷에 저장된다.", "로그가 저장되는 버킷은 접근 목록 관리로 허용된 대상만 접근하게 하고, 암호화와 버전 관리를 적용하는 것이 좋다."], "a": 1, "e": "Firewall 로그는 Network Logging에서 지정한 Object Storage 버킷에 저장됩니다. 1GB 저장 공간은 Cloud Monitoring 로그 수집용입니다.", "src": "WA백서 05 p.25 / WA백서 02 p.37 / SCP_v2_Explore_Network_01-10 IGW 슬라이드22, Security Group 슬라이드7~8", "id": "4-3c-02"}, {"item": "4-3c", "t": "Firewall Logging", "q": "A 고객사는 Internet Gateway를 생성하면서 Firewall 로그도 함께 저장하려고 합니다. Firewall 로그 저장을 위한 준비 및 설정에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Firewall 로그를 저장하려면 로그를 저장할 Object Storage 버킷이 먼저 생성되어 있어야 한다.", "Object Storage 버킷을 생성하려면 인증키가 먼저 생성되어 있어야 한다.", "Firewall 로그 저장소는 Network Logging의 Firewall Logging에서 미리 만든 버킷을 선택해 지정한다.", "Internet Gateway 생성 시 Firewall을 미사용으로 선택하면 Firewall이 생성되지 않아 이후 로그를 저장할 수 없다.", "Firewall 로그 저장 여부는 Internet Gateway 생성 이후에도 Firewall 상세 화면에서 설정할 수 있다."], "a": 3, "e": "Internet Gateway의 Firewall은 미사용으로 선택해도 자동 생성되며, 사용할 경우 Firewall 목록에서 설정합니다. Firewall 로그 저장에는 Object Storage(사전 인증키 필요)가 선행되어야 하고, 저장 여부는 생성 후 Firewall 상세 화면에서도 설정할 수 있습니다.", "src": "SCP_v2_Explore_Network_01-10 Internet Gateway 슬라이드21·22, Firewall 슬라이드9", "id": "4-3c-03"}, {"item": "4-3c", "t": "Firewall/SG 로그", "q": "G 고객사는 VPC 내외부를 오가는 트래픽을 분석하기 위해 네트워크 로그를 저장하려고 합니다. G 고객사를 위한 제안 중 적합하지 않은 것은 무엇입니까?", "o": ["서버별 트래픽 로그를 얻기 위해 각 Virtual Server에 Firewall을 직접 생성하고 Firewall Logging을 설정한다.", "인터넷에서 유입되는 트래픽은 Internet Gateway Firewall의 로그 저장을 사용하여 수집한다.", "Load Balancer 생성 시 Firewall 사용 및 로그 저장 여부를 체크하여 LB 트래픽 로그를 저장한다.", "Virtual Server, Database 등에 적용된 Security Group의 트래픽은 Security Group Logging으로 저장한다.", "온프레미스 연동 구간은 Direct Connect 생성 시 Firewall 로그 저장 여부를 선택하여 저장한다."], "a": 0, "e": "Firewall은 Internet Gateway, Direct Connect, Load Balancer를 대상으로 적용되며 Virtual Server에 직접 생성하지 않습니다. 서버 단위 트래픽 제어와 로그는 Security Group과 Security Group Logging을 이용합니다.", "src": "SCP_v2_Explore_Network_01-10 Firewall 슬라이드14, Security Group 슬라이드15, Direct Connect·LB 생성 슬라이드", "id": "4-3c-04"}, {"item": "4-3d", "t": "Log Transmission", "q": "SCP(Samsung Cloud Platform) Log Transmission에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["방화벽, IPS, DDoS 보안장비로부터 실시간으로 로그를 수집·저장하여 고객이 필요한 영역으로 전송한다.", "불필요한 로그를 필터링하거나 고객이 요청한 로그만 추출할 수 있다.", "Virtual Server OS의 시스템 로그를 에이전트로 수집하여 Cloud Monitoring으로 전송하는 서비스이다.", "수집된 로그는 이중화된 저장소에 보관되며 필요 시 백업 및 복구가 가능하다.", "로그 데이터는 VPN 서비스 등을 활용하여 안전하게 전송된다."], "a": 2, "e": "Log Transmission은 보안장비(방화벽, IPS, DDoS)의 보안 이벤트 로그를 수집해 고객의 로그 연동 장비로 전송하여 사용자 영역의 보안관제 기반을 제공합니다. 서버 OS 로그를 에이전트로 수집하는 것은 Cloud Monitoring의 로그 모니터링입니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드11, 46 / WA백서 02 p.37", "id": "4-3d-01"}, {"item": "4-3d", "t": "Log Transmission 요금", "q": "H 고객사는 Log Transmission 200 Mbps 상품을 30일인 달의 16일에 개시하여 그 달 말일까지 사용했습니다. 해당 월의 Log Transmission 요금(부가세 별도)은 얼마입니까?", "o": ["150,000원", "270,000원", "288,000원", "540,000원", "600,000원"], "a": 1, "e": "16일부터 30일까지 15일 사용이므로 540,000 × 15 ÷ 30 = 270,000원입니다. 16일을 사용일수로 잘못 세면 288,000원이 됩니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드12", "s": "- 200 Mbps 구간 월 요금: 540,000원\n- 월 단위 요금(매월 1일~말일) 적용, 월중 신청/해지 시 일할 계산\n- 일할 계산은 '월 요금 × 사용일수 ÷ 해당 월 일수'로 가정", "fix": true, "id": "4-3d-02"}, {"item": "4-3d", "t": "Log Transmission 요금", "q": "SCP(Samsung Cloud Platform) Log Transmission 요금 정책에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["요금은 전송된 로그 용량(GB)에 따라 종량제로 부과된다.", "약정 대역폭을 초과하면 자동으로 상위 구간으로 변경되어 과금된다.", "상위 대역폭으로 증설하기 위해 기존 상품을 해지하면 해지위약금이 부과된다.", "1 Gbps 구간의 월 요금은 1,200,000원이다.", "서비스 개시 후 약정된 최대 트래픽을 초과하면 기존 상품을 해지하고 신규 신청해야 한다."], "a": 4, "e": "요금은 약정 대역폭 구간(100 Mbps 300,000원, 200 Mbps 540,000원, 500 Mbps 1,200,000원, 1 Gbps 2,100,000원)으로 결정됩니다. 약정 트래픽 초과 시 해지 후 신규 신청이 필요하지만 증설로 인한 해지위약금은 없습니다.", "src": "SEC5_LogTransmission_FPMS_ESS_슬라이드별 슬라이드12", "id": "4-3d-03"}, {"item": "1-1e", "t": "Quota Service", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["Cloud Control", "Cost Management", "Quota Service", "Resource Explorer", "Cloud Monitoring"], "a": 2, "e": "서비스별 기본·적용 한도와 조정 가능 여부를 리전/Account 수준으로 조회하고 증가 요청 상태와 이력을 관리하는 것은 Quota Service입니다. Quota Service 자체는 무료이며, Cloud Control은 랜딩 존·가드레일, Cost Management는 비용 조회·예산 관리를 담당합니다.", "src": "ExploreManagement_6_Quota_Service 슬라이드10~11; ExploreManagement_7_Financial_Management 슬라이드10", "s": "- 서비스별 기본값, 적용값, 조정 가능 여부 조회\n- 리전 수준과 Account 수준 한도를 구분해 제공\n- 증가 요청의 상태(보류 중, 승인, 거부) 추적\n- 과거 증가 요청 내역과 사용 추이 확인", "id": "1-1e-06"}, {"item": "1-2b", "t": "Cost Management", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["Cost Management", "Planned Compute", "Resource Groups", "Quota Service", "Cloud Monitoring"], "a": 0, "e": "월말 예상 청구 금액, 최대 6개월 비용 분석, 예산 임계치 알림, 납부 내역 조회는 모두 Cost Management의 기능입니다. Planned Compute는 인스턴스 타입 약정 할인, Resource Groups는 태그 기반 자원 그룹화 서비스입니다.", "src": "ExploreManagement_7_Financial_Management 슬라이드7, 12, 14~15, 21~22", "s": "- 이번 달 월말 예상 청구 금액 확인\n- 최대 6개월간의 비용 추이와 사용량 분석\n- 예산 소진율이 지정한 시점에 도달하면 알림 메일 발송\n- 월별 청구 금액, 미납 금액, 납부 상태 확인", "id": "1-2b-08"}, {"item": "1-1f", "t": "Copilot", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["Architecture Diagram", "Resource Explorer", "Cloud Monitoring", "SCP Copilot", "AI&MLOps Platform"], "a": 3, "e": "자연어 요청으로 자원을 생성하고, 인스턴스 상태·자원 설정·예상 비용을 실시간으로 확인하며, 상세 화면 이동 없이 자원 정보를 보는 것은 생성형 AI 기반 SCP Copilot의 기능입니다. Architecture Diagram은 구성된 자원 간 연관 관계를 도식화하는 기능으로, Copilot에서 호출해 볼 수 있지만 위 기능을 제공하는 주체는 아닙니다.", "src": "ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드6, 12, 23", "s": "- 'VPC 생성해 줘'와 같은 자연어 요청으로 자원 생성 화면 진입\n- 생성한 인스턴스 상태, 자원 설정, 예상 비용을 실시간으로 확인\n- 자원 상세 화면으로 이동하지 않고 자원의 주요 정보 확인", "id": "1-1f-05"}, {"item": "1-1b", "t": "Secret Vault", "q": "다음은 SCP(Samsung Cloud Platform) Secret Vault를 이용해 SCP 자원에 접근하는 방식에 대한 설명입니다. (가), (나)에 들어갈 말로 바르게 짝지은 것은 무엇입니까?", "o": ["(가) Token (나) 인증키 인증", "(가) Token (나) 임시키 인증", "(가) 인증서 (나) 임시키 인증", "(가) KMS 키 (나) Console 로그인", "(가) 인증서 (나) 인증키 인증"], "a": 1, "e": "사용자는 인증키로 Secret Vault에 Token을 요청해 발급받고, Token으로 OpenAPI 임시키를 받아 자원에 접근합니다. Secret Vault 신청 시 인증키 관리 메뉴의 보안 인증 방식은 반드시 임시키 인증이어야 합니다. Token은 Token ID와 Token Secret으로 구성되며, 인증서나 KMS 키는 이 흐름에 쓰이지 않습니다.", "src": "SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드24~27, 48", "s": "Secret Vault를 신청하려면 사용할 인증키의 보안 인증 방식을 인증키 관리 메뉴에서 반드시 (나)(으)로 선택해야 한다. 사용자는 이 인증키 정보로 Secret Vault에 (가)을(를) 요청해 발급받아 애플리케이션에 설정하고, 이를 이용해 OpenAPI 임시키를 발급받아 SCP 서비스와 자원에 접근한다.", "id": "1-1b-04"}, {"item": "1-1e", "t": "Cloud Control 공유 Account", "q": "다음은 SCP(Samsung Cloud Platform) Cloud Control로 랜딩 존을 생성할 때 구성되는 공유 Account에 대한 설명입니다. (가), (나)에 들어갈 말로 바르게 짝지은 것은 무엇입니까?", "o": ["(가) Audit (나) Log", "(가) Management (나) Audit", "(가) Log (나) Management", "(가) Management (나) Log", "(가) Log (나) Audit"], "a": 4, "e": "Log Account는 모든 Account의 로그를 중앙에서 수집·저장하고 무결성을 보장하며(Object Storage), Audit Account는 Config Inspection으로 조직 전체의 보안·컴플라이언스를 모니터링하고 감사합니다. Management Account는 Cloud Control, Organization, ID Center가 위치해 조직 구조 관리와 정책 적용을 맡습니다.", "src": "ExploreManagement_3_Cloud_Control 슬라이드9, 15", "s": "- (가) Account: 모든 Account의 로그를 중앙에서 수집·저장하고 로그 무결성을 보장한다.\n- (나) Account: Config Inspection을 통해 조직 전체의 보안/컴플라이언스를 모니터링하고 감사하며, 자동화된 보안 점검을 수행한다.", "id": "1-1e-07"}, {"item": "1-1c", "t": "IAM 역할", "q": "A사는 SCP(Samsung Cloud Platform) Object Storage에 보관한 정산 파일을 협력사 B사의 운영팀이 매월 며칠간 조회할 수 있게 하려고 합니다. B사는 자체 SCP Account를 가진 별도 회사로 A사의 Organization에 편입되지 않으며, A사는 영구 자격 증명을 외부에 전달하지 않고 필요한 권한만 일시적으로 허용하면서 관리 부담을 최소화하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["B사 직원마다 A사 IAM 사용자를 만들어 비밀번호를 전달하고, 작업 후 수동으로 삭제한다.", "A사 인증키를 발급해 B사에 전달하고, 재발급 부담이 없도록 유효 기간을 영구로 설정한다.", "역할의 수행 주체로 B사 Account ID를 지정하고, 대상 버킷 조회 권한만 담은 정책을 연결한다.", "역할의 수행 주체로 B사 Account ID를 지정하고, 편의를 위해 AdministratorAccess를 연결한다.", "B사 Account를 A사 Organization에 초대하고, ID Center 권한 세트로 버킷 접근을 할당한다."], "a": 2, "e": "역할은 특정 Account ID나 SRN을 수행 주체로 연결해 다른 사용자에게 역할의 권한만 임시로 허용하는 기능이므로, 최소 권한 정책을 연결한 역할이 요구 사항에 맞습니다. IAM 사용자 생성이나 영구 인증키 전달은 영구 자격 증명이 외부로 나가고, AdministratorAccess는 최소 허용 원칙에 어긋나며, 별도 회사를 Organization에 편입하는 것은 조건에 맞지 않습니다.", "src": "ExploreManagement_1_IAM 슬라이드6~7, 25~27; WA백서 02 p.8", "id": "1-1c-05"}, {"item": "1-1d", "t": "관리 서비스 규칙 종합", "q": "다음 중 SCP(Samsung Cloud Platform) 관리·보안 서비스의 생성 및 변경 규칙에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["IAM 정책에서 동일 대상에 허용 정책과 거부 정책이 함께 적용되면 거부 정책이 우선 적용된다.", "Planned Compute 약정 중 서버 타입은 신청 시 설정한 값보다 높은 타입으로만 변경할 수 있다.", "Cloud Control 랜딩 존 생성 시 Audit Account는 Log Account와 같은 이메일로 생성할 수 없다.", "Secret Vault의 Token 사용 기간은 서비스 신청이 완료된 뒤에는 변경할 수 없다.", "IAM 정책의 적용 자원을 '개별 자원'으로 지정하는 것은 액션 종류와 관계없이 항상 가능하다."], "a": 4, "e": "IAM 정책의 '개별 자원' 지정은 개별 자원 선택이 가능한(보라색으로 표시된) 액션을 고른 경우에만 가능하며, 모든 자원 대상 액션(검은색)에는 지정할 수 없습니다. 나머지는 거부 우선 원칙, Planned Compute의 Scale-Up 전용 변경, Log/Audit Account 이메일 중복 불가, Token 사용 기간 변경 불가 규칙으로 모두 맞는 설명입니다.", "src": "ExploreManagement_1_IAM 슬라이드16~17; ExploreManagement_7_Financial_Management 슬라이드9, 24; ExploreManagement_3_Cloud_Control 슬라이드15; SEC4_KMS_SecretVault_SecretsManager_슬라이드별 슬라이드27", "id": "1-1d-04"}, {"item": "2-1a", "t": "유휴 자원 관리", "q": "C사는 여러 팀이 SCP에서 자원을 자유롭게 생성해 사용하고 있습니다. 최근 테스트가 끝난 자원이 방치되어 비용이 계속 늘고 있지만, 누가 어떤 용도로 만들었고 언제까지 필요한 자원인지 식별할 수 없습니다. C사는 관리 부담을 최소화하면서 중요 데이터 유실 없이 유휴 자원을 정리하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["생성 후 30일간 접속 기록이 없는 자원은 담당자 확인 없이 매일 자동으로 일괄 삭제한다.", "용도·담당·만료일 태그 정책을 정해 Resource Explorer로 식별하고, 이해관계자 확인 후 폐기한다.", "자원 정리는 보류하고 전체 서버에 Planned Compute 3년 약정을 적용해 단가를 낮춘다.", "저사양 Virtual Server 수백 대의 리사이징 작업을 매주 반복해 절감 효과를 높인다.", "각 팀이 자원을 엑셀 대장으로 따로 관리하게 하고, 분기마다 수기로 대조해 정리한다."], "a": 1, "e": "유휴 자원 관리는 수명주기 태그(용도, 만료 기간, 담당 부서)로 자원을 식별하고, 폐기 전 이해관계자에게 공지·확인해 데이터 유실을 막는 절차가 핵심이며, Resource Explorer는 태그 필터 검색과 일괄 태그 추가를 지원합니다. 확인 없는 일괄 자동 삭제는 데이터 유실 위험이 있고, 약정 할인은 유휴 자원을 없애지 못하며, 저사양 서버의 반복 리사이징은 인건비 대비 효과가 낮습니다.", "src": "WA백서 06 p.18~20; ExploreManagement_8_Resource_Management 슬라이드7, 11", "id": "2-1a-05"}, {"item": "2-1b", "t": "이벤트 대응 자동화", "q": "D사는 인터넷에 공개된 웹 서비스를 Virtual Server로 운영하고 있습니다. 최근 DDoS 공격으로 트래픽이 급증해 정상 사용자가 서비스를 이용하지 못한 일이 있었습니다. D사는 운영자가 개입하기 전에도 서비스가 유지되도록 자동으로 대응하고, 관리자가 이상 상황을 즉시 인지하도록 하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["예상 최대 공격 규모에 맞춰 웹 서버를 상시 증설하고, 운영자가 매일 콘솔에서 이상을 확인한다.", "Logging&Audit의 Trail을 매일 점검해 공격 IP를 찾고, 다음 날 Firewall에 거부 규칙을 추가한다.", "부하가 급증하면 운영자가 Custom Image로 VM을 수동 생성해 Load Balancer 서버 그룹에 등록한다.", "DDoS Protection으로 공격을 방어하고, 웹 서버에 Auto-Scaling과 확장 개시 알림을 구성한다.", "Cloud Monitoring으로 웹 접근 로그를 수집해 두고, 월 1회 분석해 공격 패턴을 정리한다."], "a": 3, "e": "백서는 DDoS Protection으로 공격을 탐지·방어하고, Auto-Scaling으로 서버 수를 자동으로 늘려 서비스 생존을 확보하며, Scaling 개시나 Network In·CPU 임계치 알림으로 관리자가 즉시 인지하게 하는 자동화 대응을 제시합니다. 상시 증설은 비용이 크고, Trail은 사용자 활동 기록이라 트래픽 공격 탐지 수단이 아니며, 수동 증설과 사후 분석은 즉시 대응이 되지 않습니다.", "src": "WA백서 05 p.29~31; WA백서 02 p.44", "id": "2-1b-06"}, {"item": "2-1c", "t": "LB Health Check", "q": "다음은 가용성 테스트 시 Load Balancer의 Health Check에 의한 장애 전환 시간에 대한 설명입니다. (가), (나)에 들어갈 값으로 바르게 짝지은 것은 무엇입니까?", "o": ["(가) 30초 (나) 6초", "(가) 15초 (나) 3초", "(가) 30초 (나) 2초", "(가) 10초 (나) 6초", "(가) 45초 (나) 3초"], "a": 0, "e": "장애 감지 시간은 (주기 + 대기 시간) × 탐지 횟수이므로 기본값은 (5+5)×3 = 30초이고, 주기와 대기 시간을 1초로 줄이면 (1+1)×3 = 6초입니다. 탐지 횟수까지 줄이는 경우와 혼동하지 않도록 주의합니다.", "src": "WA백서 01 p.41", "s": "Load Balancer는 전방의 요청을 서버 그룹의 각 VM에 전달하면서 Health Check를 수행한다. 기본값(주기 5초, 대기 시간 5초, 탐지 횟수 3회)에서는 장애를 감지하고 Fail-over를 수행하는 데 (가)이(가) 소요된다. 탐지 횟수 3회는 유지한 채 주기와 대기 시간을 각각 최소값인 1초로 설정하면 장애 탐지 시간을 (나)까지 줄일 수 있다.", "id": "2-1c-07"}, {"item": "2-1d", "t": "워크로드 격리", "q": "E사는 결제(개인정보 처리), 그룹웨어, 마케팅 홈페이지 등 7개의 정보시스템을 SCP(Samsung Cloud Platform)에 구축하려고 합니다. 각 시스템은 예산과 운영 조직이 독립적이고, 시스템 간 프라이빗 연결은 필요하지 않으며, 취급하는 데이터의 민감도가 서로 다릅니다. E사는 보안 관리 부담을 줄이면서 시스템 간 격리를 확보하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["하나의 Account에 시스템별 VPC를 하나씩 만들어 7개 시스템을 분리한다.", "하나의 VPC에 시스템별 Subnet과 Security Group을 두고, IAM 그룹으로 권한을 나눈다.", "시스템별로 Account를 분리하고 Organization OU로 묶어, 통제 정책(ACP)을 일괄 적용한다.", "시스템별로 Account를 분리하되, AdministratorAccess를 가진 공용 IAM 사용자를 함께 쓴다.", "시스템별로 Account를 분리한 뒤, 운영 편의를 위해 모든 VPC를 VPC Peering으로 연결한다."], "a": 2, "e": "백서는 독립적인 예산·운영 체계를 갖는 정보시스템을 Account 단위로 구성하도록 권고하며, Organization의 OU에 ACP를 연결하면 하위 Account에 정책을 일괄 적용할 수 있습니다. Account당 VPC는 최대 5개라 7개 시스템을 VPC로 나눌 수 없고, 민감도가 다른 워크로드를 한 Account에 두면 권한·접근 정책 관리가 어려워지며, 공용 관리자 계정과 불필요한 Peering은 최소 허용 원칙에 어긋납니다.", "src": "WA백서 02 p.8, p.10; ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드7~8; SCP_v2_Explore_Network_01-10 VPC", "id": "2-1d-05"}, {"item": "2-1e", "t": "Search Engine", "q": "F사의 고객센터 시스템은 PostgreSQL(DBaaS)에 저장된 수천만 건의 상담 이력을 LIKE 쿼리로 키워드 검색하고 있어 응답에 수 초가 걸립니다. F사는 검색 엔진의 구성과 설정에 드는 관리 부담을 최소화하면서, 짧은 지연 시간과 높은 처리량으로 상담 이력을 검색하고 가용성도 높이려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["PostgreSQL(DBaaS)의 서버 타입을 반복해 Scale-Up하여 LIKE 쿼리 검색 속도를 높인다.", "Virtual Server에 ElasticSearch를 직접 설치하고 클러스터 구성·설정을 수작업으로 관리한다.", "상담 이력 전체를 CacheStore(DBaaS)에 적재하고 키 조회 방식으로 검색한다.", "Vertica(DBaaS)로 이관해 컬럼 기반 MPP 구조로 실시간 키워드 검색을 처리한다.", "Search Engine으로 ElasticSearch 클러스터와 Replica를 구성해 상담 이력 검색을 처리한다."], "a": 4, "e": "짧은 지연 시간과 높은 처리량의 데이터 검색에는 검색 엔진 기술이 필요하며, SCP Search Engine은 ElasticSearch 생성과 설정을 자동화하고 클러스터·Replica 구성으로 가용성과 성능을 높입니다. 직접 설치는 동작하지만 관리 부담이 크고, 관계형 DB의 수직 확장에는 한계가 있으며, CacheStore는 캐싱·상태 저장용, Vertica는 대규모 정형 데이터 분석(OLAP)용입니다.", "src": "WA백서 04 p.37~38", "id": "2-1e-06"}, {"item": "2-3b", "t": "서버 규모 산정법", "q": "A 공공기관은 온프레미스 시스템을 SCP(Samsung Cloud Platform)로 이전하기 위해 서버 규모를 산정하려고 합니다. 다음 설명의 (가), (나)에 해당하는 산정법을 바르게 짝지은 것은 무엇입니까?", "o": ["(가) 수식계산법 (나) 시뮬레이션법", "(가) 참조법 (나) 시뮬레이션법", "(가) 참조법 (나) 수식계산법", "(가) 시뮬레이션법 (나) 참조법", "(가) 수식계산법 (나) 참조법"], "a": 1, "e": "참조법은 업무량을 기준으로 기존 시스템과 비교해 비교적 안전하게 산정하지만 근거 제시가 미약하고, 시뮬레이션법은 워크로드를 모델링해 상대적으로 정확하지만 시간과 비용이 많이 듭니다. 수식계산법은 지표에 보정치를 적용해 근거를 명확히 제시할 수 있으나 보정치가 잘못되면 오차가 커집니다.", "src": "WA백서 04 p.19", "s": "- (가): 사용자 수, DB 크기 등 업무량에 따라 기존에 구축된 비슷한 규모의 시스템과 비교해 산정한다. 비교적 안전한 산정이 가능하지만, 계산이 아닌 비교에 의한 방법이라 근거 제시가 미약하다.\n- (나): 대상 업무의 워크로드를 모델링하고 이를 시뮬레이션해 산정한다. 상대적으로 정확한 값을 얻을 수 있지만 시간과 비용이 많이 소요된다.", "id": "2-3b-05"}, {"item": "2-3c", "t": "OCI Database Migration", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["OCI Database Migration", "Oracle Data Guard", "Pluggable Database(PDB)", "PostgreSQL(DBaaS)", "Exadata Database Service"], "a": 0, "e": "온프레미스·타 클라우드 DB를 GUI 콘솔이나 API로 이관하는 완전관리형 서비스로, 사용자 테넌시와 분리된 전용 자원에서 동작하고 Cloud Premigration Advisor Tool로 사전 점검하며 GoldenGate(Online)·Data Pump(Offline) 방식을 지원하는 것은 OCI Database Migration입니다. Data Guard는 PDB 단위 이중화, Exadata Database Service는 이관 대상(Target) DB입니다.", "src": "DB2_Oracle_Services_정리 1장", "s": "- 온프레미스나 다른 클라우드의 DB를 사용자가 GUI 콘솔 또는 API로 직접 이관하는 완전관리형 서비스\n- 사용자 테넌시와 분리된 전용 클라우드 자원에서 작업 수행\n- 이관 시작 전 소스 DB 구조를 분석해 호환성 문제와 예상 오류를 탐지\n- GoldenGate 기반 Online 방식과 Data Pump 기반 Offline 방식 지원", "id": "2-3c-04"}, {"item": "2-3c", "t": "PostgreSQL Migration", "q": "G사는 온프레미스에서 운영 중인 주문 시스템의 PostgreSQL 데이터베이스를 SCP(Samsung Cloud Platform)로 이관하려고 합니다. 주문은 24시간 발생하므로 이관 중 운영 중단을 최소화해야 하고, 이관 후에는 백업·패치·이중화에 드는 관리 부담을 줄이려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["Virtual Server에 PostgreSQL을 직접 설치해 dump/restore로 옮기고, 이중화·백업을 직접 구성한다.", "CacheStore(DBaaS)를 생성하고 Migration 기능으로 PostgreSQL 데이터를 복제해 옮긴다.", "OCI Database Migration의 Online 방식으로 PostgreSQL(DBaaS)에 이관한다.", "PostgreSQL(DBaaS)의 Migration 기능으로 기존 DB를 복제·이관하고 Redundancy를 활성화한다.", "Vertica(DBaaS)로 전환해 주문 트랜잭션을 컬럼 기반 MPP 구조로 처리한다."], "a": 3, "e": "PostgreSQL(DBaaS)은 기존 DB에서 데이터를 복제해 운영 중단을 최소화하며 이관하는 Migration 기능을 제공하고, Redundancy 활성화 시 Active/Standby HA가 자동 적용되며 백업·패치도 관리형으로 처리됩니다. CacheStore는 Migration 기능이 없는 NoSQL이고, OCI Database Migration은 Oracle·MySQL 동종 이관을 OCI 대상 DB로 수행하는 서비스이며, Vertica는 OLTP가 아닌 분석용입니다.", "src": "DB1_Database_정리 3~5장; DB2_Oracle_Services_정리 1장; WA백서 04 p.36~37", "id": "2-3c-05"}, {"item": "2-3d", "t": "Object Storage", "q": "H사는 온프레미스 웹 서버에 쌓인 이미지와 첨부파일을 SCP로 이관할 저장소를 찾고 있습니다. 다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["File Storage", "Archive Storage", "Object Storage", "Block Storage(VM)", "Parallel File Storage"], "a": 2, "e": "버킷 단위로 생성하고(사전 인증키 필수) Public·Private 접근 주소를 제공하며, 접근 허용 Public IP·자원 지정과 버전 관리를 지원하는 것은 Object Storage입니다. File Storage는 NFS/CIFS 마운트 방식, Archive Storage는 Object Storage 버킷을 대상으로 장기 보관하는 서비스입니다.", "src": "SCP_v2_Explore_Storage_20-24 Object storage 슬라이드3, 5~7, 11", "s": "- 데이터를 저장하는 최상위 논리 단위인 버킷을 생성하며, 사전에 인증키 생성 필요\n- 외부 망에서 접근하는 Public 주소와 같은 Account 자원에서 접근하는 Private 주소 제공\n- 접근 허용 Public IP와 서비스 자원을 지정해 불필요한 접근 차단\n- 버전 관리로 파일의 모든 버전을 관리하고 이전 파일 다운로드", "id": "2-3d-04"}, {"item": "3-1p", "t": "VPN·Direct Connect", "q": "다음은 온프레미스 네트워크와 SCP(Samsung Cloud Platform)를 연결하는 서비스에 대한 설명입니다. (가), (나)에 들어갈 서비스를 바르게 짝지은 것은 무엇입니까?", "o": ["(가) VPN (나) Transit Gateway", "(가) VPN (나) Direct Connect", "(가) Cloud Last Mile (나) Direct Connect", "(가) Direct Connect (나) VPN", "(가) SASE (나) Cloud WAN"], "a": 1, "e": "VPN은 인터넷 기반 IPsec 암호화 터널로 저비용·빠른 구축에 적합하고, Internet Gateway가 연결된 VPC와 사전 예약한 Public IP가 필요합니다. Direct Connect는 1G/10G/20G/40G 포트의 물리 전용 회선으로 단일 VPC와 1:1 연결되며, 고객 라우터의 BGP와 Uplink 회선 SR이 필요합니다. Transit Gateway도 BGP·SR이 필요하지만 여러 VPC를 1:N으로 연결하는 허브입니다.", "src": "SCP_v2_Explore_Network_01-10(VPN/Direct Connect/Transit Gateway) 슬라이드5, 8, 13, 15, 24", "s": "- (가): 인터넷 기반의 IPsec 암호화 터널로 고객 네트워크와 VPC를 연결하며, 저비용으로 빠르게 구축해야 할 때 적합하다. Internet Gateway가 연결된 VPC와 사전에 예약한 Public IP가 필요하다.\n- (나): 물리적 전용 회선으로 고객 네트워크와 단일 VPC를 1:1로 연결하며, 포트 용량은 1G/10G/20G/40G 중 선택한다. 고객사 라우터에 BGP 라우팅 프로토콜이 필요하고, 서비스 생성 후 Uplink 회선 연결을 SR로 요청한다.", "id": "3-1p-05"}, {"item": "3-1b", "t": "NAT Gateway·IGW", "q": "다음 설명의 (가), (나)에 들어갈 VPC 구성요소를 바르게 짝지은 것은 무엇입니까?", "o": ["(가) Private NAT (나) Direct Connect", "(가) NAT Gateway (나) Transit Gateway", "(가) Public IP (나) Internet Gateway", "(가) NAT Gateway (나) Internet Gateway", "(가) VPC Endpoint (나) Internet Gateway"], "a": 3, "e": "NAT Gateway는 Public IP가 없는 자원에 Outbound용 대표 공인 IP를 매핑해 주며, 생성 전 VPC와 Internet Gateway 연결이 필수입니다. Internet Gateway를 생성하면 Firewall이 자동 생성됩니다(사용 해제 시에도 미사용 상태로 생성). Private NAT는 Direct Connect를 통해 고객사망으로 나갈 때 쓰는 사설 NAT입니다.", "src": "SCP_v2_Explore_Network_01-10(VPC) 슬라이드18, 24, 26", "s": "(가)는 Public IP가 연결되지 않은 Virtual Server가 인터넷으로 단방향(Outbound) 통신을 할 수 있도록 1개의 대표 공인 IP를 매핑해 주는 서비스이다. (가)를 생성하려면 VPC에 (나)가 먼저 연결되어 있어야 하며, (나)를 생성하면 Firewall이 함께 자동 생성된다.", "id": "3-1b-05"}, {"item": "3-1m", "t": "LB·GSLB", "q": "다음은 SCP(Samsung Cloud Platform)의 부하 분산 서비스에 대한 설명입니다. (가), (나)에 들어갈 서비스를 바르게 짝지은 것은 무엇입니까?", "o": ["(가) Load Balancer (나) GSLB", "(가) Load Balancer (나) Global CDN", "(가) GSLB (나) DNS", "(가) Global CDN (나) GSLB", "(가) Transit Gateway (나) GSLB"], "a": 0, "e": "Load Balancer는 L4/L7 유형을 제공하며 LB·Listener·LB 서버 그룹·헬스 체크를 같은 Subnet에 구성합니다. GSLB는 DNS 기반 트래픽 분산과 장애 감지를 제공하며, Ratio/Round Robin 알고리즘과 도메인당 최대 8개 연결 대상을 지원합니다. Global CDN은 엣지 서버 캐싱 서비스로 분산 알고리즘을 선택하지 않습니다.", "src": "SCP_v2_Explore_Network_01-10(Load Balancer) 슬라이드5, SCP_v2_Explore_Network_01-10(DNS/GSLB/Global CDN) 슬라이드17, 19-20", "s": "- (가): L4(TCP/UDP/TLS)와 L7(HTTP/HTTPS) 유형을 제공하며, Listener·서버 그룹·헬스 체크를 구성하여 가용한 서버로 트래픽을 자동 분산한다.\n- (나): DNS 기반으로 트래픽을 분산하고 장애를 감지하여 글로벌 서비스의 고가용성을 제공하며, Ratio 또는 Round Robin 알고리즘을 선택하고 도메인당 최대 8개의 연결 대상을 등록할 수 있다.", "id": "3-1m-05"}, {"item": "3-1i", "t": "VPC Peering·TGW", "q": "다음은 SCP(Samsung Cloud Platform) 네트워크 설계 시 비용 최적화 전략에 대한 설명입니다. (가), (나)에 들어갈 서비스를 바르게 짝지은 것은 무엇입니까?", "o": ["(가) VPC Endpoint (나) Transit Gateway", "(가) VPC Peering (나) Direct Connect", "(가) VPC Peering (나) Transit Gateway", "(가) Transit Gateway (나) VPC Peering", "(가) Private NAT (나) Cloud WAN"], "a": 2, "e": "VPC Peering은 VPC 1:1 연결에 쓰이며 트래픽 비용만 발생하고, Transit Gateway는 다수 VPC를 연결하는 중앙 집중형 허브로 생성 요금·트래픽 요금·포트 이용료가 발생합니다. 따라서 단순 VPC 연결은 Peering, 복잡한 구성은 Transit Gateway를 도입합니다.", "src": "SCP_v2_Explore_Network_01-10(SCP Networking Service) 슬라이드19, SCP_v2_Explore_Network_01-10(VPN/Direct Connect/Transit Gateway) 슬라이드18", "s": "여러 VPC를 사설 IP로 연결할 때, (가)는 VPC 간 1:1 연결에 사용하며 트래픽 비용만 발생한다. (나)는 중앙 집중형 허브 형태로 다수의 VPC와 고객 네트워크를 연결하는 데 유리하지만 생성 요금, 트래픽 요금, 포트 이용료가 발생한다. 따라서 단순한 VPC 연결 구성에는 (가)를, 복잡한 구성에는 (나)를 도입한다.", "id": "3-1i-04"}, {"item": "3-1n", "t": "Global CDN", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform)의 상품 또는 서비스는 무엇입니까?", "o": ["GSLB", "Load Balancer", "DNS", "Object Storage", "Global CDN"], "a": 4, "e": "엣지 서버 캐싱, 콘텐츠 압축, TTL 만료 시 Purge, HTTPS 원본 통신과 DDoS·웹 공격 보호는 Global CDN의 제공 기능입니다. GSLB는 DNS 기반 트래픽 분산·헬스 체크 서비스이고, Object Storage는 CDN의 원본(Origin)이 될 수 있는 저장소입니다.", "src": "SCP_v2_Explore_Network_01-10(DNS/GSLB/Global CDN) 슬라이드22", "s": "- 글로벌 네트워크에 분산된 엣지 서버에 웹서버·Object Storage의 정적 콘텐츠를 캐싱하여 전달\n- 원본 콘텐츠 압축으로 트래픽 감소 및 응답 속도 개선\n- 캐시 만료 시간(TTL)이 지난 콘텐츠를 엣지 서버에서 삭제(Purge)\n- HTTPS로 원본 서버와 통신하고 DDoS 및 웹 기반 공격으로부터 콘텐츠 보호", "id": "3-1n-04"}, {"item": "3-1q", "t": "Cloud Last Mile", "q": "제조사 A는 회사 사업장과 SCP(Samsung Cloud Platform) 간 네트워크를 연결하여 SCP의 다양한 서비스를 활용하려고 합니다. 다음의 기능을 제공하는 SCP Networking 서비스는 무엇입니까?", "o": ["Cloud Secured SD-LAN", "Cloud LAN-Data Center", "Cloud Last Mile", "Cloud WAN", "Direct Connect"], "a": 2, "e": "Cloud Last Mile은 고객 사업장과 SCP 리전 간 Last Mile 회선(전용선/인터넷)과 사업장 내 Customer Edge 자원(uCPE VNF, SD-WAN 물리 장비)을 패키지로 제공하고 회선 모니터링을 지원합니다. Cloud Secured SD-LAN은 사업장 내 인증 기반 유무선 네트워크, Cloud LAN-Data Center는 SDDC 기반 데이터센터 내 가상 네트워크, Cloud WAN은 SCP 리전과 글로벌 권역 간 연결 서비스입니다.", "src": "SCP_v2_Explore_Network_01-10(Cloud Secured SD-LAN/Cloud Last Mile/SASE/Cloud LAN-Data Center) 슬라이드9, 13, 26, SCP_v2_Explore_Network_01-10(SCP Networking Service) 슬라이드13", "s": "- 고객 사업장에서 SCP 리전까지 연결하는 전용선 또는 인터넷 회선 제공\n- 고객 사업장 내 uCPE 기반 VNF(라우터, SD-WAN, WAN 가속기, 방화벽) 또는 SD-WAN 물리 장비 제공\n- 회선 업다운 상태 및 트래픽 사용량 모니터링\n- 회선과 Edge 장비는 패키지 형태로만 제공", "id": "3-1q-05"}, {"item": "3-1l", "t": "L7 Load Balancer", "q": "A 고객사는 SCP(Samsung Cloud Platform)에서 HTTPS 기반 쇼핑몰을 운영하고 있습니다. https://shop.example.com/api 요청은 API 서버 그룹으로, /static 요청은 정적 콘텐츠 서버 그룹으로 전달해야 하며, 서버마다 인증서를 설치·갱신하는 관리 부담과 서버의 HTTPS 암복호화 부하를 줄이려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["L4 LB에 인증서를 등록한 TLS Listener를 만들고 라우팅 규칙에서 URL 경로별 LB 서버 그룹을 지정한다.", "L7 LB에 Certificate Manager 인증서를 등록한 HTTPS Listener를 만들고 URL 경로별 LB 서버 그룹을 지정한다.", "GSLB에 두 서버 그룹의 IP를 연결 대상으로 등록하고 Ratio 가중치로 경로별 트래픽을 나눈다.", "별도 Virtual Server에 Nginx를 설치해 경로 기반 리버스 프록시와 인증서를 직접 구성·운영한다.", "각 서버에 인증서를 설치하고 L4 LB의 TCP 443 Listener에서 IP Hash 방식으로 분산한다."], "a": 1, "e": "L7(HTTP/HTTPS) Load Balancer는 URL 경로·호스트 헤더 기준 라우팅과 SSL Offloading을 지원하며, HTTPS Listener에는 Certificate Manager에 생성한 인증서를 등록합니다. L4 Listener의 라우팅 규칙은 'LB 서버 그룹 전달'로 고정되어 경로 분기가 불가하고, GSLB는 DNS 수준 분산이라 URL 경로를 구분하지 못합니다. Nginx 직접 구성은 동작하지만 운영 부담과 단일 장애 지점이 생깁니다.", "src": "SCP_v2_Explore_Network_01-10(Load Balancer) 슬라이드6, 8, 14, 15", "id": "3-1l-05"}, {"item": "3-2e", "t": "Cloud Functions", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform)의 상품 또는 서비스는 무엇입니까?", "o": ["Cloud Functions", "API Gateway", "Virtual Server Auto-Scaling", "Kubernetes Engine", "DevOps Service"], "a": 0, "e": "Go·Java·Node.js·PHP·Python 런타임의 인라인 편집기, Blueprint 샘플 코드, API Gateway/Cronjob 트리거, 최소 작업 수 설정을 통한 Cold Start 방지는 서버리스 FaaS인 Cloud Functions의 기능입니다. API Gateway는 Cloud Functions의 트리거로 연계되는 서비스일 뿐 코드를 실행하지 않습니다.", "src": "SCP_v2_Explore_Compute_11-19(Cloud Functions) 슬라이드6, 13, 16, 17", "s": "- Go, Java, Node.js, PHP, Python 런타임의 코드 작성 환경(인라인 편집기) 제공\n- Blueprint를 통한 'Hello World' 등 샘플 코드로 빠른 시작\n- API Gateway 또는 Cronjob 트리거로 코드 자동 실행\n- 최소 작업 수를 1 이상으로 설정하면 Cold Start 방지(지속 과금)", "id": "3-2e-05"}, {"item": "3-2h", "t": "Edge Server", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform)의 상품 또는 서비스는 무엇입니까?", "o": ["Bare Metal Server", "Cloud Last Mile", "Private 5G Cloud", "Edge Server", "Virtual Server DR"], "a": 3, "e": "Edge Server는 데이터 보안·규제·지연 시간 이슈로 클라우드 전환이 어려운 기업의 On-Site에 Edge Cloud를 제공하며, SCP의 Edge Manager가 고객 사이트의 Edge Client를 통해 서버를 관리합니다. SCP와의 네트워크는 VPN 또는 전용회선으로 구성하고, 콘솔의 Hybrid Cloud > Edge Server 서비스 요청으로 신청합니다(사용 기간 기본 3년).", "src": "SCP_v2_Explore_Compute_11-19(Hybrid Cloud Edge Server) 슬라이드5, 6, 8, 9", "s": "- 데이터 보안·규제·지연 시간 문제로 클라우드 전환이 어려운 기업의 On-Site 환경에 Edge Cloud 제공\n- SCP에 위치한 Manager가 고객 사이트 서버의 Client를 통해 KVM 등 가상화 환경을 관리\n- 고객 사이트와 SCP 간 네트워크는 VPN 또는 전용회선으로 구성\n- 서비스 요청(배송지 주소, 호스트 서버 OS, 서버 Type·수량 기재)으로 신청하며 사용 기간은 기본 3년", "id": "3-2h-04"}, {"item": "3-2d", "t": "Auto-Scaling 스케줄+정책", "q": "B 고객사는 Load Balancer와 연동된 Auto-Scaling Group으로 쇼핑몰을 운영하고 있습니다. 매주 금요일 20시에 시작하는 정기 할인 이벤트로 트래픽이 급증하므로 이벤트 전에 서버를 미리 늘려 두어야 하고, 평소에는 불규칙한 트래픽 변동에 맞춰 서버 수가 자동으로 조정되어야 합니다. 운영자의 반복 작업은 최소화하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["Virtual Server의 Job Scheduling 기능으로 매주 금요일 19:30에 대기 서버를 자동 시작하도록 등록한다.", "CPU 사용량 기반 Scale Out/In 정책만 설정하여 이벤트 트래픽도 정책이 자동으로 처리하도록 한다.", "운영자가 매주 금요일 이벤트 전에 콘솔에서 Desired 서버 수를 수동으로 늘렸다가 이벤트 후 줄인다.", "이벤트 직전 서버 타입을 상위 타입으로 변경하고, 이벤트가 끝나면 원래 타입으로 되돌린다.", "매주 금요일 19:30 스케줄로 Min/Desired 값을 높이고 종료 후 원복 스케줄을 두며, CPU 기반 Scale Out/In 정책을 함께 설정한다."], "a": 4, "e": "예측 가능한 부하는 스케줄(주기 '매주', 요일 선택, 30분 단위 시간)로 미리 서버 수를 조정하고, 불규칙한 변동은 지표 기반 정책으로 대응하는 조합이 적합합니다. v2 Virtual Server는 Job Scheduling을 제공하지 않으며, 정책만으로는 부하 발생 후에야 확장됩니다. 서버 타입은 상위 타입으로만 변경할 수 있어 되돌리는 방식도 불가합니다.", "src": "SCP_v2_Explore_Compute_11-19(Auto-Scaling) 슬라이드14, 15, SCP_v2_Explore_Compute_11-19(SCP Compute Service) 슬라이드11, SCP_v2_Explore_Compute_11-19(Virtual Server) 슬라이드17", "id": "3-2d-04"}, {"item": "3-2a", "t": "Server Group Anti-Affinity", "q": "C 고객사는 같은 Subnet에서 WAS용 Virtual Server 4대를 운영하고 있습니다. 최근 하나의 물리 호스트 장애로 같은 호스트에 배치된 WAS가 동시에 중단되는 일이 발생했습니다. 추가 서비스 비용과 관리 부담 없이, 호스트 장애가 전체 WAS 장애로 이어지지 않도록 하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["Affinity 정책의 Server Group을 생성하고, WAS 서버 생성 시 해당 Server Group을 선택한다.", "Bare Metal Server의 Placement Group을 생성해 WAS용 Virtual Server를 서로 다른 랙에 배치한다.", "Anti-Affinity 정책의 Server Group을 생성하고, WAS 서버 생성 시 해당 Server Group을 선택한다.", "WAS 서버를 각각 다른 VPC에 생성하고 VPC Peering으로 연결하여 물리적으로 분리한다.", "Marketplace의 Virtual Server DR 서비스를 구성하여 장애 시 DR 사이트로 전환한다."], "a": 2, "e": "Server Group의 Anti-Affinity(분산 배치) 정책은 그룹 내 서버를 가급적 다른 랙·호스트에 분산 배치해 단일 물리 호스트 장애가 전체 장애로 번지는 것을 막습니다. Affinity는 통신 지연 최소화를 위한 근접 배치이고, Placement Group은 Bare Metal Server용 기능입니다. VPC 분리는 호스트 분산을 보장하지 않으며, DR 구성은 요구사항 대비 비용·관리 부담이 큽니다.", "src": "SCP_v2_Explore_Compute_11-19(Virtual Server) 슬라이드6, 11, 14, SCP_v2_Explore_Compute_11-19(Baremetal) 슬라이드5, 11, WA백서 01 p.29", "id": "3-2a-06"}, {"item": "3-2b", "t": "Compute 생성·변경 규칙", "q": "SCP(Samsung Cloud Platform) Compute 서비스의 생성과 변경에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Virtual Server의 서버 타입은 현재 서버 타입보다 상위 타입으로만 변경할 수 있다.", "Bare Metal Server의 Hyper Threading 설정은 서버 생성 후에는 변경할 수 없다.", "Bare Metal Server의 Placement Group은 최초 생성 시에만 적용할 수 있다.", "Bare Metal Server도 Virtual Server처럼 한 번의 신청으로 최대 100대까지 동시에 생성할 수 있다.", "Lock을 설정하면 서버 해지·시작·중지 등의 동작을 실행할 수 없어 운영 실수를 방지할 수 있다."], "a": 3, "e": "동시에 생성할 수 있는 서버 수는 Virtual Server가 1~100대, Bare Metal Server는 1~5대입니다. 나머지는 교재 내용과 일치하며, 특히 Hyper Threading과 Placement Group은 생성 시점에 결정해야 하는 설정입니다.", "src": "SCP_v2_Explore_Compute_11-19(Virtual Server) 슬라이드13, 16, 17, SCP_v2_Explore_Compute_11-19(Baremetal) 슬라이드5, 9, 12", "id": "3-2b-05"}, {"item": "3-3f", "t": "Container Registry", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform)의 상품 또는 서비스는 무엇입니까?", "o": ["Kubernetes Engine", "Container Registry", "Object Storage", "DevOps Service", "Cloud Functions"], "a": 1, "e": "이미지 Push/Pull·Tag 버전 관리, 보안 스캔·취약점 분석, Helm Chart·OCI Artifact 저장, Object Storage 기반의 저비용 대용량 이미지 관리는 Container Registry의 기능입니다. Object Storage는 Registry가 내부 저장소로 활용하는 서비스이고, Kubernetes Engine은 컨테이너 오케스트레이션 서비스입니다.", "src": "CloudNative1_Container_Services 슬라이드20, 21", "s": "- Container Image Push, Pull, 조회, 삭제 및 Tag 버전 관리\n- Image 보안 스캔 및 취약점 분석 결과 제공\n- Container Image 외에 Helm Chart, OCI Artifact 저장\n- Object Storage를 통해 저렴한 비용으로 대용량 이미지를 효율적으로 관리", "id": "3-3f-04"}, {"item": "3-3c", "t": "Node Pool 자동 확장·복구", "q": "D 고객사는 Kubernetes Engine에서 이벤트성 서비스를 운영하고 있습니다. 트래픽이 몰리면 Pod 수를 늘리지만 기존 Worker Node의 자원이 부족해 Pod가 배치되지 못하는 일이 생기고, 간혹 Worker Node 장애로 Pod가 줄어드는 문제도 발생합니다. Kubernetes 전문 인력이 부족해 운영 부담을 최소화하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["Deployment의 replica 수만 늘리면 Kubernetes Engine이 필요한 Worker Node를 자동으로 추가하므로 별도 설정이 필요 없다.", "Control Plane 노드를 추가로 생성해 남는 자원에 Pod가 배치되도록 하고, 장애 노드는 etcd에서 직접 제거한다.", "모니터링 알림을 받으면 운영자가 Worker Node를 수동으로 추가하고, 장애 노드는 직접 삭제 후 재생성한다.", "예상 최대 트래픽 기준으로 Worker Node를 미리 충분히 생성해 두고 상시 유지한다.", "Node Pool의 자동 확장/축소(Auto-Scaling) 옵션과 노드 자동 복구 기능을 활성화한다."], "a": 4, "e": "신규 노드가 자동 할당되려면 Node Pool의 자동 확장/축소 옵션을 사용해야 하며, 노드 자동 복구를 활성화하면 노드가 일정 시간 NotReady 상태일 때 자동 복구가 개시됩니다. Control Plane은 SCP가 설치·운영하므로 사용자가 다루는 대상이 아닙니다. 수동 운영이나 최대치 상시 프로비저닝은 동작하지만 운영 부담과 비용이 큽니다.", "src": "WA백서 01 p.26, p.32-33, CloudNative1_Container_Services 슬라이드23", "id": "3-3c-04"}, {"item": "3-3g", "t": "Namespace·NetworkPolicy", "q": "E 고객사는 하나의 Kubernetes Engine Cluster에서 운영과 개발 워크로드를 함께 운영하려고 합니다. 두 환경의 리소스를 논리적으로 구분하고, 개발 환경의 Pod가 운영 환경의 Pod에 접근하지 못하도록 통제해야 하며, 자원 활용도는 높게 유지하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["운영·개발 Namespace를 생성하여 리소스를 분리하고, NetworkPolicy로 Namespace 간 Pod 트래픽을 제어한다.", "운영·개발 Namespace만 생성하면 Namespace 간 Pod 트래픽은 기본적으로 차단되므로 추가 설정이 필요 없다.", "운영용과 개발용 Kubernetes Cluster를 각각 생성하여 환경을 물리적으로 분리한다.", "운영·개발 Pod를 서로 다른 ReplicaSet으로 배포하여 ReplicaSet 단위로 트래픽을 격리한다.", "Ingress에 운영·개발 호스트를 분리 등록해 외부 트래픽 경로만 나누면 Pod 간 통신도 차단된다."], "a": 0, "e": "Namespace는 Cluster 내 리소스를 논리적으로 분리하고, NetworkPolicy는 Namespace 간 Pod 트래픽을 제어합니다. Pod는 기본적으로 모든 소스의 트래픽을 허용하므로 Namespace만으로는 차단되지 않습니다. 별도 Cluster 구성은 동작하지만 리소스 활용도가 떨어지고, Ingress는 외부 트래픽 라우팅용입니다.", "src": "CloudNative1_Container_Services 슬라이드15-18, 26", "id": "3-3g-04"}, {"item": "3-4d", "t": "Object→Archive", "q": "다음은 F 고객사의 로그 데이터 보관 방안입니다. (가), (나)에 들어갈 스토리지 서비스를 바르게 짝지은 것은 무엇입니까?", "o": ["(가) File Storage (나) Archive Storage", "(가) Archive Storage (나) Object Storage", "(가) Object Storage (나) Archive Storage", "(가) Block Storage (나) Object Storage", "(가) Object Storage (나) Parallel File Storage"], "a": 2, "e": "Archive Storage는 Object Storage의 데이터를 장기 보관하는 서비스로, 정책에서 Object Storage 버킷과 수행 시점을 지정하면 그 기간 이상 변경 없는 파일이 자동 아카이빙되고, 복구 시 Object Storage의 버킷·폴더를 선택해 되돌립니다. File Storage나 Block Storage는 Archiving 대상이 아닙니다.", "src": "SCP_v2_Explore_Storage_20-24(Object storage) 슬라이드5, 7, SCP_v2_Explore_Storage_20-24(Archive storage) 슬라이드5, 8, 9, 11", "s": "애플리케이션 서버는 생성한 로그 파일을 URL 형태로 접근하는 (가)의 버킷에 업로드한다. (나)에 정책 작업을 추가하여 (가)의 버킷을 대상으로 지정하고 수행 시점을 입력하면, 해당 기간 이상 변경되지 않은 파일은 자동으로 (나)에 장기 보관된다. 감사 등으로 과거 로그가 필요하면 (나)에서 파일을 선택하여 (가)의 버킷과 폴더로 복구한다.", "id": "3-4d-04"}, {"item": "3-4e", "t": "Parallel File Storage", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform)의 상품 또는 서비스는 무엇입니까?", "o": ["Parallel File Storage", "File Storage", "Block Storage(BM)", "Object Storage", "Archive Storage"], "a": 0, "e": "All NVMe 기반 고성능 병렬 파일 스토리지로 Multi-node GPU Cluster 서버와 연결하고, 1~1,000TB(생성 후 증설만), 스냅샷 최대 50개·최신 스냅샷으로만 복구하는 것은 Parallel File Storage의 특징입니다. File Storage는 NFS/CIFS로 다수 서버가 공유하는 범용 스토리지로 스냅샷 수와 복구 방식이 다릅니다.", "src": "SCP_v2_Explore_Storage_20-24(Parallel File storage) 슬라이드5, 6, 8, 9, 11, 14", "s": "- AI/ML 및 빅데이터 분석에 적합한 All NVMe 기반 고성능 병렬 파일 스토리지\n- Multi-node GPU Cluster의 Cluster Fabric을 확인해 서버를 연결하고, Agent 설치 후 2개 네트워크 인터페이스로 HA 마운트\n- 1~1,000TB 용량으로 생성하며 생성 후에는 증설만 가능\n- 스냅샷은 최대 50개까지 생성하며 가장 최신 스냅샷으로만 복구", "id": "3-4e-05"}, {"item": "3-4c", "t": "Object Storage 버전관리·접근제어", "q": "G 고객사는 사내 문서를 Object Storage 버킷에 보관하고 있습니다. 사용자가 같은 이름의 파일을 실수로 덮어써도 이전 파일을 복원할 수 있어야 하고, 버킷에는 같은 Account의 문서 처리용 Virtual Server 2대만 접근하도록 제한해야 합니다. 관리 부담은 최소화하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["버킷의 버전 관리를 사용 설정하고, 버킷에 Security Group을 적용하여 2대의 IP만 허용한다.", "Archive Storage 정책으로 버킷을 매일 아카이빙하고, 접근 제어의 Public IP 허용에 2대의 사설 IP를 등록한다.", "Cloud Functions Cronjob으로 매시간 파일을 다른 버킷에 복사하고, 서비스 자원 허용에 2대를 등록한다.", "버킷의 버전 관리를 사용 설정하고, 접근 제어의 서비스 자원 허용에 Virtual Server 2대를 등록한다.", "문서를 File Storage로 옮겨 스냅샷 스케줄을 설정하고, 2대 서버만 연결 자원으로 선택한다."], "a": 3, "e": "버전 관리를 설정하면 같은 이름 파일 업로드 시 버전 ID가 다른 버전이 남아 덮어쓴 이전 파일을 버전 목록에서 내려받을 수 있고, 접근 제어의 서비스 자원 허용에 Virtual Server 등을 등록해 접근을 제한합니다. Object Storage에는 Security Group을 적용하지 않습니다. 복사 스크립트나 File Storage 이전은 동작하지만 주기 사이의 변경이 유실될 수 있고 관리 부담이 큽니다.", "src": "SCP_v2_Explore_Storage_20-24(Object storage) 슬라이드11-13, 15-17, SEA_문제_예시 4번", "id": "3-4c-05"}, {"item": "3-4b", "t": "File Storage CIFS", "q": "H 고객사는 Windows 기반 웹 서버(Virtual Server) 3대를 운영하고 있으며, 사용자가 업로드한 파일을 세 서버가 같은 폴더로 공유해야 합니다. 데이터는 꾸준히 늘어나며, 서버 간 동기화 작업 없이 관리 부담을 최소화하려고 합니다. 다음 중 요구사항을 구현하기 위한 가장 적합한 방안은 무엇입니까?", "o": ["File Storage 볼륨을 NFS 프로토콜로 생성하고, 각 서버에서 mount -t nfs 명령으로 연결한다.", "SSD_MultiAttach 유형의 Block Storage를 생성하여 3대 서버에 함께 연결한다.", "서버마다 Block Storage를 추가하고 스크립트로 서버 간 파일을 주기적으로 동기화한다.", "Parallel File Storage를 생성하여 3대 서버에 wekafs로 마운트한다.", "File Storage 볼륨을 CIFS 프로토콜로 생성하고, 3대 서버를 연결 자원으로 선택한 뒤 각 서버에서 연결한다."], "a": 4, "e": "File Storage는 네트워크로 연결된 다수 서버가 데이터를 공유하는 스토리지로, 운영체제에 맞춰 Linux는 NFS, Windows는 CIFS 프로토콜을 선택합니다. Windows 기반 Virtual Server는 MultiAttach 디스크를 사용할 수 없고, 서버별 동기화는 관리 부담이 큽니다. Parallel File Storage는 Multi-node GPU Cluster와 연결하는 AI/ML용 고성능 스토리지로 이 용도에는 맞지 않습니다.", "src": "SCP_v2_Explore_Storage_20-24(File storage) 슬라이드5, 6, 8, SCP_v2_Explore_Compute_11-19(BlockStorage VM) 슬라이드8, SCP_v2_Explore_Storage_20-24(Parallel File storage) 슬라이드5, 8", "id": "3-4b-05"}, {"item": "3-4a", "t": "Storage 생성·변경 규칙", "q": "SCP(Samsung Cloud Platform) 스토리지 서비스의 생성과 변경에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Block Storage(VM)는 8GB에서 최대 12TB 범위에서 사용 중 증설할 수 있다.", "Block Storage(VM)는 Virtual Server에 연결된 상태에서도 다른 Account로 볼륨 이전을 실행할 수 있다.", "Bare Metal Server용 Block Storage(BM)는 생성 후 용량을 증설할 수 없다.", "Parallel File Storage는 1~1,000TB로 생성하며, 생성 후에는 증설만 가능하다.", "Archive Storage 정책의 Archiving 대상 버킷은 최초 설정 후 수정할 수 없다."], "a": 1, "e": "Block Storage(VM)의 볼륨 이전 버튼을 활성화하려면 먼저 서버 연결을 해제해야 하며, 다른 Account에서 이전 받기가 완료되어야 기존 Account에서 볼륨이 제거됩니다. 나머지 보기는 각 스토리지의 생성·증설 규칙과 일치합니다.", "src": "SCP_v2_Explore_Compute_11-19(BlockStorage VM) 슬라이드5, 12, SCP_v2_Explore_Compute_11-19(Baremetal) 슬라이드13, SCP_v2_Explore_Storage_20-24(Parallel File storage) 슬라이드6, SCP_v2_Explore_Storage_20-24(Archive storage) 슬라이드8", "id": "3-4a-05"}, {"item": "3-5a", "t": "DBaaS 전환", "q": "A사는 Virtual Server 2대에 MySQL을 직접 설치하고 InnoDB Cluster로 HA를 구성해 운영하고 있습니다. 서버 OS 패치, 서버 간 네트워크·보안 설정, 백업 스크립트 관리에 많은 운영 인력이 들고 있습니다. A사는 운영 관리 부담을 최소화하면서 데이터베이스의 고가용성과 정기 백업을 확보하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["Virtual Server를 3대로 늘려 InnoDB Cluster를 재구성하고, Backup 서비스로 VM 이미지를 매일 백업한다.", "MySQL(DBaaS) 단일 구성으로 이전하고, Read Replica를 추가해 장애 시 Replica가 자동 승격되게 한다.", "MySQL(DBaaS)로 이전하면서 생성 시 고가용성 옵션과 백업을 설정하고, 백업본은 Object Storage에 저장한다.", "CacheStore(DBaaS)로 이전하고 Sentinel 이중화(Replica 2개)를 구성해 Master 장애 시 자동 승격되게 한다.", "MySQL(DBaaS)를 단일 구성으로 생성하고, 장애 시 백업본으로 새 DB를 복구해 서비스를 재개한다."], "a": 2, "e": "WA 가용성 백서는 VS에 직접 MySQL HA·백업을 구성하는 대신 MySQL(DBaaS)를 쓰면 옵션 설정만으로 고가용성 구성이 자동화된다고 설명하며, DBaaS 백업은 내장 기능으로 사용자 Object Storage에 저장됩니다. Read Replica는 읽기 분산용이지 HA 대체 수단이 아니고, 단일 구성 후 백업 복구는 복구 시간 동안 서비스가 중단되어 고가용성 요구를 충족하지 못합니다.", "src": "WA백서 01 p.18(IaaS와 관리형 서비스), WA백서 03 p.10·12(DBaaS 백업), DB1_Database_정리 3장", "id": "3-5a-04"}, {"item": "3-7e", "t": "Vertica(DBaaS)", "q": "B사는 PostgreSQL(DBaaS)에 수년간의 판매 이력 수십억 건을 저장하고, 제품·기간별로 몇 개 열만 집계하는 분석 쿼리를 실행하고 있습니다. 데이터가 늘면서 쿼리가 계속 느려지고 있습니다. B사는 운영 부담을 최소화하면서, 데이터 증가에 맞춰 노드를 추가해 분석 성능을 선형적으로 높이고 일부 노드 장애 시에도 분석을 계속하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["PostgreSQL(DBaaS)의 서버 타입을 High Capacity로 변경하고, 이후에도 필요할 때마다 상위 타입으로 Scale-Up한다.", "PostgreSQL(DBaaS)에 Read Replica를 여러 개 추가해 분석 쿼리를 Replica로 분산한다.", "판매 이력을 CacheStore(DBaaS)로 옮겨 인메모리 환경에서 집계 쿼리를 수행한다.", "Virtual Server 여러 대에 오픈소스 MPP 데이터 웨어하우스를 직접 설치해 클러스터를 구성한다.", "분석 데이터를 Vertica(DBaaS)로 이전해 컬럼 기반 저장과 MPP 병렬 처리를 쓰고, K-Safe로 노드 장애에 대비한다."], "a": 4, "e": "Vertica(DBaaS)는 필요한 열만 읽는 컬럼 기반 저장, 노드 추가로 성능이 선형 향상되는 Shared-Nothing MPP, K개 노드 장애에도 복구를 보장하는 K-Safe 설계를 관리형으로 제공합니다. Scale-Up과 Read Replica는 행 기반 스캔 구조와 노드 수평 확장 한계가 그대로 남고, VS 위 직접 구축은 동작하지만 운영 부담이 큽니다.", "src": "DataAnalytics_2_Data_Warehouse 슬라이드4·8·14, WA백서 04 p.33(OLAP)", "id": "3-7e-05"}, {"item": "3-9b", "t": "DevOps Service", "q": "C사는 개발팀마다 GitHub, Jenkins, Docker Hub를 각자 연동해 빌드·배포 스크립트를 관리하고 있으며, 배포 대상은 Kubernetes Engine과 Virtual Server가 섞여 있습니다. C사는 CI/CD 도구 관리 부담을 줄이면서, 사내 표준 언어·프레임워크 구성으로 새 프로젝트 환경을 빠르게 만들 수 있게 하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["DevOps Service는 Kubernetes 배포만 지원하므로, VM 애플리케이션을 모두 컨테이너로 전환한 뒤 DevOps Service를 도입한다.", "DevOps Console에 CI/CD 도구와 배포 타겟을 등록하고, 사내 표준을 테넌트 템플릿으로 등록해 Wizard로 프로젝트를 만든다.", "DevOps Service는 System 템플릿만 제공하므로, 사내 표준은 문서로 배포하고 각 팀이 프로젝트 생성 후 직접 수정한다.", "팀마다 Virtual Server에 Jenkins를 직접 설치하고, 공통 파이프라인 스크립트를 Git 저장소로 공유한다.", "Cloud Functions에서 빌드·배포 스크립트를 실행하는 이벤트 기반 파이프라인을 직접 구현한다."], "a": 1, "e": "DevOps Service는 DevOps Console에서 소스 저장소·이미지 저장소·Jenkins 등 CI/CD 도구를 등록·연계하고, 배포 타겟으로 컨테이너뿐 아니라 VM도 지원하며, 테넌트·Account별 자체 템플릿을 등록해 Wizard 방식으로 프로젝트를 구성할 수 있습니다. 템플릿은 System/Tenant/ProjectGroup 유형이 있으므로 'System 템플릿만'이라는 전제는 틀립니다.", "src": "CloudNative2_DEVOPS1_DevOps_Tools 슬라이드8·11·16·17", "id": "3-9b-04"}, {"item": "3-6a", "t": "API Gateway", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["Load Balancer", "API Gateway", "Cloud Functions", "Kubernetes Engine", "Global CDN"], "a": 1, "e": "리소스·메서드 단위로 API를 정의하고 HTTP 또는 Cloud Function을 통합 대상으로 연결하며, 스테이지로 배포하고 CORS·JWT·IP Restriction을 설정하는 것은 API Gateway의 기능입니다. Cloud Functions는 API Gateway의 백엔드(통합 대상)로 연결되는 쪽입니다.", "src": "ApplicationService_1_API_Gateway 슬라이드8·15·17·18·19", "s": "- 리소스(URI 경로)와 메서드(GET, POST 등) 단위로 인터페이스 정의\n- 통합 유형으로 HTTP 엔드포인트 또는 Cloud Function을 백엔드로 연결\n- dev / test / prod 등 스테이지 단위로 배포\n- 스테이지별 CORS, JWT, IP Restriction 설정", "id": "3-6a-04"}, {"item": "3-6a", "t": "API Gateway·Microservice", "q": "다음은 WA 가용성 백서의 Microservice 아키텍처 구성에 대한 설명입니다. (가), (나)에 들어갈 내용으로 옳은 것은 무엇입니까?", "o": ["(가) API Gateway (나) Service Mesh", "(가) Load Balancer (나) Service Mesh", "(가) API Gateway (나) Message Queue", "(가) Ingress (나) API Gateway", "(가) Load Balancer (나) Ingress"], "a": 0, "e": "Microservice 아키텍처에서 API Gateway는 최전방에서 모든 API 호출의 인증과 서비스 라우팅을 수행하고 과도한 요청을 Throttling으로 제한합니다. 분할된 애플리케이션 간 네트워크 제어와 데이터 흐름 관리·추적에는 Service Mesh 기술을 사용합니다.", "src": "WA백서 01 p.22-23(Microservice 아키텍처)", "s": "클라이언트 요청은 Load Balancer를 거쳐 VM/Container 워크로드와 (가)로 전달된다. API 요청이 아닌 요청은 Kubernetes Engine의 ingress를 통해 서비스 Pod로 라우팅된다. API 요청은 최전방의 (가)가 인증과 서비스 라우팅을 수행하며, 과도한 요청은 일정 수준에서 제한(Throttling)한다. 분할된 Microservice 간 네트워크를 제어하고 데이터 흐름을 관리·추적하려면 (나) 기술을 사용할 수 있다.", "id": "3-6a-05"}, {"item": "3-7f", "t": "Quick Query", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 상품 또는 서비스는 무엇입니까?", "o": ["Event Streams", "Search Engine", "Quick Query", "Vertica(DBaaS)", "Data Flow"], "a": 2, "e": "이기종 저장소를 데이터 이동 없이 단일 SQL로 조회하는 Federated Query(Trino 기반)는 Quick Query의 특징이며, WA 가용성 백서는 Quick Query의 장애를 'SQL 쿼리 요청이 5분 이상 외부 연결·접속을 확보하지 못하는 경우'로 정의합니다. Search Engine은 Elasticsearch, Event Streams는 Kafka 기반입니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드4·11, WA백서 01 p.5(SLA)", "s": "- Kafka, MySQL, PostgreSQL, Elasticsearch, Iceberg 등 이기종 저장소의 데이터를 단일 SQL로 조회\n- 데이터를 중앙으로 이동·복제하지 않고 In-Memory로 조인\n- 커넥터로 각 소스의 메타데이터를 조회한 뒤 Planning 단계에서 쿼리 최적화\n- SQL 쿼리 요청이 5분 이상 외부 연결·접속을 확보하지 못하면 장애로 보는 SLA", "id": "3-7f-04"}, {"item": "3-7b", "t": "Event Streams·Search Engine", "q": "다음은 B 고객사 쇼핑몰의 로그 분석 파이프라인에 대한 설명입니다. (가), (나)에 들어갈 Samsung Cloud Platform 서비스로 옳은 것은 무엇입니까?", "o": ["(가) Search Engine (나) Event Streams", "(가) Event Streams (나) Vertica(DBaaS)", "(가) Quick Query (나) Search Engine", "(가) Event Streams (나) Search Engine", "(가) Data Ops (나) Quick Query"], "a": 3, "e": "사용자 행동 이벤트의 실시간 스트리밍은 Kafka 기반 Event Streams가, Logstash가 보낸 로그의 인덱싱·검색과 Kibana 시각화는 Elasticsearch 기반 Search Engine이 담당합니다. Quick Query는 Trino 기반 Federated Query로 저장소를 조회하는 쪽이고, Vertica는 컬럼 기반 DW, Data Ops는 Airflow 기반 워크플로 오케스트레이션입니다.", "src": "DataAnalytics_1_Data_Processing 슬라이드8·11, WA백서 04 p.34(Search Engine)", "s": "사용자의 클릭·검색·장바구니 행동 이벤트는 (가)를 통해 실시간으로 스트리밍한 뒤 Connector로 MySQL에 적재한다. 웹서버 Access 로그는 Filebeat로 수집해 Logstash에서 파싱한 다음 (나)에 인덱싱하고, Kibana로 대시보드를 구성한다. 이후 Trino로 두 저장소의 데이터를 이동 없이 조인해 분석한다.", "id": "3-7b-04"}, {"item": "3-8b", "t": "KServe", "q": "다음의 기능을 제공하는 SCP(Samsung Cloud Platform) AI&MLOps Platform의 구성 요소는 무엇입니까?", "o": ["Kubeflow Pipelines(KFP)", "KServe", "MLflow", "Container Registry", "Apache Airflow"], "a": 1, "e": "InferenceService CRD 기반의 엔드포인트 자동 생성, Predictor·Transformer·Explainer 컴포넌트, Knative 기반 Scale to Zero와 Canary 배포는 모델 서빙 컴포넌트인 KServe의 특징입니다. KFP는 ML 파이프라인을 코드로 정의·자동화하는 구성 요소입니다.", "src": "AI&ML_1_AI_n_MLOps_Platform 슬라이드4·8", "s": "- InferenceService에 모델·위치·옵션을 명세하면 REST API 엔드포인트 자동 생성\n- Predictor(추론), Transformer(전·후처리), Explainer(예측 설명) 컴포넌트 제공\n- 요청이 없으면 Pod를 0개로 줄이는 Scale to Zero 오토스케일링\n- Canary 배포(점진적 배포)와 트래픽 분산 지원", "id": "3-8b-04"}, {"item": "3-8d", "t": "MLflow·Container Registry", "q": "다음은 SCP(Samsung Cloud Platform) CloudML을 사용하는 ML팀의 모델 관리 방식에 대한 설명입니다. (가), (나)에 들어갈 내용으로 옳은 것은 무엇입니까?", "o": ["(가) Container Registry (나) MLflow", "(가) KServe (나) Container Registry", "(가) MLflow (나) Object Storage", "(가) Kubeflow Pipelines (나) KServe", "(가) MLflow (나) Container Registry"], "a": 4, "e": "파라미터·메트릭·아티팩트·소스코드 버전을 자동 기록하고 Model Registry로 Staging·Production·Archived 단계를 관리하는 것은 MLflow입니다. 모델 파일·실행 코드·환경 설정을 컨테이너 이미지로 패키징해 저장하고 태그로 버전·롤백을 관리하는 것은 Container Registry입니다.", "src": "AI&ML_2_CloudML 슬라이드4·6", "s": "ML팀은 학습 중 파라미터, 메트릭, 아티팩트, 소스코드 버전을 (가)에 자동으로 기록해 웹 UI에서 실험 결과를 비교하고, 등록한 모델을 Staging·Production·Archived 단계별로 관리한다. 운영 배포 시에는 학습된 모델 파일과 실행 코드, 환경 설정을 하나의 이미지로 패키징해 (나)에 저장함으로써 배포 환경 불일치로 인한 오류를 막고, 이미지 태그(v1, v2)를 바꿔 롤백한다.", "id": "3-8d-04"}, {"item": "4-1b", "t": "BIA·RTO", "q": "다음은 WA 안정성 백서의 재해 복구 목표 수립 절차에 대한 설명입니다. (가), (나)에 들어갈 내용으로 옳은 것은 무엇입니까?", "o": ["(가) 업무 영향 분석(BIA) (나) RTO", "(가) 업무 영향 분석(BIA) (나) RPO", "(가) 업무 연관성 분석 (나) RTO", "(가) 장애 등급 분류 (나) RPO", "(가) 재해복구 모의훈련 (나) RTO"], "a": 0, "e": "재해복구 전략 수립의 출발점은 업무 영향 분석(BIA)으로, 업무 중요도와 중단 시 손실을 평가해 복구 우선순위와 범위를 정합니다. 업무 중단 허용 시간(서비스 복구까지 허용 가능한 최대 시간)은 RTO, 업무 손실 허용 시점(허용 가능한 데이터 손실 범위)은 RPO입니다.", "src": "WA백서 03 p.1·4(업무 영향 분석, 복구 목표 수립)", "s": "재해복구 전략을 수립하려면 먼저 (가)를 수행해 주요 업무 프로세스의 중요도와 중단 시 발생할 수 있는 손실을 평가하고, 복구 우선순위와 대상 범위를 설정한다. 이후 복구 대상 업무 그룹에 대해 재해로 서비스가 중단된 경우 서비스 복구까지 허용 가능한 최대 시간인 (나)와, 허용 가능한 데이터 손실 범위를 나타내는 지표를 함께 목표로 정한다.", "id": "4-1b-05"}, {"item": "4-1a", "t": "Backup 스케줄", "q": "D사는 Virtual Server로 운영 중인 업무 서버를 매일 자동으로 백업하려고 합니다. 백업본은 1개월 동안 보관해야 하며, 백업 용량을 줄이기 위해 전체 백업은 주 1회만 수행하고 나머지 날에는 변경분만 백업하려고 합니다. 별도 스크립트 운영 없이 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["Backup 서비스를 생성해 보관 기간을 1개월로 선택하고, 용량 절감을 위해 Incremental Backup 7개만 스케줄로 등록한다.", "Block Storage 스냅샷을 매일 생성하는 스크립트를 cron으로 실행하고, 30일이 지난 스냅샷은 스크립트로 삭제한다.", "서버에 Backup Agent를 설치해 File System 단위 백업을 구성하고, 매일 전체 백업을 수행한다.", "Backup 서비스를 생성해 보관 기간을 1개월로 선택하고, Full Backup 1개와 Incremental Backup 6개로 스케줄을 등록한다.", "Backup 서비스에서 매일 Full Backup만 수행하도록 스케줄을 등록하고, 보관 기간을 1년으로 선택한다."], "a": 3, "e": "Virtual Server는 Backup 서비스의 Agentless 방식(VM 이미지)으로 백업하며, 보관 기간은 2주·1개월·3개월·6개월·1년 중 선택하고 스케줄은 최소 1개의 Full Backup과 최대 6개의 Incremental Backup으로 구성합니다. Incremental만으로는 스케줄을 만들 수 없고, Agent 방식은 Bare Metal Server용이며, 스크립트 방식은 동작하지만 관리 부담이 큽니다.", "src": "SCP_v2_Explore_Storage_20-24 Backup 슬라이드5·6·7, WA백서 03 p.11", "id": "4-1a-05"}, {"item": "4-2a", "t": "WAF", "q": "E사는 HTTPS로 서비스하는 쇼핑몰 웹 애플리케이션을 SCP에서 운영하고 있습니다. 최근 SQL Injection, XSS 같은 웹 공격 시도가 늘어, 24x365 보안관제를 받으며 등록한 웹 페이지 대상 공격을 탐지·대응하려고 합니다. 또한 보안 장비 장애로 웹 서비스가 중단되지 않아야 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["Support Center 서비스 요청으로 WAF를 신청해 L7 SSL Offloading 뒤에 WAF를 두고, WAF 이중화를 별도 요청한다.", "Internet Gateway를 SIGW로 변경하고 IPS를 신청해 HTTPS 웹 트래픽의 웹 공격을 탐지한다.", "DDoS Protection을 신청해 학습 기반 탐지로 SQL Injection, XSS 공격을 차단한다.", "Marketplace의 타 벤더 WAF를 Virtual Server에 설치하고 삼성SDS 보안관제를 연계한다.", "WAF를 단일 구성으로 신청하고, WAF 장애 시 Load Balancer가 WAF를 bypass하도록 설정한다."], "a": 0, "e": "WAF는 등록된 URL의 HTTP·HTTPS 트래픽을 모니터링해 Injection, XSS 등 웹 공격을 탐지·대응하며, 구축 시 Certificate Manager 인증서로 L7 SSL Offloading을 구성합니다. SCP Load Balancer와 WAF는 bypass를 지원하지 않으므로 가용성이 중요하면 WAF 이중화를 별도 요청해야 합니다. IPS는 HTTPS 관제를 제공하지 않고, DDoS Protection은 L3/L4 공격 대응이며, 타 벤더 WAF는 삼성SDS 관제 대상이 아닙니다.", "src": "SEC1_IPS_WAF_DDoS_SecuredFW_SecuredVPN_정리 2~4장", "id": "4-2a-05"}, {"item": "4-2g", "t": "Secret Vault", "q": "F사의 배치 애플리케이션은 SCP OpenAPI를 호출하기 위해 Console에서 발급받은 인증키(Access Key)를 설정 파일에 그대로 저장해 사용합니다. F사는 키 유출 피해를 줄이기 위해 애플리케이션이 수명이 짧은 키로 SCP 자원에 접근하고, 그 키가 주기적으로 자동 교체되며, 지정된 서버 IP에서만 사용되게 하려고 합니다. 다음 중 요구 사항을 구현하기 위한 최선의 방안은 무엇입니까?", "o": ["인증키를 Secrets Manager의 Secret으로 저장하고, 애플리케이션이 실행 시 Secret을 조회해 사용하게 한다.", "KMS 키로 인증키를 암호화해 설정 파일에 저장하고, KMS 키 자동 회전 주기를 1일로 설정한다.", "Secret Vault를 생성해 애플리케이션에 Token을 설정하고, Token으로 발급받은 OpenAPI 임시키를 쓰며 접근 허용 IP를 지정한다.", "Secret Vault를 생성하되, 교체 빈도를 줄이기 위해 임시키 사용 기간을 7일로 설정한다.", "인증키 유효 기간을 영구로 바꾸고, 인증키 관리의 접근 허용 IP에 배치 서버 IP만 등록한다."], "a": 2, "e": "Secret Vault는 인증키로 Token을 발급받고 Token으로 OpenAPI 임시키를 발급하며, 임시키를 수명주기에 따라 자동 교체(최대 36시간)하고 IP 기반 접근제어를 제공합니다. Secrets Manager나 KMS는 키를 안전하게 저장·암호화할 뿐 장기 인증키 자체를 짧은 수명 키로 바꾸지 못하고, 임시키 사용 기간은 최대 1.5일(36시간)까지만 설정할 수 있습니다.", "src": "SEC4_KMS_SecretVault_SecretsManager 슬라이드23·24·25·27", "id": "4-2g-04"}, {"item": "4-2f", "t": "Key Management Service", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 Security 서비스는 무엇입니까?", "o": ["Secrets Manager", "Secret Vault", "Key Management Service", "Certificate Manager", "Config Inspection"], "a": 2, "e": "마스터 키로 데이터 키를 생성하고, 용도별 키 생성과 1~730일 자동 회전(미입력 시 90일), 삭제 요청 시 즉시 사용 중지 후 72시간 뒤 영구 삭제를 제공하는 것은 Key Management Service입니다. Secrets Manager는 KMS 키로 Secret을 암호화해 저장하는 서비스입니다.", "src": "SEC4_KMS_SecretVault_SecretsManager 슬라이드7·8·10", "s": "- 마스터 키를 활용해 실제 데이터를 암호화하는 데이터 키 생성\n- 대칭 키(AES), HMAC, RSA, ECDSA 등 용도별 키 생성\n- 1~730일 범위의 자동 회전 주기 설정(미입력 시 90일)\n- 삭제 요청 시 즉시 사용 중지, 72시간 후 영구 삭제", "id": "4-2f-05"}, {"item": "4-2i", "t": "Config Inspection", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 Security 서비스는 무엇입니까?", "o": ["SingleID", "Config Inspection", "FPMS", "Logging&Audit", "Certificate Manager"], "a": 1, "e": "클라우드 Console 보안 설정 취약점을 Best Practice 체크리스트로 진단하고 Report·대시보드를 제공하며, AWS·Azure 콘솔도 진단 대상으로 등록할 수 있는 서비스는 Config Inspection입니다. FPMS는 방화벽 정책 운영 자동화, Logging&Audit은 사용자 활동 내역 기록 서비스입니다.", "src": "SEC3_Certificate_Manager_Config_Inspection_정리 2장", "s": "- SCP뿐 아니라 AWS, Azure 콘솔을 진단 대상으로 등록\n- Networking·Database·Logging 등 영역별 Best Practice로 Console 보안 설정 점검\n- 진단 결과 목록·상세·항목별 Report와 대시보드 제공\n- 진단 횟수 과금(일반) 또는 정액(월정액) 요금제", "id": "4-2i-04"}, {"item": "4-3d", "t": "Log Transmission", "q": "다음의 기능을 제공하는 Samsung Cloud Platform의 Security 서비스는 무엇입니까?", "o": ["Log Transmission", "FPMS", "Logging&Audit", "Cloud Monitoring", "SSL Visibility"], "a": 0, "e": "방화벽·IPS·DDoS 보안장비의 로그를 실시간 수집·저장하고 필터링해 VPN 등으로 고객 연동 장비에 전송하며, 약정 대역폭 기준 월 요금이 적용되는 서비스는 Log Transmission입니다. FPMS는 방화벽 정책 관리 자동화 서비스입니다.", "src": "SEC5_LogTransmission_FPMS_ESS 슬라이드10·11·12", "s": "- 방화벽, IPS, DDoS 보안장비로부터 실시간으로 로그를 수집·저장\n- 불필요한 로그를 필터링하고 고객이 요청한 로그만 추출\n- 이중화된 저장소에 보관하고 VPN 등을 통해 고객의 로그 연동 장비로 전송\n- 약정 대역폭(100 Mbps~1 Gbps)에 따른 월 단위 요금", "id": "4-3d-04"}, {"item": "4-3b", "t": "이력·버전 관리(서비스 횡단)", "q": "다음 중 SCP(Samsung Cloud Platform) 서비스의 활동·작업 이력 관리에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Logging&Audit의 활동 내역 목록은 JSON 또는 CSV 파일로 다운로드할 수 있다.", "Logging&Audit의 활동 내역 목록에서 작업 이력을 최대 5개까지 선택해 비교할 수 있다.", "Secrets Manager는 Secret 버전에 레이블을 설정할 수 있고, 버전이 100개를 넘으면 가장 오래된 버전부터 삭제된다.", "Logging&Audit 활동 내역은 작업자 정보로 필터링할 수 없어, 작업자별 이력은 Trail 로그 파일을 받아 확인해야 한다.", "KMS의 키 작업 이력에서는 작업 일시, 작업 내역 및 결과, 작업 계정을 확인할 수 있다."], "a": 3, "e": "Logging&Audit 활동 내역 목록은 서비스, 자원 유형, 자원명, 작업 결과와 함께 작업자 정보로도 필터링해 검색할 수 있습니다. 나머지는 Logging&Audit의 다운로드·비교 기능, Secrets Manager의 레이블 기반 버전 관리 제약, KMS 키 작업 이력 기능에 대한 올바른 설명입니다.", "src": "ExploreManagement_2_Logging_Monitoring 슬라이드9·11·12, SEC4_KMS_SecretVault_SecretsManager 슬라이드7·34·45", "id": "4-3b-05"}, {"item": "4-2h", "t": "Security 서비스 생성·해지(서비스 횡단)", "q": "다음 중 SCP(Samsung Cloud Platform) Security 서비스의 생성·관리·해지에 대한 설명으로 옳지 않은 것은 무엇입니까?", "o": ["Certificate Manager는 연결된 Load Balancer Listener가 있으면 해지할 수 없으므로 Listener 연결을 먼저 해지한다.", "KMS 키 삭제를 요청하면 해당 키는 즉시 사용이 중지되고, 72시간 후 영구 삭제된다.", "Secrets Manager의 Secret값은 Console에서 비밀번호를 다시 입력해야 확인·수정할 수 있다.", "SingleID 생성 시 ADM이나 CAM을 선택하면 AM, IM, MFA가 자동으로 함께 선택된다.", "SingleID는 Tenant명과 Tenant 코드만 입력하면 멤버를 지정하지 않아도 생성되며, 멤버는 생성 후 추가한다."], "a": 4, "e": "SingleID를 생성할 때는 Tenant명과 Tenant 코드를 입력하고, 사용자 목록에서 1명 이상의 멤버를 선택해야 생성할 수 있습니다. Certificate Manager의 Listener 선해지, KMS 키 삭제 후 72시간 영구 삭제, Secrets Manager의 비밀번호 확인 후 Secret값 확인, ADM·CAM 선택 시 AM·IM·MFA 자동 선택은 모두 교재 내용과 같습니다.", "src": "SEC2_SingleID_정리 3장, SEC3_Certificate_Manager_Config_Inspection_정리 1장, SEC4_KMS_SecretVault_SecretsManager 슬라이드7·43", "id": "4-2h-05"}]</script>
<script type="application/json" id="gichul">[{"item": "4-2d", "t": "기출", "q": "Certificate Manager는 인증 기관(CA)에서 발급한 SSL/TLS 인증서의 등록과 관리를 위한 서비스입니다.\n다음 중 인증서 신청, 삭제, 유효성 확인에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["Certificate body에 Public Key Certificate 정보를 입력한다.", "운영' 용도 선택 시 인증서 유효성 체크를 클릭하지 않으면 다음 단계로 진행할 수 없다.", "Public Key Certificate는 Client에서 생성한 대칭 키를 암호화하는 데 사용된다.", "‘개발’ 용도를 선택 시 인증서 유효성 체크 없이 다음 단계로 진행할 수 있다.", "Private Key는 Client에서 전달한 랜덤 대칭 암호화 키를 복호화하는 데 사용된다."], "a": 3, "e": "(추정) 교재(SEC3)는 인증서 유효성 검증을 필수 항목으로 둡니다. 그래서 '개발' 용도면 유효성 체크 없이 진행할 수 있다는 설명이 틀린 것으로 봅니다. 공개키로 대칭키를 암호화하고 Private Key로 복호화하는 설명은 TLS 원리 그대로입니다.", "src": "기출 모의시험", "fix": true, "id": "G-01"}, {"item": "3-2a", "t": "기출", "q": "A 고객은 SCP(Samsung Cloud Platform)의 Virtual Server를 사용하고 있습니다. A 고객의 아래 요구사항을 만족하기 위한 Virtual Server의 기능으로 알맞게 연결된 보기를 고르시오.\n\nⓐ 특정 호스트 서버의 장애로 인한 서비스 중단 방지\nⓑ 특정 랙(Rack) 의 장애로 인한 서비스 중단 방지", "o": ["ⓐ - Auto-Scaling ⓑ - Anti-affinity", "ⓐ - Placement Group ⓑ - Multi-AZ", "ⓐ - Anti-affinity ⓑ - Placement Group", "ⓐ - Auto-Scaling ⓑ - Placement Group", "ⓐ - Bare Metal ⓑ - Anti-affinity"], "a": 2, "e": "호스트 장애는 VM을 서로 다른 호스트에 흩어 두는 Anti-Affinity(Server Group)로, 랙 장애는 서버를 다른 랙에 나눠 두는 Placement Group으로 대비합니다. Auto-Scaling은 서버 수를 늘리고 줄이는 기능이지 분산 배치 기능이 아닙니다.", "src": "기출 모의시험", "fix": true, "id": "G-02"}, {"item": "3-7d", "t": "기출", "q": "A항공사는 SCP(Samsung Cloud Platform)에서 제공하는 Data Analytics 서비스를 활용하여 실시간 Data Streaming 서비스가 가능한 아키텍처를 구성하고자 합니다. 아키텍처 구성에 대한 설명으로 옳지 않은 것은 다움 중 무엇입니까?", "o": ["오픈소스 기반의Messaging 솔루션인 Event Streams를 이용하여, Data Source로부터 수집된 Data를 Data connector를 통해 연결하여, 다양한 서비스에 제공 및 활용이 가능하다.", "Data Flow를 활용하여 반복적으로 발생하는 데이터 처리 작업에 대해 오픈소스 Apache Airflow 기반 워크플로우를 작성하고, 작업 스케줄링을 자동화한다.", "저비용으로 확장(Scale- Out)이 가능한 Object Storage 서비스를 활용하여 안정적인 저장소를 구성한다.", "Search Engine 서비스를 활용하여 다양한 형식의 로그 및 Metric을 수집, 저장, 검색하고, Kibana를 통해 실시간으로 데이터를 분석하고 시각화한다.", "대용량의 정형 데이터를 분석하기 위한 DBaaS 서비스로 Vertica(DBaaS)서비스를 활용한다."], "a": 1, "e": "Apache Airflow 기반으로 반복 작업 워크플로우를 작성하고 스케줄링을 자동화하는 서비스는 Data Ops입니다. Data Flow는 NiFi 기반으로 데이터 흐름을 시각적으로 설계하는 도구입니다.", "src": "기출 모의시험", "fix": true, "id": "G-03"}, {"item": "3-2e", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 Cloud Functions에 대한 설명 중 옳지 않은 것을 고르세요.", "o": ["서버를 직접 관리할 필요 없이 개발 환경을 손쉽게 구축할 수 있다.", "Python, Node.js, PHP, Go 등 다양한 개발 언어 선택 가능하다.", "Cloud Functions에서 생성한 Function은 API Gateway에서 직접 등록하여 연계가 가능하다.", "Cloud Functions으로 개발한 단위 Function은 구동하기 위한 최대 Memory 및 구동 시간에 대한 제한이 존재한다.", "Cloud Functions에서 개발한 애플리케이션의 상태값 저장 및 전달이 가능하다."], "a": 4, "e": "Cloud Functions는 서버리스 함수라 실행이 끝나면 상태를 기억하지 않습니다(Stateless). 상태값은 DB나 Object Storage 같은 외부 저장소에 따로 저장해야 합니다.", "src": "기출 모의시험", "fix": true, "id": "G-04"}, {"item": "3-8d", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 CloudML은 MLOps 파이프라인을 기반으로 AI 모델 라이프사이클을 관리하는 머신러닝 플랫폼입니다. CloudML 서비스에 대한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["사용자가 코드를 직접 작성하여 데이터 분석 및 머신러닝 파이프라인을 구축하는 Pro Code (또는 Code-First) 분석 툴 및 개발 환경이다.", "SCP Container Registry 연계를 통해 공동 분석 환경을 즉시 구성하여 협업 개발을 손쉽게 수행할 수 있다.", "Jupyter Notebook과 Workflow Modeler를 스텝(Step)으로 등록 가능한 파이프라인을 제공한다.", "자연어 질의를 기반으로 코드를 자동 생성하고, 사용자 맞춤형 워크플로우 함수를 추천하여 생산성과 효율성을 극대화한다.", "내장형 LLM(Large Language Model)을 제공하여 외부 LLM 연계 없이 간편하게 Copilot 사용이 가능하다."], "a": 0, "e": "(추정) 삼성SDS 공식 페이지는 CloudML을 'No-Code AI 분석 및 머신러닝 플랫폼'으로 소개합니다. 코드를 직접 작성하는 Pro Code(Code-First) 툴이라는 설명이 반대입니다.", "src": "기출 모의시험", "fix": true, "id": "G-05"}, {"item": "3-7e", "t": "기출", "q": "결제대행 서비스를 제공하는 L인포매틱스는 금융결제 데이터를 분석하기 위해 대량의 데이터를 통합하여 작업할 수 있는 Data Warehouse 기능이 필요합니다. L인포매틱스의 요구에 적합한 데이터 처리유형과 그에 맞는 SCP(Samsung Cloud Platform)의 서비스를 올바르게 연결한 것은 다음 중 무엇입니까?", "o": ["OLAP - Vertica(DBaaS)", "OLAP - Microsoft SQL Server(DBaaS)", "OLTP - MariaDB(DBaaS)", "OLTP - EPAS(DBaaS)", "NoSQL - CacheStore(DBaaS)"], "a": 0, "e": "대량 데이터를 통합해 분석하는 Data Warehouse는 OLAP 유형이고, SCP에서는 컬럼 기반 MPP DB인 Vertica(DBaaS)가 맞습니다. MariaDB, EPAS, MS SQL은 주로 OLTP, CacheStore는 캐시용 NoSQL입니다.", "src": "기출 모의시험", "fix": true, "id": "G-06"}, {"item": "4-2f", "t": "기출", "q": "KMS(Key Management Service)는 암호화 키의 보안을 위해 주기적으로 키 회전을 실행하고,사용 권한 및 접근 권한을 관리할 수 있는 서비스입니다.\n다음 KMS 활용에 대한 설명 중 옳지 않은 것은 무엇인가요?", "o": ["회전주기는 최소 1일, 최대 2년이고 기본 설정값은 90일이다.", "어카운트 관리자 권한이 없으면 KMS 키 권한을 가질 수 없다.", "자동회전으로 키의 새로운 버전을 자동으로 생성할 수 있다.", "키가 회전할 때마다 자동으로 버전이 1씩 증가한다.", "키 회전으로 키 버전이 변경된 경우라도 이전 키를 복호화에 쓸 수 있다."], "a": 1, "e": "KMS 키 권한은 IAM 정책으로 필요한 사용자에게 부여할 수 있어서, 관리자 권한이 없어도 KMS 권한을 가질 수 있습니다. 회전 주기 1~730일(기본 90일), 회전 시 버전 1씩 증가, 이전 버전으로 복호화 가능은 모두 맞는 설명입니다.", "src": "기출 모의시험", "fix": true, "id": "G-07"}, {"item": "2-1a", "t": "기출", "q": "A 기업은 사내 VMware 가상화 서버에서 운영하고 있는 3개의 정보 시스템을 SCP(Samsung Cloud Platform)로 이전할 것을 계획하고 있습니다. 비용관점에서 올바른 것을 고르세요.", "o": ["3개 정보 시스템을 1개의 VPC에 구성하는 것보다, 3개의 VPC로 나누어 배치하고, 정보 시스템 간에는 Internet Gateway를 통해 연결하는 것이, 통신 비용을 더 절감할 수 있다.", "Virtual Server 요금은 할당 자원의 크기에 따라 결정되며, 사용 OS와는 무관하다.", "Virtual Server Auto-Scaling 적용시 Virtual Server 요금 이외, Auto-Scaling 사용 시간에 따른 요금이 별도 부과된다.", "Security Group은 무료이므로, Virtual Server에 적용하여 보안을 강화할 수 있다.", "Database 서비스는 DBMS의 라이선스 요금을 포함하여 사용료가 청구된다."], "a": 3, "e": "(추정) Security Group은 무료라 비용 부담 없이 Virtual Server 보안을 강화할 수 있습니다. Virtual Server 요금은 OS 라이선스에 따라 다르고, Auto-Scaling 자체는 별도 요금이 없으며, VPC를 나눠 Internet Gateway로 연결하면 오히려 비용과 보안 위험이 커집니다.", "src": "기출 모의시험", "fix": true, "id": "G-08"}, {"item": "3-3b", "t": "기출", "q": "K8s(Kubernetes) 아키텍처에서 노드를 제어하는 핵심 프로세스들의 집합이며,\n클러스터의 모든 작업 할당과 관리가 시작되는 중앙 제어 영역을 지칭하는 용어는 무엇인가요?", "o": ["Cluster", "Control plane", "Container", "Kubelet", "Pod"], "a": 1, "e": "노드를 제어하는 핵심 프로세스(API Server, etcd, Scheduler, Controller Manager)의 집합이자 클러스터의 중앙 제어 영역은 Control Plane입니다. kubelet은 각 Worker Node에서 Pod를 관리하는 에이전트입니다.", "src": "기출 모의시험", "fix": true, "id": "G-09"}, {"item": "2-2c", "t": "기출", "q": "한 공공기관이 다음 요구사항을 고려하여 Samsung Cloud Platform(SCP)활용을 검토하고 있습니다. 요구사항에 가장 적합한 서비스 또는 오퍼링이 무엇입니까?\n\n• 고객 전용 인프라에 고객사가 단독으로 사용하는 클라우드를 구성\n• 삼성SDS 데이터센터에 관리자원 구성\n• 삼성SDS 데이터센터와 고객 데이터센터간 전용선 연결\n• 삼성SDS 데이터센터 내 자원과 Hybrid 구성 가능\n• 최소 사용 규모는 300vCore", "o": ["SCP Sovereign", "Private Zone", "Dedicated Cloud", "HPC", "Edge Server"], "a": 2, "e": "고객 전용 인프라, 삼성SDS 데이터센터의 관리 자원, 전용선 연결, Hybrid 구성, 최소 300vCore는 Dedicated Cloud의 특징입니다.", "src": "기출 모의시험", "fix": true, "id": "G-10"}, {"item": "3-4c", "t": "기출", "q": "A 고객사는 비정형 데이터를 활용하여 분석하는 서비스를 개발 중입니다. 비정형 데이터의 특성상 확장성이 용이하고, 개발의 생산성을 위해 URL을 통해 쉽게 Access할 수 있는 스토리지가 필요합니다. 이러한 워크로드를 위한 적절한 Storage 서비스는 무엇인가요?", "o": ["Block Storage", "File Storage", "Object Storage", "Archive Storage", "Backup"], "a": 2, "e": "비정형 데이터를 저장하고, 확장이 쉽고, URL로 접근하는 스토리지는 Object Storage입니다.", "src": "기출 모의시험", "fix": true, "id": "G-11"}, {"item": "3-5a", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 DBaaS 중 BYOL 옵션을 사용 할 수 있는 서비스는 다음 중 무엇입니까?\n\n※ 참고용어 BYOL : Bring Your Own License", "o": ["PostgreSQL(DBaaS) - MariaDB(DBaaS) - MySQL(DBaaS)", "Microsoft SQL Server(DBaaS) - Vertica(DBaaS) - MariaDB (DBaaS)", "Microsoft SQL Server(DBaaS) - EPAS(DBaaS) - PostgreSQL(DBaaS)", "Microsoft SQL Server(DBaaS) - Vertica(DBaaS) - PostgreSQL (DBaaS)", "Microsoft SQL Server(DBaaS) - Vertica(DBaaS) - EPAS(DBaaS)"], "a": 4, "e": "상용 라이선스 DB인 Microsoft SQL Server, Vertica, EPAS가 BYOL 대상입니다. PostgreSQL, MySQL, MariaDB 같은 오픈소스 DB는 라이선스 비용이 없어 BYOL과 관계가 없습니다.", "src": "기출 모의시험", "fix": true, "id": "G-12"}, {"item": "3-7b", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 Data Analytics 서비스에 대한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["Data Ops는 주기적, 반복적으로 발생하는 데이터 처리 작업에 대해 워크플로우를 작성하고 작업 스케줄링을 자동화하는 Apache Airflow 기반의 서비스이다.", "Data Flow는 다양한 데이터 소스로부터 대용량의 데이터를 추출하고, 스트림/배치 데이터의 변환/전송에 대한 처리 흐름을 시각적으로 작성하는 데이터 처리 흐름 도구이다.", "Search Engine은 머신러닝 데이터 분석을 위한 Elasticsearch와 대규모 검색을 위한 OpenSearch를 자동화된 구성과 환경으로 제공한다.", "Quick Query는 대용량 데이터를 표준 SQL을 사용하여 간편하게 분석할 수 있는 대화형 쿼리 서비스이다.", "Event Streams는 대용량, 대규모 메시지 데이터 처리를 위한 Kafka를 BYOL 기반의 자동화 된 구성과 환경으로 제공한다."], "a": 4, "e": "(추정) Event Streams는 오픈소스 Apache Kafka를 자동화된 구성으로 제공하는 서비스라 BYOL 기반이 아닙니다. Search Engine의 Elasticsearch·OpenSearch 용도 설명도 의심스럽지만 공식 문구를 확인하지 못했습니다.", "src": "기출 모의시험", "fix": true, "id": "G-13"}, {"item": "3-2h", "t": "기출", "q": "SCP(Samsung Cloud Platform) Edge Server(CPU)의 클라우드 배포 유형으로 올바른 것을 고르세요.", "o": ["퍼블릭 클라우드(Public Cloud)", "프라이빗 클라우드(Private Cloud)", "하이브리드 클라우드(Hybrid Cloud)", "멀티 클라우드(Multi Cloud)", "커뮤니티 클라우드(Comunity Cloud)"], "a": 2, "e": "Edge Server는 고객 현장(온프레미스)에 서버를 두고 SCP의 Edge Manager가 원격 관리하는 구조라, 온프레미스와 클라우드를 묶는 하이브리드 클라우드입니다.", "src": "기출 모의시험", "fix": true, "id": "G-14"}, {"item": "1-2b", "t": "기출", "q": "고객은 SCP(Samsung Cloud Platform)에 운영하는 정보 시스템의 중단이 발생했을 때 1시간 이내에 대응이 되기를 희망합니다. 이 고객의 월 예상 사용요금을 6억이라고 하였을 때, 이러한 수준의 기술지원을 받기 위한 Support Plan의 요금은 얼마입니까?", "o": ["무료", "60백만원", "46백만원", "42백만원", "30백만원"], "a": 2, "e": "1시간 이내 대응이 필요하면 유료 Proserv Plan입니다. 요금은 구간별 누진이라 2억×10% + 3억×7% + 1억×5% = 4,600만 원입니다. 6억 전체에 5%(30백만원)나 7%(42백만원)를 곱하면 함정 보기에 걸립니다. 요금표는 교재에 없습니다.", "src": "기출 모의시험", "fix": true, "id": "G-15"}, {"item": "4-1a", "t": "기출", "q": "SCP(Samsung Cloud Platform) 클라우드 환경에서 데이터 장애와 재해에 대비하기 위한 아키텍처 구성을 설명한 것 중 적절하지 않은 것은 무엇인가요?", "o": ["백업 파일은 2주(14일)~1년(365일) 범위에서 보관 기간을 지정할 수 있으며, 백업 스케줄은 매일·매주·매월 단위로 설정 가능하다.", "Primary 데이터베이스의 비동기 복제(Async Replication)를 통해 읽기 전용 데이터베이스를 구성할 수 있다.", "하나의 Primary 데이터베이스당 최대 5대의 읽기 전용 복제본을 구성할 수 있다.", "Virtual Server를 동일 VPC 또는 다른 VPC로  마이그레이션할 수 있다.", "데이터베이스 백업은 이중 복제 구조로 되어 있어 데이터 손실 시 항상 완전 복구가 가능하다."], "a": 4, "e": "백업은 마지막 백업 시점 이후의 데이터를 잃을 수 있습니다(RPO). '항상 완전 복구' 같은 절대 표현은 오답 신호입니다.", "src": "기출 모의시험", "fix": true, "id": "G-16"}, {"item": "3-9b", "t": "기출", "q": "DevOps Service 서비스에서 조직 구성원 관리, 프로젝트 그룹 및 프로젝트 생성, K8s(Kubernetes) 클러스터 연동 등 통합적인 DevOps 환경 구성과 관리를 위해 제공되는 도구는 무엇인가요?", "o": ["Release Management", "Source Repository", "DevOps Console", "Artifact Repository", "Kubernetes Engine"], "a": 2, "e": "DevOps Console은 Tenant를 만들면 접속하는 통합 관리 화면으로, 조직 구성원·프로젝트 그룹·프로젝트 생성과 K8s 클러스터(배포 타겟) 연동을 모두 여기서 합니다.", "src": "기출 모의시험", "fix": true, "id": "G-17"}, {"item": "3-5b", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 MySQL(DBaaS) 서비스를 통하여 데이터베이스를 생성할 때, 사용자가 선택 또는 지정할 수 없는 항목은 다음 중 무엇입니까?", "o": ["기본 OS 볼륨 크기", "Database 이미지 및 버전", "IP주소", "Database Port 번호", "백업 정책"], "a": 0, "e": "(추정) DBaaS 생성 화면에서 이미지·버전, IP(네트워크), 포트, 백업 정책은 사용자가 고릅니다. OS 영역 볼륨은 서비스가 정해 주므로 기본 OS 볼륨 크기는 지정할 수 없는 항목으로 봅니다.", "src": "기출 모의시험", "fix": true, "id": "G-18"}, {"item": "3-1q", "t": "기출", "q": "제조사 A는 SCP(Samsung Cloud Platform)를 이용 중이며, 회사 사업장과 SCP 간 네트워크를 연결하여 SCP의 다양한 서비스를 활용하고자 합니다. 이때, 필요한 SCP Networking 서비스 중 적합한 것은 무엇인가요?", "o": ["Cloud WAN", "Cloud Last Mile", "Cloud LAN-Data Center", "Cloud Secured SD-LAN (구 Cloud LAN-Campus)", "Private 5G Cloud"], "a": 1, "e": "회사 사업장과 SCP 리전 사이 회선과 장비를 패키지로 제공하는 서비스는 Cloud Last Mile입니다. Secured SD-LAN은 사업장 내부망, Cloud WAN은 거점 간 WAN입니다.", "src": "기출 모의시험", "fix": true, "id": "G-19"}, {"item": "3-4c", "t": "기출", "q": "문화재를 관리하는 B 정부기관은 최근 홈페이지의 성능 저하 문제를 해결하기 위해 홈페이지를 클라우드로 이전하는 방안을 검토하고 있습니다.\n\n현재 홈페이지의 웹 서버 디스크에는 약 6,000건의 연구보고서와 백서 등 대용량 간행물이 저장되어 있습니다. 최근 해당 자료의 다운로드 요청이 증가하면서 웹 서버의 부하가 높아졌고, 이로 인해 홈페이지 전체의 응답 속도가 저하되는 문제가 발생하고 있습니다.\n\n이러한 요구사항을 고려할 때, B 정부기관에 제안할 수 있는 SCP(Samsung Cloud Platform)의 가장 비용 효율적인 아키텍처는 무엇입니까?", "o": ["SCP는 Object Storage를 제공하고 있으며, 문서를 이 곳에 저장하면 웹서버 성능 부담을 최소화하며, 문서를 즉시 액세스 가능하고  안정성도 동시에 확보할 수 있다.", "SCP는 전세계 여러 위치에 데이터센터를 운영하고 있으며, 이 여러 데이터센터에 웹서버를 구성하면 서버 부하를 분산할 수 있다.", "SCP는 Virtual Server Auto-Scaling을 제공하고 있다. 사용자의 요청이 증가하면 서버를 추가로 생성하여 여러 서버에서 다운로드 받게하여 응답 속도 저하를 방지할 수 있다.", "SCP는 CacheStore(DBaaS)를 제공하고 있으며, 사용자가 자주 다운로드 받는 콘텐츠를 캐싱하여 지연속도를 줄여 준다.", "SCP는 Database Service에서 Read Replica를 구현할 수 있다. Replica를 사용하면 읽기 부하를 별도로 분리하여 처리할 수 있다."], "a": 0, "e": "대용량 간행물을 Object Storage로 옮기면 다운로드 트래픽이 웹 서버를 거치지 않아 부하가 빠지고, 비용도 가장 적게 듭니다. Auto-Scaling은 서버가 늘어나는 만큼 비용이 커지고, CacheStore·Read Replica는 DB용 기능입니다.", "src": "기출 모의시험", "fix": true, "id": "G-20"}, {"item": "4-3d", "t": "기출", "q": "다음 중 Log Transmission 이용하여 로그를 수집/저장할 수 있는 서비스는 무엇입니까?", "o": ["Virtual Server", "IPS", "Security Group", "NAT", "Load Balancer"], "a": 1, "e": "Log Transmission은 방화벽, IPS, DDoS 대응 장비 같은 보안장비의 로그를 실시간으로 수집해 전송합니다. Security Group·NAT 등의 로그는 Network Logging으로 Object Storage에 저장합니다.", "src": "기출 모의시험", "fix": true, "id": "G-21"}, {"item": "3-8b", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 AI&MLOps Platform 서비스에 대한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["Kubernetes 기반의 AI/MLOps 환경을 제공하며, 학습 데이터와 모델, 운영 데이터의 통합적인 관리가 가능한 머신러닝 플랫폼이다.", "오픈소스 Machine Learning Toolkit인 Kubeflow를 활용하며, Kubeflow Mini 버전은 오픈소스 설치, AI&MLOps Platform 버전은 오픈소스 설치와 Add-on 기능을 포함하여 제공한다.", "Bare Metal Server 기반의 Multi Node GPU 및 GPU Direct RDMA(Remote Direct Memory Access)를 통해 LLM(Large Language Model)과 자연어처리(NLP)의 Job 속도를 획기적으로 개선할 수 있다.", "AI&MLOps Platform 서비스는 Kubeflow Mini 버전과 AI&MLOps Platform 버전 중 선택한 요금과 vCore당 라이선스 요금의 합으로 시간단위 과금하며, 서비스 구성을 위한 선행 서비스(Kubernetes Engine, Virtual Server, Storage 등)는 과금되지 않는다.", "TensorFlow, PyTorch, scikit-learn, Keras 등 다양한 머신러닝 프레임워크를 지원하는 표준화된 환경을 제공하여 모델 구성 및 생성이 쉽고 재사용이 용이하다."], "a": 3, "e": "AI&MLOps Platform 요금과 별도로, 서비스 구성을 위한 Kubernetes Engine, Virtual Server, Storage 같은 선행 서비스는 각각 과금됩니다.", "src": "기출 모의시험", "fix": true, "id": "G-22"}, {"item": "3-1s", "t": "기출", "q": "다음 중 SASE(Secure Access Service Edge) 서비스의 사용 사례에 해당하지 않는 것은 무엇입니까?", "o": ["네트워크 관리자는 클라우드, 온프레미스, Edge 장비에 대한 네트워크 및 보안 정책을 통합해서 일관된 정책으로 보안 기능을 관리할 수 있다.", "영업 사원은 자신의 노트북 컴퓨터를 가지고 전국 사무실 어디에서 근무하더라도 별도의 네트워크 접속 신청없이 사무실 네트워크에 접속할 수 있다.", "보안 관리자는 물리 네트워크의 방화벽, VPN 장비에 각각 접속하여 최신의 클라우드, 모바일 네트워크 환경을 반영하는 보안 정책을 수시로 적용한다.", "재택 근무자가 사내 데이터센터의 애플리케이션과 SaaS 애플리케이션에 손쉽게 연결하여 업무를 수행할 수 있도록 통합 보안을 구현한다.", "SD-WAN을 이용해서 최적의 경로로 애플리케이션에 접근하게 해서 사용자의 경험을 향상시킨다."], "a": 2, "e": "SASE는 네트워크와 보안 정책을 클라우드에서 한곳으로 통합 관리하는 구조입니다. 물리 방화벽·VPN 장비에 각각 접속해 정책을 넣는 것은 SASE가 없애려는 방식입니다.", "src": "기출 모의시험", "fix": true, "id": "G-23"}, {"item": "4-2b", "t": "기출", "q": "Samsung Cloud Platform에서 정보시스템을 구축하려고 계획 중인 담당자는 네트워크/보안 서비스 중 Firewall 과 Secured Firewall의 차이점을 궁금해 합니다. 다음의 설명 중 맞는 내용을 고르십시오.", "o": ["Firewall 과 Secured Firewall 모두 무료이다.", "Firewall과 Secured Firewall 모두 VPC 내부에 위치한다.", "국가 보안적합성 검증이 필요한 경우, 네트워크 보안 강화를 위한 차세대 방화벽 상품인 Secured Firewall을 선택한다.", "Firewall은 OSI 4 layer에서 작동하고 Secured Firewall은 OSI 7 layer에서 작동한다.", "Firewall과 Secured Firewall 모두 사용자가 직접 설치와 삭제를 자유롭게 수행할 수 있다."], "a": 2, "e": "국가 보안적합성 검증이 필요하면 관제형 차세대 방화벽인 Secured Firewall을 선택합니다. Secured Firewall은 유료이고 서비스 요청으로 만들기 때문에 '둘 다 무료', '둘 다 사용자가 자유롭게 설치·삭제'는 틀립니다.", "src": "기출 모의시험", "fix": true, "id": "G-24"}, {"item": "3-7a", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 솔루션 아키텍트는 글로벌 모빌리티 기업의 '실시간 커넥티드 카 서비스' 구축을 위한 아키텍처 검토 회의를 준비하고 있습니다. 이 기업은 수백만 대의 차량으로부터 주행 상태, 도로 통제, 기상 정보 등 차량 및 주변 데이터를 실시간으로 수집·분석하여, 차량 디스플레이(AVN)와 모바일 앱에 '초개인화된 다이내믹 다이렉션(Dynamic Direction)' 기능을 제공하고자 합니다. 고객사 솔루션 아키텍트와의 회의에서 제안할 아키텍처 구성 요소 중, 기능적 연관성과 실시간 연산 관점에서 우선순위가 가장 낮은 것은 무엇입니까?", "o": ["SCP의 API Gateway와 Queue Service를 연계하여 차량 및 앱의 API 요청을 중계하고 메시지를 임시 버퍼링하는 방식만으로, 별도의 실시간 스트리밍 처리 및 경로 연산 엔진 없이 다이내믹 다이렉션 서비스를 구성한다.", "SCP의 Event Streams를 도입하여 수백만 대의 커넥티드 카에서 동시다발적으로 발생하는 대규모 텔레메트리(Telemetry) 스트리밍 데이터를 누락 없이 안정적으로 수집한다.", "SCP의 Object Storage를 활용하여 차량으로부터 수집된 비정형 센서 데이터 및 로그를 비용 효율적으로 저장하는 데이터 레이크(Data Lake)를 구축한다.", "SCP의 Search Engine을 활용하여 교통 이벤트, 도로 통제 정보, 위치 기반 로그를 빠르게 검색·조회할 수 있는 인덱싱 환경을 구축한다.", "SCP의 Quick Query를 사용하여 축적된 대규모 주행 데이터셋을 표준 SQL 기반으로 신속하게 조회하고, 향후 AI 기반 경로 예측 모델 고도화를 위한 분석 인프라를 마련한다."], "a": 0, "e": "수백만 대 차량의 실시간 텔레메트리 처리에는 Event Streams(수집), Object Storage(데이터 레이크), Search Engine(검색), Quick Query(분석)가 필요합니다. API Gateway와 Queue로 메시지만 버퍼링하고 실시간 연산 엔진이 없는 구성은 요구사항을 못 맞추므로 우선순위가 가장 낮습니다.", "src": "기출 모의시험", "fix": true, "id": "G-25"}, {"item": "4-1a", "t": "기출", "q": "기업의 중요한 데이터를 안전한 방식으로 백업하고 유사시 데이터를 복구하기 위한 SCP(Samsung Cloud Platform)의 Backup 서비스에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["VM, DB의 백업 데이터는 Object Storage에 저장된다.", "DB 전체 복구 또는 DB 테이블 단위 복구 모두 가능하다.", "Linux OS 이미지, Windows OS 이미지, NAS 이미지 스냅샷을 지원한다.", "Full Backup 보관 기간 경과 시, Full Backup과 연관된 Incremental Backup 작업이 중단된다.", "Full Backup과 Incremental Backup의 보관 기간을 개별적으로 설정할 수 있다."], "a": 4, "e": "(추정) v2 교재의 Backup 서비스는 보관 기간을 백업 하나에 하나만 지정합니다(2주~1년). 그래서 Full과 Incremental의 보관 기간을 따로 정한다는 설명이 틀린 것으로 봅니다. DB 테이블 단위 복구, NAS 스냅샷 같은 보기는 v1 시절 설명으로 보입니다.", "src": "기출 모의시험", "fix": true, "id": "G-26"}, {"item": "2-3c", "t": "기출", "q": "공공기관 B는 자체 관리하던 인프라를 SCP(Samsung Cloud Platform)으로 Migration 하기로 결정하였습니다. 기존에 활용하던 DBMS를 SCP의 DBaaS 서비스로 Migration 하기위한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["DBaaS는 자동화 기반의 서비스를 제공하며, GUI 환경을 통해 쉽고 편리하게 Database를 관리할 수 있다.", "EPAS(DBaaS), PostgreSQL(DBaaS), MariaDB(DBaaS), MySQL(DBaaS), Microsoft SQL Server(DBaaS) 등을 이용할 수 있다.", "DBaaS를 이용하면 Auto Provisioning, HA 구성, Cluster 구성을 할 수 있어 빠르고 안전하게 Database를 생성할 수 있다.", "EPAS(DBaaS)와 Microsoft SQL Server(DBaaS)는 기존 보유 라이선스 사용이 가능한 BYOL 서비스이다.", "DBaaS 이용하면 삼성 클라우드 플랫폼의 모니터링, 빌링 기능을 이용할 수 없다."], "a": 4, "e": "DBaaS로 옮기면 SCP의 모니터링과 빌링(요금 청구) 기능을 그대로 이용할 수 있습니다. EPAS와 MS SQL Server는 기존 라이선스를 가져오는 BYOL이 가능합니다.", "src": "기출 모의시험", "fix": true, "id": "G-27"}, {"item": "3-7f", "t": "기출", "q": "B전자 마케팅 부서는 다양한 형태의 고객 데이터를 활용하여 고객 경험을 개인화하려고 합니다.우선 분산된 데이터베이스(DW)에 저장된 대용량의 정형 데이터와 객체 스토리지 및 엑셀파일 형태의 방대한 비정형 데이터를 논리적으로 통합하여 처리해야 합니다. 또한, 이 데이터를 기반으로 탐색적 데이터 분석(EDA)을 수행하고, SQL을 통해 즉각적인 데이터 보정과 변환 작업을 실행하면서 고객 맞춤형 마케팅 전략을 도출하고자 합니다. B전자 마케팅 부서가 사용할 수 있는 SCP(Samsung Cloud Platform)의 서비스는 다음 중 무엇입니까?", "o": ["Event Streams", "Vertica(DBaas)", "Data Flow", "Quick Query", "Search Engine"], "a": 3, "e": "데이터를 옮기지 않고 DW·객체 스토리지·엑셀 등 여러 저장소를 표준 SQL 하나로 조회하는 Federated Query가 Quick Query(Trino 기반)의 핵심 기능입니다.", "src": "기출 모의시험", "fix": true, "id": "G-28"}, {"item": "3-5b", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 CacheStore(DBaaS)에 대한 설명으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["HA(High Availability) 구성이 가능하다.", "메모리에서 직접 데이터를 처리하는 In-memory 기반의 서비스로 백업 기능는 제공하지 않는다.", "Parameter 설정이 가능하다.", "Logging&Audit 기능을 지원한다.", "In-Memory 데이터 스토어 및 Cache Server로 활용된다."], "a": 1, "e": "CacheStore는 In-Memory 기반이지만 AOF/RDB 파일 방식의 백업을 제공하고, 백업은 Object Storage에 저장됩니다.", "src": "기출 모의시험", "fix": true, "id": "G-29"}, {"item": "3-4d", "t": "기출", "q": "제조기업 A사는 가전기기에 탑재되는 OS를 자체 개발하고 있습니다. 제품별로 개발한 OS 이미지를 SCP(Samsung Cloud Platform)의 Object Storage에 저장하여 관리해 왔습니다. 그러나 각종 타입 및 버전별 이력 관리가 필요해지면서, 보관하는 스토리지 사용량이 증가하게 되어 비용이 부담스럽게 되었습니다. 이에 따라, 오래된 데이터는 Archive Storage로 이관하여 보관하기로 결정하였습니다. Archive Storage 서비스에 대해 설명한 내용 중 옳지 않은 것은 무엇인가요?", "o": ["Archive Storage는 장기 보관 데이터를 위한 저가형 스토리지 서비스로, 사용자는 스케줄 설정을 통해  Object Storage에 저장된 데이터를 보다 저렴한 스토리지로 자동 이관한다.", "Archive Storage에 저장된 데이터는 사용자 요청 시 30분 이내 데이터를 검색하여, Object Storage로 복구하여 사용이 가능하다.", "아카이빙 계획 설정시, 수행조건은 파일의 생성/수정 시점 기준 1~3,650일 중 선택한다.", "Archive Storage의 버킷을 생성한 이후 사용자의 데이터 아카이빙 및 삭제에 따라 버킷은 자동으로 확장되거나 축소된다.", "Archive Storage 요금은 스토리지 사용량, 복구량, API 요청 요금을 합산하여 적용한다."], "a": 1, "e": "Archive Storage에서 복구할 때는 3시간 이내에 검색해 Object Storage로 복구합니다. 30분이 아닙니다.", "src": "기출 모의시험", "fix": true, "id": "G-30"}]</script>
<script type="application/json" id="gichul2">[{"item": "3-3a", "t": "SEA 예시", "q": "Virtual Server 대비 Container의 장점에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["자원 활용도를 극대화할 수 있다.", "크기가 작고 가벼워 복제와 배포가 간편하다.", "운영체제 부팅 시간이 없어 빠르게 시작 및 종료 가능하다.", "클라우드 플랫폼에 상관없이 어느 곳에서든 작동 가능하다.", "리소스 사용을 최적화할 수 있으며, 고성능 컴퓨팅(HPC)에 적합하다."], "a": 4, "e": "(추정) 컨테이너는 가볍고 빠르게 뜨는 대신 호스트 OS 커널을 공유합니다. 고성능 컴퓨팅(HPC)처럼 물리 자원을 최대로 쓰는 작업은 Bare Metal이나 GPU 서버가 맞고, 컨테이너의 장점으로 보기 어렵습니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-01"}, {"item": "3-2a", "t": "SEA 예시", "q": "다음 중 SCP(Samsung Cloud Platform) 서비스 자원 생성과 변경에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["사양 변경 또는 자원 변경 가능성 여부는 서버와 스토리지 타입에 따라 다르다.", "File Storage의 경우, 용량 증설 지원이 불가능하며, Disk 추가를 통한 증설 방식을 권장한다.", "Block Storage 용량 증설은 지원되지만, 기존 볼륨을 더 작은 용량으로 축소하는 방식은 지원하지 않는다.", "서버 사양 변경이 필요한 경우, 무약정 서버의 경우 제한없이 사양을 조정할 수 있다.", "서버 사양 변경이 필요한 경우, 약정 서버는 약정 조건 및 과금 정책과 연계될 수 있으므로 담당 영업 또는 운영 기준 확인 후 변경해야 한다."], "a": 3, "e": "(추정) 교재상 Virtual Server 서버 타입은 현재보다 상위 타입으로만 변경할 수 있어서, 무약정이라도 '제한 없이' 조정할 수는 없습니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-02"}, {"item": "3-2f", "t": "SEA 예시", "q": "Multi-node GPU Cluster에 대한 설명 중 옳지 않은 것을 고르시오.", "o": ["사용자는 8장의 H100 GPU가 장착된 Bare Metal Server를 클러스터링하여 고성능 GPU를 사용할 수 있다.", "Multi-node GPU Cluster는 최소 2대 이상의 Bare Metal Server를 이용하여 Infiniband Switch 기반 GPU Direct RDMA 환경를 제공하며 GPU 메모리간 IO를 직접 처리하여 고속연산이 가능하다.", "Multi-node GPU Cluster는 서비스 해지 없이 OS를 재구성할 수 있고, 재구성 이후 필요 시 기존 설정을 복구할 수 있다.", "연결된 Block Storage를 먼저 해지해야, Multi-node GPU Cluster가 삭제된다.", "Multi-node GPU Cluster는 Block, Object Storage 외에 고성능 SSD File Storage가 제공된다."], "a": 2, "e": "(추정) 교재에 MNGC 고성능 스토리지로 NVMe Local Disk, 고성능 SSD File Storage, NVMe 기반 Parallel File Storage가 모두 나오므로 SSD File Storage 보기는 맞는 설명입니다(실제 시험에서 오답 확인). OS를 재구성하면 기존 OS 영역의 설정·데이터가 초기화되므로 '재구성 이후 기존 설정을 복구할 수 있다'가 틀린 설명으로 봅니다. H100 8장 Bare Metal 2대 이상, InfiniBand 기반 GPU Direct RDMA는 교재 그대로입니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-03"}, {"item": "3-4f", "t": "SEA 예시", "q": "Object Storage에 저장된 데이터를 보호하기 위한 방법이 아닌 것은 무엇입니까?", "o": ["암호화 사용을 설정해서, SSE-S3 방식으로 암호화한다.", "버전 관리를 활성화한다.", "Security Group으로 접근 IP 주소를 제한한다.", "Private URL을 사용해 데이터가 인터넷을 경유하지 않도록 한다.", "접근 허용 IP를 지정한다."], "a": 2, "e": "Object Storage는 Security Group을 쓰지 않습니다. 접근 제어는 접근 허용 IP와 허용할 서비스 자원을 지정하는 방식이고, 버전 관리·암호화·Private URL로 데이터를 보호합니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-04"}, {"item": "4-2h", "t": "SEA 예시", "q": "다음 중 SCP(Samsung Cloud Platform) SingleID의 Identity Management (IM)에서 지원하지 않는 기능은 무엇입니까?", "o": ["권한 관리", "Universal Directory", "계정 라이프사이클 관리", "인증 이상 행위 탐지", "정책 관리"], "a": 3, "e": "인증 이상 행위 탐지는 IM이 아니라 ADM(인증 이상행위 탐지) 모듈의 기능입니다. IM은 계정·권한·정책·디렉터리 관리를 맡습니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-05"}, {"item": "3-2c", "t": "SEA 예시", "q": "다음 중 SCP(Samsung Cloud Platform)의 서비스 신청 및 해지에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["DB 이중화 구성이 필요한 경우, DB 서비스 신청 메뉴에서 \"고가용성\" 사용을 체크한다.", "Virtual Server Auto-Scaling 서비스 생성 시 Load Balancer를 사용하려면, Load Balancer 사용을 체크해야 한다.", "Load Balancer가 Virtual Server Auto-Scaling과 다른 네트워크망에 생성된 경우, 미리 생성해둔 Load Balancer가 조회되지 않는다.", "실수로 Object Storage를 삭제하는 일을 막기위해 Deletion Protection을 사용한다.", "Deletion Protection이 적용된 서비스를 해지하려면, 먼저 Deletion Protection 설정을 \"미사용\"으로 수정해야 한다."], "a": 3, "e": "(추정) Deletion Protection(삭제 방지)은 서버·DB 같은 자원의 실수 해지를 막는 설정으로, Object Storage 삭제 방지용으로 설명된 보기가 틀린 것으로 봅니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-06"}, {"item": "3-9a", "t": "SEA 예시", "q": "DevOps는 애플리케이션과 서비스를 빠른 속도로 제공할 수 있도록 조직의 역량을 향상시키는 도구의 조합입니다.\nDevOps에 대한 설명으로 옳지 않은 것은 무엇인가요?", "o": ["DevOps는 개발팀과 운영팀의 통합을 추구한다.", "시장의 요구 사항에 빠르게 대응하기 위한 전략이다.", "운영 장애 최소화를 목표로 한다.", "실패 발생시 즉각적인 복구를 목표로 한다.", "DevOps Service는 Kubernetes Engine 환경은 지원하지만 Virtual Server 환경은 지원하지 않는다."], "a": 4, "e": "DevOps Service는 Kubernetes Engine뿐 아니라 Virtual Server(VM)도 배포 타겟으로 지원합니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-07"}, {"item": "2-3c", "t": "SEA 예시", "q": "Database Migration은 수행하기 까다로운 복잡한 프로젝트로 아래와 같은 절차로 진행됩니다.\n계획 수립 단계에서 고려해야 할 사항으로 옳지 않는 것은 무엇인가요?", "o": ["최적의 Migration 방법은 DB 환경과 비즈니스 요구사항, Data Size 등에 따라 달라질 수 있다.", "어플리케이션 다운타임이 허용되면 오프라인 Migration이 가능하나, 다운타임을 최소화 해야 한다면 온라인 Migration 방법을 고려한다.", "SCP(Samsung Cloud Platform)에서 제공되는 PostgreSQL(DBaaS)기반 Migration을 수행할 때, 성능을 고려하여 Datafile을 백업/복구하는 물리적 방식을 고려한다.", "Data 크기(양)에 비례하여 Migration 소요시간이 증가하므로, 대량의 데이터의 경우 병렬처리, 인덱스 삭제 등 Migration 시간 단축을 위한 방법을 고려한다.", "Source와 Target이 다른 이종 DB로 전환을 위해서는 동종 DB 전환 대비 충분한 테스트 계획 수립 및 결과 검증방법을 고려한다."], "a": 2, "e": "(추정) SCP PostgreSQL(DBaaS) Migration은 복제 기반(논리) 방식입니다. Datafile을 백업·복구하는 물리 방식을 고려한다는 설명이 틀립니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-08"}, {"item": "2-3a", "t": "SEA 예시", "q": "혈액 및 체액 기반 센서를 제조하는 J회사는 온프레미스에서 운영하던 자사 정보 시스템의 일부를 SCP(Samsung Cloud Platform)로 이전할 계획입니다.\nJ회사는 기존 정보시스템 중 클라우드로 이전했을 때 확장성, 탄력성, Pay-as-you-go 등의 클라우드의 장점을 활용할 수 있는 워크로드만 이전하고, 나머지는 온프레미스에서 기존대로 운영할 계획입니다. 클라우드에 이전하는 시스템과 온프레미스의 시스템을 연동할 때는 전송 데이터를 안전하게 보호해야 합니다.\n다음 J회사의 클라우드 운영 효율성을 위한 제안 중에서 적합하지 않은 것은 무엇입니까?", "o": ["File Storage를 데이터 저장소로 사용해서 데이터 증가에 따른 스토리지 증설 관리 부담을 줄인다.", "기존 분석 애플리케이션을 Vertica(DBaaS)와 Quick Query기반으로 전환해서 확장성과 성능을 향상시킨다.", "그룹 웨어 서비스를 Cloud Functions로 마이그레이션해서 서버 관리 부담을 최소화한다.", "Auto-Scaling을 적용한 Virtual Server를 사용해서 수요에 탄력적인 컴퓨팅을 구현한다.", "SCP와 J회사 네트워크를 VPN으로 연결하여 전송 데이터를 안전하게 보호한다."], "a": 2, "e": "(추정) 그룹웨어처럼 상시 상태를 유지하며 돌아가는 대형 애플리케이션은 이벤트 단위로 짧게 실행되는 Cloud Functions(서버리스)로 옮기기에 맞지 않습니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-09"}, {"item": "3-4d", "t": "SEA 예시", "q": "SCP(Samsung Cloud Platform)의 Archive Storage 기능을 이용해 데이터를 장기 보관하려는 경우, 이에 대한 설명 중 옳지 않은 것을 고르세요.", "o": ["사용자는 아카이빙 대상  Object Storage의 버킷을 선택하고 이에 대한 수행조건을 설정한다.", "SCP Storage 서비스 중에서, 1GB당 사용요금이 가장 저렴하다", "스토리지 버킷 생성에 대한 비용은 발생하지 않으며, 스토리지 사용량에 대해서 과금됩니다.", "Archive Storage에 대해 다른 위치에 동일한 복제 버킷을 생성할 수 있다.", "데이터 복구 요청 시 복구 용량에 따른 추가 과금이 이루어진다."], "a": 3, "e": "(추정) Archive Storage에는 다른 위치에 복제 버킷을 만드는 기능이 없습니다(리전 간 복제는 '예정' 기능). 버킷 생성은 무료, 요금은 사용량·복구량 기준입니다.", "src": "SEA 문제 예시", "fix": true, "id": "G2-10"}, {"item": "3-2e", "t": "기출", "q": "M엔터테인먼트는 IDC 서버에서 운영하던 웹 애플리케이션 서버를 클라우드로 이전했으며, 웹 서버와 애플리케이션 서버에 Vitual Server Auto-Scaling을 적용했습니다. 한동안 서비스가 안정적으로 운영되었으나, 사이트 사용자가 더 증가하면서 부하 증가 속도가 Virtual Server 생성 속도를 앞질러서 다시 서비스가 느려지기 시작했으며, 이에 따른 서버 관리 부담도 증가하게 되었습니다. IT 담당자는 웹과 애플리케이션에 서버리스 아키텍처를 적용해서 이러한 문제를 해결하려고 합니다.\n다음 중 서버리스 환경을 구현하기 위한 조치에 포함되지않는 것은 무엇입니까?", "o": ["비디오, 이미지 등의 정적 미디어 콘텐츠를 Object Storage로 옮긴다.", "Global CDN을 적용하여 서비스 앞 단에 캐싱을 구현한다.", "애플리케이션에서 제공하던 기능을 Cloud Functions에 구현해서 반복적인 요청 응답 처리를 수행한다.", "서비스의 전방에 Load Balancer를 배치하여 부하를 분산한다.", "API Gateway를 배치하여 사용자 요청을 각 기능에 라우팅한다."], "a": 3, "e": "Load Balancer는 서버(VM) 여러 대에 트래픽을 나눠 주는 장치라 서버리스 구성 요소가 아닙니다. 서버리스는 Object Storage, Global CDN, Cloud Functions, API Gateway로 구성합니다.", "src": "기출 모의시험", "fix": true, "id": "G2-11"}, {"item": "1-2a", "t": "기출", "q": "다음 SCP(Samsung Cloud Platform)의 Console, CLI, Open API 접근 및 활용에 대한 설명 중 옳지 않은 것은 무엇인가요?", "o": ["고급 사용자나 특정 요구사항을 충족시키기 위한 프로그래밍적인 유연성이 요구되는 경우 Open API가 적합하다.", "SCP 서비스를 이용하기 위해서 CLI와 Open API 모두 API 인증키를 설정해야 한다.", "자동화 및 스크립팅 등의 목적으로 개발자나 시스템 관리자가 프로그래밍 방식으로 SCP 리소스를 처리할 때에는 CLI가 적합하다.", "CLI와 Open API 모두 사용자 임시키 및 Secret Vault 임시키를 영구적으로 사용할 수 있다.", "초보자를 포함한 조직 내의 다양한 기술 수준의 사용자들이 SCP 리소스를 관리하는 데에는 직관적이고 시각적인 Console이 적합하다."], "a": 3, "e": "임시키는 이름 그대로 사용 기한이 있습니다. Secret Vault 임시키는 최대 36시간 단위로 교체됩니다.", "src": "기출 모의시험", "fix": true, "id": "G2-12"}, {"item": "3-8e", "t": "기출", "q": "다음 중 SCP(Samsung Cloud Platform)의 Simple AI Inference 서비스를 활용한 사용사례로 적합한 것은 무엇입니까?", "o": ["제조공정 센서 데이터를 분석하여 불량품을 분류하는 서비스", "기업 내부 문서를 기반으로 학습하여 질문에 답변하는 사내 AI chatbot 서비스", "고객의 결제 패턴과 신용도를 분석하여 대출 한도를 산정하는 서비스", "대용량 영상 데이터를 실시간으로 분할 및 처리하여 객체를 인식하는 관제 서비스", "인터넷 쇼핑몰의 클릭 데이터를 기반으로 다음 구매 품목을 예측하는 추천 서비스"], "a": 1, "e": "(추정) Simple AI Inference는 LLM 모델을 API로 호출하는 추론 서비스라, 사내 문서 기반 AI 챗봇에 맞습니다. 나머지는 분류·예측 같은 전통적인 ML 모델 영역입니다.", "src": "기출 모의시험", "fix": true, "id": "G2-13"}, {"item": "3-1h", "t": "기출", "q": "A회사는 SCP(Samsung Cloud Platform)의 PostgeSQL(DBaaS)에서 데이터베이스를 가동하고 있습니다. 이 회사의 DBA는 사내에서 DB에 접속해 DB 관리 작업을 수행하려 합니다. 하지만 먼저 SCP와 회사 네트워크가 안전하게 연결되어야 합니다. 다음 중 SCP와 회사 네트워크를 안전하게 연결하기 위한 작업으로 적절한 것을 고르십시오.", "o": ["Direct Connect를 생성해서 VPC와 연결하고, 회선 연결을 신청한다. 회선 연결이 완료되면, 데이터베이스 Virtual Server 연결에 필요한 Routing 규칙과 Firewall 규칙을 구성한다.", "VPN을 생성해서 VPC와 연결하고, 회선 연결을 신청한다. 통신 연결이 완료되면, PostgeSQL 연결에 필요한 Routing 규칙과 Firewall 규칙을 구성한다.", "PostgreSQL(DBaaS)와 연결된 Local Subnet의 IP 범위에 Direct Connect를 생성하고, 회사 네트워크와 연결하는 회선을 신청한다. PostgreSQL(DBaaS)에서 회사 IP 범위에 대한 트래픽이 VPN으로 향하도록 Routing을 구성한다.", "PostgreSQL(DBaaS)와 연결된 Local Subnet의 IP 범위에 Transit Gateway를 생성하고, 회사 네트워크와 연결하는 회선을 신청한다. PostgreSQL(DBaaS)에서 회사 IP 범위에 대한 트래픽이 VPN으로 향하도록 Routing을 구성한다.", "PostgreSQL(DBaaS)와 연결된 Local Subnet의 IP 범위에 VPN을 생성하고, 회사 네트워크와 연결한다. PostgreSQL(DBaaS)에서 회사 IP 범위에 대한 트래픽이 VPN으로 향하도록 Routing을 구성한다."], "a": 0, "e": "Direct Connect를 만들어 VPC와 연결하고 회선 연결을 신청한 뒤, 라우팅과 Firewall 규칙을 구성합니다. 회선 신청은 Direct Connect 절차이고, Local Subnet에 연결 서비스를 만드는 보기들은 틀립니다.", "src": "기출 모의시험", "fix": true, "id": "G2-14"}, {"item": "3-8b", "t": "기출", "q": "SCP(Samsung Cloud Platform)의 AI&MLOps Platform이 제공하는 주요 기능과 서비스의 조합으로 옳지 않은 것은 다음 중 무엇입니까?", "o": ["다양한 머신러닝 모델 개발 및 학습 환경 - JupyterLab (Jupyter Notebook), RStudio, Visual Studio Code (code-server)", "모델 튜닝 - Katib", "추론 서비스 - Kserve", "머신러닝 워크플로우 - Pipeline UI, Python SDK", "사용자 인증 - AI&MLOps Platform 버전과 Kubeflow Mini 버전은 동일한 자체 사용자 인증 기능 활용"], "a": 4, "e": "(추정) AI&MLOps Platform(Enterprise) 버전과 Kubeflow Mini 버전은 기능이 다르며, 사용자·권한 관리 같은 기능은 Enterprise 쪽에만 있습니다.", "src": "기출 모의시험", "fix": true, "id": "G2-15"}, {"item": "3-8b", "t": "기출", "q": "의류쇼핑몰 기업 A사는 고객의 사진을 등록한 고객 대상으로 사고 싶은 옷을 선택하면, 가상으로 해당 옷을 입은 이미지를 제공하는 AI 서비스를 하고자 합니다. AI 모델 개발 및 운영에 MLOps 환경 구축이 필수라는 전문가의 조언을 듣게 되었는데, MLOps에 대한 설명 중 옳지 않은 것은 무엇인가요?", "o": ["AI 모델 개발보다 데이터 수집/전처리 및 Workflow 관리 등 주변 구성요소 구축 및 운영이 매우 복잡하여 AI 모델 개발 자체에 대한 집중이 어려워짐에 따라 MLOps 개념이 등장하게 되었다.", "MLOps는 AI 모델 개발/배포 가속화와 운영에서 유지관리를 목표로 MLOps 프로세스 여러 단계를 연결하여 수행하는 체계이다.",
