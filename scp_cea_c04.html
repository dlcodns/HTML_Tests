**단일 AZ vs 멀티 AZ**) → Ingress Controller 설치 → Ingress 오브젝트 구성(URL 기반 라우팅) → **Load Balancer와 연동**.\n- 클러스터 생성 필수 설정에 VM, VPC, Subnet, Security Group, **Load Balancer**, DNS가 포함된다.\n\n> [!시험]\n> - LB 서버 그룹은 **하나의 LB**에만 연결. 반면 LB 하나에 Listener 여러 개, 서버 하나는 여러 서버 그룹의 멤버 가능.\n> - LB·Listener·서버 그룹·헬스 체크는 같은 Subnet, **멤버는 Subnet 제약 없음**. 다른 VPC 서버는 VPC Peering 후 IP 직접 입력.\n> - Service Subnet에서 Source NAT IP 1개 + Health Check IP 2개 자동 할당, **할당 후 수정 불가**.\n> - L4 라우팅은 '서버 그룹 전달' 고정 → 호스트 헤더·URL 경로 분기, URL 리디렉션(HTTP→HTTPS)은 **L7**.\n> - 부하 분산 방식 5가지 = (W)RR, (W)LC, IP Hash. Auto-Scaling 연동에서는 Weighted 서버 그룹 선택 불가.\n> - Firewall 규칙 3개, 멤버 SG 규칙 1개(Source NAT IP). 헬스 체크 기본 5초/5초/3회 = 30초.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드15·18, Load Balancer 슬라이드1~20, SCP_v2_Explore_Compute_11-19.md Virtual Server 슬라이드17·Auto-Scaling 슬라이드5·12·13, CloudNative1_Container_Services 슬라이드18·23·24, WA백서 01 p.10~11·p.29·p.34~35·p.38, WA백서 04 p.7\n"}, "3-1m": {"title": "GSLB 도메인 기반 부하 분산", "md": "## 한눈에 보기\n- **GSLB(Global Server Load Balancing)** = **DNS 기반 트래픽 분산과 장애 감지**로 글로벌 서비스의 안정성과 고가용성을 제공하는 서비스.\n- 분산 알고리즘은 **Ratio**(가중치 비례)와 **Round Robin**(순환 균등) 2가지뿐.\n- 헬스 체크 프로토콜은 **ICMP, TCP, HTTP, HTTPS**(UDP 없음).\n- Quota: **Account당 도메인 20개, 도메인당 연결 리소스 8개**.\n\n## 개념\n### 정의와 동작\n- 사용자의 DNS Request에 대해 GSLB가 **정상 상태인 연결 대상의 IP를 DNS Response로 응답**해 트래픽을 나눈다.\n- 도메인 등록/위임(Domain Registration / Delegation) 후, 여러 데이터센터(Region)의 리소스에 Health Check를 수행한다.\n- 교재 그림: **Primary(Active)** 데이터센터와 **Secondary(Inactive)** 데이터센터를 GSLB가 Health Check하며 연결 → 장애 시 다른 데이터센터로 응답.\n\n### 제공 기능\n| 기능 | 내용 |\n|---|---|\n| GSLB 생성/관리 | 하나의 GSLB에 **여러 개의 리소스** 등록 가능 |\n| 분산 알고리즘 | **Ratio**: 연결 대상별 가중치(Weight)에 비례해 분배 / **Round Robin**: 순환하며 균등 분배 |\n| Health Check 설정 | 체크 주기(**Interval**), 서비스 다운 인지 시간(**Timeout**), 응답 대기 시간(**Probe Timeout**), 프로토콜(**ICMP, TCP, HTTP, HTTPS**), 서비스 포트(**Port**) |\n\n### Quota\n| 항목 | 값 |\n|---|---|\n| 최대 생성 도메인 수 | **Account당 20개** |\n| 최대 연결 가능 리소스 수 | **도메인당 8개** |\n\n## 생성 절차 (Networking > GSLB 생성)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | GSLB 도메인 이름 입력 | |\n| 2 | 연결 대상 **IP 주소** 입력 | 서버 이름 선택이 아니라 IP 입력 |\n| 3 | **모니터링을 수행할 위치** 선택 | |\n| 4 | 연결 대상 설명 입력 | 추가 정보 |\n| 5 | 연결 대상 추가 | 추가한 IP, 위치, 설명 표시. **최대 8개** |\n| 6 | 헬스 체크 프로토콜 | ICMP, TCP, HTTP, HTTPS 중 선택 |\n| 7 | 헬스 체크 시간 간격(초) | Interval |\n| 8 | 서버 상태 판단 대기 시간(초) | Timeout |\n| 9 | 응답 대기 시간(초) | Probe Timeout |\n| 10 | 부하 분산 알고리즘 | Ratio / Round robin |\n| 11 | (Ratio 선택 시) 연결 대상별 가중치 입력 | |\n\n학습정리 요약: **GSLB 서비스 생성 → 연결 대상 모니터링 설정 및 부하 분산 정책 설정**.\n\n## Load Balancer vs GSLB\n| 구분 | Load Balancer | GSLB |\n|---|---|---|\n| 분산 범위 | 여러 VM(서버 그룹 멤버) | 여러 **Region(IP 주소)**·데이터센터 |\n| 동작 방식 | Listener가 트래픽을 받아 서버 그룹으로 전달 | **DNS 응답**으로 연결 대상 IP를 돌려줌 |\n| 유형 | L4(TCP/UDP/TLS), L7(HTTP/HTTPS) | 도메인 단위 |\n| 분산 방식 | (Weighted) Round Robin, (Weighted) Least Connection, IP Hash | **Ratio, Round Robin** |\n| 헬스 체크 | LB 헬스 체크(HTTP/TCP 등, 포트·URL·주기·탐지횟수) | ICMP/TCP/HTTP/HTTPS, Interval·Timeout·Probe Timeout·Port |\n| Quota | Account당 LB 50 등 | Account당 도메인 20, 도메인당 리소스 8 |\n\n- WA 성능 효율성: \"Load Balancer를 사용하여 여러 VM에 부하를 분산할 수 있으며, **GSLB를 적용하면 요청 부하를 여러 Region(IP 주소)에 라우팅**할 수 있다.\" → 보통 **Region 내부는 LB, Region 간은 GSLB**로 계층 구성한다.\n\n## 활용 시나리오\n### 글로벌 네트워크 확장 전략 (Networking 개요)\n- **DNS + GSLB**: 글로벌 특정 지역에 트래픽이 증가하면 DNS 기반으로 **가용한 인접 지역에 트래픽을 자동 분산**. 장점: 특정 서버 장애 시 **즉시 리소스를 우회**시켜 안정적 서비스.\n- 함께 쓰는 전략: **Global CDN**(정적 콘텐츠 엣지 캐싱), **Transit Gateway + Cloud WAN**(글로벌 리전과 고객 거점 연결).\n\n### 배포 전략 (WA 운영 우수성)\n- **블루-그린 배포**: 새 버전 환경(그린)을 만든 뒤 **GSLB 정책을 Ratio 알고리즘**으로 구성하고 가중치 비율을 조절해 블루 → 그린으로 점진 전환. 문제 시 블루로 롤백. DNS 컷오버와 Auto-Scaling 그룹 정책도 일반적인 전환 방법이다.\n- **카나리/A·B 테스트**: GSLB Ratio로 기존 v1에 90%, 신규 v2·v3에 각각 5%를 보내 테스트.\n- **레드-블랙 배포**: 점진 전환 없이 **일시에 DNS를 변경**해 새 버전으로 전환(한 버전만 활성).\n\n### 비용\n- GSLB는 Load Balancer, Transit Gateway 등과 함께 **Provisioning / Per Hour** 과금(WA 06).\n- WA 가용성 백서는 GSLB를 Virtual Server, Load Balancer, VPN 등과 함께 여러 AZ·Region에 걸쳐 쓰이는 공통의 대표 서비스로 든다.\n\n> [!시험]\n> - GSLB 알고리즘 = **Ratio, Round Robin** 둘뿐. IP Hash·Least Connection·Weighted Response Time은 오답(앞의 둘은 LB의 방식).\n> - 헬스 체크 프로토콜 = ICMP/TCP/HTTP/HTTPS. **UDP 없음**.\n> - 헬스 체크 항목 = Interval, Timeout(서비스 다운 인지 시간), Probe Timeout(응답 대기), 프로토콜, 포트.\n> - 연결 대상은 **IP 주소 입력 + 모니터링 위치 선택**. VM 이름 선택 아님.\n> - Account당 도메인 20, 도메인당 리소스(연결 대상) 8.\n> - 블루-그린·카나리 점진 전환 = GSLB **Ratio** 가중치 조절.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·20, DNS/GSLB/Global CDN 슬라이드16~20·28, Load Balancer 슬라이드5·6, WA백서 04 p.38, WA백서 05 p.19·p.22, WA백서 06 p.1, WA백서 01 p.5\n"}, "3-1n": {"title": "Global CDN", "md": "## 한눈에 보기\n- **Global CDN** = 글로벌 네트워크에 분산된 **엣지 서버**를 통해 **웹서버 또는 Object Storage에 저장된 정적 콘텐츠**를 빠르고 안전하게 전달하고, **원본 서버 부하를 분산**해 빠르고 안정적인 응답시간을 제공.\n- 핵심 기능 4가지: **압축**, **캐싱 설정**(TTL 만료 시 Purge), **원본 위치 및 경로 설정**, **콘텐츠 보호**(HTTPS 원본 통신, DDoS·웹 공격 방어).\n- Quota: **Account당 최대 20개 도메인**.\n- 생성 흐름: **Global CDN 생성 → 원본 설정 → 캐싱 설정**.\n\n## 배경: 왜 CDN인가 (WA 백서)\n- 지연 시간을 줄이는 가장 기본적인 방법은 클라이언트와 서버 간 **네트워크 거리(홉 수)를 줄이는 것** → 서버를 가까운 Region에 두거나, **CDN을 구성해 엣지 서버에서 직접 응답**.\n- 사용자와 웹 애플리케이션 사이 인터넷 구간의 지연은 지리적 거리(정확히는 홉 수)에 따라 달라지며, Global CDN은 엣지 서버로 정적 콘텐츠를 전송하고 트래픽 급증 시에도 원본 서버의 과부하를 막는다.\n- 글로벌 서비스라면 각 국가에 시스템을 분산 배포할지, Global CDN으로 지연 시간을 줄일지 검토한다. 퍼블릭 인터넷으로 웹 콘텐츠를 전송하는 경우 Global CDN을 활용한다.\n- WA 가용성: 사용자가 넓은 지리적 위치에 분포하면 Global CDN으로 콘텐츠 전송 지연 시간을 단축할 필요가 있다.\n- 네트워크 글로벌 확장 전략: **Global CDN 활용** — 장점 ① 동시에 많은 사용자 요청에도 서비스 가용성 보장 ② 콘텐츠 압축으로 트래픽 감소 및 응답속도 개선.\n\n## 제공 기능\n| 기능 | 내용 |\n|---|---|\n| 압축 | 원본 콘텐츠의 압축 기능 제공 → 트래픽 감소, 응답속도 개선 |\n| 캐싱 설정 | 캐싱된 콘텐츠의 **전송 정책**과 **캐시 만료 시간** 설정. 콘텐츠 유효기간 경과(**TTL 만료**) 시 엣지 서버에 캐싱된 만료 콘텐츠를 **삭제(Purge)** |\n| 원본 위치 및 경로 설정 | 원본(Origin) 서버 위치·경로 지정. 원본은 VPC의 웹서버 또는 Object Storage |\n| 콘텐츠 보호 | **HTTPS**로 원본 서버와 통신해 경로 보안 강화, Global CDN망의 보안 기능으로 **DDoS 공격 및 웹 기반 공격**으로부터 콘텐츠와 사용자 보호 |\n\n## 생성 절차 (Networking > Global CDN 생성)\n### 1단계: 기본·원본 정보\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | Global CDN 이름 | |\n| 2 | Global CDN의 도메인명 | |\n| 3 | 원본 서버 위치 | **도메인 이름(권장)** 또는 원본 서버 **공인 IP** |\n| 4 | 사용할 프로토콜 | |\n| 5 | 원본 포트 | 허용 원본 포트: 72, 80-89, 443, 488, 591, 777, 1080 등 |\n| 6 | 원본 파일 디렉토리 경로 | 예) /aaa/bbb/ccc/ |\n\n### 2단계: 헤더·캐시 키\n| 순서 | 항목 | 옵션 |\n|---|---|---|\n| 7 | 사용자 전달 Host 헤더값 | **Incoming host header**: 서비스 도메인명 / **Origin host name**: 원본 도메인명 / **Custom Value**: www.abc.com 같은 표준 도메인명 직접 입력 |\n| 8 | 콘텐츠 식별용 캐시 키 | **Incoming host header**: 사용자 접속 도메인을 cache key로 / **Origin hostname**: 오리진 도메인을 cache key로 |\n| 9 | 원본 요청 시 특정 Header 변경 | 사용 체크 시 Header name, Header Value 입력(**최대 10개**) |\n\n### 3단계: 캐싱 정책\n| 순서 | 항목 | 옵션 |\n|---|---|---|\n| 10 | 캐싱 정책 | 아래 표 |\n| 11 | 콘텐츠 전송 정책 | **유효한 콘텐츠만 제공**: TTL 만료 시 종료 / **캐싱된 모든 콘텐츠 제공**: TTL과 상관없이 모두 제공 |\n| 12 | Cache 만료시간 | |\n| 13 | Query string 사용 여부 | |\n| 14 | Range request 허용 | |\n| 15 | 특정 Header 변경 | |\n\n캐싱 정책 4가지:\n| 옵션 | 따르는 정책 |\n|---|---|\n| Honor origin cache-control and expires | **오리진**의 정책 |\n| **Cache** | **Global CDN 제공자**의 정책 |\n| Honor origin expires | 오리진의 **만료 시간** 정책 |\n| Honor origin cache-control | 오리진 서버의 정책(cache-control) |\n\n## 계층별 캐싱 (WA 성능 효율성)\n| 계층 | 대상 | 캐싱 구현 |\n|---|---|---|\n| 웹 계층 | 웹 콘텐츠 | 웹 서버의 웹 콘텐츠 전송 지연 개선 → **Global CDN을 이용한 콘텐츠 전송** |\n| 애플리케이션 계층 | 사용자 세션 데이터 | 키/값 저장소와 로컬 캐시 → **CacheStore를 이용한 상태 관리** |\n| 데이터베이스 계층 | 데이터 | DB 버퍼와 키/값 저장소 → **CacheStore를 이용한 데이터 캐싱**, **Replica 구성을 통한 읽기 부하 오프로드** |\n\n- 웹 계층 성능은 주로 **이미지, 동영상, html 페이지 같은 정적 콘텐츠** 전송과 관련 → Global CDN.\n- 세션 같은 상태 데이터는 CDN이 아니라 CacheStore(Redis 기반 DBaaS)로 분리한다.\n- 설계 원칙: \"적절한 캐싱 구현을 통해 성능 효율성을 향상\". 콘텐츠가 자주 쓰이지 않거나 **TTL이 사용 사례에 맞지 않으면** 불필요한 비용이 발생하거나 지연 개선 효과가 없다.\n- 과금: Global CDN은 Internet Outbound Traffic, VPC Peering과 함께 **Pay-as-you-go / Per Usage(GB)**.\n\n## 비교: Global CDN vs GSLB\n| 구분 | Global CDN | GSLB |\n|---|---|---|\n| 목적 | 정적 콘텐츠를 엣지에서 캐싱·전송, 지연 단축 | DNS 기반으로 Region/IP 간 트래픽 분산, 장애 우회 |\n| 대상 | 웹서버·Object Storage의 정적 콘텐츠 | 연결 대상 IP(최대 8개) |\n| Quota | Account당 도메인 20 | Account당 도메인 20, 도메인당 리소스 8 |\n\n> [!시험]\n> - 원본 서버 위치 = **도메인 이름(권장)** 또는 공인 IP. '공인 IP만 가능'은 오답.\n> - 캐싱 정책 **Cache = CDN 제공자 정책**, Honor origin 계열 = 오리진 정책.\n> - 전송 정책: '유효한 콘텐츠만 제공'(TTL 만료 시 종료) vs '캐싱된 모든 콘텐츠 제공'(TTL 무관).\n> - 캐시 키 Incoming host header = 사용자 접속 도메인, Origin hostname = 오리진 도메인.\n> - TTL 만료 시 엣지 캐시 **Purge**. HTTPS 원본 통신 + DDoS·웹 공격 보호. 압축으로 트래픽 감소.\n> - 사용자 세션 캐싱은 CDN이 아니라 **CacheStore**.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·20, DNS/GSLB/Global CDN 슬라이드21~26·29, WA백서 04 p.2·p.6·p.36~38, WA백서 01 p.15, WA백서 06 p.1\n"}, "3-1o": {"title": "DNS 도메인 관리", "md": "## 한눈에 보기\n- **DNS** = 인터넷상의 도메인 이름을 숫자 IP 주소로 변환해 시스템에 접속하게 하는 서비스.\n- SCP v2 DNS 구조: **Private DNS**, **Hosted Zone**(전용망/인터넷망), **Public Domain Name** 3요소(v2에서 구조 변경).\n- Private 절차: **Private DNS 생성 → VPC 연결 → (다른 리전) 활성화 → VPC 연결 → Private Hosted Zone 생성 → 레코드 등록**.\n- Public 절차: **Public Domain Name 신청 → Hosted Zone(Public) 생성 → 레코드 등록**.\n- 레코드 TTL **300초 ~ 86,400초**, Private DNS **Account당 1개 / VPC 최대 5개**, Public Domain Name **1년 단위**.\n\n## 개념\n### 제공 기능\n| 기능 | 내용 |\n|---|---|\n| Private DNS 생성/관리 | 인터넷에 노출하지 않고 **지정된 네트워크 환경에서만** 접속 가능 |\n| Hosted Zone 생성/관리 | **전용망**: Private DNS에 연결된 VPC 대상 내부 Domain 생성·관리 / **인터넷망**: SCP를 통해 생성한 Public Domain Name의 레코드 관리 |\n| Public Domain Name 생성/관리 | Public Domain Name 업체인 **Whois사와 연계**해 신청 |\n| 다양한 리소스 레코드 | A, AAAA, NS, TXT, CNAME, MX, SPF |\n| Quota | Private DNS 수, Hosted Zone 수, 레코드 수는 **Quota 서비스에서 확인** 필요 |\n\n### 레코드 유형\n| 레코드 | 의미 | 예 | 생성 |\n|---|---|---|---|\n| A | 도메인 → **IPv4** | example.com → 142.0.2.1 | 직접 |\n| AAAA | 도메인 → **IPv6** | example.com → 2001:0db8:85a3::8a2e:0370:7334 | 직접 |\n| CNAME | 도메인 이름의 **별명(Alias)** | www.example.com → example.com | 직접 |\n| MX | 도메인·하위 도메인의 **메일 서버**(우선순위 포함) | 10 mail1 / 20 mail2(백업) | 직접 |\n| TXT | 도메인 텍스트 정보(SPF, DKIM, 소유권 검증, 설명) | \"이 도메인은 공식 인증 사이트입니다\" | 직접 |\n| SPF | **스팸메일 방지**, 메일 송신 서버 IP·도메인 검증 | v=spf1 ip4:211.170.106.72 ~all | 직접 |\n| NS | 해당 도메인을 담당하는 네임서버 | | **자동생성** |\n| SOA | 도메인 시작정보(권한의 시작 지점) | | **자동생성** |\n\n- 레코드 추가 화면에서 선택 가능한 유형: **A, AAAA, SPF, CNAME, MX, TXT** (NS·SOA는 선택 대상 아님).\n\n## Private Domain Name 설정\n### 1) Private DNS 생성 (Networking > DNS 시작 > Private DNS 생성)\n- Private DNS명 입력: **Account 내 모든 위치에서 공통으로 사용(Account당 1개 생성)**\n- VPC 연결 선택: 연결할 VPC 등록, **VPC 최대 5개**\n\n### 2) 다른 리전에서 활성화 (Private DNS 목록)\n- 생성한 리전이 아닌 **다른 리전에서 Private DNS의 '활성화' 버튼** 클릭\n- VPC 연결 수정: 그 리전의 VPC 등록(최대 5개)\n\n### 3) Hosted Zone 생성 (Networking > DNS 시작 > Hosted Zone 생성)\n- 용도구분: **Private** 선택\n- Hosted Zone명: 최상위 도메인(TLD, 예 .com .edu .gov .org), 2차 도메인(SLD, example.com의 example), 서브 도메인(www.example.com의 www)\n- 등록인 이메일 입력\n\n### 4) 레코드 추가 (Hosted Zone 상세 > 레코드 추가)\n1. 레코드 유형: A, AAAA, SPF, CNAME, MX, TXT\n2. 레코드 이름\n3. 값: A=IPv4, AAAA=IPv6, SPF=스팸 메일 송신 서버 IP, MX=**우선 순위와 메일 서버 주소**, TXT=문자열\n4. TTL: **최소 5분(300초), 최대 1일(86,400초)**\n\n```\n[Private 순서]\nA 리전: Private DNS 생성 → A 리전 VPC 연결\nB 리전: Private DNS '활성화' → B 리전 VPC 연결\n공통 : Private Hosted Zone 생성 → 레코드 등록\n→ 상세 정보 조회, 수정, 해지\n```\n\n## Public Domain Name 설정\n### 1) Public Domain Name 생성 (Networking > DNS 시작 > Public Domain Name 생성)\n| 항목 | 내용 |\n|---|---|\n| 도메인명 | **TLD 선택 후 SLD 입력**, 사용가능여부 조회 |\n| 구매 기간 | **1년 단위** 구매 |\n| 자동 연장 | 설정 시 **1년 단위** 자동 연장 |\n| 등록인 정보 | 등록인명(상호명), 이메일, 주소, 전화번호 |\n\n### 2) Hosted Zone 생성\n- 용도구분: **Public**\n- Hosted Zone명: **SCP를 통해 신청한 Public Domain Name을 선택**\n- 등록인 이메일\n\n### 3) 레코드 추가\n- Private과 동일(유형 6종, TTL 300~86,400초).\n\n## Private vs Public 비교\n| 구분 | Private Domain Name | Public Domain Name |\n|---|---|---|\n| 첫 단계 | Private DNS 생성(+VPC 연결, 타 리전 활성화) | Public Domain Name 신청(Whois 연계) |\n| Hosted Zone 용도구분 | Private(전용망) | Public(인터넷망) |\n| 대상 | Private DNS에 연결된 VPC 내부 도메인 | SCP로 신청한 공인 도메인 |\n| 개수/기간 | Account당 1개, VPC 최대 5개 | 1년 단위 구매·연장 |\n\n## 관련 사항\n- Subnet 생성 시 **DNS Name Server 사용** 체크: SCP Default DNS인 **198.19.0.53** 외에 추가 DNS Name Server 설정 가능. 체크 해제 시 SCP Default DNS 사용.\n- VPC Endpoint 개념 슬라이드는 연결 가능 서비스에 DNS를 포함한다(생성 화면 대상 서비스에는 없음 – 3-1k 참고).\n- Kubernetes Engine 클러스터 생성 필수 설정에 DNS가 포함된다.\n- WA 운영 우수성: **DNS 컷오버**는 블루-그린 배포의 일반적 트래픽 전환 방법, 레드-블랙 배포는 DNS를 일시에 변경.\n- 과금: DNS는 **Provisioning / Per Day**(WA 06).\n\n> [!시험]\n> - **NS·SOA는 자동생성**, 레코드 추가로 고르는 유형은 A, AAAA, SPF, CNAME, MX, TXT.\n> - MX = 우선 순위 + 메일 서버 주소, SPF = 스팸 방지 송신 서버 검증, CNAME = 별명.\n> - TTL 300~86,400초.\n> - Private DNS: Account당 1개(모든 위치 공통), VPC 최대 5개, 다른 리전은 '활성화' 후 VPC 연결, 그다음 Hosted Zone·레코드.\n> - Public Domain Name: Whois 연계, TLD 선택 + SLD 입력, **1년 단위 구매·자동연장**(1개월 아님).\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·15, VPC 슬라이드15·33, DNS/GSLB/Global CDN 슬라이드4~15·28, CloudNative1_Container_Services 슬라이드23, WA백서 05 p.18~19, WA백서 06 p.1\n"}, "3-1p": {"title": "VPN · Transit Gateway · Direct Connect 비교", "md": "## 한눈에 보기\n| 서비스 | 한 줄 정의 | 연결 형태 |\n|---|---|---|\n| VPN | 고객 네트워크와 SCP를 **암호화된 가상 전용망(IPSec)**으로 연결 | 인터넷 기반 터널 |\n| Direct Connect | 고객 네트워크와 SCP를 **안전하고 빠르게** 연결(물리 전용 회선) | VPC와 **1:1** |\n| Transit Gateway | 고객 네트워크 연결 + 클라우드 내 **여러 VPC의 연결 허브** | **1:N** |\n- 선택 기준: **저비용·빠른 구축 → VPN**, **대용량·안정·고보안 → Direct Connect**, **여러 네트워크를 중앙 허브로 → Transit Gateway**.\n\n## 공식 비교표 (On-premise 연결 시)\n| 항목 | VPN | Direct Connect | Transit Gateway |\n|---|---|---|---|\n| 연결방식 | 인터넷 기반 암호화 터널(IPSec) | 물리적 전용 회선 연결 | 물리적 전용 회선 연결 |\n| VPC 연결 | — | **1:1** | **1:N** |\n| 주요 용도 | 저비용, 빠른 구축 필요 시 | 대용량, 안정적으로 보안성 높은 연결 필요 시 | 중앙 허브(라우터) 방식으로 여러 네트워크 연결 |\n| 보안 | 암호화된 터널 제공, **인터넷을 경유** | **물리적 분리로 보안성 우수**, Firewall로 제어 | 연결되는 각 네트워크의 보안 정책 활용 |\n| 대역폭 | 상대적으로 낮음 | **1G, 10G, 20G, 40G** | (교재 표 공란) |\n| 구축 난이도 | 비교적 쉬움 | 물리적 작업 필요 | 물리적 작업 필요, 1:N 구성으로 복잡도 높음 |\n| 비용 | 상대적으로 낮음 | 전용회선 비용 발생 | (교재 표 공란) |\n\n## 서비스별 핵심 수치·조건\n| 구분 | VPN | Direct Connect | Transit Gateway |\n|---|---|---|---|\n| Quota | VPN Gateway **Account당 3개**, VPN Tunnel **Gateway당 5개** | Account 기준 서비스존 내 **VPC당 1개(1:1)** | **Account당 3개**, TGW당 **VPC 최대 5개** |\n| 선행·요건 | **Internet Gateway가 연결된 VPC** 선택, Public IP 사전 예약 | 고객사 Uplink 회선 **SR 신청**, 고객사 라우터 **BGP** 필요 | Uplink 회선 **SR 신청**, 고객사 라우터 **BGP** 필요 |\n| 방화벽 | — | **Direct Connect Firewall** 제공(로그 저장 시 Object Storage 선행) | BM VPC 연결 시 **BM VPC Firewall**(SR 신청), 외부 회선 연결 완료 후 TGW Firewall 사용 |\n| 라우팅 | Remote Subnet(CIDR) 입력 | Route 설정을 **규칙 추가**로 제공(목적지 VPC/원격지) | Route 설정을 **규칙 추가**로 제공(TGW→VPC / VPC→TGW) |\n| 이중화 | Tunnel이 IPsec VPN Gateway와 **Active-Standby** 이중화 | 회선/경로 이중화 | — |\n| 특이사항 | IKE v1/v2, PSK, PFS, DPD | **Uplink 포트 용량 변경 불가** | TGW Peering(두 TGW 간, Peering Firewall) – 예정 |\n\n### VPN 세부 (개념·설정)\n- 호환 VPN: Secui-Bluemax(TG360), Paloalto, Axgate, Cisco-router/ASA/Meraki, Checkpoint, AWS, Azure, Vmware NSX-T.\n- 용어: VPN Gateway(SCP 종단점, 암복호화·인증·라우팅·터널 관리), VPN Tunnel(인터넷망의 논리적 전용경로), IKE(인증·키 교환·정책 협상 자동화 – **v1은 메시지 교환이 많고 구형 암호화**, **v2는 간소화·빠름·최신 알고리즘**), IPsec(실제 트래픽 암호화·무결성·기밀성), Encryption/Digest 알고리즘, **DH 그룹**(번호가 클수록 보안 강하나 계산 느림, 장비별 지원 그룹 확인).\n- Tunnel 설정: Peer VPN GW IP, Remote Subnet(CIDR), Pre-shared Key → IKE 버전, 암호화·다이제스트 알고리즘(최대 10개), DH 그룹(3개까지), **IKE SA LifeTime 기본 86,400초(24시간)** → IPSec 알고리즘, **PFS**(세션마다 새 키), DH 그룹(3개까지), **IPSec SA LifeTime 기본 43,200초(12시간)**, **DPD Probe Interval**(원격 장비 활성 확인 간격).\n\n### Direct Connect 세부\n- 생성: 이름 → **Uplink 포트용량 1G/10G/20G/40G**(한번 선택 시 **변경 불가**, 생성 후 Uplink 회선 SR 요청) → VPC 선택 → Firewall 사용 여부 → Firewall 로그 저장 여부.\n- 규칙: 목적지 VPC면 VPC 대역 내(0.0.0.0/0 불가), 목적지 원격지면 VPC 대역 입력 불가(0.0.0.0/0은 VPC에 IGW가 연결되지 않은 경우만).\n- 기존 내부 사설 대역을 SCP 자원에 할당해 사용 가능. Private NAT은 Direct Connect가 선행되어야 한다.\n\n### Transit Gateway 세부\n- 순서: **TGW 생성(SR 요청) → TGW-VPC 연결(연결 VPC 관리 탭, 최대 5개) → TGW 규칙 추가**.\n- 규칙: 방향(TGW→VPC / VPC→TGW) 설정, 목적지 VPC면 VPC 대역 내(0.0.0.0/0 불가), 목적지 TGW면 VPC 대역 입력 불가.\n\n> [!주의]\n> Transit Gateway Peering(두 TGW 간 Peering, Peering Firewall 제공)은 교재에 **'26년 제공 예정**으로 표기되어 있다(VPN/DC/TGW 슬라이드18). 현재 기능으로 단정하지 말 것.\n\n## VPC Peering까지 포함한 비교\n| 구분 | VPC Peering | Transit Gateway |\n|---|---|---|\n| 연결 | VPC **1:1** | 중앙 집중형 **허브**, 다수 VPC |\n| 비용 | **트래픽 비용만** | 생성 요금 + 트래픽 요금 + 포트이용료 |\n| Quota | Account당 5개(다른 Account 간 1개) | Account당 3개, TGW당 VPC 5개 |\n| 권장 | 단순 VPC 연결 | 복잡한 구성 |\n- WA 가용성: VPC 3개를 Peering으로 모두 연결하려면 **연결 3개**가 필요하지만, TGW는 3개 VPC를 하나의 TGW로 연결해 **중앙화·단순화**. 연결 지점이 늘면 비용과 라우팅 복잡성이 증가하므로 **허브앤스포크(Hub-and-Spoke)** 구조가 바람직하고, 양쪽 사설 IP 대역이 **중첩되지 않게** 설계한다.\n- WA 비용: 여러 VPC 서버 간 통신은 인터넷 경유를 피하고 VPC Peering 또는 TGW로 프라이빗 통신을 구성하면 비용 최적화 + 보안 향상.\n\n## 비용·가용성 전략 (Networking 개요)\n- 비용: **VPN = IPSec VPN Gateway 요금 + Internet Outbound Traffic**, **Direct Connect = 포트 요금 + 트래픽 요금** → **중소 규모는 VPN** 구성.\n- 과금 모델(WA 06): Direct Connect·Transit Gateway(GB당 전송요금 별도)는 Provisioning/Per Hour, **VPN은 Provisioning/Per Month**(Internet Outbound 요금 별도), VPC Peering은 Pay-as-you-go/Per Usage(GB).\n- 고가용성: **VPN 터널 이중화**, **Direct Connect 회선/경로 이중화**, **VPN + Direct Connect 혼합 이중화**.\n- 성능(WA 04): 프라이빗 연결은 VPN, Direct Connect, Transit Gateway로 구성하고, 필요한 전송 속도에 맞게 VPN·Direct Connect 대역폭을 선택한다.\n- 글로벌: **Transit Gateway + Cloud WAN**으로 글로벌 리전과 고객 거점 연결(3-1q 참고).\n\n## 요구사항 → 서비스 매핑\n| 요구사항 | 선택 |\n|---|---|\n| 중소 사업장, 저비용·빠른 구축 | VPN |\n| 대용량 트래픽, 안정성·보안성, 40Gbps 등 고대역 | Direct Connect |\n| 본사 IDC + 여러 VPC를 중앙에서 연결·관리 | Transit Gateway |\n| VPC 2개를 단순 1:1 연결, 트래픽 비용만 | VPC Peering |\n| Direct Connect로 나갈 때 고객사망 IP로 매핑 | Private NAT |\n\n> [!시험]\n> - VPN = 인터넷 경유 IPSec 터널, 대역폭 낮음·쉬움·저비용. VPN Gateway는 **IGW가 연결된 VPC**에 생성하고 Public IP 사전 예약.\n> - Direct Connect = 물리 전용회선, **VPC 1:1**, 1G/10G/20G/40G, **포트 용량 변경 불가**, BGP 필요.\n> - Transit Gateway = **1:N 허브**, Account당 3개, TGW당 VPC 5개, BGP 필요. TGW Peering은 예정 기능.\n> - VPN 기본값: IKE SA 86,400초, IPSec SA 43,200초. DH 그룹 3개까지, 알고리즘 최대 10개.\n> - 비용: VPN(게이트웨이+인터넷 아웃바운드) vs DC(포트+트래픽) vs TGW(생성+트래픽+포트) vs Peering(트래픽만).\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·18~20, VPC 슬라이드37·42, VPN/DC/TGW 슬라이드5~24, WA백서 01 p.15~17, WA백서 04 p.7·p.37~38, WA백서 06 p.1·p.11\n"}, "3-1q": {"title": "Cloud WAN · Last Mile · LAN-Data Center · Virtual Circuit · Secured SD-LAN", "md": "## 한눈에 보기\n- **Enterprise Network** = 고객의 **사업장 LAN부터 글로벌 백본 회선까지 전체 네트워크 영역을 가상화**해 **사용량 기반 과금, 구독형**으로 제공하는 서비스군.\n| 서비스 | 정의(교재 표현) | 담당 영역 |\n|---|---|---|\n| **Cloud Secured SD-LAN** | 고객 사업장 내 **사용자 인증 기반 유무선 통합 네트워크** 사용 환경 | 사업장 내부 LAN |\n| **Cloud Last Mile** | 고객 사업장에서 SCP 리전까지 **Last Mile 회선**과 사업장 내 **Customer Edge 자원** 제공 | 사업장 ↔ 리전 회선 |\n| **Cloud LAN-Data Center** | 데이터센터 또는 고객 온프레미스 데이터센터 내 **SDDC 기반 Shared 네트워크**로 다양한 네트워크 간 연결 | 데이터센터 내부 |\n| **Cloud WAN** | SCP **글로벌 리전과 고객 거점들 간** (가상화된) 네트워크 연결 | 글로벌 백본 |\n| **Cloud Virtual Circuit** | 글로벌 리전과 고객 거점 간 **1:1 통신** 목적의 **회선 대역폭 기반 가상회선** | 거점 간 1:1 |\n- 교재 개념도의 역할 묶음: Cloud WAN / Cloud Virtual Circuit, Cloud LAN-Data Center, SASE / Cloud Last Mile, Cloud Secured SD-LAN. (SASE는 3-1s에서 다룬다.)\n- 네트워크 글로벌 확장 전략: **Transit Gateway + Cloud WAN** — 고객이 선택한 거점에서 SCP 리전 간 빠르고 안전하게 구성, **원하는 구간에서 실제 사용량만큼만 과금**해 회선 비용 효율화.\n\n## 1. Cloud Secured SD-LAN\n### 개념\n- 서비스 구분: **SaaS형 NW Authentication / NW Access**\n- 제공 기능(7): **네트워크 인증**(사용자/단말 인증 기반 접속·접근 제어), **논리적 망분리**(업무/용도별 분리 + 보안 정책), **IP Mobility**(위치가 바뀌어도 동일 네트워크 환경), **정책 관리**(사용자·단말별), **운영 자동화**(설정·정책 배포), **서비스 포털**(사용자 신청·관리자 운영), **네트워크 운영**(유/무선 설계·구축·운영·관리)\n- 제약사항: SaaS형 NW Authentication을 쓰려면 **고객 사업장과 SCP 리전 간 네트워크 연결 필요**(Cloud Last Mile, 전용선, VPN 등). 사업장 내 장비 구성은 **담당 매니저와 협의 후 확정**.\n### 생성\n| 항목 | NW Access 선택 시 | NW Authentication 선택 시 |\n|---|---|---|\n| 의미 | 사업장 LAN 구성을 위한 네트워크 장비와 운영 서비스 | SDN/인증용 인프라를 **SaaS형**으로 제공 |\n| 입력 | 계약기간(네트워크 서비스 계약 기간), Network Managed 서비스(운영 필요 시) | — |\n| 과금 | — | **인증 단말 수량별 월비용** |\n(공통: Network명 입력)\n\n## 2. Cloud Last Mile\n### 개념\n- 제공 기능\n  - **Last Mile 회선**: 회선 제공 타입 **전용선 또는 인터넷**, 상위국 연결은 **Cloud LAN-DC, 삼성SDS DC 내 On-Premise 장비**\n  - **Customer Edge 자원**: uCPE(VNF: 라우터, SD-WAN, WAN 가속기, 방화벽), 물리 장비: SD-WAN\n  - **Last Mile 회선 모니터링**: 회선 업다운 상태, 트래픽 사용량\n- 제약(Quota): **회선과 Edge 장비 패키지 형태로만 제공**, 상위국 접속 방식에 따라 SCP 리전 내 **고객 전용 장비 구축**이 필요할 수 있음, 상위국 공용 장비 연결 시 **포트 비용** 부과 가능\n### 용어\n| 용어 | 의미 |\n|---|---|\n| Intranet | 조직 내부에서만 접근 가능한 사설 네트워크 망 |\n| vRouter | 가상 환경에서 소프트웨어적으로 라우팅하는 가상 라우터 |\n| SD-WAN | SW 기반으로 WAN 트래픽을 중앙에서 제어·관리하는 기술 |\n| CX(Cloud eXchange) | 클라우드 간 또는 클라우드-기업망 간 고속·보안·직접 연결 중계 서비스 |\n| uCPE | 하드웨어 하나에 여러 VNF(방화벽·라우터·WAN 가속기 등)를 SW로 탑재한 고객 현장 장비 |\n### 생성: Cloud Last Mile 생성 → Circuit and Edge 생성\n- Cloud Last Mile 생성: 이름, **설치 권역**(뉴저지, 도쿄, 두바이, 런던, 마이애미, 북경, 산호세, 상암, 상파울로, 상해, 수원, 싱가포르, 첸나이, 프랑크푸르트, 하노이, 홍콩 등), 설치 주소, **계약 기간 1~7년**, **설치 요청일: 현재 기준 최소 2개월 후**\n- Circuit and Edge 생성: Cloud Last Mile 선택 → 자원 타입 **Circuit / Customer Edge**\n| 자원 타입 | 선택 | 입력 |\n|---|---|---|\n| Circuit | **SD-WAN** | 라이선스 **25Mbps ~ 1Gbps** |\n| Circuit | **VPN** | 회선 타입 **인터넷 / 전용선 / MPLS**, 회선 대역폭 **1~1,000** |\n| Customer Edge | **물리장비** | SD-WAN 물리 장비 제조사·성능: **소형(~100M), 중형(~1G), 대형(~5G)** |\n| Customer Edge | **가상자원** | uCPE 소·중·대, **VNF 3개 이하**(라우터, 가속기, 방화벽, SD-WAN별 사용 여부·제조사·성능) |\n\n## 3. Cloud LAN-Data Center\n### 구성요소\n| 구성요소 | 설명 |\n|---|---|\n| Cloud LAN Network | 인프라 내 논리적으로 분리된 네트워크 구성을 위한 가상 공간 |\n| vRouter | **외부 회선(L2, L3) 연결**용 가상 자원 |\n| vFirewall | Cloud LAN-DC 내 가상 방화벽 |\n| vCore | **Full Mesh 라우팅** 연결용 가상 자원 |\n| vSwitch | **고객 전용 H/W 연결 및 VLAN** 제공용 가상 자원 |\n| vL4/L7 | 가상 L4/L7 스위치 |\n| vCable | 가상 자원들 간 라우팅 연결용 가상 Cable |\n| Interface | vDevice에 H/W 장비·회선 연결이 가능한 물리 Interface |\n| vEdge | **uCPE 기반** 가상 엣지 자원, 라우터·가속기·방화벽 등 VNF 수용 |\n- 구축형 N/W 대비 **물리 장비 구성 부담은 낮추고**, 합리적 비용으로 고객 전용 N/W를 쉽고 빠르게 구현(물리 구성/논리 구성 예시).\n### 생성 순서: Cloud LAN Network → vDevice → Interface → vCable\n| 단계 | 입력 |\n|---|---|\n| Cloud LAN Network | 이름, 위치 |\n| vDevice | Network 선택, Type(vRouter, vSwitch, vFirewall, vCore 등). **vFirewall 외에는 이름만** 입력, vRouter·vSwitch는 Interface 생성에서 설정. **vFirewall**: 이름, 벤더사, Type(예: 1Gbps, 1,000 Rules), 이중화 여부, 로그 저장, 약정(무약정/1년/3년) |\n| Interface | vDevice Type(**vRouter, vSwitch**), vDevice명, Interface Type, Interface명(**최대 5개**), 이중화(**포트 2개 요금 과금**), 약정(무약정/1년/3년) |\n| vCable | Type **Static: vDevice 간 1:1** / **vCore: vDevice 간 Multi Peering**. Static이면 vDevice A는 vCore 제외, vCore Type이면 vDevice A는 vCore만 |\n\n## 4. Cloud WAN\n### 구성요소\n| 요소 | 설명 |\n|---|---|\n| Cloud WAN Network | 고객별 **가상 백본망** |\n| Segment | Network 내 용도별 **논리적 가상 라우팅 도메인** |\n| Attachment | SCP 또는 고객 사업장 전용선 Edge 자원 **연결 지점** |\n| Access Location | Segment 구성을 위한 **물리적 거점 위치** |\n| CE 장비 | 고객 사업장 전용선을 받아주는 네트워크 장비 |\n| **Site Connect** | 고객 사업장 전용선 자원(CE 장비) 연결용 Edge 연결 타입 |\n| **Transit Gateway** | **SCP Compute 자원** 연결용 Edge 연결 타입 |\n### 제공 기능\n- 신속한 백본 네트워크 구성(리전-거점, 거점-거점)\n- 다양한 Edge 연결 타입: **Compute 자원 → Transit Gateway**, **고객 로컬 회선 → Site Connect**\n- **다중 전송 경로 선택**: 실제 사용량만큼 과금, 트래픽 특성에 따라 **Gold/Silver** 선택해 비용 효율화\n- 서비스 수준별 차등 운영 관리\n### 생성: Cloud WAN Network → Segment → Attachment\n- Segment: Network 선택, Segment명, **Access Location은 하나씩만 선택**(추가는 상세정보 '연결된 자원' 탭에서 하나씩), 서비스 유형(글로벌 = 국내·해외 리전 간 연결, **LiteG / PremiumPlusG**), **약정 무약정/3/5/7년**, 다중 경로 선택\n- Attachment(Site Connect): 이름, **ASN 1~65,534**, **포트용량 100M/1G/10G**, **BGP Password**(고객 CE와 BGP 설정용). 고객 CE 라우터와 **SR 작업이 추가로 진행되어 최종 연결까지 수일** 소요\n\n## 5. Cloud Virtual Circuit (CVC)\n- 출시 배경: 기존 백본 회선 서비스(글로벌 망 접속, DWDM)와 Cloud WAN에서 접수된 고객 요구사항 개선.\n- 주요 기능\n  - 임의의 두 거점 간 **1:1 L2VPN 가상회선**. 거점: 한국(수원, 상암, 춘천, 구미, 논현), 글로벌(뉴저지, 산호세, 상파울루, 런던, 프랑크푸르트, 홍콩, 싱가포르, 델리, 두바이, 도쿄)\n  - 회선 대역폭 **10Mbps ~ 10Gbps**, 증감속 기능(**약정 시 증속만**)\n  - 이중화: **Virtual Circuit당 최대 2개 Virtual Link**\n  - Multi VLAN: 가상회선 하나로 용도별 분리, **Virtual Circuit당 최대 5개 VLAN**\n- 구성요소: Cloud Virtual Circuit(동일 1:1 거점에 Virtual Link 2개까지 수용), 출발지/목적지 Access Location, **Virtual Link**(전용 회선대역폭 기반 가상 회선: 대역폭·약정·전송경로 수준 선택), Multi VLAN. 양 끝의 집선용 CE는 **고객이 구성/운영**.\n- 신청: 콘솔 생성이 아니라 **Support Center 서비스 요청**(서비스 카테고리 Networking, 서비스 Cloud Virtual Circuit, 작업 구분 '**Cloud Virtual Circuit 신규 신청**')\n  - 사용자 정보: Account명, 회사/법인명, 신청자 이름, 용도, e-mail\n  - 서비스 정보: CVC명, 출발지/목적지 Access Location, Multi VLAN 사용 여부(사용 시 출발지/목적지 VLAN), Virtual Link명, 회선 대역폭, 약정 기간(**무약정, 1, 3, 5, 7년**), 전송경로 수준(Gold/Silver), 첨부파일\n\n> [!주의]\n> - CVC 대역폭: 개념 슬라이드(Cloud WAN/CVC 슬라이드12)는 10Mbps~10Gbps로만 적지만, 신청 양식(슬라이드18)은 '**한국 내 연결은 최대 10Gbps, 글로벌 연결은 최대 1Gbps**'라고 단서를 단다.\n> - 전송경로 수준은 Gold/Silver 중 선택이지만 양식에 \"'25년 9월 출시는 'Gold'만 선택 가능\"이라고 되어 있다. Silver는 이후 제공 예정으로 이해할 것.\n> - '기존 서비스와 비교'(슬라이드14), '활용 예시'(슬라이드15), LAN-DC 구성 예시(슬라이드27), Enterprise Network 개념도(1/2)는 그림만 있어 텍스트가 추출되지 않았다.\n\n## 비교 정리\n### Cloud WAN vs Cloud Virtual Circuit\n| 구분 | Cloud WAN | Cloud Virtual Circuit |\n|---|---|---|\n| 형태 | 고객별 가상 백본망(Segment·Attachment로 다수 거점) | 두 거점 간 **1:1 L2VPN** 가상회선 |\n| 연결 | Transit Gateway(Compute) / Site Connect(CE) | 출발지·목적지 Access Location + Virtual Link |\n| 생성 | 콘솔: Network → Segment → Attachment | **Support Center 서비스 요청** |\n| 전송 경로 | Gold/Silver 다중 경로 | Gold/Silver(현재 Gold만) |\n| 약정 | 무약정/3/5/7년 | 무약정/1/3/5/7년 |\n| 수치 | ASN 1~65,534, 포트 100M/1G/10G | 10Mbps~10Gbps, Link 2개, VLAN 5개 |\n\n### 기간·수치 혼동 정리\n| 서비스 | 약정/계약 | 대표 수치 |\n|---|---|---|\n| Cloud Last Mile | 계약 1~7년, 설치 요청일 최소 2개월 후 | SD-WAN 25Mbps~1Gbps, VPN 1~1,000, VNF 3개 이하 |\n| Cloud LAN-DC | vFirewall·Interface 무약정/1/3년 | Interface명 최대 5개 |\n| Cloud WAN | 무약정/3/5/7년 | ASN 1~65,534, 포트 100M/1G/10G |\n| CVC | 무약정/1/3/5/7년 | Link 2, VLAN 5 |\n| SASE(참고) | 무약정/3/5/7년, 수정 불가 | 사이트 10, 25~200Mbps |\n\n> [!시험]\n> - vCable **Static = 1:1**, **vCore = Multi Peering**. vCore 자원 = Full Mesh 라우팅, vRouter = 외부 회선(L2/L3), vSwitch = 고객 H/W·VLAN, vEdge = uCPE 기반 VNF.\n> - LAN-DC 생성 순서: Cloud LAN Network → vDevice → Interface → vCable.\n> - Cloud WAN: Compute는 **Transit Gateway**, 고객 CE는 **Site Connect**. Segment의 Access Location은 **하나씩**만 선택.\n> - CVC: **Virtual Link 최대 2개(이중화)**, **Multi VLAN 최대 5개**, 약정 시 증속만, Support Center로 신청.\n> - Last Mile: 회선+Edge **패키지로만** 제공. Secured SD-LAN NW Authentication은 사업장-리전 연결이 전제, 인증 단말 수량별 월과금.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·20·22, SD-LAN/Last Mile/SASE/LAN-DC 슬라이드1~18·25~35, Cloud WAN/CVC 슬라이드1~20\n"}, "3-1r": {"title": "Private 5G Cloud", "md": "## 한눈에 보기\n- **Private 5G** = 5G의 특징인 **초고속·초저지연·초연결**을 제공하면서 **특정 구역 내** 최적화된 서비스와 안전한 통신을 보장하는 **Private Wireless Network**의 일종.\n- **Private 5G Cloud** = **기업 고객**을 대상으로 **Private 5G Core, Edge 솔루션**을 제공하는 SCP 기반 서비스(5G 특화망 구현).\n- 신청은 콘솔 생성이 아니라 **Support Center 서비스 요청**. 사용 기간 **기본 3년**.\n- SCP와 고객 사업장 간은 **VPN 또는 전용회선**, **회선 연결은 고객 영역**.\n\n## 5G 네트워크 구성요소\n| 구성요소 | 역할 | 위치·특징 |\n|---|---|---|\n| **5G RAN (NG-RAN)** | 기지국과 단말기 간 5G 무선 통신 처리. 기지국·안테나·네트워크 제어장비 포함, Fronthaul 구간 무선 데이터 변환·최적화·송수신 | **내부시설에 설치** |\n| **5G Core (5GC/NGC)** | 패킷 전송·라우팅·외부망 연결 등 **데이터 처리** + 단말 인증·이동성 관리 등 **제어 기능** | User Plane / Control Plane으로 구분 |\n\n### User Plane vs Control Plane\n| Plane | 기능 | 역할 |\n|---|---|---|\n| User Plane | **UPF**(User Plane Function) | **실제 사용자 데이터 전송**. 지연 단축을 위해 **MEC(Mobile-Access Edge Computing)와 함께 위치**해 내부 통신 지연 최소화 |\n| Control Plane | **AMF**(Access & Mobility Management Function) | **단말기 이동성 관리** |\n| Control Plane | **SMF**(Session Management Function) | **세션 관리** |\n\n> [!팁]\n> 데이터를 나르는 것은 UPF 하나뿐(User Plane). AMF·SMF는 모두 Control Plane이다. 'AMF가 사용자 데이터 전송'은 전형적인 오답.\n\n## Private 5G Cloud 주요 기능\n| 기능 | 세부 내용 |\n|---|---|\n| 단말(Device) 등록 및 호처리 제어 | **Private 5G Core CP**가 단말의 등록·인증·구독 정책 등을 저장 및 관제. 호처리 프로세싱, 시그널링 암호화, 무결성 보호, 5G 정책 시행, QoS 제어 |\n| Edge 데이터 처리 | **UPF를 고객사(Edge)에 배치**해 대용량 고객 데이터 실시간 처리 및 보호. 데이터 라우팅, Up/Down Link 트래픽 감지/보고, QoS 시행 |\n| 다양한 서비스 환경 | **MEC 환경** 구성으로 초저지연 서비스, **MEC 표준 규격(3GPP Rel.17)** 지원, **K8S 환경** 제공으로 애플리케이션 관리 |\n| 회선 | SCP와 고객 사업장 간 **VPN 또는 전용회선**으로 구성 (**회선연결은 고객영역**) |\n\n구조 요약:\n```\n[고객 사업장]  단말 ─ 5G RAN(내부시설) ─ UPF/MEC(Edge, K8S)\n                                   │  VPN 또는 전용회선 (고객 영역)\n[SCP]                         Private 5G Core CP (등록·인증·정책·관제)\n```\n\n## 신청 절차 (Private 5G Cloud 서비스 요청 > Support Center)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | 제목 | |\n| 2 | 리전 | |\n| 3 | 서비스(자동 선택) | 서비스 카테고리 **Networking**, 서비스 **Private 5G Cloud** |\n| 4 | 작업 구분 | '**Private 5G Cloud 서비스 신청**' |\n| 5 | 기본정보 | 어카운트명, 고객정보(성명/소속회사/부서/E-mail/핸드폰번호), **서비스 게시 희망 일자** |\n| 6 | 신청정보 | **사용 목적(분야/응용서비스)** 예) 제조·의료·물류 / 드론·로봇·CCTV·영상분석, **사용 기간(기본 3년)** |\n| 7 | 첨부파일 | 필요시 업로드 |\n\n> [!주의]\n> 교재의 'Private 5G Cloud 특장점'(슬라이드7)과 '활용 예시'(슬라이드8)는 그림만 있어 텍스트가 추출되지 않았다. 모의고사 문항 중 'Private 5G: 인터넷 구간의 웹 공격을 L7에서 탐지·차단'은 WAF 설명이므로 오답이다.\n\n## 비교: 신청 방식이 Support Center인 네트워크 서비스\n| 서비스 | 작업 구분 |\n|---|---|\n| Private 5G Cloud | Private 5G Cloud 서비스 신청 |\n| Cloud Virtual Circuit | Cloud Virtual Circuit 신규 신청 |\n- 반대로 Cloud WAN, Cloud Last Mile, Cloud LAN-DC, SASE, Cloud Secured SD-LAN은 콘솔 생성 화면이 교재에 있다.\n\n> [!시험]\n> - UPF = User Plane, **실제 데이터 전송**, MEC와 함께 위치. AMF = 이동성, SMF = 세션(둘 다 Control Plane).\n> - 5G RAN은 **내부시설에 설치**. 5G Core는 데이터 처리 + 제어 기능.\n> - Core CP = 단말 등록·인증·구독 정책 저장·관제. **UPF를 고객사 Edge에 배치**.\n> - MEC 표준 **3GPP Rel.17**, **K8S 환경** 제공.\n> - 회선(VPN/전용회선)은 **고객 영역**. 신청은 **Support Center**, 사용 기간 기본 **3년**.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·22, Private 5G Cloud 슬라이드1~13\n"}, "3-1s": {"title": "SASE", "md": "## 한눈에 보기\n- **SASE(Secure Access Service Edge)** = 사용자가 **어디에서든** 안전하게 사내 자산과 애플리케이션에 접근하도록 **네트워크와 보안 기능을 클라우드 기반으로 통합** 제공하는 서비스(네트워크+보안 단일 플랫폼).\n- 3대 기능: **WAN Edge 네트워크(SD-WAN)**, **SSE 보안(ZTNA·SWG·CASB·FWaaS + RBI·DLP·SANDBOX)**, **Unified Orchestrator 및 DEM**.\n- 생성: 서비스 레벨 **Essential / Advanced / Premium**, 서비스 유형 **Agent Type / Edge Type**, 약정 **무약정·3·5·7년(신청 후 수정 불가)**.\n\n## 구성 요소\n| 구성 요소 | 설명 |\n|---|---|\n| **SASE 거점(POP)** | **삼성SDS Global POP과 CSP vPOP**을 활용해 Gateway와 제어부 구성. Gateway는 네트워크 연결 및 보안 정책 제공. **거점 간 연결은 SD-WAN** |\n| SASE Gateway 기능 | FW, SD-WAN, SWG, ZTNA, DLP, SANDBOX, CASB (SCP 리전 또는 Virtual PoP에 위치) |\n| **SASE 회선** | 고객 사이트와 SASE 거점 간 물리 회선. **인터넷/MPLS/전용선 기반 SD-WAN/VPN** 구성 |\n| **SASE Edge** | SASE 회선 연결을 위한 **고객 Edge 장비**(SD-WAN, VPN, Router) |\n| 고객사 사이트(Internal) | 라우터/SD-WAN/VPN 장비 |\n| 사외 Remote 워크스페이스(External) | 고객 자체 Endpoint 단말(PC/모바일 등), **Agent 또는 Agentless** 접속 |\n\n```\n[Remote 사용자 PC/모바일] --Agent/Agentless--┐\n[고객 사이트: SD-WAN/VPN/Router] --SASE 회선--┼--> SASE POP(Global POP, CSP vPOP)\n                                             │     Gateway: FW·SD-WAN·SWG·ZTNA·DLP·SANDBOX·CASB\n                                             └-- POP 간 SD-WAN 연결\n```\n\n## 제공 기능\n### WAN Edge 네트워크\n- Edge 장비(SD-WAN 장비, VPN 장비 등) 간 **Intra/Inter 리전 통신**\n- **SD-WAN**을 이용한 **애플리케이션별 최적 경로**\n- 고품질 네트워크를 위한 **트래픽 제어(QoS)** 및 **TCP 가속**\n\n### SSE(Secure Service Edge) 보안\n| 기능 | 설명 |\n|---|---|\n| **ZTNA** | 사내 애플리케이션에 **최소 권한** 부여, 보안 및 Private 연결 |\n| **SWG** | **인터넷으로부터 내부 사용자 보호**를 위한 Gateway 보안 |\n| **CASB** | 사용자와 **클라우드 애플리케이션 간** 기업 보안 정책 적용 |\n| **FWaaS** | **클라우드 방식 방화벽**으로 모든 서비스 트래픽 검사·제어 |\n| Advanced 보안 | **RBI, DLP, SANDBOX** 등 추가 제공 |\n\n### Unified Orchestrator 및 DEM\n- **Unified Orchestrator**: 클라우드, 온프레미스, Edge 장비의 **네트워크/보안 통합 관리**\n- **DEM(Digital Experience Monitoring)**: **사용자 경험 모니터링** — 네트워크 성능 저하, 앱 중단 등 문제 인지 및 원인 파악\n\n> [!팁]\n> DEM은 보안 기능이 아니라 '사용자 경험 모니터링'이다. 데이터 유출 방지는 **DLP**(Advanced 보안 기능). SWG는 '인터넷으로부터 내부 사용자 보호', CASB는 '클라우드 앱과의 사이', ZTNA는 '사내 앱 최소 권한'으로 키워드를 구분한다.\n\n## 생성 절차 (SASE 생성 화면)\n| 순서 | 항목 | 내용 |\n|---|---|---|\n| 1 | SASE명 | |\n| 2 | 서비스 레벨 | **Essential, Advanced, Premium**. 레벨별 제공 기능이 다르므로 필요한 레벨 선택 |\n| 3 | 서비스 유형: **Agent Type** | 사용할 에이전트 개수를 **1~10,000개 내에서 10개 단위**로 입력 |\n| 4 | 서비스 유형: **Edge Type** | **리전간 연결**이 필요하면 사용 체크, 사이트 **최대 10개** 추가, 사이트의 **상위국과 연결대역폭 25Mbps ~ 200Mbps** 선택 |\n| 5 | 약정 기간 | **무약정, 3, 5, 7년**. **신청 후 수정 불가** |\n\n학습정리 요약: SASE 서비스 생성(**Agent Type / Edge Type 선택**하여 생성).\n\n## 비교·연계\n| 구분 | SASE | Cloud Last Mile | Cloud Secured SD-LAN |\n|---|---|---|---|\n| 목적 | 어디서든 안전한 접근, 네트워크+보안 통합 | 사업장↔SCP 리전 회선 + Customer Edge | 사업장 내 인증 기반 유무선 LAN |\n| 주요 수치 | Agent 1~10,000(10단위), 사이트 10, 25~200Mbps | SD-WAN 라이선스 25Mbps~1Gbps, VPN 대역폭 1~1,000 | NW Authentication 인증 단말 수량별 월비용 |\n| 약정 | 무약정/3/5/7년(수정 불가) | 계약 1~7년 | NW Access 계약기간 설정 |\n- 교재 개념도에서 SASE는 Cloud Last Mile과 함께 '사업장 ↔ 클라우드' 연결 영역 역할로 묶인다.\n- 과금(WA 06): SASE는 **Provisioning / Per Hour** 모델로 분류된다.\n\n## 시나리오\n- \"국내외 지사 + 재택·해외 출장자가 어디서든 사내 앱에 안전하게, 네트워크와 보안을 단일 플랫폼으로\" → SASE.\n  - 원격 근무자: 단말에 **Agent 설치 또는 Agentless**\n  - 지사 간: **SD-WAN**(앱별 최적 경로, QoS, TCP 가속)\n  - 사이트↔거점 회선: 인터넷/MPLS/전용선 기반 SD-WAN 또는 VPN\n  - 통합 관리: Unified Orchestrator\n  - 오답 패턴: 'SASE Gateway를 각 지사의 물리 방화벽만으로 구성, POP 미사용' → Gateway는 **Global POP·CSP vPOP**에 구성된다.\n\n> [!시험]\n> - SASE 정의 키워드: '어디에서든', '네트워크와 보안 기능을 클라우드 기반으로 통합'.\n> - SSE 4종: ZTNA(최소 권한), SWG(인터넷으로부터 사용자 보호), CASB(클라우드 앱 정책), FWaaS(클라우드 방화벽). Advanced: RBI, DLP, SANDBOX. **DEM은 모니터링**.\n> - 거점 = 삼성SDS Global POP + CSP vPOP, 거점 간 SD-WAN.\n> - 서비스 레벨 Essential/Advanced/Premium. Agent 1~10,000개(10개 단위). Edge 사이트 최대 10, 25~200Mbps.\n> - 약정 무약정/3/5/7년, **신청 후 수정 불가**.\n\n출처: SCP_v2_Explore_Network_01-10.md Networking Service 슬라이드13·22, SD-LAN/Last Mile/SASE/LAN-DC 슬라이드7·19~24·35, WA백서 06 p.1\n"}, "1-1a": {"title": "사용자 인증, 조직단위 Account 구성 및 정책 관리 (ID Center, Organization)", "md": "## 한눈에 보기\n- **Landing Zone**: 멀티 Account 환경에서 보안과 거버넌스를 고려하여 클라우드 리소스를 안정적으로 운영할 수 있도록 구성된 **기본 토대**\n- **Organization**: Account를 **조직 단위(OU)** 로 구성하고 리소스 사용량과 **비용**을 관리하는 서비스 (통제 정책 ACP, 통합 청구)\n- **ID Center**: 사용자 계정 **접근 제어 통제 및 권한 관리** 서비스 (사용자·사용자 그룹, **권한 세트**, **Access Portal**)\n- 구성 순서: **조직 단위 생성 → Account 추가 → ID Center 설정 → 권한 세트 관리 → Account 할당**\n\n## 배경: 멀티 Account 환경에서 자주 나오는 질문\n- Account가 늘어날수록 어떻게 **일관된 방식**으로 리소스를 관리할까?\n- 누가 어떤 Account에 접근할 수 있는지 효과적으로 **통제**하려면?\n- Account마다 다른 정책이 적용되면 **거버넌스와 보안 관리**는 어떻게 할까?\n\n이 질문에 대한 SCP의 답이 Landing Zone이며, 그 핵심 부품이 Organization(Account 구조·정책·비용)과 ID Center(사람·권한)이다. 학습목표는 ① 멀티 Account 구조와 중앙 권한 관리를 통한 Landing Zone 구성 원리 이해, ② Organization 및 ID Center 생성, 권한 세트 구성, Account 할당 등 주요 설정 수행이다.\n\n### Landing Zone의 세 가지 요소\n| 요소 | 내용 |\n|---|---|\n| 조직 단위 기반 Account 구조 | OU > Account > Policy Scope |\n| 표준화된 통제 정책 설정 | OU에 통제 정책(ACP)을 연결해 일괄 적용 |\n| 신규 Account 생성 표준화 | Organization에서 Account 생성·초대 |\n\n→ 확장 가능하고 안전한 클라우드 운영을 위한 기반 제공\n\n## Organization\nAccount를 조직 단위로 구성하고 리소스 사용량과 비용을 관리하는 서비스.\n\n| 특징 | 설명 |\n|---|---|\n| 계층적 조직 관리 | 조직 전체 Account들을 중앙에서 관리. 조직 내 Account를 논리적으로 그룹화하고 그룹별로 자원 접근 정책 제어 |\n| 조직 단위 거버넌스 | 조직 단위에 따라 필요한 정책을 **Access Control Policy(ACP)** 로 구성. 개별 Account마다 적용하지 않아도 **조직 하위의 모든 Account에 정책 일괄 적용** |\n| 효율적인 리소스 관리 | 조직 내 모든 멤버 Account에서 발생한 비용과 자원 사용 정책을 중앙에서 통합 관리. **통합 청구**를 통해 비용 최적화 |\n\n### 구성 요소와 OU 배치 예시\n- **Organization Root**: 조직 내 모든 Account에서 발생한 비용과 자원 사용 정책을 중앙에서 통합 관리\n- **Organization Unit(OU)**: 관리하려는 Account를 논리적으로 그룹화하여 조직 구조 형성 → 계층적 조직 구성 후 목적에 맞게 Account 배치\n- **통제 정책(ACP, Access Control Policy)**: 각 **OU에 연결**, 규정 준수와 관련된 설정 사항을 정책으로 관리\n\n| OU | 배치 Account |\n|---|---|\n| Security OU | **Audit**, **Log** Account |\n| Common OU | **Shared**, **Network** Account |\n| Workload OU | **Dev.**, **Production** Account |\n| Sandbox OU | **Sandbox** Account |\n\n> [!시험]\n> Log·Audit Account는 보안·감사 목적이므로 **Security OU**. Network·Shared는 Common, Dev·Production은 Workload. \"Workload OU – Log Account\" 같은 배치는 오답이다. 감사 로그를 Production Account에 섞어 두는 설계도 권한 분리·무결성을 깨므로 부적절하다.\n\n## ID Center\n사용자 계정 접근 제어 통제 및 권한 관리 서비스.\n\n### 동작 구조\n```\n사용자 → Access Portal → ID Center\n   (사용자 그룹1: IDC 사용자1~3 / 사용자 그룹2: IDC 사용자4~6 → 권한 세트1·2·3)\n → Organization\n   (Account 1 + 권한 세트1 → 자원 관리 / Account 2 + 권한 세트2 → 자원 관리)\n```\n\n| 주요 기능 | 내용 |\n|---|---|\n| 인증 정보 통합 관리 | ID Center 자체적으로 사용자를 생성하고 사용자 그룹으로 통합 관리. **권한 세트**를 통해 ID Center 사용자에게 **Account별 접근 권한** 설정 |\n| 효율적인 리소스 관리 | 여러 Account의 자원 접근 권한을 ID Center로 **중앙 집중 제어**. Organization과 연동하여 Account별 비용·자원 사용 정책 통합 관리 |\n| 강력한 접근 통제 | 조직 내 사용자를 위한 별도 **Access Portal** 제공. 사용자에게 **할당된 Account와 권한 세트로만** 자원 접근 가능 |\n\nWA 보안성 백서도 ID Center를 \"Account별 자원에 대한 접근 권한을 중앙에서 손쉽게 관리할 수 있는 서비스\"로 설명한다. 서비스별로 권한 정책을 만든 뒤 사용자에게 Organization과 연계된 Account와 정책을 할당해 권한에 맞는 업무를 수행하게 한다.\n\n## Landing Zone 구성 프로세스\n1. 조직 및 조직 단위(OU) 생성\n2. 조직 단위에 추가할 신규 Account 생성 또는 기존 Account 초대\n3. ID Center 생성 및 사용자, 사용자 그룹 추가\n4. 권한 세트(Permission Set) 생성\n5. 사용자나 사용자 그룹에 Account 할당\n\n> [!시험]\n> 순서 문제: **OU 생성 → Account 추가 → ID Center(사용자·그룹) → 권한 세트 → Account 할당**. 할당은 Account·사용자·권한 세트가 모두 준비된 뒤 **마지막**이다.\n\n## 설정 절차 상세\n\n### 1) 조직·조직 단위 생성\n- 조직 생성: **조직명** 입력\n- 하위 조직 단위 생성 화면\n  - **계층 구조 보기** 모드와 **Account 목록 보기** 모드 제공\n  - 선택한 조직 단위의 하위에 새로운 조직 단위 추가, Account 추가\n- 하위 조직 단위 입력: ① **조직 단위명** ② 조직 단위에 연결할 **통제 정책** 선택 (연결할 통제 정책이 없으면 신규 통제 정책 등록을 먼저 진행 가능)\n\n### 2) Account 추가\n| 구분 | 신규 Account 생성 | 기존 Account 초대 |\n|---|---|---|\n| 의미 | Account(Root 사용자)를 새로 생성하여 추가 | 기존에 생성된 Account의 Root 사용자 이메일을 입력하여 추가 |\n| 입력 항목 | **Account명, 이메일 입력 및 확인, IAM 역할명** | **Root 사용자 이메일만** |\n| 기타 | - | 추가 버튼으로 **최대 10개까지 동시 초대** |\n\n- 초대받은 Account 소유자는 **이메일**로 받은 초대 요청을 확인하거나, SCP 콘솔 로그인 후 **'받은 초대'** 메뉴에서 확인한다.\n\n### 3) ID Center 설정\n**ID Center 생성**\n1. ID Center명 입력\n2. 자격 증명 소스 선택\n\n| 자격 증명 소스 | 설명 |\n|---|---|\n| ID Center 디렉토리 | ID Center 내 디렉토리 사용 |\n| 외부 자격 증명 소스 | 외부 자격증명 메타데이터 사용 (2025년 하반기 예정) |\n\n3. ID Center 생성 시 **자동으로 Organization과 연결**된다.\n4. **Access Portal 사용을 위해서는 SR을 통해 Access Portal URL 사용 신청이 필요**하다. (ID Center 설정 메뉴에서 상세 정보 확인)\n\n> [!주의]\n> 외부 자격 증명 소스는 Landing Zone 활용가이드(슬라이드19)에 \"2025년 하반기 예정\"으로 표기되어 있다. 한편 Cloud Control 교재(슬라이드41)는 자격 증명 소스 유형을 \"ID Center 내 자체 디렉토리 / AD(Active Directory, 사용자가 직접 관리하는 AD)\"로 표시한다. 시험 기준 시점('26.7 릴리즈)의 정확한 지원 범위는 교재 간 표기가 다르므로 단정하지 말 것.\n\n**사용자 그룹 추가**: 사용자 그룹을 통해 사용자와 Account를 연결한다.\n1. 사용자 그룹명 입력\n2. 그룹에 추가할 사용자 선택 (없으면 신규 사용자 등록 먼저 진행)\n\n**사용자 추가**: 관리자는 사용자를 생성해 사용자 그룹에 추가하고, 사용자에게 Access Portal 접속 정보를 제공하며, 업무에 맞는 사용자를 Account에 할당한다.\n1. 사용자명 입력\n2. 비밀번호 생성 방법: **자동 생성**(사용자 생성 시점에 확인 가능) / **직접 입력**\n3. 사용자 **실명** 입력\n4. **소속 정보** 입력: 사업부, 부서, 관리자, 사번\n5. 사용자를 포함시킬 사용자 그룹 선택 (없으면 신규 그룹 생성 가능)\n6. Access Portal 로그인 정보 팝업에서 **Access Portal URL, 사용자명, 비밀번호** 확인\n\n### 4) 권한 세트 생성\n각 Account에 존재하는 기본 정책·사용자 정의 정책을 이용하거나 직접 정책을 구성해 권한 세트를 만든다. 권한 세트는 사용자 및 그룹이 보유할 수 있는 SCP 계정에 대한 **액세스 수준**을 정의한다.\n1. 권한 세트명 입력\n2. **최대 세션 지속시간**: Access Portal을 통해 Console에 진입할 때 사용자에게 허용되는 세션 시간. **최소 1시간 ~ 최대 12시간**, 초 단위 입력 가능\n3. 사용할 정책 선택\n\n| 정책 유형 | 동작 |\n|---|---|\n| 기본 정책 | SCP Console에서 제공하는 기본 정책을 연결 |\n| 사용자 정의 정책 | Account 하위에 생성된 사용자 정의 정책의 **이름을 직접 입력**. 입력한 정책명과 **일치하는 IAM 정책명이 없는 Account에는 권한 세트 적용 불가** |\n| 인라인 정책 | 권한 세트에 적용할 정책을 직접 설정 (IAM 정책 작성 화면과 동일한 구성) |\n\n인라인 정책 설정 항목은 IAM 정책과 같다(상세는 1-1d).\n- 기본 모드/JSON 모드 제공. JSON 모드 진입 또는 화면 이동 시 통제 요건이 중복 설정된 서비스는 통합, 설정 미완료 서비스는 삭제\n- 제어 유형: 허용 정책(접근 허용)/거부 정책(접근 거부), **동일 대상에는 거부 정책 우선**\n- 액션: 개별 자원 선택 가능 액션은 **보라색**, 모든 자원 대상 액션은 **검은색**. 액션 직접 추가 시 Wildcard 사용 가능\n- 적용 자원: 모든 자원 / 개별 자원(보라색 액션 선택 시에만)\n- 인증 유형: 전체 / 인증키 인증 / 임시키 인증, Console 로그인. 적용 IP: 사용자 지정 IP / 모든 IP\n\n### 5) Account 할당\n각 사용자에게 Organization과 연계된 Account와 정책을 할당해 권한에 맞는 업무를 수행하도록 관리한다.\n1. 할당할 Account 선택 후 **사용자 또는 그룹에 할당** 클릭\n2. 사용자 또는 사용자 그룹 선택: **반드시 1개 이상** 선택\n3. Account에 적용할 **권한 세트** 선택 (없으면 신규 등록 진행)\n\n## 사용자 인증 관점 정리 (WA 보안성)\n- SCP는 Console 접근 보안을 위해 강력한 사용자 인증을 기본 제공: 사용자는 **다중인증(MFA)을 반드시 수행**, 인증키 사용 시 접근 가능한 **IP 대역 지정**으로 무단 접근 차단\n- 관리자는 IAM 정책으로 접근 권한을 업무 범위로 제한하고, 제어 항목·액션·자원 유형·인증 방식·IP에 대한 세밀한 정책으로 최소 권한 적용. 중앙 **권한 관리 대시보드** 제공\n- **자격 증명 공급자(IdP)**: 타사 IdP와 SCP IAM을 연동. 사전에 등록된 타사 IdP의 인증 정보(**SAML, OIDC** 등)로 Console에 자격 증명 전달. **SSO** 사용 시 한 번의 인증으로 여러 서비스 접근. 기존 인증 서비스가 있으면 사용자 정보를 별도 관리하지 않고 변경을 신속히 반영할 수 있어 효율적\n\n## 비교: 세 가지 \"정책\"\n| 구분 | 연결 대상 | 범위 | 비고 |\n|---|---|---|---|\n| ACP(통제 정책) | Organization의 **OU** | OU 하위 모든 Account 일괄 | 규정 준수 설정 관리 |\n| 권한 세트 | ID Center 사용자/그룹 + Account 할당 | 할당된 Account | 세션 1~12시간 |\n| IAM 정책 | 사용자, 사용자 그룹, 역할 | 단일 Account 내 | 기본/사용자 정의 |\n\n> [!시험]\n> - ID Center 생성 → Organization **자동 연결**, 그러나 **Access Portal URL은 SR 신청 필요**(자동 발급 아님)\n> - 권한 세트 최대 세션 지속시간 **1~12시간**(Access Portal로 Console 진입 시)\n> - 기존 Account 초대: **Root 사용자 이메일만**, **최대 10개 동시**, 수락은 메일 또는 '받은 초대'\n> - 신규 Account 생성: Account명 + 이메일 + **IAM 역할명**\n> - 권한 세트의 사용자 정의 정책은 **이름이 일치하는 IAM 정책이 있는 Account에만** 적용(자동 생성 안 됨)\n> - Organization: ACP를 OU에 연결해 일괄 적용, **통합 청구** 지원\n> - ID Center 사용자 소속 정보: 사업부, 부서, 관리자, 사번\n\n출처: ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드1~39, ExploreManagement_3_Cloud_Control 슬라이드41, WA백서 02 p.11~14"}, "1-1b": {"title": "인증키 / 임시키 관리", "md": "## 한눈에 보기\n- SCP를 포함한 클라우드 서비스는 **REST API 기반**으로 작동한다. Console이든 CLI든 서비스 실행을 위해 API 호출이 이뤄진다.\n- **Console** 접근은 **MFA(다중 인증)** 로 보호된다. **CLI·Open API** 작업에는 **인증키가 반드시 필요**하며, 인증키는 MFA처럼 관리할 수 없으므로 **별도 관리**가 필요하다.\n- 설계 원칙: ① 인증키 **만료 기간**과 **접속 IP 주소**를 지정 ② **임시키** 사용\n- 임시키는 **Secret Vault**가 Token 기반으로 발급·수명주기 관리한다.\n- IAM 정책의 **인증 유형**(전체 / 인증키 인증 / 임시키 인증, Console 로그인)과 **적용 IP**로 인증 방식별 접근을 제어한다.\n\n## 배경: 왜 인증키를 따로 관리해야 하나\n| 접근 도구 | 인증 수단 | 보안 포인트 |\n|---|---|---|\n| Console | 로그인 + **MFA 본인 인증** | 가장 기본 도구. 접속 시 다중 인증 수행 |\n| CLI | **인증키** | Console MFA와 별개. 유출 시 바로 악용될 수 있음 |\n| Open API | **인증키** 또는 **임시키** | Application에서 호출. 임시키 권장 |\n\nWA 보안성 백서의 표현: \"Console에 접근할 때는 접근 보안을 위해 다중 인증을 수행하지만, **인증키는 동일하게 관리할 수 없기 때문에** 인증키에 대한 별도의 관리와 주의가 필요합니다.\"\n\n> [!주의]\n> \"Console에 MFA가 적용되므로 같은 사용자가 발급한 인증키에도 MFA가 함께 적용된다\"는 **틀린** 진술이다. 인증키에는 MFA가 적용되지 않으므로 만료 기간, IP 제한, 임시키로 보완한다.\n\n## 인증키 관리 설계 원칙 (WA 보안성 «모범 사례»: 인증키를 안전하게 관리하고, 유출에 대비합니다)\n1. **인증키 만료 기간과 접속 IP 주소를 지정**하여 접근 보안을 강화한다.\n  - 유출 위험에 대비해 **영구 인증키 사용은 지양**하고 키의 **유효 기간을 지정**한다.\n  - 접속 가능한 **IP 주소를 제한**한다. (인증키 사용 시 접근 가능한 IP 대역을 지정해 외부 무단 접근을 원천 차단)\n2. **임시키를 사용**하여 보안을 강화한다.\n  - 인증키를 직접 쓰는 대신 **Secret Vault**로 **Token**을 발행하고 **임시키**로 인증한다.\n\n## IAM 정책에서 인증 방식 제어\nIAM 정책(및 ID Center 권한 세트의 인라인 정책) 작성의 마지막 단계에서 **인증 유형**과 **적용 IP**를 지정한다.\n\n| 인증 유형 | 적용 대상 |\n|---|---|\n| 전체 | 인증 방식과 상관없이 적용 |\n| 인증키 인증 | **인증키로 인증한 사용자**에게 적용 |\n| 임시키 인증, Console 로그인 | **임시키로 인증한 사용자**나 **Console 로그인한 사용자**에게 적용 |\n\n| 적용 IP | 설명 |\n|---|---|\n| 사용자 지정 IP | 사용자가 IP를 직접 등록하여 관리 |\n| 모든 IP | IP 접근 제한을 하지 않음 |\n\n> [!시험]\n> \"인증키를 이용한 CLI·Open API 호출에만 삭제를 거부하고 Console 로그인 사용자에게는 적용하지 않으려면?\" → 거부 정책 + 인증 유형 **'인증키 인증'**. '임시키 인증, Console 로그인'은 정반대 대상이다.\n\n## 임시키와 Secret Vault (개념·연계)\n**Secret Vault**: 보안이 강화된 **Token 기반 임시키**를 발급받아 SCP 서비스 및 자원에 접근할 수 있는 서비스. 임시키의 **수명주기**를 관리해 API 활용 시 보안 환경을 유지한다. (서비스 상세는 4-2g에서 다룸)\n\n### 발급·사용 흐름\n1. 사용자는 사전에 **SCP Console에서 발급받은 인증키** 정보로 Secret Vault에 **Token을 요청**하고, Secret Vault가 Token을 생성하여 발급한다.\n2. 발급받은 **Token을 Application에 설정**한다.\n3. **Token 정보로 API를 호출해 OpenAPI 임시키를 발급**받는다.\n4. 발급받은 **OpenAPI 임시키로 SCP 서비스 및 자원에 접근**한다.\n\n```\n인증키(Console 발급) → [Secret Vault] Token 발급 → Application에 Token 설정\n → Token으로 OpenAPI 임시키 발급 → 임시키로 SCP 자원 접근\n```\n\n> [!시험]\n> 순서: **인증키 발급 → Token 요청·발급 → Token을 Application에 설정 → 임시키 발급 → 자원 접근**. 인증키는 Token 발급에, Token은 임시키 발급에 쓰인다.\n\n### 함께 알아둘 Secret Vault 수치 (SEC4 교재)\n| 항목 | 내용 |\n|---|---|\n| 주요 기능 | 인증키로 Token 발급, Token으로 임시키 발급 / 인증키 정보 **AES-256** 암호화 저장 / 임시키 발급·**자동 교체** / 애플리케이션 구동 자원의 **IP 기반 접근제어** |\n| 임시키 교체 주기·사용 기간 | 시간 단위, **최대 36시간(1.5일)** |\n| Token 구성 | **Token ID + Token Secret** (OpenAPI 임시키를 받기 위한 인증 수단) |\n| Token 사용 기간 | 인증키 유효 기간이 영구이면 최대 **7,300일(20년)**, 신청 후 **변경 불가**. 만료되면 임시키 발급 불가 → 신규 신청으로 Token 재발급 |\n| 신청 제약 | **인증키 1개당 Secret Vault 1개** |\n| 사전 설정 | 인증키 관리 메뉴에서 보안 인증방식을 **임시키 인증**으로 선택, 접근 허용 IP는 인증키 관리 > 보안설정 > 접근 허용 IP에도 **동일하게** 설정 |\n| 암호화 대상 유형 | \"SCP Open API Key\" |\n\n## IaC 도구의 인증키\n- WA 운영우수성 백서: SCP에서 **Terraform 작업용 인증키를 생성**하고 환경 설정을 완료한 뒤 코드를 작성해 kr-west1·kr-east1 Region에 VM을 배포한다.\n- 이 인증키 역시 **만료 기간과 접속 IP를 지정**해 보호한다. (1-2a 참고)\n\n## 관련 IAM 기본 정책·역할\n- **StsAssumeRolePolicy**: 서비스 계정 및 사용자에게 연결하여 **역할을 수임**할 수 있는 권한 → 역할(Role)은 임시로 권한을 받아 쓰는 방식(1-1c)\n- 역할·권한 세트의 **최대 세션 지속시간 1~12시간**도 \"임시\" 권한의 수명 관리 장치다.\n\n## 시험 포인트 요약\n> [!시험]\n> - CLI·Open API = **인증키 필수**. Console = MFA. Console 작업도 내부적으로 **API 호출**\n> - 인증키 보안 3종: **만료 기간 지정**(영구 키 지양), **접속 IP 제한**, **임시키(Secret Vault)**\n> - 인증 유형 3종 중 '인증키 인증'과 '임시키 인증, Console 로그인'의 대상 구분\n> - Secret Vault 흐름 순서, 임시키 최대 36시간, 인증키 1개당 Secret Vault 1개\n\n출처: WA백서 02 p.11~13, ExploreManagement_1_IAM 슬라이드10, 18, ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드33, SEC4_KMS_SecretVault_SecretsManager 슬라이드23~27, 48, WA백서 05 p.13"}, "1-1c": {"title": "사용자, 그룹, 역할 관리", "md": "## 한눈에 보기\n- **IAM(Identity and Access Management)**: SCP에 등록된 사용자의 **본인 여부 확인** 및 **접근 권한 부여**를 통해 **Account 내**에서 서비스·자원에 접근 가능한 범위를 제어하는 서비스\n- 구성요소 4가지: **사용자, 사용자 그룹, 정책, 역할**\n- 권한관리 프로세스: **정책 설정 → 권한 주체 생성 및 관리 → 정책 연결**\n- 정책은 **사용자, 사용자 그룹, 역할**에 연결할 수 있다(사용자 직접 연결도 가능). 운영상으로는 **그룹 단위(RBAC)** 관리가 권장된다.\n\n## 배경: 계정·권한 관리 시 가장 많이 하는 질문\n- 누가 어떤 자원을 가지고 있고, 누가 그 자원에 접근할 수 있나요?\n- 자원에 대한 액세스 위험을 어떻게 완화할 수 있나요?\n- 액세스 관리를 어떻게 효과적으로 할 수 있나요?\n\nIAM 학습목표: 구성요소(사용자, 사용자 그룹, 정책, 역할)의 역할과 관계를 이해하고, 콘솔에서 직접 생성·연결할 수 있다.\n\n## IAM 개요\n관리자(Root 사용자)가 Account 안에서 사용자, 사용자 그룹, 정책, 역할을 생성 → 사용자 그룹(사용자 1·2·3)에 정책을 연결, 역할에 정책을 연결 → 리소스 접근.\n\n| 특징 | 내용 |\n|---|---|\n| 사용자 그룹별 권한관리 | 업무 목적에 따라 사용자를 그룹에 매핑하여 접근 권한을 업무에 필요한 부분으로 한정 |\n| 최적화된 접근제어 정책 운용 | **최소 권한 정책** 적용. 서비스별 제어 유형, 액션(CRUD) 지정, 인증방식 적용, IP 접근제어 등으로 세밀하게 부여 |\n| '역할'을 통한 임시 접근 허용 | 특정 **Account ID 또는 SRN** 정보를 연계해 역할 부여 → 해당 사용자는 역할의 권한을 받아 특정 자원에 **제한적으로** 접근 |\n\n- SRN: **Samsung Resource Name**\n- IAM 제공 기능(학습정리): **사용자 인증, 권한 관리, 역할 관리, 자격 증명 공급자 제공, 접근 제어 정책 관리**\n- IAM은 \"리소스에 대한 사용자의 접근 권한을 정의하고 제어하는 엔터프라이즈 레벨의 자격증명 및 권한 관리 서비스\"로, 세분화된 권한 할당으로 **공격 피해 범위를 줄인다**.\n\n## 구성요소\n| 구성요소 | 정의 |\n|---|---|\n| 사용자(User) | SCP에 로그인하는 사람 |\n| 사용자 그룹(Group) | **동일한 권한**을 부여받은 사용자들의 집합. 정책과 사용자를 연결하는 기능 |\n| 정책(Permission) | 누가 어떤 리소스에 어떤 작업을 할 수 있는지 명시. 액세스 허용·거부 규칙 정의 (1-1d) |\n| 역할(Role) | 특정 권한을 가진 사용자에게 **임시 권한**을 부여하는 기능 |\n\n## 권한관리 프로세스\n| 단계 | 하는 일 |\n|---|---|\n| 1. 정책 설정 | 권한을 정의하는 핵심 기능. 사용자에게 어떤 액션을 허용 또는 금지할지 설정 |\n| 2. 권한 주체 생성 및 관리 | 사용자, 사용자 그룹, 역할 생성. 업무 목적에 따라 사용자를 그룹 및 역할에 매핑 |\n| 3. 정책 연결 | 정책을 개별 사용자, 사용자 그룹, 역할에 연결. 기본 정책 또는 사용자 정의 정책 연결 |\n\n## 사용자 그룹 생성 (3단계)\n1. **기본 정보 입력**: 사용자 그룹명\n2. **사용자 추가**: 사용자 목록에서 그룹에 추가할 사용자 선택. 추가하려는 사용자가 없으면 **신규 사용자 등록을 먼저** 진행 가능\n3. **정책 연결**: 정책 목록에서 그룹에 연결할 정책 선택. 연결하려는 정책이 없으면 **신규 정책 등록을 먼저** 진행 가능\n\n## 사용자 생성 (3단계)\n- 생성 주체: **관리자(Root 사용자)** 또는 Root 사용자로부터 **IAM 사용자 생성 권한을 부여받은 IAM 사용자**\n- 권한 부여 방법: **사용자 그룹에 추가하여 정책을 연결**하거나, **사용자에게 정책을 직접 연결** 가능\n\n1. **기본 정보 입력**\n  - 사용자명 입력\n  - 비밀번호 생성 방법\n\n| 방법 | 설명 |\n|---|---|\n| 자동 생성 | 비밀번호 자동 생성, **사용자 생성 시점에 확인 가능** |\n| 직접 입력 | 비밀번호 직접 생성 |\n\n2. **권한 설정**: Account에 등록된 사용자 그룹 중 사용자를 포함시킬 그룹 선택 (없으면 신규 그룹 생성 먼저)\n3. **권한 복사(직접 연결)**: 정책 목록에서 사용자에게 **직접 연결할 정책** 선택 (없으면 신규 정책 등록 먼저)\n  - 생성 후에는 사용자 상세 페이지 → **권한 탭** → **권한 추가** 버튼으로 연결\n  - 화면 예: IamUserChangePassword, IP_ACL, OperatorAccess\n\n> [!주의]\n> WA 보안성 백서에는 \"SCP에서는 기본적으로 사용자에게 권한을 부여하지 않고, 그룹에 권한을 부여합니다\"라는 문장이 있다. 이는 **권장 운영 방식**에 대한 설명이며, IAM 교재(슬라이드22, 24)는 사용자에게 **정책 직접 연결이 가능**하다고 명시한다. \"반드시 그룹을 거쳐야만 권한을 받을 수 있다\"는 오답이다.\n\n## 역할 생성 (3단계)\n역할은 **별도 권한을 지닌 가상의 사용자 정보**로, **본래 사용자 계정이 가진 권한에 영향을 받지 않는다**.\n\n1. **기본 정보 입력**\n  - 역할명\n  - **최대 세션 지속시간**: **최소 1시간 ~ 최대 12시간**, 초 단위 입력 가능\n2. **수행 주체 연결**: 역할을 수행할 주체의 Account ID, 사용자 SRN, 자격 증명 공급자 중 선택\n\n| 수행 주체 유형 | 입력 |\n|---|---|\n| 현재 Account | 현재 Account ID 표시 |\n| 다른 Account | 이 역할을 사용할 **Account ID** 입력 |\n| 사용자 SRN | 콘솔에 등록된 사용자의 **SRN** 입력 |\n| 자격 증명 공급자 | 자격 증명 공급자명 선택 |\n| 서비스 | **API Gateway, Config Inspection** 선택 가능 |\n\n3. **정책 연결**: 역할에 연결할 정책 선택 (없으면 신규 정책 등록 먼저)\n\n> [!시험]\n> 수행 주체 '서비스'에서 고를 수 있는 것은 **API Gateway, Config Inspection** 둘뿐이다. \"Virtual Server, Kubernetes Engine 등 모든 서비스\"는 오답.\n\n## IAM 사용자 vs ID Center 사용자\n| 구분 | IAM 사용자 | ID Center 사용자 |\n|---|---|---|\n| 범위 | 하나의 Account 내부 | Organization의 여러 Account |\n| 권한 부여 | 정책을 사용자/그룹/역할에 연결 | 권한 세트 + Account 할당 |\n| 접속 | SCP Console | **Access Portal** |\n| 세션 시간 설정 | 역할: 1~12시간 | 권한 세트: 1~12시간 |\n\n## 운영 모범 사례 (WA 보안성)\n### 긴급 접속 허용 프로세스\n- Account 내 최상위 권한은 **AdministratorAccess** 정책이다. 이 정책이 연결된 **유일한** 사용자가 유고, 휴대전화 파손·분실 등으로 인증 불가가 되는 상황에 대비해야 한다.\n- 가장 효과적인 대응: 조직 내 계정 관리자에게 요청해 AdministratorAccess가 연결될 그룹에 **새 사용자 추가**\n- 또 다른 방안: AdministratorAccess가 연결된 사용자 그룹에 **주 관리자와 보조 관리자를 함께 지정**\n\n### 최소 허용의 원칙과 지속적 검토\n- 권한 정책은 사용자 또는 사용자 그룹에 연결될 수 있고, 그룹에 포함된 사용자는 그룹 정책을 **상속**받는다.\n- 모범 사례: **과업 수행에 필요한 권한이 연결된 사용자 그룹에서 사용자를 관리**한다.\n  - 입사·퇴사·부서 이동이 잦으면 사용자 직접 연결 방식은 업무 과중과 **변경 누락** 위험을 키운다.\n  - 사용자에게 직접 연결하는 것을 **최소화**하고, 그룹에 권한을 연결한 뒤 사용자를 **등록·해제**한다.\n  - 사용자 단위 검토보다 그룹에 적합한 사용자가 있는지 확인하는 것이 효율적\n  - Console 및 API에 접근하는 단말의 **IP 주소 지정**으로 인증 정보 유출·사외 규정 위반 작업 차단\n- 설계 원칙: ① 사용자를 정기적으로 검토 ② 그룹의 사용자를 정기적으로 검토 ③ 사용자 접근 IP 지정\n\n### 역할 기반 그룹 관리(RBAC)\n- 그룹은 보통 **부서나 프로젝트 팀** 단위로 구성(동일한 보안 요구사항)\n- 공통 보안 요구사항을 가진 사용자를 계획된 그룹에 배치하고, 권한 변경 시 그룹 추가/이동/그룹 계획 수정 중 적절한 방법 검토\n- 프로젝트 구축 기간에 모든 사용자에게 관리자 권한을 줬다면 완료 후 작업 범위에 맞게 **축소**해야 한다. 미사용 자격 증명과 권한은 정기 검토로 제거\n\n> [!시험]\n> - 역할 = 가상의 사용자, 본래 권한과 무관, 세션 **1~12시간**, 수행 주체 5유형\n> - 사용자 생성 권한: Root 또는 생성 권한을 받은 IAM 사용자\n> - 비밀번호 자동 생성 → 생성 시점에 확인\n> - 그룹·사용자·역할 생성 중 대상이 없으면 **신규 등록을 먼저** 할 수 있다\n> - 인사 변동이 잦을수록 **그룹 단위 관리**가 정답, 사용자별 직접 연결은 오답\n> - 관리자 휴대폰 분실 사고 대비 → AdministratorAccess 그룹에 **주·보조 관리자**\n\n출처: ExploreManagement_1_IAM 슬라이드1~29, WA백서 02 p.11, 14~16"}, "1-1d": {"title": "권한관리 정책 생성, 수정", "md": "## 한눈에 보기\n- **정책**: 누가 어떤 리소스에 어떤 작업을 할 수 있는지 명시하고, 액세스를 **허용하거나 거부**하는 규칙을 정의. 권한을 정의하는 **핵심 기능**\n- 종류: **기본 정책**(SCP 사전 정의, 수정 불가) vs **사용자 정의 정책**(직접 생성·수정)\n- 기본 정책 **27개** ('26.7월 기준)\n- 작성 항목: 기본 정보 → 서비스 → (불러오기/JSON) → **제어 유형** → **액션** → **적용 자원** → **인증 유형·적용 IP**\n- **동일 대상에는 거부 정책이 우선**\n\n## 정책의 종류\n| 비교 항목 | 기본 정책 | 사용자 정의 정책 |\n|---|---|---|\n| 생성 주체 | SCP에서 사전 정의 | 사용자가 직접 생성 |\n| 수정 가능 여부 | **수정 불가(읽기 전용)** | 사용자가 직접 수정 |\n| 재사용 | 여러 주체에 재사용 가능 | 여러 주체에 재사용 가능 |\n| 사용 목적 | 빠른 시작, 범용 권한 제공 | 조직 정책 맞춤화, 제한/확장 설정 |\n\n## IAM 기본 정책 목록 (27개, '26.7월 기준)\n| NO | 정책명 | 설명 |\n|---|---|---|\n| 1 | AccountPendingClosureAccess | 계정 삭제 대기 상태 사용자의 권한 |\n| 2 | BillingplanFullAccess | Billing Plan 서비스 전체 기능 |\n| 3 | BillingplanReadOnlyAccess | Billing Plan 서비스 조회 |\n| 4 | CostExplorerFullAccess | Cost Explorer 서비스 전체 기능 |\n| 5 | CostExplorerReadOnlyAccess | Cost Explorer 서비스 조회 |\n| 6 | EdgeServerFullAccess | Edge Server 서비스 전체 기능 |\n| 7 | EdgeServerReadOnlyAccess | Edge Server 서비스 조회 |\n| 8 | IamFullAccess | IAM 서비스 전체 기능 |\n| 9 | IamReadOnlyAccess | IAM 서비스 조회 |\n| 10 | IamResourcePolicyAccess | IAM 리소스 기반 정책 관리 권한 |\n| 11 | IamUserChangePassword | IAM 사용자의 비밀번호 변경 권한 |\n| 12 | IdentityCenterFullAccess | ID Center 서비스 전체 기능 |\n| 13 | IdentityCenterReadOnlyAccess | ID Center 서비스 조회 |\n| 14 | IdentityCenterServiceRolePolicy | ID Center 서비스가 서비스 운영에 필요한 작업을 수행할 수 있는 권한 |\n| 15 | NonBillableAccess | 결제수단을 등록하지 않은 사용자의 권한 |\n| 16 | OrganizationFullAccess | Organization 서비스 전체 기능 |\n| 17 | OrganizationReadOnlyAccess | Organization 서비스 조회 |\n| 18 | PricingFullAccess | Pricing 서비스 전체 기능 |\n| 19 | PricingReadOnlyAcess | Pricing 서비스 조회 (교재 표기 그대로) |\n| 20 | SCPCloudControlConfigInspection | Config Inspection에서 Cloud Control 계정 탐지 기능을 수행하기 위한 권한 |\n| 21 | SCPCloudControlServiceRolePolicy | Cloud Control 서비스가 서비스 운영에 필요한 작업을 수행할 수 있는 권한 |\n| 22 | ScrPullOnlyAccess | SCR 서비스 이미지 읽기 권한 |\n| 23 | ScrPullPushOnlyAccess | SCR 서비스 이미지 업로드 권한 |\n| 24 | StsAssumeRolePolicy | 서비스 계정 및 사용자에게 연결하여 역할을 수임할 수 있는 권한 |\n| 25 | **AdministratorAccess** | **전체 서비스**에 대해 **전체 기능** |\n| 26 | **OperatorAccess** | **Account, IAM, Organization, ID Center** 서비스의 **생성, 수정, 삭제를 제외**한 전체 서비스의 전체 기능 |\n| 27 | **ViewerAccess** | 전체 서비스에 대해 **조회** |\n\n> [!시험]\n> 대표 3종 구분: Administrator(전부) / Operator(계정·권한 관련 4개 서비스의 CUD만 제외) / Viewer(조회만). 기본 정책은 **수정 불가**이므로 조직 맞춤이 필요하면 사용자 정의 정책을 만든다.\n\n## 정책 생성 절차 (6개 화면, 9단계)\n### (1/6) 기본 정보 입력\n1. **정책명, 정책 설명, 태그** 입력\n\n### (2/6) 권한 설정: 서비스·작성 방식\n2. 권한을 설정할 **서비스 선택**\n3. **서비스 추가** (여러 서비스를 한 정책에)\n4. **정책 불러오기**: 기존 등록 정책 하나를 복사해 불러옴 → **기존에 입력한 내용은 모두 초기화**\n5. **기본 모드 / JSON 모드** 제공 → JSON 모드 진입 또는 화면 이동 시 **동일한 조건의 서비스는 통합**, **설정 미완료 서비스는 삭제**\n\n### (3/6) JSON 모드\n- JSON 모드 진입 시 **[JSON 모드 활용 가이드] 링크** 제공 (`docs.e.samsungsdscloud.com/userguide/management/iam/how_to_guides/json_guides/`)\n- Userguide의 **샘플 코드를 내려받아** 사용\n- 예시: bucket 자원 fool에 UploadObject 액션을 특정 사용자에 한해서만 허용\n\n### (4/6) 제어 유형과 액션\n6. **제어 유형** 선택\n\n| 제어 유형 | 의미 |\n|---|---|\n| 허용 정책 | 접근 허용 |\n| 거부 정책 | 접근 거부 |\n\n- **동일 대상에는 거부 정책이 우선 적용**\n\n7. 서비스별 **액션** 선택\n- **보라색**: 개별 자원 선택이 가능한 액션\n- **검은색**: 모든 자원을 대상으로 하는 액션\n- 액션 직접 추가: **Wildcard**로 여러 액션 한 번에 지정 가능\n\n### (5/6) 적용 자원\n8. 적용 자원 선택\n\n| 적용 자원 | 의미 |\n|---|---|\n| 모든 자원 | 선택된 액션에 대해 모든 자원에 적용 |\n| 개별 자원 | 선택된 액션에 대해 지정된 자원에만 적용. **보라색 액션 선택 시에만 가능** |\n\n### (6/6) 인증 유형·적용 IP\n9. 인증 방식 및 접근 허용 대상 IP 지정\n\n| 인증 유형 | 적용 대상 |\n|---|---|\n| 전체 | 인증 방식과 상관없이 |\n| 인증키 인증 | 인증키로 인증한 사용자 |\n| 임시키 인증, Console 로그인 | 임시키 인증 사용자나 Console 로그인 사용자 |\n\n| 적용 IP | 의미 |\n|---|---|\n| 사용자 지정 IP | 사용자가 IP를 직접 등록하여 관리 |\n| 모든 IP | IP 접근 제한 없음 |\n\n## 헷갈리는 두 동작 비교\n| 동작 | 결과 |\n|---|---|\n| 정책 불러오기 | 기존 입력 내용 **모두 초기화** 후 불러온 정책으로 대체 |\n| JSON 모드 진입·화면 이동 | 동일 조건 서비스 **통합**, 미완료 서비스 **삭제** |\n\n> [!주의]\n> ID Center 권한 세트의 인라인 정책 화면(Landing Zone 가이드 슬라이드31)은 같은 동작을 \"**통제 요건이 중복으로 설정된** 서비스는 통합\"이라고 표현한다. IAM 교재(슬라이드14)는 \"**동일한 조건의** 서비스는 통합\"이라고 쓴다. 의미는 같다.\n\n## 허용·거부 평가 예시\n- 그룹에 정책 A(Object Storage 전체 액션 허용) + 정책 B(운영 버킷 삭제 접근 거부)가 함께 연결 → 운영 버킷 삭제는 **거부**. 연결 순서나 범위의 넓이와 무관하게 동일 대상에서는 거부가 이긴다.\n- 정책 A는 자동 해제되지 않으며, 두 정책이 모두 무효가 되지도 않는다.\n\n## 정책 연결 대상과 수정\n- 연결 대상: **개별 사용자, 사용자 그룹, 역할** (1-1c)\n  - 사용자 상세 → 권한 탭 → 권한 추가, 그룹·역할 생성 시 정책 연결 단계에서 선택\n  - 연결하려는 정책이 없으면 생성 과정에서 **신규 정책 등록을 먼저** 진행 가능\n- 수정: 사용자 정의 정책은 사용자가 직접 수정, 기본 정책은 읽기 전용\n- ID Center **권한 세트**는 기본 정책, 사용자 정의 정책(이름 입력), **인라인 정책**(동일 작성 화면)으로 구성 (1-1a)\n- Organization의 **통제 정책(ACP)** 은 OU에 연결해 하위 Account에 일괄 적용 (1-1a)\n\n## 최소 권한 설계 (WA 보안성)\n- 관리자는 IAM 정책으로 사용자 접근 권한을 업무에 필요한 범위로 제한한다.\n- **제어 항목, 액션, 자원 유형, 인증 방식, IP**에 대한 세밀한 접근 제어 정책으로 사용자·그룹에 최소 권한 적용\n- 그룹을 만들고 프로젝트·부서 성격에 따라 **(최소한의) 권한 정책**을 구성해 그룹에 연결\n\n> [!시험]\n> - 기본 정책 27개, **수정 불가**, 재사용은 두 유형 모두 가능\n> - 정책 불러오기 = **초기화**, JSON 모드/화면 이동 = 통합·삭제\n> - 보라색(개별 자원 가능) / 검은색(모든 자원), 개별 자원은 보라색 액션일 때만\n> - Wildcard로 액션 일괄 지정\n> - **거부 우선**\n> - 인증 유형 3종, 적용 IP 2종\n\n출처: ExploreManagement_1_IAM 슬라이드7~10, 12~18, 21~24, 27, ExploreManagement_4_Cloud_Control_Landing_Zone_활용가이드 슬라이드15, 29~33, WA백서 02 p.11, 16"}, "1-1e": {"title": "Cloud Control, Quota Service를 이용한 멀티 Account 환경 구축 및 자원 관리", "md": "## 한눈에 보기\n- **Cloud Control**: SCP에서 **멀티 계정 환경**을 쉽고 안전하게 구축/운영/관리하도록 지원하는 **관리형 서비스**. 조직의 클라우드 거버넌스(보안, 규정 준수, 표준화 등)를 **자동화**. 사용하려면 **사전에 랜딩 존 생성 필수**\n- 랜딩 존 공유 Account: **Management**(Cloud Control, Organization, ID Center) / **Log**(Object Storage) / **Audit**(Config Inspection)\n- 가드레일: **예방**(위반 리소스 생성 차단) / **탐지**(진단으로 위반 탐지·알림), Organization **ACP**·**Config Inspection**과 연동\n- **Quota Service**: Account의 서비스별 자원 Quota를 **통합 관리**, **무료**, 리전 수준·Account 수준 Quota 구분, 증가 요청과 상태 추적(보류 중/승인/거부)\n\n## 배경\n### Cloud Control 도입 배경\n- Customer Pain-Points는 경영진(C-Level), 관리자, 실무자 각각에서 발생한다.\n- 학습 목표: Cloud Control의 개요·목적, 특장점·핵심 기능 이해, 활용·운영 방안 모색, 멀티 계정 환경의 효율적 관리와 신속한 대응방안 학습\n- 세부 교육 내용: 멀티 계정 환경 구축·운영 방식과 거버넌스 자동화, 중앙에서 일관된 계정·리소스 관리의 중요성. 주요 특장점은 **랜딩 존 자동 구축, 중앙집중식 거버넌스 및 정책 적용, 멀티 리전 및 확장성**. 정책 위반 탐지·모니터링으로 보안과 규정 준수 강화\n\n### Quota Service 도입 배경 (Customer Pain-Points)\n- 실시간 Quota 가시성 부족 → 배포 시 갑작스러운 제한 발생\n- 수동 신청·승인 프로세스 → 리소스 급증 시 일정 지연\n- 다중 계정·다중 리전 환경에서의 통합 관리 어려움\n- 알림·이벤트 누락 → 초과 사용 시 비용·가용성 위험\n- 복잡한 Quota 증가 요청 절차와 추적 불가\n- CI/CD와의 연동을 위한 API 활용 가이드 부족\n\n## Cloud Control 개념과 특장점\n- Well-Architected **보안 설계 원칙**에 기반하여 계정 및 리소스를 중앙에서 일관되고 안전하게 관리\n- SCP에서 멀티 Account 환경을 안전하게 구축/운영/관리\n\n### 서비스 구성\n| Account | 위치하는 서비스 | 역할 |\n|---|---|---|\n| Management Account | **Cloud Control, Organization, ID Center** | 조직 및 계정 구조 관리, 정책 적용 |\n| Log Account | **Object Storage** | 모든 계정의 로그 중앙 수집 및 저장, **로그 무결성 보장** |\n| Audit Account | **Config Inspection** | 조직 전체 보안/컴플라이언스 모니터링 및 감사, 자동화된 보안 점검 |\n| Accounts(1·2·3…) | - | 각각 **Account Baseline, Network Baseline** 적용 |\n\n### 주요 기능\n| 기능 | 내용 |\n|---|---|\n| 자동화된 랜딩 존 구축 | 관리·로그·감사 계정 자동 구성 |\n| 가드레일 적용 | **예방(Preventive)**: 정책 위반 리소스의 **생성 자체를 차단** / **탐지(Detective)**: 진단을 통해 정책 위반 리소스를 **탐지하고 알림** / Organization **ACP**, **Config Inspection** 등과 연동 |\n| 대시보드 제공 | 전체 조직의 Account, OU, 가드레일 적용 현황, 규정 준수 상태를 시각적으로 모니터링 |\n| 중앙집중식 로깅 및 감사 | **Logging&Audit, Object Storage, Config Inspection** 등으로 모든 Account 로그 중앙 저장 및 감사 계정 제공 |\n| ID 및 권한 관리 통합 | **ID Center**와 연동해 Account별 접근 제어 및 권한 그룹 관리 |\n| 모니터링 및 알림(Notification) | 정책 위반, Cloud Control 설정 변경 등에 대한 **실시간 알림** |\n\n> [!시험]\n> 예방 = **차단(생성 자체를 막음)**, 탐지 = **진단 후 탐지·알림**. 두 설명을 뒤바꾼 보기가 단골 오답이다.\n\n### 선행 서비스 (ID Center를 통한 Account 액세스 구성 시 표시)\n각 서비스 가이드를 참고해 사전 준비한다.\n\n| 카테고리 | 서비스 | 설명 |\n|---|---|---|\n| Storage | Object Storage | 데이터 저장 및 검색에 용이한 객체 스토리지 |\n| Management | Logging&Audit | 사용자의 활동 내역을 수집하고 분석하는 서비스 |\n| Management | Organization | Account를 조직 단위 별로 구성하여 계층적으로 관리하고 리소스 접근 권한을 제어하는 서비스 |\n| Management | ID Center | Account별 자원에 대한 접근 권한을 중앙에서 손쉽게 관리할 수 있는 서비스 |\n\n## 랜딩 존 생성 절차 (9단계)\n경로: **모든 서비스 > Management > Cloud Control** Service Home → **랜딩 존 생성** 버튼\n1. Service Home 이동 (랜딩 존 생성 = Cloud Control 사용의 **필수 선행 사항**)\n2. **요금 검토** 및 **조직 단위 구성** 항목 확인\n3. **공유 Account 구성**\n  - **Management Account명이 표시되며 수정 불가**\n  - **Log Account**: Account명, 이메일 확인\n  - **Audit Account**: Account명, 이메일 확인 → **Log Account와 동일한 이메일 사용 불가**\n4. 추가 구성 > 구성 항목 설정 > **Account 액세스 구성** 중 선택\n  - **ID Center를 통한 Account 액세스** (선행 서비스 표 표시)\n  - **자체 관리형 Account 액세스**\n5. 랜딩 존 생성 요청 완료\n\n## 랜딩 존 관리\n| 작업 | 경로 |\n|---|---|\n| 랜딩 존 상세 정보 확인 | Management > Cloud Control > Service Home > **랜딩 존 정보** |\n| 랜딩 존 설정 항목 확인 | Service Home > **랜딩 존 설정** |\n| 랜딩 존 삭제 | Service Home > 랜딩 존 설정 > **삭제** |\n| 조직 단위 및 Account 관리 | 랜딩 존 설정 > 조직 > **조직 단위 및 Account 관리** |\n\n### 조직 단위 및 Account 관리 화면\n| 구분 | 설명 |\n|---|---|\n| 계층 구조 보기 | 조직 단위를 계층 구조로 표시 |\n| Account 목록 보기 | 조직 내 Account 목록을 표시 |\n| Account 생성 | 새로운 Account 생성 (버튼 클릭 시 Account 생성 페이지로 이동) |\n\n### 상세 화면 탭 구성\n| 상세 화면 | 탭 |\n|---|---|\n| Root 상세 | 기본 정보 / 하위 Account |\n| 조직 단위(OU) 상세 | **3개 탭**: ① 기본 정보 ② **하위 Account** ③ **예방 가드레일** |\n| Account 상세 | **2개 탭**: ① 기본 정보 ② **예방 가드레일** |\n\n- OU 상세: 조직 단위의 상세 정보, 하위 Account 목록, 적용된 예방 가드레일 확인 및 관리\n- Account 상세의 예방 가드레일 탭: 가드레일명 클릭 시 상세 정보 확인, **적용 방식** 표시. **상속 방식**이면 클릭하여 **상속받은 조직 단위명** 확인\n\n> [!시험]\n> Account 상세에는 **하위 Account 탭이 없다**(2개 탭). OU 상세만 3개 탭.\n\n### Access Portal 접속 정보 확인\n경로: **Management > Cloud Control > 사용자 및 액세스** (연동 액세스 관리 / 사용자 자격 증명 관리 영역 > 정보 확인)\n- 사용자 및 액세스 페이지에서 **Access Portal 접속 URL과 접속에 필요한 암호** 확인\n- 자체 관리형 Account 액세스를 선택한 경우 표시 항목\n  - **자격 증명 소스**: ID Center에 설정된 자격 증명 소스 유형 → **ID Center 내 자체 디렉토리** 또는 **AD(Active Directory, 사용자가 직접 관리)**\n  - **ID Center의 ID**: 클릭 시 ID Center 설정 페이지로 이동\n  - 그룹: 조직에서 특정 작업을 수행하는 작업자를 분류하기 위해 구성된 그룹\n- ID Center를 통한 Account 액세스를 선택한 경우(랜딩 존 설정)도 같은 메뉴에서 정보 확인\n\n## Quota Service\nSCP Account(계정)의 서비스별 자원 Quota를 **통합 관리**하는 서비스.\n\n### Quota의 종류\n| 구분 | 의미 |\n|---|---|\n| 초기값 | SCP가 서비스별로 설정한 초기값 |\n| 증가된 값 | 사용자가 요청해 증가된 값 (**승인 시 적용**) |\n| 조정 가능 여부 | **일부 Quota는 증가 요청 가능하지만, 일부는 고정** |\n\n### 특장점\n- 동적 자원 관리와 다층 보안·거버넌스 결합으로 **정책 일관성** 보장\n- 실시간 모니터링·자동 정책 적용으로 효율적인 할당과 **과다 사용 방지**\n- **계정·리전 단위 세밀 조정**으로 확장·유연성 제공\n\n학습정리의 4대 특장점:\n| 특장점 | 내용 |\n|---|---|\n| 중앙집중관리 | **100개 이상의 서비스 Quota 아이템**을 단일 콘솔에서 관리 |\n| 타 서비스와 통합 | Quota 증가 요청을 원활하게 처리(**일부는 자동 승인**) |\n| 확장성과 유연성 | **계정 수준 Quota에서 리전 수준 Quota까지** 세밀히 관리 |\n| 비용 효율성 | **추가 비용이 없으며**, 리소스 과다 사용으로 인한 비용 증가 방지 |\n\n### 서비스 구성\n```\n사용자 → Quota 조회 → 서비스별 Quota\n   (Virtual Server, VPC, Firewall … / 인스턴스 수, 버킷 수, 최대 Key pair 수, 최대 VPN 수, 최대 DB 인스턴스 수 …)\n → Quota 증가 요청 → Support Center → 자동 승인 / 승인 대상 Quota는 관리자 승인\n```\n- **요금 기준: 무료**\n\n### 주요 기능\n| 기능 | 내용 |\n|---|---|\n| Quota 정보 조회 | 서비스별 **기본 Quota, 적용 Quota, 조정 가능 여부**. **리전 수준 Quota, Account 수준 Quota**를 구분하여 제공 |\n| Quota 증가 요청 | 콘솔에서 단일 인터페이스로 처리. 요청 상태(**보류 중, 승인, 거부**) 추적 |\n| 히스토리 및 분석 | 과거 Quota 증가 요청 내역과 사용 추이 확인 → 리소스 계획 수립 및 최적화 |\n\n> [!주의]\n> Quota Service 교재 슬라이드10의 '제공 Quota' 항목에는 관리/로그/감사 계정 설명이 들어 있는데, 이는 Cloud Control 슬라이드 문구가 복사된 것으로 보인다(교재 변환본 주석). Quota의 기능으로 외우지 말 것.\n\n### Hands-on: 콘솔 작업\n경로: **모든 서비스 > Management > Quota Service** Home\n| 작업 | 경로·내용 |\n|---|---|\n| 상세 정보 확인 | Quota Service 목록 → 상세 페이지: 기본 정보 |\n| 변경 요청 | 목록에서 Quota 선택 → **Quota 변경 요청** 버튼 → 요청 이력 확인 및 변경 요청 |\n| 요청 내역 확인 | 요청 내역 목록 (화면 표기: \"최대 5개까지 확장 가능\") |\n| 일부 승인 | 요청 내역 목록에서 변경 요청이 **일부 승인**된 결과 확인 |\n| 태그 | 상세의 태그 탭, 태그 수정 |\n| 할당량 추가 | **조직 할당량 템플릿** → 할당량 추가 버튼 |\n| 조직 할당량 삭제 | 목록 → 조직 할당량 템플릿 → 삭제 |\n\nFinancial Management 교재의 Quota 변경 요청 화면:\n1. 현재 Quota 정보 조회\n2. **요청값, 요청 메시지** 입력\n  - **Quota 축소 시 자동으로 승인되어 반영**\n  - **Quota 증설 시 담당자 확인 후 반영**\n\n> [!주의]\n> 승인 방식 표현이 교재마다 다르다. Quota Service 교재는 \"자동 승인 / 승인 대상 Quota는 관리자 승인\", \"일부는 자동 승인\"으로, Financial Management 교재(슬라이드26)는 \"축소는 자동 승인, 증설은 담당자 확인 후 반영\"으로 쓴다. 증가 요청이 모두 자동 승인되는 것은 아니라는 점은 두 교재가 같다. 슬라이드16의 \"최대 5개까지 확장 가능\"은 무엇의 최대인지 교재에 설명이 없다.\n\n## 비교: 멀티 Account 관리 서비스\n| 서비스 | 핵심 역할 |\n|---|---|\n| Organization | Account 계층(OU) 구성, ACP 일괄 적용, 통합 청구 |\n| ID Center | 사용자·그룹, 권한 세트, Access Portal |\n| Cloud Control | 랜딩 존 자동 구축, 가드레일, 대시보드, 중앙 로깅·감사, 알림 |\n| Quota Service | 서비스별 Quota 조회·증가 요청·이력 분석 (무료) |\n\n> [!시험]\n> - Cloud Control은 **랜딩 존 선행 생성 필수**\n> - Management Account명 **수정 불가**, Audit 이메일 ≠ Log 이메일\n> - Account 액세스 구성 2종: ID Center를 통한 / 자체 관리형\n> - Access Portal URL·암호는 Cloud Control **'사용자 및 액세스'** 메뉴\n> - Quota: **무료**, 100개 이상 아이템, **리전 수준 + Account 수준**, 상태 3종(보류 중/승인/거부), 모든 Quota가 증가 가능한 것은 아님(일부 고정)\n\n출처: ExploreManagement_3_Cloud_Control 슬라이드1~45, ExploreManagement_6_Quota_Service 슬라이드1~28, ExploreManagement_7_Financial_Management 슬라이드10, 25~26"}, "1-1f": {"title": "Architecture Diagram, Copilot, ESG Carbon Footprint", "md": "## 한눈에 보기\n- **SCP Copilot**: 생성형 AI 기반 **업무 보조** 서비스. 자연어로 요청하면 메뉴 이동, **자원 생성**, 자원 정보 확인을 지원\n- **Architecture Diagram**: 생성한 인프라와 자원 간 연관 관계를 **구성도**로 시각화. Copilot에 \"내가 생성한 자원을 구성도로 보여 줘\"\n- **ESG Carbon Footprint(탄소 배출량)**: **Cost Management**의 **탄소 배출량 확인** 기능. 탄소 배출량, 월별 추이, 서비스군별, Account별 정보\n\n## 배경: 학습 목표\n1. 생성형 AI 기반 업무 보조 서비스인 SCP Copilot의 개념과 특징\n2. Copilot으로 인프라 구성 과정을 효율적으로 이해·적용\n3. 클라우드 자원을 시각적으로 확인하고 효율적으로 관리·최적화\n4. 생성형 AI와 SCP로 클라우드 웹 사이트 직접 구축\n\n## SCP Copilot 주요 기능 및 특장점\n| 특장점 | 기능 |\n|---|---|\n| 자연어 기반 업무 요청 및 자동화 처리 | 생성형 AI 기반 **대화형 질의 응답** |\n| SCP **자원 데이터와 연계** | SCP에서 생성한 **인스턴스 상태, 자원의 설정, 예상 비용**을 **실시간**으로 확인 |\n| 관계 도식화 | 구성된 자원 간 **연관 관계를 도식화**하여 직관적으로 파악 |\n| 즉시 자원 생성 | Copilot 기능을 활용하여 **즉시 자원 생성** |\n| 빠른 정보 확인 | **자원 상세 화면으로 이동하지 않고** 자원의 주요 정보 확인 |\n\n> [!시험]\n> \"Copilot은 조회·질의응답만 지원하고 자원 생성은 못 한다\", \"SCP 자원 데이터와 연계되지 않는다\"는 **오답**. Copilot은 자원 데이터와 연계되고 생성까지 지원한다.\n\n## Hands-on: Copilot으로 웹 사이트 구축\n### 사전 작업\n- **Console 접속** → **다중 인증(MFA)을 위한 본인 인증** → SCP Console Home에서 Copilot 실행\n\n### 진행 순서\n| 단계 | 생성 자원 | Copilot 프롬프트 예 | 이후 작업 |\n|---|---|---|---|\n| ① Virtual Server | Virtual Server | \"Virtual Server 생성해 줘\" | Virtual Server 메뉴로 이동 → Image 및 버전 선택 → 서비스 정보 입력 |\n| | VPC | \"VPC 생성해 줘\" | **VPC 생성 팝업창**에서 필수 정보 입력 |\n| | Subnet | - | Subnet **신규 생성** 선택 |\n| | Security Group(public, private) | \"Security Group 생성해 줘\" | 생성 팝업 창에서 필수 정보 입력 (public / private 각각) |\n| | Keypair | \"Virtual Server Keypair 생성해 줘\" | Keypair 메뉴로 이동 → Keypair 생성 |\n| | Virtual Server(web 서버, was 서버) | - | Virtual Server 생성 페이지에서 Image·버전 선택, 정보 입력 |\n| | Architecture Diagram | \"**내가 생성한 자원을 구성도로 보여 줘**\" | 구성도 확인 |\n| ② Internet Gateway | Internet Gateway | \"Internet Gateway 생성해 줘\" | Internet Gateway 메뉴로 이동 → 생성 |\n| | Public IP | \"Public IP **예약**해 줘\" | Public IP 메뉴로 이동 → 예약 |\n| ③ Load Balancer | Load Balancer | \"Load Balancer 생성해 줘\" | Load Balancer 메뉴로 이동 → 생성 |\n| | LB 서버 그룹 | \"Load Balancer 서버 그룹 생성해 줘\" | LB 서버 그룹 메뉴 → 생성 |\n| | LB Listener | \"LB Listener 생성해 줘\" | Load Balancer 메뉴 → LB Listener 생성 메뉴 → 생성 |\n| | LB 서버 그룹 멤버 | \"LB 서버 그룹에 멤버 추가해 줘\" | LB 서버 그룹 → 멤버 추가 메뉴 → 멤버 추가 |\n| ④ 보안 규칙 추가 | Security Group 규칙 | \"Security Group 보안 규칙 추가해 줘\" | public: **Inbound·Outbound** 규칙 추가 / private: **Inbound** 규칙 추가 |\n| ⑤ 웹 사이트 접속 | - | - | **LB Public NAT IP** 주소 확인 → 인터넷에서 접속 |\n\n### Copilot 응답에 나타나는 메뉴 선택지\n- \"Virtual Server 생성해 줘\" → **Virtual Server 생성하기 / Virtual Server 자원 정보로 이동 / Virtual Server API 가이드 보기**\n- \"Virtual Server Keypair 생성해 줘\" → Keypair (Virtual Server) 자원 정보로 이동 / Virtual Server 생성하기\n- \"Internet Gateway 생성해 줘\" → Internet Gateway 자원 정보로 이동\n- \"Public IP 예약해 줘\" → Public IP 자원 정보로 이동\n- \"Load Balancer 생성해 줘\" → Load Balancer 생성하기 / 자원 정보로 이동 / **Load Balancer API 가이드 보기**\n- \"Load Balancer 서버 그룹 생성해 줘\" → Load Balancer Server Group 자원 정보로 이동 / Load Balancer 생성하기 / API 가이드 보기\n- \"LB Listener 생성해 줘\" → LB Listener 자원 정보로 이동 / **LB Pool** 자원 정보로 이동 / Load Balancer 생성하기\n- \"Security Group 보안 규칙 추가해 줘\" → Security Group 자원 정보로 이동 / Security Group 생성하기\n\n즉 Copilot은 **메뉴 이동, 생성 화면 진입, 자원 정보 조회, API 가이드 안내**를 대화로 제공한다.\n\n## Architecture Diagram\n- 생성한 **모든 인프라**를 \"Architecture Diagram\"으로 **시각적으로 확인**하고, 클라우드 환경을 **한눈에 이해하고 관리**\n- 호출 방법: Copilot 실행 후 \"내가 생성한 자원을 구성도로 보여 줘\"\n- 실습에서는 web/was 서버, VPC, Subnet, Security Group, Keypair 등을 만든 뒤 구성도로 확인한다.\n\n| 서비스 | 하는 일 | 구성도를 그리나 |\n|---|---|---|\n| Architecture Diagram | 자원 간 연결 관계를 구성도로 시각화 | O |\n| Resource Explorer | 자원 검색·필터링·태그 일괄 추가 | X |\n| Resource Groups | 태그 기반 자원 그룹화 | X |\n\n> [!시험]\n> \"생성한 모든 인프라와 자원 간 연결 관계를 구성도로 한눈에\" → **Architecture Diagram**. Resource Explorer·Groups·Cloud Monitoring·Config Inspection은 오답.\n\n## ESG Carbon Footprint: 탄소 배출량\n- 위치: **Cost Management**의 메뉴 중 **탄소 배출량 확인** (Cost Management 구성: 이용 및 청구내역 조회 / 납부 내역 조회 / 비용 분석 / Credit 및 예산 관리 / Cost Savings / Account 정보 확인 / 결제 관리 / **탄소 배출량 확인**)\n- 제공 정보\n\n| 정보 | 내용 |\n|---|---|\n| 탄소 배출량 | 사용에 따른 탄소 배출량 |\n| 월별 탄소 배출량 추이 | 월 단위 추이 |\n| 서비스군별 탄소 배출량 | 서비스군 구분 |\n| Account별 탄소 배출량 | Account 구분 |\n\n- WA 비용최적화 백서(FinOps Inform 단계): 클라우드 지출을 태그, 사용자, 비즈니스 규칙에 따라 정확하게 할당하면 사업 및 재무팀이 예산 내에서 ROI를 높이고 **지출 및 탄소 비용을 예측**할 수 있다. 비용 데이터를 **지속 가능성**, 효율성, 활용도, 성과 벤치마크와 연계하면 KPI·단위 지표를 도출할 수 있다.\n\n> [!시험]\n> 탄소 배출량 = **Cost Management**. Cloud Monitoring, Resource Explorer, Quota Service, Logging&Audit와 짝지은 보기는 오답.\n\n## 학습정리와 부록\n- 웹 서버, DB 등 핵심 자원을 SCP에서 간단하고 빠르게 구축할 수 있고, Copilot으로 인프라 구성을 더 빠르고 효율적으로 체험한다.\n- 코드를 몰라도, 클라우드 초보자도 단계별 실습으로 웹 사이트를 만들 수 있다.\n- 별첨1 **서비스 삭제 프로세스**(실습 자원 정리), 별첨2 **무료 체험**, 별첨3 참고 자료(1-2a 참조)\n\n출처: ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드1~54, ExploreManagement_7_Financial_Management 슬라이드7~8, ExploreManagement_8_Resource_Management 슬라이드6~9, WA백서 06 p.22"}, "1-2a": {"title": "Console, CLI, Open API를 통한 서비스 접근", "md": "## 한눈에 보기\n- SCP를 비롯한 모든 클라우드 서비스는 **REST API 기반**으로 작동한다. **Console이든 CLI든** 서비스를 실행하기 위해 **API 호출**이 이뤄지고 그에 따라 서비스가 작업을 수행한다.\n- **Console**: 가장 기본적인 도구. 접속 시 **다중 인증(MFA)** 본인 인증\n- **CLI / Open API**: 가능하지만 **인증키가 반드시 필요**. Open API는 **RESTful API** 방식, **JSON** 형식 응답\n- 자동화: SCP는 **CLI와 Open API**를 제공해 **Terraform** 등 **IaC** 도구로 자원 배치를 자동화할 수 있다.\n\n## 접근 방식 비교\n| 구분 | Console | CLI | Open API |\n|---|---|---|---|\n| 성격 | 웹 기반 기본 작업 도구 | 명령줄 도구 | 프로그램에서 호출하는 API |\n| 인증 | 로그인 + **MFA** | **인증키** | **인증키** 또는 Secret Vault **임시키** |\n| 내부 동작 | **API 호출** | API 호출 | API 호출 |\n| 보안 보완 | MFA | 만료 기간·접속 IP 지정 | 만료 기간·접속 IP 지정, **임시키** |\n| 정책 인증 유형 | '임시키 인증, Console 로그인' 대상 | '인증키 인증' 대상 | 인증키면 '인증키 인증', 임시키면 '임시키 인증, Console 로그인' |\n\n> [!시험]\n> - \"Console 작업은 API를 거치지 않는다 / API 호출 이력이 남지 않는다\" → **오답**. Console도 API 호출로 처리된다.\n> - \"CLI·Open API는 Console 로그인 세션을 이어받아 인증키 없이 쓴다\" → **오답**. Console 세션과 별개이며 인증키(또는 임시키)가 필요하다.\n\n## Console 접근\n- Hands-on 사전 작업: **Console에 접속** → **다중 인증(MFA)을 위한 본인 인증** → **SCP Console Home**\n- 서비스 진입은 **모든 서비스 > 카테고리 > 서비스** 형태의 경로를 쓴다.\n  - 예: 모든 서비스 > Management > Cloud Control / Quota Service, Security > Secret Vault\n- Console Home에서 **Copilot**을 실행해 자연어로 메뉴 이동·자원 생성·정보 확인을 할 수 있고, Copilot은 \"Virtual Server **API 가이드 보기**\", \"Load Balancer API 가이드 보기\" 같이 API 문서로도 안내한다(1-1f).\n- WA 보안성: SCP는 Console 접근 보안을 위해 강력한 사용자 인증을 기본 제공하며 사용자는 **MFA를 반드시 수행**한다. 타사 IdP(SAML, OIDC 등)와 연동하면 **SSO**로 Console에 접근할 수 있다.\n- 여러 Account를 쓰는 조직은 ID Center의 **Access Portal**을 통해 할당된 Account·권한 세트로 Console에 진입한다(권한 세트 세션 1~12시간, 1-1a).\n\n## CLI와 Open API 접근\n### 인증키\n- CLI와 Open API를 이용한 작업에는 **인증키가 반드시 필요**하다.\n- Console의 MFA처럼 관리할 수 없으므로 별도 관리가 필요하다.\n  - **만료 기간 지정**(영구 인증키 지양)\n  - **접속 IP 주소 제한**(접근 가능한 IP 대역 지정)\n  - **임시키 사용**\n\n### Open API 특성 (SEC4 학습정리)\n- SCP의 IaaS/PaaS 상품을 **프로그램적으로 이용**할 수 있도록 지원하는 응용 프로그램 인터페이스(API) 제공\n- **RESTful API** 방식, **JSON** 형식으로 응답\n\n### Open API 임시키 (Secret Vault 연계)\n1. Console에서 발급받은 인증키로 Secret Vault에 Token 요청 → Token 발급\n2. Token을 **Application에 설정**\n3. Token으로 API 호출해 **OpenAPI 임시키** 발급\n4. 임시키로 SCP 서비스·자원 접근\n\n임시키 사용 기간은 최대 36시간(1.5일). 상세는 1-1b, 4-2g.\n\n### IAM 정책으로 접근 방식 제한\n| 인증 유형 | 적용 대상 |\n|---|---|\n| 전체 | 인증 방식과 상관없이 |\n| 인증키 인증 | 인증키로 인증한 사용자(CLI·Open API) |\n| 임시키 인증, Console 로그인 | 임시키 사용자 또는 Console 로그인 사용자 |\n\n적용 IP는 **사용자 지정 IP**(직접 등록) / **모든 IP**(제한 없음). 정책 JSON 모드는 Userguide의 샘플 코드를 받아 사용할 수 있다(1-1d).\n\n## IaC(코드형 인프라)로 접근 자동화 (WA 운영우수성)\n- IaC 접근 방식을 활용하면 새 서버 실행, 서비스 시작·중지 작업을 자동화하고 반복적 인프라 관리 업무를 줄일 수 있다.\n- 자동화 적용 운영 영역 중 **배포**: Terraform과 같은 IaC 도구로 인프라 배포 및 업데이트를 자동화\n\n### 선언형 vs 지시형\n| 구분 | 선언형 도구 | 지시형 도구 |\n|---|---|---|\n| 방식 | **배포 완료 상태**를 정의 파일에 명시하고 그 상태를 **유지** | 배포 작업을 **단계별로 지시** |\n| 실패·장애 시 | 선언된 상태를 만들기 위해 반복 수행, 변경 발생 시 **원래 상태로 자동 복구** 시도 | **운영자가 직접 개입**해야 하는 경우가 많음 |\n| 운영 환경 적합성 | **더 적합** | 상대적으로 부적합 |\n\n### Terraform으로 멀티 리전 배포\n1. SCP에서 **Terraform 작업용 인증키 생성**\n2. 환경 설정 완료\n3. 배포할 자원 및 환경 구성을 **코드로 작성**\n4. Terraform 명령어로 **kr-west1 Region과 kr-east1 Region**에 VM 배포\n\n> [!시험]\n> \"실패나 변경 시 정의된 상태로 자동 복구\"는 **선언형**의 특성이다. 지시형이라고 하면 오답. IaC용 인증키에도 만료 기간·접속 IP 지정을 적용한다.\n\n## 참고 자료와 체험 (Copilot 교재 별첨)\n| 자료 | 주소 |\n|---|---|\n| User Guide | `docs.e.samsungsdscloud.com/userguide/` |\n| API Reference | `docs.e.samsungsdscloud.com/apireference/` |\n| CLI Reference | `docs.e.samsungsdscloud.com/clireference/` |\n| Architecture Center | `docs.e.samsungsdscloud.com/arch_cent/` |\n| Knowledge Center | `docs.e.samsungsdscloud.com/knowledge_cent/` |\n| 무료 체험 | Service Portal의 무료 체험 페이지에서 SCP의 모든 서비스를 무료로 체험 (`cloud.samsungsds.com/serviceportal/pricing/freetrials.html`) |\n\n이 밖에 Service Portal, Documentation, Blog가 참고 자료로 소개된다.\n\n> [!시험]\n> - 모든 접근은 결국 **REST API 호출**\n> - Console = MFA, CLI·Open API = **인증키 필수**\n> - Open API = **RESTful, JSON 응답**\n> - Application은 Secret Vault Token으로 **OpenAPI 임시키**를 받아 쓴다\n> - IaC는 **CLI·Open API 기반 Terraform**, 운영 환경엔 **선언형**\n\n출처: WA백서 02 p.11~13, WA백서 05 p.11~13, ExploreManagement_5_Copilot_Architecture_Diagram 슬라이드9~12, 30, 53~54, ExploreManagement_1_IAM 슬라이드15, 18, SEC4_KMS_SecretVault_SecretsManager 슬라이드25, 48"}, "1-2b": {"title": "비용 관리, 태깅", "md": "## 한눈에 보기\n- SCP 비용관리 서비스: **Cost Management**(비용 관리·추적 도구), **Planned Compute**(인스턴스 타입 약정 할인), **Quota Service**(서비스 쿼터 통합 관리)\n- Cost Management 메뉴: 이용 및 청구내역 / 납부 내역 / **비용 분석(최대 6개월)** / Credit 및 예산 관리 / **Cost Savings** / Account 정보 / 결제 관리 / 탄소 배출량\n- 예산: **월별 예산**(월 단위 초기화) vs **전체 예산**(설정 월부터 누적), 임계치 도달 알림\n- Planned Compute: 서버 타입 **Scale-Up만** 변경, 해지 수수료 = **월 요금 × 50% × 약정기간 잔여개월 수**, 해지 **2개월 이후** 청구\n- 태깅: **Resource Explorer**(검색·필터·태그 일괄 추가), **Resource Groups**(태그 기반 그룹화), 태그는 **Key/Value**, 자원당 **최대 50개**\n\n## 배경: 클라우드 비용 관리 시 고려할 점\n- 클라우드 사용량과 비용을 **사전에 예측하고 관리**하려면? → Cost Management\n- Virtual Server 같은 핵심 서비스 비용을 **장기적으로 줄이려면**? → Planned Compute, Cost Savings\n- **서비스 한도** 때문에 갑작스러운 장애가 나지 않으려면? → Quota Service (1-1e)\n\n## Cost Management\nSCP 서비스 비용을 관리하고 추적하여 최적화할 수 있는 서비스.\n\n| 메뉴 | 기능 |\n|---|---|\n| 이용 및 청구내역 조회 | 이번 달 **예상금액 예측** 및 **청구금액** 확인 |\n| 납부 내역 조회 | 청구 금액, 미납금액, 납부 일자, 납부 상태 |\n| 비용 분석 | **최대 6개월**까지 비용 추이 확인 및 사용량 데이터 분석 |\n| Credit 및 예산 관리 | Credit 관리 및 사용, 예산 설정 및 관리 |\n| Cost Savings | **Compute군** 서비스에 대해 **시간 약정**을 설정하여 이용 비용 절약 |\n| Account 정보 확인 및 결제 관리 | Account명, Account ID, 별칭, 회사명 / 결제 수단 정보 |\n| 탄소 배출량 확인 | 탄소 배출량, 월별 추이, 서비스군별, Account별 (1-1f) |\n\n### 이용 및 청구 내역\n1. **1일 ~ 전일까지** 사용한 비용\n2. 이번 달 **월말 예상 비용(청구 금액)**\n3. **월 평균** 청구 금액\n4. 서비스별 요금, 할인 요금, 어카운트별 요금\n5. 클릭 시 상세 내역 **엑셀 다운로드**\n6. **Planned Compute, Cost Savings 등 할인된 요금**\n7. **어카운트별 상세 요금**\n\n### 납부 내역\n- Account의 월별 납부 내역: 청구 금액, 사용 금액, 미납 금액, 납부 금액 등 항목별 확인\n- 클릭 시 상세 내역 엑셀 다운로드\n\n### 비용 분석\n- **최대 6개월** 간의 비용 추이 및 사용량 데이터\n- 조회 기간: **시작 월의 1일부터 종료 월의 말일까지**\n- 조회 기간 구성에 따라 결과가 다르다.\n\n| 조회 기간 구성 | 제공 정보 |\n|---|---|\n| 청구 **미정산 월이 포함** | 총 예상 청구 금액, 월 평균 청구 금액, 예상 월 평균 청구 금액, **월별 그래프** |\n| 청구 **정산 월만** | 총 청구 금액, 월 평균 청구 금액, **비용 Top 5**, 그래프 |\n| 청구 **미정산 월만** | 총 예상 청구 금액, 월 평균 청구 금액, 예상 월 평균 청구 금액, 그래프 |\n| **당월만** | 사용 금액, 예상 청구 금액, 월 평균 청구 금액, 그래프 |\n\n- 엑셀 다운로드로 비용 분석 상세 내역 확인\n\n> [!시험]\n> 비용 분석은 **최대 6개월**. \"12개월\"은 오답.\n\n### 예산 관리\n1. **예산명** 입력\n2. **예산 관리 유형** 선택\n\n| 유형 | 동작 |\n|---|---|\n| 월별 예산 설정 | **월 단위로 사용 금액 초기화** |\n| 전체 예산 설정 | **설정한 월부터 사용한 금액 누적 계산** |\n\n3. 이번 달 이용금액을 참고해 **예산 입력**\n4. **임계치 도달 시 알림** 사용 여부 체크\n5. **예산 소진율**이 해당 시점에 도달했을 때 알림 발송\n6. 알림 메일 **반복 발송 여부** 설정\n7. 알림 **수신자 이메일주소** 입력\n\n> [!시험]\n> 월별(초기화) ↔ 전체(누적)를 뒤바꾼 보기에 주의. \"월별 예산은 누적 계산, 연간 총액 관리에 적합\"은 오답.\n\n## Cost Savings와 Planned Compute\n### 개념 비교\n| 구분 | Cost Savings | Planned Compute |\n|---|---|---|\n| 약정 대상 | **시간당 사용 금액** (Cost Management 교재: Compute군 서비스 **시간 약정**) | **인스턴스 타입** |\n| 기간 | 1년 또는 3년 | 1년 또는 3년 |\n| 적합 워크로드 | 비정기 가동, 정기적 부하(Auto-Scaling 최소 수량), **수직 확장 가능성이 있는 DB** | **같은 서버 타입**을 지속·정기적으로 쓰는 경우 |\n| 위치 | Cost Management 메뉴 | 별도 서비스 |\n\n> [!주의]\n> Cost Management 교재(슬라이드8)는 Cost Savings를 \"Compute군 서비스에 대해 시간 약정\"으로, WA 비용최적화 백서(p.5)는 \"1년 또는 3년 **시간당 사용 금액**을 약정\"으로 표현한다. 요금제별 적용 상품과 상세 설계는 2-1a에서 다룬다.\n\n### Planned Compute 동작\n- 무약정 요금으로 사용 중인 Virtual Server(s1v1m2)에 Planned Compute(s1v1m2)를 구매하면 **구매 후 즉시** 약정 기간 동안 할인 요금 적용\n- 미사용 상태에서 Planned Compute(PostgreSQL db1v2m4)를 먼저 구매하고 PostgreSQL을 사용 신청하면 **사용 신청 후 즉시** 할인 적용\n\n| 기능 | 내용 |\n|---|---|\n| 신청 | **대상 서비스, 운영 시스템, 서버 타입, 약정 기간, 수량** |\n| 변경 | 약정 연장으로 **다음 약정 기간 예약** / 서버 타입은 신청 값보다 **높은 값으로만** 변경 |\n| Coverage 확인 | 무약정 사용 금액 대비 Planned Compute 사용 비용의 차이 확인 |\n| 해지·위약금 | 약정 기간 내 해지 가능, **약정 잔여기간 이용 금액의 50%** 를 해지 **2개월 이후** 청구 |\n\n### 신청 화면\n1. 서비스, 운영 시스템, 서버 타입, 약정 기간 선택\n  - 운영 시스템: 선택한 서비스에 따라 **Open Source, RHEL, Windows** 등\n  - 서버 타입과 약정 기간은 서비스 항목을 선택한 뒤 선택 가능\n2. 신청 수량 입력\n\n### 약정 관리 화면 (연장·변경·해지)\n- 다음 약정 기간: **1-year / 3-year**\n- \"서버 타입 변경은 **Scale-Up만** 가능합니다.\"\n- 서버 타입 변경은 지정 시점(화면 예: 다음 날 00:00)에 적용되고, 변경된 자원은 해당 **Coverage 목록**으로 이동\n- 해지 수수료 = **[월 요금 × 50% × 약정기간 잔여개월 수]**, 화면 예: \"2025-10월 청구 금액에 ￦185,900의 수수료가 포함됩니다.\"\n- 화면 예: \"금일 신청 건은 (신청일) 이전 해지 시 해지 수수료가 발생하지 않습니다.\"\n\n계산 예: 월 요금 200만 원, 3년(36개월) 약정 16개월 사용 후 해지 → 200만 × 0.5 × (36 − 16) = **2,000만 원**\n\n> [!주의]\n> 약정 관리 화면에는 \"변경된 서버타입은 Scale-Down 목록으로 이동합니다\"라는 문구도 함께 보인다. 교재 본문(슬라이드9)은 \"서버타입은 신청 시 설정 값보다 높은 값으로 변경 가능\"으로 명시하므로 **Scale-Down 변경은 불가**로 이해한다. 신청 당일 해지 시 수수료 면제 문구는 화면 예시일 뿐 본문 설명은 없다.\n\n### 요금제 적용 판단 (WA 비용최적화 예시 요약)\n| 워크로드 | 적용 |\n|---|---|\n| 상시 가동(730시간) Virtual Server | 1년 약정 |\n| 비정기 가동 Virtual Server | Cost Savings |\n| 같은 타입 GPU Server 1~4대 정기적 변동 | **Planned Compute** |\n| Auto-Scaling 최소 수량(정기적 가동) | Cost Savings |\n| Auto-Scaling 최대 수량(정기적 부하) | 무약정 |\n| 수직 확장 가능성 있는 MySQL(DBaaS) | **Cost Savings** |\n\n- Cost Savings 약정 금액은 **보수적으로 시작해 점진적으로 최적화**(과도하면 쓰지 않은 비용도 지불)\n- 약정 만료일 기준 **3개월 또는 반기** 단위 자원 조정 검토 주기 설정\n\n## Organization 통합 청구\n- Organization에 속한 모든 Account의 비용과 리소스 사용량을 모니터링하고 **통합 청구**로 비용 최적화 (1-1a)\n- 이용 및 청구 내역에서 **어카운트별** 요금을 확인\n\n## 태깅과 자원 관리\n### 배경\n- 내 Account와 리전에 흩어진 모든 리소스를 **한 번에** 확인할 수 없을까? → Resource Explorer\n- 수백 개 리소스를 환경별·서비스별로 **체계적으로 묶어** 관리할 수 없을까? → Resource Groups\n\n### Resource Explorer\nSCP에서 생성한 리소스(자원)에 대한 **검색**을 제공하는 서비스. 늘어나는 리소스를 효율적으로 탐색하고, 태그로 관리 체계를 강화해 운영 효율성을 확보한다.\n\n| 기능 | 내용 |\n|---|---|\n| 리소스 검색 | 자원명, 서비스명, 자원 유형 등으로 **단일 쿼리로 여러 리전(kr-west1, kr-east1…)과 계정에 걸쳐** 검색 |\n| 필터링 | 자원명, 리전, 태그 등으로 결과 세분화 |\n| 태그 추가 | **여러 리소스에 태그 일괄 추가** |\n\n리소스 목록 조회 화면:\n1. **자원명, 서비스명, 자원 유형, 리전** 필터 검색\n2. **태그 필터** 검색\n3. 자원명 클릭 → 해당 자원 **상세 화면으로 이동**\n4. 항목을 지정해 **일괄 태그 추가**\n\n태그 추가하기: 태그로 자원을 손쉽게 관리, 식별, 정리, 검색 및 필터링\n- \"Resource Search 목록\"에서 **개별 자원**에 태그 추가 또는 삭제\n- **Key와 Value**를 입력해 새 태그 생성·등록\n- 태그는 **50개까지** 등록 가능\n\n> [!시험]\n> \"Resource Explorer는 현재 리전만 검색하므로 리전을 바꿔 가며 조회\" → **오답**. 단일 쿼리로 여러 리전·계정을 검색한다.\n\n### Resource Groups\nSCP의 리소스를 **그룹화**하여 관리하는 서비스. 공통 속성이나 태그를 기준으로 논리적으로 묶어 **환경·프로젝트 단위**로 관리하고, 그룹 단위로 검색·조회·관리해 운영 효율을 높인다.\n\n| 그룹 예시 | 기준 | 묶이는 자원 |\n|---|---|---|\n| 프로젝트 그룹 | 태그 project: Alpha | Virtual Server, Object Storage, Cloud Functions … (각각 project: Alpha) |\n| 개발 서버 그룹 | 자원유형 Virtual Server + 태그 env: dev | env: dev 태그가 붙은 Virtual Server 여러 대 |\n\n| 주요 기능 | 내용 |\n|---|---|\n| 리소스 그룹화 | 태그 기반 논리적 그룹화 (태그 자원당 **최대 50개**) |\n| 태그 기반 쿼리 | 태그로 리소스 검색·그룹화 |\n| 리소스 검색 | 지정된 쿼리와 일치하는 리소스 검색 |\n\nResource Group 생성:\n1. **Resource Group명** 입력\n2. **자원 유형** 지정\n3. 그룹핑할 **기준 태그** 설정\n4. 선택한 자원 유형에 따라 **대상 자원 확인**\n\nResource Group 상세: **그룹 자원 수정**을 클릭해 **그룹 자원 유형, 그룹 정의 태그를 수정**할 수 있다.\n\n> [!시험]\n> \"생성 후 자원 유형·태그를 수정할 수 없어 삭제 후 재생성해야 한다\" → **오답**. 상세 화면 '그룹 자원 수정'으로 바꾼다.\n\n### 태그 활용 원칙 (WA 비용최적화)\n- **유휴 자원 수명주기 관리**: 자원이 테스트용인지, **테스트 완료 시점**, 라이선스 **만료 기간** 등을 태그로 식별. 수명주기 태그 정책으로 자원의 **용도, 만료 기간** 등을 정한다. 이후 폐기 프로세스 수립(관련 부서·담당자 정보 포함, 사전 공지·확인 절차, 중요도 낮은 자원은 자동 폐기 가능)\n- **FinOps 할당(Allocation)**: 사용자, **태그**, 레이블 등 메타데이터로 비용을 팀·프로젝트에 할당하고 책임 부여 → 정확한 보고, Showback·Chargeback\n- **태그 규칙과 준수 방안 수립**: 임의의 태깅을 막기 위해 신속하게 태그 규칙을 수립해 자원에 적용. **정책 기반 태그 정리**\n- Quota Service, Secret Vault 등 여러 서비스 상세 화면에도 태그 탭이 있다(Secret Vault도 자원당 최대 50개).\n\n> [!시험]\n> - Cost Management 메뉴 구성, 비용 분석 **6개월**, 조회 기간 4가지 경우\n> - 예산: 월별=초기화, 전체=누적, 임계치 알림(반복 발송·수신자)\n> - Planned Compute: 인스턴스 타입 약정, **Scale-Up만**, 위약금 **50% × 잔여개월**, **2개월 후** 청구, Coverage\n> - 태그: Key/Value, **50개**, Resource Explorer 일괄 추가, Resource Groups 기준 태그·자원 유형(수정 가능)\n\n출처: ExploreManagement_7_Financial_Management 슬라이드1~28, ExploreManagement_8_Resource_Management 슬라이드1~17, WA백서 06 p.5~7, 13, 16~17, 22~23, 27~28, SEC4_KMS_SecretVault_SecretsManager 슬라이드27"}, "2-1a": {"title": "비용최적화 원칙 기반 복합 서비스 설계", "md": "## 한눈에 보기\n\nWA 백서 06 비용 최적화(Cost Optimization)는 세 부분으로 구성됩니다.\n\n| 장 | 핵심 질문 | 주요 내용 |\n|---|---|---|\n| I. 자원 선택 및 아키텍처 설계 | 무엇을, 어떤 요금으로, 어떤 구조로 쓸 것인가 | 과금 모델(Provisioning vs Pay-as-you-go), 자원 크기·수량, 요금제(Cost Savings·Planned Compute), 라이선스(BYOL), Auto-Scaling, Serverless 임시 부하 처리, 전송 비용 최소화 네트워크, 공통 서비스 영역 |\n| II. 사용량 관리 및 최적화 | 운영 중 비용을 어떻게 통제할 것인가 | 검토 주기, 사용량 증가 예측 6단계, 외부 영향 분석, 리사이징, 유휴 자원 폐기, 태그 기반 수명주기 |\n| III. FinOps 전략 수립 및 실행 | 조직·프로세스로 어떻게 정착시킬 것인가 | FinOps 원칙·주체·단계(Inform → Optimize → Operate)·도메인·성숙도(Crawl/Walk/Run), 비용 요구사항, 비용 모델링, CiO |\n\n> [!시험]\n> 비용 최적화 문제는 \"요청 기반 과금 서비스인가, Provisioning 서비스인가\"를 먼저 판별하면 대부분 풀립니다. Provisioning 서비스는 쓰지 않아도 과금 주기(시간/일/월)마다 비용이 나오고, Pay-as-you-go 서비스는 사용한 용량·호출 수만큼만 과금됩니다.\n\n## 1. 과금 모델에 따른 자원 선택\n\n### 1.1 두 가지 배포·과금 방식\n\n| 구분 | Provisioning | Pay-as-you-go |\n|---|---|---|\n| 배포 방식 | 특정 사양·서비스를 지정해 자원을 배포 | 실제 사용 전까지 비용 없음 |\n| 과금 | 사용하지 않아도 과금 주기(시간/일/월)에 따라 청구 | 사용 용량, 호출 횟수 등에 따라 청구 |\n| 유리한 워크로드 | 부하 변동이 적은 워크로드 | 부하가 주기적으로 급증하거나 예측이 어려운 워크로드 |\n\n두 방식을 섞어 과금하는 서비스도 있습니다(예: Transit Gateway는 시간당 요금과 GB당 전송 요금, VPN은 월 요금과 Internet Outbound 요금, KMS는 키 수와 호출당 요금).\n\n### 1.2 SCP 서비스별 과금 모델(표 6-1)\n\n| 서비스 | 배포 방식 | 과금 모델 |\n|---|---|---|\n| Virtual Server, GPU Server, Bare Metal Server, Multi-node GPU Cluster, Virtual Server DR | Provisioning | Per Hour |\n| Cloud Functions(컴퓨팅 시간 초-GB 같이 계산) | Pay-as-you-go | Per Call |\n| Block Storage | Provisioning | Per Usage(GB) - 할당량 |\n| Object Storage, File Storage, Archive Storage, Backup | Pay-as-you-go | Per Usage(GB) - 사용량 |\n| DBaaS, Kubernetes Engine | Provisioning | Per Hour |\n| Container Registry | Pay-as-you-go | Per Usage(GB) |\n| Public IP, NAT Gateway, VPC Endpoint, Direct Connect, SASE, Load Balancer, GSLB, Transit Gateway(GB당 전송요금 같이 계산) | Provisioning | Per Hour |\n| DNS | Provisioning | Per Day |\n| VPN(Internet Outbound 요금 같이 계산) | Provisioning | Per Month |\n| Internet Outbound Traffic, VPC Peering, Global CDN | P
