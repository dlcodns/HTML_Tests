<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLD 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: OMR answer-card exam — question sheet left, printed OMR column right (stacks on phones); database teal ink */
:root{
  --paper:#F4F7F7; --sheet:#FFFFFF; --ink:#152224; --muted:#5B6B6E; --line:#D9E3E4;
  --acc:#0E6F72; --acc-soft:#DFF0EF; --mark:#152224;
  --good:#22775A; --good-soft:#E0F1EA; --bad:#B24A2A; --bad-soft:#F7E6DF; --off:#7F8A8D; --off-soft:#ECEFF0;
  --warn:#9A6A00; --warn-soft:#FBF1D9; --code:#F1F5F5;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111819; --sheet:#1A2324; --ink:#E7EFEF; --muted:#98A9AB; --line:#2D3A3C;
  --acc:#5CC4C2; --acc-soft:#173335; --mark:#E7EFEF;
  --good:#5CC79C; --good-soft:#16332A; --bad:#EE916E; --bad-soft:#3A2219; --off:#8C9A9C; --off-soft:#253031;
  --warn:#E5B85C; --warn-soft:#352B14; --code:#141C1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111819; --sheet:#1A2324; --ink:#E7EFEF; --muted:#98A9AB; --line:#2D3A3C;
  --acc:#5CC4C2; --acc-soft:#173335; --mark:#E7EFEF;
  --good:#5CC79C; --good-soft:#16332A; --bad:#EE916E; --bad-soft:#3A2219; --off:#8C9A9C; --off-soft:#253031;
  --warn:#E5B85C; --warn-soft:#352B14; --code:#141C1D; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--acc);
  display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;color:var(--acc);background:none;border:0;padding:0}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px;font-weight:500}
.bar .sp{flex:1}
.timer{font-family:var(--mono);font-size:20px;font-weight:600;padding:2px 10px;border:1.5px solid var(--ink);border-radius:4px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.qtimer{font-family:var(--mono);font-size:14px;font-weight:600;padding:1px 8px;border:1.5px solid var(--ink);border-radius:4px}
.qtimer.warn{color:var(--bad);border-color:var(--bad)}
.prog{font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:8px 14px;border-radius:4px;font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* home */
.home{max-width:900px;margin:32px auto 0;display:grid;gap:32px}
.home h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.home h1 span{color:var(--acc)}
.lede{color:var(--muted);margin:0;max-width:62ch}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet);margin:0}
.spec div{padding:14px 16px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:0}
.spec dt{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.spec dd{margin:2px 0 0;font-weight:700;font-size:18px}
.block{display:grid;gap:12px}
h2.sec{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:700}
.mock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--sheet);border:1.5px solid var(--acc);border-radius:6px;padding:20px}
@media (max-width:620px){.mock{grid-template-columns:1fr}}
.alloc{display:flex;height:34px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.alloc div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--sheet);white-space:nowrap;overflow:hidden;min-width:0}
.alloc .s1{background:var(--acc)} .alloc .s2{background:color-mix(in srgb,var(--acc) 55%,var(--ink))}
.allocl{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.allocl b{color:var(--ink);font-family:var(--mono)}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sub{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.sub .sn{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:600}
.sub .st{font-weight:700;font-size:17px;line-height:1.3}
.sub .sm{font-size:12px;color:var(--muted);font-family:var(--mono)}
.bar2{height:6px;background:var(--off-soft);border-radius:999px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--good)}
.sub .row{display:flex;gap:6px;flex-wrap:wrap}
.sub .row .btn{padding:6px 10px;font-size:13px}
.opts-row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.opts-row label{display:flex;gap:6px;align-items:center}
.opts-row select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exb{display:grid;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.exb:hover,.sub .btn:hover{border-color:var(--acc)}
.exb .d{font-family:var(--mono);font-weight:600}
.exb .m{font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}
.notice{font-size:13px;background:var(--warn-soft);border-radius:6px;padding:10px 14px;margin:0}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:860px){.exam{grid-template-columns:1fr}}
.exam.solo{grid-template-columns:minmax(0,820px);justify-content:center}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px;min-width:0}
@media (max-width:620px){.qcard{padding:18px 16px}}
.qhead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-family:var(--display);font-size:28px;color:var(--acc);line-height:1}
.tag{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tag.g{border-color:var(--warn);color:var(--warn)}
.flagbtn{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 10px;font-size:13px}
.flagbtn.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.qbody{font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.qbody p{margin:0 0 8px}
.qbody p.lead{font-size:17px;font-weight:600}
.qbody blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--paper);border-radius:0 4px 4px 0}
.qbody ul{margin:6px 0 8px;padding-left:20px}
.qbody pre{margin:10px 0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:4px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;word-break:normal;overflow-wrap:normal}
.qbody code{font-family:var(--mono);font-size:.92em}
.qbody .tw{overflow-x:auto;margin:8px 0}
.qbody table{border-collapse:collapse;font-size:14px;background:var(--sheet)}
.qbody th,.qbody td{border:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.qbody th{background:var(--paper);font-weight:600}
.qbody .figtext{margin:8px 0;padding:8px 12px;border:1px dashed var(--line);border-radius:4px;font-size:14px;color:var(--muted)}
.miss{display:inline-block;font-size:13px;font-style:normal;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 8px;margin:2px 0}
.rv .qbody{font-size:14.5px}
.rv .qbody p.lead{font-size:15px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:12px 14px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .sq{font-family:var(--mono);font-size:13.5px}
.bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;margin-top:1px}
.opt.sel{border-color:var(--ink)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt:disabled{cursor:default}
.opt.fb-c{border-color:var(--good);background:var(--good-soft)}
.opt.fb-c .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.fb-w{border-color:var(--bad);background:var(--bad-soft)}
.opt.fb-w .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.short{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.short input{flex:1;min-width:180px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
.short input:focus{border-color:var(--acc)}
.short input:disabled{background:var(--paper)}
.fb{margin-top:14px;border-radius:6px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.fb.ok{background:var(--good-soft)} .fb.ng{background:var(--bad-soft)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.ng strong{color:var(--bad)}
.exp{font-size:14px;background:var(--paper);border-radius:4px;padding:10px 12px;white-space:pre-line;overflow-wrap:anywhere}
.exp b{color:var(--acc)}
.exp .who{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.nav .sp{flex:1}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}

.omr{background:var(--sheet);border:1.5px solid var(--acc);border-radius:6px;padding:14px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){.omr{position:static;max-height:none}}
.omr h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--acc);display:flex;justify-content:space-between}
.omr .sh{font-size:11px;color:var(--muted);margin:8px 4px 2px;letter-spacing:.04em}
.omr-grid{display:grid;grid-template-columns:1fr;gap:1px}
@media (max-width:860px){.omr-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:16px}}
.orow{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px}
.orow.cur{background:var(--acc-soft)}
.orow .n{width:30px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--acc);border:0;background:none;padding:0 4px 0 0}
.orow .n.fl{color:var(--bad);text-decoration:underline wavy}
.ob{width:20px;height:20px;border-radius:50%;border:1px solid var(--acc);background:transparent;color:var(--acc);font-family:var(--mono);font-size:10px;padding:0;display:grid;place-items:center}
.ob.on{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.osh{font-size:11px;color:var(--muted);border:1px dashed var(--acc);border-radius:10px;padding:0 8px;height:20px;display:flex;align-items:center;max-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:none}
.osh.on{border-style:solid;color:var(--ink)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.scrim{position:fixed;inset:0;background:rgba(10,16,18,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px;max-width:420px;width:100%}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* result */
.result{margin-top:28px;display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:24px}
@media (max-width:620px){.score{grid-template-columns:1fr}}
.big{font-family:var(--display);font-size:clamp(56px,12vw,88px);line-height:1}
.big small{font-family:var(--mono);font-size:18px;color:var(--muted);margin-left:6px}
.stamp{display:inline-block;font-family:var(--display);font-size:22px;padding:4px 14px;border:3px solid currentColor;border-radius:6px;transform:rotate(-4deg);margin-top:10px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--bad)}
.meter{position:relative;height:12px;background:var(--off-soft);border-radius:999px;margin:14px 0 6px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
.meter b{position:absolute;top:-3px;bottom:-3px;left:60%;width:2px;background:var(--bad)}
.mlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.facts strong{color:var(--ink)}
.tbl{overflow-x:auto}
.parts{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line)}
.parts th,.parts td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
.parts th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.parts td.r{text-align:right;font-family:var(--mono)}
.parts td.cut{color:var(--bad);font-weight:700}
.pbar{display:inline-block;width:80px;height:6px;background:var(--off-soft);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.review{display:grid;gap:12px}
.rv{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--off);border-radius:6px;padding:16px 18px;min-width:0}
.rv.ok{border-left-color:var(--good)} .rv.ng{border-left-color:var(--bad)}
.rv .qhead{margin-bottom:6px}
.stt{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.stt.ok{background:var(--good-soft);color:var(--good)} .stt.ng{background:var(--bad-soft);color:var(--bad)} .stt.off{background:var(--off-soft);color:var(--off)}
.rv ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.rv li{display:flex;gap:8px;font-size:14px;padding:4px 8px;border-radius:4px;overflow-wrap:anywhere;min-width:0}
.rv li.c{background:var(--good-soft)} .rv li.w{background:var(--bad-soft)}
.rv li .bub{width:20px;height:20px;font-size:10px}
.rv .sa{font-size:14px;margin:8px 0;display:grid;gap:2px}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{from{transform:scale(1.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}}
</style></head><body>

<div class="wrap">
  <header class="bar" id="bar"></header>
  <main id="app"></main>
</div>

<script>
const DATA = {"q":[{"id":"45-01","r":45,"n":1,"s":1,"b":"데이터 모델링을 수행할 때 유의해야 할 사항으로 가장 적절하지 않은 것은?","x":"설계 초기부터 반정규화를 하면 안 된다. 정규화 후 필요할 때만 한다.","o":["동일한 데이터가 여러 곳에 따로 저장되지 않도록 하여 데이터 중복을 최소화한다.","데이터 정의를 업무 프로세스와 분리하여, 업무가 바뀔 때마다 구조를 다시 뜯어고치지 않아도 되도록 설계한다.","같은 의미를 갖는 데이터가 서로 다른 값으로 관리되지 않도록 데이터 간 상호 연관 관계를 명확히 정의한다.","설계 초기 단계부터 반정규화를 적극적으로 수행하여 조회 성능을 최우선으로 확보한다."],"a":3},{"id":"45-02","r":45,"n":2,"s":1,"b":"다음은 어느 은행의 예금 상품에 대한 설명이다.\n> 원금, 예치기간, 이자율은 계약 시점에 업무 담당자가 직접 입력하는 값이다. 이자는 원금 × 이자율 × 예치기간으로 계산되어 관리된다. 예금분류는 상품을 구분하기 위해 시스템에서 부여한 코드 값이다.\n\n위 속성들에 대한 설명으로 가장 적절하지 않은 것은?","x":"이자율은 직접 입력하는 기본 속성이다. 이자만 파생 속성이다.","o":["원금과 예치기간은 업무로부터 직접 입력받는 기본 속성이다.","예금분류는 업무 편의를 위해 만들어낸 설계 속성이다.","이자와 이자율은 모두 다른 속성으로부터 계산되어 도출되는 파생 속성이다.","예금분류는 코드 값의 일관성을 위해 별도의 코드 엔터티로 분리하여 관리할 수 있다."],"a":2},{"id":"45-03","r":45,"n":3,"s":1,"b":"다음은 고객 엔터티의 정의와 인스턴스 예시이다.\n> 고객 엔터티 정의 — 주식별자: 고객번호 / 일반 속성: 고객명, 등급\n\n| 고객번호 | 고객명 | 등급 |\n|---|---|---|\n| C001 | 김하늘 | VIP |\n| C002 | 박도윤 | 일반 |\n| C003 | 이서연 | 일반 |\n\n인스턴스에 대한 설명으로 가장 적절하지 않은 것은?","x":"인스턴스는 속성 값들의 집합이므로 속성 없이 존재할 수 없다.","o":["고객번호가 C001인 행은 고객 엔터티의 인스턴스 하나에 해당한다.","하나의 엔터티는 두 개 이상의 인스턴스를 가질 수 있다.","인스턴스는 엔터티가 정의한 각 속성에 대응하는 값들의 집합으로 구성된다.","인스턴스는 속성이 하나도 정의되어 있지 않아도 그 자체로 존재할 수 있다."],"a":3},{"id":"45-04","r":45,"n":4,"s":1,"b":"다음 ERD(IE 표기법)에 대한 설명으로 가장 적절하지 않은 것은?\n[그림: 고객(#고객번호, 고객명) —주문한다— 주문(#주문번호, 고객번호 FK) / ○는 선택 참여, │는 필수 참여, 까마귀발은 여러 개(N)]","x":"주문은 반드시 한 명의 고객에 귀속된다(필수).","o":["한 명의 고객은 주문을 한 건도 하지 않을 수 있다.","한 명의 고객은 여러 건의 주문을 가질 수 있다.","하나의 주문은 반드시 한 명의 고객에 귀속된다.","하나의 주문은 귀속되는 고객이 없을 수도 있다."],"a":3},{"id":"45-05","r":45,"n":5,"s":1,"b":"부모 엔터티로부터 속성을 상속받되 이를 자식 엔터티의 주식별자로 사용하지 않는 관계(비식별자 관계)를 선택하는 경우로 가장 적절하지 않은 것은?","x":"생명주기가 완전히 같으면 식별자 관계가 적합하다.","o":["부모 엔터티의 인스턴스가 없어도 자식 엔터티의 인스턴스가 존재할 수 있는 경우","부모 엔터티와 자식 엔터티의 데이터 생명주기(Data Life Cycle)가 서로 다른 경우","여러 개의 엔터티가 하나로 통합되어 표현되었으나 각각이 별도의 관계를 갖는 경우","부모 엔터티와 자식 엔터티의 데이터 생명주기(Data Life Cycle)가 완전히 일치하는 경우"],"a":3},{"id":"45-06","r":45,"n":6,"s":1,"b":"다음 중 시스템으로 구축하고자 하는 업무에 대해 Key, 속성, 관계 등을 정확하게 표현하며, 재사용성이 가장 높은 데이터 모델링 단계로 가장 적절한 것은?","x":"Key·속성·관계를 정확히 표현하고 재사용성이 높은 것은 논리적 모델링이다.","o":["개념적 데이터 모델링","논리적 데이터 모델링","물리적 데이터 모델링","운영적 데이터 모델링"],"a":1},{"id":"45-07","r":45,"n":7,"s":1,"b":"다음 중 나열된 속성이 모두 파생 속성으로만 구성된 것은?","x":"최초주문일자·평균주문금액·총주문금액은 모두 주문에서 계산되는 파생 속성이다.","o":["회원번호, 회원명, 주소","상품코드, 단가, 상품명","최초주문일자, 평균주문금액, 총주문금액","주문번호, 주문일자, 상품코드"],"a":2},{"id":"45-08","r":45,"n":8,"s":1,"b":"두 엔터티 간의 관계에서 1:1, 1:M과 같이 관계에 참여하는 인스턴스의 수가 서로 어떻게 대응되는지를 나타내는 것으로 가장 적절한 것은?","x":"참여 인스턴스 수의 대응은 관계차수(Cardinality)다.","o":["관계명(Relationship Name)","관계차수(Cardinality)","관계선택사양(Optionality)","관계정의(Relationship Definition)"],"a":1},{"id":"45-09","r":45,"n":9,"s":1,"b":"업무에서 필요로 하여 인스턴스로 관리하고자 하는, 의미상 더 이상 분리되지 않는 최소의 데이터 단위를 무엇이라 하는지 쓰시오.","x":"의미상 더 이상 분리되지 않는 최소 데이터 단위는 속성이다.","t":"s","a":["속성","Attribute"]},{"id":"45-10","r":45,"n":10,"s":1,"b":"릴레이션에서 기본키가 아닌 모든 속성이 기본키 전체에 완전 함수 종속되어, 기본키의 일부에만 종속되는 부분 함수 종속이 존재하지 않는 상태를 무엇이라 하는지 쓰시오.","x":"부분 함수 종속이 없는 상태는 제2정규형이다.","t":"s","a":["제2정규형","2정규형","2NF","제2 정규형"]},{"id":"45-11","r":45,"n":11,"s":2,"b":"테이블에 새로운 행을 추가할 때 사용하는 DML 명령어로 가장 적절한 것은?","x":"행을 추가하는 DML은 INSERT다.","o":["SELECT","INSERT","UPDATE","DELETE"],"a":1},{"id":"45-12","r":45,"n":12,"s":2,"b":"다음 중 DUAL 테이블에서 실행했을 때 반환되는 값이 나머지 셋과 다른 것은?","x":"CEIL은 23, 나머지는 22다.","o":["CEIL(22.14)","FLOOR(22.14)","TRUNC(22.14)","ROUND(22.14)"],"a":0},{"id":"45-13","r":45,"n":13,"s":2,"b":"다음 \u003c도서> 테이블에서 '자료구조개론'과 같은 출판사에서 발행한 모든 도서의 대여상태를 '대여중'으로 변경하려고 한다. 가장 적절한 SQL은?\n\n| 도서번호 | 제목 | 출판사코드 | 대여상태 |\n|---|---|---|---|\n| B101 | 자료구조개론 | P07 | 보관 |\n| B102 | 통계학기초 | P12 | 보관 |\n| B103 | 알고리즘설계 | P07 | 보관 |","x":"자료구조개론의 출판사코드를 서브쿼리로 구해 같은 출판사의 도서를 모두 갱신한다.","o":["UPDATE 도서 SET 대여상태 = '대여중' WHERE 제목 = '자료구조개론';","UPDATE 도서 SET 대여상태 = '대여중' WHERE 출판사코드 = (SELECT 출판사코드 FROM 도서 WHERE 제목 = '자료구조개론');","UPDATE 도서 SET 출판사코드 = '대여중' WHERE 제목 = '자료구조개론';","UPDATE 도서 SET 대여상태 = '대여중' WHERE 출판사코드 = '자료구조개론';"],"a":1},{"id":"45-14","r":45,"n":14,"s":2,"b":"다음 \u003c탑승권> 테이블에서 항공사별 적립마일 합계를 조회하는 SQL로 가장 적절한 것은?\n\n| 항공사 | 예약번호 | 적립마일 |\n|---|---|---|\n| KOREAN | R01 | 1200 |\n| ASIANA | R02 | 800 |\n| KOREAN | R03 | 1500 |\n| JEJU | R04 | 400 |","x":"항공사별 합계는 GROUP BY 항공사다.","o":["SELECT SUM(적립마일) FROM 탑승권;","SELECT 항공사, SUM(적립마일) FROM 탑승권 GROUP BY 항공사;","SELECT 항공사, SUM(적립마일) FROM 탑승권;","SELECT 항공사, 적립마일 FROM 탑승권 ORDER BY 항공사;"],"a":1},{"id":"45-15","r":45,"n":15,"s":2,"b":"다음 중 데이터베이스에서 데이터 무결성을 유지하기 위한 방법과 가장 거리가 먼 것은?","x":"락은 동시성 제어 수단이고 무결성 유지 방법으로 보기 어렵다.","o":["애플리케이션 로직(Application Logic)","트리거(Trigger)","락(Lock)","제약조건(Constraints)"],"a":2},{"id":"45-16","r":45,"n":16,"s":2,"b":"집합 A = {1, 2, 3, 4}, 집합 B = {3, 4, 5, 6}일 때 결과가 {3, 4}가 되는 집합 연산으로 가장 적절한 것은?","x":"공통 원소만 남기는 것은 교집합이다.","o":["합집합(Union)","교집합(Intersection)","차집합(Difference, A - B)","곱집합(Cartesian Product)"],"a":1},{"id":"45-17","r":45,"n":17,"s":2,"b":"CTAS(CREATE TABLE ... AS SELECT) 방식으로 기존 테이블을 복제할 때의 특징으로 가장 적절하지 않은 것은?","x":"CTAS는 NOT NULL만 승계하고 다른 제약조건은 승계하지 않는다.","o":["원본 테이블에 저장된 데이터까지 함께 복제할 수 있다.","원본 테이블 컬럼의 데이터 타입이 그대로 승계된다.","원본 테이블에 정의된 모든 제약조건이 그대로 승계된다.","WHERE 1 = 2와 같이 항상 거짓인 조건을 주면 구조만 복제할 수 있다."],"a":2},{"id":"45-18","r":45,"n":18,"s":2,"b":"윈도우 함수 중 ORDER BY로 정렬된 파티션에서 첫 번째 행의 값을 반환하는 함수로 가장 적절한 것은?","x":"첫 번째 행의 값은 FIRST_VALUE다.","o":["FIRST_VALUE","LAST_VALUE","LAG","LEAD"],"a":0},{"id":"45-19","r":45,"n":19,"s":2,"b":"다음 \u003c회원> 테이블에서 소속 인원이 12명 이상인 등급에 속한 회원 중 누적포인트가 가장 높은 회원 한 명의 이름을 조회하려고 한다. 가장 적절한 SQL은?\n\n| 컬럼명 | 설명 |\n|---|---|\n| 회원번호 | 회원 식별자 |\n| 이름 | 회원 이름 |\n| 등급 | 회원이 속한 등급 |\n| 누적포인트 | 회원의 누적 포인트 |","x":"12명 이상인 등급을 서브쿼리로 구하고 누적포인트 순으로 1행만 가져온다.","o":["SELECT 이름 FROM 회원 WHERE 등급 IN (SELECT 등급 FROM 회원 GROUP BY 등급 HAVING COUNT(*) >= 12) ORDER BY 누적포인트 DESC FETCH FIRST 1 ROWS ONLY;","SELECT 이름 FROM 회원 WHERE COUNT(*) >= 12 ORDER BY 누적포인트 DESC FETCH FIRST 1 ROWS ONLY;","SELECT 이름 FROM 회원 GROUP BY 등급 HAVING COUNT(*) >= 12 ORDER BY 누적포인트 DESC;","SELECT 이름 FROM 회원 GROUP BY 등급, 이름, 누적포인트 HAVING COUNT(*) >= 12 AND 누적포인트 = MAX(누적포인트) ORDER BY 누적포인트 DESC;"],"a":0},{"id":"45-20","r":45,"n":20,"s":2,"b":"비어 있는 테이블 T에 대해 다음 트랜잭션을 순서대로 수행하였다. 최종적으로 테이블 T에 반영되어 남는 INSERT 문의 조합으로 가장 적절한 것은?\n*(트랜잭션 SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["(1), (4), (5)","(1), (2), (3), (4), (5)","(1), (2), (4), (5)","(4), (5)"],"a":2,"g":1,"m":1},{"id":"45-21","r":45,"n":21,"s":2,"b":"ROLLUP, CUBE, GROUPING SETS와 같이 GROUP BY 절을 확장하여 소계·중계·총계를 한 번에 생성하는 함수들을 통칭하는 용어로 가장 적절한 것은?","x":"ROLLUP, CUBE, GROUPING SETS를 그룹 함수라고 부른다.","o":["집계 함수(AGGREGATE FUNCTION)","윈도우 함수(WINDOW FUNCTION)","그룹 함수(GROUP FUNCTION)","순위 함수(RANK FUNCTION)"],"a":2},{"id":"45-22","r":45,"n":22,"s":2,"b":"문자열 'KNOWLEDGE'의 각 문자 위치는 다음과 같다.\n\n| 위치 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |\n|---|---|---|---|---|---|---|---|---|---|\n| 문자 | K | N | O | W | L | E | D | G | E |\n\n다음 중 실행 결과가 나머지 셋과 다른 것은? (Oracle 기준)","x":"SUBSTR의 길이가 음수면 NULL이고 나머지는 모두 'GE'다.","o":["SUBSTR('KNOWLEDGE', 8)","SUBSTR('KNOWLEDGE', -2)","SUBSTR('KNOWLEDGE', 9, -2)","SUBSTR('KNOWLEDGE', INSTR('KNOWLEDGE', 'G'), 2)"],"a":2},{"id":"45-23","r":45,"n":23,"s":2,"b":"다음 두 테이블에서 \u003c창고재고>에는 존재하지만 \u003c출고내역>에는 존재하지 않는 품목번호를 조회하려고 한다. 빈칸에 들어갈 조건으로 가장 적절한 것은?\n- 창고재고(품목번호, 품목명, 수량): (101, 볼펜, 50), (102, 노트, 30), (103, 지우개, 20)\n- 출고내역(품목번호, 출고일): (102, 2025-05-02), (103, 2025-05-07)","x":"출고내역에 없는 품목은 NOT EXISTS로 찾는다.","o":["EXISTS (SELECT 1 FROM 출고내역 B WHERE B.품목번호 = A.품목번호)","NOT EXISTS (SELECT 1 FROM 출고내역 B WHERE B.품목번호 = A.품목번호)","A.품목번호 IN (SELECT B.품목번호 FROM 출고내역 B)","A.품목번호 > (SELECT MAX(B.품목번호) FROM 출고내역 B)"],"a":1},{"id":"45-24","r":45,"n":24,"s":2,"b":"서로 다른 5개의 테이블을 하나의 SQL에서 모두 결합하기 위해 필요한 최소 조인 조건의 개수로 가장 적절한 것은?","x":"N개 테이블 조인에는 최소 N-1개의 조건이 필요하다.","o":["3","4","5","10"],"a":1},{"id":"45-25","r":45,"n":25,"s":2,"b":"다음 두 테이블에 대해 아래 MERGE 문을 실행하였다. 실행 후 \u003c고객> 테이블의 상태에 대한 설명으로 가장 적절한 것은?\n- 고객(타겟)(고객ID, 고객명, 등급): (C01, 김하늘, SILVER), (C02, 박도윤, SILVER), (C03, 이서연, GOLD)\n- 고객_변경(소스)(고객ID, 고객명, 등급): (C02, 박도윤, GOLD), (C04, 최민준, SILVER)\n\n*(MERGE SQL 원문 누락)*","x":"C02는 GOLD로 갱신되고 C04가 추가되어 4건이다.","o":["C02의 등급이 GOLD로 변경되고 C04가 새로 삽입되어 전체 4건이 된다.","C02는 매칭되었으므로 INSERT 절이 수행되어 고객ID가 C02인 행이 두 건이 된다.","소스에 존재하지 않는 C01과 C03이 자동으로 삭제되어 전체 2건이 된다.","소스에 없는 C01, C03의 등급까지 소스 기준으로 덮어써져 전체 3건의 등급이 모두 SILVER가 된다."],"a":0,"g":1,"m":1},{"id":"45-26","r":45,"n":26,"s":2,"b":"다음 두 테이블에 대해 아래 4개의 SQL을 각각 실행하였다. 결과가 나머지 셋과 다른 것은?\n- A.K: 1, 2, 3\n- B.K: 2, 3, 4","x":"UNION ALL은 중복 행(2,2), (3,3)이 두 번 나와 결과가 다르다.","o":["*(선지 원문 누락)*","*(선지 원문 누락)*","(SELECT A.K, B.K FROM A LEFT OUTER JOIN B ON A.K = B.K) UNION (SELECT A.K, B.K FROM A RIGHT OUTER JOIN B ON A.K = B.K);","(SELECT A.K, B.K FROM A LEFT OUTER JOIN B ON A.K = B.K) UNION ALL (SELECT A.K, B.K FROM A RIGHT OUTER JOIN B ON A.K = B.K);"],"a":3,"m":1},{"id":"45-27","r":45,"n":27,"s":2,"b":"다음 두 테이블에서 2025년 4월(2025-04-01 ~ 2025-04-30)의 지점별 매출액 합계를 조회하되, 해당 기간에 매출이 없는 지점도 결과에 포함되어야 한다. (날짜는 YYYY-MM-DD 형식으로 저장·비교된다고 가정한다.) 가장 적절한 SQL은?\n- 지점(지점코드, 지점명): (S01, 강남점), (S02, 판교점), (S03, 대전점)\n- 매출(매출ID, 지점코드, 매출일, 매출액): (M01, S01, 2025-04-05, 300000), (M02, S01, 2025-02-20, 900000), (M03, S02, 2025-04-18, 450000)","x":"기간 조건을 ON 절에 넣어야 매출 없는 지점도 LEFT JOIN으로 남는다.","o":["SELECT B.지점명, SUM(S.매출액) FROM 지점 B, 매출 S WHERE B.지점코드 = S.지점코드 AND S.매출일 BETWEEN '2025-04-01' AND '2025-04-30' GROUP BY B.지점명;","SELECT B.지점명, SUM(S.매출액) FROM 지점 B, 매출 S WHERE B.지점코드 = S.지점코드(+) GROUP BY B.지점명;","SELECT B.지점명, (SELECT SUM(S.매출액) FROM 매출 S WHERE S.지점코드 = B.지점코드) FROM 지점 B;","SELECT B.지점명, SUM(S.매출액) FROM 지점 B LEFT OUTER JOIN 매출 S ON B.지점코드 = S.지점코드 AND S.매출일 BETWEEN '2025-04-01' AND '2025-04-30' GROUP BY B.지점명;"],"a":3},{"id":"45-29","r":45,"n":29,"s":2,"b":"다음 \u003cT1> 테이블에 대해 아래 SQL을 실행했을 때의 결과로 가장 적절한 것은?\nT1.C1: 10, 20, NULL\n*(SQL 원문 누락)*","x":"원문 SQL 누락. AVG(C1)이면 NULL을 빼고 15다.","o":["10","15","20","NULL"],"a":1,"g":1,"m":1},{"id":"45-30","r":45,"n":30,"s":2,"b":"다음 \u003cSRC> 테이블에 대해 아래 SQL을 실행한 후 TABLE1, TABLE2, TABLE3의 행 수를 순서대로 나열한 것은? (세 테이블은 실행 전 모두 비어 있다.)\nSRC.N1: 100, 200, 50\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["(2, 0, 1)","(3, 1, 0)","(2, 1, 0)","(1, 1, 1)"],"a":0,"g":1,"m":1},{"id":"45-31","r":45,"n":31,"s":2,"b":"다음 네 테이블에 대해 아래 SQL을 실행했을 때의 결과 건수로 가장 적절한 것은?\n각 테이블은 COL1 컬럼 하나만 가지며 2행씩 저장되어 있다.\n- T1: 1, 2\n- T2: 1, 3\n- T3: 1, 4\n- T4: 1, 5\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 네 테이블을 COL1로 조인하면 공통값 1만 남아 1건이다.","o":["0","1","2","3"],"a":1,"g":1,"m":1},{"id":"45-32","r":45,"n":32,"s":2,"b":"충분히 많은 행을 가진 테이블 EMP에 대해 다음 SQL을 각각 수행했을 때, 반환되는 행 수가 나머지 셋과 다른 것은? (Oracle 기준)","x":"ROWNUM \u003c= 2만 2행이고 나머지는 1행이다.","o":["SELECT * FROM EMP WHERE ROWNUM = 1;","SELECT * FROM EMP WHERE ROWNUM \u003c 2;","SELECT * FROM EMP WHERE ROWNUM \u003c= 2;","*(선지 원문 누락)*"],"a":2,"g":1,"m":1},{"id":"45-33","r":45,"n":33,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행했을 때의 결과로 가장 적절한 것은?\n- T1.N1: 1, 2, 3\n- T3.N1: 2, 4, NULL\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NOT IN 서브쿼리에 NULL이 있어 0으로 추정했다.","o":["0","2","3","문법 오류가 발생한다."],"a":0,"g":1,"m":1},{"id":"45-34","r":45,"n":34,"s":2,"b":"다음 \u003cT> 테이블에 대해 아래 두 SQL을 각각 실행하였다.\nT(COL1, COL2): (10, 20), (30, 40), (50, NULL), (NULL, 60)\n*(SQL1·SQL2 원문 누락)*\n\n두 SQL의 결과에 대한 설명으로 가장 적절한 것은?","x":"원문 SQL 누락. SUM(NVL)은 NULL을 0으로 바꿔 모든 행을 반영하고, SUM(COL1+COL2)는 NULL 행을 뺀다.","o":["두 SQL의 결과는 항상 동일하다.","SQL1은 NULL을 행마다 0으로 치환해 전부 반영되지만, SQL2는 NULL이 낀 행은 제외된다.","SQL2의 결과는 SQL1의 결과보다 항상 크다.","SQL1의 결과는 SQL2의 결과보다 항상 작다."],"a":1,"g":1,"m":1},{"id":"45-36","r":45,"n":36,"s":2,"b":"다음 \u003c배송> 테이블에 대해 아래 4개의 SQL을 각각 실행하였다. 결과가 나머지 셋과 다른 것은?\n\n| 번호 | 구역 | 상태 |\n|---|---|---|\n| 1 | 서울 | 접수 |\n| 2 | 서울 | 배송중 |\n| 3 | 부산 | 배송중 |\n| 4 | 서울 | 반품 |\n| 5 | 부산 | 완료 |","x":"AND가 OR보다 먼저 계산되어 부산 배송중·완료까지 포함된다.","o":["SELECT * FROM 배송 WHERE 구역 = '서울' AND 상태 IN ('접수', '배송중', '완료');","SELECT * FROM 배송 WHERE 구역 = '서울' AND 상태 = '접수' OR 상태 = '배송중' OR 상태 = '완료';","SELECT * FROM 배송 WHERE (구역, 상태) IN (('서울', '접수'), ('서울', '배송중'), ('서울', '완료'));","SELECT * FROM 배송 WHERE 구역 = '서울' AND (상태 = '접수' OR 상태 = '배송중' OR 상태 = '완료');"],"a":1},{"id":"45-37","r":45,"n":37,"s":2,"b":"다음 두 테이블에 대해 아래 두 SQL을 각각 실행하였다.\n- 영업부(사원명, 급여): (김하늘, 3000), (박도윤, 4500), (이서연, 6000)\n- 개발부(사원명, 급여): (최민준, 2500), (정예은, 5000), (한지호, 7000)\n\n*(SQL1·SQL2 원문 누락)*\n\n두 SQL에 대한 설명으로 가장 적절한 것은?","x":"원문 SQL 누락. > ANY는 최솟값(2500) 초과, > ALL은 최댓값(7000) 초과로 추정했다.","o":["SQL1은 2건, SQL2는 1건을 반환한다. ANY는 서브쿼리 결과 중 최솟값보다 크면 참이 되고, ALL은 최댓값보다 커야 참이 되기 때문이다.","SQL1은 서브쿼리 결과를 모두 만족해야 하므로 1건, SQL2는 하나만 만족해도 되므로 2건을 반환한다.","ANY는 IN과, ALL은 NOT IN과 완전히 동일한 의미이므로 두 SQL의 결과는 서로 같다.","서브쿼리 결과에 NULL이 포함되어 있으므로 두 SQL 모두 0건을 반환한다."],"a":0,"g":1,"m":1},{"id":"45-38","r":45,"n":38,"s":2,"b":"DELETE, TRUNCATE, DROP에 대한 설명으로 가장 적절하지 않은 것은?","x":"TRUNCATE는 DDL이라 ROLLBACK으로 되돌릴 수 없다.","o":["DELETE는 WHERE 절을 사용하여 조건에 맞는 일부 행만 삭제할 수 있다.","DROP은 테이블에 저장된 데이터뿐만 아니라 테이블 정의 자체를 삭제한다.","TRUNCATE는 대량의 행을 삭제할 때 일반적으로 DELETE보다 빠르다.","TRUNCATE로 삭제한 데이터는 COMMIT을 수행하기 전이라면 ROLLBACK으로 되돌릴 수 있다."],"a":3},{"id":"45-39","r":45,"n":39,"s":2,"b":"WHERE 절에 사용되는 서브쿼리에 대한 설명으로 가장 적절하지 않은 것은?","x":"최종 결과는 메인쿼리를 따른다.","o":["서브쿼리는 메인쿼리의 조건을 판별하기 위한 용도로 사용된다.","서브쿼리는 반환하는 행의 수에 따라 단일행 서브쿼리와 다중행 서브쿼리로 구분된다.","상관 서브쿼리는 서브쿼리 내부에서 메인쿼리의 컬럼을 참조할 수 있다.","메인쿼리와 서브쿼리가 함께 사용되면 최종 조회 결과는 항상 서브쿼리의 결과를 따른다."],"a":3},{"id":"45-40","r":45,"n":40,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행했을 때의 결과 건수로 가장 적절한 것은?\n- T1(ID, NAME): (1, AAA), (2, BBB)\n- T2(ID, TYPE): (1, X), (2, Y)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["0","1","2","문법 오류가 발생한다."],"a":2,"g":1,"m":1},{"id":"45-41","r":45,"n":41,"s":2,"b":"다음 \u003c매출> 테이블에 대해 아래 SQL을 실행하였다. 결과에서 월이 4인 행의 PREV 값을 쓰시오.\n매출(월, 매출액): (1, 120), (2, 150), (3, 90), (4, 200), (5, 170)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. LAG(매출액)이면 4월 행의 PREV는 3월 값 90이다.","t":"s","a":["90"],"g":1,"m":1},{"id":"45-44","r":45,"n":44,"s":2,"b":"다음 \u003c조직> 테이블에 대해 아래 SQL을 실행하였다. 결과에서 두 번째로 출력되는 C3 값을 쓰시오.\n조직(C1, C2, C3): (1, NULL, 본부), (2, 1, 기획팀), (3, 1, 영업팀), (4, 2, 기획1파트)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 본부에서 시작하는 순방향 전개라면 두 번째 행은 기획팀이다.","t":"s","a":["기획팀"],"g":1,"m":1},{"id":"45-46","r":45,"n":46,"s":2,"b":"GRANT, REVOKE와 같이 데이터베이스 사용자에게 권한을 부여하거나 회수하는 SQL 명령어가 속하는 분류를 영문 약어로 쓰시오.","x":"권한을 부여·회수하는 명령어는 DCL이다.","t":"s","a":["DCL"]},{"id":"45-47","r":45,"n":47,"s":2,"b":"다음과 같이 VAL 값이 8건 저장된 \u003cT> 테이블에 대해 아래 SQL을 실행하였다. (ㄱ)과 (ㄴ)에 들어갈 값을 순서대로 쓰시오.\nT.VAL: 10, 20, 30, 40, 50, 60, 70, 80\n*(SQL 원문 누락)*\n\n| GRP | CNT |\n|---|---|\n| 1 | (ㄱ) |\n| 2 | 3 |\n| 3 | (ㄴ) |","x":"8행을 3그룹으로 나누면 3, 3, 2개다.","t":"s","a":["3,2","3 2"],"m":1},{"id":"45-48","r":45,"n":48,"s":2,"b":"다음 \u003c연락처> 테이블에 대해 아래 SQL을 실행했을 때의 결과 값을 쓰시오.\n연락처(ID, TEL): (1, 010-1234-5678), (2, 010-123-5678), (3, 011-9876-5432), (4, 010-12345-678), (5, 010-4567-890), (6, 0101234-5678)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. '010-NNNN-NNNN' 형식 검사라면 2건으로 추정했다.","t":"s","a":["2"],"g":1,"m":1},{"id":"45-49","r":45,"n":49,"s":2,"b":"다음 \u003c연락처> 테이블에 대해 아래 SQL을 실행하였다. 결과에서 사원명이 '박도윤'인 행의 대표연락처 값을 쓰시오.\n\n| 사원명 | 휴대폰 | 집전화 | 회사전화 |\n|---|---|---|---|\n| 김하늘 | 010-1111-2222 | 02-100-1000 | 02-200-2000 |\n| 박도윤 | NULL | 02-300-3000 | 02-400-4000 |\n| 이서연 | NULL | NULL | 02-500-5000 |\n| 최민준 | NULL | NULL | NULL |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. COALESCE(휴대폰, 집전화, 회사전화)라면 집전화가 나온다.","t":"s","a":["02-300-3000"],"g":1,"m":1},{"id":"46-01","r":46,"n":1,"s":1,"b":"데이터 모델링 단계 중 논리 데이터 모델링 단계에서 수행하는 활동으로 가장 적절하지 않은 것은?","x":"주제영역과 범위 설정은 개념 모델링 단계의 활동이다.","o":["업무에서 관리해야 할 엔터티와 속성, 엔터티 사이의 관계를 도출한다.","각 엔터티의 주식별자를 확정하고 정규화를 수행하여 데이터 중복을 제거한다.","업무 전반을 주제영역으로 나누고 데이터 모델링의 대상 업무 범위를 설정한다.","공통 속성을 기준으로 슈퍼타입과 서브타입을 분리하거나 하나로 통합한다."],"a":2},{"id":"46-02","r":46,"n":2,"s":1,"b":"다음은 서로 다른 두 유형의 관계를 표현한 ERD이다. 〈ㄱ〉과 〈ㄴ〉에 대한 설명으로 가장 적절한 것은?\n[그림: 〈ㄱ〉 주문(#주문번호) — 주문상세(#주문번호, #상세순번) / 〈ㄴ〉 부서(#부서코드) — 사원(#사원번호, 부서코드 FK) / 실선은 〈ㄱ〉, 점선은 〈ㄴ〉, #는 주식별자 구성 속성]","x":"〈ㄱ〉은 부모 식별자를 자식 주식별자 일부로 상속하는 식별 관계(실선)다.","o":["〈ㄱ〉의 자식 엔터티는 부모 인스턴스가 없어도 독립적으로 생성될 수 있다.","〈ㄴ〉은 부모의 주식별자를 자식의 주식별자로 상속하므로 부모 인스턴스 없이는 자식 인스턴스가 존재할 수 없다.","〈ㄱ〉은 부모 엔터티의 주식별자를 자식 엔터티의 주식별자 일부로 상속하며 실선으로 표기한다.","〈ㄴ〉처럼 점선으로 표기된 관계에서도 자식은 언제나 부모를 반드시 가져야 한다."],"a":2},{"id":"46-03","r":46,"n":3,"s":1,"b":"다음 ERD는 A, B, C, D 네 엔터티가 모두 1:N 식별자 관계로 연쇄된 구조를 나타낸다. 이 모델에 대한 설명으로 가장 적절하지 않은 것은?\n[그림: A(#A키) → B(#A키, #B키) → C(#A키, #B키, #C키) → D(#A키, #B키, #C키, #D키) / 모두 1:N 식별자 관계(실선)]","x":"비식별자 관계로 바꾸면 A키가 C까지 상속되지 않아 A와 C를 직접 조인할 수 없다.","o":["A의 주식별자는 B를 거쳐 C, D까지 순차적으로 상속된다.","C는 A의 주식별자를 이미 보유하므로 B를 경유하지 않고 A와 직접 조인할 수 있다.","D의 주식별자에는 A, B, C의 주식별자가 모두 포함된다.","A와 B의 관계를 비식별자 관계로 변경하면 A와 C를 직접 조인하기가 더 쉬워진다."],"a":3},{"id":"46-04","r":46,"n":4,"s":1,"b":"다음은 속성을 발생 원인에 따라 구분한 설명이다. ㄱ~ㄷ에 해당하는 속성 유형을 순서대로 올바르게 나열한 것은?\n- ㄱ: 업무 분석을 통해 업무로부터 직접 도출된 속성\n- ㄴ: 원래 업무에는 없었으나 데이터 모델링 과정에서 새롭게 만들어 낸 속성\n- ㄷ: 다른 속성의 값을 계산하거나 가공하여 만들어 낸 속성","x":"ㄱ 기본속성, ㄴ 설계속성, ㄷ 파생속성이다.","o":["설계속성 - 기본속성 - 파생속성","기본속성 - 설계속성 - 파생속성","파생속성 - 설계속성 - 기본속성","기본속성 - 파생속성 - 설계속성"],"a":1},{"id":"46-05","r":46,"n":5,"s":1,"b":"인조식별자(Artificial Identifier)에 대한 설명으로 가장 적절한 것은?","x":"인조식별자는 복잡한 자연식별자를 대체하려고 인위적으로 부여한 식별자다.","o":["인조식별자를 부여하면 속성 간 함수적 종속 관계가 깨지므로 정규화 원칙에 위배된다.","업무를 수행하는 과정에서 자연스럽게 만들어진 값을 그대로 주식별자로 채택한 식별자를 말한다.","다른 엔터티와의 관계를 통해 상속받은 외부식별자와 완전히 동일한 개념이다.","업무적 의미를 갖지 않는 값을 인위적으로 부여한 식별자로, 자연식별자가 여러 속성으로 구성되어 복잡할 때 이를 대체할 목적으로 사용한다."],"a":3},{"id":"46-06","r":46,"n":6,"s":1,"b":"다음 설명에 해당하는 정규형으로 가장 적절한 것은?\n> 제1정규형을 만족하면서, 주식별자가 아닌 모든 속성이 주식별자 전체에 완전 함수 종속되도록 부분 함수 종속을 제거한 상태","x":"부분 함수 종속을 제거한 상태는 제2정규형이다.","o":["제1정규형","제2정규형","제3정규형","보이스-코드 정규형(BCNF)"],"a":1},{"id":"46-07","r":46,"n":7,"s":1,"b":"다음 컴퓨터(Computer)와 마더보드(Motherboard) 간 ERD의 해석으로 가장 적절한 것은?\n[그림: 컴퓨터 — 마더보드 / 엔터티에 가까운 기호가 최대, 먼 기호가 최소 (│는 1, ○는 0·선택)]\n※ 표기법: 관계선 끝에 붙은 기호는 그 기호가 닿아 있는 쪽 엔터티가 몇 개 대응되는지를 나타낸다. 한쪽 끝에 기호가 두 개 있으면 엔터티에 가까운 기호가 최대 개수를, 먼 기호가 최소 개수를 뜻한다. 세로선(|)은 1개, 원(○)은 0개도 가능(선택), 까마귀발은 여러 개(N)를 뜻한다.","x":"관계선에 ○(선택)가 있어 마더보드가 없을 수도 있다.","o":["모든 컴퓨터에는 마더보드가 반드시 하나 장착되어 있어야 한다.","하나의 컴퓨터에 마더보드가 장착되어 있을 수도 있고 장착되어 있지 않을 수도 있다.","하나의 컴퓨터에는 여러 개의 마더보드를 동시에 장착할 수 있다.","컴퓨터와 마더보드는 다대다 관계이므로 연결 엔터티를 두어야 한다."],"a":1,"g":1},{"id":"46-08","r":46,"n":8,"s":1,"b":"다음은 식별자를 분류한 설명이다. ㄱ~ㄹ에 해당하는 용어를 순서대로 올바르게 나열한 것은?\n- ㄱ: 엔터티를 대표할 수 있는 유일한 식별자로, 다른 엔터티와 참조 관계를 연결할 수 있다\n- ㄴ: 인스턴스를 구분할 수는 있으나 대표성이 없어 참조 관계를 연결하지 못한다\n- ㄷ: 업무에 의해 자연스럽게 만들어진 식별자\n- ㄹ: 다른 엔터티와의 관계를 통해 상속받은 식별자","x":"ㄱ 주식별자, ㄴ 보조식별자, ㄷ 본질식별자, ㄹ 외부식별자다.","o":["보조식별자 - 주식별자 - 본질식별자 - 외부식별자","주식별자 - 보조식별자 - 외부식별자 - 본질식별자","주식별자 - 보조식별자 - 본질식별자 - 외부식별자","본질식별자 - 보조식별자 - 주식별자 - 외부식별자"],"a":2},{"id":"46-09","r":46,"n":9,"s":1,"b":"다음 설명에 해당하는 용어를 쓰시오.\n> 엔터티의 각 속성이 가질 수 있는 값의 범위를 의미하며, 데이터 타입·길이·허용 값 등으로 정의된다.","x":"속성이 가질 수 있는 값의 범위는 도메인이다.","t":"s","a":["도메인","Domain"]},{"id":"46-10","r":46,"n":10,"s":1,"b":"다음은 주식별자가 갖추어야 할 특성을 정리한 표이다. (ㄱ)과 (ㄴ)에 들어갈 용어를 각각 쓰시오.\n\n| 특성 | 설명 |\n|---|---|\n| 유일성 | 주식별자 값으로 엔터티의 모든 인스턴스를 유일하게 구분할 수 있어야 한다 |\n| 존재성 | 주식별자로 지정된 속성에는 NULL 값이 올 수 없다 |\n| (ㄱ) | 유일성을 만족하는 데 필요한 최소한의 속성 수로만 구성되어야 한다 |\n| (ㄴ) | 한 번 부여된 주식별자 값은 이후에 변하지 않아야 한다 |","x":"ㄱ은 최소성, ㄴ은 불변성이다.","t":"s","a":["최소성,불변성","최소성 불변성"]},{"id":"46-11","r":46,"n":11,"s":2,"b":"다음 조직 테이블에 대해 아래 SQL을 수행한 결과 행 수로 가장 적절한 것은?\n조직(사원코드, 상위코드, 순번): (C001, NULL, 1), (C002, C001, 2), (C003, C002, 3), (C004, C002, 4)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["1건","2건","3건","4건"],"a":2,"g":1,"m":1},{"id":"46-12","r":46,"n":12,"s":2,"b":"COL의 값이 NULL일 때, 다음 중 실행 결과가 나머지 셋과 다른 것은? (단, 각 함수는 해당 함수를 지원하는 DBMS에서 수행한다고 가정한다.)","x":"NULLIF(NULL, 'A')는 NULL이고, 나머지는 'A'를 반환한다.","o":["SELECT IFNULL(COL, 'A') FROM T1;","SELECT NVL(COL, 'A') FROM T1;","SELECT COALESCE(COL, 'A') FROM T1;","SELECT NULLIF(COL, 'A') FROM T1;"],"a":3},{"id":"46-13","r":46,"n":13,"s":2,"b":"다음 사원 테이블에서 최상위 관리자부터 하위 사원 방향으로 조직 계층을 전개하려고 한다. (ㄱ), (ㄴ), (ㄷ)에 들어갈 내용으로 가장 적절한 것은?\n사원(사원번호, 사원명, 관리자번호): (1001, 김대표, NULL), (1002, 이본부, 1001), (1003, 박팀장, 1002), (1004, 최사원, 1003)\n*(SQL 원문 누락 — START WITH (ㄱ) CONNECT BY PRIOR (ㄴ) = (ㄷ) 형태로 추정)*","x":"START WITH 관리자번호 IS NULL, CONNECT BY PRIOR 사원번호 = 관리자번호다.","o":["(ㄱ) 관리자번호 = 사원번호, (ㄴ) 사원번호, (ㄷ) 관리자번호","(ㄱ) 사원번호 IS NULL, (ㄴ) 사원번호, (ㄷ) 관리자번호","(ㄱ) 관리자번호 IS NULL, (ㄴ) 관리자번호, (ㄷ) 사원번호","(ㄱ) 관리자번호 IS NULL, (ㄴ) 사원번호, (ㄷ) 관리자번호"],"a":3,"m":1},{"id":"46-14","r":46,"n":14,"s":2,"b":"다음 두 테이블에 대해 SQL (가)와 (나)를 각각 수행하였다. 두 결과의 차이를 설명한 것으로 가장 적절한 것은?\n- 상반기실적.사원명: 김민준, 이서연, 박도윤\n- 하반기실적.사원명: 이서연, 최지우\n\n*((가)·(나) SQL 원문 누락)*","x":"원문 SQL 누락. (가) UNION ALL 5건, (나) UNION 4건으로 추정했다.","o":["(나)는 중복 제거 과정을 생략하므로 일반적으로 (가)보다 빠르게 수행된다.","(가)와 (나)의 결과 건수는 항상 같으며 행이 출력되는 순서만 달라진다.","(가)는 5건, (나)는 4건을 반환하며, UNION은 결합 후 중복 행을 제거한다.","(가)는 두 SELECT의 컬럼 개수가 서로 달라도 결합할 수 있다."],"a":2,"g":1,"m":1},{"id":"46-15","r":46,"n":15,"s":2,"b":"다음 실적 테이블에 대해 아래 네 SQL을 수행하였을 때, 결과가 나머지 셋과 다른 것은?\n실적(A, X): (가, 10), (가, 20), (나, 30), (나, 40)","x":"GROUPING SETS(A)에는 총계가 없어 2행이다. 나머지는 총계를 포함해 3행이다.","o":["SELECT A, SUM(X) FROM 실적 GROUP BY A UNION ALL SELECT NULL, SUM(X) FROM 실적;","SELECT A, SUM(X) FROM 실적 GROUP BY ROLLUP(A);","SELECT A, SUM(X) FROM 실적 GROUP BY CUBE(A);","SELECT A, SUM(X) FROM 실적 GROUP BY GROUPING SETS(A);"],"a":3},{"id":"46-16","r":46,"n":16,"s":2,"b":"SQL 명령어의 분류에 대한 설명으로 가장 적절하지 않은 것은?","x":"CREATE, ALTER, DROP은 DDL이다.","o":["DML에는 SELECT, INSERT, UPDATE, DELETE가 속한다.","TCL에는 COMMIT, ROLLBACK, SAVEPOINT가 속한다.","DCL에는 CREATE, ALTER, DROP이 속한다.","DCL에는 GRANT, REVOKE가 속한다."],"a":2},{"id":"46-17","r":46,"n":17,"s":2,"b":"제약조건(Constraint)에 대한 설명으로 가장 적절하지 않은 것은?","x":"기본키는 테이블에 하나만 지정할 수 있다.","o":["외래키(FOREIGN KEY)는 참조하는 테이블의 기본키 또는 고유키를 가리켜야 한다.","기본키로 지정된 컬럼에는 NULL 값을 입력할 수 없다.","CHECK 제약조건은 컬럼에 입력될 수 있는 값의 범위나 조건을 제한한다.","기본키(PRIMARY KEY) 제약조건은 하나의 테이블에 여러 개를 지정할 수 있다."],"a":3},{"id":"46-18","r":46,"n":18,"s":2,"b":"재고 테이블에 대해 다음 세 SQL을 수행하였을 때 반환되는 값을 (1), (2), (3) 순서대로 나열한 것으로 가장 적절한 것은?\n*(테이블 및 SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["NULL, NULL, 0","NULL, NULL, NULL","0, NULL, NULL","0, NULL, 0"],"a":0,"g":1,"m":1},{"id":"46-19","r":46,"n":19,"s":2,"b":"다음 세 테이블에 대해 아래 SQL을 수행한 결과 건수로 가장 적절한 것은?\n- T1.COL: 10, 20, 30\n- T2.COL: 30, 40, 50\n- T3.COL: 50, 60\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["3건","4건","5건","6건"],"a":1,"g":1,"m":1},{"id":"46-20","r":46,"n":20,"s":2,"b":"다음 SQL을 수행할 때, 대응되는 행의 존재 여부와 관계없이 모든 행이 결과에 남는 테이블로 가장 적절한 것은?\n- 강사(강사번호, 강사명): (T1, 김강사), (T2, 이강사), (T3, 박강사)\n- 세션(세션번호, 강사번호): (S1, T1), (S2, T2)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 강사 LEFT OUTER JOIN 세션으로 추정했다.","o":["강사 테이블과 세션 테이블 모두","세션 테이블","강사 테이블","두 테이블 중 어느 쪽도 보장되지 않는다"],"a":2,"g":1,"m":1},{"id":"46-21","r":46,"n":21,"s":2,"b":"서브쿼리에 대한 설명으로 가장 적절하지 않은 것은?","x":"다중 행 서브쿼리에는 IN·ANY·ALL을 써야 한다.","o":["단일 행 서브쿼리는 =, >, \u003c= 등 단일 행 비교 연산자와 함께 사용한다.","다중 행 서브쿼리에도 =, >= 등 단일 행 비교 연산자를 그대로 사용할 수 있다.","다중 행 서브쿼리는 IN 연산자를 사용해 여러 값과 한 번에 비교할 수 있다.","스칼라 서브쿼리는 하나의 값을 반환하므로 SELECT 절에서도 사용할 수 있다."],"a":1},{"id":"46-22","r":46,"n":22,"s":2,"b":"다음 윈도우 함수 중 순위를 부여하는 함수에 해당하지 않는 것은?","x":"RATIO_TO_REPORT는 비율 함수다.","o":["RANK()","DENSE_RANK()","ROW_NUMBER()","RATIO_TO_REPORT()"],"a":3},{"id":"46-23","r":46,"n":23,"s":2,"b":"다음 실적 테이블에 대해 부서별 금액 오름차순 누적합을 구하되, 금액이 같은 사번 2번과 3번에는 모두 500이 조회되도록 하려고 한다. ㉠에 들어갈 윈도우 프레임 절로 가장 적절한 것은?\n실적(사번, 부서, 금액): (1, A, 100), (2, A, 200), (3, A, 200), (4, A, 300)\n*(SQL 원문 누락)*","x":"같은 금액을 같은 범위로 보는 RANGE를 써야 둘 다 500이 된다.","o":["ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW","RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW","ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING","RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING"],"a":1,"m":1},{"id":"46-24","r":46,"n":24,"s":2,"b":"다음 SQL의 RESULT 컬럼에 대한 설명으로 가장 적절한 것은?\n사원(사원명, 연봉): (김서진, 4000), (이하람, 5500), (박도현, 3200)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["모든 행에 사원 테이블 전체의 최고 연봉이 반환된다.","각 행에 그 행 자신의 연봉 값이 그대로 반환된다.","각 행에 자신보다 앞선 행까지의 누적 최고 연봉이 반환된다.","프레임 지정이 잘못되어 오류가 발생한다."],"a":2,"g":1,"m":1},{"id":"46-25","r":46,"n":25,"s":2,"b":"다음 두 테이블에 대해 아래 네 SQL을 수행하였을 때, 조회 결과에 중복된 직급 값이 그대로 남는 것은?\n- 사원(사원번호, 직급, 부서번호): (1001, 대리, 10), (1002, 대리, 20), (1003, 과장, 10), (1004, 사원, 20)\n- 부서(부서번호, 부서명): (10, 영업부), (20, 기획부)","x":"EXISTS는 중복을 제거하지 않아 대리가 두 번 나온다.","o":["SELECT E.직급 FROM 사원 E WHERE EXISTS (SELECT 1 FROM 부서 D WHERE D.부서번호 = E.부서번호);","SELECT DISTINCT 직급 FROM 사원;","SELECT 직급 FROM 사원 GROUP BY 직급;","SELECT 직급 FROM 사원 UNION SELECT 직급 FROM 사원;"],"a":0},{"id":"46-26","r":46,"n":26,"s":2,"b":"다음 사원 테이블에서 부서별 평균 키가 180 이상인 부서만 조회하려고 한다. 가장 적절한 SQL은?\n사원(사원명, 부서, 키): (김서준, 개발1팀, 178), (이하윤, 개발1팀, 182), (박지훈, 개발1팀, 186), (정예린, 개발2팀, 170), (한도현, 개발2팀, 174)","x":"그룹 조건은 GROUP BY 후 HAVING으로 건다.","o":["SELECT 부서, AVG(키) FROM 사원 WHERE AVG(키) >= 180 GROUP BY 부서;","SELECT 부서, AVG(키) FROM 사원 GROUP BY 부서 HAVING AVG(키) >= 180;","SELECT 부서, AVG(키) FROM 사원 HAVING AVG(키) >= 180;","SELECT 부서, AVG(키) FROM 사원 WHERE 키 >= 180 GROUP BY 부서;"],"a":1},{"id":"46-27","r":46,"n":27,"s":2,"b":"다음 사원 테이블에 대해 아래 SQL을 수행한 결과로 가장 적절한 것은?\n사원(사원명, 급여, 부서): (김민재, 5000, 영업부), (이수현, 4200, 영업부), (박준영, 3800, 기획부), (최나은, 4600, 기획부)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 부서별 MAX를 = 로 비교해 단일행 오류가 난다고 추정했다.","o":["전체에서 급여가 가장 높은 사원 1명이 조회된다.","부서별로 급여가 가장 높은 사원이 모두 조회된다.","WHERE 조건이 항상 참이 되어 사원 테이블의 모든 행이 조회된다.","단일 행 서브쿼리가 두 개 이상의 행을 반환하여 오류가 발생한다."],"a":3,"g":1,"m":1},{"id":"46-28","r":46,"n":28,"s":2,"b":"다음은 지점(Branch)과 고객(Customer) 간의 ERD이다. 전체 고객을 소속 지점명과 함께 조회하는 SQL을 설계할 때의 해석으로 가장 적절한 것은?\n[그림: 지점 — 고객 / 엔터티에 가까운 기호가 최대, 먼 기호가 최소 (○는 0·선택, │는 1, 까마귀발은 다수 N)]","x":"고객 쪽이 선택 참여라 소속 지점이 없는 고객은 내부 조인에서 빠진다.","o":["어느 지점에도 소속되지 않은 고객이 있을 수 있으므로, 두 엔터티를 내부 조인만으로 조회하면 일부 고객이 누락될 수 있다.","모든 고객은 반드시 하나의 지점에 소속되므로, 내부 조인만으로도 전체 고객을 빠짐없이 조회할 수 있다.","모든 지점은 최소 한 명 이상의 고객을 보유하므로, 고객이 없는 지점은 고려하지 않아도 된다.","지점과 고객은 다대다 관계이므로, 두 엔터티를 조회하려면 반드시 연결 엔터티를 경유해야 한다."],"a":0,"g":1},{"id":"46-30","r":46,"n":30,"s":2,"b":"다음 SQL을 순서대로 수행하였을 때의 설명으로 가장 적절하지 않은 것은? (Oracle 기준, 자동 커밋 없음)\n*(SQL 원문 누락 — UPDATE 후 CREATE TABLE 재고백업, ROLLBACK 순서로 추정)*","x":"Oracle에서 CREATE TABLE은 자동 커밋되므로 ROLLBACK해도 테이블이 남는다.","o":["오라클에서는 CREATE TABLE이 수행되는 시점에 앞선 UPDATE가 함께 커밋된다.","오라클에서는 ROLLBACK을 수행해도 재고백업 테이블은 그대로 남아 있다.","오라클에서는 ROLLBACK을 수행하면 새로 생성된 재고백업 테이블도 함께 삭제된다.","SQL Server에서는 DDL도 트랜잭션에 포함되므로 UPDATE와 CREATE TABLE이 모두 취소될 수 있다."],"a":2,"m":1},{"id":"46-31","r":46,"n":31,"s":2,"b":"뷰(VIEW)에 대한 설명으로 가장 적절하지 않은 것은?","x":"그룹 함수나 DISTINCT가 있는 뷰는 INSERT·UPDATE가 제한된다.","o":["뷰는 실제 데이터를 저장하지 않는 가상 테이블로, 기본 테이블 구조 변경으로부터 응용 프로그램을 보호하는 논리적 독립성을 제공한다.","단일 테이블을 기반으로 하고 그룹 함수를 포함하지 않는 단순 뷰는 일반적으로 INSERT, UPDATE가 가능하다.","그룹 함수나 DISTINCT가 포함된 뷰에 대해서도 INSERT와 UPDATE를 제한 없이 수행할 수 있다.","WITH CHECK OPTION을 지정하면 뷰의 정의 조건을 위반하는 값으로 INSERT하거나 UPDATE하는 것을 차단한다."],"a":2},{"id":"46-32","r":46,"n":32,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 수행한 결과 행 수로 가장 적절한 것은?\n- 사원.사원명: 김하늘, 이도윤, 박서아, 정민호, 한지우\n- 부서.부서명: 인사팀, 총무팀, 영업팀\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 조건 없는 조인이라면 5 × 3 = 15다.","o":["5","8","15","30"],"a":2,"g":1,"m":1},{"id":"46-33","r":46,"n":33,"s":2,"b":"다음 MERGE 문에 대한 설명으로 가장 적절한 것은?\n- 상품(상품코드, 재고수량): (P01, 10), (P02, 5)\n- 상품입고(상품코드, 입고수량): (P01, 20), (P03, 15)\n\n*(SQL 원문 누락)*","x":"MERGE는 일치하면 UPDATE, 일치하지 않으면 INSERT하는 UPSERT 문장이다.","o":["조인 조건이 일치하면 UPDATE를, 일치하지 않으면 INSERT를 수행하는 하나의 UPSERT 문장이다.","두 테이블을 비교해 결과를 조회하기만 할 뿐 상품 테이블의 데이터는 변경되지 않는다.","조인 조건의 일치 여부와 관계없이 상품입고 테이블의 모든 행을 상품 테이블에 INSERT한다.","MERGE 문에는 UPDATE와 INSERT만 기술할 수 있으며 DELETE는 어떤 경우에도 사용할 수 없다."],"a":0,"g":1,"m":1},{"id":"46-34","r":46,"n":34,"s":2,"b":"다음 운행기록 테이블에 대해 아래 SQL을 수행한 결과에 대한 설명으로 가장 적절한 것은?\n운행기록(운행번호, 운전자, 거리): (1, 김도현, 120), (2, 이수민, 85), (3, 김도현, 60), (4, 박지안, 200), (5, 이수민, 45), (6, 김도현, 90)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. GROUP BY 운전자와 COUNT(*)로 추정했다.","o":["운전자별 운행 횟수를 각각 확인할 수 있다.","전체 운행 건수 하나만 반환되어 운전자별 구분은 알 수 없다.","운전자 목록만 반환되고 운행 횟수는 조회되지 않는다.","GROUP BY 컬럼과 집계 함수를 함께 조회할 수 없으므로 오류가 발생한다."],"a":0,"g":1,"m":1},{"id":"46-35","r":46,"n":35,"s":2,"b":"다음 고객 테이블에 대해 아래 SQL이 의미하는 바로 가장 적절한 것은?\n고객(고객ID, 이름, 지역): (C01, 김유진, 서울), (C02, 이한결, 대구), (C03, 박소윤, 부산), (C04, 정우석, 대전)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 지역 IN ('서울', '대전', '부산')으로 추정했다.","o":["지역이 서울이거나 대전이거나 부산인 행을 조회한다.","지역이 서울이면서 동시에 대전이고 부산인 행을 조회한다.","지역이 서울, 대전, 부산이 아닌 행을 조회한다.","지역이 NULL인 행도 IN 조건에 의해 함께 조회된다."],"a":0,"g":1,"m":1},{"id":"46-36","r":46,"n":36,"s":2,"b":"다음 주문 테이블에 대해 아래 SQL을 오라클에서 수행하였을 때, 결과가 출력되는 주문번호 순서로 가장 적절한 것은?\n주문(주문번호, 지역코드, 등급, 할인율): (101, S1, A, 10), (102, S1, A, NULL), (103, S2, A, 20)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 할인율 DESC 정렬이면 Oracle은 NULL을 먼저 둔다고 추정했다.","o":["102 - 101 - 103","101 - 102 - 103","102 - 103 - 101","103 - 101 - 102"],"a":2,"g":1,"m":1},{"id":"46-37","r":46,"n":37,"s":2,"b":"다음 설명에 해당하는 문자열 함수로 가장 적절한 것은?\n> 문자열의 M번째 위치에서 시작하여 N개의 문자를 잘라내어 반환한다.","x":"M번째부터 N개를 잘라내는 것은 SUBSTR(SUBSTRING)이다.","o":["SUBSTR / SUBSTRING","INSTR / CHARINDEX","REPLACE","CONCAT"],"a":0},{"id":"46-38","r":46,"n":38,"s":2,"b":"부서(부모)와 사원(자식) 테이블이 있고, 사원.부서번호가 부서.부서번호를 참조하는 외래키로 지정되어 있다. 부모 행 삭제 시 동작하는 참조 무결성 옵션에 대한 설명으로 가장 적절한 것은?","x":"ON DELETE CASCADE는 부모 행 삭제 시 자식 행도 함께 삭제한다.","o":["ON DELETE CASCADE로 지정하면 부서 행을 삭제할 때 그 부서를 참조하는 사원 행도 함께 삭제된다.","ON DELETE CASCADE로 지정하면 사원 행은 그대로 둔 채 부서 행만 삭제된다.","ON DELETE SET NULL로 지정하면 참조하는 사원 행이 있는 한 부서 행의 삭제 자체가 거부된다.","아무 옵션도 지정하지 않은 기본 동작에서는 참조하는 사원 행이 자동으로 삭제된다."],"a":0},{"id":"46-39","r":46,"n":39,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 수행한 결과로 가장 적절한 것은?\n- T1.COL1: 1, 2, 3\n- T2.COL2: 2, NULL\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NOT IN 서브쿼리에 NULL이 있어 0으로 추정했다.","o":["0","2","3","오류가 발생한다."],"a":0,"g":1,"m":1},{"id":"46-40","r":46,"n":40,"s":2,"b":"다음 상품 테이블에 대해 아래 SQL을 수행하였을 때, 상태 컬럼의 값을 P01부터 P04까지 순서대로 나열한 것으로 가장 적절한 것은?\n상품(상품코드, 재고수량): (P01, 0), (P02, 5), (P03, 30), (P04, 100)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. CASE로 0은 품절, 적으면 부족, 그 외 충분으로 추정했다.","o":["품절, 부족, 충분, 충분","품절, 부족, 부족, 충분","부족, 부족, 충분, 충분","품절, 부족, NULL, NULL"],"a":0,"g":1,"m":1},{"id":"46-41","r":46,"n":41,"s":2,"b":"계층형 질의(START WITH ... CONNECT BY)는 부모-자식 관계가 하나의 테이블 안에 자기참조 컬럼으로 저장되어 있을 때 사용한다. 이러한 계층형 질의가 계층을 전개하기 위해 내부적으로 사용하는 조인 방식의 명칭을 쓰시오.","x":"계층형 질의는 자기 자신과 조인하는 셀프 조인으로 전개한다.","t":"s","a":["셀프 조인","셀프조인","SELF JOIN","SELFJOIN"]},{"id":"46-44","r":46,"n":44,"s":2,"b":"다음 사원 테이블에 대해 아래 SQL을 수행하였을 때 조회되는 사원명을 급여가 높은 순서대로 두 명 쓰시오.\n사원(사원명, 급여): (김하늘, 3200), (이준호, 4500), (박서준, 2800), (최유진, 5100)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 급여 상위 두 명으로 추정했다.","t":"s","a":["최유진,이준호","최유진 이준호"],"g":1,"m":1},{"id":"46-45","r":46,"n":45,"s":2,"b":"다음 성적 테이블에 대해 아래 SQL을 수행하였을 때 반환되는 인원과 평균 값을 순서대로 각각 쓰시오.\n성적(학생명, 점수): (김지호, 90), (이서윤, 70), (박민서, 80), (정하람, 60)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. COUNT(*) 4, AVG(점수) 75로 추정했다.","t":"s","a":["4,75","4 75"],"g":1,"m":1},{"id":"46-46","r":46,"n":46,"s":2,"b":"회원 테이블의 등록일시 컬럼(DATE 타입)에 2026년 3월 9일 14시 5분 27초가 저장되어 있다. 이 값을 아래와 같은 문자열로 출력하려고 할 때, (ㄱ)에 들어갈 형식 문자열을 쓰시오.\n출력 결과(등록일시문자열): 2026-03-09 14:05:27\n*(SQL 원문 누락)*","x":"24시 형식 HH24와 분 MI, 초 SS를 쓴다.","t":"s","a":["YYYY-MM-DD HH24:MI:SS"],"m":1},{"id":"46-47","r":46,"n":47,"s":2,"b":"다음 일일매출 테이블을 판매일자 오름차순으로 정렬했을 때, 각 행에 바로 이전 행의 매출액을 함께 출력하려고 한다. (ㄱ)에 사용해야 할 윈도우 함수명과, (ㄴ) 그 함수를 적용했을 때 2026-03-01 행에 표시되는 값을 각각 쓰시오.\n일일매출(판매일자, 매출액): (2026-03-01, 120), (2026-03-02, 150), (2026-03-03, 90), (2026-03-04, 200)","x":"이전 행 값은 LAG이며 첫 행은 이전 값이 없어 NULL이다.","t":"s","a":["LAG,NULL","LAG NULL"]},{"id":"46-48","r":46,"n":48,"s":2,"b":"다음 T1 테이블에 대해 아래 SQL을 수행하였을 때 반환되는 값을 쓰시오.\nT1.COL1: 20, 40, 60, NULL\n*(SQL 원문 누락)*","x":"원문 SQL 누락. AVG(COL1)이면 NULL을 빼고 40으로 추정했다.","t":"s","a":["40"],"g":1,"m":1},{"id":"46-49","r":46,"n":49,"s":2,"b":"다음 두 테이블에서 소속 사원이 한 명도 없는 부서까지 모두 결과에 포함되도록 조회하려고 한다. (ㄱ)에 들어갈 조인 유형을 쓰시오.\n- 사원(사원명, 부서번호): (김민준, 10), (이서아, 10), (박하준, 20)\n- 부서(부서번호, 부서명): (10, 영업부), (20, 기획부), (30, 감사부)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 사원 RIGHT OUTER JOIN 부서로 추정했다.","t":"s","a":["RIGHT OUTER JOIN","RIGHT OUTER","RIGHT JOIN"],"g":1,"m":1},{"id":"46-50","r":46,"n":50,"s":2,"b":"다음 사원 테이블에 대해 GROUPING SETS를 사용하여 아래와 같은 결과를 얻으려고 한다. ㉠에 들어갈 GROUP BY 절의 내용을 쓰시오.\n사원(등급, 직급, 사원명): (1등급, 과장, 김민수), (1등급, 대리, 이지현), (2등급, 과장, 박현우), (2등급, 대리, 정소영), (2등급, 대리, 한지호)\n\n결과\n\n| 등급 | 직급 | 인원 |\n|---|---|---|\n| 1등급 | 과장 | 1 |\n| 1등급 | 대리 | 1 |\n| 1등급 | NULL | 2 |\n| 2등급 | 과장 | 1 |\n| 2등급 | 대리 | 2 |\n| 2등급 | NULL | 3 |","x":"결과는 (등급,직급) 상세와 (등급) 소계뿐이고 총계가 없다.","t":"s","a":["(등급,직급),(등급)","(등급, 직급), (등급)","GROUPING SETS((등급,직급),(등급))"]},{"id":"47-01","r":47,"n":1,"s":1,"b":"다음 설명에 해당하는 데이터 모델링의 관점으로 가장 적절한 것은?\n> 업무 처리 절차가 어떤 순서로 수행되는지에 따라 어떤 데이터가 생성되고 변경되는지를 분석하고, 반대로 그렇게 쌓인 데이터가 이후의 업무 처리 절차에 어떤 영향을 주는지를 함께 분석한다.","x":"데이터가 프로세스에 주는 영향과 그 반대를 함께 보는 것은 데이터와 프로세스(상관) 관점이다.","o":["데이터 관점","프로세스 관점","데이터와 프로세스 관점","보안 관점"],"a":2},{"id":"47-02","r":47,"n":2,"s":1,"b":"다음 ERD에 대한 설명으로 가장 적절하지 않은 것은?\n[그림: 고객(#고객번호, 고객명) 1:N 서비스이용(#고객번호 FK, #서비스번호 FK, #이용일자, 이용금액) N:1 서비스(#서비스번호, 서비스명) / #는 주식별자 구성 속성]","x":"이용일자가 주식별자에 포함되므로 같은 서비스를 다른 날 다시 이용할 수 있다.","o":["고객과 서비스는 서로 M:N 관계이며, 서비스이용은 이를 해소하기 위한 중간(교차) 엔터티이다.","서비스이용 엔터티의 주식별자는 고객번호, 서비스번호, 이용일자 세 속성으로 구성된다.","같은 고객이 같은 서비스를 다른 날짜에 다시 이용하면 서비스이용에 별도의 인스턴스로 저장된다.","한 고객이 이미 이용한 서비스는 다시 이용할 수 없도록 주식별자에 의해 제약되어 있다."],"a":3},{"id":"47-03","r":47,"n":3,"s":1,"b":"다음 중 파생 속성에 해당하는 것으로 가장 적절한 것은?","x":"단가 × 수량으로 계산해 관리하는 총금액이 파생 속성이다.","o":["회원 엔터티의 회원번호","회원 엔터티의 생년월일","상품 엔터티의 단가","주문 엔터티의 총금액(단가 × 주문수량으로 계산하여 관리)"],"a":3},{"id":"47-04","r":47,"n":4,"s":1,"b":"다음 설명에 해당하는 정규형으로 가장 적절한 것은?\n> 기본키가 아닌 일반 속성들끼리 서로 종속되는 관계가 남아 있지 않아야 한다.","x":"일반 속성끼리의 종속(이행 종속)을 제거한 것은 제3정규형이다.","o":["제1정규형","제2정규형","제3정규형","보이스-코드 정규형(BCNF)"],"a":2},{"id":"47-05","r":47,"n":5,"s":1,"b":"다음 중 주식별자의 특성에 대한 설명으로 가장 적절하지 않은 것은?","x":"주식별자는 NULL을 가질 수 없다.","o":["하나의 엔터티에 속한 각 인스턴스를 유일하게 구분할 수 있어야 한다.","유일성을 만족하는 범위에서 주식별자를 구성하는 속성의 수는 최소로 한다.","주식별자가 한 번 지정되면 그 값이 자주 변경되지 않아야 한다.","주식별자를 구성하는 속성은 값을 모르는 경우 NULL을 가질 수 있다."],"a":3},{"id":"47-06","r":47,"n":6,"s":1,"b":"다음 상황에서 슈퍼타입/서브타입 모델을 테이블로 변환하는 방법으로 가장 적절한 것은?\n> 회원(슈퍼타입) 아래에 개인회원, 법인회원(서브타입)이 있다. 개인회원만 조회하거나 법인회원만 조회하는 트랜잭션이 각각 매우 빈번하게 발생하며, 두 서브타입을 구분하지 않고 회원 공통 속성만 조회하는 업무도 별도로 자주 발생한다.","x":"서브타입별 조회와 공통 조회가 모두 잦으면 슈퍼·서브타입을 각각 테이블로 두는 1:1 방식이 적합하다.","o":["슈퍼타입과 모든 서브타입의 속성을 하나의 테이블로 합치는 Single Table(All in One) 방식","슈퍼타입 속성을 각 서브타입 테이블에 포함시켜 서브타입 개수만큼의 테이블만 만드는 Plus Type 방식","슈퍼타입과 각 서브타입을 모두 별개의 테이블로 만드는 One To One(1:1) 방식","슈퍼타입 테이블만 만들고 서브타입별 속성은 모두 코드 테이블로 옮겨 관리하는 방식"],"a":2},{"id":"47-07","r":47,"n":7,"s":1,"b":"다음 상황에서 성능 향상을 위한 테이블 설계로 가장 적절한 것은?\n> 회원 테이블은 로그인에 사용되는 컬럼 3개와 조회 빈도가 매우 낮은 상세 정보 컬럼 40여 개로 이루어져 있다. 로그인 처리는 초당 수백 건 발생하지만 상세 정보 조회는 하루 몇 건에 불과하다.","x":"자주 쓰는 로그인 컬럼만 따로 분리(수직 분할)해 1:1로 관리한다.","o":["회원 테이블 구조를 그대로 두고 조회 시 필요한 컬럼만 SELECT 하도록 SQL만 수정한다.","로그인에 사용되는 컬럼만 별도 테이블로 분리하고 회원 테이블과 1:1 관계로 관리한다.","로그인 이력 데이터를 회원 테이블에 컬럼으로 추가하여 한 번에 조회한다.","회원 테이블의 모든 컬럼을 각각 하나의 테이블로 분리하여 컬럼 단위로 관리한다."],"a":1},{"id":"47-08","r":47,"n":8,"s":1,"b":"다음 중 성능 데이터 모델링의 절차에 대한 설명으로 가장 적절한 것은?","x":"먼저 정규화하고 성능 문제가 확인된 곳에만 반정규화를 적용한다.","o":["성능을 위해 정규화 과정은 생략하고 처음부터 반정규화된 구조로 설계한다.","정규화를 통해 데이터 무결성이 확보된 모델을 먼저 만든 뒤, 성능 저하가 확인된 부분에 한해 반정규화를 적용한다.","정규화는 성능과 아무런 관련이 없으므로 성능 설계 단계에서는 고려하지 않는다.","반정규화를 먼저 적용하여 성능을 확보한 뒤 남아 있는 이상 현상을 정규화로 제거한다."],"a":1},{"id":"47-09","r":47,"n":9,"s":1,"b":"다음 \u003c주문상세> 테이블의 주식별자는 (주문번호, 상품번호)이며, 상품명은 상품번호가 결정되면 함께 결정되는 속성이다.\n\n| 주문번호 | 상품번호 | 상품명 | 주문수량 |\n|---|---|---|---|\n| A001 | P10 | 무선마우스 | 2 |\n| A001 | P20 | 키보드 | 1 |\n| A002 | P10 | 무선마우스 | 3 |\n\n이 테이블이 만족하지 못하는 정규형 중 가장 낮은 단계를 쓰시오.","x":"상품명이 PK 일부(상품번호)에만 종속되어 제2정규형을 만족하지 못한다.","t":"s","a":["제2정규형","2정규형","2NF","제2 정규형"]},{"id":"47-10","r":47,"n":10,"s":1,"b":"데이터베이스 3단계 스키마 구조 중 다음 설명에 해당하는 스키마의 명칭을 쓰시오.\n> 개별 사용자나 응용 프로그램이 필요로 하는 데이터만을 바라보는 관점으로, 여러 사용자 관점에 따라 여러 개가 존재할 수 있는 논리적 구조이다.","x":"사용자·응용 프로그램별 관점의 스키마는 외부 스키마다.","t":"s","a":["외부 스키마","외부스키마","External Schema","서브스키마"]},{"id":"47-11","r":47,"n":11,"s":2,"b":"사용자 SCOTT에게 EMP 테이블을 조회할 수 있는 권한만 부여하려고 한다. 가장 적절한 SQL은?","x":"조회 권한만 주는 것은 GRANT SELECT ON EMP TO SCOTT다.","o":["GRANT SELECT ON EMP TO SCOTT;","REVOKE SELECT ON EMP FROM SCOTT;","CREATE USER SCOTT IDENTIFIED BY tiger;","ALTER USER SCOTT IDENTIFIED BY tiger;"],"a":0},{"id":"47-12","r":47,"n":12,"s":2,"b":"\u003c판매> 테이블(지역, 상품, 금액)에서 아래 세 가지 집계 결과를 한 번의 SQL로 모두 조회하려고 한다. 가장 적절한 것은?\n- 지역별 금액 합계\n- 지역과 상품 조합별 금액 합계\n- 전체 금액 합계\n- 위 세 가지 외의 집계 결과는 나오지 않아야 한다.","x":"(지역,상품), (지역), ()만 만드는 것은 ROLLUP(지역, 상품)이다.","o":["SELECT 지역, 상품, SUM(금액) FROM 판매 GROUP BY 지역, 상품;","SELECT 지역, 상품, SUM(금액) FROM 판매 GROUP BY ROLLUP(지역, 상품);","SELECT 지역, 상품, SUM(금액) FROM 판매 GROUP BY CUBE(지역, 상품);","SELECT 지역, 상품, SUM(금액) FROM 판매 GROUP BY GROUPING SETS(지역, 상품);"],"a":1},{"id":"47-13","r":47,"n":13,"s":2,"b":"다음 중 트랜잭션에 대한 설명으로 가장 적절한 것은?","x":"COMMIT과 ROLLBACK으로 트랜잭션 단위로 확정·취소해 무결성을 보장한다.","o":["COMMIT을 수행한 뒤에도 ROLLBACK을 실행하면 언제든지 이전 상태로 되돌릴 수 있다.","COMMIT과 ROLLBACK을 이용해 트랜잭션 단위로 변경을 확정하거나 취소함으로써 데이터의 무결성을 보장할 수 있다.","ROLLBACK을 수행해도 그때까지 변경한 데이터는 데이터베이스에 그대로 남는다.","트랜잭션의 결과가 영구적으로 반영되는 성질을 고립성(Isolation)이라고 한다."],"a":1},{"id":"47-14","r":47,"n":14,"s":2,"b":"다음 중 저장 프로시저와 트리거에 대한 설명으로 가장 적절하지 않은 것은?","x":"트리거 안에서는 COMMIT, ROLLBACK을 쓸 수 없다.","o":["저장 프로시저를 사용하면 네트워크로 전송되는 SQL 문장의 양이 줄어 트래픽을 줄일 수 있다.","저장 프로시저 내부에서는 COMMIT, ROLLBACK 같은 트랜잭션 제어문을 사용할 수 있다.","트리거도 저장 프로시저와 마찬가지로 내부에서 COMMIT과 ROLLBACK을 자유롭게 사용할 수 있다.","사용자 정의 함수는 반드시 RETURN 절을 통해 하나의 값을 반환해야 한다."],"a":2},{"id":"47-15","r":47,"n":15,"s":2,"b":"다음 중 SQL 명령어의 분류에 대한 설명으로 가장 적절하지 않은 것은?","x":"DCL은 권한을 부여·회수하는 명령어다.","o":["DDL은 테이블, 뷰 등 데이터베이스 객체의 구조를 정의하거나 변경한다.","DML은 테이블에 저장된 데이터를 조회하거나 입력, 수정, 삭제한다.","DCL은 데이터베이스를 구동하거나 종료하는 명령어이다.","TCL은 논리적인 작업 단위인 트랜잭션을 확정하거나 취소하여 제어한다."],"a":2},{"id":"47-16","r":47,"n":16,"s":2,"b":"두 테이블을 조인할 때 조인 조건을 만족하지 않는 행까지 결과에 포함시키고, 대응되는 값이 없는 컬럼은 NULL로 채워 반환하는 조인으로 가장 적절한 것은?","x":"매칭되지 않는 행도 NULL로 채워 포함하는 것은 OUTER JOIN이다.","o":["INNER JOIN","NATURAL JOIN","CROSS JOIN","OUTER JOIN"],"a":3},{"id":"47-17","r":47,"n":17,"s":2,"b":"\u003c주문> 테이블의 주문일자(DATE 타입)를 '2026-05-07'과 같은 형식의 문자열로 조회하려고 한다. 가장 적절한 SQL은?","x":"날짜를 문자로 바꾸는 것은 TO_CHAR(주문일자, 'YYYY-MM-DD')다.","o":["SELECT TO_CHAR(주문일자, 'YYYY-MM-DD') FROM 주문;","SELECT TO_DATE(주문일자, 'YYYY-MM-DD') FROM 주문;","SELECT TO_NUMBER(주문일자, 'YYYY-MM-DD') FROM 주문;","SELECT CAST(주문일자 AS VARCHAR2(10)) FROM 주문;"],"a":0},{"id":"47-18","r":47,"n":18,"s":2,"b":"\u003c입금> 테이블을 입금일자 오름차순으로 정렬했을 때, 각 행에서 바로 직전 행의 입금액을 함께 조회하려고 한다. 사용할 윈도우 함수로 가장 적절한 것은?","x":"직전 행의 값을 가져오는 것은 LAG다.","o":["SUM","ROW_NUMBER","LEAD","LAG"],"a":3},{"id":"47-19","r":47,"n":19,"s":2,"b":"다음 \u003c상품> 테이블에 대해 아래 SQL을 각각 실행할 때, 오류가 발생하는 것으로 가장 적절한 것은?\n\n| 상품번호 | 상품명 | 분류 | 가격 |\n|---|---|---|---|\n| 1 | 노트북 | 전자 | 1200 |\n| 2 | 모니터 | 전자 | 300 |\n| 3 | 의자 | 가구 | 150 |\n| 4 | 책상 | 가구 | 200 |","x":"분류 '전자'인 가격이 두 개라 = 단일 행 비교에서 오류가 난다.","o":["SELECT * FROM 상품 WHERE 가격 = (SELECT MAX(가격) FROM 상품);","SELECT * FROM 상품 WHERE 상품번호 IN (SELECT 상품번호 FROM 상품 WHERE 분류 = '가구');","SELECT * FROM 상품 WHERE 가격 = (SELECT 가격 FROM 상품 WHERE 분류 = '전자');","SELECT * FROM 상품 WHERE 가격 = (SELECT 가격 FROM 상품 WHERE 상품번호 = 3);"],"a":2},{"id":"47-20","r":47,"n":20,"s":2,"b":"다음 중 조인의 종류와 그 결과에 대한 설명이 가장 적절하지 않게 짝지어진 것은?","x":"FULL OUTER JOIN은 양쪽 미매칭 행까지 모두 반환한다.","o":["INNER JOIN — 두 테이블에서 조인 조건을 만족하는 행만 반환한다.","LEFT OUTER JOIN — 왼쪽 테이블의 모든 행과, 조인에 성공한 오른쪽 테이블의 값을 반환한다.","RIGHT OUTER JOIN — 오른쪽 테이블의 모든 행과, 조인에 성공한 왼쪽 테이블의 값을 반환한다.","FULL OUTER JOIN — 두 테이블에서 조인 조건을 만족하는 행만 반환한다."],"a":3},{"id":"47-21","r":47,"n":21,"s":2,"b":"다음 중 계층형 질의에 대한 설명으로 가장 적절하지 않은 것은?","x":"WHERE 절은 전개가 끝난 뒤 해당 행만 걸러내며 하위 행까지 빼지는 않는다.","o":["START WITH 절은 계층 구조의 전개를 시작할 루트 행을 지정한다.","CONNECT BY 절은 부모 행과 자식 행을 연결하는 관계를 지정한다.","WHERE 절의 조건은 계층 구조가 전개되기 전에 적용되므로, 조건에 걸린 행의 하위 행들도 함께 결과에서 제외된다.","ORDER SIBLINGS BY 절은 같은 레벨에 있는 형제 행들 사이의 정렬 순서를 지정한다."],"a":2},{"id":"47-23","r":47,"n":23,"s":2,"b":"다음 SQL이 조회하는 대상으로 가장 적절한 것은?\n- 팀(팀번호, 팀명): (10, 영업팀), (20, 개발팀), (30, 인사팀)\n- 사원(사원번호, 사원명, 팀번호, 연봉): (1, 김수현, 10, 2500), (2, 이준호, 10, 2400), (3, 한지민, 10, 2300), (4, 오세훈, 10, 2200), (5, 박서연, 20, 6000), (6, 최지우, 20, 5000), (7, 강하늘, 30, 7000)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 연봉 합계가 가장 큰 팀(개발팀)을 구하는 쿼리로 추정했다.","o":["소속 사원 수가 가장 많은 팀의 팀명","소속 사원의 연봉 합계가 가장 큰 팀의 팀명","소속 사원의 평균 연봉이 가장 높은 팀의 팀명","연봉이 가장 높은 사원이 소속된 팀의 팀명"],"a":1,"g":1,"m":1},{"id":"47-24","r":47,"n":24,"s":2,"b":"\u003c제품> 테이블에서 무게가 10 이상 50 이하인 제품을 모두 조회하려고 한다. WHERE 절로 가장 적절한 것은? (단, 무게는 1부터 100 사이의 정수 값을 가진다.)","x":"10 이상 50 이하는 BETWEEN 10 AND 50이다.","o":["WHERE 무게 BETWEEN 10 AND 50","WHERE 무게 IN (10, 50)","WHERE 무게 = 10 OR 무게 = 50","WHERE 무게 >= 10 AND 무게 > 50"],"a":0},{"id":"47-25","r":47,"n":25,"s":2,"b":"다음 중 PRIMARY KEY 제약과 UNIQUE 제약을 비교한 설명으로 가장 적절한 것은?","x":"UNIQUE는 NULL을 허용하지만 PK는 허용하지 않는다.","o":["두 제약은 이름만 다를 뿐 동작이 완전히 동일하다.","UNIQUE 제약이 설정된 컬럼에는 NOT NULL 제약도 자동으로 함께 적용된다.","UNIQUE 제약이 설정된 컬럼에는 NULL을 저장할 수 있지만, PRIMARY KEY 컬럼에는 NULL을 저장할 수 없다.","하나의 테이블에 UNIQUE 제약은 두 개 이상 정의할 수 없다."],"a":2},{"id":"47-26","r":47,"n":26,"s":2,"b":"다음 \u003cT> 테이블에 대해 아래 SQL을 실행한 결과로 가장 적절한 것은?\nT(GRADE, POINT): (3, 7)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["7","10","50","NULL"],"a":1,"g":1,"m":1},{"id":"47-27","r":47,"n":27,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행한 결과로 가장 적절한 것은?\n- 점수(학생, 점수): (A, 72), (B, 88), (C, 95), (D, 61)\n- 등급기준(등급, 하한, 상한): (상, 90, 100), (중, 70, 89), (하, 0, 69)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["상","중","하","조회되는 행이 없다"],"a":1,"g":1,"m":1},{"id":"47-28","r":47,"n":28,"s":2,"b":"다음 세 테이블에 대해 아래 SQL을 실행한 결과로 가장 적절한 것은?\n- T1.COL1: 1, 2, 3\n- T2.COL1: 2, 3, 4\n- T3.COL1: 3, 4\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["1, 2","1, 2, 2","1, 2, 2, 3","1, 2, 3, 4"],"a":1,"g":1,"m":1},{"id":"47-29","r":47,"n":29,"s":2,"b":"다음 중 WITH 절에 대한 설명으로 가장 적절한 것은?","x":"WITH 절은 서브쿼리에 이름을 붙여 본 쿼리에서 여러 번 참조할 수 있다.","o":["WITH 절로 정의한 결과 집합은 데이터베이스에 물리적인 테이블로 영구히 저장된다.","WITH 절을 사용하면 참조하는 컬럼에 대한 인덱스가 자동으로 생성된다.","WITH 절로 정의한 이름은 본 쿼리에서 단 한 번만 참조할 수 있다.","반복적으로 사용되는 서브쿼리에 이름을 붙여 정의해 두고 본 쿼리에서 여러 번 참조할 수 있다."],"a":3},{"id":"47-30","r":47,"n":30,"s":2,"b":"\u003c판매> 테이블(금액 컬럼)에서 금액이 가장 큰 한 건을 조회하려고 한다. 가장 적절한 SQL은?","x":"인라인 뷰에서 정렬한 뒤 ROWNUM = 1로 자른다.","o":["SELECT 금액 FROM 판매 WHERE ROWNUM = 1 ORDER BY 금액 DESC;","SELECT 금액 FROM (SELECT 금액 FROM 판매 ORDER BY 금액 DESC) WHERE ROWNUM = 1;","SELECT 금액 FROM 판매 ORDER BY 금액 DESC WHERE ROWNUM = 1;","SELECT 금액 FROM 판매 WHERE ROWNUM = MAX(금액);"],"a":1},{"id":"47-31","r":47,"n":31,"s":2,"b":"다음 \u003c성적> 테이블에 대해 아래 SQL을 실행했을 때, GRP 값이 1, 2, 3인 행의 개수를 순서대로 나열한 것으로 가장 적절한 것은?\n성적(이름, 점수): (A, 95), (B, 92), (C, 88), (D, 85), (E, 80), (F, 76), (G, 70)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NTILE(3)이라면 7행이 3, 2, 2로 나뉜다.","o":["3, 2, 2","2, 2, 3","2, 3, 2","3, 3, 1"],"a":0,"g":1,"m":1},{"id":"47-32","r":47,"n":32,"s":2,"b":"정렬된 값에 순위를 부여할 때 동일한 값에는 같은 순위를 주되 다음 순위를 건너뛰지 않아, 1, 1, 2, 3, 3, 4와 같은 순위를 만드는 함수로 가장 적절한 것은?","x":"1, 1, 2, 3처럼 순위를 건너뛰지 않는 것은 DENSE_RANK다.","o":["RANK","DENSE_RANK","ROW_NUMBER","NTILE"],"a":1},{"id":"47-33","r":47,"n":33,"s":2,"b":"파티션 내 전체 합계에 대한 각 행의 값이 차지하는 비율을 소수 값으로 반환하는 윈도우 함수로 가장 적절한 것은?","x":"파티션 합계에 대한 비율은 RATIO_TO_REPORT다.","o":["RATIO_TO_REPORT","PERCENT_RANK","CUME_DIST","NTILE"],"a":0},{"id":"47-34","r":47,"n":34,"s":2,"b":"두 SELECT 문의 결과에 공통으로 존재하는 행만 반환하는 집합 연산자로 가장 적절한 것은?","x":"교집합은 INTERSECT다.","o":["UNION","UNION ALL","INTERSECT","EXCEPT"],"a":2},{"id":"47-35","r":47,"n":35,"s":2,"b":"\u003c회원> 테이블에서 이메일 컬럼의 값이 NULL이 아닌 행만 조회하려고 한다. WHERE 절로 가장 적절한 것은?","x":"NULL이 아닌 값은 IS NOT NULL로 찾는다.","o":["WHERE 이메일 IS NOT NULL","WHERE 이메일 \u003c> NULL","WHERE 이메일 != NULL","WHERE 이메일 NOT NULL"],"a":0},{"id":"47-36","r":47,"n":36,"s":2,"b":"다음 \u003c회원> 테이블에서 아래 \u003c실행 결과>를 얻기 위한 조건으로 가장 적절한 것은?\n- 회원.이름: ALPHA, BRAVO, CHARM, DELTA\n- 실행 결과: BRAVO, CHARM","x":"세 번째 글자가 A인 BRAVO, CHARM은 '__A%'다.","o":["WHERE 이름 LIKE '__A%'","WHERE 이름 LIKE '_A%'","WHERE 이름 LIKE '%A_'","WHERE 이름 LIKE '%A%'"],"a":0},{"id":"47-37","r":47,"n":37,"s":2,"b":"다음 중 CROSS JOIN에 대한 설명으로 가장 적절한 것은?","x":"CROSS JOIN은 조건 없이 두 테이블 행 수의 곱만큼 결과를 낸다.","o":["두 테이블에서 조인 조건을 만족하는 행만 반환한다.","조인 조건 없이 한 테이블의 각 행을 다른 테이블의 모든 행과 결합하여, 두 테이블 행 수의 곱만큼 결과를 반환한다.","조인을 수행하려면 반드시 ON 절에 조인 조건을 기술해야 한다.","두 테이블에서 이름이 같은 컬럼을 자동으로 찾아 조인 조건으로 사용한다."],"a":1},{"id":"47-38","r":47,"n":38,"s":2,"b":"다음 중 뷰(VIEW)에 대한 설명으로 가장 적절한 것은?","x":"뷰는 SELECT 정의만 저장하고 조회할 때마다 실행된다.","o":["뷰는 조회 대상 데이터를 별도의 저장 공간에 복제해 두고 그 사본을 조회한다.","뷰는 실제 데이터를 저장하지 않고 SELECT 문의 정의만 저장하며, 조회할 때마다 그 SELECT 문이 실행된다.","뷰를 생성하면 뷰가 참조하는 원본 테이블의 데이터는 자동으로 삭제된다.","뷰는 한 번 생성되면 원본 테이블의 데이터가 변경되어도 생성 시점의 결과를 그대로 반환한다."],"a":1},{"id":"47-39","r":47,"n":39,"s":2,"b":"A, B, C 세 테이블이 A ← B ← C 순으로 식별자 관계(각각 1:N)로 연결되어 있다. 다음 설명 중 가장 적절하지 않은 것은?","x":"세 테이블 조인에는 최소 두 개의 조인 조건이면 된다.","o":["세 테이블을 조인하여 조회하려면 조인 조건은 최소 두 개가 필요하다.","식별자 관계에서는 부모 엔터티의 주식별자가 자식 엔터티의 주식별자 일부로 상속된다.","식별자 관계에서 자식 인스턴스는 부모 인스턴스 없이 존재할 수 없다.","세 테이블을 조인하여 조회하려면 조인 조건이 최소 세 개 이상 있어야 한다."],"a":3},{"id":"47-40","r":47,"n":40,"s":2,"b":"다음 중 실행 결과가 나머지 셋과 다른 것은?","x":"RTRIM('CABC', 'C')는 'CAB'이고 나머지는 모두 'ABC'다.","o":["SELECT LPAD('ABC', 3, 'Z') FROM DUAL;","SELECT SUBSTR('XABCY', 2, 3) FROM DUAL;","SELECT CONCAT('ABC', NULL) FROM DUAL;","SELECT RTRIM('CABC', 'C') FROM DUAL;"],"a":3},{"id":"47-44","r":47,"n":44,"s":2,"b":"다음 \u003c일별매출> 테이블에 대해 아래 SQL을 실행하였다. 일자 순서대로 조회되는 누적금액 값을 모두 쓰시오.\n일별매출(일자, 금액): (2026-03-01, 100), (2026-03-02, 250), (2026-03-03, 50), (2026-03-04, 400)\n*(SQL 원문 누락)*","x":"SUM(금액) OVER(ORDER BY 일자) 누적합으로 추정했다.","t":"s","a":["100,350,400,800","100 350 400 800"],"g":1,"m":1},{"id":"47-45","r":47,"n":45,"s":2,"b":"두 SELECT 문의 결과를 하나로 합치되, 양쪽에 중복해서 나타나는 행은 하나만 남기고 제거하여 반환하는 집합 연산자를 쓰시오.","x":"합치면서 중복을 제거하는 것은 UNION이다.","t":"s","a":["UNION"]},{"id":"47-47","r":47,"n":47,"s":2,"b":"사용자를 삭제할 때 그 사용자가 소유한 모든 오브젝트까지 함께 삭제하려면 DROP USER 문에 함께 기술해야 하는 옵션(키워드)을 쓰시오.","x":"DROP USER ... CASCADE로 소유 객체까지 삭제한다.","t":"s","a":["CASCADE"]},{"id":"48-01","r":48,"n":1,"s":1,"b":"데이터 모델링에 대한 설명으로 가장 적절하지 않은 것은?","x":"성능 등을 위해 정규화를 완화하는 반정규화를 할 수 있다.","o":["현실 세계의 업무를 일정한 표기법에 따라 추상화하고 단순화하여 표현하는 과정이다.","업무에서 지켜야 할 규칙을 데이터 구조에 반영하여 데이터의 정확성을 확보한다.","업무에서 관리해야 할 엔터티를 도출하고 엔터티 사이의 관계를 정의한다.","모든 데이터는 반드시 제3정규형 이상으로 정규화되어야 하며, 어떤 경우에도 정규화를 완화해서는 안 된다."],"a":3},{"id":"48-02","r":48,"n":2,"s":1,"b":"다음 설명에 해당하는 정규형으로 가장 적절한 것은?\n> 주식별자가 아닌 일반 속성이 다른 일반 속성에 종속되는 이행적 함수 종속을 제거하여, 모든 일반 속성이 주식별자에만 직접 종속되도록 만드는 단계이다.","x":"이행적 함수 종속 제거는 제3정규형이다.","o":["제1정규형(1NF)","제2정규형(2NF)","제3정규형(3NF)","보이스-코드 정규형(BCNF)"],"a":2},{"id":"48-03","r":48,"n":3,"s":1,"b":"다음 업무 규칙을 데이터 모델로 표현할 때 사용되는 관계 표현으로 가장 적절한 것은?\n> 하나의 [결제] 인스턴스는 [카드] 또는 [계좌] 중 정확히 하나와만 연결된다. 카드와 계좌 양쪽에 동시에 연결될 수 없고, 둘 중 어느 쪽에도 연결되지 않은 결제도 존재할 수 없다.","x":"카드나 계좌 중 정확히 하나와만 연결되는 것은 상호배타 관계다.","o":["상호배타 관계(Arc Relationship)","식별 관계(Identifying Relationship)","1:M 관계(One to Many Relationship)","자기참조 관계(Self Relationship)"],"a":0},{"id":"48-04","r":48,"n":4,"s":1,"b":"식별관계와 비식별관계에 대한 설명으로 가장 적절하지 않은 것은?","x":"비식별관계에서는 부모 주식별자가 자식의 일반 속성(FK)으로만 상속된다.","o":["ERD에서 식별관계는 실선으로, 비식별관계는 점선으로 표기한다.","식별관계에서는 부모 인스턴스가 존재하지 않으면 자식 인스턴스도 존재할 수 없다.","비식별관계에서는 부모의 주식별자가 자식의 주식별자 일부로 상속되어 자식이 복합 주식별자를 갖게 된다.","비식별관계에서는 부모의 주식별자가 자식의 일반 속성(FK)으로만 상속되므로 자식은 독자적인 주식별자를 유지한다."],"a":2},{"id":"48-05","r":48,"n":5,"s":1,"b":"다른 속성의 값으로부터 계산하여 만들어지며, 조회할 때마다 다시 계산하지 않고 미리 저장해 두어 조회 성능을 높이는 대신 원본 값이 바뀌면 함께 갱신해 주어야 하는 속성은?","x":"계산해 미리 저장해 두는 속성은 파생속성이다.","o":["기본속성(Basic Attribute)","파생속성(Derived Attribute)","설계속성(Designed Attribute)","주식별자속성(PK Attribute)"],"a":1},{"id":"48-06","r":48,"n":6,"s":1,"b":"인조식별자(Artificial Identifier)에 대한 설명으로 가장 적절하지 않은 것은?","x":"인조식별자는 업무적 의미가 없는 값이다.","o":["업무적으로 의미가 없는 값을 시스템이 인위적으로 부여하는 대리키(Surrogate Key)의 성격을 가진다.","본질식별자가 여러 속성으로 구성된 복합식별자일 때, 식별자의 구성 속성 수를 줄여 조인과 인덱스 구성에 유리하게 만들 수 있다.","본질식별자의 값이 업무 규칙 변경으로 자주 바뀌는 경우, 식별의 안정성을 확보하기 위해 도입할 수 있다.","인조식별자의 값 자체가 업무 규칙을 표현해야 하므로, 본질식별자를 대체하여 업무적 의미까지 담도록 설계해야 한다."],"a":3},{"id":"48-07","r":48,"n":7,"s":1,"b":"엔터티의 특징에 대한 설명으로 가장 적절하지 않은 것은?","x":"엔터티는 인스턴스가 두 개 이상이어야 하고 다른 엔터티와 관계가 있어야 한다.","o":["엔터티는 업무 프로세스에서 반드시 필요로 하고 관리하고자 하는 정보를 담는다.","엔터티는 인스턴스가 한 개만 존재해도 되며, 다른 엔터티와 관계를 전혀 맺지 않아도 무방하다.","엔터티는 각 인스턴스를 유일하게 구분할 수 있는 식별자를 가져야 한다.","엔터티는 그 인스턴스를 설명하는 속성을 가진다."],"a":1},{"id":"48-08","r":48,"n":8,"s":1,"b":"다음 설명에 해당하는 주식별자의 특성으로 가장 적절한 것은?\n> 주식별자는 각 인스턴스를 구분하는 데 필요한 최소한의 속성으로만 구성되어야 하며, 구분에 필요하지 않은 속성을 주식별자에 포함해서는 안 된다.","x":"구분에 필요한 최소 속성으로 구성하는 것은 최소성이다.","o":["유일성","존재성","불변성","최소성"],"a":3},{"id":"48-09","r":48,"n":9,"s":1,"b":"두 엔터티 간의 관계에서 각 인스턴스가 그 관계에 반드시 참여해야 하는지(필수), 참여하지 않아도 되는지(선택)를 나타내는 표현을 무엇이라 하는지 쓰시오. (관계가 1:1인지 1:M인지를 나타내는 관계차수와는 구분되는 개념이다.)","x":"관계 참여의 필수·선택을 나타내는 것은 관계선택사양(Optionality)이다.","t":"s","a":["관계선택사양","선택사양","Optionality","관계선택성","선택성"]},{"id":"48-10","r":48,"n":10,"s":1,"b":"다음은 [계정그룹]과 [계정]의 관계를 까마귀발(Crow's Foot) 표기법으로 나타낸 ERD이다. 이 ERD에 대한 아래 해석에서 (ㄱ)과 (ㄴ)에 들어갈 말을 각각 '필수' 또는 '선택'으로 쓰시오.\n[그림: 계정그룹(#그룹코드, 그룹명) —소속한다— 계정(#계정번호, 그룹코드 FK) / 상자에 가까운 기호가 최대 차수(│는 1, 까마귀발은 여러 개), 바깥쪽 기호가 최소 참여(○는 0으로 선택, │는 1로 필수)]\n\n| 읽는 방향 | 해석 |\n|---|---|\n| 계정 → 계정그룹 | 하나의 계정이 계정그룹에 소속되는 것은 ( ㄱ )이다 |\n| 계정그룹 → 계정 | 하나의 계정그룹에 계정이 존재하는 것은 ( ㄴ )이다 |","x":"원문 그림 누락. 계정은 그룹에 반드시 속하고(필수), 그룹에는 계정이 없을 수도 있다(선택)고 추정했다.","t":"s","a":["필수,선택","필수선택"],"g":1},{"id":"48-11","r":48,"n":11,"s":2,"b":"제약조건(Constraint)에 대한 설명으로 가장 적절하지 않은 것은?","x":"값의 유일성과 NOT NULL은 PK의 특성이다. FK는 참조 무결성을 보장한다.","o":["NOT NULL은 해당 컬럼에 값이 반드시 입력되도록 강제한다.","UNIQUE는 해당 컬럼에 중복된 값이 저장되는 것을 허용하지 않는다.","CHECK는 지정한 조건식을 만족하는 값만 입력되도록 제한한다.","FOREIGN KEY는 자신이 정의된 컬럼의 값이 항상 유일하고 NULL이 아님을 보장하기 위해 사용한다."],"a":3},{"id":"48-12","r":48,"n":12,"s":2,"b":"다음 [T] 테이블에 대하여 아래 SQL을 수행했을 때 반환되는 행의 수로 가장 적절한 것은?\nT(C1, C2): (A, 10), (A, 10), (A, 20), (B, 20), (B, 20), (C, 10)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. DISTINCT C1, C2라면 4행으로 추정했다.","o":["3","4","5","6"],"a":1,"g":1,"m":1},{"id":"48-14","r":48,"n":14,"s":2,"b":"다음 [사원] 테이블에 대하여 아래 SQL을 수행했을 때의 결과로 가장 적절한 것은?\n\n| 사원ID | 부서ID | 사원명 | 연봉 |\n|---|---|---|---|\n| 1001 | 10 | 김하늘 | 5000 |\n| 1002 | 10 | 이서준 | 6200 |\n| 1003 | 10 | 박도윤 | 6200 |\n| 1004 | 20 | 최은우 | 7100 |\n| 1005 | 20 | 정민서 | 4800 |\n| 1006 | 30 | 강지호 | 5300 |\n| 1007 | 30 | 윤아린 | 5900 |\n| 1008 | 30 | 임수아 | 4200 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 부서별 최고 연봉자를 구한다고 보면 동점자 포함 4행이다.","o":["이서준, 박도윤, 최은우, 윤아린 총 4행이 조회된다.","최은우 1행만 조회된다.","이서준, 최은우, 윤아린 총 3행이 조회된다.","사원 8명이 모두 조회된다."],"a":0,"g":1,"m":1},{"id":"48-15","r":48,"n":15,"s":2,"b":"다음 [예약] 테이블에 대하여 아래 SQL을 수행했을 때, CNT 컬럼이 의미하는 값으로 가장 적절한 것은?\n\n| 예약ID | 객실등급코드 | 숙박요금 |\n|---|---|---|\n| R01 | STD | 70000 |\n| R02 | STD | 74000 |\n| R03 | DLX | 73000 |\n| R04 | DLX | 77000 |\n| R05 | SUT | 200000 |\n| R06 | SUT | 240000 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["GROUP BY와 윈도우 함수를 함께 사용했으므로 문법 오류가 발생한다.","OVER 절의 ORDER BY에 집계함수 AVG를 사용했으므로 문법 오류가 발생한다.","개별 예약 건의 숙박요금을 기준으로 ±5,000원 범위 안에 드는 예약 건의 개수를 센 값이다.","객실등급코드별 평균 숙박요금을 기준으로 ±5,000원 범위 안에 드는 객실등급코드의 개수를 센 값이다."],"a":3,"g":1,"m":1},{"id":"48-16","r":48,"n":16,"s":2,"b":"다음 [T] 테이블에 대하여 아래 SQL을 수행했을 때 출력되는 행의 순서로 가장 적절한 것은?\nT(ID, AMT): (A, 300), (A, 500), (B, 700), (C, 400)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["(B,700), (A,500), (C,400), (A,300)","(A,500), (A,300), (B,700), (C,400)","(B,700), (C,400), (A,500), (A,300)","(A,300), (A,500), (C,400), (B,700)"],"a":0,"g":1,"m":1},{"id":"48-17","r":48,"n":17,"s":2,"b":"다음 중 실행 결과의 값이 가장 큰 것은? (Oracle 기준)","x":"CEIL(7.1) = 8, 나머지는 7이다.","o":["ROUND(7.4)","TRUNC(7.9)","FLOOR(7.8)","CEIL(7.1)"],"a":3},{"id":"48-18","r":48,"n":18,"s":2,"b":"[사원] 테이블에 VARCHAR2(50) 타입의 이메일 컬럼을 추가하려고 한다. Oracle에서 올바른 구문은?","x":"Oracle은 ALTER TABLE 사원 ADD 이메일 VARCHAR2(50)이다.","o":["ALTER TABLE 사원 ADD COLUMN 이메일 VARCHAR2(50);","ALTER TABLE 사원 ADD 이메일 VARCHAR2(50);","ALTER TABLE 사원 COLUMN ADD 이메일 VARCHAR2(50);","ALTER TABLE 사원 MODIFY 이메일 VARCHAR2(50);"],"a":1},{"id":"48-19","r":48,"n":19,"s":2,"b":"다음 두 테이블에 대하여 아래 SQL을 수행할 때, 그 동작에 대한 설명으로 가장 적절한 것은?\n- 회원(회원ID, 회원명): (M01, 김하늘), (M02, 이서준), (M03, 박도윤), (M04, 최은우)\n- 주문(주문번호, 회원ID, 금액): (O1, M01, 30000), (O2, M01, 45000), (O3, M03, 20000)\n\n*(SQL 원문 누락)*","x":"주문이 없는 이서준, 최은우가 NOT EXISTS로 조회된다.","o":["EXISTS는 서브쿼리의 SELECT 절에 기술된 컬럼 값을 메인쿼리의 컬럼 값과 직접 비교하여 참·거짓을 판정한다.","서브쿼리가 두 건 이상의 행을 반환하면 단일행 서브쿼리 제약을 위반하여 오류가 발생한다.","NOT EXISTS는 서브쿼리 결과에 NULL이 포함되면 조건이 항상 거짓이 되어 한 건도 반환되지 않는다.","NOT EXISTS는 서브쿼리가 한 행도 반환하지 않을 때 참이 되므로, 결과는 이서준과 최은우 2건이다."],"a":3,"m":1},{"id":"48-20","r":48,"n":20,"s":2,"b":"다음 SQL을 수행했을 때 출력되는 값으로 가장 적절한 것은? (Oracle 기준이며, NLS_DATE_LANGUAGE는 AMERICAN이다.)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["SEP","AUGUST","SEPTEMBER","OCTOBER"],"a":2,"g":1,"m":1},{"id":"48-21","r":48,"n":21,"s":2,"b":"[사원] 테이블의 HIRE_DT는 시·분·초를 포함하는 DATE 타입이다. 2024년 3월 15일 하루 동안 입사한 사원만 조회하려고 할 때, 의도와 다른 결과를 반환하는 조건절은? (Oracle 기준)\n\n| EMP_ID | HIRE_DT |\n|---|---|\n| 1 | 2024-03-14 21:30:00 |\n| 2 | 2024-03-15 09:10:00 |\n| 3 | 2024-03-15 23:59:59 |\n| 4 | 2024-03-16 00:00:00 |\n| 5 | 2024-03-16 08:20:00 |","x":"BETWEEN에 다음 날 0시가 포함되어 EMP_ID 4까지 조회된다.","o":["WHERE HIRE_DT >= TO_DATE('20240315','YYYYMMDD') AND HIRE_DT \u003c TO_DATE('20240316','YYYYMMDD')","WHERE TRUNC(HIRE_DT) = TO_DATE('20240315','YYYYMMDD')","WHERE HIRE_DT BETWEEN TO_DATE('20240315','YYYYMMDD') AND TO_DATE('20240316','YYYYMMDD') - 1/86400","WHERE HIRE_DT BETWEEN TO_DATE('20240315','YYYYMMDD') AND TO_DATE('20240316','YYYYMMDD')"],"a":3},{"id":"48-22","r":48,"n":22,"s":2,"b":"다음 [사원] 테이블에 대하여 아래 SQL을 수행했을 때의 결과에 대한 설명으로 가장 적절한 것은?\n사원(ENAME, SAL): (김하늘, 500), (이서준, 300), (박도윤, 300), (최은우, 300)\n*(SQL 원문 누락 — R, DR, FV 컬럼을 조회하는 SQL)*","x":"원문 SQL 누락. 급여 내림차순 FIRST_VALUE라면 모든 행이 500이다.","o":["FIRST_VALUE는 정렬 기준상 첫 번째 행의 값을 모든 행에 동일하게 반환하므로 FV는 네 행 모두 500이다.","DENSE_RANK는 동일한 값에도 서로 다른 순위를 부여하므로 DR 값은 1, 2, 3, 4가 된다.","SAL이 300인 세 사원의 R 값은 각각 2, 3, 4이다.","R, DR, FV 세 컬럼의 값은 네 행에서 모두 서로 다르게 나타난다."],"a":0,"g":1,"m":1},{"id":"48-23","r":48,"n":23,"s":2,"b":"다음 설명에 해당하는 트랜잭션의 특성으로 가장 적절한 것은?\n> 동시에 수행되는 여러 트랜잭션이 서로의 중간 결과를 참조할 수 없으며, 각 트랜잭션은 다른 트랜잭션의 연산에 영향을 받지 않고 수행되어야 한다.","x":"다른 트랜잭션의 중간 결과를 보지 않는 성질은 격리성(고립성)이다.","o":["원자성(Atomicity)","일관성(Consistency)","격리성(Isolation)","지속성(Durability)"],"a":2},{"id":"48-24","r":48,"n":24,"s":2,"b":"다음 [판매] 테이블에 대하여 아래 SQL을 수행했을 때 출력되는 RESULT 값으로 가장 적절한 것은?\n판매(상품, 판매액): (P1, 120), (P2, 350), (P3, 80), (P4, 500), (P5, 210), (P6, 300), (P7, 45), (P8, 640)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["455","1490","1790","2245"],"a":1,"g":1,"m":1},{"id":"48-25","r":48,"n":25,"s":2,"b":"기본키(PRIMARY KEY)로 지정된 컬럼이 반드시 만족해야 하는 제약조건의 조합으로 가장 적절한 것은?","x":"기본키는 NOT NULL과 UNIQUE를 모두 만족해야 한다.","o":["NOT NULL + UNIQUE","NOT NULL 단독","UNIQUE 단독","NULL 허용 + UNIQUE"],"a":0},{"id":"48-26","r":48,"n":26,"s":2,"b":"다음 [T] 테이블에 대하여 아래 SQL을 수행했을 때, ID 1, 2, 3, 4 순서대로 출력되는 GRP 값으로 가장 적절한 것은?\nT(ID, VAL): (1, 10), (2, 20), (3, 30), (4, 40)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NTILE(2)라면 1, 1, 2, 2로 추정했다.","o":["1, 1, 2, 2","1, 2, 1, 2","1, 2, 3, 4","1, 1, 1, 1"],"a":0,"g":1,"m":1},{"id":"48-27","r":48,"n":27,"s":2,"b":"다음 중 반환되는 결과 건수가 나머지 셋과 다른 것은? (Oracle 기준이며, EMP 테이블에는 10건 이상의 행이 존재한다.)","x":"ROWNUM = 2는 0건이고, 나머지 선지는 2건으로 추정된다.","o":["SELECT * FROM EMP WHERE ROWNUM \u003c= 2;","SELECT * FROM EMP WHERE ROWNUM = 2;","*(선지 원문 누락)*","*(선지 원문 누락)*"],"a":1,"g":1,"m":1},{"id":"48-28","r":48,"n":28,"s":2,"b":"[회원등급] 테이블의 초기 데이터가 아래와 같을 때, 이어지는 SQL을 순서대로 모두 수행한 뒤 등급이 'GOLD'인 행의 수로 가장 적절한 것은? (Oracle 기준)\n회원등급(회원ID, 등급): (M01, SILVER), (M02, SILVER), (M03, GOLD)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["1","2","3","4"],"a":1,"g":1,"m":1},{"id":"48-29","r":48,"n":29,"s":2,"b":"GROUP BY ROLLUP(부서, 직급)을 수행했을 때 생성되는 집계 수준의 조합으로 가장 적절한 것은?","x":"ROLLUP(부서, 직급)은 (부서,직급), (부서), 전체 총계다.","o":["(부서, 직급)","(부서, 직급), (부서), 전체 총계","(부서, 직급), (직급), 전체 총계","(부서, 직급), (부서), (직급), 전체 총계"],"a":1},{"id":"48-30","r":48,"n":30,"s":2,"b":"다음 SQL을 수행했을 때 출력되는 값으로 가장 적절한 것은? (Oracle 기준)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["1","5","6","문법 오류가 발생한다."],"a":0,"g":1,"m":1},{"id":"48-31","r":48,"n":31,"s":2,"b":"다음 중 실행 결과가 나머지 셋과 다른 것은? (Oracle 기준이며, T 테이블에는 5개의 행이 존재한다.)","x":"COUNT(NULL)은 0이고 나머지는 모두 5다.","o":["SELECT COUNT(NULL) FROM T;","SELECT COUNT(*) FROM T;","SELECT COUNT(1) FROM T;","SELECT COUNT('X') FROM T;"],"a":0},{"id":"48-32","r":48,"n":32,"s":2,"b":"다른 테이블이 외래키(FOREIGN KEY)로 참조하고 있는 테이블을 삭제하려고 한다. 참조 제약조건까지 함께 제거하면서 테이블을 삭제하기 위해 DROP TABLE 문에 지정해야 하는 옵션으로 가장 적절한 것은? (Oracle 기준)","x":"참조 제약까지 지우려면 CASCADE CONSTRAINTS를 쓴다.","o":["RESTRICT","NO ACTION","REPLACE","CASCADE CONSTRAINTS"],"a":3},{"id":"48-33","r":48,"n":33,"s":2,"b":"ROLLUP으로 생성된 소계·총계 행에서는 그룹 기준 컬럼의 값이 NULL로 출력된다. 이때 데이터에 원래부터 존재하던 NULL과 구분하여 소계·총계 행에만 '소계'라는 문자열을 표시하려고 한다. 가장 적절한 방법은?","x":"GROUPING(부서) = 1인 소계 행에만 '소계'를 표시한다.","o":["NVL(부서, '소계')","COALESCE(부서, '소계')","NULLIF(부서, '소계')","CASE WHEN GROUPING(부서) = 1 THEN '소계' ELSE 부서 END"],"a":3},{"id":"48-34","r":48,"n":34,"s":2,"b":"SEARCHED CASE 표현식에 대한 설명으로 가장 적절하지 않은 것은?","x":"SEARCHED CASE는 CASE 뒤에 컬럼 없이 WHEN 조건식을 쓴다.","o":["CASE 키워드 바로 뒤에 비교 대상이 되는 컬럼을 반드시 기술해야 한다.","WHEN 절마다 서로 다른 컬럼을 사용하는 독립적인 조건식을 기술할 수 있다.","조건은 위에서부터 순차적으로 평가되며, 처음으로 참이 되는 WHEN 절의 결과를 반환한다.","ELSE 절을 생략하면 어떤 조건도 만족하지 않는 경우 NULL이 반환된다."],"a":0},{"id":"48-35","r":48,"n":35,"s":2,"b":"뷰(VIEW)에 대한 설명으로 가장 적절한 것은?","x":"뷰는 ALTER로 정의를 바꿀 수 없어 CREATE OR REPLACE VIEW를 쓴다.","o":["뷰는 조회 성능을 높이기 위해 조회 결과 데이터를 물리적으로 저장한다.","한 번 생성된 뷰는 DROP 문으로 삭제할 수 없다.","뷰의 정의는 ALTER 문으로 변경할 수 없으며, CREATE OR REPLACE VIEW를 사용하거나 삭제 후 다시 생성해야 한다.","뷰가 참조하는 테이블의 컬럼이 변경되어도 뷰는 아무런 영향을 받지 않는다."],"a":2},{"id":"48-36","r":48,"n":36,"s":2,"b":"두 SELECT 문 Q1, Q2가 각각 5행, 4행을 반환한다. 이때 'Q1 UNION Q2'와 'Q1 UNION ALL Q2'의 결과 행 수 조합으로 가능한 것은?","x":"UNION은 최대 9행이고 UNION ALL은 항상 9행이므로 UNION 7, UNION ALL 9가 가능하다.","o":["UNION 9행, UNION ALL 7행","UNION 7행, UNION ALL 9행","UNION 10행, UNION ALL 9행","UNION 5행, UNION ALL 11행"],"a":1},{"id":"48-37","r":48,"n":37,"s":2,"b":"문자열의 왼쪽과 오른쪽 양쪽 끝에 있는 공백을 한 번에 제거하는 함수로 가장 적절한 것은?","x":"양쪽 공백을 제거하는 것은 TRIM이다.","o":["LTRIM","RTRIM","TRIM","REPLACE"],"a":2},{"id":"48-38","r":48,"n":38,"s":2,"b":"다음 [T] 테이블에 대하여 아래 SQL을 수행했을 때 출력되는 값으로 가장 적절한 것은? (Oracle 기준)\nT.COL: 123-4567, 987-6543, 12-34567, 1234-567, 555-1234, 123-45678\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 'NNN-NNNN' 형식이라면 3건으로 추정했다.","o":["2","3","4","6"],"a":1,"g":1,"m":1},{"id":"48-39","r":48,"n":39,"s":2,"b":"조인 조건을 명시하지 않고 두 테이블의 모든 행 조합(카티션 곱)을 반환하는 조인으로 가장 적절한 것은?","x":"조건 없이 모든 조합을 만드는 것은 CROSS JOIN이다.","o":["INNER JOIN","LEFT OUTER JOIN","CROSS JOIN","FULL OUTER JOIN"],"a":2},{"id":"48-40","r":48,"n":40,"s":2,"b":"계층형 질의에서 CONNECT BY PRIOR 사원번호 = 관리자번호 형태로 트리를 순방향 전개하던 중, 다음 단계로 이어갈 관리자번호 값이 NULL인 경우의 동작으로 가장 적절한 것은? (Oracle 기준)","x":"NULL은 어떤 값과도 같지 않아 그 가지의 전개가 멈춘다.","o":["NULL은 어떤 값과도 매칭되지 않으므로 해당 가지의 전개가 그 지점에서 멈춘다.","NULL이 모든 행과 매칭되어 전개가 무한히 반복된다.","전개 방향이 자동으로 역방향(자식에서 부모)으로 전환된다.","NULL 매칭 실패로 오류가 발생하여 질의 수행이 중단된다."],"a":0},{"id":"48-41","r":48,"n":41,"s":2,"b":"윈도우 함수(WINDOW FUNCTION)는 그 기능에 따라 아래와 같이 분류된다. 다음 〈보기〉 중 표준적인 윈도우 함수 분류에 존재하지 않는 항목 하나를 골라 그대로 쓰시오.\n㉠ 그룹 내 순위(RANK) 함수\n㉡ 그룹 내 집계(AGGREGATE) 함수\n㉢ 사용자 정의(USER DEFINED) 윈도우 함수\n㉣ 그룹 내 행 순서(ROW ORDER) 함수","x":"표준 윈도우 함수 분류에 사용자 정의 윈도우 함수는 없다.","t":"s","a":["사용자 정의(USER DEFINED) 윈도우 함수","사용자정의","사용자 정의","USER DEFINED","㉢","ㄷ"]},{"id":"48-43","r":48,"n":43,"s":2,"b":"Oracle에서 연봉이 가장 높은 사원 5명을 조회하려고 한다. 같은 SELECT 문 안에서 ROWNUM과 ORDER BY를 함께 쓰면 정렬 전에 행이 잘려 순서가 보장되지 않으므로, 아래와 같이 정렬을 마친 인라인 뷰를 바깥에서 잘라내야 한다. (ㄱ)에 들어갈 조건식을 쓰시오.\n*(SQL 원문 누락)*","x":"정렬된 인라인 뷰 밖에서 ROWNUM \u003c= 5로 자른다.","t":"s","a":["ROWNUM \u003c= 5","ROWNUM\u003c=5","ROWNUM \u003c 6","ROWNUM\u003c6"],"m":1},{"id":"48-45","r":48,"n":45,"s":2,"b":"다음 SQL과 같이 메인쿼리의 WHERE 절에서 두 개 이상의 컬럼을 서브쿼리의 결과와 한 번에 비교하는 형태의 서브쿼리를 무엇이라 하는지 쓰시오.\n*(SQL 원문 누락)*","x":"여러 컬럼을 동시에 비교하는 것은 다중 컬럼 서브쿼리다.","t":"s","a":["다중 컬럼 서브쿼리","다중컬럼 서브쿼리","다중컬럼서브쿼리","다중 컬럼","다중컬럼"],"m":1},{"id":"48-49","r":48,"n":49,"s":2,"b":"다음 [사원] 테이블에서 급여를 오름차순으로 정렬했을 때, 각 행에 바로 이전 행의 급여를 함께 출력하려고 한다. (ㄱ)에 들어갈 윈도우 함수의 이름을 쓰시오.\n사원(사원명, 급여): (김하늘, 3200), (이서준, 3800), (박도윤, 4100), (최은우, 4600)\n*(SQL 원문 누락)*","x":"이전 행의 값을 가져오는 것은 LAG다.","t":"s","a":["LAG"],"m":1},{"id":"49-01","r":49,"n":1,"s":1,"b":"다음과 같은 상황을 해소하기 위해 수행해야 하는 정규화 단계로 가장 적절한 것은?\n> 〈수강신청〉 엔터티의 주식별자는 {학번, 과목코드}로 구성되어 있다. 그런데 일반 속성인 '학생명'은 주식별자 전체가 아니라 '학번' 값만 알면 그 값이 결정된다.","x":"학생명이 PK 일부(학번)에만 종속되는 부분 종속이라 제2정규화가 필요하다.","o":["제1정규화","제2정규화","제3정규화","BCNF"],"a":1},{"id":"49-02","r":49,"n":2,"s":1,"b":"하나의 속성이 가질 수 있는 데이터 값의 범위를 의미하는 용어로 가장 적절한 것은?","x":"속성이 가질 수 있는 값의 범위는 도메인이다.","o":["관계(Relationship)","인스턴스(Instance)","도메인(Domain)","식별자(Identifier)"],"a":2},{"id":"49-03","r":49,"n":3,"s":1,"b":"주식별자를 구성하는 속성 중 어느 하나라도 제외하면 더 이상 인스턴스를 유일하게 구분할 수 없어야 한다는 성질을 무엇이라 하는가?","x":"하나라도 빼면 구분할 수 없는 최소 구성은 최소성이다.","o":["유일성","불변성","대표성","최소성"],"a":3},{"id":"49-04","r":49,"n":4,"s":1,"b":"다음 ERD에 대한 해석으로 옳지 않은 것은?\n[그림: 상품 — 주문 관계도(IE 표기법)]\n※ 표기법: 관계선 끝에 붙은 기호는 그 기호가 닿아 있는 쪽 엔터티가 몇 개 대응되는지를 나타낸다. 세로선 두 개(||)는 1개(필수), 원(○)은 0개도 가능(선택), 까마귀발은 여러 개(N)를 뜻한다.","x":"상품 쪽 관계가 선택(○)이므로 주문이 없는 상품도 있을 수 있다.","o":["하나의 주문은 반드시 하나의 상품에 대응된다.","하나의 상품에는 여러 건의 주문이 대응될 수 있다.","주문이 한 건도 없는 상품도 존재할 수 있다.","모든 상품은 최소 한 건 이상의 주문을 가진다."],"a":3,"g":1},{"id":"49-05","r":49,"n":5,"s":1,"b":"도메인(Domain)이 정의하는 내용으로 볼 수 없는 것은?","x":"FK 제약은 도메인이 아니라 테이블 제약조건으로 정의한다.","o":["속성이 가질 수 있는 데이터 타입을 정의한다.","다른 엔터티를 참조하는 FOREIGN KEY 제약 조건을 정의한다.","속성이 가질 수 있는 값의 길이와 범위를 정의한다.","속성에 NULL 값을 허용할 것인지 여부를 정의한다."],"a":1},{"id":"49-06","r":49,"n":6,"s":1,"b":"식별자 관계와 비식별자 관계에 대한 설명으로 옳지 않은 것은?","x":"식별자 관계에서 자식 주식별자가 부모에 종속되고, 비식별자 관계에서 독립적이다. 설명이 반대다.","o":["식별자 관계에서는 자식의 주식별자가 부모로부터 독립적으로 구성되고, 비식별자 관계에서는 자식의 주식별자가 부모에 종속된다.","식별자 관계에서는 부모 엔터티의 주식별자가 자식 엔터티의 주식별자에 포함된다.","식별자 관계로 연결된 자식 엔터티의 인스턴스는 부모 엔터티의 인스턴스 없이 존재할 수 없다.","비식별자 관계에서는 부모 엔터티의 주식별자가 자식 엔터티의 일반 속성으로 상속된다."],"a":0},{"id":"49-07","r":49,"n":7,"s":1,"b":"업무에서 직접 사용하는 데이터는 아니지만 데이터 모델링을 수행하면서 업무를 규칙화하기 위해 새로 만들어낸 속성을 무엇이라 하는가?","x":"업무 규칙화를 위해 새로 만든 속성은 설계 속성이다.","o":["기본 속성","설계 속성","파생 속성","관계 속성"],"a":1},{"id":"49-08","r":49,"n":8,"s":1,"b":"두 개 이상의 부모 엔터티에서 일어나는 행위로 인해 생성되며, 상세 설계 단계에서 주로 도출되는 엔터티 유형은?","x":"두 개 이상의 부모에서 일어나는 행위로 생기는 것은 행위 엔터티다.","o":["기본 엔터티","중심 엔터티","행위 엔터티","개념 엔터티"],"a":2},{"id":"49-09","r":49,"n":9,"s":1,"b":"다음 〈보기〉의 네 가지 식별자 후보 중 인조식별자가 아니라 본질식별자에 해당하는 것을 하나 골라 쓰시오.\n- 시스템이 자동으로 채번한 주문일련번호\n- 시퀀스로 생성한 회원일련번호\n- 주민등록번호\n- IDENTITY 속성으로 자동 증가하는 접수번호","x":"업무에서 자연스럽게 생기는 주민등록번호가 본질식별자다. 나머지는 시스템이 만든 인조식별자다.","t":"s","a":["주민등록번호"]},{"id":"49-10","r":49,"n":10,"s":1,"b":"두 엔터티 간의 관계에서 한쪽 엔터티의 인스턴스 하나가 다른 쪽 엔터티의 인스턴스 몇 개와 대응되는지를 나타내는 관계의 속성을 무엇이라 하는지 쓰시오.","x":"한쪽 인스턴스가 다른 쪽 몇 개와 대응되는지는 관계차수(Cardinality)다.","t":"s","a":["관계차수","카디널리티","Cardinality","관계 차수"]},{"id":"49-11","r":49,"n":11,"s":2,"b":"선수 테이블을 조회하되 선수명과 팀명은 오름차순, 연봉은 내림차순으로 정렬하려고 한다. 빈칸 (ㄱ)에 들어갈 ORDER BY 절로 가장 적절한 것은?\n```sql\nSELECT 선수명, 팀명, 연봉\nFROM 선수\n( ㄱ );\n```","x":"선수명 ASC, 팀명(기본 ASC), 3번째 컬럼(
