nSELECT 주문일자, 금액,\n       SUM(금액) OVER (ORDER BY 주문일자\n                       ______________________________ ) AS 누적금액\nFROM 주문;\n```","x":"처음부터 현재 행까지는 ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW다.","o":["ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING","RANGE BETWEEN UNBOUNDED FOLLOWING AND CURRENT ROW","ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW","ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING"],"a":2},{"id":"59-28","r":59,"n":28,"s":2,"b":"주문일시(DATE, 시·분·초 포함) 컬럼에서 '2025년 10월 20일 하루 전체'에 해당하는 행을 조회하려고 한다. 조회 조건으로 옳지 않은 것은?","x":"BETWEEN ... 2025-10-21 00:00:00은 다음 날 0시까지 포함해 하루를 넘는다.","o":["주문일시 >= TO_DATE('2025-10-20','YYYY-MM-DD') AND 주문일시 \u003c TO_DATE('2025-10-21','YYYY-MM-DD')","TRUNC(주문일시) = TO_DATE('2025-10-20','YYYY-MM-DD')","주문일시 BETWEEN TO_DATE('2025-10-20','YYYY-MM-DD') AND TO_DATE('2025-10-21','YYYY-MM-DD')","주문일시 >= TO_DATE('2025-10-20','YYYY-MM-DD') AND 주문일시 \u003c= TO_DATE('2025-10-20','YYYY-MM-DD') + 1 - 1/86400"],"a":2},{"id":"59-29","r":59,"n":29,"s":2,"b":"다음과 같은 계층형 질의(START WITH ... CONNECT BY)에 대한 설명으로 옳지 않은 것은?\n```sql\nSELECT LEVEL, 사원명, 관리자ID\nFROM 사원\nSTART WITH 관리자ID IS NULL\nCONNECT BY PRIOR 사원ID = 관리자ID;\n```","x":"일반 ORDER BY를 쓰면 계층 순서가 깨진다. 형제끼리 정렬하려면 ORDER SIBLINGS BY를 써야 한다.","o":["START WITH는 계층 전개를 시작할 루트(최상위) 행의 조건을 지정한다.","CONNECT BY PRIOR는 부모 행과 자식 행을 연결하는 전개 방향을 결정한다.","LEVEL은 루트를 1로 하여 아래로 내려갈수록 1씩 증가하는 계층의 깊이를 반환한다.","ORDER SIBLINGS BY 대신 일반 ORDER BY를 사용해도 형제 노드 간 정렬은 물론 계층 구조 자체는 항상 그대로 유지된다."],"a":3},{"id":"59-30","r":59,"n":30,"s":2,"b":"WHERE 절에서 논리 연산자 AND, OR, NOT이 함께 사용될 때의 평가 순서에 대한 설명으로 옳은 것은?","x":"우선순위는 NOT > AND > OR이다.","o":["같은 수준에서 괄호가 없으면 AND가 OR보다 먼저 평가된다.","괄호가 없으면 OR가 AND보다 먼저 평가된다.","논리 연산자는 우선순위 없이 항상 왼쪽에서 오른쪽 순서로만 평가된다.","NOT은 AND, OR가 모두 평가된 뒤 가장 마지막에 평가된다."],"a":0},{"id":"59-31","r":59,"n":31,"s":2,"b":"다음 SQL에 대한 설명으로 옳은 것은?\n```sql\nSELECT 사원명, 급여\nFROM 사원\nWHERE 급여 > ALL (SELECT MAX(급여)\n                  FROM 사원\n                  GROUP BY 부서번호);\n```","x":"부서가 하나뿐이면 > ALL(값 1개)은 그 값과 단일 비교하는 것과 같다.","o":["서브쿼리가 반환하는 부서가 하나뿐이라면, 단일 값과 비교하는 것과 결과가 같다.","서브쿼리가 여러 부서(여러 행)를 반환하면 단일행 비교 오류가 발생한다.","ALL을 ANY로 바꿔도 결과가 항상 동일하다.","ALL 대신 등호(=)를 사용해도 결과가 동일하다."],"a":0},{"id":"59-32","r":59,"n":32,"s":2,"b":"CUBE, ROLLUP, GROUPING SETS에 대한 설명으로 옳은 것은?","x":"GROUPING SETS(부서, 직급)은 (부서), (직급) 두 그룹만 만들며 UNION ALL 두 개와 같다.","o":["ROLLUP(부서, 직급)은 (부서,직급), (부서), (직급), () 의 4가지 집계를 생성한다.","CUBE(부서, 직급)은 (부서,직급), (부서), () 의 3가지 집계만 생성한다.","GROUPING SETS는 명시한 그룹 외에 전체 합계 ()를 항상 자동으로 포함한다.","GROUPING SETS(부서, 직급)은 (부서), (직급) 두 그룹만 생성하며 UNION ALL로 표현할 수 있다."],"a":3},{"id":"59-33","r":59,"n":33,"s":2,"b":"다음 Round 함수 결과에 대한 설명 중 옳은 것을 모두 고른 것은?\n가. Round(136.2, -1) = 140\n나. Round(-7.532, 2) = -7.5\n다. Round(3.561, 0) = 3","x":"ROUND(-7.532, 2) = -7.53, ROUND(3.561, 0) = 4이므로 가만 옳다.","o":["가","나","가, 나","나, 다"],"a":0},{"id":"59-34","r":59,"n":34,"s":2,"b":"다음 중 현재 날짜에서 '월(月)'을 추출하지 않는 것은?","x":"EXTRACT(YEAR ...)는 연도를 추출한다.","o":["EXTRACT(YEAR FROM SYSDATE)","EXTRACT(MONTH FROM SYSDATE)","TO_CHAR(SYSDATE, 'MM')","TO_NUMBER(TO_CHAR(SYSDATE, 'MM'))"],"a":0},{"id":"59-35","r":59,"n":35,"s":2,"b":"다음 SELECT의 결과를 순서대로 바르게 나열한 것은?\n```sql\nSELECT SUM(성과급)\nFROM 사원\nGROUP BY 부서\nORDER BY 부서;\n```\n사원(부서, 성과급): (A, NULL), (A, NULL), (B, 10), (B, 20), (C, 30), (C, 30)","x":"A는 NULL만 있어 SUM이 NULL, B는 30, C는 60이다.","o":["NULL, 0, 60","NULL, 30, 60","0, 30, 60","60, 30, NULL"],"a":1},{"id":"59-36","r":59,"n":36,"s":2,"b":"다음 SQL의 결과를 순서대로 바르게 나열한 것은? (T1, T2, T3의 열 이름은 모두 코드)\n```sql\nSELECT 코드 FROM T1\nMINUS\nSELECT 코드 FROM T2\nUNION ALL\nSELECT 코드 FROM T3;\n```\nT1: A, B / T2: B / T3: B, B, C","x":"T1 MINUS T2 = A에 T3(B, B, C)를 UNION ALL 하여 A, B, B, C다.","o":["A, B, C","A, A, B, C","A, B, B, C","B, B, C"],"a":2},{"id":"59-37","r":59,"n":37,"s":2,"b":"다음 SQL에 대한 설명으로 옳은 것은?\n```sql\nSELECT 배우명, 출연료\nFROM 출연 O\nWHERE 출연료 > (SELECT AVG(출연료)\n               FROM 출연 I\n               WHERE I.영화ID = O.영화ID);\n```","x":"서브쿼리가 메인쿼리의 O.영화ID를 참조하는 연관(상관) 서브쿼리다.","o":["서브쿼리가 메인쿼리와 무관하게 딱 한 번만 실행되는 비연관 서브쿼리이다.","서브쿼리를 먼저 한 번 실행해 상수 값을 구한 뒤 메인쿼리를 실행한다.","서브쿼리에서는 메인쿼리의 컬럼을 참조할 수 없다.","메인쿼리의 각 행마다 서브쿼리가 실행되어 값을 비교하는 연관(상관) 서브쿼리이다."],"a":3},{"id":"59-38","r":59,"n":38,"s":2,"b":"다음 쿼리에서 '박'의 순위와, RANK를 DENSE_RANK로 바꿨을 때 '박'의 순위를 바르게 짝지은 것은?\n```sql\nSELECT 이름,\n       RANK() OVER (ORDER BY 점수 DESC) AS 순위\nFROM 성적;\n```\n성적(이름, 점수): (김, 90), (이, 90), (박, 80), (최, 70)","x":"RANK는 김·이 공동 1위 다음 3위, DENSE_RANK는 2위다.","o":["3, 3","3, 2","4, 2","4, 3"],"a":1},{"id":"59-39","r":59,"n":39,"s":2,"b":"다음 계층형 질의의 동작으로 옳은 것은? (parent_id는 상위 category_id를 가리킨다)\n```sql\nSELECT category_id, parent_id, LEVEL\nFROM category\nSTART WITH category_id = 11\nCONNECT BY category_id = PRIOR parent_id;\n```","x":"CONNECT BY category_id = PRIOR parent_id는 자식에서 부모로 올라가는 역방향 전개다.","o":["category_id 11에서 시작해 하위(자식) 방향으로 전개한다.","category_id 2에서 시작해 하위(자식) 방향으로 전개한다.","category_id 11에서 시작해 정방향(부모→자식)으로 전개한다.","category_id 11에서 시작해 역방향(자식→부모, 상위)으로 전개한다."],"a":3},{"id":"59-40","r":59,"n":40,"s":2,"b":"NATURAL JOIN에 대한 설명으로 옳은 것은?","x":"NATURAL JOIN에는 USING이나 ON을 함께 쓸 수 없다.","o":["조인에 사용되는 공통 컬럼에는 반드시 테이블명(별칭) 접두사를 붙여야 한다.","두 테이블에 이름이 같은 컬럼이 하나도 없어도 조인 조건이 자동으로 만들어진다.","NATURAL JOIN과 USING 절을 함께 사용하면 오류가 발생한다.","컬럼 이름만 같으면 데이터 타입이 달라도 자동으로 조인된다."],"a":2},{"id":"59-41","r":59,"n":41,"s":2,"b":"트랜잭션(Transaction)과 TCL에 대한 다음 설명 중 옳은 것을 모두 고른 것은?\n가. DDL 문장을 실행하면 묵시적으로 COMMIT이 수행된다.\n나. 트랜잭션은 데이터베이스의 논리적 연산(작업) 단위이다.\n다. SAVEPOINT를 지정하면 해당 지점에서 트랜잭션 전체가 즉시 종료된다.","x":"SAVEPOINT는 저장점일 뿐 트랜잭션을 끝내지 않는다. 가, 나가 옳다.","o":["가","다","나, 다","가, 나"],"a":3},{"id":"59-42","r":59,"n":42,"s":2,"b":"다음 주문 테이블에 대해 아래 SQL을 실행할 때 결과로 반환되는 '건수' 값들을 모두 고른 것은?\n주문(고객, 배송일자): (A, 2024-01-01), (A, 2024-01-03), (A, 2024-01-05), (B, 2024-02-01), (B, 2024-02-10), (B, NULL), (C, 2024-03-01)\n```sql\nSELECT 고객, COUNT(배송일자) AS 건수\nFROM 주문\nGROUP BY 고객\nHAVING COUNT(배송일자) >= 2;\n```","x":"A는 3, B는 NULL을 빼고 2, C는 1이라 HAVING에서 제외된다.","o":["3","2, 3","1, 2, 3","3, 4"],"a":1},{"id":"59-43","r":59,"n":43,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n사원(사원명, 보너스): ('김', NULL), ('이', 50)\n```sql\nSELECT 사원명,\n       NVL2(보너스, 보너스 + 100, 0) AS 지급액\nFROM 사원;\n```","x":"김은 보너스가 NULL이라 0, 이는 50+100 = 150이다.","o":["김 = 100, 이 = 150","김 = 0, 이 = 50","김 = 0, 이 = 150","김 = NULL, 이 = 150"],"a":2},{"id":"59-44","r":59,"n":44,"s":2,"b":"Oracle 계층형 질의(Hierarchical Query)에 대한 설명으로 옳지 않은 것은?","x":"LEVEL은 항상 루트에서 1로 시작한다.","o":["START WITH 절은 계층 구조 전개를 시작하는 루트(root) 행을 지정한다.","LEVEL 의사컬럼은 시작 값을 임의로 지정할 수 있어 루트의 LEVEL이 반드시 1이 되는 것은 아니다.","데이터에 순환(cycle)이 존재할 수 있는 경우 NOCYCLE 옵션으로 무한 전개를 방지할 수 있다.","ORDER SIBLINGS BY 절은 동일한 부모를 가진 형제(sibling) 노드 사이에서만 정렬을 수행한다."],"a":1},{"id":"59-45","r":59,"n":45,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행할 때 반환되는 행의 수는?\nA(col): 1, 1, 2 / B(col): 2, 3\n```sql\nSELECT col FROM A\nUNION ALL\nSELECT col FROM B;\n```","x":"UNION ALL은 중복을 그대로 두므로 3+2 = 5행이다.","o":["5","4","3","2"],"a":0},{"id":"59-46","r":59,"n":46,"s":2,"b":"GROUP BY ROLLUP(부서, 직급) 을 사용한 집계에 대한 설명으로 옳은 것은?","x":"ROLLUP(부서, 직급)은 상세, 부서 소계, 전체 합계를 만든다.","o":["(부서, 직급)별 집계와 함께 부서별 소계, 그리고 전체 합계 행이 생성된다.","(부서, 직급)별 집계와 함께 직급별 소계도 함께 생성된다.","ROLLUP은 GROUP BY 없이 단독으로 사용할 수 있다.","ROLLUP(부서, 직급)과 CUBE(부서, 직급)의 결과 행 수는 항상 동일하다."],"a":0},{"id":"59-47","r":59,"n":47,"s":2,"b":"다음 테이블 T와 SQL에 대해, id 순으로 출력되는 '이동합' 컬럼의 값을 순서대로 바르게 나열한 것은?\nT(id, val): (1, 100), (2, 200), (3, 300), (4, 400)\n```sql\nSELECT val,\n       SUM(val) OVER (ORDER BY id\n             ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) AS 이동합\nFROM T\nORDER BY id;\n```","x":"앞뒤 한 행씩: 100+200, 100+200+300, 200+300+400, 300+400 = 300, 600, 900, 700.","o":["100, 300, 600, 1000","300, 500, 700, 700","300, 600, 900, 700","100, 200, 300, 400"],"a":2},{"id":"59-48","r":59,"n":48,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n사원(사원번호): 1, 2, 3 / 관리(관리자번호): 1, NULL\n```sql\nSELECT 사원번호\nFROM 사원\nWHERE 사원번호 NOT IN (SELECT 관리자번호 FROM 관리);\n```","x":"NOT IN 목록에 NULL이 있으면 결과가 하나도 나오지 않는다.","o":["2, 3","1","한 건도 반환되지 않는다.","1, 2, 3"],"a":2},{"id":"59-49","r":59,"n":49,"s":2,"b":"DCL(GRANT·REVOKE)과 권한에 대한 설명으로 옳지 않은 것은?","x":"ROLE에 부여한 권한도 REVOKE로 회수할 수 있다.","o":["GRANT SELECT ON 사원 TO 사용자A; 는 사용자A에게 사원 테이블 조회 권한을 부여한다.","WITH GRANT OPTION을 붙여 권한을 부여하면, 권한을 받은 사용자가 다시 다른 사용자에게 그 권한을 부여할 수 있다.","REVOKE는 이전에 부여한 권한을 회수하는 명령이다.","ROLE에 부여한 권한은 한 번 부여되면 REVOKE로 회수할 수 없다."],"a":3},{"id":"59-50","r":59,"n":50,"s":2,"b":"다음 SQL을 실행한 결과로 옳은 것은? (사원 테이블에는 총 10건의 행이 있다.)\n```sql\nSELECT *\nFROM 사원\nWHERE 1 = 0;\n```","x":"1 = 0은 항상 거짓이라 공집합이 나온다.","o":["사원 테이블의 전체 10건이 조회된다.","문법 오류가 발생하여 실행되지 않는다.","1 = 0 은 허용되지 않으므로 1 = 2 로 바꿔야 실행된다.","조건이 항상 거짓이므로 한 건도 반환되지 않는다(공집합)."],"a":3},{"id":"60-01","r":60,"n":1,"s":1,"b":"발생 시점에 따라 엔터티를 분류할 때, 다른 엔터티로부터 업무 행위의 결과로 발생하며 데이터가 자주 변경되고 인스턴스의 양이 가장 많은 특징을 가지는 엔터티는 무엇인가?","x":"업무 행위의 결과로 발생하고 변경이 잦으며 양이 가장 많은 것은 행위 엔터티다.","o":["기본 엔터티","중심 엔터티","개념 엔터티","행위 엔터티"],"a":3},{"id":"60-02","r":60,"n":2,"s":1,"b":"다른 속성의 값을 계산하거나 특정 규칙으로 가공하여 저장하는 속성으로, 원본 속성이 바뀌면 값의 정합성 관리가 필요하고 되도록 최소화하는 것이 바람직한 속성은?","x":"다른 속성으로 계산·가공한 값을 저장하는 속성은 파생속성이다.","o":["파생속성","기본속성","설계속성","연관속성"],"a":0},{"id":"60-03","r":60,"n":3,"s":1,"b":"엔터티, 인스턴스, 속성, 속성값 사이의 관계에 대한 설명으로 옳지 않은 것은?","x":"하나의 인스턴스는 각 속성에 대해 하나의 속성값만 가진다.","o":["하나의 엔터티는 두 개 이상의 인스턴스를 가진다.","하나의 엔터티는 두 개 이상의 속성을 가진다.","하나의 인스턴스는 하나의 속성에 대해 두 개 이상의 속성값을 가진다.","하나의 속성은 하나의 속성값을 가진다."],"a":2},{"id":"60-04","r":60,"n":4,"s":1,"b":"통신사 데이터 모델에 [고객], [서비스], [서비스이용], [청구], [납부] 엔터티가 있다. 한 고객은 여러 서비스를 이용할 수 있고 하나의 서비스는 여러 고객이 이용할 수 있다. 이 모델에 대한 설명으로 옳지 않은 것은?","x":"서비스이용은 고객과 서비스의 M:N을 푸는 교차 엔터티로 두 엔터티와 관계를 맺는다.","o":["[서비스이용]은 [고객], [서비스] 어느 쪽과도 관계를 맺지 않는 독립 엔터티이다.","[서비스이용]은 [고객]과 [서비스]의 M:N 관계를 해소하는 교차(관계) 엔터티이다.","[청구]는 [서비스이용]의 결과로 발생하는 행위 엔터티이다.","[납부]는 [청구]에 대응하여 발생한다."],"a":0},{"id":"60-05","r":60,"n":5,"s":1,"b":"[고객]과 [주문] 엔터티가 \"한 명의 고객은 0건 이상의 주문을 하고, 모든 주문은 반드시 한 명의 고객에 속한다\"는 규칙으로 연결되어 있다. 이 관계에 대한 설명으로 옳은 것은?","x":"고객 1명이 주문 여러 건을 가지는 1:M 관계다. 고객은 선택, 주문은 필수 참여다.","o":["[고객] 쪽 참여는 필수(mandatory)이다.","[주문] 쪽 참여는 선택(optional)이다.","고객:주문의 관계 차수(cardinality)는 1:M이다.","주문이 없는 고객은 존재할 수 없다."],"a":2},{"id":"60-06","r":60,"n":6,"s":1,"b":"비식별자 관계(non-identifying relationship)에 대한 설명으로 옳지 않은 것은?","x":"부모 주식별자가 자식 주식별자를 구성하는 것은 식별자 관계다.","o":["부모 엔터티의 주식별자가 자식 엔터티의 일반 속성(외래키)으로 상속된다.","ERD에서 관계선을 점선으로 표현한다.","자식 엔터티는 부모와 무관하게 자신만의 주식별자를 독립적으로 구성한다.","부모 엔터티의 주식별자가 자식 엔터티의 주식별자를 그대로 구성한다."],"a":3},{"id":"60-07","r":60,"n":7,"s":1,"b":"피터 첸(Peter Chen) 표기법에서 관계(Relationship)를 나타내는 데 사용하는 기호는?","x":"피터 첸 표기법에서 엔터티는 사각형, 속성은 타원, 관계는 마름모다.","o":["사각형","타원","마름모","직선(선)"],"a":2},{"id":"60-08","r":60,"n":8,"s":1,"b":"주식별자를 구성하는 속성 중 하나라도 제외되면 각 인스턴스를 유일하게 구분할 수 없게 되어, 더 이상 줄일 수 없는 최소 속성 집합으로 구성해야 한다는 주식별자의 특성은?","x":"구분에 필요한 최소한의 속성으로만 구성되어야 하는 성질은 최소성이다.","o":["대표성","최소성","불변성","유일성"],"a":1},{"id":"60-09","r":60,"n":9,"s":1,"b":"정규화 단계 중, 기본키(주식별자)가 아닌 일반 속성들 사이의 함수적 종속을 제거하는 데 초점을 두어 주식별자와의 직접적 관련성이 가장 낮은 것은?","x":"일반 속성 간 종속(이행 종속)을 제거하는 것은 제3정규형이다.","o":["제1정규형","제2정규형","제3정규형","BCNF"],"a":2},{"id":"60-10","r":60,"n":10,"s":1,"b":"인조 식별자(artificial identifier)에 대한 설명으로 옳은 것은?","x":"인조 식별자는 업무 의미와 무관하게 인위적으로 만든 식별자(예: 일련번호)다.","o":["업무적으로 자연스럽게 존재하여 사용자가 쉽게 인지할 수 있는 식별자이다.","원래 업무에 존재하던 속성을 그대로 주식별자로 사용한 것이다.","업무적 의미와 무관하게 관리 편의를 위해 인위적으로 부여한 식별자이다.","반드시 여러 속성을 조합하여 만든 복합 식별자만을 의미한다."],"a":2},{"id":"60-11","r":60,"n":11,"s":2,"b":"다음은 오라클 계층형 질의(CONNECT BY)에서 사용하는 의사컬럼·연산자에 대한 설명이다. 옳지 않은 것을 모두 고른 것은?\n가. LEVEL은 계층의 깊이를 반환하며, 루트 노드는 0을 반환한다.\n나. CONNECT_BY_ISLEAF는 해당 행이 루트 노드이면 1을 반환한다.\n다. CONNECT_BY_ISCYCLE는 사이클이 발생하지 않은 정상 행에 대해 1을 반환한다.\n라. CONNECT_BY_ROOT는 각 행에 대해 계층의 최하위(리프) 노드 값을 반환하는 연산자다.","x":"가: 루트는 1. 나: ISLEAF는 리프일 때 1. 다: 사이클일 때 1. 라: ROOT는 루트 값. 네 설명 모두 틀렸다.","o":["나, 다","나, 다, 라","가, 다, 라","가, 나, 다, 라"],"a":3},{"id":"60-12","r":60,"n":12,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은? (단, 부서 테이블의 부서번호 컬럼에는 NULL이 포함된 행이 존재한다.)\n```sql\nSELECT 이름\nFROM   사원\nWHERE  부서번호 NOT IN (SELECT 부서번호 FROM 부서);\n```","x":"NOT IN 목록에 NULL이 있으면 모든 비교가 UNKNOWN이 되어 한 건도 나오지 않는다.","o":["사원 테이블의 전체 행이 조회된다","부서번호가 NULL인 사원만 조회된다","한 건도 조회되지 않는다(공집합)","문법 오류가 발생한다"],"a":2},{"id":"60-13","r":60,"n":13,"s":2,"b":"부서별·직급별 연봉 합계를 다음과 같은 교차표 형태로 조회하려고 한다. 빈칸에 들어갈 올바른 구문은?\n\n| 부서 | 사원 | 대리 | 팀장 | 부장 |\n|---|---|---|---|---|\n| 인사팀 | ... | ... | ... | ... |\n| IT팀 | ... | ... | ... | ... |\n| 행정팀 | ... | ... | ... | ... |\n\n```sql\nSELECT *\nFROM   급여      -- 컬럼: 부서, 직급, 연봉\n( 빈칸 );\n```","x":"직급을 열로 전개하므로 PIVOT(SUM(연봉) FOR 직급 IN (...))이다.","o":["UNPIVOT (SUM(연봉) FOR 직급 IN ('사원','대리','팀장','부장'))","PIVOT (직급 FOR SUM(연봉) IN ('사원','대리','팀장','부장'))","PIVOT (SUM(연봉) FOR 부서 IN ('인사팀','IT팀','행정팀'))","PIVOT (SUM(연봉) FOR 직급 IN ('사원','대리','팀장','부장'))"],"a":3},{"id":"60-14","r":60,"n":14,"s":2,"b":"급여가 각각 1000, 2000, 3000인 세 행이 있는 사원 테이블에 대해 다음 SQL을 실행했을 때, 결과 컬럼에 나타나는 값을 위에서부터 순서대로 나열한 것은?\n```sql\nSELECT 급여,\n       FIRST_VALUE(급여) OVER (ORDER BY 급여) AS 결과\nFROM   사원;\n```","x":"ORDER BY 급여의 첫 값은 1000이므로 모든 행에 1000이 나온다.","o":["1000, 1000, 1000","1000, 2000, 3000","3000, 2000, 1000","3000, 3000, 3000"],"a":0},{"id":"60-15","r":60,"n":15,"s":2,"b":"다음 SQL의 WHERE 절과 논리적으로 동일한 조건은?\n```sql\nSELECT *\nFROM   회원\nWHERE  (사번, 회원번호) IN ((10005, 2003), (10007, 2005));\n```","x":"다중 컬럼 IN은 각 쌍이 동시에 같은 경우를 OR로 묶은 것과 같다.","o":["(사번=10005 OR 회원번호=2003) AND (사번=10007 OR 회원번호=2005)","(사번=10005 AND 회원번호=2003) OR (사번=10007 AND 회원번호=2005)","사번 IN (10005, 10007) OR 회원번호 IN (2003, 2005)","(사번=10005 AND 사번=10007) OR (회원번호=2003 AND 회원번호=2005)"],"a":1},{"id":"60-16","r":60,"n":16,"s":2,"b":"8명의 사원을 급여 내림차순으로 정렬한 뒤 다음 SQL을 실행했다. 그룹 컬럼에 부여되는 값을 위에서부터 순서대로 나열한 것은?\n```sql\nSELECT 이름,\n       NTILE(3) OVER (ORDER BY 급여 DESC) AS 그룹\nFROM   사원;\n```","x":"8행을 3그룹으로 나누면 3, 3, 2개씩이다.","o":["1,1,2,2,3,3,3,3","1,2,3,1,2,3,1,2","1,1,1,2,2,2,3,3","1,1,1,1,2,2,3,3"],"a":2},{"id":"60-17","r":60,"n":17,"s":2,"b":"두 테이블 부서와 사원을 결합하되, 매칭되지 않는 부서(사원이 한 명도 없는 부서)와 부서가 배정되지 않은 사원까지 양쪽 미매칭 행을 모두 결과에 포함시키려고 한다. 가장 적절한 방법은?","x":"양쪽 미매칭 행을 모두 포함하는 것은 FULL OUTER JOIN이다.","o":["NVL 함수를 사용한 CROSS JOIN","NVL 함수를 사용한 INNER JOIN","FULL OUTER JOIN","UNION"],"a":2},{"id":"60-18","r":60,"n":18,"s":2,"b":"사용자 R1이 자신의 스키마에 테이블 주문을 생성해 소유하고 있다. 사용자 R2가 SELECT * FROM R1.주문;을 실행하자 조회 권한이 없어 오류가 발생했다. R2가 해당 테이블을 조회할 수 있도록 하는 가장 올바른 방법은?","x":"소유자 R1이 R2에게 SELECT 권한을 GRANT해야 한다.","o":["R2가 CONNECT 롤을 다시 부여받는다","R1이 GRANT SELECT ON 주문 TO R2;를 실행한다","R2가 자신의 스키마에 동일한 이름의 테이블을 새로 만든다","R2가 COMMIT을 실행한 뒤 다시 조회한다"],"a":1},{"id":"60-19","r":60,"n":19,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n```sql\nSELECT REGEXP_REPLACE('2026/02/25',\n         '([0-9]{4})/([0-9]{2})/([0-9]{2})',\n         '\\3/\\2/\\1')\nFROM   DUAL;\n```","x":"역참조 \\3/\\2/\\1로 일/월/연 순서가 되어 25/02/2026이다.","o":["2026/02/25","25/02/2026","02/25/2026","2026/25/02"],"a":1},{"id":"60-20","r":60,"n":20,"s":2,"b":"다음 실적 테이블에 대해 SELECT SUM(1분기), SUM(2분기) FROM 실적;을 실행했을 때의 결과로 옳은 것은?\n실적(사원, 1분기, 2분기): (A, 4, 10), (B, NULL, 8), (C, NULL, 5)","x":"SUM은 NULL을 제외하므로 1분기 4, 2분기 23이다.","o":["4, 23","NULL, 23","4, NULL","NULL, NULL"],"a":0},{"id":"60-21","r":60,"n":21,"s":2,"b":"Oracle에서 실행할 때, 다음 중 조회되는 행 수가 나머지 셋과 다른 것은? (사원 테이블에는 10건의 데이터가 있다.)","x":"ROWNUM IN (1,2)는 2행, 나머지는 모두 1행이다.","o":["SELECT * FROM 사원 WHERE ROWNUM IN (1, 2);","SELECT * FROM 사원 WHERE ROWNUM = 1;","SELECT * FROM 사원 WHERE ROWNUM \u003c= 1;","SELECT * FROM 사원 WHERE ROWNUM \u003c 2;"],"a":0},{"id":"60-22","r":60,"n":22,"s":2,"b":"사원 테이블에 데이터가 있더라도 WHERE 1=2 조건으로 인해 대상 행이 하나도 없을 때, 다음 각 SQL의 실행 결과 중 나머지 셋과 다른 값을 반환하는 것은?","x":"대상 행이 없으면 COUNT(*)는 0, 나머지 집계 함수는 NULL이다.","o":["SELECT SUM(급여) FROM 사원 WHERE 1=2;","SELECT AVG(급여) FROM 사원 WHERE 1=2;","SELECT MAX(급여) FROM 사원 WHERE 1=2;","SELECT COUNT(*) FROM 사원 WHERE 1=2;"],"a":3},{"id":"60-23","r":60,"n":23,"s":2,"b":"부서 테이블의 모든 행을 보존하면서 사원 테이블과 조인하려고 한다. 다음 중 조인 결과가 나머지 셋과 다른 것은?","x":"(+)가 부서 쪽에 붙으면 사원 기준 외부 조인이 되어 부서 전체가 보존되지 않는다.","o":["SELECT * FROM 부서 D LEFT OUTER JOIN 사원 E ON D.부서번호 = E.부서번호;","SELECT * FROM 부서 D, 사원 E WHERE D.부서번호 = E.부서번호(+);","SELECT * FROM 부서 D, 사원 E WHERE D.부서번호(+) = E.부서번호;","SELECT * FROM 사원 E RIGHT OUTER JOIN 부서 D ON E.부서번호 = D.부서번호;"],"a":2},{"id":"60-24","r":60,"n":24,"s":2,"b":"다음 PIVOT 질의에 대한 설명으로 옳은 것은?\n```sql\nSELECT *\nFROM (SELECT 부서, 직급 FROM 사원)\nPIVOT (COUNT(*) FOR 직급 IN ('사원' AS 사원, '대리' AS 대리, '과장' AS 과장));\n```","x":"PIVOT은 부서별로 묶고 직급 값을 열로 펼쳐 인원수를 센다.","o":["부서별로 행이 묶이고 직급 값이 열로 전개되어 각 직급 인원수가 표시된다.","PIVOT 절에는 집계함수 없이 전개할 컬럼만 나열한다.","IN 절에 명시하지 않은 직급도 자동으로 결과 열에 나타난다.","부서별 집계를 위해 반드시 GROUP BY 절을 함께 작성해야 한다."],"a":0},{"id":"60-25","r":60,"n":25,"s":2,"b":"다음 SQL에서 서브쿼리가 두 건 이상을 반환하여 오류(ORA-01427)가 나는 일이 없도록 보장하려면, 부서 테이블의 부서명 컬럼에 어떤 제약조건이 필요한가?\n```sql\nSELECT 사원명\nFROM 사원\nWHERE 부서번호 = (SELECT 부서번호 FROM 부서 WHERE 부서명 = '영업');\n```","x":"부서명이 유일해야 서브쿼리가 한 행만 반환하므로 UNIQUE 제약이 필요하다.","o":["CHECK 제약조건","UNIQUE 제약조건","NOT NULL 제약조건","FOREIGN KEY 제약조건"],"a":1},{"id":"60-26","r":60,"n":26,"s":2,"b":"다음 SQL이 급여 오름차순으로 첫 행부터 현재 행까지의 급여 누적합계를 계산하도록 (㉠)에 들어갈 윈도우 프레임 절로 옳은 것은?\n```sql\nSELECT 급여, SUM(급여) OVER (ORDER BY 급여 (㉠)) AS 누적합계\nFROM 사원;\n```","x":"ROWS UNBOUNDED PRECEDING은 처음부터 현재 행까지이므로 누적 합계가 된다.","o":["RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING","ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING","ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING","ROWS UNBOUNDED PRECEDING"],"a":3},{"id":"60-27","r":60,"n":27,"s":2,"b":"트랜잭션의 특성(ACID) 중 고립성(Isolation)에 대한 설명으로 옳은 것은?","x":"고립성은 실행 중인 트랜잭션이 다른 트랜잭션의 영향을 받지 않는 것이다.","o":["실행 중인 트랜잭션은 다른 트랜잭션의 연산에 영향을 받지 않는다.","트랜잭션의 연산은 전부 반영되거나 전혀 반영되지 않는다.","트랜잭션이 성공적으로 완료되면 그 결과는 영구적으로 반영된다.","트랜잭션 수행 전후에 데이터베이스는 일관된 상태를 유지한다."],"a":0},{"id":"60-28","r":60,"n":28,"s":2,"b":"기본키(Primary Key) 제약조건이 보장하는 특성으로 옳은 것은?","x":"PK는 NOT NULL이면서 UNIQUE다.","o":["NULL 값을 허용하며 컬럼 값은 유일(UNIQUE)해야 한다.","NULL 값을 허용하며 값의 중복도 허용된다.","NULL 값을 허용하지 않으며(NOT NULL) 값은 유일(UNIQUE)해야 한다.","NULL 값을 허용하지 않으나(NOT NULL) 값의 중복은 허용된다."],"a":2},{"id":"60-29","r":60,"n":29,"s":2,"b":"사원 테이블은 사원번호와 관리자번호(직속 상사의 사원번호)를 가진다. 최상위 관리자부터 하위 사원 방향으로 조직 계층을 전개하려 할 때, 올바른 계층 질의 절은? (START WITH 관리자번호 IS NULL을 사용한다고 가정)","x":"부모의 사원번호(PRIOR)가 자식의 관리자번호와 같아야 하위 방향으로 전개된다.","o":["CONNECT BY 사원번호 = PRIOR 관리자번호","CONNECT BY PRIOR 사원번호 = 관리자번호","CONNECT BY PRIOR 관리자번호 = 사원번호","CONNECT BY 관리자번호 = 사원번호"],"a":1},{"id":"60-30","r":60,"n":30,"s":2,"b":"사원 테이블(사원번호, 관리자번호, 직급)에 대한 다음 계층 질의 중, 계층(트리)이 정상적으로 전개되지 않는 것은?","x":"PRIOR가 없으면 부모-자식 연결이 정의되지 않아 계층이 전개되지 않는다.","o":["SELECT * FROM 사원 START WITH 관리자번호 IS NULL CONNECT BY PRIOR 사원번호 = 관리자번호;","SELECT * FROM 사원 START WITH 사원번호 = 1000 CONNECT BY PRIOR 사원번호 = 관리자번호;","SELECT * FROM 사원 START WITH 관리자번호 IS NULL CONNECT BY PRIOR 사원번호 = 관리자번호 AND 직급 \u003c> '인턴';","SELECT * FROM 사원 START WITH 관리자번호 IS NULL CONNECT BY 사원번호 = 관리자번호;"],"a":3},{"id":"60-31","r":60,"n":31,"s":2,"b":"다음 [올림픽메달] 테이블에 대해 아래 SQL을 실행한 결과로 옳은 것은?\n\n| 선수 | 국가 | 메달 |\n|---|---|---|\n| 김하나 | KOR | 골드 |\n| 이두리 | KOR | 실버 |\n| 박세찬 | KOR | 실버 |\n| 정오름 | USA | 골드 |\n| 최네오 | USA | 브론즈 |\n\n```sql\nSELECT 메달, COUNT(*) AS 수\nFROM   올림픽메달\nWHERE  국가 = 'KOR'\nGROUP BY 메달;\n```","x":"KOR만 그룹으로 묶으면 골드 1, 실버 2다.","o":["골드 1, 실버 2, 브론즈 1","골드 1, 실버 2","골드 1, 실버 1, 브론즈 1","실버 2, 브론즈 1"],"a":1},{"id":"60-32","r":60,"n":32,"s":2,"b":"이미 데이터가 저장되어 있는 [사원] 테이블의 현재 컬럼 정의가 아래와 같다. 각 ALTER 문을 실행할 때 오류가 발생하지 않는 것은? (Oracle 기준)\n> 사번 NUMBER(6), 급여 NUMBER(8,2), 이름 VARCHAR2(20), 입사일 DATE\n> 이름 컬럼에는 최대 15자 문자열이, 급여에는 정수부 6자리 값이 실제로 들어 있다.","x":"데이터가 있으면 크기를 줄이거나 타입을 바꿀 수 없다. 정밀도를 늘리는 것만 가능하다.","o":["ALTER TABLE 사원 MODIFY 급여 NUMBER(4,2);","ALTER TABLE 사원 MODIFY 이름 VARCHAR2(10);","ALTER TABLE 사원 MODIFY 사번 DATE;","ALTER TABLE 사원 MODIFY 급여 NUMBER(10,2);"],"a":3},{"id":"60-33","r":60,"n":33,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행한 결과로 옳은 것은?\n- 상품.상품ID: 1, 2, 3\n- 주문.상품ID: 3\n```sql\nSELECT 상품ID\nFROM   상품 A\nWHERE  NOT EXISTS (\n         SELECT 1 FROM 주문 B WHERE B.상품ID = A.상품ID\n       );\n```","x":"주문에 없는 상품ID 1, 2가 조회된다.","o":["1","1, 2","(공집합)","오류 발생"],"a":1},{"id":"60-34","r":60,"n":34,"s":2,"b":"다음 집합 연산자 중, 결과 집합에서 중복 행을 제거하지 않고 그대로 반환하는 것은?","x":"UNION ALL은 중복을 제거하지 않는다.","o":["UNION","UNION ALL","INTERSECT","EXCEPT (MINUS)"],"a":1},{"id":"60-35","r":60,"n":35,"s":2,"b":"다음 [이벤트] 테이블에 대해 아래 SQL을 실행할 때 반환되는 행의 개수는?\n이벤트.일자: 2024-01-15, 2024-03-20, 2024-05-10\n```sql\nSELECT EXTRACT(MONTH FROM 일자) FROM 이벤트\nUNION\nSELECT EXTRACT(YEAR  FROM 일자) FROM 이벤트;\n```","x":"월 1, 3, 5와 연도 2024가 합쳐져 서로 다른 값 4개다.","o":["1개","2개","3개","4개"],"a":3},{"id":"60-36","r":60,"n":36,"s":2,"b":"다음 중 SQL 명령어에 대한 설명으로 옳지 않은 것은?","x":"TRUNCATE는 DDL이며 WHERE 조건을 쓸 수 없다.","o":["TRUNCATE TABLE 은 WHERE 조건으로 특정 행만 지울 수 있는 DML 명령어이다.","DELETE 문은 WHERE 절을 사용하여 테이블의 일부 행만 삭제할 수 있다.","TRUNCATE TABLE 은 테이블의 모든 행을 삭제하고 저장 공간을 초기화하며, 일반적으로 롤백할 수 없다.","DROP TABLE 은 테이블의 데이터뿐 아니라 구조(정의)까지 제거한다."],"a":0},{"id":"60-37","r":60,"n":37,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 실행한 결과로 옳은 것은?\n- 테이블1(컬럼1, 컬럼2): (1, 10), (2, 20), (3, 30), (4, 40)\n- 테이블2.컬럼1: 1, 2, 3, 4, 5\n```sql\nSELECT SUM(A.컬럼2)\nFROM   테이블1 A\nINNER JOIN 테이블2 B ON A.컬럼1 = B.컬럼1;\n```","x":"조인되는 1~4행의 컬럼2 합은 10+20+30+40 = 100이다.","o":["120","NULL","100","140"],"a":2},{"id":"60-38","r":60,"n":38,"s":2,"b":"다음 두 테이블을 조인 조건 없이 FROM 절에 함께 기술하여 조회할 때(카티션 곱), 반환되는 행의 개수는?\n- 테이블X.값: A, B\n- 테이블Y.값: 1, 2\n```sql\nSELECT *\nFROM   테이블X, 테이블Y;\n```","x":"2 × 2 = 4행이다.","o":["2개","0개","4개","6개"],"a":2},{"id":"60-39","r":60,"n":39,"s":2,"b":"다음 MERGE 문을 실행한 후 [대상] 테이블의 상태로 옳은 것은?\n- 대상(실행 전)(ID, 값): (1, 50), (2, 50)\n- 원본(ID, 값): (1, 100), (2, 100), (3, 100)\n```sql\nMERGE INTO 대상 T\nUSING 원본 S\nON (T.ID = S.ID)\nWHEN MATCHED THEN\n  UPDATE SET T.값 = S.값\nWHEN NOT MATCHED THEN\n  INSERT (ID, 값) VALUES (S.ID, S.값);\n```","x":"1, 2는 100으로 갱신되고 3은 새로 삽입된다.","o":["ID1=100, ID2=100, ID3=100 (3행)","ID1=50, ID2=50, ID3=100 (3행)","ID1=100, ID2=100 (2행)","ID1=50, ID2=50 (2행)"],"a":0},{"id":"60-40","r":60,"n":40,"s":2,"b":"다음 SQL 중 실행 시 오류가 발생하는 것은? (Oracle 기준, [판매] 테이블에는 제품명·단가·수량 컬럼이 있다)","x":"WHERE 절은 SELECT보다 먼저 평가되므로 SELECT 별칭을 쓸 수 없다.","o":["SELECT 제품명, 단가 * 수량 AS 제품코드 FROM 판매 ORDER BY 제품코드;","SELECT 제품명, 단가 FROM 판매 ORDER BY 2;","SELECT 제품명, SUM(수량) AS 총수량 FROM 판매 GROUP BY 제품명;","SELECT 제품명, 단가 * 수량 AS 제품코드 FROM 판매 WHERE 제품코드 > 1000;"],"a":3},{"id":"60-41","r":60,"n":41,"s":2,"b":"다음 중 연산 결과의 성격이 나머지 셋과 다른 하나는?","x":"1 > NULL은 조건식으로 UNKNOWN(논리값)이 되고, 나머지는 산술 결과 NULL 값이다.","o":["WHERE 1 > NULL","NULL + 1","NULL * 1","NULL * NULL"],"a":0},{"id":"60-42","r":60,"n":42,"s":2,"b":"다음 SELECT 문의 결과 값이 나머지 셋과 다른 하나는?","x":"나머지는 모두 NULL을 반환하지만 'X'만 실제 값을 반환한다.","o":["SELECT 1 + NULL","SELECT 1 * NULL","SELECT 'X'","SELECT NULL, NULL"],"a":2},{"id":"60-43","r":60,"n":43,"s":2,"b":"다음 SQL을 순서대로 실행했을 때, 마지막 SELECT의 결과 값으로 옳은 것은?\n```sql\nCREATE TABLE 상품 (\n  상품번호 INT IDENTITY(1,1),\n  수량     INT CHECK (수량 > 0)\n);\nINSERT INTO 상품 (수량) VALUES (-1);\nINSERT INTO 상품 (수량) VALUES (0);\nINSERT INTO 상품 (수량) VALUES (1);\n\nSELECT COUNT(*) FROM 상품;\n```","x":"CHECK(수량 > 0)로 -1, 0은 실패하고 1만 입력되어 1건이다.","o":["0","1","2","3"],"a":1},{"id":"60-44","r":60,"n":44,"s":2,"b":"뷰 사원뷰가 테이블 사원을 참조하고 있다. 이 상태에서 다음 문장을 실행할 때 실제로 삭제되는 대상으로 옳은 것은?\n```sql\nDROP TABLE 사원 RESTRICT;\n```","x":"RESTRICT는 참조하는 객체가 있으면 삭제를 거부하므로 아무것도 삭제되지 않는다.","o":["아무 것도 삭제되지 않는다","사원 테이블만 삭제된다","사원 테이블과 사원뷰가 함께 삭제된다","사원뷰만 삭제된다"],"a":0},{"id":"60-45","r":60,"n":45,"s":2,"b":"함수 NVL(수당, 급여)에 대한 설명으로 옳지 않은 것은?","x":"NVL은 첫 인자가 NULL이면 두 번째 인자를 반환할 뿐 더하지 않는다.","o":["수당이 NULL이면 급여를 반환한다","수당이 NULL이 아니면 수당 값을 그대로 반환한다","첫 번째 인자와 두 번째 인자의 데이터 타입은 서로 호환되어야 한다","수당과 급여를 더한 합계를 반환한다"],"a":3},{"id":"60-46","r":60,"n":46,"s":2,"b":"급여가 높은 '상위 3개 급여 수준'을 뽑되, 동일 급여자는 같은 순위로 모두 포함하고 순위를 건너뛰지 않아야 한다. 다음 빈칸에 들어갈 함수로 가장 적절한 것은?\n```sql\nSELECT 이름, 급여\nFROM (\n  SELECT 이름, 급여,\n         (   ) OVER (ORDER BY 급여 DESC) AS 순위\n  FROM 사원\n)\nWHERE 순위 \u003c= 3;\n```","x":"동점에 같은 순위를 주고 순위를 건너뛰지 않는 것은 DENSE_RANK다.","o":["RANK()","DENSE_RANK()","ROW_NUMBER()","NTILE(3)"],"a":1},{"id":"60-47","r":60,"n":47,"s":2,"b":"부서 테이블에 존재하지 않는 부서번호를 가지거나 부서번호가 NULL인, 즉 '어느 부서에도 속하지 않는' 사원을 모두 조회하려 한다. 가장 적절한 SQL은?","x":"LEFT OUTER JOIN 후 부서 쪽이 NULL인 행이 소속 부서가 없는 사원이다.","o":["SELECT * FROM 사원 WHERE 부서번호 = NULL","SELECT s.* FROM 사원 s INNER JOIN 부서 d ON s.부서번호 = d.부서번호 WHERE d.부서번호 IS NULL","SELECT * FROM 사원 WHERE 부서번호 IN (SELECT 부서번호 FROM 부서)","SELECT s.* FROM 사원 s LEFT OUTER JOIN 부서 d ON s.부서번호 = d.부서번호 WHERE d.부서번호 IS NULL"],"a":3},{"id":"60-48","r":60,"n":48,"s":2,"b":"GROUP BY ROLLUP(부서, 직급)을 수행할 때 생성되는 집계(그룹핑) 조합을 (부서, 직급) 형태로 나타냈다. 이 중 ROLLUP의 결과에 포함되지 않는 조합은? (여기서 a=특정 부서, b=특정 직급, NULL=소계 표시)","x":"ROLLUP(부서, 직급)은 (부서,직급), (부서), ()만 만든다. (NULL, 직급)은 CUBE에서만 나온다.","o":["(a, b)","(a, NULL)","(NULL, b)","(NULL, NULL)"],"a":2},{"id":"60-49","r":60,"n":49,"s":2,"b":"특정 컬럼에 입력되는 값이 지정한 조건식(범위·목록 등)을 만족하도록 강제하여, 조건을 위반하는 값의 삽입·수정을 거부하는 제약조건은?","x":"조건식을 만족하는 값만 허용하는 제약은 CHECK다.","o":["NOT NULL","CHECK","PRIMARY KEY","FOREIGN KEY"],"a":1},{"id":"60-50","r":60,"n":50,"s":2,"b":"다음 SQL의 결과가 의미하는 대상으로 옳은 것은?\n```sql\nSELECT 고객번호\nFROM 주문\nGROUP BY 고객번호\nHAVING MAX(수량) > 10;\n```","x":"MAX(수량) > 10이면 10을 넘는 주문이 한 번이라도 있다는 뜻이다.","o":["주문 수량의 총합이 10을 초과한 고객","주문 횟수가 10회를 초과한 고객","모든 주문의 수량이 10을 초과한 고객","주문 수량이 10을 초과한 주문을 한 번이라도 한 고객"],"a":3},{"id":"61-01","r":61,"n":1,"s":1,"b":"다음 중 외부 스키마에 대한 설명으로 옳지 않은 것은?","x":"전체 저장 구조와 물리적 저장 방법을 정의하는 것은 내부 스키마다.","o":["사용자나 응용프로그램 개발자의 관점에서 필요한 데이터베이스의 논리적 구조이다.","하나의 데이터베이스에 대해 여러 개의 외부 스키마가 존재할 수 있다.","데이터베이스 전체의 저장 구조를 정의하며 물리적 저장 방법을 포함한다.","응용프로그램이 필요로 하는 데이터만 정의하여 접근 범위를 제한할 수 있다."],"a":2},{"id":"61-02","r":61,"n":2,"s":1,"b":"다음 설명이 나타내는 것으로 가장 적절한 것은?\n> 속성에 대한 타입이나 제약 사항으로, 해당 속성이 가질 수 있는 값의 범위를 의미한다.","x":"속성이 가질 수 있는 값의 범위는 도메인이다.","o":["도메인","식별자","엔터티","인스턴스"],"a":0},{"id":"61-03","r":61,"n":3,"s":1,"b":"엔터티를 유형/무형 엔터티 기준으로 분류할 때, 다음 중 이 분류 기준에 해당하지 않는 것은?","x":"유형/무형 기준 분류는 유형·개념·사건 엔터티다. 행위 엔터티는 발생 시점 기준이다.","o":["유형 엔터티","개념 엔터티","사건 엔터티","행위 엔터티"],"a":3},{"id":"61-04","r":61,"n":4,"s":1,"b":"다음 중 비식별 관계로의 전환을 고려해야 하는 상황으로 가장 적절한 것은?","x":"식별자 상속이 이어져 PK가 지나치게 커지면 비식별 관계로 끊어 단순화를 고려한다.","o":["자식 엔터티가 부모 엔터티에 강하게 의존하며 부모 없이는 존재 의미가 없는 경우","상속받은 식별자가 계속 연결되어 주식별자의 구성 속성 수가 많아지고 복잡해지는 경우","자식 엔터티의 등록번호를 반드시 부모 식별자와 연계해서 관리해야 하는 경우","이력 관리를 위해 부모의 식별자를 자식이 반드시 포함해야 하는 경우"],"a":1},{"id":"61-05","r":61,"n":5,"s":1,"b":"다음 중 관계선택사양에 대한 설명으로 옳은 것을 모두 고른 것은?\n가) 관계 참여가 필수인지 선택인지를 나타낸다.\n나) 조직 내 업무 규칙에 따라 결정되어야 한다.\n다) 두 개의 엔터티 간 관계에서 참여자의 수를 표현한다.","x":"관계선택사양은 참여의 필수/선택을 나타내며 업무 규칙으로 정한다. 참여자 수는 관계차수다.","o":["가","가, 나","나, 다","가, 나, 다"],"a":1},{"id":"61-06","r":61,"n":6,"s":1,"b":"데이터 모델링의 관계에 대한 설명으로 가장 적절하지 않은 것은?","x":"연관 관계는 멤버 변수로, 의존 관계는 오퍼레이션의 파라미터로 이용한다. 설명이 반대다.","o":["관계는 존재에 의한 관계와 행위에 의한 관계로 구분될 수 있으나, ERD에서는 관계를 연결할 때 존재와 행위를 구분하지 않고 단일화된 표기법을 사용한다.","UML은 클래스 다이어그램의 관계 중 연관 관계와 의존 관계가 있으며, 이는 실선과 점선의 표기법으로 다르게 표현된다.","연관 관계는 항상 이용하는 관계로 존재적 관계에 해당하고, 의존 관계는 상대방 클래스의 행위에 의해 관계가 형성되는 행위적 관계에 해당한다.","연관 관계는 오퍼레이션에서 파라미터 등으로 이용할 수 있고, 의존 관계는 소스 코드에서 멤버 변수로 선언하여 사용할 수 있다."],"a":3},{"id":"61-07","r":61,"n":7,"s":1,"b":"다음 [고객] 엔터티의 속성에 대한 설명으로 옳지 않은 것은?\n\n| 속성 | 특징 |\n|---|---|\n| 고객번호 | 식별 가능, NOT NULL |\n| 주민등록번호 | 식별 가능, NOT NULL |\n| 이메일 | 식별 가능, NULL 허용 |\n| 고객명 | 중복 가능, NULL 허용 |","x":"이메일은 NULL을 허용하므로 존재성을 만족하지 못해 주식별자가 될 수 없다.","o":["고객번호는 유일성과 최소성을 만족하므로 주식별자(PK)로 사용할 수 있다.","주민등록번호는 유일성과 최소성을 만족하므로 주식별자(PK)로 사용할 수 있다.","이메일은 유일성을 만족하므로 주식별자(PK)로 사용할 수 있다.","고객명은 중복과 NULL이 허용되므로 식별자로 사용할 수 없다."],"a":2},{"id":"61-08","r":61,"n":8,"s":1,"b":"다음 테이블 구조가 위배하고 있는 정규형은?\n\n| 주문ID (PK) | 상품ID (PK) | 주문수량 | 주문금액 | 할인쿠폰코드 | 할인쿠폰명 |\n|---|---|---|---|---|---|\n| 202608001 | P12345 | 2 | 20000 | C10 | 첫구매할인 |\n| 202608001 | P23456 | 1 | 15000 | C20 | 신학기할인 |\n| 202608002 | P97589 | 3 | 30000 | C30 | 여름세일 |","x":"할인쿠폰명은 일반 속성인 할인쿠폰코드에 종속되는 이행 종속이므로 제3정규형 위배다.","o":["제1정규형 위배","제2정규형 위배","제3정규형 위배","위배하고 있지 않음"],"a":2},{"id":"61-09","r":61,"n":9,"s":1,"b":"다음 중 배타적 관계에 대한 설명으로 가장 적절한 것은?","x":"배타적 관계는 여러 엔터티 중 하나와만 관계를 맺는 것이다.","o":["하나의 엔터티가 여러 자식 엔터티와 동시에 관계를 맺을 수 있음을 의미한다.","하나의 엔터티가 여러 개의 다른 엔터티 중 하나와만 관계를 맺을 수 있음을 의미한다.","두 엔터티가 반드시 일대일 관계를 맺어야 함을 의미한다.","자식 엔터티가 부모 엔터티 없이 독립적으로 존재 가능함을 의미한다."],"a":1},{"id":"61-10","r":61,"n":10,"s":1,"b":"트랜잭션의 특징 중 원자성에 해당하는 것으로 가장 적절한 것은?","x":"원자성은 모두 반영되거나 하나도 반영되지 않는 All or Nothing 성질이다.","o":["트랜잭션에 포함된 연산은 논리적으로 하나로 묶여 수행되며, 일부 연산만 반영되는 일이 없어야 한다.","트랜잭션 수행 전과 후에 데이터베이스는 항상 일관된 상태를 유지해야 한다.","동시에 여러 트랜잭션이 수행되어도 서로의 연산 결과에 영향을 주지 않아야 한다.","트랜잭션이 성공적으로 완료되면 그 결과는 영구적으로 반영되어야 한다."],"a":0},{"id":"61-11","r":61,"n":11,"s":2,"b":"다음 중 데이터베이스에서 데이터를 저장하는 기본 단위로 가장 적절한 것은?","x":"관계형 DB에서 데이터를 저장하는 기본 단위는 테이블이다.","o":["테이블","뷰","인덱스","시퀀스"],"a":0},{"id":"61-12","r":61,"n":12,"s":2,"b":"다음 SQL 실행 결과로 가장 적절한 것은? (결과는 A, B 순)\nDEPT.DEPT_ID: 1, 1, NULL, 2, NULL, 2, 3, 3, NULL, 3\n*(SQL 원문 누락)*","x":"원문 SQL 누락. COUNT(DEPT_ID)는 NULL 3건을 빼고 7, COUNT(*)는 10으로 추정했다.","o":["7, 7","10, 10","7, 10","10, 7"],"a":2,"g":1,"m":1},{"id":"61-13","r":61,"n":13,"s":2,"b":"다음 SQL 실행 결과로 가장 적절한 것은?\n- EMP(EMP_NAME, DEPT_ID): (KING, 20), (ALLEN, 10), (JONES, NULL), (CLARK, NULL)\n- DEPT(DEPT_ID, DEPT_NAME, LOCATION): (10, ACCOUNTING, NEW YORK), (20, RESEARCH, DALLAS), (30, SALES, CHICAGO)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 내부 조인이면 부서번호가 있는 KING, ALLEN만 나온다고 추정했다.","o":["ALLEN, JONES, CLARK","KING, ALLEN, CLARK","KING, ALLEN","ALLEN"],"a":2,"g":1,"m":1},{"id":"61-14","r":61,"n":14,"s":2,"b":"다음 SQL의 결과 건수로 맞는 것을 고르시오.\nTBL.COL: 100, 200, 300\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 3건이 모두 조회된다고 추정했다.","o":["1","2","3","오류가 발생한다."],"a":2,"g":1,"m":1},{"id":"61-15","r":61,"n":15,"s":2,"b":"다음 SQL 실행 결과로 가장 적절한 것은?\nTBL(A, B): (10, NULL), (10, NULL), (20, NULL), (20, 30), (20, 40), (30, NULL)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. A별 COUNT 등으로 2, 5, 1이 나온다고 추정했다.","o":["NULL, 5, NULL","2, 5, 1","8","5"],"a":1,"g":1,"m":1},{"id":"61-16","r":61,"n":16,"s":2,"b":"다음 SQL 실행 결과로 가장 적절한 것은?\n- TBL1.COL1: 10, 12, 15, 22, 28, 30, 31\n- TBL2.COL2: 15, 30\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. TBL2의 최솟값~최댓값(15~30) 범위의 값을 고르는 쿼리로 추정했다.","o":["10, 12, 15","15, 22, 28, 30","10, 12, 15, 22, 28, 30","10, 12, 15, 22, 28, 30, 31"],"a":1,"g":1,"m":1},{"id":"61-17","r":61,"n":17,"s":2,"b":"다음 중 순수 관계 연산자에 대한 설명으로 옳지 않은 것은?","x":"관계 연산 SELECT는 SQL의 WHERE 절에, PROJECT가 SELECT 절에 해당한다.","o":["관계형 데이터베이스에서 테이블(릴레이션)의 데이터를 처리하기 위해 고안된 관계 연산자이다.","PROJECT - 특정 속성(컬럼)만 추출하는 연산자이다.","DIVIDE - 특정 조건을 모두 만족하는 대상을 찾는 연산이며 SQL에서는 직접 지원하지 않아 NOT EXISTS 등으로 표현한다.","SELECT - SQL의 SELECT 절에 해당한다."],"a":3},{"id":"61-18","r":61,"n":18,"s":2,"b":"다음 TBL의 COL 값 중 LIKE '%A_C%' 패턴에 매칭되는 문자열은 몇 건인가?\nTBL.COL: A1C, A-CD, A_C, AB_C, ABC","x":"'_'는 임의의 한 글자이므로 A1C, A-CD, A_C, ABC 4건이 매칭된다. AB_C는 A 다음 두 글자 뒤에 C가 온다.","o":["2개","3개","4개","5개"],"a":2},{"id":"61-19","r":61,"n":19,"s":2,"b":"다음 SQL 실행 결과로 가장 적절한 것은?\nSALES(ID, AMOUNT): (1000, 40000), (2000, 30000), (3000, 35000), (4000, 45000), (5000, 50000)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 금액 상위 3명(5000, 4000, 1000)을 내림차순으로 조회한다고 추정했다.","o":["1000","5000, 4000, 1000","2000, 3000, 1000","5000"],"a":1,"g":1,"m":1},{"id":"61-20","r":61,"n":20,"s":2,"b":"다음 SQL과 동일한 결과를 출력하는 SQL은 무엇인가?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 주문일자별 상세와 주문일자 소계를 만드는 구문으로 추정했다.","o":["SELECT 주문일자, 상품코드, COUNT(*) FROM 주문 GROUP BY 주문일자, ROLLUP(상품코드);","SELECT 주문일자, 상품코드, COUNT(*) FROM 주문 GROUP BY ROLLUP(주문일자, 상품코드);","SELECT DISTINCT 주문일자, 상품코드, COUNT(*) FROM 주문 GROUP BY ROLLUP((주문일자, 상품코드), NULL);","SELECT 주문일자, 상품코드, COUNT(*) FROM 주문 GROUP BY GROUPING SETS((주문일자, 상품코드));"],"a":0,"g":1,"m":1},{"id":"61-21","r":61,"n":21,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["abcd","defg","d","abc"],"a":0,"g":1,"m":1},{"id":"61-22","r":61,"n":22,"s":2,"b":"다음 SQL의 빈칸에 알맞은 함수는 무엇인가?\nTBL(NAME, SCORE): (KIM, 90), (LEE, 90), (PARK, 85), (CHOI, 80)\n\n실행 결과\n\n| NAME | SCORE | RNK |\n|---|---|---|\n| KIM | 90 | 1 |\n| LEE | 90 | 1 |\n| PARK | 85 | 3 |\n| CHOI | 80 | 4 |\n\n*(SQL 원문 누락)*","x":"같은 점수에 같은 순위를 주고 다음 순위를 건너뛰는(1,1,3,4) 함수는 RANK다.","o":["RANK","DENSE_RANK","ROW_NUMBER","ROWNUM"],"a":0,"m":1},{"id":"61-23","r":61,"n":23,"s":2,"b":"다음 중 테이블명으로 가장 적절한 것은 무엇인가?","x":"테이블명은 문자로 시작하고 영문·숫자·_·$·#만 쓸 수 있다. 예약어와 하이픈은 쓸 수 없다.","o":["201504table_TB","table","test-n202605","tbl_test260531#"],"a":3},{"id":"61-24","r":61,"n":24,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\nEMP(EMP_NAME, DEPT_ID, SAL): (SMITH, 10, 100), (ALLEN, 10, 200), (WARD, 20, 300), (JONES, 30, 400), (MARTIN, 30, 100)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. PIVOT으로 부서를 A·B·C 별칭 열로 전개해 SAL 합계(300, 300, 500)를 구한다고 추정했다.","o":["컬럼명 10, 20, 30 / 값 300, 300, 500","컬럼명 10, 20, 30 / 값 200, 300, 400","컬럼명 A, B, C / 값 300, 300, 500","컬럼명 A, B, C / 값 200, 300, 400"],"a":2,"g":1,"m":1},{"id":"61-25","r":61,"n":25,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\n- TBL1(COL, COL1): (2, NULL), (3, NULL), (4, 40), (5, 40)\n- TBL2(COL, COL2): (1, 30), (2, 40), (3, 40), (4, NULL)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["20, 20","40, 20","40, 40","20, 40"],"a":1,"g":1,"m":1},{"id":"61-26","r":61,"n":26,"s":2,"b":"다음 중 계층형 질의에 대한 설명으로 옳지 않은 것은?","x":"NOCYCLE은 순환이 생긴 지점에서 더 이상 전개하지 않는다.","o":["CONNECT BY 절은 부모 데이터를 기준으로 자식 데이터를 지정하여 계층 구조를 연결하는 역할을 한다.","PRIOR 키워드는 CONNECT BY 절에서 부모-자식 컬럼의 방향을 지정하는 데 사용된다.","NOCYCLE 옵션을 사용하면, 순환참조가 발생한 이후의 데이터까지 포함하여 결과가 출력된다.","WHERE 절의 조건은 START WITH와 CONNECT BY로 계층구조가 모두 생성된 뒤에 적용되어, 그중 조건을 만족하는 행만 걸러서 보여준다."],"a":2},{"id":"61-27","r":61,"n":27,"s":2,"b":"다음 조건을 만족하는 데이터를 찾는 WHERE 절 조건으로 가장 적절하지 않은 것은?\n> 소속팀이 삼성블루윙즈이거나 전남드래곤즈에 소속된 선수들이어야 하고, 포지션이 미드필더(MF: Midfielder)이어야 한다. 키는 175센티미터 이상이고 180 이하여야 한다.","x":"괄호가 없으면 AND가 먼저 계산되어 '삼성블루윙즈 전체 OR (전남 MF 175~180)'이 된다.","o":["(TEAM = '삼성블루윙즈' OR TEAM = '전남드래곤즈') AND POSITION = 'MF' AND HEIGHT >= 175 AND HEIGHT \u003c= 180","TEAM = '삼성블루윙즈' OR TEAM = '전남드래곤즈' AND POSITION = 'MF' AND HEIGHT >= 175 AND HEIGHT \u003c= 180","POSITION = 'MF' AND HEIGHT BETWEEN 175 AND 180 AND (TEAM = '삼성블루윙즈' OR TEAM = '전남드래곤즈')","POSITION = 'MF' AND HEIGHT >= 175 AND HEIGHT \u003c= 180 AND (TEAM = '삼성블루윙즈' OR TEAM = '전남드래곤즈')"],"a":1},{"id":"61-29","r":61,"n":29,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. OVER(ORDER BY 날짜)의 기본 프레임은 처음부터 현재 행까지라 누적 합계가 된다.","o":["날짜순으로 정렬된 각 행까지의 누적 합계를 계산한다.","전체 금액의 합계가 모든 행에 동일하게 표시된다.","날짜별로 그룹화되어 금액의 합계가 표시된다.","오류가 발생한다. (OVER 절에는 PARTITION BY가 반드시 필요하다)"],"a":0,"g":1,"m":1},{"id":"61-30","r":61,"n":30,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. ROW_NUMBER() OVER(PARTITION BY BOARD_TYPE ...)=1로 유형별 최신 글을 뽑는다고 추정했다.","o":["게시판 유형(BOARD_TYPE)별로 가장 최근 글 1건씩만 출력된다.","전체 게시글 중 가장 최근 글 1건만 출력된다.","게시판 유형과 무관하게 상위 2건이 출력된다.","게시판 유형별 게시글 건수가 출력된다."],"a":0,"g":1,"m":1},{"id":"61-31","r":61,"n":31,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은?\nPRODUCT(PROD_ID, PROD_NAME, PARENT_ID): (100, 노트북, 300), (200, 마우스, 400), (300, 전자제품, NULL), (400, 액세서리, 500), (500, 잡화, NULL)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NOT IN 서브쿼리에 NULL(PARENT_ID)이 있으면 공집합이 된다고 추정했다.","o":["PRODUCT 테이블의 모든 행","상위 카테고리로 지정되지 않은 상품의 행","공집합","오류 발생"],"a":2,"g":1,"m":1},{"id":"61-32","r":61,"n":32,"s":2,"b":"다음 SQL의 실행 결과에 대한 설명으로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["A만 다른 값이 나온다.","B와 D만 같은 값이 나온다.","모든 함수의 결과는 같다.","오류가 발생한다."],"a":2,"g":1,"m":1},{"id":"61-33","r":61,"n":33,"s":2,"b":"다음 중 오류가 발생하지 않는 SQL을 모두 고른 것은?\n- TBL1(COL1, COL2, COL3): (A, 1, 3), (B, 2, 4)\n- TBL2(COL1, COL2, COL3): (A, C, 1), (B, D, 2)\n\n*(가·나·다 SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["가","다","나, 다","모두 오류가 발생한다."],"a":2,"g":1,"m":1},{"id":"61-34","r":61,"n":34,"s":2,"b":"다음 SQL과 동일한 결과를 만드는 SQL을 모두 고른 것은? (단, TBL1.COL1에는 NULL과 중복 값이 없다.)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["가","가, 나","나, 다","가, 나, 다"],"a":3,"g":1,"m":1},{"id":"61-35","r":61,"n":35,"s":2,"b":"다음 SQL에 대한 설명으로 옳은 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 조인 조건이 없어 카티션 곱이 된다고 추정했다.","o":["두 테이블의 조인 조건이 없으므로 CROSS JOIN(Cartesian Product)이 발생한다.","EMP와 DEPT가 DEPT_ID를 기준으로 자동 조인된다.","오류가 발생하여 실행되지 않는다.","EQUI JOIN이 자동으로 적용된다."],"a":0,"g":1,"m":1},{"id":"61-36","r":61,"n":36,"s":2,"b":"다음 중 ROWNUM에 대한 설명으로 가장 적절한 것은?","x":"ROWNUM은 조회 결과에 순서대로 붙는 의사 컬럼이다.","o":["SELECT 절에서 결과 집합의 각 행에 순차적으로 부여되는 의사 컬럼(Pseudo Column)이다.","WHERE 절 조건이 모두 평가된 이후 마지막에 한 번만 부여되는 고정값이다.","인덱스 생성 시 자동으로 생성되는 물리적 컬럼이다.","사용자가 직접 정의해야 하는 일반 컬럼이다."],"a":0},{"id":"61-38","r":61,"n":38,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은?\n- TBL1.COL1: 100, 200, NULL\n- TBL2.COL2: 100, 200, NULL\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 교집합(INTERSECT/IN)은 NULL을 제외해 100, 200이 남는다고 추정했다.","o":["100","200","100, 200","결과 없음(공집합)"],"a":2,"g":1,"m":1},{"id":"61-40","r":61,"n":40,"s":2,"b":"다음 SQL을 수행한 후 EMP 테이블의 데이터로 가장 적절한 것은?\n- EMP(EMP_ID, EMP_NAME): (10001, KIM), (10002, PARK)\n- EMP_TEMP(EMP_ID, EMP_NAME): (10001, GIM), (10002, LEE)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. MERGE로 EMP_TEMP 값으로 갱신된다고 추정했다.","o":["(10001, KIM), (10002, PARK)","(10001, GIM), (10002, LEE)","(10001, KIM), (10002, PARK), (10001, GIM), (10002, LEE)","(10001, GIM), (10002, PARK)"],"a":1,"g":1,"m":1},{"id":"61-41","r":61,"n":41,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["AABBCC, ABBC","AABBC, AABBCC","AABBC, ABBC","AABBCC, AABBCC"],"a":0,"g":1,"m":1},{"id":"61-42","r":61,"n":42,"s":2,"b":"다음 중 JOIN에 대한 설명으로 가장 적절한 것은 무엇인가?","x":"NATURAL JOIN은 같은 이름의 컬럼을 자동으로 찾아 등가 조인한다.","o":["CROSS JOIN은 조인 조건을 ON절에 명시해야 한다.","INNER JOIN은 등가 조인만 가능하다.","NATURAL JOIN은 두 테이블에서 이름이 같은 컬럼을 자동으로 찾아 등가 조인을 하는 것이다.","USING 절은 두 테이블에서 컬럼명이 서로 다른 경우에도 사용할 수 있다."],"a":2},{"id":"61-45","r":61,"n":45,"s":2,"b":"다음 두 테이블에 대해 FULL OUTER JOIN을 수행했을 때, 결과 행의 개수는?\n- TBL1.A: 100, 200, NULL, NULL\n- TBL2.A: 100, 300, NULL","x":"100은 1행으로 매칭, 200·NULL 2개는 왼쪽만, 300·NULL은 오른쪽만 남아 1+3+2 = 6행이다(NULL끼리는 매칭되지 않음).","o":["4개","5개","6개","7개"],"a":2},{"id":"61-46","r":61,"n":46,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은 무엇인가?\nEMP(EMP_ID, DEPT_ID, SAL): (100, 10, 3000), (101, 10, 2500), (102, 20, NULL), (103, 20, 3200), (104, 30, 2800)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["2800","NULL","0","오류 발생"],"a":0,"g":1,"m":1},{"id":"61-47","r":61,"n":47,"s":2,"b":"다음 SQL 실행 결과로 출력되는 행의 개수는?\nSALES(DEPTNO, PRODUCT, AMT): (10, A, 100), (10, B, 200), (20, A, 300), (20, B, 400)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. ROLLUP(DEPTNO, PRODUCT)이면 상세 4 + 부서 소계 2 + 총계 1 = 7행이다.","o":["4개","6개","7개","8개"],"a":2,"g":1,"m":1},{"id":"61-49","r":61,"n":49,"s":2,"b":"다음 SQL의 결과에서 DIFF 컬럼의 값을 SALE_DATE 순서대로 나열한 것으로 가장 적절한 것은?\nSALES(SALE_DATE, AMT): (2026-01-01, 100), (2026-01-02, 150), (2026-01-03, 120)\n*(SQL 원문 누락)*","x":"AMT - LAG(AMT)로 첫 행은 이전 값이 없어 NULL, 이후 50, -30이다.","o":["NULL, 50, -30","0, 50, -30","100, 50, -30","NULL, -50, 30"],"a":0,"g":1,"m":1},{"id":"61-50","r":61,"n":50,"s":2,"b":"다음 SQL을 순서대로 실행했을 때, 테이블에 최종적으로 남아있는 행의 개수는?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["0","1","2","3"],"a":1,"g":1,"m":1},{"id":"62-01","r":62,"n":1,"s":1,"b":"다음은 발생 시점에 따른 엔터티 분류이다. 다른 하나는 무엇인가?","x":"주문·계약·매출 집계는 업무 행위로 생기는 행위(사건) 엔터티이고, 사원은 원래 존재하는 기본 엔터티다.","o":["주문내역과 고객 사이에 일어난 주문 엔터티","인적자원을 관리하는 사원 엔터티","기업 간에 맺은 계약 내용을 기록한 계약 엔터티","월별 매출을 집계한 매출 엔터티"],"a":1},{"id":"62-02","r":62,"n":2,"s":1,"b":"엔터티의 특징으로 옳지 않은 것은?","x":"엔터티는 인스턴스를 구분할 식별자와 두 개 이상의 속성을 가져야 하므로 주식별자·속성 없이는 만들 수 없다.","o":["식별자로 구분할 수 있어야 한다.","최소 두 개 이상의 속성을 가져야 한다.","주식별자와 일반 속성이 없어도 엔터티를 생성할 수 있다.","업무 프로세스에서 반드시 사용되어야 한다."],"a":2},{"id":"62-03","r":62,"n":3,"s":1,"b":"속성명을 부여하는 원칙으로 옳지 않은 것은?","x":"속성명은 서술식이 아닌 명사형 용어로 짓는다. 서술적인 속성명은 원칙에 어긋난다.","o":["가급적 서술적인 속성명을 사용한다.","가능한 한 약어를 사용하지 않는다.","전체 데이터 모델에서 중복되지 않도록 유일성과 일관성을 확보한다.","업무에서 실제로 사용하는 용어를 사용한다."],"a":0},{"id":"62-04","r":62,"n":4,"s":1,"b":"고객은 주문을 한 건도 가지지 않을 수 있고, 주문은 반드시 하나의 고객이 있어야 한다. 위 관계에 대한 설명으로 옳은 것은?","x":"고객 1명이 주문 여러 건(1:N)을 가지며, 고객은 주문이 없어도 되므로 선택, 주문은 고객이 반드시 있으므로 필수 참여다.","o":["고객과 주문은 일대일 관계이며 모두 필수 참여이다.","고객과 주문은 일대다 관계이고 고객은 필수 참여, 주문은 선택 참여이다.","고객과 주문은 일대다 관계이고 고객은 선택 참여, 주문은 필수 참여이다.","고객과 주문은 다대다 관계이며 모두 선택 참여이다."],"a":2},{"id":"62-05","r":62,"n":5,"s":1,"b":"다음 중 관계와 식별 관계에 대한 설명으로 옳지 않은 것은?","x":"IE 표기법에서 식별 관계는 실선, 비식별 관계는 점선이다. 설명이 반대로 되어 있다.","o":["관계는 두 엔터티 사이의 연관성을 표현한다.","식별 관계에서는 부모의 식별자가 자식의 주식별자에 포함된다.","I/E 표기법에서 식별 관계는 점선, 비식별 관계는 실선으로 표현한다.","비식별 관계에서는 부모의 식별자가 자식의 일반 속성이 된다."],"a":2},{"id":"62-06","r":62,"n":6,"s":1,"b":"하나의 엔터티가 두 개 이상의 부모 엔터티와 관계를 맺을 때, 어느 한 시점에는 오직 하나의 부모 엔터티와만 관계를 가져야 한다. A 관계를 선택하면 B 관계의 외래키는 NULL이어야 하고, B 관계를 선택하면 A 관계의 외래키는 NULL이어야 한다. 이 설명에 해당하는 것은?","x":"여러 부모 중 한 시점에 하나와만 관계를 맺는 것은 상호 배타적(Arc) 관계다.","o":["식별 관계","비식별 관계","참조 무결성 제약","상호 배타적 관계"],"a":3},{"id":"62-07","r":62,"n":7,"s":1,"b":"다음 데이터 모델에 대한 설명으로 옳지 않은 것은?\n\n| 테이블 | 기본키 | 그 밖의 속성 |\n|---|---|---|\n| 부서 | 부서번호 | 부서위치 |\n| 사원 | 사원번호 | 부서번호(FK), 주민등록번호 |","x":"모델만으로는 사원이 없는 부서가 있는지 알 수 없다. 부서가 반드시 사원을 가진다는 근거가 없다.","o":["대표성을 제외하고 유일성만 고려하면 사원번호 대신 주민등록번호로 사원을 식별할 수 있다.","사원 테이블의 부서번호 값은 부서 테이블에 존재해야 한다.","부서번호를 알면 해당 부서의 부서위치를 알 수 있다.","모든 부서는 한 명 이상의 사원을 가져야 한다."],"a":3},{"id":"62-08","r":62,"n":8,"s":1,"b":"주식별자에 대한 설명으로 옳지 않은 것은?","x":"주식별자는 한 번 정하면 바뀌지 않아야 하는 불변성을 가져야 한다.","o":["주식별자는 해당 엔터티의 모든 인스턴스를 유일하게 구분할 수 있어야 한다.","주식별자의 속성 수는 가능한 한 적게 구성한다.","주식별자는 NULL 값을 가질 수 없다.","이미 정의된 주식별자라도 업무 변화에 따라 유연하게 변경할 수 있다."],"a":3},{"id":"62-09","r":62,"n":9,"s":1,"b":"다중값 속성을 분리하는 방법으로 가장 적절한 것은?","x":"다중값 속성은 별도 엔터티(1:N)로 분리해 1정규형을 만족시킨다.","o":["같은 의미의 열을 여러 개 만들어 저장한다.","별도의 엔터티로 분리하여 관리한다.","저장할 수 있는 행의 수를 제한한다.","여러 값을 구분자로 이어 하나의 열에 저장한다."],"a":1},{"id":"62-10","r":62,"n":10,"s":1,"b":"데이터 모델링의 관점에서 트랜잭션의 역할로 가장 적절한 것은?","x":"트랜잭션은 하나의 논리적 작업 단위로, 전부 반영되거나 전부 취소되어야 한다(원자성).","o":["여러 사용자가 동시에 접근해도 서로 간섭하지 않도록 하는 것이다.","하나의 논리적 작업 단위에 속한 연산은 모두 실행되거나 모두 취소되어야 한다.","데이터 속성에 대한 도메인 무결성을 정의하는 것이다.","데이터를 주기적으로 백업하고 복구하는 것이다."],"a":1},{"id":"62-11","r":62,"n":11,"s":2,"b":"다음 중 SQL의 특징으로 옳지 않은 것은?","x":"SQL은 무엇을 원하는지만 기술하는 선언적·집합적·구조적 언어이며 절차적 언어가 아니다.","o":["절차적 언어이다.","구조적 언어이다.","선언적 언어이다.","집합적 언어이다."],"a":0},{"id":"62-12","r":62,"n":12,"s":2,"b":"다음 SQL과 같이 기존 테이블을 조회하여 새 테이블을 생성할 때 옳은 설명은?\n```sql\nCREATE TABLE student_backup\nAS SELECT * FROM student;\n```","x":"CTAS는 NOT NULL만 복사하고 PK·CHECK·DEFAULT 등은 복사하지 않는다.","o":["PRIMARY KEY 제약조건은 새 테이블에 적용되지 않는다.","NOT NULL 제약조건은 새 테이블에 적용되지 않는다.","CHECK 제약조건은 새 테이블에 적용된다.","DEFAULT 속성은 새 테이블에 적용된다."],"a":0},{"id":"62-13","r":62,"n":13,"s":2,"b":"NULL 값의 처리에 대한 설명으로 가장 적절하지 않은 것은?","x":"GROUP BY 기준 열의 NULL은 제외되지 않고 하나의 NULL 그룹으로 묶여 결과에 나온다.","o":["SELECT DISTINCT를 사용하면 중복된 NULL은 하나의 NULL로 반환된다.","SELECT DISTINCT COUNT(num) 형태로 사용할 수 있다.","SUM(표현식)과 COUNT(표현식)은 표현식의 결과가 NULL인 행을 연산에서 제외한다.","GROUP BY 기준 열에 NULL이 포함되어 있으면 NULL인 행은 결과에서 제외된다."],"a":3},{"id":"62-14","r":62,"n":14,"s":2,"b":"다음 SQL의 수행 결과로 옳은 것은?\n```sql\nSELECT REGEXP_COUNT('abcdabcdabcdabcd', 'ab', 1)\nFROM DUAL;\n```","x":"'abcd'가 4번 반복되므로 'ab'는 4번 나온다.","o":["2","3","4","5"],"a":2},{"id":"62-15","r":62,"n":15,"s":2,"b":"다음 중 실행 결과로 NULL이 반환되지 않는 것은?","x":"COALESCE는 첫 번째 NULL이 아닌 값 'AB'를 반환한다. 나머지는 모두 NULL이다.","o":["CASE 'AB' WHEN 'CD' THEN 'EF' END","DECODE('AB', 'CD', 'EF', NULL)","COALESCE('AB', 'CD', NULL)","NULLIF('A', 'A')"],"a":2},{"id":"62-16","r":62,"n":16,"s":2,"b":"급여 값이 모두 서로 다른 EMP 테이블에서 급여가 가장 적은 직원 5명을 조회하려고 한다. 다음 중 실행 순서 때문에 의도와 다른 결과를 낼 수 있는 SQL은?\n```sql\n-- (가) SQL Server\nSELECT TOP 5 * FROM EMP ORDER BY SAL ASC;\n\n-- (나) SQL Server\nSELECT TOP 5 WITH TIES * FROM EMP ORDER BY SAL ASC;\n\n-- (다) Oracle\nSELECT * FROM EMP WHERE ROWNUM \u003c= 5 ORDER BY SAL ASC;\n\n-- (라) 표준 SQL\nSELECT * FROM EMP ORDER BY SAL ASC FETCH FIRST 5 ROWS ONLY;\n```","x":"Oracle은 ROWNUM \u003c= 5로 임의의 5행을 먼저 자른 뒤 정렬하므로 최소 급여 5명이 보장되지 않는다.","o":["(가)","(나)","(다)","(라)"],"a":2},{"id":"62-17","r":62,"n":17,"s":2,"b":"다음 직원과 부서 데이터에 대해 SQL을 수행할 때 갱신되는 직원의 범위로 옳은 것은?\n\n| 직원.이름 | 직원.부서번호 |\n|---|---|\n| 홍길동 | 10 |\n| 이몽룡 | 11 |\n| 이영희 | 20 |\n\n| 부서.부서번호 | 부서.지역 |\n|---|---|\n| 10 | 서울 |\n| 11 | 서울 |\n| 20 | 부산 |\n\n```sql\nUPDATE 직원 A\nSET 급여 = 급여 * 1.1\nWHERE EXISTS (\n    SELECT 1\n    FROM 부서 B\n    WHERE B.지역 = '서울'\n);\n```","x":"서브쿼리가 바깥 행과 연관되지 않아 서울 부서가 하나라도 있으면 EXISTS가 항상 참이 되어 전원이 갱신된다.","o":["서울 부서 소속인 홍길동과 이몽룡만 갱신된다.","홍길동, 이몽룡, 이영희가 모두 갱신된다.","갱신되는 행이 없다.","단일 행 서브쿼리 오류가 발생한다."],"a":1},{"id":"62-18","r":62,"n":18,"s":2,"b":"다음 테이블 T에 대해 SQL을 수행한 결과로 옳은 것은?\n\n| A | B |\n|---|---|\n| 10 | 100 |\n| 20 | 90 |\n| 30 | 80 |\n\n```sql\nSELECT MIN(A) + MAX(TO_CHAR(B))\nFROM T;\n```","x":"MAX(TO_CHAR(B))는 문자 비교라 '90'이 최댓값이고, 10 + '90'이 숫자로 변환되어 100이 된다.","o":["10","100","120","오류가 발생한다."],"a":1},{"id":"62-19","r":62,"n":19,"s":2,"b":"다음 테이블 T1, T2에 대해 (가)~(라) SQL 중 결과 행 수가 가장 많은 것은?\nT1.ID: 100, 200, 100, 300\n\n| T2.ID | T2.NAME | T2.COUNTRY |\n|---|---|---|\n| 100 | Hugo | FR |\n| 200 | Shakespeare | UK |\n| 300 | Goethe | DE |\n\n```sql\n-- (가)\nSELECT T1.ID, T2.NAME\nFROM T1 LEFT OUTER JOIN T2\n  ON T1.ID = T2.ID AND T2.COUNTRY = 'UK';\n\n-- (나)\nSELECT T1.ID, T2.NAME\nFROM T1 LEFT OUTER JOIN T2\n  ON T1.ID = T2.ID\nWHERE T2.COUNTRY = 'UK';\n\n-- (다)\nSELECT T1.ID, T2.NAME\nFROM T1 INNER JOIN T2\n  ON T1.ID = T2.ID\nWHERE T2.COUNTRY = 'UK';\n\n-- (라)\nSELECT T1.ID, T2.NAME\nFROM T1 RIGHT OUTER JOIN T2\n  ON T1.ID = T2.ID\nWHERE T2.COUNTRY = 'UK';\n```","x":"(가)는 ON 절 조건이라 T1 4행이 모두 남는다. (나)(다)(라)는 WHERE로 UK만 남아 1행이다.","o":["(가)","(나)","(다)","(라)"],"a":0},{"id":"62-20","r":62,"n":20,"s":2,"b":"다음 테이블 T에 한 행을 입력하려고 한다. 제약조건을 위반하지 않고 NULL을 입력할 수 있는 것은?\n```sql\nCREATE TABLE T (\n    가 CHAR(3),\n    나 VARCHAR2(10) NOT NULL,\n    다 VARCHAR2(10) UNIQUE,\n    라 VARCHAR2(10) CHECK (라 IS NOT NULL),\n    PRIMARY KEY (가)\n);\n```","x":"UNIQUE 컬럼은 NULL을 허용한다. PK·NOT NULL·CHECK(IS NOT NULL)는 NULL을 막는다.","o":["(NULL, 'b', 'c', 'd')","('a', NULL, 'c', 'd')","('a', 'b', NULL, 'd')","('a', 'b', 'c', NULL)"],"a":2},{"id":"62-21","r":62,"n":21,"s":2,"b":"다음 테이블 T에 대해 SQL을 수행한 결과로 옳은 것은?\nT.값: 100, 110, NULL, 50, 350, 200\n```sql\nSELECT COUNT(*)\nFROM T\nWHERE 값 NOT BETWEEN 100 AND 200;\n```","x":"NOT BETWEEN 100 AND 200에 해당하는 값은 50, 350 두 개다. NULL은 비교 결과가 UNKNOWN이라 제외된다.","o":["1","2","3","4"],"a":1},{"id":"62-22","r":62,"n":22,"s":2,"b":"다음 구매 테이블에 대해 SQL을 수행한 결과로 옳은 것은?\n\n| 사용자 | 구매항목 | 구매일 | 구매금액 |\n|---|---|---|---|\n| 100 | A | 20260101 | 100 |\n| 100 | A | 20260101 | 200 |\n| 100 | B | 20260201 | 300 |\n| 100 | A | 20260101 | 400 |\n| 200 | A | 20260101 | 200 |\n| 200 | A | 20260101 | 300 |\n| 200 | B | 20260101 | 500 |\n| 300 | A | 20260101 | 300 |\n| 300 | B | 20260101 | 400 |\n\n```sql\nSELECT 사용자\nFROM 구매\nGROUP BY 사용자, 구매일\nHAVING COUNT(DISTINCT 구매항목) >= 2\n   AND SUM(구매금액) >= 700\n   AND MAX(구매금액) \u003c 500;\n```","x":"300(2026-01-01)만 항목 2종, 합계 700, 최댓값 400 조건을 모두 만족한다. 200은 최댓값이 500이라 탈락한다.","o":["100","300","100, 200","100, 200, 300"],"a":1},{"id":"62-23","r":62,"n":23,"s":2,"b":"다음 테이블 T1, T2에 대해 MERGE 문을 수행한 후 T1의 TOTAL_PAY 합계로 옳은 것은?\n\n| T1.NUM | T1.SALARY | T1.TOTAL_PAY |\n|---|---|---|\n| 1001 | 5000 | 5000 |\n| 1002 | 3000 | 3000 |\n| 1003 | 4000 | 4000 |\n\n| T2.NUM | T2.COMM |\n|---|---|\n| 1001 | 1000 |\n| 1002 | 0 |\n| 1004 | 1000 |\n\n```sql\nMERGE INTO T1 A\nUSING T2 B\n   ON (A.NUM = B.NUM)\nWHEN MATCHED THEN\n   UPDATE SET A.TOTAL_PAY = A.SALARY + B.COMM\n   DELETE WHERE A.TOTAL_PAY \u003c 4000\nWHEN NOT MATCHED THEN\n   INSERT (NUM, SALARY, TOTAL_PAY)\n   VALUES (B.NUM, 3000, 3000);\n```","x":"1001은 6000, 1002는 3000이 되어 삭제, 1003은 그대로 4000, 1004는 3000으로 삽입되어 합계 13000이다.","o":["10000","13000","16000","19000"],"a":1},{"id":"62-24","r":62,"n":24,"s":2,"b":"테이블 T에서 COL = 9를 만족하는 행이 없을 때, 다음 SQL의 수행 결과로 옳은 것은?\n```sql\nSELECT NVL(MAX('Y'), 'N')\nFROM T\nWHERE COL = 9\nGROUP BY C1;\n```","x":"GROUP BY가 있으면 대상 행이 없을 때 그룹이 생기지 않아 공집합이 반환된다.","o":["Y","N","NULL","공집합"],"a":3},{"id":"62-25","r":62,"n":25,"s":2,"b":"다음 테이블 T1, T2에 대해 (가)~(라) SQL의 결과 행 수가 나머지와 다른 것은?\n- T1(ID, TYPE): (1, A), (2, B)\n- T2(ID, TYPE): (1, A), (2, B)\n```sql\n-- (가)\nSELECT * FROM T1 NATURAL JOIN T2;\n\n-- (나)\nSELECT * FROM T1 JOIN T2 USING (ID);\n\n-- (다)\nSELECT * FROM T1 CROSS JOIN T2;\n\n-- (라)\nSELECT * FROM T1 JOIN T2\n  ON T1.ID = T2.ID AND T1.TYPE = T2.TYPE;\n```","x":"NATURAL·USING·ON(두 조건) 조인은 2행, CROSS JOIN만 2×2=4행이다.","o":["(가)","(나)","(다)","(라)"],"a":2},{"id":"62-26","r":62,"n":26,"s":2,"b":"다음 고객과 주문 데이터에서 주문을 하지 않은 고객을 찾으려고 한다. (가)~(라) 중 결과가 나머지와 다른 SQL은? 주문의 NULL 고객번호는 비회원 주문을 뜻한다.\n- 고객(고객번호, 고객명): (1, 고객A), (2, 고객B), (3, 고객C)\n- 주문.고객번호: 1, NULL, NULL, 3\n```sql\n-- (가)\nSELECT C.고객번호 FROM 고객 C\nWHERE C.고객번호 NOT IN (\n  SELECT O.고객번호 FROM 주문 O\n  WHERE O.고객번호 IS NOT NULL\n);\n\n-- (나)\nSELECT C.고객번호 FROM 고객 C\nWHERE C.고객번호 NOT IN (\n  SELECT NVL(O.고객번호, 9999) FROM 주문 O\n);\n\n-- (다)\nSELECT C.고객번호 FROM 고객 C\nWHERE EXISTS (\n  SELECT 1 FROM 주문 O\n  WHERE C.고객번호 \u003c> O.고객번호\n);\n\n-- (라)\nSELECT C.고객번호 FROM 고객 C\nWHERE NOT EXISTS (\n  SELECT 1 FROM 주문 O\n  WHERE C.고객번호 = O.고객번호\n);\n```","x":"(다)는 다른 고객번호를 가진 주문이 하나라도 있으면 참이라 1, 2, 3이 모두 나온다. 나머지는 2만 나온다.","o":["(가)","(나)","(다)","(라)"],"a":2},{"id":"62-27","r":62,"n":27,"s":2,"b":"다음 DEPT 테이블에 대한 (가)~(라) SQL 중 실행 시 오류가 발생하는 것은?\nDEPT(DEPTNO, DNAME): (10, SQL Developer), (20, SQR Master)\n```sql\n-- (가)\nSELECT DNAME\nFROM DEPT;\n\n-- (나)\nSELECT b.DEPTNO\nFROM (\n  SELECT b.DEPTNO\n  FROM DEPT b\n) a;\n\n-- (다)\nSELECT SUBSTR(DNAME, 1, 3)\nFROM DEPT;\n\n-- (라)\nSELECT RTRIM(DNAME)\nFROM DEPT;\n```","x":"인라인 뷰 밖에서는 내부 별칭 b를 참조할 수 없어 (나)는 오류가 난다.","o":["(가)","(나)","(다)","(라)"],"a":1},{"id":"62-28","r":62,"n":28,"s":2,"b":"다음 EMP 테이블과 SQL의 수행 결과로 옳은 것은?\nEMP.ENAME: SMITH, ALLEN, JONES, MARTIN, KING, BLAKE\n```sql\nSELECT ENAME\nFROM EMP\nWHERE ENAME LIKE '%N';\n```","x":"N으로 끝나는 이름은 ALLEN과 MARTIN이다. JONES는 S로 끝난다.","o":["JONES","ALLEN, JONES, MARTIN","ALLEN, MARTIN","결과 없음"],"a":2},{"id":"62-29","r":62,"n":29,"s":2,"b":"다음 PRICE 테이블에서 NULL을 0으로 바꾸어 결과(1000, 2000, 0)와 같이 출력하려고 한다. \u003c함수>에 들어갈 표현으로 옳은 것은?\nPRICE: 1000, 2000, NULL\n```sql\nSELECT \u003c함수> AS PRICE\nFROM PRICE_TABLE;\n```","x":"Oracle에서 NULL을 0으로 바꾸는 표준 함수는 COALESCE(또는 NVL)다.","o":["COALESCE(PRICE, 0)","NULL(PRICE, 0)","IFNULL(PRICE, 0)","NULLIF(0, PRICE)"],"a":0},{"id":"62-30","r":62,"n":30,"s":2,"b":"다음 중 CROSS JOIN에 대한 설명으로 가장 적절한 것은?","x":"CROSS JOIN은 조건 없이 한쪽의 모든 행을 다른 쪽 모든 행과 결합하는 카티션 곱이다.","o":["한쪽 테이블의 각 행을 다른 쪽 테이블의 모든 행과 연결한다.","두 테이블에서 이름이 같은 열을 기준으로 자동 연결한다.","명시한 조인 조건을 만족하는 행만 연결한다.","조인 조건을 만족하지 않는 쪽의 행도 NULL로 채워 연결한다."],"a":0},{"id":"62-31","r":62,"n":31,"s":2,"b":"다음은 식별관계로 연결된 네 테이블의 키 구성이다. 네 테이블을 아래의 상속된 키 전체로 조인하여 카티션 곱이 발생하지 않게 할 때, ON 절에 필요한 등호(=) 조건식의 총개수는?\n\n| 테이블 | 기본키(PK) | 상위 테이블을 참조하는 외래키(FK) |\n|---|---|---|\n| A | A_ID | - |\n| B | A_ID, B_ID | A_ID |\n| C | A_ID, B_ID, C_ID | A_ID, B_ID |\n| D | A_ID, B_ID, C_ID, D_ID | A_ID, B_ID, C_ID |","x":"B-A 1개, C-B 2개, D-C 3개로 등호 조건이 총 6개 필요하다.","o":["3개","4개","5개","6개"],"a":3},{"id":"62-32","r":62,"n":32,"s":2,"b":"다음 세 테이블과 SQL의 수행 결과 행 수로 옳은 것은?\n- A.COL: 1, 1, 2, 2, 2, 3\n- B.COL: 2, 4\n- C.COL: NULL, 5, 5\n```sql\n(SELECT COL FROM A\n INTERSECT\n SELECT COL FROM B)\nUNION ALL\nSELECT COL FROM C;\n```","x":"A∩B = {2} 1행에 C의 3행을 UNION ALL 하여 4행이다.","o":["2행","3행","4행","5행"],"a":2},{"id":"62-33","r":62,"n":33,"s":2,"b":"Oracle 계층형 쿼리에 대한 설명으로 옳지 않은 것은?","x":"LEVEL은 루트가 1이고 아래로 갈수록 커지므로 리프 노드의 LEVEL이 반드시 1인 것은 아니다.","o":["리프 노드의 LEVEL은 반드시 1이다.","START WITH 절로 계층 전개의 시작 위치를 지정한다.","순방향 전개에서 상위부서코드 = PRIOR 부서코드의 형태로 부모와 자식을 연결할 수 있다.","CONNECT BY 절로 부모와 자식 사이의 계층 전개 조건을 지정한다."],"a":0},{"id":"62-34","r":62,"n":34,"s":2,"b":"다음 테이블에서 아래 식을 계산한 결과로 옳은 것은?\nCOL1: 100, 200, NULL, 300\n```sql\nSELECT SUM(COL1) / COUNT(COL1) AS RESULT\nFROM T;\n```","x":"SUM 600 / COUNT(COL1) 3 = 200. COUNT(COL1)은 NULL을 세지 않는다.","o":["150","200","250","오류가 발생한다."],"a":1},{"id":"62-35","r":62,"n":35,"s":2,"b":"Oracle에서 다음 테이블과 SQL을 실행했을 때 출력되는 행 수로 옳은 것은?\nID: 1, 2, 3, 4, 5\n```sql\nSELECT ID\nFROM T\nWHERE ROWNUM \u003c> 3;\n```","x":"ROWNUM은 조건을 통과해야 증가하므로 1, 2 뒤에는 계속 3이 되어 조건 \u003c> 3을 통과하지 못한다. 2행만 나온다.","o":["2개 행","3개 행","5개 행","0개 행"],"a":0},{"id":"62-36","r":62,"n":36,"s":2,"b":"그룹 함수에 대한 설명으로 옳지 않은 것은?","x":"ROLLUP은 인수 순서에 따라 계층이 달라지므로 순서를 바꾸면 소계 조합도 바뀐다.","o":["CUBE는 지정한 그룹 열로 만들 수 있는 가능한 모든 조합의 집계를 생성한다.","GROUPING SETS는 명시적으로 지정한 그룹핑 조합만 각각 집계한다.","ROLLUP은 인수의 나열 순서에 따른 계층 구조의 소계와 총계를 생성한다.","ROLLUP은 인수의 순서가 달라져도 집계 결과의 그룹 조합이 동일하다."],"a":3},{"id":"62-37","r":62,"n":37,"s":2,"b":"Materialized View를 제외한 일반 뷰(VIEW)에 대한 설명으로 옳지 않은 것은?","x":"일반 뷰는 정의만 저장하므로 뷰를 쓴다고 성능이 자동으로 좋아지지 않는다.","o":["복잡한 조회문을 뷰로 정의해 두면 그 뷰를 사용하는 다른 조회문의 실행 성능이 자동으로 향상된다.","기초 테이블의 구조가 일부 변경되어도 뷰의 외부 인터페이스를 동일하게 유지하면 이를 사용하는 응용프로그램은 수정하지 않을 수 있다.","뷰는 정의된 조회 결과 데이터를 별도의 물리적 저장공간에 저장하지 않는다.","사용자에게 필요한 열과 행만 선택적으로 노출하는 데 활용할 수 있다."],"a":0},{"id":"62-38","r":62,"n":38,"s":2,"b":"다음 두 테이블에서 각각 COUNT(DISTINCT COL)을 수행한 결과를 순서대로 바르게 나열한 것은?\n- T1.COL: A, A, A, B, B, NULL, NULL\n- T2.COL: 1, 1, 2, 2, 2, 3, NULL\n```sql\nSELECT COUNT(DISTINCT COL) FROM T1;\nSELECT COUNT(DISTINCT COL) FROM T2;\n```","x":"COUNT(DISTINCT)는 NULL을 제외하므로 T1은 A·B 2개, T2는 1·2·3 3개다.","o":["2, 3","3, 4","3, 3","6, 6"],"a":0},{"id":"62-39","r":62,"n":39,"s":2,"b":"집합 연산자를 사용한 SQL에 대한 설명으로 옳은 것은?","x":"집합 연산의 결과 컬럼명은 첫 번째 SELECT 기준이라 두 번째에만 있는 이름으로는 ORDER BY 할 수 없다.","o":["첫 번째 SELECT 문에서 정의한 칼럼명으로 ORDER BY 절을 작성하면 오류가 발생한다.","두 번째 SELECT 문에서만 정의한 칼럼명으로 ORDER BY 절을 작성하면 오류가 발생한다.","ORDER BY 절에는 칼럼명이나 별칭만 사용할 수 있으므로 칼럼 위치를 나타내는 숫자를 사용하면 오류가 발생한다.","대응하는 칼럼의 데이터 타입이 서로 다르면 같은 데이터 타입 그룹에서 호환되더라도 항상 오류가 발생한다."],"a":1},{"id":"62-40","r":62,"n":40,"s":2,"b":"다음 중 Oracle에서 문법 오류가 발생하는 SQL 문은?","x":"INSERT ... SELECT 구문에는 AS를 쓰지 않는다. INSERT INTO T (C1) SELECT ...가 맞다.","o":["INSERT INTO T (C1) VALUES (1);","UPDATE T SET C1 = 1;","INSERT INTO T (C1) AS SELECT C1 FROM S;","CREATE TABLE T2 AS SELECT C1 FROM S;"],"a":2},{"id":"62-41","r":62,"n":41,"s":2,"b":"다음 TBL1, TBL2와 SQL의 실행 결과가 제시된 것과 같을 때, 괄호 안에 들어갈 칼럼은?\n\nTBL1\n\n| COLA | COLB |\n|---|---|\n| KOREAN | KIM |\n| MATH | LEE |\n| ENGLISH | PARK |\n\nTBL2\n\n| COLA | COLB | COLC |\n|---|---|---|\n| KOREAN | KIM | 17 |\n| KOREAN | KIM | 25 |\n| ENGLISH | PARK | 32 |\n\n```sql\nSELECT *\nFROM TBL1 RIGHT OUTER JOIN TBL2 USING ( ㄱ )\nWHERE COLC >= 20;\n```\n실행 결과\n\n| COLB | COLA | COLA | COLC |\n|---|---|---|---|\n| KIM | KOREAN | KOREAN | 25 |\n| PARK | ENGLISH | ENGLISH | 32 |","x":"결과에서 COLB가 한 번, COLA가 두 번 나오므로 USING(COLB)로 조인한 것이다.","o":["COLA","COLB","COLC","COLA, COLB"],"a":1},{"id":"62-42","r":62,"n":42,"s":2,"b":"다음 TS 테이블과 다중 테이블 INSERT 문을 실행한 후 T1, T2, T3의 행 수를 순서대로 나열한 것은? 실행 전 T1, T2, T3는 비어 있다.\nTS.C1: 1, 2, 5\n```sql\nINSERT FIRST\n  WHEN C1 >= 2 THEN INTO T1\n  WHEN C1 >= 3 THEN INTO T2\n  ELSE INTO T3\nSELECT C1 FROM TS;\n```","x":"INSERT FIRST는 첫 번째로 맞는 WHEN에만 넣는다. 2·5는 T1, 1은 ELSE로 T3에 들어가 2, 0, 1이다.","o":["2, 0, 0","2, 0, 1","2, 1, 0","2, 1, 1"],"a":1},{"id":"62-43","r":62,"n":43,"s":2,"b":"다음 T 테이블에 대해 SQL을 실행한 결과로 옳은 것은?\n\n| COL1 | COL2 |\n|---|---|\n| NULL | A |\n| 1 | NULL |\n| 30 | NULL |\n| 40 | D |\n\n```sql\nSELECT *\nFROM T\nWHERE NOT (COL1 = 1 OR COL2 IS NULL);\n```","x":"NULL/A 행은 NOT(UNKNOWN)이 UNKNOWN이라 제외되고, COL2가 NULL인 행도 제외되어 40/D만 남는다.","o":["공집합","40 / D 한 행","NULL / A 한 행","30 / NULL, 40 / D 두 행"],"a":1},{"id":"62-44","r":62,"n":44,"s":2,"b":"다음 EMP 테이블과 계층형 질의를 실행했을 때, 실행 결과의 괄호 안에 들어갈 값은?\n\n| EMPNO | NAME | MGR |\n|---|---|---|\n| 7782 | CLARK | NULL |\n| 7839 | KING | NULL |\n| 7844 | ALLEN | 7782 |\n| 7876 | ALLEN | 7839 |\n| 7900 | SMITH | 7839 |\n\n```sql\nSELECT CONNECT_BY_ROOT EMPNO AS ROOT_EMPNO, COUNT(*) AS CNT\nFROM EMP\nSTART WITH MGR IS NULL\nCONNECT BY MGR = PRIOR EMPNO\nGROUP BY CONNECT_BY_ROOT EMPNO\nORDER BY ROOT_EMPNO;\n```\n실행 결과\n\n| ROOT_EMPNO | CNT |\n|---|---|\n| 7782 | 2 |\n| 7839 | ( ㄱ ) |","x":"7839(KING) 아래에 7876, 7900이 있어 루트 포함 3행이다.","o":["2","3","4","5"],"a":1},{"id":"62-45","r":62,"n":45,"s":2,"b":"다음 SALES 테이블의 월별 금액 칼럼을 행으로 변환하려고 한다. SQL의 괄호 안에 들어갈 내용으로 옳은 것은?\n\n| ID | AMOUNT_3 | AMOUNT_2 | AMOUNT_1 |\n|---|---|---|---|\n| 100 | 20 | 30 | 40 |\n| 200 | 50 | 60 | 45 |\n\n```sql\nSELECT ID, 구분, AMOUNT\nFROM SALES\nUNPIVOT (AMOUNT FOR 구분 IN ( ㄱ ))\nWHERE AMOUNT \u003c= 40;\n```","x":"UNPIVOT의 IN 절에는 행으로 바꿀 컬럼명을 나열한다.","o":["40, 30, 20","AMOUNT_3, AMOUNT_2, AMOUNT_1","AMOUNT, AMOUNT, AMOUNT","ID, 구분, AMOUNT"],"a":1},{"id":"62-46","r":62,"n":46,"s":2,"b":"다음 SQL에 대한 설명으로 가장 적절한 것은?\n```sql\nSELECT 사용자명, COUNT(*) AS 로그인횟수\nFROM 로그인기록\nGROUP BY 사용자명\nHAVING 사용자명 = '이순신' AND COUNT(*) > 10;\n```\n(가)\n```sql\nSELECT 사용자명, 로그인횟수\nFROM (\n  SELECT 사용자명, COUNT(*) AS 로그인횟수\n  FROM 로그인기록\n  GROUP BY 사용자명\n)\nWHERE 사용자명 = '이순신'\n  AND 로그인횟수 > 10;\n```","x":"HAVING으로 이순신 그룹과 건수를 거르는 것과 인라인 뷰 밖 WHERE로 거르는 것은 결과가 같다.","o":["위 SQL은 (가) SQL과 실행 결과가 동일하다.","SELECT 절의 사용자명 대신 문자 리터럴 '이순신'을 기술하면 조회 대상도 이순신으로 제한된다.","HAVING 절의 COUNT(*) > 10을 로그인횟수 > 10으로 바꾸어도 정상 실행된다.","HAVING 절 전체를 WHERE 절로 옮겨도 같은 결과가 나온다."],"a":0},{"id":"62-47","r":62,"n":47,"s":2,"b":"다음 TAB 테이블과 SQL의 실행 결과는?\nTAB.COL1: 1, 2, 3, 4\n```sql\nSELECT COUNT(*)\nFROM TAB A, TAB B\nWHERE A.COL1 \u003c= B.COL1;\n```","x":"A ≤ B인 쌍은 4+3+2+1 = 10개다.","o":["4","6","10","결과 없음"],"a":2},{"id":"62-48","r":62,"n":48,"s":2,"b":"TAB1에 이미 3건의 행이 저장되어 있다. 같은 세션에서 다음 SQL을 순서대로 수행했으며, 마지막 ROLLBACK 문에서 오류가 발생한 뒤 COUNT(*)를 조회하였다. 조회 결과는?\n```sql\nINSERT INTO TAB1 VALUES (4);\nSAVEPOINT S1;\nINSERT INTO TAB1 VALUES (5);\nCOMMIT;\nINSERT INTO TAB1 VALUES (6);\nROLLBACK TO S1;\n\nSELECT COUNT(*) FROM TAB1;\n```","x":"COMMIT 뒤에는 S1이 사라져 ROLLBACK TO S1이 오류가 나지만 6은 남는다. 3+3=6건이다.","o":["4","5","6","7"],"a":2},{"id":"62-49","r":62,"n":49,"s":2,"b":"Oracle에서 다음과 같이 테이블을 생성하였다. 이어서 제시된 ALTER TABLE 문을 각각 독립적으로 실행할 때 문법 오류가 발생하는 것은? 다른 테이블에서 EMP.EMPNO를 참조하는 외래 키는 없다.\n```sql\nCREATE TABLE DEPT (\n  DEPTNO NUMBER PRIMARY KEY\n);\n\nCREATE TABLE EMP (\n  EMPNO  NUMBER CONSTRAINT EMP_PK PRIMARY KEY,\n  DEPTNO NUMBER CONSTRAINT EMP_FK REFERENCES DEPT(DEPTNO)\n);\n```","x":"Oracle에는 DROP FOREIGN KEY 구문이 없다. DROP CONSTRAINT EMP_FK로 지워야 한다.","o":["ALTER TABLE EMP DROP PRIMARY KEY;","ALTER TABLE EMP DROP FOREIGN KEY;","ALTER TABLE EMP DROP COLUMN DEPTNO;","ALTER TABLE EMP ADD (HIREDATE DATE DEFAULT SYSDATE);"],"a":1},{"id":"62-50","r":62,"n":50,"s":2,"b":"테이블 T에 대한 객체 권한과 롤을 다음과 같이 부여한 후 INSERT 권한을 회수하였다. 이에 대한 설명으로 옳은 것은?\n```sql\nGRANT SELECT, INSERT ON T TO STAFF;\nGRANT DELETE, UPDATE ON T TO MGR;\nGRANT STAFF TO MGR;\nGRANT MGR TO CHULSU;\nGRANT STAFF TO YOUNGHEE;\n\nREVOKE INSERT ON T FROM STAFF;\n```","x":"철수는 MGR 안의 STAFF 롤로 SELECT를 받았으므로 STAFF를 삭제하면 SELECT도 사라진다.","o":["DROP ROLE STAFF를 수행하면 철수(CHULSU)가 MGR을 통해 사용하던 SELECT 권한도 사라진다.","철수는 STAFF 롤을 직접 부여받지 않았으므로 T를 SELECT할 수 없다.","영희(YOUNGHEE)는 T에 대한 DELETE 권한을 사용할 수 있다.","철수의 INSERT 권한을 없애려면 STAFF와 MGR 양쪽에서 INSERT 권한을 각각 회수해야 한다."],"a":0}],"exams":[{"r":62,"d":"20260822","n":50},{"r":61,"d":"20260531","n":44},{"r":60,"d":"20260307","n":50},{"r":59,"d":"20251116","n":50},{"r":58,"d":"20250823","n":50},{"r":57,"d":"20250531","n":50},{"r":56,"d":"20250308","n":50},{"r":55,"d":"20241117","n":50},{"r":54,"d":"20240824","n":47},{"r":53,"d":"20240525","n":50},{"r":52,"d":"20240309","n":50},{"r":51,"d":"20231118","n":50},{"r":50,"d":"20230909","n":43},{"r":49,"d":"20230610","n":50},{"r":48,"d":"20230319","n":43},{"r":47,"d":"20221105","n":42},{"r":46,"d":"20220904","n":47},{"r":45,"d":"20220528","n":44}],"excluded":40};

function inline(t) {
  return esc(t)
    .replace(/\*\((.+?)\)\*/g, '<span class="miss">$1</span>')
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(src) {
  const L = src.split("\n"), out = [];
  let first = true;
  for (let k = 0; k < L.length; k++) {
    const line = L[k], t = line.trim();
    if (!t) continue;
    if (t.startsWith("```")) {
      const code = [];
      for (k++; k < L.length && !L[k].trim().startsWith("```"); k++) code.push(L[k]);
      out.push(`<pre>${esc(code.join("\n"))}</pre>`);
    } else if (t.startsWith("|")) {
      const rows = [];
      for (; k < L.length && L[k].trim().startsWith("|"); k++) rows.push(L[k].trim());
      k--;
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\|[\s|:-]+\|$/.test(r));
      const [h, ...rest] = body;
      out.push(`<div class="tw"><table><thead><tr>${cells(h).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    } else if (t.startsWith(">")) {
      const q = [];
      for (; k < L.length && L[k].trim().startsWith(">"); k++) q.push(L[k].trim().replace(/^>\s?/, ""));
      k--;
      out.push(`<blockquote>${q.map(inline).join("<br>")}</blockquote>`);
    } else if (t.startsWith("- ")) {
      const li = [];
      for (; k < L.length && L[k].trim().startsWith("- "); k++) li.push(L[k].trim().slice(2));
      k--;
      out.push(`<ul>${li.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`);
    } else if (/^\[그림:/.test(t)) {
      out.push(`<div class="figtext">${inline(t.slice(1, -1))}</div>`);
    } else {
      out.push(`<p${first ? ' class="lead"' : ""}>${inline(t)}</p>`);
    }
    first = false;
  }
  return out.join("");
}
const isSql = t => /\b(SELECT|INSERT|UPDATE|DELETE|ALTER|CREATE|DROP|GRANT|REVOKE|WHERE|GROUP BY|ORDER BY|HAVING|CONNECT BY|PARTITION BY|ROWS BETWEEN|RANGE BETWEEN|REGEXP_\w+|SUBSTR|NVL|COALESCE|NULLIF|DECODE|CASE|ROLLUP|CUBE|GROUPING|LIKE|BETWEEN|FOREIGN KEY|JOIN)\b|\(\+\)|[<>]=?|=/.test(t);
const optHtml = t => `<span class="${isSql(t) ? "sq" : ""}">${inline(t)}</span>`;

    </div>
    <div class="block">
      <h2 class="sec">과목별 풀이 · 바로 채점 · 1과목 30초 · 2과목 1분</h2>

        <label for="pcnt">문항 수 <select id="pcnt" onchange="PREF.cnt=this.value;savePref()">

function askReset() {
  modal(`<h2>학습 기록을 지울까요?</h2><p>과목별 풀이 기록, 오답 표시, 회차별 최근 점수가 모두 지워집니다.</p>
    <div class="row"><button class="btn" onclick="modal('')">취소</button><button class="btn primary" onclick="resetAll()">지우기</button></div>`);
}
function resetAll() {
  STATS = {}; saveStats();
  try { DATA.exams.forEach(e => localStorage.removeItem("sqld-ex-" + e.r)); } catch (x) {}
  modal(""); home();
}
function modal(html) { $("#modal").innerHTML = html ? `<div class="scrim" onclick="if(event.target===this)modal('')"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>` : ""; }

/* ---------- exam (mock / past) ---------- */
function startMock() {
  const items = [];
  [1,2].forEach(s => items.push(...shuffle(BYSUB[s].filter(i => !isShort(i))).slice(0, ALLOC[s])));
  beginExam({kind:"mock", title:"랜덤 모의고사", items});
}
function startExam(r) { beginExam({kind:"past", round:r, title:`제${r}회 기출`, items:EXAMS[r].slice()}); }
function beginExam(o) {
  S = Object.assign(o, {mode:"exam", ans:Array(o.items.length).fill(null), flags:new Set(), cur:0, end:Date.now() + EXAM_MIN * 60000, dl:Array(o.items.length).fill(0)});
  clearInterval(timerId); timerId = setInterval(tick, 250);
  renderExam(); scrollTo(0, 0);
}
function tick() {
  if (!S || S.mode !== "exam") return clearInterval(timerId);
  const left = Math.max(0, S.end - Date.now()), el = $("#timer");
  if (el) { el.textContent = `${String(left / 60000 | 0).padStart(2, "0")}:${String((left / 1000 | 0) % 60).padStart(2, "0")}`; el.classList.toggle("warn", left < 10 * 60000); }
  // 문항별 제한 시간: 시험 모드에서는 표시만 하고 0초에서 멈춘다 (채점에는 영향 없음)
  const qel = $("#qtimer");
  if (qel) { const ql = Math.max(0, S.dl[S.cur] - Date.now()); qel.textContent = `${Math.ceil(ql / 1000)}초`; qel.classList.toggle("warn", ql < 10000); }
  if (left <= 0) { clearInterval(timerId); finishExam(true); }
}
function renderExam() {
  const n = S.items.length, done = S.ans.filter(a => a !== null && a !== "").length;
  $("#bar").innerHTML = `<button class="brand" onclick="askQuit()">SQLD<small>${esc(S.title)}</small></button><span class="sp"></span>
    <span class="prog num">${done}/${n} 답안</span><span class="timer" id="timer">--:--</span><button class="btn primary" onclick="askSubmit()">답안 제출</button>`;
  const i = S.items[S.cur], q = Q[i];
  if (!S.dl[S.cur]) S.dl[S.cur] = Date.now() + QSEC[q.s] * 1000;
  let omr = "", last = 0;
  S.items.forEach((qi, k) => {
    if (Q[qi].s !== last) { last = Q[qi].s; omr += `<div class="sh">${last}과목 · ${SUBJ[last]}</div>`; }
    const cells = isShort(qi)
      ? `<button class="osh ${S.ans[k] ? "on" : ""}" onclick="go(${k})" aria-label="${k + 1}번 단답형">${S.ans[k] ? esc(S.ans[k]) : "단답형"}</button>`
      : [0,1,2,3].map(o => `<button class="ob ${S.ans[k] === o ? "on" : ""}" onclick="pick(${o},${k})" aria-label="${k + 1}번 ${o + 1}번 보기">${o + 1}</button>`).join("");
    omr += `<div class="orow ${k === S.cur ? "cur" : ""}"><button class="n ${S.flags.has(k) ? "fl" : ""}" onclick="go(${k})" aria-label="${k + 1}번으로 이동">${k + 1}</button>${cells}</div>`;
  });
  const srcTag = S.kind === "mock" ? `<span class="tag">${srcLine(q)}</span>` : "";
  const answerArea = isShort(i)
    ? `<div class="short"><input id="sa" type="text" autocomplete="off" placeholder="답을 입력하세요" value="${esc(S.ans[S.cur] || "")}" oninput="S.ans[S.cur]=this.value;updOmr()"></div>`
    : `<div class="opts">${q.o.map((t, o) => `<button class="opt ${S.ans[S.cur] === o ? "sel" : ""}" onclick="pick(${o})"><span class="bub">${o + 1}</span>${optHtml(t)}</button>`).join("")}</div>`;
  $("#app").innerHTML = `<div class="exam">
    <article class="qcard">
      <div class="qhead"><span class="qno">${S.cur + 1}</span>${tags(q)}${srcTag}<span class="qtimer" id="qtimer" title="문항당 ${QSEC[q.s]}초 (점수 영향 없음)"></span>
        <button class="flagbtn ${S.flags.has(S.cur) ? "on" : ""}" onclick="flag()">${S.flags.has(S.cur) ? "표시됨" : "나중에 다시 보기"}</button></div>
      ${qBody(i)}
      ${answerArea}
      <div class="nav"><button class="btn" onclick="go(S.cur-1)" ${S.cur ? "" : "disabled"}>이전</button><span class="sp"></span>
        ${S.cur < n - 1 ? `<button class="btn primary" onclick="go(S.cur+1)">다음</button>` : `<button class="btn primary" onclick="askSubmit()">답안 제출</button>`}</div>
      <p class="kbd">키보드: 1–4 답 선택 · ←/→ 이동 · F 표시</p>
    </article>
    <aside class="omr" aria-label="답안지"><h3><span>OMR 답안지</span><span class="num" id="omrcnt">${done}/${n}</span></h3><div class="omr-grid">${omr}</div>
      <p class="legend">번호에 물결 밑줄 = 다시 볼 문항</p></aside></div>`;
  tick();
}
function updOmr() {
  const n = S.items.length, done = S.ans.filter(a => a !== null && a !== "").length, b = document.querySelectorAll(".orow")[S.cur]?.querySelector(".osh");
  if (b) { b.textContent = S.ans[S.cur] || "단답형"; b.classList.toggle("on", !!S.ans[S.cur]); }
  $("#omrcnt").textContent = `${done}/${n}`; $(".prog").textContent = `${done}/${n} 답안`;
}
function go(k) { if (k < 0 || k >= S.items.length) return; S.cur = k; renderExam(); if (innerWidth <= 860) $(".qcard").scrollIntoView({block:"start"}); }
function pick(o, k = S.cur) { if (isShort(S.items[k])) return; S.ans[k] = S.ans[k] === o ? null : o; renderExam(); }
function flag() { S.flags.has(S.cur) ? S.flags.delete(S.cur) : S.flags.add(S.cur); renderExam(); }
function askQuit() {
  modal(`<h2>시험을 그만둘까요?</h2><p>표시한 답안은 저장되지 않습니다.</p><div class="row"><button class="btn" onclick="modal('')">계속 풀기</button><button class="btn primary" onclick="modal('');home()">처음으로</button></div>`);
}
function askSubmit() {
  const left = S.ans.filter(a => a === null || a === "").length;
  modal(`<h2>답안을 제출할까요?</h2><p>${left ? `아직 ${left}문항이 비어 있습니다. 빈 문항은 오답으로 채점됩니다.` : "모든 문항에 답했습니다."}${S.flags.size ? ` 다시 보기 표시 ${S.flags.size}문항.` : ""}</p>
    <div class="row"><button class="btn" onclick="modal('')">계속 풀기</button><button class="btn primary" onclick="modal('');finishExam()">제출하고 채점</button></div>`);
}
function finishExam(timeout) {
  clearInterval(timerId);
  S.ans = S.ans.map(a => a === "" ? null : a);
  S.mode = "result"; S.timeout = !!timeout; S.used = Math.min(EXAM_MIN * 60000, EXAM_MIN * 60000 - (S.end - Date.now()));
  S.items.forEach((i, k) => record(i, isRight(i, S.ans[k])));
  scoreUp();
  if (S.kind === "past") try { localStorage.setItem("sqld-ex-" + S.round, JSON.stringify(S.score)); } catch (e) {}
  reviewFilter = "ng"; renderResult(); scrollTo(0, 0);
}
function scoreUp() {
  const correct = S.items.filter((i, k) => isRight(i, S.ans[k])).length;
  S.score = Math.round(correct / S.items.length * 100);
}
function optList(i, mine) {
  const q = Q[i];
  if (isShort(i)) return `<div class="sa"><span>정답: <b>${esc(q.a[0])}</b>${q.a.length > 1 ? ` <span class="foot">(인정: ${q.a.slice(1).map(esc).join(", ")})</span>` : ""}</span><span>내 답: ${mine === null || mine === TIMEOUT ? "—" : esc(mine)}</span></div>`;
  return `<ol>${q.o.map((t, o) => `<li class="${o === q.a ? "c" : o === mine ? "w" : ""}"><span class="bub">${o + 1}</span><span>${optHtml(t)}${o === q.a ? " <b>· 정답</b>" : o === mine ? " · 내 답" : ""}</span></li>`).join("")}</ol>`;
}
const expBox = q => `<div class="exp"><b>정답 ${q.t ? esc(q.a[0]) : C[q.a]} 이유</b>${q.g ? " <span class=\"who\">· 원문 누락으로 추정</span>" : ""}\n${esc(q.x)}\n<span class="who">해설: Claude 풀이</span></div>`;
function renderResult() {
  const n = S.items.length, correct = S.items.filter((i, k) => isRight(i, S.ans[k])).length, blank = S.ans.filter(a => a === null).length;
  const pr = S.kind === "practice", mm = Math.round(S.used / 60000);
  $("#bar").innerHTML = `<button class="brand" onclick="home()">SQLD<small>${esc(S.title)} 결과</small></button><span class="sp"></span><button class="btn" onclick="home()">처음으로</button>`;
  let cutFail = false;
  const rows = [1,2].map(s => {
    const ks = S.items.map((i, k) => k).filter(k => Q[S.items[k]].s === s);
    if (!ks.length) return "";
    const c = ks.filter(k => isRight(S.items[k], S.ans[k])).length, p = Math.round(c / ks.length * 100), cut = p < CUT;
    if (cut) cutFail = true;
    return `<tr><td>${s}과목 ${SUBJ[s]}</td><td class="r">${c} / ${ks.length}</td><td class="r">${p}%<span class="pbar"><i style="width:${p}%"></i></span></td><td class="${cut && !pr ? "cut" : ""}">${pr ? "—" : cut ? "과락" : "통과"}</td></tr>`;
  }).join("");
  const pass = S.score >= PASS && !cutFail;
  const list = S.items.map((i, k) => ({i, k, st: S.ans[k] === null ? "off" : isRight(i, S.ans[k]) ? "ok" : "ng"}))
    .filter(r => reviewFilter === "all" || (reviewFilter === "ng" ? r.st !== "ok" : reviewFilter === "fl" && S.flags.has(r.k)));
  const cnt = {ng: S.items.filter((i, k) => !isRight(i, S.ans[k])).length, fl: S.flags.size};
  $("#app").innerHTML = `<section class="result">
    <div class="score">
      <div><div class="big num">${S.score}<small>/100</small></div>${pr ? `<div class="foot">정답률</div>` : `<span class="stamp ${pass ? "pass" : "fail"}">${pass ? "합격" : cutFail && S.score >= PASS ? "과락" : "불합격"}</span>`}</div>
      <div style="min-width:0">
        <div class="meter"><i style="width:${S.score}%"></i><b></b></div>
        <div class="mlabels"><span>0</span><span>합격선 ${PASS}</span><span>100</span></div>
        <div class="facts"><span>맞힘 <strong class="num">${correct}</strong></span><span>틀림 <strong class="num">${n - correct - blank}</strong></span><span>빈 문항 <strong class="num">${blank}</strong></span>${pr ? "" : `<span>걸린 시간 <strong class="num">${mm}분</strong>${S.timeout ? " (시간 종료)" : ""}</span>`}</div>
      </div>
    </div>
    <div class="tbl"><table class="parts"><thead><tr><th>과목</th><th style="text-align:right">맞힘</th><th style="text-align:right">정답률</th><th>과락 기준 ${CUT}%</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="acts">
      ${pr ? "" : `<button class="btn primary" onclick="${S.kind === "mock" ? "startMock()" : `startExam(${S.round})`}">${S.kind === "mock" ? "새 모의고사" : "이 회차 다시 풀기"}</button>`}
      <button class="btn" onclick="retryWrong()" ${cnt.ng ? "" : "disabled"}>틀린 ${cnt.ng}문항 바로 다시 풀기</button>
      <button class="btn ghost" onclick="home()">처음으로</button>
    </div>
    <div class="block">
      <h2 class="sec">문항 검토</h2>
      <div class="filters">${[["ng","틀린 문항 " + cnt.ng],["all","전체 " + n],["fl","표시한 문항 " + cnt.fl]].map(([f, l]) => `<button class="chip ${reviewFilter === f ? "on" : ""}" onclick="reviewFilter='${f}';renderResult()">${l}</button>`).join("")}</div>
      <div class="review">${list.length ? list.map(({i, k, st}) => `<article class="rv ${st}">
        <div class="qhead"><span class="qno" style="font-size:20px">${k + 1}</span><span class="stt ${st}">${st === "ok" ? "정답" : S.ans[k] === TIMEOUT ? "시간 초과" : st === "ng" ? "오답" : "미응답"}</span>${tags(Q[i])}<span class="tag">${srcLine(Q[i])}</span></div>
        ${qBody(i)}${expBox(Q[i])}${optList(i, S.ans[k])}</article>`).join("") : `<p class="foot">해당하는 문항이 없습니다.</p>`}</div>
    </div></section>`;
}
function retryWrong() {
  const items = S.items.filter((i, k) => !isRight(i, S.ans[k]));
  beginPractice({title:"틀린 문항 다시 풀기", items});
}

/* ---------- practice (instant feedback) ---------- */
function startPractice(s, wrongOnly) {
  let pool = s ? BYSUB[s].slice() : Q.map((_, i) => i);
  if (wrongOnly) pool = pool.filter(isWrong);
  if (PREF.order === "rand") pool = shuffle(pool);
  else if (PREF.order === "new") pool = [...shuffle(pool.filter(i => !STATS[Q[i].id])), ...shuffle(pool.filter(i => STATS[Q[i].id]))];
  else pool.sort((a, b) => Q[b].r - Q[a].r || Q[a].n - Q[b].n);
  if (PREF.cnt !== "all") pool = pool.slice(0, +PREF.cnt);
  beginPractice({title:(s ? SUBJ[s] : "전 과목") + (wrongOnly ? " 오답" : " 풀이"), items:pool});
}
// 과목별 풀이: 1과목 30초, 2과목 60초. 시간이 지나면 오답(TIMEOUT)으로 기록하고 정답을 보여 준다.
// 기한은 문항별로 처음 볼 때 정해지며, 다른 문항으로 넘어가도 계속 흐른다.
function beginPractice(o) {
  clearInterval(timerId);
  S = Object.assign({timed:true}, o, {mode:"practice", ans:Array(o.items.length).fill(null), dl:Array(o.items.length).fill(0), cur:0});
  if (S.timed) timerId = setInterval(ptick, 200);
  renderPractice(); scrollTo(0, 0);
}
function ptick() {
  if (!S || S.mode !== "practice" || !S.timed) return;
  const el = $("#ptimer");
  if (S.ans[S.cur] !== null) { if (el) el.hidden = true; return; }
  const left = Math.max(0, S.dl[S.cur] - Date.now());
  if (el) { el.hidden = false; el.textContent = `${Math.ceil(left / 1000)}초`; el.classList.toggle("warn", left < 10000); }
  if (left <= 0) { S.ans[S.cur] = TIMEOUT; record(S.items[S.cur], false); renderPractice(); }
}
function renderPractice() {
  const n = S.items.length, i = S.items[S.cur], q = Q[i], mine = S.ans[S.cur], answered = mine !== null;
  if (S.timed && !answered && !S.dl[S.cur]) S.dl[S.cur] = Date.now() + QSEC[q.s] * 1000;
  const ok = S.ans.filter((a, k) => a !== null && isRight(S.items[k], a)).length, done = S.ans.filter(a => a !== null).length;
  $("#bar").innerHTML = `<button class="brand" onclick="home()">SQLD<small>${esc(S.title)}</small></button><span class="sp"></span>
    <span class="prog num">${S.cur + 1}/${n} · 맞힘 ${ok}/${done}</span><span class="timer" id="ptimer" title="문항당 ${QSEC[q.s]}초" hidden></span><button class="btn" onclick="practiceDone()">그만 풀고 결과 보기</button>`;
  const st = STATS[q.id], right = isRight(i, mine);
  const head = right ? "정답입니다" : mine === TIMEOUT ? `시간 초과 · 오답 처리 · 정답 ${esc(ansText(i))}` : `오답입니다 · 정답 ${esc(ansText(i))}`;
  const fb = answered ? `<div class="fb ${right ? "ok" : "ng"}"><strong>${head}</strong>${expBox(q)}</div>` : "";
  const area = isShort(i)
    ? `<form class="short" onsubmit="event.preventDefault();answer($('#sa').value)"><input id="sa" type="text" autocomplete="off" placeholder="답을 입력하고 Enter" value="${answered && mine !== TIMEOUT ? esc(mine) : ""}" ${answered ? "disabled" : ""}><button class="btn primary" ${answered ? "disabled" : ""}>확인</button></form>`
    : `<div class="opts">${q.o.map((t, o) => `<button class="opt ${answered ? (o === q.a ? "fb-c" : o === mine ? "fb-w" : "") : ""}" onclick="answer(${o})" ${answered ? "disabled" : ""}><span class="bub">${o + 1}</span>${optHtml(t)}</button>`).join("")}</div>`;
  $("#app").innerHTML = `<div class="exam solo"><article class="qcard">
    <div class="qhead"><span class="qno">${S.cur + 1}</span>${tags(q)}<span class="tag">${srcLine(q)}</span>
      ${st ? `<span class="tag">기록 ${st.c}/${st.t}</span>` : ""}</div>
    ${qBody(i)}
    ${area}
    ${fb}
    <div class="nav"><button class="btn" onclick="pgo(S.cur-1)" ${S.cur ? "" : "disabled"}>이전</button><span class="sp"></span>
      ${S.cur < n - 1 ? `<button class="btn primary" onclick="pgo(S.cur+1)">다음 문제</button>` : `<button class="btn primary" onclick="practiceDone()">결과 보기</button>`}</div>
    <p class="kbd">${S.timed ? `${q.s}과목 문항당 ${QSEC[q.s] >= 60 ? "1분" : QSEC[q.s] + "초"} · 시간이 지나면 오답으로 처리됩니다 · ` : ""}키보드: 1–4 답 선택 · ←/→ 또는 Enter 이동</p>
  </article></div>`;
  if (isShort(i) && !answered) $("#sa").focus();
  ptick();
}
function answer(o) {
  if (S.ans[S.cur] !== null) return;
  const i = S.items[S.cur];
  if (isShort(i)) { o = String(o).trim(); if (!o) return; }
  S.ans[S.cur] = o; record(i, isRight(i, o)); renderPractice();
}
function pgo(k) { if (k < 0 || k >= S.items.length) return; S.cur = k; renderPractice(); $(".qcard").scrollIntoView({block:"start"}); }
function practiceDone() {
  clearInterval(timerId);
  const done = S.items.map((i, k) => k).filter(k => S.ans[k] !== null);
  if (!done.length) return home();
  S.items = done.map(k => S.items[k]); S.ans = done.map(k => S.ans[k]);
  S.kind = "practice"; S.mode = "result"; S.flags = new Set(); S.used = 0;
  scoreUp();
  reviewFilter = "ng"; renderResult(); scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!S || $("#modal").innerHTML || e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = e.target.tagName === "INPUT";
  if (S.mode === "exam") {
    if (typing) { if (e.key === "Enter") go(S.cur + 1); return; }
    if ("1234".includes(e.key) && e.key) pick(+e.key - 1);
    else if (e.key === "ArrowRight") go(S.cur + 1);
    else if (e.key === "ArrowLeft") go(S.cur - 1);
    else if (e.key === "f" || e.key === "F") flag();
  } else if (S.mode === "practice") {
    if (typing) return;
    if ("1234".includes(e.key) && e.key && !isShort(S.items[S.cur])) answer(+e.key - 1);
    else if (e.key === "ArrowRight" || (e.key === "Enter" && S.ans[S.cur] !== null)) S.cur < S.items.length - 1 ? pgo(S.cur + 1) : practiceDone();
    else if (e.key === "ArrowLeft") pgo(S.cur - 1);
  }
});

home();
</script>
