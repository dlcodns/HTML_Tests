s":2,"b":"아래 SQL에 대한 결과 설명으로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["B가 NULL이 아니면 항상 B 값을 반환한다.","A와 B가 NULL일 경우 100을 반환한다.","A가 NULL일 경우에는 언제나 50 * B를 반환한다.","A가 NULL이 아닐 경우 A 값을 반환한다."],"a":3,"g":1,"m":1},{"id":"54-21","r":54,"n":21,"s":2,"b":"다음 NATURAL JOIN 결과에 대한 설명으로 가장 적절한 것은?\n\nTAB_A\n\n| KEYA | COL1 | COL2 |\n|---|---|---|\n| 1 | A | 가 |\n| 2 | A | 가 |\n| 5 | C | 다 |\n\nTAB_B\n\n| KEYB | COL1 | COL2 |\n|---|---|---|\n| 1 | A | 가 |\n| 3 | C | 다 |","x":"COL1·COL2가 모두 같은 행끼리 조인되어 (1,A,가)×2 + (C,다) 1 = 3건이다.","o":["COL1, COL2가 모두 같은 행이 조인되어 3건이 출력된다.","KEYA와 KEYB가 같아야만 조인되므로 1건만 출력된다.","NATURAL JOIN은 항상 카테시안 곱을 생성한다.","동일 이름 컬럼이 없어 오류가 발생한다."],"a":0},{"id":"54-22","r":54,"n":22,"s":2,"b":"INNER JOIN 결과에서 KIM이라는 이름이 중복으로 출력되는 상황에 대한 설명으로 가장 적절한 것은?","x":"조인 조건을 만족하는 조합이 여러 개면 같은 값이 여러 번 나온다.","o":["조인 조건을 만족하는 행 조합이 여러 개이면 같은 값이 중복 출력될 수 있다.","INNER JOIN은 중복 행을 자동으로 제거한다.","INNER JOIN은 항상 한 테이블의 행 수만큼만 출력된다.","중복 이름이 있으면 SQL은 반드시 오류가 발생한다."],"a":0},{"id":"54-23","r":54,"n":23,"s":2,"b":"LEFT OUTER JOIN 결과로 SMITH 행의 오른쪽 테이블 컬럼이 NULL로 출력되었다. 이에 대한 설명으로 가장 적절한 것은?","x":"LEFT OUTER JOIN에서 오른쪽에 짝이 없으면 오른쪽 컬럼이 NULL로 나온다.","o":["SMITH 행은 왼쪽 테이블에는 존재하지만 오른쪽 테이블에는 조인 조건을 만족하는 행이 없다.","SMITH 행은 오른쪽 테이블에만 존재한다.","LEFT OUTER JOIN에서는 매칭되지 않은 왼쪽 행이 모두 제거된다.","NULL이 출력되면 SQL 문법 오류이다."],"a":0},{"id":"54-25","r":54,"n":25,"s":2,"b":"제약 조건에 대한 설명으로 적절하지 않은 것은?","x":"UNIQUE는 NULL을 허용한다.","o":["PK는 NOT NULL이다.","FK는 부모 테이블의 기본키 또는 고유키를 참조할 수 있다.","UK는 항상 NOT NULL이다.","CHECK는 특정 조건을 만족하는 값만 허용한다."],"a":2},{"id":"54-26","r":54,"n":26,"s":2,"b":"아래 SQL과 같은 결과를 반환하는 SQL로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["SELECT * FROM A WHERE EXISTS (SELECT 1 FROM B WHERE A.성별 = B.성별 AND A.번호 = B.번호)","SELECT * FROM A JOIN B ON A.성별 = B.성별","SELECT * FROM A WHERE A.성별 IN (SELECT B.성별 FROM B)","SELECT * FROM A WHERE 번호 = ALL (SELECT 번호 FROM B WHERE A.성별 = B.성별)"],"a":0,"g":1,"m":1},{"id":"54-27","r":54,"n":27,"s":2,"b":"아래 SQL 결과로 알맞은 것은?\n- TAB_A.COL1: 1, 2, NULL\n- TAB_B.COL2: 1, 2, 3\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["NULL","0","1","전체 건수"],"a":2,"g":1,"m":1},{"id":"54-28","r":54,"n":28,"s":2,"b":"아래 SQL 결과로 알맞은 것은?\nTAB.COL: A, B, C, NULL\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["A, B, C, NULL","A, B","A, B, NULL","NULL"],"a":0,"g":1,"m":1},{"id":"54-29","r":54,"n":29,"s":2,"b":"아래 SQL 결과로 알맞은 것은?\n\n| 나이_그룹 | 나이 |\n|---|---|\n| 1 | 10 |\n| 1 | 10 |\n| 2 | 20 |\n| 2 | 20 |\n| 3 | 30 |\n| 3 | 30 |\n| 3 | NULL |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 그룹별 AVG(나이)라면 NULL을 제외해 10, 20, 30이다.","o":["10, 20, 25","10, 20, NULL","10, 20, 30","10, 20, 20"],"a":2,"g":1,"m":1},{"id":"54-30","r":54,"n":30,"s":2,"b":"아래 결과를 출력하기 위한 GROUPING SETS 절로 가장 적절한 것은?\n- 상세 집계: COL1, COL2별 집계\n- 추가 집계: COL2별 집계만 출력\n- COL1만 기준인 소계는 출력하지 않는다.","x":"(COL1,COL2)와 (COL2)만 집계하므로 GROUPING SETS((COL1, COL2), (COL2))다.","o":["GROUP BY GROUPING SETS ((COL1, COL2), (COL2))","GROUP BY ROLLUP (COL1, COL2)","GROUP BY CUBE (COL1, COL2)","GROUP BY GROUPING SETS ((COL1), ())"],"a":0},{"id":"54-31","r":54,"n":31,"s":2,"b":"아래 Window Function 설명에 맞는 것은?\n> 파티션별 윈도우의 전체 건수에서 현재 행보다 작거나 같은 건수에 대한 누적 백분율을 구하는 함수","x":"현재 행 이하 건수의 누적 백분율은 CUME_DIST다.","o":["CUME_DIST","DENSE_RANK","RANK","PERCENT_RANK"],"a":0},{"id":"54-33","r":54,"n":33,"s":2,"b":"아래 SQL에서 EMPLOYEE_ID가 7780인 행의 결과로 알맞은 것은?\n\n| EMPLOYEE_ID | SALARY |\n|---|---|\n| 7780 | 4000 |\n| 7781 | 4000 |\n| 7782 | 3000 |\n| 7783 | 3000 |\n| 7784 | 2000 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["4, 4, 3","3, 3, 3","4, 4, 4","3, 4, 3"],"a":0,"g":1,"m":1},{"id":"54-34","r":54,"n":34,"s":2,"b":"강좌번호가 100, 101인 과목을 동시에 듣는 학번을 구하는 SQL로 알맞은 것은?","x":"같은 학번이 두 과목을 모두 들어야 하므로 INTERSECT로 교집합을 구한다.","o":["SELECT 학번 FROM 수강 WHERE 강좌번호 = 100 AND 강좌번호 = 101","SELECT 학번 FROM 수강 WHERE 강좌번호 = 100 INTERSECT SELECT 학번 FROM 수강 WHERE 강좌번호 = 101","SELECT 학번 FROM 수강 WHERE 강좌번호 IN (100, 101)","SELECT 학번 FROM 수강 WHERE 강좌번호 = 100 OR 101"],"a":1},{"id":"54-35","r":54,"n":35,"s":2,"b":"아래 결과를 출력하는 SQL의 빈칸에 적절한 것은?\n*(SQL 원문 누락)*\n> 조건: 자기보다 점수가 높은 행의 개수에 1을 더해 등수를 구한다.","x":"자기보다 높은 점수의 개수(T1.점수 \u003c T2.점수)에 1을 더하면 등수가 된다.","o":["(1) COUNT(*) + 1, (2) T1.점수 \u003c T2.점수","(1) COUNT(*), (2) T1.점수 = T2.점수","(1) RANK() + 1, (2) T1.점수 > T2.점수","(1) SUM(점수), (2) T1.점수 \u003c T2.점수"],"a":0,"m":1},{"id":"54-36","r":54,"n":36,"s":2,"b":"행이 2건인 테이블에서 결과가 다른 SQL은?","x":"ROWNUM = 2는 첫 행이 1을 받지 못해 0건이다. 나머지는 모두 1건이다.","o":["SELECT * FROM T WHERE ROWNUM \u003c= 1","SELECT * FROM T WHERE ROWNUM \u003c 2","SELECT * FROM T WHERE ROWNUM = 1","SELECT * FROM T WHERE ROWNUM = 2"],"a":3},{"id":"54-37","r":54,"n":37,"s":2,"b":"아래 UPDATE 구문에 대한 설명으로 가장 적절한 것은?\n> 조건: UPDATE 문에는 별도의 WHERE 절이 없다.\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["department_id가 60인 사원들의 월급을 10% 인상하는 쿼리이다.","UPDATE ... WHERE department_id = 60과 동일한 의미이다.","오류가 발생한다.","department_id가 60이 아닌 모든 사원들의 salary가 NULL로 수정된다."],"a":0,"g":1,"m":1},{"id":"54-38","r":54,"n":38,"s":2,"b":"아래 TABLE에 대한 SQL 수행 후 최종 SUM(COL1) 결과로 가장 적절한 것은?\n- COL1: PRIMARY KEY\n- COL2: CHECK (COL2 > 500)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["770","500","0","오류로 인해 모든 작업이 취소된다."],"a":0,"g":1,"m":1},{"id":"54-39","r":54,"n":39,"s":2,"b":"아래 SQL 결과로 알맞은 것은?\n> 조건: 부서1의 총매출은 18000이고, 부서2의 총매출은 11300이다.\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["부서1 18000, 부서2 11300","부서2 11300, 부서1 18000","부서1 11300, 부서2 18000","정렬 순서는 보장되지 않는다."],"a":0,"g":1,"m":1},{"id":"54-40","r":54,"n":40,"s":2,"b":"아래 SQL에 대한 결과로 알맞은 것은?\n> 조건: COL1이 NULL인 그룹에서는 COL2와 COL3 값이 모두 NULL이다.\n*(SQL 원문 누락)*","x":"모두 NULL인 그룹의 MIN, MAX, SUM은 NULL이다.","o":["COL1이 NULL인 그룹의 MIN, MAX, SUM 결과는 모두 NULL이다.","COL1이 NULL인 그룹의 MIN, MAX, SUM 결과는 모두 0이다.","COL1이 NULL인 그룹은 GROUP BY 결과에서 제외된다.","SUM(COL2 + COL3)은 NULL을 0으로 자동 변환하여 계산한다."],"a":0,"m":1},{"id":"54-41","r":54,"n":41,"s":2,"b":"아래 빈칸에 알맞은 명령어는?\n> 입력, 수정, 삭제한 데이터에 대해 전혀 문제가 없다고 판단됐을 경우 ( ) 명령어로 트랜잭션을 완료할 수 있다.","x":"트랜잭션을 확정하는 명령은 COMMIT이다.","o":["COMMIT","ROLLBACK","SAVEPOINT","REVOKE"],"a":0},{"id":"54-42","r":54,"n":42,"s":2,"b":"아래 SQL에 대한 설명으로 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. ORDER BY 계좌번호 DESC로 추정했다.","o":["계좌번호를 오름차순으로 정렬한다.","계좌번호를 내림차순으로 정렬한다.","ORDER BY 절이 있으므로 조인이 수행되지 않는다.","DESC는 NULL을 제외하는 조건이다."],"a":1,"g":1,"m":1},{"id":"54-43","r":54,"n":43,"s":2,"b":"테이블과 그 테이블에 종속된 제약조건 등 종속 객체까지 함께 삭제하는 명령어로 알맞은 것은?","x":"종속 객체까지 함께 삭제하는 것은 DROP ... CASCADE다.","o":["TRUNCATE","DROP CASCADE","DELETE","ALTER"],"a":1},{"id":"54-44","r":54,"n":44,"s":2,"b":"아래 SQL에 대한 결과로 알맞은 것은?\n*(SQL 원문 누락)*\n상품구분이 'C'인 행의 처리결과는?","x":"원문 SQL 누락. 결과값 추정.","o":["취급","보류","취급안함","NULL"],"a":2,"g":1,"m":1},{"id":"54-45","r":54,"n":45,"s":2,"b":"아래 SQL에 대한 설명으로 알맞은 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["COL1이 대문자 A로 시작하는 모든 행을 조회한다.","COL1이 A로 끝나는 모든 행을 조회한다.","COL1에 A가 포함되지 않은 행을 조회한다.","COL1의 두 번째 문자가 A인 행을 조회한다."],"a":0,"g":1,"m":1},{"id":"54-47","r":54,"n":47,"s":2,"b":"아래 SQL의 결과로 알맞은 것은?\n- 전체 행 수는 5건이다.\n- col1이 NULL이 아닌 행 수는 3건이다.\n- col2의 중복 제거 후 NULL이 아닌 값의 수는 2건이다.\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. COUNT(*) 5 + COUNT(col1) 3 + COUNT(DISTINCT col2) 2 = 10으로 추정했다.","o":["5","8","10","12"],"a":2,"g":1,"m":1},{"id":"54-48","r":54,"n":48,"s":2,"b":"단일행 함수에 대한 설명으로 적절하지 않은 것은?","x":"단일행 함수는 GROUP BY 절에도 쓸 수 있다.","o":["각 행에 개별적으로 적용된다.","여러 인자를 넣을 수 있다.","중첩 사용이 가능하다.","GROUP BY 절에는 사용할 수 없다."],"a":3},{"id":"54-49","r":54,"n":49,"s":2,"b":"INNER JOIN에 대한 설명 중 적절하지 않은 것은?","x":"ON 절을 쓰면 조인 컬럼명이 달라도 된다.","o":["조인 조건을 만족하는 행만 결과에 포함한다.","ON 절을 사용하여 조인 조건을 명시할 수 있다.","조인으로 사용되는 컬럼은 컬럼명이 반드시 같아야 한다.","조인 조건이 같음 비교이면 등가 조인으로 볼 수 있다."],"a":2},{"id":"54-50","r":54,"n":50,"s":2,"b":"아래 SQL에 대한 결과로 알맞은 것은?\n\nT1\n\n| col1 | col2 | col3 |\n|---|---|---|\n| 가 | A | 2 |\n| 나 | B | 3 |\n| 다 | C | NULL |\n\nT2\n\n| col1 | col2 |\n|---|---|\n| 2 | A |\n| 3 | C |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["결과 없음","가","나","다"],"a":0,"g":1,"m":1},{"id":"55-01","r":55,"n":1,"s":1,"b":"내부 스키마에 대한 설명으로 가장 적절한 것은?","x":"내부 스키마는 데이터가 물리적으로 저장되는 방법을 표현한다.","o":["사용자별로 바라보는 데이터베이스의 논리적 관점을 정의한다.","데이터베이스 전체의 통합된 논리적 구조를 정의한다.","데이터가 물리적 저장 장치에 실제로 저장되는 방법을 표현한다.","응용 프로그램에서 사용하는 화면 단위의 데이터 구조만 표현한다."],"a":2},{"id":"55-02","r":55,"n":2,"s":1,"b":"엔터티명에 대한 설명으로 적절하지 않은 것은?","x":"엔터티명은 가능하면 약어를 쓰지 않는다.","o":["가능하면 현업 업무에서 사용하는 용어를 사용한다.","가능하면 약어를 사용한다.","단수 명사를 사용한다.","모든 엔터티에서 유일하게 이름이 부여되어야 한다."],"a":1},{"id":"55-03","r":55,"n":3,"s":1,"b":"기본 엔터티에 대한 설명으로 적절하지 않은 것은?","x":"기본 엔터티는 자신의 주식별자를 스스로 가지며 상속받지 않는다.","o":["업무에 원래 존재하는 정보이다.","다른 엔터티와의 관계에 의해 생성되지 않고 독립적으로 생성 가능하다.","다른 엔터티로부터 주식별자를 상속받는다.","타 엔터티의 부모 역할을 할 수 있다."],"a":2},{"id":"55-04","r":55,"n":4,"s":1,"b":"다음 설명에 해당하는 정규화 단계로 가장 적절한 것은?\n> 복합 주식별자를 가진 테이블에서 일반 속성이 주식별자 전체가 아니라 일부 속성에만 종속되어 있어 이를 별도 테이블로 분리하였다.\n\n[그림: 수강(#학생ID, #과목ID, 과목명, 성적) — 과목명은 과목ID에만 종속 → 분리 → 수강(#학생ID, #과목ID, 성적) + 과목(#과목ID, 과목명)]","x":"주식별자 일부에만 종속되는 부분 종속을 분리하는 것은 제2정규화다.","o":["제1정규화","제2정규화","제3정규화","보이스-코드 정규화"],"a":1},{"id":"55-05","r":55,"n":5,"s":1,"b":"제1정규형에 대한 설명으로 적절하지 않은 것은?","x":"주식별자 전체에 종속되어야 한다는 것은 제2정규형의 조건이다.","o":["속성의 원자성을 만족해야 한다.","반복 속성이나 다중값 속성을 제거한다.","하나의 속성에는 하나의 값만 저장되도록 한다.","일반 속성은 주식별자 전체에 종속되어야 한다."],"a":3},{"id":"55-06","r":55,"n":6,"s":1,"b":"식별자 관계에 대한 설명으로 적절하지 않은 것은?","x":"식별자 관계도 1:1뿐 아니라 1:N이 될 수 있다.","o":["부모 엔터티의 식별자가 자식 엔터티의 주식별자에 포함된다.","자식 엔터티는 부모 엔터티에 존재 종속될 수 있다.","부모 엔터티와 자식 엔터티의 관계는 항상 1:1 관계이다.","부모 식별자와 자식 자체 식별자가 결합되어 자식의 주식별자를 구성할 수 있다."],"a":2},{"id":"55-07","r":55,"n":7,"s":1,"b":"트랜잭션의 특성 중 작업이 모두 수행되거나 모두 수행되지 않아야 한다는 성질은?","x":"모두 수행되거나 모두 수행되지 않는 성질은 원자성이다.","o":["원자성","일관성","고립성","지속성"],"a":0},{"id":"55-08","r":55,"n":8,"s":1,"b":"계층형 데이터 모델에 대한 설명으로 적절하지 않은 것은?","x":"계층형 모델은 일반적으로 1:N 관계로 표현한다.","o":["데이터를 트리 구조로 표현한다.","상위 레코드와 하위 레코드 간 부모-자식 관계를 가진다.","개체 간 관계는 일반적으로 1:N 구조로 표현된다.","개체 간 관계는 반드시 1:1 관계로만 표현된다."],"a":3},{"id":"55-09","r":55,"n":9,"s":1,"b":"다음 그림의 빈칸에 들어갈 데이터 모델링 구성 요소를 상위 개념부터 순서대로 나열한 것은?\n[그림: (가) —구성→ (나) —가짐→ (다) —실제 값→ (라) / 예시: 학생 (가) → 홍길동 (나), 학번 (다) → 20240001 (라)]","x":"학생(엔터티) → 홍길동(인스턴스) → 학번(속성) → 20240001(속성값).","o":["엔터티 - 인스턴스 - 속성 - 속성값","인스턴스 - 엔터티 - 속성값 - 속성","속성 - 엔터티 - 인스턴스 - 속성값","엔터티 - 속성값 - 인스턴스 - 속성"],"a":0},{"id":"55-10","r":55,"n":10,"s":1,"b":"두 엔터티 간 관계에서 참여자의 수를 표현하며 1:1, 1:M, M:N 등으로 나타내는 것은?","x":"참여자의 수(1:1, 1:M, M:N)는 관계 차수다.","o":["관계 선택성","관계 차수","식별자","속성 도메인"],"a":1},{"id":"55-11","r":55,"n":11,"s":2,"b":"서브쿼리에 대한 설명으로 적절하지 않은 것은?","x":"IN 절에는 여러 행을 반환하는 서브쿼리를 쓸 수 있다.","o":["서브쿼리는 SELECT, FROM, WHERE 절 등에서 사용할 수 있다.","IN 절에는 다중 행 서브쿼리를 사용할 수 있다.","단일 행 비교 연산자에는 단일 행 서브쿼리를 사용하는 것이 일반적이다.","IN 절은 단일 행 서브쿼리만 사용할 수 있다."],"a":3},{"id":"55-12","r":55,"n":12,"s":2,"b":"다음 중 DML(Data Manipulation Language)에 해당하는 명령어로만 묶인 것은?","x":"DML은 INSERT, UPDATE, DELETE(와 SELECT)다.","o":["CREATE, ALTER, DROP","INSERT, UPDATE, DELETE","GRANT, REVOKE, COMMIT","SELECT, CREATE, ROLLBACK"],"a":1},{"id":"55-13","r":55,"n":13,"s":2,"b":"다음 SQL에서 DENSE_RANK 함수의 결과에 대한 설명으로 적절한 것은?\n```sql\nSELECT 부서, 사원명, 급여,\n       DENSE_RANK() OVER(PARTITION BY 부서 ORDER BY 급여 DESC) AS RNK\nFROM 사원;\n```\n동일 부서에서 급여 순위가 1, 2, 2로 발생한 다음 행의 순위는?","x":"DENSE_RANK는 순위를 건너뛰지 않으므로 다음은 3이다.","o":["3","4","1","NULL"],"a":0},{"id":"55-14","r":55,"n":14,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nCREATE TABLE TAB1 (COL1 VARCHAR2(10), COL2 NUMBER);\nINSERT INTO TAB1 VALUES('A',100);\nINSERT INTO TAB1 VALUES('B',200);\nINSERT INTO TAB1 VALUES('C',300);\nINSERT INTO TAB1 VALUES('C',400);\n\nSELECT COUNT(*)\nFROM (\n    SELECT COL1, SUM(COL2)\n    FROM TAB1\n    GROUP BY ROLLUP(COL1), COL1\n);\n```","x":"GROUP BY ROLLUP(COL1), COL1은 (COL1) 집합이 두 번 생겨 A·B·C가 각각 2행, 총 6행이다.","o":["3","4","6","7"],"a":2},{"id":"55-15","r":55,"n":15,"s":2,"b":"다음 SQL에서 오류가 발생하는 원인으로 가장 적절한 것은?\n```sql\nCREATE TABLE 1234_TABLE (\n    COL1 NUMBER\n);\n```","x":"Oracle 테이블명은 문자로 시작해야 한다.","o":["테이블명은 숫자로 시작할 수 없다.","NUMBER 타입은 테이블 생성 시 사용할 수 없다.","컬럼명은 반드시 소문자로 작성해야 한다.","CREATE TABLE 문에는 반드시 기본키가 있어야 한다."],"a":0},{"id":"55-16","r":55,"n":16,"s":2,"b":"다음 중 다른 SQL들과 결과 집합이 다른 것은?","x":"GROUPING SETS((A,B),(A))에는 총계 ()가 없다.","o":["GROUP BY ROLLUP(A, B)","GROUP BY GROUPING SETS((A, B), (A), ())","GROUP BY A, B UNION ALL GROUP BY A UNION ALL GROUP BY ()","GROUP BY GROUPING SETS((A, B), (A))"],"a":3},{"id":"55-17","r":55,"n":17,"s":2,"b":"다음 GROUP BY 절과 동일한 그룹 집합을 생성하는 것은?\n```sql\nGROUP BY GROUPING SETS(ROLLUP(A), B)\n```","x":"ROLLUP(A)는 (A), ()이고 B가 더해져 (A), (B), ()다.","o":["GROUPING SETS((A), (B), ())","GROUPING SETS((A, B), (A), ())","GROUPING SETS((A), (B))","ROLLUP(A, B)"],"a":0},{"id":"55-18","r":55,"n":18,"s":2,"b":"다음 데이터와 SQL의 실행 결과로 가장 적절한 것은?\n\n| COL1 | COL2 |\n|---|---|\n| NULL | 10 |\n| 10 | 10 |\n| 10 | NULL |\n\n```sql\nSELECT COL1 * 2 + COL2 * 2 AS RESULT\nFROM TAB1;\n```","x":"NULL이 섞인 산술 연산은 NULL이다. 가운데 행만 20+20 = 40이다.","o":["20, 40, 20","NULL, 40, NULL","0, 40, 0","NULL, NULL, NULL"],"a":1},{"id":"55-19","r":55,"n":19,"s":2,"b":"다음 SQL에 대한 설명으로 적절한 것은?\n```sql\nSELECT NVL(SUM(C1) + SUM(C2), 0) AS RESULT\nFROM TAB1;\n```","x":"SUM은 NULL을 제외하고 집계한다.","o":["SUM 함수는 NULL 값을 0으로 변환한 뒤 집계한다.","SUM 함수는 NULL 값을 제외하고 집계하며, 각 컬럼의 SUM 결과를 더한다.","NULL이 하나라도 있으면 SUM(C1)과 SUM(C2)는 항상 NULL이다.","NVL은 집계 전에 각 행의 NULL 값을 제거한다."],"a":1},{"id":"55-20","r":55,"n":20,"s":2,"b":"다음 두 테이블 T1, T2를 ID 기준으로 조인할 때, 결과 건수로 가장 적절한 것은?\n\nT1\n\n| ID | NAME |\n|---|---|\n| 1 | A |\n| 2 | B |\n| 3 | C |\n\nT2\n\n| ID | DEPT |\n|---|---|\n| 3 | X |\n| 4 | Y |\n| 5 | Z |\n\nLEFT, FULL, RIGHT OUTER JOIN의 결과 건수를 순서대로 나열한 것은?","x":"LEFT 3, FULL 5(1·2·3·4·5), RIGHT 3이다.","o":["3, 3, 5","3, 5, 3","5, 3, 3","5, 5, 3"],"a":1},{"id":"55-21","r":55,"n":21,"s":2,"b":"다음과 같은 조인 구조에서 최종 결과 건수로 가장 적절한 것은?\n```sql\nSELECT COUNT(*)\nFROM T1\n     LEFT OUTER JOIN T2 ON T1.ID = T2.ID\n     LEFT OUTER JOIN T3 ON T1.ID = T3.ID\n     INNER JOIN T4 ON T1.ID = T4.ID;\n```\n- T1(ID, NAME): (1, A), (2, B), (3, C)\n- T2(ID, COL): (1, a)\n- T3(ID, COL): (2, b)\n- T4(ID, COL): (3, c)","x":"T4와의 INNER JOIN에서 ID 3만 남아 1건이다.","o":["0건","1건","3건","5건"],"a":1},{"id":"55-22","r":55,"n":22,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT REGEXP_INSTR('12345678', '(123)(4(56)(78))', 1, 1, 0, 'i', 2)\nFROM DUAL;\n```","x":"두 번째 괄호 그룹 (4(56)(78))은 4번째 글자에서 시작한다.","o":["1","2","4","6"],"a":2},{"id":"55-23","r":55,"n":23,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT REGEXP_SUBSTR('abcd', 'b\\*c') AS COL1,\n       REGEXP_SUBSTR('abcd', 'b*c') AS COL2\nFROM DUAL;\n```","x":"'b\\*c'는 실제 문자 b*c라서 없으므로 NULL, 'b*c'는 'bc'와 매칭된다.","o":["NULL, bc","bc, NULL","bc, bc","NULL, NULL"],"a":0},{"id":"55-24","r":55,"n":24,"s":2,"b":"계층형 쿼리에서 최상위 관리자를 시작으로 사원번호에서 관리자번호 방향으로 하위 직원을 조회하려고 한다. CONNECT BY 절로 가장 적절한 것은?\n```sql\nSELECT 사원번호, 관리자번호\nFROM 사원\nSTART WITH 관리자번호 IS NULL\nCONNECT BY ________;\n```","x":"부모의 사원번호(PRIOR)가 자식의 관리자번호와 같아야 하위로 전개된다.","o":["PRIOR 사원번호 = 관리자번호","사원번호 = PRIOR 관리자번호","PRIOR 관리자번호 = 관리자번호","사원번호 = 관리자번호"],"a":0},{"id":"55-25","r":55,"n":25,"s":2,"b":"다음 SQL에 대한 설명으로 가장 적절한 것은?\n```sql\nSELECT *\nFROM (\n    SELECT ROW_NUMBER() OVER(ORDER BY 점수 DESC) AS RN,\n           이름,\n           점수\n    FROM 성적\n)\nWHERE RN \u003c= 2\nORDER BY RN DESC;\n```\n> 조건: 점수 상위 2명의 RN과 점수가 각각 RN=1, 점수=150 / RN=2, 점수=40이라고 할 때 최종 출력 순서는 어떻게 되는가?","x":"ORDER BY RN DESC이므로 RN 2가 먼저 나온다.","o":["RN=1, 점수=150 다음 RN=2, 점수=40","RN=2, 점수=40 다음 RN=1, 점수=150","점수 오름차순으로 전체 데이터 출력","RN 값과 무관하게 입력 순서대로 출력"],"a":1},{"id":"55-26","r":55,"n":26,"s":2,"b":"로그인 이력 테이블에서 사용자별 로그인 횟수를 집계하는 SQL에 대한 설명으로 적절하지 않은 것은?\n```sql\nSELECT USER_ID   AS ALIAS1,\n       LOGIN_DATE AS ALIAS2,\n       COUNT(*)   AS LOGIN_CNT\nFROM LOGIN_HISTORY\nGROUP BY USER_ID, LOGIN_DATE\nORDER BY ALIAS1, ALIAS2;\n```","x":"WHERE 절은 SELECT보다 먼저 처리되므로 SELECT 별칭을 쓸 수 없다.","o":["한 사용자가 5일간 하루 3회씩 로그인했다면 전체 로그인 이력은 15건이다.","Oracle에서 SELECT 절의 별칭을 ORDER BY 절에서 사용할 수 있다.","ORDER BY ALIAS1, ALIAS2는 ALIAS1 기준으로 먼저 정렬한 뒤 ALIAS2 기준으로 정렬한다.","WHERE 절에서도 SELECT 절에서 정의한 ALIAS1을 항상 그대로 사용할 수 있다."],"a":3},{"id":"55-27","r":55,"n":27,"s":2,"b":"컬럼 ALIAS에 대한 설명으로 적절하지 않은 것은?","x":"컬럼 별칭은 컬럼(표현식) 뒤에 쓴다.","o":["컬럼 별칭은 SELECT 절에서 컬럼 또는 표현식에 다른 이름을 부여할 때 사용한다.","AS 키워드를 사용하여 컬럼 별칭을 지정할 수 있다.","컬럼 별칭은 컬럼 앞뒤 어디에나 사용할 수 있다.","공백이나 특수문자가 포함된 별칭은 큰따옴표로 묶어 사용할 수 있다."],"a":2},{"id":"55-28","r":55,"n":28,"s":2,"b":"다음 WHERE 절의 논리 연산 해석으로 가장 적절한 것은?\n```sql\nWHERE 고객번호 = 'X'\n   OR 고객번호 = 'Y'\n  AND 상태 = '정상'\n  AND 등급 = 'A'\n```\n> 조건: 고객번호가 X인 행은 2건이고, 고객번호가 Y이면서 상태가 정상이고 등급이 A인 행은 3건이다.","x":"AND가 OR보다 먼저 계산되므로 X 2건 + (Y 조건) 3건 = 5건이다.","o":["(고객번호 = 'X' OR 고객번호 = 'Y') AND 상태 = '정상' AND 등급 = 'A'이므로 3건이다.","고객번호 = 'X' OR (고객번호 = 'Y' AND 상태 = '정상' AND 등급 = 'A')이므로 5건이다.","(고객번호 = 'X' OR 고객번호 = 'Y' OR 상태 = '정상') AND 등급 = 'A'이므로 2건이다.","고객번호 = 'X' AND 고객번호 = 'Y' AND 상태 = '정상' AND 등급 = 'A'이므로 0건이다."],"a":1},{"id":"55-29","r":55,"n":29,"s":2,"b":"'홍길동'의 자식의 자식 노드를 셀프 조인으로 조회하는 SQL로 가장 적절한 것은?","x":"홍길동의 자식 B, 그 자식 C를 셀프 조인 두 번으로 찾는다.","o":["SELECT B.EMPNO, B.ENAME, B.MGR FROM EMP A, EMP B WHERE A.ENAME = '홍길동' AND B.MGR = A.EMPNO","SELECT C.EMPNO, C.ENAME, C.MGR FROM EMP A, EMP B, EMP C WHERE A.ENAME = '홍길동' AND B.MGR = A.EMPNO AND C.MGR = B.EMPNO","SELECT A.EMPNO, A.ENAME, A.MGR FROM EMP A WHERE A.ENAME = '홍길동'","SELECT C.EMPNO, C.ENAME, C.MGR FROM EMP A, EMP C WHERE A.ENAME = '홍길동' AND A.MGR = C.EMPNO"],"a":1},{"id":"55-30","r":55,"n":30,"s":2,"b":"다음 중 오류가 발생하는 JOIN 구문으로 가장 적절한 것은?","x":"ON 절에는 (DEPARTMENT_ID)처럼 컬럼만 쓸 수 없다. 조건식이 필요하다.","o":["SELECT * FROM EMPLOYEES A INNER JOIN DEPARTMENTS B ON (DEPARTMENT_ID) WHERE A.DEPARTMENT_ID = 90","SELECT * FROM EMPLOYEES A INNER JOIN DEPARTMENTS B ON A.DEPARTMENT_ID = B.DEPARTMENT_ID WHERE A.DEPARTMENT_ID = 90","SELECT * FROM EMPLOYEES A INNER JOIN DEPARTMENTS B USING (DEPARTMENT_ID) WHERE DEPARTMENT_ID = 90","SELECT * FROM EMPLOYEES A NATURAL JOIN DEPARTMENTS B WHERE DEPARTMENT_ID = 90"],"a":0},{"id":"55-31","r":55,"n":31,"s":2,"b":"계약이 없는 고객을 찾는 SQL로 가장 적절한 것은?","x":"계약이 없는 고객은 NOT EXISTS로 찾는다.","o":["SELECT * FROM 고객 C WHERE EXISTS (SELECT 1 FROM 계약 K WHERE K.고객ID = C.고객ID)","SELECT * FROM 고객 C WHERE NOT EXISTS (SELECT 1 FROM 계약 K WHERE K.고객ID = C.고객ID)","SELECT * FROM 고객 C WHERE 고객ID = NULL","SELECT * FROM 고객 C WHERE 계약ID IS NOT NULL"],"a":1},{"id":"55-32","r":55,"n":32,"s":2,"b":"다음 ERD에 대한 설명으로 가장 적절한 것은?\n[그림: 고객(#고객ID, 고객명) 1:N 계약(#계약ID, 고객ID FK) 1:N 계약상세(#상세ID, 계약ID FK) / 고객 1명은 여러 계약을, 계약 1건은 여러 계약상세를 가질 수 있다.]\n\n고객과 계약상세를 계약을 통해 조인하여 COUNT(*)를 수행할 때, 고객별 필터 없이 전체 조인 결과를 집계하면 어떤 건수와 같아지는가?","x":"고객 1:N 계약 1:N 계약상세를 끝까지 조인하면 계약상세 건수와 같다.","o":["고객의 건수","계약의 건수","계약상세의 건수","항상 1건"],"a":2},{"id":"55-33","r":55,"n":33,"s":2,"b":"다음 SQL에서 최종 결과 컬럼명으로 가장 적절한 것은?\n```sql\nSELECT COL1 AS AAB, COL2 AS BBA\nFROM T1\nUNION ALL\nSELECT COL1 AS BBA, COL2 AS AAB\nFROM T2;\n```","x":"집합 연산 결과의 컬럼명은 첫 번째 SELECT 기준이다.","o":["AAB, BBA","BBA, AAB","COL1, COL2","첫 번째 행의 데이터 값에 따라 달라진다."],"a":0},{"id":"55-34","r":55,"n":34,"s":2,"b":"3회 이상 주문한 고객을 찾는 SQL의 HAVING 절로 가장 적절한 것은?","x":"집계 조건은 HAVING COUNT(구매번호) >= 3이다.","o":["HAVING COUNT(구매번호) >= 3","WHERE COUNT(구매번호) >= 3","HAVING 구매번호 >= 3","GROUP BY COUNT(구매번호) >= 3"],"a":0},{"id":"55-35","r":55,"n":35,"s":2,"b":"다음 SQL 중 오류가 발생하는 문장으로 가장 적절한 것은?\n```sql\nCREATE TABLE SQLD_55_34_01 (\n    COL1 VARCHAR2(50),\n    COL2 NUMBER,\n    COL3 VARCHAR2(50),\n    CONSTRAINT PK_01 PRIMARY KEY (COL1)\n);\n\nCREATE TABLE SQLD_55_34_02 (\n    COL4 VARCHAR2(50),\n    COL5 NUMBER,\n    COL1 VARCHAR2(50),\n    CONSTRAINT PK_02 PRIMARY KEY (COL4),\n    CONSTRAINT FK_02_01 FOREIGN KEY (COL1) REFERENCES SQLD_55_34_01(COL1)\n);\n\n-- 1\nINSERT INTO SQLD_55_34_01 VALUES ('A',100,'가');\n-- 2\nINSERT INTO SQLD_55_34_02 VALUES ('02_A',100,NULL);\n-- 3\nINSERT INTO SQLD_55_34_02 VALUES ('02_B',200,'A');\n-- 4\nUPDATE SQLD_55_34_02 SET COL1 = 'B' WHERE COL4 = '02_A';\n```","x":"부모 테이블에 없는 'B'로 FK 컬럼을 바꾸려 하면 참조 무결성 오류가 난다.","o":["1번 INSERT","2번 INSERT","3번 INSERT","4번 UPDATE"],"a":3},{"id":"55-36","r":55,"n":36,"s":2,"b":"다음 트랜잭션 수행 후 최종 반영되는 작업으로 가장 적절한 것은?\n```sql\n-- (가) SQL1 수행\nSAVEPOINT A;\n-- (나) SQL2 수행\nSAVEPOINT B;\n-- (다) SQL3 수행\nROLLBACK TO SAVEPOINT A;\n-- (라) SQL4 수행\n-- (마) SQL5 수행\nCOMMIT;\n```","x":"A로 롤백하면 SQL2·SQL3이 취소되고 SQL1, SQL4, SQL5가 커밋된다.","o":["가, 나, 다","가, 라, 마","나, 다, 라","다, 라, 마"],"a":1},{"id":"55-37","r":55,"n":37,"s":2,"b":"Oracle에서 다음 정렬 구문을 사용할 때 NULL 값의 기본 정렬 위치로 가장 적절한 것은?\n```sql\nORDER BY COL1 DESC\n```","x":"Oracle은 NULL을 가장 큰 값으로 보므로 DESC 정렬에서 맨 앞(NULLS FIRST)에 온다.","o":["NULLS FIRST","NULLS LAST","NULL 값은 항상 제외된다.","DBMS가 오류를 발생시킨다."],"a":0},{"id":"55-38","r":55,"n":38,"s":2,"b":"ROW LIMITING 절에 대한 설명으로 적절하지 않은 것은?","x":"WITH TIES는 마지막 행과 같은 값을 가진 행을 함께 반환한다.","o":["OFFSET은 건너뛸 행의 개수를 지정한다.","FETCH는 반환할 행의 개수나 백분율을 지정한다.","ONLY는 지정된 행의 개수나 백분율만큼만 반환한다.","WITH TIES는 첫 번째 행에 대한 동순위를 포함해서 반환한다."],"a":3},{"id":"55-39","r":55,"n":39,"s":2,"b":"집계 함수에 대한 설명으로 적절하지 않은 것은?","x":"COUNT(expr)는 NULL을 제외하고 센다.","o":["COUNT(*)는 NULL 포함 여부와 관계없이 행의 수를 센다.","COUNT(expr)는 expr이 NULL인 행을 제외하고 센다.","SUM(expr)는 NULL 값을 제외하고 합계를 계산한다.","COUNT(expr)는 NULL을 포함하여 센다."],"a":3},{"id":"55-40","r":55,"n":40,"s":2,"b":"각 행에 전체 합계와 부서별 합계를 함께 출력하는 SQL로 가장 적절한 것은?","x":"SUM() OVER()는 전체 합계, PARTITION BY DEPTNO는 부서 합계다.","o":["SELECT DEPTNO, SAL, SUM(SAL) OVER() AS 전체합계, SUM(SAL) OVER(PARTITION BY DEPTNO) AS 부서합계 FROM EMP","SELECT DEPTNO, SAL, SUM(SAL) AS 전체합계, SUM(SAL) AS 부서합계 FROM EMP","SELECT DEPTNO, SAL FROM EMP GROUP BY SUM(SAL)","SELECT DEPTNO, SAL, COUNT(*) OVER(PARTITION BY SAL) AS 전체합계 FROM EMP"],"a":0},{"id":"55-41","r":55,"n":41,"s":2,"b":"두 SQL 집합 A, B에 대해 UNION ALL의 결과를 개념적으로 표현한 것으로 가장 적절한 것은?","x":"UNION ALL은 중복을 모두 남기므로 UNION 결과에 교집합 부분이 한 번 더 포함된 것과 같다.","o":["UNION 결과와 INTERSECT 결과를 함께 포함한다.","UNION 결과에서 INTERSECT 결과를 제거한다.","INTERSECT 결과만 반환한다.","MINUS 결과만 반환한다."],"a":0},{"id":"55-42","r":55,"n":42,"s":2,"b":"다음 나눗셈 연산 결과로 가장 적절한 것은?\n- COL1 = 0, COL2 = 300인 행에서 COL1 / COL2\n- COL1 = 300, COL2 = 0인 행에서 COL1 / COL2\n- COL1 = 100, COL2 = NULL인 행에서 COL1 / COL2","x":"0/300 = 0, 300/0은 오류, 100/NULL은 NULL이다.","o":["0, ERROR, NULL","0, 0, NULL","NULL, ERROR, NULL","ERROR, ERROR, NULL"],"a":0},{"id":"55-43","r":55,"n":43,"s":2,"b":"테이블 구조는 유지하면서 로우만 삭제하는 명령어로 적절한 것은?","x":"DELETE와 TRUNCATE는 테이블 구조를 남기고 행만 지운다.","o":["DELETE, TRUNCATE","DROP, DELETE","ALTER, DROP","CREATE, TRUNCATE"],"a":0},{"id":"55-44","r":55,"n":44,"s":2,"b":"다음 SQL의 결과 건수로 가장 적절한 것은?\n과목.과목명: 물리학, 화학, 영어, 수학개론\n```sql\nSELECT COUNT(*)\nFROM 과목\nWHERE 과목명 LIKE '%학';\n```","x":"'학'으로 끝나는 물리학, 화학 2건이다.","o":["1건","2건","3건","4건"],"a":1},{"id":"55-45","r":55,"n":45,"s":2,"b":"NULL이 아닌 값을 찾는 조건으로 가장 적절한 것은?","x":"NULL이 아닌 값은 IS NOT NULL로 찾는다.","o":["= NULL","!= NULL","IS NOT NULL","NOT NULL = TRUE"],"a":2},{"id":"55-46","r":55,"n":46,"s":2,"b":"기존 테이블에 직장우편번호 정보를 저장할 컬럼을 추가하는 SQL로 가장 적절한 것은?","x":"ALTER TABLE ... ADD로 컬럼을 추가한다.","o":["ALTER TABLE 회원 ADD (OFFI_POST_NUMBER VARCHAR2(80));","UPDATE TABLE 회원 ADD OFFI_POST_NUMBER VARCHAR2(80);","CREATE COLUMN OFFI_POST_NUMBER VARCHAR2(80) ON 회원;","INSERT COLUMN 회원 OFFI_POST_NUMBER VARCHAR2(80);"],"a":0},{"id":"55-47","r":55,"n":47,"s":2,"b":"참조 무결성을 구현하는 키로 가장 적절한 것은?","x":"참조 무결성은 외래키로 구현한다.","o":["기본키","외래키","후보키","대체키"],"a":1},{"id":"55-48","r":55,"n":48,"s":2,"b":"무결성에 대한 설명으로 적절하지 않은 것은?","x":"기본키 중복은 개체 무결성 위반이다.","o":["기본키에는 NULL이 들어갈 수 없다.","외래키는 부모 테이블에 존재하는 값을 참조해야 한다.","CHECK 제약조건은 도메인 무결성을 구현하는 데 사용할 수 있다.","기본키 중복 삽입 오류는 참조 무결성 위반이다."],"a":3},{"id":"55-49","r":55,"n":49,"s":2,"b":"다음 BETWEEN 조건과 결과가 다른 조건으로 가장 적절한 것은?\n```sql\nWHERE COL1 BETWEEN DATE '2024-01-01' AND DATE '2024-01-31'\n```","x":"양 끝값을 포함하지 않으므로 BETWEEN과 결과가 다르다.","o":["WHERE COL1 >= DATE '2024-01-01' AND COL1 \u003c= DATE '2024-01-31'","WHERE DATE '2024-01-01' \u003c= COL1 AND COL1 \u003c= DATE '2024-01-31'","WHERE COL1 > DATE '2024-01-01' AND COL1 \u003c DATE '2024-01-31'","WHERE COL1 BETWEEN DATE '2024-01-01' AND DATE '2024-01-31'"],"a":2},{"id":"55-50","r":55,"n":50,"s":2,"b":"다음 SQL의 IN 절에 대한 설명으로 적절하지 않은 것은?\n```sql\nSELECT *\nFROM 부서 D\nWHERE D.DEPTNO IN (\n    SELECT E.DEPTNO\n    FROM 사원 E\n    WHERE E.EMPNM IN ('JOHN', 'SMITH')\n);\n```","x":"IN은 다중 행 비교이므로 JOHN이 여러 명이어도 오류가 나지 않는다.","o":["서브쿼리가 여러 행을 반환해도 IN 절에서 비교할 수 있다.","서브쿼리 결과에 동일한 DEPTNO가 여러 번 나와도 IN 비교 자체는 가능하다.","JOHN이라는 이름의 사원이 두 명이면 반드시 오류가 발생한다.","IN은 목록 중 하나와 일치하는지 판단하는 연산자이다."],"a":2},{"id":"56-01","r":56,"n":1,"s":1,"b":"스키마의 종류로 옳지 않은 것은?","x":"3단계 스키마는 외부·개념·내부 스키마다.","o":["응용 스키마","외부 스키마","개념 스키마","내부 스키마"],"a":0},{"id":"56-02","r":56,"n":2,"s":1,"b":"데이터 모델링에 대한 설명으로 옳지 않은 것은?","x":"업무 규칙은 데이터 모델에 반영되어야 한다.","o":["업무에서 사용되는 모든 데이터를 포함해야 한다.","업무 규칙은 데이터 모델에 반영되어야 한다.","데이터 모델링은 업무 정보를 구조화하는 과정이다.","업무 규칙이 모델에 포함되지 않아도 된다."],"a":3},{"id":"56-03","r":56,"n":3,"s":1,"b":"발생 시점에 따라 구분할 수 있는 엔터티의 유형으로 적절하지 않은 것은?","x":"발생 시점 분류는 기본·중심·행위 엔터티다. 관계 엔터티는 해당하지 않는다.","o":["관계 엔터티","행위 엔터티","중심 엔터티","기본 엔터티"],"a":0},{"id":"56-04","r":56,"n":4,"s":1,"b":"다음 설명 중 옳지 않은 것은?\n*(그림 원문 누락 — 고객·상품·주문·주문상품 ERD로 보임)*","x":"주문상품은 주문과 상품의 관계로 생기는 엔터티로 독립적인 기본 엔터티가 아니다.","o":["고객과 상품은 기본 엔터티다.","주문은 사건 엔터티다.","주문 상품 엔터티는 주문과 상품의 관계에 의해 생성된다.","주문 상품 엔터티는 독립적으로 발생하는 기본 엔터티다."],"a":3,"g":1,"m":1},{"id":"56-05","r":56,"n":5,"s":1,"b":"다른 속성을 이용하여 결과를 도출하는 속성은?","x":"다른 속성으로 계산해 얻는 속성은 파생 속성이다.","o":["설계 속성","기본 속성","파생 속성","관계 속성"],"a":2},{"id":"56-06","r":56,"n":6,"s":1,"b":"다음 설명 중 옳은 것을 모두 고르시오.\n가. 주소는 시, 군, 구 등으로 나눠지므로 복합 속성이다.\n나. 나이는 단순 속성이다.\n다. 주민번호는 단일 값 속성이다.\n라. 연락처는 휴대폰번호, 집 전화번호가 될 수 있기 때문에 다중 값 속성이다.","x":"주소는 복합, 나이는 단순, 주민번호는 단일값, 연락처는 다중값 속성으로 모두 옳다.","o":["가, 라","가, 나, 다","나, 다, 라","가, 나, 다, 라"],"a":3},{"id":"56-07","r":56,"n":7,"s":1,"b":"다음 ERD와 관계 조건을 보고 옳지 않은 것을 고르시오.\n[그림: 병원 —ㄱ— 의사 —ㄴ— 수술, 병원 —ㄷ— 수술(직접 관계)]\n관계 조건:\n- 병원은 0명 이상의 의사를 둘 수 있다.\n- 의사는 반드시 1개의 병원에 소속된다.\n- 의사는 0건 이상의 수술을 집도할 수 있다.\n- 수술은 담당 의사 없이 등록될 수 있다.\n- ㄱ은 병원-의사 관계, ㄴ은 의사-수술 관계, ㄷ은 병원-수술을 직접 연결한 관계이다.","x":"ㄷ은 의사 없이도 수술과 병원을 연결하므로 ㄱ+ㄴ과 의미가 다르다.","o":["ㄷ은 ㄱ과 ㄴ을 합한 것과 의미가 같다.","의사가 없는 병원이 있을 수 있다.","수술이 없는 의사가 있을 수 있다.","의사가 집도하지 않는 수술이 있을 수 있다."],"a":0},{"id":"56-08","r":56,"n":8,"s":1,"b":"업무에 의해 만들어진 식별자로 옳은 것은?","x":"업무에 의해 자연스럽게 만들어진 식별자는 본질식별자다.","o":["외부식별자","내부식별자","본질식별자","인조식별자"],"a":2},{"id":"56-09","r":56,"n":9,"s":1,"b":"모든 일반 속성이 주식별자에 종속되어 있는 정규형은?","x":"모든 일반 속성이 주식별자 전체에 종속되는 것은 제2정규형이다.","o":["제1 정규형","제2 정규형","제3 정규형","보이스-코드정규형"],"a":1},{"id":"56-10","r":56,"n":10,"s":1,"b":"정규화에 대한 설명으로 옳지 않은 것은?","x":"정규화하면 중복이 줄어 오히려 유연성이 높아진다.","o":["정규화 시 유연성이 떨어진다.","일반 속성 간 종속을 제거하는 것은 제3 정규형이다.","반정규화는 데이터 중복으로 독립성이 떨어진다.","정규화를 과도하게 수행하면 조인이 늘어나 조회 성능이 저하될 수 있다."],"a":0},{"id":"56-11","r":56,"n":11,"s":2,"b":"우선순위가 가장 높은 연산자는?","x":"괄호가 가장 먼저 계산된다.","o":["비교","괄호","AND","OR"],"a":1},{"id":"56-12","r":56,"n":12,"s":2,"b":"다음 쿼리의 결과로 옳은 것은?\n\n| COL1 | COL2 |\n|---|---|\n| 1 | A |\n| 2 | B |\n| 3 | C |\n| 4 | D |\n| 1 | A |\n| 2 | B |\n| 3 | A |\n\n```sql\nSELECT COUNT(ALL COL1) FROM TAB1 WHERE COL2='A';\nSELECT COUNT(DISTINCT COL1) FROM TAB1;\n```","x":"COL2 = 'A'인 COL1은 1, 1, 3으로 3개이고, 서로 다른 COL1은 1~4의 4개다.","o":["2, 3","3, 3","3, 4","4, 4"],"a":2},{"id":"56-13","r":56,"n":13,"s":2,"b":"다음 두 테이블에 대해 결과 건수가 가장 많은 조인을 고르시오.\n- A.ID: 1, 2, 3\n- B.ID: 2, 3, 4","x":"FULL OUTER JOIN은 1, 2, 3, 4의 4행으로 가장 많다.","o":["SELECT * FROM A INNER JOIN B ON A.ID = B.ID","SELECT * FROM A LEFT OUTER JOIN B ON A.ID = B.ID","SELECT * FROM A RIGHT OUTER JOIN B ON A.ID = B.ID","SELECT * FROM A FULL OUTER JOIN B ON A.ID = B.ID"],"a":3},{"id":"56-14","r":56,"n":14,"s":2,"b":"다음 중 결과가 다른 것은?","x":"①은 COL3 >= 200 AND COL4 \u003c= 200이고, 나머지는 모두 COL3 \u003c= 200 AND COL4 >= 200이다.","o":["COL3 >= 200 AND COL4 \u003c= 200","NOT (200 \u003c COL3 OR 200 > COL4)","200 BETWEEN COL3 AND COL4","COL3 \u003c= 200 AND COL4 >= 200"],"a":0},{"id":"56-15","r":56,"n":15,"s":2,"b":"다음 중 결과로 옳은 것은?\n\n| COL1 | COL2 |\n|---|---|\n| 1 | 10 |\n| 1 | 20 |\n| 2 | 30 |\n| 3 | 40 |\n| 3 | 50 |\n\n```sql\nSELECT MAX(COL2) KEEP(DENSE_RANK FIRST ORDER BY COL1) FROM TAB1;\n```","x":"COL1이 가장 작은 1인 행들 중 COL2의 최댓값은 20이다.","o":["10","20","40","60"],"a":1},{"id":"56-16","r":56,"n":16,"s":2,"b":"다음 쿼리 문의 실행 결과로 옳은 것은?\n```sql\nSELECT COALESCE(NULL, NULL, 'S', NULL, 'QL') FROM DUAL;\n```","x":"COALESCE는 처음으로 NULL이 아닌 'S'를 반환한다.","o":["S","SQL","NULL","오류가 발생한다."],"a":0},{"id":"56-17","r":56,"n":17,"s":2,"b":"함수의 실행 결과로 옳은 것은?\n```sql\nCEIL(9.36)\nROUND(9.48)\nFLOOR(9.72)\n```","x":"CEIL(9.36) = 10, ROUND(9.48) = 9, FLOOR(9.72) = 9다.","o":["9, 9, 9","10, 9, 9","9, 9, 10","10, 10, 9"],"a":1},{"id":"56-18","r":56,"n":18,"s":2,"b":"업체 테이블의 물품 컬럼에는 'p'가 30건, 'q'가 40건, 'r'이 50건 저장되어 있다(총 120건, NULL 없음). 다음 두 쿼리의 실행 결과로 옳은 것은?\n```sql\nSELECT COUNT(DISTINCT 물품) FROM 업체;\nSELECT COUNT(*) FROM 업체 WHERE 물품 IN ('p', NULL);\n```","x":"서로 다른 물품은 3개이고, IN ('p', NULL)은 p 30건만 일치한다.","o":["3, 0","3, 30","3, 오류가 발생한다.","3, NULL"],"a":1},{"id":"56-19","r":56,"n":19,"s":2,"b":"교집합으로 옳은 것은?","x":"교집합은 INTERSECT다.","o":["UNION","INTERSECT","MINUS","EXCEPT"],"a":1},{"id":"56-20","r":56,"n":20,"s":2,"b":"TRUNCATE에 관한 설명으로 옳은 것은?","x":"TRUNCATE는 WHERE를 쓸 수 없어 특정 행만 지울 수 없다.","o":["데이터 구조와 데이터를 모두 삭제한다.","조건을 지정하여 일부 행만 삭제할 수 있다.","특정 행만 삭제하는 것은 불가능하다.","모든 행을 제거할 경우 DELETE보다 성능이 떨어진다."],"a":2},{"id":"56-21","r":56,"n":21,"s":2,"b":"주어진 결과를 보고 빈칸에 들어갈 쿼리로 알맞은 것은?\n\n| COL1 | COL2 |\n|---|---|\n| 1 | Smith |\n| 2 | Charlie |\n| 3 | Alice |\n| 4 | NULL |\n\n```sql\nSELECT COUNT(*) _______________;\n```\n결과: COUNT(*) = 4","x":"조건 없이 FROM TAB1 하면 NULL 포함 4건이다.","o":["FROM TAB1 WHERE COL2 LIKE '%*%'","FROM TAB1","FROM TAB1 WHERE COL2 LIKE '%*'","FROM TAB1 WHERE COL2 LIKE '*%'"],"a":1},{"id":"56-22","r":56,"n":22,"s":2,"b":"칼럼 값이 NULL일 때, 다음 중 반환 결과가 다른 것은?","x":"CASE 칼럼 WHEN NULL은 = 비교라 항상 거짓이므로 0이 나온다. 나머지는 -1이다.","o":["CASE 칼럼 WHEN NULL THEN -1 ELSE 0 END","CASE WHEN 칼럼 IS NULL THEN -1 ELSE 0 END","DECODE(칼럼, NULL, -1, 0)","NVL2(칼럼,0,-1)"],"a":0},{"id":"56-23","r":56,"n":23,"s":2,"b":"셀프조인을 수행할 수 있는 경우로 설명으로 옳은 것은?","x":"셀프 조인은 한 테이블 안의 컬럼끼리 연관이 있을 때 쓴다.","o":["두 테이블 내에 칼럼이 연관관계가 있는 경우","두 테이블 내에 연관관계는 없지만 Join이 필요할 때","한 테이블 내에 칼럼이 연관관계가 있는 경우","한 테이블 내에 연관관계는 없지만 Join이 필요할 때"],"a":2},{"id":"56-24","r":56,"n":24,"s":2,"b":"TAB1의 쿼리문 수행 결과로 옳은 것은?\nTAB1.COL1: a, b, c\n```sql\nSELECT COL1\n  FROM TAB1\n WHERE COL1 = 'z';\n\nSELECT MAX(COL1)\n  FROM TAB1\n WHERE COL1 = 'z';\n```","x":"조건에 맞는 행이 없으면 일반 조회는 공집합, 집계 함수(MAX)는 NULL 한 행이다.","o":["NULL, NULL","NULL, 공집합","공집합, NULL","공집합, 공집합"],"a":2},{"id":"56-25","r":56,"n":25,"s":2,"b":"함수의 실행 결과로 옳은 것은?\n```sql\nSELECT REGEXP_SUBSTR('aaaaabbbb', 'a{2,4}') FROM DUAL;\n```","x":"a{2,4}는 a를 최대 4개까지 탐욕적으로 매칭해 'aaaa'다.","o":["aaa","aaaa","ab","aab"],"a":1},{"id":"56-26","r":56,"n":26,"s":2,"b":"다음 중 중복을 제거한 합집합을 반환하는 집합 연산자는?","x":"중복을 제거한 합집합은 UNION이다.","o":["UNION","UNION ALL","INTERSECT","MINUS"],"a":0},{"id":"56-27","r":56,"n":27,"s":2,"b":"급여가 2000 이상인 사원 중 부서별 급여의 합계 금액이 높은 순으로 정렬하려고 할 때 아래 쿼리에서 고쳐야 할 부분은?\n\n| EMP_ID | DEPT_NAME | SALARY |\n|---|---|---|\n| 101 | HR | 2500 |\n| 102 | IT | 3000 |\n| 103 | IT | 2200 |\n| 104 | Sales | 1800 |\n| 105 | Sales | 2200 |\n| 106 | HR | 2000 |\n\n결과\n\n| DEPT_NAME | SUM(SALARY) |\n|---|---|\n| IT | 5200 |\n| HR | 4500 |\n| Sales | 2200 |\n\n```sql\nSELECT DEPT_NAME, SUM(SALARY) -- (가)\n  FROM EMP\n WHERE SALARY >= 2000         -- (나)\n GROUP BY DEPT_NAME           -- (다)\n ORDER BY SUM(SALARY)         -- (라)\n```","x":"높은 순으로 정렬하려면 ORDER BY SUM(SALARY) DESC여야 한다.","o":["(가)","(나)","(다)","(라)"],"a":3},{"id":"56-28","r":56,"n":28,"s":2,"b":"ROLLBACK에 관한 설명으로 옳지 않은 것은?","x":"COMMIT한 변경은 ROLLBACK으로 취소할 수 없다.","o":["ROLLBACK은 트랜잭션의 변경 내용을 취소할 수 있다.","SAVEPOINT를 지정하면 특정 저장점까지 롤백할 수 있다.","COMMIT 이전으로 롤백할 수 있다.","COMMIT이 완료된 변경 사항도 일반적으로 ROLLBACK으로 취소할 수 있다."],"a":3},{"id":"56-29","r":56,"n":29,"s":2,"b":"SQL문의 논리적 연산 순서로 옳은 것은?","x":"FROM - WHERE - GROUP BY - HAVING - SELECT - ORDER BY 순이다.","o":["SELECT - FROM - WHERE - GROUP BY - HAVING - ORDER BY","WHERE - FROM - HAVING - GROUP BY - SELECT - ORDER BY","FROM - WHERE - GROUP BY - HAVING - SELECT - ORDER BY","FROM - WHERE - HAVING - GROUP BY - SELECT - ORDER BY"],"a":2},{"id":"56-30","r":56,"n":30,"s":2,"b":"다음 빈칸에 들어갈 함수로 옳은 것은?\n\n| NAME | SALARY |\n|---|---|\n| Alice | 5000 |\n| Bob | 7000 |\n| Charlie | 3000 |\n| David | 6000 |\n| Smith | 7000 |\n\n```sql\nSELECT NAME, SALARY, ________ OVER (ORDER BY SALARY DESC) AS RANKING\n  FROM TAB1;\n```\n결과\n\n| NAME | SALARY | RANKING |\n|---|---|---|\n| Bob | 7000 | 1 |\n| Smith | 7000 | 1 |\n| David | 6000 | 2 |\n| Alice | 5000 | 3 |\n| Charlie | 3000 | 4 |","x":"동점 1위 다음이 2위이므로 DENSE_RANK다.","o":["DENSE_RANK()","RANK()","PERCENT_RANK()","ROW_NUMBER()"],"a":0},{"id":"56-31","r":56,"n":31,"s":2,"b":"트랜잭션의 모든 작업이 성공적으로 완료되거나 전혀 수행되지 않아야 하는 특징은?","x":"전부 성공하거나 전부 실패하는 것은 원자성이다.","o":["원자성","고립성","일관성","지속성"],"a":0},{"id":"56-32","r":56,"n":32,"s":2,"b":"두 테이블의 데이터가 아래와 같을 때 결과 값(반환된 행의 COL2 합)으로 옳은 것은?\n\nTAB1\n\n| COL1 | COL2 |\n|---|---|\n| A | 10 |\n| B | 20 |\n| C | 30 |\n\nTAB2\n\n| COL1 | COL2 |\n|---|---|\n| A | 20 |\n| B | 20 |\n| C | NULL |\n\n```sql\nSELECT *\n  FROM TAB1\n WHERE (COL1, COL2) NOT IN (SELECT COL1, COL2 FROM TAB2);\n```","x":"(A,10)만 남는다. (C,30)은 (C,NULL)과의 비교가 UNKNOWN이라 제외된다. 합은 10이다.","o":["0","10","20","40"],"a":1},{"id":"56-33","r":56,"n":33,"s":2,"b":"주어진 쿼리문과 결과가 동일한 것은?\n```sql\nUPDATE TAB1 T1\n   SET COL1 = (SELECT MAX(NULL)\n                 FROM TAB2 T2\n                WHERE T1.COL1 = T2.COL2\n                  AND T1.COL1 >= 200);\n```","x":"MAX(NULL)은 항상 NULL이므로 모든 행이 NULL로 갱신된다.","o":["UPDATE TAB1 SET COL1 = (SELECT MAX(COL2) FROM TAB2 T2 WHERE T1.COL1 = T2.COL2 AND T1.COL1 >= 200);","UPDATE TAB1 SET COL1 = (SELECT COALESCE(MAX(NULL), 0) FROM TAB2 T2 WHERE T1.COL1 = T2.COL2);","UPDATE TAB1 SET COL1 = (SELECT MAX(0) FROM TAB2 T2 WHERE T1.COL1 = T2.COL2 AND T1.COL1 >= 200);","UPDATE TAB1 SET COL1 = NULL;"],"a":3},{"id":"56-34","r":56,"n":34,"s":2,"b":"사원의 관리자와 차상위관리자를 함께 출력하는 쿼리문으로 옳은 것은?","x":"사원의 MGR_ID로 관리자를, 관리자의 MGR_ID로 차상위관리자를 찾는다.","o":["사원 A LEFT OUTER JOIN 관리자 B ON A.MGR_ID = B.EMP_ID LEFT OUTER JOIN 차상위관리자 C ON B.MGR_ID = C.EMP_ID","사원 A LEFT OUTER JOIN 관리자 B ON A.EMP_ID = B.EMP_ID LEFT OUTER JOIN 차상위관리자 C ON A.MGR_ID = C.MGR_ID","사원 A LEFT OUTER JOIN 관리자 B ON A.EMP_ID = B.MGR_ID LEFT OUTER JOIN 차상위관리자 C ON B.EMP_ID = C.MGR_ID","사원 A LEFT OUTER JOIN 관리자 B ON A.EMP_ID = B.EMP_ID LEFT OUTER JOIN 차상위관리자 C ON B.EMP_ID = C.EMP_ID"],"a":0},{"id":"56-35","r":56,"n":35,"s":2,"b":"테이블 데이터가 각각 10개 있을 때 수행 결과는?\n```sql\nSELECT COUNT(*) FROM TAB1, TAB2;\n```","x":"조인 조건이 없으면 10 × 10 = 100행이다.","o":["10","20","100","오류가 발생한다."],"a":2},{"id":"56-36","r":56,"n":36,"s":2,"b":"주어진 테이블에 대해 쿼리를 수행한 결과의 행 수(건수)로 옳은 것은?\n\nTAB1\n\n| ID | CUSTOMER |\n|---|---|\n| 1 | A |\n| 2 | B |\n| 3 | C |\n\nTAB2\n\n| C_ID | PHONE |\n|---|---|\n| A | 111-1111 |\n| A | 222-2222 |\n| B | 333-3333 |\n| C | 444-4444 |\n| D | 555-5555 |\n\n```sql\nSELECT * FROM TAB1 NATURAL JOIN TAB2;\n```","x":"같은 이름의 컬럼이 없어 NATURAL JOIN이 카티션 곱(3 × 5 = 15)이 된다.","o":["0","3","5","15"],"a":3},{"id":"56-37","r":56,"n":37,"s":2,"b":"주어진 결과를 출력하는 쿼리로 옳은 것은?\n\n| COL1 | COL2 |\n|---|---|\n| A | 10 |\n| A | 20 |\n| B | 20 |\n| C | 30 |\n\n결과: COUNT() = 2","x":"COL2 \u003c= 20인 행의 서로 다른 COL1은 A, B 2개다.","o":["SELECT COUNT(DISTINCT COL1) FROM TAB1 WHERE COL2 \u003c= 20","SELECT COUNT(COL1) FROM TAB1 WHERE COL2 \u003c= 20","SELECT COUNT(COL1) FROM TAB1 WHERE COL2 \u003c= 20 GROUP BY COL1","SELECT COUNT(COL1) FROM TAB1 WHERE COL2 \u003c 30 GROUP BY COL1"],"a":0},{"id":"56-38","r":56,"n":38,"s":2,"b":"제약조건에 관한 설명으로 옳은 것은?","x":"기본키는 UNIQUE이면서 NOT NULL이다.","o":["기본키는 한 칼럼에 하나의 속성만 가질 수 있다.","외래키는 한 칼럼에 여러 개의 속성을 가질 수 있다.","UNIQUE는 NULL을 허용하지 않는다.","기본키는 UNIQUE와 NOT NULL 조건을 모두 만족해야 한다."],"a":3},{"id":"56-39","r":56,"n":39,"s":2,"b":"다음 중 주어진 문자열 내에서 특정 패턴이 시작되는 위치를 정수로 반환하는 함수는?","x":"패턴이 시작되는 위치를 반환하는 것은 REGEXP_INSTR다.","o":["REGEXP_COUNT","REGEXP_LIKE","REGEXP_REPLACE","REGEXP_INSTR"],"a":3},{"id":"56-40","r":56,"n":40,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n\n| NAME | TEAM | HEIGHT |\n|---|---|---|\n| PARK | Tigers | 190 |\n| KIM | Bears | 180 |\n| LEE | Tigers | NULL |\n\n```sql\nSELECT NAME\nFROM PLAYER\nWHERE TEAM = 'Tigers'\n  AND HEIGHT > 185;\n```","x":"LEE는 HEIGHT가 NULL이라 비교가 UNKNOWN이 되어 제외된다.","o":["PARK","PARK, KIM","PARK, LEE","PARK, KIM, LEE"],"a":0},{"id":"56-41","r":56,"n":41,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n\n| BONUS | SALARY |\n|---|---|\n| 1000 | 3000 |\n| 1000 | 2500 |\n| NULL | 4000 |\n\n```sql\nSELECT AVG(BONUS), MIN(SALARY)\nFROM EMP;\n```","x":"AVG(BONUS)는 NULL을 빼고 1000, MIN(SALARY)는 2500이다.","o":["1000, 2000","1000, 3000","1000, 2500","NULL, 2500"],"a":2},{"id":"56-42","r":56,"n":42,"s":2,"b":"다음 쿼리에 대한 설명 중 옳은 것은?\n```sql\nSELECT 사원.사원명, 부서.부서명\nFROM 사원\n     JOIN 부서\n       ON 부서.부서ID = 사원.부서ID\n      AND 사원.등급 >= 2;\n```","x":"INNER JOIN이므로 부서에 조인되지 않는 사원은 제외된다.","o":["2등급 이상의 사원을 모두 출력한다.","부서에 소속되지 않은 사원은 제외한다.","모든 부서와 모든 사원을 조건 없이 출력한다.","등급 조건은 조인 결과에 영향을 주지 않는다."],"a":1},{"id":"56-43","r":56,"n":43,"s":2,"b":"아래 PLAYER 테이블에서 키(HEIGHT)가 180을 초과하는 선수를 조회하는 SQL로 가장 적절한 것은?\n\n| PLAYER_NAME | HEIGHT |\n|---|---|\n| 김선수 | 175 |\n| 이선수 | 180 |\n| 박선수 | 185 |\n| 최선수 | 192 |","x":"180 초과는 HEIGHT > 180이다.","o":["SELECT PLAYER_NAME FROM PLAYER","SELECT PLAYER_NAME FROM PLAYER WHERE HEIGHT \u003c 180","SELECT PLAYER_NAME FROM PLAYER WHERE HEIGHT > 180","SELECT PLAYER_NAME FROM PLAYER GROUP BY HEIGHT"],"a":2},{"id":"56-44","r":56,"n":44,"s":2,"b":"다음 UPDATE 쿼리의 동작에 대한 설명으로 옳은 것은?\n```sql\nUPDATE 선수 A\nSET (팀명, 키) = (\n    SELECT B.팀명, B.키\n    FROM 선수 B\n    WHERE B.팀명 = A.팀명\n      AND B.포지션 = 'G'\n      AND B.키 = (\n          SELECT MIN(C.키)\n          FROM 선수 C\n          WHERE C.팀명 = A.팀명\n            AND C.포지션 = 'G'\n      )\n);\n```","x":"같은 팀에 포지션 G가 없으면 서브쿼리가 NULL을 반환해 팀명·키가 NULL로 바뀐다.","o":["조건에 맞는 행의 기존 값을 그대로 유지한다.","팀별 최장신 선수의 팀명과 키로 갱신한다.","전체 선수 중 최단신 한 명의 값으로만 갱신한다.","같은 팀에 포지션 'G' 인 선수가 없으면 해당 행의 팀명·키가 NULL 로 갱신된다."],"a":3},{"id":"56-45","r":56,"n":45,"s":2,"b":"결과 값으로 옳은 것은?\n매출.금액: 300, 500, NULL\n```sql\nSELECT SUM(NVL(금액, 0)) AS RESULT\nFROM 매출;\n```","x":"NULL을 0으로 바꿔 더하므로 800이다.","o":["800","1600","2975","오류가 발생한다."],"a":0},{"id":"56-46","r":56,"n":46,"s":2,"b":"다음 중 NULL 값을 찾는 조건으로 옳은 것은?","x":"NULL은 IS NULL로 찾는다.","o":["COL1 IS NULL","COL1 = NULL","COL1 \u003c> NULL","COL1 IN (NULL)"],"a":0},{"id":"56-47","r":56,"n":47,"s":2,"b":"매출액이 높은 순서대로 직원별 총 매출액을 출력하려고 한다. 아래 SQL 에서 고쳐야 할 부분은?\n\n| EMP_ID | AMOUNT |\n|---|---|\n| 101 | 3000 |\n| 102 | 5000 |\n| 101 | 2500 |\n| 103 | 4000 |\n| 102 | 1500 |\n\n```sql\nSELECT EMP_ID, SUM(AMOUNT)   -- (가)\n  FROM SALES                 -- (나)\n WHERE AMOUNT > 0            -- (다)\n GROUP BY EMP_ID\n ORDER BY SUM(AMOUNT)        -- (라)\n```","x":"높은 순은 ORDER BY SUM(AMOUNT) DESC다.","o":["(가)","(나)","(다)","(라)"],"a":3},{"id":"56-48","r":56,"n":48,"s":2,"b":"아래와 같이 (A, B) 상세 집계, (A) 상위 단계 소계, 전체 합계 () 의 세 그룹 집합만 생성하는 GROUP BY 확장 기능으로 가장 적절한 것은?\n- (A, B) — 상세 집계\n- (A) — 상위 단계 소계\n- () — 전체 합계","x":"(A,B), (A), ()는 ROLLUP(A, B)다.","o":["CUBE(A, B)","ROLLUP(A, B)","GROUPING SETS((A, B), (B), ())","GROUPING(A, B)"],"a":1},{"id":"56-49","r":56,"n":49,"s":2,"b":"다음 중 부서별 소계, 직무별 소계, (부서, 직무)별 상세 집계, 전체 합계를 모두 함께 출력하기에 가장 적절한 것은?","x":"모든 조합의 소계와 총계는 CUBE다.","o":["ROLLUP()","GROUPING()","GROUPING SETS()","CUBE()"],"a":3},{"id":"56-50","r":56,"n":50,"s":2,"b":"결과 값으로 옳은 것은?\n```sql\nCREATE TABLE TAB1 (COL1 NUMBER, COL2 NUMBER);\nINSERT INTO TAB1 VALUES (1, 2);\nINSERT INTO TAB1 VALUES (2, 1);\nINSERT INTO TAB1 VALUES (3, 4);\nSAVEPOINT SP1;\n\nUPDATE TAB1 SET COL1=4 WHERE COL2\u003c=2;\nSAVEPOINT SP2;\n\nDELETE FROM TAB1 WHERE COL2=2;\nROLLBACK TO SAVEPOINT SP2;\n\nINSERT INTO TAB1 VALUES (4, 1);\nCOMMIT;\n\nSELECT COUNT(*) FROM TAB1 WHERE COL1=4;\n```","x":"SP2로 롤백하면 업데이트는 남아 COL1 = 4가 2행이고, (4,1)이 추가되어 3행이다.","o":["1","2","3","4"],"a":2},{"id":"57-01","r":57,"n":1,"s":1,"b":"아래 설명에서 설명하는 스키마 구조로 가장 적절한 것은?\n> 모든 사용자 관점을 통합한 조직 전체 관점의 통합적 표현이다.","x":"모든 사용자 관점을 통합한 조직 전체의 관점은 개념 스키마다.","o":["외부 스키마","개념 스키마","내부 스키마","논리 스키마"],"a":1},{"id":"57-02","r":57,"n":2,"s":1,"b":"다음 중 엔터티 생성 시점에 따른 분류가 아닌 것은?","x":"발생 시점 분류는 기본·중심·행위 엔터티다. 사건 엔터티는 유형/무형 분류다.","o":["기본 엔터티","중심 엔터티","사건 엔터티","행위 엔터티"],"a":2},{"id":"57-03","r":57,"n":3,"s":1,"b":"제1정규형을 만족시키기 위한 조치로 가장 적절한 것은?","x":"한 속성에 여러 값이 들어가지 않도록 별도 행이나 테이블로 분리한다.","o":["직원 속성에 두 개의 값이 들어 있으므로 직원1, 직원2 컬럼으로 나누어 저장한다.","하나의 속성에 여러 직원 값이 들어가지 않도록 직원 정보를 별도 행 또는 별도 테이블로 분리한다.","모든 테이블의 기본키를 제거한다.","계산 가능한 속성을 하나의 테이블에 모두 중복 저장한다."],"a":1},{"id":"57-04","r":57,"n":4,"s":1,"b":"다른 속성으로부터 계산이나 변형이 되어 생성되는 속성은 무엇인가?","x":"다른 속성으로 계산·변형되는 속성은 파생 속성이다.","o":["기본 속성","설계 속성","일반 속성","파생 속성"],"a":3},{"id":"57-05","r":57,"n":5,"s":1,"b":"주식별자에 관한 설명 중 틀린 것은?","x":"주식별자는 NULL이 될 수 없다(존재성).","o":["주식별자는 NULL이어도 된다.","주식별자는 유일해야 한다.","주식별자는 유일성을 만족하는 선에서 최소의 속성으로 구성되어야 한다.","주식별자는 자주 변하지 않아야 한다."],"a":0},{"id":"57-06","r":57,"n":6,"s":1,"b":"다음 ERD에 대한 설명으로 가장 적절한 것은?\n> 고객(고객ID, 고객명) 1 : N 계약(계약ID, 고객ID, 납부자ID) N : 1 납부자(납부자ID, 납부자명)\n> 계약은 고객과 납부자 사이에서 발생하는 업무 정보를 관리한다.","x":"계약은 고객과 납부자 사이에서 발생하는 업무 행위를 관리하는 행위 엔터티다.","o":["계약은 고객과 납부자 사이에서 발생하는 행위 엔터티로 볼 수 있다.","계약은 고객과 납부 사이의 단순 관계 테이블일 뿐 독립적인 업무 의미가 없다.","한 명의 고객이 여러 개의 계약에 가입할 경우 납부자로부터 반드시 식별자를 상속받아야 한다.","고객이 계약하고 납부하면 고객 테이블과 납부자 테이블은 항상 합칠 수 있다."],"a":0},{"id":"57-07","r":57,"n":7,"s":1,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n> 조건: 동일한 연락처를 가진 회원이 2명 존재하며, 서브쿼리는 회원ID 1002, 1003 두 행을 반환한다.\n```sql\nSELECT *\nFROM 회원\nWHERE 회원ID = (\n    SELECT 회원ID\n    FROM 회원\n    WHERE 연락처 = '010-1111-2222'\n);\n```","x":"= 연산자에 두 행을 반환하는 서브쿼리를 쓰면 단일 행 서브쿼리 오류가 난다.","o":["회원ID 1002만 조회된다.","회원ID 1003만 조회된다.","회원ID 1002와 1003이 모두 조회된다.","단일 행 서브쿼리가 여러 행을 반환하여 오류가 발생한다."],"a":3},{"id":"57-08","r":57,"n":8,"s":1,"b":"식별자에 대한 설명으로 적절하지 않은 것은?","x":"외래키로 받은 식별자는 외부 식별자다.","o":["내부 식별자는 엔터티 내부에서 스스로 생성된 식별자이다.","외부 식별자는 다른 엔터티와의 관계를 통해 받아온 식별자이다.","외래키(FK)는 항상 내부 식별자이다.","인조 식별자는 업무 식별자가 복잡하거나 부적절할 때 인위적으로 만든 식별자이다."],"a":2},{"id":"57-09","r":57,"n":9,"s":1,"b":"다음 ERD에 대한 설명으로 적절하지 않은 것은?\n> 학생(학생ID, 학생명) 1 : N 수강(학생ID, 과목ID) N : 1 과목(과목ID, 과목명)\n> 수강은 학생과 과목 사이의 M:N 관계를 해소하는 엔터티이다.","x":"과목은 학생과 무관하게 독립적으로 추가할 수 있다.","o":["학생은 여러 수강 내역을 가질 수 있다.","과목은 여러 수강 내역에 포함될 수 있다.","수강은 학생과 과목의 관계에서 발생하는 행위 엔터티로 볼 수 있다.","과목 인스턴스를 추가하려면 반드시 학생 인스턴스가 먼저 필요하다."],"a":3},{"id":"57-10","r":57,"n":10,"s":1,"b":"상품과 주문의 관계에 대한 설명 중 틀린 것은?","x":"상품은 주문되지 않을 수도 있으므로 주문이 무조건 포함되지는 않는다.","o":["상품에는 주문이 무조건 포함된다.","주문에는 주문 대상 상품이 포함될 수 있다.","하나의 상품은 여러 주문에 포함될 수 있다.","하나의 주문은 여러 상품을 포함할 수 있다."],"a":0},{"id":"57-11","r":57,"n":11,"s":2,"b":"다음 SQL의 ROW LIMITING 절에 대한 설명 중 옳은 것을 모두 고른 것은?\n```sql\nSELECT *\nFROM TAB1\nORDER BY NO DESC\nOFFSET 3 ROWS\nFETCH FIRST 5 ROWS ONLY;\n```\n가. NO를 내림차순으로 정렬한 뒤 일부 행을 반환한다.\n나. 3번째 ROW만 제외한다.\n다. 5개 이상 행이 나올 수 있다.","x":"3행을 건너뛰고 5행까지만 반환하므로 가만 옳다.","o":["가","나","가, 다","가, 나, 다"],"a":0},{"id":"57-12","r":57,"n":12,"s":2,"b":"SUBSTR 함수 실행 결과 중 다른 결과가 나오는 것을 고르시오.","x":"SUBSTR의 길이가 음수면 NULL이고, 나머지는 모두 'gh'다.","o":["SUBSTR('abcdefgh', 7)","SUBSTR('abcdefgh', -2)","SUBSTR('abcdefgh', 8, -2)","SUBSTR('abcdefgh', INSTR('abcdefgh', 'g'), 2)"],"a":2},{"id":"57-13","r":57,"n":13,"s":2,"b":"COMMIT에 대한 설명 중 틀린 것은?","x":"COMMIT 전에는 변경한 세션만 변경 내용을 볼 수 있다.","o":["COMMIT은 트랜잭션의 변경 내용을 영구적으로 반영한다.","COMMIT 전에도 같은 트랜잭션에서는 변경된 데이터를 SELECT로 확인할 수 있다.","COMMIT 전에 외부 사용자가 변경된 데이터를 항상 확인할 수 있다.","COMMIT 전에는 ROLLBACK을 통해 변경 내용을 취소할 수 있다."],"a":2},{"id":"57-14","r":57,"n":14,"s":2,"b":"NULL에 대한 설명으로 옳은 것은?","x":"집계 함수는 대부분 NULL을 제외한다.","o":["NULL은 0과 같은 의미다.","NULL은 대부분의 집계 함수에서 제외된다.","NULL = NULL은 TRUE이다.","바커 표기법에서는 NULL 허용 여부를 알 수 없으나, IE 표기법에서는 NULL 허용 여부를 알 수 있다."],"a":1},{"id":"57-15","r":57,"n":15,"s":2,"b":"다음 중 SQL 명령어 분류로 적절하지 않은 것은?","x":"DROP은 DML이 아니라 DDL이다.","o":["DDL : TRUNCATE","DML : DROP","DCL : REVOKE","TCL : COMMIT"],"a":1},{"id":"57-16","r":57,"n":16,"s":2,"b":"집합 연산자인 INTERSECT에 대한 설명으로 가장 적절한 것은?","x":"INTERSECT는 교집합이며 중복 행을 하나로 출력한다.","o":["여러 개의 SQL문 결과에 대한 합집합으로 중복된 행은 하나의 행으로 출력한다.","여러 개의 SQL문 결과에 대한 합집합으로 중복된 행도 그대로 결과로 출력한다.","여러 개의 SQL문 결과에 대한 교집합으로 중복된 행은 하나의 행으로 출력한다.","SQL문 결과 간의 차집합으로 중복된 행은 하나의 행으로 출력한다."],"a":2},{"id":"57-17","r":57,"n":17,"s":2,"b":"다음 중 서브쿼리의 결과로 여러 개의 컬럼이 반환되고, 이 결과가 메인 쿼리의 조건절에서 동시에 비교되는 서브쿼리의 유형은 무엇인가?","x":"여러 컬럼을 동시에 비교하는 것은 다중컬럼 서브쿼리다.","o":["단일행 서브쿼리","다중행 서브쿼리","단일컬럼 서브쿼리","다중컬럼 서브쿼리"],"a":3},{"id":"57-18","r":57,"n":18,"s":2,"b":"다음 두 테이블을 이용한 조건식 중 결과가 다른 것은?\n\n| TAB1.COL1 | TAB2.COL1 |\n|---|---|\n| A | A |\n| B | B |\n| C | NULL |\n\n> 조건: 두 컬럼을 비교하여 같은 값을 찾거나 다른 값을 찾는 조건식이다.","x":"\u003c>, NOT =, !=는 모두 0행이고, =만 A·B 2행을 반환한다.","o":["WHERE T1.COL1 \u003c> T2.COL1","WHERE NOT (T1.COL1 = T2.COL1)","WHERE T1.COL1 != T2.COL1","WHERE T1.COL1 = T2.COL1"],"a":3},{"id":"57-19","r":57,"n":19,"s":2,"b":"다음 정규표현식 메타문자 설명 중 적절한 것은?","x":"?는 0회 또는 1회다. *는 0회 이상, +는 1회 이상, {m,}은 m회 이상이다.","o":["? : 대상이 0회 또는 1회 반복되는지 확인한다.","* : 대상이 1회 이상 반복되는지 확인한다.","+ : 대상이 0회 또는 그 이상 반복되는지 확인한다.","{m,} : 대상이 0회 또는 그 이상 반복되는지 확인한다."],"a":0},{"id":"57-20","r":57,"n":20,"s":2,"b":"다음 윈도우 함수의 결과로 가장 적절한 것은?\n\n| ID | VAL |\n|---|---|\n| 1 | 1 |\n| 2 | 3 |\n| 3 | 5 |\n| 4 | 5 |\n| 5 | 5 |\n\n```sql\nSELECT ID, VAL,\n       COUNT(*) OVER(\n           ORDER BY VAL, ID\n           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n       ) AS CNT\nFROM T;\n```\nID가 3이고 VAL이 5인 행의 CNT 값은?","x":"VAL, ID 순으로 정렬하면 ID 3은 세 번째 행이므로 CNT는 3이다.","o":["1","2","3","5"],"a":2},{"id":"57-21","r":57,"n":21,"s":2,"b":"다음 중 최고 급여를 받는 직원을 구하는 조건으로 옳지 않은 것은?","x":">= ANY는 최솟값 이상이면 참이라 최고 급여자만 고를 수 없다.","o":["SAL >= ANY (SELECT SAL FROM EMP)","SAL >= ALL (SELECT SAL FROM EMP)","SAL = (SELECT MAX(SAL) FROM EMP)","SAL IN (SELECT MAX(SAL) FROM EMP)"],"a":0},{"id":"57-22","r":57,"n":22,"s":2,"b":"부서 ID가 100인 부서에서 시작하여 최상위부터 최하위 부서까지 출력하려고 한다. 계층형 질의의 CONNECT BY 조건으로 가장 적절한 것은?\n> 테이블: 부서(부서ID, 상위부서ID, 부서명)","x":"100에서 시작해 하위로 내려가려면 PRIOR 부서ID = 상위부서ID다.","o":["START WITH 부서ID = 100 CONNECT BY PRIOR 상위부서ID = 부서ID","START WITH 부서ID = 100 CONNECT BY PRIOR 부서ID = 상위부서ID","CONNECT BY PRIOR 상위부서ID = 부서ID","CONNECT BY 부서ID = PRIOR 상위부서ID"],"a":1},{"id":"57-23","r":57,"n":23,"s":2,"b":"부서별 평균 급여보다 높은 최대 급여를 가진 부서를 찾으려 한다. 모든 부서의 평균 급여보다 최대 급여가 큰 부서를 찾는 HAVING 절로 가장 적절한 것은?","x":"모든 부서 평균보다 커야 하므로 > ALL이다.","o":["HAVING MAX(SAL) > ANY (SELECT AVG(SAL) FROM EMP GROUP BY DEPTNO)","HAVING AVG(SAL) > ANY (SELECT MAX(SAL) FROM EMP GROUP BY DEPTNO)","HAVING MAX(SAL) > ALL (SELECT AVG(SAL) FROM EMP GROUP BY DEPTNO)","HAVING AVG(SAL) > ALL (SELECT AVG(SAL) FROM EMP GROUP BY DEPTNO)"],"a":2},{"id":"57-24","r":57,"n":24,"s":2,"b":"윈도우 함수 프레임에서 물리적인 행의 개수를 기준으로 범위를 지정하는 키워드는?","x":"물리적 행 개수 기준은 ROWS다.","o":["ROWS","RANGE","GROUPS","PARTITION"],"a":0},{"id":"57-25","r":57,"n":25,"s":2,"b":"다음 테이블에서 COL1 = COL2인 행의 개수를 구하라.\n\n| COL1 | COL2 |\n|---|---|\n| A | A |\n| B | C |\n| C | C |\n| NULL | NULL |\n| D | D |","x":"A, C, D 3행이다. NULL = NULL은 참이 아니다.","o":["1개","2개","3개","4개"],"a":2},{"id":"57-26","r":57,"n":26,"s":2,"b":"고유키와 기본키에 대한 설명으로 적절하지 않은 것은?","x":"고유키는 NULL을 여러 개 허용한다.","o":["고유키는 중복 값을 허용하지 않는 제약조건이며 NULL은 여러 개 올 수 없다.","기본키는 고유키와 NOT NULL 제약조건이 합쳐진 상태로 볼 수 있다.","기본키는 한 테이블에 하나만 지정할 수 있다.","고유키는 참조 무결성에서 참조 대상 후보가 될 수 있다."],"a":0},{"id":"57-27","r":57,"n":27,"s":2,"b":"아래의 SQL을 실행했을 경우 출력되지 않는 것은?\n```sql\nREGEXP_LIKE(문자열, '^[^mw][[:lower:]]*[u]*day$', 'i')\n```","x":"첫 글자가 m·w가 아니어야 하는데 Monday는 M으로 시작한다('i' 옵션으로 대소문자 무시).","o":["Monday","Sunday","Friday","Saturday"],"a":0},{"id":"57-28","r":57,"n":28,"s":2,"b":"테이블 컬럼과 제약조건 변경에 대한 설명으로 틀린 것은?","x":"NOT NULL 추가 조건은 NULL 값이 없어야 한다는 것이다. '중복이 아니어야 한다'는 틀린 설명이다.","o":["부적절한 DEFAULT 사용은 데이터 의미를 왜곡하거나 관리상 혼란을 줄 수 있다.","NUMBER형 컬럼의 크기는 데이터 손실이 없으면 늘릴 수 있지만, 줄일 때는 기존 데이터에 따라 제한될 수 있다.","NULL이 중복이 아니어야만 NOT NULL 제한조건을 사용할 수 있다.","NOT NULL 제약조건을 추가하려면 해당 컬럼에 NULL 값이 없어야 한다."],"a":2},{"id":"57-29","r":57,"n":29,"s":2,"b":"동일한 정렬값에 대해 같은 순위를 부여하되, 다음 순위는 건너뛰지 않고 연속된 순위를 부여하는 분석 함수는?","x":"동점에 같은 순위를 주고 다음 순위를 건너뛰지 않는 것은 DENSE_RANK다.","o":["DENSE_RANK","RANK","ROW_NUMBER","PERCENT_RANK"],"a":0},{"id":"57-30","r":57,"n":30,"s":2,"b":"Oracle 계층형 쿼리의 실행 순서와 관련된 설명으로 가장 적절한 것은?","x":"WHERE 절은 계층이 만들어진 뒤 조건에 맞지 않는 행을 걸러낸다.","o":["START WITH 절이 WHERE 절보다 항상 나중에 수행된다.","ORDER BY 절이 CONNECT BY 절보다 먼저 수행된다.","WHERE 절은 계층 구조가 만들어진 뒤 조건에 맞지 않는 행을 제거할 수 있다.","START WITH 절은 계층의 시작 행을 지정할 수 없다."],"a":2},{"id":"57-31","r":57,"n":31,"s":2,"b":"다음 중 중복을 제거한 값의 개수를 구하는 표현으로 가장 적절한 것은?","x":"COUNT(DISTINCT 컬럼명)이다.","o":["COUNT(DISTINCT 컬럼명)","DISTINCT COUNT(컬럼명)","COUNT(ALL DISTINCT 컬럼명)","UNIQUE COUNT(컬럼명)"],"a":0},{"id":"57-32","r":57,"n":32,"s":2,"b":"아래 두 테이블에서 LEFT JOIN, RIGHT JOIN, FULL OUTER JOIN, INNER JOIN을 각각 수행하여 생성되는 행 수의 총합을 구하라.\n\n| TAB1 | TAB2 |\n|---|---|\n| A | E |\n| B | F |\n| C | D |\n| G | G |\n\n> 조건: TAB1.COL = TAB2.COL 조건으로 조인한다.","x":"LEFT 4 + RIGHT 4 + FULL 7 + INNER 1 = 16행이다.","o":["14개","15개","16개","17개"],"a":2},{"id":"57-33","r":57,"n":33,"s":2,"b":"Oracle에서 점수가 높은 상위 10명을 정확히 조회하는 SQL로 가장 적절한 것은?","x":"인라인 뷰에서 정렬한 뒤 ROWNUM으로 잘라야 한다.","o":["SELECT * FROM EMP WHERE ROWNUM \u003c= 10 ORDER BY SAL DESC","SELECT * FROM (SELECT * FROM EMP ORDER BY SAL DESC) WHERE ROWNUM \u003c= 10","SELECT * FROM EMP WHERE ROWNUM > 10 ORDER BY SAL DESC","SELECT * FROM EMP ORDER BY SAL DESC WHERE ROWNUM \u003c= 10"],"a":1},{"id":"57-34","r":57,"n":34,"s":2,"b":"다음 SQL의 실행 결과는?\n```sql\nSELECT NVL(COUNT(*), 9999)\nFROM TABLE_NAME\nWHERE 1 = 2;\n```","x":"COUNT(*)는 대상이 없어도 0을 반환하므로 NVL이 적용되지 않는다.","o":["NULL","1","9999","0"],"a":3},{"id":"57-35","r":57,"n":35,"s":2,"b":"다음 중 동일한 이름의 컬럼을 조인 조건으로 사용하고, 중복 컬럼을 하나로 출력하는 조인 방식은?","x":"같은 이름의 컬럼으로 조인하고 공통 컬럼을 하나로 출력하는 것은 NATURAL JOIN이다.","o":["INNER JOIN","LEFT OUTER JOIN","NATURAL JOIN","RIGHT OUTER JOIN"],"a":2},{"id":"57-36","r":57,"n":36,"s":2,"b":"다음 SQL 중 에러가 발생하는 것의 개수는?\nㄱ. SELECT 10 / 0 FROM DUAL;\nㄴ. SELECT TO_NUMBER('ABC') FROM DUAL;\nㄷ. SELECT NVL(NULL, 0) FROM DUAL;\nㄹ. SELECT SUBSTR('ABC', 1, 2) FROM DUAL;","x":"10/0(0으로 나누기)과 TO_NUMBER('ABC')(숫자 변환 실패) 2개가 오류다.","o":["2개","1개","3개","4개"],"a":0},{"id":"57-37","r":57,"n":37,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은?\n> 조건: 전체 행 수는 105건이고, 특정 컬럼 COL1이 NULL이 아닌 행 수는 70건이다.\n```sql\nSELECT COUNT(*), COUNT(COL1)\nFROM T;\n```","x":"COUNT(*)는 105, COUNT(COL1)은 NULL을 제외한 70이다.","o":["105, 70","70, 105","70, NULL","103, NULL"],"a":0},{"id":"57-38","r":57,"n":38,"s":2,"b":"SQL Server에서 다음 결과를 도출하기 위한 조건으로 가장 적절한 것은?\n- member.name: Jim, Kim, Tim, Sam\n- 실행 결과: Kim, Tim\n```sql\nSELECT *\nFROM member\n__________;\n```","x":"[KT]im은 K 또는 T로 시작하는 Kim, Tim과 매칭된다.","o":["WHERE name LIKE '_im'","WHERE name LIKE '%im'","WHERE name LIKE '[JT]im'","WHERE name LIKE '[KT]im'"],"a":3},{"id":"57-39","r":57,"n":39,"s":2,"b":"Oracle에서 SYSDATE가 2025-01-01 13:30:00일 때 다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT TRUNC(SYSDATE),\n       ROUND(SYSDATE)\nFROM DUAL;\n```","x":"TRUNC는 자정으로, ROUND는 정오가 지났으므로 다음 날 자정으로 바뀐다.","o":["2025/01/01 00:00:00, 2025/01/02 00:00:00","2025/01/01 13:00:00, 2025/01/01 14:00:00","2025/01/01 00:00:00, 2025/01/01 00:00:00","2025/01/02 00:00:00, 2025/01/02 00:00:00"],"a":0},{"id":"57-40","r":57,"n":40,"s":2,"b":"다음 데이터에서 2등급에 해당하는 점수의 개수를 구하라.\n> 조건: 2등급 범위는 1200 이상 1400 이하이다.\n\n| ID | SCORE |\n|---|---|\n| 1 | 1100 |\n| 2 | 1200 |\n| 3 | 1300 |\n| 4 | 1400 |\n| 5 | 1500 |","x":"1200, 1300, 1400 3개다.","o":["1개","2개","3개","4개"],"a":2},{"id":"57-41","r":57,"n":41,"s":2,"b":"다음 상황에서 TUTOR LEFT OUTER JOIN CLASS를 수행한 결과 행 수로 가장 적절한 것은?\n- 튜터 테이블에는 튜터 2명이 있다.\n- 클래스 테이블에는 클래스 4개가 있다.\n- LEFT OUTER JOIN의 왼쪽 테이블은 TUTOR이다.\n- 각 클래스는 특정 튜터에 속한다.\n- 두 튜터는 각각 최소 1개 이상의 클래스를 담당한다.","x":"각 클래스는 한 튜터에 속하고 튜터마다 클래스가 있으므로 4행이다.","o":["2개","4개","6개","8개"],"a":1},{"id":"57-42","r":57,"n":42,"s":2,"b":"MERGE 문에서 각 절의 역할 연결로 가장 적절한 것은?\n보기: 1. WHEN MATCHED THEN / 2. WHEN NOT MATCHED THEN / 3. ON 조건 / 4. USING\n역할:\na. 매칭되지 않는 행에 대해 INSERT 수행\nb. 매칭되는 행에 대해 UPDATE 또는 DELETE 수행\nc. 병합에 사용할 원본 데이터 집합 지정\nd. 대상 테이블과 원본 데이터의 매칭 조건 지정","x":"MATCHED-갱신/삭제, NOT MATCHED-삽입, ON-매칭 조건, USING-원본 데이터다.","o":["1-a, 2-b, 3-c, 4-d","1-b, 2-a, 3-d, 4-c","1-b, 2-a, 3-c, 4-d","1-d, 2-c, 3-b, 4-a"],"a":1},{"id":"57-43","r":57,"n":43,"s":2,"b":"다음 중 2022년 11월, 2022년 12월, 2023년 3월, 2023년 5월 데이터를 조회하는 조건으로 가장 적절한 것은?","x":"필요한 4개 월만 정확히 고르는 것은 IN이다.","o":["WHERE 기준월 BETWEEN '202211' AND '202305'","WHERE 기준월 IN ('202211', '202212', '202303', '202305')","WHERE 기준월 >= '202211' AND 기준월 \u003c= '202305'","WHERE 기준월 LIKE '2022%' OR 기준월 LIKE '2023%'"],"a":1},{"id":"57-44","r":57,"n":44,"s":2,"b":"다음 중 가능한 모든 조합의 소계를 생성하는 GROUP BY 확장 기능은?","x":"모든 조합의 소계는 CUBE다.","o":["ROLLUP","GROUPING SETS","GROUPING","CUBE"],"a":3},{"id":"57-45","r":57,"n":45,"s":2,"b":"다음 UNPIVOT 결과로 가장 적절한 것은?\n\n| 상품 | 1월 | 2월 | 3월 |\n|---|---|---|---|\n| A | 100 | NULL | 300 |\n\n```sql\nSELECT 상품, 월, 금액\nFROM 매출\nUNPIVOT (\n    금액 FOR 월 IN (\"1월\", \"2월\", \"3월\")\n);\n```\n> 조건: UNPIVOT INCLUDE NULLS를 사용하지 않는다.","x":"UNPIVOT은 기본적으로 NULL 값 행을 제외하므로 2월이 빠진다.","o":["1월, 2월, 3월이 모두 출력되고 모든 금액이 채워져 있다.","2월 행은 제외되고 1월과 3월 행만 출력된다.","2월 행이 출력되며 금액은 NULL이다.","모든 월이 출력되지만 금액이 원본과 다르게 변환된다."],"a":1},{"id":"57-46","r":57,"n":46,"s":2,"b":"다음 SQL의 괄호 안에 들어갈 수 없는 것은?\n```sql\nSELECT (   ), COUNT(EMPNO)\nFROM EMP\nGROUP BY JOB, DEPT;\n```","x":"GROUP BY에 없는 EMPNO는 SELECT에 쓸 수 없다.","o":["EMPNO","JOB","DEPT","NULL"],"a":0},{"id":"57-47","r":57,"n":47,"s":2,"b":"이름이 중복된 데이터 중 각 이름별로 가장 작은 ID만 남기고 나머지를 삭제하려고 한다. DELETE 조건으로 가장 적절한 것은?","x":"이름별 MIN(ID)가 아닌 행을 지운다.","o":["WHERE ID NOT IN (SELECT MIN(ID) FROM T GROUP BY NAME)","WHERE ID NOT IN (SELECT MAX(ID) FROM T GROUP BY ID)","WHERE ID NOT IN (SELECT MAX(ID) FROM T GROUP BY NAME)","WHERE ID IN (SELECT MAX(ID) FROM T GROUP BY ID)"],"a":0},{"id":"57-48","r":57,"n":48,"s":2,"b":"다음 중 NOT IN과 NOT EXISTS에 대한 설명으로 적절하지 않은 것은?","x":"NOT IN은 서브쿼리 결과에 NULL이 있으면 공집합이 되므로 NOT EXISTS와 결과가 달라진다.","o":["NOT EXISTS는 상관 서브쿼리에서 조건을 만족하는 행이 없을 때 TRUE가 된다.","NOT IN은 서브쿼리 결과에 NULL이 포함되면 의도와 다른 결과가 나올 수 있다.","서브쿼리 결과에 NULL이 없고 비교 컬럼도 NULL이 아니라면 NOT IN을 NOT EXISTS로 바꿔도 같은 결과를 얻을 수 있다.","서브쿼리 결과가 NULL을 포함해도 NOT IN과 NOT EXISTS의 결과는 항상 동일하다."],"a":3},{"id":"57-49","r":57,"n":49,"s":2,"b":"ROLLUP 결과에서 GROUPING 함수를 이용해 합계 행의 표시명을 지정하려고 한다. 다음 중 가장 적절한 CASE 표현식은?","x":"둘 다 1이면 총계, JOB만 1이면 부서 소계다.","o":["CASE WHEN GROUPING(DEPTNO) = 1 AND GROUPING(JOB) = 1 THEN '총계' WHEN GROUPING(JOB) = 1 THEN '소계' ELSE JOB END","CASE WHEN GROUPING(DEPTNO) = 0 AND GROUPING(JOB) = 0 THEN '총계' ELSE NULL END","CASE WHEN GROUPING(DEPTNO) = 1 THEN DEPTNO ELSE '소계' END","CASE WHEN GROUPING(JOB) = 0 THEN '소계' ELSE JOB END"],"a":0},{"id":"57-50","r":57,"n":50,"s":2,"b":"아래 SQL의 실행 결과로 가장 적절한 것은?\n\n| 사원ID | 부서ID | 사원명 | 연봉 |\n|---|---|---|---|\n| 001 | 100 | 홍길동 | 2500 |\n| 002 | 100 | 강감찬 | 3000 |\n| 003 | 200 | 김유신 | 4500 |\n| 004 | 200 | 김선달 | 3000 |\n| 005 | 200 | 유학생 | 2500 |\n| 006 | 300 | 변사또 | 4500 |\n| 007 | 300 | 박문수 | 3000 |\n\n```sql\nSELECT Y.사원ID, Y.부서ID, Y.사원명, Y.연봉\nFROM (\n    SELECT 사원ID,\n           MAX(연봉) OVER(PARTITION BY 부서ID) AS 최고연봉\n    FROM 사원\n) X, 사원 Y\nWHERE X.사원ID = Y.사원ID\n  AND X.최고연봉 = Y.연봉;\n```\n※ 결과는 (사원ID, 부서ID, 사원명, 연봉) 순으로 표기하며, 행의 순서는 무관하다.","x":"부서별 최고 연봉과 같은 사원은 강감찬, 김유신, 변사또다.","o":["(003, 200, 김유신, 4500), (006, 300, 변사또, 4500)","(001, 100, 홍길동, 2500), (005, 200, 유학생, 2500), (007, 300, 박문수, 3000)","(002, 100, 강감찬, 3000), (003, 200, 김유신, 4500), (006, 300, 변사또, 4500)","(003, 200, 김유신, 4500)"],"a":2},{"id":"58-01","r":58,"n":1,"s":1,"b":"다음 중 키 엔터티(Key Entity, 기본 엔터티)에 해당하지 않는 것은?","x":"키(기본) 엔터티는 사원·회사·고객처럼 원래 존재하는 것이다. 주문은 행위 엔터티다.","o":["사원","주문","회사","고객"],"a":1},{"id":"58-02","r":58,"n":2,"s":1,"b":"제3정규형(3NF)에 대한 설명으로 가장 거리가 먼 것은?","x":"제3정규형은 이행 함수 종속을 제거하는 단계다.","o":["이행 함수 종속성을 배제하지 않는다.","제1정규형의 정의를 만족해야 한다.","제2정규형의 정의를 만족해야 한다.","주식별자를 제외한 일반 속성 간의 함수적 종속성을 제거하는 과정이다."],"a":0},{"id":"58-03","r":58,"n":3,"s":1,"b":"데이터 모델링을 구성하는 세 가지 관점(View)에 해당하지 않는 것은?","x":"데이터 모델링의 관점은 데이터·프로세스·상관(데이터와 프로세스) 관점이다.","o":["데이터 관점 (Data, What)","프로세스 관점 (Process, How)","상관 관점 (Interaction)","기술 관점 (Technical)"],"a":3},{"id":"58-04","r":58,"n":4,"s":1,"b":"데이터 모델링의 유의점 중 '중복성(Duplication)'에 대한 설명으로 가장 적절한 것은?","x":"중복성은 같은 정보가 여러 곳에 저장되어 불일치가 생길 수 있는 문제다.","o":["동일한 정보가 여러 엔터티에 중복 저장되어 데이터의 불일치가 발생할 수 있다.","비즈니스 프로세스 변화에 따라 모델이 유연하게 대처하지 못하는 상태를 의미한다.","데이터 모델의 독립성을 확보하여 데이터 품질을 높이는 과정이다.","데이터의 타입과 길이를 일관되게 유지하여 무결성을 보장하는 것이다."],"a":0},{"id":"58-05","r":58,"n":5,"s":1,"b":"다음 마더보드(Motherboard)와 컴퓨터(Computer) 간의 ERD 관계 해석으로 가장 적절한 것은? (단, 관계선에 'O' 표시가 존재함)\n[그림: 마더보드 — 컴퓨터 / O = 선택적 참여 · | = 필수/하나]","x":"관계선의 O는 선택 참여이므로 컴퓨터에 마더보드가 있을 수도 없을 수도 있다.","o":["모든 컴퓨터에는 반드시 마더보드가 하나만 존재해야 한다.","컴퓨터에 마더보드를 장착할 수도 있고, 장착하지 않을 수도 있다.","마더보드 엔터티는 컴퓨터 엔터티 없이 단독으로 존재할 수 없다.","식별 관계를 통해 두 엔터티의 생명주기를 완벽히 분리한다."],"a":1},{"id":"58-06","r":58,"n":6,"s":1,"b":"비식별자 관계(Non-identifying Relationship)에 의해 속성을 생성하는 경우로 가장 적절하지 않은 것은?","x":"비식별 관계는 부모·자식의 생명주기가 다를 때 쓴다. 생명주기를 같게 관리하면 식별 관계다.","o":["여러 엔터티가 하나의 엔터티로 통합되었더라도 각 엔터티가 별도의 관계를 가지는 경우","각 엔터티의 데이터 생명주기(Life Cycle)를 동일하게 관리하는 경우","자식 엔터티에서 받은 속성(FK)이 반드시 필수가 아니어도 무방한 경우","자식 엔터티에서 주식별자의 사용이 가능하더라도 별도의 주식별자를 생성하는 경우"],"a":1},{"id":"58-07","r":58,"n":7,"s":1,"b":"관계형 데이터베이스 정규화 과정 중, '이행적 함수 종속성(Transitive Functional Dependency)'을 제거하는 단계는?","x":"이행적 함수 종속 제거는 제3정규화다.","o":["제1정규화","제2정규화","제3정규화","BCNF 정규화"],"a":2},{"id":"58-08","r":58,"n":8,"s":1,"b":"두 개 이상의 하위 엔터티 중 하나만 배타적으로 관계를 맺는 '상호배타적 관계(Arc Relationship)'의 사례로 가장 적절한 것은?","x":"차량은 법인차량이나 개인차량 중 하나에만 속하는 상호배타 관계의 예다.","o":["부서와 사원","고객과 주문","교수와 학생","법인차량과 개인차량"],"a":3},{"id":"58-09","r":58,"n":9,"s":1,"b":"다음 학생과 수강 엔터티 간의 ERD에 대한 설명으로 가장 적절한 것은?\n[그림: 학생(학번 PK, 이름) 1 : N 수강(수강번호 PK, 학번 FK) / 수강번호는 고유 식별자]","x":"수강번호는 고유 식별자라 여러 학생이 같은 번호를 가질 수 없다.","o":["수강번호는 학생별로 중복되어 부여될 수 있다.","학생 테이블에 데이터가 존재하면 수강 목록에도 무조건 존재해야 한다.","동일한 수강번호를 여러 학생이 공유하여 가질 수 없다.","한 명의 학생은 반드시 하나의 과목만 수강해야 한다."],"a":2},{"id":"58-10","r":58,"n":10,"s":1,"b":"트랜잭션(Transaction)의 특성 중, \"작업이 모두 반영되거나 아니면 전혀 반영되지 않아야 한다(All or Nothing)\"는 부분 수정 불가능 원칙을 의미하는 것은?","x":"All or Nothing은 원자성이다.","o":["원자성 (Atomicity)","일관성 (Consistency)","고립성 (Isolation)","지속성 (Durability)"],"a":0},{"id":"58-11","r":58,"n":11,"s":2,"b":"다음 중 문자열 처리 함수의 실행 결과가 나머지 셋과 다른 하나는? (Oracle 기준)","x":"Oracle의 TRIM은 TRIM('x' FROM ...) 형식이라 두 인자 형식은 오류가 난다. 나머지는 'SQL'이다.","o":["SELECT TRIM('xxSQLxx', 'x') FROM DUAL;","SELECT RTRIM('SQLxx', 'x') FROM DUAL;","SELECT REPLACE('xxSQLxx', 'x') FROM DUAL;","SELECT LTRIM('xxSQL', 'x') FROM DUAL;"],"a":0},{"id":"58-12","r":58,"n":12,"s":2,"b":"아래 SQL 문의 실행 결과로 추출되는 행의 개수는? (단, 데이터에는 'a_c', 'abc', 'acc'가 각각 1건씩 존재한다.)\n```sql\nSELECT * FROM TABLE_A \nWHERE COL LIKE '%a\\_c%' ESCAPE '\\';\n```","x":"ESCAPE로 '_'를 문자 그대로 비교하므로 'a_c'만 매칭되어 1건이다.","o":["0","1","4","6"],"a":1},{"id":"58-13","r":58,"n":13,"s":2,"b":"정규표현식 패턴 `^\\w*$`에 매칭되지 않는 것은?","x":"\\w는 영문·숫자·_만 해당하므로 하이픈이 있는 ER-123은 매칭되지 않는다.","o":["ER-123","abcde","SQL58","admin123"],"a":0},{"id":"58-14","r":58,"n":14,"s":2,"b":"다음 일련의 DCL 명령어가 수행된 후, 테이블 R에 대해 SELECT 권한을 유지하고 있는 유저를 모두 고르시오.\n```sql\nDBA : GRANT SELECT, INSERT, DELETE ON R TO U1;\nDBA : GRANT SELECT ON R TO U2 WITH GRANT OPTION;\nU2  : GRANT SELECT ON R TO U3;\nDBA : REVOKE DELETE ON R FROM U1;\n```","x":"U1은 SELECT를 그대로 가지고, U2와 U3도 회수된 적이 없다.","o":["DBA, U1","DBA","DBA, U1, U3","DBA, U1, U2, U3"],"a":3},{"id":"58-15","r":58,"n":15,"s":2,"b":"다음 [CUST] 테이블과 [GRADE] 테이블 데이터가 주어졌을 때, 아래 3개의 SQL 문을 실행한 결과값(반환되는 행의 수)의 총합(ㄱ+ㄴ+ㄷ)으로 가장 적절한 것은?\n\n[CUST]\n\n| CUST_ID | AMOUNT |\n|---|---|\n| 1 | 100 |\n| 2 | 120 |\n| 3 | 200 |\n\n[GRADE]\n\n| GRADE | MIN_AMT | MAX_AMT |\n|---|---|---|\n| A | 250 | 350 |\n| B | 150 | 249 |\n| C | 50 | 149 |\n| D | 0 | 49 |\n\n```sql\n-- (ㄱ) \nSELECT COUNT(*) FROM CUST CROSS JOIN GRADE;\n\n-- (ㄴ) \nSELECT COUNT(*) FROM CUST A \nINNER JOIN GRADE B ON A.AMOUNT BETWEEN B.MIN_AMT AND B.MAX_AMT;\n\n-- (ㄷ) \nSELECT COUNT(*) FROM CUST A \nFULL OUTER JOIN GRADE B ON A.AMOUNT BETWEEN B.MIN_AMT AND B.MAX_AMT;\n```","x":"CROSS 3×4 = 12, INNER 3, FULL은 3 + 매칭 안 된 등급 A·D 2 = 5. 합계 20이다.","o":["17","18","19","20"],"a":3},{"id":"58-16","r":58,"n":16,"s":2,"b":"온라인 쇼핑몰의 결제 정보를 관리하는 다음 [결제내역] 테이블이 있다. 2025년 12월의 월별 총 결제 건수를 집계하고자 할 때, 다음 중 실행 결과가 올바르게 나오지 않는 SQL 구문은?\n\n| 결제번호 | 결제일시 |\n|---|---|\n| PAY001 | 2025-12-01 10:15:00 |\n| PAY002 | 2025-12-25 18:30:00 |\n| PAY003 | 2026-01-05 09:00:00 |","x":"TRUNC(결제일시) = 2025-12-01은 12월 1일 하루만 비교하므로 월 전체가 집계되지 않는다.","o":["SELECT COUNT(*) FROM 결제내역 WHERE TO_CHAR(결제일시, 'YYYYMM') = '202512';","SELECT COUNT(*) FROM 결제내역 WHERE 결제일시 >= TO_DATE('20251201', 'YYYYMMDD') AND 결제일시 \u003c TO_DATE('20260101', 'YYYYMMDD');","SELECT COUNT(*) FROM 결제내역 WHERE SUBSTR(TO_CHAR(결제일시, 'YYYY-MM-DD'), 1, 7) = '2025-12';","SELECT COUNT(*) FROM 결제내역 WHERE TRUNC(결제일시) = TO_DATE('2025-12', 'YYYY-MM');"],"a":3},{"id":"58-17","r":58,"n":17,"s":2,"b":"오라클(Oracle)의 계층형 질의(Hierarchical Query)에 대한 설명으로 가장 틀린 것은?","x":"WHERE 절은 계층 전개가 끝난 뒤에 적용된다.","o":["START WITH 절은 계층 구조의 시작점을 지정하는 역할을 한다.","CONNECT BY 절에 PRIOR 키워드를 사용하여 부모와 자식 간의 관계를 정의한다.","ORDER SIBLINGS BY 구문은 동일한 부모를 가진 형제 노드 사이의 정렬을 위해 사용된다.","WHERE 절은 START WITH 및 CONNECT BY 전개 이전에 먼저 적용되어 계층 구조를 형성할 대상 데이터를 제한한다."],"a":3},{"id":"58-18","r":58,"n":18,"s":2,"b":"다음 테이블 컬럼에 데이터가 (10, 20, NULL, 30)으로 입력되어 있을 때, AVG(컬럼)의 결과값으로 옳은 것은?","x":"AVG는 NULL을 제외하므로 60/3 = 20이다.","o":["15","20","30","NULL"],"a":1},{"id":"58-19","r":58,"n":19,"s":2,"b":"조인(JOIN) 수행 시 우측 테이블의 모든 데이터를 포함하여 결과를 생성하는 조인 방식으로 가장 적절한 것은? (좌측 테이블은 매칭되는 행만 포함한다)","x":"오른쪽 테이블의 모든 행을 포함하는 것은 RIGHT OUTER JOIN이다.","o":["RIGHT OUTER JOIN","LEFT OUTER JOIN","FULL OUTER JOIN","CROSS JOIN"],"a":0},{"id":"58-20","r":58,"n":20,"s":2,"b":"서브쿼리에 대한 설명 중 틀린 것은?","x":"다중행 서브쿼리는 IN·ANY·ALL 같은 다중행 연산자와 써야 한다.","o":["다중행 서브쿼리는 단일행 비교 연산자(=)와 함께 쓸 수 있다.","서브쿼리는 메인쿼리보다 먼저 실행될 수 있다.","서브쿼리의 반환 건수에 따라 단일행, 다중행으로 나뉜다.","인라인 뷰는 FROM 절에 사용된다."],"a":0},{"id":"58-21","r":58,"n":21,"s":2,"b":"소계 함수(ROLLUP/CUBE)와 함께 사용되는 GROUPING 함수의 특징은?","x":"GROUPING은 집계로 생긴 NULL이면 1, 아니면 0을 반환한다.","o":["집계 연산으로 생성된 NULL 항목에 대해 1을 반환한다.","집계에 사용되지 않은 데이터는 무조건 에러가 난다.","데이터 자체에 들어있는 NULL과 집계로 인한 NULL을 구분할 수 없다.","ROLLUP에만 사용할 수 있다."],"a":0},{"id":"58-22","r":58,"n":22,"s":2,"b":"NTILE(2) 윈도우 함수를 적용했을 때의 결과로 가장 적절한 것은? (단, 데이터는 1, 2, 3, 4 이다.)","x":"4개 행을 2그룹으로 나누면 1, 1, 2, 2다.","o":["1, 1, 2, 2","1, 2, 3, 4","1, 1, 1, 2","2, 2, 1, 1"],"a":0},{"id":"58-23","r":58,"n":23,"s":2,"b":"집합 A={1, 2, 3}, B={6, 7}에 대하여 결과 집합이 {(1,6), (2,6), (3,6), (1,7), (2,7), (3,7)}로 출력되었다면, 어떤 조인을 사용한 것인가?","x":"모든 행의 조합을 만드는 것은 CROSS JOIN이다.","o":["LEFT OUTER JOIN","CROSS JOIN","INNER JOIN","SELF JOIN"],"a":1},{"id":"58-24","r":58,"n":24,"s":2,"b":"다음 조인(JOIN) 문법 중 실행 시 에러가 발생하는 것은?","x":"NATURAL JOIN에는 ON 절을 쓸 수 없다.","o":["SELECT * FROM T1 NATURAL JOIN T2 ON T1.ID = T2.ID;","SELECT * FROM T1 JOIN T2 USING (ID);","SELECT * FROM T1 JOIN T2 ON T1.ID = T2.ID;","SELECT * FROM T1, T2 WHERE T1.ID = T2.ID;"],"a":0},{"id":"58-25","r":58,"n":25,"s":2,"b":"다음 두 테이블이 있다. 아래 SQL문의 실행 결과로 반환되는 값은 무엇인가?\n\n[Tbl_A]\n\n| A | B | C | D |\n|---|---|---|---|\n| 1 | a | x | 1 |\n| 2 | a | z | 1 |\n| 2 | a | y | 2 |\n| 3 | b | y | 2 |\n\n[Tbl_B]\n\n| D | E | F |\n|---|---|---|\n| x | D | 5 |\n| y | E | 6 |\n| z | E | 9 |\n\n```sql\nSELECT COUNT(*)\nFROM (\n  SELECT DISTINCT A, B\n  FROM Tbl_A\n  WHERE C IN (\n    SELECT D\n    FROM Tbl_B\n    WHERE UPPER(E) = 'E'\n  )\n) X;\n```","x":"E가 'E'인 D는 y, z이고, C가 y·z인 행의 (A,B)는 (2,a), (3,b) 2개다.","o":["1","2","3","4"],"a":1},{"id":"58-26","r":58,"n":26,"s":2,"b":"COLUMN1의 값이 NULL이 아닌 행을 조회하기 위한 조건절로 올바른 것은?","x":"NULL 비교는 IS NOT NULL을 써야 한다.","o":["WHERE COLUMN1 IS NOT NULL;","WHERE COLUMN1 \u003c> NULL;","WHERE COLUMN1 != NULL;","WHERE COLUMN1 NOT NULL;"],"a":0},{"id":"58-27","r":58,"n":27,"s":2,"b":"EXISTS 연산자에 대한 설명으로 가장 적절한 것은?","x":"EXISTS는 조건을 만족하는 행을 하나 찾으면 바로 참을 반환한다.","o":["서브쿼리의 결과가 1건이라도 존재하면 TRUE를 반환하고 더 이상 검색하지 않는다.","메인쿼리의 컬럼 값을 서브쿼리로 전달할 수 없다.","결과 집합에 NULL 값이 포함된 경우 무조건 에러를 발생시킨다.","성능상 항상 IN 연산자보다 불리하게 작동한다."],"a":0},{"id":"58-28","r":58,"n":28,"s":2,"b":"다음 SQL 문에 포함된 정렬 및 추출 옵션의 결과로 올바른 것은?\n```sql\nORDER BY SAL DESC NULLS LAST \nFETCH FIRST 3 ROWS ONLY;\n```","x":"급여 내림차순으로 정렬하되 NULL은 맨 뒤로 보내고 상위 3행만 가져온다.","o":["가장 급여가 높은 3명을 출력하되, 급여가 NULL인 데이터는 후순위로 미룬다.","가장 급여가 낮은 3명을 출력한다.","가장 급여가 높은 3명을 출력하되, 급여가 NULL인 데이터를 우선 출력한다.","급여와 상관없이 상위 3개의 행만 출력한다."],"a":0},{"id":"58-29","r":58,"n":29,"s":2,"b":"RANK() 함수와 DENSE_RANK() 함수의 결과 차이로 올바른 것은? (데이터는 100, 100, 200 이며 오름차순 기준이다.)","x":"RANK는 1, 1, 3이고 DENSE_RANK는 1, 1, 2다.","o":["RANK: 1, 1, 3 / DENSE_RANK: 1, 1, 2","RANK: 1, 2, 3 / DENSE_RANK: 1, 1, 2","RANK: 1, 1, 2 / DENSE_RANK: 1, 2, 3","두 함수의 결과는 동일하다."],"a":0},{"id":"58-30","r":58,"n":30,"s":2,"b":"다음 [T1] 테이블에 대하여 아래 SQL 문을 실행했을 때, 출력되는 데이터의 순서로 가장 적절한 것은? (Oracle 기준)\n\n| COL1 | COL2 | COL3 |\n|---|---|---|\n| A001 | 2024-12-15 | 110 |\n| A002 | NULL | 110 |\n| B001 | 2024-12-01 | 120 |\n| C001 | 2024-12-20 | 130 |\n| D001 | 2024-12-03 | 110 |\n\n```sql\nSELECT COL1, COL2, COL3 FROM T1\nORDER BY COL3 ASC, COL2 ASC;\n```","x":"COL3 오름차순, 같은 110 안에서 COL2 오름차순이며 Oracle은 오름차순에서 NULL을 마지막에 둔다.","o":["D001, A001, A002, B001, C001","A001, A002, D001, B001, C001","A002, A001, D001, C001, B001","D001, A002, A001, B001, C001"],"a":0},{"id":"58-31","r":58,"n":31,"s":2,"b":"다음 중 스칼라 서브쿼리(Scalar Subquery)에 대한 설명으로 올바르지 않은 것은?","x":"스칼라 서브쿼리 결과가 0건이면 오류가 아니라 NULL을 반환한다.","o":["원칙적으로 단 1개의 행과 1개의 컬럼만 반환해야 한다.","메인쿼리의 결과 건수만큼 반복 수행된다.","서브쿼리의 실행 결과가 0건일 경우 에러를 발생시킨다.","SELECT 절 등 단일 값이 요구되는 곳에 주로 사용된다."],"a":2},{"id":"58-32","r":58,"n":32,"s":2,"b":"다음 SQL 문의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT COUNT(*) FROM DUAL \nHAVING COUNT(*) > 4;\n```","x":"DUAL의 COUNT(*)는 1이라 HAVING COUNT(*) > 4가 거짓이 되어 공집합이다.","o":["0","1","9999","공집합 (No rows selected)"],"a":3},{"id":"58-33","r":58,"n":33,"s":2,"b":"다음 아래와 같이 테이블을 생성하였다. 다음 중 INSERT 문의 실행 결과가 나머지 셋과 다른 하나는?\n```sql\nCREATE TABLE T1 (\n    COL1 NUMBER,\n    COL2 NUMBER,\n    CONSTRAINT CK_T1 CHECK (COL1 > 10 AND COL2 > 5)\n);\n```","x":"CHECK는 UNKNOWN도 통과시킨다. (20, NULL)만 성공하고 나머지는 실패한다.","o":["INSERT INTO T1 VALUES (20, 3);","INSERT INTO T1 VALUES (5, 3);","INSERT INTO T1 VALUES (20, NULL);","INSERT INTO T1 VALUES (5, NULL);"],"a":2},{"id":"58-34","r":58,"n":34,"s":2,"b":"GROUP BY ROLLUP(ID, TYPE) 소계 쿼리에서 HAVING GROUPING(ID) + GROUPING(TYPE) != 1 의 결과는?","x":"GROUPING 합이 상세 0, 중간 소계 1, 총계 2이므로 != 1은 상세와 총계만 남긴다.","o":["중간 소계 행을 제외한 일반 상세 데이터와 전체 총합계 행만 출력한다.","모든 데이터를 출력한다.","오직 전체 총합계 행 한 건만 출력한다.","ID별 소계 행만 출력한다."],"a":0},{"id":"58-35","r":58,"n":35,"s":2,"b":"GROUPING SETS 함수에 대한 설명으로 올바르지 않은 것은?","x":"GROUPING SETS는 인수 순서가 바뀌어도 집계 결과 항목이 같다.","o":["다양한 소계 집합을 한 번의 쿼리로 효율적으로 구할 수 있다.","괄호 내에 명시된 인수의 순서가 달라지면 집계의 결과 항목 자체도 달라진다.","정렬하려면 별도의 ORDER BY 절을 사용해야 한다.","UNION ALL을 결합한 것과 동일한 결과를 생성할 수 있다."],"a":1},{"id":"58-36","r":58,"n":36,"s":2,"b":"NVL2(COL1, 'A', 'B') 함수에서 COL1이 NULL일 경우 반환되는 결과는?","x":"NVL2는 첫 인자가 NULL이면 세 번째 인자 'B'를 반환한다.","o":["A","B","NULL","에러"],"a":1},{"id":"58-37","r":58,"n":37,"s":2,"b":"다음 중 데이터 제어어(DCL)에 해당하지 않고, 데이터 조작어(DML)에 해당하는 것은?","x":"UPDATE는 DML이다. GRANT·REVOKE는 DCL, COMMIT은 TCL이다.","o":["GRANT","REVOKE","UPDATE","COMMIT"],"a":2},{"id":"58-38","r":58,"n":38,"s":2,"b":"WHERE SAL > ANY (1000, 2000) 조건절의 논리적 의미와 동일한 것은?","x":"> ANY는 목록 중 하나라도 만족하면 되므로 OR로 연결된다.","o":["SAL > 1000 OR SAL > 2000","SAL > 1000 AND SAL > 2000","SAL = 1000 OR SAL = 2000","에러 발생"],"a":0},{"id":"58-39","r":58,"n":39,"s":2,"b":"계층형 질의문의 실행 결과로 옳은 것은?\n```sql\nSELECT COUNT(*) FROM DUAL CONNECT BY LEVEL \u003c= 2;\n```","x":"CONNECT BY LEVEL \u003c= 2는 DUAL 한 행으로 2행을 만든다.","o":["0","1","2","3"],"a":2},{"id":"58-40","r":58,"n":40,"s":2,"b":"데이터 그룹화 조건에서 집계 함수(SUM, COUNT 등)를 활용한 필터링이 가능한 절은?","x":"집계 함수로 그룹을 거르는 것은 HAVING이다.","o":["WHERE 절","GROUP BY 절","HAVING 절","ORDER BY 절"],"a":2},{"id":"58-41","r":58,"n":41,"s":2,"b":"다음 정규표현식 함수의 실행 결과로 추출되는 값은?\n```sql\nSELECT REGEXP_INSTR('123123123', '312') FROM DUAL;\n```","x":"'312'는 3번째 위치에서 시작한다.","o":["1","2","3","4"],"a":2},{"id":"58-42","r":58,"n":42,"s":2,"b":"다음 [고객] 테이블에서 유효한 이메일 형식(영문자, 숫자, 언더바의 조합 @ 영문자, 숫자, 언더바의 조합.com 형태)을 가진 고객의 수를 계산하는 SQL 문으로 가장 올바른 것은? (Oracle 기준)\n\n| 고객ID | 이메일 |\n|---|---|\n| 100 | dev_1@oracle.com |\n| 200 | master@test |\n| 300 | admin.user@db.com |\n| 400 | info@korea.com |","x":"^\\w+@\\w+\\.com$는 dev_1@oracle.com, info@korea.com만 정확히 매칭한다.","o":["SELECT COUNT(*) FROM 고객 WHERE REGEXP_LIKE(이메일, '^\\w+@\\w+\\.com$');","SELECT COUNT(*) FROM 고객 WHERE REGEXP_LIKE(이메일, '^\\w*@\\w*.com$');","SELECT COUNT(*) FROM 고객 WHERE REGEXP_LIKE(이메일, '.*@.*\\.com');","SELECT COUNT(*) FROM 고객 WHERE REGEXP_LIKE(이메일, '[a-zA-Z0-9]@[a-zA-Z0-9].com');"],"a":0},{"id":"58-43","r":58,"n":43,"s":2,"b":"다음 SQL 문의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT '''A''''' R1 FROM DUAL;\n```","x":"작은따옴표 두 개는 문자 '로 바뀌어 결과는 'A''다.","o":["A","'A''","''A''","''''A''''"],"a":1},{"id":"58-44","r":58,"n":44,"s":2,"b":"다음 SQL 명령어를 실행했을 때의 결과에 대한 설명으로 적절한 것은?\n```sql\nDROP TABLE T1 CASCADE CONSTRAINTS;\n```","x":"CASCADE CONSTRAINTS는 T1을 참조하는 FK 제약까지 함께 삭제한다.","o":["T1 테이블만 삭제한다.","T1 테이블과 T1 테이블을 참조하는 외부 테이블의 FK 제약조건을 함께 삭제한다.","자식 테이블의 데이터를 삭제한다.","자식 테이블을 전부 삭제한다."],"a":1},{"id":"58-45","r":58,"n":45,"s":2,"b":"다음은 뷰(View)를 생성하고 이를 조회/수정하는 과정이다. 실행 시 오류(Error)가 발생하는 쿼리는?\n```sql\nCREATE VIEW V1 AS \nSELECT DEPTNO, SUM(SAL) AS SS \nFROM EMP GROUP BY DEPTNO;\n```","x":"GROUP BY로 만든 뷰에는 INSERT할 수 없다.","o":["SELECT * FROM V1 WHERE SS > 5000;","SELECT A.DEPTNO, B.DNAME FROM V1 A JOIN DEPT B ON A.DEPTNO = B.DEPTNO;","SELECT DEPTNO, AVG(SS) FROM V1 GROUP BY DEPTNO;","INSERT INTO V1 (DEPTNO, SS) VALUES (50, 8000);"],"a":3},{"id":"58-46","r":58,"n":46,"s":2,"b":"다음 트랜잭션 실행 결과로 올바른 것은?\n```sql\ncreate table t1 (no number);\ninsert into t1 values (1); \ninsert into t1 values (2);\nsavepoint sv1; \nupdate t1 set no=4 where no=1;\nsavepoint sv1; \ndelete from t1 where no >= 2; \nrollback to sv1;\ninsert into t1 values(3); \ncommit;\nselect max(no) from t1;\n```","x":"두 번째 sv1까지 롤백되므로 업데이트한 4와 2가 남고 3이 추가된다. MAX는 4다.","o":["1","2","3","4"],"a":3},{"id":"58-47","r":58,"n":47,"s":2,"b":"다음은 [영업사원] 테이블과 [부서별실적] 테이블이다. 다음 SQL문의 실행 결과로 올바른 것은?\n\n[영업사원]\n\n| 사원명 | 소속부서 |\n|---|---|\n| SMITH | 영업1팀 |\n| ALLEN | 영업2팀 |\n| WARD | 영업1팀 |\n| MARTIN | 영업2팀 |\n\n[부서별실적]\n\n| 실적부서 | 달성액 |\n|---|---|\n| 영업1팀 | 3000 |\n| 영업1팀 | 5000 |\n| 영업2팀 | 1000 |\n| 영업2팀 | 2000 |\n\n```sql\nWITH DeptPerf AS (\n  SELECT 실적부서, AVG(달성액) AS 평균달성액\n  FROM 부서별실적\n  GROUP BY 실적부서\n)\nSELECT A.사원명\nFROM 영업사원 A\nJOIN DeptPerf B ON A.소속부서 = B.실적부서\nWHERE B.평균달성액 > 3000;\n```","x":"영업1팀 평균 4000만 3000을 넘으므로 SMITH, WARD다.","o":["SMITH, WARD","ALLEN, MARTIN","SMITH, ALLEN, WARD, MARTIN","반환되는 행 없음"],"a":0},{"id":"58-48","r":58,"n":48,"s":2,"b":"다음 함수의 반환 결과로 올바른 것은?\n```sql\nSELECT COALESCE(NULL, 1, 2) FROM DUAL;\n```","x":"COALESCE는 처음으로 NULL이 아닌 1을 반환한다.","o":["NULL","1","2","에러"],"a":1},{"id":"58-49","r":58,"n":49,"s":2,"b":"다음과 같이 PRIMARY KEY, NOT NULL 제약조건이 설정된 [도서목록] 테이블이 있다. 이 테이블을 복제하여 [추천도서] 테이블을 생성하는 다음 CTAS(Create Table As Select) 구문을 실행했을 때, [추천도서] 테이블에 자동적으로 적용되는 제약조건은?\n\n| 컬럼명 | 데이터타입 | 제약조건 |\n|---|---|---|\n| 도서번호 | NUMBER | PRIMARY KEY |\n| 도서명 | VARCHAR2(100) | NOT NULL |\n| 저자명 | VARCHAR2(50) | |\n\n```sql\nCREATE TABLE 추천도서 AS \nSELECT * FROM 도서목록 WHERE 도서번호 \u003c 100;\n```","x":"CTAS는 NOT NULL만 복사한다.","o":["PRIMARY KEY","NOT NULL","PRIMARY KEY, NOT NULL","적용되는 제약조건 없음"],"a":1},{"id":"58-50","r":58,"n":50,"s":2,"b":"다음 아래의 [T1] 테이블을 생성한 후, 데이터를 삽입하는 SQL 문 중 실행 시 오류(Error)가 발생하지 않고 정상적으로 실행되는 것은?\n```sql\nCREATE TABLE T1 (\n    COL1 NUMBER DEFAULT 9 PRIMARY KEY,\n    COL2 VARCHAR2(10) NOT NULL\n);\n```","x":"COL1은 DEFAULT 9가 들어가고 COL2는 'A'가 들어가 성공한다.","o":["INSERT INTO T1 VALUES (10);","INSERT INTO T1 (COL1, COL2) VALUES (NULL, 'A');","INSERT INTO T1 (COL2) VALUES ('A');","INSERT INTO T1 (COL1) VALUES (10);"],"a":2},{"id":"59-01","r":59,"n":1,"s":1,"b":"데이터 모델링의 특징에 해당하지 않는 것은?","x":"데이터 모델링의 특징은 추상화·단순화·명확화다. 최적화는 해당하지 않는다.","o":["추상화(Abstraction)","단순화(Simplification)","명확화(Clarity)","최적화(Optimization)"],"a":3},{"id":"59-02","r":59,"n":2,"s":1,"b":"어느 은행이 예금 상품을 관리하기 위해 예금분류 엔터티를 두고, 각 예금의 원금·예치기간·이자율·계산이자를 관리하며 예금 종류마다 코드를 부여한다. 이때 속성 분류에 대한 설명으로 옳지 않은 것은?","x":"이자율과 예치기간은 직접 입력받는 기본속성이다. 계산이자만 파생속성이다.","o":["예금분류 코드는 별도의 코드 엔터티로 분리해 관리하고, 예금 엔터티에는 코드 값만 저장한다.","원금과 예치기간은 업무로부터 직접 입력받는 기본속성이다.","이자율과 예치기간은 다른 속성으로부터 계산되어 나오는 파생속성이다.","계산이자는 원금·이자율·예치기간으로부터 산출되는 파생속성이다."],"a":2},{"id":"59-03","r":59,"n":3,"s":1,"b":"각 속성이 가질 수 있는 값의 범위, 즉 데이터 타입·크기·허용 값의 집합을 정의한 것을 무엇이라 하는가?","x":"속성이 가질 수 있는 값의 범위(타입·크기·허용값)는 도메인이다.","o":["제약조건","도메인","식별자","관계"],"a":1},{"id":"59-04","r":59,"n":4,"s":1,"b":"ERD에서 관계(Relationship)를 표현할 때 사용하는 표기 요소가 아닌 것은?","x":"관계 표기 요소는 관계명·관계차수·관계선택사양이다. 관계빈도는 없다.","o":["관계명(Relationship Membership)","관계차수(Cardinality)","관계선택사양(Optionality)","관계빈도(Relationship Frequency)"],"a":3},{"id":"59-05","r":59,"n":5,"s":1,"b":"다음 중 엔터티(Entity)의 특징으로 옳지 않은 것은?","x":"엔터티는 두 개 이상의 인스턴스를 가져야 한다.","o":["엔터티는 반드시 하나의 인스턴스만 가진다.","엔터티는 두 개 이상의 속성을 가진다.","각 인스턴스를 유일하게 구분하는 식별자를 가진다.","업무에서 사용되며 다른 엔터티와 관계를 가진다."],"a":0},{"id":"59-06","r":59,"n":6,"s":1,"b":"A-B-C-D 네 엔터티가 각각 1:M 식별자 관계로 연쇄 연결된 모델이 있다. 식별관계와 비식별관계에 대한 설명으로 옳지 않은 것은?","x":"비식별 관계로 바꾸면 상위 속성을 얻기 위해 오히려 조인이 늘 수 있어 성능이 항상 좋아지지 않는다.","o":["식별관계에서는 부모 엔터티의 기본키가 자식 엔터티의 기본키의 일부(구성 속성)로 상속된다.","비식별관계로 변경하면 상위 엔터티와의 조인 없이도 데이터에 접근할 수 있어 조회 성능이 항상 향상된다.","비식별관계에서는 부모 엔터티의 기본키가 자식 엔터티의 일반 속성(외래키)으로 상속된다.","식별관계가 연쇄되면 하위 엔터티일수록 기본키를 구성하는 속성의 개수가 늘어난다."],"a":1},{"id":"59-07","r":59,"n":7,"s":1,"b":"다음 [주문] 테이블에서 사원번호 → 사원명, 사원부서 함수 종속이 존재한다.\n\n| 주문번호(PK) | 주문일자 | 사원번호 | 사원명 | 사원부서 |\n|---|---|---|---|---|\n| 1001 | 2026-01-02 | E01 | 홍길동 | 영업1팀 |\n| 1002 | 2026-01-03 | E01 | 홍길동 | 영업1팀 |\n\n기본키(주문번호) → 사원번호 → 사원명·사원부서 형태의 이행적 함수 종속을 제거하기 위해 수행해야 하는 정규화 단계는?","x":"이행 함수 종속 제거는 제3정규화다.","o":["제1정규화","제2정규화","제3정규화","반정규화"],"a":2},{"id":"59-08","r":59,"n":8,"s":1,"b":"트랜잭션(Transaction)이 가져야 할 특성(ACID)에 해당하지 않는 것은?","x":"ACID는 원자성·일관성·고립성·영속성이다. 보안성은 없다.","o":["원자성(Atomicity)","보안성(Security)","일관성(Consistency)","영속성(Durability)"],"a":1},{"id":"59-09","r":59,"n":9,"s":1,"b":"식별자를 그 대표성·생성 방식에 따라 본질식별자와 인조식별자로 구분할 때, 설명으로 옳지 않은 것은?","x":"업무에서 자연스럽게 만들어진 것은 본질식별자다. 인조식별자는 인위적으로 만든 것이다.","o":["인조식별자는 업무로부터 자연스럽게 만들어진 식별자로서 그 자체가 업무 규칙과 의미를 표현한다.","본질식별자는 업무에 의해 자연스럽게 만들어지는 식별자이다.","주식별자가 지나치게 많은 속성으로 구성될 때 이를 대체하기 위해 인조식별자를 사용할 수 있다.","인조식별자는 일련번호처럼 인위적으로 부여한 식별자이다."],"a":0},{"id":"59-10","r":59,"n":10,"s":1,"b":"다음 ERD의 [학생]—[수강] 관계를 읽은 것이다. 관계선은 학생 쪽 끝이 '실선(필수)'이고 수강 쪽 끝이 '까마귀발+실선(1개 이상 필수)'으로 표기되어 있다.\n```\n[학생] ||──────\u003c [수강]\n```\n이 관계에 대한 해석으로 가장 옳은 것은?","x":"수강 쪽이 1개 이상 필수이므로 학생은 반드시 한 개 이상의 수강을 가진다.","o":["한 명의 학생은 수강 신청을 하지 않을 수도 있다.","하나의 수강 인스턴스는 여러 학생과 연결될 수 있다.","한 명의 학생은 최대 한 개의 수강만 가질 수 있다.","한 명의 학생은 반드시 최소 한 개 이상의 수강을 해야 한다."],"a":3},{"id":"59-11","r":59,"n":11,"s":2,"b":"다음 DCL(데이터 제어어)에 대한 설명 중 옳은 것으로만 짝지어진 것은?\n가. DCL은 트랜잭션을 제어하는 명령어로, COMMIT과 ROLLBACK이 이에 속한다.\n나. GRANT 문으로 다른 사용자에게 권한을 부여할 수 있으며, WITH GRANT OPTION을 지정하면 부여받은 권한을 다시 다른 사용자에게 부여할 수 있다.\n다. REVOKE는 이미 부여한 권한을 회수하는 명령어로, 실행되면 변경된 데이터를 물리 디스크에 영구 저장한다.\n라. ROLE은 여러 개의 권한을 하나로 묶어 관리하는 권한의 집합으로, 사용자에게 ROLE을 부여하면 묶인 권한을 한 번에 부여할 수 있다.","x":"COMMIT/ROLLBACK은 TCL이고, REVOKE는 데이터를 저장하지 않는다. 나와 라만 옳다.","o":["가, 나","나, 다","나, 라","가, 나, 라"],"a":2},{"id":"59-12","r":59,"n":12,"s":2,"b":"사원들을 급여 오름차순으로 정렬했을 때, 각 사원의 바로 직전(앞) 행의 급여를 함께 출력하려고 한다. (㉠)에 들어갈 윈도우 함수로 가장 적절한 것은?\n```sql\nSELECT 사원명, 급여,\n       (㉠) AS 직전급여\nFROM 사원;\n```","x":"급여 오름차순에서 직전 행 값은 LAG(급여) OVER (ORDER BY 급여)다.","o":["LAG(급여) OVER (ORDER BY 급여)","LAG(급여) OVER (ORDER BY 급여 DESC)","LEAD(급여) OVER (ORDER BY 급여)","LEAD(급여) OVER (ORDER BY 급여 DESC)"],"a":0},{"id":"59-13","r":59,"n":13,"s":2,"b":"부서 테이블의 부서명에는 'A연구소', '화학연구소', '연구소' 등의 값이 들어 있다. '연구소'로 끝나는 모든 부서명(글자 수와 무관하게, 'A연구소'·'화학연구소'·'연구소' 모두 포함)을 조회하는 WHERE 조건으로 옳은 것은?","x":"'%'는 0글자 이상과 매칭되므로 LIKE '%연구소'가 맞다. =는 와일드카드를 쓰지 않는다.","o":["WHERE 부서명 = '_연구소'","WHERE 부서명 = '%연구소'","WHERE 부서명 LIKE '_연구소'","WHERE 부서명 LIKE '%연구소'"],"a":3},{"id":"59-14","r":59,"n":14,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n```sql\nSELECT NVL2(NULL, 100, 200) AS 결과\nFROM DUAL;\n```","x":"NVL2는 첫 인자가 NULL이면 세 번째 인자를 반환하므로 200이다.","o":["100","200","NULL","실행 오류"],"a":1},{"id":"59-15","r":59,"n":15,"s":2,"b":"사원 테이블은 사원번호(PK), 사원명, 상사번호(그 사원의 상사, 사원번호를 참조) 컬럼을 가진다. 각 사원의 이름과 그 사원의 '상사 이름'을 함께 출력하려고 할 때, 조인 조건으로 옳은 것은?\n```sql\nSELECT e.사원명 AS 사원, m.사원명 AS 상사\nFROM 사원 e JOIN 사원 m\n  ON (㉠);\n```","x":"사원 e의 상사번호가 상사 m의 사원번호와 같아야 한다.","o":["e.사원번호 = m.사원번호","e.상사번호 = m.사원번호","e.사원번호 = m.상사번호","e.상사번호 = m.상사번호"],"a":1},{"id":"59-16","r":59,"n":16,"s":2,"b":"다음 Oracle 전용 표기(+)로 작성된 SQL과 동일한 결과를 내는 ANSI 표준 조인으로 옳은 것은?\n```sql\nSELECT *\nFROM 사원 e, 부서 d\nWHERE e.부서번호 = d.부서번호(+);\n```","x":"(+)가 붙지 않은 사원 쪽이 기준이므로 사원 LEFT OUTER JOIN 부서다.","o":["사원 e LEFT OUTER JOIN 부서 d ON e.부서번호 = d.부서번호","사원 e RIGHT OUTER JOIN 부서 d ON e.부서번호 = d.부서번호","사원 e INNER JOIN 부서 d ON e.부서번호 = d.부서번호","사원 e FULL OUTER JOIN 부서 d ON e.부서번호 = d.부서번호"],"a":0},{"id":"59-17","r":59,"n":17,"s":2,"b":"학생(학번, 이름)과 수강(학번, 과목) 테이블이 있다. '강의를 수강하는(수강 기록이 있는) 학생'을 조회하려고 할 때, 그 방법으로 적절하지 않은 것은?","x":"NOT EXISTS는 수강 기록이 없는 학생을 조회한다.","o":["SELECT * FROM 학생 s WHERE EXISTS (SELECT 1 FROM 수강 c WHERE c.학번 = s.학번)","SELECT * FROM 학생 s WHERE s.학번 IN (SELECT 학번 FROM 수강)","SELECT 학번 FROM 학생 INTERSECT SELECT 학번 FROM 수강","SELECT * FROM 학생 s WHERE NOT EXISTS (SELECT 1 FROM 수강 c WHERE c.학번 = s.학번)"],"a":3},{"id":"59-18","r":59,"n":18,"s":2,"b":"Oracle에서 사원 테이블 중 '사원번호가 가장 큰 사원 1명'을 조회하려고 한다. 올바른 SQL은?","x":"인라인 뷰에서 먼저 정렬한 뒤 ROWNUM = 1로 잘라야 한다.","o":["SELECT * FROM (SELECT * FROM 사원 ORDER BY 사원번호 DESC) WHERE ROWNUM = 1","SELECT TOP 1 * FROM 사원 ORDER BY 사원번호 DESC","SELECT * FROM 사원 WHERE ROWNUM = 1 ORDER BY 사원번호 DESC","SELECT * FROM 사원 WHERE 사원번호 = MAX(사원번호)"],"a":0},{"id":"59-19","r":59,"n":19,"s":2,"b":"비어 있는 주문 테이블에 대해 다음 명령을 순서대로 실행했다. 마지막 SELECT의 결과로 옳은 것은? (SAVEPOINT는 선언하지 않았다.)\n```sql\nINSERT INTO 주문 ...;      -- 30건 삽입\nTRUNCATE TABLE 임시로그;    -- (임시로그 테이블 비우기, DDL)\nINSERT INTO 주문 ...;      -- 10건 추가 삽입\nROLLBACK;\nSELECT COUNT(*) FROM 주문;\n```","x":"TRUNCATE(DDL)가 묵시적 COMMIT을 일으켜 앞의 30건은 확정되고, 이후 10건만 롤백된다.","o":["0","15","30","NULL"],"a":2},{"id":"59-20","r":59,"n":20,"s":2,"b":"고객 테이블에는 고객번호(NOT NULL)와 집주소 컬럼이 있고, 일부 고객은 집주소가 입력되지 않아 NULL이다. '집주소가 입력되지 않은(NULL) 고객의 수'를 구하는 식으로 옳은 것은?","x":"COUNT(고객번호)는 전체 건수, COUNT(집주소)는 NULL을 제외한 건수이므로 그 차가 NULL 개수다.","o":["COUNT(*)","COUNT(집주소)","COUNT(고객번호) - COUNT(집주소)","COUNT(*) - COUNT(고객번호)"],"a":2},{"id":"59-21","r":59,"n":21,"s":2,"b":"다음 중 SQL 문(SELECT)의 논리적 실행 순서를 바르게 나열한 것은?","x":"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY 순이다.","o":["SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY","FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY","FROM → GROUP BY → WHERE → HAVING → SELECT → ORDER BY","FROM → WHERE → HAVING → GROUP BY → SELECT → ORDER BY"],"a":1},{"id":"59-22","r":59,"n":22,"s":2,"b":"전화번호 컬럼(전화번호)에서 '010'으로 시작하는 행만 조회하려고 한다. WHERE 조건으로 옳은 것은?","x":"^는 문자열의 시작을 뜻하므로 '^010'이다.","o":["REGEXP_LIKE(전화번호, '[^010]')","REGEXP_LIKE(전화번호, '010$')","REGEXP_LIKE(전화번호, '^010')","REGEXP_LIKE(전화번호, '02')"],"a":2},{"id":"59-23","r":59,"n":23,"s":2,"b":"다음 SQL을 실행했을 때 (결과1, 결과2)로 옳은 것은?\n```sql\nSELECT\n  CASE WHEN REGEXP_LIKE('BCD', 'B.D')  THEN 'BCD' ELSE 'NULL' END AS 결과1,\n  CASE WHEN REGEXP_LIKE('BCD', 'B\\.D') THEN 'BCD' ELSE 'NULL' END AS 결과2\nFROM DUAL;\n```","x":"'.'은 임의의 한 글자라 BCD와 매칭되고, '\\.'은 실제 마침표라 매칭되지 않는다.","o":["BCD, BCD","NULL, BCD","BCD, NULL","NULL, NULL"],"a":2},{"id":"59-24","r":59,"n":24,"s":2,"b":"집합 연산자(UNION, UNION ALL, INTERSECT, MINUS)에 대한 설명으로 옳지 않은 것은?","x":"데이터 타입이 같은 그룹으로 호환되면 집합 연산이 가능하다.","o":["두 SELECT 결과 컬럼의 데이터 타입이 상호 호환되더라도 반드시 완전히 동일한 데이터 타입으로 일치시켜야만 사용할 수 있다.","UNION은 두 집합을 합친 뒤 중복 행을 제거하며, 이 과정에서 내부적으로 정렬이 수반될 수 있다.","UNION ALL은 중복 행을 제거하지 않으며 별도의 정렬 작업을 수행하지 않는다.","집합 연산에 참여하는 각 SELECT 문의 컬럼 개수는 서로 같아야 한다."],"a":0},{"id":"59-25","r":59,"n":25,"s":2,"b":"CTAS(CREATE TABLE ... AS SELECT)로 새 테이블을 생성할 때에 대한 설명으로 옳지 않은 것은?","x":"CTAS는 NOT NULL만 복사하고 PK·FK는 복사하지 않는다.","o":["원본 테이블의 기본키(PK)·외래키(FK) 제약조건이 새 테이블에 그대로 함께 복사된다.","원본에서 선택된 컬럼의 데이터 타입과 크기는 새 테이블에 전달된다.","원본 컬럼에 설정된 NOT NULL 제약조건은 새 테이블에 전달된다.","SELECT 절에서 컬럼에 별칭(alias)을 부여하면 그 별칭이 새 테이블의 컬럼명이 된다."],"a":0},{"id":"59-26","r":59,"n":26,"s":2,"b":"다음과 같이 정의된 주문 테이블에 INSERT를 실행할 때, 오류가 발생하는 것은?\n```sql\nCREATE TABLE 주문 (\n  주문번호 NUMBER,\n  주문일자 DATE,\n  상품코드 CHAR(3)\n);\n```","x":"숫자 20240606을 DATE 컬럼에 넣으면 타입 불일치 오류가 난다.","o":["INSERT INTO 주문 VALUES (1, TO_DATE('20240606','YYYYMMDD'), '001');","INSERT INTO 주문 (주문번호, 상품코드) VALUES (2, '002');","INSERT INTO 주문 VALUES (3, SYSDATE, '003');","INSERT INTO 주문 VALUES (4, 20240606, '004');"],"a":3},{"id":"59-27","r":59,"n":27,"s":2,"b":"주문일자 순서대로 금액의 '누적 합계'를 구하려고 한다. 빈칸에 들어갈 윈도우 절로 옳은 것은?\n```sql\
