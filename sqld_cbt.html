연봉) DESC다.","o":["ORDER BY 선수명 ASC, 팀명, 3 DESC","ORDER BY 선수명 DESC, 팀명 DESC, 3 DESC","ORDER BY 선수명 ASC, 팀명 ASC, 연봉 ASC","ORDER BY 선수명, 팀명, DESC 연봉"],"a":0},{"id":"49-12","r":49,"n":12,"s":2,"b":"SQL 명령어의 분류가 잘못 짝지어진 것은?","x":"RENAME과 TRUNCATE는 DDL이다.","o":["DML - RENAME, TRUNCATE","DDL - CREATE, ALTER, DROP","DML - INSERT, UPDATE, DELETE","DCL - GRANT, REVOKE"],"a":0},{"id":"49-13","r":49,"n":13,"s":2,"b":"DML을 수행한 뒤 아직 COMMIT하지 않은 상태에 대한 설명으로 옳지 않은 것은?","x":"커밋 전 변경은 다른 사용자가 볼 수 없다.","o":["변경을 수행한 세션에서는 SELECT 문으로 변경된 결과를 조회할 수 있다.","ROLLBACK을 수행하면 변경 이전 상태로 되돌릴 수 있다.","CREATE TABLE과 같은 DDL을 수행하면 묵시적으로 COMMIT이 발생한다.","다른 사용자도 아직 커밋되지 않은 변경 내용을 조회하고 수정할 수 있다."],"a":3},{"id":"49-14","r":49,"n":14,"s":2,"b":"다음 사원 테이블에서 최상위 관리자부터 시작하여 부모에서 자식 방향으로 계층을 전개하려고 한다. 빈칸 (ㄱ)에 들어갈 절로 가장 적절한 것은?\n\n| STAFF_ID | STAFF_NAME | SUPERVISOR_ID |\n|---|---|---|\n| 1000 | 홍길동 | NULL |\n| 1001 | 김서준 | 1000 |\n| 1002 | 이하은 | 1000 |\n| 1003 | 박도윤 | 1001 |\n| 1004 | 최지우 | 1002 |\n\n```sql\nSELECT LEVEL, STAFF_ID, STAFF_NAME\nFROM 사원\nSTART WITH SUPERVISOR_ID IS NULL\n( ㄱ );\n```","x":"부모의 STAFF_ID(PRIOR)가 자식의 SUPERVISOR_ID와 같아야 한다.","o":["CONNECT BY PRIOR STAFF_ID = SUPERVISOR_ID","CONNECT BY PRIOR SUPERVISOR_ID = STAFF_ID","CONNECT BY STAFF_ID = SUPERVISOR_ID","CONNECT BY PRIOR STAFF_ID = PRIOR SUPERVISOR_ID"],"a":0},{"id":"49-15","r":49,"n":15,"s":2,"b":"다음 (A), (B), (C) 설명에 해당하는 함수를 순서대로 바르게 짝지은 것은?\n(A) 지정한 표현식이 NULL이면 대체값을, NULL이 아니면 원래 값을 반환한다.\n(B) 두 표현식의 값이 서로 같으면 NULL을, 다르면 첫 번째 표현식의 값을 반환한다.\n(C) 나열된 표현식 중 왼쪽부터 처음으로 NULL이 아닌 값을 반환한다.","x":"(A) NVL, (B) NULLIF, (C) COALESCE다.","o":["(A) COALESCE - (B) NVL - (C) NULLIF","(A) NULLIF - (B) COALESCE - (C) NVL","(A) NVL - (B) NULLIF - (C) COALESCE","(A) NVL - (B) COALESCE - (C) NULLIF"],"a":2},{"id":"49-16","r":49,"n":16,"s":2,"b":"다음 주문 테이블에 대해 아래 SQL을 수행했을 때 출력되는 고객ID의 순서로 옳은 것은?\n주문(주문번호, 고객ID): (1, C001), (2, C001), (3, C002), (4, C002), (5, C002), (6, C003), (7, C003)\n```sql\nSELECT 고객ID, COUNT(*) AS 건수\nFROM 주문\nGROUP BY 고객ID\nHAVING COUNT(*) = 2\nORDER BY CASE WHEN 고객ID = 'C003' THEN 0 ELSE 1 END, 고객ID;\n```","x":"건수가 2인 C001, C003 중 C003이 CASE에서 0이라 먼저 나온다.","o":["C001, C003","C003, C001","C001, C002, C003","C002, C003"],"a":1},{"id":"49-17","r":49,"n":17,"s":2,"b":"TEAM 테이블과 STADIUM 테이블은 STADIUM_ID 컬럼을 공통으로 가지고 있다. 다음 SQL 중 문법 오류가 발생하는 것은?","x":"ON 절에는 조건식이 필요하다. (STADIUM_ID)만 쓰면 오류다.","o":["SELECT * FROM TEAM T INNER JOIN STADIUM S ON T.STADIUM_ID = S.STADIUM_ID;","SELECT * FROM TEAM T INNER JOIN STADIUM S USING (STADIUM_ID);","SELECT * FROM TEAM NATURAL JOIN STADIUM;","SELECT * FROM TEAM T INNER JOIN STADIUM S ON (STADIUM_ID);"],"a":3},{"id":"49-18","r":49,"n":18,"s":2,"b":"다음 사원 테이블에서 '자신의 관리자의 연봉이 3000 이하인 사원'을 조회하려고 한다. 아래 네 SQL 중 나머지 셋과 결과가 다른 것은?\n\n| 사원번호 | 사원명 | 관리자번호 | 연봉 |\n|---|---|---|---|\n| 1000 | 강도현 | NULL | 5000 |\n| 1001 | 윤채원 | 1000 | 3000 |\n| 1002 | 임서아 | 1000 | 2500 |\n| 1003 | 오지훈 | 1001 | 4000 |\n| 1004 | 신하준 | 1002 | 2000 |\n| 1005 | 배유진 | 1003 | 3500 |","x":"NOT EXISTS는 관리자가 없는 강도현까지 포함해 결과가 다르다.","o":["SELECT E.* FROM 사원 E WHERE EXISTS (SELECT 1 FROM 사원 M WHERE M.사원번호 = E.관리자번호 AND M.연봉 \u003c= 3000);","SELECT E.* FROM 사원 E WHERE E.관리자번호 IN (SELECT M.사원번호 FROM 사원 M WHERE M.연봉 \u003c= 3000);","SELECT E.* FROM 사원 E INNER JOIN 사원 M ON E.관리자번호 = M.사원번호 WHERE M.연봉 \u003c= 3000;","SELECT E.* FROM 사원 E WHERE NOT EXISTS (SELECT 1 FROM 사원 M WHERE M.사원번호 = E.관리자번호 AND M.연봉 > 3000);"],"a":3},{"id":"49-19","r":49,"n":19,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 수행한 결과에 대한 설명으로 가장 적절한 것은?\n- T1(A, B): (1, 10), (2, 20), (3, 30)\n- T2(A, B): (1, 10), (2, NULL), (4, 40)\n```sql\nSELECT *\nFROM T1\nWHERE (A, B) IN (SELECT A, B FROM T2);\n```","x":"(2, NULL)과의 비교는 UNKNOWN이라 (1, 10) 1행만 나온다.","o":["T2에서 B가 NULL인 행은 어떤 T1 행과도 매칭되지 않으므로 최종적으로 1행만 반환된다.","T1의 세 행이 모두 그대로 반환된다.","비교 대상에 NULL이 포함되어 있으므로 오류가 발생하여 실행되지 않는다.","두 테이블의 카티션 곱인 9행이 반환된다."],"a":0},{"id":"49-20","r":49,"n":20,"s":2,"b":"다중 행 서브쿼리에 사용하는 비교 연산자 ANY(SOME)와 ALL에 대한 설명으로 옳은 것은?","x":"ANY는 하나라도 만족하면, ALL은 모두 만족해야 참이다.","o":["ALL은 하위 질의의 결과 중 어느 하나라도 조건을 만족하면 참이 된다.","ANY(SOME)는 하위 질의의 결과 중 어느 하나라도 조건을 만족하면 참이 된다.","ANY(SOME)는 하위 질의의 결과 전부가 조건을 만족해야만 참이 된다.","ANY와 ALL은 결과가 한 건인 단일 행 서브쿼리에서만 사용할 수 있다."],"a":1},{"id":"49-21","r":49,"n":21,"s":2,"b":"WITH절(서브쿼리 팩터링)에 대한 설명으로 옳지 않은 것은?","x":"WITH 절의 임시 결과는 해당 질의 안에서만 쓸 수 있다.","o":["하나의 질의 안에서 정의한 임시 결과집합을 여러 번 참조할 수 있다.","복잡한 서브쿼리에 이름을 부여하여 SQL의 가독성을 높일 수 있다.","WITH절로 정의한 임시 결과집합은 다른 세션에서도 그대로 재사용할 수 있다.","WITH절로 정의한 임시 결과집합은 해당 질의의 실행이 끝나면 소멸한다."],"a":2},{"id":"49-22","r":49,"n":22,"s":2,"b":"다음 게시글 테이블에 대해 아래 SQL을 수행한 결과로 옳은 것은?\n게시글(게시글번호, 작성자ID): (1, U001), (2, U001), (3, U002), (4, U002), (5, U003)\n```sql\nSELECT 작성자ID, COUNT(*)\nFROM 게시글\nGROUP BY 작성자ID\nHAVING COUNT(*) > 2;\n```","x":"건수가 2를 넘는 작성자가 없어 결과가 없다.","o":["0이 한 행 출력된다.","NULL이 한 행 출력된다.","한 건도 출력되지 않는다.","오류가 발생하여 실행되지 않는다."],"a":2},{"id":"49-23","r":49,"n":23,"s":2,"b":"결제 테이블(가맹점ID, 결제금액)에서 가맹점별 결제금액 합계가 가장 큰 가맹점 한 곳만 조회하려고 한다. 오라클에서 의도대로 동작하는 SQL로 가장 적절한 것은?","x":"Oracle은 인라인 뷰로 정렬한 뒤 ROWNUM = 1로 자른다.","o":["SELECT 가맹점ID, SUM(결제금액) FROM 결제 GROUP BY 가맹점ID ORDER BY SUM(결제금액) DESC LIMIT 1;","SELECT 가맹점ID, SUM(결제금액) FROM 결제 WHERE ROWNUM = 1 GROUP BY 가맹점ID;","SELECT TOP 1 가맹점ID, SUM(결제금액) FROM 결제 GROUP BY 가맹점ID ORDER BY SUM(결제금액) DESC;","SELECT * FROM (SELECT 가맹점ID, SUM(결제금액) AS 총결제금액 FROM 결제 GROUP BY 가맹점ID ORDER BY SUM(결제금액) DESC) WHERE ROWNUM = 1;"],"a":3},{"id":"49-24","r":49,"n":24,"s":2,"b":"다음과 같은 결과를 얻기 위해 빈칸 (ㄱ)에 들어갈 윈도우 함수로 가장 적절한 것은?\nT.AMT: 100, 200, 300\n\n| AMT | 결과 |\n|---|---|\n| 100 | 0 |\n| 200 | 100 |\n| 300 | 200 |\n\n```sql\nSELECT AMT, ( ㄱ ) AS 결과\nFROM T\nORDER BY AMT;\n```","x":"LAG(AMT, 1, 0)은 이전 값이 없을 때 0을 반환한다.","o":["LAG(AMT, 1, 0) OVER (ORDER BY AMT)","LEAD(AMT, 1, 0) OVER (ORDER BY AMT)","LAG(AMT, 1) OVER (ORDER BY AMT)","FIRST_VALUE(AMT) OVER (ORDER BY AMT)"],"a":0},{"id":"49-25","r":49,"n":25,"s":2,"b":"다음 회원 테이블에 대해 아래 SQL을 수행했을 때 구분 컬럼에 출력되는 값을 회원ID 순서대로 나열한 것으로 옳은 것은?\n회원(회원ID, 등급): (1, A), (2, B), (3, C), (4, NULL)\n```sql\nSELECT 회원ID,\n       DECODE(등급, NULL, '미지정', 'A', '우수', 'B', '일반', '기타') AS 구분\nFROM 회원\nORDER BY 회원ID;\n```","x":"DECODE는 NULL끼리 같다고 보므로 4번은 '미지정', C는 '기타'다.","o":["우수, 일반, 기타, 미지정","우수, 일반, 기타, 기타","미지정, 우수, 일반, 기타","우수, 일반, C, 미지정"],"a":0},{"id":"49-26","r":49,"n":26,"s":2,"b":"시퀀스(SEQUENCE)로부터 새로운 순번 값을 발급받을 때 사용하는 의사컬럼(Pseudo Column)으로 가장 적절한 것은?","x":"새 순번을 얻는 것은 NEXTVAL이다.","o":["CURRVAL","NEXTVAL","ROWID","ROWNUM"],"a":1},{"id":"49-27","r":49,"n":27,"s":2,"b":"EMP 테이블에는 부서번호(FK)가, DEPT 테이블에는 부서번호와 부서명이 있다. 소속 사원이 한 명도 없는 부서까지 모두 결과에 포함시키려고 할 때 빈칸 (ㄱ)에 들어갈 조인 종류로 가장 적절한 것은?\n```sql\nSELECT B.부서명, A.사원명\nFROM EMP A ( ㄱ ) JOIN DEPT B\nON A.부서번호 = B.부서번호;\n```","x":"DEPT(오른쪽)를 모두 남기려면 RIGHT OUTER JOIN이다.","o":["INNER","LEFT OUTER","RIGHT OUTER","CROSS"],"a":2},{"id":"49-28","r":49,"n":28,"s":2,"b":"HQ_ADMIN이 소유한 TB_CUSTOMER 테이블에 대해, BR_USER가 아래 SQL을 수행할 수 있도록 권한을 부여하려고 한다. HQ_ADMIN이 실행할 문장으로 가장 적절한 것은?\n```sql\nUPDATE HQ_ADMIN.TB_CUSTOMER\nSET 상태코드 = 'Y'\nWHERE 등록일자 >= '20250101';\n```","x":"WHERE 조건 조회에 SELECT, 갱신에 UPDATE 권한이 필요하다.","o":["GRANT SELECT, UPDATE ON HQ_ADMIN.TB_CUSTOMER TO BR_USER;","GRANT SELECT, UPDATE TO BR_USER;","REVOKE SELECT, UPDATE ON HQ_ADMIN.TB_CUSTOMER FROM BR_USER;","DENY SELECT, UPDATE ON HQ_ADMIN.TB_CUSTOMER TO BR_USER;"],"a":0},{"id":"49-29","r":49,"n":29,"s":2,"b":"주문 테이블의 소유자인 DBA가 다음 DCL을 순서대로 수행하였다. 모두 수행한 뒤 주문 테이블에 대한 SELECT 권한을 보유하고 있는 사용자를 모두 고른 것은?\n```sql\n-- (1) DBA 세션\nGRANT SELECT ON 주문 TO U1;\nGRANT SELECT ON 주문 TO U2 WITH GRANT OPTION;\n\n-- (2) U2 세션\nGRANT SELECT ON 주문 TO U3;\n\n-- (3) DBA 세션\nREVOKE SELECT ON 주문 FROM U2 RESTRICT;\n```\n※ 본 문항의 DCL은 SQL 표준(ANSI/ISO) 의미론을 기준으로 해석한다. 표준의 REVOKE는 RESTRICT 또는 CASCADE를 지정할 수 있으며, 두 옵션은 회수 대상 권한에 의존하는 종속 권한(피부여자가 제3자에게 다시 부여한 권한)이 존재할 때의 동작이 서로 다르다. (Oracle 등 일부 DBMS는 REVOKE에서 이 키워드를 지원하지 않으므로, 실제 제품 동작이 아니라 표준 의미론으로 판단한다.)","x":"RESTRICT는 U2가 U3에게 다시 준 종속 권한이 있어 회수가 거부되므로 모두 그대로 유지된다.","o":["DBA, U1","DBA, U1, U3","DBA, U1, U2, U3","DBA, U1, U2"],"a":2},{"id":"49-30","r":49,"n":30,"s":2,"b":"다음과 같이 생성한 빈 테이블 T1에 대해 오류 없이 수행되는 INSERT 문으로 가장 적절한 것은?\n```sql\nCREATE TABLE T1 (\n  A NUMBER DEFAULT 100 PRIMARY KEY,\n  B VARCHAR2(10) NOT NULL,\n  C VARCHAR2(10)\n);\n```","x":"A는 DEFAULT 100이 들어가고 B에 값이 있어 성공한다.","o":["INSERT INTO T1 (B, C) VALUES ('가', '나');","INSERT INTO T1 (A, C) VALUES (1, '나');","INSERT INTO T1 (A, B, C) VALUES (NULL, '가', '나');","INSERT INTO T1 VALUES ('가', '나');"],"a":0},{"id":"49-31","r":49,"n":31,"s":2,"b":"점수 테이블은 (ID, VAL) 두 개의 컬럼으로 구성되어 있으며 현재 한 건의 데이터도 없다. 다음 SQL을 순서대로 수행했을 때 마지막 SELECT 문의 결과로 옳은 것은?\n```sql\nINSERT INTO 점수 VALUES (1, 10);\nINSERT INTO 점수 VALUES (2, 20);\nSAVEPOINT SP1;\nUPDATE 점수 SET VAL = VAL * 2;\nDELETE FROM 점수 WHERE ID = 1;\nROLLBACK TO SAVEPOINT SP1;\nINSERT INTO 점수 VALUES (3, 60);\nCOMMIT;\n\nSELECT AVG(VAL) FROM 점수;\n```","x":"SP1로 롤백 후 (1,10), (2,20), (3,60)이 남아 평균 30이다.","o":["15","30","50","NULL"],"a":1},{"id":"49-32","r":49,"n":32,"s":2,"b":"기본키(PRIMARY KEY) 제약 조건에 대한 설명으로 옳지 않은 것은?","x":"기본키는 중복과 NULL을 모두 허용하지 않는다.","o":["기본키 값은 하나의 테이블 안에서 중복될 수 없다.","기본키로 지정된 컬럼에는 NULL 값을 입력할 수 없다.","기본키는 값의 중복은 허용하되 NULL 값만 허용하지 않는다.","하나의 테이블에는 기본키를 하나만 지정할 수 있다."],"a":2},{"id":"49-33","r":49,"n":33,"s":2,"b":"다음 T 테이블에 대해 아래 SQL을 수행했을 때 M1 컬럼에 출력되는 값을 순서대로 나열한 것으로 옳은 것은?\nT.COL1: 100, 200, 300, 400, 500, 600, 700\n```sql\nSELECT COL1,\n       MAX(COL1) OVER (ORDER BY COL1\n                       ROWS BETWEEN UNBOUNDED PRECEDING AND 2 FOLLOWING) AS M1\nFROM T\nORDER BY COL1;\n```","x":"현재 행과 뒤 두 행까지의 최댓값이라 300, 400, 500, 600, 700, 700, 700이다.","o":["300, 400, 500, 600, 700, 700, 700","700, 700, 700, 700, 700, 700, 700","100, 200, 300, 400, 500, 600, 700","300, 400, 500, 600, 700, 700, 600"],"a":0},{"id":"49-34","r":49,"n":34,"s":2,"b":"다음 T 테이블에 대해 아래 SQL을 수행한 결과(C1, C2)로 옳은 것은?\nT(COL1, COL2): (A, 1), (A, 1), (B, 2), (B, 2)\n```sql\nSELECT COUNT(COL1) AS C1, COUNT(COL2) AS C2\nFROM (SELECT DISTINCT COL1, COL2 FROM T);\n```","x":"DISTINCT 후 (A,1), (B,2) 2행이라 2, 2다.","o":["4, 4","2, 4","4, 2","2, 2"],"a":3},{"id":"49-35","r":49,"n":35,"s":2,"b":"다음 성적 테이블에 대해 아래 SQL을 수행했을 때 AVG1, AVG2, AVG3의 관계에 대한 설명으로 옳은 것은?\n성적(학생ID, 점수): (1, 10), (2, 20), (3, 30), (4, NULL)\n```sql\nSELECT SUM(점수) / COUNT(*)    AS AVG1,\n       SUM(점수) / COUNT(점수) AS AVG2,\n       AVG(점수)               AS AVG3\nFROM 성적;\n```","x":"AVG1 = 60/4 = 15, AVG2 = AVG3 = 20이다.","o":["AVG1과 AVG2가 서로 같다.","AVG2와 AVG3가 서로 같다.","AVG1, AVG2, AVG3가 모두 같다.","AVG1, AVG2, AVG3가 모두 서로 다르다."],"a":1},{"id":"49-36","r":49,"n":36,"s":2,"b":"다음 두 테이블에 대해 아래 SQL을 수행했을 때 반환되는 행의 수는?\n- 회원.이름: SMITH, SCOTT, MARTIN\n- 규칙.패턴: S%, %T%\n```sql\nSELECT A.이름, B.패턴\nFROM 회원 A, 규칙 B\nWHERE A.이름 LIKE B.패턴;\n```","x":"SMITH 2, SCOTT 2, MARTIN 1(%T%)로 5행이다.","o":["0","3","5","6"],"a":2},{"id":"49-37","r":49,"n":37,"s":2,"b":"T 테이블의 COL1 컬럼에는 중복된 값이 들어 있다. 다음 네 SQL 중 나머지 셋과 반환 결과의 형태가 다른 것은?","x":"DISTINCT COUNT(*)는 건수 한 행을 반환하고 나머지는 서로 다른 COL1 목록이다.","o":["SELECT UNIQUE COL1 FROM T;","SELECT DISTINCT COL1 FROM T;","SELECT COL1 FROM T GROUP BY COL1;","SELECT DISTINCT COUNT(*) FROM T;"],"a":3},{"id":"49-38","r":49,"n":38,"s":2,"b":"다음 SQL을 오라클에서 수행했을 때 반환되는 값으로 옳은 것은?\n```sql\nSELECT SUBSTR('ABCDEFGHIJ', -5, 3) AS RESULT FROM DUAL;\n```","x":"뒤에서 5번째인 F부터 3글자라 FGH다.","o":["FG","FGH","CDE","ABCDEFGHIJ"],"a":1},{"id":"49-39","r":49,"n":39,"s":2,"b":"다음 SQL의 실행 결과로 옳은 것은?\n```sql\nSELECT LENGTH('SQL DEVELOPER') AS RESULT FROM DUAL;\n```","x":"공백을 포함해 13글자다.","o":["9","13","12","14"],"a":1},{"id":"49-40","r":49,"n":40,"s":2,"b":"회원 테이블에서 '등급이 F 또는 G이면서 금액이 1000 이상 5000 이하'인 행만 조회하려고 한다. WHERE 절로 가장 적절한 것은?","x":"OR를 괄호로 묶어야 AND와 함께 올바르게 계산된다.","o":["WHERE 등급 = 'F' OR 등급 = 'G' AND 금액 BETWEEN 1000 AND 5000","WHERE 등급 = 'F' OR 등급 = 'G' OR 금액 BETWEEN 1000 AND 5000","WHERE 등급 = 'F' AND 등급 = 'G' AND 금액 BETWEEN 1000 AND 5000","WHERE (등급 = 'F' OR 등급 = 'G') AND 금액 BETWEEN 1000 AND 5000"],"a":3},{"id":"49-41","r":49,"n":41,"s":2,"b":"다음은 오라클에서 ORDER BY 절을 수행할 때 NULL 값이 놓이는 기본 위치를 정리한 것이다. (ㄱ)과 (ㄴ)에 들어갈 말을 각각 쓰시오.\n\n| 정렬 방향 | NULL 값의 기본 위치 |\n|---|---|\n| 오름차순(ASC) | ( ㄱ ) |\n| 내림차순(DESC) | ( ㄴ ) |","x":"Oracle은 NULL을 가장 큰 값으로 보아 ASC에서는 마지막, DESC에서는 처음에 둔다.","t":"s","a":["마지막,처음","맨뒤,맨앞","nullslast,nullsfirst","뒤,앞"]},{"id":"49-42","r":49,"n":42,"s":2,"b":"테이블의 검색 성능을 높이기 위해 특정 컬럼(또는 컬럼 조합)을 기준으로 생성하며, 테이블과는 별도의 저장 공간을 차지하는 데이터베이스 객체의 명칭을 쓰시오.","x":"검색 성능을 위해 별도 공간에 만드는 객체는 인덱스다.","t":"s","a":["인덱스","INDEX"]},{"id":"49-43","r":49,"n":43,"s":2,"b":"다음 SQL은 사원 테이블에서 ( ㄱ )을(를) 조회하는 질의이다. (ㄱ)에 들어갈 말을 쓰시오.\n```sql\nSELECT 부서번호, MAX(연봉)\nFROM 사원\nGROUP BY 부서번호;\n```","x":"부서번호로 묶어 MAX(연봉)을 구하므로 부서별 최고 연봉이다.","t":"s","a":["부서별 최고 연봉","부서별최고연봉","부서별 최대 연봉","부서별최대연봉"]},{"id":"49-44","r":49,"n":44,"s":2,"b":"다음 두 테이블에 대해 아래 MERGE 문을 수행한 뒤, TGT 테이블에 남아 있는 행의 수를 쓰시오.\n- TGT(ID, VAL): (1, 100), (2, 200)\n- SRC(ID, VAL): (1, 111), (2, 222), (3, 333), (4, 444)\n```sql\nMERGE INTO TGT T\nUSING SRC S\nON (T.ID = S.ID)\nWHEN MATCHED THEN\n  UPDATE SET T.VAL = S.VAL\nWHEN NOT MATCHED THEN\n  INSERT (ID, VAL) VALUES (S.ID, S.VAL);\n```","x":"1, 2는 갱신, 3, 4는 삽입되어 4행이다.","t":"s","a":["4"]},{"id":"49-45","r":49,"n":45,"s":2,"b":"다음과 같이 생성한 빈 테이블 회원에 대해 〈보기〉의 INSERT 문을 가~마 순서대로 수행할 때, 오류 없이 성공하는 것을 모두 골라 쓰시오.\n```sql\nCREATE TABLE 회원 (\n  회원번호 NUMBER(4) PRIMARY KEY,\n  회원명   VARCHAR2(10) NOT NULL,\n  성별     VARCHAR2(1)\n);\n```\n가. INSERT INTO 회원 VALUES (1001, '김서준');\n나. INSERT INTO 회원 (회원번호, 회원명, 성별) VALUES (1002, '이하은', 'MALE');\n다. INSERT INTO 회원 (회원번호, 성별) VALUES (1003, 'M');\n라. INSERT INTO 회원 (회원번호, 회원명) VALUES (1004, '박도윤');\n마. INSERT INTO 회원 VALUES (1005, '최지우', 'F');","x":"가는 값 개수 부족, 나는 'MALE'이 1글자 초과, 다는 회원명 NOT NULL 위반이다.","t":"s","a":["라,마","라마"]},{"id":"49-46","r":49,"n":46,"s":2,"b":"하나 이상의 기본 테이블로부터 유도되며, 실제 데이터를 물리적으로 저장하지 않고 논리적으로만 존재하는 가상 테이블 형태의 데이터베이스 객체를 무엇이라 하는지 쓰시오.","x":"물리 저장 없이 논리적으로만 존재하는 가상 테이블은 뷰다.","t":"s","a":["뷰","VIEW"]},{"id":"49-47","r":49,"n":47,"s":2,"b":"다음 대여 테이블에 대해 아래 SQL을 수행했을 때 출력되는 값을 쓰시오.\n대여(대여번호, 회원ID): (1, M001), (2, M001), (3, M002), (4, M002), (5, M003), (6, M003), (7, M003), (8, M004)\n```sql\nSELECT COUNT(*)\nFROM 대여\nGROUP BY 회원ID\nHAVING COUNT(*) > 2;\n```","x":"2건을 넘는 회원은 M003(3건)뿐이다.","t":"s","a":["3"]},{"id":"49-48","r":49,"n":48,"s":2,"b":"다음 상품 테이블에 대해 아래 SQL의 결과가 2행이 되도록 하려고 한다. (ㄱ)에 들어갈 조건을 쓰시오.\n상품(상품ID, 등급): (1, A), (2, B), (3, B), (4, C), (5, C), (6, NULL)\n```sql\nSELECT *\nFROM 상품\nWHERE 등급 = 'A' OR 등급 ( ㄱ );\n```","x":"등급 = 'A' 1행과 등급 IS NULL 1행을 합해 2행이 된다.","t":"s","a":["IS NULL","ISNULL"]},{"id":"49-49","r":49,"n":49,"s":2,"b":"GROUP BY 절에 지정한 컬럼을 오른쪽부터 하나씩 제거해 가며, 그룹별 소계와 전체 총계를 함께 산출해 주는 GROUP BY 확장 연산자의 명칭을 쓰시오.","x":"오른쪽부터 하나씩 빼며 소계와 총계를 만드는 것은 ROLLUP이다.","t":"s","a":["ROLLUP"]},{"id":"49-50","r":49,"n":50,"s":2,"b":"다음 T 테이블에 대해 아래 SQL을 수행하였다. 실행 결과 표의 (ㄱ)과 (ㄴ)에 들어갈 값을 각각 쓰시오.\nT.VAL: 10, 20, 30, 40, 50, 60, 70\n```sql\nSELECT GRP, COUNT(*) AS CNT\nFROM (SELECT VAL, NTILE(3) OVER (ORDER BY VAL) AS GRP FROM T)\nGROUP BY GRP\nORDER BY GRP;\n```\n\n| GRP | CNT |\n|---|---|\n| ( ㄱ ) | ( ㄴ ) |\n| 2 | 2 |\n| 3 | 2 |","x":"7행을 3그룹으로 나누면 1그룹이 3행, 2·3그룹이 2행씩이다.","t":"s","a":["1,3","13"]},{"id":"50-01","r":50,"n":1,"s":1,"b":"주식별자를 도출할 때 고려해야 할 기준으로 가장 적절하지 않은 것은?","x":"명칭·내역처럼 이름으로 기술되는 속성은 주식별자로 쓰지 않는다.","o":["해당 업무에서 자주 이용되는 속성을 주식별자로 지정한다.","값이 자주 변경되지 않는 속성을 주식별자로 지정한다.","여러 속성을 묶어 복합 주식별자를 구성할 때는 구성 속성의 개수를 가능한 한 적게 한다.","명칭·내역과 같이 이름으로 기술되는 속성을 우선적으로 주식별자로 지정한다."],"a":3},{"id":"50-02","r":50,"n":2,"s":1,"b":"ERD에서 엔터티 간의 관계를 표기할 때 사용하는 구성 요소로 가장 적절하지 않은 것은?","x":"관계 표기 요소는 관계명·관계차수·관계선택사양이다.","o":["관계명(Relationship Membership)","관계분류(Relationship Category)","관계차수(Cardinality)","관계선택사양(Optionality)"],"a":1},{"id":"50-03","r":50,"n":3,"s":1,"b":"다음은 보험 업무의 슈퍼타입-서브타입 구조를 표현한 데이터 모델이다. 이 모델을 물리 모델로 변환하는 방법에 대한 설명으로 가장 적절한 것은?\n- 보험계약: 계약번호, 계약일자, 보험료\n- 자동차보험계약: 차량번호, 차종\n- 화재보험계약: 건물면적, 용도\n- 여행자보험계약: 여행지역, 여행기간","x":"하나의 테이블로 통합하면 서브타입을 구분할 타입 구분자 컬럼이 필요하다.","o":["슈퍼타입과 서브타입을 하나의 테이블로 통합하는 방식으로 변환할 경우, 각 행이 어떤 서브타입에 해당하는지 구분하기 위한 타입 구분자 컬럼이 필요하다.","서브타입 사이에 공통 속성이 거의 없더라도 반드시 하나의 테이블로 통합하여 변환해야 한다.","슈퍼타입은 물리 모델에서 표현할 수 없으므로 서브타입에 해당하는 테이블만 생성해야 한다.","슈퍼타입-서브타입 구조는 논리 모델 전용 표기이므로 물리 모델 단계에서는 어떤 방식으로도 변환할 수 없다."],"a":0},{"id":"50-04","r":50,"n":4,"s":1,"b":"엔터티를 존재 성격에 따라 분류할 때 개념 엔터티에 해당하는 것으로 가장 적절한 것은?","x":"조직·보험상품 같은 개념적 정보가 개념 엔터티다.","o":["주문, 입금","조직, 보험상품","청구, 결제","로그인이력, 알림발송"],"a":1},{"id":"50-05","r":50,"n":5,"s":1,"b":"반정규화(De-normalization)에 대한 설명으로 가장 적절하지 않은 것은?","x":"반정규화는 무결성을 해칠 수 있어 신중히 적용해야 한다.","o":["조회 성능을 향상시키기 위해 데이터의 중복을 의도적으로 허용하는 기법이다.","적용하기 전에 대상 데이터의 조회 빈도, 데이터량, 트랜잭션 패턴 등을 충분히 검토해야 한다.","데이터 무결성에 미치는 부작용이 없으므로 성능이 필요한 곳에는 제한 없이 적용해도 된다.","중복 데이터가 생기므로 원본과 복제본 사이의 값을 일치시키는 동기화 관리 방안이 필요하다."],"a":2},{"id":"50-06","r":50,"n":6,"s":1,"b":"데이터 모델링을 수행할 때 유의해야 할 사항으로 가장 적절하지 않은 것은?","x":"성격이 다른 엔터티를 아무 제약 없이 통합하면 안 된다.","o":["동일한 데이터가 여러 곳에 중복 저장되지 않도록 중복을 최소화한다.","업무에서 실제로 적용되는 규칙을 데이터 구조와 제약조건에 반영한다.","업무 성격이 서로 다른 엔터티라도 관리 편의를 위해 아무런 제약 없이 하나로 통합하여 저장한다.","엔터티 사이에 존재하는 관계를 누락 없이 명확하게 표현한다."],"a":2},{"id":"50-07","r":50,"n":7,"s":1,"b":"다음 설명에 해당하는 개념으로 가장 적절한 것은?\n> 하나의 엔터티에 포함된 여러 개의 인스턴스를 서로 유일하게 구분해 낼 수 있는 하나의 속성 또는 속성의 집합이다.","x":"인스턴스를 유일하게 구분하는 속성(집합)은 식별자다.","o":["관계(Relationship)","속성(Attribute)","도메인(Domain)","식별자(Identifier)"],"a":3},{"id":"50-08","r":50,"n":8,"s":1,"b":"다음 테이블에서 발생하는 삽입 이상·갱신 이상·삭제 이상을 제거하기 위해 수행하는 작업에 대한 설명으로 가장 적절한 것은?\n\n| 학번 | 학생명 | 학과코드 | 학과명 | 과목코드 | 과목명 |\n|---|---|---|---|---|---|\n| 20250001 | 김서준 | D01 | 컴퓨터공학과 | C101 | 데이터베이스 |\n| 20250001 | 김서준 | D01 | 컴퓨터공학과 | C102 | 운영체제 |\n| 20250002 | 이하윤 | D01 | 컴퓨터공학과 | C101 | 데이터베이스 |\n| 20250003 | 박지호 | D02 | 산업공학과 | C201 | 생산관리 |","x":"정규화는 함수 종속에 따라 무손실 분해해 이상 현상을 없앤다.","o":["한 테이블에 모든 정보를 모아 두고 중복을 더 늘림으로써 이상 현상을 방지하는 작업이다.","함수적 종속 관계에 따라 테이블을 무손실 분해하여 중복을 제거함으로써 이상 현상을 없애는 작업이다.","조회 성능을 높이는 것이 주된 목적이며 이상 현상의 제거와는 직접적인 관련이 없는 작업이다.","관리 대상 테이블의 개수를 줄이는 것이 주된 목적인 작업이다."],"a":1},{"id":"50-09","r":50,"n":9,"s":1,"b":"M:N 관계를 1:M 관계로 해소하고 정규화를 수행하여 업무 규칙을 상세하게 표현하는 데이터 모델링 단계로 가장 적절한 것은?","x":"M:N 해소와 정규화로 업무 규칙을 상세히 표현하는 것은 논리적 모델링이다.","o":["개괄적 모델링","개념적 모델링","논리적 모델링","물리적 모델링"],"a":2},{"id":"50-10","r":50,"n":10,"s":1,"b":"다음 설명이 정의하고 있는 개념으로 가장 적절한 것은?\n> 각각의 속성이 가질 수 있는 값의 범위와 데이터 타입·크기를 정의해 놓은 것이다.","x":"값의 범위와 타입·크기 정의는 도메인이다.","o":["도메인(Domain)","엔터티(Entity)","식별자(Identifier)","인스턴스(Instance)"],"a":0},{"id":"50-12","r":50,"n":12,"s":2,"b":"다음 데이터에 대해 아래 SQL을 순서대로 수행했을 때 조회되는 합계 값으로 가장 적절한 것은?\n\n| C1 | C2 |\n|---|---|\n| A | 10 |\n| B | 30 |\n| NULL | 40 |\n| A | 50 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["50","90","100","120"],"a":1,"g":1,"m":1},{"id":"50-13","r":50,"n":13,"s":2,"b":"다음 데이터에 대해 아래 SQL을 수행한 결과에 대한 설명으로 가장 적절한 것은?\n- T1(ID, NAME): (A, 가온), (B, 나린), (C, 다솜), (D, 라온), (E, 마루)\n- T2(ID, SCORE): (B, 70), (C, 85), (D, 40)\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. LEFT OUTER JOIN 결과로 추정했다.","o":["결과는 총 5행이며, 그중 3행의 SCORE 값이 NULL로 표시된다.","결과는 총 2행이며, ON절의 조건을 모두 만족하는 행만 반환된다.","결과는 총 3행이며, SCORE 값이 NULL이 되는 행은 결과에서 제외된다.","결과는 총 5행이며, 모든 행의 SCORE 값이 NULL로 표시된다."],"a":0,"g":1,"m":1},{"id":"50-14","r":50,"n":14,"s":2,"b":"다음 SQL을 수행했을 때 RESULT 컬럼에 조회되는 값으로 가장 적절한 것은?\nT1.COL1: DATABASE\n*(SQL 원문 누락)*","x":"원문 SQL 누락. SUBSTR(COL1, 5) = 'BASE'로 추정했다.","o":["DATA","ABASE","ASE","BASE"],"a":3,"g":1,"m":1},{"id":"50-15","r":50,"n":15,"s":2,"b":"다음 SQL을 수행했을 때 CNT 컬럼에 조회되는 값으로 가장 적절한 것은?\n\n| ID | AMT |\n|---|---|\n| 1 | 100 |\n| 2 | 200 |\n| 3 | 150 |\n| 4 | 300 |\n| 5 | 250 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["0","5","9999","실행 시 오류가 발생한다."],"a":1,"g":1,"m":1},{"id":"50-16","r":50,"n":16,"s":2,"b":"두 테이블을 결합할 때 어느 한쪽에만 존재하여 서로 매칭되지 않는 행까지 양쪽 모두 빠짐없이 결과에 포함하려고 한다. 이때 사용해야 할 조인 방식으로 가장 적절한 것은?","x":"양쪽 미매칭 행을 모두 포함하는 것은 FULL OUTER JOIN이다.","o":["INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN","FULL OUTER JOIN"],"a":3},{"id":"50-18","r":50,"n":18,"s":2,"b":"다음은 EMP 테이블에 대해 GROUP BY 확장 연산자를 사용하여 조회한 결과이다. 빈칸 ㉠에 들어갈 내용으로 가장 적절한 것은?\n\n| DEPT | JOB | SUM_SAL |\n|---|---|---|\n| 영업 | 사원 | 300 |\n| 영업 | NULL | 300 |\n| NULL | 사원 | 300 |\n| NULL | NULL | 300 |\n\n*(SQL 원문 누락)*","x":"(DEPT,JOB), (DEPT), (JOB), () 4가지가 모두 나오므로 CUBE다.","o":["ROLLUP(DEPT, JOB)","GROUPING SETS((DEPT, JOB))","CUBE(DEPT, JOB)","DEPT, JOB"],"a":2,"m":1},{"id":"50-19","r":50,"n":19,"s":2,"b":"NATURAL JOIN에 대한 설명으로 가장 적절하지 않은 것은?","x":"NATURAL JOIN은 등가 조인만 수행한다.","o":["두 테이블에서 이름이 같은 컬럼을 자동으로 찾아 조인 조건으로 사용한다.","등가 조인과 비등가 조인을 모두 수행할 수 있다.","USING절과 함께 사용할 수 없다.","ON절과 함께 사용할 수 없다."],"a":1},{"id":"50-21","r":50,"n":21,"s":2,"b":"Oracle에서 사원(EMP) 테이블의 직급(JOB) 컬럼을 VARCHAR2(30) 타입으로 변경하고, 기본값을 '사원'으로 지정하며, NULL 값을 허용하지 않도록 변경하는 SQL로 가장 적절한 것은?","x":"Oracle에서는 MODIFY로 타입·기본값·NOT NULL을 한 번에 바꾼다.","o":["ALTER TABLE EMP MODIFY JOB VARCHAR2(30) DEFAULT '사원' NOT NULL;","ALTER TABLE EMP CHANGE JOB JOB VARCHAR2(30) DEFAULT '사원' NOT NULL;","ALTER TABLE EMP ALTER COLUMN JOB TYPE VARCHAR2(30) DEFAULT '사원' NOT NULL;","UPDATE TABLE EMP MODIFY JOB VARCHAR2(30) DEFAULT '사원' NOT NULL;"],"a":0},{"id":"50-23","r":50,"n":23,"s":2,"b":"다음 중 DCL 또는 TCL에 속하지 않는 명령어로 가장 적절한 것은?","x":"ALTER는 DDL이다.","o":["GRANT","ROLLBACK","ALTER","REVOKE"],"a":2},{"id":"50-24","r":50,"n":24,"s":2,"b":"다음 데이터에 대해 지역별 합계와 분기별 합계만 각각 구하고, 지역과 분기를 함께 묶은 조합별 합계나 전체 총계는 결과에 포함하지 않으려고 한다. 빈칸 ㉠에 들어갈 내용으로 가장 적절한 것은?\n\n| 지역 | 분기 | 금액 |\n|---|---|---|\n| 서울 | 1Q | 100 |\n| 서울 | 2Q | 150 |\n| 부산 | 1Q | 200 |\n| 부산 | 2Q | 120 |\n| 대구 | 1Q | 80 |\n| 대구 | 2Q | 90 |\n\n*(SQL 원문 누락)*","x":"지역별·분기별 합계만 따로 구하려면 GROUPING SETS((지역), (분기))다.","o":["GROUPING SETS((지역), (분기))","ROLLUP(지역, 분기)","CUBE(지역, 분기)","지역, 분기"],"a":0,"m":1},{"id":"50-25","r":50,"n":25,"s":2,"b":"DELETE, TRUNCATE, DROP 명령에 대한 설명으로 가장 적절하지 않은 것은?","x":"TRUNCATE는 자동 커밋된다.","o":["DROP은 테이블에 저장된 데이터뿐 아니라 테이블 정의 자체를 삭제한다.","TRUNCATE는 테이블을 최초 생성되었을 때의 초기 상태로 만든다.","TRUNCATE는 UNDO 데이터를 생성하지 않으므로 DELETE보다 빠르게 수행된다.","DELETE와 TRUNCATE는 모두 사용자가 COMMIT을 수행해야 삭제 결과가 데이터베이스에 반영된다."],"a":3},{"id":"50-26","r":50,"n":26,"s":2,"b":"Oracle에서 테이블 이름으로 사용할 수 있는 것으로 가장 적절한 것은?","x":"테이블명은 문자로 시작하고 하이픈을 쓸 수 없다. SALES_2025#만 가능하다.","o":["2025_SALES","SALES-2025","SALES_2025#","ORDER-DETAIL"],"a":2},{"id":"50-27","r":50,"n":27,"s":2,"b":"다음 SQL이 부서별 최고 연봉을 조회하도록 하려고 한다. 빈칸 ㉠에 들어갈 내용으로 가장 적절한 것은?\n\n| 부서 | 연봉 |\n|---|---|\n| 영업 | 3000 |\n| 영업 | 4500 |\n| 개발 | 5200 |\n| 개발 | 4800 |\n\n*(SQL 원문 누락)*","x":"부서별 MAX를 구하려면 GROUP BY 부서가 필요하다.","o":["WHERE 부서 IS NOT NULL","GROUP BY 부서","HAVING MAX(연봉) > 0","ORDER BY 부서"],"a":1,"g":1,"m":1},{"id":"50-28","r":50,"n":28,"s":2,"b":"다음 SQL을 수행했을 때 조회되는 결과 값으로 가장 적절한 것은?\n\n| 주문번호 | 상태 | 금액 |\n|---|---|---|\n| 1 | A | 12000 |\n| 2 | B | 30000 |\n| 3 | A | 25000 |\n| 4 | C | 18000 |\n| 5 | A | 8000 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 상태 'A'의 금액 합계 45000으로 추정했다.","o":["3","45000","48000","93000"],"a":1,"g":1,"m":1},{"id":"50-29","r":50,"n":29,"s":2,"b":"다음 설명에 해당하는 함수를 (가), (나) 순서대로 나열한 것으로 가장 적절한 것은?\n(가) 첫 번째 인자가 NULL이 아니면 두 번째 인자를, NULL이면 세 번째 인자를 반환한다.\n(나) 두 인자의 값이 서로 같으면 NULL을, 서로 다르면 첫 번째 인자를 반환한다.","x":"(가)는 NVL2, (나)는 NULLIF다.","o":["(가) NVL, (나) NULLIF","(가) NVL2, (나) NULLIF","(가) NVL2, (나) COALESCE","(가) COALESCE, (나) NVL"],"a":1},{"id":"50-30","r":50,"n":30,"s":2,"b":"인덱스(INDEX)에 대한 설명으로 가장 적절하지 않은 것은?","x":"인덱스는 DML 시 함께 갱신되므로 성능에 영향을 준다.","o":["특정 컬럼 값에 대한 탐색 범위를 줄여 조회 성능을 향상시키기 위해 사용한다.","테이블과는 별도의 자료구조로 컬럼 값과 해당 행의 위치 정보를 관리한다.","인덱스를 생성하더라도 INSERT, UPDATE, DELETE 성능에는 전혀 영향을 주지 않는다.","테이블의 데이터가 변경되면 해당 인덱스도 함께 갱신되어야 한다."],"a":2},{"id":"50-31","r":50,"n":31,"s":2,"b":"계층형 질의에 대한 설명으로 가장 적절하지 않은 것은?","x":"리프 노드의 LEVEL은 트리 깊이에 따라 다르다.","o":["CONNECT_BY_ISLEAF는 해당 행이 전개의 마지막(리프) 노드이면 1을, 그렇지 않으면 0을 반환한다.","ORDER SIBLINGS BY는 동일한 계층에 속한 형제 노드들 사이의 정렬 순서를 지정한다.","NOCYCLE 옵션을 사용하면 사이클이 발생하는 지점에서 더 이상 전개하지 않아 무한 루프를 방지한다.","리프 노드의 LEVEL 값은 트리의 깊이와 관계없이 항상 1이다."],"a":3},{"id":"50-32","r":50,"n":32,"s":2,"b":"다음과 같이 생성된 테이블에 판매가가 0보다 커야 한다는 제약조건을 CK_상품_판매가라는 이름으로 추가하려고 한다. 가장 적절한 SQL은?\n*(테이블 생성 SQL 원문 누락)*","x":"ALTER TABLE 상품 ADD CONSTRAINT 이름 CHECK (조건)이다.","o":["ALTER TABLE 상품 ADD CONSTRAINT CK_상품_판매가 CHECK (판매가 > 0);","ALTER TABLE 상품 MODIFY CONSTRAINT CK_상품_판매가 CHECK (판매가 > 0);","ALTER TABLE 상품 ADD CHECK CK_상품_판매가 (판매가 > 0);","CREATE CONSTRAINT CK_상품_판매가 ON 상품 CHECK (판매가 > 0);"],"a":0,"m":1},{"id":"50-33","r":50,"n":33,"s":2,"b":"다음 SQL을 수행했을 때 SYSDATE보다 실제로 얼마만큼 뒤의 시각이 조회되는가?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["30분","1시간","2시간","4시간"],"a":1,"g":1,"m":1},{"id":"50-34","r":50,"n":34,"s":2,"b":"다음 데이터에 대해 아래 두 SQL을 각각 수행했을 때 결과 행 수를 (가), (나) 순서대로 나열한 것으로 가장 적절한 것은?\n- T1(C1, C2): (1, A), (2, B), (3, C)\n- T2(C1, C2): (2, B), (3, C), (4, D)\n\n*((가)·(나) SQL 원문 누락)*","x":"원문 SQL 누락. UNION ALL 6행, UNION 4행으로 추정했다.","o":["(가) 6행, (나) 4행","(가) 6행, (나) 6행","(가) 4행, (나) 6행","(가) 3행, (나) 3행"],"a":0,"g":1,"m":1},{"id":"50-35","r":50,"n":35,"s":2,"b":"집합 연산자에 대한 설명으로 가장 적절하지 않은 것은?","x":"집합 연산 SQL도 마지막에 ORDER BY를 쓸 수 있다.","o":["INTERSECT는 두 결과 집합에 공통으로 존재하는 행만 반환한다.","UNION은 두 결과 집합을 합친 뒤 중복된 행을 제거하여 반환한다.","집합 연산자로 결합된 SQL에는 ORDER BY절을 사용할 수 없다.","EXCEPT(MINUS)는 첫 번째 결과 집합에서 두 번째 결과 집합에 존재하는 행을 제외하여 반환한다."],"a":2},{"id":"50-36","r":50,"n":36,"s":2,"b":"다음 데이터에서 소속 사원이 한 명도 없는 부서까지 포함하여 모든 부서의 부서명과 소속 사원명을 조회하려고 한다. FROM절로 가장 적절한 것은?\n- 부서(부서코드, 부서명): (10, 영업부), (20, 개발부), (30, 총무부)\n- 사원(사번, 사원명, 부서코드): (1, 김하늘, 10), (2, 이준서, 10), (3, 박서연, 20)","x":"모든 부서를 남기려면 부서 LEFT OUTER JOIN 사원이다.","o":["FROM 부서 D INNER JOIN 사원 E ON D.부서코드 = E.부서코드","FROM 부서 D LEFT OUTER JOIN 사원 E ON D.부서코드 = E.부서코드","FROM 부서 D RIGHT OUTER JOIN 사원 E ON D.부서코드 = E.부서코드","FROM 부서 D CROSS JOIN 사원 E"],"a":1},{"id":"50-38","r":50,"n":38,"s":2,"b":"다음 SQL의 결과로 반환되는 행의 수로 가장 적절한 것은?\n\n| 부서 | 직급 | 연봉 |\n|---|---|---|\n| 영업 | 사원 | 3000 |\n| 영업 | 사원 | 3200 |\n| 영업 | 대리 | 4000 |\n| 개발 | 사원 | 3500 |\n| 개발 | 과장 | 5000 |\n| 개발 | 과장 | 5500 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. GROUP BY 부서, 직급이면 4그룹으로 추정했다.","o":["2행","3행","4행","6행"],"a":2,"g":1,"m":1},{"id":"50-39","r":50,"n":39,"s":2,"b":"다음 SQL을 수행했을 때 조회되는 CNT 값으로 가장 적절한 것은?\n사원(사번, 급여): (1, 3000), (2, 4000), (3, 3000), (4, 5000), (5, 4000)\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["2","3","4","5"],"a":1,"g":1,"m":1},{"id":"50-40","r":50,"n":40,"s":2,"b":"'두 번째 글자가 A이고 전체 길이가 4글자 이상인 값'을 조회하기 위한 LIKE 패턴으로 가장 적절하지 않은 것은?","x":"'%A__%'는 A가 두 번째가 아니어도 매칭된다.","o":["'_A__%'","'_A%__'","'_A_%_'","'%A__%'"],"a":3},{"id":"50-43","r":50,"n":43,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n\n| 거래번호 | 회원 | 금액 |\n|---|---|---|\n| 1 | 김도윤 | 1000 |\n| 2 | 이서아 | 2000 |\n| 3 | 박준우 | NULL |\n| 4 | 최지안 | 3000 |\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. AVG(금액)은 NULL을 빼고 6000/3 = 2000으로 추정했다.","o":["750","1500","2000","NULL이 반환되어 값을 계산할 수 없다."],"a":2,"g":1,"m":1},{"id":"50-44","r":50,"n":44,"s":2,"b":"비어 있는 테이블 T(VAL NUMBER)에 대해 다음 SQL을 순서대로 수행하였다. 최종 COMMIT 이후 조회한 SUM(VAL) 값으로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 결과값 추정.","o":["40","70","100","140"],"a":1,"g":1,"m":1},{"id":"50-45","r":50,"n":45,"s":2,"b":"다음 SQL을 수행한 결과로 반환되는 건수로 가장 적절한 것은?\n- A.ID: 1, 2, 3, 4\n- B.ID: 2, NULL\n\n*(SQL 원문 누락)*","x":"원문 SQL 누락. NOT IN 서브쿼리에 NULL이 있어 0건으로 추정했다.","o":["0","2","3","실행 시 오류가 발생한다."],"a":0,"g":1,"m":1},{"id":"50-46","r":50,"n":46,"s":2,"b":"정렬 기준 컬럼에 동일한 값이 존재하더라도 동일한 순위를 부여하지 않고 1부터 1씩 증가하는 고유한 일련번호를 부여하는 윈도우 함수로 가장 적절한 것은?","x":"동점이어도 고유한 번호를 붙이는 것은 ROW_NUMBER다.","o":["RANK","DENSE_RANK","ROW_NUMBER","NTILE"],"a":2},{"id":"50-47","r":50,"n":47,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"원문 SQL 누락. ROUND(38.5361, 2) = 38.54로 추정했다.","o":["38.5361","38.5","38.54","39"],"a":2,"g":1,"m":1},{"id":"50-48","r":50,"n":48,"s":2,"b":"다음과 같이 조인 조건 없이 두 테이블을 FROM절에 나열했을 때 수행되는 조인으로 가장 적절한 것은?\n*(SQL 원문 누락)*","x":"조인 조건 없이 나열하면 CROSS JOIN(카티션 곱)이다.","o":["INNER JOIN","NATURAL JOIN","OUTER JOIN","CROSS JOIN"],"a":3,"m":1},{"id":"50-49","r":50,"n":49,"s":2,"b":"다음 SQL을 수행한 결과가 아래와 같을 때, 빈칸 (가)와 (나)에 들어갈 값으로 가장 적절한 것은?\n매출(순번, 금액): (1, 500), (2, 800), (3, 300)\n*(SQL 원문 누락)*\n\n| 순번 | 금액 | 이전금액 |\n|---|---|---|\n| 1 | 500 | NULL |\n| 2 | 800 | (가) |\n| 3 | 300 | (나) |","x":"LAG(금액)이면 이전 행 값 500, 800이 나온다.","o":["(가) 500, (나) 800","(가) 800, (나) 300","(가) NULL, (나) 500","(가) 800, (나) 500"],"a":0,"m":1},{"id":"50-50","r":50,"n":50,"s":2,"b":"다음 설명에 해당하는 명령어로 가장 적절한 것은?\n> 트랜잭션 처리 도중 오류가 발생했을 때, 트랜잭션이 시작된 이후에 수행한 모든 변경 작업을 취소하고 직전 COMMIT 시점의 상태로 되돌린다.","x":"마지막 COMMIT 이후 변경을 모두 취소하는 것은 ROLLBACK이다.","o":["COMMIT","SAVEPOINT","ROLLBACK","GRANT"],"a":2},{"id":"51-01","r":51,"n":1,"s":1,"b":"다음 중 비식별자 관계로 설계된 모델에 대한 설명으로 가장 적절하지 않은 것은?","x":"비식별자 관계에서 상위 엔터티 속성까지 조회하려면 조인이 늘어난다.","o":["부모 엔터티의 주식별자가 자식 엔터티의 일반 속성으로 상속된다.","부모 엔터티의 인스턴스가 아직 생성되지 않아도 자식 엔터티의 인스턴스를 먼저 생성할 수 있다.","부모 엔터티의 인스턴스를 자식 엔터티의 인스턴스보다 먼저 삭제할 수 있다.","상위 엔터티의 속성까지 함께 조회할 때 필요한 테이블 간 조인이 최소화된다."],"a":3},{"id":"51-02","r":51,"n":2,"s":1,"b":"다음 상황에서 적용할 조치로 가장 적절한 것은?\n\n| 테이블 | 주요 컬럼 |\n|---|---|\n| 주문상세 | 주문번호(PK), 상품번호(PK, FK), 주문수량 |\n| 상품 | 상품번호(PK), 상품명, 상품분류코드, 단가 |\n\n- 주문상세 조회 화면은 하루 수백만 건 호출되며, 매 호출마다 상품명을 얻기 위해 상품 테이블과의 조인이 발생한다.\n- 성능 측정 결과 정규화된 현재 구조로는 응답 시간 목표를 달성할 수 없는 것으로 확인되었다.","x":"조회가 매우 잦은 상품명을 주문상세에 중복 저장하는 반정규화로 조인을 없앤다.","o":["조회 빈도가 매우 높은 상품명을 주문상세 테이블에 중복 저장하여 상품 테이블과의 조인을 제거한다.","주문상세 테이블에 정규화를 한 단계 더 적용하여 주문수량을 별도 테이블로 분리한다.","상품 테이블을 상품기본과 상품부가로 임의 분할하여 테이블당 컬럼 수를 줄인다.","테이블 구조는 그대로 두고 상품 테이블의 상품명 컬럼에 인덱스를 생성한다."],"a":0},{"id":"51-03","r":51,"n":3,"s":1,"b":"다음 중 물리 모델링에 대한 설명으로 가장 적절하지 않은 것은?","x":"누가 어떤 절차로 업무를 하는지는 프로세스 설계의 영역이다.","o":["논리 모델을 실제 DBMS의 테이블과 컬럼으로 구현하는 단계이다.","인덱스, 파티션 등 성능을 고려한 물리적 구조를 설계한다.","데이터의 물리적 저장 구조와 접근 방식을 정의한다.","데이터에 누가 접근하고 어떤 절차로 업무를 수행하는지를 정의하는 것이 핵심이다."],"a":3},{"id":"51-04","r":51,"n":4,"s":1,"b":"다음 테이블이 만족하지 못하는 정규형 중 가장 낮은 단계로 가장 적절한 것은?\n\n| 주문번호(PK) | 상품번호(PK) | 주문수량 | 상품명 |\n|---|---|---|---|\n| 1001 | P01 | 2 | 무선마우스 |\n| 1001 | P02 | 1 | 기계식키보드 |\n| 1002 | P01 | 5 | 무선마우스 |\n\n- 상품명은 상품번호가 정해지면 유일하게 결정되며, 주문번호와는 무관하다.\n- 모든 컬럼의 값은 더 이상 분해되지 않는 단일 값이다.","x":"상품명이 상품번호(PK 일부)에만 종속되는 부분 종속이므로 제2정규형을 만족하지 못한다.","o":["제1정규형","제2정규형","제3정규형","BCNF"],"a":1},{"id":"51-05","r":51,"n":5,"s":1,"b":"다음 모델의 물리 변환 방식으로 가장 적절한 것은?\n\n| 구분 | 속성 |\n|---|---|\n| 결제수단(슈퍼타입) | 결제번호, 결제일자, 결제금액 |\n| 카드결제(서브타입) | 카드사코드, 카드번호, 할부개월수, 승인번호 |\n| 계좌이체(서브타입) | 은행코드, 계좌번호, 이체확인번호 |\n\n- 카드결제와 계좌이체는 서로 다른 화면에서 각각 단독으로 조회되며, 두 서브타입을 함께 조회하는 업무는 거의 없다.\n- 서브타입 간 속성 구성의 차이가 크다.","x":"서브타입을 따로 조회하고 속성 차이가 크면 서브타입별 테이블(Plus Type)로 나눈다.","o":["슈퍼타입과 모든 서브타입의 속성을 하나의 테이블로 통합한다.","슈퍼타입의 속성을 각 서브타입에 포함시켜 카드결제, 계좌이체 두 개의 테이블로 완전히 분리한다.","슈퍼타입 테이블과 서브타입 테이블을 각각 별도로 두고 조회할 때마다 조인한다.","슈퍼타입 속성 일부는 서브타입 테이블에, 서브타입 속성 일부는 슈퍼타입 테이블에 나누어 배치한다."],"a":1},{"id":"51-06","r":51,"n":6,"s":1,"b":"다음 중 파생 속성에 해당하는 것으로 가장 적절한 것은?","x":"고객별 최종주문일자는 주문 데이터에서 계산해 얻는 파생 속성이다.","o":["고객번호","상품코드","고객별 최종주문일자","주문일자"],"a":2},{"id":"51-07","r":51,"n":7,"s":1,"b":"다음 테이블의 구조를 개선하는 방법으로 가장 적절한 것은?\n\n| 고객번호 | 고객명 | 취미 |\n|---|---|---|\n| C001 | 김민수 | 독서,영화,운동 |\n| C002 | 박지현 | 등산 |\n\n> 조건: 취미 컬럼에는 한 고객이 가진 여러 개의 취미가 구분자(,)로 나열되어 하나의 값으로 저장된다.","x":"다중값은 별도 엔터티로 분리해 한 행에 하나씩 저장한다.","o":["취미 컬럼의 길이를 충분히 늘려 더 많은 값을 나열할 수 있게 한다.","취미1, 취미2, 취미3 컬럼을 추가하여 값을 나누어 저장한다.","취미 컬럼은 그대로 두고 애플리케이션에서 구분자로 분리해 사용한다.","고객취미 엔터티를 별도로 만들어 취미 하나를 한 행으로 저장한다."],"a":3},{"id":"51-08","r":51,"n":8,"s":1,"b":"다음 중 주식별자를 선정하는 기준으로 가장 적절하지 않은 것은?","x":"복합 식별자는 속성 수를 최소로 해야 한다.","o":["해당 엔터티를 대표할 수 있고 업무에서 자주 이용되는 속성을 선정한다.","복합 식별자를 구성할 때는 가능한 한 많은 속성을 포함시켜 식별력을 높인다.","명칭이나 내역과 같이 이름으로 기술되는 속성은 가급적 주식별자로 지정하지 않는다.","업무적으로 거의 사용되지 않는 속성은 주식별자로 선정하지 않는다."],"a":1},{"id":"51-09","r":51,"n":9,"s":1,"b":"주식별자로 지정되면 반드시 데이터 값이 존재해야 하며 NULL이 될 수 없다. 이러한 주식별자의 특성으로 가장 적절한 것은?","x":"주식별자에 반드시 값이 있어야 하는 성질은 존재성이다.","o":["유일성","최소성","존재성","불변성"],"a":2},{"id":"51-10","r":51,"n":10,"s":1,"b":"엔터티를 구성하는 항목으로서, 업무에서 관리하고자 하는 정보를 의미상 더 이상 분리되지 않는 최소의 데이터 단위로 표현한 것을 가리키는 용어로 가장 적절한 것은?","x":"의미상 더 이상 분리되지 않는 최소 데이터 단위는 속성이다.","o":["속성","엔터티","인스턴스","관계"],"a":0},{"id":"51-11","r":51,"n":11,"s":2,"b":"다음 중 트랜잭션에 대한 설명으로 가장 적절하지 않은 것은?","x":"처리 중인 데이터는 다른 트랜잭션이 바꿀 수 없도록 고립되어야 한다.","o":["트랜잭션은 데이터베이스의 논리적 연산 단위이다.","트랜잭션은 종료 시점에 COMMIT 또는 ROLLBACK으로 마무리된다.","트랜잭션은 원자성, 일관성, 고립성, 지속성을 보장해야 한다.","하나의 트랜잭션에서 처리 중인 데이터는 다른 트랜잭션에서도 자유롭게 변경할 수 있다."],"a":3},{"id":"51-12","r":51,"n":12,"s":2,"b":"다음 데이터에서 등록일별 누적 수량을 구하려고 한다. 같은 등록일에 속한 행은 모두 동일한 누적값을 가져야 할 때, 이 요건을 만족하지 못하는 SQL로 가장 적절한 것은?\n\n| 등록일 | 수량 |\n|---|---|\n| 2024-03-01 | 30 |\n| 2024-03-02 | 45 |\n| 2024-03-02 | 55 |\n| 2024-03-03 | 70 |\n\n```sql\n-- (가)\nSELECT 등록일, 수량,\n       SUM(수량) OVER (ORDER BY 등록일) AS 누적\n  FROM 입고;\n\n-- (나)\nSELECT 등록일, 수량,\n       SUM(수량) OVER (ORDER BY 등록일\n                       RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS 누적\n  FROM 입고;\n\n-- (다)\nSELECT 등록일, 수량,\n       SUM(수량) OVER (ORDER BY 등록일\n                       ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS 누적\n  FROM 입고;\n\n-- (라)\nSELECT A.등록일, A.수량,\n       (SELECT SUM(B.수량) FROM 입고 B WHERE B.등록일 \u003c= A.등록일) AS 누적\n  FROM 입고 A;\n```","x":"ROWS는 같은 등록일이라도 행마다 누적값이 달라진다.","o":["(가)","(나)","(다)","(라)"],"a":2},{"id":"51-13","r":51,"n":13,"s":2,"b":"Oracle에서 정렬 결과의 가장 마지막에 NULL이 출력되도록 하는 방법으로 가장 적절한 것은?","x":"NULLS LAST로 NULL을 마지막에 둔다.","o":["ORDER BY COL1 NULLS LAST","ORDER BY NVL(COL1, 0)","ORDER BY NULLIF(COL1, 0)","ORDER BY COALESCE(COL1, 0)"],"a":0},{"id":"51-14","r":51,"n":14,"s":2,"b":"USER1이 소유한 EMP 테이블을 USER2가 조회할 수 있도록 권한을 부여하는 명령으로 가장 적절한 것은?","x":"GRANT SELECT ON USER1.EMP TO USER2다.","o":["GRANT SELECT ON USER1.EMP TO USER2;","REVOKE SELECT ON USER1.EMP FROM USER2;","GRANT ALL ON USER1.EMP TO SYS;","CONNECT USER2 IDENTIFIED BY USER2;"],"a":0},{"id":"51-15","r":51,"n":15,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n\n| 부서 | 사원명 |\n|---|---|\n| 인사 | 박서준 |\n| 인사 | 김하늘 |\n| 영업 | 최유진 |\n| 영업 | 이도윤 |\n| 총무 | 정하은 |\n\n```sql\nSELECT 부서,\n       LISTAGG(사원명, ',') WITHIN GROUP (ORDER BY 사원명) AS 사원목록\n  FROM 사원\n GROUP BY 부서\n ORDER BY 부서;\n```\n> 조건: 사원명은 가나다순으로 정렬된다.","x":"LISTAGG가 사원명 가나다순으로 쉼표를 넣어 붙인다.","o":["영업 → 최유진,이도윤 / 인사 → 박서준,김하늘 / 총무 → 정하은","영업 → 이도윤,최유진 / 인사 → 김하늘,박서준 / 총무 → 정하은","영업 → 이도윤최유진 / 인사 → 김하늘박서준 / 총무 → 정하은","김하늘,박서준,이도윤,정하은,최유진 (한 행)"],"a":1},{"id":"51-16","r":51,"n":16,"s":2,"b":"다음 요건을 만족하도록 빈칸에 들어갈 내용으로 가장 적절한 것은?\n```sql\nSELECT 부서, 직급, SUM(연봉) AS 연봉합\n  FROM 사원\n GROUP BY ______;\n```\n- (부서, 직급) 조합별 상세 집계와 전체 총계가 모두 필요하다.\n- 부서 단독 소계와 직급 단독 소계는 필요하지 않다.","x":"(부서,직급)과 전체 총계만 필요하므로 GROUPING SETS((부서, 직급), ())다.","o":["ROLLUP(부서, 직급)","GROUPING SETS((부서, 직급), ())","CUBE(부서, 직급)","부서, 직급"],"a":1},{"id":"51-17","r":51,"n":17,"s":2,"b":"다음 SQL을 그대로 실행하면 COL2가 0인 행에서 'divisor is equal to zero' 오류가 발생한다. 분모가 0일 때 NULL을 반환하도록 빈칸에 들어갈 함수로 가장 적절한 것은?\n\n| COL1 | COL2 |\n|---|---|\n| 100 | 5 |\n| 200 | 0 |\n| 300 | 10 |\n\n```sql\nSELECT COL1 / ( ? (COL2, 0) ) AS 결과\n  FROM T;\n```","x":"NULLIF(COL2, 0)은 0이면 NULL을 반환해 나눗셈 결과가 NULL이 된다.","o":["NVL","COALESCE","DECODE","NULLIF"],"a":3},{"id":"51-18","r":51,"n":18,"s":2,"b":"다음 두 SQL의 실행 결과를 순서대로 짝지은 것으로 가장 적절한 것은?\n\n| A | B | C | D |\n|---|---|---|---|\n| 10 | 20 | 30 | 40 |\n| 10 | NULL | 30 | 40 |\n| NULL | 20 | 30 | 40 |\n| 10 | 20 | NULL | 40 |\n\n```sql\n-- (가)\nSELECT SUM(A + B + C + D) AS 결과 FROM T;\n\n-- (나)\nSELECT SUM(A) + SUM(B) + SUM(C) + SUM(D) AS 결과 FROM T;\n```","x":"(가)는 NULL 없는 1행만 100, (나)는 열별 합 30+60+90+160 = 340이다.","o":["100, 340","340, 340","100, NULL","NULL, NULL"],"a":0},{"id":"51-19","r":51,"n":19,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n\n| COL1 | COL2 |\n|---|---|\n| A | 10 |\n| B | 20 |\n| C | 30 |\n\n```sql\nSELECT NVL(MAX(COL1), 'X') AS 결과\n  FROM T\n WHERE COL2 > 100\n GROUP BY COL1;\n```","x":"GROUP BY가 있고 대상 행이 없으면 그룹이 생기지 않아 결과가 없다.","o":["'X' 한 행이 출력된다.","NULL 한 행이 출력된다.","조회되는 행이 없다.","COL1의 최댓값인 'C' 한 행이 출력된다."],"a":2},{"id":"51-20","r":51,"n":20,"s":2,"b":"다음 중 오류가 발생하지 않는 명령으로 가장 적절한 것은?\n```sql\nCREATE TABLE T (\n  COL1 NUMBER,\n  COL2 VARCHAR2(10) DEFAULT 'AAA',\n  COL3 DATE,\n  COL4 VARCHAR2(10)\n);\n```\n- T에는 이미 데이터가 저장되어 있다.\n- COL2에는 기본값 'AAA'가, COL4에는 'A01', 'B02'와 같은 문자열이 저장되어 있다.","x":"데이터가 있어도 DATE를 TIMESTAMP로는 바꿀 수 있다. 나머지는 타입 변환이 실패한다.","o":["ALTER TABLE T MODIFY (COL1 VARCHAR2(10));","ALTER TABLE T MODIFY (COL2 NUMBER);","ALTER TABLE T MODIFY (COL3 TIMESTAMP);","ALTER TABLE T MODIFY (COL4 NUMBER);"],"a":2},{"id":"51-21","r":51,"n":21,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n- T1.COL1: A, B\n- T2.COL1: A, (NULL)\n```sql\nSELECT COUNT(*) AS CNT\n  FROM T1\n WHERE NOT EXISTS (SELECT 1 FROM T2 WHERE T2.COL1 = T1.COL1);\n```","x":"B만 T2에 없어 1건이다. NULL은 A와 같지 않다.","o":["0","1","2","NULL"],"a":1},{"id":"51-22","r":51,"n":22,"s":2,"b":"다음 두 SQL의 실행 결과를 순서대로 짝지은 것으로 가장 적절한 것은?\n```sql\n-- (가)\nSELECT 10 / NULL AS 결과 FROM DUAL;\n\n-- (나)\nSELECT 10 / 0 AS 결과 FROM DUAL;\n```","x":"NULL과의 연산은 NULL, 0으로 나누면 오류다.","o":["10, 10","0, 0","NULL, 오류 발생","NULL, NULL"],"a":2},{"id":"51-23","r":51,"n":23,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n\n| COL1 | COL2 |\n|---|---|\n| A | 100 |\n| A | 200 |\n| B | 50 |\n| C | 50 |\n\n```sql\nSELECT COL1, COL2\n  FROM T\n WHERE NOT (COL1 \u003c> 'A')\n   AND COL2 \u003c= 60;\n```","x":"COL1이 'A'인 행은 COL2가 100, 200이라 60 이하 조건에 맞지 않는다.","o":["COL1이 'A'인 2개 행이 조회된다.","COL2가 60 이하인 2개 행이 조회된다.","전체 4개 행이 모두 조회된다.","조회되는 행이 없다."],"a":3},{"id":"51-24","r":51,"n":24,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n- T1(C1): 1, 2, 3\n- T2(C1, VAL2): (2, 200), (4, 400)\n- T3(C1, VAL3): (3, 30), (5, 50), (6, 60)\n```sql\nSELECT SUM(T3.VAL3) AS 합계\n  FROM T1\n       LEFT OUTER JOIN T2 ON T1.C1 = T2.C1\n       RIGHT OUTER JOIN T3 ON T1.C1 = T3.C1;\n```","x":"RIGHT JOIN으로 T3 행이 모두 남아 30+50+60 = 140이다.","o":["30","110","140","340"],"a":2},{"id":"51-25","r":51,"n":25,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT INSTR('DATABASE', 'BA') AS 결과 FROM DUAL;\n```","x":"'BA'는 5번째 위치에서 시작한다.","o":["0","2","4","5"],"a":3},{"id":"51-26","r":51,"n":26,"s":2,"b":"다음 SQL 수행 후 T1, T2, T3에 저장된 행의 개수를 순서대로 짝지은 것으로 가장 적절한 것은?\nSRC.VAL: 50, 150, 250\n> 조건: T1, T2, T3는 모두 VAL 컬럼 하나만 가지며 비어 있는 상태에서 시작한다.\n```sql\nINSERT FIRST\n  WHEN VAL >= 100 THEN INTO T1\n  WHEN VAL >= 200 THEN INTO T2\n  ELSE INTO T3\nSELECT VAL FROM SRC;\n```","x":"150·250은 첫 조건으로 T1, 50은 ELSE로 T3에 들어간다.","o":["2, 0, 1","2, 1, 1","1, 1, 1","0, 0, 3"],"a":0},{"id":"51-27","r":51,"n":27,"s":2,"b":"점수가 60 이상 90 이하인 행을 조회하기 위한 조건 WHERE 점수 BETWEEN 60 AND 90과 동일한 의미를 갖는 것으로 가장 적절한 것은?","x":"BETWEEN은 양 끝을 포함하므로 >= 60 AND \u003c= 90이다.","o":["WHERE 점수 >= 60 AND 점수 \u003c= 90","WHERE 점수 > 60 AND 점수 \u003c 90","WHERE 점수 >= 60 OR 점수 \u003c= 90","WHERE 점수 \u003c= 60 AND 점수 >= 90"],"a":0},{"id":"51-28","r":51,"n":28,"s":2,"b":"각 사원 행에 그 사원이 속한 부서의 최고 급여자 사원명을 함께 표시하려고 한다. 빈칸에 들어갈 내용으로 가장 적절한 것은?\n\n| 부서 | 사원명 | 급여 |\n|---|---|---|\n| 10 | 김철수 | 5000 |\n| 10 | 이영희 | 7000 |\n| 20 | 박민수 | 4000 |\n| 20 | 정수진 | 6000 |\n| 20 | 최지훈 | 3000 |\n\n```sql\nSELECT 부서, 사원명, 급여,\n       ( ? ) AS 최고급여자\n  FROM 사원;\n```","x":"부서별 급여 내림차순의 첫 값 FIRST_VALUE(사원명)이 최고 급여자다.","o":["MAX(급여) OVER (PARTITION BY 부서)","RANK() OVER (PARTITION BY 부서 ORDER BY 급여 DESC)","FIRST_VALUE(사원명) OVER (PARTITION BY 부서 ORDER BY 급여 DESC)","LAST_VALUE(사원명) OVER (PARTITION BY 부서 ORDER BY 급여 DESC)"],"a":2},{"id":"51-29","r":51,"n":29,"s":2,"b":"다음 두 SQL의 차이에 대한 설명으로 가장 적절한 것은?\n\n| 부서 | 사원명 | 급여 |\n|---|---|---|\n| 10 | 김철수 | 5000 |\n| 10 | 이영희 | 7000 |\n| 20 | 박민수 | 6000 |\n| 20 | 정수진 | 4000 |\n\n```sql\n-- (가)\nSELECT 부서, 사원명,\n       RANK() OVER (ORDER BY 급여 DESC) AS 순위\n  FROM 사원;\n\n-- (나)\nSELECT 부서, 사원명,\n       RANK() OVER (PARTITION BY 부서 ORDER BY 급여 DESC) AS 순위\n  FROM 사원;\n```","x":"PARTITION BY 부서를 쓰면 부서마다 순위가 1부터 다시 시작된다.","o":["(가)와 (나)의 결과는 항상 동일하다.","PARTITION BY 절이 정렬 순서를 급여 오름차순으로 바꾸므로 (나)의 순위는 (가)와 반대가 된다.","(가)는 전체 사원을 대상으로 순위를 매기지만, (나)는 부서마다 순위가 1부터 다시 시작된다.","(가)도 부서 컬럼을 함께 조회하고 있으므로 부서별로 순위가 나뉘어 계산된다."],"a":2},{"id":"51-30","r":51,"n":30,"s":2,"b":"다음 중 실행 결과가 나머지 셋과 다른 것으로 가장 적절한 것은?\n- TB_A.NUM: 11, 12, 13, 14, 15\n- TB_B.NUM: 11, 12, 13\n```sql\n-- (가)\nSELECT NUM FROM TB_A\nMINUS\nSELECT NUM FROM TB_B;\n\n-- (나)\nSELECT NUM FROM TB_A\n WHERE NUM NOT IN (SELECT NUM FROM TB_B);\n\n-- (다)\nSELECT A.NUM\n  FROM TB_A A LEFT OUTER JOIN TB_B B ON A.NUM = B.NUM\n WHERE B.NUM IS NULL;\n\n-- (라)\nSELECT A.NUM\n  FROM TB_A A, TB_B B\n WHERE A.NUM \u003c> B.NUM;\n```","x":"(라)는 카티션 곱에서 다른 값끼리 짝지어 여러 행이 나온다. 나머지는 14, 15다.","o":["(가)","(나)","(다)","(라)"],"a":3},{"id":"51-31","r":51,"n":31,"s":2,"b":"다음 스크립트를 수행한 후 사원 테이블에 남아 있는 행의 개수로 가장 적절한 것은?\n```sql\nCREATE TABLE 부서 (\n  부서번호 NUMBER PRIMARY KEY,\n  부서명   VARCHAR2(20)\n);\n\nCREATE TABLE 사원 (\n  사원번호 NUMBER PRIMARY KEY,\n  부서번호 NUMBER REFERENCES 부서(부서번호) ON DELETE CASCADE\n);\n\nINSERT INTO 부서 VALUES (10, '인사');\nINSERT INTO 부서 VALUES (20, '영업');\nINSERT INTO 사원 VALUES (1, 10);\nINSERT INTO 사원 VALUES (2, 10);\nINSERT INTO 사원 VALUES (3, 20);\nINSERT INTO 사원 VALUES (4, 20);\nINSERT INTO 사원 VALUES (5, 20);\nCOMMIT;\n\nDELETE FROM 부서 WHERE 부서번호 = 20;\n```","x":"부서 20 삭제 시 CASCADE로 소속 사원 3명이 함께 지워져 2명이 남는다.","o":["0개","2개","5개","참조 무결성 위반 오류가 발생하여 DELETE가 수행되지 않는다."],"a":1},{"id":"51-32","r":51,"n":32,"s":2,"b":"다음 SQL의 WHERE 조건과 동일한 의미를 갖는 것으로 가장 적절한 것은?\n```sql\nSELECT *\n  FROM ORD\n WHERE (GRD, QTY) IN (('S1', 250), ('S2', 780));\n```","x":"각 쌍이 동시에 같은 경우를 OR로 연결한 것이다.","o":["WHERE GRD = 'S1' AND QTY = 250 AND GRD = 'S2' AND QTY = 780","WHERE GRD IN ('S1', 'S2') AND QTY IN (250, 780)","WHERE (GRD = 'S1' AND QTY = 250) OR (GRD = 'S2' AND QTY = 780)","WHERE GRD = 'S1' OR QTY = 780"],"a":2},{"id":"51-33","r":51,"n":33,"s":2,"b":"다음 중 뷰(VIEW)에 대한 설명으로 가장 적절하지 않은 것은?","x":"일반 뷰는 데이터를 물리적으로 저장하지 않는다.","o":["뷰를 생성하면 뷰가 조회하는 데이터가 별도의 저장 공간에 물리적으로 저장된다.","뷰는 실제 데이터를 가지고 있지 않은 논리적인 테이블이다.","뷰를 통해 뷰가 참조하는 테이블의 데이터를 조회할 수 있다.","뷰가 참조하는 테이블의 구조가 변경되면 뷰도 영향을 받는다."],"a":0},{"id":"51-34","r":51,"n":34,"s":2,"b":"다음 SQL을 순서대로 수행한 후 조회되는 결과로 가장 적절한 것은?\n```sql\nCREATE TABLE T (COL1 NUMBER);\n\nINSERT INTO T VALUES (10);\nINSERT INTO T VALUES (20);\nINSERT INTO T VALUES (30);\nSAVEPOINT SP1;\nINSERT INTO T VALUES (40);\nROLLBACK TO SP1;\nCOMMIT;\n\nSELECT COL1 FROM T ORDER BY COL1;\n```","x":"SP1로 롤백하면 40만 취소되어 10, 20, 30이다.","o":["10, 20, 30","10, 20, 30, 40","40","조회되는 행이 없다."],"a":0},{"id":"51-35","r":51,"n":35,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n\n| COL1 | COL2 | COL3 |\n|---|---|---|\n| A | (NULL) | 1 |\n| B | A | 2 |\n| C | B | 3 |\n| D | C | 4 |\n\n> 조건: COL2는 COL1의 상위 노드를 가리킨다.\n```sql\nSELECT COUNT(*) AS CNT\n  FROM T\n WHERE COL3 \u003c> 3\n START WITH COL1 = 'D'\nCONNECT BY COL1 = PRIOR COL2;\n```","x":"D에서 위로 D, C, B, A를 전개한 뒤 WHERE로 COL3 = 3(C)을 빼면 3행이다.","o":["1","2","3","4"],"a":2},{"id":"51-36","r":51,"n":36,"s":2,"b":"Oracle에서 매출액이 가장 큰 상위 2명을 조회하는 SQL로 가장 적절한 것은?\n\n| 영업사원 | 매출액 |\n|---|---|\n| 김영업 | 300 |\n| 이판매 | 500 |\n| 박거래 | 400 |\n\n```sql\n-- (가)\nSELECT 영업사원, 매출액\n  FROM 매출\n ORDER BY 매출액 DESC\n LIMIT 2;\n\n-- (나)\nSELECT TOP 2 영업사원, 매출액\n  FROM 매출\n ORDER BY 매출액 DESC;\n\n-- (다)\nSELECT 영업사원, 매출액\n  FROM 매출\n WHERE ROWNUM \u003c= 2\n ORDER BY 매출액 DESC;\n\n-- (라)\nSELECT 영업사원, 매출액\n  FROM (SELECT 영업사원, 매출액 FROM 매출 ORDER BY 매출액 DESC)\n WHERE ROWNUM \u003c= 2;\n```","x":"Oracle에서는 인라인 뷰로 정렬한 뒤 ROWNUM으로 자른다.","o":["(가)","(나)","(다)","(라)"],"a":3},{"id":"51-37","r":51,"n":37,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\nT.COL1: 100, 200, 300\n```sql\nSELECT COUNT(*) AS CNT\n  FROM T\n WHERE COL1 IN (100, 200, 100);\n```","x":"IN 목록에 100이 두 번 있어도 100, 200 두 행만 나온다.","o":["1","2","3","4"],"a":1},{"id":"51-38","r":51,"n":38,"s":2,"b":"SQL Server에서 점수가 높은 상위 3명을 조회하되, 3위와 점수가 같은 학생이 있으면 모두 함께 조회하려고 한다. 가장 적절한 SQL은?\n\n| 학생명 | 점수 |\n|---|---|\n| 김하나 | 95 |\n| 이두리 | 90 |\n| 박세찬 | 85 |\n| 최네온 | 85 |\n| 정다솜 | 80 |","x":"동점까지 포함하는 SQL Server 구문은 TOP 3 WITH TIES다.","o":["SELECT TOP 3 학생명, 점수 FROM 성적 ORDER BY 점수 DESC;","SELECT 학생명, 점수 FROM 성적 WHERE ROWNUM \u003c= 3 ORDER BY 점수 DESC;","SELECT 학생명, 점수 FROM 성적 ORDER BY 점수 DESC LIMIT 3;","SELECT TOP 3 WITH TIES 학생명, 점수 FROM 성적 ORDER BY 점수 DESC;"],"a":3},{"id":"51-39","r":51,"n":39,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n- A.COL1: 1, 2, 3\n- B.COL1: 7, 8, 9\n```sql\nSELECT COUNT(*) AS CNT\n  FROM A LEFT OUTER JOIN B\n    ON A.COL1 = B.COL1\n   AND B.COL1 > 100;\n```","x":"B.COL1 > 100 조건으로 매칭되는 행이 없어도 LEFT JOIN이라 A의 3행이 남는다.","o":["0","3","6","9"],"a":1},{"id":"51-40","r":51,"n":40,"s":2,"b":"다음 중 DELETE, TRUNCATE, DROP에 대한 설명으로 가장 적절하지 않은 것은?","x":"TRUNCATE는 DDL이라 자동 커밋되어 롤백할 수 없다.","o":["DELETE는 WHERE 절을 사용해 조건에 맞는 일부 행만 선택적으로 삭제할 수 있다.","TRUNCATE는 테이블의 구조와 인덱스는 유지한 채 저장된 전체 행을 제거한다.","TRUNCATE도 DELETE와 동일하게 로그를 남기므로 COMMIT 전이면 ROLLBACK할 수 있다.","DROP은 테이블의 구조와 데이터, 할당된 저장 공간까지 함께 제거한다."],"a":2},{"id":"51-41","r":51,"n":41,"s":2,"b":"다음 SQL을 Oracle에서 실행한 결과로 가장 적절한 것은?\n> 조건: 현재 SYSDATE는 2023-05-10이다.\n```sql\nSELECT TO_CHAR(TO_DATE('2021', 'YYYY'), 'YYYY-MM-DD') AS 결과\n  FROM DUAL;\n```","x":"TO_DATE에서 월·일을 생략하면 현재 월의 1일이 되어 2021-05-01이다.","o":["2021-01-01","2021-05-01","2021-12-31","2023-05-10"],"a":1},{"id":"51-42","r":51,"n":42,"s":2,"b":"다음 SQL을 실행했을 때 AMT가 6, 7, 9인 행의 합계 값을 순서대로 짝지은 것으로 가장 적절한 것은?\nS2.AMT: 6, 7, 9\n```sql\nSELECT AMT,\n       SUM(AMT) OVER (ORDER BY AMT\n                      RANGE BETWEEN 3 PRECEDING AND 3 FOLLOWING) AS 합계\n  FROM S2;\n```","x":"세 값 모두 서로 ±3 범위 안에 있어 합계가 22다.","o":["6, 13, 22","13, 22, 16","6, 7, 9","22, 22, 22"],"a":3},{"id":"51-43","r":51,"n":43,"s":2,"b":"다음 SQL의 정렬 방식에 대한 설명으로 가장 적절한 것은?\n```sql\nSELECT F1, F2, F3\n  FROM ORD2\n ORDER BY F1, F2 DESC, F3 NULLS LAST;\n```","x":"F1 오름차순(기본), F2 내림차순, F3 오름차순이고 F3의 NULL만 마지막이다.","o":["F1, F2, F3 세 컬럼이 모두 내림차순으로 정렬되며 NULL은 가장 마지막에 출력된다.","NULLS LAST 옵션이 지정되어 있으므로 세 컬럼 모두에서 NULL이 가장 앞에 정렬된다.","F1은 오름차순, F2는 내림차순, F3은 오름차순으로 정렬되고 F3의 NULL은 마지막에 온다.","ORDER BY 절에는 컬럼마다 다른 정렬 옵션을 지정할 수 없으므로 오류가 발생한다."],"a":2},{"id":"51-44","r":51,"n":44,"s":2,"b":"COL1 값에 문자 '_'가 실제로 포함된 행만 조회하려고 한다. WHERE 절로 가장 적절한 것은?\nT.COL1: A_01, AB01, ABC1","x":"ESCAPE로 '_'를 문자 그대로 비교해야 한다.","o":["WHERE COL1 LIKE '%_%'","WHERE COL1 LIKE 'A%'","WHERE COL1 LIKE 'A_B%'","WHERE COL1 LIKE '%@_%' ESCAPE '@'"],"a":3},{"id":"51-45","r":51,"n":45,"s":2,"b":"다음 중 제약 조건에 대한 설명으로 가장 적절하지 않은 것은?","x":"UNIQUE 컬럼에는 NULL을 여러 개 넣을 수 있다.","o":["제약 조건은 데이터의 무결성을 유지하기 위해 테이블에 설정하는 규칙이다.","UNIQUE 제약 조건이 설정된 컬럼에는 NULL을 두 개 이상 입력할 수 없다.","PRIMARY KEY 제약 조건은 NOT NULL과 UNIQUE 속성을 함께 갖는다.","CHECK 제약 조건에는 참 또는 거짓으로 판별할 수 있는 조건식을 지정한다."],"a":1},{"id":"51-46","r":51,"n":46,"s":2,"b":"다음 SQL의 증감액 컬럼 값을 일자 순서대로 짝지은 것으로 가장 적절한 것은?\n\n| 일자 | 금액 |\n|---|---|\n| 2023-07-01 | 100 |\n| 2023-07-02 | 150 |\n| 2023-07-03 | 120 |\n| 2023-07-04 | 200 |\n\n```sql\nSELECT 일자, 금액,\n       금액 - LAG(금액) OVER (ORDER BY 일자) AS 증감액\n  FROM 매출\n ORDER BY 일자;\n```","x":"첫 행은 LAG가 NULL이라 NULL이고, 이후 50, -30, 80이다.","o":["NULL, 50, -30, 80","0, 50, -30, 80","50, -30, 80, NULL","100, 250, 370, 570"],"a":0},{"id":"51-47","r":51,"n":47,"s":2,"b":"다음 두 SQL의 실행 결과를 순서대로 짝지은 것으로 가장 적절한 것은?\n```sql\n-- (가)\nSELECT MOD(10, 3) AS 결과 FROM DUAL;\n\n-- (나)\nSELECT MOD(10, -3) AS 결과 FROM DUAL;\n```","x":"Oracle의 MOD는 피제수의 부호를 따르므로 둘 다 1이다.","o":["1, 1","1, -1","3, 3","0, 0"],"a":0},{"id":"51-48","r":51,"n":48,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT CASE WHEN 1 = 2 THEN 'A'\n            WHEN 2 = 2 THEN 'B'\n            WHEN 3 = 3 THEN 'C'\n            ELSE 'D'\n       END AS 결과\n  FROM DUAL;\n```","x":"처음으로 참이 되는 WHEN 2 = 2의 'B'를 반환한다.","o":["A","B","C","D"],"a":1},{"id":"51-49","r":51,"n":49,"s":2,"b":"다음 중 인덱스(INDEX)에 대한 설명으로 가장 적절한 것은?","x":"인덱스는 별도의 정렬된 구조이며 데이터 변경 시 갱신 비용이 든다.","o":["인덱스를 생성하면 테이블의 데이터가 인덱스로 옮겨지므로 테이블에는 별도의 데이터가 남지 않는다.","인덱스를 생성하면 조회뿐 아니라 INSERT, UPDATE, DELETE 성능도 항상 함께 향상된다.","인덱스가 생성된 컬럼은 조회 조건의 형태와 관계없이 항상 인덱스를 통해 접근하게 된다.","인덱스는 조회 성능을 높이기 위해 정렬된 자료구조를 별도로 유지하며, 데이터 변경 시 인덱스 갱신 비용이 발생한다."],"a":3},{"id":"51-50","r":51,"n":50,"s":2,"b":"다음 두 SQL의 실행 결과를 순서대로 짝지은 것으로 가장 적절한 것은?\n```sql\n-- (가)\nSELECT FLOOR(10.4) AS 결과 FROM DUAL;\n\n-- (나)\nSELECT FLOOR(-2.4) AS 결과 FROM DUAL;\n```","x":"FLOOR는 작거나 같은 최대 정수라 10, -3이다.","o":["10, -2","10, -3","11, -2","11, -3"],"a":1},{"id":"52-01","r":52,"n":1,"s":1,"b":"두 개 이상의 부모 엔터티로부터 발생하며, 독립적인 단일 주식별자 대신 부모 엔터티의 식별자를 상속·조합하여 식별되는 경우가 많은 엔터티 유형으로 가장 적절한 것은?","x":"두 개 이상의 부모에서 발생하고 부모 식별자를 상속하는 것은 행위 엔터티다.","o":["기본 엔터티","중심 엔터티","행위 엔터티","코드 엔터티"],"a":2},{"id":"52-02","r":52,"n":2,"s":1,"b":"다음 학생 데이터 모델에서 학과 정보 관리 방식으로 가장 적절한 것은?\n> 학생 엔터티에 학과명, 학과사무실, 학과전화번호가 함께 저장되어 있고, 여러 학생이 동일한 학과 정보를 반복해서 가진다.","x":"반복되는 학과 정보는 학과 엔터티로 분리한다.","o":["학생 엔터티에서 학과 관련 속성을 분리하여 학과 엔터티를 별도로 둔다.","학생 엔터티에 학과명, 학과사무실, 학과전화번호를 계속 중복 저장한다.","학과명을 삭제하고 학생명만으로 학과를 판단한다.","학과 정보를 학생별로 서로 다르게 입력할 수 있도록 자유 텍스트로 둔다."],"a":0},{"id":"52-03","r":52,"n":3,"s":1,"b":"다음 설명에 해당하는 스키마로 가장 적절한 것은?\n> 모든 사용자 관점을 통합한 조직 전체 관점의 통합적 표현이다.","x":"조직 전체 관점의 통합적 표현은 개념 스키마다.","o":["외부 스키마","개념 스키마","내부 스키마","서브 스키마"],"a":1},{"id":"52-04","r":52,"n":4,"s":1,"b":"개념적 데이터 모델링에 대한 설명으로 적절하지 않은 것은?","x":"개념적 모델링은 추상화 수준이 높아 전체 업무 구조를 파악하기 쉽다.","o":["업무 중심의 핵심 엔터티와 관계를 도출한다.","DBMS나 물리적 저장 구조에 독립적으로 모델링한다.","추상화 수준이 높아 업무의 전체 구조를 파악하는 데 사용된다.","추상화 단계가 높아 상위 수준의 업무 구조 파악이 어렵다."],"a":3},{"id":"52-05","r":52,"n":5,"s":1,"b":"업무에 원래 존재하는 독립적인 정보로서 다른 엔터티의 부모 역할을 하는, 발생 시점에 따른 분류상의 엔터티 유형으로 가장 적절한 것은?","x":"업무에 원래 존재하며 다른 엔터티의 부모가 되는 것은 기본 엔터티다.","o":["기본 엔터티","중심 엔터티","행위 엔터티","사건 엔터티"],"a":0},{"id":"52-06","r":52,"n":6,"s":1,"b":"다음 데이터 모델링 구성 요소의 관계를 올바르게 표현한 것은?\n- 하나의 엔터티는 두 개 이상의 인스턴스를 가질 수 있다.\n- 하나의 인스턴스는 두 개 이상의 속성을 가질 수 있다.\n- 하나의 속성은 하나의 속성값을 가진다.","x":"엔터티:인스턴스 1:M, 인스턴스:속성 1:M, 속성:속성값 1:1이다.","o":["엔터티와 인스턴스는 1:1, 인스턴스와 속성은 1:1, 속성과 속성값은 1:M이다.","엔터티와 인스턴스는 M:1, 인스턴스와 속성은 M:1, 속성과 속성값은 M:N이다.","엔터티와 인스턴스는 1:M, 인스턴스와 속성은 1:M, 속성과 속성값은 1:M이다.","엔터티와 인스턴스는 1:M, 인스턴스와 속성은 1:M, 속성과 속성값은 1:1이다."],"a":3},{"id":"52-07","r":52,"n":7,"s":1,"b":"식별자 분류에 대한 설명으로 적절하지 않은 것은?","x":"외래키(FK)는 외부 식별자에 해당한다.","o":["내부 식별자는 엔터티 내부에서 스스로 생성된 식별자이다.","외부 식별자는 다른 엔터티와의 관계를 통해 전달받은 식별자이다.","외래키(FK)는 일반적으로 외부 식별자에 해당한다.","외래키(FK)는 항상 내부 식별자이다."],"a":3},{"id":"52-08","r":52,"n":8,"s":1,"b":"식별 관계와 비식별 관계에 대한 설명으로 가장 적절한 것은?","x":"식별 관계는 실선, 비식별 관계는 점선이다.","o":["식별 관계는 점선, 비식별 관계는 실선으로 표현한다.","식별 관계와 비식별 관계는 모두 점선으로만 표현한다.","식별 관계는 실선, 비식별 관계는 점선으로 표현한다.","식별 관계와 비식별 관계는 모두 실선으로만 표현한다."],"a":2},{"id":"52-09","r":52,"n":9,"s":1,"b":"교수-과목, 학생-과목 사이에 각각 다대다 관계가 존재한다고 할 때, 정규화 및 관계 해소 후 추가로 생성되는 관계 엔터티 수로 가장 적절한 것은?","x":"M:N 관계 2개를 해소하면 관계 엔터티가 2개 생긴다.","o":["0개","1개","2개","3개"],"a":2},{"id":"52-10","r":52,"n":10,"s":1,"b":"정규화에 대한 설명으로 적절하지 않은 것은?","x":"제3정규형은 제1·제2정규형을 만족해야 한다.","o":["제3정규형은 제1정규형과 제2정규형을 만족하지 않아도 된다.","제1정규형은 속성의 원자성을 만족해야 한다.","제2정규형은 부분 함수 종속을 제거한다.","제3정규형은 이행 함수 종속을 제거한다."],"a":0},{"id":"52-11","r":52,"n":11,"s":2,"b":"다음 조건식의 결과로 조회되는 값으로 가장 적절한 것은?\n\n| COL1 | COL2 | RESULT |\n|---|---|---|\n| 1 | NULL | A |\n| 2 | NULL | B |\n| NULL | 3 | C |\n| NULL | 4 | D |\n\n```sql\nSELECT RESULT\nFROM T\nWHERE NOT (COL1 = 1 OR COL2 = NULL);\n```","x":"COL2 = NULL은 항상 UNKNOWN이므로 NOT(...)이 참인 행이 하나도 없다.","o":["A","B","C","조회 결과 없음"],"a":3},{"id":"52-12","r":52,"n":12,"s":2,"b":"다음 중 결과가 다른 것은?\n> 조건: 값과 옵션이 서로 다를 수 있으며, NULL 처리 함수의 결과를 비교한다.","x":"NULLIF는 두 값이 같으면 NULL, 다르면 첫 값을 반환해 다른 셋과 동작이 다르다.","o":["NVL(값, 옵션)","COALESCE(값, 옵션)","NULLIF(값, 옵션)","CASE WHEN 값 IS NOT NULL THEN 값 ELSE 옵션 END"],"a":2},{"id":"52-13","r":52,"n":13,"s":2,"b":"다음 윈도우 함수의 결과로 가장 적절한 것은?\n\n| GRP | VAL |\n|---|---|\n| A | 1 |\n| A | 3 |\n| A | 5 |\n| A | 7 |\n| B | 2 |\n| B | 4 |\n\n```sql\nSELECT GRP, VAL,\n       SUM(VAL) OVER(\n           PARTITION BY GRP\n           ORDER BY VAL\n           RANGE BETWEEN 2 PRECEDING AND 2 FOLLOWING\n       ) AS SUM_VAL\nFROM T;\n```","x":"값 ±2 범위 합계: A는 4, 9, 15, 12이고 B는 6, 6이다.","o":["A: 1,3,5,7 / B: 2,4","A: 4,8,12,12 / B: 2,4","A: 4,9,15,12 / B: 6,6","A: 16,16,16,16 / B: 6,6"],"a":2},{"id":"52-14","r":52,"n":14,"s":2,"b":"계층형 질의에서 사원에서 관리자 방향으로 역방향 탐색을 수행하려고 한다. 다음 중 PRIOR가 들어갈 위치로 가장 적절한 것은?\n```sql\nSELECT EMPNO, MGR\nFROM EMP\nSTART WITH EMPNO = 7788\nCONNECT BY EMPNO = MGR;\n```","x":"자식에서 관리자로 올라가려면 EMPNO = PRIOR MGR처럼 MGR 앞에 PRIOR를 둔다.","o":["EMPNO 앞","MGR 앞","START WITH 앞","SELECT 앞"],"a":1},{"id":"52-15","r":52,"n":15,"s":2,"b":"다음 중 NVL을 사용하여 금액 컬럼의 NULL을 0으로 대체한 뒤 합계를 구하는 SQL로 가장 적절한 것은?","x":"행마다 NULL을 0으로 바꾼 뒤 합하는 SUM(NVL(금액, 0))이다.","o":["SELECT SUM(금액) FROM 매출","SELECT NVL(SUM(금액), 금액) FROM 매출","SELECT SUM(NVL(금액, 0)) FROM 매출","SELECT NVL(금액, SUM(0)) FROM 매출"],"a":2},{"id":"52-16","r":52,"n":16,"s":2,"b":"Oracle 계층형 질의에서 순방향과 역방향 탐색을 결정하는 핵심 키워드는?","x":"순방향과 역방향은 PRIOR 위치로 결정된다.","o":["START WITH","PRIOR","ORDER BY","GROUP BY"],"a":1},{"id":"52-17","r":52,"n":17,"s":2,"b":"트랜잭션이 동시에 실행될 경우 다른 트랜잭션에 의해 영향을 받지 않고 독립적으로 실행되어야 한다는 성질은?","x":"다른 트랜잭션의 영향을 받지 않는 것은 고립성이다.","o":["원자성","일관성","고립성","지속성"],"a":2},{"id":"52-18","r":52,"n":18,"s":2,"b":"서브쿼리에 대한 설명 중 적절하지 않은 것은?","x":"메인쿼리는 서브쿼리 안 테이블의 컬럼을 직접 쓸 수 없다.","o":["서브쿼리는 메인쿼리 안에 포함된 SELECT 문이다.","서브쿼리에서는 메인쿼리의 컬럼을 참조할 수 있는 경우가 있다.","메인쿼리에서는 서브쿼리 내부 테이블의 컬럼을 직접 사용할 수 있다.","서브쿼리는 단일행, 다중행, 다중컬럼 서브쿼리 등으로 구분할 수 있다."],"a":2},{"id":"52-19","r":52,"n":19,"s":2,"b":"순위 결과가 1, 2, 2, 3처럼 공동 순위 이후에도 순위가 연속되도록 하려면 어떤 함수를 사용해야 하는가?","x":"공동 순위 뒤에도 순위가 이어지는 것은 DENSE_RANK다.","o":["RANK","DENSE_RANK","ROW_NUMBER","NTILE"],"a":1},{"id":"52-20","r":52,"n":20,"s":2,"b":"SQL 명령어와 명령어 유형의 연결 중 적절하지 않은 것은?","x":"INSERT는 DML이다.","o":["CREATE - DDL","INSERT - DCL","REVOKE - DCL","COMMIT - TCL"],"a":1},{"id":"52-21","r":52,"n":21,"s":2,"b":"차집합 연산으로 가장 적절한 것은?","x":"차집합은 MINUS다.","o":["UNION","UNION ALL","INTERSECT","MINUS"],"a":3},{"id":"52-22","r":52,"n":22,"s":2,"b":"세 번째 문자가 L인 단어를 찾는 LIKE 조건으로 가장 적절한 것은?","x":"세 번째 글자가 L이면 '__L%'다.","o":["LIKE 'L__%'","LIKE '__L%'","LIKE '%L__'","LIKE '_L%'"],"a":1},{"id":"52-23","r":52,"n":23,"s":2,"b":"아래 쿼리의 결과값으로 가장 적절한 것은?\n\n| C1 | C2 | C3 |\n|---|---|---|\n| 1 | 2 | 3 |\n| NULL | 2 | 3 |\n| NULL | NULL | 3 |\n\n```sql\nSELECT SUM(COALESCE(C1, C2, C3))\nFROM TAB1;\n```","x":"각 행의 첫 NULL 아닌 값 1, 2, 3을 더해 6이다.","o":["0","1","6","14"],"a":2},{"id":"52-24","r":52,"n":24,"s":2,"b":"다음 중 SELECT 문장의 논리적 실행 순서를 올바르게 나열한 것은?","x":"FROM - WHERE - GROUP BY - HAVING - SELECT - ORDER BY 순이다.","o":["SELECT - FROM - WHERE - GROUP BY - HAVING - ORDER BY","FROM - SELECT - WHERE - GROUP BY - HAVING - ORDER BY","FROM - WHERE - GROUP BY - HAVING - ORDER BY - SELECT","FROM - WHERE - GROUP BY - HAVING - SELECT - ORDER BY"],"a":3},{"id":"52-25","r":52,"n":25,"s":2,"b":"다음 중 집계 결과 A와 B가 서로 다른 값을 반환할 수 있는 것은?\n> 조건: SAL 컬럼에는 서로 다른 급여 값이 존재한다.","x":"MAX와 MIN은 서로 다른 값을 반환할 수 있다.","o":["COUNT(SAL) AS A, COUNT(SAL) AS B","SUM(SAL) AS A, SUM(SAL) AS B","MAX(SAL) AS A, MIN(SAL) AS B","AVG(SAL) AS A, AVG(SAL) AS B"],"a":2},{"id":"52-26","r":52,"n":26,"s":2,"b":"제품, 생산제품, 생산라인 엔터티가 있을 때 제품과 생산라인을 생산제품 엔터티 없이 직접 조인하면 발생할 수 있는 문제로 가장 적절한 것은?","x":"연결 엔터티 없이 직접 조인하면 조건이 없어 카티션 곱이 생긴다.","o":["카테시안 곱이 발생할 수 있다.","항상 INNER JOIN 결과가 0건이 된다.","기본키가 자동으로 생성된다.","외래키 제약조건이 자동으로 삭제된다."],"a":0},{"id":"52-27","r":52,"n":27,"s":2,"b":"회원 테이블과 주문이력 테이블이 있을 때, 주문을 한 번도 하지 않은 회원을 찾는 SQL로 가장 적절한 것은?","x":"주문하지 않은 회원은 NOT EXISTS로 찾는다.","o":["SELECT * FROM 회원 M WHERE EXISTS (SELECT 1 FROM 주문 O WHERE M.회원ID = O.회원ID)","SELECT * FROM 회원 M WHERE M.회원ID IN (SELECT 회원ID FROM 주문)","SELECT * FROM 회원 M WHERE NOT EXISTS (SELECT 1 FROM 주문 O WHERE M.회원ID = O.회원ID)","SELECT * FROM 회원 M, 주문 O WHERE M.회원ID = O.회원ID"],"a":2},{"id":"52-28","r":52,"n":28,"s":2,"b":"부모 테이블의 행 삭제 시 해당 행을 참조하는 자식 테이블의 행도 함께 삭제되도록 외래키를 생성하려고 한다. 적절한 옵션은?","x":"부모 삭제 시 자식도 지우는 옵션은 ON DELETE CASCADE다.","o":["ON DELETE RESTRICT","ON DELETE SET NULL","ON DELETE CASCADE","ON UPDATE CASCADE"],"a":2},{"id":"52-29","r":52,"n":29,"s":2,"b":"ROLE에 대한 설명으로 옳은 것은?","x":"ROLE은 GRANT로 부여하고 REVOKE로 회수한다.","o":["ROLE은 테이블 데이터를 저장하는 물리적 공간이다.","ROLE은 GRANT로 부여하고 REVOKE로 회수할 수 있다.","ROLE은 COMMIT으로 생성하고 ROLLBACK으로 삭제한다.","ROLE은 SELECT 문에서만 사용할 수 있는 별칭이다."],"a":1},{"id":"52-30","r":52,"n":30,"s":2,"b":"CTAS(Create Table As Select)로 테이블을 복제할 때 제약조건 적용에 대한 설명으로 가장 적절한 것은?","x":"CTAS는 PK를 복사하지 않는다.","o":["기본키(PK)는 복제되지 않는다.","NOT NULL 조건은 절대 복제되지 않는다.","CHECK 제약조건은 항상 복제된다.","DEFAULT 값은 항상 복제된다."],"a":0},{"id":"52-31","r":52,"n":31,"s":2,"b":"급여가 2000 이상인 행만 합계에 포함하려고 한다. 조건에 맞지 않는 행은 NULL로 처리하여 SUM 집계에서 제외하는 표현으로 가장 적절한 것은?","x":"ELSE NULL로 두면 조건에 맞지 않는 행이 SUM에서 제외된다.","o":["SUM(CASE WHEN SAL >= 2000 THEN SAL ELSE 0 END)","SUM(CASE WHEN SAL >= 2000 THEN SAL ELSE NULL END)","COUNT(CASE WHEN SAL >= 2000 THEN SAL ELSE NULL END)","MAX(CASE WHEN SAL >= 2000 THEN NULL ELSE SAL END)"],"a":1},{"id":"52-32","r":52,"n":32,"s":2,"b":"다음 중 A 결과와 B 결과가 다른 것으로 가장 적절한 것은?","x":"NOT IN은 NULL이 있으면 공집합이 되므로 NOT EXISTS와 결과가 다르다.","o":["A: UNION, B: DISTINCT를 사용한 UNION 결과","A: INNER JOIN, B: 조인 조건을 WHERE 절에 작성한 등가 조인","A: NOT EXISTS, B: NULL이 포함된 NOT IN","A: COUNT(*), B: COUNT(1)"],"a":2},{"id":"52-33","r":52,"n":33,"s":2,"b":"SQL의 특징이 아닌 것은?","x":"SQL은 절차적 언어가 아니다.","o":["절차적(procedural)","구조적(structured)","집합적(set-based)","선언적(declarative)"],"a":0},{"id":"52-34","r":52,"n":34,"s":2,"b":"다음 집합 연산 결과로 가장 적절한 것은?\n```sql\nSELECT MAX(SAL) FROM EMP\nUNION\nSELECT MIN(SAL) FROM EMP;\n```\n\n| ENAME | SAL |\n|---|---|\n| SCOTT | 9000 |\n| SMITH | 8950 |\n| FORD | 8925 |","x":"최댓값 9000과 최솟값 8925 두 행이다.","o":["9000","8925","9000, 8925","NULL"],"a":2},{"id":"52-35","r":52,"n":35,"s":2,"b":"다음 중 ROLLUP(A, B)와 다른 결과를 생성하는 것은?","x":"ROLLUP((A, B))는 (A,B)를 한 덩어리로 보아 (A,B), ()만 만든다.","o":["GROUP BY ROLLUP(A, B)","GROUP BY GROUPING SETS((A, B), (A), ())","GROUP BY ROLLUP((A, B))","GROUP BY A, B UNION ALL GROUP BY A UNION ALL GROUP BY ()"],"a":2},{"id":"52-36","r":52,"n":36,"s":2,"b":"NULL을 포함한 컬럼에 대한 AVG 계산 설명으로 가장 적절한 것은?","x":"AVG(컬럼)은 NULL을 제외하고 평균을 낸다.","o":["AVG(컬럼)과 AVG(NVL(컬럼, 0))은 항상 같다.","AVG(컬럼)은 NULL을 제외하고 평균을 계산한다.","AVG(NVL(컬럼, 0))은 NULL을 제외하고 평균을 계산한다.","AVG(컬럼)은 NULL이 하나라도 있으면 항상 NULL을 반환한다."],"a":1},{"id":"52-37","r":52,"n":37,"s":2,"b":"NATURAL JOIN에 대한 설명으로 적절하지 않은 것은?","x":"NATURAL JOIN에는 USING이나 ON을 함께 쓸 수 없다.","o":["동일한 이름의 컬럼을 자동으로 조인 조건으로 사용한다.","동일 이름 컬럼은 결과에서 하나만 표시될 수 있다.","NATURAL JOIN 구문에서는 USING이나 ON 절을 함께 사용할 수 있다.","의도하지 않은 동일 이름 컬럼이 있으면 예상과 다른 결과가 나올 수 있다."],"a":2},{"id":"52-38","r":52,"n":38,"s":2,"b":"제약조건에 대한 설명으로 적절하지 않은 것은?","x":"기본키는 테이블에 하나만 만들 수 있다.","o":["고유키에는 DBMS에 따라 NULL이 허용될 수 있다.","CHECK 제약조건은 조건을 만족하지 않는 값을 제한하는 데 사용된다.","하나의 테이블에는 기본키 제약조건을 두 개 이상 만들 수 있다.","DEFAULT는 명시 값이 없을 때 기본값을 입력하는 데 사용된다."],"a":2},{"id":"52-39","r":52,"n":39,"s":2,"b":"가능한 모든 조합의 소계와 총계를 생성하는 GROUP BY 확장 기능은?","x":"모든 조합의 소계와 총계는 CUBE다.","o":["ROLLUP","GROUPING SETS","CUBE","GROUPING"],"a":2},{"id":"52-40","r":52,"n":40,"s":2,"b":"다음 조건을 적용했을 때 조회되는 COL 값으로 가장 적절한 것은?\nCOL: NULL, 1, 2, 3, 4\n```sql\nSELECT COL\nFROM T\nWHERE NOT (COL \u003c= 2);\n```","x":"NOT (COL \u003c= 2)는 3, 4이고 NULL은 UNKNOWN이라 제외된다.","o":["NULL, 3, 4","1, 2","3, 4","NULL, 1, 2"],"a":2},{"id":"52-41","r":52,"n":41,"s":2,"b":"다음 중 조인 결과가 다른 것으로 가장 적절한 것은?","x":"나머지는 조건에 맞는 행만 결합하지만 CROSS JOIN은 모든 조합을 만든다.","o":["INNER JOIN","동등 조인","JOIN ... ON","CROSS JOIN"],"a":3},{"id":"52-42","r":52,"n":42,"s":2,"b":"제품, 생산제품, 생산라인 엔터티가 있을 때 제품명과 생산라인명을 올바르게 조회하기 위한 조인 경로로 가장 적절한 것은?","x":"제품 → 생산제품 → 생산라인 순으로 조인해야 한다.","o":["제품 → 생산제품 → 생산라인","제품 → 생산라인","생산제품 → 제품을 거치지 않고 생산라인만 조회","제품과 생산라인을 조건 없이 CROSS JOIN"],"a":0},{"id":"52-43","r":52,"n":43,"s":2,"b":"다음 중 NULL 관련 함수의 설명으로 적절하지 않은 것은?","x":"COALESCE는 첫 번째 NULL이 아닌 값을 반환할 뿐 더하지 않는다.","o":["NVL(expr1, expr2)는 expr1이 NULL이면 expr2를 반환한다.","NVL2(expr1, expr2, expr3)는 expr1이 NULL이 아니면 expr2, NULL이면 expr3을 반환한다.","NULLIF(expr1, expr2)는 두 값이 같으면 NULL을 반환한다.","COALESCE(expr1, expr2, ...)는 모든 인자를 더한 합계를 반환한다."],"a":3},{"id":"52-44","r":52,"n":44,"s":2,"b":"NULL이 포함된 컬럼에 대해 결과가 달라질 수 있는 집계식 조합으로 가장 적절한 것은?","x":"AVG(COL)은 NULL을 빼고, AVG(NVL(COL,0))은 0으로 포함하므로 결과가 다를 수 있다.","o":["COUNT(*)와 COUNT(1)","MAX(COL)와 MAX(COL)","SUM(COL)와 SUM(COL)","AVG(COL)와 AVG(NVL(COL, 0))"],"a":3},{"id":"52-45","r":52,"n":45,"s":2,"b":"SELECT 결과에서 행의 중복을 제거하는 키워드로 알맞은 것은?","x":"중복 행 제거는 DISTINCT다.","o":["UNIQUE","DISTINCT","ONLY","EXCEPT"],"a":1},{"id":"52-46","r":52,"n":46,"s":2,"b":"MERGE 문에 대한 설명으로 가장 적절한 것은?","x":"MERGE는 조건에 따라 UPDATE와 INSERT를 한 번에 수행한다.","o":["MERGE는 조회 전용 명령어이다.","MERGE는 조건에 따라 UPDATE와 INSERT를 수행할 수 있다.","MERGE는 COMMIT과 ROLLBACK만 수행한다.","MERGE는 테이블 구조만 변경한다."],"a":1},{"id":"52-47","r":52,"n":47,"s":2,"b":"다음 날짜 형식 문자열로 가장 적절한 것은?\n> 조건: 연월일시분초를 20250101143059와 같이 출력하려고 한다.","x":"YYYYMMDDHH24MISS로 쓰면 20250101143059가 된다.","o":["YYYYMMDDHH24MISS","YYYY-MM-DD HH24:MI:SS","YY/MM/DD HH:MI","YYYYDDMMHHMISS"],"a":0},{"id":"52-48","r":52,"n":48,"s":2,"b":"계층형 쿼리에서 하위 방향으로 사원 정보를 조회하려고 한다. PRIOR가 들어갈 위치로 가장 적절한 것은?\n```sql\nSELECT EMPNO, MGR\nFROM EMP\nSTART WITH MGR IS NULL\nCONNECT BY (ㄷ) EMPNO = (ㄹ) MGR;\n```","x":"하위 방향은 PRIOR EMPNO = MGR이므로 EMPNO 앞(ㄷ)에 PRIOR가 온다.","o":["EMPNO 앞","MGR 앞","START WITH 앞","SELECT 앞"],"a":0},{"id":"52-49","r":52,"n":49,"s":2,"b":"부서 테이블의 1행을 삭제할 때, 이를 참조하는 사원 테이블의 행도 함께 삭제되도록 하는 외래키 표현으로 가장 적절한 것은?","x":"자식인 사원 테이블의 FK에 ON DELETE CASCADE를 지정한다.","o":["FOREIGN KEY (부서ID) REFERENCES 부서(부서ID) ON DELETE RESTRICT","부서 테이블이 사원 테이블을 REFERENCES 하고 ON DELETE CASCADE를 지정한다.","사원 테이블의 부서ID가 부서 테이블의 부서ID를 REFERENCES 하고 ON DELETE CASCADE를 지정한다.","FOREIGN KEY (부서ID) REFERENCES 부서(부서ID) ON DELETE SET NULL"],"a":2},{"id":"52-50","r":52,"n":50,"s":2,"b":"아래 보기 중 올바르지 않은 것은?","x":"기본키 제약도 ALTER TABLE ... DROP으로 제거할 수 있다.","o":["기본키 제약조건은 한 번 생성하면 제거할 수 없다.","기본키는 각 행을 유일하게 식별해야 한다.","기본키는 NULL 값을 가질 수 없다.","기본키는 하나 이상의 컬럼으로 구성될 수 있다."],"a":0},{"id":"53-01","r":53,"n":1,"s":1,"b":"모델링 관점 중 업무가 어떤 데이터와 관련되어 있는지 또는 데이터 간의 관계가 무엇인지에 집중하는 관점으로 가장 적절한 것은?","x":"데이터와 데이터 간 관계에 집중하는 것은 데이터 관점이다.","o":["데이터 관점","프로세스 관점","상관 관점","기능 관점"],"a":0},{"id":"53-02","r":53,"n":2,"s":1,"b":"데이터 용량과 성능에 대한 설명으로 옳지 않은 것은?","x":"데이터가 커지면 테이블 구조와 인덱스 설계가 성능에 큰 영향을 준다.","o":["데이터 용량이 증가하면 조회 범위와 I/O 증가로 성능 저하가 발생할 수 있다.","대량 데이터 테이블은 파티셔닝이나 인덱스 전략을 고려할 수 있다.","데이터 용량이 증가해도 테이블 구조와 인덱스 설계는 성능에 영향을 주지 않는다.","불필요한 중복 데이터는 저장 공간 증가와 정합성 문제를 유발할 수 있다."],"a":2},{"id":"53-03","r":53,"n":3,"s":1,"b":"다음 중 엔터티의 발생 시점에 따른 분류가 아닌 것은?","x":"발생 시점 분류는 기본·중심·행위다. 유형 엔터티는 유형/무형 분류다.","o":["기본 엔터티","중심 엔터티","유형 엔터티","행위 엔터티"],"a":2},{"id":"53-04","r":53,"n":4,"s":1,"b":"다음 설명에 해당하는 정규형으로 가장 적절한 것은?\n> 일반 속성이 주식별자에 종속되어 있고, 주식별자가 아닌 일반 속성 간의 이행 함수 종속이 제거된 상태이다.","x":"이행 함수 종속까지 제거한 것은 제3정규형이다.","o":["제1정규형","제2정규형","제3정규형","비정규형"],"a":2},{"id":"53-05","r":53,"n":5,"s":1,"b":"인조 식별자에 대한 설명으로 틀린 것은?","x":"속성이 적다고 인조 식별자를 반드시 써야 하는 것은 아니다.","o":["업무 식별자가 복잡할 때 인위적으로 식별자를 만들 수 있다.","인조 식별자는 보통 대체 식별자로 설계된다.","속성의 수가 적으면 인조 식별자를 반드시 사용해야 한다.","인조 식별자를 사용하더라도 업무적으로 유일성을 보장하는 제약을 고려해야 한다."],"a":2},{"id":"53-06","r":53,"n":6,"s":1,"b":"복합 주식별자를 가진 테이블에서 일반 속성이 주식별자 전체가 아니라 일부 속성에만 종속되어 있다. 이를 분리하는 정규화 단계로 가장 적절한 것은?","x":"부분 함수 종속을 분리하는 것은 제2정규화다.","o":["제1정규화","제2정규화","제3정규화","반정규화"],"a":1},{"id":"53-07","r":53,"n":7,"s":1,"b":"상호배타 관계에 대한 설명으로 옳지 않은 것은?","x":"상호배타 관계는 배타적 상속을 표현할 수 있다.","o":["하나의 상위 엔터티 인스턴스가 여러 하위 유형 중 하나에만 속해야 하는 경우를 표현할 수 있다.","상호배타 관계는 하위 엔터티 간 중복 소속을 제한하는 의미를 가진다.","상호배타 관계는 배타적 상속을 표현할 수 없다.","상호배타 여부는 업무 규칙에 따라 결정된다."],"a":2},{"id":"53-08","r":53,"n":8,"s":1,"b":"참조 무결성을 구현하는 키로 가장 적절한 것은?","x":"참조 무결성은 외래키로 구현한다.","o":["기본키","외래키","후보키","대체키"],"a":1},{"id":"53-09","r":53,"n":9,"s":1,"b":"데이터 모델링과 트랜잭션에 대한 설명으로 옳지 않은 것은?","x":"데이터 모델링에서도 트랜잭션을 고려한다.","o":["트랜잭션은 논리적 연산 단위이다.","데이터 모델링에서는 업무 트랜잭션의 흐름과 데이터 정합성을 고려할 수 있다.","트랜잭션은 여러 작업이 하나의 단위로 커밋될 수 있다.","데이터 모델링에서는 트랜잭션을 표현하거나 고려할 수 없다."],"a":3},{"id":"53-10","r":53,"n":10,"s":1,"b":"바커 표기법에서 관계선에 대한 설명으로 가장 적절한 것은?","x":"바커 표기법도 선으로 관계를 표현하며 필수·선택을 나타낼 수 있다.","o":["엔터티 간 관계는 선으로 표현하며, 필수성·선택성 등을 함께 나타낼 수 있다.","관계는 반드시 점선으로만 표현한다.","관계는 반드시 화살표로만 표현한다.","바커 표기법에서는 엔터티 간 관계를 표현할 수 없다."],"a":0},{"id":"53-11","r":53,"n":11,"s":2,"b":"다음 중 데이터 제어어(DCL)에 해당하는 명령어로만 묶인 것은?","x":"DCL은 GRANT, REVOKE다.","o":["CREATE, ALTER","INSERT, UPDATE","GRANT, REVOKE","COMMIT, ROLLBACK"],"a":2},{"id":"53-12","r":53,"n":12,"s":2,"b":"SQL Server에서 하위 5개의 점수를 조회하되, 5번째 점수와 같은 동점자도 모두 포함하려고 한다. 가장 적절한 방법은?","x":"하위 5개를 동점까지 포함하려면 ORDER BY 점수 ASC와 TOP(5) WITH TIES를 쓴다.","o":["TOP(5)만 사용하고 ORDER BY 없이 조회한다.","TOP(5) WITH TIES와 ORDER BY 점수 ASC를 사용한다.","TOP(5) WITH TIES와 ORDER BY 점수 DESC를 사용한다.","RANK()를 사용하되 ORDER BY 없이 조회한다."],"a":1},{"id":"53-13","r":53,"n":13,"s":2,"b":"SQL 실행 결과로 가장 적절하지 않은 것은?","x":"SUBSTR('Gangneung Wonju', 8, 4)는 'ng W'다.","o":["ROUND(4.875, 2) = 4.88","LENGTH('KOREAN') = 6","DATE_FORMAT('2022-11-02', '%Y-%m-%d') = 2022-11-02","SUBSTR('Gangneung Wonju', 8, 4) = 'g Wo'"],"a":3},{"id":"53-14","r":53,"n":14,"s":2,"b":"다음 조건을 만족하는 행의 개수로 가장 적절한 것은?\n\n| ID | AMT | VOL |\n|---|---|---|\n| 1 | 2500 | 5 |\n| 2 | 3000 | 12 |\n| 3 | 4000 | 8 |\n| 4 | 5500 | 9 |\n\n```sql\nWHERE AMT BETWEEN 3000 AND 5000\n  AND VOL \u003c= 10\n```","x":"AMT 3000~5000이면서 VOL ≤ 10인 행은 ID 3 하나다.","o":["1개","2개","3개","4개"],"a":0},{"id":"53-15","r":53,"n":15,"s":2,"b":"다음 중 결과가 NULL이 아닌 것은?","x":"COALESCE('AB','CD')는 'AB'다. SUBSTR 길이가 음수면 NULL이다.","o":["NULLIF('AB', 'AB')","SUBSTR('ABC', 1, -1)","COALESCE('AB', 'CD')","NULL + 10"],"a":2},{"id":"53-16","r":53,"n":16,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은?\n- T1.COL1: 1, 2, 3, 4, 5\n- T2.COL1: 1, 1, 1, 3, 6\n```sql\nSELECT COUNT(*)\nFROM T1, T2\nWHERE T1.COL1 = T2.COL1;\n```","x":"T2의 1 세 개가 T1의 1과, 3 하나가 3과 매칭되어 4행이다.","o":["2","3","4","5"],"a":2},{"id":"53-17","r":53,"n":17,"s":2,"b":"다음 ORDER BY 절의 의미로 가장 적절한 것은?\n```sql\nORDER BY 주문번호 DESC, 금액 ASC\n```","x":"주문번호 내림차순, 같은 주문번호 안에서는 금액 오름차순이다.","o":["주문번호 오름차순 정렬 후 금액 내림차순으로 정렬한다.","주문번호 내림차순 정렬 후 같은 주문번호 내에서 금액 오름차순으로 정렬한다.","금액만 오름차순으로 정렬하고 주문번호는 정렬하지 않는다.","주문번호와 금액을 모두 기본 오름차순으로 정렬한다."],"a":1},{"id":"53-18","r":53,"n":18,"s":2,"b":"학생 테이블을 생성하면서 학과 테이블을 참조하는 외래키를 설정하려고 한다. 다음 설명 중 옳지 않은 것은?","x":"DEFAULT 값이 있으면 값을 생략했을 때 기본값이 들어간다.","o":["학생 테이블의 학과번호는 학과 테이블의 학과번호를 참조할 수 있다.","외래키 컬럼에 DEFAULT 값이 지정되어 있으면 값을 생략했을 때 기본값이 입력될 수 있다.","DEFAULT 값이 지정된 컬럼은 값을 생략하면 무조건 NULL이 입력된다.","외래키 값은 부모 테이블에 존재하는 값이어야 한다."],"a":2},{"id":"53-19","r":53,"n":19,"s":2,"b":"SAL 값을 기준으로 상위 3순위까지 조회하되, 동일 순위의 여러 행을 모두 포함하려고 한다. 가장 적절한 분석 함수는?","x":"동일 순위를 포함해 상위 3순위까지 뽑으려면 DENSE_RANK다.","o":["ROW_NUMBER","DENSE_RANK","COUNT","NTILE"],"a":1},{"id":"53-20","r":53,"n":20,"s":2,"b":"주문월이 '201001'인 데이터만 존재하는 테이블에서 다음 조건을 사용했을 때 결과로 가장 적절한 것은?\n```sql\nSELECT *\nFROM 주문\nWHERE 주문월 = '201010';\n```","x":"조건에 맞는 행이 없으면 공집합이다.","o":["NULL 1행이 반환된다.","0이 반환된다.","공집합이 반환된다.","오류가 발생한다."],"a":2},{"id":"53-21","r":53,"n":21,"s":2,"b":"사원 테이블을 셀프 조인하여 사원명과 매니저명을 조회하려고 한다. 매니저가 없는 사원은 '사장'으로 출력하는 표현식으로 가장 적절한 것은?","x":"매니저명이 NULL이면 '사장'을 반환하는 COALESCE(매니저명, '사장')이다.","o":["COALESCE(매니저명, '사장')","NULLIF(매니저명, '사장')","COALESCE(NULL, 사장)","매니저명 = NULL"],"a":0},{"id":"53-22","r":53,"n":22,"s":2,"b":"DELETE, TRUNCATE, DROP 명령어에 대한 설명으로 가장 적절하지 않은 것은?","x":"WHERE 없는 DELETE는 데이터만 지우고, DROP은 테이블 자체를 지우므로 결과가 다르다.","o":["특정 테이블에 대하여 WHERE 조건절이 없는 DELETE 명령을 수행하면 DROP TABLE 명령을 수행했을 때와 똑같은 결과를 얻을 수 있다.","DROP 명령어는 테이블 정의 자체를 삭제하고, TRUNCATE 명령어는 테이블을 초기 상태로 만든다.","TRUNCATE 명령어는 UNDO를 위한 데이터를 적게 생성하므로 동일 데이터량 삭제 시 DELETE보다 빠를 수 있다.","DROP과 TRUNCATE는 일반적으로 Auto Commit되고, DELETE는 사용자 Commit으로 수행된다."],"a":0},{"id":"53-23","r":53,"n":23,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT LTRIM('aaaabcd', 'a') AS RESULT\nFROM DUAL;\n```","x":"왼쪽의 a를 모두 제거해 'bcd'다.","o":["abcd","aaaabcd","bcd","NULL"],"a":2},{"id":"53-24","r":53,"n":24,"s":2,"b":"다음 조건과 동일한 의미로 가장 적절한 것은?\n```sql\nWHERE (COL1, COL2) IN ((1, 3), (1, 4))\n```","x":"(1,3) 또는 (1,4)이므로 COL1 = 1 AND COL2 IN (3, 4)다.","o":["WHERE COL1 = 1 AND COL2 IN (3, 4)","WHERE COL1 IN (1, 3) AND COL2 IN (1, 4)","WHERE COL1 = 3 AND COL2 = 4","WHERE COL1 = 1 OR COL2 IN (3, 4)"],"a":0},{"id":"53-25","r":53,"n":25,"s":2,"b":"소수점 처리 함수에 대한 설명으로 옳지 않은 것은?","x":"CEIL은 올림이다.","o":["FLOOR는 주어진 수보다 작거나 같은 가장 큰 정수를 반환한다.","TRUNC는 지정한 자리에서 값을 버림 처리할 수 있다.","ROUND는 지정한 자리에서 반올림한다.","CEIL은 소수점 이하를 내림 처리한다."],"a":3},{"id":"53-26","r":53,"n":26,"s":2,"b":"다음 SQL에서 오류가 발생하는 원인으로 가장 적절한 것은?\n```sql\nSELECT ID, SUM(SAL)\nFROM EMP\nWHERE ID = (SELECT ID FROM A WHERE 조건 = 'Y')\nGROUP BY ID\nHAVING SUM(SAL) > 5000;\n```\n> 조건: 서브쿼리 (SELECT ID FROM A WHERE 조건 = 'Y')는 여러 행을 반환할 수 있다.","x":"= 연산자에 여러 행을 반환하는 서브쿼리를 쓰면 오류가 난다.","o":["SELECT 절에서 SUM(SAL)을 사용했기 때문이다.","= 연산자에 사용된 서브쿼리가 여러 행을 반환할 수 있기 때문이다.","GROUP BY ID를 사용했기 때문이다.","HAVING SUM(SAL) > 5000을 사용했기 때문이다."],"a":1},{"id":"53-27","r":53,"n":27,"s":2,"b":"테이블 별칭을 사용한 SQL 문장으로 적절하지 않은 것은?","x":"별칭 A를 지정했으면 원래 테이블명으로 컬럼을 참조할 수 없다.","o":["SELECT A.C1 FROM U1.T1 A","SELECT A.C1 FROM U1.T1 A WHERE A.C2 = 10","SELECT U1.T1.C1 FROM U1.T1 A","SELECT C1 FROM U1.T1 A"],"a":2},{"id":"53-28","r":53,"n":28,"s":2,"b":"NATURAL JOIN에 대한 설명으로 가장 적절한 것은?","x":"같은 이름의 컬럼이 의도치 않게 조인 조건이 되면 예상과 다른 결과가 나온다.","o":["동일 이름 컬럼이 여러 개 존재하여 의도하지 않은 조인 조건이 만들어지면 예상과 다른 결과가 발생할 수 있다.","NATURAL JOIN은 데이터와 무관하게 항상 일정한 행 수를 반환한다.","공통 컬럼이 없어도 두 테이블의 모든 행을 조인한다.","NATURAL JOIN은 항상 두 테이블 행 수의 곱(데카르트 곱)을 반환한다."],"a":0},{"id":"53-29","r":53,"n":29,"s":2,"b":"고객 등급을 우선순위에 따라 VVIP, VIP 순서로 정렬하려고 한다. 가장 적절한 ORDER BY 표현은?","x":"CASE로 VVIP=1, VIP=2를 부여해 오름차순 정렬한다.","o":["ORDER BY CASE 등급 WHEN 'VVIP' THEN 1 WHEN 'VIP' THEN 2 ELSE 3 END","ORDER BY 등급 ASC","ORDER BY 등급 DESC","ORDER BY CASE 등급 WHEN 'VIP' THEN 1 WHEN 'VVIP' THEN 2 ELSE 3 END"],"a":0},{"id":"53-30","r":53,"n":30,"s":2,"b":"다음 조건을 만족하는 값으로 가장 적절한 것은?\n```sql\nWHERE COL \u003c= ALL (50, 15)\n```\nCOL: 10, 12, 15, 20, 50","x":"\u003c= ALL(50, 15)는 15 이하이므로 10, 12, 15다.","o":["10, 12, 15","20, 50","10, 12, 15, 20, 50","50"],"a":0},{"id":"53-31","r":53,"n":31,"s":2,"b":"명절 선물을 받지 못한 회원을 찾기 위해, 전체 회원 집합에서 선물을 받은 회원 집합을 제외하려고 한다. 가장 적절한 집합 연산자는?","x":"전체에서 받은 회원을 빼는 차집합은 MINUS다.","o":["UNION","UNION ALL","INTERSECT","MINUS"],"a":3},{"id":"53-32","r":53,"n":32,"s":2,"b":"집합 연산자에 대한 설명으로 가장 적절하지 않은 것은?","x":"집합 연산에서 ORDER BY는 마지막에 한 번만 쓸 수 있다.","o":["UNION 연산자는 합집합 결과에서 중복된 행을 하나의 행으로 만든다.","UNION ALL 연산자는 집합 간의 결과가 중복되지 않는 경우 UNION과 결과가 동일하다.","INTERSECT 연산자는 두 집합의 교집합을 반환하며 중복 행을 제거한다.","UNION 연산자를 사용한 SQL은 각각의 집합에 ORDER BY 절을 사용할 수 있다."],"a":3},{"id":"53-33","r":53,"n":33,"s":2,"b":"다음 SQL 문장에서 오류가 발생하는 원인으로 가장 적절한 것은?\n```sql\nSELECT DEPTNO, SUM(SAL)\nFROM EMP\nGROUP BY DEPTNO, SUM(SAL);\n```","x":"GROUP BY 절에는 집계 함수를 쓸 수 없다.","o":["SELECT 절에 일반 컬럼(DEPTNO)과 집계 함수(SUM)를 함께 사용했기 때문이다.","SUM 함수의 인자로 단일 컬럼(SAL)만 지정해서 집계 대상이 모호하기 때문이다.","GROUP BY 절에 집계 함수(SUM)를 사용했기 때문이다.","ORDER BY 절 없이 집계 함수를 사용하면 정렬 기준이 없어 오류가 나기 때문이다."],"a":2},{"id":"53-34","r":53,"n":34,"s":2,"b":"GROUP BY 확장 기능에 대한 설명으로 옳지 않은 것은?","x":"확장 기능 결과도 ORDER BY로 정렬할 수 있다.","o":["ROLLUP은 시간이나 지역처럼 계층적 구조의 소계를 구할 때 유용하다.","CUBE는 가능한 모든 조합의 소계를 생성한다.","GROUPING SETS는 원하는 그룹 조합을 선택해서 표현할 수 있다.","GROUP BY 확장 기능을 사용하면 결과를 정렬할 수 없다."],"a":3},{"id":"53-35","r":53,"n":35,"s":2,"b":"두 테이블을 CROSS JOIN했을 때 결과 행 수로 가장 적절한 것은?\n- T1 테이블 행 수: 3건\n- T2 테이블 행 수: 5건","x":"3 × 5 = 15행이다.","o":["3개","5개","8개","15개"],"a":3},{"id":"53-36","r":53,"n":36,"s":2,"b":"SAL 기준 상위 5건을 조회하는 SQL로 가장 적절한 것은?","x":"FETCH FIRST 5 ROWS ONLY는 정렬 후 상위 5건을 가져온다.","o":["SELECT * FROM EMP WHERE ROWNUM \u003c= 5 ORDER BY SAL DESC","SELECT * FROM EMP WHERE ROWNUM = 5 ORDER BY SAL DESC","SELECT * FROM EMP WHERE ROWNUM \u003c= 5","SELECT * FROM EMP ORDER BY SAL DESC FETCH FIRST 5 ROWS ONLY"],"a":3},{"id":"53-37","r":53,"n":37,"s":2,"b":"다음 UNPIVOT 결과에 포함되는 AMOUNT_TYPE 값으로 가장 적절한 것은?\n\n| ID | AMOUNT1 | AMOUNT2 | AMOUNT3 |\n|---|---|---|---|\n| 1 | 10 | 20 | 30 |\n\n```sql\nSELECT ID, AMOUNT_TYPE, AMOUNT\nFROM T\nUNPIVOT (\n  AMOUNT FOR AMOUNT_TYPE IN (AMOUNT3, AMOUNT2, AMOUNT1)\n);\n```","x":"IN 목록의 세 컬럼명이 모두 AMOUNT_TYPE 값이 된다.","o":["AMOUNT1만 포함된다.","AMOUNT3, AMOUNT2, AMOUNT1이 포함된다.","AMOUNT2만 포함된다.","모든 AMOUNT 값이 NULL로 출력된다."],"a":1},{"id":"53-38","r":53,"n":38,"s":2,"b":"다음 중 이메일 형식을 찾는 정규표현식으로 적절하지 않은 것은?","x":"@ 뒤에 '.도메인'이 없어 이메일 형식을 제대로 검사하지 못한다.","o":["REGEXP_SUBSTR(email, '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+.[A-Za-z]{2,}')","REGEXP_SUBSTR(email, '[[:alnum:]._%+-]+@[[:alnum:].-]+.[[:alpha:]]{2,}')","REGEXP_SUBSTR(email, '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+')","REGEXP_SUBSTR(email, '[^@]+@[^@]+.[^@]+')"],"a":2},{"id":"53-39","r":53,"n":39,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\n```sql\nSELECT REGEXP_SUBSTR('aabbc', 'a*b+c') AS R1,\n       REGEXP_SUBSTR('abbc', 'a*b+c') AS R2\nFROM DUAL;\n```","x":"a*b+c는 두 문자열 전체와 매칭된다.","o":["aabbc, abbc","abbc, aabbc","NULL, abbc","aabbc, NULL"],"a":0},{"id":"53-40","r":53,"n":40,"s":2,"b":"다음 윈도우 함수에서 VAL이 100인 행의 합계로 가장 적절한 것은?\n\n| ID | VAL |\n|---|---|\n| 1 | 50 |\n| 2 | 100 |\n| 3 | 150 |\n\n```sql\nSELECT ID, VAL,\n       SUM(VAL) OVER(\n         ORDER BY VAL\n         ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING\n       ) AS SUM_VAL\nFROM T;\n```","x":"VAL 100 행의 앞뒤 한 행씩: 50+100+150 = 300이다.","o":["50","100","150","300"],"a":3},{"id":"53-41","r":53,"n":41,"s":2,"b":"계층형 쿼리에 대한 설명으로 적절하지 않은 것은?","x":"WHERE 절은 계층 전개가 끝난 뒤 적용된다.","o":["ORDER SIBLINGS BY는 같은 부모를 가진 형제 노드 간 정렬에 사용할 수 있다.","NOCYCLE은 순환 구조로 인한 무한 탐색을 방지하는 데 사용할 수 있다.","CONNECT BY는 계층 구조의 부모-자식 관계를 지정한다.","WHERE 절은 CONNECT BY 수행 전에 항상 계층 자체를 완전히 차단한다."],"a":3},{"id":"53-42","r":53,"n":42,"s":2,"b":"다음 SQL의 실행 결과로 가장 적절한 것은?\nCOL1 (문자형): '10', '90', '100'\n```sql\nSELECT TO_NUMBER(MIN(COL1)) + TO_NUMBER(MAX(COL1)) AS RESULT\nFROM T;\n```","x":"문자 비교로 MIN은 '10', MAX는 '90'이라 10 + 90 = 100이다.","o":["100","110","190","1010"],"a":0},{"id":"53-43","r":53,"n":43,"s":2,"b":"이름이 n으로 끝나는 회원을 찾는 LIKE 조건으로 가장 적절한 것은?","x":"n으로 끝나는 것은 '%n'이다.","o":["WHERE NAME LIKE 'n%'","WHERE NAME LIKE '%n'","WHERE NAME LIKE '%n%'","WHERE NAME LIKE '_n'"],"a":1},{"id":"53-44","r":53,"n":44,"s":2,"b":"테이블 구조 변경에 대한 설명으로 틀린 것은?","x":"DEFAULT를 바꿔도 기존 데이터는 바뀌지 않는다.","o":["기존 데이터가 있으면 컬럼 사이즈 축소 시 제한이 있을 수 있다.","NULL만 입력된 컬럼은 경우에 따라 컬럼 사이즈 축소가 가능할 수 있다.","DEFAULT 값을 변경하면 변경 이후 입력되는 데이터부터 새 기본값이 적용된다.","DEFAULT 값을 변경하면 기존에 저장된 모든 데이터 값도 자동으로 새 기본값으로 변경된다."],"a":3},{"id":"53-45","r":53,"n":45,"s":2,"b":"아래 테이블에 대한 INSERT 문 중 오류가 발생하는 것은?\n```sql\nCREATE TABLE TEST45 (\n  COL1 NUMBER,\n  COL2 NUMBER,\n  COL3 NUMBER,\n  COL4 NUMBER\n);\n```","x":"컬럼이 4개인데 값 3개만 넣으면 오류다.","o":["INSERT INTO TEST45 VALUES(1, 2, 3)","INSERT INTO TEST45 VALUES(1, 2, 3, 4)","INSERT INTO TEST45 (COL1, COL2, COL3) VALUES(1, 2, 3)","INSERT INTO TEST45 (COL1, COL2, COL3, COL4) VALUES(1, 2, 3, 4)"],"a":0},{"id":"53-46","r":53,"n":46,"s":2,"b":"다음 세 테이블을 모두 등가 조인했을 때 결과 행 수로 가장 적절한 것은?\n- T1(C1, C2, C3): (1, 2, 3)\n- T2(C1, C2, C3): (1, 2, NULL)\n- T3(C1, C2, C3): (1, NULL, NULL)\n```sql\nSELECT COUNT(*)\nFROM T1, T2, T3\nWHERE T1.C1 = T2.C1\n  AND T2.C1 = T3.C1;\n```","x":"C1이 모두 1이라 1 × 1 × 1 = 1행이다.","o":["0개","1개","2개","3개"],"a":1},{"id":"53-47","r":53,"n":47,"s":2,"b":"A 테이블과 B 테이블을 UNION하여 중복 제거한 결과가 1, 2, 3, 4, 5, 6일 때 결과 행 수로 가장 적절한 것은?","x":"UNION 결과가 중복 없이 1~6이므로 6행이다.","o":["4개","5개","6개","7개"],"a":2},{"id":"53-48","r":53,"n":48,"s":2,"b":"다음 SQL의 결과로 가장 적절한 것은?\n\n| COL_B | COL_C | SCORE |\n|---|---|---|\n| NULL | 10 | 5 |\n| 15 | 50 | 10 |\n| NULL | NULL | NULL |\n\n```sql\nSELECT NVL(MIN(COL_B), 0) AS A,\n       NVL(MAX(COL_C), 0) AS B,\n       SUM(NVL(SCORE, 0)) AS C\nFROM T;\n```","x":"MIN(COL_B) = 15, MAX(COL_C) = 50, SUM = 15다.","o":["0, 50, 15","15, 50, 15","15, 10, 15","0, 0, 0"],"a":1},{"id":"53-49","r":53,"n":49,"s":2,"b":"제약조건 변경에 대한 설명으로 적절하지 않은 것은?","x":"NULL이 있으면 NOT NULL 제약을 추가할 수 없다.","o":["NOT NULL 제약조건을 추가하려면 기존 데이터에 NULL이 없어야 한다.","이미 NULL 값이 들어 있는 컬럼에는 바로 NOT NULL 제약조건을 추가할 수 없다.","기존 NULL 값을 수정한 뒤 NOT NULL 제약조건을 추가할 수 있다.","기존 데이터에 NULL이 들어 있어도 NOT NULL 제약조건은 항상 오류 없이 추가된다."],"a":3},{"id":"53-50","r":53,"n":50,"s":2,"b":"아래 SQL에서 ROLLBACK TO SAVEPOINT SQL1 실행 시 오류가 발생한 뒤, 같은 세션에서 계속해서 SELECT * FROM TABLE50을 수행한다고 할 때 결과 행 수로 가장 적절한 것은?\n```sql\nINSERT INTO TABLE50 VALUES(1);\nINSERT INTO TABLE50 VALUES(2);\nINSERT INTO TABLE50 VALUES(3);\nSAVEPOINT SQL1;\nINSERT INTO TABLE50 VALUES(4);\nINSERT INTO TABLE50 VALUES(5);\nCOMMIT;\nINSERT INTO TABLE50 VALUES(6);\nROLLBACK TO SAVEPOINT SQL1;\n\nSELECT * FROM TABLE50;\n```","x":"COMMIT 뒤 SQL1 저장점이 사라져 롤백이 실패하므로 1~6 모두 남아 6행이다.","o":["4","5","6","7"],"a":2},{"id":"54-01","r":54,"n":1,"s":1,"b":"아래 설명으로 알맞은 데이터 모델링 단계는?\n> 시스템으로 구축하고자 하는 업무에 대해 Key, 속성, 관계 등을 정확하게 표현하고 재사용성이 높은 모델링이다.","x":"Key·속성·관계를 정확히 표현하고 재사용성이 높은 것은 논리적 모델링이다.","o":["논리적 데이터 모델링","개념적 데이터 모델링","물리적 데이터 모델링","데이터베이스 모델링"],"a":0},{"id":"54-02","r":54,"n":2,"s":1,"b":"엔터티 특징으로 적절하지 않은 것은?","x":"엔터티는 반드시 속성을 가져야 한다.","o":["엔터티는 고유한 식별자를 가진다.","엔터티는 데이터 저장의 기본 단위이다.","엔터티는 반드시 속성을 가진다.","속성이 없는 엔터티가 있을 수 있다."],"a":3},{"id":"54-03","r":54,"n":3,"s":1,"b":"속성 특징으로 적절하지 않은 것은?","x":"파생 속성은 정합성 관리가 필요하므로 최소화해야 한다.","o":["속성은 엔터티의 특성을 나타낸다.","속성에는 기본 속성과 파생 속성이 있다.","파생 속성은 다른 속성에서 계산된다.","파생 속성은 많을수록 좋다."],"a":3},{"id":"54-04","r":54,"n":4,"s":1,"b":"식별자의 특징으로 적절하지 않은 것은?","x":"주식별자는 자주 바뀌지 않아야 한다(불변성).","o":["식별자는 엔터티의 유일성을 보장한다.","식별자는 최소성 조건을 만족해야 한다.","주식별자는 엔터티를 고유하게 식별한다.","주식별자의 값은 자주 변경될 수 있다."],"a":3},{"id":"54-05","r":54,"n":5,"s":1,"b":"식별자 관계에 대한 설명으로 적절하지 않은 것은?","x":"비식별자 관계는 부모와의 관계가 선택일 수도 있다.","o":["식별자 관계는 부모 엔터티와 종속적인 관계를 맺는다.","비식별자 관계에서 부모와의 관계는 항상 필수 조건이다.","식별자 관계는 부모의 식별자를 자식에게 전달한다.","비식별자 관계는 자식 엔터티가 독립적으로 존재할 수 있다."],"a":1},{"id":"54-06","r":54,"n":6,"s":1,"b":"아래 고객, 주문 관련 ERD에 대한 설명으로 적절한 것은?\n> 고객(고객번호, 고객명) 1 : N 주문(주문번호, 고객번호(FK))\n> 주문의 고객번호는 고객 엔터티의 고객번호를 참조한다.","x":"주문의 고객번호는 부모인 고객에게서 상속받은 FK다.","o":["주문에서의 고객번호는 고객 엔터티에서 상속받은 것이다.","고객은 주문 엔터티의 자식 엔터티이다.","주문번호는 고객 엔터티에서 상속받은 식별자이다.","고객과 주문은 서로 아무 관계가 없다."],"a":0},{"id":"54-07","r":54,"n":7,"s":1,"b":"함수 종속성에 대한 설명으로 가장 적절한 것은?","x":"주식별자 전체에 완전 함수 종속되는 것이 제2정규형의 조건이다.","o":["일반 속성이 주식별자 전체에 함수 종속된 상태는 제2정규형의 조건과 관련된다.","일반 속성이 주식별자 일부에만 종속되면 제2정규형을 만족한다.","상품번호에 상품명이 종속되는 관계는 상품명이 상품번호를 결정한다는 뜻이다.","함수 종속성은 정규화와 관련이 없다."],"a":0},{"id":"54-08","r":54,"n":8,"s":1,"b":"아래의 경우 생성하는 식별자는?\n> 업무적으로 만들어지지는 않지만 본질 식별자가 복잡한 구성을 갖고 있기 때문에 인위적으로 만든 식별자","x":"본질 식별자가 복잡해 인위적으로 만든 것은 인조 식별자다.","o":["외래키","복합 식별자","인조 식별자","자연 식별자"],"a":2},{"id":"54-09","r":54,"n":9,"s":1,"b":"관계 표기법에 대한 설명으로 적절하지 않은 것은?","x":"IE의 실선(필수)과 바커의 O(선택)는 같은 의미가 아니다.","o":["IE 표기법에서는 관계의 필수 여부를 선과 기호로 표현할 수 있다.","바커 표기법에서는 관계의 선택성을 표시할 수 있다.","IE 표기법의 실선과 바커 표기법의 O 표시는 같은 의미로 항상 대응된다.","관계 표기법은 엔터티 간 참여도와 관계 수를 표현하는 데 사용된다."],"a":2},{"id":"54-10","r":54,"n":10,"s":1,"b":"NULL에 대한 설명으로 적절한 것은?","x":"NULL은 미지의 값이라 일반 비교 연산의 결과가 UNKNOWN이다.","o":["NULL에는 일반 비교 연산자를 사용해 항상 TRUE 또는 FALSE를 얻을 수 있다.","바커 표기법에서는 NULL 허용 여부를 알 수 없다.","NULL은 미지의 값으로 일반 비교 연산으로는 비교 결과를 확정하기 어렵다.","IE 표기법에서 NULL 허용 여부를 알 수 있다."],"a":2},{"id":"54-11","r":54,"n":11,"s":2,"b":"CTAS에 대한 설명으로 적절하지 않은 것은?","x":"CTAS는 NOT NULL만 복사한다.","o":["SELECT 결과를 기반으로 새 테이블을 만들 수 있다.","제약조건이 모두 복사된다.","기존 테이블의 구조를 기반으로 한다.","일부 제약조건은 별도로 추가할 수 있다."],"a":1},{"id":"54-12","r":54,"n":12,"s":2,"b":"View에 대한 설명으로 적절하지 않은 것은?","x":"뷰는 조회 성능을 높이는 도구가 아니다.","o":["View는 조회 속도를 높이기 위해 사용된다.","View는 일반적으로 실제 데이터를 저장하지 않는다.","기본 테이블의 컬럼이 추가되어도 View를 통해 응용 프로그램에 미치는 영향을 줄일 수 있다.","View는 다른 테이블의 데이터를 참조한다."],"a":0},{"id":"54-13","r":54,"n":13,"s":2,"b":"Database의 논리적 업무 최소 단위는?","x":"논리적 작업의 최소 단위는 트랜잭션이다.","o":["트랜잭션","레코드","Query","테이블"],"a":0},{"id":"54-14","r":54,"n":14,"s":2,"b":"아래 정규표현식 조건에 해당하지 않는 전화번호 형식으로 가장 적절한 것은?\n> 조건: 전화번호는 숫자와 하이픈으로 구성되며, 지역번호가 02로 시작하는 형태를 검사한다.\n*(정규표현식 원문 누락)*","x":"031로 시작하므로 02 지역번호 조건에 맞지 않는다.","o":["02-123-4567","02-1234-5678","031-123-4567","02-9876-5432"],"a":2,"m":1},{"id":"54-15","r":54,"n":15,"s":2,"b":"아래의 계층형 쿼리에 대한 설명으로 적절하지 않은 것은?\n> 조건: emp_no는 하위 사원 번호, mgr_no는 상위 관리자 번호를 나타낸다.\n*(SQL 원문 누락)*","x":"원문 SQL 누락. 하위 사원 방향 전개로 보고 '역방향'이 틀린 설명이라고 추정했다.","o":["계층 구조를 조회한다.","상위 관리자부터 조회한다.","역방향 탐색이다.","순방향 탐색이다."],"a":2,"g":1,"m":1},{"id":"54-16","r":54,"n":16,"s":2,"b":"서브쿼리에 대한 설명으로 적절하지 않은 것은?","x":"서브쿼리 안의 컬럼은 메인쿼리에서 직접 참조할 수 없다.","o":["서브쿼리는 메인쿼리 안에서 사용되는 또 다른 SELECT 문이다.","서브쿼리의 내부 컬럼은 메인쿼리에서 항상 직접 참조할 수 있다.","상관 서브쿼리는 메인쿼리의 컬럼을 참조할 수 있다.","인라인 뷰는 FROM 절에서 사용되는 서브쿼리이다."],"a":1},{"id":"54-17","r":54,"n":17,"s":2,"b":"아래 CASE 표현식과 같은 결과를 반환하는 함수로 가장 적절한 것은?\n*(CASE 표현식 원문 누락)*","x":"원문 CASE 누락. NULL이면 'X'를 반환하는 CASE로 보고 COALESCE를 골랐다.","o":["NVL(col1, 'X')","NULLIF(col1, 'X')","COALESCE(col1, 'X')","NVL2(col1, NULL, 'X')"],"a":2,"g":1,"m":1},{"id":"54-18","r":54,"n":18,"s":2,"b":"다음 SQL 중 Oracle 기준으로 결과가 다른 것은?\n\n| COL1 | COL2 | COL3 |\n|---|---|---|\n| 1 | 2 | A |\n| 2 | 3 | B |\n| 3 | 2 | C |\n| 4 | 3 | D |","x":"Oracle에서는 테이블 별칭 앞에 AS를 쓸 수 없어 오류가 난다.","o":["*(선지 원문 누락)*","SELECT T.* FROM TAB AS T","SELECT * FROM TAB","SELECT * FROM TAB WHERE COL2 IN (2, 3)"],"a":1,"m":1},{"id":"54-19","r":54,"n":19,"s":2,"b":"STADIUM 컬럼이 두 개 테이블에 모두 존재하는 조인 SQL에 대한 설명으로 적절하지 않은 것은?","x":"같은 이름의 컬럼이 여러 테이블에 있으면 반드시 소속을 밝혀야 한다.","o":["두 테이블에 같은 컬럼명이 있으면 컬럼명 앞에 테이블명 또는 별칭을 붙여 구분해야 한다.","SELECT 절에서 STADIUM을 사용할 때 모호하면 테이블 별칭을 명시해야 한다.","동일한 이름의 컬럼이 여러 테이블에 존재해도 항상 컬럼명만 단독으로 사용할 수 있다.","조인 SQL에서는 컬럼 소속을 명확히 작성하는 것이 좋다."],"a":2},{"id":"54-20","r":54,"n":20,"
